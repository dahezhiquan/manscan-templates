id: salesforce-aura

info:
  name: Salesforce Lightning API 检测
  author: aaron_costello (@ConspiracyProof),Ph33rr
  severity: info
  description: |
    检测到 Salesforce Lightning API 检测。目标功能在未认证状态下可访问，可能暴露管理入口、业务数据、系统状态或可执行操作，需确认是否存在访问控制缺失。
  reference:
    - https://www.enumerated.de/index/salesforce
    - https://github.com/Ph33rr/cirrusgo (test endpoint)
  classification:
    cvss-metrics: CVSS:3.0/AV:N/AC:L/PR:N/UI:N/S:U/C:N/I:N/A:N
    cvss-score: 0
    cwe-id: CWE-200
  metadata:
    max-request: 5
  tags: aura,unauth,salesforce,exposure,misconfig,vuln

http:
  - method: POST
    path:
      - "{{BaseURL}}/aura"
      - "{{BaseURL}}/s/sfsites/aura"
      - "{{BaseURL}}/sfsites/aura"
      - "{{BaseURL}}/s/aura"
      - "{{BaseURL}}/s/fact"

    body: "{}"
    matchers:
      - type: word
        part: body
        words:
          - 'aura:invalidSession'
