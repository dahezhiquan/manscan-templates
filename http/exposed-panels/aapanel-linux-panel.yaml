id: aapanel-linux-panel

info:
  name: aaPanel Linux 面板识别（指纹识别）
  author: Th3l0newolf
  severity: info
  description: |-
    检测到目标站点存在 aaPanel Linux 相关响应特征。aaPanel 是面向 Linux 服务器的网站、数据库和运行环境管理面板，用于通过 Web 界面维护主机服务与站点配置。模板请求 `/`、`/login` 路径，并通过页面标题或正文关键字、状态码、DSL 条件确认该系统指纹，用于资产识别、系统盘点和暴露面梳理。
  classification:
    cvss-metrics: CVSS:3.0/AV:N/AC:L/PR:N/UI:N/S:U/C:N/I:N/A:N
    cwe-id: CWE-200
  metadata:
    max-request: 2
    verified: true
    vendor: aapanel
    product: aapanel
    shodan-query: html:"aaPanel Linux panel"
    fofa-query: title="aaPanel Linux panel"
  tags: panel,aapanel,linux,detect
http:
  - method: GET
    path:
      - "{{BaseURL}}/"
      - "{{BaseURL}}/login"

    stop-at-first-match: true

    matchers:
      - type: dsl
        dsl:
          - 'status_code == 200'
          - 'contains_any(body, "<title>aaPanel Linux panel", "Login with aaPanel Mobile", "aaPanel Linux panel")'
        condition: and
