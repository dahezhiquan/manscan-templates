id: nextcloudpi-panel

info:
  name: NextcloudPi Login 面板（暴露面识别）
  author: ritikchaddha
  severity: info
  description: |
    该模板通过识别 NextcloudPi Login 登录入口的页面标题、特征文本或重定向行为，判断目标是否暴露了对应的认证界面。若命中，说明该登录面板对外可访问，可用于暴露面梳理与后续安全评估。
  reference:
    - https://github.com/nextcloud/nextcloudpi
  metadata:
    verified: true
    max-request: 1
    vendor: nextcloud
    product: nextcloudpi
    shodan-query: title:"NextcloudPi"
    fofa-query: title="NextcloudPi"
  tags: nextcloud,nextcloudpi,login,panel,discovery

http:
  - method: GET
    path:
      - "{{BaseURL}}/index.php/login"

    matchers:
      - type: dsl
        dsl:
          - "contains_any(body, 'NextcloudPi', 'https://nextcloudpi.com')"
          - "status_code==200"
        condition: and
