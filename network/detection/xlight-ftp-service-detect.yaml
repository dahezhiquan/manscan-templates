id: xlight-ftp-service-detect

info:
  name: Xlight FTP 服务识别（指纹识别）
  author: pussycat0x
  severity: info
  description: |
    Xlight FTP Server 是 Windows 平台 FTP/SFTP 服务端软件，用于文件传输和账户管理。该模板连接 21/TCP 并读取协议响应，通过匹配 `Xlight FTP Server` 等响应特征识别目标服务。
  metadata:
    verified: true
    max-request: 1
    shodan-query: product:"Xlight ftpd"
  tags: network,ftp,xlight,detect,tcp,discovery
tcp:

  - inputs:
      - data: "\n"
    host:
      - "{{Hostname}}"
    port: 21

    matchers:
      - type: word
        part: body
        words:
          - "Xlight FTP Server"

    extractors:
      - type: regex
        regex:
          - "Xlight FTP Server ([0-9.]+)"
