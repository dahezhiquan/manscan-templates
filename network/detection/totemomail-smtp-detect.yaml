id: totemomail-smtp-detect

info:
  name: Totemomail SMTP 服务识别（指纹识别）
  author: princechaddha,userdehghani
  severity: info
  description: |
    Totemo Mail 是安全邮件网关或邮件加密产品，其 SMTP 服务用于邮件接收和传输处理。该模板连接 25,465,587/TCP 并读取协议响应，通过匹配 `totemomail` 等响应特征识别目标服务。
  metadata:
    max-request: 1
  tags: mail,smtp,network,totemomail,detect,tcp,discovery

tcp:
  - inputs:
      - data: "\r\n"
    read-size: 2048

    host:
      - "{{Hostname}}"
    port: 25,465,587

    matchers:
      - type: word
        words:
          - "totemomail"
