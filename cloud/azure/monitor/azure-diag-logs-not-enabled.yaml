id: azure-diag-logs-not-enabled
info:
  name: Azure 资源诊断日志未配置（云安全）
  author: princechaddha
  severity: medium
  description: Azure 资源诊断设置用于收集资源日志、平台指标和审计事件；未配置时，资源级运行活动和异常行为缺少集中记录。本模板枚举 Azure 资源并执行 az monitor diagnostic-settings list，在返回空数组时报告该资源未配置诊断设置。
  impact: |
    - 资源异常、权限滥用和配置变更可能无法及时发现，延长攻击者在环境中的驻留时间。
    - 缺少审计证据会削弱事件调查、根因分析和合规取证能力，导致安全事件影响范围难以确认。
  remediation: |
    - 为需要审计的资源创建诊断设置，按资源类型启用必要日志类别和平台指标。
    - 将日志发送到 Log Analytics、事件中心或受控存储账户，并设置保留期、访问权限和告警规则。
  reference:
    - https://docs.microsoft.com/en-us/azure/azure-monitor/logs/diagnostic-logs-overview
  metadata:
    vendor: microsoft
    product: azure-monitor
  tags: cloud,devops,azure,microsoft,diagnostic-logs,azure-cloud-config

flow: |
  code(1);
  for (let ResourceId of iterate(template.resourceIds)) {
    set("resource", ResourceId)
    code(2)
  }

self-contained: true
code:
  - engine:
      - sh
      - bash
    source: |
      az resource list --output json --query '[*].id'

    extractors:
      - type: json
        name: resourceIds
        internal: true
        json:
          - '.[]'

  - engine:
      - sh
      - bash
    source: |
      az monitor diagnostic-settings list --resource $resource --query 'value'

    matchers:
      - type: word
        words:
          - '[]'

    extractors:
      - type: dsl
        dsl:
          - 'resource + " does not have Diagnostic Logs enabled"'
