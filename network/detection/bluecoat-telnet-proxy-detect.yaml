id: bluecoat-telnet-proxy-detect

info:
  name: Blue Coat Telnet 代理 识别（指纹识别）
  author: righettod
  severity: info
  description: |
    Blue Coat Telnet Proxy 是 Blue Coat/Symantec 网关设备上的 Telnet 代理能力，用于代理和控制 Telnet 访问。该模板连接 23/TCP 并读取协议响应，通过匹配 `Blue Coat telnet proxy` 等响应特征识别目标服务。
  reference:
    - https://en.wikipedia.org/wiki/Blue_Coat_Systems
    - https://techdocs.broadcom.com/us/en/symantec-security-software/web-and-network-security/edge-swg/7-3/about-ssl-proxy.html
    - https://techdocs.broadcom.com/us/en/symantec-security-software/web-and-network-security/edge-swg/7-3.html
  metadata:
    verified: true
    max-request: 1
  tags: network,telnet,bluecoat,proxy,detect,tcp,discovery
tcp:
  - inputs:
      - data: "\r\n"
        read: 1024

    host:
      - "{{Hostname}}"
    port: 23
    read-size: 4096

    matchers:
      - type: word
        part: data
        words:
          - "Blue Coat telnet proxy"
