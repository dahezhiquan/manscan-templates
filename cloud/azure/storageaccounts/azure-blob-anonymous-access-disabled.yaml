id: azure-blob-anonymous-access-disabled
info:
  name: Azure Blob 匿名公共访问已启用（云安全）
  author: princechaddha
  severity: medium
  description: Azure Storage 账户允许 Blob 公共访问时，容器或 Blob 可能被配置为无需 Azure 身份认证即可读取，敏感文件和备份数据存在意外公开风险。本模板枚举存储账户并查询 allowBlobPublicAccess，在返回值为 true 时报告账户未禁止匿名 Blob 访问。
  impact: |
    - 攻击者无需有效账户即可读取公开容器中的业务文件、日志、备份或静态资源。
    - 泄露的数据可能包含个人信息、密钥材料和内部配置，并可被用于进一步攻击云内资源。
  remediation: |
    - 将存储账户的 allowBlobPublicAccess 设置为 false，并逐个复核现有容器的公共访问级别。
    - 对确需公开发布的内容使用专用账户或明确的发布流程，禁止在含敏感数据的账户中混用公共容器。
  reference:
    - https://docs.microsoft.com/en-us/azure/storage/blobs/anonymous-read-access-prevent
  metadata:
    vendor: microsoft
    product: azure-storage
  tags: cloud,devops,azure,microsoft,azure-storage,azure-cloud-config

flow: |
  code(1);
  for (let StorageAccount of iterate(template.storageAccountIds)) {
    set("ids", StorageAccount);
    code(2);
  }

self-contained: true
code:
  - engine:
      - sh
      - bash
    source: |
      az storage account list --query '[*].id'

    extractors:
      - type: json
        name: storageAccountIds
        internal: true
        json:
          - '.[]'

  - engine:
      - sh
      - bash
    source: |
      az storage account show --ids "$ids" --query allowBlobPublicAccess

    matchers-condition: and
    matchers:
      - type: word
        words:
          - 'true'

    extractors:
      - type: dsl
        dsl:
          - 'ids + " is not disabling anonymous blob access"'
