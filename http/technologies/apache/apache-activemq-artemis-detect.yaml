id: apache-activemq-artemis-detect

info:
  name: Apache ActiveMQ Artemis 指纹识别（指纹识别）
  author: icarot
  severity: info
  description: |-
    Apache ActiveMQ Artemis 是消息中间件，用于异步消息、队列、主题和企业应用集成。该模板请求 `/console/hawtconfig.json`，并依据页面标题、正文关键字或品牌资源特征识别目标是否使用或暴露了 Apache ActiveMQ Artemis 相关组件，适用于资产盘点、技术栈识别和后续安全评估；命中结果仅表示指纹特征匹配，不代表已确认存在可利用漏洞。
  reference:
  - https://github.com/apache/activemq-artemis/
  metadata:
    max-request: 1
    vendor: apache
    product: activemq
    shodan-query: title:"ActiveMQ Artemis Console"
  tags: tech,activemq,artemis,apache,detect,discovery

http:
  - method: GET
    path:
      - "{{BaseURL}}/console/hawtconfig.json"

    matchers-condition: and
    matchers:
      - type: word
        words:
          - 'img/activemq.png'
          - 'ActiveMQ Artemis'
          - 'Apache Artemis'
        condition: or

    extractors:
      - type: regex
        part: body
        name: version
        group: 1
        regex:
          - '"productInfo":.*"value":\s*"(.*)"'
