id: ups-status

info:
  name: APC UPS Multimon 状态页暴露
  author: dhiyaneshDK
  severity: low
  description: |-
    该模板用于核查 APC UPS Multimon 状态页暴露。目标公开了配置、日志、源码、数据库文件或示例信息页面，可能泄露本应仅限服务器内部访问的数据。模板访问 /cgi-bin/apcupsd/multimon.cgi、/cgi-bin/multimon.cgi，并根据文件特征、配置字段、日志内容、源码目录或响应状态确认泄露。
  reference:
    - http://www.apcupsd.org/
    - https://www.exploit-db.com/ghdb/752
  classification:
    cvss-metrics: CVSS:3.1/AV:N/AC:L/PR:N/UI:N/S:U/C:N/I:N/A:N
    cvss-score: 0
    cwe-id: CWE-200
  metadata:
    max-request: 2
  tags: logs,status,edb,misconfig,vuln
  impact: |-
    - 攻击者可获取密钥、令牌、数据库连接信息、源码结构、内部路径、历史日志或业务配置。
    - 泄露内容可能被用于凭据复用、供应链漏洞匹配、权限提升或进一步攻击。
  remediation: |-
    - 将配置、日志、源码仓库和数据库文件移出 Web 可访问目录。
    - 在 Web 服务器和对象存储层添加拒绝规则，阻断敏感扩展名和内部目录访问。
    - 轮换可能泄露的密钥、令牌和账号凭据，并排查访问日志。
http:
  - method: GET
    path:
      - "{{BaseURL}}/cgi-bin/apcupsd/multimon.cgi"
      - "{{BaseURL}}/cgi-bin/multimon.cgi"

    matchers-condition: and
    matchers:
      - type: word
        words:
          - "Multimon: UPS Status Page"

      - type: status
        status:
          - 200
