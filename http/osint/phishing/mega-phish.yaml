id: mega-phish

info:
  name: MEGA 仿冒钓鱼网站（钓鱼网站识别）
  author: rxerium
  severity: info
  description: |
    检测到疑似仿冒 MEGA 的钓鱼网站。模板在目标页面返回 200、页面内容命中 MEGA 的官方服务页面特征，且当前主机不属于 mega.io 官方域名时触发，用于识别借用 MEGA 品牌页面诱导用户信任的仿冒站点。
  reference:
    - https://mega.io
  metadata:
    max-request: 1
  tags: phishing,mega,osint,discovery
http:
  - method: GET
    path:
      - "{{BaseURL}}"

    host-redirects: true
    max-redirects: 2

    matchers-condition: and
    matchers:
      - type: word
        words:
          - 'Home - MEGA'
          - 'Secure and private cloud storage for everyone. Store and share files, chat, meet, back up, sync, and more.'
        condition: and

      - type: status
        status:
          - 200

      - type: dsl
        dsl:
          - '!contains(host,"mega.io")'
