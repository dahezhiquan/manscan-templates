id: codian-mcu-login

info:
  name: Codian MCU 登录面板（IOT）
  author: dhiyaneshDK
  severity: medium
  description: |
    检测到 Codian MCU 登录面板。该面板用于视频会议多点控制单元管理，暴露后可能泄露会议基础设施入口并引发未授权访问尝试。
  impact: |
    - 攻击者无需认证即可访问设备页面或功能，可能读取状态、配置和网络信息。
    - 若接口允许写操作，可能进一步导致设备配置被篡改或服务被滥用。
  remediation: |
    - 启用设备 Web 管理认证并修改默认口令，关闭匿名访问。
    - 升级固件并检查是否存在已知未授权访问漏洞。
    - 将管理页面限制在内网、管理 VLAN 或 VPN 内，并开启访问审计。
  reference:
    - https://www.exploit-db.com/ghdb/7404
  classification:
    cvss-metrics: CVSS:3.1/AV:N/AC:L/PR:N/UI:N/S:U/C:N/I:N/A:N
    cvss-score: 0
    cwe-id: CWE-200
  metadata:
    max-request: 1
    shodan-query: http.title:"Codian MCU - Home page"
  tags: iot,edb,discovery

http:
  - method: GET
    path:
      - '{{BaseURL}}/login.html'

    matchers-condition: and
    matchers:
      - type: word
        words:
          - '<title>Codian MCU - login:</title>'

      - type: status
        status:
          - 200
