id: microfocus-lifecycle-panel

info:
  name: Micro Focus Application Lifecycle Management 面板（暴露面识别）
  author: righettod
  severity: info
  description: |
    该模板通过识别 Micro Focus Application Lifecycle Management 登录入口的页面标题、特征文本或重定向行为，判断目标是否暴露了对应的认证界面。若命中，说明该登录面板对外可访问，可用于暴露面梳理与后续安全评估。
  reference:
    - https://www.opentext.com/products/alm-quality-center
  metadata:
    verified: true
    max-request: 1
    shodan-query: http.html:"Micro Focus Application Lifecycle Management"
  tags: panel,microfocus,login,detect,discovery

http:
  - method: GET
    path:
      - "{{BaseURL}}/qcbin/"

    redirects: true
    max-redirects: 2

    matchers:
      - type: dsl
        dsl:
          - 'status_code == 200'
          - 'contains_any(to_lower(body), "micro focus application lifecycle management", "<div class=\"alm_name\">application lifecycle", "<p class=\"alm_header\">application lifecycle")'
        condition: and

    extractors:
      - type: regex
        part: body
        group: 1
        regex:
          - '(?i)Micro\s+Focus\s+Application\s+Lifecycle\s+Management\s+([0-9.]+)'
