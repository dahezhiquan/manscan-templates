id: blockchain-rpc-debug-exposure

info:
  name: Blockchain RPC 调试 Trace Methods 暴露
  author: 0xBassia
  severity: medium
  description: |
    检测到 Blockchain RPC 调试 Trace Methods 暴露。目标暴露了调试、错误或堆栈信息，可能泄露应用路径、框架版本、环境变量、源码位置或内部调用细节。
  impact: |
    - 攻击者可能利用暴露信息进行资产测绘、权限探测或后续攻击。
    - 若目标接口缺少访问控制，可能进一步造成敏感数据泄露或系统被滥用。
  remediation: |
    - 限制该端点的公网访问，仅允许可信来源访问。
    - 启用认证、授权和审计，并根据业务需要关闭不必要的调试或管理功能。
  reference:
    - https://geth.ethereum.org/docs/developers/dapp-developer/native
    - https://github.com/ledgerwatch/erigon
  classification:
    cvss-metrics: CVSS:3.1/AV:N/AC:L/PR:N/UI:N/S:U/C:L/I:N/A:L
    cvss-score: 6.5
    cwe-id: CWE-200
  metadata:
    verified: true
    max-request: 1
    shodan-query: "jsonrpc"
  tags: misconfig,blockchain,rpc,debug,trace,web3

http:
  - raw:
      - |
        POST / HTTP/1.1
        Host: {{Hostname}}
        Content-Type: application/json

        {"jsonrpc":"2.0","method":"debug_traceTransaction","params":[],"id":1}

    matchers-condition: and
    matchers:
      - type: word
        part: body
        words:
          - '"jsonrpc"'
          - '"error"'
          - "missing value for required argument"
        condition: and

      - type: word
        part: body
        words:
          - "does not exist"
          - "not available"
          - "not found"
          - "not supported"
        negative: true

      - type: status
        status:
          - 200
