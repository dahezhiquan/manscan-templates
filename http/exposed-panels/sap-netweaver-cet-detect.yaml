id: sap-netweaver-cet-detect

info:
  name: SAP NetWeaver Composition Environment Tools 识别（指纹识别）
  author: ap3r
  severity: info
  description: |
    该模板用于识别 SAP NetWeaver Composition Environment Tools 相关页面或服务入口是否对外暴露。若命中，说明目标可被识别为对应产品或组件，可用于资产发现与攻击面管理。
  reference:
    - https://help.sap.com/doc/saphelp_scm700_ehp02/7.0.2/en-US/f6/2a7cb018bc4b239ea5b7af675a18ef/content.htm?no_cache=true
  metadata:
    max-request: 1
    shodan-query: http.favicon.hash:-266008933
  tags: sap,netweaver,cet,detect,discovery

http:
  - method: GET
    path:
      - "{{BaseURL}}/rep/start/index.jsp"

    matchers-condition: and
    matchers:
      - type: word
        part: body
        words:
          - "Composition Environment Tools"

      - type: word
        part: header
        words:
          - "text/html"

      - type: status
        status:
          - 200
