id: encryption-intransit-disabled

info:
  name: 阿里云 RDS 传输加密未启用（云安全）
  author: DhiyaneshDK
  severity: high
  description: RDS 实例未启用 SSL/TLS 传输加密时，客户端到数据库之间的连接数据可能以明文或弱保护方式传输。模板枚举 RDS 实例后调用 DescribeDBInstanceSSL，当 SSLEnabled 为 No 时判定该实例未启用传输加密。
  impact: |
    - 数据库账号、查询内容和业务数据在不可信网络路径上可能被窃听或篡改。
    - 对包含敏感数据的数据库实例，未启用 TLS 会影响传输加密合规要求。
  remediation: |
    - 在 RDS 控制台为目标实例启用 SSL，并更新客户端连接配置以校验证书和使用加密连接。
    - 变更前评估客户端兼容性和连接串配置，启用后监控连接失败和性能变化。
  reference:
    - https://www.alibabacloud.com/help/en/rds/apsaradb-rds-for-mysql/configure-ssl-encryption-for-an-apsaradb-rds-for-mysql-instance
    - https://www.trendmicro.com/cloudoneconformity/knowledge-base/alibaba-cloud/AlibabaCloud-RDS/enable-encryption-in-transit.html
  metadata:
    max-request: 1
    verified: true
    vendor: alibaba
    product: rds
  tags: cloud,devops,aliyun,alibaba,alibaba-cloud-config,alibaba-rds

variables:
  region: "cn-hangzhou"

flow: |
  code(1)
  for(let DBInstanceId of iterate(template.dbinstanceid)){
    set("instance", DBInstanceId)
    code(2)
  }


self-contained: true

code:
  - engine:
      - sh
      - bash
    source: |
      aliyun rds DescribeDBInstances --region $region

    extractors:
      - type: json
        name: dbinstanceid
        internal: true
        json:
          - '.Items.DBInstance[].DBInstanceId'

  - engine:
      - sh
      - bash

    source: |
      aliyun rds DescribeDBInstanceSSL --DBInstanceId $dbinstanceid --region $region

    matchers:
      - type: word
        words:
          - '"SSLEnabled": "No"'

    extractors:
      - type: dsl
        dsl:
          - 'instance + " RDS Encryption in Transit is Disabled "'
