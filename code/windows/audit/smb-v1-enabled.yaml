id: smb-v1-enabled

info:
  name: SMBv1 协议已启用（本地基线扫描）
  author: princechaddha
  severity: critical
  description: |
    该模板检查 SMBv1 是否启用。SMBv1 已废弃且存在大量已知攻击面。
  impact: |
    系统可能暴露于 EternalBlue/WannaCry 类攻击和协议降级风险。
  remediation: |
    禁用 SMBv1，使用 SMBv2/v3，并移除依赖旧协议的系统。
  tags: windows,smb,network,protocol,code,windows-audit

self-contained: true

code:
  - pre-condition: |
      IsWindows();
    engine:
      - powershell
      - powershell.exe
    args:
      - -ExecutionPolicy
      - Bypass
    pattern: "*.ps1"
    source: |
      (Get-SmbServerConfiguration).EnableSMB1Protocol

    matchers:
      - type: word
        words:
          - "True"
