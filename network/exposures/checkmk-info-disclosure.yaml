id: checkmk-info-disclosure

info:
  name: Checkmk Agent 信息泄露（服务漏洞）
  author: ivaldivieso,s4e-io
  severity: medium
  description: |
    Checkmk Agent 用于向 Checkmk 监控平台暴露主机状态、服务检查、性能指标和环境信息。若 TCP 6556 对不可信来源开放，攻击者可无认证读取主机监控数据；该模板发送换行触发 Agent 输出，并通过 <<<check_mk>>>、AgentOS 或 Version 字段确认信息泄露。
  impact: |
    - 泄露主机操作系统、Agent 版本、服务状态和部分环境指标，帮助攻击者绘制基础设施资产图谱。
    - 暴露的监控数据可用于识别高价值主机、服务异常、内部命名规则和后续攻击入口。
  remediation: |
    - 仅允许 Checkmk 服务器或可信监控网段访问 TCP 6556，禁止公网或不可信网段直连 Agent。
    - 使用防火墙、TLS/加密代理或 Agent 访问控制保护监控数据，并定期审计暴露的监控端口。
  reference:
    - https://medium.com/@Th3hound/the-hidden-danger-of-the-exposed-checkmk-agent-mapping-your-infrastructure-for-attackers-151cc2180e73
  metadata:
    verified: true
    shodan-query: product:"check_mk"
  tags: tcp,network,checkmk,unauth,discovery

tcp:
  - inputs:
      - data: "\n"

    host:
      - "{{Hostname}}"
    port: 6556
    read-size: 1024

    matchers-condition: and
    matchers:
      - type: word
        words:
          - "<<<check_mk>>>"

      - type: word
        words:
          - "AgentOS:"
          - "Version:"
        condition: or

      - type: word
        words:
          - "HTTP/1.1"
        negative: true
