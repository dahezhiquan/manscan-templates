id: workspace-one-uem-ssp

info:
  name: VMware Workspace ONE UEM Airwatch Self-Service Portal 登录面板识别（指纹识别）
  author: KoratSec
  severity: info
  description: |-
    VMware Workspace ONE UEM Airwatch Self-Service Portal 是 Workspace ONE UEM 自助服务门户，用于用户设备注册、状态查看和自助操作。该模板请求 `/MyDevice/Login`，并依据页面标题、正文关键字或品牌资源特征识别目标是否部署了该系统或暴露了对应入口，适用于资产指纹确认；命中结果仅表示系统特征匹配，不代表已确认存在未授权访问或可利用漏洞。
  reference:
  - https://docs.vmware.com/en/VMware-Workspace-ONE-UEM/2209/UEM_ConsoleBasics/GUID-AWT-SELFSERVICEPORTALOVERVIEW.html
  classification:
    cvss-metrics: CVSS:3.0/AV:N/AC:L/PR:N/UI:N/S:U/C:N/I:N/A:N
    cwe-id: CWE-200
    cpe: cpe:2.3:a:vmware:workspace_one_uem:*:*:*:*:*:*:*:*
  metadata:
    verified: true
    max-request: 1
    vendor: vmware
    product: workspace_one_uem
    shodan-query:
    - http.favicon.hash:"321909464"
    - http.html:"Self-Service Portal"
    fofa-query: body="ssp loginscreen"
  tags: panel,workspaceone,vmware,airwatch,ssp,login,detect,discovery

http:
  - method: GET
    path:
      - "{{BaseURL}}/MyDevice/Login"

    matchers:
      - type: word
        part: body
        words:
          - "Self-Service Portal"
          - "AirWatch"
        condition: and
        case-insensitive: true
