id: xss-uri-reflected

info:
  name: 反射型跨站脚本
  author: nadino,geeknik,matejsmycka
  severity: low
  description: |
    该模板用于检测 反射型跨站脚本。该类漏洞通常源于页面未对用户输入进行正确过滤或输出编码，导致脚本内容被浏览器执行。模板主要向 `/a%22%3E%3Cinjectable%3E`、`/a%27%3E%3Cinjectable%3E` 等路径发送探测请求，并根据响应中的 `"><injectable>`、`'><injectable>` 等特征确认漏洞是否存在。
  impact: |
    - 攻击者可诱导用户访问构造链接或页面，在受害者浏览器中执行脚本。
    - 成功利用后可能窃取会话信息、执行越权操作、篡改页面内容，或作为钓鱼和横向攻击链的一环。
  remediation: |
    - 对所有反射或存储到页面的用户输入进行上下文相关输出编码。
    - 对富文本、URL、HTML 属性等高风险输入使用白名单过滤，并启用合适的 Content-Security-Policy。
    - 升级受影响组件，检查是否存在被植入的恶意脚本或异常后台操作。
  classification:
    cwe-id: CWE-79
  metadata:
    max-request: 1
  tags: xss,generic,vuln

http:
  - method: GET
    path:
      - "{{BaseURL}}/a%22%3E%3Cinjectable%3E"
      - "{{BaseURL}}/a%27%3E%3Cinjectable%3E"

    stop-at-first-match: true

    matchers-condition: and
    matchers:
      - type: word
        part: body
        words:
          - "\"><injectable>"
          - "'><injectable>"
        condition: or

      - type: word
        part: content_type
        words:
          - "text/html"

      - type: status
        status:
          - 200

      - type: word
        part: body
        condition: or
        words:
          - "<title>Access Denied</title>"
          - "You don't have permission to access"
        negative: true
