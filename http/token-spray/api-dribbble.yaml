id: api-dribbble

info:
  name: Dribbble API Token 可用性校验（token喷洒）
  author: daffainfo
  severity: info
  description: 该模板通过调用 Dribbble API 的已知接口验证提供的 token 是否有效，命中后通常表示可访问社交媒体或内容平台能力。
  reference:
    - https://developer.dribbble.com/v2/
    - https://github.com/daffainfo/all-about-apikey/tree/main/dribbble
  metadata:
    max-request: 1
  tags: token-spray,dribbble

self-contained: true

http:
  - method: GET
    path:
      - "https://api.dribbble.com/v2/user?access_token={{token}}"

    matchers:
      - type: status
        status:
          - 200
