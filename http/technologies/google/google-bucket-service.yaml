id: google-bucket-service

info:
  name: Google Cloud Storage Bucket 指纹识别（指纹识别）
  author: pdteam
  severity: info
  description: >-
    Google Cloud Storage Bucket 是 Google Cloud 对象存储容器，用于托管静态资源、备份和应用数据。该模板通过请求目标服务并检查预设路径或首页响应、DSL
    条件等指纹特征，判断目标是否使用或暴露了 Google Cloud Storage Bucket 相关组件；命中结果仅表示指纹特征匹配，可用于资产盘点、技术栈识别和后续安全评估，不代表已确认存在可利用漏洞。
  metadata:
    max-request: 1
  tags: google,tech,bucket,discovery
http:
  - method: GET
    path:
      - "{{BaseURL}}"

    matchers:
      - type: dsl
        dsl:
          - contains(tolower(header), 'x-goog-component-count')
          - contains(tolower(header), 'x-goog-expiration')
          - contains(tolower(header), 'x-goog-generation')
          - contains(tolower(header), 'x-goog-metageneration')
          - contains(tolower(header), 'x-goog-stored-content-encoding')
          - contains(tolower(header), 'x-goog-stored-content-length')
          - contains(tolower(header), 'x-guploader-uploadid')
        condition: or
