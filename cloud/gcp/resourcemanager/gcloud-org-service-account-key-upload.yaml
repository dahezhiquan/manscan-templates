id: gcloud-org-service-account-key-upload

info:
  name: Service Account Key Upload Not未启用（云安全）
  author: princechaddha
  severity: medium
  description: 服务账号密钥上传允许导入外部生成的密钥材料，组织未禁用时会削弱 Google Cloud 对密钥来源和生命周期的控制。本模板检查 iam.disableServiceAccountKeyUpload 组织策略 booleanPolicy，返回空对象 {} 时报告未禁用服务账号密钥上传。
  impact: |
    - 外部生成密钥可能来源不可信、保管不当或缺少轮换记录，泄露后可长期冒用服务账号。
    - 密钥材料不受统一生成流程约束，会增加审计、吊销和合规证明难度。
  remediation: |
    - 启用 iam.disableServiceAccountKeyUpload 组织策略，禁止上传外部服务账号密钥。
    - 对已有上传密钥进行清点和轮换，优先改用平台托管的短期凭据机制。
  reference:
    - https://www.trendmicro.com/cloudoneconformity/knowledge-base/gcp/ResourceManager/disable-service-account-key-upload.html
    - https://cloud.google.com/resource-manager/docs/organization-policy/org-policy-constraints
  metadata:
    vendor: google
    product: resource-manager
  tags: cloud,devops,gcp,gcloud,resourcemanager,security,iam,service-account,gcp-cloud-config

flow: |
  code(1)
  for(let orgId of iterate(template.orgIds)){
    set("orgId", orgId)
    code(2)
  }

self-contained: true

code:
  - engine:
      - sh
      - bash
    source: |
      gcloud organizations list --format="json(name)"

    extractors:
      - type: json
        name: orgIds
        internal: true
        json:
          - '.[].name'

  - engine:
      - sh
      - bash
    source: |
      gcloud alpha resource-manager org-policies describe iam.disableServiceAccountKeyUpload --organization=$orgId --effective --format="json(booleanPolicy)"

    matchers:
      - type: word
        words:
          - "{}"

    extractors:
      - type: dsl
        dsl:
          - '"Organization " + orgId + " has not disabled service account key upload, allowing users to upload unmanaged keys"'
