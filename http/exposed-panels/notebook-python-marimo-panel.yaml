id: notebook-python-marimo-panel

info:
  name: Marimo 面板识别（指纹识别）
  author: rxerium
  severity: info
  description: |-
    检测到目标站点存在 Marimo 相关响应特征。Marimo 是 AI、机器学习或 Notebook 相关平台，用于管理模型、数据集、工作区、实验、推理服务或训练任务。模板请求 `/`，并通过页面标题或正文关键字、状态码确认该系统指纹，用于资产识别、系统盘点和暴露面梳理。
  reference:
    - https://github.com/marimo-team/marimo
    - https://marimo.io
  metadata:
    verified: true
    max-request: 1
    vendor: marimo-team
    product: marimo
    shodan-query: 'http.title:"marimo"'
  tags: panel,marimo,notebook,python,detect,discovery
http:
  - method: GET
    path:
      - "{{BaseURL}}"

    host-redirects: true
    max-redirects: 2

    matchers-condition: and
    matchers:
      - type: word
        part: body
        words:
          - 'data-marimo="true"'
          - "marimo-version"
        condition: and

      - type: status
        status:
          - 200

    extractors:
      - type: regex
        name: detected_version
        part: body
        group: 1
        regex:
          - (?i)\bmarimo-version\s*=\s*["\x27]([0-9]+(?:[.][0-9]+)+(?:[-+._][0-9A-Za-z]+)*)["\x27]
          - (?i)<meta\b[^>]*name\s*=\s*["\x27]marimo-version["\x27][^>]*content\s*=\s*["\x27]([0-9]+(?:[.][0-9]+)+(?:[-+._][0-9A-Za-z]+)*)["\x27]
        internal: true
      - type: dsl
        dsl:
          - 'regex("^[0-9]+(?:[.][0-9]+)*(?:[-+._][0-9A-Za-z]+)*$", detected_version) ? detected_version : ""'
