id: ivanti-csa-panel

info:
  name: Ivanti(R) Cloud Services Appliance 面板（暴露面识别）
  author: rxerium
  severity: info
  description: |
    该模板通过识别 Ivanti(R) Cloud Services Appliance 面板、控制台或管理界面的页面特征，判断目标是否暴露了对应服务入口。若命中，说明该后台或运维界面对外可访问，可用于资产识别与暴露面排查。
  reference:
    - https://help.ivanti.com/ld/help/en_US/LDMS/10.0/Windows/csa-h-help.htm
  metadata:
    verified: true
    max-request: 1
    shodan-query: title:"Cloud Services Appliance"
  tags: ivanti,csa,panel,login,discovery

http:
  - method: GET
    path:
      - "{{BaseURL}}"

    matchers-condition: and
    matchers:
      - type: word
        part: body
        words:
          - "<title>Ivanti(R) Cloud Services Appliance</title>"

      - type: status
        status:
          - 200
