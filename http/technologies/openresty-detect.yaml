id: openresty-detect

info:
  name: OpenResty 指纹识别（指纹识别）
  author: jcockhren
  severity: info
  description: >-
    OpenResty 是基于 Nginx 和 LuaJIT 的 Web 平台，用于构建高性能网关、API 和动态 Web 服务。该模板通过请求目标服务并检查预设路径或首页响应、页面正文关键字、HTTP
    响应头、正则特征等指纹特征，判断目标是否使用或暴露了 OpenResty 相关组件；命中结果仅表示指纹特征匹配，可用于资产盘点、技术栈识别和后续安全评估，不代表已确认存在可利用漏洞。
  metadata:
    max-request: 1
    shodan-query: product:"OpenResty"
  tags: tech,openresty,discovery
http:
  - method: GET
    path:
      - "{{BaseURL}}"

    matchers:
      - type: word
        part: server
        words:
          - "openresty"

    extractors:
      - type: regex
        part: header
        regex:
          - 'openresty/[0-9.]+'
