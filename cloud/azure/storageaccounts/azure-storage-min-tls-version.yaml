id: azure-storage-min-tls-version
info:
  name: Azure Storage Minimum TLS Version 未Set to TLS1_2（云安全）
  author: princechaddha
  severity: medium
  description: Azure Storage 账户的 minimumTlsVersion 用于限制数据平面请求可协商的最低 TLS 版本；低于 TLS 1.2 时，客户端可能继续使用较弱的协议，降低传输数据的机密性与完整性保护。本模板枚举存储账户并查询 minimumTlsVersion，在输出包含 TLS 但不包含 TLS1_2 时报告该账户未达到 TLS 1.2 基线。
  impact: |
    - 在不可信网络中，较旧 TLS 协议的已知弱点或降级协商可能扩大流量窃听、篡改和会话攻击的机会。
    - 访问令牌、SAS 和业务数据在传输过程中的保护强度下降，可能导致数据泄露或不满足安全合规基线。
  remediation: |
    - 将存储账户的 minimumTlsVersion 设置为 TLS1_2，并确认区域、账户类型和相关客户端均支持该版本。
    - 排查仍使用旧 TLS 的应用、SDK 和设备，完成升级或迁移后再收紧协议，避免通过兼容性例外长期保留弱协议。
  reference:
    - https://docs.microsoft.com/en-us/azure/storage/common/storage-security-guide
  metadata:
    vendor: microsoft
    product: azure-storage
  tags: cloud,devops,azure,microsoft,storage,azure-cloud-config

flow: |
  code(1);
  for (let AccountData of iterate(template.accountList)) {
    AccountData = JSON.parse(AccountData);
    set("name", AccountData.Name);
    code(2);
  }

self-contained: true
code:
  - engine:
      - sh
      - bash
    source: |
      az storage account list --query '[*].{"Name":name}'

    extractors:
      - type: json
        name: accountList
        internal: true
        json:
          - '.[]'

  - engine:
      - sh
      - bash
    source: |
      az storage account show --name "$name" --query 'minimumTlsVersion'

    matchers-condition: and
    matchers:
      - type: word
        words:
          - 'TLS'

      - type: word
        words:
          - 'TLS1_2'
        negative: true

    extractors:
      - type: dsl
        dsl:
          - 'name + " is not using TLS version 1.2"'
