id: storage-nextcloud-detect

info:
  name: Nextcloud 指纹识别（指纹识别）
  author: skeltavik
  severity: info
  description: >-
    Nextcloud 是自托管文件同步与协作平台，用于文件共享、日历、通讯录和团队协作。该模板通过请求目标服务并检查预设路径或首页响应、页面正文关键字、状态码、正则特征等指纹特征，判断目标是否使用或暴露了
    Nextcloud 相关组件；命中结果仅表示指纹特征匹配，可用于资产盘点、技术栈识别和后续安全评估，不代表已确认存在可利用漏洞。
  reference:
  - https://nextcloud.com
  classification:
    cpe: cpe:2.3:a:nextcloud:nextcloud_server:*:*:*:*:*:*:*:*
  metadata:
    verified: true
    max-request: 4
    vendor: nextcloud
    product: nextcloud_server
    shodan-query: http.title:"Nextcloud"
  tags: tech,nextcloud,storage,discovery
http:
  - method: GET
    path:
      - '{{BaseURL}}'
      - '{{BaseURL}}/login'
      - '{{BaseURL}}/nextcloud/login'
      - '{{BaseURL}}/nextcloud/index.php/login'

    stop-at-first-match: true
    host-redirects: true
    max-redirects: 2

    matchers-condition: and
    matchers:
      - type: word
        part: body
        words:
          - 'var nc_lastLogin'
          - 'var nc_pageLoad'
        condition: and

      - type: status
        status:
          - 200

    extractors:
      - type: regex
        group: 1
        regex:
          - '(?m)"version":"([0-9.]+)",'
