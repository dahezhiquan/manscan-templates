id: sekolahku-cms-detect

info:
  name: Sekolahku CMS 指纹识别（指纹识别）
  author: nblirwn
  severity: info
  description: |
    用于识别目标是否使用 Sekolahku CMS，模板会结合页面正文和特定路径或已知端点匹配内容管理系统相关指纹。
  reference:
    - https://sekolahku.web.id/
  metadata:
    max-request: 1
    shodan-query: html:"sekolahku.web"
  tags: tech,sekolahku,cms,discovery

http:
  - method: GET
    path:
      - "{{BaseURL}}"

    matchers:
      - type: word
        part: body
        words:
          - 'sekolahku.web.id'
          - 'CMS Sekolahku'
        condition: or
