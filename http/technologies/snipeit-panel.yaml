id: snipeit-panel

info:
  name: Snipe-IT 面板指纹识别（指纹识别）
  author: pikpikcu
  severity: info
  description: 用于识别目标暴露的 Snipe-IT 面板，模板会结合 favicon 哈希、页面正文、状态码和特定路径或已知端点判断是否存在对应技术或默认页面特征。
  classification:
    cvss-metrics: CVSS:3.0/AV:N/AC:L/PR:N/UI:N/S:U/C:N/I:N/A:N
    cvss-score: 0
    cwe-id: CWE-200
    cpe: cpe:2.3:a:snipeitapp:snipe-it:*:*:*:*:*:*:*:*
  metadata:
    max-request: 1
    shodan-query: http.favicon.hash:431627549
    product: snipe-it
    vendor: snipeitapp
  tags: panel,snipeit,tech,discovery

http:
  - method: GET
    path:
      - "{{BaseURL}}/login"

    matchers-condition: and
    matchers:
      - type: word
        part: body
        words:
          - "window.snipeit"

      - type: status
        status:
          - 200
