id: ssh-weak-mac-algo

info:
  name: SSH 弱 MAC 算法启用（服务漏洞）
  author: pussycat0x
  severity: low
  description: |
    目标 SSH 服务启用了 MD5 或 96-bit 等弱 MAC 算法，可能降低会话完整性校验强度。模板枚举服务端 MAC 算法列表，并在发现弱 MAC 时确认配置问题。
  impact: |
    - 弱 MAC 算法会降低 SSH 会话完整性校验强度，不符合现代安全基线。
    - 在中间人或降级场景下，弱 MAC 会增加会话被篡改或分析的风险。
  remediation: |
    - 禁用 MD5、96-bit MAC 和其他弱 MAC 算法。
    - 配置现代 MAC 算法，更新旧客户端并重启 SSH 服务使配置生效。
  reference:
    - https://www.tenable.com/plugins/nessus/71049
  metadata:
    verified: true
    max-request: 2
    shodan-query: product:"OpenSSH"
  tags: js,enum,ssh,misconfig,network,vuln

javascript:
  - pre-condition: |
      isPortOpen(Host,Port);
    code: |
      let m = require("nuclei/ssh");
      let c = m.SSHClient();
      let response = c.ConnectSSHInfoMode(Host, Port);
      Export(response);
    args:
      Host: "{{Host}}"
      Port: "22"

    matchers-condition: and
    matchers:
      - type: word
        words:
          - "server_to_client_macs"
          - "client_to_server_macs"
        condition: and

      - type: word
        words:
          - "hmac-md5"
          - "hmac-md5-96"
          - "hmac-sha1-96"
          - "hmac-md5"
          - "hmac-md5-96"
          - "hmac-sha1-96"
        condition: or
