id: stack-policy-not-inuse

info:
  name: CloudFormation 栈策略未使用（云安全）
  author: DhiyaneshDK
  severity: medium
  description: CloudFormation 栈策略缺失是一类基础设施变更保护不足风险，关键资源在栈更新期间可能缺少显式拒绝规则。没有栈策略时，数据库、网络边界等资源更容易被误更新、替换或删除。模板枚举栈名称后调用 `get-stack-policy`，当响应中未出现 `StackPolicyBody` 和 `Effect` 时判定未使用栈策略。
  impact: |
    - 栈更新操作可能意外修改、替换或删除数据库、网络边界等关键资源。
    - 在多人协作或自动化部署场景中，缺少栈策略会降低对高价值资源的变更约束。
  remediation: |
    - 为包含关键资源的 CloudFormation 栈配置栈策略，明确拒绝不应被更新的资源操作。
    - 在执行受控变更时临时调整策略，并在变更完成后恢复保护规则。
  reference:
    - https://www.trendmicro.com/cloudoneconformity-staging/knowledge-base/aws/CloudFormation/cloudformation-stack-policy.html
    - http://docs.aws.amazon.com/AWSCloudFormation/latest/UserGuide/protect-stack-resources.html
  metadata:
    vendor: amazon
    product: cloudformation
  tags: cloud,devops,aws,amazon,cloudformation,aws-cloud-config

variables:
  region: "us-west-2"

flow: |
  code(1)
  for(let StackSummaries of iterate(template.stacksummaries)){
    set("stacksummary", StackSummaries)
    code(2)
  }

self-contained: true

code:
  - engine:
      - sh
      - bash
    source: |
      aws cloudformation list-stacks --region $region --output json --query 'StackSummaries[*].StackName'

    extractors:
      - type: json
        name: stacksummaries
        internal: true
        json:
          - '.[]'

  - engine:
      - sh
      - bash
    source: |
        aws cloudformation get-stack-policy --region $region --stack-name $stacksummary --output json

    matchers:
      - type: word
        words:
          - 'StackPolicyBody'
          - 'Effect'
        negative: true

    extractors:
      - type: dsl
        dsl:
          - 'stacksummary + " No Stack Policy In Use"'
