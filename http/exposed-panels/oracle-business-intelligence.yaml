id: oracle-business-intelligence

info:
  name: Oracle Business Intelligence 登录面板识别（指纹识别）
  author: DhiyaneshDk,righettod
  severity: info
  description: |-
    检测到目标站点存在 Oracle Business Intelligence 相关响应特征。Oracle Business Intelligence 是数据库、ERP 或数据服务的 Web 管理入口，用于查看数据、执行查询、管理业务对象、集群或连接配置。模板请求 `/saw.dll?bieehome&startPage=1`、`/analytics/saw.dll?bieehome&startPage=1`、`/analytics/saw.dll?Dashboard` 路径，并通过页面标题或正文关键字、状态码确认该系统指纹，用于资产识别、系统盘点和暴露面梳理。
  reference:
    - https://www.oracle.com/business-analytics/business-intelligence/technologies/bi.html
  classification:
    cvss-metrics: CVSS:3.0/AV:N/AC:L/PR:N/UI:N/S:U/C:N/I:N/A:N
    cwe-id: CWE-200
    cpe: cpe:2.3:a:oracle:business_intelligence:*:*:*:*:*:*:*:*
  metadata:
    verified: true
    max-request: 3
    vendor: oracle
    product: "business_intelligence"
    shodan-query:
      - "http.title:\"Oracle Business Intelligence Sign In\""
      - http.title:"oracle business intelligence sign in"
    fofa-query: title="oracle business intelligence sign in"
    google-query: intitle:"oracle business intelligence sign in"
  tags: panel,oracle,login,detect,discovery
http:
  - method: GET
    path:
      - "{{BaseURL}}/saw.dll?bieehome&startPage=1"
      - "{{BaseURL}}/analytics/saw.dll?bieehome&startPage=1"
      - "{{BaseURL}}/analytics/saw.dll?Dashboard"

    stop-at-first-match: true

    matchers-condition: and
    matchers:
      - type: word
        part: body
        words:
          - "<title>Oracle Business Intelligence Sign In</title>"
          - "<title>Oracle Business Intelligence</title>"
          - "Oracle BI Presentation Services"
          - "use Oracle BIEE"
        condition: or

      - type: status
        status:
          - 200
