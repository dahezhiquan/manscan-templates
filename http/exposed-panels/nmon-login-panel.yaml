id: nmon-login-panel

info:
  name: nMon 面板识别（指纹识别）
  author: Th3l0newolf
  severity: info
  description: |
    该模板通过识别 nMon 登录入口的页面标题、特征文本或重定向行为，判断目标是否暴露了对应的认证界面。若命中，说明该登录面板对外可访问，可用于暴露面梳理与后续安全评估。
  classification:
    cvss-metrics: CVSS:3.0/AV:N/AC:L/PR:N/UI:N/S:U/C:N/I:N/A:N
    cwe-id: CWE-200
  metadata:
    max-request: 1
    verified: true
    shodan-query: title:"nMon"
  tags: panel,login,nmon,detect

http:
  - method: GET
    path:
      - "{{BaseURL}}/?route=signin"

    matchers-condition: and
    matchers:
      - type: word
        part: body
        words:
          - "<title>nMon</title>"

      - type: status
        status:
          - 200
