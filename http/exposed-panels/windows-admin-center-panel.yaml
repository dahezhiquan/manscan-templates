id: windows-admin-center-panel

info:
  name: Windows Admin Center Panel - 识别（指纹识别）
  author: darses
  severity: info
  description: |
    该模板通过识别 Windows Admin Center 面板、控制台或管理界面的页面特征，判断目标是否暴露了对应服务入口。若命中，说明该后台或运维界面对外可访问，可用于资产识别与暴露面排查。
  reference:
    - https://github.com/microsoft/Windows-admin-center
  metadata:
    shodan-query:
      - http.favicon.hash:-765377534
      - title:"Windows Admin Center"
    fofa-query:
      - icon_hash="-765377534"
      - title="Windows Admin Center"
  tags: detect,windows,panel,discovery

http:
  - method: GET
    path:
      - "{{BaseURL}}"

    matchers-condition: and
    matchers:
      - type: status
        status:
          - 403

      - type: word
        part: body
        words:
          - "Windows Admin Center</title>"
