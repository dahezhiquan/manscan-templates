id: default-symfony-page

info:
  name: Symfony 默认页面 指纹识别（指纹识别）
  author: pussycat0x
  severity: info
  description: Symfony 默认页面 是 PHP Web 应用框架，用于构建企业 Web 应用、控制器和服务组件。该模板请求首页，并依据 HTTP 404 状态码、页面标题、正文关键字或品牌资源特征识别目标是否使用或暴露了 Symfony 默认页面 相关组件，适用于资产盘点、技术栈识别和后续安全评估；命中结果仅表示指纹特征匹配，不代表已确认存在可利用漏洞。
  classification:
    cpe: cpe:2.3:a:sensiolabs:symfony:*:*:*:*:*:*:*:*
  metadata:
    verified: true
    max-request: 1
    vendor: sensiolabs
    product: symfony
    shodan-query: http.title:"Welcome to Symfony"
  tags: tech,symfony,default-page,discovery

http:
  - method: GET
    path:
      - '{{BaseURL}}'

    matchers-condition: and
    matchers:
      - type: word
        part: body
        words:
          - 'Welcome to Symfony!'
          - 'Documentation'
        condition: and

      - type: status
        status:
          - 404

    extractors:
      - type: regex
        part: body
        group: 1
        regex:
          - "([0-9.]+)</span>"
