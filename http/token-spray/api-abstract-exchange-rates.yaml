id: api-abstract-exchange-rates

info:
  name: Abstract API Exchange Rates Token 可用性校验（token喷洒）
  author: daffainfo
  severity: info
  description: 该模板通过调用 Abstract Exchange Rates API 验证提供的 token 是否有效，命中后通常表示可访问实时或历史汇率数据能力。
  reference:
    - https://www.abstractapi.com/api/exchange-rate-api
    - https://github.com/daffainfo/all-about-apikey/tree/main/abstract-exchange-rates
  metadata:
    max-request: 1
  tags: token-spray,abstractapi

self-contained: true

http:
  - method: GET
    path:
      - "https://exchange-rates.abstractapi.com/v1/live/?api_key={{token}}&base=USD"

    matchers:
      - type: word
        part: body
        words:
          - '"base":'
          - '"last_updated":'
          - '"exchange_rate":'
        condition: and
