id: metatag-cms

info:
  name: Metatag CMS 指纹识别（指纹识别）
  author: dadevel
  severity: info
  description: >-
    Metatag CMS 是内容管理系统，用于维护站点页面、元数据和内容发布流程。该模板通过请求目标服务并检查预设路径或首页响应、HTTP 响应头、页面正文关键字、正则特征等指纹特征，判断目标是否使用或暴露了
    Metatag CMS 相关组件；命中结果仅表示指纹特征匹配，可用于资产盘点、技术栈识别和后续安全评估，不代表已确认存在可利用漏洞。
  reference:
  - https://www.w3schools.com/tags/att_meta_name.asp
  metadata:
    max-request: 1
  tags: tech,cms,discovery
http:
  - method: GET
    path:
      - "{{BaseURL}}"

    host-redirects: true
    max-redirects: 2

    matchers-condition: and
    matchers:
      - type: word
        part: header
        words:
          - 'text/html'

      - type: regex
        part: body
        regex:
          - '(?i)<meta\s+?name="?generator"?\s+?content="[^"]+?"'

    extractors:
      - type: regex
        part: body
        group: 1
        regex:
          - '(?i)<meta\s+?name="?generator"?\s+?content="([^"]+?)"'
