id: app-manager-default-login

info:
  name: ManageEngine Applications Manager 默认凭据（弱口令）
  author: 0midC13
  severity: high
  description: |
    该模板用于检测 ManageEngine Applications Manager 是否仍可使用默认管理凭据登录。模板先访问 `/index.do`，再向 `/j_security_check` 提交默认账号口令，并通过后续资源页面中的 `Super Administrator`、`Add Application` 等后台特征确认认证成功。
  impact: |
    - 攻击者可进入 Applications Manager 监控后台，查看应用、主机、数据库、中间件和告警配置等敏感运维信息。
    - 监控平台被接管后，可能泄露连接凭据、篡改监控与告警策略，或借助集成功能继续影响被监控资产。
  remediation: |
    - 立即修改默认管理员凭据，清理示例账号，并为高权限账号启用强密码和多因素认证。
    - 将管理后台限制在可信运维网络、VPN 或堡垒机后方，并开启登录与操作审计。
    - 复核近期用户、监控对象、凭据配置、告警动作和集成设置，轮换可能暴露的系统凭据。
  reference:
    - https://www.manageengine.com/products/applications_manager/
  metadata:
    shodan-query: title:"Applications Manager Login Screen"
    verified: true
    max-request: 3
  tags: default-login,manageengine,zoho,vuln

variables:
  username: "admin"
  password: "admin"

http:
  - raw:
      - |
        GET /index.do HTTP/1.1
        Host: {{Hostname}}

  - raw:
      - |
        POST /j_security_check HTTP/1.1
        Host: {{Hostname}}
        Origin: {{RootURL}}
        Content-Type: application/x-www-form-urlencoded
        Referer: {{RootURL}}/index.do

        clienttype=html&webstart=&j_username=admin&ScreenWidth=1280&ScreenHeight=709&username={{username}}&j_password={{password}}

  - raw:
      - |
        GET /showresource.do?group=All&method=showResourceTypes&monitor_viewtype=categoryview HTTP/1.1
        Host: {{Hostname}}
        Referer: {{RootURL}}/j_security_check

    matchers-condition: and
    matchers:
      - type: status
        status:
          - 200

      - type: word
        part: body
        words:
          - "Super Administrator"
          - "Add Application"
        condition: and

      - type: word
        part: body
        words:
          - "j_username"
          - "j_password"
          - "clienttype=html"
        condition: or
        negative: true
