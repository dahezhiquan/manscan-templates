id: flask-debug-toolbar

info:
  name: Flask 调试 Toolbar 暴露
  author: 0x_Akoko
  severity: medium
  description: |
    该模板用于核查 Flask 调试 Toolbar暴露状态。该类问题通常源于生产环境暴露调试页面、诊断端点、状态接口或详细错误信息。模板会向目标发送探测请求，并依据匹配 `flDebugToolbar`、`flDebugPanelList`、状态码 200 等证据确认目标是否存在该配置问题。
  impact: |
    - 攻击者可获取服务版本、运行状态、内部路径、模块列表、环境变量或错误栈信息。
    - 这些信息可辅助识别组件版本、构造后续攻击路径，或暴露内部系统结构与敏感配置线索。
  remediation: |
    - 关闭生产环境中的调试、状态、示例和诊断接口，避免向未授权用户返回内部细节。
    - 对确需保留的运维端点增加认证授权、来源限制和访问审计。
    - 检查历史访问日志和错误日志，确认敏感信息是否已被枚举或泄露。
  reference:
    - https://flask-debugtoolbar.readthedocs.io/
    - https://github.com/flask-debugtoolbar/flask-debugtoolbar
  classification:
    cvss-metrics: CVSS:3.1/AV:N/AC:L/PR:N/UI:N/S:U/C:L/I:N/A:N
    cvss-score: 5.3
    cwe-id: CWE-200
  metadata:
    verified: true
    max-request: 1
    shodan-query: http.html:"flDebugToolbar"
    fofa-query: body="flDebugToolbar"
  tags: flask,python,debug,toolbar,exposure,misconfig

http:
  - method: GET
    path:
      - "{{BaseURL}}"

    host-redirects: true
    max-redirects: 2

    matchers-condition: and
    matchers:
      - type: word
        part: body
        words:
          - "flDebugToolbar"
          - "flDebugPanelList"
        condition: or

      - type: word
        part: body
        words:
          - "/_debug_toolbar/"
          - "flDebugVersionPanel"
          - "DEBUG_TOOLBAR_STATIC_PATH"
        condition: or

      - type: status
        status:
          - 200
