id: amazon-mws-auth-token-value

info:
  name: Amazon MWS 认证令牌 泄露检测（本地文件安全扫描）
  author: gaurang
  severity: medium
  description: |
    该模板检测文件中暴露的 Amazon MWS Authentication Token。此类凭据一旦泄露，可能被用于访问对应云服务、代码仓库、SaaS 平台或业务接口。
  classification:
    cvss-metrics: CVSS:3.1/AV:N/AC:L/PR:N/UI:N/S:U/C:L/I:N/A:N
    cvss-score: 5.3
    cwe-id: CWE-200
  tags: file,keys,token,amazon,auth,mws

file:
  - extensions:
      - all

    extractors:
      - type: regex
        regex:
          - "amzn\\.mws\\.[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}"
