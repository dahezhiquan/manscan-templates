id: uni-gui-framework

info:
  name: UniGUI 框架指纹识别（指纹识别）
  author: serrapa
  severity: info
  description: |
    用于识别目标是否部署 UniGUI 框架 并提取相关版本或构建信息，模板会结合页面标题、页面正文、特定路径或已知端点和版本或标识提取结果进行指纹匹配。
  metadata:
    verified: true
    max-request: 1
    shodan-query: http.title:"UniGUI"
  tags: tech,unigui,discovery

http:
  - method: GET
    path:
      - "{{BaseURL}}"

    host-redirects: true
    max-redirects: 2

    matchers-condition: and
    matchers:
      - type: word
        part: body
        words:
          - "uni-xtheme-"
          - "ext-all.js"
          - "uniVars._extVer="
        condition: or

      - type: regex
        part: body
        regex:
          - 'uni-(\d+\.\d+\.\d+\.\d+)/'
          - 'uniVars._extVer="(\d+\.\d+\.\d+)"'

    extractors:
      - type: regex
        part: body
        name: uni_gui_version
        regex:
          - 'uni-(\d+\.\d+\.\d+\.\d+)'

      - type: regex
        part: body
        name: ext_js_version
        regex:
          - 'uniVars._extVer="(\d+\.\d+\.\d+)"'
