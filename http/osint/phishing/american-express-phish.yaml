id: american-express-phish

info:
  name: American Express 仿冒钓鱼网站（钓鱼网站识别）
  author: rxerium
  severity: info
  description: |
    检测到疑似仿冒 American Express 的钓鱼网站。模板在目标页面返回 200、页面内容命中 American Express 的金融或支付页面特征，且当前主机不属于 americanexpress.com 官方域名时触发，用于识别借用 American Express 品牌页面诱导用户信任的仿冒站点。
  reference:
    - https://www.americanexpress.com
  metadata:
    max-request: 1
  tags: phishing,american-express,osint,discovery
http:
  - method: GET
    path:
      - "{{BaseURL}}"

    host-redirects: true
    max-redirects: 2

    matchers-condition: and
    matchers:
      - type: word
        words:
          - 'Credit Cards, Rewards, Travel and Business Services | American Express'

      - type: status
        status:
          - 200

      - type: dsl
        dsl:
          - '!contains(host,"americanexpress.com")'
