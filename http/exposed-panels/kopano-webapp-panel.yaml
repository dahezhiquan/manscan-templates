id: kopano-webapp-panel

info:
  name: Kopano WebApp 登录面板识别（指纹识别）
  author: righettod
  severity: info
  description: |-
    检测到目标站点存在 Kopano WebApp 相关响应特征。Kopano WebApp 是 Web 邮件或协作门户，用于通过浏览器访问邮件、联系人、日历、列表或组织通信数据。模板请求 `/webapp/`，并通过页面标题或正文关键字、状态码、DSL 条件确认该系统指纹，用于资产识别、系统盘点和暴露面梳理。
  reference:
    - https://kopano.com/
  classification:
    cpe: cpe:2.3:a:kopano:webapp:*:*:*:*:*:*:*:*
  metadata:
    verified: true
    max-request: 1
    vendor: kopano
    product: webapp
    shodan-query: http.title:"Kopano WebApp"
  tags: panel,kopano,login,detect,discovery
http:
  - method: GET
    path:
      - "{{BaseURL}}/webapp/"

    host-redirects: true
    max-redirects: 2
    matchers:
      - type: dsl
        dsl:
          - 'status_code == 200'
          - 'contains_any(body, "<title>Kopano WebApp", "content=\"Kopano WebApp")'
        condition: and

    extractors:
      - type: regex
        part: body
        group: 1
        regex:
          - '\?kv([0-9.]+)"'
