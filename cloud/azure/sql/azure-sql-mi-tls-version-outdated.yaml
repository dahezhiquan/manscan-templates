id: azure-sql-mi-tls-version-outdated
info:
  name: Azure SQL Managed Instance TLS Version 未Latest（云安全）
  author: princechaddha
  severity: medium
  description: 该规则用于检查 Azure SQL 是否正确启用传输中或静态数据加密、证书校验及安全协议配置，防止敏感数据在存储或通信过程中被窃听、篡改或滥用。
  impact: |
    - 未正确启用加密或安全协议时，敏感数据可能在传输或存储过程中被窃听、窃取或篡改。
    - 这还可能导致不满足行业合规要求，增加数据泄露与法律责任风险。
  remediation: |
    - 启用厂商推荐的加密方案，并优先使用更安全的协议、算法或客户管理密钥。
    - 同时检查相关证书、密钥与依赖服务的生命周期管理，确保配置持续有效。
  reference:
    - https://docs.microsoft.com/en-us/azure/azure-sql/managed-instance/transact-sql-tls-configuration
  tags: cloud,devops,azure,microsoft,azure-sql,azure-cloud-config

flow: |
  code(1);
  for (let InstanceData of iterate(template.instanceList)) {
    set("ids", InstanceData);
    code(2);
  }

self-contained: true
code:
  - engine:
      - sh
      - bash
    source: |
      az sql mi list --query '[*].{"id":id}'

    extractors:
      - type: json
        name: instanceList
        internal: true
        json:
          - '.[]'

  - engine:
      - sh
      - bash
    source: |
      az sql mi show --ids "$ids" --query 'minimalTlsVersion'

    matchers-condition: and
    matchers:
      - type: word
        part: body
        words:
          - "1."

      - type: word
        words:
          - '"1.2"'
        negative: true

    extractors:
      - type: dsl
        dsl:
          - 'ids + " does not use TLS 1.2"'
