id: azure-nsg-rpc-unrestricted
info:
  name: Azure NSG 对互联网开放 RPC 端口 135（云安全）
  author: princechaddha
  severity: high
  description: Windows RPC Endpoint Mapper 通常使用 TCP 135 协助定位远程 RPC 服务；将其对互联网开放会暴露 Windows 管理和服务调用入口。本模板查询入站允许的 TCP 135 NSG 规则，并在来源地址为 *、internet 或 any 时报告。
  impact: |
    - 攻击者可枚举远程服务、尝试利用 RPC 相关漏洞或配合其他开放端口实施横向移动。
    - Windows 主机被突破后，可能导致远程管理滥用、凭据窃取和域环境进一步受影响。
  remediation: |
    - 删除面向互联网的 TCP 135 规则，仅向必要的管理网段开放，并同步限制动态 RPC 端口范围。
    - 通过 Bastion、VPN 和分层网络管理 Windows 主机，及时修复系统漏洞并监控异常 RPC 流量。
  reference:
    - https://docs.microsoft.com/en-us/azure/virtual-network/network-security-groups-overview
  metadata:
    vendor: microsoft
    product: azure-network-security-group
  tags: cloud,devops,azure,microsoft,nsg,azure-cloud-config

flow: |
  code(1);
  for (let NsgData of iterate(template.nsgdata)) {
    NsgData = JSON.parse(NsgData)
    set("nsg", NsgData.name)
    set("resourcegroup", NsgData.resourceGroup)
    code(2)
  }

self-contained: true
code:
  - engine:
      - sh
      - bash
    source: |
      az network nsg list --query '[*].{name:name, resourceGroup:resourceGroup}' --output json

    extractors:
      - type: json
        name: nsgdata
        internal: true
        json:
          - '.[]'

  - engine:
      - sh
      - bash
    source: |
      az network nsg rule list --nsg-name $nsg --resource-group $resourcegroup --query "[?direction=='Inbound' && access=='Allow' && protocol=='TCP' && (destinationPortRange=='135')]"

    matchers:
      - type: word
        words:
          - '"sourceAddressPrefix": "*"'
          - '"sourceAddressPrefix": "internet"'
          - '"sourceAddressPrefix": "any"'

    extractors:
      - type: dsl
        dsl:
          - 'nsg + " has unrestricted access on TCP port 135"'
