id: gdm-autorun-never-enabled-check

info:
  name: 确保 GDM 的 autorun-never 已启用（本地基线扫描）
  author: Th3l0newolf
  severity: medium
  description: |
    GDM 未启用 `autorun-never` 时，可移动介质中的自动运行行为可能触发应用或脚本入口，增加恶意介质攻击面。CIS Ubuntu 基线要求禁用自动运行；模板读取 `org.gnome.desktop.media-handling autorun-never`，值不是 `true` 时命中 Policy-Fail。
  impact: |
    - 用户插入未知介质时，恶意内容更容易被自动或半自动触发。
    - 共享桌面环境中，自动运行会放大物理接触带来的终端入侵风险。
  remediation: |
    - 通过 GDM/dconf 策略启用 `autorun-never=true`。
    - 对可移动介质建立准入和恶意文件扫描流程，避免绕过终端安全控制。
  reference:
    - https://www.cisecurity.org/benchmark/ubuntu_linux
  tags: cis,linux,ubuntu,gdm,autorun,media,audit
  metadata:
    verified: true

self-contained: true

code:
  - engine:
      - bash
    args:
      - "-c"
      - |
        autorun_never=$(gsettings get org.gnome.desktop.media-handling autorun-never 2>/dev/null)

        if [ "$autorun_never" = "true" ]; then
          echo "[gdm-autorun-never-enabled-check:Policy-Pass] [GDM autorun-never is enabled] [CIS_PASS] [medium]"
        else
          echo "[gdm-autorun-never-enabled-check:Policy-Fail] [GDM autorun-never is not enabled] [CIS_FAIL] [medium]"
        fi

    matchers:
      - type: word
        name: policy-pass
        words:
          - "Policy-Pass"

      - type: word
        name: policy-fail
        words:
          - "Policy-Fail"
