id: default-fastcgi-page

info:
  name: FastCGI 默认测试页面 指纹识别（指纹识别）
  author: dhiyaneshDk
  severity: info
  description: FastCGI 默认测试页面 是 Web 服务器与应用进程通信协议，用于运行动态脚本和后端应用。该模板请求首页，并依据页面标题、正文关键字或品牌资源特征识别目标是否使用或暴露了 FastCGI 默认测试页面 相关组件，适用于资产盘点、技术栈识别和后续安全评估；命中结果仅表示指纹特征匹配，不代表已确认存在可利用漏洞。
  classification:
    cpe: cpe:2.3:a:fastcgi:fcgi:*:*:*:*:*:*:*:*
  metadata:
    max-request: 1
    vendor: fastcgi
    product: fcgi
    shodan-query: http.title:"FastCGI"
  tags: tech,fastcgi,discovery

http:
  - method: GET
    path:
      - '{{BaseURL}}'

    matchers:
      - type: word
        words:
          - "<title>TurnKey NGINX PHP FastCGI Server</title>"
        part: body
