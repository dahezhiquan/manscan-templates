id: nexpose-panel

info:
  name: Rapid7 Nexpose VM Security Console 识别（暴露面识别）
  author: johnk3r
  severity: info
  description: |
    该模板通过识别 Rapid7 Nexpose VM Security Console 登录入口的页面标题、特征文本或重定向行为，判断目标是否暴露了对应的认证界面。若命中，说明该登录面板对外可访问，可用于暴露面梳理与后续安全评估。
  metadata:
    verified: true
    max-request: 1
    shodan-query: http.favicon.hash:-516760689
  tags: nexpose,panel,login,detect,discovery

http:
  - method: GET
    path:
      - "{{BaseURL}}/login.jsp"

    matchers:
      - type: dsl
        dsl:
          - 'contains(header, "Security Console")'
          - 'contains(body, "nexposeccusername")'
          - status_code == 200
        condition: and

    extractors:
      - type: kval
        part: header
        kval:
          - Server
