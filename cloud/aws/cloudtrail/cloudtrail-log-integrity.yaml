id: cloudtrail-log-integrity
info:
  name: CloudTrail 日志文件完整性校验未启用（云安全）
  author: princechaddha
  severity: high
  description: CloudTrail 日志文件完整性校验未启用是一类审计证据可信度风险，日志投递后缺少 digest 文件证明其未被篡改、删除或伪造。攻击者若获得日志存储权限，可能通过修改审计记录削弱取证能力。模板读取 `trailList[*].LogFileValidationEnabled`，当值为 `false` 时判定未启用日志文件完整性校验。
  impact: |
    - 安全事件调查时，难以证明 CloudTrail 日志文件自投递后未被篡改或删除。
    - 攻击者若获得日志存储权限，可能通过修改或移除日志削弱审计可信度。
  remediation: |
    - 为 CloudTrail trail 启用日志文件完整性校验，并保留对应 digest 文件。
    - 限制日志存储桶写入和删除权限，结合独立账户或不可变存储提高审计证据可靠性。
  reference:
    - https://docs.aws.amazon.com/awscloudtrail/latest/userguide/cloudtrail-log-file-validation-intro.html
  metadata:
    max-request: 2
    vendor: amazon
    product: cloudtrail
  tags: cloud,devops,aws,amazon,cloudtrail,aws-cloud-config
variables:
  region: "ap-south-1"

flow: |
  code(1)
  for(let CloudTrail of iterate(template.cloudtrailname)){
    set("trail", CloudTrail)
    code(2)
  }

self-contained: true
code:
  - engine:
      - sh
      - bash
    source: |
      aws cloudtrail list-trails --region $region --query 'Trails[*].Name' --output json

    extractors:
      - type: json
        name: cloudtrailname
        internal: true
        json:
          - '.[]'

  - engine:
      - sh
      - bash
    source: |
         aws cloudtrail describe-trails --region $region --trail-name-list $trail --query 'trailList[*].LogFileValidationEnabled'

    matchers:
      - type: word
        words:
          - "false"

    extractors:
      - type: dsl
        dsl:
          - '"The log file integrity validation is not enabled for CloudTrail trail" + trail'
