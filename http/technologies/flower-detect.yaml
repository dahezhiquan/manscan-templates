id: flower-detect

info:
  name: Flower 指纹识别（指纹识别）
  author: righettod
  severity: info
  description: >-
    Flower 是 Celery 任务队列的 Web 监控工具，用于查看 worker、任务状态和队列运行情况。该模板通过请求目标服务并检查预设路径或首页响应、DSL
    条件等指纹特征，判断目标是否使用或暴露了 Flower 相关组件；命中结果仅表示指纹特征匹配，可用于资产盘点、技术栈识别和后续安全评估，不代表已确认存在可利用漏洞。
  reference:
  - https://github.com/mher/flower
  - https://flower.readthedocs.io/en/latest/
  metadata:
    verified: true
    max-request: 1
    shodan-query: http.title:"Flower"
  tags: tech,flower,detect,oss
http:
  - method: GET
    path:
      - '{{BaseURL}}/'

    matchers:
      - type: dsl
        dsl:
          - 'status_code == 200'
          - 'contains_all(to_lower(body), "<title>flower</title>", "flower.readthedocs.io", "js/flower.js")'
        condition: and
