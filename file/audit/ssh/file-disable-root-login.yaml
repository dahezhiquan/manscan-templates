id: file-disable-root-login

info:
  name: SSH root 直接登录未禁用（本地文件安全扫描）
  author: pussycat0x
  severity: high
  description: |
    允许 root 通过 SSH 直接登录会把最高权限账户暴露给远程认证面，攻击者一旦获得凭据即可跳过普通账户和提权审计。本模板匹配 `PermitRootLogin yes`，可直接提示显式开启该配置，但仍需考虑 Include 文件、Match 块和实际监听面。
  impact: |
    - root 凭据被暴力破解、复用或窃取后，攻击者可直接完全控制主机。
    - 直接 root 登录会减少操作归属和提权链审计信息，扩大凭据泄露后的横向移动影响。
  remediation: |
    - 将 `PermitRootLogin no` 应用于有效 SSH 配置，使用受控普通账户登录后通过 sudo 执行必要管理操作。
    - 对 sudo 权限、密钥、MFA、来源 ACL 和特权命令启用最小权限与审计，并在变更前验证备用登录路径。
  reference:
    - https://vishalraj82.medium.com/hardening-openssh-security-37f5d634015f
    - https://www.tecmint.com/disable-or-enable-ssh-root-login-and-limit-ssh-access-in-linux/
  metadata:
    verified: true
  tags: audit,config,file,ssh

file:
  - extensions:
      - all

    matchers:
      - type: word
        words:
          - "PermitRootLogin yes"
