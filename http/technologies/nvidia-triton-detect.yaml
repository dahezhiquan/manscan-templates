id: nvidia-triton-detect

info:
  name: Triton Inference 服务器指纹识别（指纹识别）
  author: mailler0xa
  severity: info
  description: |
    用于识别目标是否部署 Triton Inference 服务器 并提取相关版本或构建信息，模板会结合页面正文、状态码、特定路径或已知端点和版本或标识提取结果进行指纹匹配。
  reference:
    - https://github.com/triton-inference-server/server
  metadata:
    verified: true
    max-request: 1
    vendor: nvidia
    product: triton
  tags: oss,nvidia,triton,tech,discovery

http:
  - method: GET
    path:
      - "{{BaseURL}}/v2"

    matchers-condition: and
    matchers:
      - type: word
        words:
          - "{\"name\":\"triton\","
          - "\"extensions\""
        condition: and

      - type: status
        status:
          - 200

    extractors:
      - type: json
        part: body
        json:
          - ".version"
