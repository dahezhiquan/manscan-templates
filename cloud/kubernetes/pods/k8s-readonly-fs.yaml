id: k8s-readonly-fs

info:
  name: Enforce Read-Only Filesystem 的Containers（云安全）
  author: princechaddha
  severity: critical
  description: 容器未启用 readOnlyRootFilesystem 会允许运行时写入根文件系统，增加持久化植入和运行时篡改空间。本模板枚举所有 Pod 容器，发现 securityContext.readOnlyRootFilesystem 未设置为 true 时报告。
  impact: |
    - 攻击者可在容器根文件系统写入工具、后门或篡改应用文件，增加清理难度。
    - 运行时写入扩大了供应链镜像和实际运行状态之间的差异。
  remediation: |
    - 将容器 securityContext.readOnlyRootFilesystem 设置为 true，并把必要写入改到显式 emptyDir、ConfigMap 或持久卷。
    - 在构建和准入阶段验证应用不依赖根文件系统写入。
  reference:
    - https://kubernetes.io/docs/concepts/storage/volumes/#mount-propagation
  metadata:
    vendor: kubernetes
    product: kubernetes
  tags: cloud,devops,kubernetes,devsecops,pods,k8s-cluster-security
flow: |
  code(1);
  for (let container of template.items) {
    set("container", container)
    javascript(1);
  }

self-contained: true
code:
  - engine:
      - sh
      - bash
    source: kubectl get pods --all-namespaces --output=json
    extractors:
      - type: json
        name: items
        internal: true
        json:
          - '.items[].spec.containers[]'

javascript:
  - code: |
        container = JSON.parse(template.container);
        if (!container.securityContext || container.securityContext.readOnlyRootFilesystem !== true) {
          let result = (`Container '${container.name}' in pod '${container.metadata.name}' in namespace '${container.metadata.namespace}' does not use a read-only filesystem.`);
          Export(result);
        }

    extractors:
      - type: dsl
        dsl:
          - response
