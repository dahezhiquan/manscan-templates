id: stackoverflow

info:
  name: Stack Overflow 用户名信息枚举（OSINT）
  author: lu4nx
  severity: info
  description: |
    对 Stack Overflow 的用户名进行 OSINT 枚举检查。模板请求公开路径 https://stackoverflow.com/users/filter?search=用户名，当响应状态为 200 且页面或响应内容命中 “<p>No users matched your sea...” 等用户资料页特征时，判定目标用户名可能存在。
  classification:
    cvss-metrics: CVSS:3.1/AV:N/AC:L/PR:N/UI:N/S:U/C:N/I:N/A:N
    cwe-id: CWE-200
  metadata:
    verified: "true"
    max-request: 1
  tags: osint,osint-coding,stackoverflow,discovery

self-contained: true

http:
  - method: GET
    path:
      - "https://stackoverflow.com/users/filter?search={{user}}"

    matchers-condition: and
    matchers:
      - type: word
        part: body
        words:
          - "<p>No users matched your search.</p>"
        negative: true

      - type: status
        status:
          - 200
