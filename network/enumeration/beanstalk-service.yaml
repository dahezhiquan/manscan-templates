id: beanstalk-service

info:
  name: Beanstalk 服务 识别（服务漏洞）
  author: pussycat0x
  severity: info
  description: |
    该模板通过协议交互枚举 Beanstalk 相关服务的版本、配置、用户或其他可公开获取的信息。
  reference:
    - https://jhadiary.wordpress.com/2016/05/18/beanstalk-helping-commands/
  metadata:
    verified: true
    max-request: 1
    shodan-query: port:11300 "cmd-peek"
  tags: network,beanstalk,detect,enum,tcp,discovery
tcp:
  - inputs:
      - data: "stats\r\n"
        read: 8

    host:
      - "{{Hostname}}"
    port: 11300

    matchers:
      - type: word
        part: raw
        words:
          - "cmd-release"
          - "cmd-peek"
        condition: and

    extractors:
      - type: regex
        name: stats
        regex:
          - '([a-z-A-Z: 0-9]+)'
