id: trino-unauth-cluster

info:
  name: 集群 Overview 未授权 仪表盘 暴露
  author: tess
  severity: medium
  description: |
    检测到 集群 Overview 未授权 仪表盘 暴露。目标功能在未认证状态下可访问，可能暴露管理入口、业务数据、系统状态或可执行操作，需确认是否存在访问控制缺失。
  metadata:
    verified: true
    max-request: 1
    shodan-query: http.title:"Cluster Overview - Trino"
  tags: cluster,unauth,trino,misconfig,vuln

http:
  - method: POST
    path:
      - "{{BaseURL}}/ui/login"

    headers:
      Content-Type: application/x-www-form-urlencoded

    body: |
      username={{randstr}}&password=&redirectPath=
    redirects: true

    matchers-condition: and
    matchers:
      - type: word
        part: body
        words:
          - 'Cluster Overview'
          - 'Query Details'
        condition: and

      - type: status
        status:
          - 200
