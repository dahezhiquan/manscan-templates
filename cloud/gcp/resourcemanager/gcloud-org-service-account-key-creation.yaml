id: gcloud-org-service-account-key-creation

info:
  name: Service Account Key Creation Not未启用（云安全）
  author: princechaddha
  severity: high
  description: 服务账号密钥创建会生成可下载的长期凭据，组织未禁用时容易产生难以追踪和轮换的密钥。本模板检查 iam.disableServiceAccountKeyCreation 组织策略 booleanPolicy，返回空对象 {} 时报告未禁用服务账号密钥创建。
  impact: |
    - 用户管理密钥可能泄露到代码仓库、CI/CD、镜像或本地设备，泄露后可在外部环境长期访问云资源。
    - 长期密钥绕过平台短期凭据控制，增加凭据轮换、吊销和归属追踪难度。
  remediation: |
    - 启用 iam.disableServiceAccountKeyCreation 组织策略，禁止新建用户管理服务账号密钥。
    - 推广 Workload Identity、服务账号附加到运行环境等短期凭据方案，并清理已有无用密钥。
  reference:
    - https://www.trendmicro.com/cloudoneconformity/knowledge-base/gcp/ResourceManager/disable-service-account-key-creation.html
    - https://cloud.google.com/resource-manager/docs/organization-policy/org-policy-constraints
  metadata:
    vendor: google
    product: resource-manager
  tags: cloud,devops,gcp,gcloud,resourcemanager,security,iam,service-account,gcp-cloud-config

flow: |
  code(1)
  for(let orgId of iterate(template.orgIds)){
    set("orgId", orgId)
    code(2)
  }

self-contained: true

code:
  - engine:
      - sh
      - bash
    source: |
      gcloud organizations list --format="json(name)"

    extractors:
      - type: json
        name: orgIds
        internal: true
        json:
          - '.[].name'

  - engine:
      - sh
      - bash
    source: |
      gcloud alpha resource-manager org-policies describe iam.disableServiceAccountKeyCreation --organization=$orgId --effective --format="json(booleanPolicy)"

    matchers:
      - type: word
        words:
          - "{}"

    extractors:
      - type: dsl
        dsl:
          - '"Organization " + orgId + " has not disabled service account key creation, allowing users to create unmanaged keys"'
