id: fastgpt-panel

info:
  name: FastGPT 面板识别（指纹识别）
  author: rxerium
  severity: info
  description: |-
    检测到目标站点存在 FastGPT 相关响应特征。FastGPT 是知识库问答和 LLM 应用编排平台，用于管理应用、数据集、工作流和模型调用。模板请求 `/`，并通过页面标题或正文关键字、状态码确认该系统指纹，用于资产识别、系统盘点和暴露面梳理。
  reference:
    - https://github.com/labring/FastGPT
    - https://fastgpt.in
  metadata:
    verified: true
    max-request: 1
    vendor: labring
    product: fastgpt
    shodan-query: 'http.title:"FastGPT"'
  tags: panel,fastgpt,llm,ai,rag,detect,discovery
http:
  - method: GET
    path:
      - "{{BaseURL}}"

    host-redirects: true
    max-redirects: 2

    matchers-condition: and
    matchers:
      - type: word
        part: body
        words:
          - "FastGPT"

      - type: status
        status:
          - 200
