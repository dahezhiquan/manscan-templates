id: fatpipe-mpvpn-panel

info:
  name: FatPipe MPVPN 面板识别（指纹识别）
  author: princechaddha
  severity: info
  description: |-
    检测到目标站点存在 FatPipe MPVPN 相关响应特征。FatPipe MPVPN 是远程访问或 VPN 登录入口，用于为用户提供企业内网、应用系统或安全网关的访问能力。模板请求 `/fpui/jsp/login.jsp`，并通过页面标题或正文关键字、状态码确认该系统指纹，用于资产识别、系统盘点和暴露面梳理。
  reference:
    - https://www.fatpipeinc.com/products/mpvpn/index.php
  classification:
    cvss-metrics: CVSS:3.1/AV:N/AC:L/PR:N/UI:N/S:U/C:N/I:N/A:N
    cwe-id: CWE-200
  metadata:
    max-request: 1
  tags: tech,fatpipe,panel,discovery
http:
  - method: GET
    path:
      - "{{BaseURL}}/fpui/jsp/login.jsp"

    matchers-condition: and
    matchers:
      - type: word
        part: body
        words:
          - "<title>FatPipe MPVPN&nbsp;| Log in</title>"

      - type: status
        status:
          - 200

    extractors:
      - type: regex
        part: body
        group: 1
        regex:
          - '<h5>([0-9.a-z]+)<\/h5>'
