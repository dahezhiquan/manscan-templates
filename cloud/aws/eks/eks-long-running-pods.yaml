id: eks-long-running-pods

info:
  name: EKS 存在长时间运行的 Pod（云安全）
  author: princechaddha
  severity: medium
  description: EKS 存在长时间运行的 Pod 是一类工作负载补丁和运行状态管理风险，长期未重建的 Pod 可能继续运行旧镜像、旧配置或未刷新凭据。Kubernetes Pod 本身是短生命周期对象，过长运行时间通常意味着滚动更新、镜像更新或节点维护流程可能不足。模板更新 kubeconfig 后查询所有命名空间中 Running 状态的 Pod，并通过创建时间筛选运行超过 `days` 阈值的对象。
  impact: |
    - 长时间运行的 Pod 可能错过基础镜像、依赖包和运行时配置更新。
    - 凭据、配置或挂载内容长期不刷新，可能增加泄露后的持续有效时间和运维漂移风险。
  remediation: |
    - 对长期运行的工作负载执行滚动重启或重新部署，确保镜像和配置处于受控版本。
    - 建立镜像更新、节点维护和凭据轮换流程，并为关键命名空间设置运行时长巡检。
  reference:
    - https://kubernetes.io/docs/concepts/workloads/pods/pod-lifecycle/
    - https://docs.aws.amazon.com/eks/latest/userguide/kubernetes-versions.html
  metadata:
    vendor: amazon
    product: eks
  tags: cloud,devops,aws,amazon,eks,aws-cloud-config

variables:
  region: "us-east-1"
  days: "30"

flow: |
  code(1)
  for(let cluster of iterate(template.clusters)){
    set("cluster", cluster)
    code(2)
  }

self-contained: true

code:
  - engine:
      - sh
      - bash
    source: |
      aws eks list-clusters --region $region --query 'clusters' --output json

    extractors:
      - type: json
        name: clusters
        internal: true
        json:
          - '.[]'

  - engine:
      - sh
      - bash
    source: |
      aws eks update-kubeconfig --name $cluster --region $region
      kubectl get pods --all-namespaces --field-selector=status.phase=Running --output=json | \
      jq -r --argjson days "$days" '.items[] |
      select((now - (.metadata.creationTimestamp | fromdate)) > ($days * 24 * 3600)) |
      .metadata.namespace + "/" + .metadata.name'

    matchers:
      - type: word
        words:
          - "/"

    extractors:
      - type: dsl
        dsl:
          - '"EKS cluster " + cluster + " has pods running for more than " + days + " days"'
