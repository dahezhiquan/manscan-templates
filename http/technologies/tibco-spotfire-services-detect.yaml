id: tibco-spotfire-services-detect

info:
  name: TIBCO Spotfire Statistics Services 指纹识别（指纹识别）
  author: righettod
  severity: info
  description: >-
    TIBCO Spotfire Statistics Services 是 Spotfire 分析平台的统计计算服务，用于执行数据分析、预测和脚本计算任务。该模板通过请求目标服务并检查预设路径或首页响应、DSL
    条件、正则特征等指纹特征，判断目标是否使用或暴露了 TIBCO Spotfire Statistics Services 相关组件；命中结果仅表示指纹特征匹配，可用于资产盘点、技术栈识别和后续安全评估，不代表已确认存在可利用漏洞。
  reference:
  - https://docs.tibco.com/products/tibco-spotfire-statistics-services
  classification:
    cpe: cpe:2.3:a:tibco:spotfire_statistics_services:*:*:*:*:*:*:*:*
  metadata:
    verified: true
    max-request: 4
    vendor: tibco
    product: spotfire_statistics_services
    shodan-query: "TIBCO Spotfire Server"
  tags: tech,tibco,detect,discovery
http:
  - method: GET
    path:
      - "{{BaseURL}}/SplusServer/"
      - "{{BaseURL}}/RServer/"
      - "{{BaseURL}}/TERR/"
      - "{{BaseURL}}"

    stop-at-first-match: true
    matchers:
      - type: dsl
        dsl:
          - 'contains_any(to_lower(body), "tibco spotfire statistics services", "spotfire statistics services")'
          - 'contains(header, "TIBCO Spotfire Server")'
        condition: or

    extractors:
      - type: regex
        part: body
        group: 1
        regex:
          - 'Version\s+([0-9.\s\(\)V]+)'
