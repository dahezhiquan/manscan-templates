id: azure-vm-ssh-auth-type
info:
  name: Azure VM SSH Authentication Type 未Using Keys（云安全）
  author: princechaddha
  severity: high
  description: Linux Azure VM 的 disablePasswordAuthentication 为 false 时，SSH 仍允许口令认证，攻击者可通过撞库、暴力破解或泄露密码尝试登录。本模板枚举虚拟机并查询 osProfile.linuxConfiguration.disablePasswordAuthentication，在返回 false 时报告未强制使用密钥认证。
  impact: |
    - SSH 口令被猜中或复用后，攻击者可直接获得主机 shell，窃取数据、植入持久化程序并利用实例身份横向访问云资源。
    - 暴露在公网的 SSH 端口还会持续受到自动化扫描和密码喷洒，增加账号锁定和主机资源消耗。
  remediation: |
    - 将 disablePasswordAuthentication 设置为 true，使用短期、可轮换的 SSH 密钥或 Microsoft Entra 登录。
    - 通过 NSG、JIT、跳板机和来源限制收敛 SSH 暴露面，删除共享密码并审计现有本地账户和密钥。
  reference:
    - https://docs.microsoft.com/en-us/azure/virtual-machines/linux/ssh-from-windows
  metadata:
    vendor: microsoft
    product: azure-virtual-machines
  tags: cloud,devops,azure,microsoft,vm,azure-cloud-config

flow: |
  code(1);
  for (let vmData of iterate(template.vmList)) {
    set("ids", vmData);
    code(2);
  }

self-contained: true
code:
  - engine:
      - sh
      - bash
    source: |
      az vm list --query '[*].id'

    extractors:
      - type: json
        name: vmList
        internal: true
        json:
          - '.[]'

  - engine:
      - sh
      - bash
    source: |
      az vm show --ids "$ids" --query 'osProfile.linuxConfiguration.disablePasswordAuthentication'

    matchers:
      - type: word
        words:
          - 'false'

    extractors:
      - type: dsl
        dsl:
          - 'ids + " is configured with password-based SSH authentication, which is insecure"'
