id: api-pastebin

info:
  name: Pastebin API Token 可用性校验（token喷洒）
  author: daffainfo
  severity: info
  description: 该模板通过调用 Pastebin API 的已知接口验证提供的 token 是否有效，命中后通常表示可访问相关 API 能力。
  reference:
    - https://pastebin.com/doc_api
    - https://github.com/daffainfo/all-about-apikey/tree/main/pastebin
  metadata:
    max-request: 1
  tags: token-spray,pastebin

self-contained: true

http:
  - raw:
      - |
        POST https://pastebin.com/api/api_post.php HTTP/1.1
        Host: pastebin.com
        Content-Type: application/x-www-form-urlencoded
        Content-Length: 81

        api_dev_key={{token}}&api_paste_code=test&api_option=paste

    matchers:
      - type: word
        part: body
        words:
          - 'https://pastebin.com/'
