id: kcfinder-exposure

info:
  name: KCFinder 暴露（暴露面识别）
  author: theamanrawat
  severity: high
  description: |
    检测到对外可访问的 KCFinder。相关文件可能泄露项目结构、依赖关系、部署细节、敏感参数或其他不应公开的内部信息。
  reference:
    - https://github.com/sunhater/kcfinder
  metadata:
    verified: true
    max-request: 6
  tags: exposure,kcfinder,file-upload

http:
  - method: GET
    path:
      - "{{BaseURL}}"
      - "{{BaseURL}}/kcfinder/browse.php"
      - "{{BaseURL}}/assets/kcfinder/browse.php"
      - "{{BaseURL}}/lib/kcfinder/browse.php"
      - "{{BaseURL}}/admin/kcfinder/browse.php"
      - "{{BaseURL}}/includes/kcfinder/browse.php"

    stop-at-first-match: true
    matchers-condition: and
    matchers:
      - type: word
        words:
          - "<title>KCFinder:"
          - "id=\"files\""
        condition: and

      - type: status
        status:
          - 200
