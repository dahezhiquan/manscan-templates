id: karakeep-panel

info:
  name: Karakeep 面板 - 检测（指纹识别）
  author: ChrisJr404
  severity: info
  description: |-
    检测到 Karakeep（原名为 Hoarder），这是一个自托管的万能收藏应用，可用于收藏链接、笔记和图片，支持基于 AI 的标签和全文搜索，通常运行在 TCP 3000 端口。
  reference:
    - https://github.com/karakeep-app/karakeep
    - https://docs.karakeep.app/api/karakeep-api/
  metadata:
    verified: true
    max-request: 3
    vendor: karakeep-app
    product: karakeep
    shodan-query: http.title:"Karakeep"
    fofa-query: title="Karakeep"
  tags: panel,login,karakeep,hoarder,bookmark,selfhosted,detect,discovery

flow: http(1) && http(2) && http(3)

http:
  - method: GET
    path:
      - "{{BaseURL}}"

    host-redirects: true
    max-redirects: 2

    matchers:
      - type: dsl
        dsl:
          - 'status_code == 200'
          - 'contains(to_lower(body), "<title>karakeep</title>")'
        internal: true
        condition: and

  - method: GET
    path:
      - "{{BaseURL}}/api/health"

    matchers:
      - type: dsl
        dsl:
          - 'status_code == 200'
          - 'contains(body, "\"status\":\"ok\"")'
          - 'contains(body, "\"message\":\"Web app is working\"")'
          - 'contains(content_type, "application/json")'
        condition: and

  - method: GET
    path:
      - "{{BaseURL}}/api/version"

    matchers:
      - type: dsl
        dsl:
          - 'status_code == 200'
          - 'contains(content_type, "application/json")'
          - 'contains(body, "\"version\"")'
        condition: and

    extractors:
      - type: regex
        part: body
        group: 1
        regex:
          - '"version"\s*:\s*"([^"]+)"'
