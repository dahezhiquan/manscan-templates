id: sysaid-panel

info:
  name: SysAid 登录面板识别（暴露面识别）
  author: pdteam,darses
  severity: info
  description: |
    该模板通过识别 SysAid 登录入口的页面标题、特征文本或重定向行为，判断目标是否暴露了对应的认证界面。若命中，说明该登录面板对外可访问，可用于暴露面梳理与后续安全评估。
  classification:
    cvss-metrics: CVSS:3.0/AV:N/AC:L/PR:N/UI:N/S:U/C:N/I:N/A:N
    cwe-id: CWE-200
    cpe: cpe:2.3:a:sysaid:sysaid:*:*:*:*:*:*:*:*
  metadata:
    max-request: 3
    vendor: sysaid
    product: sysaid
    shodan-query: http.favicon.hash:1540720428
    fofa-query: icon_hash=1540720428
  tags: panel,sysaid,helpdesk,detect,discovery

http:
  - method: GET
    path:
      - "{{BaseURL}}/Login.jsp"
      - "{{BaseURL}}/InvalidAccount.jsp"
      - "{{BaseURL}}/favicon.ico"

    stop-at-first-match: true
    matchers:
      - type: dsl
        dsl:
          - "status_code==200 && contains(tolower(body), 'sysaid help desk software')"
          - "status_code==200 && contains(tolower(body), 'info@sysaid.com')"
          - "status_code==200 && ('1540720428' == mmh3(base64_py(body)))"
        condition: or

    extractors:
      - type: regex
        name: version
        part: body
        group: 2
        regex:
          - "(ajaxTools\\.js|master\\.css)\\?v([\\d\\.\\w]+)\""
