id: ssrpm-arbitrary-password-reset

info:
  name: SSRPM Onboarding 任意密码重置
  author: vince-isec
  severity: high
  description: |-
    该模板用于核查 SSRPM Onboarding 任意密码重置。目标因访问控制、默认配置或文件发布策略不当，暴露了不应公开的页面、接口或文件。模板访问 /Onboarding/Import，并根据响应状态、页面关键字或组件特征确认该配置问题。
  remediation: |-
    - 收敛公开访问面，只暴露业务必需的页面和接口。
    - 对敏感入口增加认证授权、来源限制和访问审计。
    - 定期检查部署目录、反向代理规则和默认配置，清理示例与调试资源。
  reference:
    - https://www.synacktiv.com/advisories/ssrpm-arbitrary-password-reset-on-default-client-web-interface-installation
  metadata:
    shodan-query: http.favicon.hash:-916902413
    max-request: 1
    verified: true
  tags: ssrpm,intrusive,vuln
  impact: |-
    - 攻击者可获取内部信息、组件版本、配置细节或可操作的管理入口。
    - 暴露信息可能辅助后续漏洞利用、权限提升、横向移动或业务数据访问。
variables:
  string: "{{to_lower(rand_text_alpha(5))}}"

http:
  - raw:
      - |
        POST /Onboarding/Import HTTP/1.1
        Host: {{Hostname}}
        Content-Type: application/x-www-form-urlencoded

        OnboardingToken=7e30bebc-d17c-4833-98b6-d4c09e076b24&Action={{string}}

    matchers-condition: and
    matchers:
      - type: word
        part: body
        words:
          - '"ErrorCode":-55'
          - '"Success":false'
        condition: and

      - type: word
        part: content_type
        words:
          - 'application/json'

      - type: status
        status:
          - 200

    extractors:
      - type: kval
        kval:
          - string
