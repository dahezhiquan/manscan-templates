id: edgeos-login

info:
  name: EdgeOS 登录面板识别（指纹识别）
  author: princechaddha
  severity: info
  description: |-
    检测到目标站点存在 EdgeOS 相关响应特征。EdgeOS 是 Ubiquiti EdgeRouter 的网络设备操作系统，Web 管理界面用于配置路由、防火墙、VPN 和设备服务。模板请求 `/`，并通过页面标题或正文关键字、状态码确认该系统指纹，用于资产识别、系统盘点和暴露面梳理。
  classification:
    cvss-metrics: CVSS:3.0/AV:N/AC:L/PR:N/UI:N/S:U/C:N/I:N/A:N
    cwe-id: CWE-200
    cpe: cpe:2.3:o:ui:edgeos:*:*:*:*:*:*:*:*
  metadata:
    max-request: 1
    vendor: ui
    product: edgeos
  tags: login,tech,edgeos,edgemax,panel,ui,discovery
http:
  - method: GET
    path:
      - "{{BaseURL}}"

    matchers-condition: and
    matchers:
      - type: word
        part: body
        words:
          - '<title>EdgeOS</title>'

      - type: status
        status:
          - 200
