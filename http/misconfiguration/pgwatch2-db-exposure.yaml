id: pgwatch2-db-exposure

info:
  name: Pgwatch2 数据库s monitor 暴露
  author: DhiyaneshDK
  severity: high
  description: |
    检测到 Pgwatch2 数据库s monitor 暴露。目标功能在未认证状态下可访问，可能暴露管理入口、业务数据、系统状态或可执行操作，需确认是否存在访问控制缺失。
  metadata:
    verified: true
    max-request: 1
    shodan-query: title:"Pgwatch2"
  tags: dashboard,exposure,pgwatch2,unauth,vuln

http:
  - method: GET
    path:
      - "{{BaseURL}}"

    host-redirects: true
    max-redirects: 2

    matchers-condition: and
    matchers:
      - type: word
        part: body
        words:
          - "Databases under monitoring"
          - "pgwatch2"
        condition: and

      - type: status
        status:
          - 200
