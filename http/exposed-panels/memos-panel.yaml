id: memos-panel

info:
  name: Memos 面板识别（暴露面识别）
  author: rxerium
  severity: info
  description: |
    该模板通过识别 Memos 面板、控制台或管理界面的页面特征，判断目标是否暴露了对应服务入口。若命中，说明该后台或运维界面对外可访问，可用于资产识别与暴露面排查。
  reference:
    - https://github.com/usememos/memos
    - https://www.usememos.com/
  classification:
    cpe: cpe:2.3:a:usememos:memos:*:*:*:*:*:*:*:*
  metadata:
    verified: true
    max-request: 2
    vendor: usememos
    product: memos
    shodan-query:
      - title:"Memos"
      - http.title:"memos"
    fofa-query: title="memos"
    google-query: intitle:"memos"
  tags: panel,memos,detect,usememos,discovery

http:
  - method: GET
    path:
      - "{{BaseURL}}"
      - "{{BaseURL}}/explore"

    stop-at-first-match: true

    matchers-condition: and
    matchers:
      - type: word
        words:
          - '<title>Memos'

      - type: status
        status:
          - 200
