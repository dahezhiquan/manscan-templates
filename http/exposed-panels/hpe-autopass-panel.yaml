id: hpe-autopass-panel

info:
  name: HPE AutoPass License Server 面板识别（暴露面识别）
  author: kylianghd
  severity: info
  description: |
    该模板通过识别 HPE AutoPass License Server 面板、控制台或管理界面的页面特征，判断目标是否暴露了对应服务入口。若命中，说明该后台或运维界面对外可访问，可用于资产识别与暴露面排查。
  metadata:
    max-request: 3
    vendor: hpe
    product: autopass-license-server
  tags: panel,exposure,misconfig,hpe,autopass

http:
  - method: GET
    path:
      - "{{BaseURL}}/autopass"
      - "https://{{Host}}:5814/autopass"
      - "https://{{Host}}:5814/autopass/"

    redirects: true
    max-redirects: 2
    stop-at-first-match: true

    matchers-condition: and
    matchers:
      - type: word
        part: body
        words:
          - "AutoPass License Server"

      - type: status
        status:
          - 200
          - 404
