id: wiki-js-detect

info:
  name: Wiki.js 指纹识别（指纹识别）
  author: righettod
  severity: info
  description: >-
    Wiki.js 是开源知识库和文档协作平台，用于团队文档、权限管理和内容发布。该模板通过请求目标服务并检查预设路径或首页响应、DSL 条件等指纹特征，判断目标是否使用或暴露了
    Wiki.js 相关组件；命中结果仅表示指纹特征匹配，可用于资产盘点、技术栈识别和后续安全评估，不代表已确认存在可利用漏洞。
  reference:
  - https://js.wiki/
  metadata:
    verified: true
    max-request: 1
    shodan-query: http.html:"wiki.js"
  tags: tech,wiki-js,detect,discovery
http:
  - method: GET
    path:
      - "{{BaseURL}}/_assets/js/app.js"

    matchers:
      - type: dsl
        dsl:
          - 'status_code == 200'
          - 'contains_all(to_lower(body), "wiki.js - wiki.js.org", "window.wiki")'
        condition: and
