id: amazon-ecs-defualt-page

info:
  name: Amazon ECS 示例应用 默认页面指纹识别（指纹识别）
  author: Splint3r7
  severity: info
  description: |
    用于识别目标暴露的 Amazon ECS 示例应用 默认页面，模板会结合页面标题和特定路径或已知端点判断是否存在对应技术或默认页面特征。
  classification:
    cwe-id: CWE-200
  metadata:
    max-request: 1
    shodan-query: http.title:"Amazon ECS Sample App"
  tags: amazon,tech,default,detect,discovery

http:
  - method: GET
    path:
      - "{{BaseURL}}"

    matchers:
      - type: dsl
        dsl:
          - 'contains(body, "<title>Amazon ECS Sample App")'
          - 'status_code == 200'
        condition: and
