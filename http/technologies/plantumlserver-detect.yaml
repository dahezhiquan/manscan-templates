id: plantumlserver-detect

info:
  name: PlantUMLServer 指纹识别（指纹识别）
  author: s4e-io
  severity: info
  description: |
    用于识别目标是否运行 PlantUMLServer，模板会结合页面标题和特定路径或已知端点进行服务指纹匹配。
  reference:
    - https://github.com/plantuml/plantuml-server
    - https://plantuml.com
  metadata:
    verified: true
    max-request: 1
    fofa-query: app="PlantUMLServer"
  tags: tech,uml,plantuml,detect,discovery

http:
  - method: GET
    path:
      - "{{BaseURL}}"

    host-redirects: true
    max-redirects: 2

    matchers:
      - type: dsl
        dsl:
          - 'contains(body, "<title>PlantUMLServer")'
