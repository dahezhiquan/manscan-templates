id: ilias-default-login

info:
  name: ILIAS LMS 默认管理员凭据（弱口令）
  author: 0x_Akoko
  severity: high
  description: |
    该模板用于检测 ILIAS LMS 是否仍可使用默认凭据或弱口令登录。模板主要向 `/login.php`、`/ilias.php?baseClass=ilStartUpGUI&cmd=post&fallbackCmd=doStandardAuthentication&client_id={变量}` 等认证入口发送请求，使用内置默认凭据组合进行认证尝试，并根据响应中的 `status_code == 200`、`contains_all(body, "ILIAS", "username", "password")` 等登录成功特征判断登录是否成功；命中说明目标未及时修改出厂、示例或初始化账号口令。
  impact: |
    - 攻击者可登录 ILIAS LMS 后台，管理内容、用户、插件、主题、文件或站点配置。
    - 后台权限被滥用后，可能导致页面篡改、恶意文件上传、敏感资料泄露，或进一步取得服务器执行能力。
  remediation: |
    - 立即修改默认管理员凭据，删除安装向导、演示账号和不必要的后台用户。
    - 限制后台登录入口访问来源，启用多因素认证、登录失败锁定和验证码等防护。
    - 检查近期内容、插件、主题、文件上传和管理员操作记录，确认没有持久化后门。
  reference:
    - https://www.ilias.de/
    - https://www.securityspace.com/smysecure/catid.html?id=1.3.6.1.4.1.25623.1.0.107313
  metadata:
    verified: true
    max-request: 2
    vendor: ilias
    product: ilias
    shodan-query: 'http.title:"Login to ILIAS"'
    fofa-query: 'title="Login to ILIAS"'
  tags: ilias,default-login,auth,lms

variables:
  username: "root"
  password: "homer"

flow: http(1) && http(2)

http:
  - raw:
      - |
        GET /login.php HTTP/1.1
        Host: {{Hostname}}

    matchers:
      - type: dsl
        internal: true
        dsl:
          - 'status_code == 200'
          - 'contains_all(body, "ILIAS", "username", "password")'
        condition: and

    extractors:
      - type: regex
        name: client_id
        part: body
        group: 1
        internal: true
        regex:
          - 'client_id=([a-zA-Z0-9_-]+)'

  - raw:
      - |
        POST /ilias.php?baseClass=ilStartUpGUI&cmd=post&fallbackCmd=doStandardAuthentication&client_id={{client_id}} HTTP/1.1
        Host: {{Hostname}}
        Content-Type: application/x-www-form-urlencoded

        username={{username}}&password={{password}}&cmd%5BdoStandardAuthentication%5D=Login

    matchers-condition: and
    matchers:
      - type: dsl
        dsl:
          - 'status_code == 302'
          - '!contains(to_lower(header), "login.php")'
          - 'contains(to_lower(header), "ilias.php")'
        condition: and
