id: astrbot-panel-detect

info:
  name: AstrBot WebUI 登录面板识别（暴露面识别）
  author: theamanrawat
  severity: info
  description: |
    该模板通过识别 AstrBot WebUI 登录入口的页面标题、特征文本或重定向行为，判断目标是否暴露了对应的认证界面。若命中，说明该登录面板对外可访问，可用于暴露面梳理与后续安全评估。
  reference:
    - https://github.com/AstrBotDevs/AstrBot
  metadata:
    verified: true
    max-request: 1
    shodan-query:
      - http.title:"AstrBot"
      - http.title:"AstrBot"
    fofa-query: title="AstrBot"
    google-query: intitle:"AstrBot"
  tags: panel,astrbot,login

http:
  - method: GET
    path:
      - "{{BaseURL}}/"

    matchers-condition: and
    matchers:
      - type: word
        part: body
        words:
          - "<title>AstrBot"

      - type: status
        status:
          - 200
