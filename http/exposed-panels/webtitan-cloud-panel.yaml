id: webtitan-cloud-panel

info:
  name: WebTitan Cloud 面板识别（暴露面识别）
  author: ritikchaddha
  severity: info
  description: |
    该模板通过识别 WebTitan Cloud 面板、控制台或管理界面的页面特征，判断目标是否暴露了对应服务入口。若命中，说明该后台或运维界面对外可访问，可用于资产识别与暴露面排查。
  classification:
    cpe: cpe:2.3:a:titanhq:webtitan:*:*:*:*:*:*:*:*
  metadata:
    verified: true
    max-request: 1
    vendor: titanhq
    product: webtitan
    shodan-query: http.favicon.hash:1090061843
    fofa-query:
      - title="WebTitan"
      - title="webtitan"
      - icon_hash=1090061843
  tags: panel,webtitan,cloud,detect,titanhq,discovery

http:
  - method: GET
    path:
      - "{{BaseURL}}/login.php"

    matchers-condition: and
    matchers:
      - type: word
        part: body
        words:
          - '<title>WebTitan Cloud'
          - 'alt="WebTitan Cloud Logo'
          - 'title="WebTitan'
        condition: or

      - type: status
        status:
          - 200
