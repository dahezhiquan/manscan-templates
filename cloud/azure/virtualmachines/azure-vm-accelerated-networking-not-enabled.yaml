id: azure-vm-accelerated-networking-not-enabled
info:
  name: Azure VM 加速网络未启用（云安全）
  author: princechaddha
  severity: medium
  description: Azure 虚拟机网卡的 enableAcceleratedNetworking 为 false 时，网卡未使用 SR-IOV 加速路径，网络处理会更多依赖主机软件栈。本模板枚举虚拟机并查询其网卡配置，在返回 false 时报告未启用加速网络；该项需结合 VM 大小和业务性能要求复核。
  impact: |
    - 网络密集型业务可能受到吞吐、延迟和 CPU 占用影响，导致服务响应变慢或扩容成本增加。
    - 性能不足若通过增加公网代理或临时网络通道补偿，可能引入额外的暴露面和配置复杂度。
  remediation: |
    - 在支持的 VM 大小和区域中启用网卡 Accelerated Networking，并按 Azure 要求重启虚拟机使配置生效。
    - 对不支持该能力的实例记录例外，使用性能监控验证实际需求，不要因此放宽 NSG 或公网访问策略。
  reference:
    - https://docs.microsoft.com/en-us/azure/virtual-network/create-vm-accelerated-networking-cli
  metadata:
    vendor: microsoft
    product: azure-virtual-machines
  tags: cloud,devops,azure,microsoft,vm,azure-cloud-config

flow: |
  code(1);
  for (let VM of iterate(template.vmList)) {
    set("id", VM);
    code(2);
    }

self-contained: true
code:
  - engine:
      - sh
      - bash
    source: |
      az vm list --query '[*].{"id":id}'

    extractors:
      - type: json
        name: vmList
        internal: true
        json:
          - '.[]'

  - engine:
      - sh
      - bash
    source: |
      az network nic show --ids "$id" --query 'enableAcceleratedNetworking'

    matchers-condition: and
    matchers:
      - type: word
        words:
          - 'false'

    extractors:
      - type: dsl
        dsl:
          - 'enabled: "false"'
