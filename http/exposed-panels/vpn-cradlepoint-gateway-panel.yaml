id: vpn-cradlepoint-gateway-panel

info:
  name: CradlePoint 网关登录面板识别（指纹识别）
  author: rxerium
  severity: info
  description: |-
    CradlePoint 网关 是 Cradlepoint 蜂窝网关管理入口，用于 WAN、VPN、路由和设备远程运维。该模板请求首页，并依据 HTTP 200 状态码、页面标题、正文关键字或品牌资源特征识别目标是否部署了该系统或暴露了对应入口，适用于资产指纹确认；命中结果仅表示系统特征匹配，不代表已确认存在未授权访问或可利用漏洞。
  reference:
  - https://cradlepoint.com/products/netcloud-manager/
  metadata:
    max-request: 1
    shodan-query: http.title:"CradlePoint" http.html:"Administration Login"
  tags: panel,cradlepoint,gateway,vpn,router,detect

http:
  - method: GET
    path:
      - "{{BaseURL}}"

    matchers-condition: and
    matchers:
      - type: word
        part: body
        words:
          - 'CradlePoint'
          - 'cradlepoint.com'
        condition: or

      - type: status
        status:
          - 200
