id: file-disable-root-login

info:
  name: SSH root 直接登录未禁用（本地文件安全扫描）
  author: pussycat0x
  severity: high
  description: |
    该模板检查 SSH 是否允许 root 直接登录。直接开放 root 登录会扩大暴力破解和凭据泄露后的影响。
  remediation: |
    在 /etc/ssh/sshd_config 中设置 PermitRootLogin no，并重启 SSH 服务。
  reference:
    - https://vishalraj82.medium.com/hardening-openssh-security-37f5d634015f
    - https://www.tecmint.com/disable-or-enable-ssh-root-login-and-limit-ssh-access-in-linux/
  metadata:
    verified: true
  tags: audit,config,file,ssh

file:
  - extensions:
      - all

    matchers:
      - type: word
        words:
          - "PermitRootLogin yes"
