id: apache-licenserc

info:
  name: Apache License 文件泄露（暴露面识别）
  author: DhiyaneshDk
  severity: low
  description: 检测到对外可访问的 Apache License 文件。相关文件可能泄露项目结构、依赖关系、部署细节、敏感参数或其他不应公开的内部信息。
  metadata:
    verified: true
    max-request: 1
  tags: exposure,file,apache,vuln

http:
  - method: GET
    path:
      - '{{BaseURL}}/.licenserc.yaml'

    matchers-condition: and
    matchers:
      - type: word
        part: body
        words:
          - 'header:'
          - 'license:'
          - 'copyright-owner:'
        condition: and

      - type: status
        status:
          - 200
