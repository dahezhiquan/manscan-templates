id: gcloud-pubsub-publicly-accessible

info:
  name: 公开可访问 Pub/Sub Topics（云安全）
  author: princechaddha
  severity: high
  description: Pub/Sub topic IAM policy 中包含 allUsers 或 allAuthenticatedUsers 会让匿名或任意已认证用户获得主题相关权限。本模板枚举项目 topic，并检查 IAM policy members 是否包含这些公开主体。
  impact: |
    - 未授权用户可能发布、读取相关元数据或根据所授角色影响消息流，导致数据泄露、垃圾消息注入或业务干扰。
    - 公开授权会绕过项目身份边界，增加消息系统被枚举和滥用的概率。
  remediation: |
    - 从 Pub/Sub topic IAM policy 中移除 allUsers 和 allAuthenticatedUsers。
    - 仅向明确的服务账号、组或受控身份授予最小 Pub/Sub 角色，并定期审计 topic 级授权。
  reference:
    - https://cloud.google.com/pubsub/docs/access-control
  metadata:
    vendor: google
    product: google-cloud-pubsub
  tags: cloud,devops,gcp,gcloud,google-cloud-pubsub,gcp-cloud-config

flow: |
  code(1)
  for(let projectId of iterate(template.projectIds)){
    set("projectId", projectId)
    code(2)
    for(let topic of iterate(template.pubsubTopics)){
      set("pubsubTopic", topic)
      code(3)
    }
  }

self-contained: true

code:
  - engine:
      - sh
      - bash
    source: |
      gcloud projects list --format="json(projectId)"

    extractors:
      - type: json
        name: projectIds
        internal: true
        json:
          - '.[].projectId'

  - engine:
      - sh
      - bash
    source: |
      gcloud pubsub topics list --project $projectId --format="json(name)"

    extractors:
      - type: json
        name: pubsubTopics
        internal: true
        json:
          - '.[].name'

  - engine:
      - sh
      - bash
    source: |
      gcloud pubsub topics get-iam-policy $pubsubTopic --format=json | jq '.bindings[].members[]'

    matchers:
      - type: word
        words:
          - 'allUsers'
          - 'allAuthenticatedUsers'
        condition: or

    extractors:
      - type: dsl
        dsl:
          - '"Publicly Accessible Pub/Sub Topic found: " + pubsubTopic + " in project: " + projectId'
