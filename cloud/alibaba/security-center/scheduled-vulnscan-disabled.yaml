id: scheduled-vulnscan-disabled

info:
  name: 阿里云安全中心定时漏洞扫描未启用（云安全）
  author: DhiyaneshDK
  severity: medium
  description: 安全中心未启用定时漏洞扫描时，ECS 等服务器上的系统、软件和组件漏洞可能无法被持续发现。模板调用 DescribeVulConfig，当 Config 为 off 时判定定时漏洞扫描未启用。
  impact: |
    - 新出现或重新暴露的漏洞可能长期未被发现，增加被已知漏洞利用的时间窗口。
    - 漏洞治理依赖人工扫描，容易遗漏资产和影响修复 SLA。
  remediation: |
    - 在安全中心开启定时漏洞扫描，并覆盖 Linux、Windows 和应用软件等需要管理的漏洞类型。
    - 根据业务维护窗口配置扫描频率和通知方式，扫描后跟踪修复、复测和风险接受记录。
  reference:
    - https://www.alibabacloud.com/help/en/security-center/user-guide/scan-for-vulnerabilities
    - https://www.trendmicro.com/cloudoneconformity/knowledge-base/alibaba-cloud/AlibabaCloud-SecurityCenter/enable-scheduled-vulnerability-scan.html
  metadata:
    max-request: 1
    verified: true
    vendor: alibaba
    product: security-center
  tags: cloud,devops,aliyun,alibaba,alibaba-cloud-config,security-center

variables:
  region: "cn-hangzhou"

self-contained: true

code:
  - engine:
      - sh
      - bash
    source: |
      aliyun sas DescribeVulConfig --region $region

    matchers:
      - type: word
        name: policy
        words:
          - '"Config": "off"'

    extractors:
      - type: dsl
        dsl:
          - '"Scheduled Vulnerability Scan is Disabled "'
