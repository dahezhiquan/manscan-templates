id: arcane-login-panel

info:
  name: Arcane 登录面板识别（暴露面识别）
  author: Kazgangap
  severity: info
  description: |
    该模板通过识别 Arcane 登录入口的页面标题、特征文本或重定向行为，判断目标是否暴露了对应的认证界面。若命中，说明该登录面板对外可访问，可用于暴露面梳理与后续安全评估。
  metadata:
    max-request: 1
    verified: true
    fofa-query: icon_hash=="-313371739"
    shodan-query: http.favicon.hash:-313371739
  tags: arcane,login-panel,docker

http:
  - method: GET
    path:
      - "{{BaseURL}}/auth/login"

    matchers:
      - type: dsl
        dsl:
          - 'contains_any(tolower(body), "/arcane.png", "Sign in to Arcane", "alt=\"Arcane")'
          - 'status_code == 200'
        condition: and
