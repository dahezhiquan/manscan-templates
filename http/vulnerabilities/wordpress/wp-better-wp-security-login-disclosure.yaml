id: wp-better-wp-security-login-disclosure

info:
  name: WordPress Solid Security < 9.0.1 - 未授权访问漏洞
  author: 0x_Akoko
  severity: medium
  description: |
    该模板用于检测 WordPress Solid Security < 9.0.1 - 未授权访问漏洞。该类漏洞通常源于认证、授权或会话校验逻辑不完整，使未授权用户可访问受保护接口或执行敏感操作。模板会向 `/` 等位置发送探测请求，并结合响应状态、关键字、错误信息、时间差或外带交互等证据判断目标是否受影响。
  impact: |
    - 攻击者可绕过登录或权限限制，访问管理功能、敏感数据或业务操作接口。
    - 在管理接口暴露的场景下，可能进一步导致配置被篡改、账号被接管或系统被植入后门。
  remediation: |
    - 在服务端统一执行认证和授权校验，避免仅依赖前端控制或可预测参数。
    - 修复存在绕过问题的版本，并限制管理接口、调试接口和敏感 API 的访问来源。
    - 审计异常登录、权限变更和配置修改记录，轮换可能受影响的账号凭据。
  reference:
    - https://wordpress.org/plugins/better-wp-security/
    - https://wpscan.com/vulnerability/b7201fc1-d825-484f-aca9-ba14a968179b/
  classification:
    cvss-metrics: CVSS:3.1/AV:N/AC:L/PR:N/UI:N/S:U/C:L/I:N/A:N
    cvss-score: 5.3
    cwe-id: CWE-200
  metadata:
    verified: true
    max-request: 1
  tags: wordpress,wp-plugin,exposure,ithemes,solid-security

http:
  - method: GET
    path:
      - "{{BaseURL}}/"

    host-redirects: true
    max-redirects: 3

    matchers:
      - type: dsl
        dsl:
          - 'status_code == 200'
          - 'contains(body, "itsec-hb-token=")'
        condition: and

    extractors:
      - type: regex
        name: secret-login-slug
        part: body
        group: 1
        regex:
          - 'itsec-hb-token=([a-zA-Z0-9_-]+)'
