id: romm-panel

info:
  name: RomM 面板识别（指纹识别）
  author: ChrisJr404
  severity: info
  description: |-
    RomM 是自托管 ROM 与游戏库管理平台，用于游戏资源、元数据和媒体库管理。该模板请求 `/api/heartbeat` 路径，并依据 DSL 条件识别目标是否部署了该系统或暴露了对应入口，适用于资产指纹确认；命中结果仅表示系统特征匹配，不代表已确认存在未授权访问或可利用漏洞。
  reference:
  - https://github.com/rommapp/romm
  - https://romm.app/
  - https://docs.romm.app/
  metadata:
    verified: true
    max-request: 1
    vendor: rommapp
    product: romm
    shodan-query: http.title:"RomM"
    fofa-query: title="RomM"
  tags: panel,romm,rom,selfhosted,detect,discovery

http:
  - method: GET
    path:
      - "{{BaseURL}}/api/heartbeat"

    matchers:
      - type: dsl
        dsl:
          - 'status_code == 200'
          - 'contains(content_type, "application/json")'
          - 'contains_all(body, "\"SHOW_SETUP_WIZARD\"", "\"METADATA_SOURCES\"", "\"IGDB_API_ENABLED\"", "\"FS_PLATFORMS\"")'
        condition: and

    extractors:
      - type: regex
        part: body
        group: 1
        regex:
          - '"VERSION"\s*:\s*"([^"]+)"'
