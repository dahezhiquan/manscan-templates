id: zelle-phish

info:
  name: Zelle 仿冒钓鱼网站（钓鱼网站识别）
  author: rxerium
  severity: info
  description: |
    检测到疑似仿冒 Zelle 的钓鱼网站。模板在目标页面返回 200、页面内容命中 Zelle 的金融或支付页面特征，且当前主机不属于 zellepay.com 官方域名时触发，用于识别借用 Zelle 品牌页面诱导用户信任的仿冒站点。
  reference:
    - https://zellepay.com
  metadata:
    max-request: 1
  tags: phishing,zelle,osint,discovery
http:
  - method: GET
    path:
      - "{{BaseURL}}"

    host-redirects: true
    max-redirects: 2

    matchers-condition: and
    matchers:
      - type: word
        words:
          - "Zelle® is a direct and fast way to send and receive money with enrolled friends, family and others you trust. Look for Zelle® in your banking app to get started."
          - 'Send money with Zelle'
        condition: or

      - type: status
        status:
          - 200

      - type: dsl
        dsl:
          - '!contains(host,"zellepay.com")'
