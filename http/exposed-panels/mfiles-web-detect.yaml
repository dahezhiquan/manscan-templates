id: mfiles-web-detect

info:
  name: M-Files Web 登录面板识别（暴露面识别）
  author: Nodauf
  severity: info
  description: 该模板通过识别 M-Files Web 登录入口的页面标题、特征文本或重定向行为，判断目标是否暴露了对应的认证界面。若命中，说明该登录面板对外可访问，可用于暴露面梳理与后续安全评估。
  reference:
    - https://www.m-files.com/about/trust-center/security-advisories/
  classification:
    cvss-metrics: CVSS:3.0/AV:N/AC:L/PR:N/UI:N/S:U/C:N/I:N/A:N
    cwe-id: CWE-200
    cpe: cpe:2.3:a:m-files:m-files:*:*:*:*:*:*:*:*
  metadata:
    verified: true
    max-request: 2
    vendor: m-files
    product: m-files
    shodan-query:
      - http.html:"M-Files Web"
      - http.html:"m-files web"
    fofa-query: body="m-files web"
  tags: panel,m-files,discovery

http:
  - method: GET
    path:
      - "{{BaseURL}}"
      - "{{BaseURL}}/Login.aspx"

    stop-at-first-match: true

    matchers-condition: or
    matchers:
      - type: regex
        part: body
        regex:
          - '<title>(.*)M-Files Web(.*)</title>'

      - type: word
        part: body
        words:
          - 'M-Files user'
          - 'M-Files authentication'
        condition: or
