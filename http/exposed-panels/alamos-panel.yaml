id: alamos-panel

info:
  name: Alamos GmbH 面板识别（指纹识别）
  author: Splint3r7
  severity: info
  description: |
    该模板通过识别 Alamos GmbH 面板、控制台或管理界面的页面特征，判断目标是否暴露了对应服务入口。若命中，说明该后台或运维界面对外可访问，可用于资产识别与暴露面排查。
  classification:
    cwe-id: CWE-200
  metadata:
    max-request: 1
    shodan-query: http.title:"Alamos GmbH | FE2"
  tags: panel,alamos,login,detect,discovery

http:
  - method: GET
    path:
      - "{{BaseURL}}"

    matchers:
      - type: dsl
        dsl:
          - 'contains(body, "<title>Alamos GmbH | FE2")'
          - 'status_code == 200'
        condition: and
