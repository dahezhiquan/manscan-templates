id: gcloud-sql-contained-db-authentication-enabled

info:
  name: SQL Server 数据库实例启用了包含数据库身份验证（云安全）
  author: princechaddha
  severity: medium
  description: SQL Server contained database authentication 允许数据库级用户独立于实例登录名进行身份验证，启用后会增加账号治理复杂度。本模板检查 Cloud SQL SQL Server 实例 databaseFlags 中 contained database authentication 的值，匹配 on 时报告该功能已启用。
  impact: |
    - 数据库内账号可能绕过集中登录治理，增加弱口令、孤立账号和权限审计遗漏风险。
    - 迁移或复制数据库时，包含用户可能被带到其他环境，扩大非预期访问面。
  remediation: |
    - 关闭 contained database authentication，除非业务明确依赖该功能。
    - 对确需启用的数据库建立账号清单、强口令策略、权限复核和审计告警。
  reference:
    - https://cloud.google.com/sql/docs/sqlserver/flags
  metadata:
    vendor: google
    product: cloud-sql
  tags: cloud,devops,gcp,gcloud,google-cloud-sql,mssql,gcp-cloud-config

flow: |
  code(1)
  for(let projectId of iterate(template.projectIds)){
    set("projectId", projectId)
    code(2)
    for(let sqlInstance of iterate(template.sqlInstances)){
      set("sqlInstance", sqlInstance)
      code(3)
    }
  }

self-contained: true

code:
  - engine:
      - sh
      - bash
    source: |
      gcloud projects list --format="json(projectId)"

    extractors:
      - type: json
        name: projectIds
        internal: true
        json:
          - '.[].projectId'

  - engine:
      - sh
      - bash
    source: |
      gcloud sql instances list --project $projectId --filter=DATABASE_VERSION:SQLSERVER* --format="json(name)"

    extractors:
      - type: json
        name: sqlInstances
        internal: true
        json:
          - '.[].name'

  - engine:
      - sh
      - bash
    source: |
      gcloud sql instances describe $sqlInstance --project $projectId --format=json | jq -r '.settings.databaseFlags[]? | select(.name=="contained database authentication") | .value // "null"'

    matchers:
      - type: word
        words:
          - 'on'

    extractors:
      - type: dsl
        dsl:
          - '"The contained database authentication flag is enabled for SQL Server instance " + sqlInstance + " in project " + projectId'
