id: minimum-password-age-zero

info:
  name: 密码最短使用天数为零（本地基线扫描）
  author: princechaddha
  severity: medium
  description: |
    用户可立即多次改密绕过密码历史限制。对应基线项为“最短密码使用天数是否为 0”；模板执行 `net accounts` 解析账户锁定或密码策略，命中超出基线的阈值时判定不合规。
  impact: |
    - 攻击者或用户可能快速循环密码以恢复旧密码，削弱密码历史策略。
    - 凭据保护不足会增加横向移动、远程登录和离线破解风险。
  remediation: |
    - 设置大于 0 的最短密码使用天数，例如 1 天或组织基线值。
    - 变更策略后清理历史凭据，并轮换可能受影响的账户密码。
  tags: windows,password,policy,code,windows-audit

self-contained: true

code:
  - pre-condition: |
      IsWindows();
    engine:
      - cmd
    args:
      - /c
    pattern: "*.cmd"
    source: |
      net accounts

    matchers-condition: and
    matchers:
      - type: word
        words:
          - "Minimum password age (days):                          0"
        negative: true

      - type: word
        words:
          - "Minimum password age"
