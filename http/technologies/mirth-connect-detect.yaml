id: mirth-connect-detect

info:
  name: Mirth Connect 指纹识别（指纹识别）
  author: rxerium
  severity: info
  description: >-
    Mirth Connect 是医疗接口集成引擎，用于在 HL7、FHIR 和其他医疗系统之间转换与路由数据。该模板通过请求目标服务并检查预设路径或首页响应、页面正文关键字、状态码等指纹特征，判断目标是否使用或暴露了
    Mirth Connect 相关组件；命中结果仅表示指纹特征匹配，可用于资产盘点、技术栈识别和后续安全评估，不代表已确认存在可利用漏洞。
  metadata:
    verified: true
    max-request: 1
    product: mirth_connect
    shodan-query: title:"mirth connect administrator"
  tags: mirth-connect,tech,detect,discovery
http:
  - method: GET
    path:
      - "{{BaseURL}}"

    matchers-condition: and
    matchers:
      - type: word
        part: body
        words:
          - "<title>Mirth Connect Administrator</title>"

      - type: status
        status:
          - 200
