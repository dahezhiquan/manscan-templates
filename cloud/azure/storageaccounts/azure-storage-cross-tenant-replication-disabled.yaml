id: azure-storage-cross-tenant-replication-disabled
info:
  name: Azure Storage 跨租户复制已启用（云安全）
  author: princechaddha
  severity: high
  description: Azure Storage 跨租户对象复制允许 Blob 数据复制到其他 Microsoft Entra 租户的存储账户，配置不受控时可能突破组织预期的数据边界。本模板枚举存储账户并查询 allowCrossTenantReplication，在返回 true 时报告。
  impact: |
    - 数据可能被复制到其他租户的账户，增加跨租户数据泄露、错误授权和合规边界失控风险。
    - 若源账户或复制规则遭到滥用，攻击者可能利用复制链路扩大数据传播范围并降低撤销访问的及时性。
  remediation: |
    - 对不需要跨租户复制的账户将 allowCrossTenantReplication 设置为 false。
    - 对确需复制的场景核验目标租户、目标账户、复制规则和数据分类，并持续审计跨租户授权与配置变更。
  reference:
    - https://docs.microsoft.com/en-us/azure/storage/common/storage-redundancy
  metadata:
    vendor: microsoft
    product: azure-storage
  tags: cloud,devops,azure,microsoft,storage,azure-cloud-config

flow: |
  code(1);
  for (let StorageAccount of iterate(template.storageAccountList)) {
    StorageAccount = JSON.parse(StorageAccount);
    set("name", StorageAccount.Name);
    code(2);
  }

self-contained: true
code:
  - engine:
      - sh
      - bash
    source: |
      az storage account list --query '[*].{"Name":name}'

    extractors:
      - type: json
        name: storageAccountList
        internal: true
        json:
          - '.[]'

  - engine:
      - sh
      - bash
    source: |
      az storage account show --name "$name" --query 'allowCrossTenantReplication'

    matchers:
      - type: word
        words:
          - 'true'

    extractors:
      - type: dsl
        dsl:
          - '"Cross-Tenant Replication is enabled for " + name + ", posing a security risk"'
