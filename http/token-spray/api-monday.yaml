id: api-monday

info:
  name: Monday API Token 可用性校验（token喷洒）
  author: daffainfo
  severity: info
  description: 该模板通过调用 Monday API 的已知接口验证提供的 token 是否有效，命中后通常表示可访问协作、任务或项目管理能力。
  reference:
    - https://api.developer.monday.com/docs
    - https://github.com/daffainfo/all-about-apikey/tree/main/monday
  metadata:
    max-request: 1
  tags: token-spray,monday

self-contained: true

http:
  - raw:
      - |
        POST https://api.monday.com/v2 HTTP/1.1
        Host: api.monday.com
        Authorization: {{token}}
        Content-Type: application/json

        {"query": "query { me { is_guest created_at name id}}"}

    matchers:
      - type: word
        part: body
        words:
          - '"me"'
          - '"name"'
          - '"account_id"'
        condition: and
