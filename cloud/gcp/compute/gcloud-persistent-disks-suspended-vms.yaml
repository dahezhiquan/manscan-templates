id: gcloud-persistent-disks-suspended-vms

info:
  name: Persistent Disks Attached to Suspended Virtual Machines（云安全）
  author: princechaddha
  severity: high
  description: 该规则用于检查 GCP compute 相关资源是否满足推荐的云安全与合规配置要求，命中通常表示当前配置仍存在可改进的风险项。
  impact: |
    - 当前配置偏离推荐的云安全基线，可能增加攻击面、审计缺口或运维失误带来的风险。
    - 具体影响取决于受影响资源的重要性、暴露范围以及周边安全控制是否到位。
  remediation: |
    - 参考云厂商安全基线和官方文档修正当前配置偏差。
    - 建议结合资源标签、自动化检测与周期性审计，持续跟踪该类风险项的整改状态。
  reference:
    - https://cloud.google.com/compute/docs/disks
  tags: cloud,devops,gcp,gcloud,compute,storage,cost-optimization,gcp-cloud-config

flow: |
  code(1)
  for(let projectId of iterate(template.projectIds)){
    set("projectId", projectId)
    code(2)
    for(let disk of iterate(template.disks)){
      disk = JSON.parse(disk)
      set("diskName", disk.name)
      set("zone", disk.zone)
      code(3)
      for(let instanceUrl of iterate(template.instanceUrls)){
        set("instanceUrl", instanceUrl)
        code(4)
      }
    }
  }

self-contained: true

code:
  - engine:
      - sh
      - bash
    source: |
      gcloud projects list --format="json(projectId)"

    extractors:
      - type: json
        name: projectIds
        internal: true
        json:
          - '.[].projectId'

  - engine:
      - sh
      - bash
    source: |
      gcloud compute disks list --project $projectId --format="json(name,zone.basename())"

    extractors:
      - type: json
        name: disks
        internal: true
        json:
          - '.[]'

  - engine:
      - sh
      - bash
    source: |
      gcloud compute disks describe $diskName --zone $zone --project $projectId --format="json(users[])" | jq -r '.[] // "null"'

    extractors:
      - type: json
        name: instanceUrls
        internal: true
        json:
          - '.[]'

  - engine:
      - sh
      - bash
    source: |
      gcloud compute instances describe $instanceUrl --zone $zone --project $projectId --format="json(status)"

    matchers:
      - type: word
        words:
          - "SUSPENDED"
          - "SUSPENDING"
        condition: or

    extractors:
      - type: dsl
        dsl:
          - '"Persistent disk " + diskName + " is attached to suspended VM instance in zone " + zone + " of project " + projectId'
