id: f5-admin-interface

info:
  name: F5 Admin Interface 识别（指纹识别）
  author: drewvravick,righettod
  severity: info
  description: |-
    检测到目标站点存在 F5 Admin Interface 相关响应特征。F5 BIG-IP Configuration Utility 是 F5 BIG-IP 的 Web 管理控制台，用于配置负载均衡、流量策略、证书和设备运行参数。模板请求 `/tmui/login.jsp`，并通过页面标题或正文关键字、状态码确认该系统指纹，用于资产识别、系统盘点和暴露面梳理。
  metadata:
    verified: true
    max-request: 1
    shodan-query: html:"BIG-IP Configuration Utility"
  tags: f5,admin,detect,panel,login,discovery
http:
  - method: GET
    path:
      - "{{BaseURL}}/tmui/login.jsp"

    redirects: true
    max-redirects: 2

    matchers-condition: and
    matchers:
      - type: word
        part: body
        words:
          - 'Configuration Utility'
          - 'F5 Networks'
        condition: and

      - type: status
        status:
          - 200

    extractors:
      - type: regex
        part: body
        group: 1
        regex:
          - 'Copyright\s+([0-9\-]+),'
