id: api-safebrowsing

info:
  name: Google Safe Browsing API Token 可用性校验（token喷洒）
  author: daffainfo
  severity: info
  description: 该模板通过调用 Google Safe Browsing API 的已知接口验证提供的 token 是否有效，命中后通常表示可访问相关 API 能力。
  reference:
    - https://developers.google.com/books/docs/overview
    - https://github.com/daffainfo/all-about-apikey/tree/main/google-safe-browsing
  metadata:
    max-request: 1
  tags: token-spray,google,safebrowsing

self-contained: true

http:
  - raw:
      - |
        POST https://safebrowsing.googleapis.com/v4/threatListUpdates:fetch?key={{token}} HTTP/1.1
        Host: safebrowsing.googleapis.com
        Content-Type: application/json

    matchers:
      - type: word
        part: body
        words:
          - '"clientId"'
          - '"clientVersion"'
        condition: and
