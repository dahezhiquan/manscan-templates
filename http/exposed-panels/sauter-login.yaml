id: sauter-login

info:
  name: Sauter moduWeb 登录面板识别（暴露面识别）
  author: DhiyaneshDk
  severity: info
  description: 该模板通过识别 Sauter moduWeb 登录入口的页面标题、特征文本或重定向行为，判断目标是否暴露了对应的认证界面。若命中，说明该登录面板对外可访问，可用于暴露面梳理与后续安全评估。
  reference:
    - https://www.exploit-db.com/ghdb/6883
  classification:
    cvss-metrics: CVSS:3.0/AV:N/AC:L/PR:N/UI:N/S:U/C:N/I:N/A:N
    cwe-id: CWE-200
  metadata:
    max-request: 1
  tags: panel,sauter,edb,discovery

http:
  - method: GET
    path:
      - "{{BaseURL}}/?locale=en"

    matchers-condition: and
    matchers:
      - type: word
        words:
          - <title>Sauter moduWeb - Login</title>
        part: body

      - type: status
        status:
          - 200
