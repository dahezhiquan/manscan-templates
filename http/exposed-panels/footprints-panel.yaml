id: footprints-panel

info:
  name: FootPrints Service Core 登录面板识别（指纹识别）
  author: tess
  severity: info
  description: 该模板通过识别 FootPrints Service Core 登录入口的页面标题、特征文本或重定向行为，判断目标是否暴露了对应的认证界面。若命中，说明该登录面板对外可访问，可用于暴露面梳理与后续安全评估。
  classification:
    cvss-metrics: CVSS:3.0/AV:N/AC:L/PR:N/UI:N/S:U/C:N/I:N/A:N
    cwe-id: CWE-200
    cpe: cpe:2.3:a:bmc:footprints_service_core:*:*:*:*:*:*:*:*
  metadata:
    verified: true
    max-request: 2
    shodan-query: title:"FootPrints Service Core Login"
    product: footprints_service_core
    vendor: bmc
  tags: tech,panel,footprints,discovery

http:
  - method: GET
    path:
      - '{{BaseURL}}/MRcgi/MRlogin.pl'
      - '{{BaseURL}}/MRcgi/MRentrancePage.pl'

    stop-at-first-match: true

    matchers-condition: and
    matchers:
      - type: word
        part: body
        words:
          - 'FootPrints Service Core Login'

      - type: status
        status:
          - 200
