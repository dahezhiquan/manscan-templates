id: api-square

info:
  name: Square API Token 可用性校验（token喷洒）
  author: zzeitlin
  severity: high
  description: |-
    平台介绍：Square API 是面向支付、金融连接或商业交易的服务平台，常用于管理账户、交易、客户、地址、订单或支付相关资源。该模板用于校验提交的 Square API Token 是否仍然有效。检测逻辑会向 `connect.squareup.com/v2/locations` 发起低影响 API 请求，通过 Bearer Token 认证头传递 `{{token}}`，并依据响应中的 `errors` 判断凭据是否可用；命中通常表示该 Token 可被继续调用对应平台能力。
  reference:
    - https://developer.squareup.com/explorer/square/locations-api/list-locations
    - https://github.com/daffainfo/all-about-apikey/tree/main/square
  metadata:
    max-request: 2
  tags: token-spray,square
  impact: |-
    - 攻击者可利用有效 Token 读取账户、客户、交易、地址或支付相关数据。
    - 若 Token 具备写权限，可能创建交易、修改配置、滥用付费额度并触发财务损失。
  remediation: |-
    - 立即撤销或轮换已暴露的 API Token，并确认旧 Token 不再可用。
    - 按最小权限原则重新签发凭据，限制作用域、来源地址、项目范围和有效期。
    - 在代码仓库、CI/CD、日志和配置文件中排查泄露来源，避免 Token 再次提交或外传。
    - 检查近期 API 调用、资源变更、账单和权限配置，确认是否存在异常操作。
self-contained: true

http:
  - method: GET
    path:
      - "https://connect.squareup.com/v2/locations"
      - "https://connect.squareupsandbox.com/v2/locations"

    headers:
      Content-Type: application/json
      Authorization: Bearer {{token}}
    matchers:
      - type: word
        part: body
        words:
          - 'errors'
        negative: true
