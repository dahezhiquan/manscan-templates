id: api-userstack

info:
  name: User Stack API Token 可用性校验（token喷洒）
  author: 0xpugal
  severity: high
  reference:
    - https://userstack.com/documentation
  metadata:
    max-request: 1
  tags: token-spray,userstack
  description: |-
    平台介绍：User Stack API 是面向地图、地理位置、天气、地址解析或设备识别的数据服务平台，常用于查询位置、路线、地理编码、环境或终端信息。该模板用于校验提交的 User Stack API Token 是否仍然有效。检测逻辑会向 `api.userstack.com/api/detect` 发起低影响 API 请求，通过查询参数中的 API Key/Token 传递 `{{token}}`，并依据响应中的 `"ua":`、`"name":`、`"brand":` 判断凭据是否可用；命中通常表示该 Token 可被继续调用对应平台能力。
  impact: |-
    - 攻击者可确认 Token 有效并调用平台 API，读取账户、资源、配额或业务数据。
    - 有效 Token 可能被持续滥用，造成数据泄露、配额消耗、费用增加、服务滥用或进一步横向访问。
  remediation: |-
    - 立即撤销或轮换已暴露的 API Token，并确认旧 Token 不再可用。
    - 按最小权限原则重新签发凭据，限制作用域、来源地址、项目范围和有效期。
    - 在代码仓库、CI/CD、日志和配置文件中排查泄露来源，避免 Token 再次提交或外传。
self-contained: true

http:
  - method: GET
    path:
      - "http://api.userstack.com/api/detect?access_key={{token}}&ua=Mozilla/5.0%20(Macintosh;%20Intel%20Mac%20OS%20X%2010_14_0)%20AppleWebKit/537.36%20(KHTML,%20like%20Gecko)%20Chrome/71.0.3578.98%20Safari/537.36"

    matchers:
      - type: word
        part: body
        words:
          - '"ua":'
          - '"name":'
          - '"brand":'
        condition: and
