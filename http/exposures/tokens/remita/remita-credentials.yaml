id: remita-credentials

info:
  name: Remita Merchant ID & API 密钥 暴露（暴露面识别）
  author: Lloydcoder
  severity: low
  description: |
    检测到页面中疑似暴露了 Remita Merchant ID & API 密钥。如果相关密钥、令牌或凭据仍然有效，攻击者可能借此访问关联服务、调用接口、读取数据，或进一步对目标环境发起横向利用。
  reference:
    - https://api.remita.net/
  tags: exposure,remita,fintech,tinlance,lloydcoder,token

http:
  - method: GET
    path:
      - "{{BaseURL}}"

    redirects: true

    matchers-condition: and
    matchers:
      - type: regex
        regex:
          - "merchantId[\"']?\\s*[:=]\\s*[\"']?\\d{10,}[\"']?"

      - type: word
        words:
          - "remita"
          - "merchantId"
          - "publicKey"
        condition: or
        case-insensitive: true
