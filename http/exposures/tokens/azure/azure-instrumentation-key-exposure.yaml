id: azure-instrumentation-key-exposure

info:
  name: Azure Instrumentation 密钥 暴露（暴露面识别）
  author: pussycat0x
  severity: medium
  description: |
    检测到页面中疑似暴露了 Azure Instrumentation 密钥。如果相关密钥、令牌或凭据仍然有效，攻击者可能借此访问关联服务、调用接口、读取数据，或进一步对目标环境发起横向利用。
  reference:
    - https://learn.microsoft.com/en-us/azure/azure-monitor/app/connection-strings
    - http://www.medic-consulting.com/2016/07/10/Share-Asp-Net-Core-appsettings-json-with-Service-Fabric-Microservices/
  metadata:
    max-request: 2
    verified: true
  tags: exposure,azure,instrumentation,appinsights,token

http:
  - method: GET
    path:
      - "{{BaseURL}}"
      - "{{BaseURL}}/appsettings.json"

    stop-at-first-match: true
    matchers-condition: and
    matchers:
      - type: word
        part: body
        words:
          - 'InstrumentationKey'
          - 'instrumentationKey'
          - 'APPINSIGHTS_INSTRUMENTATIONKEY'
          - '<InstrumentationKey>'
        condition: or

      - type: regex
        part: body
        regex:
          - 'instrumentationKey:"([0-9a-z-]+)"'
          - '<InstrumentationKey>(.*)</InstrumentationKey>'
          - 'APPINSIGHTS_INSTRUMENTATIONKEY=([a-z0-9-]+)'
          - 'InstrumentationKey": "([0-9a-z-]+)"'
        condition: or

      - type: status
        status:
          - 200

    extractors:
      - type: regex
        part: body
        group: 1
        regex:
          - 'instrumentationKey:"([0-9a-z-]+)"'
          - '<InstrumentationKey>(.*)</InstrumentationKey>'
          - 'APPINSIGHTS_INSTRUMENTATIONKEY=([a-z0-9-]+)'
          - 'InstrumentationKey": "([0-9a-z-]+)"'
