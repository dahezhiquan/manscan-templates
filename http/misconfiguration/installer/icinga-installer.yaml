id: icinga-installer

info:
  name: Icinga Web 2 安装向导 暴露
  author: pussycat0x
  severity: high
  description: |
    检测到 Icinga Web 2 安装向导 暴露。该页面属于安装、初始化或配置向导流程，若对外暴露，攻击者可能完成初始化、创建管理员账户或重新配置目标系统。
  reference:
    - https://icinga.com/docs/icinga-web/latest/doc/02-Installation/
  classification:
    cwe-id: CWE-200
    cvss-metrics: CVSS:3.1/AV:N/AC:L/PR:N/UI:N/S:U/C:L/I:N/A:N
    cvss-score: 5.3
  metadata:
    verified: true
    max-request: 2
    shodan-query: http.title:"Icinga Web 2"
    fofa-query: body="Welcome to the configuration of Icinga Web 2"
    product: icinga_web_2
    vendor: icinga
  tags: icinga,exposure,misconfig,installer

http:
  - method: GET
    path:
      - "{{BaseURL}}/icingaweb2/setup"
      - "{{BaseURL}}/setup"

    stop-at-first-match: true

    matchers-condition: and
    matchers:
      - type: word
        part: body
        words:
          - "Welcome to the configuration of Icinga Web 2"
          - "Setup Token"
        condition: and

      - type: status
        status:
          - 200
