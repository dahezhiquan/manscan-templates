id: vmware-horizon-version

info:
  name: VMware Horizon 指纹识别（指纹识别）
  author: veshraj
  severity: info
  description: >-
    VMware Horizon 是虚拟桌面和应用交付平台，用于远程访问桌面、应用和企业工作空间。该模板通过请求目标服务并检查预设路径或首页响应、正则特征等指纹特征，判断目标是否使用或暴露了
    VMware Horizon 相关组件；命中结果仅表示指纹特征匹配，可用于资产盘点、技术栈识别和后续安全评估，不代表已确认存在可利用漏洞。
  classification:
    cpe: cpe:2.3:a:vmware:horizon_view:*:*:*:*:*:*:*:*
  metadata:
    verified: true
    max-request: 1
    vendor: vmware
    product: horizon_view
    shodan-query: title:"Vmware Horizon"
  tags: vmware,tech,discovery
http:
  - method: GET
    path:
      - "{{BaseURL}}/portal/info.jsp"

    extractors:
      - type: regex
        regex:
          - '"clientVersion":"[^"]*"'
