id: azure-postgresql-storage-autogrow-disabled
info:
  name: Azure PostgreSQL 存储自动增长未启用（云安全）
  author: princechaddha
  severity: high
  description: Azure PostgreSQL 的 storageAutogrow 用于在存储空间接近上限时自动扩展容量，关闭后数据库可能因磁盘空间耗尽而停止写入。本模板枚举 PostgreSQL 服务器并查询 storageProfile.storageAutogrow，在返回值为 Disabled 时报告。
  impact: |
    - 数据库写入、事务提交、日志落盘和备份任务可能因空间不足失败，造成业务中断或数据处理延迟。
    - 突发数据增长时，人工扩容响应不及时可能导致应用错误、恢复压力和潜在的数据丢失风险。
  remediation: |
    - 根据容量、费用和业务恢复要求启用 storageAutogrow，并设置磁盘使用率和增长量监控。
    - 同时清理无用数据、规划容量预算并验证自动扩容后的性能和备份策略，避免依赖单一保护措施。
  reference:
    - https://docs.microsoft.com/en-us/azure/postgresql/concepts-storage
  metadata:
    vendor: microsoft
    product: azure-postgresql
  tags: cloud,devops,azure,microsoft,postgresql,azure-cloud-config

flow: |
  code(1);
  for (let ServerData of iterate(template.serverList)) {
    ServerData = JSON.parse(ServerData);
    set("name", ServerData.Name);
    set("resourceGroup", ServerData.ResourceGroup);
    code(2);
  }

self-contained: true
code:
  - engine:
      - sh
      - bash
    source: |
      az postgres server list --output json --query '[*].{"Name":name,"ResourceGroup":resourceGroup}'

    extractors:
      - type: json
        name: serverList
        internal: true
        json:
          - '.[]'

  - engine:
      - sh
      - bash
    source: |
      az postgres server show --name "$name" --resource-group "$resourceGroup" --output json --query 'storageProfile.storageAutogrow'

    matchers-condition: and
    matchers:
      - type: word
        words:
          - '"Disabled"'

    extractors:
      - type: dsl
        dsl:
          - 'name + " in " + resourceGroup + " has Storage Auto-Growth disabled"'
