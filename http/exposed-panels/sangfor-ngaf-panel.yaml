id: sangfor-ngaf-panel

info:
  name: 深信服下一代应用防火墙（NGAF）- 登录面板（暴露面识别）
  author: rxerium
  severity: info
  description: |-
    深信服 NGAF 是深信服科技推出的下一代应用防火墙和 SSL VPN 网关，广泛应用于亚太地区及中国企业。其管理门户经常暴露在非标准端口上。
  reference:
    - https://www.sangfor.com/en/product/network-security/next-gen-application-firewall
  metadata:
    max-request: 1
    shodan-query: http.title:"SANGFOR | NGAF"
  tags: panel,sangfor,ngaf,firewall,vpn,detect

http:
  - method: GET
    path:
      - "{{BaseURL}}"

    redirects: true
    max-redirects: 2


    matchers:
      - type: word
        part: body
        words:
          - 'SANGFOR | NGAF'
