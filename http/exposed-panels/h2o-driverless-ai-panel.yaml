id: h2o-driverless-ai-panel

info:
  name: H2O Driverless AI 面板 - 检测（指纹识别）
  author: rxerium
  severity: info
  description: |-
    检测到 H2O Driverless AI，这是一款商业自动化机器学习（AutoML）平台，通常通过 12345 端口提供 Web 界面，用于构建和部署机器学习模型。发现了一个暴露在外的 H2O Driverless AI 登录面板。该产品区别于 H2O Wave 和 H2O-3/Flow，后者属于 H2O.ai 的独立产品，具有不同的品牌、端口和界面。
  reference:
    - https://h2o.ai/platform/ai-cloud/make/driverless-ai/
    - https://docs.h2o.ai/driverless-ai/latest-stable/docs/userguide/index.html
  metadata:
    verified: true
    max-request: 1
    vendor: h2o.ai
    product: driverless-ai
    shodan-query: 'http.title:"H2O.ai - Login"'
  tags: panel,h2o-driverless-ai,ml,ai,automl,detect,discovery

http:
  - method: GET
    path:
      - "{{BaseURL}}/login"

    host-redirects: true
    max-redirects: 2

    matchers-condition: and
    matchers:
      - type: word
        part: header
        words:
          - "Server: H2O Driverless AI"

      - type: word
        part: body
        words:
          - "DRIVERLESS AI"
        case-insensitive: true

      - type: status
        status:
          - 200
