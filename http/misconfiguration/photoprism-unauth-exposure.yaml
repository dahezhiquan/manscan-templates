id: photoprism-unauth-exposure

info:
  name: PhotoPrism 未授权 暴露
  author: pussycat0x
  severity: high
  description: |
    检测到 PhotoPrism 未授权 暴露。目标功能在未认证状态下可访问，可能暴露管理入口、业务数据、系统状态或可执行操作，需确认是否存在访问控制缺失。
  reference:
    - https://docs.photoprism.app/getting-started/config-options/#authentication
    - https://docs.photoprism.app/getting-started/
  classification:
    cvss-metrics: CVSS:3.1/AV:N/AC:L/PR:N/UI:N/S:U/C:H/I:N/A:N
    cvss-score: 7.5
    cwe-id: CWE-306
  metadata:
    verified: true
    max-request: 1
    vendor: photoprism
    product: photoprism
    shodan-query: title:"PhotoPrism"
    fofa-query: title="PhotoPrism"
    google-query: intitle:"PhotoPrism" inurl:"/library/browse"
  tags: photoprism,exposure,unauth,misconfig

http:
  - method: GET
    path:
      - "{{BaseURL}}/api/v1/config"

    matchers-condition: and
    matchers:
      - type: status
        status:
          - 200

      - type: word
        part: body
        words:
          - "PhotoPrism"
          - "\"public\":true"
          - "\"authMode\":\"public\""
        condition: and

      - type: word
        part: header
        words:
          - "application/json"
