id: azure-aks-kubernetes-version-outdated
info:
  name: Azure AKS Kubernetes 版本存在可用升级（云安全）
  author: princechaddha
  severity: low
  description: AKS 集群当前 Kubernetes 版本落后于 Azure 提供的可升级版本时，集群可能错过安全补丁、稳定性修复和受支持版本的维护周期。该模板调用 az aks get-upgrades，并在输出包含 upgrades 数组时报告存在可用 Kubernetes 版本升级。
  impact: |
    - 运行在旧版本上的控制平面和节点可能暴露于已知缺陷，且无法获得部分新版本的安全能力与平台支持。
    - 版本差距扩大后，插件、Admission 控制器和工作负载 API 兼容性问题可能集中出现，增加升级中断风险。
  remediation: |
    - 依据 AKS 生命周期和官方升级路径制定定期升级计划，先在预生产集群验证工作负载和插件兼容性。
    - 分阶段升级控制平面与节点池，检查 PodDisruptionBudget、容量、备份和回滚方案，升级后复核安全策略。
  reference:
    - https://docs.microsoft.com/en-us/azure/aks/kubernetes-service
  metadata:
    vendor: microsoft
    product: azure-kubernetes-service
  tags: cloud,devops,azure,microsoft,kubernetes,azure-cloud-config

flow: |
  code(1);
  for (let ClusterData of iterate(template.clusterList)) {
    ClusterData = JSON.parse(ClusterData);
    set("name", ClusterData.Name);
    set("resourceGroup", ClusterData.ResourceGroup);
    code(2);
  }

self-contained: true
code:
  - engine:
      - sh
      - bash
    source: |
      az aks list --query '[*].{"Name":name,"ResourceGroup":resourceGroup}'

    extractors:
      - type: json
        name: clusterList
        internal: true
        json:
          - '.[]'

  - engine:
      - sh
      - bash
    source: |
      az aks get-upgrades --name "$name" --resource-group "$resourceGroup" --output json

    matchers-condition: and
    matchers:
      - type: word
        words:
          - '"upgrades": ['

    extractors:
      - type: dsl
        dsl:
          - '"$name in $resourceGroup is not using the latest Kubernetes version"'
