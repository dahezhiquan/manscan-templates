id: brickcom-camera-default-login

info:
  name: Brickcom Camera 默认口令登录（弱口令）
  author: 0x_Akoko
  severity: high
  description: |
    该模板用于检测 Brickcom Camera 是否仍可使用默认凭据或弱口令登录。模板主要向 `/index_mjpg.html` 等认证入口发送请求，使用内置默认凭据组合进行认证尝试，并根据响应中的 `var viewer='admin'`、`Brickcom Corporation` 等登录成功特征判断登录是否成功；命中说明目标未及时修改出厂、示例或初始化账号口令。
  impact: |
    - 攻击者可接管 Brickcom Camera 的 Web 管理界面，查看设备状态、网络配置、运行日志或敏感业务参数。
    - 被接管的网络、工控、打印、语音、存储或远程管理设备可能被用于中断业务、改变路由/访问策略、窃取流量或作为内网横向移动入口。
  remediation: |
    - 立即修改所有默认账号口令，禁用不再使用的出厂账号，并为管理账户设置高强度唯一密码。
    - 将设备管理入口限制在 VPN、堡垒机或可信管理网段内，避免直接暴露到公网。
    - 升级设备固件或管理组件，审计近期登录记录、配置变更和异常会话。
  reference:
    - https://www.brickcom.com/support/faq_contents.php?id=48
    - https://cxsecurity.com/issue/WLB-2026020031
  metadata:
    verified: true
    max-request: 1
    shodan-query: 'realm="Brickcom"'
    fofa-query: 'title="Brickcom"'
  tags: iot,camera,default-login

http:
  - raw:
      - |
        GET /index_mjpg.html HTTP/1.1
        Host: {{Hostname}}
        Authorization: Basic YWRtaW46YWRtaW4=
        Connection: close

    matchers-condition: and
    matchers:
      - type: status
        status:
          - 200

      - type: word
        part: body
        condition: and
        words:
          - "var viewer='admin'"
          - "Brickcom Corporation"
          - "wledctl.cgi"
