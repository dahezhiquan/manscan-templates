id: microsoft-phish

info:
  name: Microsoft 仿冒钓鱼网站（钓鱼网站识别）
  author: rxerium
  severity: info
  description: |
    检测到疑似仿冒 Microsoft 的钓鱼网站。模板在目标页面返回 200、页面内容命中 Microsoft 的登录或账号页面特征，且当前主机不属于 office.com、microsoft.com 官方域名时触发，用于识别借用 Microsoft 品牌页面诱导用户信任的仿冒站点。
  reference:
    - https://office.com
    - https://microsoft.com
  metadata:
    max-request: 1
  tags: phishing,microsoft,osint,discovery
http:
  - method: GET
    path:
      - "{{BaseURL}}"

    host-redirects: true
    max-redirects: 2

    matchers-condition: and
    matchers:
      - type: word
        words:
          - 'Login | Microsoft 365'

      - type: status
        status:
          - 200

      - type: dsl
        dsl:
          - '!contains(host,"office.com")'
          - '!contains(host,"microsoft.com")'
