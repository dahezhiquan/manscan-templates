id: signal-phish

info:
  name: Signal 仿冒钓鱼网站（钓鱼网站识别）
  author: rxerium
  severity: info
  description: |
    检测到疑似仿冒 Signal 的钓鱼网站。模板在目标页面返回 200、页面内容命中 Signal 的品牌页面特征，且当前主机不属于 signal.org 官方域名时触发，用于识别借用 Signal 品牌页面诱导用户信任的仿冒站点。
  reference:
    - https://signal.org
  metadata:
    max-request: 1
  tags: phishing,signal,osint,discovery
http:
  - method: GET
    path:
      - "{{BaseURL}}"

    host-redirects: true
    max-redirects: 2

    matchers-condition: and
    matchers:
      - type: word
        words:
          - 'Say &quot;hello&quot; to a different messaging experience. An unexpected focus on privacy, combined with all of the features you expect.'

      - type: status
        status:
          - 200

      - type: dsl
        dsl:
          - '!contains(host,"signal.org")'
