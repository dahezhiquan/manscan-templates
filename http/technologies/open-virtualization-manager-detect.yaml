id: open-virtualization-manager-detect

info:
  name: Open Virtualization Manager 指纹识别（指纹识别）
  author: idealphase
  severity: info
  description: >-
    Open Virtualization Manager 是 oVirt 虚拟化管理平台，用于管理虚拟机、主机、存储和集群资源。该模板通过请求目标服务并检查预设路径或首页响应、页面正文关键字、正则特征等指纹特征，判断目标是否使用或暴露了
    Open Virtualization Manager 相关组件；命中结果仅表示指纹特征匹配，可用于资产盘点、技术栈识别和后续安全评估，不代表已确认存在可利用漏洞。
  reference:
  - https://www.ovirt.org/
  - https://www.ovirt.org/dropped/admin-guide/virt/console-client-resources.html
  classification:
    cvss-metrics: CVSS:3.0/AV:N/AC:L/PR:N/UI:N/S:U/C:N/I:N/A:N
    cvss-score: 0
    cwe-id: CWE-200
  metadata:
    max-request: 1
    shodan-query: title:"Ovirt-Engine"
    google-query: intitle:"Ovirt-Engine"
  tags: tech,ovirt,discovery
http:
  - method: GET
    path:
      - '{{BaseURL}}/ovirt-engine/'

    matchers-condition: and
    matchers:
      - type: word
        words:
          - "Welcome to Open Virtualization Manager"
          - "<title>Ovirt-Engine</title>"
          - "<title>oVirt Engine</title>"
          - "<title>oVirt Engine Error</title>"
        condition: or

    extractors:
      - type: regex
        group: 1
        regex:
          - '<span class="version-text">(.+)<\/span>'
