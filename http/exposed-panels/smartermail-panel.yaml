id: smartermail-panel

info:
  name: SmarterMail 登录面板识别（指纹识别）
  author: rxerium
  severity: info
  description: SmarterMail 是邮件服务器管理平台，用于邮箱、域、反垃圾邮件、Webmail 和邮件策略管理。该模板请求 `/Login.aspx`，并依据 HTTP 200 状态码、页面标题、正文关键字或品牌资源特征识别目标是否部署了该系统或暴露了对应入口，适用于资产指纹确认；命中结果仅表示系统特征匹配，不代表已确认存在未授权访问或可利用漏洞。
  reference:
  - https://www.smartertools.com/smartermail/business-email-server
  classification:
    cvss-metrics: CVSS:3.0/AV:N/AC:L/PR:N/UI:N/S:U/C:N/I:N/A:N
    cwe-id: CWE-200
    cpe: cpe:2.3:a:smartertools:smartermail:*:*:*:*:*:*:*:*
  metadata:
    max-request: 1
    shodan-query: http.title:"SmarterMail"
    product: smartermail
    vendor: smartertools
  tags: panel,smartermail,login,detect,discovery

http:
  - method: GET
    path:
      - "{{BaseURL}}/Login.aspx"

    matchers-condition: and
    matchers:
      - type: word
        part: body
        words:
          - "Login to SmarterMail"
          - "SmarterTools Inc."
        condition: and
        case-insensitive: true

      - type: status
        status:
          - 200

    extractors:
      - type: regex
        part: body
        group: 1
        regex:
          - 'SmarterMail\s+(?:Enterprise|Professional)\s+([0-9.]+)'
