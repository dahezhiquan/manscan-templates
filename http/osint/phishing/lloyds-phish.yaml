id: lloyds-phish

info:
  name: Lloyds Bank 仿冒钓鱼网站（钓鱼网站识别）
  author: rxerium
  severity: info
  description: |
    检测到疑似仿冒 Lloyds Bank 的钓鱼网站。模板在目标页面返回 200、页面内容命中 Lloyds Bank 的登录或账号页面特征，且当前主机不属于 lloydsbank.com 官方域名时触发，用于识别借用 Lloyds Bank 品牌页面诱导用户信任的仿冒站点。
  reference:
    - https://lloydsbank.com
  metadata:
    max-request: 1
  tags: phishing,lloyds,bank,osint,discovery
http:
  - method: GET
    path:
      - "{{BaseURL}}"

    host-redirects: true
    max-redirects: 2

    matchers-condition: and
    matchers:
      - type: word
        words:
          - "<title>Lloyds Bank - Personal Banking, Personal Finances &amp; Bank Accounts"

      - type: status
        status:
          - 200

      - type: dsl
        dsl:
          - '!contains(host,"lloydsbank.com")'
