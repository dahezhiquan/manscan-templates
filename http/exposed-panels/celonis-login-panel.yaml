id: celonis-login-panel

info:
  name: Celonis Login 面板（指纹识别）
  author: r3dg33k
  severity: info
  description: |-
    检测到目标站点存在 Celonis Login 相关响应特征。Celonis Login 是监控、日志、分析或可观测性系统，用于展示运行指标、告警事件、日志数据和服务状态。模板请求 `/welcome`，并通过页面标题或正文关键字、状态码确认该系统指纹，用于资产识别、系统盘点和暴露面梳理。
  reference: https://www.celonis.com
  metadata:
    max-request: 1
    vendor: celonis
    product: celonis
    shodan-query:
      - http.title:"Celonis"
      - html:"Amazing insights. Better results."
    fofa-query: body="Amazing insights. Better results."
    google-query: intitle:"Celonis" "welcome"
    verified: true
  tags: panel,celonis,login,detect,discovery
http:
  - method: GET
    path:
      - "{{BaseURL}}/welcome"

    matchers-condition: and
    matchers:
      - type: word
        part: body
        words:
          - "Amazing insights. Better results."
          - "draw-celonis-logo"
        condition: and
        case-insensitive: true

      - type: status
        status:
          - 200

    extractors:
      - type: regex
        name: version
        group: 1
        regex:
          - "Celonis\\s([0-9]+\\.[0-9]+)"
