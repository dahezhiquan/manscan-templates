id: vmware-cloud-director

info:
  name: VMware Cloud Director 登录面板识别（暴露面识别）
  author: DhiyaneshDK
  severity: info
  description: 该模板通过识别 VMware Cloud Director 登录入口的页面标题、特征文本或重定向行为，判断目标是否暴露了对应的认证界面。若命中，说明该登录面板对外可访问，可用于暴露面梳理与后续安全评估。
  classification:
    cvss-metrics: CVSS:3.0/AV:N/AC:L/PR:N/UI:N/S:U/C:N/I:N/A:N
    cwe-id: CWE-200
    cpe: cpe:2.3:a:vmware:cloud_director:*:*:*:*:*:*:*:*
  metadata:
    verified: true
    max-request: 1
    vendor: vmware
    product: cloud_director
    shodan-query:
      - title:"Welcome to VMware Cloud Director"
      - http.title:"welcome to vmware cloud director"
    fofa-query: title="welcome to vmware cloud director"
    google-query: intitle:"welcome to vmware cloud director"
  tags: panel,vmware,discovery

http:
  - method: GET
    path:
      - '{{BaseURL}}/login/'

    matchers-condition: and
    matchers:
      - type: word
        part: body
        words:
          - '<title>Welcome to VMware Cloud Director</title>'

      - type: status
        status:
          - 200
