id: apache-kafka-manager-panel

info:
  name: Kafka Manager 面板 指纹识别（指纹识别）
  author: ritikchaddha
  severity: info
  description: Kafka Manager 面板 是 Kafka 集群管理界面，用于查看 broker、topic、consumer 和集群状态。该模板请求首页，并依据页面标题、正文关键字或品牌资源特征、响应头特征识别目标是否使用或暴露了 Kafka Manager 面板 相关组件，适用于资产盘点、技术栈识别和后续安全评估；命中结果仅表示指纹特征匹配，不代表已确认存在可利用漏洞。
  reference:
  - https://github.com/yahoo/CMAK
  metadata:
    verified: true
    max-request: 1
    shodan-query: title:"Kafka-Manager"
    fofa-query: app="Kafka-Manager"
  tags: tech,kafka,apache,discovery

http:
  - method: GET
    path:
      - "{{BaseURL}}"

    matchers-condition: or
    matchers:
      - type: word
        part: body
        words:
          - "Kafka Manager"

      - type: word
        part: header
        words:
          - "Kafka-Manager"
