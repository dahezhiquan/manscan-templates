id: moveit-sftp-detect

info:
  name: MOVEit Transfer SFTP 识别（指纹识别）
  author: johnk3r
  severity: info
  description: |
    MOVEit Transfer SFTP 是企业级安全文件传输产品的 SFTP 接入服务，用于受控文件交换和合规传输。该模板连接 22/TCP 并读取握手、Banner 或协商响应中的产品标识，用于识别目标服务。
  classification:
    cvss-metrics: CVSS:3.1/AV:N/AC:L/PR:N/UI:N/S:U/C:N/I:N/A:N
    cwe-id: CWE-200
  metadata:
    max-request: 1
    shodan-query: "SSH-2.0-MOVEit"
  tags: network,ssh,detect,moveit,sftp,tcp,discovery

tcp:
  - host:
      - "{{Hostname}}"
    port: 22

    matchers:
      - type: regex
        regex:
          - '(?i)MOVEit'

    extractors:
      - type: regex
        regex:
          - '(?i)SSH-(.*)-MOVEit[^\r]+'
