id: default-redhat-test-page

info:
  name: Red Hat Enterprise Linux 测试页面 指纹识别（指纹识别）
  author: dhiyaneshDk
  severity: info
  description: Red Hat Enterprise Linux 测试页面 是 Red Hat 系统默认 Web 测试页面，用于确认 Web 服务已安装并运行。该模板请求首页，并依据页面标题、正文关键字或品牌资源特征识别目标是否使用或暴露了 Red Hat Enterprise Linux 测试页面 相关组件，适用于资产盘点、技术栈识别和后续安全评估；命中结果仅表示指纹特征匹配，不代表已确认存在可利用漏洞。
  classification:
    cpe: cpe:2.3:o:redhat:enterprise_linux_server:*:*:*:*:*:*:*:*
  metadata:
    max-request: 1
    vendor: redhat
    product: enterprise_linux_server
    shodan-query: http.title:"Test Page for the Apache HTTP Server on Red Hat Enterprise Linux"
  tags: tech,redhat,discovery

http:
  - method: GET
    path:
      - '{{BaseURL}}'

    matchers:
      - type: word
        words:
          - "<title>Test Page for the Apache HTTP Server on Red Hat Enterprise Linux</title>"
        part: body
