id: api-bible

info:
  name: API.Bible API Token 可用性校验（token喷洒）
  author: daffainfo
  severity: info
  description: 该模板通过调用 API.Bible API 的已知接口验证提供的 token 是否有效，命中后通常表示可访问相关 API 能力。
  reference:
    - https://docs.api.bible
    - https://github.com/daffainfo/all-about-apikey/tree/main/api-bible
  metadata:
    max-request: 1
  tags: token-spray,bible

self-contained: true

http:
  - method: GET
    path:
      - "https://api.scripture.api.bible/v1/bibles/a6aee10bb058511c-02/verses/JHN.3.16?fums-version=3"

    headers:
      api-key: "{{token}}"
    matchers:
      - type: word
        part: body
        words:
          - "orgId"
          - "bookId"
          - "bibleId"
        condition: and
