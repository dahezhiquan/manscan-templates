id: stem-audio-table-private-keys

info:
  name: STEM Audio Table 私钥泄露（IOT）
  author: gy741
  severity: high
  description: |
    检测到 STEM Audio Table 设备中暴露的私钥内容。此类密钥泄露可能被用于伪造通信、解密敏感数据或进一步攻击音频会议设备。
  reference:
    - https://blog.grimm-co.com/2021/06/the-walls-have-ears.html
  metadata:
    max-request: 1
  tags: stem,config,exposure,iot,vuln

http:
  - method: GET
    path:
      - "{{BaseURL}}/cgi-bin/privatekey.pem"

    matchers-condition: and
    matchers:
      - type: word
        words:
          - "BEGIN RSA PRIVATE KEY"

      - type: status
        status:
          - 200

      - type: dsl
        dsl:
          - '!contains(tolower(body), "<html")'
