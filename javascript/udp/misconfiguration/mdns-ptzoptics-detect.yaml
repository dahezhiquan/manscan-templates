id: mdns-ptzoptics-detect

info:
  name: PTZOptics 设备 mDNS 信息暴露（服务漏洞）
  author: rxerium
  severity: medium
  description: |
    PTZOptics 设备通常是用于会议、直播、教育录播和广播制作的网络云台摄像机。若设备通过 mDNS 对非预期来源通告 NDI、SSH 或 SFTP-SSH 等服务信息，攻击者可定位摄像设备和管理入口；该模板查询 mDNS 服务记录，匹配 _ndi 与 _ssh 特征并提取设备名、服务项和地址信息。
  impact: |
    - 泄露 PTZOptics 摄像设备名称、服务类型和地址信息，暴露音视频设备部署位置。
    - 暴露的 SSH、SFTP-SSH 或 NDI 服务线索可帮助攻击者识别管理面和媒体传输面。
    - 攻击者可据此开展默认口令、弱口令、固件版本或设备隔离缺陷的后续验证。
  remediation: |
    - 将 PTZOptics 设备放入受控的音视频或管理 VLAN，限制 UDP 5353、SSH、SFTP 和管理接口访问来源。
    - 关闭不必要的 mDNS/NDI/SSH 广播或服务，避免跨网段转发设备发现记录。
    - 更新设备固件并更改默认管理凭据，定期审计摄像设备暴露面。
  metadata:
    verified: true
    max-request: 1
    shodan-query: port:5353 ptzoptics
    vendor: ptzoptics
    product: ptzoptics
  tags: mdns,udp,js,ptzoptics,camera,iot,exposure

javascript:
  - pre-condition: |
      isUDPPortOpen(Host,Port);

    code: |
      let c = require("nuclei/net");
      let conn = c.Open('udp', `${Host}:${Port}`);
      // Query for _services._dns-sd._udp.local PTR records
      // This queries for all advertised mDNS services
      let packet = "e3bc01200001000000000001095f7365727669636573075f646e732d7364045f756470056c6f63616c00000c000100002904d000000000000c000a00083e6e072b14fd0be3";
      conn.SendHex(packet);
      let resp = conn.Recv(512);
      resp;

    args:
      Host: "{{Host}}"
      Port: 5353

    matchers-condition: and
    matchers:
      - type: dsl
        dsl:
          - "success == true"
          - "len(response) > 0"

      - type: word
        words:
          - "_ndi"
          - "_ssh"
        condition: and

    extractors:
      - type: regex
        name: device_name
        regex:
          - "Name=([^\n\r]+)"
        group: 1

      - type: regex
        name: services
        regex:
          - "_ndi\\._tcp"
          - "_ssh\\._tcp"
          - "_sftp-ssh\\._tcp"

      - type: regex
        name: ip_address
        regex:
          - "Address=([0-9]{1,3}\\.[0-9]{1,3}\\.[0-9]{1,3}\\.[0-9]{1,3})"
        group: 1
