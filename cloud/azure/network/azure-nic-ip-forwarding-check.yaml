id: azure-nic-ip-forwarding-check
info:
  name: Review Network Interfaces 使用IP Forwarding已启用（云安全）
  author: princechaddha
  severity: medium
  description: 该规则用于检查 Azure network 相关资源是否满足推荐的云安全与合规配置要求，命中通常表示当前配置仍存在可改进的风险项。
  impact: |
    - 当前配置偏离推荐的云安全基线，可能增加攻击面、审计缺口或运维失误带来的风险。
    - 具体影响取决于受影响资源的重要性、暴露范围以及周边安全控制是否到位。
  remediation: |
    - 参考云厂商安全基线和官方文档修正当前配置偏差。
    - 建议结合资源标签、自动化检测与周期性审计，持续跟踪该类风险项的整改状态。
  reference:
    - https://docs.microsoft.com/en-us/azure/virtual-network/ip-forwarding
  tags: cloud,devops,azure,microsoft,nic,azure-cloud-config

flow: |
  code(1);
  for (let NicData of iterate(template.nicdata)) {
    NicData = JSON.parse(NicData)
    set("name", NicData.name)
    set("resourcegroup", NicData.resourceGroup)
    code(2)
  }

self-contained: true
code:
  - engine:
      - sh
      - bash
    source: |
      az network nic list --output json --query '[*].{name:name, resourceGroup:resourceGroup}'

    extractors:
      - type: json
        name: nicdata
        internal: true
        json:
          - '.[]'

  - engine:
      - sh
      - bash
    source: |
      az network nic show --name $name --resource-group $resourcegroup --query 'enableIpForwarding'

    matchers:
      - type: word
        words:
          - "true"

    extractors:
      - type: dsl
        dsl:
          - 'nsg + " has IP forwarding enabled"'
