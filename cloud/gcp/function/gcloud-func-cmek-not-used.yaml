id: gcloud-func-cmek-not-used

info:
  name: No Customer-Managed 加密 Keys 中的Google Cloud Functions（云安全）
  author: princechaddha
  severity: high
  description: Cloud Functions 未配置 Customer-Managed Encryption Key 时，函数相关数据和构建制品无法通过客户 KMS 密钥进行独立生命周期控制。本模板枚举函数并检查 kmsKeyName，值为 null 时报告函数未使用 CMEK。
  impact: |
    - 敏感函数代码、配置或运行数据缺少客户侧密钥轮换、禁用和访问审计能力。
    - 对强合规环境，未使用 CMEK 可能不满足客户管理密钥和密钥隔离要求。
  remediation: |
    - 为需要密钥自主控制的函数配置 Cloud KMS CMEK，并授予服务代理使用密钥所需权限。
    - 对既有函数制定重新部署或迁移计划，统一部署模板中的 kmsKeyName 配置。
  reference:
    - https://cloud.google.com/functions/docs/securing/managing-encryption-keys
  metadata:
    vendor: google
    product: cloud-functions
  tags: cloud,devops,gcp,gcloud,google-cloud-functions,gcp-cloud-config

flow: |
  code(1)
  for(let projectId of iterate(template.projectIds)){
    set("projectId", projectId)
    code(2)
    for(let functionName of iterate(template.functions)){
      set("functionName", functionName)
      code(3)
    }
  }

self-contained: true

code:
  - engine:
      - sh
      - bash
    source: |
      gcloud projects list --format="json(projectId)"

    extractors:
      - type: json
        name: projectIds
        internal: true
        json:
          - '.[].projectId'

  - engine:
      - sh
      - bash
    source: |
      gcloud functions list --project $projectId --format="json(name)"

    extractors:
      - type: json
        name: functions
        internal: true
        json:
          - '.[].name'

  - engine:
      - sh
      - bash
    source: |
      gcloud functions describe $functionName --format="json(kmsKeyName)"

    matchers:
      - type: word
        words:
          - 'null'

    extractors:
      - type: dsl
        dsl:
          - '"Function not using CMEK: " + functionName + " in " + projectId + " project"'
