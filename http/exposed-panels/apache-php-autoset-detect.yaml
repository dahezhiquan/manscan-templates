id: apache-php-autoset-detect

info:
  name: AutoSet Page 识别（指纹识别）
  author: MaStErCho
  severity: info
  description: |-
    检测到目标站点存在 AutoSet Page 相关响应特征。AutoSet Page 是一套通过 Web 提供访问的管理面板或业务系统，通常用于配置服务、查看状态、管理数据或执行日常运维操作。模板请求 `/`，并通过页面标题或正文关键字、状态码确认该系统指纹，用于资产识别、系统盘点和暴露面梳理。
  reference:
    - http://autoset.net/xe/
  metadata:
    verified: true
    max-request: 1
    shodan-query: title:"AutoSet"
  tags: tech,php,autoset,apache,panel,discovery
http:
  - method: GET
    path:
      - '{{BaseURL}}'

    matchers-condition: and
    matchers:
      - type: word
        words:
          - "<title>AutoSet"
          - "alt\">AutoSet"
          - "logo-map logo-autoset"
        condition: or

      - type: status
        status:
          - 200

    extractors:
      - type: regex
        part: body
        group: 1
        regex:
          - '<title>AutoSet (\d+(\.\d+)+)\b'
