id: odoo-detection

info:
  name: Odoo 指纹识别（指纹识别）
  author: keyboard-slayer
  severity: info
  description: >-
    Odoo 是企业资源计划和业务应用平台，覆盖 CRM、销售、库存、财务、网站和制造等模块。该模板通过请求目标服务并检查DSL 条件、正则特征等指纹特征，判断目标是否使用或暴露了
    Odoo 相关组件；命中结果仅表示指纹特征匹配，可用于资产盘点、技术栈识别和后续安全评估，不代表已确认存在可利用漏洞。
  reference:
  - https://github.com/odoo/odoo/
  metadata:
    verified: true
    max-request: 1
    vendor: odoo
    product: odoo
  tags: tech,odoo,detect,discovery
http:
  - raw:
      - |
        POST /web/webclient/version_info HTTP/1.1
        Host: {{Hostname}}
        Content-Type: application/json

        {}

    matchers:
      - type: dsl
        dsl:
          - 'status_code == 200'
          - 'contains(content_type, "application/json")'
          - 'contains(body, "server_version")'
        condition: and

    extractors:
      - type: regex
        part: body
        group: 1
        regex:
          - '"server_version":\s*"([^"]+)"'
