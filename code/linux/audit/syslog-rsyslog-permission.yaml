id: syslog-rsyslog-permission

info:
  name: syslog/rsyslog 配置文件权限异常（本地基线扫描）
  author: songyaeji
  severity: high
  description: |
    该模板检查 /etc/syslog.conf 或 /etc/rsyslog.conf 的属主和权限。权限过宽可能允许攻击者篡改日志配置、隐藏活动轨迹。
  reference:
    - https://isms.kisa.or.kr
  tags: linux,local,kisa,audit,compliance

self-contained: true

code:
  - engine:
      - sh
      - bash
    source: |
      stat -c "%U %G %a" /etc/rsyslog.conf 2>/dev/null || echo "not-found"

  - engine:
      - sh
      - bash
    source: |
      stat -c "%U %G %a" /etc/syslog.conf 2>/dev/null || echo "not-found"

    matchers:
      - type: regex
        name: rsyslog
        part: code_1_response
        regex:
          - '^root\s+root\s+(600|644)$'

      - type: regex
        name: syslog
        part: code_2_response
        regex:
          - '^root\s+root\s+(600|644)$'
