id: navicat-server-panel

info:
  name: Navicat On-Prem Server 面板识别（指纹识别）
  author: ritikchaddha
  severity: info
  description: |
    该模板通过识别 Navicat On-Prem Server 面板、控制台或管理界面的页面特征，判断目标是否暴露了对应服务入口。若命中，说明该后台或运维界面对外可访问，可用于资产识别与暴露面排查。
  metadata:
    verified: true
    max-request: 2
    shodan-query: http.favicon.hash:598296063
    fofa-query: icon_hash="598296063"
  tags: panel,navicat,on-prem,detect,discovery

http:
  - method: GET
    path:
      - "{{BaseURL}}"
      - "{{BaseURL}}/login"

    stop-at-first-match: true
    host-redirects: true
    max-redirects: 2

    matchers-condition: and
    matchers:
      - type: word
        part: body
        words:
          - 'Navicat On-Prem Server</title>'
          - 'content="Navicat On-Prem Server'
        condition: or

      - type: status
        status:
          - 200
