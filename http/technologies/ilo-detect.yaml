id: ilo-detect

info:
  name: HP iLO 指纹识别（指纹识别）
  author: milo2012
  severity: info
  description: >-
    HP Integrated Lights-Out 是 HPE 服务器的带外管理控制器，用于远程电源、控制台和硬件状态管理。该模板通过请求目标服务并检查预设路径或首页响应、页面正文关键字、HTTP
    响应头、正则特征、状态码等指纹特征，判断目标是否使用或暴露了 HP iLO 相关组件；命中结果仅表示指纹特征匹配，可用于资产盘点、技术栈识别和后续安全评估，不代表已确认存在可利用漏洞。
  metadata:
    max-request: 1
  tags: tech,ilo,discovery
http:
  - method: GET
    path:
      - "{{BaseURL}}/xmldata?item=all"

    matchers-condition: and
    matchers:
      - type: status
        status:
          - 200

      - type: word
        words:
          - text/xml
        part: header

      - type: word
        words:
          - <RIMP>
          - <HSI>
        condition: and

    extractors:
      - type: regex
        part: body
        group: 1
        regex:
          - "<FWRI>([0-9.]+)</FWRI>"
