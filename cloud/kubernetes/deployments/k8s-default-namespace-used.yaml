id: k8s-default-namespace-used

info:
  name: Default Namespace Usage 中的Deployments（云安全）
  author: princechaddha
  severity: high
  description: 在 default 命名空间部署业务会削弱环境隔离、权限边界和资源治理，容易把测试、系统或生产工作负载混在一起。本模板枚举 Deployment，当 metadata.namespace 为 default 时报告风险。
  impact: |
    - RBAC、ResourceQuota、NetworkPolicy 和审计边界难以按业务或环境精细划分。
    - 误操作或过宽默认权限可能影响不相关应用，增加横向访问和变更风险。
  remediation: |
    - 为不同业务、环境和团队创建独立命名空间，并迁移 default 命名空间中的业务 Deployment。
    - 为 default 命名空间设置准入限制、资源配额和告警，避免继续部署生产工作负载。
  reference:
    - https://kubernetes.io/docs/concepts/overview/working-with-objects/namespaces/
  metadata:
    vendor: kubernetes
    product: kubernetes
  tags: cloud,devops,kubernetes,devsecops,namespaces,k8s-cluster-security
flow: |
  code(1);
  for (let deployment of template.items) {
    set("deployment", deployment)
    javascript(1);
  }

self-contained: true
code:
  - engine:
      - sh
      - bash
    source: kubectl get deployments --all-namespaces --output=json
    extractors:
      - type: json
        name: items
        internal: true
        json:
          - '.items[]'

javascript:
  - code: |
        deployment = JSON.parse(template.deployment);
        if (deployment.metadata.namespace.toLowerCase() === "default") {
          let result = (`Deployment '${deployment.metadata.name}' is using the default namespace, which is not recommended.`);
          Export(result);
        }

    extractors:
      - type: dsl
        dsl:
          - response
