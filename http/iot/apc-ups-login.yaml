id: apc-ups-login

info:
  name: APC UPS 登录面板（IOT）
  author: droberson
  severity: medium
  description: |
    检测到 APC UPS 登录面板。该界面用于管理不间断电源设备，暴露后可帮助攻击者识别供电基础设施的型号与远程管理入口。
  impact: |
    - 工业控制、楼宇自动化或能源设备面板暴露可能泄露设施运行状态和控制系统入口。
    - 若存在弱口令或历史漏洞，可能影响生产、楼控、供电或环境控制的安全边界。
  remediation: |
    - 将 OT/IoT 管理页面放置在隔离网络中，仅允许可信运维主机或 VPN 访问。
    - 启用强认证、最小权限和设备访问审计，及时更新厂商固件。
    - 避免将控制设备直接暴露到互联网，并监控异常登录和配置变更。
  classification:
    cvss-metrics: CVSS:3.0/AV:N/AC:L/PR:N/UI:N/S:U/C:N/I:N/A:N
    cvss-score: 0
    cwe-id: CWE-200
  metadata:
    max-request: 1
    shodan-query: title:"APC | Log On"
  tags: iot,panel,discovery

http:
  - method: GET
    path:
      - "{{BaseURL}}/logon.htm"

    matchers-condition: and
    matchers:
      - type: word
        words:
          - '<title>APC | Log On</title>'
        part: body

      - type: status
        status:
          - 200
