id: nexpose-panel

info:
  name: Rapid7 Nexpose VM Security Console 识别（指纹识别）
  author: johnk3r
  severity: info
  description: |-
    检测到目标站点存在 Rapid7 Nexpose VM Security Console 相关响应特征。Rapid7 Nexpose VM Security Console 是安全扫描、安全网关或安全管理平台，用于维护访问控制、漏洞评估、威胁防护、策略配置和告警事件。模板请求 `/login.jsp`，并通过页面标题或正文关键字、状态码、DSL 条件确认该系统指纹，用于资产识别、系统盘点和暴露面梳理。
  metadata:
    verified: true
    max-request: 1
    shodan-query: http.favicon.hash:-516760689
  tags: nexpose,panel,login,detect,discovery
http:
  - method: GET
    path:
      - "{{BaseURL}}/login.jsp"

    matchers:
      - type: dsl
        dsl:
          - 'contains(header, "Security Console")'
          - 'contains(body, "nexposeccusername")'
          - status_code == 200
        condition: and

    extractors:
      - type: kval
        part: header
        kval:
          - Server
