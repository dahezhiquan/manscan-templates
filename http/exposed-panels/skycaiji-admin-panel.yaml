id: skycaiji-admin-panel

info:
  name: SkyCaiji 面板识别（指纹识别）
  author: princechaddha
  severity: info
  description: SkyCaiji 是网页采集和内容管理系统，用于配置采集规则、任务调度和数据入库。该模板请求 `/index.php?s=/admin/Index/index`，并依据 HTTP 200 状态码、页面标题、正文关键字或品牌资源特征识别目标是否部署了该系统或暴露了对应入口，适用于资产指纹确认；命中结果仅表示系统特征匹配，不代表已确认存在未授权访问或可利用漏洞。
  classification:
    cvss-metrics: CVSS:3.0/AV:N/AC:L/PR:N/UI:N/S:U/C:N/I:N/A:N
    cwe-id: CWE-200
    cpe: cpe:2.3:a:skycaiji:skycaiji:*:*:*:*:*:*:*:*
  metadata:
    max-request: 1
    vendor: skycaiji
    product: skycaiji
  tags: panel,tech,skycaiji,discovery

http:
  - method: GET
    path:
      - "{{BaseURL}}/index.php?s=/admin/Index/index"

    matchers-condition: and
    matchers:
      - type: word
        part: body
        words:
          - '<p>Powered by <a href="https://www.skycaiji.com" target="_blank">'
          - '<a href="/index.php?s=/Admin/Index/find_password">'
        condition: and

      - type: status
        status:
          - 200

    extractors:
      - type: regex
        part: body
        group: 1
        regex:
          - 'com">SkyCaiji<\/a> ([A-Z0-9.]+) 后台管理<\/p>'
