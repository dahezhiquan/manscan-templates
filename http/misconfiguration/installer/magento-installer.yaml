id: magento-installer

info:
  name: Magento 安装 Wizard
  author: DhiyaneshDk
  severity: high
  description: |
    检测到 Magento 安装 Wizard。该页面属于安装、初始化或配置向导流程，若对外暴露，攻击者可能完成初始化、创建管理员账户或重新配置目标系统。
  classification:
    cpe: cpe:2.3:a:magento:magento:*:*:*:*:*:*:*:*
  metadata:
    verified: true
    max-request: 1
    vendor: magento
    product: magento
    shodan-query: html:"Magento Installation"
  tags: misconfig,magento,install,exposure,vuln

http:
  - method: GET
    path:
      - "{{BaseURL}}/index.php/install/"

    matchers-condition: and
    matchers:
      - type: word
        part: body
        words:
          - "Magento Installation Wizard"
          - "Welcome to Magento's Installation Wizard!"
        condition: and

      - type: word
        part: header
        words:
          - "text/html"

      - type: status
        status:
          - 200
