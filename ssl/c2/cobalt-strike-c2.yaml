id: cobalt-strike-c2

info:
  name: Cobalt Strike C2 证书识别（证书安全）
  author: pussycat0x
  severity: info
  description: 该模板通过 SSL 证书序列号特征识别目标是否可能与 Cobalt Strike 命令控制基础设施相关。命中可作为红队设施或恶意 C2 资产的初步研判线索。
  reference:
    - https://blog.sekoia.io/hunting-and-detecting-cobalt-strike/
  metadata:
    verified: "true"
    max-request: 1
    shodan-query: ssl.cert.serial:146473198
  tags: c2,ssl,tls,ir,osint,malware,panel,cobalt-strike,discovery
ssl:
  - address: "{{Host}}:{{Port}}"
    matchers:
      - type: dsl
        dsl:
          - 'contains(serial,"08:BB:00:EE")'

    extractors:
      - type: json
        json:
          - ".serial"
