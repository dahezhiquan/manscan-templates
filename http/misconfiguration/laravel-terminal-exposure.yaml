id: laravel-terminal-exposure

info:
  name: Laravel Terminal 暴露
  author: pussycat0x
  severity: high
  description: |
    该模板用于核查 Laravel Terminal 暴露。该类问题通常源于高危管理接口未授权开放，攻击者可借助接口能力提交任务或触发命令执行。模板会向目标发送探测请求，并依据请求 `/asf/terminal`、匹配 `Laravel Terminal`、匹配 `terminal.endpoint`、状态码 200 等证据确认目标是否存在该配置问题。
  impact: |
    - 攻击者可能在目标服务或集群节点上执行命令、提交任务或控制计算资源。
    - 成功利用后可导致主机沦陷、数据泄露、横向移动和业务中断。
  remediation: |
    - 立即为相关管理接口启用认证授权并限制可信来源访问。
    - 按厂商建议升级或加固受影响组件，关闭不需要的远程任务提交能力。
    - 检查集群任务、系统进程和访问日志，清理异常任务并轮换凭据。
  reference:
    - https://github.com/recca0120/laravel-terminal
    - https://www.acunetix.com/vulnerabilities/web/laravel-terminal-open/
  metadata:
    max-request: 1
    verified: false
  tags: laravel,terminal,exposure,misconfig,rce

http:
  - method: GET
    path:
      - "{{BaseURL}}/asf/terminal"

    matchers-condition: and
    matchers:
      - type: word
        part: body
        words:
          - "Laravel Terminal"
          - "terminal.endpoint"
        condition: or

      - type: status
        status:
          - 200
