id: digitalrebar-login

info:
  name: RackN Digital Rebar 登录面板识别（暴露面识别）
  author: c-sh0
  severity: info
  description: 该模板通过识别 RackN Digital Rebar 登录入口的页面标题、特征文本或重定向行为，判断目标是否暴露了对应的认证界面。若命中，说明该登录面板对外可访问，可用于暴露面梳理与后续安全评估。
  reference:
    - https://docs.rackn.io/
    - https://docs.rackn.io/en/latest/doc/server.html#ports
  classification:
    cvss-metrics: CVSS:3.0/AV:N/AC:L/PR:N/UI:N/S:U/C:N/I:N/A:N
    cwe-id: CWE-200
    cpe: cpe:2.3:a:rackn:digital_rebar:*:*:*:*:*:*:*:*
  metadata:
    max-request: 2
    vendor: rackn
    product: digital_rebar
  tags: rackn,digitalrebar,panel,discovery

http:
  - method: GET
    path:
      - "{{BaseURL}}"
      - "{{BaseURL}}/ui"

    stop-at-first-match: true
    host-redirects: true
    max-redirects: 2

    matchers-condition: and
    matchers:
      - type: status
        status:
          - 200

      - type: word
        part: body
        words:
          - 'Digital Rebar'
