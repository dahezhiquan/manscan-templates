id: tekon-info-leak

info:
  name: Tekon - 未授权访问漏洞
  author: gy741
  severity: low
  description: Tekon - 未授权 Log Leak 存在未授权访问或认证绕过问题。攻击者无需有效凭证即可访问敏感接口、执行高权限操作或进一步扩大影响。
  reference:
    - https://medium.com/@bertinjoseb/post-auth-rce-based-in-malicious-lua-plugin-script-upload-scada-controllers-located-in-russia-57044425ac38
  classification:
    cpe: cpe:2.3:o:tekon:kio_firmware:*:*:*:*:*:*:*:*
  metadata:
    max-request: 1
    vendor: tekon
    product: kio_firmware
    shodan-query: title:"контроллер"
  tags: tekon,exposure,unauth,vuln

http:
  - method: GET
    path:
      - '{{BaseURL}}/cgi-bin/log.cgi'

    max-size: 2048

    matchers-condition: and
    matchers:
      - type: word
        part: body
        words:
          - "-- Logs begin at"
          - "end at"
        condition: and

      - type: word
        part: header
        words:
          - "text/plain"

      - type: status
        status:
          - 200
