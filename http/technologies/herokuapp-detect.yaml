id: herokuapp-detect

info:
  name: Heroku App Endpoint 指纹识别（指纹识别）
  author: alifathi-h1,righettod
  severity: info
  description: >-
    Heroku 是应用托管 PaaS 平台，Heroku App Endpoint 表示目标服务可能部署在 Heroku 应用域名或托管环境中。该模板通过请求目标服务并检查预设路径或首页响应、页面正文关键字、正则特征等指纹特征，判断目标是否使用或暴露了
    Heroku App Endpoint 相关组件；命中结果仅表示指纹特征匹配，可用于资产盘点、技术栈识别和后续安全评估，不代表已确认存在可利用漏洞。
  metadata:
    max-request: 1
  tags: heroku,tech,discovery
http:
  - method: GET
    path:
      - "{{BaseURL}}"

    extractors:
      - type: regex
        part: body
        regex:
          - "[a-z0-9.-]+\\.herokuapp\\.com"
          - "[a-z0-9.-]+\\.herokucdn\\.com"
