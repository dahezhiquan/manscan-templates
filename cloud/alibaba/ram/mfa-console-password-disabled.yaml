id: mfa-console-password-disabled

info:
  name: 阿里云 RAM 控制台密码用户未强制 MFA（云安全）
  author: DhiyaneshDK
  severity: medium
  description: 具备控制台登录密码的 RAM 用户如果未强制绑定 MFA，账号安全完全依赖密码强度和保密性，凭据泄露后更容易被直接登录。模板枚举 RAM 用户并查询登录配置，当 GetLoginProfile 返回 MFABindRequired 为 false 时判定该用户未强制 MFA。
  impact: |
    - 控制台账号在密码泄露、钓鱼或撞库场景下缺少第二因素保护，可能被直接用于管理云资源。
    - 高权限用户未启用 MFA 会显著增加权限滥用、资源篡改和数据泄露风险。
  remediation: |
    - 为所有可控制台登录的 RAM 用户绑定 MFA 设备，并将 MFABindRequired 设置为 true。
    - 对长期不需要控制台访问的 RAM 用户删除登录配置，仅保留必要的程序访问方式。
  reference:
    - https://www.alibabacloud.com/help/en/ram/user-guide/bind-an-mfa-device-to-a-ram-user
    - https://www.trendmicro.com/cloudoneconformity/knowledge-base/alibaba-cloud/AlibabaCloud-RAM/ram-user-multi-factor-authentication-enabled.html
  metadata:
    max-request: 1
    verified: true
    vendor: alibaba
    product: ram
  tags: cloud,devops,aliyun,alibaba,alibaba-cloud-config,alibaba-ram

variables:
  region: "cn-hangzhou"

flow: |
  code(1)
  for(let UserName of iterate(template.username)){
    set("user", UserName)
    code(2)
  }

self-contained: true

code:
  - engine:
      - sh
      - bash

    source: |
      aliyun ram ListUsers --region $region

    extractors:
      - type: json
        name: username
        internal: true
        json:
          - '.Users.User[].UserName'

  - engine:
      - sh
      - bash

    source: |
      aliyun ram GetLoginProfile --UserName $user --region $region

    matchers:
      - type: word
        words:
          - '"MFABindRequired": false'

    extractors:
      - type: dsl
        dsl:
          - 'username + "MFA For RAM Users With Console Password is Disabled "'
