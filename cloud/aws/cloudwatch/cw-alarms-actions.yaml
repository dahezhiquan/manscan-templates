id: cw-alarms-actions
info:
  name: CloudWatch 告警动作未启用（云安全）
  author: princechaddha
  severity: high
  description: CloudWatch 告警动作被禁用是一类监控响应失效风险，已配置的通知、扩缩容或自动化处理不会在 ALARM 状态下执行。团队可能误以为告警链路仍然有效，从而形成隐性监控缺口。模板枚举告警后读取 `MetricAlarms[*].ActionsEnabled`，当值为 `false` 时判定告警动作未启用。
  impact: |
    - 指标异常可能不会触发通知、自动扩缩容或自动化修复，延误故障和安全事件响应。
    - 团队可能误以为告警仍在工作，导致监控覆盖出现隐性缺口。
  remediation: |
    - 对应启用 CloudWatch 告警动作，确认 `ActionsEnabled` 为 `true`。
    - 复核告警动作目标、订阅状态和权限配置，并通过测试告警验证响应链路。
  reference:
    - https://docs.aws.amazon.com/AmazonCloudWatch/latest/monitoring/AlarmThatSendsEmail.html
  metadata:
    max-request: 2
    vendor: amazon
    product: cloudwatch
  tags: cloud,devops,aws,amazon,cloudwatch,aws-cloud-config
variables:
  region: "us-east-1"

flow: |
  code(1)
  for(let AlarmName of iterate(template.alarms)){
    set("alarm", AlarmName)
    code(2)
  }

self-contained: true
code:
  - engine:
      - sh
      - bash
    source: |
      aws cloudwatch describe-alarms --region $region --query 'MetricAlarms[].AlarmName' --output json

    extractors:
      - type: json
        name: alarms
        internal: true
        json:
          - '.[]'

  - engine:
      - sh
      - bash
    source: |
        aws cloudwatch describe-alarms --region $region --alarm-names "DiskWritesOpsAlarm" --query 'MetricAlarms[*].ActionsEnabled'

    matchers:
      - type: word
        words:
          - "false"

    extractors:
      - type: dsl
        dsl:
          - '"The Amazon CloudWatch " + alarm + " does not have any active actions configured"'
