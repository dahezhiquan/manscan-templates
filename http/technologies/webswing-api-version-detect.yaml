id: webswing-api-version-detect

info:
  name: WebSwing REST API 指纹识别（指纹识别）
  author: aushack
  severity: info
  description: >-
    WebSwing 是将 Java Swing 应用发布到浏览器的运行平台，REST API 可用于查询版本和服务状态。该模板通过请求目标服务并检查预设路径或首页响应、页面正文关键字、状态码、正则特征等指纹特征，判断目标是否使用或暴露了
    WebSwing REST API 相关组件；命中结果仅表示指纹特征匹配，可用于资产盘点、技术栈识别和后续安全评估，不代表已确认存在可利用漏洞。
  metadata:
    verified: true
    max-request: 1
    shodan-query: 'Server: webswing.org'
  tags: webswing,rest,api,version,detect,discovery
http:
  - method: GET
    path:
      - "{{BaseURL}}/rest/version"

    matchers-condition: and
    matchers:
      - type: word
        part: server
        words:
          - "webswing.org"

      - type: status
        status:
          - 200

    extractors:
      - type: regex
        part: body
        regex:
          - '^(\d+(?:\.\d+)*)$'
        group: 1
