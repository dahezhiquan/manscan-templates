id: koel-panel

info:
  name: Koel 面板识别（暴露面识别）
  author: rxerium
  severity: info
  description: |
    该模板通过识别 Koel 面板、控制台或管理界面的页面特征，判断目标是否暴露了对应服务入口。若命中，说明该后台或运维界面对外可访问，可用于资产识别与暴露面排查。
  reference:
    - https://koel.dev/
    - https://github.com/koel/koel
  classification:
    cpe: cpe:2.3:a:koel:koel:*:*:*:*:*:*:*:*
  metadata:
    verified: true
    max-request: 1
    vendor: koel
    product: koel
    shodan-query: title:"Koel"
  tags: panel,koel,login,discovery

http:
  - method: GET
    path:
      - "{{BaseURL}}"

    host-redirects: true
    max-redirects: 2

    matchers-condition: and
    matchers:
      - type: word
        words:
          - '<title>Koel</title>'
          - 'Personal audio streaming service that works.'
        condition: and

      - type: status
        status:
          - 200
