id: idea-logs-exposure

info:
  name: .idea 目录 HTTP 日志泄露（暴露面识别）
  author: martincodes-de
  severity: info
  description: 检测到可直接访问的 .idea 目录 HTTP 日志。日志、异常页面或调试输出通常会泄露堆栈信息、内部路径、查询语句、账号标识、令牌片段或业务数据，不应向未授权用户开放。
  metadata:
    max-request: 2
  tags: phpstorm,jetbrains,idea,exposure,vuln

http:
  - method: GET
    path:
      - "{{BaseURL}}/.idea/httpRequests/http-requests-log.http"
      - "{{BaseURL}}/.idea/httpRequests/http-client.cookies"

    matchers-condition: or
    matchers:
      - type: regex
        regex:
          - '(?m)^(GET|POST) https?:\/\/'
        part: body

      - type: word
        words:
          - "# domain\tpath\tname\tvalue\tdate"
        part: body
