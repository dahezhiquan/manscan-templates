id: limesurvey-default-login

info:
  name: LimeSurvey 默认管理员凭据（弱口令）
  author: 0x_Akoko
  severity: high
  description: |
    该模板用于检测 LimeSurvey 是否仍可使用默认凭据或弱口令登录。模板主要向 `/index.php/admin/authentication/sa/login` 等认证入口发送请求，使用内置默认凭据组合进行认证尝试，并根据状态码、认证 Cookie、跳转位置或登录后的页面关键字判断登录是否成功；命中说明目标未及时修改出厂、示例或初始化账号口令。
  impact: |
    - 攻击者可登录 LimeSurvey 后台，管理内容、用户、插件、主题、文件、表单或业务流程配置。
    - 后台权限被滥用后，可能导致页面篡改、恶意文件上传、敏感资料泄露，或进一步取得服务器执行能力。
  remediation: |
    - 立即修改默认管理员凭据，删除安装向导、演示账号和不必要的后台用户。
    - 限制后台登录入口访问来源，启用多因素认证、登录失败锁定和验证码等防护。
    - 检查近期内容、插件、主题、文件上传和管理员操作记录，确认没有持久化后门。
  reference:
    - https://github.com/LimeSurvey/LimeSurvey/blob/master/application/config/config-defaults.php
    - https://www.limesurvey.org/manual/Optional_settings
  metadata:
    verified: true
    max-request: 2
    vendor: limesurvey
    product: limesurvey
    shodan-query: 'http.title:"LimeSurvey"'
    fofa-query: 'title="LimeSurvey"'
  tags: limesurvey,default-login,auth

variables:
  username: "admin"
  password: "password"

flow: http(1) && http(2)

http:
  - raw:
      - |
        GET /index.php/admin/authentication/sa/login HTTP/1.1
        Host: {{Hostname}}

    matchers:
      - type: dsl
        internal: true
        dsl:
          - 'status_code == 200'
          - 'contains_all(body, "LimeSurvey", "loginform")'
        condition: and

    extractors:
      - type: regex
        name: csrf_token
        part: header
        group: 1
        internal: true
        regex:
          - 'YII_CSRF_TOKEN=([^;]+)'

  - raw:
      - |
        POST /index.php/admin/authentication/sa/login HTTP/1.1
        Host: {{Hostname}}
        Content-Type: application/x-www-form-urlencoded
        Cookie: YII_CSRF_TOKEN={{csrf_token}}

        user={{username}}&password={{password}}&YII_CSRF_TOKEN={{csrf_token}}&login_submit=login

    matchers:
      - type: dsl
        dsl:
          - 'status_code == 302'
          - 'contains_any(to_lower(header), "adminsidepanel", "dashboard", "admin/index")'
        condition: and
