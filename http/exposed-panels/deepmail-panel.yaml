id: deepmail-panel

info:
  name: Advanced eMail Solution DEEPMail 面板（指纹识别）
  author: Splint3r7
  severity: info
  description: |-
    检测到目标站点存在 Advanced eMail Solution DEEPMail 相关响应特征。Advanced eMail Solution DEEPMail 是 AI、LLM 或机器学习相关平台，用于管理模型、数据集、工作区、推理服务或可观测性信息。模板请求 `/`，并通过页面标题或正文关键字、状态码、DSL 条件确认该系统指纹，用于资产识别、系统盘点和暴露面梳理。
  classification:
    cwe-id: CWE-200
  metadata:
    max-request: 1
    shodan-query: http.title:"Advanced eMail Solution DEEPMail"
    verified: true
  tags: panel,deepmail,login,detect,discovery
http:
  - method: GET
    path:
      - "{{BaseURL}}"

    matchers:
      - type: dsl
        dsl:
          - 'contains(body, "Advanced eMail Solution DEEPMail</title>")'
          - 'status_code == 200'
        condition: and
