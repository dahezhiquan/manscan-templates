id: rexify-config-exposure

info:
  name: Rexify 配置暴露（暴露面识别）
  author: theamanrawat
  severity: high
  description: |
    检测到对外可访问的 Re。这类配置资源可能包含部署细节、访问凭据、内部地址、组件版本或调试开关，公开暴露后会显著增加被侦察和后续利用的风险。
  reference:
    - https://www.rexify.org/
  metadata:
    verified: true
    max-request: 1
  tags: exposure,config,rexify,rex,devops

http:
  - method: GET
    path:
      - "{{BaseURL}}/Rexfile"

    matchers-condition: and
    matchers:
      - type: word
        words:
          - "use Rex"
          - "task"
          - "group"
          - "user"
          - "password"
          - "desc"
        condition: and
        part: body

      - type: status
        status:
          - 200
