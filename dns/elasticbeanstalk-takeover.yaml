id: elasticbeanstalk-takeover

info:
  name: Elastic Beanstalk 子域名接管检测（dns）
  author: philippedelteil,rotemreiss,zy9ard3,joaonevess
  severity: high
  description: |
    Elastic Beanstalk 悬空记录发生在域名仍指向带区域标识的 Beanstalk CNAME，而对应环境已删除或未被占用时。若该 CNAME 可被其他账户重新声明，攻击者可能接管子域名内容。本模板要求 CNAME 命中区域化 `elasticbeanstalk.com` 格式且响应包含 `NXDOMAIN`，仅输出候选项；必须使用 AWS 控制台或 `aws elasticbeanstalk check-dns-availability` 确认可用性，未完成声明验证时不能报告为已接管。
  impact: |
    - 一旦确认 CNAME 可被重新声明，攻击者可在受信任子域名下托管钓鱼页面、恶意下载或伪造业务接口。
    - 被接管的子域名可能影响品牌信任、跨域策略和发往该域名的业务流量，并扩大凭据窃取和会话攻击机会。
  remediation: |
    - 删除已下线环境对应的 CNAME，或立即在正确的 AWS 区域重新绑定由组织控制的 Beanstalk 环境。
    - 使用 AWS 控制台或 `aws elasticbeanstalk check-dns-availability` 完成平台侧声明验证；在确认前不要仅凭模板结果修复为“已接管”。
    - 将 Elastic Beanstalk 环境和 DNS 记录纳入同一生命周期流程，监控环境删除、区域迁移和 CNAME 变更。
  reference:
    - https://github.com/EdOverflow/can-i-take-over-xyz/issues/147
    - https://twitter.com/payloadartist/status/1362035009863880711
    - https://www.youtube.com/watch?v=srKIqhj_ki8
  classification:
    cvss-metrics: CVSS:3.0/AV:N/AC:L/PR:N/UI:N/S:C/C:L/I:L/A:N
    cvss-score: 7.2
    cwe-id: CWE-404
  metadata:
    max-request: 1
    comments: |
      只有包含区域标识的 CNAME 才可能被劫持。
      必须在 AWS 控制台（https://aws.amazon.com/）或通过 AWS CLI 声明该 CNAME，以确认是否确实可以接管。
      在完成 CNAME 声明验证前不要报告该问题。
      可使用以下 CLI 命令检查环境名称是否可用：
      aws elasticbeanstalk check-dns-availability --region {AWS_REGION} --cname-prefix {CNAME_PREFIX}
      示例：
      CNAME - 2rs3c.eu-west-1.elasticbeanstalk.com
      命令 - aws elasticbeanstalk check-dns-availability --region eu-west-1 --cname-prefix 2rs3c
  tags: dns,takeover,aws,elasticbeanstalk,discovery

dns:
  - name: "{{FQDN}}"
    type: A

    matchers-condition: and
    matchers:
      - type: regex
        regex:
          - CNAME\t[a-z0-9_-]*\.(us|af|ap|ca|eu|me|sa|il)\-(north|east|west|south|northeast|southeast|central)\-[1-9]+\.elasticbeanstalk\.com

      - type: word
        words:
          - NXDOMAIN

    extractors:
      - type: dsl
        dsl:
          - cname
