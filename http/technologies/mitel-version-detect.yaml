id: mitel-version-detect

info:
  name: Mitel MiCollab UCS 指纹识别（指纹识别）
  author: aushack
  severity: info
  description: >-
    Mitel MiCollab Unified Communications Server 是统一通信平台，用于语音、会议、即时消息和协作服务。该模板通过请求目标服务并检查预设路径或首页响应、DSL
    条件等指纹特征，判断目标是否使用或暴露了 Mitel MiCollab UCS 相关组件；命中结果仅表示指纹特征匹配，可用于资产盘点、技术栈识别和后续安全评估，不代表已确认存在可利用漏洞。
  metadata:
    verified: true
    max-request: 1
    shodan-query: html:"MiCollab End User Portal"
  tags: mitel,micollab,ucs,version,detect,discovery
http:
  - method: GET
    path:
      - "{{BaseURL}}/ucs/micollab/version.json"

    matchers:
      - type: dsl
        dsl:
          - 'status_code == 200'
          - 'contains(body, "{\"version\":")'
        condition: and

    extractors:
      - type: json
        part: body
        name: version
        group: 1
        json:
          - ".version"
