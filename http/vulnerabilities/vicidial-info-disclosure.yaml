id: vicidial-info-disclosure

info:
  name: VICIdial 信息泄露漏洞（CVE-2021-28854）
  author: pdteam
  severity: high
  description: |
    该模板用于检测 VICIdial 信息泄露漏洞。该类漏洞通常源于接口将用户可控参数直接拼接进 SQL 语句，导致查询语义被篡改。模板会向 `/agc/vicidial_mysqli_errors.txt` 等位置发送探测请求，并结合响应状态、关键字、错误信息、时间差或外带交互等证据判断目标是否受影响。
  impact: |
    - 攻击者可通过注入参数读取、篡改或删除数据库中的敏感数据。
    - 在数据库权限过高或支持危险函数的场景下，SQL 注入还可能导致认证绕过、文件读写或进一步执行系统命令。
  remediation: |
    - 对所有数据库访问使用参数化查询或安全 ORM，避免拼接用户可控输入。
    - 对受影响接口的参数进行类型、长度和取值范围校验，并关闭详细数据库错误回显。
    - 使用最小权限数据库账号，排查异常查询、数据导出和新增账号记录。
  reference:
    - https://github.com/JHHAX/VICIdial
  metadata:
    max-request: 1
  tags: sqli,vuln

http:
  - method: GET
    path:
      - "{{BaseURL}}/agc/vicidial_mysqli_errors.txt"

    matchers-condition: and
    matchers:
      - type: word
        words:
          - 'text/plain'
        part: header

      - type: status
        status:
          - 200

      - type: word
        words:
          - 'vdc_db_query'
        part: body
