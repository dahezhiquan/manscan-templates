id: apc-nmc-default-login

info:
  name: Schneider Electric APC NMC 默认口令登录（弱口令）
  author: x-stp
  severity: high
  description: |
    该模板用于检测 Schneider Electric APC NMC 是否仍可使用默认凭据或弱口令登录。模板主要向 `/Forms/login1` 等认证入口发送请求，使用内置默认凭据组合进行认证尝试，并根据响应中的 `(?i)Location: .*/NMC/`、`(?i)Set-Cookie: APC[^=]+=[^;]+` 等登录成功特征判断登录是否成功；命中说明目标未及时修改出厂、示例或初始化账号口令。
  impact: |
    - 攻击者可接管 Schneider Electric APC NMC 的 Web 管理界面，查看设备状态、网络配置、运行日志或敏感业务参数。
    - 被接管的网络、工控、打印、语音、存储或远程管理设备可能被用于中断业务、改变路由/访问策略、窃取流量或作为内网横向移动入口。
  remediation: |
    - 立即修改所有默认账号口令，禁用不再使用的出厂账号，并为管理账户设置高强度唯一密码。
    - 将设备管理入口限制在 VPN、堡垒机或可信管理网段内，避免直接暴露到公网。
    - 升级设备固件或管理组件，审计近期登录记录、配置变更和异常会话。
  reference:
    - https://www.apc.com/us/en/faqs/FA156047/
  classification:
    cwe-id: CWE-522
    cvss-score: 8.6
    cvss-metrics: CVSS:3.1/AV:N/AC:L/PR:N/UI:N/S:U/C:H/I:L/A:L
    cpe: cpe:2.3:o:schneider-electric:network_management_card_firmware:*:*:*:*:*:*:*:*
  metadata:
    verified: true
    max-request: 4
    shodan-query: title:"APC | Log On"
    fofa-query: title="APC | Log On"
    product: apc-network-management-card
    vendor: schneider-electric
  tags: apc,default-login,iot,ups,vuln

http:
  - raw:
      - |
        POST /Forms/login1 HTTP/1.1
        Host: {{Hostname}}
        Content-Type: application/x-www-form-urlencoded

        login_username={{username}}&login_password={{password}}&prefLanguage=00000000&submit=Log+On

    attack: pitchfork
    payloads:
      username:
        - apc
        - admin
      password:
        - apc
        - admin

    matchers-condition: and
    matchers:
      - type: regex
        part: header
        regex:
          - "(?i)Location: .*/NMC/"

      - type: regex
        part: header
        regex:
          - "(?i)Set-Cookie: APC[^=]+=[^;]+"

      - type: status
        status:
          - 303
