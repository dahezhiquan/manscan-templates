id: device42-panel

info:
  name: Device42 面板识别（暴露面识别）
  author: righettod
  severity: info
  description: |
    该模板通过识别 Device42 面板、控制台或管理界面的页面特征，判断目标是否暴露了对应服务入口。若命中，说明该后台或运维界面对外可访问，可用于资产识别与暴露面排查。
  reference:
    - https://www.device42.com/
  metadata:
    verified: true
    max-request: 2
    shodan-query: http.title:"device42"
  tags: panel,device42,login,discovery

http:
  - method: GET
    path:
      - "{{BaseURL}}/admin/login/?next=/"
      - "{{BaseURL}}"

    stop-at-first-match: true
    matchers:
      - type: dsl
        dsl:
          - 'status_code == 200'
          - 'contains_any(to_lower(body), "device42</title>", "<title>device42")'
        condition: and
