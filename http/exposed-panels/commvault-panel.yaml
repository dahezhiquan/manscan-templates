id: commvault-panel

info:
  name: Commvault Web Console 面板识别（指纹识别）
  author: rxerium
  severity: info
  description: 该模板通过识别 Commvault Web Console 登录入口的页面标题、特征文本或重定向行为，判断目标是否暴露了对应的认证界面。若命中，说明该登录面板对外可访问，可用于暴露面梳理与后续安全评估。
  reference:
    - https://www.commvault.com/
  metadata:
    verified: true
    shodan-query: http.favicon.hash:-542502280
  tags: panel,commvault,backup,login,detect,discovery

http:
  - method: GET
    path:
      - "{{BaseURL}}/commandcenter/login/preSso.jsp"

    matchers-condition: and
    matchers:
      - type: word
        part: body
        words:
          - "commandcenter/wcSSO.do"

      - type: word
        part: header
        words:
          - "Path=/commandcenter"

      - type: status
        status:
          - 200
