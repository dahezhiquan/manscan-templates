id: invoice-ninja-installer

info:
  name: Invoice Ninja 安装配置 Page 暴露
  author: DhiyaneshDK
  severity: high
  description: |
    检测到 Invoice Ninja 安装配置 Page 暴露。该页面属于安装、初始化或配置向导流程，若对外暴露，攻击者可能完成初始化、创建管理员账户或重新配置目标系统。
  reference:
    - https://invoiceninja.com/
  metadata:
    verified: true
    max-request: 1
    shodan-query: html:"Invoice Ninja Setup"
  tags: misconfig,install,exposure,invoice,vuln

http:
  - method: GET
    path:
      - "{{BaseURL}}/setup"

    matchers-condition: and
    matchers:
      - type: word
        part: body
        words:
          - "Invoice Ninja Setup"

      - type: status
        status:
          - 200
