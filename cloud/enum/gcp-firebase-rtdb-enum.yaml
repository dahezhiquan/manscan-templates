id: gcp-firebase-rtdb-enum

info:
  name: GCP Firebase Realtime Database - Cloud Enumeration（云安全）
  author: initstring
  severity: info
  description: Firebase Realtime Database 旧版默认域名位于 firebaseio.com，访问 /.json 端点会根据数据库状态返回不同响应。本模板请求 {{wordlist}}.firebaseio.com/.json，返回 200 表示数据库可能可读，401 表示受保护，402 表示计费或付款状态异常，423 表示数据库已停用。
  impact: |
    - 返回 200 的数据库可能允许匿名读取数据，存在用户数据、配置或业务记录泄露风险。
    - 其他状态码虽然不一定代表可读数据，但仍会暴露 Firebase Realtime Database 名称、项目状态和攻击面线索。
  remediation: |
    - 检查 Firebase Realtime Database Security Rules，确保 .read 和 .write 需要明确认证与授权条件。
    - 清理不再使用的数据库实例，轮换可能已暴露的密钥或敏感数据，并修正计费或停用状态异常。
  metadata:
    verified: true
    max-request: 1
    vendor: google
    product: firebase-realtime-database
  tags: enum,cloud,cloud-enum,gcp,discovery

self-contained: true

variables:
  BaseDNS: "firebaseio.com"

http:
  - raw:
      - |
        GET https://{{wordlist}}.{{BaseDNS}}/.json HTTP/1.1
        Host: {{wordlist}}.{{BaseDNS}}

    redirects: false

    attack: batteringram
    threads: 10

    matchers-condition: or
    matchers:
      - type: status
        name: "Open GCP Firebase RTDB"
        status:
          - 200

      - type: status
        name: "Protected GCP Firebase RTDB"
        status:
          - 401

      - type: status
        name: "Payment GCP on Google Firebase RTDB"
        status:
          - 402

      - type: status
        name: "Deactivated GCP Firebase RTDB"
        status:
          - 423
