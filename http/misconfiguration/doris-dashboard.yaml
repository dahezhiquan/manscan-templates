id: doris-dashboard

info:
  name: Doris 仪表盘 暴露
  author: ritikchaddha
  severity: medium
  description: |
    检测到 Doris 仪表盘 暴露。目标功能在未认证状态下可访问，可能暴露管理入口、业务数据、系统状态或可执行操作，需确认是否存在访问控制缺失。
  metadata:
    verified: true
    max-request: 1
    shodan-query: http.favicon.hash:24048806
  tags: doris,exposure,unauth,logs,misconfig,discovery

http:
  - method: GET
    path:
      - "{{BaseURL}}"

    matchers-condition: and
    matchers:
      - type: word
        part: body
        words:
          - 'Doris</title>'
          - 'CPU Profile</a>'
          - 'Heap Profile</a>'
        condition: and

      - type: status
        status:
          - 200
