id: bizzy-panel

info:
  name: BIZZY 登录 - 面板（暴露面识别）
  author: Kazgangap
  severity: info
  description: |-
    检测到 BIZZY 登录面板。BIZZY 是一个漏洞管理平台。
  classification:
    cwe-id: CWE-200
  metadata:
    verified: true
    max-request: 1
  tags: panel,bizzy,login,discovery

http:
  - method: GET
    path:
      - "{{BaseURL}}"

    host-redirects: true
    max-redirects: 2

    matchers:
      - type: dsl
        dsl:
          - 'contains(to_lower(body), "login - bizzy")'
          - 'status_code == 200'
        condition: and
