id: grandstream-grp-panel

info:
  name: Grandstream GRP Web 管理面板（指纹识别）
  author: DhiyaneshDk
  severity: info
  description: |
    检测到 Grandstream GRP Web 管理登录面板。目标页面加载了 tl.account.ucm.js 及 UCM 模块相关 webpack 资源，符合 Grandstream 管理界面的前端特征。
  classification:
    cpe: cpe:2.3:o:grandstream:ucm6200_firmware:*:*:*:*:*:*:*:*
  metadata:
    verified: true
    max-request: 1
    vendor: grandstream
    shodan-query: "tl.account.ucm.js"
  tags: panel,grandstream,grp,iot,detect

http:
  - method: GET
    path:
      - "{{BaseURL}}/login"

    matchers-condition: and
    matchers:
      - type: word
        words:
          - "tl.account.ucm.js"
          - "tl.phoneSettings.js"
        condition: and

      - type: word
        words:
          - "tl.maintenance.js"
          - "tl.sysSettings.js"
        condition: or

      - type: status
        status:
          - 200
