id: azure-storage-table-logging-disabled
info:
  name: Azure Storage Table 日志记录未启用（云安全）
  author: princechaddha
  severity: medium
  description: Azure Storage Table 日志可记录表实体的读取、写入和删除请求；关闭这些操作的日志会削弱对数据枚举、篡改和批量删除的审计能力。本模板枚举存储账户并执行 az storage logging show --services t，在 delete、read 和 write 均为 false 时报告 Table 服务未启用操作日志。
  impact: |
    - 未授权读取、修改或删除表实体的行为可能无法及时发现，攻击者可借此窃取业务数据或破坏应用状态。
    - 缺少操作日志会降低异常访问检测、事件溯源和数据恢复决策的准确性。
  remediation: |
    - 根据审计和事件响应需求启用 Table 服务的 read、write 和 delete 日志，并配置日志保留、访问控制和集中分析。
    - 将表操作日志接入异常读取、批量删除和权限滥用告警，同时评估日志成本与敏感数据保护要求。
  reference:
    - https://docs.microsoft.com/en-us/azure/storage/tables/table-storage-overview
  metadata:
    vendor: microsoft
    product: azure-storage
  tags: cloud,devops,azure,microsoft,azure-storage,azure-cloud-config

flow: |
  code(1);
  for (let AccountData of iterate(template.accountList)) {
    AccountData = JSON.parse(AccountData);
    set("name", AccountData.Name);
    code(2);
  }

self-contained: true
code:
  - engine:
      - sh
      - bash
    source: |
      az storage account list --query '[*].{"Name":name}'

    extractors:
      - type: json
        name: accountList
        internal: true
        json:
          - '.[]'

  - engine:
      - sh
      - bash
    source: |
      az storage logging show --services t --account-name "$name" --output json

    matchers:
      - type: word
        words:
          - '"delete": false'
          - '"read": false'
          - '"write": false'
        condition: and

    extractors:
      - type: dsl
        dsl:
          - 'name + " has logging for read, write, delete not enabled"'
