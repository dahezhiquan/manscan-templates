id: serge-panel

info:
  name: Serge 面板识别（指纹识别）
  author: rxerium
  severity: info
  description: |-
    Serge 是本地大语言模型聊天应用，用于部署、管理和使用私有 LLM 会话。该模板请求首页，并依据 HTTP 200 状态码、页面标题、正文关键字或品牌资源特征识别目标是否部署了该系统或暴露了对应入口，适用于资产指纹确认；命中结果仅表示系统特征匹配，不代表已确认存在未授权访问或可利用漏洞。
  reference:
  - https://github.com/serge-chat/serge
  - https://serge.chat
  metadata:
    verified: true
    max-request: 1
    vendor: serge-chat
    product: serge
    shodan-query: 'http.title:"Serge" port:8008'
  tags: panel,serge,llm,ai,chat,detect,discovery

http:
  - method: GET
    path:
      - "{{BaseURL}}"

    host-redirects: true
    max-redirects: 2

    matchers-condition: and
    matchers:
      - type: word
        part: body
        words:
          - "Serge - Powered by LLaMA"

      - type: status
        status:
          - 200
