id: alfresco-panel

info:
  name: Alfresco Content App 面板识别（指纹识别）
  author: Splint3r7
  severity: info
  description: |-
    检测到目标站点存在 Alfresco Content App 相关响应特征。Alfresco 是企业内容管理平台，用于文档管理、内容协作、流程集成和文件服务。模板请求 `/`，并通过页面标题或正文关键字、状态码、DSL 条件确认该系统指纹，用于资产识别、系统盘点和暴露面梳理。
  classification:
    cwe-id: CWE-200
  metadata:
    max-request: 1
    shodan-query: http.title:"Alfresco Content App"
  tags: panel,alfresco,login,detect,discovery
http:
  - method: GET
    path:
      - "{{BaseURL}}"

    matchers:
      - type: dsl
        dsl:
          - 'contains(body, "<title>Alfresco Content App")'
          - 'status_code == 200'
        condition: and
