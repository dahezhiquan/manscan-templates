id: typo3-installer

info:
  name: TYPO3 安装向导
  author: DhiyaneshDk
  severity: medium
  description: |
    检测到 TYPO3 安装向导。该页面属于安装、初始化或配置向导流程，若对外暴露，攻击者可能完成初始化、创建管理员账户或重新配置目标系统。
  classification:
    cpe: cpe:2.3:a:typo3:typo3:*:*:*:*:*:*:*:*
  metadata:
    verified: true
    max-request: 1
    vendor: typo3
    product: typo3
    shodan-query: title:"Installing TYPO3 CMS"
  tags: misconfig,typo3,install,vuln

http:
  - method: GET
    path:
      - '{{BaseURL}}/typo3/install.php'

    matchers-condition: and
    matchers:
      - type: word
        part: body
        words:
          - "<title>Installing TYPO3 CMS</title>"

      - type: word
        part: header
        words:
          - "text/html"

      - type: status
        status:
          - 200
