id: azure-appservice-backup-not-enabled
info:
  name: Azure App Service 自动备份未配置（云安全）
  author: princechaddha
  severity: medium
  description: Azure App Service 未配置自动备份时，应用内容、配置和可恢复状态可能无法按计划保留。该模板枚举 Web App，执行 az webapp config backup show，并在命令返回 Backup configuration not found 时报告未启用自动备份。
  impact: |
    - 误部署、恶意篡改、应用故障或数据损坏发生后，可能无法恢复到可信版本，延长业务中断时间。
    - 缺少定期备份还会削弱勒索、供应链入侵和运维误操作后的取证与恢复能力。
  remediation: |
    - 为 App Service 配置自动备份计划、受控存储账户和必要的备份内容，限制备份目标的访问权限。
    - 定期执行恢复演练，验证备份可读性、保留期限、跨区域恢复能力及备份目标的防篡改保护。
  reference:
    - https://docs.microsoft.com/en-us/azure/app-service/manage-backup
  metadata:
    vendor: microsoft
    product: azure-app-service
  tags: cloud,devops,azure,microsoft,appservice,azure-cloud-config

flow: |
  code(1);
  for (let AppServiceData of iterate(template.appServiceList)) {
    AppServiceData = JSON.parse(AppServiceData);
    set("name", AppServiceData.name);
    set("resourceGroup", AppServiceData.resourceGroup);
    code(2);
  }

self-contained: true
code:
  - engine:
      - sh
      - bash
    source: |
      az webapp list --output json --query '[*].{name:name, resourceGroup:resourceGroup}'

    extractors:
      - type: json
        name: appServiceList
        internal: true
        json:
          - '.[]'

  - engine:
      - sh
      - bash
    source: |
      az webapp config backup show --webapp-name $name --resource-group $resourceGroup --output json

    matchers:
      - type: word
        part: stderr
        words:
          - "Backup configuration not found"

    extractors:
      - type: dsl
        dsl:
          - 'name + " in " + resourceGroup + " does not have automated backups enabled"'
