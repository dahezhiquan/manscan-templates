id: gcloud-logs-router-cmek-not-enabled

info:
  name: Logs Router 加密 使用Customer-Managed Keys未启用（云安全）
  author: princechaddha
  severity: high
  description: Logs Router 未配置客户管理密钥时，日志路由相关数据使用 Google 默认加密，无法满足需要自行控制密钥生命周期的场景。本模板检查组织级 logging cmek-settings，并在 kmsKeyName 返回 null 时报告未启用 CMEK。
  impact: |
    - 组织无法通过自有 KMS 密钥控制日志路由数据的加密、轮换、禁用和销毁流程。
    - 对金融、政企或强监管环境，缺少 CMEK 可能不满足密钥托管和可审计控制要求。
  remediation: |
    - 在组织级 Logs Router 配置 CMEK，并授予 Cloud Logging 服务代理使用对应 KMS key 的权限。
    - 建立密钥轮换、禁用影响评估和访问审计流程，避免错误停用导致日志路由异常。
  reference:
    - https://cloud.google.com/logging/docs/routing/managed-encryption
  metadata:
    vendor: google
    product: cloud-logging
  tags: cloud,devops,gcp,gcloud,google-cloud-logging,gcp-cloud-config

self-contained: true

code:
  - engine:
      - sh
      - bash
    source: |
      gcloud alpha logging cmek-settings describe --organization=$organization --format="json(kmsKeyName)"

    matchers:
      - type: word
        words:
          - 'null'

    extractors:
      - type: dsl
        dsl:
          - '"Logs Router Encryption with CMK not enabled for your organization"'
