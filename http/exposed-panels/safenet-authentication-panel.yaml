id: safenet-authentication-panel

info:
  name: SafeNet Authentication 登录面板识别（暴露面识别）
  author: righettod
  severity: info
  description: |
    该模板通过识别 SafeNet Authentication 登录入口的页面标题、特征文本或重定向行为，判断目标是否暴露了对应的认证界面。若命中，说明该登录面板对外可访问，可用于暴露面梳理与后续安全评估。
  reference:
    - https://cpl.thalesgroup.com/access-management/safenet-trusted-access
  metadata:
    verified: true
    max-request: 1
    shodan-query: http.title:"Self Enrollment"
  tags: panel,safenet,thales,login,detect,discovery

http:
  - method: GET
    path:
      - "{{BaseURL}}/selfenrollment/Enrollment.aspx"

    matchers:
      - type: dsl
        dsl:
          - 'status_code == 200'
          - 'contains(to_lower(body), "self enrollment") && contains_any(to_lower(body), "safenet", "thales")'
        condition: and

    extractors:
      - type: regex
        part: body
        group: 1
        regex:
          - 'V=([0-9.]+)'
