id: apache-apisix-panel

info:
  name: Apache APISIX 登录面板识别（指纹识别）
  author: pikpikcu,righettod
  severity: info
  description: 该模板通过识别 Apache APISIX 登录入口的页面标题、特征文本或重定向行为，判断目标是否暴露了对应的认证界面。若命中，说明该登录面板对外可访问，可用于暴露面梳理与后续安全评估。
  classification:
    cwe-id: CWE-200
    cpe: cpe:2.3:a:apache:apisix:*:*:*:*:*:*:*:*
  metadata:
    max-request: 1
    vendor: apache
    product: apisix
    fofa-query:
      - title="Apache APISIX Dashboard"
      - title="apache apisix dashboard"
    shodan-query: http.title:"apache apisix dashboard"
    google-query: intitle:"apache apisix dashboard"
  tags: apache,apisix,panel,login,detect,discovery

http:
  - method: GET
    path:
      - "{{BaseURL}}/user/login?redirect=%2F"

    matchers-condition: and
    matchers:
      - type: word
        part: body
        words:
          - '<title>Apache APISIX Dashboard</title>'

      - type: status
        status:
          - 200

    extractors:
      - type: regex
        part: header
        group: 1
        regex:
          - '(?i)Server:\s+APISIX\/([0-9.]+)'
