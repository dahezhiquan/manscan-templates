id: exposed-gitmodules

info:
  name: .gitmodules 文件暴露（暴露面识别）
  author: pussycat0x
  severity: high
  description: |
    检测到目标站点可直接访问 .gitmodules 文件。Git 配置和凭据文件可能暴露源码仓库地址、子模块、账号凭据或访问令牌。该模板请求 `/.gitmodules`，并通过 HTTP 状态码、响应正文关键字、文件格式特征、正则匹配或响应头进行确认。此类资源公开后可能泄露部署细节、内部路径、依赖版本、环境变量、访问凭据或调试信息，增加被侦察和后续利用的风险。
  impact: |-
    - 版本控制或源码相关文件可能暴露仓库结构、内部路径、子模块地址、历史开发信息和敏感文件命名。
    - 攻击者可结合泄露线索定位源码、配置、备份或隐藏接口，扩大进一步信息收集范围。
    - 若同时暴露凭据或仓库访问地址，可能导致源码泄露、供应链篡改或内部系统被访问。
  remediation: |-
    - 确认该资源是否必须公网可访问；如非业务必需，应立即从 Web 根目录、静态资源目录、对象存储或反向代理公开路径中移除。
    - 在 Web 服务器、网关、CDN 或应用路由层增加拒绝规则、身份认证、IP allowlist 或内网访问限制。
    - 检查访问日志、下载记录和缓存记录，评估该资源是否已被外部访问或搜索引擎收录。
    - 若文件中包含凭据、令牌、连接串或私有地址，应执行密钥轮换、权限收敛和受影响系统访问审计。
  reference:
    - https://www.acunetix.com/vulnerabilities/web/git-repository-found/
    - https://pentester.land/tutorials/2018/10/25/source-code-disclosure-via-exposed-git-folder.html
  tags: exposure,git,source-disclosure,misconfig

http:
  - method: GET
    path:
      - "{{BaseURL}}/.gitmodules"

    matchers:
      - type: dsl
        dsl:
          - "status_code == 200"
          - "contains_all(body, '[submodule', 'path =', 'url =')"
        condition: and
