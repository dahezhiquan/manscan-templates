id: versa-flexvnf-server

info:
  name: Versa FlexVNF 指纹识别（指纹识别）
  author: c-sh0
  severity: info
  description: >-
    Versa FlexVNF 是 Versa Networks 的 SD-WAN/安全虚拟网络功能组件，用于分支网络连接和安全服务。该模板通过请求目标服务并检查预设路径或首页响应、HTTP
    响应头、页面正文关键字、状态码等指纹特征，判断目标是否使用或暴露了 Versa FlexVNF 相关组件；命中结果仅表示指纹特征匹配，可用于资产盘点、技术栈识别和后续安全评估，不代表已确认存在可利用漏洞。
  reference:
  - https://versa-networks.com/products/components/
  metadata:
    max-request: 1
  tags: tech,versa,flexvnf,discovery
http:
  - method: GET
    path:
      - "{{BaseURL}}/&?=?"

    host-redirects: true
    max-redirects: 2

    matchers-condition: and
    matchers:
      - type: word
        part: header
        words:
          - "Server: Versa"
          - "FlexVNF"
        condition: and

      - type: status
        status:
          - 200

    extractors:
      - type: kval
        part: header
        kval:
          - Server
