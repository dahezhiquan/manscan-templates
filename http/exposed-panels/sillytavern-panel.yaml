id: sillytavern-panel

info:
  name: SillyTavern 面板识别（指纹识别）
  author: rxerium
  severity: info
  description: |
    该模板用于识别 SillyTavern 是否存在对外暴露的管理、服务或状态界面。若命中，说明目标公开了相关功能入口，可作为资产盘点与攻击面收敛的依据。
  reference:
    - https://github.com/SillyTavern/SillyTavern
    - https://docs.sillytavern.app/
  metadata:
    verified: true
    max-request: 1
    vendor: SillyTavern
    product: sillytavern
    shodan-query: 'http.title:"SillyTavern"'
  tags: panel,sillytavern,llm,ai,detect,discovery

http:
  - method: GET
    path:
      - "{{BaseURL}}"

    host-redirects: true
    max-redirects: 2

    matchers-condition: and
    matchers:
      - type: word
        part: body
        words:
          - "<title>SillyTavern</title>"

      - type: status
        status:
          - 200
