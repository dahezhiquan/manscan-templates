id: shopify-app-installer

info:
  name: SEO King Shopify App — 安装向导
  author: tess
  severity: info
  description: |
    检测到 SEO King Shopify App — 安装向导。该页面属于安装、初始化或配置向导流程，若对外暴露，攻击者可能完成初始化、创建管理员账户或重新配置目标系统。
  metadata:
    verified: true
    max-request: 1
    shodan-query: title:"Shopify App — Installation"
  tags: misconfig,shopify,install,vuln

http:
  - method: GET
    path:
      - '{{BaseURL}}'

    host-redirects: true
    max-redirects: 2

    matchers-condition: and
    matchers:
      - type: word
        part: body
        words:
          - 'Shopify App — Installation'
          - 'example.myshopify.com'
        condition: and

      - type: status
        status:
          - 200
