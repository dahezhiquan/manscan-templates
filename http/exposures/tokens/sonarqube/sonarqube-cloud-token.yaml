id: sonarqube-cloud-token

info:
  name: SonarQube Cloud 令牌暴露（暴露面识别）
  author: DhiyaneshDk
  severity: high
  description: |
    检测到目标站点响应中暴露 SonarQube Cloud 令牌。SonarQube Token 用于代码质量项目、扫描结果、组织和云实例 API。该模板检查`/api/authentication/validate`，并先在目标响应中提取疑似凭据，再通过对应服务 API 的响应特征辅助确认有效性。公开后可能导致对应平台资源、数据、流水线、消息发送、支付能力或第三方集成被未授权访问。
  impact: |-
    - 泄露的 API Key、访问令牌、客户端密钥、Webhook、连接串或服务账号凭据可能被用于直接调用对应平台 API 或访问受保护资源。
    - 攻击者可能借助有效凭据读取、修改或删除数据，触发构建/部署任务，发送消息，管理云资源，或冒用集成应用身份。
    - 即使令牌权限有限，也会暴露账号、项目、组织或环境边界，辅助横向移动、供应链攻击和定向社工。
  remediation: |-
    - 立即撤销并轮换暴露的 API Key、访问令牌、客户端密钥、Webhook Secret、连接串或服务账号凭据。
    - 在对应平台检查令牌权限、作用域、有效期和最近调用记录，移除不必要的高权限或长期凭据。
    - 将密钥迁移到密钥管理系统、受保护的 CI/CD 变量或运行时注入机制，避免写入前端页面、日志、源码和公开配置。
    - 启用最小权限、IP/来源限制、MFA、告警和审计日志，并排查是否存在未授权资源访问或数据变更。
  reference:
    - https://sonarcloud.io/web_api/api/authentication
    - https://docs.sonarsource.com/sonarqube/latest/user-guide/user-account/generating-and-using-tokens/#types-of-tokens
  metadata:
    max-request: 1
    verified: true
  tags: exposure,token,sonarqube,vuln

flow: http(1) && http(2)

http:
  - method: GET
    path:
      - "{{BaseURL}}"

    matchers:
      - type: regex
        part: body
        name: token
        regex:
          - '\b[a-fA-F\d]{40}\b'
        internal: true

  - raw:
      - |
        @Host: https://sonarcloud.io:443
        GET /api/authentication/validate HTTP/1.1
        Host: sonarcloud.io
        Authorization: Basic {{base64(token + ':')}}

    disable-path-automerge: true

    matchers:
      - type: dsl
        dsl:
          - status_code == 200
          - contains(body, 'valid') && contains(body, 'true')
          - contains(content_type, "application/json")
        condition: and

    extractors:
      - type: dsl
        dsl:
          - token
