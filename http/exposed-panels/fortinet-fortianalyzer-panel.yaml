id: fortinet-fortianalyzer-panel

info:
  name: Fortinet FortiAnalyzer 登录面板（暴露面识别）
  author: rxerium
  severity: info
  description: |-
    Fortinet FortiAnalyzer 是面向 Fortinet 安全设备的集中式日志管理与分析平台。其 Web 管理控制台通常暴露于公网的 443、10443、9443 或 4443 端口。
  reference:
    - https://www.fortinet.com/products/management/fortianalyzer
  metadata:
    max-request: 1
    shodan-query: 'http.title:"FortiAnalyzer"'
  tags: panel,fortinet,fortianalyzer,network,vpn,ics

http:
  - method: GET
    path:
      - "{{BaseURL}}"

    redirects: true
    max-redirects: 2
    matchers-condition: and
    matchers:
      - type: word
        words:
          - "FortiAnalyzer"
        part: body

      - type: status
        status:
          - 200
