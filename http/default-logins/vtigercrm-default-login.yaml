id: vtigercrm-default-login

info:
  name: Vtiger CRM 默认口令登录（弱口令）
  author: icarot
  severity: high
  description: |
    该模板用于检测 Vtiger CRM 是否仍可使用默认凭据或弱口令登录。模板主要向 `/index.php`、`/index.php?action=index&module=Home` 等认证入口发送请求，使用内置默认凭据组合进行认证尝试，并根据状态码、认证 Cookie、跳转位置或登录后的页面关键字判断登录是否成功；命中说明目标未及时修改出厂、示例或初始化账号口令。
  impact: |
    - 攻击者可登录 Vtiger CRM 后台，管理内容、用户、插件、主题、文件、表单或业务流程配置。
    - 后台权限被滥用后，可能导致页面篡改、恶意文件上传、敏感资料泄露，或进一步取得服务器执行能力。
  remediation: |
    - 立即修改默认管理员凭据，删除安装向导、演示账号和不必要的后台用户。
    - 限制后台登录入口访问来源，启用多因素认证、登录失败锁定和验证码等防护。
    - 检查近期内容、插件、主题、文件上传和管理员操作记录，确认没有持久化后门。
  reference:
    - https://github.com/vtiger-crm/vtigercrm
    - https://code.vtiger.com/vtiger/vtigercrm
  metadata:
    verified: true
    max-request: 2
    shodan-query: html:"Powered by vtiger CRM"
  tags: default-login,vtiger,vtiger-crm,vuln

variables:
  username: admin
  password: admin

http:
  - raw:
      - |
        POST /index.php HTTP/1.1
        Host: {{Hostname}}
        Content-Type: application/x-www-form-urlencoded

        module=Users&action=Authenticate&return_module=Users&return_action=Login&user_name={{username}}&user_password={{password}}

      - |
        GET /index.php?action=index&module=Home HTTP/1.1
        Host: {{Hostname}}

    host-redirects: true
    max-redirects: 2
    matchers:
      - type: dsl
        dsl:
          - 'status_code_2 == 200'
          - 'contains(header_1, "PHPSESSID=")'
          - 'contains_all(body_2, "home", "index.php?module=Emails&action=index")'
        condition: and
