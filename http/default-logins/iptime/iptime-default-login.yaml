id: iptime-default-login

info:
  name: ipTIME 默认口令登录（弱口令）
  author: gy741
  severity: high
  description: 该模板通过尝试 ipTIME 的默认管理员账号口令，并依据认证成功后的响应特征判断目标是否仍在使用未修改的弱口令。若命中，攻击者通常可直接获得后台管理权限，进一步访问敏感信息、修改配置或执行未授权操作。
  reference:
    - https://www.freewebtools.com/IPTIME/
  classification:
    cvss-metrics: CVSS:3.0/AV:N/AC:L/PR:N/UI:N/S:C/C:L/I:L/A:L
    cvss-score: 8.3
    cwe-id: CWE-522
  metadata:
    max-request: 1
  tags: iptime,default-login,vuln

http:
  - raw:
      - |
        POST /sess-bin/login_handler.cgi HTTP/1.1
        Host: {{Hostname}}
        Referer: {{BaseURL}}/sess-bin/login_session.cgi

        username={{username}}&passwd={{password}}

    payloads:
      username:
        - admin
      password:
        - admin
    attack: pitchfork

    matchers-condition: and
    matchers:
      - type: status
        status:
          - 200

      - type: word
        words:
          - "setCookie"
          - "efm_session_id"
          - "login.cgi"
        part: body
        condition: and
