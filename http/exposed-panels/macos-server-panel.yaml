id: macos-server-panel

info:
  name: macOS Server 面板识别（指纹识别）
  author: DhiyaneshDk
  severity: info
  description: |-
    检测到目标站点存在 macOS Server 相关响应特征。macOS Server 是监控、日志、分析或可观测性系统，用于展示运行指标、告警事件、日志数据和服务状态。模板请求 `/`，并通过页面标题或正文关键字、状态码确认该系统指纹，用于资产识别、系统盘点和暴露面梳理。
  metadata:
    verified: true
    max-request: 1
    shodan-query: title:"macOS Server"
  tags: panel,login,macos-server,detect,discovery
http:
  - method: GET
    path:
      - "{{BaseURL}}"

    matchers-condition: and
    matchers:
      - type: word
        words:
          - 'macOS Server'
          - 'apple-system'
        condition: and

      - type: status
        status:
          - 200
