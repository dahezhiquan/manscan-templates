id: twitch-phish

info:
  name: Twitch 仿冒钓鱼网站（钓鱼网站识别）
  author: rxerium
  severity: info
  description: |
    检测到疑似仿冒 Twitch 的钓鱼网站。模板在目标页面返回 200、页面内容命中 Twitch 的品牌页面特征，且当前主机不属于 twitch.tv 官方域名时触发，用于识别借用 Twitch 品牌页面诱导用户信任的仿冒站点。
  reference:
    - https://twitch.tv
  metadata:
    max-request: 1
  tags: phishing,twitch,osint,discovery
http:
  - method: GET
    path:
      - "{{BaseURL}}"

    host-redirects: true
    max-redirects: 2

    matchers-condition: and
    matchers:
      - type: word
        words:
          - 'Twitch is an interactive livestreaming service for content spanning gaming, entertainment, sports, music, and more. There’s something for everyone on Twitch.'

      - type: status
        status:
          - 200

      - type: dsl
        dsl:
          - '!contains(host,"twitch.tv")'
