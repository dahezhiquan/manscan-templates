id: iam-user-password-change
info:
  name: IAM 用户自助修改密码未启用（云安全）
  author: princechaddha
  severity: high
  description: IAM password policy 未允许用户自助修改密码时，用户无法在发现泄露或按周期要求时自行更新控制台口令。该模板查询 PasswordPolicy.AllowUsersToChangePassword，并在结果为 false 时命中。
  impact: |
    - 口令轮换依赖管理员介入，可能延迟凭据泄露后的处置。
    - 用户难以及时更换临时口令或可疑口令，增加账号被持续滥用的窗口。
  remediation: |
    - 在 IAM password policy 中启用 AllowUsersToChangePassword，并配合复杂度和重用限制策略。
    - 对特权用户继续强制 MFA，并结合集中身份管理减少长期 IAM 用户口令。
  reference:
    - https://docs.aws.amazon.com/cli/latest/reference/iam/get-account-password-policy.html
  metadata:
    vendor: amazon
    product: iam
  tags: cloud,devops,aws,amazon,iam,aws-cloud-config
self-contained: true
code:
  - engine:
      - sh
      - bash
    source: |
      aws iam get-account-password-policy --query 'PasswordPolicy.AllowUsersToChangePassword'

    matchers:
      - type: word
        words:
          - "false"

    extractors:
      - type: dsl
        dsl:
          - '"AllowUsersToChangePassword Policy is not enabled in your AWS account"'
