id: azure-policy-assignment-delete-unalerted
info:
  name: Azure 策略分配删除告警未配置（云安全）
  author: princechaddha
  severity: high
  description: Azure Policy assignment 删除会移除管理组、订阅或资源组范围内的策略约束；未配置 Activity Log 告警时，安全基线可能被撤销而不被及时发现。该模板枚举已启用的 Activity Log Alert，并检查 condition 是否缺少 Microsoft.Authorization/policyAssignments/delete 操作条件。
  impact: |
    - 删除策略分配可能使资源绕过加密、网络隔离、标签或审计等组织控制。
    - 攻击者可利用策略缺口部署高风险资源或隐藏后续持久化操作。
  remediation: |
    - 创建针对策略分配删除操作的 Activity Log Alert，并将通知接入策略变更响应流程。
    - 限制删除权限，启用策略保护和定期合规评估，发现未授权删除后及时恢复分配。
  reference:
    - https://docs.microsoft.com/en-us/azure/azure-monitor/platform/alerts-activity-log
  metadata:
    vendor: microsoft
    product: azure-monitor
  tags: cloud,devops,azure,microsoft,policy-assignment,azure-cloud-config

flow: |
  code(1);
  for (let AlertData of iterate(template.alertList)) {
    set("id", AlertData);
    code(2);
  }

self-contained: true
code:
  - engine:
      - sh
      - bash
    source: |
      az monitor activity-log alert list --output json --query '[?(enabled==`true`)].id'

    extractors:
      - type: json
        name: alertList
        internal: true
        json:
          - '.[]'

  - engine:
      - sh
      - bash
    source: |
      az monitor activity-log alert show --ids "$id" --query 'condition'

    matchers-condition: and
    matchers:
      - type: word
        words:
          - '"field": "operationName"'

      - type: word
        words:
          - "Microsoft.Authorization/policyAssignments/delete"
        negative: true

    extractors:
      - type: dsl
        dsl:
          - 'id + " does not have the correct alert configuration for Delete Policy Assignment events"'
