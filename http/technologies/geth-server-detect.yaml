id: geth-server-detect

info:
  name: Go Ethereum JSON RPC HTTP 指纹识别（指纹识别）
  author: Nullfuzz
  severity: info
  description: >-
    Go Ethereum JSON RPC HTTP 是 AI/大语言模型相关 Web 平台或服务组件，用于模型推理、工作流编排或交互式管理。该模板通过请求目标服务并检查页面正文关键字、正则特征、DSL
    条件等指纹特征，判断目标是否使用或暴露了 Go Ethereum JSON RPC HTTP 相关组件；命中结果仅表示指纹特征匹配，可用于资产盘点、技术栈识别和后续安全评估，不代表已确认存在可利用漏洞。
  reference:
  - https://geth.ethereum.org/docs
  - https://github.com/ethereum/go-ethereum
  metadata:
    verified: true
    max-request: 1
    shodan-query: product:"Geth"
  tags: tech,geth,ethereum,web3,blockchain,discovery
http:
  - raw:
      - |
        POST / HTTP/1.1
        Host: {{Hostname}}
        Content-Type: application/json

        {"method":"web3_clientVersion","params":[],"id":1,"jsonrpc":"2.0"}

    matchers:
      - type: dsl
        dsl:
          - 'status_code == 200'
          - 'contains(header, "application/json")'
          - 'contains(body, "Geth")'
        condition: and

    extractors:
      - type: regex
        part: body
        group: 1
        regex:
          - '(v[0-9a-z-_.]+)'
