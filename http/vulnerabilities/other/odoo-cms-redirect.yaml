id: odoo-cms-redirect

info:
  name: Odoo CMS - 开放重定向漏洞
  author: 0x_Akoko
  severity: medium
  description: Odoo CMS - 开放重定向 存在开放重定向漏洞。攻击者可构造恶意跳转链接诱导用户访问钓鱼站点，或配合其他业务流程绕过安全校验。
  reference:
    - https://cxsecurity.com/issue/WLB-2021020143
    - https://www.odoo.com/page/security-nonvuln-redirectors
  classification:
    cvss-metrics: CVSS:3.1/AV:N/AC:L/PR:N/UI:R/S:C/C:L/I:L/A:N
    cvss-score: 6.1
    cwe-id: CWE-601
  metadata:
    max-request: 1
  tags: odoo,redirect,vuln

http:
  - method: GET
    path:
      - "{{BaseURL}}/website/lang/en_US?r=https://interact.sh/"

    matchers:
      - type: regex
        regex:
          - '(?m)^(?:Location\s*?:\s*?)(?:https?://|//)?(?:[a-zA-Z0-9\-_\.@]*)interact\.sh.*$'
        part: header
