id: python-venv-exposure

info:
  name: Python Virtual Environment Directory 暴露（暴露面识别）
  author: a1baradi
  severity: info
  description: |
    检测到对外可访问的 Python Virtual Environment Directory。相关文件可能泄露项目结构、依赖关系、部署细节、敏感参数或其他不应公开的内部信息。
  reference:
    - https://docs.python.org/3/library/venv.html
  metadata:
    verified: true
    max-request: 1
    google-query: "intitle: Index of /venv"
  tags: venv,exposure,python-env,info,vuln

http:
  - method: GET
    path:
      - "{{BaseURL}}/venv/"

    matchers-condition: and
    matchers:
      - type: word
        part: body
        words:
          - "Index of /venv"

      - type: status
        status:
          - 200
