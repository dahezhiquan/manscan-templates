id: wallix-accessmanager-panel

info:
  name: Wallix Access Manager 面板暴露（暴露面识别）
  author: righettod
  severity: low
  description: Wallix Access Manager 是特权访问管理平台，用于堡垒机访问、会话审计和身份授权。该模板请求 `/wabam`、`/wabam/favicon.ico`，并依据 favicon 哈希、DSL 条件判断目标是否对外暴露了 Wallix Access Manager 的面板，用于发现互联网可访问的后台、控制台或业务入口。
  impact: "- 暴露的 Wallix Access Manager 面板会泄露目标正在使用的产品、部署路径、页面特征或组织业务入口，便于攻击者进行指纹确认和漏洞匹配。\n- 如果认证、访问控制或默认凭据策略薄弱，攻击者可能进一步尝试进入后台，影响后台配置、业务数据、用户账号或设备运行状态。\n- 对互联网开放的管理入口会增加暴力破解、凭据填充、已知漏洞利用和钓鱼仿冒的攻击面。"
  remediation: "- 将 Wallix Access Manager 的面板限制在内网、VPN、零信任代理或专用管理网段访问，避免直接暴露在互联网。\n- 启用强密码、多因素认证、登录失败限制和审计告警，排查默认账号、弱口令及长期未使用账号。\n- 保持 Wallix Access Manager 及其依赖组件更新到受支持版本，并通过反向代理、ACL 或防火墙限制敏感路径访问。"
  reference:
  - https://www.wallix.com/privileged-access-management/access-manager/
  classification:
    cvss-metrics: CVSS:3.0/AV:N/AC:L/PR:N/UI:N/S:U/C:N/I:N/A:N
    cwe-id: CWE-200
    cpe: cpe:2.3:a:wallix:bastion_access_manager:*:*:*:*:*:*:*:*
  metadata:
    max-request: 2
    shodan-query: http.title:"Wallix Access Manager"
    product: bastion_access_manager
    vendor: wallix
  tags: panel,wallix,discovery

http:
  - method: GET
    path:
      - '{{BaseURL}}/wabam'
      - '{{BaseURL}}/wabam/favicon.ico'

    stop-at-first-match: true
    host-redirects: true
    max-redirects: 3

    matchers-condition: or
    matchers:
      - type: dsl
        dsl:
          - "status_code==200"
          - "contains(tolower(body), '<title>wallix access manager</title>')"
        condition: and

      - type: dsl
        dsl:
          - "status_code==200"
          - "('1745235488' == mmh3(base64_py(body)))"
        condition: and
