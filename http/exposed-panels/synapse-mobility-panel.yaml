id: synapse-mobility-panel

info:
  name: Synapse Mobility 登录面板识别（暴露面识别）
  author: idealphase
  severity: info
  description: 该模板通过识别 Synapse Mobility 登录入口的页面标题、特征文本或重定向行为，判断目标是否暴露了对应的认证界面。若命中，说明该登录面板对外可访问，可用于暴露面梳理与后续安全评估。
  reference:
    - https://synapse.fujifilm.eu/synapse-mobility.html
  classification:
    cvss-metrics: CVSS:3.0/AV:N/AC:L/PR:N/UI:N/S:U/C:N/I:N/A:N
    cwe-id: CWE-200
  metadata:
    max-request: 1
    shodan-query: http.title:"Synapse Mobility Login"
    google-query: intitle:"Synapse Mobility Login"
  tags: panel,synapse,discovery

http:
  - method: GET
    path:
      - "{{BaseURL}}/pureweb/server/login.jsp"

    matchers-condition: and
    matchers:
      - type: word
        part: body
        words:
          - "<title>Synapse Mobility Login</title>"

      - type: status
        status:
          - 200
