id: zmanda-default-login

info:
  name: Zmanda 默认口令登录（弱口令）
  author: Techryptic (@Tech)
  severity: high
  description: |
    该模板用于检测 Zmanda 管理控制台是否仍可使用默认管理员凭据登录。模板向 `/ZMC_Admin_Login` 提交内置默认凭据组合，并根据返回的备份集管理页面关键字判断认证是否成功；命中说明目标未及时修改初始化管理员口令。
  impact: |
    - 攻击者可进入 Zmanda 备份管理后台，查看备份集、存储目标、任务计划和恢复配置。
    - 备份平台失陷可能导致备份数据泄露、恢复链路被篡改、备份任务被删除，进而削弱业务灾备能力。
  remediation: |
    - 立即修改默认管理员口令，删除测试账号，并为备份管理员启用唯一强密码。
    - 限制管理控制台访问来源，确保备份平台仅能从可信运维网段访问。
    - 审计近期备份集、恢复任务、存储目标和用户权限变更，轮换相关存储或系统凭据。
  reference:
    - https://www.zmanda.com
  classification:
    cvss-metrics: CVSS:3.0/AV:N/AC:L/PR:N/UI:N/S:C/C:L/I:L/A:L
    cvss-score: 8.3
    cwe-id: CWE-522
  metadata:
    max-request: 1
  tags: zmanda,default-login,vuln

http:
  - raw:
      - |
        POST /ZMC_Admin_Login HTTP/1.1
        Host: {{Hostname}}
        Content-Type: application/x-www-form-urlencoded
        Cookie: zmc_cookies_enabled=true

        login=AEE&last_page=&username={{username}}&password={{password}}&submit=Login&JS_SWITCH=JS_ON

    payloads:
      username:
        - admin
      password:
        - admin
    attack: pitchfork

    matchers-condition: and
    matchers:
      - type: word
        words:
          - "ZMC - Backup Set Management"

      - type: status
        status:
          - 200
