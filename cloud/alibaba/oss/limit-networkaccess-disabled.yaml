id: limit-networkaccess-disabled

info:
  name: 阿里云 OSS Bucket 未限制指定网络访问（云安全）
  author: DhiyaneshDK
  severity: medium
  description: OSS Bucket Policy 如果未使用 acs:SourceIp 等条件限制访问来源，已授权主体可能从任意网络位置访问 Bucket，扩大数据暴露面。模板枚举 Bucket 后读取 bucket-policy，当策略包含 Principal、Resource、Action 但缺少 IpAddress/acs:SourceIp 条件时，判定未限制选定网络访问。
  impact: |
    - 即使访问主体已受权限控制，缺少来源网络约束仍会增加凭据泄露后的数据访问范围。
    - 无法按可信出口、办公网、专线或 VPC 边界约束对象访问，削弱数据防泄漏和最小访问策略。
  remediation: |
    - 在 Bucket Policy 中增加 IpAddress 条件，使用 acs:SourceIp 将访问限制到可信公网出口、VPN 或专线地址段。
    - 对需要私网访问的业务优先使用内网 Endpoint、VPC 访问路径和最小权限 RAM 策略。
  reference:
    - https://www.trendmicro.com/cloudoneconformity/knowledge-base/alibaba-cloud/AlibabaCloud-OSS/publicly-accessible-oss-bucket.html
    - https://www.alibabacloud.com/help/en/oss/user-guide/block-public-access
  metadata:
    max-request: 2
    verified: true
    vendor: alibaba
    product: oss
  tags: cloud,devops,aliyun,alibaba,aliyun-cloud-config,alibaba-oss

variables:
  region: "cn-hangzhou"

flow: |
  code(1)
  for (let BucketName of iterate(template.bucketname)) {
    set("bucket", BucketName)
    code(2)
  }

self-contained: true

code:
  - engine:
      - sh
      - bash

    source: |
      aliyun oss ls --region $region

    extractors:
      - type: regex
        name: bucketname
        internal: true
        regex:
          - 'oss://([a-zA-Z0-9-]+)'

  - engine:
      - sh
      - bash

    source: |
      aliyun oss bucket-policy --method get $bucket --region $region

    matchers-condition: and
    matchers:
      - type: word
        words:
          - '"IpAddress":'
          - '"acs:SourceIp":'
        negative: true

      - type: word
        words:
          - '"Principal":'
          - '"Resource":'
          - '"Action":'
        condition: and

    extractors:
      - type: dsl
        dsl:
          - 'bucket + " Limit Network Access to Selected Networks is Disabled "'
