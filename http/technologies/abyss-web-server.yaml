id: abyss-web-server

info:
  name: Abyss Web 服务器 指纹识别（指纹识别）
  author: pussycat0x
  severity: info
  description: Abyss Web 服务器 是轻量级 Web 服务器，用于托管静态页面、脚本应用和小型 Web 服务。该模板请求首页，并依据 HTTP 200 状态码、页面标题、正文关键字或品牌资源特征识别目标是否使用或暴露了 Abyss Web 服务器 相关组件，适用于资产盘点、技术栈识别和后续安全评估；命中结果仅表示指纹特征匹配，不代表已确认存在可利用漏洞。
  metadata:
    max-request: 1
    fofa-query: app="Abyss-Web-Server"
  tags: tech,discovery

http:
  - method: GET
    path:
      - "{{BaseURL}}"

    matchers-condition: and
    matchers:
      - type: word
        part: body
        words:
          - "Welcome to Abyss Web Server"

      - type: status
        status:
          - 200
