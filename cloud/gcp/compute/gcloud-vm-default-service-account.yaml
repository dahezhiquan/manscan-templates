id: gcloud-vm-default-service-account

info:
  name: VM Instance Using Default Service Account（云安全）
  author: princechaddha
  severity: medium
  description: 使用默认 Compute Engine 服务账号会让多个实例共享同一身份，容易偏离最小权限和职责隔离原则。本模板枚举实例并检查 serviceAccounts.email，匹配 compute@developer.gserviceaccount.com 时报告虚拟机使用默认服务账号。
  impact: |
    - 默认服务账号权限常被多个工作负载复用，任一实例被攻破后可能影响同身份下的其他资源。
    - 审计日志难以区分具体业务组件，权限收敛和异常行为归因会更困难。
  remediation: |
    - 为不同应用、环境或职责创建专用服务账号，并按最小权限授予 IAM 角色。
    - 逐步替换默认服务账号绑定，禁用不再需要的默认服务账号高危权限。
  reference:
    - https://www.trendmicro.com/cloudoneconformity/knowledge-base/gcp/ComputeEngine/default-service-accounts-in-use.html
    - https://cloud.google.com/compute/docs/access/service-accounts
  metadata:
    vendor: google
    product: compute-engine
  tags: cloud,devops,gcp,gcloud,compute,security,iam,service-account,gcp-cloud-config

flow: |
  code(1)
  for(let projectId of iterate(template.projectIds)){
    set("projectId", projectId)
    code(2)
    for(let instance of iterate(template.instances)){
      instance = JSON.parse(instance)
      set("instanceName", instance.name)
      set("zone", instance.zone)
      code(3)
    }
  }

self-contained: true

code:
  - engine:
      - sh
      - bash
    source: |
      gcloud projects list --format="json(projectId)"

    extractors:
      - type: json
        name: projectIds
        internal: true
        json:
          - '.[].projectId'

  - engine:
      - sh
      - bash
    source: |
      gcloud compute instances list --project $projectId --format="json(name,zone.basename())"

    extractors:
      - type: json
        name: instances
        internal: true
        json:
          - '.[]'

  - engine:
      - sh
      - bash
    source: |
      gcloud compute instances describe $instanceName --zone $zone --project $projectId --format="json(serviceAccounts[].email)"

    matchers:
      - type: word
        words:
          - "compute@developer.gserviceaccount.com"

    extractors:
      - type: dsl
        dsl:
          - '"VM instance " + instanceName + " in zone " + zone + " of project " + projectId + " is using the default Compute Engine service account"'
