id: inventree-panel

info:
  name: InvenTree 面板 - 检测（指纹识别）
  author: ChrisJr404
  severity: info
  description: |-
    InvenTree（inventree.org / github.com/inventree/InvenTree）是一款开源的库存管理系统。其 API 根路径 /api/ 无需认证即可访问，并返回包含运行版本在内的服务器元数据，导致面向互联网的实例被暴露。
  reference:
    - https://github.com/inventree/InvenTree
    - https://inventree.org/
  metadata:
    verified: true
    max-request: 1
    vendor: inventree
    product: inventree
    shodan-query: http.title:"InvenTree"
    fofa-query: title="InvenTree"
  tags: panel,inventree,inventory,selfhosted,detect,discovery,login

http:
  - method: GET
    path:
      - "{{BaseURL}}/api/"

    matchers:
      - type: dsl
        dsl:
          - 'status_code == 200'
          - 'contains(content_type, "application/json")'
          - 'contains(body, "InvenTree")'
          - 'contains_all(body, "\"apiVersion\"", "\"worker_running\"", "\"instance\"")'
        condition: and

    extractors:
      - type: json
        part: body
        json:
          - '.version'
