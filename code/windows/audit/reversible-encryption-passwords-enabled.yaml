id: reversible-encryption-passwords-enabled

info:
  name: 可逆加密存储密码已启用（本地基线扫描）
  author: princechaddha
  severity: critical
  description: |
    该模板检查是否启用使用可逆加密存储密码。该方式接近明文保存。
  impact: |
    攻击者获取凭据数据库后可更容易还原用户密码。
  remediation: |
    禁用可逆加密存储密码，并要求相关用户轮换密码。
  tags: windows,code,windows-audit

self-contained: true

code:
  - pre-condition: |
      IsWindows();
    engine:
      - powershell
      - powershell.exe
    args:
      - -ExecutionPolicy
      - Bypass
    pattern: "*.ps1"
    source: |
      Get-Module -ListAvailable -Name ActiveDirectory | % { Get-ADDefaultDomainPasswordPolicy | Select-Object -ExpandProperty ReversibleEncryptionEnabled }

    matchers:
      - type: word
        words:
          - "True"
