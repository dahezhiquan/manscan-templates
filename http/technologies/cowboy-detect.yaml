id: cowboy-detect

info:
  name: Cowboy 指纹识别（指纹识别）
  author: sechunt3r
  severity: info
  description: Cowboy 是 Erlang/Elixir HTTP 服务器组件，用于构建 Web 服务和实时应用。该模板请求首页，并依据页面标题、正文关键字或品牌资源特征、响应头特征识别目标是否使用或暴露了 Cowboy 相关组件，适用于资产盘点、技术栈识别和后续安全评估；命中结果仅表示指纹特征匹配，不代表已确认存在可利用漏洞。
  reference:
  - https://github.com/ninenines/cowboy
  metadata:
    verified: true
    max-request: 1
    shodan-query: "cowboy"
  tags: tech,cowboy,detect,discovery

http:
  - method: GET
    path:
      - "{{BaseURL}}"

    matchers:
      - type: word
        part: header
        words:
          - "Server: Cowboy"
        case-insensitive: true
