id: apex-central-panel

info:
  name: TrendMicro Apex Central Login 面板（暴露面识别）
  author: darses
  severity: info
  description: |
    该模板通过识别 TrendMicro Apex Central Login 登录入口的页面标题、特征文本或重定向行为，判断目标是否暴露了对应的认证界面。若命中，说明该登录面板对外可访问，可用于暴露面梳理与后续安全评估。
  metadata:
    max-request: 1
  tags: panel,trendmicro,login,discovery

http:
  - method: GET
    path:
      - "{{BaseURL}}/webapp/login.html"

    matchers-condition: and
    matchers:
      - type: word
        part: body
        words:
          - "<title>Login</title>"
          - "images/logo_trend_20.png"
          - "Action=GetLogonInfo"
        condition: and

      - type: status
        status:
          - 200
