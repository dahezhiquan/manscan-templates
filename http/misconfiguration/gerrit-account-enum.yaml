id: gerrit-account-enum

info:
  name: Gerrit Code Review 账号枚举
  author: DhiyaneshDk
  severity: medium
  description: |
    该模板用于核查 Gerrit Code Review 账号枚举。该类问题通常源于用户、账号、仓库或接口查询端点缺少枚举防护，导致攻击者可批量验证目标对象是否存在。模板会向目标发送探测请求，并依据请求 `/accounts/?q=a&n=10`、`/accounts/?suggest&q=a&n=10`、匹配 `_account_id`、匹配 `username`、状态码 200等证据确认目标是否存在该配置问题。
  impact: |
    - 攻击者可收集有效账号、仓库、用户资料或组织结构信息。
    - 枚举结果可被用于密码喷洒、钓鱼、凭据填充或后续权限攻击。
  remediation: |
    - 对枚举接口增加认证授权、速率限制和统一错误响应。
    - 避免在未授权响应中区分“存在”和“不存在”等状态差异。
    - 监控批量查询、异常失败率和针对账号空间的自动化探测。
  reference:
    - https://gerrit-review.googlesource.com/Documentation/rest-api-accounts.html
    - https://gerrit-documentation.storage.googleapis.com/Documentation/2.11/rest-api-accounts.html
  metadata:
    max-request: 2
    verified: true
    shodan-query: title:"Gerrit Code Review"
    fofa-query: title="Gerrit Code Review"
  tags: gerrit,enum,exposure,misconfig

http:
  - method: GET
    path:
      - "{{BaseURL}}/accounts/?q=a&n=10"
      - "{{BaseURL}}/accounts/?suggest&q=a&n=10"

    stop-at-first-match: true

    matchers-condition: and
    matchers:
      - type: word
        part: body
        words:
          - "_account_id"
          - "username"
        condition: and

      - type: status
        status:
          - 200

    extractors:
      - type: regex
        name: usernames
        part: body
        group: 1
        regex:
          - '"username":\s*"([^"]+)"'
