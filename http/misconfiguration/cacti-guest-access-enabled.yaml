id: cacti-guest-access-enabled

info:
  name: Cacti Guest 用户 访问 启用
  author: DhiyaneshDk
  severity: medium
  description: |
    该模板用于核查 Cacti Guest 用户 访问启用状态。该类问题通常源于管理端、API、控制台或调试接口缺少认证授权，导致未登录用户可直接访问敏感功能。模板会向目标发送探测请求，并依据请求 `/graph_view.php`、`/cacti/graph_view.php`、匹配 `Tree Mode`、`List Mode`、状态码 200 等证据确认目标是否存在该配置问题。
  impact: |
    - 攻击者可在未授权状态下查看系统状态、任务信息、配置数据或业务内容。
    - 若接口允许执行操作，可能进一步导致配置被修改、任务被触发、数据被导出或服务被接管。
  remediation: |
    - 为相关管理入口和 API 增加强认证、细粒度授权与访问审计。
    - 限制控制台、调试页和内部服务的公网访问，仅允许可信网络或堡垒机访问。
    - 排查访问日志，确认是否存在未授权访问、异常操作或批量枚举行为。
  metadata:
    verified: true
    max-request: 1
    vendor: cacti
    product: cacti
    shodan-query: html:"graph_view.php" html:"cacti"
  tags: cacti,misconfig,unauth,guest-access

http:
  - method: GET
    path:
      - "{{BaseURL}}/graph_view.php"
      - "{{BaseURL}}/cacti/graph_view.php"

    stop-at-first-match: true

    matchers-condition: and
    matchers:
      - type: word
        part: body
        words:
          - "Tree Mode"
          - "List Mode"
          - "Preview Mode"
        condition: or

      - type: word
        part: body
        words:
          - "Login to Cacti"
          - "Please enter your Cacti"
        negative: true

      - type: status
        status:
          - 200
