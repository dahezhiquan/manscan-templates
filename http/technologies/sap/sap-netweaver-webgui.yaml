id: sap-netweaver-webgui

info:
  name: SAP NetWeaver WebGUI 指纹识别（指纹识别）
  author: randomstr1ng
  severity: info
  description: 用于识别目标是否运行 SAP NetWeaver WebGUI，模板会结合页面标题、页面正文和特定路径或已知端点进行服务指纹匹配。
  metadata:
    max-request: 1
  tags: sap,webserver,tech,discovery

http:
  - method: GET
    path:
      - "{{BaseURL}}/sap/bc/gui/sap/its/webgui"

    host-redirects: true
    max-redirects: 2
    matchers:
      - type: word
        part: body
        words:
          - "sap-system-login"
          - "<title>Logon</title>"
        condition: or
