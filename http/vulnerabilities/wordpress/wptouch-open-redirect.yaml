id: wptouch-open-redirect

info:
  name: WordPress WPtouch 3.x - 开放重定向漏洞
  author: 0x_Akoko
  severity: medium
  description: |
    该模板用于检测 WordPress WPtouch 3.x - 开放重定向漏洞。该类漏洞通常源于跳转参数缺少可信域名校验，导致服务端或前端跳转到攻击者控制的地址。模板会向 `/?wptouch_switch=desktop&redirect=https://interact.sh/` 等位置发送探测请求，并结合响应状态、关键字、错误信息、时间差或外带交互等证据判断目标是否受影响。
  impact: |
    - 攻击者可构造可信域名下的跳转链接诱导用户访问恶意站点。
    - 该问题常被用于钓鱼、OAuth 授权码劫持、会话令牌泄露或绕过安全网关校验。
  remediation: |
    - 对跳转目标使用固定白名单或相对路径，禁止直接跳转到任意外部 URL。
    - 在执行跳转前校验协议、主机名和编码后的最终地址，避免双重编码和协议绕过。
    - 对登录、授权和支付等敏感流程中的重定向参数进行额外审计。
  reference:
    - https://cxsecurity.com/issue/WLB-2020030114
  classification:
    cvss-metrics: CVSS:3.1/AV:N/AC:L/PR:N/UI:R/S:C/C:L/I:L/A:N
    cvss-score: 6.1
    cwe-id: CWE-601
  metadata:
    max-request: 1
  tags: wp-plugin,redirect,wordpress,vuln

http:
  - method: GET
    path:
      - "{{BaseURL}}/?wptouch_switch=desktop&redirect=https://interact.sh/"

    matchers:
      - type: regex
        regex:
          - '(?m)^(?:Location\s*?:\s*?)(?:https?://|//)(?:[a-zA-Z0-9\-_\.@]*)interact\.sh.*$'
        part: header
