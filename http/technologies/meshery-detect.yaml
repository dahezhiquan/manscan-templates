id: meshery-detect

info:
  name: Meshery 指纹识别（指纹识别）
  author: righettod
  severity: info
  description: >-
    Meshery 是云原生和服务网格管理平台，用于评估、部署和管理 Kubernetes 服务网格及相关基础设施。该模板通过请求目标服务并检查预设路径或首页响应、DSL
    条件、正则特征等指纹特征，判断目标是否使用或暴露了 Meshery 相关组件；命中结果仅表示指纹特征匹配，可用于资产盘点、技术栈识别和后续安全评估，不代表已确认存在可利用漏洞。
  reference:
  - https://github.com/meshery/meshery
  - https://meshery.io/
  metadata:
    verified: true
    max-request: 1
    vendor: meshery
    product: meshery
    shodan-query: http.title:"Meshery"
    fofa-query: title="Meshery"
  tags: tech,meshery,detect,discovery
http:
  - method: GET
    path:
      - "{{BaseURL}}/api/providers"

    matchers:
      - type: dsl
        dsl:
          - 'status_code == 200'
          - 'contains_all(to_lower(body), "persist-meshery-", "ismesheryuirestricted")'
        condition: and

    extractors:
      - type: regex
        part: body
        group: 1
        regex:
          - '(?i)"package_version":\s*"([a-z0-9.]+)"'
