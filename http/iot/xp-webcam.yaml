id: xp-webcam

info:
  name: XP Webcam 查看页面暴露（IOT）
  author: aashiq
  severity: medium
  description: |
    检测到暴露的 webcamXP 查看页面。模板通过 /mobile.html 端点和页面中的 webcamXP 特征识别可公开访问的摄像头页面。
  impact: |
    - 摄像头或录像设备暴露可能导致实时画面、截图、设备位置和监控范围被未授权查看。
    - 监控入口泄露还会增加弱口令、默认凭据和已知固件漏洞被利用的概率。
  remediation: |
    - 禁止公网直接访问摄像头、NVR/DVR 或视频流页面，统一放置在隔离网络或 VPN 后。
    - 启用强认证并修改默认口令，定期升级设备固件。
    - 对视频访问、配置变更和异常登录启用日志审计。
  metadata:
    max-request: 1
  tags: webcam,iot,discovery

http:
  - method: GET
    path:
      - "{{BaseURL}}/mobile.html"

    matchers-condition: and
    matchers:
      - type: word
        words:
          - "webcams and ip cameras server for windows"
        part: body

      - type: word
        words:
          - "Please provide a valid username/password to access this server."
        part: body
        negative: true
