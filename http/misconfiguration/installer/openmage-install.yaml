id: openmage-install

info:
  name: OpenMage 安装 Wizard
  author: DhiyaneshDk
  severity: high
  description: |
    检测到 OpenMage 安装 Wizard。该页面属于安装、初始化或配置向导流程，若对外暴露，攻击者可能完成初始化、创建管理员账户或重新配置目标系统。
  classification:
    cpe: cpe:2.3:a:openmage:openmage:*:*:*:*:*:*:*:*
  metadata:
    verified: true
    max-request: 1
    vendor: openmage
    product: openmage
    shodan-query: title:"OpenMage Installation Wizard"
  tags: misconfig,openmage,install,exposure,vuln

http:
  - method: GET
    path:
      - "{{BaseURL}}/index.php/install/"

    matchers-condition: and
    matchers:
      - type: word
        part: body
        words:
          - "OpenMage Installation Wizard"

      - type: status
        status:
          - 200
