id: hikvision-detect

info:
  name: Hikvision 指纹识别（指纹识别）
  author: pdteam,its0x08
  severity: info
  description: >-
    海康威视设备和平台常用于视频监控、门禁和物联网管理，Web 页面可反映设备或管理系统的部署。该模板通过请求目标服务并检查预设路径或首页响应、页面正文关键字、HTTP
    响应头、favicon 哈希、DSL 条件等指纹特征，判断目标是否使用或暴露了 Hikvision 相关组件；命中结果仅表示指纹特征匹配，可用于资产盘点、技术栈识别和后续安全评估，不代表已确认存在可利用漏洞。
  metadata:
    verified: true
    max-request: 2
    shodan-query: http.favicon.hash:999357577
    product: ds-2cd2026g2-iu\/sl_firmware
    vendor: hikvision
    fofa-query: icon_hash=999357577
  tags: tech,hikvision,discovery
http:
  - method: GET
    path:
      - "{{BaseURL}}/favicon.ico"
      - "{{BaseURL}}/doc/page/login.asp"

    stop-at-first-match: true

    matchers-condition: or
    matchers:
      - type: word
        part: body
        words:
          - "Hikvision Digital Technology"

      - type: word
        name: server
        part: header
        words:
          - "Hikvision-Webs"

      - type: dsl
        name: favicon
        dsl:
          - "'999357577' == mmh3(base64_py(body))"
