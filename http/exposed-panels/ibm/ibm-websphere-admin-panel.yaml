id: ibm-websphere-admin-panel

info:
  name: IBM WebSphere Application Server Community Edition Admin 登录面板识别（暴露面识别）
  author: ritikchaddha
  severity: info
  description: 该模板通过识别 IBM WebSphere Application Server Community Edition Admin 登录入口的页面标题、特征文本或重定向行为，判断目标是否暴露了对应的认证界面。若命中，说明该登录面板对外可访问，可用于暴露面梳理与后续安全评估。
  reference:
    - https://www.ibm.com/support/pages/what-default-username-and-password-websphere-application-server-community-edition-and-how-add-users-admin-group
  classification:
    cvss-metrics: CVSS:3.0/AV:N/AC:L/PR:N/UI:N/S:U/C:N/I:N/A:N
    cwe-id: CWE-200
    cpe: cpe:2.3:a:ibm:websphere_application_server:*:*:*:*:z\/os:*:*:*
  metadata:
    verified: true
    max-request: 1
    vendor: ibm
    product: websphere_application_server
    shodan-query: http.favicon.hash:1337147129
    fofa-query: icon_hash=1337147129
  tags: websphere,panel,ibm,discovery

http:
  - method: GET
    path:
      - "{{BaseURL}}/console"

    host-redirects: true
    max-redirects: 2

    matchers-condition: and
    matchers:
      - type: word
        part: body
        words:
          - "Administrative Console Login"
          - "Log in to the Administrative Console"
        condition: and

      - type: status
        status:
          - 200
