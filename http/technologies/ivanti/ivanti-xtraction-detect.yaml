id: ivanti-xtraction-detect

info:
  name: Ivanti Xtraction 指纹识别（指纹识别）
  author: rxerium
  severity: info
  description: >-
    Ivanti Xtraction 是 IT 数据聚合和仪表盘分析平台，用于从服务管理、资产和运维系统中生成报表。该模板通过请求目标服务并检查预设路径或首页响应、页面正文关键字、状态码等指纹特征，判断目标是否使用或暴露了
    Ivanti Xtraction 相关组件；命中结果仅表示指纹特征匹配，可用于资产盘点、技术栈识别和后续安全评估，不代表已确认存在可利用漏洞。
  classification:
    cvss-metrics: CVSS:3.1/AV:N/AC:L/PR:N/UI:N/S:U/C:N/I:N/A:N
    cvss-score: 0.0
    cwe-id: CWE-200
  metadata:
    max-request: 1
    verified: true
    shodan-query: http.title:"Xtraction"
  tags: tech,ivanti,xtraction,detect
http:
  - method: GET
    path:
      - "{{BaseURL}}/xtraction"

    host-redirects: true
    max-redirects: 2
    matchers-condition: and
    matchers:
      - type: word
        part: body
        words:
          - "<title>Xtraction</title>"
          - "application-name\" content=\"Xtraction"
          - "dev-extreme-ivanti.css"
        condition: and

      - type: status
        status:
          - 200
