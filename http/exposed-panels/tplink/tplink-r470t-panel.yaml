id: tplink-r470t-panel

info:
  name: TP-LINK Router R470T 登录面板识别（指纹识别）
  author: ritikchaddha
  severity: info
  description: TP-LINK Router R470T 是 TP-LINK 企业路由器管理界面，用于 WAN/LAN、路由、防火墙和带宽控制配置。该模板请求首页，并依据页面标题、正文关键字或品牌资源特征识别目标是否部署了该系统或暴露了对应入口，适用于资产指纹确认；命中结果仅表示系统特征匹配，不代表已确认存在未授权访问或可利用漏洞。
  metadata:
    verified: true
    max-request: 2
    shodan-query: "r470t"
  tags: tp-link,r470t,panel,login,detect,discovery

http:
  - method: GET
    path:
      - "{{BaseURL}}"

    host-redirects: true
    max-redirects: 2

    matchers:
      - type: word
        part: response
        words:
          - 'userRpm'
          - 'R470T'
        condition: and
