id: blogger-detect

info:
  name: Blogger 指纹识别（指纹识别）
  author: Chirag Mistry
  severity: info
  description: |-
    Blogger 是 Google 博客发布平台，用于托管和管理博客内容。该模板请求首页、`/robots.txt`、`/sitemap.xml` 等路径，并依据 HTTP 200 状态码、页面标题、正文关键字或品牌资源特征识别目标是否使用或暴露了 Blogger 相关组件，适用于资产盘点、技术栈识别和后续安全评估；命中结果仅表示指纹特征匹配，不代表已确认存在可利用漏洞。
  metadata:
    verified: true
    max-request: 7
  tags: blogger,detect,tech

http:
  - method: GET
    path:
      - "{{BaseURL}}"
      - "{{BaseURL}}/robots.txt"
      - "{{BaseURL}}/sitemap.xml"
      - "{{BaseURL}}/favicon.ico"
      - "{{BaseURL}}/blogger.js"
      - "{{BaseURL}}/feeds/posts/default"
      - "{{BaseURL}}/search"

    stop-at-first-match: true
    matchers-condition: and
    matchers:
      - type: word
        part: response
        words:
          - "Powered by Blogger"
          - "blogspot.com"
          - "X-Powered-By-Blogger"
          - "blogger.com"
        condition: or
        case-insensitive: true

      - type: status
        status:
          - 200

    extractors:
      - type: regex
        part: body
        name: version
        regex:
          - 'Blogger ([0-9.]+)'
          - 'Powered by Blogger ([0-9.]+)'

      - type: regex
        part: body
        name: blogger_id
        regex:
          - 'blogger-id=([a-z0-9]+)'
          - 'blogspot\.com/([^/]+)'
