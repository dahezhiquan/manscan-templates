id: sentry-panel

info:
  name: Sentry 登录面板暴露（暴露面识别）
  author: righettod
  severity: medium
  description: |-
    Sentry 是应用错误监控平台，用于收集异常、性能数据、版本事件和项目告警。该模板请求首页，并依据 DSL 条件判断目标是否对外暴露了 Sentry 的登录面板，用于发现互联网可访问的后台、控制台或业务入口。
  impact: "- 暴露的 Sentry 登录面板会泄露目标正在使用的产品、部署路径、页面特征或组织业务入口，便于攻击者进行指纹确认和漏洞匹配。\n- 如果认证、访问控制或默认凭据策略薄弱，攻击者可能进一步尝试进入后台，影响后台配置、业务数据、用户账号或设备运行状态。\n- 对互联网开放的管理入口会增加暴力破解、凭据填充、已知漏洞利用和钓鱼仿冒的攻击面。"
  remediation: "- 将 Sentry 的登录面板限制在内网、VPN、零信任代理或专用管理网段访问，避免直接暴露在互联网。\n- 启用强密码、多因素认证、登录失败限制和审计告警，排查默认账号、弱口令及长期未使用账号。\n- 保持 Sentry 及其依赖组件更新到受支持版本，并通过反向代理、ACL 或防火墙限制敏感路径访问。"
  reference:
  - https://sentry.io/
  classification:
    cpe: cpe:2.3:a:sentry:sentry:*:*:*:*:*:*:*:*
  metadata:
    verified: true
    max-request: 1
    vendor: sentry
    product: sentry
    shodan-query:
    - http.title:"Login | Sentry"
    - http.title:"login | sentry"
    fofa-query: title="login | sentry"
    google-query: intitle:"login | sentry"
  tags: panel,sentry,login,discovery

http:
  - method: GET
    path:
      - "{{BaseURL}}"

    redirects: true
    max-redirects: 3

    matchers:
      - type: dsl
        dsl:
          - 'status_code == 200'
          - 'contains(body, "/sentry/") && contains(body, "Login")'
          - 'regex("(?i)<title>[^<]*sentry[^<]*</title>", body)'
        condition: and

    extractors:
      - type: regex
        part: body
        group: 1
        regex:
          - '(?i)"current":\s*"([0-9a-z.-]+)"'
