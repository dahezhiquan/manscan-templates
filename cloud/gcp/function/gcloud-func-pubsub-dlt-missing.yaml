id: gcloud-func-pubsub-dlt-missing

info:
  name: Configure Dead Lettering 的Pub/Sub-Triggered Functions（云安全）
  author: princechaddha
  severity: low
  description: Pub/Sub 触发链路缺少死信或失败处理配置时，反复失败的事件可能阻塞处理或丢失排障上下文。本模板枚举函数并检查 eventTrigger.pubsubTopic，字段为 null 时作为 Pub/Sub 触发和死信配置缺失线索进行报告。
  impact: |
    - 失败消息可能反复重试或难以隔离，影响事件处理稳定性和故障恢复。
    - 缺少死信主题会降低问题消息保留、分析和人工补偿处理能力。
  remediation: |
    - 为 Pub/Sub 触发的函数配置合适的重试、死信主题和告警策略。
    - 复核命中函数的 event trigger 配置，确保事件来源、失败处理和消息保留策略符合业务要求。
  reference:
    - https://cloud.google.com/functions/docs/calling/pubsub#retry
  metadata:
    vendor: google
    product: cloud-functions
  tags: cloud,devops,gcp,gcloud,google-cloud-functions,gcp-cloud-config

flow: |
  code(1)
  for(let projectId of iterate(template.projectIds)){
    set("projectId", projectId)
    code(2)
    for(let functionDetail of iterate(template.functions)){
      set("functionName", functionDetail)
      code(3)
    }
  }

self-contained: true

code:
  - engine:
      - sh
      - bash
    source: |
      gcloud projects list --format="json(projectId)"

    extractors:
      - type: json
        name: projectIds
        internal: true
        json:
          - '.[].projectId'

  - engine:
      - sh
      - bash
    source: |
      gcloud functions list --project $projectId --format="json(name, region)"

    extractors:
      - type: json
        name: functions
        internal: true
        json:
          - '.[].name'

  - engine:
      - sh
      - bash
    source: |
      gcloud functions describe $functionName --format="json(eventTrigger.pubsubTopic)"

    matchers:
      - type: word
        words:
          - 'null'

    extractors:
      - type: dsl
        dsl:
          - '"Missing Dead Letter Topic for function: " + functionName + " in Project: " + projectId'
