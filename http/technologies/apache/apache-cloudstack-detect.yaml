id: apache-cloudstack-detect

info:
  name: Apache CloudStack 指纹识别（指纹识别）
  author: pussycat0x
  severity: info
  description: 用于识别目标是否运行 Apache CloudStack，模板会结合页面标题、页面正文、状态码和特定路径或已知端点进行服务指纹匹配。
  classification:
    cpe: cpe:2.3:a:apache:cloudstack:*:*:*:*:*:*:*:*
  metadata:
    vendor: apache
    product: cloudstack
    shodan-query: http.title:"Apache CloudStack"
  tags: tech,apache,cloudstack,discovery

http:
  - method: GET
    path:
      - "{{BaseURL}}"

    host-redirects: true

    matchers-condition: and
    matchers:
      - type: word
        part: body
        words:
          - "<title>Apache CloudStack</title>"

      - type: status
        status:
          - 200
