id: osasi-panel

info:
  name: OSASI Login 面板（指纹识别）
  author: biero-el-corridor
  severity: info
  description: |
    该模板通过识别 OSASI Login 登录入口的页面标题、特征文本或重定向行为，判断目标是否暴露了对应的认证界面。若命中，说明该登录面板对外可访问，可用于暴露面梳理与后续安全评估。
  metadata:
    shodan-query: html:"/css/osasiasp.css"
    verified: true
    max-request: 1
  tags: osasi,panel,login,detect,discovery

http:
  - method: GET
    path:
      - "{{BaseURL}}/users/login"

    matchers-condition: and
    matchers:
      - type: word
        part: body
        words:
          - "/img/osasil_logo_f.png"
          - "UserLoginid"
        condition: and

      - type: status
        status:
          - 200
