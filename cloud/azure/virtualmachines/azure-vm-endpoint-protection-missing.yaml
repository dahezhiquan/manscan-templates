id: azure-vm-endpoint-protection-missing
info:
  name: Azure VM Endpoint 保护 未Installed（云安全）
  author: princechaddha
  severity: high
  description: Azure VM 若未安装受支持的端点保护扩展，主机可能缺少恶意软件检测、实时防护和主机入侵告警。本模板枚举虚拟机并查询扩展名称，在存在扩展列表但未发现 EndpointSecurity、TrendMicroDSA、Antimalware、EndpointProtection、SCWPAgent、PortalProtectExtension 或 FileSecurity 等名称时报告。
  impact: |
    - 恶意程序、凭据窃取和持久化行为可能在主机上运行而未被及时发现，攻击者可进一步横向移动。
    - 缺少端点遥测会削弱事件调查、隔离和恢复能力，尤其影响承载敏感业务的虚拟机。
  remediation: |
    - 根据操作系统和组织标准安装并启用 Microsoft Defender for Endpoint 或批准的第三方端点保护扩展。
    - 验证扩展 provisioning 状态、策略下发、签名更新和告警上报，限制扩展管理权限并纳入持续监控。
  reference:
    - https://docs.microsoft.com/en-us/azure/security-center/security-center-intro
  metadata:
    vendor: microsoft
    product: azure-virtual-machines
  tags: cloud,devops,azure,microsoft,endpoint-protection,azure-cloud-config

flow: |
  code(1);
  for (let VMData of iterate(template.vmList)) {
    VMData = JSON.parse(VMData);
    set("name", VMData.name);
    set("resourceGroup", VMData.resourceGroup);
    code(2);
  }

self-contained: true
code:
  - engine:
      - sh
      - bash
    source: |
      az vm list --output json --query '[*].{"name":name,"resourceGroup":resourceGroup}'

    extractors:
      - type: json
        name: vmList
        internal: true
        json:
          - '.[]'

  - engine:
      - sh
      - bash
    source: |
      az vm extension list --vm-name "$name" --resource-group "$resourceGroup" --query '[*].name'

    matchers-condition: and
    matchers:
      - type: word
        words:
          - '['

      - type: word
        part: body
        words:
          - "EndpointSecurity"
          - "TrendMicroDSA"
          - "Antimalware"
          - "EndpointProtection"
          - "SCWPAgent"
          - "PortalProtectExtension"
          - "FileSecurity"
        negative: true

    extractors:
      - type: dsl
        dsl:
          - 'name + " in " + resourceGroup + " is missing endpoint protection"'
