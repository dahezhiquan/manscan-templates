id: password-protected-consolemenu

info:
  name: pfSense 控制台菜单未启用密码保护（本地文件安全扫描）
  author: pussycat0x
  severity: info
  description: |
    该模板检测 pfSense Console Menu 是否配置密码保护。无人值守的控制台会话可能让未授权人员访问防火墙管理功能。
  reference:
    - https://docs.netgate.com/pfsense/en/latest/config/advanced-admin.html
  classification:
    cvss-metrics: CVSS:3.1/AV:N/AC:L/PR:N/UI:N/S:U/C:N/I:N/A:N
    cvss-score: 0
    cwe-id: CWE-200
  metadata:
    verified: true
  tags: firewall,config,audit,pfsense,file

file:
  - extensions:
      - xml

    matchers-condition: and
    matchers:
      - type: word
        words:
          - "<disableconsolemenu>"
          - "<disableconsolemenu>1</disableconsolemenu>"
        condition: or
        negative: true

      - type: word
        words:
          - "<pfsense>"
          - "<webgui>"
          - "<system>"
        condition: and

