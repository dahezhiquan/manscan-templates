id: azure-nsg-mssql-unrestricted
info:
  name: Azure NSG 对互联网开放 Microsoft SQL Server 端口（云安全）
  author: princechaddha
  severity: high
  description: Microsoft SQL Server 通常使用 TCP 1433 提供数据库连接；将该端口对互联网开放会使数据库服务持续暴露于扫描、口令攻击和协议漏洞利用。本模板查询入站允许的 TCP 1433 NSG 规则，并在来源地址为 *、internet 或 any 时报告。
  impact: |
    - 攻击者可能通过弱口令、凭据泄露或 SQL Server 漏洞读取、修改和删除数据库内容。
    - 数据库权限被突破后，可能进一步访问应用主机、执行高权限操作或造成业务中断。
  remediation: |
    - 删除面向互联网的 TCP 1433 入站规则，使用 Private Endpoint、VPN 或应用专用子网连接数据库。
    - 强制加密连接和强认证，将数据库账户权限收敛到业务所需范围，并监控异常登录。
  reference:
    - https://docs.microsoft.com/en-us/azure/virtual-network/network-security-groups-overview
  metadata:
    vendor: microsoft
    product: azure-network-security-group
  tags: cloud,devops,azure,microsoft,nsg,azure-cloud-config

flow: |
  code(1);
  for (let NsgData of iterate(template.nsgdata)) {
    NsgData = JSON.parse(NsgData)
    set("nsg", NsgData.name)
    set("resourcegroup", NsgData.resourceGroup)
    code(2)
  }

self-contained: true
code:
  - engine:
      - sh
      - bash
    source: |
      az network nsg list --query '[*].{name:name, resourceGroup:resourceGroup}' --output json

    extractors:
      - type: json
        name: nsgdata
        internal: true
        json:
          - '.[]'

  - engine:
      - sh
      - bash
    source: |
      az network nsg rule list --nsg-name $nsg --resource-group $resourcegroup --query "[?direction=='Inbound' && access=='Allow' && protocol=='TCP' && (destinationPortRange=='1433')]"

    matchers:
      - type: word
        words:
          - '"sourceAddressPrefix": "*"'
          - '"sourceAddressPrefix": "internet"'
          - '"sourceAddressPrefix": "any"'

    extractors:
      - type: dsl
        dsl:
          - 'nsg + " has unrestricted access on TCP port 1433"'
