id: apache-sling-detect

info:
  name: Apache Sling 指纹识别（指纹识别）
  author: icarot
  severity: info
  description: |
    用于识别目标前端或应用中是否使用 Apache Sling，模板会结合页面标题、状态码和特定路径或已知端点进行技术栈指纹匹配。
  reference:
    - https://github.com/apache/sling
  metadata:
    max-request: 1
    vendor: apache
    product: sling
    shodan-query: title:"Apache Sling"
  tags: apache,sling,detect

http:
  - method: GET
    path:
      - "{{BaseURL}}/starter.html"

    matchers-condition: and
    matchers:
      - type: word
        words:
          - 'Apache Sling'
          - 'sling.apache'
        condition: and

      - type: status
        status:
          - 200
