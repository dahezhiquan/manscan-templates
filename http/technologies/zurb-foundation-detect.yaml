id: zurb-foundation-detect

info:
  name: ZURB Foundation 指纹识别（指纹识别）
  author: Shivam Kamboj
  severity: info
  description: >-
    ZURB Foundation 是响应式前端框架，用于构建移动优先的网站布局、组件和界面样式。该模板通过请求目标服务并检查预设路径或首页响应、正则特征等指纹特征，判断目标是否使用或暴露了
    ZURB Foundation 相关组件；命中结果仅表示指纹特征匹配，可用于资产盘点、技术栈识别和后续安全评估，不代表已确认存在可利用漏洞。
  reference:
  - https://get.foundation/
  metadata:
    verified: true
    max-request: 1
    shodan-query: html:"foundation.min.css"
  tags: tech,discovery,zurb
http:
  - method: GET
    path:
      - "{{BaseURL}}"

    matchers:
      - type: regex
        part: body
        regex:
          - '(?i)foundation(?:\.min)?\.(?:css|js)'
