id: iam-db-auth
info:
  name: RDS IAM 数据库认证未启用（云安全）
  author: princechaddha
  severity: medium
  description: RDS IAM Database Authentication 可用 IAM 身份和临时令牌替代长期数据库口令；未启用时，MySQL 或 PostgreSQL 实例仍主要依赖静态数据库凭据。该模板枚举相关引擎实例，并检查 IAMDatabaseAuthenticationEnabled 是否为 false。
  impact: |
    - 长期数据库口令泄露后可能被持续使用，且难以细粒度纳入 IAM 审计和条件控制。
    - 无法利用临时认证令牌、IAM 策略和集中身份治理收敛数据库访问。
  remediation: |
    - 在支持的 RDS MySQL 或 PostgreSQL 实例上启用 IAM Database Authentication。
    - 为数据库访问配置最小权限 IAM policy，逐步替换长期共享数据库口令。
  reference:
    - https://docs.aws.amazon.com/AmazonRDS/latest/UserGuide/UsingWithRDS.IAMDBAuth.html
  metadata:
    max-request: 2
    vendor: amazon
    product: rds
  tags: cloud,devops,aws,amazon,rds,aws-cloud-config
variables:
  region: "ap-northeast-1"

flow: |
  code(1)
  for(let DBInstances of iterate(template.instances)){
    set("db", DBInstances)
    code(2)
  }

self-contained: true
code:
  - engine:
      - sh
      - bash
    source: |
      aws rds describe-db-instances --region $region --output json --query 'DBInstances[?Engine==`mysql` || Engine==`postgres`].DBInstanceIdentifier | []'

    extractors:
      - type: json
        name: instances
        internal: true
        json:
          - '.[]'

  - engine:
      - sh
      - bash
    source: |
         aws rds describe-db-instances --region $region --db-instance-identifier $db --query 'DBInstances[*].IAMDatabaseAuthenticationEnabled'

    matchers:
      - type: word
        words:
          - 'false'

    extractors:
      - type: dsl
        dsl:
          - '"Database Authentication feature is not enabled for RDS database instance " + db'
