id: typo3-debug-mode

info:
  name: TYPO3 调试模式启用
  author: tess,FLX
  severity: low
  description: |-
    该模板用于核查 TYPO3 调试模式启用。调试模式、错误页面或诊断组件在生产环境暴露时，会返回堆栈、路径、配置项、请求上下文或运行参数。模板访问 目标入口，并根据调试标识、异常类名、phpinfo/Xdebug 配置或错误关键字确认暴露。
  classification:
    cpe: cpe:2.3:a:typo3:typo3:*:*:*:*:*:*:*:*
  metadata:
    verified: true
    max-request: 1
    vendor: typo3
    product: typo3
    shodan-query: http.title:"TYPO3 Exception"
  tags: typo3,debug,misconfig,vuln
  impact: |-
    - 攻击者可获取应用路径、框架版本、环境变量、内部调用栈、请求参数和依赖信息。
    - 这些信息可帮助定位组件缺陷、构造后续漏洞利用或绕过安全控制。
  remediation: |-
    - 关闭生产环境调试模式、错误详情展示、Profiler 和 phpinfo 页面。
    - 将错误写入受保护日志，统一返回通用错误页面。
    - 限制诊断入口访问来源，升级框架并复核生产配置。
http:
  - method: GET
    path:
      - '{{BaseURL}}'

    matchers-condition: and
    matchers:
      - type: word
        part: body
        words:
          - "TYPO3 Exception"
          - "Uncaught TYPO3 Exception"
        condition: or

      - type: dsl
        dsl:
          - "status_code >= 500 && status_code < 600"
