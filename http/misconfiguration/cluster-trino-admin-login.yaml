id: cluster-trino-admin-login

info:
  name: 集群 Overview Trino Admin 登录
  author: DhiyaneshDK
  severity: high
  description: |
    检测到 集群 Overview Trino Admin 登录。目标响应或文件中可能暴露配置、凭据、密钥、令牌、环境变量或历史记录等敏感信息，可能被用于进一步入侵。
  metadata:
    verified: true
    max-request: 1
  tags: vuln,misconfig,dashboard,cluster,trino

variables:
  username: admin

http:
  - raw:
      - |
        POST /ui/login HTTP/1.1
        Host: {{Hostname}}
        Content-Type: application/x-www-form-urlencoded

        username={{username}}&password=&redirectPath=

    matchers-condition: and
    matchers:
      - type: word
        part: set_cookie
        words:
          - "Trino-UI-Token"

      - type: status
        status:
          - 303
