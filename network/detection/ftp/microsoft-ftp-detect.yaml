id: microsoft-ftp-detect

info:
  name: Microsoft FTP 服务识别（指纹识别）
  author: pussycat0x
  severity: info
  description: |
    Microsoft FTP 是 FTP 服务实现、设备内置文件传输组件或 FTP 代理，常用于文件传输、设备配置、固件维护或旧系统集成。该模板连接 21/TCP 并读取协议响应，通过匹配 `Microsoft FTP Service` 等响应特征识别目标服务。
  metadata:
    max-request: 1
    verified: true
    shodan-query: 'product:"Microsoft ftpd"'
  tags: network,ftp,sambar,detect,tcp,discovery

tcp:
  - inputs:
      - data: 00000000
        type: hex

    host:
      - "{{Hostname}}"
    port: 21
    read-size: 1024

    matchers:
      - type: word
        part: body
        words:
          - "Microsoft FTP Service"
