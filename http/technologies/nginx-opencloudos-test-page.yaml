id: nginx-opencloudos-test-page

info:
  name: Nginx 测试页面 for OpenCloudOS 指纹识别（指纹识别）
  author: pussycat0x
  severity: info
  description: |
    用于识别目标是否使用 Nginx 测试页面 for OpenCloudOS，模板会结合页面标题和特定路径或已知端点进行技术指纹匹配。
  metadata:
    verified: true
    shodan-query: http.title:"OpenCloudOS"
  tags: tech,nginx,opencloudos

http:
  - method: GET
    path:
      - "{{BaseURL}}"

    matchers:
      - type: dsl
        dsl:
          - 'status_code == 200'
          - 'contains(body, "<title>Nginx test page for OpenCloudOS</title>")'
        condition: and
