id: ics-carel-boss-mini-panel

info:
  name: CAREL Boss Mini - Login Panel 识别（指纹识别）
  author: Kazgangap
  severity: info
  description: |-
    检测到目标站点存在 CAREL Boss Mini - Login Panel 相关响应特征。CAREL Boss Mini - Login Panel 是工业控制、能源、楼宇自动化或 HMI/SCADA 场景中的管理界面，用于监控设备状态、过程数据和现场控制相关配置。模板请求 `/boss/`，并通过页面标题或正文关键字、状态码、DSL 条件确认该系统指纹，用于资产识别、系统盘点和暴露面梳理。
  reference:
    - https://www.carel.com/
  metadata:
    verified: true
    max-request: 1
    vendor: carel
    product: boss-mini
    fofa-query: icon_hash=="1092427843"
  tags: panel,carel,boss-mini,ics,login,detect
http:
  - method: GET
    path:
      - "{{BaseURL}}/boss/"

    matchers:
      - type: dsl
        dsl:
          - 'contains_all(body, "boss_logo", "System administration", "Login")'
          - 'status_code == 200'
        condition: and
