id: jspxcms-detect

info:
  name: Jspxcms 指纹识别（指纹识别）
  author: princechaddha
  severity: info
  description: >-
    Jspxcms 是基于 Java 的内容管理系统，用于构建企业门户、内容发布和站点管理功能。该模板通过请求目标服务并检查预设路径或首页响应、页面正文关键字、状态码等指纹特征，判断目标是否使用或暴露了
    Jspxcms 相关组件；命中结果仅表示指纹特征匹配，可用于资产盘点、技术栈识别和后续安全评估，不代表已确认存在可利用漏洞。
  metadata:
    max-request: 1
  tags: tech,jspxcms,discovery
http:
  - method: GET
    path:
      - "{{BaseURL}}"

    matchers-condition: and
    matchers:
      - type: word
        part: body
        words:
          - "Jspxcms"

      - type: status
        status:
          - 200
