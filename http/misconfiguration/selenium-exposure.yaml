id: selenium-exposure

info:
  name: Selenium Node 暴露
  author: w0Tx
  severity: high
  description: |
    该模板用于核查 Selenium Node 暴露。该类问题通常源于高危管理接口未授权开放、危险方法启用或可写接口暴露，攻击者可借助接口能力写入文件或触发命令执行。模板会向目标发送探测请求，并依据请求 `/wd/hub`、匹配 `WebDriverRequest`、匹配 `<title>WebDriver Hub</title>`、状态码 200 等证据确认目标是否存在该配置问题。
  impact: |
    - 攻击者可能上传文件、执行命令、提交任务或控制目标服务。
    - 成功利用后可导致主机沦陷、数据泄露、横向移动和业务中断。
  remediation: |
    - 立即为相关接口启用认证授权并限制可信来源访问。
    - 关闭不必要的危险 HTTP 方法、远程执行能力和可写管理接口。
    - 检查系统进程、上传目录和访问日志，清理异常文件并轮换凭据。
  reference:
    - https://nutcrackerssecurity.github.io/selenium.html
    - https://labs.detectify.com/2017/10/06/guest-blog-dont-leave-your-grid-wide-open/
  classification:
    cpe: cpe:2.3:a:selenium:selenium:*:*:*:*:*:*:*:*
  metadata:
    verified: true
    max-request: 1
    vendor: selenium
    product: selenium
    shodan-query: "/wd/hub"
  tags: misconfig,selenium,rce,chromium,vuln

http:
  - method: GET
    path:
      - "{{BaseURL}}/wd/hub"

    host-redirects: true
    max-redirects: 2

    matchers-condition: and
    matchers:
      - type: word
        words:
          - 'WebDriverRequest'
          - '<title>WebDriver Hub</title>'
        condition: or

      - type: status
        status:
          - 200
