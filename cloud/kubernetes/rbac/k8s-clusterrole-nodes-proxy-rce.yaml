id: k8s-clusterrole-nodes-proxy-rce

info:
  name: ClusterRoles 使用高风险 nodes/proxy GET 权限（云安全）
  author: princechaddha
  severity: high
  description: ClusterRole 授予 nodes/proxy 的 get 权限可能被滥用访问 Kubelet 代理接口；公开研究指出该权限在特定 WebSocket 握手路径下可形成对容器执行命令的高危利用链。本模板枚举 ClusterRole 规则，匹配核心 API 组中 resources 包含 nodes/proxy 或通配符且 verbs 包含 get 或通配符的角色。
  impact: |
    - 拥有该 ClusterRole 的主体可能通过 API Server 代理访问 Kubelet，在容器中执行命令。
    - 该路径可能绕过预期审计和权限边界，导致节点与工作负载被进一步控制。
  remediation: |
    - 从非必要 ClusterRole 中移除 nodes/proxy 的 get 权限和相关通配授权。
    - 限制 Kubelet 10250 访问路径，审计 ClusterRoleBinding 并最小化绑定主体。
  reference:
    - https://grahamhelton.com/blog/nodes-proxy-rce
  metadata:
    vendor: kubernetes
    product: kubernetes
  tags: cloud,devops,kubernetes,devsecops,rbac,k8s-cluster-security
flow: |
  code(1);
  for (let role of template.items) {
    set("role", role)
    javascript(1);
  }

self-contained: true
code:
  - engine:
      - sh
      - bash
    source: kubectl get clusterrole --output=json
    extractors:
      - type: json
        name: items
        internal: true
        json:
          - '.items[]'

javascript:
  - code: |
        let role = JSON.parse(template.role);
        let riskyRules = 0;
        if (role.rules) {
          role.rules.forEach(rule => {
            let apiGroups = rule.apiGroups || [];
            let resources = rule.resources || [];
            let verbs = rule.verbs || [];
            let isCoreApiGroup = apiGroups.includes("") || apiGroups.includes("*");
            let hasNodesProxy = resources.includes("nodes/proxy") || resources.includes("*");
            let hasGetVerb = verbs.includes("get") || verbs.includes("*");
            if (isCoreApiGroup && hasNodesProxy && hasGetVerb) {
              riskyRules++;
            }
          });
        }
        if (riskyRules > 0) {
          let result = (`ClusterRole '${role.metadata.name}' has ${riskyRules} rule(s) granting 'nodes/proxy' GET permission in core API group, allowing potential RCE via Kubelet.`);
          Export(result);
        }

    extractors:
      - type: dsl
        dsl:
          - response
