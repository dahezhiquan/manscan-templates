id: azure-appservice-always-on-disabled
info:
  name: Azure App Service Always On 未启用（云安全）
  author: princechaddha
  severity: medium
  description: Azure App Service 未启用 Always On 时，应用在空闲后可能被卸载，首次请求需要重新加载进程和依赖，增加冷启动延迟。该模板枚举 Web App，查询 alwaysOn，并在返回 false 时报告配置未启用。
  impact: |
    - 定时任务、后台处理和长连接可能因应用休眠而延迟、中断或丢失执行窗口。
    - 频繁冷启动会增加响应时间和资源波动，影响依赖低延迟或持续运行的业务可用性。
  remediation: |
    - 对需要持续运行、低延迟响应或后台任务的 App Service 应用启用 Always On。
    - 结合应用计划层级、健康检查和性能监控评估资源成本，确认启用后不会掩盖应用自身的进程退出问题。
  reference:
    - https://docs.microsoft.com/en-us/azure/app-service/configure-common
  metadata:
    vendor: microsoft
    product: azure-app-service
  tags: cloud,devops,azure,microsoft,appservice,azure-cloud-config

flow: |
  code(1);
  for (let WebAppData of iterate(template.webAppList)) {
    set("ids", WebAppData);
    code(2);
  }

self-contained: true
code:
  - engine:
      - sh
      - bash
    source: |
      az webapp list --output json --query '[*].{id:id}'

    extractors:
      - type: json
        name: webAppList
        internal: true
        json:
          - '.[].[]'

  - engine:
      - sh
      - bash
    source: |
      az webapp config show --ids "$ids" --query 'alwaysOn' --output json

    matchers:
      - type: word
        words:
          - "false"

    extractors:
      - type: dsl
        dsl:
          - '"Always On feature is disabled for WebApp with ID: " + id'
