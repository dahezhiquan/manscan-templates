id: usb-storage-not-restricted

info:
  name: USB 存储设备未限制（本地基线扫描）
  author: princechaddha
  severity: medium
  description: |
    该模板检查是否允许不受限制使用 USB 存储设备。外接存储是数据外泄和恶意软件传播常见通道。
  impact: |
    攻击者或内部人员可拷贝敏感数据，或通过 U 盘投递恶意文件。
  remediation: |
    限制或禁用 USB 存储设备，必要时使用设备控制和审计策略。
  tags: windows,usb,storage,code,windows-audit

self-contained: true

code:
  - pre-condition: |
      IsWindows();
    engine:
      - powershell
      - powershell.exe
    args:
      - -ExecutionPolicy
      - Bypass
    pattern: "*.ps1"
    source: |
      Get-ItemProperty -Path 'HKLM:\SYSTEM\CurrentControlSet\Services\USBSTOR' -Name 'Start'

    matchers:
      - type: word
        words:
          - "Start        : 4"
