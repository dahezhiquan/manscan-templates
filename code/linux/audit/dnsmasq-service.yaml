id: dnsmasq-service

info:
  name: dnsmasq 服务不应安装（本地基线扫描）
  author: Th3l0newolf
  severity: low
  description: |
    dnsmasq 可提供轻量级 DNS、DHCP 与缓存解析能力，若在无需求主机上安装，可能引入额外解析和地址分配入口。CIS Ubuntu 基线建议最小化该类网络服务；模板通过 `dpkg-query -s dnsmasq` 检查软件包是否安装，命中 Policy-Fail 表示不符合基线。
  impact: |
    - 增加系统攻击面，可能引入不必要的监听端口、服务发现能力或旧式协议入口。
    - 在访问控制、补丁或日志监控不足时，攻击者可能借此进行枚举、横向移动、数据暴露或服务滥用。
  remediation: |
    - 如无明确业务需求，卸载 `dnsmasq` 或对应软件包，并清理残留服务配置。
    - 如必须保留，限制访问来源和可用范围，启用加密认证，并纳入补丁、日志和基线审计。
  reference:
    - https://www.cisecurity.org/benchmark/ubuntu_linux
  metadata:
    verified: true
  tags: cis,local,cisecurity,audit,linux,ubuntu

self-contained: true

code:
  - engine:
      - bash
    args:
      - "-c"
      - |
        if dpkg-query -s dnsmasq &>/dev/null; then
          echo "[dnsmasq-service-check:Policy-Fail] [dnsmasq is installed] [CIS_FAIL]"
        else
          echo "[dnsmasq-service-check:Policy-Pass] [dnsmasq is not installed] [CIS_PASS]"
        fi

    matchers:
      - type: word
        name: policy-pass
        words:
          - "Policy-Pass"

      - type: word
        name: policy-fail
        words:
          - "Policy-Fail"
