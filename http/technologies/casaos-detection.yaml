id: casaos-detection

info:
  name: CasaOS 指纹识别（指纹识别）
  author: pdteam
  severity: info
  description: CasaOS 是个人云和家庭服务器管理系统，用于应用安装、存储、容器和设备管理。该模板请求 `/v1/sys/debug`，并依据 DSL 条件识别目标是否使用或暴露了 CasaOS 相关组件，适用于资产盘点、技术栈识别和后续安全评估；命中结果仅表示指纹特征匹配，不代表已确认存在可利用漏洞。
  reference:
  - https://github.com/IceWhaleTech/CasaOS
  classification:
    cpe: cpe:2.3:o:icewhale:casaos:*:*:*:*:*:*:*:*
  metadata:
    max-request: 1
    vendor: icewhale
    product: casaos
    shodan-query: http.html:"/CasaOS-UI/public/index.html"
    fofa-query: body="/CasaOS-UI/public/index.html"
  tags: casaos,tech,oss,discovery

http:
  - method: GET
    path:
      - "{{BaseURL}}/v1/sys/debug"

    matchers:
      - type: dsl
        dsl:
          - contains(to_lower(body), 'casaos version')

    extractors:
      - type: regex
        group: 1
        regex:
          - CasaOS Version:\s*([0-9.]+)
