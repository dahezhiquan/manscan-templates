id: tls-version

info:
  name: TLS 版本识别（证书安全）
  author: pdteam,pussycat0x
  severity: info
  description: 该模板通过协商握手识别目标支持的 TLS 协议版本，可用于判断服务端启用了哪些 SSL/TLS 加密版本以及后续风险面。
  metadata:
    max-request: 4
  tags: ssl,tls,discovery
ssl:
  - address: "{{Host}}:{{Port}}"
    min_version: tls10
    max_version: tls10

    extractors:
      - type: json
        json:
          - ".tls_version"

  - address: "{{Host}}:{{Port}}"
    min_version: tls11
    max_version: tls11

    extractors:
      - type: json
        json:
          - ".tls_version"

  - address: "{{Host}}:{{Port}}"
    min_version: tls12
    max_version: tls12

    extractors:
      - type: json
        json:
          - ".tls_version"

  - address: "{{Host}}:{{Port}}"
    min_version: tls13
    max_version: tls13

    extractors:
      - type: json
        json:
          - ".tls_version"
