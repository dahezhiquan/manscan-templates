id: mailchimp-phish

info:
  name: Mailchimp 仿冒钓鱼网站（钓鱼网站识别）
  author: rxerium
  severity: info
  description: |
    检测到疑似仿冒 Mailchimp 的钓鱼网站。模板在目标页面返回 200、页面内容命中 Mailchimp 的官方服务页面特征，且当前主机不属于 mailchimp.com 官方域名时触发，用于识别借用 Mailchimp 品牌页面诱导用户信任的仿冒站点。
  reference:
    - https://mailchimp.com
  metadata:
    max-request: 1
  tags: phishing,mailchimp,marketing,osint,discovery
http:
  - method: GET
    path:
      - "{{BaseURL}}"

    host-redirects: true
    max-redirects: 2

    matchers-condition: and
    matchers:
      - type: word
        words:
          - 'Use real-time behavior data and AI to convert more customers with Mailchimp&#039;s marketing, automation &amp; email marketing platform. Easy to use - start for free!'

      - type: status
        status:
          - 200

      - type: dsl
        dsl:
          - '!contains(host,"mailchimp.com")'
