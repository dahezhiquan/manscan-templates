id: django-detect

info:
  name: Django 指纹识别（指纹识别）
  author: Chirag Mistry
  severity: info
  description: |-
    Django 是 Python Web 框架，用于构建后端应用、管理后台和 API 服务。该模板请求首页、`/robots.txt`、`/sitemap.xml` 等路径，并依据 HTTP 200/403/404 状态码、页面标题、正文关键字或品牌资源特征识别目标是否使用或暴露了 Django 相关组件，适用于资产盘点、技术栈识别和后续安全评估；命中结果仅表示指纹特征匹配，不代表已确认存在可利用漏洞。
  metadata:
    verified: true
    max-request: 9
    shodan-query: http.component:"django"
  tags: django,detect,tech

http:
  - method: GET
    path:
      - "{{BaseURL}}"
      - "{{BaseURL}}/robots.txt"
      - "{{BaseURL}}/sitemap.xml"
      - "{{BaseURL}}/favicon.ico"
      - "{{BaseURL}}/admin/"
      - "{{BaseURL}}/static/"
      - "{{BaseURL}}/media/"
      - "{{BaseURL}}/index.php"
      - "{{BaseURL}}/django-admin/"

    stop-at-first-match: true
    matchers-condition: and
    matchers:
      - type: word
        part: body
        words:
          - "Powered by Django"
          - "django-project"
          - "Django Software Foundation"
        condition: or
        case-insensitive: true

      - type: status
        status:
          - 200
          - 403
          - 404
        condition: or

    extractors:
      - type: regex
        part: body
        name: version
        regex:
          - 'Django ([0-9.]+)'
          - 'Powered by Django ([0-9.]+)'

      - type: regex
        part: body
        name: django_id
        regex:
          - 'django-site-id=([a-z0-9]+)'
          - 'django\.org/([^/]+)'
