id: holley-phish

info:
  name: Holley 仿冒钓鱼网站（钓鱼网站识别）
  author: rxerium
  severity: info
  description: |
    检测到疑似仿冒 Holley 的钓鱼网站。模板在目标页面返回 200、页面内容命中 Holley 的品牌页面特征，且当前主机不属于 holley.com 官方域名时触发，用于识别借用 Holley 品牌页面诱导用户信任的仿冒站点。
  reference:
    - https://holley.com
  metadata:
    max-request: 1
  tags: phishing,holley,ecommerce,osint,discovery
http:
  - method: GET
    path:
      - "{{BaseURL}}"

    host-redirects: true
    max-redirects: 2

    matchers-condition: and
    matchers:
      - type: word
        words:
          - 'Holley'
          - 'Holley is home to the top automotive performance brands including Flowmaster exhaust, MSD Ignition, Holley EFI, Hurst Shifters, Accel plug wires, Hooker Headers and many more.'
        condition: and

      - type: status
        status:
          - 200

      - type: dsl
        dsl:
          - '!contains(host,"holley.com")'
