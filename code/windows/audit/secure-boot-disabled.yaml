id: secure-boot-disabled

info:
  name: Secure Boot 未启用（本地基线扫描）
  author: princechaddha
  severity: high
  description: |
    该模板检查 Secure Boot 是否禁用。未启用会降低启动链完整性保护。
  impact: |
    攻击者可植入 bootkit/rootkit 或加载未授权启动组件。
  remediation: |
    在 BIOS/UEFI 中启用 Secure Boot，并使用受信任启动组件。
  tags: secure-boot,uefi,code,windows-audit

self-contained: true

code:
  - pre-condition: |
      IsWindows();
    engine:
      - powershell
      - powershell.exe
    args:
      - -ExecutionPolicy
      - Bypass
    pattern: "*.ps1"
    source: |
      Confirm-SecureBootUEFI

    matchers:
      - type: word
        words:
          - "False"
