id: citrix-hypervisor-page

info:
  name: Citrix Hypervisor Page 指纹识别（指纹识别）
  author: pussycat0x
  severity: info
  description: Citrix Hypervisor Page 是虚拟化平台，用于运行、管理和交付虚拟机资源。该模板请求首页，并依据 HTTP 200 状态码、页面标题、正文关键字或品牌资源特征识别目标是否使用或暴露了 Citrix Hypervisor Page 相关组件，适用于资产盘点、技术栈识别和后续安全评估；命中结果仅表示指纹特征匹配，不代表已确认存在可利用漏洞。
  classification:
    cpe: cpe:2.3:o:citrix:hypervisor:*:*:*:*:*:*:*:*
  metadata:
    verified: true
    max-request: 1
    vendor: citrix
    product: hypervisor
    shodan-query: http.title:"Welcome to Citrix Hypervisor"
  tags: tech,citrix,default-page,discovery

http:
  - method: GET
    path:
      - '{{BaseURL}}'

    matchers-condition: and
    matchers:
      - type: word
        part: body
        words:
          - 'Welcome to Citrix Hypervisor'
          - 'XenCenter'
        condition: and

      - type: status
        status:
          - 200

    extractors:
      - type: regex
        part: body
        group: 1
        regex:
          - "Welcome to Citrix Hypervisor ([0-9. ]+)"
