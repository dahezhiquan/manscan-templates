id: kong-detect

info:
  name: Kong 指纹识别（指纹识别）
  author: geeknik,joshlarsen
  severity: info
  description: >-
    Kong 是 API 网关和服务网格入口，用于管理 API 路由、认证、限流、观测和插件扩展。该模板通过请求目标服务并检查预设路径或首页响应、页面正文关键字、HTTP
    响应头等指纹特征，判断目标是否使用或暴露了 Kong 相关组件；命中结果仅表示指纹特征匹配，可用于资产盘点、技术栈识别和后续安全评估，不代表已确认存在可利用漏洞。
  reference:
  - https://github.com/Kong/kong
  metadata:
    max-request: 1
  tags: tech,kong,discovery
http:
  - method: GET
    path:
      - "{{BaseURL}}"

    matchers:
      - type: word
        part: header
        words:
          - "server: kong"
          - "x-kong-response-latency"
          - "x-kong-upstream-latency"
          - "x-kong-proxy-latency"
          - "x-kong-admin-request-id"
        condition: or
        case-insensitive: true

    extractors:
      - type: kval
        kval:
          - server
