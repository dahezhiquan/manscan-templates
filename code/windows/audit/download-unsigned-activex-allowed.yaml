id: download-unsigned-activex-allowed

info:
  name: 允许下载未签名 ActiveX 控件（本地基线扫描）
  author: princechaddha
  severity: high
  description: |
    该模板检查是否允许下载或安装未签名 ActiveX 控件。该配置会显著增加浏览器侧恶意控件执行风险。
  impact: |
    恶意 ActiveX 控件可能执行任意代码、窃取信息或破坏系统完整性。
  remediation: |
    禁用未签名 ActiveX 控件下载，并优先停用不再需要的 ActiveX 支持。
  tags: activex,code-signing,code,windows-audit

self-contained: true

code:
  - pre-condition: |
      IsWindows();
    engine:
      - powershell
      - powershell.exe
    args:
      - -ExecutionPolicy
      - Bypass
    pattern: "*.ps1"
    source: |
      $prop = Get-ItemProperty -Path 'HKCU:\Software\Microsoft\Windows\CurrentVersion\Internet Settings\Zones\0' -Name '1004' -ErrorAction SilentlyContinue; if ($null -eq $prop.'1004') { "Property '1004' does not exist" } else { $prop.'1004' }

    matchers:
      - type: word
        words:
          - "1004=0"
