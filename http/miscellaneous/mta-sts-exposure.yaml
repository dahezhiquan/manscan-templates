id: mta-sts-exposure

info:
  name: Well-Known MTA-STS 策略暴露
  author: rxerium
  severity: info
  description: |
    检测 SMTP MTA-STS 策略文件 (RFC 8461)。该文件用于声明邮件服务器的 TLS 传输安全策略。
  impact: |
    该 well-known 资源可能暴露邮件安全策略、MX 主机信息和策略有效期等实现细节。
  reference:
    - https://www.rfc-editor.org/rfc/rfc8461
  metadata:
    verified: true
    max-request: 1
    google-query: inurl:"/.well-known/mta-sts.txt"
  tags: well-known,email,security,rfc8461,miscellaneous,misc,vuln

http:
  - method: GET
    path:
      - "{{BaseURL}}/.well-known/mta-sts.txt"

    matchers-condition: and
    matchers:
      - type: word
        part: body
        words:
          - "version: STS"
          - "mode:"
        condition: and

      - type: status
        status:
          - 200
