id: teltonika-login

info:
  name: Teltonika 登录面板识别（暴露面识别）
  author: idealphase
  severity: info
  description: 该模板通过识别 Teltonika 登录入口的页面标题、特征文本或重定向行为，判断目标是否暴露了对应的认证界面。若命中，说明该登录面板对外可访问，可用于暴露面梳理与后续安全评估。
  reference:
    - https://www.exploit-db.com/ghdb/7819
    - https://teltonika-iot-group.com/
  classification:
    cvss-metrics: CVSS:3.0/AV:N/AC:L/PR:N/UI:N/S:U/C:N/I:N/A:N
    cwe-id: CWE-200
    cpe: cpe:2.3:h:teltonika:rut900:*:*:*:*:*:*:*:*
  metadata:
    max-request: 1
    google-query: intitle:"Teltonika -Web UI" | intitle:"Teltonika-RUT -Web UI" inurl:"/cgi-bin/luci"
    product: rut900
    vendor: teltonika
  tags: panel,teltonika,edb,discovery

http:
  - method: GET
    path:
      - '{{BaseURL}}/cgi-bin/luci'

    matchers-condition: and
    matchers:
      - type: regex
        regex:
          - '<title>Teltonika(.*) - Web UI</title>'

      - type: status
        status:
          - 200
