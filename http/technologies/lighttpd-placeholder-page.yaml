id: lighttpd-placeholder-page

info:
  name: Lighttpd 占位页面指纹识别（指纹识别）
  author: idealphase
  severity: info
  description: >-
    lighttpd 是轻量级 Web 服务器，占位页面通常表示服务已安装并保留默认站点内容。该模板通过请求目标服务并检查预设路径或首页响应、页面正文关键字、状态码等指纹特征，判断目标是否暴露
    lighttpd 占位页面；命中结果仅表示指纹特征匹配，可用于资产盘点、技术栈识别和后续安全评估，不代表已确认存在可利用漏洞。
  classification:
    cpe: cpe:2.3:a:lighttpd:lighttpd:*:*:*:*:*:*:*:*
  metadata:
    max-request: 1
    vendor: lighttpd
    product: lighttpd
    shodan-query: "If you find a bug in this Lighttpd package, or in Lighttpd itself"
  tags: tech,lighttpd,discovery
http:
  - method: GET
    path:
      - '{{BaseURL}}'

    matchers-condition: and
    matchers:
      - type: word
        words:
          - "If you find a bug in this Lighttpd package, or in Lighttpd itself"
          - "<h1> Placeholder page </h1>"
        condition: and

      - type: status
        status:
          - 200
