id: motive-eim-panel

info:
  name: Motive eSIM Secure Connect Panel - Exposure 识别（暴露面识别）
  author: miguelse
  severity: high
  description: |
    该模板用于识别 Motive eSIM Secure Connect 相关暴露入口或页面特征。若命中，说明目标可能对外公开了可访问的管理或信息接口，存在进一步泄露系统信息、配置数据或服务细节的风险。
  classification:
    cvss-metrics: CVSS:3.1/AV:N/AC:L/PR:N/UI:N/S:U/C:H/I:L/A:L
    cvss-score: 8.6
    cwe-id: CWE-200
  reference:
    - https://motive.com/eim
  metadata:
    verified: true
    max-request: 1
    vendor: motive_software_solutions
    product: motive_esim
    google-query:
      - inurl:"bulk-profile-operation"
      - inurl:"eid-management"
      - inurl:"eid-management-new"
  tags: panel,motive,eim,esim,iot,discovery

http:
  - method: GET
    path:
      - '{{BaseURL}}/eIMConfiguration'
      - '{{BaseURL}}/eid-management'
      - '{{BaseURL}}/eid-management-new'
      - '{{BaseURL}}/bulk-profile-operation'

    stop-at-first-match: true
    matchers-condition: and
    matchers:
      - type: word
        part: body
        words:
          - <title>EIM</title>

      - type: status
        status:
          - 200
