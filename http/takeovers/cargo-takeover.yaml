id: cargo-takeover

info:
  name: Cargo 未绑定域名接管检测（子域名接管）
  author: pdteam
  severity: high
  description: 检测 Cargo 自定义域名返回域名迁移或配置提示的情况，说明该子域名可能仍指向 Cargo 但未完成有效绑定，存在被重新配置并接管页面的风险。
  reference:
    - https://github.com/EdOverflow/can-i-take-over-xyz
  metadata:
    max-request: 1
  tags: takeover,vuln

http:
  - method: GET
    path:
      - "{{BaseURL}}"

    matchers-condition: and
    matchers:
      - type: dsl
        dsl:
          - Host != ip

      - type: word
        words:
          - "If you're moving your domain away from Cargo you must make this configuration through your registrar's DNS control panel."

    extractors:
      - type: dsl
        dsl:
          - cname
