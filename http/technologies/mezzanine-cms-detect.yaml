id: mezzanine-cms-detect

info:
  name: Mezzanine CMS 指纹识别（指纹识别）
  author: Chirag Mistry
  severity: info
  description: >-
    Mezzanine 是基于 Django 的内容管理系统，用于构建博客、企业站点和内容门户。该模板通过请求目标服务并检查预设路径或首页响应、页面正文关键字、正则特征等指纹特征，判断目标是否使用或暴露了
    Mezzanine CMS 相关组件；命中结果仅表示指纹特征匹配，可用于资产盘点、技术栈识别和后续安全评估，不代表已确认存在可利用漏洞。
  metadata:
    shodan-query:
    - http.component:"Mezzanine"
    - http.component:"mezzanine"
    - cpe:"cpe:2.3:a:mezzanine:mezzanine"
  tags: detect,mezzanine,cms,tech
http:
  - method: GET
    path:
      - "{{BaseURL}}"

    payloads:
      paths:
        - "/"
        - "/admin/login/"
        - "/admin/dashboard/"
        - "/static/js/mezzanine.js"
        - "/settings.py"
        - "/mezzanine/"

    stop-at-first-match: true
    matchers-condition: or
    matchers:
      - type: word
        words:
          - "powered by Mezzanine"
          - "Welcome to Mezzanine"
          - "Mezzanine version"
        condition: or
        case-insensitive: true

      - type: regex
        regex:
          - "(?i)mezzanine\\s+(v[0-9.]+)"
          - "(?i)<title>Mezzanine CMS"
