id: gilacms-detect

info:
  name: GilaCMS 指纹识别（指纹识别）
  author: pikpikcu
  severity: info
  description: >-
    GilaCMS 是 PHP 内容管理系统，用于构建和管理网站内容、主题和插件。该模板通过请求目标服务并检查预设路径或首页响应、页面正文关键字、状态码等指纹特征，判断目标是否使用或暴露了
    GilaCMS 相关组件；命中结果仅表示指纹特征匹配，可用于资产盘点、技术栈识别和后续安全评估，不代表已确认存在可利用漏洞。
  metadata:
    max-request: 2
  tags: tech,gilacms,discovery
http:
  - method: GET
    path:
      - "{{BaseURL}}"
      - "{{BaseURL}}/user"

    stop-at-first-match: true

    matchers-condition: and
    matchers:
      - type: word
        part: body
        words:
          - 'Homepage | Gila CMS'
          - '<meta name="generator" content="Gila CMS">'
        condition: or

      - type: status
        status:
          - 200
