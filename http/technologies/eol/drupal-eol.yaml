id: drupal-eol

info:
  name: Drupal EOL 指纹识别（指纹识别）
  author: CyberTechSea
  severity: info
  description: >-
    Drupal 是开源内容管理系统，EOL 版本表示目标站点使用的 Drupal 分支已停止官方维护。该模板通过请求目标服务并检查预设路径或首页响应、页面正文关键字、正则特征、DSL
    条件等指纹特征，判断目标是否使用或暴露了 Drupal EOL 相关组件；命中结果仅表示指纹特征匹配，可用于资产盘点、技术栈识别和后续安全评估，不代表已确认存在可利用漏洞。
  reference:
  - https://endoflife.date/drupal
  - https://www.drupal.org/about/core/policies/core-release-cycles/schedule
  - https://www.drupal.org/about/drupal-7/d7eol
  metadata:
    verified: true
    max-request: 3
    product: drupal
    vendor: drupal
    shodan-query: http.component:"Drupal"
  tags: tech,drupal,eol
http:
  - method: GET
    path:
      - "{{BaseURL}}"
      - "{{BaseURL}}/core/CHANGELOG.txt"
      - "{{BaseURL}}/CHANGELOG.txt"

    host-redirects: true
    max-redirects: 2
    stop-at-first-match: true

    extractors:
      - type: regex
        part: all
        name: version
        group: 1
        regex:
          - '(?i)Drupal\s+([0-9]+\.[0-9]+(?:\.[0-9]+)?),\s+[0-9]{4}-'
          - '(?i)content=["\x27]?Drupal\s+([0-9]+(?:\.[0-9]+)*)'
          - '(?i)X-Generator:\s*Drupal\s+([0-9]+(?:\.[0-9]+)*)'

    matchers:
      - type: dsl
        dsl:
          - "compare_versions(version, '<10.0.0')"
