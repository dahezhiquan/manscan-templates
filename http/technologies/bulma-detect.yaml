id: bulma-detect

info:
  name: Bulma CSS 框架 指纹识别（指纹识别）
  author: Shivam Kamboj
  severity: info
  description: |-
    Bulma CSS 框架 是 CSS 前端框架，用于构建响应式页面布局和 UI 组件。该模板请求首页，并依据页面标题、正文关键字或品牌资源特征识别目标是否使用或暴露了 Bulma CSS 框架 相关组件，适用于资产盘点、技术栈识别和后续安全评估；命中结果仅表示指纹特征匹配，不代表已确认存在可利用漏洞。
  reference:
  - https://bulma.io/
  metadata:
    verified: true
    max-request: 1
    shodan-query: 'html:"cdnjs.cloudflare.com/ajax/libs/bulma" || html:"unpkg.com/bulma" || html:"bulma.css" country:"DE"'
    product: bulma
    vendor: bulma
  tags: tech,discovery,bulma

http:
  - method: GET
    path:
      - "{{BaseURL}}"

    redirects: true

    matchers:
      - type: regex
        part: body
        regex:
          - '(?i)(/|")bulma(\.min)?\.css'

    extractors:
      - type: regex
        name: version
        part: body
        group: 1
        regex:
          - '(?i)bulma(?:@|/)([0-9.]+)/'
          - '(?i)bulma-([0-9.]+)\.css'
