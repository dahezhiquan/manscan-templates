id: logrocket-rum-detect

info:
  name: LogRocket RUM 指纹识别（指纹识别）
  author: Shivam Kamboj
  severity: info
  description: >-
    LogRocket 是前端会话回放和真实用户监控平台，RUM 脚本用于采集页面性能、错误和用户交互数据。该模板通过请求目标服务并检查预设路径或首页响应、DSL
    条件等指纹特征，判断目标是否使用或暴露了 LogRocket RUM 相关组件；命中结果仅表示指纹特征匹配，可用于资产盘点、技术栈识别和后续安全评估，不代表已确认存在可利用漏洞。
  reference:
  - https://logrocket.com/
  metadata:
    verified: true
    max-request: 1
    vendor: logrocket
    product: logrocket
    shodan-query: http.html:"LogRocket.init"
    fofa-query: body="LogRocket.init" || body="cdn.logrocket.io"
  tags: tech,detect,rum,logrocket
http:
  - method: GET
    path:
      - "{{BaseURL}}"

    redirects: true
    max-redirects: 2
    matchers:
      - type: dsl
        dsl:
          - 'status_code == 200'
          - 'contains(body, "LogRocket.min.js")'
        condition: and
