id: rdp-drive-redirection-allowed

info:
  name: RDP 允许驱动器重定向（本地基线扫描）
  author: princechaddha
  severity: medium
  description: |
    驱动器重定向会在会话间暴露文件系统。对应基线项为“远程桌面用户是否可重定向本地驱动器”；模板执行本地检查命令并以 `fDisableCdm  : 0` 等输出作为命中依据。
  impact: |
    - 敏感文件可能在远程会话中泄露，攻击者也可能借此传入恶意工具。
    - 远程入口暴露或协议保护不足会增加暴力破解、中间人攻击和远程控制风险。
  remediation: |
    - 按需禁用 RDP 驱动器重定向，并限制剪贴板和设备重定向策略。
    - 限制访问来源，优先使用加密和强认证，并关闭无业务需求的远程服务。
  tags: rdp,drive-redirection,code,windows-audit

self-contained: true

code:
  - pre-condition: |
      IsWindows();
    engine:
      - powershell
      - powershell.exe
    args:
      - -ExecutionPolicy
      - Bypass
    pattern: "*.ps1"
    source: |
      New-ItemProperty -Path 'HKLM:\Software\Policies\Microsoft\Windows NT\Terminal Services' -Name 'fDisableCdm' -Value 1 -PropertyType 'DWord'

    matchers:
      - type: word
        words:
          - "fDisableCdm  : 0"
