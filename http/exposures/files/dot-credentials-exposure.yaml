id: dot-credentials-exposure

info:
  name: Dot凭据暴露（暴露面识别）
  author: theamanrawat
  severity: high
  description: |
    检测到目标站点可直接访问 Dot凭据。凭据、密钥或令牌类文件通常用于系统认证、服务调用、代码发布、远程登录或第三方 API 集成。该模板请求 `/.credentials`，并通过 HTTP 状态码、响应正文关键字、文件格式特征、正则匹配或响应头进行确认。此类文件公开后可能泄露源码结构、依赖版本、内部路径、业务配置、访问凭据或调试数据，扩大暴露面并降低攻击者的后续利用成本。
  impact: |-
    - 泄露的密码、API Key、访问令牌、私钥或服务账号凭据可能被用于直接访问云资源、代码仓库、数据库、邮件服务或内部系统。
    - 攻击者可能借助有效凭据读取或篡改业务数据、发布恶意制品、创建持久化访问、冒用服务身份或产生额外资源费用。
    - 即使凭据权限有限，也会暴露账号命名、环境划分和内部系统关系，辅助后续横向移动。
  remediation: |-
    - 立即撤销并轮换暴露文件中可能出现的密码、API Key、访问令牌、SSH/SSL 私钥、数据库连接串和云访问密钥。
    - 将敏感配置迁移到密钥管理系统、环境变量注入或受控配置中心，避免随静态文件对外发布。
    - 限制相关账号权限并启用最小权限、MFA、访问审计和异常调用告警。
    - 排查近期登录、API 调用、代码仓库、云资源和制品库操作记录，确认是否存在未授权使用。
  metadata:
    verified: true
    max-request: 1
  tags: exposure,config,credentials,sensitive,token

http:
  - method: GET
    path:
      - "{{BaseURL}}/.credentials"

    matchers-condition: and
    matchers:
      - type: word
        part: body
        words:
          - "client_id"
          - "client_secret"
          - "access_token"
          - "refresh_token"
          - "password"
          - "aws_access_key_id"
        condition: or

      - type: word
        part: body
        words:
          - "<html"
          - "<body"
          - "<!DOCTYPE"
          - "<script"
          - "<?php"
        negative: true

      - type: status
        status:
          - 200

    extractors:
      - type: regex
        part: body
        name: aws_access_key
        group: 1
        regex:
          - "(?i)aws_access_key_id\\s*[:=]\\s*[\"']?([A-Z0-9]{20})[\"']?"

      - type: regex
        part: body
        name: aws_secret_key
        group: 1
        regex:
          - "(?i)aws_secret_access_key\\s*[:=]\\s*[\"']?([A-Za-z0-9/+=]{40})[\"']?"

      - type: regex
        part: body
        name: generic_secrets
        group: 1
        regex:
          - "(?i)(?:client_secret|access_token|refresh_token|password|secret)\\s*[:=]\\s*[\"']?([a-zA-Z0-9_\\-\\.~]+)[\"']?"

      - type: regex
        part: body
        name: client_id
        group: 1
        regex:
          - "(?i)client_id\\s*[:=]\\s*[\"']?([a-zA-Z0-9_\\-\\.]+)[\"']?"
