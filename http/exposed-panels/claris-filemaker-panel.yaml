id: claris-filemaker-panel

info:
  name: Claris FileMaker Server Admin Console 识别（指纹识别）
  author: s4e-io
  severity: info
  description: |-
    检测到目标站点存在 Claris FileMaker Server Admin Console 相关响应特征。Claris FileMaker Server Admin Console 是服务器、带外管理或远程运维控制台，用于监控硬件状态、远程控制、电源管理和固件维护。模板请求 `/admin-console/signin`，并通过页面标题或正文关键字、状态码确认该系统指纹，用于资产识别、系统盘点和暴露面梳理。
  reference:
    - https://www.claris.com/filemaker/server/
  classification:
    cvss-metrics: CVSS:3.0/AV:N/AC:L/PR:N/UI:N/S:U/C:N/I:N/A:N
    cwe-id: CWE-200
    cpe: cpe:2.3:a:claris:filemaker_server:*:*:*:*:*:*:*:*
  metadata:
    verified: true
    max-request: 1
    vendor: claris
    product: filemaker_server
    shodan-query: title:"Claris FileMaker "
    fofa-query: title="Claris FileMaker"
    google-query: intitle:"Claris FileMaker"
  tags: panel,filemaker,claris,detect
http:
  - method: GET
    path:
      - '{{BaseURL}}/admin-console/signin'

    matchers-condition: and
    matchers:
      - type: word
        part: body
        words:
          - '<title>Claris FileMaker Server Admin Console</title>'

      - type: status
        status:
          - 200
