id: allow-unencrypted-ftp

info:
  name: FTP 允许未加密连接（本地基线扫描）
  author: princechaddha
  severity: high
  description: |
    若 FTP 未强制 TLS/SSL，用户名、口令和传输内容可能以明文形式在网络中暴露。对应基线项为“Windows FTP 服务是否允许未加密连接”；模板读取 IIS/FTP WebAdministration 配置，检查认证、TLS 或访问控制项是否处于不安全状态。
  impact: |
    - 允许未加密 FTP 会增加凭据窃听、会话劫持和敏感文件泄露风险。
    - 远程入口暴露或协议保护不足会增加暴力破解、中间人攻击和远程控制风险。
  remediation: |
    - 配置 FTP 服务强制使用 FTPS/TLS，或停用不再需要的 FTP 服务。
    - 限制访问来源，优先使用加密和强认证，并关闭无业务需求的远程服务。
  tags: ftp,windows,code,windows-audit

self-contained: true

code:
  - pre-condition: |
      IsWindows();
    engine:
      - powershell
      - powershell.exe
    args:
      - -ExecutionPolicy
      - Bypass
    pattern: "*.ps1"
    source: |
      Get-WebConfiguration -Filter system.ftpServer/security/authentication/basicAuthentication -PSPath IIS:\ -ErrorAction SilentlyContinue

    matchers:
      - type: word
        words:
          - "Deny"
