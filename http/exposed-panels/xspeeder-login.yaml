id: xspeeder-login

info:
  name: XSpeeder 登录面板识别（指纹识别）
  author: rxerium
  severity: info
  description: |-
    XSpeeder 是路由或网络加速设备管理入口，用于链路、加速策略和网络配置。该模板请求 `/login/?nLang=1`，并依据 HTTP 200 状态码、页面标题、正文关键字或品牌资源特征识别目标是否部署了该系统或暴露了对应入口，适用于资产指纹确认；命中结果仅表示系统特征匹配，不代表已确认存在未授权访问或可利用漏洞。
  reference:
  - https://www.xspeeder.com/
  metadata:
    verified: true
    max-request: 1
    vendor: Changsha Tongxun Computer Technology Co., Ltd
    product: xspeeder_router
    shodan-query: http.title:"神行者路由"
    fofa-query: title="神行者路由"
  tags: panel,xspeeder,router,login,detect

http:
  - method: GET
    path:
      - "{{BaseURL}}/login/?nLang=1"

    matchers-condition: and
    matchers:
      - type: word
        part: body
        words:
          - "<title>神行者路由"

      - type: status
        status:
          - 200
