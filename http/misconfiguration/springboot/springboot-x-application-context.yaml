id: springboot-x-application-context

info:
  name: Spring Boot `X Application Context` Header 暴露
  author: DhiyaneshDK
  severity: low
  description: |
    检测到 Spring Boot `X Application Context` Header 暴露。目标响应或文件中可能暴露配置、凭据、密钥、令牌、环境变量或历史记录等敏感信息，可能被用于进一步入侵。
  reference:
    - https://github.com/spring-projects/spring-boot/issues/1308
  metadata:
    verified: true
    max-request: 1
    shodan-query: "X-Application-Context"
  tags: springboot,misconfig,exposure

http:
  - method: GET
    path:
      - "{{BaseURL}}"

    host-redirects: true
    max-redirects: 2

    matchers-condition: and
    matchers:
      - type: word
        part: header
        words:
          - '^X-Application-Context:\s*\S.+$'

      - type: status
        status:
          - 200

    extractors:
      - type: regex
        part: header
        group: 1
        regex:
          - '(?m)^X-Application-Context:\s*(\S.+)$'
