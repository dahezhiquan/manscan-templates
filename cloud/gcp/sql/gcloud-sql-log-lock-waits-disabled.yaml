id: gcloud-sql-log-lock-waits-disabled

info:
  name: PostgreSQL 数据库实例未启用 log_lock_waits 标志（云安全）
  author: princechaddha
  severity: medium
  description: PostgreSQL log_lock_waits 可记录长时间等待锁的语句，帮助发现阻塞、异常事务和潜在拒绝服务风险。本模板检查 Cloud SQL PostgreSQL 实例 databaseFlags 中 log_lock_waits 的值，匹配 off 时报告锁等待日志未启用。
  impact: |
    - 长事务、恶意锁定或应用缺陷造成的阻塞缺少日志证据，故障定位和责任追踪更困难。
    - 锁等待问题可能演变为性能下降或业务不可用，且不易被安全监控及时发现。
  remediation: |
    - 启用 log_lock_waits，并结合 deadlock_timeout、慢查询日志和数据库性能指标进行分析。
    - 对反复出现的锁等待来源建立告警和优化流程，及时处理异常事务或低效 SQL。
  reference:
    - https://cloud.google.com/sql/docs/postgres/flags
  metadata:
    vendor: google
    product: cloud-sql
  tags: cloud,devops,gcp,gcloud,google-cloud-sql,postgresql,gcp-cloud-config

flow: |
  code(1)
  for(let projectId of iterate(template.projectIds)){
    set("projectId", projectId)
    code(2)
    for(let sqlInstance of iterate(template.sqlInstances)){
      set("sqlInstance", sqlInstance)
      code(3)
    }
  }

self-contained: true

code:
  - engine:
      - sh
      - bash
    source: |
      gcloud projects list --format="json(projectId)"

    extractors:
      - type: json
        name: projectIds
        internal: true
        json:
          - '.[].projectId'

  - engine:
      - sh
      - bash
    source: |
      gcloud sql instances list --project $projectId --filter='DATABASE_VERSION:POSTGRES*' --format="json(name)"

    extractors:
      - type: json
        name: sqlInstances
        internal: true
        json:
          - '.[].name'

  - engine:
      - sh
      - bash
    source: |
      gcloud sql instances describe $sqlInstance --format="json(settings.databaseFlags)" | jq '.[]? | select(.name=="log_lock_waits") | .value'

    matchers:
      - type: word
        words:
          - '"off"'

    extractors:
      - type: dsl
        dsl:
          - '"Log Lock Waits Flag is not enabled for PostgreSQL Database Instance: " + sqlInstance + " in project: " + projectId'
