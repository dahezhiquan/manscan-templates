id: chatgpt-phish

info:
  name: ChatGPT 仿冒钓鱼网站（钓鱼网站识别）
  author: rxerium
  severity: info
  description: |
    检测到疑似仿冒 ChatGPT 的钓鱼网站。模板在目标页面返回 200、页面内容命中 ChatGPT 的品牌页面特征，且当前主机不属于 chatgpt.com、openai.com 官方域名时触发，用于识别借用 ChatGPT 品牌页面诱导用户信任的仿冒站点。
  reference:
    - https://chatgpt.com
  metadata:
    max-request: 1
  tags: phishing,chatgpt,openai,ai,osint,discovery
http:
  - method: GET
    path:
      - "{{BaseURL}}"

    host-redirects: true
    max-redirects: 2

    matchers-condition: and
    matchers:
      - type: word
        words:
          - '<title>ChatGPT'
          - 'ChatGPT helps you get answers, find inspiration, and be more productive.'
        condition: and

      - type: status
        status:
          - 200

      - type: dsl
        dsl:
          - '!contains(host,"chatgpt.com")'
          - '!contains(host,"openai.com")'
