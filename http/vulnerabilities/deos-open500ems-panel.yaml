id: deos-open500ems-panel

info:
  name: DEOS OPEN 500EMS Controller - 管理接口暴露
  author: sullo
  severity: high
  description: |
    该模板用于检测 DEOS OPEN 500EMS Controller - 管理接口暴露。该类漏洞通常源于敏感接口、配置文件、错误信息或调试数据被未授权暴露。模板主要向 `/cgi-bin/cosmobdf.cgi?function=0`、`/cgi-bin/cosmobdf.cgi?function=1` 等路径发送探测请求，并根据响应中的 `<b>OPENview</b>`、`/cgi-bin/cosmobdf.cgi?function=12` 等特征确认漏洞是否存在。
  impact: |
    - 攻击者可获取路径、配置、账号、令牌、日志或其他敏感信息。
    - 泄露的信息可能被用于定位系统结构、复用凭据、绕过访问控制或辅助后续攻击。
  remediation: |
    - 移除或限制敏感接口、调试页面、配置文件和日志文件的外部访问。
    - 对错误信息和接口响应进行最小化处理，避免返回内部路径、账号、密钥或堆栈信息。
    - 轮换已暴露的凭据和令牌，并检查相关账号的访问记录。
  reference:
    - https://www.deos-ag.com/
  classification:
    cvss-metrics: CVSS:3.0/AV:N/AC:L/PR:N/UI:N/S:C/C:H/I:N/A:N
    cvss-score: 8.6
    cwe-id: CWE-284
  metadata:
    max-request: 2
  tags: openv500,disclosure,panel,vuln

http:
  - method: GET
    path:
      - "{{BaseURL}}/cgi-bin/cosmobdf.cgi?function=0"
      - "{{BaseURL}}/cgi-bin/cosmobdf.cgi?function=1"

    matchers-condition: and
    matchers:
      - type: status
        status:
          - 200

      - type: word
        part: body
        words:
          - '<b>OPENview</b>'
          - '/cgi-bin/cosmobdf.cgi?function=12'
          - '/cgi-bin/cosmobdf.cgi?function=2'
        condition: or
