id: moveit-transfer-detect

info:
  name: MOVEit Transfer 指纹识别（指纹识别）
  author: tess
  severity: info
  description: >-
    MOVEit Transfer 是托管文件传输平台，用于企业间安全文件交换、审计和自动化传输。该模板通过请求目标服务并检查预设路径或首页响应、页面正文关键字、状态码等指纹特征，判断目标是否使用或暴露了
    MOVEit Transfer 相关组件；命中结果仅表示指纹特征匹配，可用于资产盘点、技术栈识别和后续安全评估，不代表已确认存在可利用漏洞。
  classification:
    cpe: cpe:2.3:a:progress:moveit_transfer:*:*:*:*:*:*:*:*
  metadata:
    verified: true
    max-request: 2
    vendor: progress
    product: moveit_transfer
    shodan-query: html:"human.aspx"
  tags: tech,moveit,discovery
http:
  - method: GET
    path:
      - '{{BaseURL}}'
      - '{{BaseURL}}/human.aspx'

    stop-at-first-match: true

    matchers-condition: and
    matchers:
      - type: word
        part: body
        words:
          - 'stylesheet_MOVEit'
          - 'moveit.transfer'
          - 'MOVEitPopUp'
          - 'MOVEit Automation'
        condition: or
        case-insensitive: true

      - type: status
        status:
          - 200
