id: hpe-system-management-anonymous-access

info:
  name: HPE System Management 匿名访问
  author: divya_mudgal
  severity: low
  description: |
    该模板用于核查 HPE System Management 匿名访问。该类问题通常源于管理端、API、控制台或服务接口缺少认证授权，导致未登录用户可直接访问敏感功能。模板会向目标发送探测请求，并依据请求 `/chpstrt.php?chppath=Home`、匹配 `username = "hpsmh_anonymous";`、匹配 `var host_addr = '`、匹配 `var ip_addr   = '`等证据确认目标是否存在该配置问题。
  impact: |
    - 攻击者可在未授权状态下查看系统状态、业务数据、任务信息或管理接口。
    - 若接口支持写操作，可能进一步导致配置篡改、服务接管、数据删除或横向移动。
  remediation: |
    - 为相关管理端和 API 启用认证授权，并按最小权限限制可访问功能。
    - 将管理接口限制在内网、VPN 或可信来源范围内，并开启访问审计。
    - 检查历史访问日志，确认是否存在未授权访问、批量枚举或异常操作。
  metadata:
    max-request: 1
  tags: hp,unauth,misconfig,vuln

http:
  - method: GET
    path:
      - "{{BaseURL}}/chpstrt.php?chppath=Home"

    matchers-condition: and
    matchers:
      - type: word
        condition: and
        words:
          - "username = \"hpsmh_anonymous\";"
          - "var host_addr = '"
          - "var ip_addr   = '"
