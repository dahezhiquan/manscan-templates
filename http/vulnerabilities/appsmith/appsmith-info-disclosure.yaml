id: appsmith-info-disclosure

info:
  name: Appsmith <= v1.97 - 信息泄露漏洞
  author: ritikchaddha
  severity: medium
  description: |
    该模板用于检测 Appsmith <= v1.97 - 信息泄露漏洞。该类漏洞通常源于敏感接口、配置文件、错误信息或调试数据被未授权暴露。模板主要向 `/api/v1/consolidated-api/view`、`/api/v1/users/features` 等路径发送探测请求，并根据响应中的 `{"responseMeta":{`、`status":200,"success":true` 等特征确认漏洞是否存在。
  impact: |
    - 攻击者可获取路径、配置、账号、令牌、日志或其他敏感信息。
    - 泄露的信息可能被用于定位系统结构、复用凭据、绕过访问控制或辅助后续攻击。
  remediation: |
    - 移除或限制敏感接口、调试页面、配置文件和日志文件的外部访问。
    - 对错误信息和接口响应进行最小化处理，避免返回内部路径、账号、密钥或堆栈信息。
    - 轮换已暴露的凭据和令牌，并检查相关账号的访问记录。
  reference:
    - https://github.com/appsmithorg/appsmith/security/advisories/GHSA-qvvc-prjx-f85j
  classification:
    cvss-metrics: CVSS:3.1/AV:N/AC:L/PR:N/UI:N/S:U/C:L/I:N/A:N
    cvss-score: 4.3
    cwe-id: CWE-200
  metadata:
    verified: true
    max-request: 1
    vendor: appsmith
    product: appsmith
    shodan-query: http.title:"Appsmith"
    fofa-query: title="Appsmith"
  tags: appsmith,disclosure,exposure

http:
  - method: GET
    path:
      - "{{BaseURL}}/api/v1/consolidated-api/view"
      - "{{BaseURL}}/api/v1/users/features"
      - "{{BaseURL}}/api/v1/tenants/current"

    matchers-condition: and
    matchers:
      - type: word
        part: body
        words:
          - '{"responseMeta":{'
          - 'status":200,"success":true'
        condition: and

      - type: word
        part: content_type
        words:
          - 'application/json'
