id: api-scrapingant

info:
  name: ScrapingAnt API Token 可用性校验（token喷洒）
  author: daffainfo
  severity: info
  description: 该模板通过调用 ScrapingAnt API 的已知接口验证提供的 token 是否有效，命中后通常表示可访问相关 API 能力。
  reference:
    - https://docs.scrapingant.com/
    - https://github.com/daffainfo/all-about-apikey/tree/main/scrapingant
  metadata:
    max-request: 1
  tags: token-spray,scrapingant

self-contained: true

http:
  - raw:
      - |
        POST https://api.scrapingant.com/v1/general HTTP/1.1
        Host: api.scrapingant.com
        x-api-key: {{token}}
        Content-Type: application/json

        {"url": "https://example.com"}

    matchers:
      - type: word
        part: body
        words:
          - '"content"'
          - '"cookies"'
          - '"status_code"'
        condition: and
