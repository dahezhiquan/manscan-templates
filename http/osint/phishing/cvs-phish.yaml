id: cvs-phish

info:
  name: CVS 仿冒钓鱼网站（钓鱼网站识别）
  author: rxerium
  severity: info
  description: |
    检测到疑似仿冒 CVS 的钓鱼网站。模板在目标页面返回 200、页面内容命中 CVS 的品牌页面特征，且当前主机不属于 cvs.com 官方域名时触发，用于识别借用 CVS 品牌页面诱导用户信任的仿冒站点。
  reference:
    - https://cvs.com
  metadata:
    max-request: 1
  tags: phishing,cvs,ecommerce,osint,discovery
http:
  - method: GET
    path:
      - "{{BaseURL}}"

    host-redirects: true
    max-redirects: 2

    matchers-condition: and
    matchers:
      - type: word
        words:
          - 'CVS'
          - 'Refill and transfer prescriptions online or find a CVS Pharmacy near you. Shop online, see ExtraCare deals, find MinuteClinic locations and more.'
        condition: and

      - type: status
        status:
          - 200

      - type: dsl
        dsl:
          - '!contains(host,"cvs.com")'
