id: rockwell-factorytalk-viewpoint-panel

info:
  name: Rockwell Automation FactoryTalk ViewPoint 面板（暴露面识别）
  author: rxerium
  severity: info
  description: |
    该模板用于识别 Rockwell Automation FactoryTalk ViewPoint 是否存在对外暴露的管理、服务或状态界面。若命中，说明目标公开了相关功能入口，可作为资产盘点与攻击面收敛的依据。
  reference:
    - https://www.rockwellautomation.com/en-us/products/software/factorytalk/operationsuite/view/factorytalk-viewpoint.html
  metadata:
    max-request: 1
    verified: true
    vendor: Rockwell Automation
    product: factorytalk-viewpoint
    shodan-query: 'http.title:"FactoryTalk ViewPoint"'
  tags: panel,ics,scada,rockwell,factorytalk,discovery

http:
  - method: GET
    path:
      - "{{BaseURL}}"

    host-redirects: true
    max-redirects: 2

    matchers-condition: and
    matchers:
      - type: word
        part: body
        words:
          - '/ftvp/ViewPoint.aspx'
          - '<title>FTVP</title>'
          - '/ftvp/Images/favicon.ico'
        condition: or

      - type: status
        status:
          - 200
