id: helicone-panel

info:
  name: Helicone 面板 - 检测（指纹识别）
  author: rxerium
  severity: info
  description: |-
    检测到目标站点存在 Helicone 相关响应特征。Helicone 是 AI、LLM 或机器学习相关平台，用于管理模型、数据集、工作区、推理服务或生成任务。模板请求 `/`，并通过页面标题或正文关键字、状态码确认该系统指纹，用于资产识别、系统盘点和暴露面梳理。
  reference:
    - https://github.com/Helicone/helicone
    - https://helicone.ai
  metadata:
    verified: true
    max-request: 1
    vendor: helicone
    product: helicone
    shodan-query: 'http.title:"Helicone"'
  tags: panel,helicone,llm,ai,observability,detect,discovery
http:
  - method: GET
    path:
      - "{{BaseURL}}"

    host-redirects: true
    max-redirects: 2

    matchers-condition: and
    matchers:
      - type: word
        part: body
        words:
          - "Helicone - Open-Source Generative AI Platform for Developers"

      - type: status
        status:
          - 200
