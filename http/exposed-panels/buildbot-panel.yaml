id: buildbot-panel

info:
  name: Buildbot 面板识别（暴露面识别）
  author: thardt-praetorian,daffainfo
  severity: info
  description: 该模板通过识别 Buildbot 面板、控制台或管理界面的页面特征，判断目标是否暴露了对应服务入口。若命中，说明该后台或运维界面对外可访问，可用于资产识别与暴露面排查。
  reference:
    - https://buildbot.net
  classification:
    cvss-metrics: CVSS:3.0/AV:N/AC:L/PR:N/UI:N/S:U/C:N/I:N/A:N
    cwe-id: CWE-200
    cpe: cpe:2.3:a:buildbot:buildbot:*:*:*:*:*:*:*:*
  metadata:
    verified: true
    max-request: 1
    vendor: buildbot
    product: buildbot
    shodan-query:
      - http.title:"BuildBot"
      - http.title:"buildbot"
    fofa-query: title="buildbot"
    google-query: intitle:"buildbot"
  tags: panel,buildbot,cicd,discovery

http:
  - method: GET
    path:
      - '{{BaseURL}}'

    host-redirects: true
    max-redirects: 2

    matchers-condition: and
    matchers:
      - type: regex
        part: body
        regex:
          - '<title(.*)>Buildbot</title>'
          - 'buildbot_config'
        condition: or

      - type: status
        status:
          - 200

    extractors:
      - type: regex
        part: body
        regex:
          - '\[\"Buildbot\", \"([0-9.]+)\"\]'
