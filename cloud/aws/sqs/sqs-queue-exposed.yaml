id: sqs-queue-exposed

info:
  name: SQS Queue Policy 允许公共访问（云安全）
  author: DhiyaneshDK
  severity: high
  description: SQS queue policy 中 Principal AWS 为 * 时，可能允许外部主体对队列执行策略授予的收发或管理操作。该模板枚举 queue URL，读取 Policy 属性，并匹配 AWS 公共主体授权。
  impact: |
    - 未授权主体可能读取、发送或删除消息，导致敏感消息泄露、任务伪造或业务处理异常。
    - 公共队列策略可能被滥用于消息洪泛，造成消费端压力和成本上升。
  remediation: |
    - 移除 queue policy 中面向 * 的授权，仅允许明确可信的 AWS account、role 或服务访问。
    - 对跨账号或服务集成访问增加 SourceArn、SourceAccount、aws:PrincipalOrgID 等条件限制。
  reference:
    - https://www.trendmicro.com/cloudoneconformity-staging/knowledge-base/aws/SQS/sqs-queue-exposed.html
    - https://docs.aws.amazon.com/AmazonS3/latest/dev/UsingKMSEncryption.html
  metadata:
    vendor: amazon
    product: sqs
  tags: cloud,devops,aws,amazon,sqs,aws-cloud-config

variables:
  region: "us-west-2"

flow: |
  code(1)
  for(let QueueUrls of iterate(template.queueurls)){
    set("queueurl", QueueUrls)
    code(2)
  }

self-contained: true

code:
  - engine:
      - sh
      - bash
    source: |
      aws sqs list-queues --region $region --query 'QueueUrls[*]' --output json

    extractors:
      - type: json
        name: queueurls
        internal: true
        json:
          - '.[]'

  - engine:
      - sh
      - bash
    source: |
        aws sqs get-queue-attributes --region $region --queue-url $queueurl --attribute-names "Policy" --query 'Attributes.Policy' --output json

    matchers:
      - type: word
        words:
          - '"AWS": "*"'

    extractors:
      - type: dsl
        dsl:
          - '"SQS Queue " + queueurl + " is Exposed"'
