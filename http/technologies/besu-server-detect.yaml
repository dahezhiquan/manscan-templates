id: besu-server-detect

info:
  name: Besu JSON-RPC HTTP 服务器 指纹识别（指纹识别）
  author: Nullfuzz
  severity: info
  description: |-
    Besu JSON-RPC HTTP 服务器 是 Hyperledger Besu 以太坊客户端的 JSON-RPC 服务，用于区块链节点查询和交易交互。该模板请求首页，并依据 DSL 条件识别目标是否使用或暴露了 Besu JSON-RPC HTTP 服务器 相关组件，适用于资产盘点、技术栈识别和后续安全评估；命中结果仅表示指纹特征匹配，不代表已确认存在可利用漏洞。
  reference:
  - https://besu.hyperledger.org/
  - https://besu.hyperledger.org/public-networks/how-to/use-besu-api#service-ports
  metadata:
    verified: true
    max-request: 1
    shodan-query: product:"besu"
  tags: tech,besu,ethereum,web3,blockchain,discovery

http:
  - raw:
      - |
        POST / HTTP/1.1
        Host: {{Hostname}}
        Content-Type: application/json

        {"method":"web3_clientVersion","params":[],"id":1,"jsonrpc":"2.0"}

    matchers:
      - type: dsl
        dsl:
          - 'status_code == 200'
          - 'contains(header, "application/json")'
          - 'contains(body, "besu")'
        condition: and

    extractors:
      - type: regex
        part: body
        group: 1
        regex:
          - '(v[0-9.]+)'
