id: easyvista-panel

info:
  name: EasyVista 登录面板识别（暴露面识别）
  author: righettod
  severity: info
  description: |
    该模板通过识别 EasyVista 登录入口的页面标题、特征文本或重定向行为，判断目标是否暴露了对应的认证界面。若命中，说明该登录面板对外可访问，可用于暴露面梳理与后续安全评估。
  reference:
    - https://www.easyvista.com/
  metadata:
    verified: true
    max-request: 1
    shodan-query: http.title:"Easyvista"
  tags: panel,easyvista,login,detect,discovery

http:
  - method: GET
    path:
      - "{{BaseURL}}/index.php"

    matchers:
      - type: dsl
        dsl:
          - 'status_code == 200'
          - 'contains_any(to_lower(body), "<title>easyvista apps</title>", "easyvista-bundle.min.js", "packages_com_easyvista_core")'
        condition: and

    extractors:
      - type: regex
        part: body
        group: 1
        regex:
          - '(?i)package:\s+"([a-z0-9._-]+)"'
          - '(?i)version&nbsp;:&nbsp;([a-z0-9._-]+)'
