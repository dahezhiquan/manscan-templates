id: searchreplacedb2-exposure

info:
  name: Safe Search Replace 暴露
  author: kazet
  severity: high
  description: |
    检测到 Safe Search Replace 暴露。目标响应或文件中可能暴露配置、凭据、密钥、令牌、环境变量或历史记录等敏感信息，可能被用于进一步入侵。
  reference:
    - https://interconnectit.com/search-and-replace-for-wordpress-databases/
    - https://github.com/interconnectit/Search-Replace-DB
  metadata:
    verified: true
    max-request: 1
    shodan-query: html:"searchreplacedb2.php"
    fofa-query: body="searchreplacedb2.php"
  tags: misconfig,searchreplacedb2,exposure,vuln

http:
  - method: GET
    path:
      - "{{BaseURL}}/searchreplacedb2.php"

    matchers-condition: and
    matchers:
      - type: word
        part: body
        words:
          - "Database details"
          - "Safe Search Replace"
        condition: and

      - type: word
        part: header
        words:
          - "text/html"

      - type: status
        status:
          - 200
