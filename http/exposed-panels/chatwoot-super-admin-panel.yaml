id: chatwoot-super-admin-panel

info:
  name: Chatwoot 超级管理员面板 - 识别（指纹识别）
  author: RootKaito
  severity: info
  description: |-
    检测到目标站点存在 Chatwoot 超级管理员 相关响应特征。Chatwoot 超级管理员 是监控、日志、分析或可观测性系统，用于展示运行指标、告警事件、日志数据和服务状态。模板请求 `/super_admin/sign_in`，并通过页面标题或正文关键字、状态码确认该系统指纹，用于资产识别、系统盘点和暴露面梳理。
  reference:
    - https://www.chatwoot.com/
    - https://github.com/chatwoot/chatwoot
  classification:
    cpe: cpe:2.3:a:chatwoot:chatwoot:*:*:*:*:*:*:*:*
  metadata:
    verified: true
    max-request: 1
    vendor: chatwoot
    product: chatwoot
  tags: panel,chatwoot,login,detect,discovery
http:
  - method: GET
    path:
      - "{{BaseURL}}/super_admin/sign_in"

    matchers-condition: and
    matchers:
      - type: word
        part: body
        words:
          - "new_super_admin"
          - "Chatwoot"
        condition: and
        case-insensitive: true

      - type: status
        status:
          - 200
