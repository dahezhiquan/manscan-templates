id: documenso-panel

info:
  name: Documenso 面板 - 检测（指纹识别）
  author: ChrisJr404
  severity: info
  description: |-
    检测到目标站点存在 Documenso 相关响应特征。Documenso 是一套通过 Web 提供访问的管理面板或业务系统，通常用于配置服务、查看状态、管理数据或执行日常运维操作。模板请求 `/`，并通过页面标题或正文关键字、状态码、DSL 条件确认该系统指纹，用于资产识别、系统盘点和暴露面梳理。
  reference:
    - https://github.com/documenso/documenso
    - https://documenso.com/
  metadata:
    verified: true
    max-request: 1
    vendor: documenso
    product: documenso
    shodan-query: http.title:"Documenso"
    fofa-query: title="Documenso"
  tags: panel,documenso,docusign,signing,selfhosted,detect
http:
  - method: GET
    path:
      - "{{BaseURL}}"

    host-redirects: true
    max-redirects: 2

    matchers:
      - type: dsl
        dsl:
          - "status_code == 200"
          - "contains_all(body, \"Documenso - The Open Source DocuSign Alternative\", \"@documenso\")"
        condition: and
