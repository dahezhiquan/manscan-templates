id: azure-storage-account-delete-unalerted
info:
  name: Azure Storage Account 删除告警未配置（云安全）
  author: princechaddha
  severity: high
  description: Storage Account 删除操作未配置 Activity Log 告警时，Blob、文件、队列和表数据所在的存储账户可能被删除而不被及时发现。该模板枚举已启用的 Activity Log Alert，并检查 condition 是否缺少 Microsoft.Storage/storageAccounts/delete 操作条件。
  impact: |
    - 删除存储账户可能造成业务数据不可用，并使未复制或未备份的数据永久丢失。
    - 攻击者删除存储资源还可能破坏日志、备份和取证材料。
  remediation: |
    - 创建针对 Storage Account 删除操作的 Activity Log Alert，并绑定存储和安全应急响应渠道。
    - 启用数据复制、备份、软删除和资源锁，限制存储账户删除权限并定期演练恢复。
  reference:
    - https://docs.microsoft.com/en-us/azure/azure-monitor/platform/alerts-activity-log
  metadata:
    vendor: microsoft
    product: azure-monitor
  tags: cloud,devops,azure,microsoft,storage-account,azure-cloud-config

flow: |
  code(1);
  for (let AlertData of iterate(template.alertList)) {
    set("id", AlertData);
    code(2);
  }

self-contained: true
code:
  - engine:
      - sh
      - bash
    source: |
      az monitor activity-log alert list --output json --query '[?(enabled==`true`)].id'

    extractors:
      - type: json
        name: alertList
        internal: true
        json:
          - '.[]'

  - engine:
      - sh
      - bash
    source: |
      az monitor activity-log alert show --ids "$id" --query 'condition'

    matchers-condition: and
    matchers:
      - type: word
        words:
          - '"field": "operationName"'

      - type: word
        words:
          - "Microsoft.Storage/storageAccounts/delete"
        negative: true

    extractors:
      - type: dsl
        dsl:
          - 'id + " does not have the correct alert configuration for Delete Storage Account events"'
