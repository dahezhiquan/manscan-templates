id: jenkins-openuser-register

info:
  name: Jenkins 开放用户注册
  author: DhiyaneshDk
  severity: medium
  description: |
    该模板用于核查 Jenkins 开放用户注册。该类问题通常源于公开注册、自助开户或默认初始化策略未按业务预期关闭。模板会向目标发送探测请求，并依据请求 `/signup`、匹配 `Create an account! [Jenkins]`、匹配 `Register [Jenkins]`、匹配 `Register - Jenkins`等证据确认目标是否存在该配置问题。
  impact: |
    - 攻击者可自行创建账号进入系统，枚举内部功能、数据或协作空间。
    - 若新账号默认权限过高，可能进一步导致数据泄露、配置变更或平台滥用。
  remediation: |
    - 关闭不需要的公开注册和自助开户入口。
    - 对必须开放的注册流程增加审批、邮箱域限制、验证码和速率限制。
    - 审计近期新建账号、权限分配和异常登录行为。
  reference:
    - https://www.acunetix.com/vulnerabilities/web/jenkins-open-user-registration/
  classification:
    cpe: cpe:2.3:a:jenkins:jenkins:*:*:*:*:*:*:*:*
  metadata:
    verified: true
    max-request: 1
    vendor: jenkins
    product: jenkins
    shodan-query: "X-Jenkins"
  tags: misconfig,jenkins,apache,tomcat,vuln

http:
  - method: GET
    path:
      - "{{BaseURL}}/signup"

    matchers-condition: and
    matchers:
      - type: word
        part: body
        words:
          - "Create an account! [Jenkins]"
          - "Register [Jenkins]"
          - "Register - Jenkins"

      - type: word
        part: header
        words:
          - "text/html"

      - type: status
        status:
          - 200
