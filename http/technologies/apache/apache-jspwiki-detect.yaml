id: apache-jspwiki-detect

info:
  name: Apache JSPWiki 指纹识别（指纹识别）
  author: icarot
  severity: info
  description: |-
    Apache JSPWiki 是 Java Wiki 系统，用于团队知识库、页面协作和内容管理。该模板请求首页，并依据 DSL 条件识别目标是否使用或暴露了 Apache JSPWiki 相关组件，适用于资产盘点、技术栈识别和后续安全评估；命中结果仅表示指纹特征匹配，不代表已确认存在可利用漏洞。
  classification:
    cpe: cpe:2.3:a:apache:jspwiki:*:*:*:*:*:*:*:*
  metadata:
    max-request: 1
    vendor: apache
    product: jspwiki
    shodan-query: title:"JSPWiki"
  tags: tech,jspwiki,apache,detect,discovery

http:
  - method: GET
    path:
      - "{{BaseURL}}"

    matchers:
      - type: dsl
        dsl:
          - 'contains_any(body, "JSPWiki: Main", "JSPWiki: Login")'
          - 'contains(body, "/jspwiki")'
          - 'status_code == 200'
        condition: and

    extractors:
      - type: regex
        name: version
        part: body
        regex:
          - "JSPWiki v[0-9]+\\.[0-9]+\\.[0-9]+"
