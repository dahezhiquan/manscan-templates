id: fooocus-panel

info:
  name: 检测 Fooocus 面板（指纹识别）
  author: rxerium
  severity: info
  description: |-
    检测到 Fooocus——一个基于 Gradio 构建的开源、离线 Stable Diffusion 图像生成界面，专注于简化的基于提示词的图像生成。本次通过匹配其 Fooocus 品牌页面元数据及内嵌的 Gradio 配置来识别，从而避免与其他常共享同一端口的 Gradio 应用（如 ComfyUI、text-generation-webui 等）发生混淆。
  reference:
    - https://github.com/lllyasviel/Fooocus
  metadata:
    verified: true
    max-request: 1
    vendor: lllyasviel
    product: fooocus
    shodan-query: 'html:"fooocus"'
  tags: panel,fooocus,ai,image-generation,gradio,detect,discovery

http:
  - method: GET
    path:
      - "{{BaseURL}}"

    host-redirects: true
    max-redirects: 2

    matchers-condition: and
    matchers:
      - type: word
        part: body
        words:
          - 'og:title" content="Fooocus'
          - "window.gradio_config"
        condition: and

      - type: status
        status:
          - 200
