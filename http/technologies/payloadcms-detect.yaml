id: payloadcms-detect

info:
  name: Payload CMS 指纹识别（指纹识别）
  author: Shivam Kamboj
  severity: info
  description: >-
    Payload CMS 是基于 Node.js/TypeScript 的无头内容管理系统，用于构建 API 驱动的内容和后台管理。该模板通过请求目标服务并检查预设路径或首页响应、DSL
    条件等指纹特征，判断目标是否使用或暴露了 Payload CMS 相关组件；命中结果仅表示指纹特征匹配，可用于资产盘点、技术栈识别和后续安全评估，不代表已确认存在可利用漏洞。
  reference:
  - https://payloadcms.com/
  - https://github.com/payloadcms/payload
  metadata:
    verified: true
    max-request: 2
    vendor: payloadcms
    product: payload
    shodan-query:
    - http.html:"payload__modal"
    - http.html:"@layer payload-default"
    google-query: intitle:"Payload" inurl:"/admin"
  tags: tech,detect,payloadcms,cms
http:
  - method: GET
    path:
      - "{{BaseURL}}"
      - "{{BaseURL}}/admin/login"

    stop-at-first-match: true
    redirects: true

    matchers:
      - type: dsl
        dsl:
          - "contains_any(body, '<title>Login - Payload', '<title>Payload Admin')"
          - 'status_code == 200'
        condition: and
