id: odoo-unprotected-database

info:
  name: Odoo Unprotected 数据库
  author: pdteam
  severity: critical
  description: |
    检测到 Odoo Unprotected 数据库。目标功能在未认证状态下可访问，可能暴露管理入口、业务数据、系统状态或可执行操作，需确认是否存在访问控制缺失。
  remediation: |
    - 为相关管理界面和 API 启用强认证、授权校验和最小权限控制。
    - 将后台端点限制在可信网络或 VPN 内，并记录访问审计日志。
  classification:
    cpe: cpe:2.3:a:odoo:odoo:*:*:*:*:*:*:*:*
  metadata:
    verified: true
    max-request: 1
    vendor: odoo
    product: odoo
    shodan-query: title:"Odoo"
  tags: odoo,database,unauth,misconfig,vuln

http:
  - method: GET
    path:
      - '{{BaseURL}}/web/database/manager'

    matchers-condition: and
    matchers:
      - type: word
        words:
          - "Warning, your Odoo database manager is not protected."

      - type: word
        words:
          - "The database manager has been disabled by the administrator"
        negative: true

      - type: status
        status:
          - 200
