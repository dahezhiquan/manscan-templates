id: aws-s3-explorer

info:
  name: Amazon Web Services S3 Explorer 检测
  author: DhiyaneshDk
  severity: medium
  description: |
    该模板用于核查 Amazon Web Services S3 Explorer相关配置。该类问题通常源于云对象存储桶或兼容对象存储服务开启了公开读取、公开列表或错误的访问策略。模板会向目标发送探测请求，并依据请求 `/index.html`、匹配 `<title>AWS S3 Explorer</title>`、`text/html`、状态码 200 等证据确认目标是否存在该配置问题。
  impact: |
    - 攻击者可枚举对象列表并下载公开文件，造成业务资料、备份、日志或静态资源泄露。
    - 若桶内资源被业务系统引用，攻击者还可能利用公开内容辅助供应链攻击或品牌仿冒。
  remediation: |
    - 关闭对象存储桶公共访问和列表权限，按业务需要配置最小化 Bucket Policy。
    - 启用云厂商的公共访问阻断、访问日志和异常访问告警。
    - 检查桶内历史文件，移除敏感对象并轮换已暴露的密钥、令牌或下载链接。
  reference:
    - https://www.exploit-db.com/ghdb/7967
  classification:
    cvss-metrics: CVSS:3.1/AV:N/AC:L/PR:N/UI:N/S:U/C:L/I:N/A:N
    cvss-score: 5.3
    cwe-id: CWE-200
    cpe: cpe:2.3:a:amazon:aws_javascript_s3_explorer:*:*:*:*:*:*:*:*
  metadata:
    verified: true
    max-request: 1
    google-query: inurl:s3.amazonaws.com intitle:"AWS S3 Explorer"
    product: aws_javascript_s3_explorer
    vendor: amazon
  tags: s3,edb,misconfig,aws,amazon,vuln

http:
  - method: GET
    path:
      - "{{BaseURL}}/index.html"

    matchers-condition: and
    matchers:
      - type: word
        words:
          - '<title>AWS S3 Explorer</title>'

      - type: word
        part: header
        words:
          - text/html

      - type: status
        status:
          - 200
