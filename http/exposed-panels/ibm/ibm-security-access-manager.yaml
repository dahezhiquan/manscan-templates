id: ibm-security-access-manager

info:
  name: IBM Security Access Manager 登录面板识别（指纹识别）
  author: geeknik,righettod
  severity: info
  description: |-
    检测到目标站点存在 IBM Security Access Manager 相关响应特征。IBM Security Access Manager 是监控、日志、分析或可观测性系统，用于展示运行指标、告警事件、日志数据和服务状态。模板请求 `/`，并通过页面标题或正文关键字、响应头关键字确认该系统指纹，用于资产识别、系统盘点和暴露面梳理。
  reference:
    - https://www.ibm.com/docs/en/sva/9.0.7?topic=overview-introduction-security-access-manager
  classification:
    cvss-metrics: CVSS:3.0/AV:N/AC:L/PR:N/UI:N/S:U/C:N/I:N/A:N
    cwe-id: CWE-200
    cpe: cpe:2.3:a:ibm:security_access_manager:*:*:*:*:*:*:*:*
  metadata:
    max-request: 1
    vendor: ibm
    shodan-query: http.title:"IBM Security Access Manager"
    product: security_access_manager
  tags: panel,ibm,login,detect,discovery
http:
  - method: GET
    path:
      - "{{BaseURL}}"

    matchers-condition: or
    matchers:
      - type: word
        words:
          - "<title>IBM Security Access Manager</title>"
          - "IBM Security <em>Access Manager</em>"
        part: body
        condition: or

      - type: word
        words:
          - "IBM Security Access Manager for Web"
        part: header

      - type: word
        words:
          - "/mga/sps/authsvc/policy/forgot_username"
          - "/mga/sps/authsvc/policy/forgot_password"
        part: body
        condition: and
