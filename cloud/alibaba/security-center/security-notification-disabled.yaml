id: security-notification-disabled

info:
  name: 阿里云安全中心风险通知未启用（云安全）
  author: DhiyaneshDK
  severity: medium
  description: 安全中心高风险项通知未启用时，漏洞、告警或配置风险可能无法及时送达责任人。模板调用 DescribeNoticeConfig，当通知项 Project 存在但 Route 为 0 时，提取对应项目并判定该安全通知未启用。
  impact: |
    - 高危漏洞、入侵告警或风险事件可能延迟处理，扩大攻击影响和修复窗口。
    - 安全运营依赖人工巡检控制台，容易遗漏重要风险项。
  remediation: |
    - 在安全中心通知设置中为高风险项目启用通知渠道，并配置有效联系人或通知组。
    - 定期测试通知送达情况，确保告警能够进入工单、IM 或应急响应流程。
  reference:
    - https://www.alibabacloud.com/help/en/security-center/user-guide/use-the-notification-feature
    - https://www.trendmicro.com/cloudoneconformity/knowledge-base/alibaba-cloud/AlibabaCloud-SecurityCenter/enable-high-risk-item-notifications.html
  metadata:
    max-request: 1
    verified: true
    vendor: alibaba
    product: security-center
  tags: cloud,devops,aliyun,alibaba,alibaba-cloud-config,security-center

variables:
  region: "cn-hangzhou"

self-contained: true

code:
  - engine:
      - sh
      - bash
    source: |
      aliyun sas DescribeNoticeConfig --region $region

    matchers:
      - type: word
        words:
          - '"Route": 0'
          - '"Project":'
        condition: and

    extractors:
      - type: json
        name: noticeconfiglist
        internal: true
        json:
          - '.NoticeConfigList | map(select(.Route == 0) | .Project)'

      - type: dsl
        dsl:
          - '"Project: " + noticeconfiglist + " Security Center Notifications are Disabled"'
