id: azure-functionapp-access-keys-missing
info:
  name: Azure Functions HTTP 触发器缺少函数访问密钥（云安全）
  author: princechaddha
  severity: high
  description: Azure Functions 的 HTTP 触发器可使用函数密钥或主机密钥限制调用方；未配置密钥时，依赖密钥认证的触发器将缺少一层访问控制。本模板列出函数应用的 functionKeys，并在返回空对象 {} 时报告。该检测应结合函数的 authLevel 和其他身份认证配置判断是否确需密钥保护。
  impact: |
    - 若 HTTP 触发器未配置其他认证且允许匿名或错误放宽访问级别，攻击者可能直接调用函数。
    - 未授权调用可能造成敏感数据读取、后端操作滥用、计算资源消耗或业务接口被刷写。
  remediation: |
    - 对需要密钥认证的 HTTP 触发器配置函数密钥或主机密钥，并将 authLevel 设置为 function 或 admin，而非 anonymous。
    - 优先结合 Microsoft Entra ID、访问限制或 API 网关实施身份认证；密钥应安全存储、定期轮换并避免写入代码或日志。
  reference:
    - https://docs.microsoft.com/en-us/azure/azure-functions/functions-bindings-http-webhook-trigger?tabs=csharp
  metadata:
    vendor: microsoft
    product: azure-functions
  tags: cloud,devops,azure,microsoft,functionapp,azure-cloud-config

flow: |
  code(1);
  for (let AppData of iterate(template.functionApps)) {
    AppData = JSON.parse(AppData);
    set("name", AppData.name);
    set("resourceGroup", AppData.resourceGroup);
    code(2);
  }

self-contained: true
code:
  - engine:
      - sh
      - bash
    source: |
      az functionapp list --query '[*].{name:name, resourceGroup:resourceGroup}' --output json

    extractors:
      - type: json
        name: functionApps
        internal: true
        json:
          - '.[]'

  - engine:
      - sh
      - bash
    source: |
      az functionapp keys list --name $name --resource-group $resourceGroup --query 'functionKeys' --output json

    matchers:
      - type: word
        words:
          - "{}"

    extractors:
      - type: dsl
        dsl:
          - 'name + " has no function keys configured for HTTP-triggered functions"'
