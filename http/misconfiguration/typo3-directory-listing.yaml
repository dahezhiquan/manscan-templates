id: typo3-directory-listing

info:
  name: Typo3 目录列出
  author: theamanrawat
  severity: low
  description: |
    检测到 Typo3 目录列出。Web 服务器或应用目录允许列出文件内容，可能泄露备份文件、配置文件、日志、源码或其他未公开资源。
  reference:
    - https://docs.typo3.org/m/typo3/reference-coreapi/main/en-us/ExtensionArchitecture/FileStructure/Index.html
  metadata:
    shodan-query: http.component:"typo3"
  tags: typo3,directory-listing,exposure

flow: http(1) && http(2)

http:
  - raw:
      - |
        GET / HTTP/1.1
        Host: {{Hostname}}

    matchers:
      - type: dsl
        dsl:
          - '!contains_all(body, "Index of /", "PARENTDIR")'
        internal: true

  - method: GET
    path:
      - "{{BaseURL}}/typo3temp/"

    matchers-condition: and
    matchers:
      - type: word
        words:
          - "Index of /typo3temp"
          - "Last modified"
          - "Parent Directory"
        condition: and

      - type: status
        status:
          - 200
