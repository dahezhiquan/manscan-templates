id: akhq-panel

info:
  name: AKHQ 面板识别（指纹识别）
  author: DhiyaneshDK
  severity: info
  description: |-
    检测到目标站点存在 AKHQ 相关响应特征。AKHQ 是 Apache Kafka 的 Web 管理界面，用于查看和管理 Topic、Consumer、Schema、连接器等 Kafka 资源。模板请求 `/ui/login`，并通过页面标题或正文关键字、状态码确认该系统指纹，用于资产识别、系统盘点和暴露面梳理。
  metadata:
    verified: true
    max-request: 1
    shodan-query: http.favicon.hash:855432563
    fofa-query: body="AKHQ_PREFIX_UI"
  tags: akhq,panel,login,detect,discovery
http:
  - method: GET
    path:
      - "{{BaseURL}}/ui/login"

    matchers-condition: and
    matchers:
      - type: word
        part: body
        words:
          - "<title>AKHQ</title>"
          - "AKHQ_PREFIX_UI"
        condition: or

      - type: status
        status:
          - 200
