id: salesforce-b2c-commerce-webdav

info:
  name: Salesforce B2C Commerce WebDAV 指纹识别（指纹识别）
  author: batutahibnu17
  severity: info
  description: >-
    Salesforce B2C Commerce WebDAV 是电商平台的文件访问接口，用于管理站点资源、模板和静态文件。该模板通过请求目标服务并检查预设路径或首页响应、页面正文关键字、状态码等指纹特征，判断目标是否使用或暴露了
    Salesforce B2C Commerce WebDAV 相关组件；命中结果仅表示指纹特征匹配，可用于资产盘点、技术栈识别和后续安全评估，不代表已确认存在可利用漏洞。
  reference:
  - https://help.salesforce.com/s/articleView?id=cc.b2c_import_export_transaction_handling_and_feed_size.htm&type=5
  metadata:
    verified: true
    max-request: 1
    shodan-query: html:"/waroot/style.css"
  tags: salesforce,tech,detect,discovery
http:
  - method: GET
    path:
      - "{{BaseURL}}"

    matchers-condition: and
    matchers:
      - type: word
        part: body
        words:
          - "/waroot/style.css"
          - "/waroot/system_arrow.gif"
        condition: and

      - type: status
        status:
          - 404
