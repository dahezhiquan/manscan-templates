id: insecure-sudo-timestamp

info:
  name: macOS sudo 时间戳超时过长（本地基线扫描）
  author: geeknik
  severity: medium
  description: |
    该模板检查 sudo timestamp_timeout 是否设置过长。超时时间过长会延长免密 sudo 窗口。
  impact: |
    不符合基线的配置会扩大本地攻击面，并削弱 macOS 主机的访问控制和审计能力。
  remediation: |
    收紧相关文件或目录权限，移除全局可写位，确保关键配置仅由 root 或授权管理员维护。
  tags: macos,audit,local,security,sudo

self-contained: true

code:
  - engine:
      - sh
      - bash
    source: |
      grep -E "^Defaults.*timestamp_timeout=" /etc/sudoers
    matchers:
      - type: regex
        regex:
          - "timestamp_timeout=([1-9][0-9]{2,})"
