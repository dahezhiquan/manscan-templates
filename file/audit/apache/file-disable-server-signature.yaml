id: file-disable-server-signature

info:
  name: Apache ServerSignature 未禁用（本地文件安全扫描）
  author: pussycat0x
  severity: medium
  description: |
    Apache `ServerSignature` 控制错误页和目录列表是否附带服务器签名。开启时可能暴露 Apache 版本、模块和主机信息，帮助攻击者进行组件指纹识别。本模板在配置中识别 Apache 段，并检查是否缺少 `ServerSignature Off`；静态命中仍需结合配置继承和实际错误页复核。
  impact: |
    - 详细服务器签名会帮助攻击者将目标版本与公开漏洞、模块缺陷和默认配置关联。
    - 错误页中的主机或路径信息可能暴露内部部署细节，辅助后续路径探测和定向攻击。
  remediation: |
    - 设置 `ServerSignature Off`，并确认虚拟主机、目录和错误文档配置未重新启用签名。
    - 配置统一的自定义错误页，避免输出版本、模块、主机名和内部路径。
    - 重载 Apache 后验证 4xx/5xx 页面和目录响应。
  reference:
    - https://httpd.apache.org/docs/2.4/mod/core.html#serversignature
  metadata:
    verified: true
  tags: audit,config,file,apache,hardening

file:
  - extensions:
      - conf

    matchers-condition: and
    matchers:
      - type: word
        words:
          - "<Directory"
          - "<FilesMatch"
        condition: and

      - type: word
        words:
          - "ServerSignature Off"
        negative: true
