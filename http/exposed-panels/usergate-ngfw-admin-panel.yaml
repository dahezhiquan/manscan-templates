id: usergate-ngfw-admin-panel

info:
  name: UserGate NGFW/UTM 面板识别（指纹识别）
  author: darses
  severity: info
  description: |-
    UserGate NGFW/UTM 是下一代防火墙和 UTM 管理平台，用于网络访问控制、VPN、威胁防护和安全策略管理。该模板请求首页、`/static/console-utm-webui/js/preinit.js`，并依据 DSL 条件识别目标是否部署了该系统或暴露了对应入口，适用于资产指纹确认；命中结果仅表示系统特征匹配，不代表已确认存在未授权访问或可利用漏洞。
  metadata:
    max-request: 2
    shodan-query: "Server: UserGate-UTM/42"
    fofa-query: icon_hash="-782553370"
  tags: detect,panel,usergate,ngfw,utm,discovery

http:
  - method: GET
    path:
      - "{{BaseURL}}"
      - "{{BaseURL}}/static/console-utm-webui/js/preinit.js"

    stop-at-first-match: true
    matchers:
      - type: dsl
        dsl:
          - status_code == 200
          - contains(body, "Entensys.console")
        condition: and
