id: ibm-decision-server-runtime

info:
  name: IBM Decision Server Runtime 指纹识别（指纹识别）
  author: DhiyaneshDK
  severity: info
  description: >-
    IBM Decision Server Runtime 是 IBM ODM 的规则执行运行时，用于对外提供决策服务调用能力。该模板通过请求目标服务并检查预设路径或首页响应、页面正文关键字、正则特征、状态码等指纹特征，判断目标是否使用或暴露了
    IBM Decision Server Runtime 相关组件；命中结果仅表示指纹特征匹配，可用于资产盘点、技术栈识别和后续安全评估，不代表已确认存在可利用漏洞。
  reference:
  - https://www.ibm.com/docs/en/odm/8.10?topic=services-hosted-transparent-decision
  metadata:
    verified: true
    max-request: 1
  tags: ibm,detect,tech,decision-server,discovery
http:
  - method: GET
    path:
      - "{{BaseURL}}/DecisionService/"

    matchers-condition: and
    matchers:
      - type: word
        part: body
        words:
          - "<title>Hosted Transparent Decision Service</title>"

      - type: status
        status:
          - 200

    extractors:
      - type: regex
        part: body
        group: 1
        regex:
          - 'Decision Server ([0-9.]+)'
