id: api-charity

info:
  name: Charity Search API Token 可用性校验（token喷洒）
  author: daffainfo
  severity: info
  description: 该模板通过调用 Charity Search API 的已知接口验证提供的 token 是否有效，命中后通常表示可访问相关 API 能力。
  reference:
    - http://charityapi.orghunter.com/
    - https://github.com/daffainfo/all-about-apikey/tree/main/charity-search
  metadata:
    max-request: 1
  tags: token-spray,charity,search

self-contained: true

http:
  - method: GET
    path:
      - "http://data.orghunter.com/v1/charitybasic?user_key={{token}}&ein=590774235"

    matchers-condition: and
    matchers:
      - type: status
        status:
          - 200

      - type: word
        part: body
        words:
          - '"ein":'
          - '"name":'
          - '"inCareOfName"'
        condition: and
