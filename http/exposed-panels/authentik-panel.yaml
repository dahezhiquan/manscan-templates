id: authentik-panel

info:
  name: Authentik 面板识别（暴露面识别）
  author: rxerium
  severity: info
  description: |
    该模板通过识别 Authentik 面板、控制台或管理界面的页面特征，判断目标是否暴露了对应服务入口。若命中，说明该后台或运维界面对外可访问，可用于资产识别与暴露面排查。
  reference:
    - https://github.com/goauthentik/authentik
  metadata:
    max-request: 1
    verified: true
    shodan-query: http.favicon.hash:-178113786
  tags: authentik,sso,mfa,panel,detect,discovery

http:
  - method: GET
    path:
      - "{{BaseURL}}"
      - "{{BaseURL}}/static/dist/assets/icons/icon.png"

    host-redirects: true
    max-redirects: 2
    stop-at-first-match: true

    matchers-condition: or
    matchers:
      - type: word
        part: body
        words:
          - "<title>authentik</title>"
          - "window.authentik"
          - "authentik.css"
        condition: or
        case-insensitive: true

      - type: dsl
        dsl:
          - "(\"-178113786\" == mmh3(base64_py(body)))"
