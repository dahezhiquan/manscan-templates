id: casdoor-users-password

info:
  name: Casdoor get 用户账户 密码 泄露
  author: DhiyaneshDk
  severity: high
  description: |
    该模板用于核查 Casdoor get 用户账户 密码泄露状态。该类问题通常源于配置文件、备份文件、管理页面、服务状态或敏感资源被错误暴露到 Web 访问路径。模板会向目标发送探测请求，并依据请求 `/api/get-users?p=123&pageSize=123`、匹配 `"name":`、`"password":`、状态码 200 等证据确认目标是否存在该配置问题。
  impact: |
    - 攻击者可获取版本、路径、账号、密钥、令牌、配置或业务数据等敏感信息。
    - 泄露的信息可能被用于凭据攻击、漏洞匹配、权限提升或横向移动。
  remediation: |
    - 移除 Web 根目录下不应公开的配置、备份、日志和临时文件。
    - 为敏感页面和资源增加访问控制，并按最小暴露原则收敛公开路径。
    - 轮换已暴露的密钥、令牌和凭据，并审计异常下载或枚举行为。
  reference:
    - https://github.com/Threekiii/Awesome-POC/blob/master/Web%E5%BA%94%E7%94%A8%E6%BC%8F%E6%B4%9E/Casbin%20get-users%20%E8%B4%A6%E5%8F%B7%E5%AF%86%E7%A0%81%E6%B3%84%E6%BC%8F%E6%BC%8F%E6%B4%9E.md?plain=1
    - https://github.com/qingchenhh/qc_poc/blob/main/Goby/Casbin_get_users.go
  classification:
    cpe: cpe:2.3:a:casbin:casdoor:*:*:*:*:*:*:*:*
  metadata:
    verified: true
    max-request: 1
    vendor: casbin
    product: casdoor
    fofa-query: title="Casdoor"
  tags: casdoor,exposure,misconfig,disclosure,vuln

http:
  - method: GET
    path:
      - "{{BaseURL}}/api/get-users?p=123&pageSize=123"

    matchers-condition: and
    matchers:
      - type: word
        part: body
        words:
          - '"name":'
          - '"password":'
        condition: and

      - type: word
        part: header
        words:
          - 'application/json'

      - type: status
        status:
          - 200
