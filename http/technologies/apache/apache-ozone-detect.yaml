id: apache-ozone-detect

info:
  name: Apache Ozone 指纹识别（指纹识别）
  author: icarot
  severity: info
  description: |-
    Apache Ozone 是 Hadoop 生态对象存储系统，用于大规模数据湖和分布式对象存储。该模板请求 `/static/`，并依据 HTTP 200 状态码、页面标题、正文关键字或品牌资源特征识别目标是否使用或暴露了 Apache Ozone 相关组件，适用于资产盘点、技术栈识别和后续安全评估；命中结果仅表示指纹特征匹配，不代表已确认存在可利用漏洞。
  classification:
    cpe: cpe:2.3:a:apache:ozone:-:*:*:*:*:*:*:*
  metadata:
    max-request: 1
    vendor: apache
    product: ozone
    shodan-query: title:"Apache Ozone"
  tags: tech,ozone,apache,detect,discovery

http:
  - method: GET
    path:
      - "{{BaseURL}}/static/"

    matchers-condition: and
    matchers:
      - type: word
        words:
          - 'Apache Ozone</title>'

      - type: status
        status:
          - 200
