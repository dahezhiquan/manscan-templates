id: phpbb-installer

info:
  name: phpBB 安装 文件 暴露
  author: DhiyaneshDk
  severity: high
  description: |
    检测到 phpBB 安装 文件 暴露。该页面属于安装、初始化或配置向导流程，若对外暴露，攻击者可能完成初始化、创建管理员账户或重新配置目标系统。
  classification:
    cpe: cpe:2.3:a:phpbb:phpbb:*:*:*:*:*:*:*:*
  metadata:
    verified: true
    max-request: 1
    vendor: phpbb
    product: phpbb
    shodan-query: html:"Installation Panel"
  tags: misconfig,phpbb,install,exposure,vuln

http:
  - method: GET
    path:
      - "{{BaseURL}}/install/app.php"

    matchers-condition: and
    matchers:
      - type: word
        part: body
        words:
          - "Installation Panel"
          - "Introduction"
        condition: and

      - type: word
        part: header
        words:
          - "text/html"

      - type: status
        status:
          - 200
