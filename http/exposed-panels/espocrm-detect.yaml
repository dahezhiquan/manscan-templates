id: espocrm-detect

info:
  name: EspoCRM 识别（指纹识别）
  author: theamanrawat
  severity: info
  description: |-
    检测到目标站点存在 EspoCRM 相关响应特征。EspoCRM 是一套通过 Web 提供访问的管理面板或业务系统，通常用于配置服务、查看状态、管理数据或执行日常运维操作。模板请求 `/`，并通过页面标题或正文关键字、状态码确认该系统指纹，用于资产识别、系统盘点和暴露面梳理。
  classification:
    cvss-metrics: CVSS:3.0/AV:N/AC:L/PR:N/UI:N/S:U/C:N/I:N/A:N
    cwe-id: CWE-200
  metadata:
    verified: true
    max-request: 1
    vendor: espocrm
    product: espocrm
    shodan-query: html:"Powered by EspoCRM"
    fofa-query: body="Powered by EspoCRM"
  tags: panel,espocrm,detect,discovery
http:
  - method: GET
    path:
      - "{{BaseURL}}"

    host-redirects: true
    max-redirects: 2

    matchers-condition: and
    matchers:
      - type: word
        part: body
        words:
          - 'title="Powered by EspoCRM"'

      - type: status
        status:
          - 200
