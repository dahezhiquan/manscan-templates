id: azure-nic-ip-forwarding-check
info:
  name: Azure 网络接口启用 IP 转发（云安全）
  author: princechaddha
  severity: medium
  description: Azure 网络接口启用 IP 转发后，可接收发往其他地址的流量并将其转发，适用于防火墙、路由器等网络虚拟设备；普通工作负载通常不需要该能力。本模板遍历网络接口并查询 enableIpForwarding，在返回 true 时报告该配置。
  impact: |
    - 非网络设备启用转发后，可能成为绕过预期网络边界、转发异常流量或进行横向探测的节点。
    - 若接口所属虚拟机被入侵，攻击者可能利用其转发能力扩大可达网络范围，增加内部资源暴露风险。
  remediation: |
    - 对普通计算工作负载关闭 enableIpForwarding，仅对明确承担路由或安全设备职责的接口保留。
    - 对必要例外限制 NSG、路由表和管理权限，并定期核对接口用途及其可达网段。
  reference:
    - https://docs.microsoft.com/en-us/azure/virtual-network/ip-forwarding
  metadata:
    vendor: microsoft
    product: azure-network-interface
  tags: cloud,devops,azure,microsoft,nic,azure-cloud-config

flow: |
  code(1);
  for (let NicData of iterate(template.nicdata)) {
    NicData = JSON.parse(NicData)
    set("name", NicData.name)
    set("resourcegroup", NicData.resourceGroup)
    code(2)
  }

self-contained: true
code:
  - engine:
      - sh
      - bash
    source: |
      az network nic list --output json --query '[*].{name:name, resourceGroup:resourceGroup}'

    extractors:
      - type: json
        name: nicdata
        internal: true
        json:
          - '.[]'

  - engine:
      - sh
      - bash
    source: |
      az network nic show --name $name --resource-group $resourcegroup --query 'enableIpForwarding'

    matchers:
      - type: word
        words:
          - "true"

    extractors:
      - type: dsl
        dsl:
          - 'nsg + " has IP forwarding enabled"'
