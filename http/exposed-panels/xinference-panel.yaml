id: xinference-panel

info:
  name: Xinference 面板识别（指纹识别）
  author: rxerium
  severity: info
  description: |-
    Xinference 是大模型推理服务平台，用于部署、管理和调用 LLM、embedding 与多模态模型。该模板请求首页，并依据 HTTP 200 状态码、页面标题、正文关键字或品牌资源特征识别目标是否部署了该系统或暴露了对应入口，适用于资产指纹确认；命中结果仅表示系统特征匹配，不代表已确认存在未授权访问或可利用漏洞。
  reference:
  - https://github.com/xorbitsai/inference
  - https://inference.readthedocs.io
  metadata:
    verified: true
    max-request: 1
    vendor: xorbitsai
    product: xinference
    shodan-query: 'http.title:"Xinference"'
  tags: panel,xinference,llm,ai,inference,detect,discovery

http:
  - method: GET
    path:
      - "{{BaseURL}}"

    host-redirects: true
    max-redirects: 2

    matchers-condition: and
    matchers:
      - type: word
        part: body
        words:
          - "Xinference"

      - type: status
        status:
          - 200
