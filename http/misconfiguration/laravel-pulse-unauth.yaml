id: laravel-pulse-unauth

info:
  name: Laravel Pulse 仪表盘未授权访问
  author: moamenbasel
  severity: medium
  description: |
    该模板用于核查 Laravel Pulse 仪表盘未授权访问。该类问题通常源于管理端、API、控制台或服务接口缺少认证授权，导致未登录用户可直接访问敏感功能。模板会向目标发送探测请求，并依据请求 `/pulse`、匹配 `Laravel Pulse`、匹配 `livewire`、状态码 200 等证据确认目标是否存在该配置问题。
  impact: |
    - 攻击者可在未授权状态下查看系统状态、业务数据、任务信息或管理接口。
    - 若接口支持写操作，可能进一步导致配置篡改、服务接管、数据删除或横向移动。
  remediation: |
    - 为相关管理端和 API 启用认证授权，并按最小权限限制可访问功能。
    - 将管理接口限制在内网、VPN 或可信来源范围内，并开启访问审计。
    - 检查历史访问日志，确认是否存在未授权访问、批量枚举或异常操作。
  reference:
    - https://laravel.com/docs/11.x/pulse#dashboard-authorization
    - https://owasp.org/Top10/A01_2021-Broken_Access_Control/
  classification:
    cvss-metrics: CVSS:3.1/AV:N/AC:L/PR:N/UI:N/S:U/C:L/I:N/A:N
    cvss-score: 5.3
    cwe-id: CWE-306
  metadata:
    verified: true
    max-request: 1
    shodan-query: html:"Laravel Pulse"
  tags: laravel,pulse,monitoring,misconfig,unauth

http:
  - method: GET
    path:
      - "{{BaseURL}}/pulse"

    host-redirects: true
    max-redirects: 2

    matchers-condition: and
    matchers:
      - type: word
        part: body
        words:
          - "Laravel Pulse"
          - "livewire"
        condition: and

      - type: status
        status:
          - 200
