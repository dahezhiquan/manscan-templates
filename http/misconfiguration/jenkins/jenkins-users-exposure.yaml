id: jenkins-users-exposure

info:
  name: Jenkins 用户暴露
  author: theamanrawat
  severity: medium
  description: |
    该模板用于核查 Jenkins 用户暴露。该类问题通常源于容器、Kubernetes、CI/CD、注册表、服务发现或运维 API 暴露在公网且缺少访问控制。模板会向目标发送探测请求，并依据请求 `/asynchPeople/api/json`、匹配 `status_code == 200`、匹配 `contains(content_type, "application/json")`、匹配 `contains_all(body, "users", "fullName", "absoluteUrl")`等证据确认目标是否存在该配置问题。
  impact: |
    - 攻击者可查看集群对象、容器、任务、节点、配置、构建流水线或运行状态。
    - 若接口允许操作，可能导致容器创建、任务执行、配置泄露、集群接管或远程代码执行。
  remediation: |
    - 禁止将 Kubernetes、容器运行时、CI/CD 和运维 API 直接暴露到公网。
    - 启用 TLS、认证授权、RBAC、来源限制和最小权限访问策略。
    - 审计集群对象、任务、容器和访问日志，清理未知资源并轮换相关令牌。
  classification:
    cpe: cpe:2.3:a:jenkins:jenkins:*:*:*:*:*:*:*:*
  reference:
    - https://issues.jenkins.io/browse/JENKINS-18884
  metadata:
    max-request: 1
    vendor: jenkins
    product: jenkins
    shodan-query:
      - http.favicon.hash:81586312
      - cpe:"cpe:2.3:a:jenkins:jenkins"
      - product:"jenkins"
    fofa-query: icon_hash=81586312
  tags: exposure,jenkins,vuln,discovery

http:
  - method: GET
    path:
      - "{{BaseURL}}/asynchPeople/api/json"

    matchers:
      - type: dsl
        dsl:
          - 'status_code == 200'
          - 'contains(content_type, "application/json")'
          - 'contains_all(body, "users", "fullName", "absoluteUrl")'
        condition: and
