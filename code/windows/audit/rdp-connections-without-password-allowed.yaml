id: rdp-connections-without-password-allowed

info:
  name: 允许无密码 RDP 连接（本地基线扫描）
  author: princechaddha
  severity: high
  description: |
    该配置会绕过基本认证保护。对应基线项为“远程桌面是否允许无密码账户连接”；模板读取注册表 `HKLM:\SYSTEM\CurrentControlSet\Control\Terminal Server` 的 `fPromptForPassword` 值，结合命中值判断策略是否不符合基线。
  impact: |
    - 攻击者可利用空密码账户远程登录系统。
    - 凭据保护不足会增加横向移动、远程登录和离线破解风险。
  remediation: |
    - 禁止无密码账户通过 RDP 登录，并为所有可登录账户设置强口令。
    - 变更策略后清理历史凭据，并轮换可能受影响的账户密码。
  tags: windows,rdp,code,windows-audit

self-contained: true

code:
  - pre-condition: |
      IsWindows();
    engine:
      - powershell
      - powershell.exe
    args:
      - -ExecutionPolicy
      - Bypass
    pattern: "*.ps1"
    source: |
      if ((Get-ItemProperty -Path 'HKLM:\SYSTEM\CurrentControlSet\Control\Terminal Server' -Name 'fPromptForPassword' -ErrorAction SilentlyContinue).fPromptForPassword -eq 0) { "RDP connections allowed without password." }

    matchers:
      - type: word
        words:
          - "RDP connections allowed without password."
