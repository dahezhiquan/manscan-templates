id: clickup-phish

info:
  name: ClickUp 仿冒钓鱼网站（钓鱼网站识别）
  author: rxerium
  severity: info
  description: |
    检测到疑似仿冒 ClickUp 的钓鱼网站。模板在目标页面返回 200、页面内容命中 ClickUp 的品牌页面特征，且当前主机不属于 clickup.com 官方域名时触发，用于识别借用 ClickUp 品牌页面诱导用户信任的仿冒站点。
  reference:
    - https://clickup.com
  metadata:
    max-request: 1
  tags: phishing,clickup,productivity,osint,discovery
http:
  - method: GET
    path:
      - "{{BaseURL}}"

    host-redirects: true
    max-redirects: 2

    matchers-condition: and
    matchers:
      - type: word
        words:
          - 'ClickUp™ | Maximize productivity • Software, AI, and humans converge'

      - type: status
        status:
          - 200

      - type: dsl
        dsl:
          - '!contains(host,"clickup.com")'
