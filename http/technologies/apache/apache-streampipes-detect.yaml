id: apache-streampipes-detect

info:
  name: Apache StreamPipes 指纹识别（指纹识别）
  author: Alessandro Albani - DEVisions
  severity: info
  description: |-
    Apache StreamPipes 是工业物联网流数据分析平台，用于数据接入、管道编排和实时分析。该模板请求 `/streampipes-backend/api/openapi.json`、`/assets/img/favicon/favicon.ico`、首页，并依据 favicon 哈希、DSL 条件识别目标是否使用或暴露了 Apache StreamPipes 相关组件，适用于资产盘点、技术栈识别和后续安全评估；命中结果仅表示指纹特征匹配，不代表已确认存在可利用漏洞。
  classification:
    cpe: cpe:2.3:a:apache:streampipes:*:*:*:*:*:*:*:*
  metadata:
    verified: true
    max-request: 3
    vendor: apache
    product: streampipes
    shodan-query: title:"apache streampipes"
    fofa-query: title="apache streampipes"
  tags: tech,apache,streampipes,detect,discovery

http:
  - method: GET
    path:
      - '{{BaseURL}}/streampipes-backend/api/openapi.json'
      - '{{BaseURL}}/assets/img/favicon/favicon.ico'
      - '{{BaseURL}}'

    host-redirects: true
    max-redirects: 2
    stop-at-first-match: true
    matchers:
      - type: dsl
        dsl:
          - contains_any(to_lower(body), "<title>apache streampipes", "apache streampipes api")
          - status_code==200 && ("1937041138" == mmh3(base64_py(body)) || "480680877" == mmh3(base64_py(body)))
        condition: or

    extractors:
      - type: json
        part: body
        group: 1
        json:
          - '.info.version'
