id: fortinet-fortios-management-panel

info:
  name: Fortinet FortiOS Management Interface 面板识别（暴露面识别）
  author: mbmy
  severity: medium
  description: |-
    检测到目标站点暴露 Fortinet FortiOS Management Interface 相关面板或登录入口。Fortinet FortiGate 是防火墙和安全网关，管理或 SSL VPN 面板用于维护访问控制、VPN、威胁防护和设备配置。模板请求 `/login?redir=/ng`，并通过页面标题或正文关键字、响应头关键字、状态码确认入口可访问；此类面板若直接暴露在公网，会增加账号枚举、口令攻击、漏洞匹配和未授权访问尝试的机会。
  impact: |-
    - 攻击者可确认目标部署了 Fortinet FortiOS Management Interface 或相关组件，并据此开展账号枚举、口令喷洒、默认凭据尝试或针对性漏洞匹配。
    - 若面板存在弱口令、默认配置、访问控制缺陷或未修复漏洞，可能导致后台权限被获取、配置被篡改、敏感数据泄露或业务系统被接管。
    - 管理入口长期暴露在公网会扩大攻击面，增加自动化扫描、撞库、社会工程和后续横向移动的风险。
  remediation: |-
    - 将 Fortinet FortiOS Management Interface 面板限制在内网、VPN、堡垒机或可信源 IP 访问范围内，避免管理入口直接暴露在公网。
    - 启用强密码、多因素认证、登录失败限制和默认账户清理，定期审计登录日志与管理员账号权限。
    - 保持系统和相关组件更新到受支持版本，关闭不必要的管理路径，并在必须公网访问时增加反向代理访问控制、WAF 或零信任访问策略。
  classification:
    cvss-metrics: CVSS:3.0/AV:N/AC:L/PR:N/UI:N/S:U/C:N/I:N/A:N
    cwe-id: CWE-200
    cpe: cpe:2.3:o:fortinet:fortios:*:*:*:*:*:*:*:*
  metadata:
    verified: true
    max-request: 1
    vendor: fortinet
    product: fortios
    shodan-query:
      - http.favicon.hash:945408572
      - cpe:"cpe:2.3:o:fortinet:fortios"
      - port:10443 http.favicon.hash:945408572
      - http.html:"/remote/login" "xxxxxxxx"
    fofa-query:
      - body="/remote/login" "xxxxxxxx"
      - icon_hash=945408572
  tags: panel,fortinet,fortios,fortigate,fortiproxy,fortiap,discovery
http:
  - method: GET
    path:
      - "{{BaseURL}}/login?redir=/ng"

    host-redirects: true
    max-redirects: 2

    matchers-condition: and
    matchers:
      - type: word
        words:
          - '<html class="main-app">'
          - '<f-icon class="fa-warning'
          - "</f-icon>"
        condition: and

      - type: word
        part: header
        words:
          - "APSCOOKIE_"

      - type: status
        status:
          - 200
