id: backblaze-phish

info:
  name: Backblaze 仿冒钓鱼网站（钓鱼网站识别）
  author: rxerium
  severity: info
  description: |
    检测到疑似仿冒 Backblaze 的钓鱼网站。模板在目标页面返回 200、页面内容命中 Backblaze 的官方服务页面特征，且当前主机不属于 backblaze.com 官方域名时触发，用于识别借用 Backblaze 品牌页面诱导用户信任的仿冒站点。
  reference:
    - https://backblaze.com
  metadata:
    max-request: 1
  tags: phishing,backblaze,backup,osint,discovery
http:
  - method: GET
    path:
      - "{{BaseURL}}"

    host-redirects: true
    max-redirects: 2

    matchers-condition: and
    matchers:
      - type: word
        words:
          - '<title>The Leading Open Cloud Storage Platform - Backblaze'

      - type: status
        status:
          - 200

      - type: dsl
        dsl:
          - '!contains(host,"backblaze.com")'
