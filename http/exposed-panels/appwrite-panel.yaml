id: appwrite-panel

info:
  name: Appwrite 登录面板识别（指纹识别）
  author: ritikchaddha
  severity: info
  description: |-
    检测到目标站点存在 Appwrite 相关响应特征。Appwrite 是一套通过 Web 提供访问的管理面板或业务系统，通常用于配置服务、查看状态、管理数据或执行日常运维操作。模板请求 `/images/favicon.png`、`/favicon.png` 路径，并通过状态码、favicon 哈希、DSL 条件确认该系统指纹，用于资产识别、系统盘点和暴露面梳理。
  classification:
    cvss-metrics: CVSS:3.1/AV:N/AC:L/PR:N/UI:N/S:U/C:N/I:N/A:N
    cwe-id: CWE-200
    cpe: cpe:2.3:a:appwrite:appwrite:*:*:*:*:*:*:*:*
  metadata:
    verified: true
    max-request: 2
    vendor: appwrite
    product: appwrite
    shodan-query:
      - http.favicon.hash:-633108100
      - http.title:"sign in - appwrite"
    fofa-query:
      - icon_hash=-633108100
      - title="sign in - appwrite"
    google-query: intitle:"sign in - appwrite"
  tags: panel,appwrite,detect,discovery
http:
  - method: GET
    path:
      - '{{BaseURL}}/images/favicon.png'
      - '{{BaseURL}}/favicon.png'

    stop-at-first-match: true
    matchers:
      - type: dsl
        dsl:
          - "status_code==200 && (\"-633108100\" == mmh3(base64_py(body)))"
