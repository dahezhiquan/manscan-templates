id: nexus-detect

info:
  name: Nexus Repository Manager (NRM) 实例指纹识别（指纹识别）
  author: righettod
  severity: info
  description: 用于识别目标是否部署 Nexus Repository Manager (NRM) 实例，模板会结合页面正文、状态码和特定路径进行指纹匹配。
  classification:
    cpe: cpe:2.3:a:sonatype:nexus_repository_manager:*:*:*:*:*:*:*:*
  metadata:
    verified: true
    max-request: 1
    vendor: sonatype
    product: nexus_repository_manager
    shodan-query: http.html:"Nexus Repository Manager"
  tags: tech,nexus,discovery

http:
  - method: GET
    path:
      - "{{BaseURL}}/service/rest/swagger.json"

    matchers-condition: and
    matchers:
      - type: word
        words:
          - "Nexus Repository Manager"

      - type: status
        status:
          - 200
