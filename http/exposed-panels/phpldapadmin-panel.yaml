id: phpldapadmin-panel

info:
  name: PHP LDAP Admin 面板识别（指纹识别）
  author: ritikchaddha,DhiyaneshDk
  severity: info
  description: PHP LDAP Admin 是 LDAP 目录服务的 Web 管理工具，用于浏览、编辑和维护 LDAP 条目。该模板请求首页、`/phpldapadmin`、`/htdocs/index.php` 路径，并依据页面标题、正文关键字或品牌资源特征识别目标是否部署了该系统或暴露了对应入口，适用于资产指纹确认；命中结果仅表示系统特征匹配，不代表已确认存在未授权访问或可利用漏洞。
  classification:
    cpe: cpe:2.3:a:phpldapadmin_project:phpldapadmin:*:*:*:*:*:*:*:*
  metadata:
    verified: true
    max-request: 3
    vendor: phpldapadmin_project
    product: phpldapadmin
    shodan-query: title:"phpLDAPadmin"
  tags: php,phpldapadmin,panel,detect,discovery

http:
  - method: GET
    path:
      - '{{BaseURL}}'
      - '{{BaseURL}}/phpldapadmin'
      - '{{BaseURL}}/htdocs/index.php'

    stop-at-first-match: true
    host-redirects: true
    max-redirects: 2

    matchers-condition: and
    matchers:
      - type: word
        part: body
        words:
          - "phpLDAPadmin ("
          - "/projects/phpldapadmin"
          - "alt=\"phpLDAPadmin logo"
        condition: or

    extractors:
      - type: regex
        part: body
        group: 1
        regex:
          - '<div id="ajFOOT">([0-9.]+)<\/div>'
