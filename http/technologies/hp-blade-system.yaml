id: hp-blade-system

info:
  name: HP BladeSystem Onboard Administrator 面板指纹识别（指纹识别）
  author: pussycat0x
  severity: info
  description: 用于识别目标暴露的 HP BladeSystem Onboard Administrator 面板，模板会结合页面标题、状态码和特定路径或已知端点判断是否存在对应技术或默认页面特征。
  classification:
    cvss-metrics: CVSS:3.0/AV:N/AC:L/PR:N/UI:N/S:U/C:N/I:N/A:N
    cvss-score: 0
    cwe-id: CWE-200
  metadata:
    max-request: 1
    shodan-query: http.title:"HP BladeSystem"
  tags: panel,hp,tech,discovery

http:
  - method: GET
    path:
      - "{{BaseURL}}"

    matchers-condition: and
    matchers:
      - type: word
        words:
          - "<title>HP BladeSystem Onboard Administrator</title>"

      - type: status
        status:
          - 200
