id: redis-honeypot-detect

info:
  name: Redis 蜜罐识别（蜜罐识别）
  author: UnaPibaGeek
  severity: info
  description: |
    Redis 蜜罐用于模拟开放 Redis 服务，捕获未授权访问、恶意写入和持久化利用尝试。该模板发送 Redis 探测命令，并通过蜜罐特有的响应模式识别伪装的 Redis 服务。
  classification:
    cpe: cpe:2.3:a:redis:redis:*:*:*:*:*:*:*:*
  metadata:
    max-request: 1
    vendor: redis
    product: redis
    shodan-query:
      - redis
      - redis_version
  tags: redis,honeypot,ir,cti,network,tcp,discovery
tcp:
  - inputs:
      - data: "QUIT"

    host:
      - "{{Hostname}}"
    port: 6379
    read-size: 1024

    matchers:
      - type: word
        words:
          - "-ERR unknown command `QUIT`, with args beginning with:"
