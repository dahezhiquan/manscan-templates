id: tugboat-config-exposure

info:
  name: Tugboat 配置文件暴露（暴露面识别）
  author: geeknik
  severity: critical
  description: 检测到页面中疑似暴露了 Tugboat 配置文件。如果相关密钥、令牌或凭据仍然有效，攻击者可能借此访问关联服务、调用接口、读取数据，或进一步对目标环境发起横向利用。
  reference:
    - https://github.com/petems/tugboat
    - https://www.digitalocean.com/community/tools/tugboat
  metadata:
    max-request: 1
  tags: tugboat,config,exposure,vuln

http:
  - method: GET
    path:
      - "{{BaseURL}}/.tugboat"

    matchers-condition: and
    matchers:
      - type: status
        status:
          - 200

      - type: word
        words:
          - "authentication"
          - "access_token"
          - "ssh_user"
        condition: and

    extractors:
      - type: regex
        part: body
        regex:
          - 'access_token: .*'
