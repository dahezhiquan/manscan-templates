id: twonky-server-exposure

info:
  name: Twonky 服务器 暴露
  author: DhiyaneshDk
  severity: high
  description: |
    检测到 Twonky 服务器 暴露。目标功能在未认证状态下可访问，可能暴露管理入口、业务数据、系统状态或可执行操作，需确认是否存在访问控制缺失。
  reference:
    - https://lynxtechnology.com/twonky-server.html
    - https://download.twonky.com/
  metadata:
    verified: true
    max-request: 1
    shodan-query: http.favicon.hash:-915768386
  tags: twonky,exposure,misconfig,vuln

http:
  - method: GET
    path:
      - "{{BaseURL}}"

    matchers:
      - type: dsl
        dsl:
          - "contains_all(body, '<title>TwonkyMedia</title>','Settings')"
          - "status_code == 200"
        condition: and
