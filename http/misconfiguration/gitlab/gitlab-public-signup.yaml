id: gitlab-public-signup

info:
  name: GitLab 公开注册
  author: pdteam,axrk
  severity: low
  description: |
    该模板用于核查 GitLab 公开注册。该类问题通常源于公开注册、自助开户或默认初始化策略未按业务预期关闭。模板会向目标发送探测请求，并依据请求 `/users/sign_in`、`/users/sign_up`、匹配 `<a data-qa-selector="register_link" href="/users/sign_up">Register now</a>`、匹配 `data-qa-selector="new_user_register_button"`、匹配 `https://about.gitlab.com`等证据确认目标是否存在该配置问题。
  impact: |
    - 攻击者可自行创建账号进入系统，枚举内部功能、数据或协作空间。
    - 若新账号默认权限过高，可能进一步导致数据泄露、配置变更或平台滥用。
  remediation: |
    - 关闭不需要的公开注册和自助开户入口。
    - 对必须开放的注册流程增加审批、邮箱域限制、验证码和速率限制。
    - 审计近期新建账号、权限分配和异常登录行为。
  classification:
    cpe: cpe:2.3:a:gitlab:gitlab:*:*:*:*:*:*:*:*
  metadata:
    max-request: 2
    vendor: gitlab
    product: gitlab
    shodan-query: http.title:"GitLab"
  tags: gitlab,misconfig,vuln

http:
  - method: GET
    path:
      - "{{BaseURL}}/users/sign_in"
      - "{{BaseURL}}/users/sign_up"

    stop-at-first-match: true

    matchers-condition: and
    matchers:
      - type: word
        words:
          - '<a data-qa-selector="register_link" href="/users/sign_up">Register now</a>'
          - 'data-qa-selector="new_user_register_button"'

      - type: word
        words:
          - 'https://about.gitlab.com'

      - type: status
        status:
          - 200

      - type: word
        negative: true
        words:
          - '<meta content="GitLab.com" property="og:description">'
