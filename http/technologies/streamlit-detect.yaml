id: streamlit-detect

info:
  name: Streamlit 指纹识别（指纹识别）
  author: s4e-io
  severity: info
  description: |
    用于识别目标是否使用 Streamlit，模板会结合 favicon 哈希、页面标题和特定路径或已知端点进行技术指纹匹配。
  reference:
    - https://streamlit.io/
  metadata:
    verified: true
    max-request: 1
    fofa-query: icon_hash="1080665471"
  tags: tech,streamlit,detect,discovery

http:
  - method: GET
    path:
      - "{{BaseURL}}"

    host-redirects: true
    max-redirects: 2

    matchers:
      - type: dsl
        dsl:
          - 'contains(body, "<title>Streamlit")'
          - 'status_code == 200'
        condition: and
