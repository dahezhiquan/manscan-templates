id: password-policy-lowercase-unconfigured

info:
  name: 阿里云 RAM 密码未要求包含小写字母（云安全）
  author: DhiyaneshDK
  severity: medium
  description: RAM 密码策略未要求小写字母会降低密码复杂度，使用户更容易设置可预测密码。模板调用 GetPasswordPolicy，当 RequireLowercaseCharacters 为 false 时判定密码策略未要求包含小写字母。
  impact: |
    - 密码组合空间变小，暴力破解和撞库攻击成功概率上升。
    - 不完整的复杂度要求会削弱 RAM 控制台登录安全基线。
  remediation: |
    - 在 RAM 密码策略中启用 RequireLowercaseCharacters。
    - 结合最小长度、大小写、数字、符号和复用限制形成完整密码复杂度策略。
  reference:
    - https://www.alibabacloud.com/help/en/ram/user-guide/configure-a-password-policy-for-ram-users
    - https://www.trendmicro.com/cloudoneconformity/knowledge-base/alibaba-cloud/AlibabaCloud-RAM/lowercase-letter-password-policy.html
  metadata:
    max-request: 1
    verified: true
    vendor: alibaba
    product: ram
  tags: cloud,devops,aliyun,alibaba,alibaba-cloud-config,alibaba-ram

variables:
  region: "cn-hangzhou"

self-contained: true

code:
  - engine:
      - sh
      - bash
    source: |
      aliyun ram GetPasswordPolicy --region $region

    matchers:
      - type: word
        name: policy
        words:
          - '"RequireLowercaseCharacters": false'

    extractors:
      - type: dsl
        dsl:
          - '"RAM Password Policy Does not contain One Lowercase "'
