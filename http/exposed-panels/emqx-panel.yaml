id: emqx-panel

info:
  name: EMQX 登录面板识别（指纹识别）
  author: righettod
  severity: info
  description: |-
    检测到目标站点存在 EMQX 相关响应特征。EMQX 是 MQTT 消息服务器和物联网连接平台，Dashboard 用于管理客户端、主题、规则、认证和集群状态。模板请求 `/`，并通过页面标题或正文关键字、状态码、DSL 条件确认该系统指纹，用于资产识别、系统盘点和暴露面梳理。
  reference:
    - https://www.emqx.io/
  classification:
    cpe: cpe:2.3:a:emqx:emqx:*:*:*:*:*:*:*:*
  metadata:
    verified: true
    max-request: 1
    vendor: emqx
    product: emqx
    shodan-query: http.title:"EMQX Dashboard"
  tags: panel,emqx,login,detect,discovery
http:
  - method: GET
    path:
      - "{{BaseURL}}"

    matchers:
      - type: dsl
        dsl:
          - 'status_code == 200'
          - 'contains_any(to_lower(body), "<title>emqx dashboard", "emqx-dashboard")'
        condition: and

    extractors:
      - type: regex
        part: body
        group: 1
        regex:
          - 'but\s+(emqx\-dashboard[0-9a-z\-]+)'
