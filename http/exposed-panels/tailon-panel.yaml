id: tailon-panel

info:
  name: Tailon 面板识别（指纹识别）
  author: ritikchaddha
  severity: info
  description: Tailon 是 Web 日志查看工具，用于通过浏览器实时查看和搜索服务器日志文件。该模板请求首页，并依据 HTTP 200 状态码、页面标题、正文关键字或品牌资源特征识别目标是否部署了该系统或暴露了对应入口，适用于资产指纹确认；命中结果仅表示系统特征匹配，不代表已确认存在未授权访问或可利用漏洞。
  reference:
  - https://github.com/gvalkov/tailon
  metadata:
    verified: true
    max-request: 1
    shodan-query: title:"tailon"
  tags: panel,tailon,detect,discovery

http:
  - method: GET
    path:
      - "{{BaseURL}}"

    matchers-condition: and
    matchers:
      - type: word
        part: body
        words:
          - '<title>Tailon'
          - 'class="tailon-dark'
        condition: or

      - type: status
        status:
          - 200
