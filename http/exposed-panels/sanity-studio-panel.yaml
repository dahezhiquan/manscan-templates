id: sanity-studio-panel

info:
  name: Sanity Studio 面板识别（暴露面识别）
  author: Shivam Kamboj
  severity: info
  description: |
    该模板通过识别 Sanity Studio 面板、控制台或管理界面的页面特征，判断目标是否暴露了对应服务入口。若命中，说明该后台或运维界面对外可访问，可用于资产识别与暴露面排查。
  reference:
    - https://www.sanity.io/
  metadata:
    verified: true
    max-request: 1
    shodan-query: http.title:"Sanity Studio"
    fofa-query: title="Sanity Studio"
  tags: panel,sanity,tech,discovery,detect

http:
  - method: GET
    path:
      - "{{BaseURL}}"

    redirects: true
    matchers:
      - type: dsl
        dsl:
          - 'contains_any(body, "<title>Sanity Studio", "window.__sanityErrorChannel", "__sanityError")'
          - 'status_code == 200 || status_code == 302'
        condition: and
