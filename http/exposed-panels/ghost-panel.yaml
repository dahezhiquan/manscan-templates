id: ghost-panel

info:
  name: Ghost 面板识别（暴露面识别）
  author: userdehghani
  severity: info
  description: |
    该模板通过识别 Ghost 面板、控制台或管理界面的页面特征，判断目标是否暴露了对应服务入口。若命中，说明该后台或运维界面对外可访问，可用于资产识别与暴露面排查。
  reference:
    - https://ghost.org/
  classification:
    cpe: cpe:2.3:a:ghost:ghost:*:*:*:*:*:*:*:*
  metadata:
    verified: true
    max-request: 1
    vendor: ghost
    product: ghost
    fofa-query: app="Ghost"
  tags: panel,ghost,login,detect,discovery

http:
  - method: GET
    path:
      - "{{BaseURL}}/ghost/#/signin"

    matchers-condition: or
    matchers:
      - type: word
        part: body
        words:
          - '<title>Ghost Admin'
          - 'content="Ghost"'
        condition: or
        case-insensitive: true
