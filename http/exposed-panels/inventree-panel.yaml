id: inventree-panel

info:
  name: InvenTree 面板 - 检测（指纹识别）
  author: ChrisJr404
  severity: info
  description: |-
    检测到目标站点存在 InvenTree 相关响应特征。InvenTree 是监控、日志、分析或可观测性系统，用于展示运行指标、告警事件、日志数据和服务状态。模板请求 `/api/`，并通过页面标题或正文关键字、状态码、DSL 条件确认该系统指纹，用于资产识别、系统盘点和暴露面梳理。
  reference:
    - https://github.com/inventree/InvenTree
    - https://inventree.org/
  metadata:
    verified: true
    max-request: 1
    vendor: inventree
    product: inventree
    shodan-query: http.title:"InvenTree"
    fofa-query: title="InvenTree"
  tags: panel,inventree,inventory,selfhosted,detect,discovery,login
http:
  - method: GET
    path:
      - "{{BaseURL}}/api/"

    matchers:
      - type: dsl
        dsl:
          - 'status_code == 200'
          - 'contains(content_type, "application/json")'
          - 'contains(body, "InvenTree")'
          - 'contains_all(body, "\"apiVersion\"", "\"worker_running\"", "\"instance\"")'
        condition: and

    extractors:
      - type: json
        part: body
        json:
          - '.version'
