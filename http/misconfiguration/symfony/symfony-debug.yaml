id: symfony-debug

info:
  name: Symfony 调试模式暴露
  author: organiccrap,pdteam
  severity: high
  description: |-
    该模板用于核查 Symfony 调试模式暴露。调试模式、错误页面或诊断组件在生产环境暴露时，会返回堆栈、路径、配置项、请求上下文或运行参数。模板访问 /admin_dev.php、/index_dev.php，并根据调试标识、异常类名、phpinfo/Xdebug 配置或错误关键字确认暴露。
  reference:
    - https://github.com/synacktiv/eos
  classification:
    cpe: cpe:2.3:a:sensiolabs:symfony:*:*:*:*:*:*:*:*
  metadata:
    verified: true
    max-request: 4
    vendor: sensiolabs
    product: symfony
    shodan-query: http.html:"symfony Profiler"
  tags: symfony,debug,misconfig,vuln
  impact: |-
    - 攻击者可获取应用路径、框架版本、环境变量、内部调用栈、请求参数和依赖信息。
    - 这些信息可帮助定位组件缺陷、构造后续漏洞利用或绕过安全控制。
  remediation: |-
    - 关闭生产环境调试模式、错误详情展示、Profiler 和 phpinfo 页面。
    - 将错误写入受保护日志，统一返回通用错误页面。
    - 限制诊断入口访问来源，升级框架并复核生产配置。
http:
  - method: GET
    path:
      - '{{BaseURL}}'
      - "{{BaseURL}}/admin_dev.php"
      - "{{BaseURL}}/index_dev.php"
      - "{{BaseURL}}/app_dev.php"

    stop-at-first-match: true

    matchers-condition: or
    matchers:
      - type: word
        part: header
        words:
          - 'x-debug-token-link:'
          - '/_profiler/'
        condition: and
        case-insensitive: true

      - type: word
        part: body
        words:
          - 'debug mode</a> is enabled.'
          - 'id="sfWebDebugSymfony"'
        condition: or
