id: cleo-detect

info:
  name: Cleo 技术指纹识别（指纹识别）
  author: rxerium
  severity: info
  description: |
    用于识别目标是否部署 Cleo 技术 并提取相关版本或构建信息，模板会结合 HTTP 响应头、特定路径或已知端点和版本或标识提取结果进行指纹匹配。
  reference:
    - https://www.cleo.com
  metadata:
    max-request: 1
    verified: true
    shodan-query: 'Server: Cleo'
  tags: tech,detect,cleo,discovery

http:
  - method: GET
    path:
      - '{{BaseURL}}'

    host-redirects: true
    max-redirects: 2

    matchers:
      - type: word
        part: server
        words:
          - "Cleo VLTrader"
          - "Cleo Harmony"
          - "Cleo LexiCom"
        condition: or

    extractors:
      - type: regex
        part: server
        regex:
          - "Cleo VLTrader/([0-9.]+)"
          - "Cleo Harmony/([0-9.]+)"
          - "Cleo LexiCom/([0-9.]+)"
