id: hybris-sap-omni-commerce-connect-detect

info:
  name: SAP Hybris Omni Commerce Connect 指纹识别（指纹识别）
  author: TechbrunchFR
  severity: info
  description: >-
    SAP Hybris Omni Commerce Connect 是 SAP Commerce 的 REST 接口层，用于向前端、移动端和第三方系统开放电商能力。该模板通过请求目标服务并检查预设路径或首页响应、页面正文关键字等指纹特征，判断目标是否使用或暴露了
    SAP Hybris Omni Commerce Connect 相关组件；命中结果仅表示指纹特征匹配，可用于资产盘点、技术栈识别和后续安全评估，不代表已确认存在可利用漏洞。
  reference:
  - https://help.sap.com/docs/SAP_COMMERCE/e5d7cec9064f453b84235dc582b886da/8c19ab00866910148f87bf32d4a60d38.html?locale=en-US
  metadata:
    verified: true
    max-request: 1
    shodan-query: title:"Hybris"
  tags: tech,sap,hybris,omni,discovery
http:
  - method: GET
    path:
      - "{{BaseURL}}/occ/v2/d2OzBcy"

    matchers:
      - type: word
        part: body
        words:
          - "Base site d2OzBcy doesn't exist"
