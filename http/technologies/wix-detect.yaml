id: wix-detect

info:
  name: Wix 指纹识别（指纹识别）
  author: Chirag Mistry
  severity: info
  description: >-
    Wix 是托管建站平台，用于创建网站、落地页、在线商店和营销页面。该模板通过请求目标服务并检查预设路径或首页响应、页面正文关键字、状态码、正则特征等指纹特征，判断目标是否使用或暴露了
    Wix 相关组件；命中结果仅表示指纹特征匹配，可用于资产盘点、技术栈识别和后续安全评估，不代表已确认存在可利用漏洞。
  metadata:
    verified: true
    max-request: 8
  tags: wix,detect,tech
http:
  - method: GET
    path:
      - "{{BaseURL}}"
      - "{{BaseURL}}/robots.txt"
      - "{{BaseURL}}/sitemap.xml"
      - "{{BaseURL}}/favicon.ico"
      - "{{BaseURL}}/_static/"
      - "{{BaseURL}}/wix-api"
      - "{{BaseURL}}/user/login"
      - "{{BaseURL}}/wix.js"

    stop-at-first-match: true
    matchers-condition: and
    matchers:
      - type: word
        part: response
        words:
          - "Powered by Wix"
          - "X-Wix-Request-Id"
          - "Wix Static Site"
          - "wixsite.com"
        condition: or
        case-insensitive: true

      - type: status
        status:
          - 200
          - 403
          - 404
        condition: or

    extractors:
      - type: regex
        part: body
        name: version
        regex:
          - 'Wix.com ([0-9.]+)'
          - 'Wix version ([0-9.]+)'
          - 'Wix Static Site Version ([0-9.]+)'

      - type: regex
        part: body
        name: wix_id
        regex:
          - 'wix-id=([a-z0-9]+)'
          - 'siteid="([a-zA-Z0-9]+)"'
