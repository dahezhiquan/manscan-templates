id: allen-bradley-plc5-detect

info:
  name: Allen-Bradley PLC-5 Series PLC 识别（服务漏洞）
  author: biero-el-corridor
  severity: info
  description: |
    该模板通过工业协议指纹识别目标是否运行 Allen-Bradley PLC-5 Series PLC 相关设备或控制系统。
  metadata:
    shodan-query: 'port:44818 "Vendor ID: Rockwell Automation/Allen-Bradley"'
  tags: ics,allen-bradley,plc-5,detect,network,tcp

tcp:
  - inputs:
      - data: "630000000000000000000000000000000000000000000000"
        type: hex
        read: 200
        name: info

    host:
      - "{{Hostname}}"
    port: 44818
    read-size: 1024

    matchers:
      - type: binary
        part: info
        binary:
          - "313737312d" # 1771
          - "313737322d" # 1772
          - "313738352d" # 1785- https://www.ideadigitalcontent.com/files/11994/ID-SPE-1785-sg001_-en-p.pdf
        condition: or
