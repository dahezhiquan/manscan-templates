id: pablo-ftp-detect
info:
  name: Pablo's FTP 服务 识别（指纹识别）
  author: pussycat0x
  severity: info
  description: |
    该模板通过 FTP Banner、响应特征或协商行为识别目标是否运行 Pablo's 相关 FTP 服务实现。
  metadata:
    verified: true
    shodan-query: "Welcome to Pablo's FTP Server"
    max-request: 1
  tags: network,ftp,pablo,detect,tcp,discovery

tcp:
  - inputs:
      - data: 00000000
        type: hex

    host:
      - "{{Hostname}}"
    port: 21
    read-size: 1024

    matchers:
      - type: word
        words:
          - "Welcome to Pablo's FTP Server"
