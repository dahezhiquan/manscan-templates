id: red-lion-panel

info:
  name: Red Lion Control 面板识别（指纹识别）
  author: ritikchaddha
  severity: info
  description: Red Lion Control 是工业控制设备管理界面，用于工业网关、HMI 或控制器配置和运维。该模板请求首页，并依据页面标题、正文关键字或品牌资源特征识别目标是否部署了该系统或暴露了对应入口，适用于资产指纹确认；命中结果仅表示系统特征匹配，不代表已确认存在未授权访问或可利用漏洞。
  metadata:
    verified: true
    max-request: 1
  tags: panel,redlion,detect,iot,discovery

http:
  - method: GET
    path:
      - "{{BaseURL}}"

    matchers:
      - type: word
        part: body
        words:
          - "Red Lion</a>"
          - "Red Lion Controls</a>"
        case-insensitive: true
        condition: or
