id: gitea-public-signup

info:
  name: Gitea Public 注册已启用
  author: edoardottt
  severity: high
  description: |
    检测到 Gitea Public 注册已启用。目标功能在未认证状态下可访问，可能暴露管理入口、业务数据、系统状态或可执行操作，需确认是否存在访问控制缺失。
  reference:
    - https://www.youtube.com/watch?v=oHhofSj9lEM&t=157s
    - https://gitea.io/en-us/
  classification:
    cpe: cpe:2.3:a:gitea:gitea:*:*:*:*:*:*:*:*
  metadata:
    verified: true
    max-request: 1
    vendor: gitea
    product: gitea
    shodan-query: html:"Powered by Gitea"
  tags: misconfig,gitea,vuln

http:
  - method: GET
    path:
      - '{{BaseURL}}/user/sign_up'

    matchers-condition: and
    matchers:
      - type: word
        words:
          - 'Powered by Gitea'
          - 'Register -'
        condition: and

      - type: word
        part: body
        words:
          - "Registration is disabled. Please contact your site administrator."
        negative: true

      - type: status
        status:
          - 200
