id: cockroachdb-information-disclosure

info:
  name: Cockroach数据库 信息泄露
  author: pussycat0x
  severity: medium
  description: |
    检测到 Cockroach数据库 信息泄露。目标功能在未认证状态下可访问，可能暴露管理入口、业务数据、系统状态或可执行操作，需确认是否存在访问控制缺失。
  reference:
    - https://github.com/cockroachdb/cockroach/issues/44348
  metadata:
    verified: true
    shodan-query: product:cockroachdb
  tags: cockroachdb,exposure,misconfig

flow: http(1) && http(2)

http:
  - method: GET
    path:
      - "{{BaseURL}}"

    matchers:
      - type: dsl
        dsl:
          - 'status_code == 200'
          - 'contains(body, "<title>Cockroach Console")'
        condition: and
        internal: true

  - method: GET
    path:
      - "{{BaseURL}}/_status/statements"

    matchers:
      - type: dsl
        dsl:
          - 'contains_all(body, "statements", "planLat","keyData","stats")'
          - 'status_code == 200'
        condition: and
