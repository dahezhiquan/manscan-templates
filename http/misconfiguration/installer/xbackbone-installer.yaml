id: xbackbone-installer

info:
  name: XBackBone 安装向导 暴露
  author: DhiyaneshDk
  severity: high
  description: |
    检测到 XBackBone 安装向导 暴露。该页面属于安装、初始化或配置向导流程，若对外暴露，攻击者可能完成初始化、创建管理员账户或重新配置目标系统。
  metadata:
    verified: true
    max-request: 1
    shodan-query: html:"XBackBone Installer"
  tags: install,xbackbone,exposure,misconfig,vuln

http:
  - method: GET
    path:
      - "{{BaseURL}}/install/"

    matchers-condition: and
    matchers:
      - type: word
        part: body
        words:
          - "<title>XBackBone Installer</title>"

      - type: status
        status:
          - 200
