id: skyrock

info:
  name: Skyrock 用户名信息枚举（OSINT）
  author: dwisiswant0
  severity: info
  description: |
    对 Skyrock 的用户名进行 OSINT 枚举检查。模板请求公开路径 https://用户名.skyrock.com/，当响应状态为 200 且页面或响应内容命中 “&#039;s blog” 等用户资料页特征时，判定目标用户名可能存在。
  classification:
    cvss-metrics: CVSS:3.1/AV:N/AC:L/PR:N/UI:N/S:U/C:N/I:N/A:N
    cvss-score: 0
    cwe-id: CWE-200
  metadata:
    max-request: 1
  tags: osint,osint-social,skyrock,discovery

self-contained: true

http:
  - method: GET
    path:
      - "https://{{user}}.skyrock.com/"

    matchers-condition: and
    matchers:
      - type: status
        status:
          - 200

      - type: word
        part: body
        words:
          - "&#039;s blog"
