id: eclipse-project-exposure

info:
  name: Eclipse .project 配置暴露（暴露面识别）
  author: 0x_Akoko
  severity: info
  description: |
    检测到对外可访问的 Ec。相关文件可能泄露项目结构、依赖关系、部署细节、敏感参数或其他不应公开的内部信息。
  reference:
    - https://help.eclipse.org/latest/index.jsp
  metadata:
    verified: true
    max-request: 1
  tags: exposure,config,eclipse,files,vuln

http:
  - method: GET
    path:
      - "{{BaseURL}}/.project"

    matchers:
      - type: dsl
        dsl:
          - 'status_code == 200'
          - 'contains_all(body, "<projectDescription>", "<buildSpec>", "<natures>", "org.eclipse")'
        condition: and
