id: smb-enum-domains

info:
  name: SMB 域枚举（服务漏洞）
  author: DhiyaneshDK
  severity: medium
  description: |
    SMB 服务在 Windows 域环境中可能返回 DNS 域名、NetBIOS 域名、森林名称等身份边界信息。该模板发起 SMBv2 元数据枚举请求，并从响应中提取 DNSDomainName、NetBIOSDomainName 等字段。
  impact: |
    - SMB 域枚举会暴露域名、森林名称和身份边界信息。
    - 攻击者可据此识别 Active Directory 结构，为账号枚举、信任关系分析和横向移动做准备。
  remediation: |
    - 禁止匿名或低权限 SMB 域枚举，限制 445 端口访问来源。
    - 审计域信息暴露策略，减少对未认证客户端返回的域和森林细节。
  reference:
    - https://nmap.org/nsedoc/scripts/smb-enum-domains.html
  metadata:
    verified: true
    max-request: 1
    shodan-query: port:445
  tags: js,network,smb,enum,discovery

javascript:
  - pre-condition: |
      isPortOpen(Host,Port);
    code: |
      var m = require("nuclei/smb");
      var c = new m.SMBClient();
      var response = c.ListSMBv2Metadata(Host, Port);
      Export(response);

    args:
      Host: "{{Host}}"
      Port: "445"
    matchers:
      - type: dsl
        dsl:
          - "len(DNSDomainName) != 0"

    extractors:
      - type: json
        internal: true
        name: DNSDomainName
        json:
          - '.DNSDomainName'

      - type: json
        json:
          - '"DomainName: "+ .DNSDomainName '
