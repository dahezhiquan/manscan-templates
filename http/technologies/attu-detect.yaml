id: attu-detect

info:
  name: Attu 指纹识别（指纹识别）
  author: s4e-io
  severity: info
  description: 用于识别目标是否使用 Attu，模板会结合页面标题、页面正文和特定路径或已知端点进行技术指纹匹配。
  reference:
    - https://github.com/zilliztech/attu
  metadata:
    verified: true
    max-request: 1
    fofa-query: title="Attu"
  tags: tech,vector-database,attu,detect,discovery

http:
  - method: GET
    path:
      - "{{BaseURL}}"

    matchers:
      - type: word
        part: body
        words:
          - '<title>Attu</title>'
          - 'content="Attu'
        condition: or
