id: azure-servicebus-public-access-disabled
info:
  name: Azure Service Bus 公网访问限制未配置（云安全）
  author: princechaddha
  severity: high
  description: Azure Service Bus 命名空间启用 publicNetworkAccess 且未配置 IP 规则时，公网客户端仍可到达消息服务的网络入口，扩大凭据攻击和消息数据暴露面。本模板枚举命名空间并查询 network-rule-set，仅当 publicNetworkAccess 为 Enabled 且 ipRules 为空时报告。
  impact: |
    - 攻击者可从公网持续探测命名空间并针对身份认证、共享访问签名或应用凭据发起攻击。
    - 凭据被滥用后，攻击者可能读取、注入或删除消息，干扰异步业务流程并造成敏感数据泄露。
  remediation: |
    - 对不需要公网访问的命名空间关闭 publicNetworkAccess，并优先通过 Private Endpoint 和受信任虚拟网络连接。
    - 如必须保留公网入口，配置明确的 IP 规则、最小权限身份和共享访问策略，并持续审计网络规则变更。
  reference:
    - https://docs.microsoft.com/en-us/azure/service-bus-messaging/service-bus-networking
  metadata:
    vendor: microsoft
    product: azure-service-bus
  tags: cloud,devops,azure,microsoft,service-bus,azure-cloud-config

flow: |
  code(1);
  for (let NamespaceData of iterate(template.namespaceList)) {
    NamespaceData = JSON.parse(NamespaceData);
    set("name", NamespaceData.name);
    set("resourceGroup", NamespaceData.resourceGroup);
    code(2);
  }

self-contained: true
code:
  - engine:
      - sh
      - bash
    source: |
      az servicebus namespace list --output json --query '[*].{"name":name,"resourceGroup":resourceGroup}'

    extractors:
      - type: json
        name: namespaceList
        internal: true
        json:
          - '.[]'

  - engine:
      - sh
      - bash
    source: |
      az servicebus namespace network-rule-set show --namespace-name "$name" --resource-group "$resourceGroup" --query '{publicNetworkAccess:publicNetworkAccess,ipRules:ipRules}'

    matchers:
      - type: word
        words:
          - '"ipRules": []'
          - '"publicNetworkAccess": "Enabled"'
        condition: and

    extractors:
      - type: dsl
        dsl:
          - 'name + " in " + resourceGroup + " has public network access enabled with no IP rules set"'
