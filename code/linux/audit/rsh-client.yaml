id: rsh-client

info:
  name: rsh 客户端不应安装（本地基线扫描）
  author: Th3l0newolf
  severity: low
  description: |
    rsh 客户端属于旧式远程 shell 工具，缺少现代加密和强认证保护，容易形成明文会话和信任关系误用风险。CIS Ubuntu 基线建议移除该类传统客户端；模板通过 `dpkg-query` 检查 `rsh-client` 是否安装，命中 Policy-Fail 表示不符合基线。
  impact: |
    - 增加主机误用高风险协议或旧式信任机制的机会，可能暴露凭据、会话内容或内部连接信息。
    - 攻击者在获得低权限落点后，可能利用已安装客户端辅助横向连接、数据传输或绕过组织基线管控。
  remediation: |
    - 如无明确业务需求，卸载 `rsh-client` 或对应软件包，并清理残留服务配置。
    - 如必须保留，限制访问来源和可用范围，启用加密认证，并纳入补丁、日志和基线审计。
  reference:
    - https://www.cisecurity.org/benchmark/ubuntu_linux
  metadata:
    verified: true
  tags: cis,local,cisecurity,audit,linux,ubuntu,rsh

self-contained: true

code:
  - engine:
      - bash

    args:
      - "-c"
      - |
        # Check if the rsh-client package is installed
        if dpkg-query -W -f='${Status}' rsh-client 2>/dev/null | grep -q "install ok installed"; then
          echo "[cis-rsh-client-check:Policy-Fail] [rsh-client is installed] [CIS_FAIL]"
        else
          echo "[cis-rsh-client-check:Policy-Pass] [rsh-client is not installed] [CIS_PASS]"
        fi

    matchers:
      - type: word
        name: policy-pass
        words:
          - "Policy-Pass"

      - type: word
        name: policy-fail
        words:
          - "Policy-Fail"
