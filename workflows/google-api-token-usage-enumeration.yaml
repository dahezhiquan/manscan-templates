id: google-api-token-usage-enumeration

info:
  name: Google API Key 使用能力枚举工作流（工作流）
  author: tanq16
  description: 该工作流用于枚举已暴露 Google API Key 的可用权限范围。当前端页面或源代码中发现此类密钥后，可借助相关模板验证其是否可被未授权调用；如果调用范围未受限制，攻击者还可能批量发起请求，给密钥所有者带来异常 API 消耗和高额账单风险。
