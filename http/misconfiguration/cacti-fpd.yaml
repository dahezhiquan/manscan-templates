id: cacti-fpd

info:
  name: Cacti 完整路径泄露
  author: theamanrawat
  severity: low
  description: |
    检测到 Cacti 完整路径泄露。目标暴露了调试、错误或堆栈信息，可能泄露应用路径、框架版本、环境变量、源码位置或内部调用细节。
  tags: cacti,fpd,exposure,path,misconfig

http:
  - method: GET
    path:
      - "{{BaseURL}}"
      - "{{BaseURL}}/cacti/"
      - "{{BaseURL}}/index.php"
      - "{{BaseURL}}/cacti/index.php"

    stop-at-first-match: true
    matchers-condition: and
    matchers:
      - type: word
        part: body
        words:
          - "System log file is not available for writing"
          - "please enable write access"
        condition: and

      - type: regex
        part: body
        regex:
          - 'Log:\s+([a-zA-Z0-9/\\_.-]+cacti\.log)'

      - type: status
        status:
          - 200

    extractors:
      - type: regex
        part: body
        group: 1
        regex:
          - 'Log:\s+([a-zA-Z0-9/\\_.-]+cacti\.log)'
