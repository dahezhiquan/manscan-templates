id: azure-nsg-telnet-unrestricted
info:
  name: Azure NSG 对互联网开放 Telnet 端口 23（云安全）
  author: princechaddha
  severity: high
  description: Telnet 使用 TCP 23 提供远程终端，但默认不提供传输加密；将其对互联网开放会把登录凭据和会话内容暴露给窃听及主动攻击。本模板查询入站允许的 TCP 23 NSG 规则，并在来源地址为 *、internet 或 any 时报告。
  impact: |
    - 网络中的窃听者可能获取用户名、密码和交互内容，攻击者还可对服务进行暴力破解和漏洞利用。
    - 远程终端被控制后，可能造成主机接管、敏感数据泄露和横向移动。
  remediation: |
    - 禁止使用面向互联网的 Telnet，删除 TCP 23 入站规则并迁移到 SSH 或其他加密管理协议。
    - 对遗留设备限制到专用管理网段，结合 VPN、强认证和网络隔离控制访问来源。
  reference:
    - https://docs.microsoft.com/en-us/azure/virtual-network/network-security-groups-overview
  metadata:
    vendor: microsoft
    product: azure-network-security-group
  tags: cloud,devops,azure,microsoft,nsg,azure-cloud-config

flow: |
  code(1);
  for (let NsgData of iterate(template.nsgdata)) {
    NsgData = JSON.parse(NsgData)
    set("nsg", NsgData.name)
    set("resourcegroup", NsgData.resourceGroup)
    code(2)
  }

self-contained: true
code:
  - engine:
      - sh
      - bash
    source: |
      az network nsg list --query '[*].{name:name, resourceGroup:resourceGroup}' --output json

    extractors:
      - type: json
        name: nsgdata
        internal: true
        json:
          - '.[]'

  - engine:
      - sh
      - bash
    source: |
      az network nsg rule list --nsg-name $nsg --resource-group $resourcegroup --query "[?direction=='Inbound' && access=='Allow' && protocol=='TCP' && (destinationPortRange=='23')]"

    matchers:
      - type: word
        words:
          - '"sourceAddressPrefix": "*"'
          - '"sourceAddressPrefix": "internet"'
          - '"sourceAddressPrefix": "any"'

    extractors:
      - type: dsl
        dsl:
          - 'nsg + " has unrestricted access on TCP port 23"'
