id: signoz-panel

info:
  name: SigNoz 面板识别（指纹识别）
  author: ChrisJr404,rxerium
  severity: info
  description: |-
    SigNoz 是开源可观测性平台，用于指标、日志、链路追踪和告警分析。该模板请求首页、`/api/v1/version`，并依据 DSL 条件识别目标是否部署了该系统或暴露了对应入口，适用于资产指纹确认；命中结果仅表示系统特征匹配，不代表已确认存在未授权访问或可利用漏洞。
  reference:
  - https://github.com/SigNoz/signoz
  - https://signoz.io/
  metadata:
    verified: false
    max-request: 2
    vendor: signoz
    product: signoz
    shodan-query: http.title:"SigNoz"
    fofa-query: title="SigNoz"
  tags: panel,signoz,observability,oss,detect

flow: http(1) && http(2)

http:
  - method: GET
    path:
      - "{{BaseURL}}"

    host-redirects: true
    max-redirects: 2

    matchers:
      - type: dsl
        dsl:
          - 'status_code == 200'
          - 'contains(to_lower(body), "signoz")'
        internal: true
        condition: and

  - method: GET
    path:
      - "{{BaseURL}}/api/v1/version"

    matchers:
      - type: dsl
        dsl:
          - 'status_code == 200'
          - 'contains(content_type, "application/json")'
          - 'contains_all(body, "\"version\"", "\"ee\"", "\"setupCompleted\"")'
        condition: and

    extractors:
      - type: regex
        part: body
        group: 1
        regex:
          - '"version"\s*:\s*"([^"]+)"'
