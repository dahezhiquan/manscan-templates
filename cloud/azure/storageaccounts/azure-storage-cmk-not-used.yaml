id: azure-storage-cmk-not-used
info:
  name: Azure Storage 未使用客户管理密钥（云安全）
  author: princechaddha
  severity: high
  description: Azure Storage 的客户管理密钥用于将静态数据加密密钥的轮换、撤销和访问审批纳入组织密钥治理。本模板枚举存储账户并查询 encryption.keyVaultProperties.keyName，在输出为空时报告未使用客户管理密钥。
  impact: |
    - 依赖平台托管密钥的账户无法独立证明组织对加密根密钥的控制，可能不符合高敏感数据的治理要求。
    - 密钥轮换、吊销和数据访问审批受平台策略约束，增加合规审计和租户隔离压力。
  remediation: |
    - 在 Key Vault 或 Managed HSM 中准备客户管理密钥，并授予存储账户受管身份所需的最小权限。
    - 配置并验证客户管理密钥、自动轮换、密钥不可用告警和灾难恢复流程，再迁移生产账户。
  reference:
    - https://docs.microsoft.com/en-us/azure/storage/common/storage-encryption-keys-manage?tabs=portal
  metadata:
    vendor: microsoft
    product: azure-storage
  tags: cloud,devops,azure,microsoft,azure-storage,azure-cloud-config

flow: |
  code(1);
  for (let accountData of iterate(template.accountList)) {
    accountData = JSON.parse(accountData);
    set("name", accountData.Name);
    code(2);
  }

self-contained: true
code:
  - engine:
      - sh
      - bash
    source: |
      az storage account list --query '[*].{"Name":name}'

    extractors:
      - type: json
        name: accountList
        internal: true
        json:
          - '.[]'

  - engine:
      - sh
      - bash
    source: |
      az storage account show --name "$name" --query 'encryption.keyVaultProperties.keyName'

    matchers:
      - type: word
        words:
          - ''

    extractors:
      - type: dsl
        dsl:
          - '"Storage account " + name + " is not using CMKs for encryption"'
