id: azure-vm-accelerated-networking-disabled
info:
  name: Azure VM 加速网络未启用（云安全）
  author: princechaddha
  severity: medium
  description: Azure Accelerated Networking 通过 SR-IOV 将网络处理卸载到网卡，降低虚拟机网络延迟和主机 CPU 开销；适用虚拟机未启用时，网络吞吐和隔离性能可能低于预期。本模板枚举虚拟机及其网卡，查询 enableAcceleratedNetworking，并在返回 false 时报告。
  impact: |
    - 高吞吐或低延迟业务可能出现性能下降、连接排队和资源争用，进而影响服务可用性。
    - 未满足网络性能基线还可能导致团队通过不受控的公网扩容或旁路组件补偿，扩大网络暴露面。
  remediation: |
    - 确认 VM 大小、区域、操作系统和网卡支持 Accelerated Networking 后启用该功能，并安排停机或重启窗口。
    - 启用后验证 NSG、路由、监控和应用连接行为，避免仅为性能优化而放宽网络访问控制。
  reference:
    - https://docs.microsoft.com/en-us/azure/virtual-network/virtual-network-accelerated-networking-cli
  metadata:
    vendor: microsoft
    product: azure-virtual-machines
  tags: cloud,devops,azure,microsoft,virtual-machines,azure-cloud-config

flow: |
  code(1);
  for(let InstanceDetails of iterate(template.vmIDs)) {
    set("vmId", InstanceDetails);
    code(2);
    for(let NicId of iterate(template.nicIDs)) {
      set("nicId", NicId);
      code(3);
    }
  }

self-contained: true
code:
  - engine:
      - sh
      - bash
    source: |
      az vm list --query '[*].id'

    extractors:
      - type: json
        name: vmIDs
        internal: true
        json:
          - '.[]'

  - engine:
      - sh
      - bash
    source: |
      az vm show --ids "$vmId" --query 'networkProfile.networkInterfaces[*].id'

    extractors:
      - type: json
        name: nicIDs
        internal: true
        json:
          - '.[]'

  - engine:
      - sh
      - bash
    source: |
      az network nic show --ids "$nicId" --query 'enableAcceleratedNetworking'

    matchers:
      - type: word
        words:
          - 'false'

    extractors:
      - type: dsl
        dsl:
          - 'vmId + " with NIC " + nicId + " has Accelerated Networking disabled"'
