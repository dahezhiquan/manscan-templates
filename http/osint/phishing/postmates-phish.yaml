id: postmates-phish

info:
  name: Postmates 仿冒钓鱼网站（钓鱼网站识别）
  author: rxerium
  severity: info
  description: |
    检测到疑似仿冒 Postmates 的钓鱼网站。模板在目标页面返回 200、页面内容命中 Postmates 的官方服务页面特征，且当前主机不属于 postmates.com 官方域名时触发，用于识别借用 Postmates 品牌页面诱导用户信任的仿冒站点。
  reference:
    - https://postmates.com
  metadata:
    max-request: 1
  tags: phishing,postmates,food-delivery,osint,discovery
http:
  - method: GET
    path:
      - "{{BaseURL}}"

    host-redirects: true
    max-redirects: 2

    matchers-condition: and
    matchers:
      - type: word
        words:
          - 'Postmates'
          - 'Order delivery or pickup from more than 600,000 restaurants, retailers, grocers, and more all across your city. Download the app now to get everything you crave, on-demand.'
        condition: and

      - type: status
        status:
          - 200

      - type: dsl
        dsl:
          - '!contains(host,"postmates.com")'
