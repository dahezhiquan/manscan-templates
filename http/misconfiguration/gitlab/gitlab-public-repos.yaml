id: gitlab-public-repos

info:
  name: GitLab 公开仓库
  author: ldionmarcil
  severity: medium
  description: |
    该模板用于核查 GitLab 公开仓库。该类问题通常源于容器、CI/CD、注册表、服务发现或运维 API 暴露在公网且缺少访问控制。模板会向目标发送探测请求，并依据请求 `/api/v4/projects`、匹配 `Set-Cookie: _gitlab_session=`、匹配 `name_with_namespace`等证据确认目标是否存在该配置问题。
  impact: |
    - 攻击者可查看镜像、容器、任务、节点、配置、构建流水线或运行状态。
    - 若接口允许操作，可能导致容器创建、任务执行、镜像篡改、配置泄露或集群接管。
  remediation: |
    - 禁止将运维 API、容器接口和注册表直接暴露到公网。
    - 启用 TLS、认证授权、来源限制和最小权限访问策略。
    - 审计镜像、容器、任务和访问日志，清理未知资源并轮换相关令牌。
  reference:
    - https://twitter.com/ldionmarcil/status/1370052344562470922
    - https://github.com/ldionmarcil/gitlab-unauth-parser
  classification:
    cpe: cpe:2.3:a:gitlab:gitlab:*:*:*:*:*:*:*:*
  metadata:
    max-request: 1
    vendor: gitlab
    product: gitlab
    shodan-query: http.title:"GitLab"
  tags: gitlab,exposure,misconfig,vuln

http:
  - method: GET
    path:
      - "{{BaseURL}}/api/v4/projects"

    headers:
      Cookie: _gitlab_session=

    matchers-condition: and
    matchers:
      - type: word
        part: header
        words:
          - "Set-Cookie: _gitlab_session="

      - type: word
        part: body
        words:
          - "name_with_namespace"
