id: geoserver-default-login

info:
  name: Geoserver Admin 默认口令登录（弱口令）
  author: For3stCo1d,professorabhay,ritikchaddha
  severity: high
  description: |
    该模板用于检测 Geoserver Admin 是否仍可使用默认凭据或弱口令登录。模板主要向 `/geoserver/j_spring_security_check`、`/geoserver/web/` 等认证入口发送请求，使用内置默认凭据组合进行认证尝试，并根据响应中的 `!contains(tolower(location_1), 'error=true')`、`status_code_1 == 302` 等登录成功特征判断登录是否成功；命中说明目标未及时修改出厂、示例或初始化账号口令。
  impact: |
    - 攻击者可登录 Geoserver Admin 管理接口，读取、导出或篡改数据、索引、队列、仓库、报表或服务配置。
    - 若系统保存连接串、访问令牌或集成凭据，弱口令登录可能进一步造成业务数据泄露、权限扩大或服务中断。
  remediation: |
    - 立即修改默认账号口令，删除测试账号，并为管理员、服务账号和集成账号使用唯一强密码。
    - 启用细粒度权限控制、访问来源限制和审计日志，避免管理 API 或控制台直接对公网开放。
    - 检查数据导出、配置变更、令牌使用和异常查询记录，必要时轮换相关凭据。
  reference:
    - http://geoserver.org/
  classification:
    cvss-metrics: CVSS:3.0/AV:N/AC:L/PR:N/UI:N/S:C/C:L/I:L/A:L
    cvss-score: 8.3
    cwe-id: CWE-522
    cpe: cpe:2.3:a:geoserver:geoserver:*:*:*:*:*:*:*:*
  metadata:
    verified: true
    max-request: 2
    fofa-query: app="GeoServer"
    product: geoserver
    vendor: geoserver
  tags: geoserver,default-login,vuln

http:
  - raw:
      - |
        POST /geoserver/j_spring_security_check HTTP/1.1
        Host: {{Hostname}}
        Content-Type: application/x-www-form-urlencoded

        username={{user}}&password={{pass}}
      - |
        GET /geoserver/web/ HTTP/1.1
        Host: {{Hostname}}

    attack: pitchfork
    payloads:
      user:
        - admin
      pass:
        - geoserver
    host-redirects: true
    max-redirects: 2
    matchers:
      - type: dsl
        dsl:
          - "contains(tolower(location_1), '/geoserver/web') && contains(body_2, '<span>admin</span>')"
          - "!contains(tolower(location_1), 'error=true')"
          - 'status_code_1 == 302'
        condition: and
