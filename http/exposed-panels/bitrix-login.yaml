id: bitrix-login

info:
  name: Bitrix 登录面板（暴露面识别）
  author: juicypotato1,malwarework
  severity: info
  description: |
    该模板通过识别 Bitrix 登录入口的页面标题、特征文本或重定向行为，判断目标是否暴露了对应的认证界面。若命中，说明该登录面板对外可访问，可用于暴露面梳理与后续安全评估。
  classification:
    cwe-id: CWE-200
    cpe: cpe:2.3:a:bitrix:bitrix24:*:*:*:*:*:*:*:*
  metadata:
    max-request: 1
    verified: true
    vendor: bitrix
    product: bitrix24
    shodan-query: http.html:"/bitrix/"
    fofa-query: body="/bitrix/"
  tags: panel,bitrix,login,discovery

http:
  - method: GET
    path:
      - "{{BaseURL}}/bitrix/admin/"
      - "{{BaseURL}}/bitrix/components/bitrix/map.yandex.view/settings/settings.php"

    host-redirects: true
    max-redirects: 2
    stop-at-first-match: true
    matchers:
      - type: word
        words:
          - "USER_LOGIN"
          - "/bitrix/js/main/"
        condition: and
