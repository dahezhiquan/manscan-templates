id: azure-keyvault-network-unrestricted
info:
  name: Azure Key Vault 允许不受限公网访问（云安全）
  author: princechaddha
  severity: medium
  description: Azure Key Vault 的网络安全策略可以限制密钥、证书和机密终结点的来源。允许公网访问会使承载高价值凭据的服务端点暴露在公共网络中，增加探测和错误配置被利用的机会。本模板查询 properties.publicNetworkAccess，并在值为 Enabled 或未返回值时报告。
  impact: |
    - 攻击者可从互联网持续探测 Key Vault 端点，增加凭据滥用、权限配置缺陷和数据访问接口被利用的风险。
    - 一旦身份或网络规则存在错误，可能导致密钥、证书私钥或机密被读取，进而影响依赖服务和业务数据。
  remediation: |
    - 不需要公网访问时关闭 publicNetworkAccess，并通过 Private Endpoint、虚拟网络服务终结点或防火墙规则限制来源。
    - 同时使用 Microsoft Entra ID、RBAC 和最小权限控制数据面访问，避免把网络限制当作唯一防线。
  reference:
    - https://docs.microsoft.com/en-us/azure/key-vault/general/network-security
  metadata:
    vendor: microsoft
    product: azure-key-vault
  tags: cloud,devops,azure,microsoft,keyvault,azure-cloud-config

flow: |
  code(1);
  for (let VaultData of iterate(template.vaultNames)) {
    set("vaultName", VaultData)
    code(2)
  }

self-contained: true
code:
  - engine:
      - sh
      - bash
    source: |
      az keyvault list --query '[*].name' --output json

    extractors:
      - type: json
        name: vaultNames
        internal: true
        json:
          - '.[]'

  - engine:
      - sh
      - bash
    source: |
      az keyvault show --name $vaultName --query 'properties.publicNetworkAccess' --output tsv

    matchers:
      - type: word
        words:
          - 'Enabled'
          - ''

    extractors:
      - type: dsl
        dsl:
          - 'vaultName + " is configured to allow unrestricted Key Vault network access"'
