id: keybase-phish

info:
  name: Keybase 仿冒钓鱼网站（钓鱼网站识别）
  author: rxerium
  severity: info
  description: |
    检测到疑似仿冒 Keybase 的钓鱼网站。模板在目标页面返回 200、页面内容命中 Keybase 的品牌页面特征，且当前主机不属于 keybase.io 官方域名时触发，用于识别借用 Keybase 品牌页面诱导用户信任的仿冒站点。
  reference:
    - https://keybase.io
  metadata:
    max-request: 1
  tags: phishing,keybase,osint,discovery
http:
  - method: GET
    path:
      - "{{BaseURL}}"

    host-redirects: true
    max-redirects: 2

    matchers-condition: and
    matchers:
      - type: word
        words:
          - "Keybase is for keeping everyone's chats and files safe, from families to communities to companies. MacOS, Windows, Linux, iPhone, and Android."

      - type: status
        status:
          - 200

      - type: dsl
        dsl:
          - '!contains(host,"keybase.io")'
