id: ocserv-panel

info:
  name: OpenConnect VPN 服务器 (ocserv) - 检测（指纹识别）
  author: rxerium
  severity: info
  description: |-
    OpenConnect VPN 服务器 (ocserv) 是一款兼容 Cisco AnyConnect 客户端的开源 VPN 服务器，使用 DTLS 和 TLS 保障安全连接，通常暴露于端口 443 或 4443。服务器响应头可能泄露 OpenConnect 或 ocserv 相关的特征标识。
  reference:
    - https://gitlab.com/openconnect/ocserv
    - https://ocserv.gitlab.io/www/
  metadata:
    max-request: 1
    shodan-query: '"Server: ocserv"'
  tags: panel,ocserv,openconnect,vpn,detect

http:
  - method: GET
    path:
      - "{{BaseURL}}"

    matchers-condition: and
    matchers:
      - type: word
        part: header
        words:
          - 'ocserv'
          - 'OCServer'
        condition: or

      - type: status
        status:
          - 200
