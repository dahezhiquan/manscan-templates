id: ncentral-panel

info:
  name: N-central 登录面板识别（暴露面识别）
  author: theabhinavgaur
  severity: info
  description: 该模板通过识别 N-central 登录入口的页面标题、特征文本或重定向行为，判断目标是否暴露了对应的认证界面。若命中，说明该登录面板对外可访问，可用于暴露面梳理与后续安全评估。
  classification:
    cvss-metrics: CVSS:3.0/AV:N/AC:L/PR:N/UI:N/S:U/C:N/I:N/A:N
    cwe-id: CWE-200
    cpe: cpe:2.3:a:n-able:n-central:*:*:*:*:*:*:*:*
  metadata:
    verified: true
    max-request: 1
    shodan-query:
      - http.title:"N-central Login"
      - http.favicon.hash:1519363246
      - http.favicon.hash:1937353549
      - "Set-Cookie: ncentral_version="
    fofa-query:
      - title="N-central Login"
      - icon_hash="1519363246"
      - icon_hash="1937353549"
      - "Set-Cookie: ncentral_version="
    product: n-central
    vendor: n-able
  tags: panel,n-central,discovery

http:
  - method: GET
    path:
      - "{{BaseURL}}/login"

    matchers-condition: and
    matchers:
      - type: word
        part: body
        words:
          - 'class="ncentral"'

      - type: status
        status:
          - 200

    extractors:
      - type: regex
        group: 1
        regex:
          - "ncentralVersion:\\s+\"([\\d\\.]+)\","
