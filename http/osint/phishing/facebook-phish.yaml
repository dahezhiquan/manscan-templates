id: facebook-phish

info:
  name: Facebook 仿冒钓鱼网站（钓鱼网站识别）
  author: rxerium
  severity: high
  description: |
    Facebook 是面向社交、通讯、社区协作或公共内容访问的在线服务，通常承载用户身份、消息、群组、联系人或公开资料。该模板用于识别疑似仿冒 Facebook 的钓鱼网站；模板访问目标站点首页，在目标页面返回 200 状态码，且页面内容命中 Facebook 官方页面常见文案或标题特征（“Facebook – log in or sign up”），且当前主机不属于 facebook.com 等官方域名时触发。该类仿冒页面通常用于诱导用户提交登录凭据、验证码、支付信息或个人资料，可能造成账号接管、信息泄露和后续欺诈。
  impact: |-
    - 用户可能在仿冒页面提交账号密码、验证码、支付信息或个人资料，导致账号接管和敏感信息泄露。
    - 钓鱼站点可能被用于投递恶意链接、伪造登录流程或绕过用户对官方品牌的信任判断。
    - 品牌方或被仿冒组织可能面临客户投诉、欺诈交易、信誉受损以及后续应急处置成本。
  remediation: |-
    - 确认该站点是否为授权域名；若确认为仿冒站点，立即在网关、DNS、邮件安全和浏览器安全策略中阻断访问。
    - 向被仿冒品牌、托管商、注册商、CDN 和浏览器安全浏览服务提交滥用举报或下架请求。
    - 保留 URL、域名、解析记录、页面截图、证书和命中特征等证据，用于威胁情报关联和后续追踪。
    - 排查是否已有用户访问或提交信息；对疑似受影响账号执行密码重置、会话撤销、令牌轮换和多因素认证加固。
  reference:
    - https://facebook.com
  metadata:
    max-request: 1
  tags: phishing,facebook,osint,discovery
http:
  - method: GET
    path:
      - "{{BaseURL}}"

    host-redirects: true
    max-redirects: 2

    matchers-condition: and
    matchers:
      - type: word
        words:
          - 'Facebook – log in or sign up'

      - type: status
        status:
          - 200

      - type: dsl
        dsl:
          - '!contains(host,"facebook.com")'
