id: acunetix-360-installer

info:
  name: Acunetix 360 安装向导
  author: pussycat0x
  severity: info
  description: |
    检测到 Acunetix 360 安装向导。该页面属于安装、初始化或配置向导流程，若对外暴露，攻击者可能完成初始化、创建管理员账户或重新配置目标系统。
  metadata:
    verified: true
    max-request: 1
    shodan-query: http.favicon.hash:-347188002
  tags: misconfig,exposure,install,acunetix,vuln

http:
  - method: GET
    path:
      - "{{BaseURL}}/wizard/database/"

    matchers-condition: and
    matchers:
      - type: word
        part: body
        words:
          - "Acunetix 360 - Installation Wizard"
          - "License"
        condition: and

      - type: word
        part: header
        words:
          - "text/html"

      - type: status
        status:
          - 200
