id: api-scanii

info:
  name: Scanii API Token 可用性校验（token喷洒）
  author: daffainfo
  severity: info
  description: 该模板通过调用 Scanii API 的已知接口验证提供的 token 是否有效，命中后通常表示可访问安全情报与资产查询能力。
  reference:
    - https://docs.scanii.com/v2.1/resources.html
    - https://github.com/daffainfo/all-about-apikey/tree/main/scanii
  metadata:
    max-request: 1
  tags: token-spray,scanii

self-contained: true

http:
  - raw:
      - |
        GET https://api.scanii.com/v2.1/ping HTTP/1.1
        Authorization: Basic {{base64(api + ':' + secret)}}
        Host: api.scanii.com

    matchers:
      - type: word
        part: body
        words:
          - '"key"'
          - '"message" : "pong"'
        condition: and
