id: osasi-panel

info:
  name: OSASI 登录面板识别（指纹识别）
  author: biero-el-corridor
  severity: info
  description: |-
    OSASI 是 SAS 分析平台入口，用于统计分析、报表、数据挖掘和企业数据处理。该模板请求 `/users/login` 路径，并依据 HTTP 200 状态码、页面标题、正文关键字或品牌资源特征识别目标是否部署了该系统或暴露了对应入口，适用于资产指纹确认；命中结果仅表示系统特征匹配，不代表已确认存在未授权访问或可利用漏洞。
  metadata:
    shodan-query: html:"/css/osasiasp.css"
    verified: true
    max-request: 1
  tags: osasi,panel,login,detect,discovery

http:
  - method: GET
    path:
      - "{{BaseURL}}/users/login"

    matchers-condition: and
    matchers:
      - type: word
        part: body
        words:
          - "/img/osasil_logo_f.png"
          - "UserLoginid"
        condition: and

      - type: status
        status:
          - 200
