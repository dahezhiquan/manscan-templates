id: frappe-panel

info:
  name: Frappe 面板识别（指纹识别）
  author: Th3l0newolf
  severity: info
  description: |-
    检测到目标站点存在 Frappe 相关响应特征。Frappe 是低代码业务应用框架，Web Desk 用于管理模块、用户、文档、工作流和业务数据。模板请求 `/login#login`，并通过页面标题或正文关键字、状态码确认该系统指纹，用于资产识别、系统盘点和暴露面梳理。
  reference:
    - https://frappeframework.com/
  metadata:
    verified: true
    max-request: 1
    shodan-query: html:"Login to Frappe"
  tags: frappe,login,web,erp,detect,discovery
http:
  - method: GET
    path:
      - "{{BaseURL}}/login#login"

    matchers-condition: and
    matchers:
      - type: word
        part: body
        words:
          - "<h4>Login to Frappe</h4>"
          - "frappe.csrf_token"
          - "frappe.boot"

      - type: status
        status:
          - 200
