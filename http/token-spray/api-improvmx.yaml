id: api-improvmx

info:
  name: ImprovMX API Token 可用性校验（token喷洒）
  author: daffainfo
  severity: info
  description: 该模板通过调用 ImprovMX API 的已知接口验证提供的 token 是否有效，命中后通常表示可访问邮件发送、投递或邮箱服务能力。
  reference:
    - https://improvmx.com/api
    - https://github.com/daffainfo/all-about-apikey/tree/main/improvmx
  metadata:
    max-request: 1
  tags: token-spray,improvmx

self-contained: true

http:
  - raw:
      - |
        GET https://api.improvmx.com/v3/account HTTP/1.1
        Authorization: Basic {{base64(':' + token)}}
        Host: api.improvmx.com

    host-redirects: true
    max-redirects: 1
    matchers:
      - type: word
        part: body
        words:
          - '"billing_email":'
          - '"cancels_on":'
          - '"company_details":'
        condition: and
