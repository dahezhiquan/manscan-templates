id: gcloud-sql-trace-3625-enabled

info:
  name: SQL Server 数据库实例启用了 Trace Flag 3625（云安全）
  author: princechaddha
  severity: medium
  description: SQL Server Trace Flag 3625 会限制错误消息返回细节，通常只应在明确需要减少信息泄露时受控启用；长期启用可能影响故障诊断和审计一致性。本模板枚举 Cloud SQL SQL Server 实例，并检查 databaseFlags 中 3625 的值，匹配 on 时报告该跟踪标志已启用。
  impact: |
    - 错误信息被过度裁剪时，数据库故障、安全事件和应用异常可能缺少必要诊断上下文。
    - 非基线 trace flag 会增加运维差异和变更审计难度。
  remediation: |
    - 复核 Trace Flag 3625 的业务必要性；无明确例外时关闭该数据库 flag。
    - 对必须启用的实例记录例外原因、影响范围和复核周期，并验证监控和故障诊断流程不受影响。
  reference:
    - https://cloud.google.com/sql/docs/sqlserver/flags
  metadata:
    vendor: google
    product: cloud-sql
  tags: cloud,devops,gcp,gcloud,google-cloud-sql,mssql,gcp-cloud-config

flow: |
  code(1)
  for(let projectId of iterate(template.projectIds)){
    set("projectId", projectId)
    code(2)
    for(let sqlInstance of iterate(template.sqlInstances)){
      set("sqlInstance", sqlInstance)
      code(3)
    }
  }

self-contained: true

code:
  - engine:
      - sh
      - bash
    source: |
      gcloud projects list --format="json(projectId)"

    extractors:
      - type: json
        name: projectIds
        internal: true
        json:
          - '.[].projectId'

  - engine:
      - sh
      - bash
    source: |
      gcloud sql instances list --project $projectId --filter='DATABASE_VERSION:SQLSERVER*' --format="json(name)"

    extractors:
      - type: json
        name: sqlInstances
        internal: true
        json:
          - '.[].name'

  - engine:
      - sh
      - bash
    source: |
      gcloud sql instances describe $sqlInstance --project $projectId --format=json | jq '.settings.databaseFlags // [] | map(select(.name=="3625")) | .[].value'

    matchers:
      - type: word
        words:
          - 'on'

    extractors:
      - type: dsl
        dsl:
          - '"The 3625 trace flag is enabled for SQL Server instance " + sqlInstance + " in project " + projectId'
