id: audit-log-path-set

info:
  name: Ensure audit-log-path set（云安全）
  author: princechaddha
  severity: medium
  description: kube-apiserver 未设置 audit-log-path 会导致 API 审计日志无法按文件路径输出，影响对高危操作的追踪和取证。本模板读取 kube-system 中 kube-apiserver Pod 启动命令，发现包含 kube-apiserver 但缺少 audit-log-path 参数时报告。
  impact: |
    - 创建、删除、授权变更等 API 操作缺少完整审计记录，安全事件难以及时发现和还原。
    - 合规审计无法证明关键控制面操作的可追溯性。
  remediation: |
    - 为 kube-apiserver 配置 audit-log-path，并配套 audit-policy-file、日志轮转和集中采集。
    - 定期验证审计日志包含关键资源和高风险动词。
  reference:
    - https://kubernetes.io/docs/tasks/debug-application-cluster/audit/
  metadata:
    vendor: kubernetes
    product: kubernetes
  tags: cloud,devops,kubernetes,devsecops,api-server,k8s-cluster-security
variables:
  argument: "audit-log-path"

self-contained: true
code:
  - engine:
      - sh
      - bash
    source: |
      kubectl get pods -n kube-system -l component=kube-apiserver -o jsonpath="{.items[*].spec.containers[*].command}"

    matchers-condition: and
    matchers:
      - type: word
        words:
          - 'kube-apiserver'

      - type: word
        words:
          - "audit-log-path"
        negative: true

    extractors:
      - type: dsl
        dsl:
          - '"API server configuration is missing the " + argument + " argument."'
