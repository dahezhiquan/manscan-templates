id: slurm-hpc-dashboard

info:
  name: Slurm HPC 仪表盘暴露
  author: ritikchaddha
  severity: medium
  description: |
    该模板用于核查 Slurm HPC 仪表盘暴露。该类问题通常源于管理面板、仪表盘或监控控制台暴露在公网或缺少足够访问控制。模板会向目标发送探测请求，并依据请求 `/slurm/`、匹配 `<title>Slurm HPC Dashboard</title>`、匹配 `content="Slurm HPC dashboard`、状态码 200 等证据确认目标是否存在该配置问题。
  impact: |
    - 攻击者可获取系统状态、业务指标、任务信息、拓扑结构或管理入口线索。
    - 若面板存在默认凭据、弱认证或操作接口，可能进一步导致未授权管理或服务接管。
  remediation: |
    - 将管理面板和仪表盘限制在内网、VPN 或可信访问网关后。
    - 启用强认证、多因素认证、细粒度授权和操作审计。
    - 隐藏或关闭不需要公开的默认面板，并监控异常访问与暴力探测。
  reference:
    - https://grafana.com/grafana/dashboards/4323-slurm-dashboard/
  classification:
    cvss-metrics: CVSS:3.1/AV:N/AC:L/PR:N/UI:N/S:U/C:L/I:N/A:N
    cvss-score: 5.3
    cwe-id: CWE-200
    cpe: cpe:2.3:a:schedmd:slurm:*:*:*:*:*:*:*:*
  metadata:
    verified: true
    max-request: 1
    shodan-query: title:"Slurm HPC Dashboard"
    product: slurm
    vendor: schedmd
  tags: misconfig,slurm,dashboard,discovery

http:
  - method: GET
    path:
      - "{{BaseURL}}/slurm/"

    matchers-condition: and
    matchers:
      - type: word
        words:
          - '<title>Slurm HPC Dashboard</title>'
          - 'content="Slurm HPC dashboard'
        condition: or

      - type: status
        status:
          - 200
