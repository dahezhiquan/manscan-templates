id: api-urlscan

info:
  name: URLScan API Token 可用性校验（token喷洒）
  author: daffainfo
  severity: info
  description: 该模板通过调用 URLScan API 的已知接口验证提供的 token 是否有效，命中后通常表示可访问安全情报与资产查询能力。
  reference:
    - https://urlscan.io/docs/api/
    - https://github.com/daffainfo/all-about-apikey/tree/main/urlscan
  metadata:
    max-request: 1
  tags: token-spray,urlscan

self-contained: true

http:
  - raw:
      - |
        GET https://urlscan.io/user/quotas/ HTTP/1.1
        Host: urlscan.io
        Content-Type: application/json
        API-Key: {{token}}

    matchers:
      - type: word
        part: body
        words:
          - 'X-Rate-Limit-Scope:'
          - 'X-Rate-Limit-Limit:'
          - 'X-Rate-Limit-Remaining:'
        condition: and
