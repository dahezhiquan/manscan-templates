id: skycaiji-admin-panel

info:
  name: SkyCaiji Admin 面板识别（暴露面识别）
  author: princechaddha
  severity: info
  description: 该模板通过识别 SkyCaiji Admin 面板、控制台或管理界面的页面特征，判断目标是否暴露了对应服务入口。若命中，说明该后台或运维界面对外可访问，可用于资产识别与暴露面排查。
  classification:
    cvss-metrics: CVSS:3.0/AV:N/AC:L/PR:N/UI:N/S:U/C:N/I:N/A:N
    cwe-id: CWE-200
    cpe: cpe:2.3:a:skycaiji:skycaiji:*:*:*:*:*:*:*:*
  metadata:
    max-request: 1
    vendor: skycaiji
    product: skycaiji
  tags: panel,tech,skycaiji,discovery

http:
  - method: GET
    path:
      - "{{BaseURL}}/index.php?s=/admin/Index/index"

    matchers-condition: and
    matchers:
      - type: word
        part: body
        words:
          - '<p>Powered by <a href="https://www.skycaiji.com" target="_blank">'
          - '<a href="/index.php?s=/Admin/Index/find_password">'
        condition: and

      - type: status
        status:
          - 200

    extractors:
      - type: regex
        part: body
        group: 1
        regex:
          - 'com">SkyCaiji<\/a> ([A-Z0-9.]+) 后台管理<\/p>'
