id: apache-sparklighter-detect

info:
  name: Spark Lighter 指纹识别（指纹识别）
  author: icarot
  severity: info
  description: |-
    Spark Lighter 是 Web 应用或服务组件，用于对应业务功能或管理入口展示。该模板请求 `/lighter/api`，并依据 HTTP 200 状态码、favicon 哈希、页面标题、正文关键字或品牌资源特征识别目标是否使用或暴露了 Spark Lighter 相关组件，适用于资产盘点、技术栈识别和后续安全评估；命中结果仅表示指纹特征匹配，不代表已确认存在可利用漏洞。
  classification:
    cpe: cpe:2.3:a:apache:spark:*:*:*:*:*:*:*:*
  metadata:
    verified: true
    max-request: 1
    vendor: apache
    product: spark
    category: productivity
    shodan-query:
    - http.html:"/apps/imt/html/"
    - http.title:"spark master at"
    fofa-query:
    - title="spark master at"
    - body="/apps/imt/html/"
    google-query: intitle:"spark master at"
  tags: tech,lighter,spark,detect,apache,discovery

http:
  - method: GET
    path:
      - "{{BaseURL}}/lighter/api"

    matchers-condition: and
    matchers:
      - type: word
        part: body
        words:
          - '<title>Lighter</title>'
          - '/lighter/favicon.svg'
        condition: and

      - type: status
        status:
          - 200
