id: joplin-default-login

info:
  name: Joplin 默认口令登录（弱口令）
  author: pussycat0x
  severity: high
  description: |
    该模板通过尝试 Joplin 的默认凭据（如 admin@localhost:admin.），并依据认证成功后的响应特征判断目标是否仍在使用未修改的弱口令。若命中，攻击者可直接登录系统并访问相应管理功能或业务数据。
  metadata:
    verified: true
    shodan-query: 'title:"Joplin Server"'
    max-request: 1
  tags: joplin,oss,default-login,vuln

variables:
  username: admin@localhost
  password: admin

http:
  - raw:
      - |
        POST /api/sessions HTTP/1.1
        Host: {{Hostname}}
        Content-Type: application/json

        {
          "email": "{{username}}",
          "password": "{{password}}"
        }

    matchers:
      - type: dsl
        dsl:
          - 'status_code == 200'
          - 'contains_all(body,"user_id","id")'
          - 'contains(content_type,"application/json")'
        condition: and
