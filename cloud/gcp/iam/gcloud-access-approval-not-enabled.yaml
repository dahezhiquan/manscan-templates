id: gcloud-access-approval-not-enabled

info:
  name: 访问 Approval 未Enabled 中的GCP Projects（云安全）
  author: princechaddha
  severity: high
  description: Access Approval 可要求 Google 支持或运维人员访问客户内容前获得显式批准，未启用会降低对供应商访问路径的控制力。本模板对每个项目执行 access-approval settings get，并在 enrolledServices 返回 null 时报告 Access Approval 未启用。
  impact: |
    - 组织无法对 Google 人员访问受支持服务中的客户数据实施逐次审批和审计确认。
    - 对高敏感或强合规项目，缺少 Access Approval 会削弱第三方访问治理和事后追溯能力。
  remediation: |
    - 在需要人工审批的项目或组织范围启用 Access Approval，并按业务要求配置 enrolled services。
    - 指定审批人、通知渠道和审批流程，定期复核哪些项目必须启用该控制。
  reference:
    - https://cloud.google.com/access-approval/docs/quickstart
  metadata:
    vendor: google
    product: access-approval
  tags: cloud,devops,gcp,gcloud,google-cloud-platform,gcp-cloud-config

flow: |
  code(1)
  for(let projectId of iterate(template.projectIds)){
    set("projectId", projectId)
    code(2)
  }

self-contained: true

code:
  - engine:
      - sh
      - bash
    source: |
      gcloud projects list --format="json(projectId)"

    extractors:
      - type: json
        name: projectIds
        internal: true
        json:
          - '.[].projectId'

  - engine:
      - sh
      - bash
    source: |
      gcloud access-approval settings get --project $projectId --format="json(enrolledServices)"

    matchers:
      - type: word
        words:
          - 'null'

    extractors:
      - type: dsl
        dsl:
          - '"Access Approval not enabled in Project: " + projectId'
