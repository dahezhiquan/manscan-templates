id: airos-panel

info:
  name: AirOS 面板识别（暴露面识别）
  author: rxerium
  severity: info
  description: |
    该模板通过识别 AirOS 面板、控制台或管理界面的页面特征，判断目标是否暴露了对应服务入口。若命中，说明该后台或运维界面对外可访问，可用于资产识别与暴露面排查。
  classification:
    cpe: cpe:2.3:o:ui:airos:*:*:*:*:*:*:*:*
  metadata:
    verified: true
    max-request: 1
    vendor: ui
    product: airos
    shodan-query: "http.favicon.hash:-697231354"
  tags: airos,panel,discovery

http:
  - method: GET
    path:
      - "{{BaseURL}}/login.cgi?uri=/"

    matchers-condition: and
    matchers:
      - type: word
        part: body
        words:
          - 'airos_logo.png'

      - type: status
        status:
          - 200
