id: apache-cloudstack-detect

info:
  name: Apache CloudStack 指纹识别（指纹识别）
  author: pussycat0x
  severity: info
  description: Apache CloudStack 是云基础设施管理平台，用于虚拟机、网络、存储和多租户云资源编排。该模板请求首页，并依据 HTTP 200 状态码、页面标题、正文关键字或品牌资源特征识别目标是否使用或暴露了 Apache CloudStack 相关组件，适用于资产盘点、技术栈识别和后续安全评估；命中结果仅表示指纹特征匹配，不代表已确认存在可利用漏洞。
  classification:
    cpe: cpe:2.3:a:apache:cloudstack:*:*:*:*:*:*:*:*
  metadata:
    vendor: apache
    product: cloudstack
    shodan-query: http.title:"Apache CloudStack"
  tags: tech,apache,cloudstack,discovery

http:
  - method: GET
    path:
      - "{{BaseURL}}"

    host-redirects: true

    matchers-condition: and
    matchers:
      - type: word
        part: body
        words:
          - "<title>Apache CloudStack</title>"

      - type: status
        status:
          - 200
