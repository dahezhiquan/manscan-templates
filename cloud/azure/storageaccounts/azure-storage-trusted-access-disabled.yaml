id: azure-storage-trusted-access-disabled
info:
  name: Azure Storage Trusted Microsoft Services 访问未启用（云安全）
  author: princechaddha
  severity: medium
  description: Azure Storage 的 networkRuleSet.bypass 为 None 时，受信任的 Microsoft 服务不会获得绕过存储防火墙的例外。本模板枚举存储账户并查询该字段，在返回 None 时报告未启用 Trusted Microsoft Services 访问；这不是必然漏洞，是否应放开取决于备份、监控、部署等 Azure 服务的实际依赖。
  impact: |
    - 依赖受信任 Azure 服务访问存储账户的备份、监控或自动化任务可能失败，造成日志缺失、备份中断或部署异常。
    - 团队为绕过访问失败而直接放开公网网络或扩大防火墙规则，可能反而增加存储数据和管理接口的暴露面；若无此类依赖，保持 None 反而更符合最小暴露原则。
  remediation: |
    - 先盘点确需访问该账户的 Azure 服务；有明确依赖时将 bypass 设置为 AzureServices，并保留 defaultAction、IP 规则和身份权限限制。
    - 没有受信任服务依赖时保留 None，记录业务基线和例外理由，避免为了通过检查而扩大公网或网络访问范围。
  reference:
    - https://docs.microsoft.com/en-us/azure/storage/common/storage-network-security
  metadata:
    vendor: microsoft
    product: azure-storage
  tags: cloud,devops,azure,microsoft,storage,azure-cloud-config

flow: |
  code(1);
  for (let StorageAccountData of iterate(template.storageAccounts)) {
    StorageAccountData = JSON.parse(StorageAccountData);
    set("name", StorageAccountData.Name);
    code(2);
  }

self-contained: true
code:
  - engine:
      - sh
      - bash
    source: |
      az storage account list --query '[*].{"Name":name}'

    extractors:
      - type: json
        name: storageAccounts
        internal: true
        json:
          - '.[]'

  - engine:
      - sh
      - bash
    source: |
      az storage account show --name "$name" --query 'networkRuleSet.bypass' --output json

    matchers:
      - type: word
        words:
          - 'None'

    extractors:
      - type: dsl
        dsl:
          - 'name + " does not have trusted Microsoft services access enabled"'
