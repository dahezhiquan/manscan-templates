id: cheatsh-detect

info:
  name: cheat.sh Instance - 识别（暴露面识别）
  author: ritikchaddha
  severity: info
  description: |
    该模板用于识别 cheat.sh Instance 是否存在对外暴露的管理、服务或状态界面。若命中，说明目标公开了相关功能入口，可作为资产盘点与攻击面收敛的依据。
  reference:
    - https://github.com/chubin/cheat.sh
    - https://cheat.sh/
  metadata:
    verified: true
    max-request: 1
    product: cheat.sh
    vendor: chubin
    fofa-query: title="cheat.sh"
    shodan-query: title:"cheat.sh"
  tags: tech,cheatsh,detection,devtools

http:
  - method: GET
    path:
      - "{{BaseURL}}/"

    matchers-condition: and
    matchers:
      - type: word
        part: body
        words:
          - "cheat.sh"
          - "curl cheat.sh"
        condition: or

      - type: word
        part: body
        words:
          - ":firstpage"
          - "cht.sh"
          - "/files/style.css"
        condition: or

      - type: status
        status:
          - 200
