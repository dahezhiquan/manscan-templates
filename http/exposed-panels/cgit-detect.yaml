id: cgit-detect

info:
  name: cgit Web Interface - 识别（指纹识别）
  author: ritikchaddha
  severity: info
  description: |-
    检测到目标站点存在 cgit Web Interface 相关响应特征。cgit Web Interface 是代码仓库 Web 浏览或版本管理平台，用于查看仓库、提交、分支、代码内容和协作信息。模板请求 `/`、`/cgit/` 路径，并通过页面标题或正文关键字、状态码确认该系统指纹，用于资产识别、系统盘点和暴露面梳理。
  reference:
    - https://git.zx2c4.com/cgit/about/
    - https://wiki.archlinux.org/title/Cgit
  metadata:
    max-request: 1
    verified: true
    product: cgit
    vendor: zx2c4
    shodan-query: http.html:"cgit"
    fofa-query: body="cgit"
    google-query: intext:"generated by cgit"
  tags: tech,cgit,git,detect
http:
  - method: GET
    path:
      - "{{BaseURL}}/"
      - "{{BaseURL}}/cgit/"

    redirects: true

    matchers-condition: and
    matchers:
      - type: word
        part: body
        words:
          - "cgit"
          - "generated by"
        condition: and

      - type: word
        part: body
        words:
          - "repository list"
          - "class='list nowrap'"
          - "id='cgit'"
          - "cgit.css"
        condition: or

      - type: status
        status:
          - 200

    extractors:
      - type: regex
        name: detected_version
        part: body
        group: 1
        regex:
          - (?i)\bcgit v([0-9]+(?:[.][0-9]+)+(?:[-+._][0-9A-Za-z]+)*)(?:<|["\x27\s])
        internal: true
      - type: dsl
        dsl:
          - 'regex("^[0-9]+(?:[.][0-9]+)*(?:[-+._][0-9A-Za-z]+)*$", detected_version) ? detected_version : ""'
