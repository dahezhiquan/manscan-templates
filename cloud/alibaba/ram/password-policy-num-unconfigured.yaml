id: password-policy-num-unconfigured

info:
  name: 阿里云 RAM 密码未要求包含数字（云安全）
  author: DhiyaneshDK
  severity: medium
  description: RAM 密码策略未要求数字会降低密码复杂度，使控制台密码更容易被猜测。模板调用 GetPasswordPolicy，当 RequireNumbers 为 false 时判定密码策略未要求包含数字。
  impact: |
    - 密码复杂度不足会增加暴力破解、字典攻击和撞库风险。
    - 对高权限 RAM 用户而言，弱密码策略可能演变为云资源越权访问入口。
  remediation: |
    - 在 RAM 密码策略中启用 RequireNumbers。
    - 配合 MFA、登录失败限制和密码复用限制，降低单一密码被攻破后的影响。
  reference:
    - https://www.alibabacloud.com/help/en/ram/user-guide/configure-a-password-policy-for-ram-users
    - https://www.trendmicro.com/cloudoneconformity/knowledge-base/alibaba-cloud/AlibabaCloud-RAM/require-number-password-policy.html
  metadata:
    max-request: 1
    verified: true
    vendor: alibaba
    product: ram
  tags: cloud,devops,aliyun,alibaba,alibaba-cloud-config,alibaba-ram

variables:
  region: "cn-hangzhou"

self-contained: true

code:
  - engine:
      - sh
      - bash
    source: |
      aliyun ram GetPasswordPolicy --region $region

    matchers:
      - type: word
        name: policy
        words:
          - '"RequireNumbers": false'

    extractors:
      - type: dsl
        dsl:
          - '"RAM Password Policy Does not contain One Number "'
