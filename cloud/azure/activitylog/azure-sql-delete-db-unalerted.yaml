id: azure-sql-delete-db-unalerted
info:
  name: Azure SQL 数据库删除告警未配置（云安全）
  author: princechaddha
  severity: high
  description: Azure SQL 数据库删除操作未配置 Activity Log 告警时，数据库被误删或被滥用权限删除可能无法及时发现。该模板枚举已启用的 Activity Log Alert，并检查 condition 是否缺少 Microsoft.Sql/servers/databases/delete 操作条件。
  impact: |
    - 删除数据库会直接造成业务中断，并可能导致未备份的数据永久丢失。
    - 缺少删除告警会延迟隔离被盗用的管理身份和启动恢复流程。
  remediation: |
    - 创建针对 SQL 数据库删除操作的 Activity Log Alert，并绑定数据库应急响应 Action Group。
    - 启用备份、删除保护和恢复演练，限制数据库删除权限并对高风险操作实施审批。
  reference:
    - https://docs.microsoft.com/en-us/azure/azure-monitor/platform/alerts-activity-log
  metadata:
    vendor: microsoft
    product: azure-monitor
  tags: cloud,devops,azure,microsoft,sql-database,azure-cloud-config

flow: |
  code(1);
  for (let AlertData of iterate(template.alertList)) {
    set("id", AlertData);
    code(2);
  }

self-contained: true
code:
  - engine:
      - sh
      - bash
    source: |
      az monitor activity-log alert list --output json --query '[?(enabled==`true`)].id'

    extractors:
      - type: json
        name: alertList
        internal: true
        json:
          - '.[]'

  - engine:
      - sh
      - bash
    source: |
      az monitor activity-log alert show --ids "$id" --query 'condition'

    matchers-condition: and
    matchers:
      - type: word
        words:
          - '"field": "operationName"'

      - type: word
        words:
          - "Microsoft.Sql/servers/databases/delete"
        negative: true

    extractors:
      - type: dsl
        dsl:
          - 'id + " does not have the correct alert configuration for Delete Azure SQL Database events"'
