id: tools4ever-ssrpm-panel

info:
  name: Tools4Ever Self-Service Reset Password Manager 面板识别（指纹识别）
  severity: info
  author: darses
  description: |-
    Tools4Ever Self-Service Reset Password Manager 是自助密码重置平台，用于用户身份验证、密码重置和账号解锁流程。该模板请求首页，并依据 HTTP 200 状态码、页面标题、正文关键字或品牌资源特征识别目标是否部署了该系统或暴露了对应入口，适用于资产指纹确认；命中结果仅表示系统特征匹配，不代表已确认存在未授权访问或可利用漏洞。
  metadata:
    vendor: tools4ever
    product: self_service_reset_password_management
    shodan-query:
    - http.favicon.hash:-948009664
    - http.favicon.hash:-916902413
    - "Set-Cookie: .SSRPMFORMSAUTH=;"
    fofa-query:
    - icon_hash="-948009664"
    - icon_hash="-916902413"
    - "Set-Cookie: .SSRPMFORMSAUTH=;"
  reference:
  - https://www.tools4ever.com/ssrpm/
  tags: detect,panel,tools4ever,discovery

http:
  - method: GET
    path:
      - "{{BaseURL}}"

    matchers-condition: and
    matchers:
      - type: status
        status:
          - 200

      - type: word
        part: body
        words:
          - "ssrpmbody"
          - "/Scripts/CommonFunctions.js"
        condition: and

    extractors:
      - type: regex
        name: version
        group: 1
        regex:
          - '/Scripts/CommonFunctions\.js\?v=([\d]+)'
