id: xds-amr-xamr-status

info:
  name: XDS-AMR Status 面板识别（指纹识别）
  author: pussycat0x
  severity: info
  description: XDS-AMR Status 是设备或通信系统状态页面，用于展示 XDS-AMR 服务、连接和运行状态。该模板请求 `/login.php`，并依据 HTTP 200 状态码、页面标题、正文关键字或品牌资源特征识别目标是否部署了该系统或暴露了对应入口，适用于资产指纹确认；命中结果仅表示系统特征匹配，不代表已确认存在未授权访问或可利用漏洞。
  classification:
    cvss-metrics: CVSS:3.0/AV:N/AC:L/PR:N/UI:N/S:U/C:N/I:N/A:N
    cwe-id: CWE-200
  metadata:
    max-request: 1
    shodan-query: http.title:"XDS-AMR - status"
  tags: panel,tech,xamr,xds,discovery

http:
  - method: GET
    path:
      - "{{BaseURL}}/login.php"

    matchers-condition: and
    matchers:
      - type: word
        part: body
        words:
          - '<title>XDS-AMR - Status</title>'

      - type: status
        status:
          - 200

    extractors:
      - type: regex
        part: body
        regex:
          - 'XAMR\-([0-9]+)'
