id: api-orbintelligence

info:
  name: ORB Intelligence API Token 可用性校验（token喷洒）
  author: daffainfo
  severity: info
  description: 该模板通过调用 ORB Intelligence API 的已知接口验证提供的 token 是否有效，命中后通常表示可访问相关 API 能力。
  reference:
    - https://api.orb-intelligence.com/docs/
    - https://github.com/daffainfo/all-about-apikey/tree/main/orb-intelligence
  metadata:
    max-request: 1
  tags: token-spray,orbintelligence

self-contained: true

http:
  - method: GET
    path:
      - "https://api.orb-intelligence.com/3/fetch/1/?api_key={{token}}"

    matchers:
      - type: word
        part: body
        words:
          - '"entity_type":'
          - '"company_status":'
          - '"orb_num":'
        condition: and
