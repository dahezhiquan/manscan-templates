id: mystic-stealer

info:
  name: Mystic Stealer 面板识别（指纹识别）
  author: pussycat0x
  severity: info
  description: |
    该模板通过识别 Mystic Stealer 相关页面或响应特征，判断目标是否暴露了疑似 C2、窃密或钓鱼基础设施面板。若命中，可作为外部暴露面排查、威胁狩猎与恶意基础设施识别的线索。
  metadata:
    verified: "true"
    max-request: 1
    shodan-query: http.title:"Mystic Stealer"
  tags: tech,rat,mystic-stealer,c2,panel,vuln

http:
  - method: GET
    path:
      - "{{BaseURL}}"

    host-redirects: true
    matchers:
      - type: dsl
        dsl:
          - "status_code == 200 && contains(body, 'Mystic Stealer')"
        condition: and
