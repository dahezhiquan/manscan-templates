id: azuracast-installer

info:
  name: AzuraCast 未完成安装ation
  author: DhiyaneshDk
  severity: high
  description: |
    检测到 AzuraCast 未完成安装ation。该页面属于安装、初始化或配置向导流程，若对外暴露，攻击者可能完成初始化、创建管理员账户或重新配置目标系统。
  reference:
    - https://github.com/AzuraCast/AzuraCast
    - https://docs.azuracast.com/en/getting-started/installation
  metadata:
    verified: true
    max-request: 1
    shodan-query: html:"Set Up AzuraCast"
  tags: misconfig,azuracast,exposure,unauth

http:
  - method: GET
    path:
      - "{{BaseURL}}/setup/register"

    matchers-condition: and
    matchers:
      - type: word
        words:
          - "Set Up AzuraCast"
          - "SetupRegister"
        condition: and

      - type: status
        status:
          - 200
