id: apache-hive-detect

info:
  name: Apache Hive 指纹识别（指纹识别）
  author: icarot
  severity: info
  description: |-
    Apache Hive 是数据仓库系统，用于在 Hadoop 生态中执行 SQL 查询和管理大数据表。该模板请求首页，并依据 HTTP 200 状态码、页面标题、正文关键字或品牌资源特征识别目标是否使用或暴露了 Apache Hive 相关组件，适用于资产盘点、技术栈识别和后续安全评估；命中结果仅表示指纹特征匹配，不代表已确认存在可利用漏洞。
  reference:
  - https://github.com/apache/hive
  classification:
    cpe: cpe:2.3:a:apache:hive:4.6.0:*:*:*:*:*:*:*
  metadata:
    verified: true
    max-request: 1
    vendor: apache
    product: hive
    shodan-query: title:"HiveServer2"
  tags: tech,apache,hive,detect,discovery

http:
  - method: GET
    path:
      - "{{BaseURL}}"

    matchers-condition: and
    matchers:
      - type: word
        part: body
        words:
          - '<title>HiveServer2</title>'
          - 'hiveserver2'
        condition: and

      - type: status
        status:
          - 200

    extractors:
      - type: regex
        name: version
        group: 1
        part: body
        regex:
          - "<td>([0-9]{1,3}\\.[0-9]{1,3}\\.[0-9]{1,3}), \\S+</td>\\n\\s+<td>Hive version and revision</td>"
