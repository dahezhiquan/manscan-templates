id: onlyoffice-login-panel

info:
  name: ONLYOFFICE 登录面板识别（指纹识别）
  author: eremit4
  severity: info
  description: |
    该模板通过识别 ONLYOFFICE 登录入口的页面标题、特征文本或重定向行为，判断目标是否暴露了对应的认证界面。若命中，说明该登录面板对外可访问，可用于暴露面梳理与后续安全评估。
  classification:
    cpe: cpe:2.3:a:onlyoffice:onlyoffice:*:*:*:*:*:*:*:*
  metadata:
    verified: true
    max-request: 2
    vendor: onlyoffice
    product: onlyoffice
    fofa-query:
      - app="ONLYOFFICE" && (icon_hash="1928933157" || icon_hash="826083956" || icon_hash="-1380930248" || icon_hash="-285544629" || icon_hash="812741391")
      - app="onlyoffice" && (icon_hash="1928933157" || icon_hash="826083956" || icon_hash="-1380930248" || icon_hash="-285544629" || icon_hash="812741391")
  tags: panel,onlyoffice,detect,discovery

http:
  - method: GET
    path:
      - "{{BaseURL}}"
      - "{{BaseURL}}/auth.aspx"

    stop-at-first-match: true
    host-redirects: true
    max-redirects: 2
    matchers-condition: and
    matchers:
      - type: word
        part: body
        words:
          - 'ONLYOFFICE'
          - 'title="ONLYOFFICE'
          - 'content="ONLYOFFICE'
          - '/images/onlyoffice_logo/'
          - 'alt="ONLYOFFICE'
        condition: or

      - type: status
        status:
          - 200
