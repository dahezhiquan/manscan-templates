id: flask-redis-docker

info:
  name: Flask Redis Queue Docker 暴露
  author: DhiyaneshDk
  severity: low
  description: |
    检测到 Flask Redis Queue Docker 暴露。目标响应或文件中可能暴露配置、凭据、密钥、令牌、环境变量或历史记录等敏感信息，可能被用于进一步入侵。
  reference:
    - https://www.facebook.com/photo/?fbid=623621413141715&set=a.467014098802448
  metadata:
    verified: true
    max-request: 1
    shodan-query: title:"Flask + Redis Queue + Docker"
  tags: misconfig,exposure,flask,redis,docker,vuln

http:
  - method: GET
    path:
      - "{{BaseURL}}"

    host-redirects: true
    max-redirects: 2

    matchers-condition: and
    matchers:
      - type: word
        part: body
        words:
          - '<title>Flask + Redis Queue + Docker</title>'

      - type: status
        status:
          - 200
