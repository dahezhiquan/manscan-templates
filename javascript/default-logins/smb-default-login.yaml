id: smb-default-login

info:
  name: SMB 默认凭据爆破（服务漏洞）
  author: pussycat0x
  severity: high
  description: |
    目标 SMB 服务接受常见默认账号口令，攻击者可能据此访问文件共享或域内资源。模板按用户名与密码字典组合发起 SMB 登录，并以认证成功作为弱凭据验证依据。
  impact: |
    - 攻击者可使用默认或弱凭据访问 SMB 共享，读取、写入或删除共享文件。
    - 在域环境中，泄露的共享内容可能包含脚本、配置、备份或凭据，扩大横向移动风险。
  remediation: |
    - 更改默认 SMB/本地/域账户口令，禁用不必要账户并清理共享测试凭据。
    - 对 SMB 共享实施最小权限、访问审计和登录失败告警，避免 445 端口暴露到不可信网络。
  reference:
    - https://nmap.org/nsedoc/scripts/smb-brute.html
  classification:
    cwe-id: CWE-521
  metadata:
    verified: true
    max-request: 9
    shodan-query: "port:445"
  tags: js,network,smb,enum,default,bruteforce,discovery

javascript:
  - pre-condition: |
      isPortOpen(Host,Port);
    code: |
      var m = require("nuclei/smb");
      var c = new m.SMBClient();
      var response = c.ListShares(Host, Port, User, Pass);
      response;

    args:
      Host: "{{Host}}"
      Port: "445"
      User: "{{usernames}}"
      Pass: "{{passwords}}"

    attack: clusterbomb
    payloads:
      usernames:
        - 'admin'
        - 'administrator'
        - 'guest'
      passwords:
        - 'admin'
        - 'password'
        - 'guest'

    stop-at-first-match: true
    matchers:
      - type: dsl
        dsl:
          - 'response != "[]"'
          - 'success == true'
        condition: and
