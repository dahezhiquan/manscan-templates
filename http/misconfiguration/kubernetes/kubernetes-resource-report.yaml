id: kubernetes-resource-report

info:
  name: 检测 Overview Kubernetes Resource 仓库rt
  author: pussycat0x
  severity: medium
  description: |
    检测到 检测 Overview Kubernetes Resource 仓库rt。目标响应或文件中可能暴露配置、凭据、密钥、令牌、环境变量或历史记录等敏感信息，可能被用于进一步入侵。
  metadata:
    max-request: 1
  tags: kubernetes,exposure,misconfig,vuln

http:
  - method: GET
    path:
      - "{{BaseURL}}"

    matchers-condition: and
    matchers:
      - type: word
        part: body
        words:
          - "Overview - Kubernetes Resource Report"

      - type: status
        status:
          - 200
