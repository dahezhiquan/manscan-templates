id: current-phish

info:
  name: Current 仿冒钓鱼网站（钓鱼网站识别）
  author: rxerium
  severity: info
  description: |
    检测到疑似仿冒 Current 的钓鱼网站。模板在目标页面返回 200、页面内容命中 Current 的金融或支付页面特征，且当前主机不属于 current.com 官方域名时触发，用于识别借用 Current 品牌页面诱导用户信任的仿冒站点。
  reference:
    - https://current.com
  metadata:
    max-request: 1
  tags: phishing,current,fintech,osint,discovery
http:
  - method: GET
    path:
      - "{{BaseURL}}"

    host-redirects: true
    max-redirects: 2

    matchers-condition: and
    matchers:
      - type: word
        words:
          - 'Current'
          - 'Mobile banking done better. Build credit while you bank. No overdraft fees/hidden fees. Current is a fintech not a bank. Banking services provided by Choice Financial Group, Member FDIC, and Cross River Bank, Member FDIC.'
        condition: and

      - type: status
        status:
          - 200

      - type: dsl
        dsl:
          - '!contains(host,"current.com")'
