id: wp-sfwd-lms-listing

info:
  name: WordPress Plugin Sfwd-lms Listing
  author: pussycat0x
  severity: info
  description: WordPress Plugin Sfwd-lms Listing 存在安全漏洞。该模板依据实际请求路径、返回特征与命中证据验证目标是否暴露相应漏洞。
  reference:
    - https://www.exploit-db.com/ghdb/6426
  metadata:
    max-request: 1
  tags: wordpress,listing,plugin,edb,vuln

http:
  - method: GET
    path:
      - "{{BaseURL}}/wp-content/plugins/sfwd-lms/"

    matchers-condition: and
    matchers:
      - type: word
        words:
          - "Index of"
          - "wp-content/plugins/sfwd-lms"
        condition: and

      - type: status
        status:
          - 200
