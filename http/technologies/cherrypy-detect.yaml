id: cherrypy-detect

info:
  name: CherryPy Web 服务器指纹识别（指纹识别）
  author: Shivam Kamboj
  severity: info
  description: |
    用于识别目标是否部署 CherryPy Web 服务器 并提取相关版本或构建信息，模板会结合 HTTP 响应头、特定路径或已知端点和版本或标识提取结果进行指纹匹配。
  reference:
    - https://cherrypy.dev/
  metadata:
    verified: true
    max-request: 1
    shodan-query: http.component:"cherrypy"
  tags: tech,cherrypy,detect,discovery

http:
  - method: GET
    path:
      - "{{BaseURL}}"

    matchers:
      - type: dsl
        dsl:
          - 'contains(header, "Server: CherryPy")'

    extractors:
      - type: regex
        name: cherrypy_version
        part: header
        group: 1
        regex:
          - 'CherryPy/([0-9.]+)'
