id: uipath-orchestrator-panel

info:
  name: UiPath Orchestrator 登录面板识别（指纹识别）
  author: righettod
  severity: info
  description: |
    该模板通过识别 UiPath Orchestrator 登录入口的页面标题、特征文本或重定向行为，判断目标是否暴露了对应的认证界面。若命中，说明该登录面板对外可访问，可用于暴露面梳理与后续安全评估。
  reference:
    - https://www.uipath.com/
  classification:
    cpe: cpe:2.3:a:uipath:orchestrator:*:*:*:*:*:*:*:*
  metadata:
    verified: true
    max-request: 1
    vendor: uipath
    product: orchestrator
    shodan-query: http.title:"UiPath Orchestrator"
  tags: panel,uipath,login,detect,discovery

http:
  - method: GET
    path:
      - "{{BaseURL}}/Account/Login"

    matchers:
      - type: dsl
        dsl:
          - 'status_code == 200'
          - 'contains(to_lower(body), "<title>uipath orchestrator")'
        condition: and

    extractors:
      - type: regex
        part: body
        group: 1
        regex:
          - '\?(?:version|v)=([0-9.]+)'
