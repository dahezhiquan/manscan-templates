id: tutanota-phish

info:
  name: Tutanota 仿冒钓鱼网站（钓鱼网站识别）
  author: rxerium
  severity: high
  description: |
    Tutanota 是面向加密邮箱和隐私通信的服务品牌，通常承载邮箱账号、联系人、恢复信息和通信内容。该模板用于识别疑似仿冒 Tutanota 的钓鱼网站；模板访问目标站点首页，在目标页面返回 200 状态码，且页面内容命中 Tutanota 官方页面常见文案或标题特征（“<title>Tuta: Turn ON privacy for free with secure emails, ...”），且当前主机不属于 tutanota.com 等官方域名时触发。该类仿冒页面通常用于窃取安全服务账号、远程访问凭据、二次验证信息或 VPN 账号，可能削弱用户后续账号和设备保护能力。
  impact: |-
    - 用户可能在仿冒页面提交安全服务、远程访问、VPN 或二次验证相关凭据，导致账号保护能力被削弱、设备被远程接入或会话被接管。
    - 钓鱼站点可能被用于投递恶意链接、伪造登录流程或绕过用户对官方品牌的信任判断。
    - 品牌方或被仿冒组织可能面临客户投诉、欺诈交易、信誉受损以及后续应急处置成本。
  remediation: |-
    - 确认该站点是否为授权域名；若确认为仿冒站点，立即在网关、DNS、邮件安全和浏览器安全策略中阻断访问。
    - 向被仿冒品牌、托管商、注册商、CDN 和浏览器安全浏览服务提交滥用举报或下架请求。
    - 保留 URL、域名、解析记录、页面截图、证书和命中特征等证据，用于威胁情报关联和后续追踪。
    - 排查是否已有用户访问或提交信息；对疑似受影响账号执行密码重置、会话撤销、令牌轮换和多因素认证加固。
    - 复核安全服务账号、远程访问设备、受信任设备和二次验证绑定状态，必要时重新配置密钥、恢复码或 VPN 凭据。
  reference:
    - https://tutanota.com
  metadata:
    max-request: 1
  tags: phishing,tutanota,email,osint,discovery
http:
  - method: GET
    path:
      - "{{BaseURL}}"

    host-redirects: true
    max-redirects: 2

    matchers-condition: and
    matchers:
      - type: word
        words:
          - '<title>Tuta: Turn ON privacy for free with secure emails, calendars &amp; contacts | Tuta'

      - type: status
        status:
          - 200

      - type: dsl
        dsl:
          - '!contains(host,"tutanota.com")'
