id: ubiquiti-edgerouter-panel

info:
  name: Ubiquiti EdgeRouter - 登录面板（暴露面识别）
  author: rxerium
  severity: info
  description: |-
    Ubiquiti EdgeRouter 是一款企业级路由器，具备高级路由能力与 VPN 功能，运行基于 Vyatta 的 EdgeOS 固件。
  reference:
    - https://www.ui.com/edgemax/edgerouter/
  metadata:
    max-request: 1
    shodan-query: 'http.title:"EdgeOS"'
  tags: panel,ubiquiti,edgerouter,vpn,router

http:
  - method: GET
    path:
      - "{{BaseURL}}"
    matchers-condition: and
    matchers:
      - type: word
        words:
          - 'EdgeOS'
        part: body

      - type: status
        status:
          - 200
