id: dbgate-anonymous-access

info:
  name: 数据库Gate 匿名 访问 检测
  author: benharvey-sage
  severity: high
  description: |
    检测到 数据库Gate 匿名 访问 检测。目标功能在未认证状态下可访问，可能暴露管理入口、业务数据、系统状态或可执行操作，需确认是否存在访问控制缺失。
  reference:
    - https://github.com/dbgate/dbgate
    - https://dbgate.io/
    - https://docs.dbgate.io/
  classification:
    cwe-id: CWE-1188
  metadata:
    verified: true
    max-request: 1
    vendor: dbgate
    product: dbgate
    shodan-query:
      - http.title:"DbGate"
      - http.favicon.hash:-1320884137,1198579728,361029891,-1421367029,1377130137,-1258062033
  tags: misconfig,exposure,unauth,anonymous,dbgate

http:
  - raw:
      - |
        POST /auth/login HTTP/1.1
        Host: {{Hostname}}
        Content-Type: application/json

        {"amoid":"none"}

    matchers-condition: and
    matchers:
      - type: word
        part: body
        words:
          - '{"accessToken":"'

      - type: status
        status:
          - 200

    extractors:
      - type: json
        name: access_token
        part: body
        json:
          - '.accessToken'
