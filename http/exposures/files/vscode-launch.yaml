id: vscode-launch

info:
  name: Visual Studio Code launch.JSON 暴露（暴露面识别）
  author: DhiyaneshDK
  severity: low
  description: |
    检测到对外可访问的 Visual Studio Code launch.JSON。相关文件可能泄露项目结构、依赖关系、部署细节、敏感参数或其他不应公开的内部信息。
  reference:
    - https://code.visualstudio.com/docs/editor/debugging
  metadata:
    verified: true
    max-request: 1
    shodan-query: title:"index" html:".vscode"
  tags: vscode,files,debug,exposure,vuln

http:
  - method: GET
    path:
      - "{{BaseURL}}/.vscode/launch.json"

    matchers-condition: and
    matchers:
      - type: word
        part: body
        words:
          - '"version":'
          - '"configurations":'
        condition: and

      - type: word
        part: content_type
        words:
          - 'application/json'

      - type: status
        status:
          - 200
