id: lucy-admin-panel

info:
  name: Lucy Security 管理面板 指纹识别（指纹识别）
  author: ritikchaddha
  severity: info
  description: >-
    Lucy Security 是安全意识培训和钓鱼演练平台，管理面板用于配置演练、用户和报告。该模板通过请求目标服务并检查预设路径或首页响应、页面正文关键字、状态码等指纹特征，判断目标是否使用或暴露了
    Lucy Security 管理面板 相关组件；命中结果仅表示指纹特征匹配，可用于资产盘点、技术栈识别和后续安全评估，不代表已确认存在可利用漏洞。
  metadata:
    verified: true
    max-request: 2
    shodan-query: html:'title="Lucy'
  tags: tech,lucy,discovery
http:
  - method: GET
    path:
      - "{{BaseURL}}"
      - "{{BaseURL}}/admin/login"

    stop-at-first-match: true
    host-redirects: true
    max-redirects: 2

    matchers-condition: and
    matchers:
      - type: word
        part: body
        words:
          - 'title="Lucy"'
          - 'aria-label="Lucy'
        condition: or

      - type: status
        status:
          - 200
