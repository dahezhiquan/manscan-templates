id: unauthenticated-duplicator-disclosure

info:
  name: WordPress Duplicator Plugin - 信息泄露漏洞
  author: tess
  severity: medium
  description: WordPress Duplicator Plugin - Information disclosure 存在未授权访问漏洞。未授权访问者可获取配置、凭证、用户数据或系统元信息，从而为后续攻击提供情报支持。
  metadata:
    verified: true
    max-request: 2
  tags: wordpress,wp,wp-plugin,misconfig,disclosure,unauth,exposure,vuln

http:
  - method: GET
    path:
      - "{{BaseURL}}/wp-content/backups-dup-lite/tmp/"
      - "{{BaseURL}}/wp-content/backups-dup-lite"

    stop-at-first-match: true

    matchers-condition: and
    matchers:
      - type: word
        part: body
        words:
          - 'Index of /wp-content/backups-dup-lite/'

      - type: word
        part: header
        words:
          - 'text/html'

      - type: status
        status:
          - 200
