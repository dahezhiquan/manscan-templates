id: arthas-web-console

info:
  name: 阿里巴巴 Arthas Web 控制台 - 检测（指纹识别）
  author: wujiecong
  severity: info
  description: |-
    检测到阿里巴巴 Arthas Web 控制台界面。Arthas 是一款 Java 诊断工具，启用后可能会暴露基于 Web 的控制台。
  reference:
    - https://arthas.aliyun.com/doc/web-console.html
  metadata:
    verified: true
    max-request: 1
    vendor: alibaba
    product: arthas
    shodan-query: title:"Arthas Console"
    fofa-query: title="Arthas Console"
  tags: panel,arthas,alibaba,web-console,detect

http:
  - method: GET
    path:
      - "{{BaseURL}}/"

    matchers:
      - type: dsl
        dsl:
          - 'status_code == 200'
          - 'contains(body, "<title>Arthas Console</title>")'
        condition: and
