id: calendly-phish

info:
  name: Calendly 仿冒钓鱼网站（钓鱼网站识别）
  author: rxerium
  severity: info
  description: |
    检测到疑似仿冒 Calendly 的钓鱼网站。模板在目标页面返回 200、页面内容命中 Calendly 的官方服务页面特征，且当前主机不属于 calendly.com 官方域名时触发，用于识别借用 Calendly 品牌页面诱导用户信任的仿冒站点。
  reference:
    - https://calendly.com
  metadata:
    max-request: 1
  tags: phishing,calendly,scheduling,osint,discovery
http:
  - method: GET
    path:
      - "{{BaseURL}}"

    host-redirects: true
    max-redirects: 2

    matchers-condition: and
    matchers:
      - type: word
        words:
          - 'Calendly is the modern scheduling platform that makes “finding time” a breeze. When connecting is easy, your teams can get more done.'

      - type: status
        status:
          - 200

      - type: dsl
        dsl:
          - '!contains(host,"calendly.com")'
