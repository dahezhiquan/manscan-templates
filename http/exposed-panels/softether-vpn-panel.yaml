id: softether-vpn-panel

info:
  name: SoftEther VPN 面板识别（暴露面识别）
  author: bhutch
  severity: info
  description: |
    该模板通过识别 SoftEther VPN 面板、控制台或管理界面的页面特征，判断目标是否暴露了对应服务入口。若命中，说明该后台或运维界面对外可访问，可用于资产识别与暴露面排查。
  classification:
    cpe: cpe:2.3:a:softether:vpn:*:*:*:*:*:*:*:*
  metadata:
    verified: true
    max-request: 1
    vendor: softether
    product: vpn
    shodan-query: http.title:"SoftEther VPN Server"
  tags: panel,vpn,softether,discovery

http:
  - method: GET
    path:
      - "{{BaseURL}}"

    matchers-condition: and
    matchers:
      - type: word
        part: body
        words:
          - "<title>SoftEther VPN Server</title>"

      - type: status
        status:
          - 202
