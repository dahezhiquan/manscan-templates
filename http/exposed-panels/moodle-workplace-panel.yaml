id: moodle-workplace-panel

info:
  name: Moodle Workplace 登录面板识别（指纹识别）
  author: righettod
  severity: info
  description: |-
    检测到目标站点存在 Moodle Workplace 相关响应特征。Moodle Workplace 是内容管理、门户、电商或业务应用系统，用于维护站点内容、用户、插件、订单、权限和发布流程。模板请求 `/login/index.php`，并通过页面标题或正文关键字、状态码、DSL 条件确认该系统指纹，用于资产识别、系统盘点和暴露面梳理。
  reference:
    - https://moodle.com/solutions/workplace/
  classification:
    cpe: cpe:2.3:a:moodle:moodle:*:*:*:*:*:*:*:*
  metadata:
    verified: true
    max-request: 1
    vendor: moodle
    product: moodle
    shodan-query: http.html:"moodle"
  tags: panel,moodle,login,detect,discovery
http:
  - method: GET
    path:
      - "{{BaseURL}}/login/index.php"

    matchers:
      - type: dsl
        dsl:
          - 'status_code == 200'
          - 'contains_any(body, "content=\"moodle", "\"name\":\"moodle\"") && contains(body, "workplace")'
        condition: and
