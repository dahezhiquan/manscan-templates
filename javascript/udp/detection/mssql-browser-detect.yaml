id: mssql-browser-detect

info:
  name: MS-SQL Browser 服务识别（指纹识别）
  author: pussycat0x
  severity: info
  description: |
    SQL Server Browser 是 Microsoft SQL Server 的实例发现服务，用于帮助客户端定位命名实例、动态端口和数据库服务端点。该模板向 UDP 1434 发送 Browser 单播查询，并根据返回的 ServerName、InstanceName、Version 等字段确认 SQL Server Browser 服务指纹。仅当各有效实例披露同一 SQL Server 版本且字段无重复时输出版本；版本属于 SQL Server 实例，不代表 Browser 可执行文件自身版本。
  reference:
    - https://github.com/CiscoCXSecurity/udp-proto-scanner
    - https://learn.microsoft.com/en-us/sql/tools/configuration-manager/sql-server-browser-service
    - https://nmap.org/nsedoc/scripts/ms-sql-info.html
  metadata:
    verified: true
    max-request: 1
    shodan-query: port:1434
    vendor: microsoft
    product: mssql
  tags: mssql,microsoft,database,network,js,udp,detect

# 多实例版本不一致或字段缺失时仅识别服务，避免把任一实例版本绑定到整个 Browser 端点。
javascript:
  - code: |-
      const net = require('nuclei/net');
      const bytes = require('nuclei/bytes');
      let host = String(Host);
      if (host.indexOf(':') !== -1 && host.charAt(0) !== '[') host = '[' + host + ']';
      let conn;
      let result = {detected: false};
      try {
        conn = net.Open('udp', host + ':' + Port);
        conn.SetTimeout(3);
        conn.SendHex('02');
        const buffer = new bytes.Buffer();
        buffer.Write(conn.Recv(65535));
        const hex = buffer.Hex();
        function octet(i) { return parseInt(hex.substr(i * 2, 2), 16); }
        const length = octet(1) + octet(2) * 256;
        if (hex.substr(0, 2) === '05' && length > 0 && hex.length === (length + 3) * 2) {
          let text = '';
          for (let i = 3; i < length + 3; i++) text += String.fromCharCode(octet(i));
          const records = text.split(';;').filter(function(v) { return v.length > 0; });
          let version = '', complete = records.length > 0;
          for (const record of records) {
            const fields = record.split(';');
            let server = '', instance = '', current = '';
            const seen = {};
            let duplicate = false;
            for (let i = 0; i + 1 < fields.length; i += 2) {
              if (seen[fields[i]]) duplicate = true;
              seen[fields[i]] = true;
              if (fields[i] === 'ServerName') server = fields[i + 1];
              if (fields[i] === 'InstanceName') instance = fields[i + 1];
              if (fields[i] === 'Version') current = fields[i + 1];
            }
            if (server && instance) result.detected = true;
            if (duplicate || !server || !instance || !/^[0-9]+(?:\.[0-9]+){2,3}$/.test(current)) { complete = false; continue; }
            if (version && version !== current) complete = false;
            version = current;
          }
          if (complete && version) result.version = version;
        }
      } catch (e) {
        result = {detected: false};
      } finally {
        if (conn) conn.Close();
      }
      Export(JSON.stringify(result));
    args:
      Host: '{{Host}}'
      Port: 1434
    matchers:
      - type: dsl
        dsl:
          - success == true && contains(response, '"detected":true')
    extractors:
      - type: json
        name: version
        part: response
        json:
          - .version | select(type == "string") | select(test("^[0-9]+([.][0-9]+){2,3}$"))
