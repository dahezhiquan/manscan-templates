id: azure-mysql-db-update-unalerted
info:
  name: Azure MySQL 数据库创建或更新告警未配置（云安全）
  author: princechaddha
  severity: high
  description: MySQL 数据库创建或更新可能改变网络、认证、备份和参数配置；未配置 Activity Log 告警时，数据库控制面变更可能不被及时发现。该模板枚举已启用的 Activity Log Alert，并检查 condition 是否缺少 Microsoft.DBforMySQL/servers/databases/write 操作条件。
  impact: |
    - 未授权更新可能放宽数据库访问边界、关闭安全设置或改变备份策略。
    - 异常数据库资源创建可能增加数据泄露、资源滥用和成本失控风险。
  remediation: |
    - 创建针对 MySQL 数据库写入和更新操作的 Activity Log Alert，并接入变更审批流程。
    - 限制数据库管理权限，持续审计网络、身份、备份和参数组等高风险配置变更。
  reference:
    - https://docs.microsoft.com/en-us/azure/azure-monitor/platform/alerts-activity-log
  metadata:
    vendor: microsoft
    product: azure-monitor
  tags: cloud,devops,azure,microsoft,mysql,azure-cloud-config

flow: |
  code(1);
  for (let AlertData of iterate(template.alertList)) {
    set("id", AlertData);
    code(2);
  }

self-contained: true
code:
  - engine:
      - sh
      - bash
    source: |
      az monitor activity-log alert list --output json --query '[?(enabled==`true`)].id'

    extractors:
      - type: json
        name: alertList
        internal: true
        json:
          - '.[]'

  - engine:
      - sh
      - bash
    source: |
      az monitor activity-log alert show --ids "$id" --query 'condition'

    matchers-condition: and
    matchers:
      - type: word
        words:
          - '"field": "operationName"'

      - type: word
        words:
          - "Microsoft.DBforMySQL/servers/databases/write"
        negative: true

    extractors:
      - type: dsl
        dsl:
          - 'id + " does not have the correct alert configuration for Create/Update MySQL Database events"'
