id: wildcard-tls

info:
  name: 通配符 TLS 证书识别（证书安全）
  author: lucky0x0d
  severity: info
  description: 该模板检测证书的 CN 或 SAN 中是否包含通配符条目。命中说明同一证书可能被多个子域共用，需要结合部署边界评估私钥泄露和横向影响范围。
  reference:
    - https://cheatsheetseries.owasp.org/cheatsheets/Transport_Layer_Security_Cheat_Sheet.html#carefully-consider-the-use-of-wildcard-certificates
  metadata:
    max-request: 1
  tags: ssl,tls,wildcard,vuln
ssl:
  - address: "{{Host}}:{{Port}}"
    matchers:
      - type: dsl
        dsl:
          - wildcard_certificate == true

    extractors:
      - type: dsl
        dsl:
          - '"CN: " + subject_cn'
          - '" SAN: " + subject_an'
