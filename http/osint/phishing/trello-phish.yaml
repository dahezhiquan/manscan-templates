id: trello-phish

info:
  name: Trello 仿冒钓鱼网站（钓鱼网站识别）
  author: rxerium
  severity: info
  description: |
    检测到疑似仿冒 Trello 的钓鱼网站。模板在目标页面返回 200、页面内容命中 Trello 的品牌页面特征，且当前主机不属于 trello.com 官方域名时触发，用于识别借用 Trello 品牌页面诱导用户信任的仿冒站点。
  reference:
    - https://trello.com
  metadata:
    max-request: 1
  tags: phishing,trello,productivity,osint,discovery
http:
  - method: GET
    path:
      - "{{BaseURL}}"

    host-redirects: true
    max-redirects: 2

    matchers-condition: and
    matchers:
      - type: word
        words:
          - "Make the impossible, possible with Trello. The ultimate tool to boost your productivity. Escape the clutter and chaos—stay efficient with Inbox, Boards, and Planner from anywhere, even on mobile."

      - type: status
        status:
          - 200

      - type: dsl
        dsl:
          - '!contains(host,"trello.com")'
