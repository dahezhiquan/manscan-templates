id: havoc-c2-jarm

info:
  name: Havoc C2 JARM 识别（C2 识别）
  author: pussycat0x
  severity: high
  description: |
    Havoc 是现代后渗透 C2 框架，可用于团队服务器、植入管理和任务下发。该模板计算目标 TLS 服务的 JARM 指纹，并与已知 Havoc C2 指纹 `3fd21b20d00000021c43d21b21b43de0a012c76cf078b8d06f4620c2286f5e` 匹配，用于发现疑似 Havoc 基础设施。
  reference:
    - https://github.com/HavocFramework/Havoc
    - https://github.com/montysecurity/C2-Tracker
  metadata:
    verified: "true"
    max-request: 1
    shodan-query: 'ssl:postalCode=3540 ssl.jarm:3fd21b20d00000021c43d21b21b43de0a012c76cf078b8d06f4620c2286f5e'
  tags: jarm,c2,ir,osint,cti,havoc,network,tcp,vuln
tcp:
  - inputs:
      - data: 2E
        type: hex
    host:
      - "{{Hostname}}"
    matchers:
      - type: dsl
        dsl:
          - "jarm(Hostname) == '3fd21b20d00000021c43d21b21b43de0a012c76cf078b8d06f4620c2286f5e'"
