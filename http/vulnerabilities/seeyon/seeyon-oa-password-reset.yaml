id: seeyon-oa-password-reset
info:
  name: 致远 OA password-reset 接口 - 密码重置绕过漏洞
  author: Chaitin
  severity: high
  description: |
    该模板用于检测 致远 OA password-reset 接口 - 密码重置绕过漏洞。该类漏洞通常源于认证、授权或会话校验逻辑不完整，使未授权用户可访问受保护接口或执行敏感操作。模板会向 `/seeyon/rest/phoneLogin/phoneCode/resetPassword` 等位置发送探测请求，并结合响应状态、关键字、错误信息、时间差或外带交互等证据判断目标是否受影响。
  impact: |
    - 攻击者可绕过登录或权限限制，访问管理功能、敏感数据或业务操作接口。
    - 在管理接口暴露的场景下，可能进一步导致配置被篡改、账号被接管或系统被植入后门。
  remediation: |
    - 在服务端统一执行认证和授权校验，避免仅依赖前端控制或可预测参数。
    - 修复存在绕过问题的版本，并限制管理接口、调试接口和敏感 API 的访问来源。
    - 审计异常登录、权限变更和配置修改记录，轮换可能受影响的账号凭据。
  reference:
    - https://stack.chaitin.com/techblog/detail/153
  metadata:
    verified: true
    max-request: 1
    vuln-id: CT-868971
    vendor: seeyon
    product: oa
  tags: auth-bypass,vuln,seeyon
variables:
  s1: '{{to_lower(rand_text_alpha(8))}}'
http:
  - method: POST
    path:
      - '{{BaseURL}}/seeyon/rest/phoneLogin/phoneCode/resetPassword'
    redirects: false
    headers:
      Content-Type: application/json
    body: '{"loginName":"{{s1}}"}'
    matchers:
      - type: dsl
        dsl:
          - 'status_code == 500 && contains(body, ''"success" : false,'') && contains(body, ''"message" : null'') && !contains(body, ''非法操作'')'
