id: roundcube-log-disclosure

info:
  name: Roundcube Log 泄露（暴露面识别）
  author: dhiyaneshDk,kazet
  severity: medium
  description: 检测到可直接访问的 Roundcube Log。日志、异常页面或调试输出通常会泄露堆栈信息、内部路径、查询语句、账号标识、令牌片段或业务数据，不应向未授权用户开放。
  reference:
    - https://github.com/detectify/ugly-duckling/blob/master/modules/crowdsourced/roundcube-log-disclosure.json
  metadata:
    max-request: 16
  tags: exposure,logs,vuln

http:
  - method: GET
    path:
      - "{{BaseURL}}/{{roundcube_path}}"

    payloads:
      roundcube_path:
        - roundcube/logs/sendmail
        - roundcube/logs/sendmail.log
        - roundcube/logs/errors.log
        - roundcube/logs/errors
        - webmail/logs/sendmail
        - webmail/logs/sendmail.log
        - webmail/logs/errors.log
        - webmail/logs/errors
        - mail/logs/sendmail
        - mail/logs/sendmail.log
        - mail/logs/errors.log
        - mail/logs/errors
        - logs/sendmail
        - logs/sendmail.log
        - logs/errors.log
        - logs/errors
    max-size: 1000

    matchers-condition: and
    matchers:
      - type: word
        part: body
        words:
          - "IMAP Error:"
          - "Message for"
          - "DB Error:"
          - "PHP Error:"
          - "PHP Warning:"
        condition: or

      - type: status
        status:
          - 200

    extractors:
      - type: dsl
        dsl:
          - content_length
