id: fortinet-panel

info:
  name: Fortinet 登录面板识别（指纹识别）
  author: pikpikcu,daffainfo
  severity: info
  description: |-
    检测到目标站点存在 Fortinet 相关响应特征。Fortinet 是安全网关、防火墙、终端安全或安全管理平台，用于维护访问控制、威胁防护、策略配置、告警和设备状态。模板请求 `/`、`/login` 路径，并通过页面标题或正文关键字、状态码确认该系统指纹，用于资产识别、系统盘点和暴露面梳理。
  classification:
    cvss-metrics: CVSS:3.0/AV:N/AC:L/PR:N/UI:N/S:U/C:N/I:N/A:N
    cwe-id: CWE-200
    cpe: cpe:2.3:a:fortinet:fortiportal:*:*:*:*:*:*:*:*
  metadata:
    verified: true
    max-request: 2
    shodan-query: http.title:"FORTINET LOGIN"
    product: fortiportal
    vendor: fortinet
  tags: panel,fortinet,login,detect,discovery
http:
  - method: GET
    path:
      - "{{BaseURL}}"
      - "{{BaseURL}}/login"

    stop-at-first-match: true
    host-redirects: true
    max-redirects: 2

    matchers-condition: and
    matchers:
      - type: word
        part: body
        words:
          - 'FORTINET LOGIN</title>'

      - type: status
        status:
          - 200
