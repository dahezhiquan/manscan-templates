id: dom-xss

info:
  name: DOM 型跨站脚本 XSS（DAST）
  author: theamanrawat,AmirHossein Raeisi,dwisiswant0
  severity: medium
  description: |
    该模板检测 DOM 型跨站脚本（XSS）。当前端 JavaScript 将 URL、片段、存储或其他可控数据写入危险 DOM API 时，攻击者可在浏览器中执行脚本。
  impact: |
    攻击者可在受害者浏览器中执行恶意脚本，窃取会话、读取页面数据或代替用户发起操作。
  remediation: |
    对进入 DOM 的数据进行上下文编码与校验，避免使用 innerHTML、document.write 等危险 API 处理不可信输入。
  tags: xss,dom,dast,headless,vuln

variables:
  num: "{{rand_int(10000, 99999)}}"

headless:
  - steps:
      - action: navigate
        args:
          url: "{{BaseURL}}"

      - action: waitdialog
        name: reflected

    payloads:
      reflection:
        - "'\"><script>alert({{num}})</script>"

    fuzzing:
      - part: query
        type: postfix
        mode: single
        fuzz:
          - "{{url_encode(reflection)}}"

      - part: path
        type: postfix
        mode: single
        fuzz:
          - "{{reflection}}"

    stop-at-first-match: true
    matchers:
      - type: dsl
        dsl:
          - reflected == true
          - reflected_message == num
        condition: and
