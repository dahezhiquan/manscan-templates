id: mikrotik-ftp-server-detect

info:
  name: MikroTik FTP Server 识别（指纹识别）
  author: pussycat0x
  severity: info
  description: |
    MikroTik FTP Server 是 RouterOS 设备上的文件传输服务，常用于设备文件和配置维护。该模板连接 21/TCP 并读取协议响应，通过匹配 `MikroTik FTP` 等响应特征识别目标服务。
  metadata:
    verified: true
    max-request: 1
    shodan-query: product:"MikroTik router ftpd"
  tags: network,ftp,mikrotik,router,detect,tcp,discovery
tcp:
  - inputs:
      - data: "\n"
    host:
      - "{{Hostname}}"
    port: 21

    matchers:
      - type: word
        part: body
        words:
          - "MikroTik FTP"

    extractors:
      - type: regex
        regex:
          - "MikroTik ([0-9.]+)"
