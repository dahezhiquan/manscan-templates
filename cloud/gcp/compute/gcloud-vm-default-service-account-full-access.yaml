id: gcloud-vm-default-service-account-full-access

info:
  name: VM Instance Using Default Service Account 使用Full API 访问（云安全）
  author: princechaddha
  severity: medium
  description: 虚拟机使用默认 Compute Engine 服务账号并授予 cloud-platform 全访问范围时，实例上的代码或被入侵进程可调用广泛 Google Cloud API。本模板检查实例 serviceAccounts 配置，同时匹配默认服务账号和 cloud-platform scope 时报告过度授权。
  impact: |
    - 攻击者一旦获得实例执行权限或元数据令牌，可能借助默认服务账号访问多个云服务和项目资源。
    - 默认身份难以体现具体业务职责，增加最小权限治理、审计归因和横向移动控制难度。
  remediation: |
    - 为 VM 绑定专用服务账号，只授予业务所需 IAM 角色，并避免使用 cloud-platform 全访问 scope。
    - 迁移现有实例后复核元数据服务访问、服务账号权限和日志，轮换可能被滥用的凭据。
  reference:
    - https://www.trendmicro.com/cloudoneconformity/knowledge-base/gcp/ComputeEngine/default-service-accounts-with-full-access-in-use.html
    - https://cloud.google.com/compute/docs/access/service-accounts
  metadata:
    vendor: google
    product: compute-engine
  tags: cloud,devops,gcp,gcloud,compute,security,iam,service-account,gcp-cloud-config

flow: |
  code(1)
  for(let projectId of iterate(template.projectIds)){
    set("projectId", projectId)
    code(2)
    for(let instance of iterate(template.instances)){
      instance = JSON.parse(instance)
      set("instanceName", instance.name)
      set("zone", instance.zone)
      code(3)
    }
  }

self-contained: true

code:
  - engine:
      - sh
      - bash
    source: |
      gcloud projects list --format="json(projectId)"

    extractors:
      - type: json
        name: projectIds
        internal: true
        json:
          - '.[].projectId'

  - engine:
      - sh
      - bash
    source: |
      gcloud compute instances list --project $projectId --format="json(name,zone.basename())"

    extractors:
      - type: json
        name: instances
        internal: true
        json:
          - '.[]'

  - engine:
      - sh
      - bash
    source: |
      gcloud compute instances describe $instanceName --zone $zone --project $projectId --format="json(serviceAccounts[].email,serviceAccounts[].scopes[])"

    matchers:
      - type: word
        words:
          - "compute@developer.gserviceaccount.com"
          - "https://www.googleapis.com/auth/cloud-platform"
        condition: and

    extractors:
      - type: dsl
        dsl:
          - '"VM instance " + instanceName + " in zone " + zone + " of project " + projectId + " is using the default Compute Engine service account with full API access"'
