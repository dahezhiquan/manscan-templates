id: dkron-detect

info:
  name: Dkron 指纹识别（指纹识别）
  author: icarot
  severity: info
  description: |-
    Dkron 是分布式任务调度系统，用于定时任务、节点执行和任务编排。该模板请求 `/ui/`，并依据 HTTP 200 状态码、页面标题、正文关键字或品牌资源特征识别目标是否使用或暴露了 Dkron 相关组件，适用于资产盘点、技术栈识别和后续安全评估；命中结果仅表示指纹特征匹配，不代表已确认存在可利用漏洞。
  reference:
  - https://github.com/distribworks/dkron/
  metadata:
    verified: true
    fofa-query: title="DKRON"
    shodan-query: title:"DKRON"
  tags: tech,dkron,detect,discovery

http:
  - method: GET
    path:
      - "{{BaseURL}}/ui/"

    matchers-condition: and
    matchers:
      - type: word
        words:
          - '<title>Dkron</title>'

      - type: status
        status:
          - 200
