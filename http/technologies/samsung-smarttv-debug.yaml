id: samsung-smarttv-debug

info:
  name: Samsung SmartTV Debug Config 指纹识别（指纹识别）
  author: pussycat0x
  severity: info
  description: >-
    Samsung SmartTV Debug Config 是三星智能电视调试配置相关接口或页面，用于设备调试和开发诊断场景。该模板通过请求目标服务并检查预设路径或首页响应、页面正文关键字、状态码等指纹特征，判断目标是否使用或暴露了
    Samsung SmartTV Debug Config 相关组件；命中结果仅表示指纹特征匹配，可用于资产盘点、技术栈识别和后续安全评估，不代表已确认存在可利用漏洞。
  classification:
    cpe: cpe:2.3:o:samsung:nt14u_firmware:*:*:*:*:*:*:*:*
  metadata:
    verified: true
    max-request: 1
    vendor: samsung
    product: nt14u_firmware
    shodan-query: title:"Debug Config"
  tags: samsung,tech,iot,discovery
http:
  - method: GET
    path:
      - '{{BaseURL}}'

    matchers-condition: and
    matchers:
      - type: word
        words:
          - '<title>Debug Config</title>'
          - 'MultiScreen Service'
        condition: and

      - type: status
        status:
          - 200
