id: dell-idrac6-detect

info:
  name: Dell iDRAC6 指纹识别（指纹识别）
  author: kophjager007,0x_Akoko
  severity: info
  description: |-
    Dell iDRAC6 是 Dell 服务器带外管理控制器，用于硬件状态、远程控制台和电源管理。该模板请求 `/data?get=prodServerGen`，并依据 DSL 条件识别目标是否使用或暴露了 Dell iDRAC6 相关组件，适用于资产盘点、技术栈识别和后续安全评估；命中结果仅表示指纹特征匹配，不代表已确认存在可利用漏洞。
  reference:
  - https://www.dell.com/support/manuals/en-us/idrac6-monolithic-v1.9/idrac_1.95_ug
  metadata:
    max-request: 1
    verified: true
  tags: tech,dell,idrac,discovery

http:
  - method: GET
    path:
      - "{{BaseURL}}/data?get=prodServerGen"

    matchers:
      - type: dsl
        dsl:
          - 'status_code == 200'
          - 'contains(content_type, "text/xml")'
          - 'contains_all(body, "<prodServerGen>", "<Manufacturer>", "Dell", "<isDellBranded>1</isDellBranded>", "11G")'
        condition: and

    extractors:
      - type: regex
        name: server_generation
        part: body
        group: 1
        regex:
          - '<prodServerGen>([0-9]{2}G)</prodServerGen>'
