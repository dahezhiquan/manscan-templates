id: k8s-memory-requests-not-set

info:
  name: Memory requests not set 中的Deployments（云安全）
  author: princechaddha
  severity: medium
  description: Deployment 未设置 memory requests 会让调度器无法准确预留容器基础内存，增加节点过量调度风险。本模板枚举 Deployment，检查 Pod 模板容器是否缺少 resources.requests.memory。
  impact: |
    - Pod 可能被调度到内存余量不足的节点，导致频繁 OOMKill 或驱逐。
    - 缺少资源请求会降低容量规划准确性，影响多租户集群稳定性。
  remediation: |
    - 为每个容器设置符合常态负载的 resources.requests.memory。
    - 结合 ResourceQuota 和 LimitRange 管理命名空间资源预算。
  reference:
    - https://kubernetes.io/docs/tasks/configure-pod-container/assign-memory-resource/
  metadata:
    vendor: kubernetes
    product: kubernetes
  tags: cloud,devops,kubernetes,devsecops,deployments,k8s-cluster-security
flow: |
  code(1);
  for (let deployment of template.items) {
    set("deployment",deployment)
    javascript(1);
  }

self-contained: true
code:
  - engine:
      - sh
      - bash
    source: kubectl get deployments --all-namespaces --output=json
    extractors:
      - type: json
        name: items
        internal: true
        json:
          - '.items[]'

javascript:
  - code: |
        deployment = JSON.parse(template.deployment);
        if (!deployment.spec.template.spec.containers.some(container => container.resources && container.resources.requests && container.resources.requests.memory)) {
          let result = (`Deployment '${deployment.metadata.name}' in namespace '${deployment.metadata.namespace}' lacks memory requests.`);
          Export(result);
        }

    extractors:
      - type: dsl
        dsl:
          - response
