id: default-jetty-page

info:
  name: Jetty 默认页面 指纹识别（指纹识别）
  author: dhiyaneshDk
  severity: info
  description: Jetty 默认页面 是 Java HTTP 服务器和 Servlet 容器，用于嵌入式或独立 Web 应用运行。该模板请求首页，并依据页面标题、正文关键字或品牌资源特征识别目标是否使用或暴露了 Jetty 默认页面 相关组件，适用于资产盘点、技术栈识别和后续安全评估；命中结果仅表示指纹特征匹配，不代表已确认存在可利用漏洞。
  classification:
    cpe: cpe:2.3:a:eclipse:jetty:*:*:*:*:*:*:*:*
  metadata:
    max-request: 1
    vendor: eclipse
    product: jetty
    shodan-query: http.title:"Powered By Jetty"
  tags: tech,jetty,discovery

http:
  - method: GET
    path:
      - '{{BaseURL}}'

    matchers:
      - type: word
        words:
          - "<TITLE>Powered By Jetty</TITLE>"
        part: body
