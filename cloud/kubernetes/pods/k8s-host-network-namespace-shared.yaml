id: k8s-host-network-namespace-shared

info:
  name: Host Network Namespace Sharing（云安全）
  author: princechaddha
  severity: high
  description: Pod 启用 hostNetwork 会共享节点网络命名空间，绕过 Pod 网络隔离并直接使用节点 IP 与端口。本模板枚举 Pod，并在 hostNetwork 为 true 时报告。
  impact: |
    - 容器可监听或访问节点网络接口，增加端口冲突、网络探测和策略绕过风险。
    - NetworkPolicy 对 hostNetwork Pod 的约束可能不符合预期，削弱东西向隔离。
  remediation: |
    - 优先使用 Service、DaemonSet 配合受控端口或 CNI 能力替代 hostNetwork。
    - 仅为必要系统组件保留 hostNetwork，并通过准入策略限制可用命名空间和服务账号。
  reference:
    - https://kubernetes.io/docs/concepts/policy/pod-security-policy/#host-namespaces
  metadata:
    vendor: kubernetes
    product: kubernetes
  tags: cloud,devops,kubernetes,devsecops,namespace,k8s-cluster-security
flow: |
  code(1);
  for (let pod of template.items) {
    set("pod", pod)
    javascript(1);
  }

self-contained: true
code:
  - engine:
      - sh
      - bash
    source: kubectl get pods --all-namespaces --output=json
    extractors:
      - type: json
        name: items
        internal: true
        json:
          - '.items[]'

javascript:
  - code: |
        pod = JSON.parse(template.pod);
        if (pod.spec.hostNetwork) {
          let result = (`Pod '${pod.metadata.name}' in namespace '${pod.metadata.namespace}' is configured to share the host's network namespace.`);
          Export(result);
        }
    extractors:
      - type: dsl
        dsl:
          - response
