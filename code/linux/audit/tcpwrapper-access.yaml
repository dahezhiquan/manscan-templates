id: tcpwrapper-access

info:
  name: TCP Wrapper 访问控制未正确配置（本地基线扫描）
  author: songyaeji
  severity: low
  description: |
    TCP Wrapper 访问控制缺少默认拒绝或允许策略过宽，会让受 TCP Wrapper 管控的服务暴露给非授权来源。模板检查 `/etc/hosts.deny` 是否包含 `ALL:ALL` 默认拒绝，并检查 `/etc/hosts.allow` 中 `sshd` 是否允许 `ALL` 或缺少明确授权，输出 `[VULNERABLE]` 时表示访问控制不符合基线。
  impact: |
    - 网络服务可能被超出预期的来源访问，增加暴力破解、枚举和漏洞利用面。
    - 默认允许策略会削弱主机侧纵深防御，依赖外围防火墙单点控制。
  remediation: |
    - 在 `/etc/hosts.deny` 配置默认拒绝策略，并在 `/etc/hosts.allow` 中仅允许必要来源。
    - 避免对 sshd 等关键服务使用 `ALL`，同时结合防火墙和 SSH 配置进行来源限制。
  reference:
    - https://isms.kisa.or.kr
  tags: linux,local,audit,kisa,compliance

self-contained: true

code:
  - engine:
      - sh
      - bash
    source: |
      echo "[*] Checking /etc/hosts.deny (default deny policy)"
      if grep -Eq "^[[:space:]]*ALL:[[:space:]]*ALL" /etc/hosts.deny; then
        echo "[SAFE] /etc/hosts.deny has ALL:ALL policy"
      else
        echo "[VULNERABLE] /etc/hosts.deny is missing ALL:ALL (default deny)"
      fi

  - engine:
      - sh
      - bash
    source: |
      echo "[*] Checking sshd allow policy in /etc/hosts.allow"
      if grep -Eq "^[[:space:]]*sshd" /etc/hosts.allow; then
        if grep -Eq "^[[:space:]]*sshd:[[:space:]]*ALL" /etc/hosts.allow; then
          echo "[VULNERABLE] sshd allows ALL hosts (too permissive)"
        else
          echo "[SAFE] sshd-specific allow policy found with restrictions"
        fi
      else
        echo "[VULNERABLE] No sshd-specific allow policy found"
      fi

    matchers:
      - type: word
        name: hosts.deny
        part: code_1_response
        words:
          - "[VULNERABLE]"

      - type: word
        name: sshd
        part: code_2_response
        words:
          - "[VULNERABLE]"
