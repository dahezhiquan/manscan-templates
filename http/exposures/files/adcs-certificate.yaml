id: adcs-certificate

info:
  name: Microsoft AD CS Web Enrollment 识别（指纹识别）
  author: pastaga,defte,atomiczsec
  severity: info
  description: |
    Microsoft AD CS Web Enrollment 是 Active Directory 证书服务的 Web 注册入口，用于证书申请和企业 PKI 管理。该模板用于识别目标是否部署了相关系统或服务，检测时请求 `/certenroll/`、`/CertEnroll/`、`/certsrv/` 等路径，并依据 HTTP 状态码、页面标题、响应正文关键字、证书或接口返回字段等指纹特征进行判断。该模板仅用于资产识别和暴露面梳理，不代表目标一定存在可利用漏洞。
  metadata:
    verified: true
    max-request: 3
    shodan-query: html:"/certenroll"
  tags: ad,adcs,exposure,files,web-enrollment,detect,vuln

http:
  - method: GET
    path:
      - "{{BaseURL}}/certenroll/"
      - "{{BaseURL}}/CertEnroll/"
      - "{{BaseURL}}/certsrv/"
      - "{{BaseURL}}/certsrv"

    host-redirects: true
    max-redirects: 2
    stop-at-first-match: true

    matchers-condition: or
    matchers:
      - type: dsl
        name: certenroll
        dsl:
          - 'status_code == 200'
          - 'contains_any(body, ".crl", ".crt", ".cer", ".p7b")'
          - 'contains_any(tolower(body), "certenroll", "locmscertsrv", "certificate services")'
        condition: and

      - type: dsl
        name: certsrv
        dsl:
          - 'status_code == 200 || status_code == 401 || status_code == 403'
          - 'contains_any(tolower(body), "locmscertsrv", "certificate services", "web enrollment")'
        condition: and
