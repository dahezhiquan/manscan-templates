id: goodjob-dashboard

info:
  name: goodjob- 仪表盘（暴露面识别）
  author: hahwul
  severity: medium
  description: |
    该模板通过识别 goodjob 仪表盘或后台界面的页面特征，判断目标是否对外暴露了相关控制台。若命中，说明该服务面向外部可访问，可用于资产识别与访问控制核查。
  reference:
    - https://github.com/bensheldon/good_job
  metadata:
    verified: true
    max-request: 2
  tags: unauth,panel,goodjob,discovery

http:
  - method: GET
    path:
      - "{{BaseURL}}/jobs"
      - "{{BaseURL}}/good_job/jobs"

    redirects: true
    max-redirects: 2
    stop-at-first-match: true
    matchers-condition: and
    matchers:
      - type: word
        words:
          - <title>Good Job Dashboard</title>
        part: body

      - type: status
        status:
          - 200
