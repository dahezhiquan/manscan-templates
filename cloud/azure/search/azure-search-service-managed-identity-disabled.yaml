id: azure-search-service-managed-identity-disabled
info:
  name: Azure AI Search 服务托管身份未启用（云安全）
  author: princechaddha
  severity: medium
  description: Azure AI Search 未启用托管身份时，服务访问数据源、密钥保管库或其他 Azure 资源通常需要保存长期凭据，增加凭据泄露和权限滥用风险。本模板枚举资源组和 Search 服务，查询 identity，并在 ManagedIdentity 字段为 null 时报告。
  impact: |
    - 长期密钥或连接字符串可能被写入配置、脚本或日志，泄露后可被用于读取或修改关联数据源。
    - 缺少可审计的工作负载身份会扩大凭据轮换和权限回收的运维风险，影响数据访问边界管理。
  remediation: |
    - 为 Search 服务启用系统分配或用户分配的托管身份，并仅授予访问数据源所需的最小 Azure RBAC 权限。
    - 将数据源和密钥访问迁移到基于身份的认证方式，轮换并撤销不再需要的长期凭据。
  reference:
    - https://docs.microsoft.com/en-us/azure/search/search-managed-identities
  metadata:
    vendor: microsoft
    product: azure-search
  tags: cloud,devops,azure,microsoft,azure-search,azure-cloud-config

flow: |
  code(1);
  for (let ResourceGroupName of iterate(template.resourceGroupNames)) {
    set("resourceGroup", ResourceGroupName);
    code(2);
    for (let SearchServiceName of iterate(template.searchServiceNames)) {
      set("name", SearchServiceName);
      code(3);
    }
  }

self-contained: true
code:
  - engine:
      - sh
      - bash
    source: |
      az group list --query "[].name"

    extractors:
      - type: json
        name: resourceGroupNames
        internal: true
        json:
          - '.[]'

  - engine:
      - sh
      - bash
    source: |
      az search service list --resource-group "$resourceGroup" --query '[].{Name:name}'

    extractors:
      - type: json
        name: searchServiceNames
        internal: true
        json:
          - '.[]'

  - engine:
      - sh
      - bash
    source: |
      az search service show --name "$name" --resource-group "$resourceGroup" --query '{"ManagedIdentity": identity}'

    matchers-condition: and
    matchers:
      - type: word
        words:
          - '"ManagedIdentity": null'

    extractors:
      - type: dsl
        dsl:
          - 'name + " in " + resourceGroup + " does not have managed identity enabled"'
