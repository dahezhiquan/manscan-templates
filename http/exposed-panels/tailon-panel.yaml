id: tailon-panel

info:
  name: Tailon 面板识别（指纹识别）
  author: ritikchaddha
  severity: info
  reference:
    - https://github.com/gvalkov/tailon
  metadata:
    verified: true
    max-request: 1
    shodan-query: title:"tailon"
  tags: panel,tailon,detect,discovery

http:
  - method: GET
    path:
      - "{{BaseURL}}"

    matchers-condition: and
    matchers:
      - type: word
        part: body
        words:
          - '<title>Tailon'
          - 'class="tailon-dark'
        condition: or

      - type: status
        status:
          - 200
