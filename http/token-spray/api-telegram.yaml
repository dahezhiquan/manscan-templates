id: api-telegram

info:
  name: Telegram API Token 可用性校验（token喷洒）
  author: 0xpugal
  severity: info
  description: 该模板通过调用 Telegram API 的已知接口验证提供的 token 是否有效，命中后通常表示可访问相关 API 能力。
  reference:
    - https://core.telegram.org/bots/api#making-requests
    - https://github.com/streaak/keyhacks?tab=readme-ov-file#telegram-bot-api-token
  metadata:
    max-request: 1
  tags: token-spray,telegram

self-contained: true

http:
  - method: GET
    path:
      - "https://api.telegram.org/bot{{token}}/getMe"

    matchers:
      - type: word
        part: body
        words:
          - '"id"'
          - '"is_bot"'
          - '"first_name:"'
          - '"username"'
        condition: and
