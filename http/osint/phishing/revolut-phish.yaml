id: revolut-phish

info:
  name: Revolut 仿冒钓鱼网站（钓鱼网站识别）
  author: rxerium
  severity: info
  description: |
    检测到疑似仿冒 Revolut 的钓鱼网站。模板在目标页面返回 200、页面内容命中 Revolut 的登录或账号页面特征，且当前主机不属于 revolut.com 官方域名时触发，用于识别借用 Revolut 品牌页面诱导用户信任的仿冒站点。
  reference:
    - https://revolut.com
  metadata:
    max-request: 1
  tags: phishing,revolut,fintech,osint,discovery
http:
  - method: GET
    path:
      - "{{BaseURL}}"

    host-redirects: true
    max-redirects: 2

    matchers-condition: and
    matchers:
      - type: word
        words:
          - 'Revolut'
          - 'Log in'
        condition: and

      - type: status
        status:
          - 200

      - type: dsl
        dsl:
          - '!contains(host,"revolut.com")'
