id: ragflow-panel

info:
  name: RAGFlow 面板识别（指纹识别）
  author: rxerium
  severity: info
  description: |-
    RAGFlow 是 RAG 知识库与问答平台，用于文档解析、索引、检索增强和大模型应用编排。该模板请求首页，并依据 HTTP 200 状态码、页面标题、正文关键字或品牌资源特征识别目标是否部署了该系统或暴露了对应入口，适用于资产指纹确认；命中结果仅表示系统特征匹配，不代表已确认存在未授权访问或可利用漏洞。
  reference:
  - https://github.com/infiniflow/ragflow
  - https://ragflow.io
  metadata:
    verified: true
    max-request: 1
    vendor: infiniflow
    product: ragflow
    shodan-query: 'http.title:"RAGFlow"'
  tags: panel,ragflow,llm,ai,rag,detect,discovery

http:
  - method: GET
    path:
      - "{{BaseURL}}"

    host-redirects: true
    max-redirects: 2

    matchers-condition: and
    matchers:
      - type: word
        part: body
        words:
          - "RAGFlow"

      - type: status
        status:
          - 200
