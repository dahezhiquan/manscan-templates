id: vtscada-panel

info:
  name: VTScada - Internet Client 面板（暴露面识别）
  author: rxerium
  severity: info
  description: |
    该模板通过识别 VTScada - Internet Client 面板、控制台或管理界面的页面特征，判断目标是否暴露了对应服务入口。若命中，说明该后台或运维界面对外可访问，可用于资产识别与暴露面排查。
  reference:
    - https://www.trihedral.com/vtscada/
  metadata:
    max-request: 1
    verified: true
    vendor: Trihedral
    product: vtscada
    shodan-query: http.title:"VTScada Internet Client from Trihedral"
  tags: panel,scada,ics,vtscada,trihedral,utilities,water,oil-gas,discovery

http:
  - method: GET
    path:
      - '{{BaseURL}}'
    host-redirects: true
    max-redirects: 2

    matchers-condition: and
    matchers:
      - type: word
        part: body
        words:
          - 'VTScada Anywhere'
          - 'VTScada'
          - 'trihedral.com'
        condition: or

      - type: status
        status:
          - 200
