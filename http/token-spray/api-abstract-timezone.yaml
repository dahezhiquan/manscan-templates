id: api-abstract-timezone

info:
  name: Abstract API Timezone Token 可用性校验（token喷洒）
  author: daffainfo
  severity: info
  description: 该模板通过调用 Abstract Timezone API 验证提供的 token 是否有效，命中后通常表示可访问时区与时间转换能力。
  reference:
    - https://www.abstractapi.com/api/time-date-timezone-api
    - https://github.com/daffainfo/all-about-apikey/tree/main/abstract-timezone
  metadata:
    max-request: 1
  tags: token-spray,abstractapi

self-contained: true

http:
  - method: GET
    path:
      - "https://timezone.abstractapi.com/v1/current_time/?api_key={{token}}&location=Oxford,%20United%20Kingdom"

    matchers:
      - type: word
        part: body
        words:
          - '"requested_location":'
          - '"longitude":'
          - '"latitude":'
        condition: and
