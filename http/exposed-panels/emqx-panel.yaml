id: emqx-panel

info:
  name: EMQX 登录面板识别（指纹识别）
  author: righettod
  severity: info
  description: |
    该模板通过识别 EMQX 登录入口的页面标题、特征文本或重定向行为，判断目标是否暴露了对应的认证界面。若命中，说明该登录面板对外可访问，可用于暴露面梳理与后续安全评估。
  reference:
    - https://www.emqx.io/
  classification:
    cpe: cpe:2.3:a:emqx:emqx:*:*:*:*:*:*:*:*
  metadata:
    verified: true
    max-request: 1
    vendor: emqx
    product: emqx
    shodan-query: http.title:"EMQX Dashboard"
  tags: panel,emqx,login,detect,discovery

http:
  - method: GET
    path:
      - "{{BaseURL}}"

    matchers:
      - type: dsl
        dsl:
          - 'status_code == 200'
          - 'contains_any(to_lower(body), "<title>emqx dashboard", "emqx-dashboard")'
        condition: and

    extractors:
      - type: regex
        part: body
        group: 1
        regex:
          - 'but\s+(emqx\-dashboard[0-9a-z\-]+)'
