id: lotus-domino-version

info:
  name: Lotus Domino 指纹识别（指纹识别）
  author: CasperGN
  severity: info
  description: >-
    Lotus Domino 是企业邮件、协作和应用服务器平台，常用于运行 Notes/Domino 应用和邮件服务。该模板通过请求目标服务并检查预设路径或首页响应、页面正文关键字、正则特征、状态码等指纹特征，判断目标是否使用或暴露了
    Lotus Domino 相关组件；命中结果仅表示指纹特征匹配，可用于资产盘点、技术栈识别和后续安全评估，不代表已确认存在可利用漏洞。
  metadata:
    max-request: 7
  tags: tech,lotus,discovery
http:
  - method: GET
    path:
      - "{{BaseURL}}/homepage.nsf"
      - "{{BaseURL}}/iNotes/Forms5.nsf"
      - "{{BaseURL}}/iNotes/Forms6.nsf"
      - "{{BaseURL}}/iNotes/Forms7.nsf"
      - "{{BaseURL}}/iNotes/Forms8.nsf"
      - "{{BaseURL}}/iNotes/Forms85.nsf"
      - "{{BaseURL}}/iNotes/Forms9.nsf"

    stop-at-first-match: true

    matchers-condition: and
    matchers:
      - type: status
        status:
          - 200

      - type: regex
        part: body
        regex:
          - "((Domino\\s[A-Za-z]+\\s[0-9\\.]{1,3})|(Forms[0-9\\.]{1,3}\\.nsf\\?OpenDatabase))"

    extractors:
      - type: regex
        part: body
        name: version
        regex:
          - "((Domino\\s[A-Za-z]+\\s[0-9\\.]{1,3})|(Forms[0-9\\.]{1,3}\\.nsf\\?OpenDatabase))"
