id: samba-config

info:
  name: Samba配置暴露（暴露面识别）
  author: sheikhrishad
  severity: medium
  description: |
    检测到目标站点可直接访问 Samba配置。Samba 配置用于 SMB 文件共享服务，可能暴露共享目录、访问控制和域集成信息。该模板请求 `/smb.conf`，并通过 HTTP 状态码、响应正文关键字、文件格式特征、正则匹配或响应头进行确认。配置文件公开后可能泄露部署细节、内部路径、依赖版本、环境变量、访问凭据或调试信息，增加被侦察和后续利用的风险。
  impact: |-
    - 公开文件可能泄露内部路径、组件版本、依赖清单、资源命名、环境变量名称或业务配置线索。
    - 攻击者可利用这些信息缩小目标范围，选择匹配漏洞、弱口令、凭据攻击或目录枚举策略。
    - 若文件中包含真实凭据、令牌、连接串或敏感数据，可能进一步导致数据、代码仓库、云资源或后台系统被未授权访问。
  remediation: |-
    - 确认该文件是否必须公网可访问；如非业务必需，应立即从 Web 根目录、静态资源目录、对象存储或反向代理公开路径中移除。
    - 在 Web 服务器、网关、CDN 或应用路由层增加拒绝规则、身份认证、IP allowlist 或内网访问限制。
    - 检查访问日志、下载记录和缓存记录，评估该资源是否已被外部访问或搜索引擎收录。
    - 若文件中包含凭据、令牌、连接串或私有地址，应执行密钥轮换、权限收敛和受影响系统访问审计。
  reference:
    - https://www.samba.org/samba/docs/using_samba/ch06.html
  classification:
    cvss-metrics: CVSS:3.1/AV:N/AC:L/PR:N/UI:N/S:U/C:N/I:N/A:N
    cvss-score: 0
    cwe-id: CWE-200
  metadata:
    max-request: 1
  tags: config,exposure,smb,samba,vuln

http:
  - method: GET
    path:
      - "{{BaseURL}}/smb.conf"

    matchers-condition: and
    matchers:
      - type: word
        words:
          - "configuration file"
          - "samba"
        condition: and

      - type: status
        status:
          - 200
