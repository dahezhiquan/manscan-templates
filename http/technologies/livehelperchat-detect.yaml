id: livehelperchat-detect

info:
  name: Live Helper Chat 指纹识别（指纹识别）
  author: pikpikcu,ricardomaia
  severity: info
  description: >-
    Live Helper Chat 是开源在线客服和实时聊天系统，用于网站访客沟通、工单和客服工作台。该模板通过请求目标服务并检查预设路径或首页响应、页面正文关键字、正则特征等指纹特征，判断目标是否使用或暴露了
    Live Helper Chat 相关组件；命中结果仅表示指纹特征匹配，可用于资产盘点、技术栈识别和后续安全评估，不代表已确认存在可利用漏洞。
  classification:
    cpe: cpe:2.3:a:livehelperchat:live_helper_chat:*:*:*:*:*:*:*:*
  metadata:
    verified: true
    max-request: 3
    vendor: livehelperchat
    product: live_helper_chat
    fofa-query: title="Live Helper Chat"
  tags: livehelperchat,tech,discovery
http:
  - method: GET
    path:
      - "{{BaseURL}}"
      - "{{BaseURL}}/doc/CHANGELOG.txt"
      - "{{BaseURL}}/doc/README.txt"

    stop-at-first-match: true
    redirects: true
    max-redirects: 2

    matchers-condition: or
    matchers:
      - type: regex
        part: body
        regex:
          - "(?i)Live.Helper.Chat"

      - type: regex
        regex:
          - '(?i)Copyright.\(c\).2019.Remigijus.Kiminas'

    extractors:
      - type: regex
        name: version
        part: body
        group: 1
        regex:
          - '^(?i)((\d+\.)?(\d+\.)?(\*|\d+))v'
