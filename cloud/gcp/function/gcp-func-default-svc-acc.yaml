id: gcp-func-default-svc-acc

info:
  name: Google Cloud Functions Using Default Service Account（云安全）
  author: princechaddha
  severity: medium
  description: Cloud Functions 使用默认服务账号时，多个函数可能共享同一身份，容易偏离最小权限原则。本模板检查 serviceConfig.serviceAccountEmail，匹配 appspot 或 developer 默认服务账号时报告函数使用默认服务账号。
  impact: |
    - 任一函数被利用后，攻击者可能借助默认服务账号访问同身份授权的其他云资源。
    - 默认身份难以体现函数的具体业务职责，增加审计归因和权限收敛难度。
  remediation: |
    - 为不同函数或业务域创建专用服务账号，并仅授予函数实际需要的 IAM 角色。
    - 逐步替换默认服务账号绑定，复核默认服务账号上残留的高权限角色。
  reference:
    - https://cloud.google.com/functions/docs/securing/managing-access-iam
  metadata:
    vendor: google
    product: cloud-functions
  tags: cloud,devops,gcp,gcloud,google-cloud-functions,gcp-cloud-config

flow: |
  code(1)
  for(let projectId of iterate(template.projectIds)){
    set("projectId", projectId)
    code(2)
    for(let functionDetail of iterate(template.functions)){
      set("functionName", functionDetail)
      code(3)
    }
  }

self-contained: true

code:
  - engine:
      - sh
      - bash
    source: |
      gcloud projects list --format="json(projectId)"

    extractors:
      - type: json
        name: projectIds
        internal: true
        json:
          - '.[].projectId'

  - engine:
      - sh
      - bash
    source: |
      gcloud functions list --project $projectId --format="json(name)"

    extractors:
      - type: json
        name: functions
        internal: true
        json:
          - '.[].name'

  - engine:
      - sh
      - bash
    source: |
      gcloud functions describe $functionName --format="value(serviceConfig.serviceAccountEmail)"

    matchers:
      - type: word
        words:
          - '@appspot.gserviceaccount.com'
          - '@developer.gserviceaccount.com'
        condition: or

    extractors:
      - type: dsl
        dsl:
          - '"Default Service Account used in function: " + functionName + " in " + projectId + " project"'
