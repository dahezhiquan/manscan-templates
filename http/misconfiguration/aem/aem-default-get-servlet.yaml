id: aem-default-get-servlet

info:
  name: AEM 默认Get Servlet
  author: DhiyaneshDk
  severity: low
  description: |
    该模板用于核查 AEM 默认Get Servlet相关配置。该类问题通常源于配置文件、备份文件、管理页面、服务状态或敏感资源被错误暴露到 Web 访问路径。模板会向目标发送探测请求，并依据请求 `{{paths}}`、匹配 `jcr:createdBy`、状态码 200 等证据确认目标是否存在该配置问题。
  impact: |
    - 攻击者可获取版本、路径、账号、密钥、令牌、配置或业务数据等敏感信息。
    - 泄露的信息可能被用于凭据攻击、漏洞匹配、权限提升或横向移动。
  remediation: |
    - 移除 Web 根目录下不应公开的配置、备份、日志和临时文件。
    - 为敏感页面和资源增加访问控制，并按最小暴露原则收敛公开路径。
    - 轮换已暴露的密钥、令牌和凭据，并审计异常下载或枚举行为。
  reference:
    - https://speakerdeck.com/0ang3el/hunting-for-security-bugs-in-aem-webapps?slide=43
    - https://github.com/thomashartm/burp-aem-scanner/blob/master/src/main/java/burp/actions/dispatcher/Get ServletExposed.java
  classification:
    cpe: cpe:2.3:a:adobe:experience_manager:*:*:*:*:*:*:*:*
  metadata:
    max-request: 64
    vendor: adobe
    product: experience_manager
    shodan-query: http.component:"Adobe Experience Manager"
  tags: aem,adobe,misconfig,vuln

http:
  - method: GET
    path:
      - "{{BaseURL}}{{paths}}"

    payloads:
      paths:
        - "/etc"
        - "/var"
        - "/apps"
        - "/home"
        - "///etc"
        - "///var"
        - "///apps"
        - "///home"
        - "/.json"
        - "/.1.json"
        - "/....4.2.1....json"
        - "/.json?FNZ.css"
        - "/.json?FNZ.ico"
        - "/.json?FNZ.html"
        - "/.json/FNZ.css"
        - "/.json/FNZ.html"
        - "/.json/FNZ.png"
        - "/.json/FNZ.ico"
        - "/.children.1.json"
        - "/.children....4.2.1....json"
        - "/.children.json?FNZ.css"
        - "/.children.json?FNZ.ico"
        - "/.children.json?FNZ.html"
        - "/.children.json/FNZ.css"
        - "/.children.json/FNZ.html"
        - "/.children.json/FNZ.png"
        - "/.children.json/FNZ.ico"
        - "/etc.json"
        - "/etc.1.json"
        - "/etc....4.2.1....json"
        - "/etc.json?FNZ.css"
        - "/etc.json?FNZ.ico"
        - "/etc.json?FNZ.html"
        - "/etc.json/FNZ.css"
        - "/etc.json/FNZ.html"
        - "/etc.json/FNZ.ico"
        - "/etc.children.json"
        - "/etc.children.1.json"
        - "/etc.children....4.2.1....json"
        - "/etc.children.json?FNZ.css"
        - "/etc.children.json?FNZ.ico"
        - "/etc.children.json?FNZ.html"
        - "/etc.children.json/FNZ.css"
        - "/etc.children.json/FNZ.html"
        - "/etc.children.json/FNZ.png"
        - "/etc.children.json/FNZ.ico"
        - "///etc.json"
        - "///etc.1.json"
        - "///etc....4.2.1....json"
        - "///etc.json?FNZ.css"
        - "///etc.json?FNZ.ico"
        - "///etc.json/FNZ.html"
        - "///etc.json/FNZ.png"
        - "///etc.json/FNZ.ico"
        - "///etc.children.json"
        - "///etc.children.1.json"
        - "///etc.children....4.2.1....json"
        - "///etc.children.json?FNZ.css"
        - "///etc.children.json?FNZ.ico"
        - "///etc.children.json?FNZ.html"
        - "///etc.children.json/FNZ.css"
        - "///etc.children.json/FNZ.html"
        - "///etc.children.json/FNZ.png"
        - "///etc.children.json/FNZ.ico"
    stop-at-first-match: true

    matchers-condition: and
    matchers:
      - type: status
        status:
          - 200

      - type: word
        words:
          - 'jcr:createdBy'
        condition: and
