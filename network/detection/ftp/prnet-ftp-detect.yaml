id: prnet-ftp-detect
info:
  name: PrNET FTP 服务 识别（服务漏洞）
  author: pussycat0x
  severity: info
  description: |
    该模板通过 FTP Banner、响应特征或协商行为识别目标是否运行 PrNET 相关 FTP 服务实现。
  metadata:
    verified: true
    shodan-query: "PrNET FTP server"
    max-request: 1
  tags: network,ftp,prnet,detect,tcp,discovery

tcp:
  - inputs:
      - data: 00000000
        type: hex

    host:
      - "{{Hostname}}"
    port: 21
    read-size: 1024

    matchers:
      - type: word
        words:
          - "PrNET FTP server"

    extractors:
      - type: regex
        group: 1
        name: version
        regex:
          - "PrNET FTP ([0-9.]+)"
