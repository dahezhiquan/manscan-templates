id: oidc-detect

info:
  name: OpenID Connect Provider 指纹识别（指纹识别）
  author: jarijaas
  severity: info
  description: >-
    OpenID Connect Provider 是基于 OAuth 2.0 的身份提供方，用于登录认证、身份声明和令牌签发。该模板通过请求目标服务并检查预设路径或首页响应、状态码、页面正文关键字等指纹特征，判断目标是否使用或暴露了
    OpenID Connect Provider 相关组件；命中结果仅表示指纹特征匹配，可用于资产盘点、技术栈识别和后续安全评估，不代表已确认存在可利用漏洞。
  metadata:
    max-request: 1
  tags: tech,oidc,discovery
http:
  - method: GET
    path:
      - "{{BaseURL}}/.well-known/openid-configuration"

    matchers-condition: and
    matchers:
      - type: status
        status:
          - 200

      - type: word
        words:
          - issuer
          - authorization_endpoint
        condition: and
