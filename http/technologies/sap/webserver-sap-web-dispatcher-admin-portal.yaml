id: webserver-sap-web-dispatcher-admin-portal

info:
  name: SAP Web Dispatcher Admin Portal 指纹识别（指纹识别）
  author: randomstr1ng
  severity: info
  description: >-
    SAP Web Dispatcher Admin Portal 是 SAP Web Dispatcher 的管理入口，用于查看代理、路由和后端连接状态。该模板通过请求目标服务并检查预设路径或首页响应、HTTP
    响应头、页面正文关键字、状态码等指纹特征，判断目标是否使用或暴露了 SAP Web Dispatcher Admin Portal 相关组件；命中结果仅表示指纹特征匹配，可用于资产盘点、技术栈识别和后续安全评估，不代表已确认存在可利用漏洞。
  metadata:
    max-request: 1
    shodan-query: http.favicon.hash:-266008933
    product: content_server
    vendor: sap
    fofa-query: icon_hash=-266008933
  tags: sap,webserver,proxy,tech,discovery
http:
  - method: GET
    host-redirects: true
    max-redirects: 2
    path:
      - "{{BaseURL}}/sap/wdisp/admin/public/default.html"

    matchers-condition: and
    matchers:
      - type: word
        part: header
        condition: or
        words:
          - "Basic realm=\"WEB ADMIN\""
          - "SAP NetWeaver Application Server"

      - type: status
        condition: or
        status:
          - 401
          - 200

      - type: word
        part: body
        condition: or
        words:
          - "SAP Web Dispatcher"
          - "<title>Administration</title>"
