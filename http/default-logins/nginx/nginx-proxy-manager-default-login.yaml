id: nginx-proxy-manager-default-login

info:
  name: Nginx Proxy Manager 默认口令登录（弱口令）
  author: barttran2000
  severity: high
  description: |
    该模板用于检测 Nginx Proxy Manager 是否仍可使用默认凭据或弱口令登录。模板主要向 `/api/tokens` 等认证入口发送请求，使用内置默认凭据组合进行认证尝试，并根据状态码、认证 Cookie、跳转位置或登录后的页面关键字判断登录是否成功；命中说明目标未及时修改出厂、示例或初始化账号口令。
  impact: |
    - 攻击者可使用默认凭据登录 Nginx Proxy Manager，获得与该账号对应的管理或业务权限。
    - 成功登录后可能进一步查看敏感信息、修改配置、创建账号、调用管理接口，或以该系统为入口访问内网其他资源。
  remediation: |
    - 立即修改或禁用默认账号，要求所有账户使用高强度唯一密码。
    - 将登录入口限制在可信网络范围内，并启用多因素认证、登录失败限制和异常登录告警。
    - 审计近期登录、配置变更和账号新增记录，必要时轮换相关密钥、令牌和业务凭据。
  metadata:
    shodan-query: html:"Nginx Proxy Manager"
    verified: true
    max-request: 1
  tags: nginx,proxy-manager,default-login,vuln

http:
  - raw:
      - |
        POST /api/tokens HTTP/1.1
        Host: {{Hostname}}
        Content-Type: application/json

        {"identity": "admin@example.com","secret": "changeme"}

    matchers:
      - type: dsl
        dsl:
          - contains_all(body, "{\"token", "expires\":")
          - contains(content_type, "application/json")
          - status_code == 200
        condition: and
