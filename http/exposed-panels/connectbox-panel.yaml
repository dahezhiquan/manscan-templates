id: connectbox-panel

info:
  name: Connect Box 登录面板识别（暴露面识别）
  author: fabaff
  severity: info
  description: 该模板通过识别 Connect Box 登录入口的页面标题、特征文本或重定向行为，判断目标是否暴露了对应的认证界面。若命中，说明该登录面板对外可访问，可用于暴露面梳理与后续安全评估。
  classification:
    cvss-metrics: CVSS:3.1/AV:N/AC:L/PR:N/UI:N/S:U/C:N/I:N/A:N
    cwe-id: CWE-200
    cpe: cpe:2.3:o:upc:connect_box_eurodocsis_firmware:*:*:*:*:*:*:*:*
  metadata:
    verified: true
    max-request: 1
    vendor: upc
    product: connect_box_eurodocsis_firmware
    shodan-query:
      - NET-DK/1.0
      - net-dk/1.0
  tags: panel,connectbox,iot,upc,discovery

http:
  - method: GET
    path:
      - '{{BaseURL}}'

    host-redirects: true
    max-redirects: 2

    matchers-condition: and
    matchers:
      - type: word
        part: header
        words:
          - "NET-DK/1.0"

      - type: regex
        part: header
        regex:
          - "../common_page/(.*).html"

      - type: status
        status:
          - 302
