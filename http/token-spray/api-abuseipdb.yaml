id: api-abuseipdb

info:
  name: AbuseIPDB API Token 可用性校验（token喷洒）
  author: daffainfo
  severity: high
  description: |-
    平台介绍：AbuseIPDB API 是面向安全运营、威胁情报或互联网资产测绘的服务平台，常用于查询恶意指标、资产暴露面、证书、域名或扫描配额。该模板用于校验提交的 AbuseIPDB API Token 是否仍然有效。检测逻辑会向 `api.abuseipdb.com/api/v2/report` 发起低影响 API 请求，通过模板配置的认证字段传递 `{{token}}`，并依据响应中的 `data":`、`ipAddress":` 判断凭据是否可用；命中通常表示该 Token 可被继续调用对应平台能力。
  reference:
    - https://docs.abuseipdb.com/
    - https://github.com/daffainfo/all-about-apikey/tree/main/abuseipdb
  classification:
    cvss-metrics: CVSS:3.1/AV:N/AC:L/PR:N/UI:N/S:U/C:N/I:N/A:N
    cvss-score: 0
    cwe-id: CWE-200
  metadata:
    max-request: 1
  tags: token-spray,abuseipdb
  impact: |-
    - 攻击者可消耗安全情报查询额度、读取组织查询结果、资产信息或扫描配额。
    - 泄露 Token 还可能暴露安全团队关注的资产范围、调查目标和监控能力。
  remediation: |-
    - 立即撤销或轮换已暴露的 API Token，并确认旧 Token 不再可用。
    - 按最小权限原则重新签发凭据，限制作用域、来源地址、项目范围和有效期。
    - 在代码仓库、CI/CD、日志和配置文件中排查泄露来源，避免 Token 再次提交或外传。
self-contained: true

http:
  - raw:
      - |
        POST https://api.abuseipdb.com/api/v2/report HTTP/1.1
        Host: api.abuseipdb.com
        Key: {{token}}
        Accept: application/json
        Content-Type: application/x-www-form-urlencoded
        Content-Length: 16

        ip=127.0.0.1&categories=18,22&comment=SSH%20login%20attempts%20with%20user%20root.

    matchers:
      - type: word
        part: body
        words:
          - 'data":'
          - 'ipAddress":'
        condition: and
