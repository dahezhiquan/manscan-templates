id: aurora-copy-tags-snap
info:
  name: Aurora Snapshot Tag Copy（云安全）
  author: princechaddha
  severity: high
  description: 该规则用于检查 AWS RDS 是否正确配置备份、快照、证书续期、密钥轮换或其他韧性保护措施，以降低中断、失效或数据恢复失败的风险。
  impact: |
    - 缺少备份、续期、轮换或删除保护会增加服务中断、数据丢失或恢复失败的风险。
    - 当故障、误操作或攻击发生时，业务可用性和恢复能力都会受到明显影响。
  remediation: |
    - 启用备份、快照、版本控制、证书续期、密钥轮换或删除保护等韧性配置。
    - 定期验证恢复流程和到期提醒机制，确保在故障或攻击发生时能够快速恢复。
  reference:
    - https://docs.aws.amazon.com/AmazonRDS/latest/AuroraUserGuide/USER_Tagging.html
  metadata:
    max-request: 2
  tags: cloud,devops,aws,amazon,aurora,rds,aws-cloud-config
variables:
  region: "ap-northeast-1"

flow: |
  code(1)
  for(let clustername of iterate(template.clusters)){
    set("cluster", clustername)
    code(2)
  }

self-contained: true
code:
  - engine:
      - sh
      - bash
    source: |
      aws rds describe-db-clusters --region $region --output json --query 'DBClusters[?Engine==`aurora-mysql` || Engine==`aurora-postgresql`].DBClusterIdentifier | []'

    extractors:
      - type: json
        name: clusters
        internal: true
        json:
          - '.[]'

  - engine:
      - sh
      - bash
    source: |
         aws rds describe-db-clusters --region $region --db-cluster-identifier $cluster --query 'DBClusters[*].CopyTagsToSnapshot'

    matchers:
      - type: word
        words:
          - 'false'

    extractors:
      - type: dsl
        dsl:
          - '"Copy Tags To Snapshot is not enable for cluster " + cluster'
