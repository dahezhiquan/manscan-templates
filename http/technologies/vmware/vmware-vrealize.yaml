id: vmware-vrealize

info:
  name: VMware vRealize 指纹识别（指纹识别）
  author: milo2012
  severity: info
  description: 用于识别目标是否部署 VMware vRealize 并提取相关版本或构建信息，模板会结合 HTTP 响应头、页面标题、页面正文、状态码、特定路径或已知端点和版本或标识提取结果进行指纹匹配。
  metadata:
    max-request: 1
  tags: vmware,vrealize,tech,discovery

http:
  - method: GET
    path:
      - "{{BaseURL}}/ui/login.action"

    matchers-condition: and
    matchers:
      - type: status
        status:
          - 200

      - type: word
        words:
          - text/html
        part: header

      - type: word
        words:
          - '<title>vRealize Operations Manager</title>'
        part: body

    extractors:
      - type: regex
        part: body
        group: 1
        regex:
          - "SessionProvider.js\\?version=([0-9.]+)"
