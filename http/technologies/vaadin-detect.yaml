id: vaadin-detect

info:
  name: Vaadin Framework 指纹识别（指纹识别）
  author: Shivam Kamboj
  severity: info
  description: >-
    Vaadin 是 Java Web 应用框架，用于以服务端 Java 组件方式构建企业级浏览器界面。该模板通过请求目标服务并检查预设路径或首页响应、DSL
    条件、正则特征等指纹特征，判断目标是否使用或暴露了 Vaadin Framework 相关组件；命中结果仅表示指纹特征匹配，可用于资产盘点、技术栈识别和后续安全评估，不代表已确认存在可利用漏洞。
  reference:
  - https://vaadin.com/
  metadata:
    verified: true
    max-request: 1
    vendor: vaadin
    product: vaadin
    shodan-query: http.html:"/VAADIN/"
  tags: tech,discovery,vaadin,framework
http:
  - method: GET
    path:
      - "{{BaseURL}}"

    redirects: true

    matchers:
      - type: dsl
        dsl:
          - 'contains_any(tolower(body), "/vaadin/", "v-generated-body", "v-app-loading", "vaadinbootstrap", "vaadin.", "vaadindirect")'

    extractors:
      - type: regex
        part: body
        group: 1
        regex:
          - 'vaadinBootstrap\.js\?v=([0-9.]+)'
          - '"vaadinVersion":"([0-9.]+)"'
