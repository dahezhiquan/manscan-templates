id: karaf-default-login

info:
  name: Apache Karaf 默认口令登录（弱口令）
  author: s0obi
  severity: high
  description: 该模板通过尝试 Apache Karaf 的默认账号口令，并依据认证成功后的响应特征判断目标是否仍在使用未修改的弱口令。若命中，攻击者可直接登录系统，进一步访问敏感信息、修改配置或执行未授权操作。
  reference:
    - https://karaf.apache.org/manual/latest/webconsole
  classification:
    cvss-metrics: CVSS:3.0/AV:N/AC:L/PR:N/UI:N/S:C/C:L/I:L/A:L
    cvss-score: 8.3
    cwe-id: CWE-522
    cpe: cpe:2.3:a:apache:karaf:*:*:*:*:*:*:*:*
  metadata:
    verified: true
    max-request: 1
    shodan-query: realm="karaf"
    product: karaf
    vendor: apache
  tags: default-login,apache,karaf,vuln

http:
  - raw:
      - |
        GET /system/console HTTP/1.1
        Host: {{Hostname}}
        Authorization: Basic {{base64('karaf:karaf')}}

    host-redirects: true
    max-redirects: 2

    matchers-condition: and
    matchers:
      - type: word
        part: body
        words:
          - "Apache Karaf Web Console - Bundles"
          - "Web Console</a>"
          - "Log out</a>"
        condition: and

      - type: status
        status:
          - 200
