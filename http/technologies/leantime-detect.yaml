id: leantime-detect

info:
  name: Leantime 指纹识别（指纹识别）
  author: icarot
  severity: info
  description: >-
    Leantime 是开源项目管理系统，面向产品计划、任务、里程碑和团队协作场景。该模板通过请求目标服务并检查预设路径或首页响应、页面正文关键字、正则特征、状态码等指纹特征，判断目标是否使用或暴露了
    Leantime 相关组件；命中结果仅表示指纹特征匹配，可用于资产盘点、技术栈识别和后续安全评估，不代表已确认存在可利用漏洞。
  reference:
  - https://github.com/Leantime/leantime
  classification:
    cpe: cpe:2.3:a:leantime:leantime:*:*:*:*:*:*:*:*
  metadata:
    vendor: leantime
    product: leantime
    shodan-query: title:"Leantime"
  tags: tech,leantime,detect
http:
  - method: GET
    path:
      - "{{BaseURL}}/auth/login"

    matchers-condition: and
    matchers:
      - type: word
        words:
          - 'content="Leantime'
          - 'name="leantime-version'
          - 'window.leantime.currentProject'
          - '.leantimeLogo {'
          - 'class="leantimeLogo'
        condition: or

      - type: status
        status:
          - 200

    extractors:
      - type: regex
        name: version
        group: 1
        regex:
          - '<meta name="leantime-version" content="(?<leantime_version>\d+\.\d+\.\d+)">'
