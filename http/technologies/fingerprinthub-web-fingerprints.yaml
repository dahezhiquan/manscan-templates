id: fingerprinthub-web-fingerprints

info:
  name: FingerprintHub Web 指纹库 指纹识别（指纹识别）
  author: pdteam,righettod
  severity: info
  description: >-
    FingerprintHub 是面向 Web 资产识别的开源指纹规则集合，用于根据页面内容、响应头和图标特征判断目标技术栈。该模板通过请求目标服务并检查预设路径或首页响应、页面正文关键字、HTTP
    响应头等指纹特征，判断目标是否使用或暴露了 FingerprintHub Web 指纹库 相关组件；命中结果仅表示指纹特征匹配，可用于资产盘点、技术栈识别和后续安全评估，不代表已确认存在可利用漏洞。
  reference:
  - https://github.com/0x727/FingerprintHub
  classification:
    cwe-id: CWE-200
  metadata:
    max-request: 1
  tags: tech,discovery
