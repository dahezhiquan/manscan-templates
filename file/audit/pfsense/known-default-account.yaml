id: known-default-account

info:
  name: pfSense 默认账户未清理（本地文件安全扫描）
  author: pussycat0x
  severity: info
  description: |
    该模板检测 pfSense 是否存在已知默认账户。攻击者可利用默认账户字典尝试登录设备管理界面。
  reference:
    - https://docs.netgate.com/pfsense/en/latest/usermanager/defaults.html
  classification:
    cvss-metrics: CVSS:3.1/AV:N/AC:L/PR:N/UI:N/S:U/C:N/I:N/A:N
    cvss-score: 0
    cwe-id: CWE-200
  tags: audit,config,file,firewall,pfsense

file:
  - extensions:
      - xml

    matchers-condition: and
    matchers:
      - type: word
        words:
          - "<name>admin</name>"
          - "<descr><![CDATA[System Administrator]]></descr>"
          - "<priv>user-shell-access</priv>"
        condition: and

