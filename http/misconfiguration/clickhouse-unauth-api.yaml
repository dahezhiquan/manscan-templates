id: clickhouse-unauth-api

info:
  name: ClickHouse API 数据库 Interface Improper Authorization
  author: DhiyaneshDk
  severity: high
  description: |
    该模板用于核查 ClickHouse API 数据库 Interface Improper Authorization相关配置。该类问题通常源于管理端、API、控制台或调试接口缺少认证授权，导致未登录用户可直接访问敏感功能。模板会向目标发送探测请求，并依据请求 `/?query=SHOW%20DATABASES`、匹配 `default`、`system`、状态码 200 等证据确认目标是否存在该配置问题。
  impact: |
    - 攻击者可在未授权状态下查看系统状态、任务信息、配置数据或业务内容。
    - 若接口允许执行操作，可能进一步导致配置被修改、任务被触发、数据被导出或服务被接管。
  remediation: |
    - 为相关管理入口和 API 增加强认证、细粒度授权与访问审计。
    - 限制控制台、调试页和内部服务的公网访问，仅允许可信网络或堡垒机访问。
    - 排查访问日志，确认是否存在未授权访问、异常操作或批量枚举行为。
  reference:
    - https://github.com/luck-ying/Library-POC/blob/master/ClickHouse%E6%95%B0%E6%8D%AE%E5%BA%93/ClickHouse%E6%95%B0%E6%8D%AE%E5%BA%93%208123%E7%AB%AF%E5%8F%A3%E7%9A%84%E6%9C%AA%E6%8E%88%E6%9D%83%E8%AE%BF%E9%97%AE.py
    - https://github.com/PeiQi0/PeiQi-WIKI-Book/blob/main/docs/redteam/vulnerability/unauthorized/ClickHouse%208123%E7%AB%AF%E5%8F%A3.md?plain=1
  classification:
    cpe: cpe:2.3:a:clickhouse:clickhouse:*:*:*:*:*:*:*:*
  metadata:
    verified: true
    max-request: 1
    vendor: clickhouse
    product: clickhouse
    shodan-query: "X-ClickHouse-Summary"
    fofa-query: "X-ClickHouse-Summary"
  tags: misconfig,clickhouse,unauth,disclosure,vuln

http:
  - method: GET
    path:
      - "{{BaseURL}}/?query=SHOW%20DATABASES"

    matchers-condition: and
    matchers:
      - type: word
        part: body
        words:
          - 'default'
          - 'system'
        condition: and

      - type: word
        part: header
        words:
          - 'text/tab-separated-values'

      - type: status
        status:
          - 200
