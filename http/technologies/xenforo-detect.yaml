id: xenforo-detect

info:
  name: XenForo Forum 指纹识别（指纹识别）
  author: dhiyaneshDk,daffainfo
  severity: info
  description: >-
    XenForo 是商业论坛和社区平台，用于构建讨论区、会员系统、话题和社区互动功能。该模板通过请求目标服务并检查预设路径或首页响应、页面正文关键字、状态码等指纹特征，判断目标是否使用或暴露了
    XenForo Forum 相关组件；命中结果仅表示指纹特征匹配，可用于资产盘点、技术栈识别和后续安全评估，不代表已确认存在可利用漏洞。
  classification:
    cpe: cpe:2.3:a:xenforo:xenforo:*:*:*:*:*:*:*:*
  metadata:
    max-request: 1
    vendor: xenforo
    product: xenforo
    shodan-query: http.title:"XenForo"
  tags: tech,xenforo,discovery
http:
  - method: GET
    path:
      - '{{BaseURL}}/index.php'

    matchers-condition: and
    matchers:
      - type: word
        part: body
        words:
          - '<html id="XenForo"'
          - '<html id="XF"'
        condition: or

      - type: status
        status:
          - 200
