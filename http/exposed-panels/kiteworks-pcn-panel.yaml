id: kiteworks-pcn-panel

info:
  name: Kiteworks PCN 面板识别（指纹识别）
  author: righettod
  severity: info
  description: |
    该模板通过识别 Kiteworks PCN 登录入口的页面标题、特征文本或重定向行为，判断目标是否暴露了对应的认证界面。若命中，说明该登录面板对外可访问，可用于暴露面梳理与后续安全评估。
  reference:
    - https://www.kiteworks.com/platform/private-content-network/
  classification:
    cpe: cpe:2.3:a:accellion:kiteworks:*:*:*:*:*:*:*:*
  metadata:
    verified: true
    max-request: 1
    vendor: accellion
    product: kiteworks
    shodan-query: http.favicon.hash:-1215318992
    fofa-query: icon_hash=-1215318992
  tags: panel,kiteworks,login,detect,accellion,discovery

http:
  - method: GET
    path:
      - '{{BaseURL}}/login/locales/login_en.json'

    matchers-condition: and
    matchers:
      - type: word
        part: body
        words:
          - 'Secured by Kiteworks'
          - 'Return to sign in'
        condition: and
        case-insensitive: true

      - type: word
        part: header
        words:
          - 'application/octet-stream'

      - type: status
        status:
          - 200
