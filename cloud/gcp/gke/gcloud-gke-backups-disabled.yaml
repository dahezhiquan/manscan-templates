id: gcloud-gke-backups-disabled

info:
  name: GKE Clusters 未启用Backups已启用（云安全）
  author: princechaddha
  severity: medium
  description: GKE Backup for GKE 未启用时，集群工作负载和状态数据缺少托管备份恢复能力。本模板枚举集群并检查 addonsConfig.gkeBackupAgentConfig.enabled，字段为空时报告集群未启用备份组件。
  impact: |
    - 集群误删、配置损坏、勒索攻击或区域故障后，工作负载恢复时间和数据丢失风险增加。
    - 灾难恢复演练、合规保留和跨集群迁移能力会受到限制。
  remediation: |
    - 为关键 GKE 集群启用 Backup for GKE，并配置备份计划、保留周期和恢复范围。
    - 定期执行恢复演练，确认命名空间、持久卷和关键应用配置可恢复。
  reference:
    - https://cloud.google.com/kubernetes-engine/docs/how-to/backup-restore
    - https://www.trendmicro.com/cloudoneconformity/knowledge-base/gcp/GKE/enable-cluster-backups.html
  metadata:
    vendor: google
    product: google-kubernetes-engine
  tags: cloud,devops,gcp,gcloud,gke,kubernetes,security,backup,disaster-recovery,gcp-cloud-config

flow: |
  code(1)
  for(let projectId of iterate(template.projectIds)){
    set("projectId", projectId)
    code(2)
    for(let cluster of iterate(template.clusters)){
      cluster = JSON.parse(cluster)
      set("clusterName", cluster.name)
      set("location", cluster.location)
      code(3)
    }
  }

self-contained: true

code:
  - engine:
      - sh
      - bash
    source: |
      gcloud projects list --format="json(projectId)"

    extractors:
      - type: json
        name: projectIds
        internal: true
        json:
          - '.[].projectId'

  - engine:
      - sh
      - bash
    source: |
      gcloud container clusters list --project $projectId --format="json(name,location)"

    extractors:
      - type: json
        name: clusters
        internal: true
        json:
          - '.[]'

  - engine:
      - sh
      - bash
    source: |
      gcloud container clusters describe $clusterName --location $location --project $projectId --format="json(addonsConfig.gkeBackupAgentConfig.enabled)"

    matchers:
      - type: word
        words:
          - "null"

    extractors:
      - type: dsl
        dsl:
          - '"GKE cluster " + clusterName + " in " + location + " of project " + projectId + " does not have backups enabled"'
