id: kerberos-detect

info:
  name: Kerberos 服务识别（指纹识别）
  author: dahezhiquan
  severity: info
  description: |
    该模板沿用 Nmap 的 TCP Kerberos 探针，向目标发送域为 NM、服务主体为 krbtgt/NM 且省略客户端名称的 AS-REQ，并匹配该探针下全部 5 条启用的 kerberos-sec 响应规则，覆盖 MIT、Heimdal、Microsoft Windows 及 OpenWRT 相关响应变体。
    模板保留原规则的固定字节、长度范围、时间字段和匹配边界，通过十六进制匹配避免非 UTF-8 字节影响判断；命中仅确认 Kerberos 服务指纹，不代表存在漏洞，也不单独输出厂商、系统或版本结论。
  reference:
    - https://github.com/nmap/nmap/blob/master/nmap-service-probes
    - https://www.rfc-editor.org/rfc/rfc4120
  metadata:
    product: kerberos
    shodan-query: 'port:88'
  tags: kerberos,network,detect,tcp,discovery

tcp:
  - inputs:
      - data: "000000716a816e30816ba103020105a20302010aa4815e305ca00703050050800010a2041b024e4da3173015a003020100a10e300c1b066b72627467741b024e4da511180f31393730303130313030303030305aa70602041f1eb9d9a8173015020112020111020110020117020101020103020102"
        type: hex
        read: 1

    host:
      - "{{Hostname}}"
    port: 88
    read-all: true

    matchers:
      - type: dsl
        name: kerberos
        dsl:
          - "regex('^0000008[89a]7e818[6-8]30818[3-5]a003020105a10302011ea211180f(?:3[0-9]){14}5aa411180f(?:3[0-9]){14}5aa50[3-5]02(?:03[0-9a-f]{6}|02[0-9a-f]{4}|01[0-9a-f]{2})a603020106a9041b024e4daa173015a003020100a10e300c1b066b72627467741b024e4dab281b26436c69656e74206e6f7420666f756e6420696e204b65726265726f7320646174616261736500(?:0a)?$', hex_encode(raw))"
          - "regex('^0000006[d-f]7e6[b-d]306[9ab]a003020105a10302011ea211180f(?:3[0-9]){14}5aa411180f(?:3[0-9]){14}5aa50[3-5]02(?:03[0-9a-f]{6}|02[0-9a-f]{4}|01[0-9a-f]{2})a603020106a9041b024e4daa173015a003020100a10e300c1b066b72627467741b024e4dab0e1b0c4e554c4c5f434c49454e5400(?:0a)?$', hex_encode(raw))"
          - "regex('^0000006[2-4]7e6[0-2]30(?:5[ef]|60)a003020105a10302011ea411180f(?:3[0-9]){14}5aa50[3-5]02(?:03[0-9a-f]{6}|02[0-9a-f]{4}|01[0-9a-f]{2})a60302013ca9041b024e4daa173015a003020100a10e300c1b066b72627467741b024e4dab161b144e6f20636c69656e7420696e2072657175657374(?:0a)?$', hex_encode(raw))"
          - "regex('^0000004[a-c]7e4[89a]304[6-8]a003020105a10302011ea411180f(?:3[0-9]){14}5aa50[3-5]02(?:03[0-9a-f]{6}|02[0-9a-f]{4}|01[0-9a-f]{2})a603020144a9041b024e4daa173015a003020100a10e300c1b066b72627467741b024e4d(?:0a)?$', hex_encode(raw))"
          - "regex('^000000(?:7[9a-f]|[89a-e][0-9a-f]|f0)00(?:7[9a-f]|[89a-e][0-9a-f]|f0)000100007e(?:7[1-9a-f]|[89a-d][0-9a-f]|e[0-8])30(?:6[9a-f]|7[0-9a-f]|80)a003020105a10302011ea411180f(?:3[0-9]){14}5aa50[3-5]02(?:03[0-9a-f]{6}|02[0-9a-f]{4}|01[0-9a-f]{2})a60302013ca9[0-9a-f]{2}1b[0-9a-f]{2}(?:(?:(?:2[de]|3[0-9]|[46][1-9a-f]|5[0-9af]|7[0-9a]))+)aa1d301ba003020100a11430121b066b61646d696e1b086368616e67657077ac230421000152657175657374206c656e6774682077617320696e636f6e73697374656e74', hex_encode(raw))"
        condition: or
