id: buildpath-file-disclosure

info:
  name: .buildpath 文件 泄露
  author: ritikchaddha
  severity: low
  description: |
    检测到 .buildpath 文件 泄露。目标响应或文件中可能暴露配置、凭据、密钥、令牌、环境变量或历史记录等敏感信息，可能被用于进一步入侵。
  tags: exposure,files,buildpath,config

http:
  - method: GET
    path:
      - "{{BaseURL}}/.buildpath"

    matchers-condition: and
    matchers:
      - type: word
        part: body
        words:
          - "</buildpath>"
          - "<?xml"
        condition: and

      - type: status
        status:
          - 200
