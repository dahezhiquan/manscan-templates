id: syncthru-web-service

info:
  name: SyncThru Web Service 面板识别（暴露面识别）
  author: DhiyaneshDk
  severity: info
  description: 该模板通过识别 SyncThru Web Service 面板、控制台或管理界面的页面特征，判断目标是否暴露了对应服务入口。若命中，说明该后台或运维界面对外可访问，可用于资产识别与暴露面排查。
  reference:
    - https://www.exploit-db.com/ghdb/7843
  classification:
    cvss-metrics: CVSS:3.0/AV:N/AC:L/PR:N/UI:N/S:U/C:N/I:N/A:N
    cwe-id: CWE-200
    cpe: cpe:2.3:a:samsung:syncthru_web_service:*:*:*:*:*:*:*:*
  metadata:
    verified: true
    max-request: 1
    vendor: samsung
    product: syncthru_web_service
    shodan-query:
      - title:"SyncThru Web Service"
      - http.title:"syncthru web service"
    fofa-query: title="syncthru web service"
    google-query: intitle:"syncthru web service"
  tags: edb,panel,syncthru,printer,samsung,discovery

http:
  - method: GET
    path:
      - "{{BaseURL}}/sws/index.sws"

    matchers-condition: and
    matchers:
      - type: word
        words:
          - "<title>SyncThru Web Service</title>"

      - type: word
        part: header
        words:
          - "text/html"

      - type: status
        status:
          - 200
