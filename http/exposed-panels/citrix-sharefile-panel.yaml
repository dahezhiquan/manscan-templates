id: citrix-sharefile-panel

info:
  name: Sharefile Login 面板（指纹识别）
  author: irshad ahamed
  severity: info
  description: |-
    检测到目标站点存在 Sharefile Login 相关响应特征。Sharefile Login 是自动化运维、持续集成或任务编排平台，用于管理作业、流水线、凭据、执行记录和部署流程。模板请求 `/Authentication/Login`，并通过页面标题或正文关键字、状态码确认该系统指纹，用于资产识别、系统盘点和暴露面梳理。
  reference:
    - https://www.sharefile.com/
  classification:
    cpe: cpe:2.3:a:citrix:sharefile:*:*:*:*:*:*:*:*
  metadata:
    verified: true
    max-request: 1
    vendor: citrix
    product: sharefile
    shodan-query:
      - title:"ShareFile Login"
      - http.title:"sharefile login"
    fofa-query: title="sharefile login"
    google-query: intitle:"sharefile login"
  tags: sharefile,login,panel,detect,citrix,discovery
http:
  - method: GET
    path:
      - "{{BaseURL}}/Authentication/Login"

    matchers-condition: and
    matchers:
      - type: word
        words:
          - 'ShareFile Login'
          - 'password'
        condition: and

      - type: status
        status:
          - 200
