id: orangehrm-panel

info:
  name: OrangeHRM 登录面板识别（暴露面识别）
  author: Th3l0newolf
  severity: info
  description: |
    该模板通过识别 OrangeHRM 登录入口的页面标题、特征文本或重定向行为，判断目标是否暴露了对应的认证界面。若命中，说明该登录面板对外可访问，可用于暴露面梳理与后续安全评估。
  reference:
    - https://www.orangehrm.com/
  metadata:
    verified: true
    max-request: 3
    shodan-query: OrangeHRM
  tags: orangehrm,hrm,login,panel,discovery

http:
  - method: GET
    path:
      - "{{BaseURL}}"
      - "{{BaseURL}}/symfony/web/index.php/auth/login"
      - "{{BaseURL}}/web/index.php/auth/login"

    stop-at-first-match: true
    matchers-condition: and
    matchers:
      - type: word
        part: body
        words:
          - "<title>OrangeHRM</title>"
          - "OrangeHRM, Inc. All rights reserved"
        condition: or

      - type: status
        status:
          - 200
