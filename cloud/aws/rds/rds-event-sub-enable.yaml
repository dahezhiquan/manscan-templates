id: rds-event-sub-enable
info:
  name: RDS 数据库实例事件订阅未启用（云安全）
  author: princechaddha
  severity: high
  description: RDS db-instance 事件订阅用于接收实例可用性、备份、维护和配置变更等通知；缺失时，实例级异常不易被及时发现。该模板检查 SourceType 为 db-instance 的事件订阅是否为空。
  impact: |
    - 实例故障、维护变更或备份异常可能无法触发及时告警。
    - 运维团队需要依赖人工检查，增加恢复延迟和事件遗漏概率。
  remediation: |
    - 为 db-instance SourceType 创建 RDS event subscription，并订阅关键事件类别。
    - 将订阅目标接入 SNS、邮件、聊天工具或事件管理平台，并定期测试通知可达性。
  reference:
    - https://docs.aws.amazon.com/AmazonRDS/latest/UserGuide/USER_Events.html
  metadata:
    vendor: amazon
    product: rds
  tags: cloud,devops,aws,amazon,rds,aws-cloud-config
variables:
  region: "ap-northeast-1"

self-contained: true
code:
  - engine:
      - sh
      - bash
    source: |
      aws rds describe-event-subscriptions --region $region --query "EventSubscriptionsList[?SourceType == 'db-instance'].CustSubscriptionId"

    matchers:
      - type: word
        words:
          - '[]'

    extractors:
      - type: dsl
        dsl:
          - '"There are no Amazon RDS event subscriptions created for instance level events in " + region + " AWS region"'
