id: azure-sql-va-emails-unconfigured
info:
  name: Azure SQL 漏洞评估通知邮箱未配置（云安全）
  author: princechaddha
  severity: medium
  description: Azure SQL 漏洞评估通过扫描数据库弱点并向指定管理员发送结果，通知邮箱未配置时，发现的高风险配置和漏洞可能无法及时交付给责任团队。本模板枚举 SQL 服务器并查询漏洞评估配置，在返回结果包含空的 emails 数组时报告。
  impact: |
    - 数据库漏洞评估结果可能无人接收，导致弱口令、过度权限和暴露配置长期未整改。
    - 缺少通知闭环会延迟安全响应，并使漏洞评估无法有效支持合规证明和风险跟踪。
  remediation: |
    - 在 Azure SQL 漏洞评估配置中设置安全团队或数据库责任人的通知邮箱，并确认邮件投递可达。
    - 同时配置定期扫描、结果存储和告警升级流程，避免仅依赖单一邮箱而造成通知失效。
  reference:
    - https://docs.microsoft.com/en-us/azure/azure-sql/database/security-overview
  metadata:
    vendor: microsoft
    product: azure-sql-database
  tags: cloud,devops,azure,microsoft,mssql,azure-cloud-config

flow: |
  code(1);
  for (let ServerData of iterate(template.serverList)) {
    ServerData = JSON.parse(ServerData);
    set("name", ServerData.ServerName);
    set("resourceGroup", ServerData.ResourceGroupName);
    code(2);
  }

self-contained: true
code:
  - engine:
      - sh
      - bash
    source: |
      az sql server list --query "[].{ServerName:name, ResourceGroupName:resourceGroup}" --output json

    extractors:
      - type: json
        name: serverList
        internal: true
        json:
          - '.[]'

  - engine:
      - sh
      - bash
    source: |
      az sql va config show --server "$name" --resource-group "$resourceGroup" --query "{StorageAccountName: storageAccount, NotificationEmails: emailAdmins}" --output json

    matchers-condition: and
    matchers:
      - type: word
        words:
          - '"emails": []'

    extractors:
      - type: dsl
        dsl:
          - 'name + " in " + resourceGroup + " has no emails configured for VA notifications"'
