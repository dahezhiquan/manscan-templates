id: grav-cms-detect

info:
  name: Grav CMS 指纹识别（指纹识别）
  author: cyllective
  severity: info
  description: >-
    Grav CMS 是基于文件的 PHP 内容管理系统，用于构建轻量级网站和文档站点。该模板通过请求目标服务并检查预设路径或首页响应、页面正文关键字、HTTP
    响应头等指纹特征，判断目标是否使用或暴露了 Grav CMS 相关组件；命中结果仅表示指纹特征匹配，可用于资产盘点、技术栈识别和后续安全评估，不代表已确认存在可利用漏洞。
  reference:
  - https://github.com/getgrav/grav
  metadata:
    product: grav
    max-request: 1
  tags: tech,grav,discovery
http:
  - method: GET
    path:
      - "{{BaseURL}}"

    matchers-condition: or
    matchers:
      - type: word
        part: header
        words:
          - 'Set-Cookie: grav-site-'

      - type: regex
        part: body
        regex:
          - "(?i)<meta\\b[^>]*name=[\"\\x27]generator[\"\\x27][^>]*content=[\"\\x27]GravCMS(?:\\s+[0-9][0-9A-Za-z.+-]*)?[\"\\x27]"

    extractors:
      - type: regex
        name: detected_version
        part: body
        group: 1
        regex:
          - (?i)<meta\b[^>]*name\s*=\s*["\x27]generator["\x27][^>]*content\s*=\s*["\x27]GravCMS\s+([0-9]+(?:[.][0-9]+)+(?:[-+._][0-9A-Za-z]+)*)["\x27]
        internal: true
      - type: dsl
        dsl:
          - 'regex("^[0-9]+(?:[.][0-9]+)*(?:[-+._][0-9A-Za-z]+)*$", detected_version) ? detected_version : ""'
