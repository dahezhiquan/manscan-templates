id: linksys-wifi-login

info:
  name: Linksys Smart Wi-Fi 登录面板识别（指纹识别）
  author: pussycat0x
  severity: info
  description: |-
    检测到目标站点存在 Linksys Smart Wi-Fi 相关响应特征。Linksys Smart Wi-Fi 是网络设备或网关的 Web 管理界面，用于配置路由、无线、端口转发、安全策略和设备运行参数。模板请求 `/`，并通过页面标题或正文关键字、状态码确认该系统指纹，用于资产识别、系统盘点和暴露面梳理。
  classification:
    cvss-metrics: CVSS:3.0/AV:N/AC:L/PR:N/UI:N/S:U/C:N/I:N/A:N
    cwe-id: CWE-200
  metadata:
    max-request: 1
    shodan-query: http.title:"Linksys Smart WI-FI"
  tags: tech,panel,linksys,iot,discovery
http:
  - method: GET
    path:
      - '{{BaseURL}}'

    host-redirects: true
    max-redirects: 2

    matchers-condition: and
    matchers:
      - type: word
        part: body
        words:
          - "<title>Linksys Smart Wi-Fi</title>"

      - type: status
        status:
          - 200
