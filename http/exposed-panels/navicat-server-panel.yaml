id: navicat-server-panel

info:
  name: Navicat On-Prem Server 面板识别（指纹识别）
  author: ritikchaddha
  severity: info
  description: |-
    检测到目标站点存在 Navicat On-Prem Server 相关响应特征。Navicat On-Prem Server 是数据库、ERP 或数据服务的 Web 管理入口，用于查看数据、执行查询、管理业务对象、集群或连接配置。模板请求 `/`、`/login` 路径，并通过页面标题或正文关键字、状态码确认该系统指纹，用于资产识别、系统盘点和暴露面梳理。
  metadata:
    verified: true
    max-request: 2
    shodan-query: http.favicon.hash:598296063
    fofa-query: icon_hash="598296063"
  tags: panel,navicat,on-prem,detect,discovery
http:
  - method: GET
    path:
      - "{{BaseURL}}"
      - "{{BaseURL}}/login"

    stop-at-first-match: true
    host-redirects: true
    max-redirects: 2

    matchers-condition: and
    matchers:
      - type: word
        part: body
        words:
          - 'Navicat On-Prem Server</title>'
          - 'content="Navicat On-Prem Server'
        condition: or

      - type: status
        status:
          - 200
