id: chevereto-detect

info:
  name: Chevereto 指纹识别（指纹识别）
  author: pikpikcu
  severity: info
  description: Chevereto 是图片托管和图库系统，用于上传、管理、分享和展示图片资源。该模板请求首页，并依据 HTTP 200 状态码、页面标题、正文关键字或品牌资源特征识别目标是否使用或暴露了 Chevereto 相关组件，适用于资产盘点、技术栈识别和后续安全评估；命中结果仅表示指纹特征匹配，不代表已确认存在可利用漏洞。
  classification:
    cpe: cpe:2.3:a:chevereto:chevereto:*:*:*:*:*:*:*:*
  metadata:
    max-request: 1
    vendor: chevereto
    product: chevereto
    shodan-query: http.title:"Centreon"
  tags: tech,chevereto,discovery

http:
  - method: GET
    path:
      - "{{BaseURL}}"

    matchers-condition: and
    matchers:
      - type: regex
        part: body
        regex:
          - 'content="Chevereto(.*)">'

      - type: status
        status:
          - 200

    extractors:
      - type: regex
        part: body
        group: 1
        regex:
          - '<meta name="generator" content="(.*)">'
