id: burp-collaborator-detect

info:
  name: Burp Collaborator 服务器 指纹识别（指纹识别）
  author: lum8rjack
  severity: info
  description: |-
    Burp Collaborator 服务器 是 Burp Suite OAST/交互检测服务，用于接收 DNS、HTTP 等带外交互请求。该模板请求首页，并依据 HTTP 200 状态码、页面标题、正文关键字或品牌资源特征、响应头特征识别目标是否使用或暴露了 Burp Collaborator 服务器 相关组件，适用于资产盘点、技术栈识别和后续安全评估；命中结果仅表示指纹特征匹配，不代表已确认存在可利用漏洞。
  reference:
  - https://portswigger.net/burp/documentation/collaborator
  classification:
    cvss-metrics: CVSS:3.0/AV:N/AC:L/PR:N/UI:N/S:U/C:N/I:N/A:N
    cvss-score: 0
    cwe-id: CWE-200
    cpe: cpe:2.3:a:portswigger:burp_suite:*:*:*:*:*:*:*:*
  metadata:
    verified: true
    max-request: 1
    shodan-query: "Server: Burp Collaborator"
    product: burp_suite
    vendor: portswigger
  tags: burp,tech,detect,discovery

http:
  - method: GET
    path:
      - "{{BaseURL}}"

    matchers-condition: and
    matchers:
      - type: word
        part: header
        words:
          - "Server: Burp Collaborator https://burpcollaborator.net/"

      - type: status
        status:
          - 200

    extractors:
      - type: regex
        part: header
        group: 1
        regex:
          - "(?:X-(Collaborator-Version: [0-9]))"
