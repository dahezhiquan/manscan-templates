id: spark-webui-unauth

info:
  name: 未授权 Spark WebUI
  author: princechaddha
  severity: medium
  description: |
    检测到 未授权 Spark WebUI。目标功能在未认证状态下可访问，可能暴露管理入口、业务数据、系统状态或可执行操作，需确认是否存在访问控制缺失。
  reference:
    - https://github.com/vulhub/vulhub/tree/master/spark/unacc
  metadata:
    max-request: 1
  tags: unauth,vulhub,spark,misconfig,vuln

http:
  - method: GET
    path:
      - "{{BaseURL}}"

    matchers-condition: and
    matchers:
      - type: status
        status:
          - 200

      - type: word
        words:
          - "<title>Spark Master at spark://"
          - "<strong>URL:</strong>"
        part: body
        condition: and
