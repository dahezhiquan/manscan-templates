id: default-tengine-page

info:
  name: Tengine 默认页面 指纹识别（指纹识别）
  author: pussycat0x
  severity: info
  description: Tengine 默认页面 是基于 Nginx 的 Web 服务器发行版，用于高并发站点、代理和负载均衡。该模板请求首页，并依据 HTTP 200 状态码、页面标题、正文关键字或品牌资源特征识别目标是否使用或暴露了 Tengine 默认页面 相关组件，适用于资产盘点、技术栈识别和后续安全评估；命中结果仅表示指纹特征匹配，不代表已确认存在可利用漏洞。
  classification:
    cpe: cpe:2.3:a:alibaba:tengine:*:*:*:*:nginx:*:*:*
  metadata:
    verified: true
    max-request: 1
    vendor: alibaba
    product: tengine
    shodan-query: http.title:"Welcome to tengine"
  tags: tech,tengine,default-page,discovery

http:
  - method: GET
    path:
      - '{{BaseURL}}'

    matchers-condition: and
    matchers:
      - type: word
        part: body
        words:
          - 'Welcome to tengine'
          - 'Thank you for using tengine'
        condition: and

      - type: status
        status:
          - 200
