id: ibm-decision-runner

info:
  name: IBM Decision Runner 指纹识别（指纹识别）
  author: DhiyaneshDK
  severity: info
  description: |
    用于识别目标是否部署 IBM Decision Runner 并提取相关版本或构建信息，模板会结合页面标题、页面正文、状态码、特定路径或已知端点和版本或标识提取结果进行指纹匹配。
  reference:
    - https://www.ibm.com/docs/en/odm/8.8.1?topic=simulation-tuning-decision-runner-web-application
  metadata:
    verified: true
    max-request: 1
  tags: ibm,detect,tech,ibm-decision-runner,discovery

http:
  - method: GET
    path:
      - "{{BaseURL}}/DecisionRunner/"

    matchers-condition: and
    matchers:
      - type: word
        part: body
        words:
          - "<title>Decision Runner</title>"

      - type: status
        status:
          - 200

    extractors:
      - type: regex
        part: body
        group: 1
        regex:
          - 'Decision Server ([0-9.]+)'
