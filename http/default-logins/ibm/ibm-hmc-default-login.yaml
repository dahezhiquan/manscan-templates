id: ibm-hmc-default-login

info:
  name: IBM Power HMC 默认口令登录（弱口令）
  author: R3S OST
  severity: high
  description: |
    该模板用于检测 IBM Power HMC 是否仍可使用默认凭据或弱口令登录。模板主要向 `/hmc/j_security_check` 等认证入口发送请求，使用内置默认凭据组合进行认证尝试，并根据响应中的 `len(body) == 0`、`status_code == 303` 等登录成功特征判断登录是否成功；命中说明目标未及时修改出厂、示例或初始化账号口令。
  impact: |
    - 攻击者可接管 IBM Power HMC 的 Web 管理界面，查看设备状态、网络配置、运行日志或敏感业务参数。
    - 被接管的网络、工控、打印、语音、存储或远程管理设备可能被用于中断业务、改变路由/访问策略、窃取流量或作为内网横向移动入口。
  remediation: |
    - 立即修改所有默认账号口令，禁用不再使用的出厂账号，并为管理账户设置高强度唯一密码。
    - 将设备管理入口限制在 VPN、堡垒机或可信管理网段内，避免直接暴露到公网。
    - 升级设备固件或管理组件，审计近期登录记录、配置变更和异常会话。
  reference:
    - https://www.ibm.com/docs/en/power8?topic=tools-hardware-management-console
  classification:
    cvss-metrics: CVSS:3.0/AV:N/AC:L/PR:N/UI:N/S:C/C:L/I:L/A:L
    cvss-score: 8.3
    cwe-id: CWE-522
  metadata:
    verified: true
    max-request: 1
    shodan-query: http.favicon.hash:262502857
  tags: default-login,ibm,hmc,vuln

http:
  - raw:
      - |
        POST /hmc/j_security_check HTTP/1.1
        Host: {{Hostname}}
        Content-Type: application/x-www-form-urlencoded

        j_username={{username}}&j_password={{password}}&j_newConsole=Dashboard&j_security_check=Log+in

    payloads:
      username:
        - hscroot
      password:
        - abc123
    attack: pitchfork

    matchers:
      - type: dsl
        dsl:
          - "len(body) == 0"
          - "status_code == 303"
          - "contains(header, 'Location: /hmc/connect;jsessionid=')"
        condition: and
