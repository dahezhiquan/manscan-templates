id: mitric-checker-panel

info:
  name: Mitric Checker 登录面板识别（指纹识别）
  author: righettod
  severity: info
  description: |-
    检测到目标站点存在 Mitric Checker 相关响应特征。Mitric Checker 是 AI、机器学习或 Notebook 相关平台，用于管理模型、数据集、工作区、实验、推理服务或训练任务。模板请求 `/QSA/Login.aspx`、`/API/External/GetPrivacy` 路径，并通过页面标题或正文关键字、状态码、DSL 条件确认该系统指纹，用于资产识别、系统盘点和暴露面梳理。
  reference:
    - https://www.mitric.com/en/audit-with-checker/
  metadata:
    verified: true
    max-request: 2
  tags: panel,mitric,login,detect,discovery
http:
  - method: GET
    path:
      - "{{BaseURL}}/QSA/Login.aspx"
      - "{{BaseURL}}/API/External/GetPrivacy"

    stop-at-first-match: true

    matchers:
      - type: dsl
        dsl:
          - 'status_code == 200'
          - 'contains_any(to_lower(body), "/checker/", "bg-blue-checker", "checker platform")'
        condition: and
