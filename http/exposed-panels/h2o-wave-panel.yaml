id: h2o-wave-panel

info:
  name: H2O Wave ML Application Server 识别（指纹识别）
  author: rxerium
  severity: info
  description: |
    该模板通过识别 H2O Wave ML Application Server 面板、控制台或管理界面的页面特征，判断目标是否暴露了对应服务入口。若命中，说明该后台或运维界面对外可访问，可用于资产识别与暴露面排查。
  reference:
    - https://github.com/h2oai/wave
    - https://wave.h2o.ai/
  metadata:
    verified: true
    max-request: 1
    vendor: h2oai
    product: wave
    shodan-query: 'http.title:"H2O Wave"'
  tags: panel,h2o-wave,h2o,ml,ai,detect,discovery

http:
  - method: GET
    path:
      - "{{BaseURL}}"

    host-redirects: true
    max-redirects: 2

    matchers-condition: and
    matchers:
      - type: word
        part: body
        words:
          - "h2o-wave"
          - "H2O Wave"
        condition: or

      - type: status
        status:
          - 200
