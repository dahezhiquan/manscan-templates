id: knime-server-panel

info:
  name: KNIME Server / Business Hub WebPortal - 检测（暴露面识别）
  author: rxerium
  severity: info
  description: |-
    检测到 KNIME Server（及其后继产品 KNIME Business Hub），这是 KNIME AG 推出的商业平台，用于部署、执行和管理在 KNIME Analytics Platform 中构建的数据科学与机器学习工作流。通过其底层静态资源路径识别出暴露的 WebPortal 登录页，包括白标/品牌定制化部署。
  reference:
    - https://www.knime.com/knime-software/knime-server
    - https://www.knime.com/knime-business-hub
    - https://docs.knime.com/latest/business_hub_admin_guide/index.html
  metadata:
    verified: true
    max-request: 1
    vendor: knime
    product: knime_server
    shodan-query: 'html:"_login/_nuxt"'
  tags: panel,knime,ml,ai,data-science,detect,discovery

http:
  - method: GET
    path:
      - "{{BaseURL}}"

    host-redirects: true
    max-redirects: 2

    matchers-condition: and
    matchers:
      - type: word
        part: body
        words:
          - "webportal/_nuxt/theme/favicon"
          - "_login/_nuxt"
        condition: and

      - type: status
        status:
          - 200
