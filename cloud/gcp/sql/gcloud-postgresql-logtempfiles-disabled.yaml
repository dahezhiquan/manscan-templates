id: gcloud-postgresql-logtempfiles-disabled

info:
  name: PostgreSQL 数据库实例未启用 log_temp_files 标志（云安全）
  author: princechaddha
  severity: medium
  description: PostgreSQL log_temp_files 可记录临时文件使用情况，帮助发现高成本查询和异常资源消耗。本模板检查 Cloud SQL PostgreSQL 实例 databaseFlags 中 log_temp_files 的值，匹配 -1 时报告临时文件日志被禁用。
  impact: |
    - 大量临时文件导致的磁盘压力、慢查询或异常资源消耗缺少可追踪证据。
    - 安全团队难以及时发现可疑的大规模排序、哈希或数据处理行为。
  remediation: |
    - 设置合适的 log_temp_files 阈值，记录超过基线的临时文件使用情况。
    - 将临时文件日志与磁盘、查询性能和连接来源指标结合分析，及时处理异常 SQL。
  reference:
    - https://cloud.google.com/sql/docs/postgres/configure-database-flags
  metadata:
    vendor: google
    product: cloud-sql
  tags: cloud,devops,gcp,google-cloud-sql,gcp-cloud-config

flow: |
  code(1)
  for(let projectId of iterate(template.projectIds)){
    set("projectId", projectId)
    code(2)
    for(let sqlInstance of iterate(template.sqlInstances)){
      set("sqlInstance", sqlInstance)
      code(3)
    }
  }

self-contained: true

code:
  - engine:
      - sh
      - bash
    source: |
      gcloud projects list --format="json(projectId)"

    extractors:
      - type: json
        name: projectIds
        internal: true
        json:
          - '.[].projectId'

  - engine:
      - sh
      - bash
    source: |
      gcloud sql instances list --project $projectId --filter='DATABASE_VERSION:POSTGRES*' --format="json(name)"

    extractors:
      - type: json
        name: sqlInstances
        internal: true
        json:
          - '.[].name'

  - engine:
      - sh
      - bash
    source: |
      gcloud sql instances describe $sqlInstance --project $projectId --format=json | jq '.settings.databaseFlags // [] | .[] | select(.name=="log_temp_files") | .value'

    matchers:
      - type: word
        words:
          - '-1'

    extractors:
      - type: dsl
        dsl:
          - '"log_temp_files flag is disabled for PostgreSQL instance: " + sqlInstance + " in project: " + projectId'
