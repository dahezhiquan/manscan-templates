id: o2-mobile-phish

info:
  name: O2 Mobile 仿冒钓鱼网站（钓鱼网站识别）
  author: rxerium
  severity: info
  description: |
    检测到疑似仿冒 O2 Mobile 的钓鱼网站。模板在目标页面返回 200、页面内容命中 O2 Mobile 的品牌页面特征，且当前主机不属于 O2 Mobile.co.uk 官方域名时触发，用于识别借用 O2 Mobile 品牌页面诱导用户信任的仿冒站点。
  reference:
    - https://o2.co.uk
  metadata:
    max-request: 1
  tags: phishing,o2,osint,discovery
http:
  - method: GET
    path:
      - "{{BaseURL}}"

    host-redirects: true
    max-redirects: 2

    matchers-condition: and
    matchers:
      - type: word
        words:
          - 'O2 | Phone, SIM &amp; Tech Deals - See What You Can Do'

      - type: status
        status:
          - 200

      - type: dsl
        dsl:
          - '!contains(host,"o2.co.uk")'
