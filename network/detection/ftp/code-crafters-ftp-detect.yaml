id: code-crafters-ftp-detect
info:
  name: Code-Crafters Ability FTP 服务识别（指纹识别）
  author: pussycat0x
  severity: info
  description: |
    Code-Crafters Ability FTP 是 FTP 服务实现、设备内置文件传输组件或 FTP 代理，常用于文件传输、设备配置、固件维护或旧系统集成。该模板连接 21/TCP 并读取协议响应，通过匹配 `Code Crafters Ability FTP` 等响应特征识别目标服务。
  metadata:
    verified: true
    shodan-query: "Code-Crafters ftp"
    max-request: 1
  tags: network,ftp,codecrafters,ability,detect,tcp,discovery

tcp:
  - inputs:
      - data: 00000000
        type: hex

    host:
      - "{{Hostname}}"
    port: 21
    read-size: 1024

    matchers:
      - type: word
        words:
          - "Code Crafters Ability FTP"
