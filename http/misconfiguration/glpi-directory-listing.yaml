id: glpi-directory-listing

info:
  name: GLPI 目录列出 Session 暴露
  author: RedTeamBrasil,ImNightmaree,0x_Akoko
  severity: medium
  description: |
    该模板用于核查 GLPI 目录列出 Session 暴露。该类问题通常源于 Web 目录索引、仓库列表、对象列表或文件浏览功能未关闭，导致未授权用户可枚举文件和目录。模板会向目标发送探测请求，并依据请求 `/glpi/files/`、`/glpi/files/_sessions/`、匹配 `status_code == 200`、匹配 `contains_all(body, "Index of", "Parent Directory")`等证据确认目标是否存在该配置问题。
  impact: |
    - 攻击者可浏览目录结构、源代码、备份、日志、构建产物或对象存储资源。
    - 暴露的文件名和内容可能泄露业务结构、凭据线索或可进一步利用的敏感数据。
  remediation: |
    - 关闭目录索引、公开列表和未授权文件浏览功能。
    - 为需要下载的资源配置显式访问控制，避免把备份、源码和日志放入 Web 可访问路径。
    - 检查已暴露目录中的敏感文件并轮换可能泄露的凭据或令牌。
  reference:
    - https://glpi-project.org/
  classification:
    cvss-metrics: CVSS:3.1/AV:N/AC:L/PR:N/UI:N/S:U/C:L/I:N/A:N
    cvss-score: 5.3
    cwe-id: CWE-548
  metadata:
    verified: true
    max-request: 4
    shodan-query: http.title:"Index of" http.html:"glpi"
    fofa-query: body="Index of" && body="glpi"
  tags: glpi,misconfig,exposure,session

http:
  - method: GET
    path:
      - "{{BaseURL}}/glpi/files/"
      - "{{BaseURL}}/glpi/files/_sessions/"
      - "{{BaseURL}}/files/_sessions/"
      - "{{BaseURL}}/glpi/"

    stop-at-first-match: true

    matchers:
      - type: dsl
        dsl:
          - 'status_code == 200'
          - 'contains_all(body, "Index of", "Parent Directory")'
          - 'contains_any(body, "glpi", "sess_", "_sessions", "_cron", "_dumps")'
        condition: and
