id: ec2-unrestricted-mysql
info:
  name: EC2 安全组对公网开放 MySQL 端口（云安全）
  author: princechaddha
  severity: critical
  description: EC2 安全组对公网开放 MySQL 端口是一类数据库服务暴露风险，TCP 3306 面向任意来源会增加账号爆破、数据泄露和数据库漏洞利用风险。MySQL 服务通常应通过私有网络被应用访问，而不是直接暴露到互联网。模板通过 `describe-security-groups` 筛选 3306 端口且来源为 `0.0.0.0/0` 的入站规则，并输出命中的安全组 ID。
  impact: |
    - MySQL 服务可能被互联网扫描、爆破或利用，导致数据读取、篡改或删除。
    - 暴露数据库端口会扩大攻击面，并可能成为进入业务内网的入口。
  remediation: |
    - 移除面向公网的 3306 端口入站规则，仅允许应用子网或受控管理网络访问。
    - 启用强认证、最小权限账号、传输加密和数据库审计。
  reference:
    - https://docs.aws.amazon.com/AWSEC2/latest/UserGuide/ec2-security-groups.html
  metadata:
    vendor: amazon
    product: ec2
  tags: cloud,devops,aws,amazon,ec2,aws-cloud-config

variables:
  region: "us-east-1"

self-contained: true
code:
  - engine:
      - sh
      - bash
    source: |
      aws ec2 describe-security-groups --region $region --filters Name=ip-permission.from-port,Values=3306 Name=ip-permission.to-port,Values=3306 Name=ip-permission.cidr,Values='0.0.0.0/0' --output json --query 'SecurityGroups[*].GroupId'

    extractors:
      - type: json
        name: securitygroup
        internal: true
        json:
          - '.[]'

      - type: dsl
        dsl:
          - 'securitygroup + " security group(s) alows unrestricted mongodb access (0.0.0.0/0 or ::/0) on port 3306"'
