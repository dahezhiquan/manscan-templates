id: ssh-server-enumeration

info:
  name: SSH 服务识别（指纹识别）
  author: Ice3man543,tarunKoyalwar
  severity: info
  description: |
    SSH 服务端会在连接建立后发送以 `SSH-` 开头的协议标识行，通常包含协议版本及 OpenSSH、Dropbear 等实现名称。模板读取目标 22/TCP 的服务端标识行，只有符合 SSH 协议格式才确认 SSH 服务；标识包含软件版本时提取软件名称和版本，完整标识保留在响应证据中。显式指定目标端口时使用该端口。
  reference:
    - https://www.rfc-editor.org/rfc/rfc4253#section-4.2
  metadata:
    shodan-query: 'port:22 "SSH-"'
  tags: js,ssh,detect,network,discovery

javascript:
  - code: |
      const net = require("nuclei/net");
      const conn = net.Open("tcp", `${Host}:${Port}`);
      conn.SetTimeout(3);
      let data = "";
      let banner = "";
      try {
        for (let i = 0; i < 4; i++) {
          data += conn.RecvString(256);
          const lines = data.split("\n");
          for (let j = 0; j < lines.length - 1; j++) {
            const line = lines[j].replace(/\r$/, "");
            if (line.length <= 253 && /^SSH-(?:1\.[0-9]+|2\.0)-[!-~]+(?: [ -~]*)?$/.test(line)) {
              banner = line;
              break;
            }
          }
          if (banner) break;
        }
      } finally {
        conn.Close();
      }
      Export(banner);
    args:
      Host: "{{Host}}"
      Port: "22"

    matchers:
      - type: regex
        part: response
        regex:
          - '^SSH-(?:1\.[0-9]+|2\.0)-[!-~]+(?: [ -~]*)?$'

    extractors:
      - type: regex
        name: version
        part: response
        group: 1
        regex:
          - '^SSH-(?:1\.[0-9]+|2\.0)-([A-Za-z][A-Za-z0-9.+_-]*[ _/-][0-9]+(?:[._-][0-9]+)*(?:p[0-9]+)?)(?:[^0-9]|$)'
