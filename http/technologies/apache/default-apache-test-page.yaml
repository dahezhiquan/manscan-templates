id: default-apache-test-page

info:
  name: Apache HTTP 服务器 测试页面 指纹识别（指纹识别）
  author: dhiyaneshDk
  severity: info
  description: Apache HTTP 服务器 测试页面 是 Apache HTTP Server Web 服务器，用于托管网站、反向代理和处理 HTTP 请求。该模板请求首页，并依据页面标题、正文关键字或品牌资源特征识别目标是否使用或暴露了 Apache HTTP 服务器 测试页面 相关组件，适用于资产盘点、技术栈识别和后续安全评估；命中结果仅表示指纹特征匹配，不代表已确认存在可利用漏洞。
  classification:
    cpe: cpe:2.3:a:apache:http_server:*:*:*:*:*:*:*:*
  metadata:
    max-request: 1
    vendor: apache
    product: http_server
    shodan-query: http.title:"Apache HTTP Server Test Page powered by CentOS"
  tags: tech,apache,discovery

http:
  - method: GET
    path:
      - '{{BaseURL}}'

    matchers:
      - type: word
        words:
          - "<title>Apache HTTP Server Test Page powered by CentOS</title>"
        part: body
