id: kubernetes-k8s-kubelet-stats

info:
  name: Kubelet Stats 指纹识别（指纹识别）
  author: sharath
  severity: info
  description: >-
    Kubelet 是每个 Kubernetes 节点上的节点代理，stats 接口用于提供容器、Pod 和节点资源统计数据。该模板通过请求目标服务并检查预设路径或首页响应、页面正文关键字、状态码等指纹特征，判断目标是否使用或暴露了
    Kubelet Stats 相关组件；命中结果仅表示指纹特征匹配，可用于资产盘点、技术栈识别和后续安全评估，不代表已确认存在可利用漏洞。
  metadata:
    max-request: 1
  tags: tech,kubernetes,devops,kubelet,discovery
http:
  - method: GET
    path:
      - "{{BaseURL}}/stats/summary"

    matchers-condition: and
    matchers:
      - type: status
        status:
          - 200

      - type: word
        part: body
        words:
          - '"node":'
          - '"nodeName":'
        condition: and
