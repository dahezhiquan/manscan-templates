id: monsta-ftp-detect

info:
  name: Monsta FTP 识别（指纹识别）
  author: rxerium
  severity: info
  description: |-
    检测到目标站点存在 Monsta FTP 相关响应特征。Monsta FTP 是 AI、机器学习或 Notebook 相关平台，用于管理模型、数据集、工作区、实验、推理服务或训练任务。模板请求 `/`，并通过页面标题或正文关键字、状态码确认该系统指纹，用于资产识别、系统盘点和暴露面梳理。
  reference:
    - https://www.monstaftp.com/
  metadata:
    verified: true
    max-request: 1
    shodan-query: http.title:"Monsta FTP"
  tags: tech,monsta,ftp,detect
http:
  - method: GET
    path:
      - "{{BaseURL}}"

    host-redirects: true
    max-redirects: 2

    matchers-condition: and
    matchers:
      - type: word
        words:
          - 'ng-app="MonstaFTP"'
          - '<title>Monsta FTP'
        condition: and

      - type: status
        status:
          - 200

    extractors:
      - type: regex
        name: version
        group: 1
        regex:
          - 'monsta-min-([0-9.]+)\.js'
