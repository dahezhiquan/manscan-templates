id: novus-ip-camera

info:
  name: NoVus IP 摄像机登录面板（IOT）
  author: DhiyaneshDk
  severity: medium
  description: |
    检测到 NoVus IP 摄像机登录面板。该入口暴露可用于定位摄像头设备，并可能成为后续弱口令或未授权访问测试目标。
  impact: |
    - 攻击者无需认证即可访问设备页面或功能，可能读取状态、配置和网络信息。
    - 若接口允许写操作，可能进一步导致设备配置被篡改或服务被滥用。
  remediation: |
    - 启用设备 Web 管理认证并修改默认口令，关闭匿名访问。
    - 升级固件并检查是否存在已知未授权访问漏洞。
    - 将管理页面限制在内网、管理 VLAN 或 VPN 内，并开启访问审计。
  reference:
    - https://www.exploit-db.com/ghdb/8002
  classification:
    cvss-metrics: CVSS:3.0/AV:N/AC:L/PR:N/UI:N/S:U/C:N/I:N/A:N
    cvss-score: 0
    cwe-id: CWE-200
  metadata:
    verified: true
    max-request: 1
    google-query: intitle:"NoVus IP camera" -com
  tags: camera,novus,edb,iot,panel,discovery

http:
  - method: GET
    path:
      - "{{BaseURL}}/Pages/login.htm"

    matchers-condition: and
    matchers:
      - type: word
        words:
          - "<title>NoVus IP camera</title>"

      - type: word
        part: header
        words:
          - "text/html"

      - type: status
        status:
          - 200
