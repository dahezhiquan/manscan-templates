id: jhipster-default-login

info:
  name: JHipster Platform 默认口令登录（弱口令）
  author: ritikchaddha
  severity: high
  description: |
    该模板用于检测 JHipster 应用是否仍在使用默认管理账号口令。若命中，攻击者可直接访问应用管理面板或受保护接口，进一步查看敏感信息并修改配置。
  reference:
    - https://www.jhipster.tech/security/
  metadata:
    verified: true
    max-request: 2
    shodan-query: title:"JHipster"
    fofa-query: title="JHipster"
  tags: jhipster,default-login,exposure,misconfig

http:
  - raw:
      - |
        POST /api/authenticate HTTP/1.1
        Host: {{Hostname}}
        Content-Type: application/json

        {"username":"{{username}}","password":"{{password}}","rememberMe":false}

    payloads:
      username:
        - "admin"
        - "user"
      password:
        - "admin"
        - "user"
    attack: pitchfork

    matchers-condition: and
    matchers:
      - type: word
        part: body
        words:
          - '{"id_token":"ey'

      - type: word
        part: header
        words:
          - "application/json"
          - "Authorization: Bearer"
        condition: and

      - type: status
        status:
          - 200
