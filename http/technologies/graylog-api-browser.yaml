id: graylog-api-browser

info:
  name: Graylog 指纹识别（指纹识别）
  author: PR3R00T
  severity: info
  description: >-
    Graylog 是集中式日志管理和安全分析平台，用于采集、检索和告警分析日志数据。该模板通过请求目标服务并检查预设路径或首页响应、页面正文关键字、状态码等指纹特征，判断目标是否使用或暴露了
    Graylog 相关组件；命中结果仅表示指纹特征匹配，可用于资产盘点、技术栈识别和后续安全评估，不代表已确认存在可利用漏洞。
  metadata:
    max-request: 1
  tags: tech,graylog,discovery
http:
  - method: GET
    path:
      - "{{BaseURL}}/api/api-browser/"

    matchers-condition: and
    matchers:
      - type: word
        part: body
        words:
          - "Graylog"
          - "REST API browser"
          - "swagger"
        condition: and

      - type: status
        status:
          - 200
