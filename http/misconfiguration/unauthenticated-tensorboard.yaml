id: unauthenticated-tensorboard

info:
  name: Tensorflow Tensorboard 未授权 访问
  author: dhiyaneshDk
  severity: high
  description: |
    检测到 Tensorflow Tensorboard 未授权 访问。目标功能在未认证状态下可访问，可能暴露管理入口、业务数据、系统状态或可执行操作，需确认是否存在访问控制缺失。
  metadata:
    max-request: 1
  tags: tensorflow,tensorboard,unauth,misconfig,vuln

http:
  - method: GET
    path:
      - '{{BaseURL}}/data/plugins_listing'

    matchers-condition: and
    matchers:
      - type: word
        words:
          - 'scalars'
          - 'loading_mechanism'
          - 'custom_scalars'
        condition: and

      - type: status
        status:
          - 200
