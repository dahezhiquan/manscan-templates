id: paloaltonetworks-cortex-xsoar-login

info:
  name: Cortex XSOAR 登录面板识别（指纹识别）
  author: dhiyaneshDK,r3dg33k
  severity: info
  description: Cortex XSOAR 是安全编排、自动化与响应平台，用于集中处置告警、剧本和安全事件。该模板请求 `/#/login` 路径，并依据 DSL 条件识别目标是否部署了该系统或暴露了对应入口，适用于资产指纹确认；命中结果仅表示系统特征匹配，不代表已确认存在未授权访问或可利用漏洞。
  classification:
    cvss-metrics: CVSS:3.0/AV:N/AC:L/PR:N/UI:N/S:U/C:N/I:N/A:N
    cwe-id: CWE-200
    cpe: cpe:2.3:a:paloaltonetworks:cortex_xsoar:*:*:*:*:*:*:*:*
  metadata:
    max-request: 1
    vendor: paloaltonetworks
    product: cortex_xsoar
    shodan-query: http.title:"Cortex XSOAR"
    fofa-query: title="cortex xsoar"
    google-query: intitle:"cortex xsoar"
  tags: panel,soar,login,paloaltonetworks,detect,discovery

http:
  - method: GET
    path:
      - '{{BaseURL}}/#/login'

    matchers:
      - type: dsl
        dsl:
          - 'status_code == 200'
          - 'contains_any(body, "<title>Cortex XSOAR</title>", "content=\"Cortex XSOAR\">")'
        condition: and
