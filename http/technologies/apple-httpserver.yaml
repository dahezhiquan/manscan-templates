id: apple-httpserver

info:
  name: Apple HTTP 服务器 指纹识别（指纹识别）
  author: pikpikcu
  severity: info
  description: Apple HTTP 服务器 是 Apple HTTP 服务或内置 Web 服务组件，用于提供设备或系统 Web 响应。该模板请求首页，并依据页面标题、正文关键字或品牌资源特征、响应头特征识别目标是否使用或暴露了 Apple HTTP 服务器 相关组件，适用于资产盘点、技术栈识别和后续安全评估；命中结果仅表示指纹特征匹配，不代表已确认存在可利用漏洞。
  metadata:
    verified: true
    max-request: 1
    shodan-query: "AppleHttpServer"
    fofa-query: app="Apple-HttpServer"
  tags: tech,apple,httpserver,discovery

http:
  - method: GET
    path:
      - "{{BaseURL}}"

    matchers-condition: and
    matchers:
      - type: word
        part: header
        words:
          - "X-Apple-Jingle-Correlation-Key"
          - "AppleHttpServer"
          - "X-Apple-Request-UUID"
        condition: or
