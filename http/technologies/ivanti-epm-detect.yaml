id: ivanti-epm-detect

info:
  name: Ivanti Endpoint Manager (EPM) 指纹识别（指纹识别）
  author: rxerium
  severity: info
  description: |
    用于识别目标是否使用 Ivanti Endpoint Manager (EPM)，模板会结合 favicon 哈希和特定路径或已知端点进行技术指纹匹配。
  reference:
    - https://www.ivanti.com/en-gb/products/endpoint-manager
  metadata:
    verified: true
    max-request: 2
    shodan-query: http.favicon.hash:362091310
  tags: detect,ivanti,emm,tech,mobileiron,epm,discovery

http:
  - method: GET
    path:
      - "{{BaseURL}}/favicon.ico"
      - "{{BaseURL}}/images/favicon.ico"

    stop-at-first-match: true
    matchers:
      - type: dsl
        dsl:
          - "status_code==200 && (\"362091310\" == mmh3(base64_py(body)))"
