id: changedetection-panel

info:
  name: Changedetection.io 面板识别（暴露面识别）
  author: rxerium
  severity: info
  description: |
    该模板通过识别 Changedetection.io 面板、控制台或管理界面的页面特征，判断目标是否暴露了对应服务入口。若命中，说明该后台或运维界面对外可访问，可用于资产识别与暴露面排查。
  reference:
    - https://github.com/dgtlmoon/changedetection.io
    - https://changedetection.io/
  classification:
    cpe: cpe:2.3:a:changedetection:changedetection:*:*:*:*:*:*:*:*
  metadata:
    verified: true
    max-request: 1
    vendor: changedetection
    product: changedetection
    shodan-query: title:"Change Detection"
  tags: panel,changedetection,detect,discovery

http:
  - method: GET
    path:
      - "{{BaseURL}}"

    matchers-condition: and
    matchers:
      - type: word
        words:
          - 'changedetection.io</a>'
          - 'title="Changedetection.io'
          - '<title>Change Detection'
          - 'Change</strong>Detection.io'
        condition: or

      - type: status
        status:
          - 200
