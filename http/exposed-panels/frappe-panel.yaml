id: frappe-panel

info:
  name: Frappe 面板识别（暴露面识别）
  author: Th3l0newolf
  severity: info
  description: |
    该模板通过识别 Frappe 登录入口的页面标题、特征文本或重定向行为，判断目标是否暴露了对应的认证界面。若命中，说明该登录面板对外可访问，可用于暴露面梳理与后续安全评估。
  reference:
    - https://frappeframework.com/
  metadata:
    verified: true
    max-request: 1
    shodan-query: html:"Login to Frappe"
  tags: frappe,login,web,erp,detect,discovery

http:
  - method: GET
    path:
      - "{{BaseURL}}/login#login"

    matchers-condition: and
    matchers:
      - type: word
        part: body
        words:
          - "<h4>Login to Frappe</h4>"
          - "frappe.csrf_token"
          - "frappe.boot"

      - type: status
        status:
          - 200
