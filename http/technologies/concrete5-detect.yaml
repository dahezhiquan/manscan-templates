id: concrete5-detect

info:
  name: Concrete5 指纹识别（指纹识别）
  author: Chirag Mistry
  severity: info
  description: |-
    Concrete5 是内容管理系统，用于网站页面、块、主题和后台内容维护。该模板请求首页、`/robots.txt`、`/sitemap.xml` 等路径，并依据 HTTP 200 状态码、页面标题、正文关键字或品牌资源特征识别目标是否使用或暴露了 Concrete5 相关组件，适用于资产盘点、技术栈识别和后续安全评估；命中结果仅表示指纹特征匹配，不代表已确认存在可利用漏洞。
  metadata:
    verified: true
    max-request: 8
  tags: concrete5,detect,tech

http:
  - method: GET
    path:
      - "{{BaseURL}}"
      - "{{BaseURL}}/robots.txt"
      - "{{BaseURL}}/sitemap.xml"
      - "{{BaseURL}}/favicon.ico"
      - "{{BaseURL}}/index.php"
      - "{{BaseURL}}/concrete/js/build/"
      - "{{BaseURL}}/concrete/block/"
      - "{{BaseURL}}/dashboard/"

    stop-at-first-match: true
    matchers-condition: and
    matchers:
      - type: word
        part: body
        words:
          - "Powered by Concrete5"
          - "X-Powered-By-Concrete5"
        condition: or
        case-insensitive: true

      - type: status
        status:
          - 200

    extractors:
      - type: regex
        part: body
        name: version
        regex:
          - 'Concrete5 ([0-9.]+)'
          - 'Powered by Concrete5 ([0-9.]+)'

      - type: regex
        part: body
        name: concrete5_id
        regex:
          - 'concrete5-site-id=([a-z0-9]+)'
          - 'concrete5\.org/([^/]+)'
