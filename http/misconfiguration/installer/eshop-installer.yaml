id: eshop-installer

info:
  name: EShop 安装向导 暴露
  author: DhiyaneshDk
  severity: high
  description: |
    检测到 EShop 安装向导 暴露。该页面属于安装、初始化或配置向导流程，若对外暴露，攻击者可能完成初始化、创建管理员账户或重新配置目标系统。
  classification:
    cpe: cpe:2.3:a:oxid-esales:eshop:*:*:*:*:*:*:*:*
  metadata:
    verified: true
    max-request: 1
    vendor: oxid-esales
    product: eshop
    shodan-query: html:"eShop Installer"
  tags: misconfig,eshop,install,exposure,vuln

http:
  - method: GET
    path:
      - '{{BaseURL}}/install/'

    matchers-condition: and
    matchers:
      - type: word
        part: body
        words:
          - 'eShop Installer'
          - 'Welcome to Installer'
        condition: and

      - type: word
        part: header
        words:
          - 'text/html'

      - type: status
        status:
          - 200
