id: azure-log-profile-all-activities
info:
  name: Azure Monitor 日志配置关键活动类别检查（云安全）
  author: princechaddha
  severity: medium
  description: Azure Monitor 日志配置中的 Write、Delete 和 Action 活动类别用于记录资源创建或更新、删除以及控制面操作，缺少这些类别会降低变更审计覆盖。本模板先枚举日志配置，再查询每个配置的 categories；当前匹配器在返回结果同时包含 Write、Delete 和 Action 时命中，命中后应结合实际输出复核类别是否确实缺失或配置异常。
  impact: |
    - 资源变更、删除和管理操作可能无法完整追踪，攻击者利用控制面权限后更容易隐藏行为。
    - 审计范围不足会延长事件发现和调查时间，并影响对误操作、恶意删除和策略变更的责任认定。
  remediation: |
    - 复核命中的日志配置，确保 Write、Delete 和 Action 等组织要求的活动类别均被正确采集和导出。
    - 将活动日志发送到具备访问控制和长期留存能力的目标，并通过测试事件验证类别、目的地和告警链路。
  reference:
    - https://docs.microsoft.com/en-us/azure/azure-monitor/platform/activity-log-collect
  metadata:
    vendor: microsoft
    product: azure-monitor
  tags: cloud,devops,azure,microsoft,log-profile,azure-cloud-config

flow: |
  code(1);
  for (let logProfileName of iterate(template.logProfileNames)) {
    set("profileName", logProfileName)
    code(2)
  }

self-contained: true
code:
  - engine:
      - sh
      - bash
    source: |
      az monitor log-profiles list --query '[*].name' --output json

    extractors:
      - type: json
        name: logProfileNames
        internal: true
        json:
          - '.[]'

  - engine:
      - sh
      - bash
    source: |
      az monitor log-profiles show --name $profileName --query 'categories[]'

    matchers:
      - type: word
        words:
          - '"Write"'
          - '"Delete"'
          - '"Action"'
        condition: and

    extractors:
      - type: dsl
        dsl:
          - 'profileName + " missing critical activity categories in log-profile configuration"'
