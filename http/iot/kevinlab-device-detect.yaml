id: kevinlab-device-detect

info:
  name: KevinLAB 能源管理设备识别（IOT）
  author: gy741
  severity: info
  description: |
    检测到 KevinLAB 相关设备或平台页面。KevinLAB 提供基于 IoT、大数据和 AI 的建筑能源管理系统，该页面暴露可用于识别能源管理资产。
  metadata:
    max-request: 2
  tags: iot,kevinlab,discovery

http:
  - method: GET
    path:
      - "{{BaseURL}}/pages/"
      - "{{BaseURL}}/dashboard/"

    matchers-condition: or
    matchers:
      - type: word
        words:
          - '<title>BEMS</title>'
          - '../http/index.php'
        part: body
        condition: and

      - type: word
        words:
          - '<title>HEMS</title>'
          - '../dashboard/proc.php'
        part: body
        condition: and
