id: opendcim-detect

info:
  name: openDCIM 指纹识别（指纹识别）
  author: rxerium
  severity: info
  description: >-
    openDCIM 是数据中心基础设施管理系统，用于记录机柜、设备、电力和容量资源。该模板通过请求目标服务并检查预设路径或首页响应、页面正文关键字、状态码等指纹特征，判断目标是否使用或暴露了
    openDCIM 相关组件；命中结果仅表示指纹特征匹配，可用于资产盘点、技术栈识别和后续安全评估，不代表已确认存在可利用漏洞。
  reference:
  - https://opendcim.org
  - https://github.com/opendcim/openDCIM
  metadata:
    max-request: 1
    shodan-query: title:"openDCIM Data Center Inventory"
  tags: tech,opendcim,dcim,detect
http:
  - method: GET
    path:
      - "{{BaseURL}}"

    redirects: true
    max-redirects: 2

    matchers-condition: and
    matchers:
      - type: word
        words:
          - "<title>openDCIM Data Center Inventory"

      - type: status
        status:
          - 200
