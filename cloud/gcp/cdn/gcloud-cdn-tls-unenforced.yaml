id: gcloud-cdn-tls-unenforced

info:
  name: Unenforced SSL/TLS on Cloud CDN Backend Service Origins（云安全）
  author: princechaddha
  severity: medium
  description: 该规则用于检查 GCP cdn 是否正确启用传输中或静态数据加密、证书校验及安全协议配置，防止敏感数据在存储或通信过程中被窃听、篡改或滥用。
  impact: |
    - 未正确启用加密或安全协议时，敏感数据可能在传输或存储过程中被窃听、窃取或篡改。
    - 这还可能导致不满足行业合规要求，增加数据泄露与法律责任风险。
  remediation: |
    - 启用厂商推荐的加密方案，并优先使用更安全的协议、算法或客户管理密钥。
    - 同时检查相关证书、密钥与依赖服务的生命周期管理，确保配置持续有效。
  reference:
    - https://cloud.google.com/cdn/docs/using-https
  tags: cloud,devops,gcp,gcloud,cloud-cdn,gcp-cloud-config

flow: |
  code(1)
  for(let projectId of iterate(template.projectIds)){
    set("projectId", projectId)
    code(2)
    for(let service of iterate(template.services)){
      set("serviceName", service)
      code(3)
      code(4)
    }
  }

self-contained: true

code:
  - engine:
      - sh
      - bash
    source: |
      gcloud projects list --format="json(projectId)"

    extractors:
      - type: json
        name: projectIds
        internal: true
        json:
          - '.[].projectId'

  - engine:
      - sh
      - bash
    source: |
      gcloud compute url-maps list --project $projectId --format="json(name,defaultService)"

    extractors:
      - type: json
        name: services
        internal: true
        json:
          - '.[].name'

  - engine:
      - sh
      - bash
    source: |
      gcloud compute forwarding-rules list --project $projectId

    extractors:
      - type: json
        name: forwardingRules
        internal: true
        json:
          - '.[].name'

  - engine:
      - sh
      - bash
    source: |
      gcloud compute forwarding-rules describe $forwardingRules --global --format="value(portRange)"

    matchers:
      - type: word
        words:
          - '80-80'

    extractors:
      - type: dsl
        dsl:
          - '"HTTP traffic allowed without SSL/TLS on service: " + serviceName + " in Project: " + projectId'
