id: google-service-info-plist

info:
  name: GoogleService-Info.plist 检测（暴露面识别）
  author: cyberguy-somnath
  severity: info
  description: |-
    GoogleService-Info.plist 文件包含 Firebase 项目的敏感信息，包括 Google App ID、Project ID、Client ID、Client Secret 以及 Reversed Client ID。该文件用于在 iOS 应用中认证 Firebase SDK。
  remediation: |-
    从 Web 根目录中移除 GoogleService-Info.plist 文件，并限制公共访问。
  reference:
    - https://firebase.google.com/docs/ios/setup
  classification:
    cwe-id: CWE-200
  metadata:
    max-request: 1
  tags: config,exposure,firebase,ios

http:
  - method: GET
    path:
      - "{{BaseURL}}/GoogleService-Info.plist"

    matchers:
      - type: dsl
        dsl:
          - 'contains(content_type, "application/octet-stream")'
          - 'contains_all(body, "<key>GOOGLE_APP_ID</key>", "<key>PROJECT_ID</key>", "<key>API_KEY</key>")'
          - 'status_code == 200'
        condition: and
