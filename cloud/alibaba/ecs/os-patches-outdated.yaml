id: os-patches-outdated

info:
  name: OS Patches -已过期（云安全）
  author: DhiyaneshDK
  severity: medium
  description: 该规则用于检查 阿里云 ECS 相关资源是否满足推荐的云安全与合规配置要求，命中通常表示当前配置仍存在可改进的风险项。
  reference:
    - https://www.trendmicro.com/cloudoneconformity/knowledge-base/alibaba-cloud/AlibabaCloud-ECS/apply-latest-os-patches.html
    - https://www.alibabacloud.com/help/en/security-center/user-guide/fix-software-vulnerabilities
  metadata:
    max-request: 1
    verified: true
  tags: cloud,devops,aliyun,alibaba,alibaba-cloud-config,ecs

variables:
  region: "cn-hangzhou"

self-contained: true

code:
  - engine:
      - sh
      - bash
    source: |
      aliyun sas DescribeVulList --Type cve --region $region

    matchers-condition: and
    matchers:
      - type: word
        words:
          - '"RaspStatus":'
          - '"Type":'
        condition: and

      - type: word
        words:
          - '"TotalCount": 0'
          - '"VulRecords":'
        condition: and
        negative: true

    extractors:
      - type: dsl
        dsl:
          - '" OS Patches are Outdated "'
