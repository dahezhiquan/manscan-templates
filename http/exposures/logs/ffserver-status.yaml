id: ffserver-status

info:
  name: FFserver 状态 检测（暴露面识别）
  author: notnotnotveg,tess
  severity: low
  description: 检测到可直接访问的 FFserver 状态。日志、异常页面或调试输出通常会泄露堆栈信息、内部路径、查询语句、账号标识、令牌片段或业务数据，不应向未授权用户开放。
  metadata:
    verified: true
    max-request: 1
    shodan-query: title:"ffserver Status"
  tags: exposure,exposures,logs,ffserver,vuln

http:
  - method: GET
    path:
      - "{{BaseURL}}"

    matchers-condition: and
    matchers:
      - type: word
        part: body
        words:
          - "ffserver Status"
          - "Available Streams"
          - "Connection Status"
        condition: and

      - type: status
        status:
          - 200
