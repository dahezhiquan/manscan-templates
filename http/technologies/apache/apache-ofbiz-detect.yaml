id: apache-ofbiz-detect

info:
  name: Apache OFBiz 指纹识别（指纹识别）
  author: rxerium
  severity: info
  description: |-
    Apache OFBiz 是企业资源计划和电商框架，用于订单、会计、库存和业务应用开发。该模板请求首页，并依据 HTTP 200 状态码、页面标题、正文关键字或品牌资源特征识别目标是否使用或暴露了 Apache OFBiz 相关组件，适用于资产盘点、技术栈识别和后续安全评估；命中结果仅表示指纹特征匹配，不代表已确认存在可利用漏洞。
  classification:
    cpe: cpe:2.3:a:apache:ofbiz:*:*:*:*:*:*:*:*
  metadata:
    verified: true
    max-request: 1
    vendor: apache
    product: ofbiz
    fofa-query: app="Apache_OFBiz"
  tags: tech,detect,ofbiz,apache,discovery

http:
  - method: GET
    path:
      - "{{BaseURL}}"

    host-redirects: true
    max-redirects: 2

    matchers-condition: and
    matchers:
      - type: word
        part: response
        words:
          - "OFBiz.Visitor="
          - "Apache OFBiz."
        condition: or

      - type: status
        status:
          - 200
