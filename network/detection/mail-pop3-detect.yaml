id: mail-pop3-detect

info:
  name: POP3 协议识别（指纹识别）
  author: pussycat0x
  severity: info
  description: |
    POP3 是邮件下载协议，用于客户端从邮件服务器拉取邮箱消息。该模板连接 110/TCP 并读取协议响应，通过匹配 `+OK Dovecot ready`、`POP3` 等响应特征识别目标服务。
  reference:
    - https://nmap.org/nsedoc/scripts/pop3-ntlm-info.html
  classification:
    cvss-metrics: CVSS:3.1/AV:N/AC:L/PR:N/UI:N/S:U/C:N/I:N/A:N
    cwe-id: CWE-200
  metadata:
    verified: true
    max-request: 1
    shodan-query: pop3 port:110
  tags: network,detect,pop3,mail,tcp,discovery
tcp:
  - inputs:
      - data: "\n"

    host:
      - "{{Hostname}}"
    port: 110

    matchers:
      - type: word
        words:
          - "+OK Dovecot ready"
          - "POP3"
        condition: or

    extractors:
      - type: regex
        name: product_version_0
        part: raw
        group: 1
        regex:
          - (?mi)^\+OK[^\r\n]*\bCyrus POP3\s+v?([0-9]+(?:[.][0-9]+)+(?:[-+._][0-9A-Za-z]+)*)\b
        internal: true
      - type: dsl
        dsl:
          - 'regex("^[0-9]+(?:[.][0-9]+)*(?:[-+._][0-9A-Za-z]+)*$", product_version_0) ? "cyrus:" + product_version_0 : ""'
      - type: regex
        name: product_version_1
        part: raw
        group: 1
        regex:
          - (?mi)^\+OK[^\r\n]*CommuniGate Pro POP3 Server\s+([0-9]+(?:[.][0-9]+)+(?:[-+._][0-9A-Za-z]+)*)\b
        internal: true
      - type: dsl
        dsl:
          - 'regex("^[0-9]+(?:[.][0-9]+)*(?:[-+._][0-9A-Za-z]+)*$", product_version_1) ? "communigate:" + product_version_1 : ""'
