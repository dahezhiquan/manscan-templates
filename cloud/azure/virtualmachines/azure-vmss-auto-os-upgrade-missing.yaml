id: azure-vmss-auto-os-upgrade-missing
info:
  name: Azure VMSS Automatic OS Upgrade未启用（云安全）
  author: princechaddha
  severity: medium
  description: Azure VMSS Automatic OS Image Upgrade 可在经过验证的情况下滚动更新实例操作系统镜像；upgradePolicy.automaticOsUpgradePolicy.enableAutomaticOsUpgrade 为 null 时，本模板无法确认自动升级已启用。本模板枚举规模集并查询该字段，在返回 AutomaticOsUpgrades 为 null 时报告。
  impact: |
    - 安全补丁和镜像修复可能长期滞后，已知操作系统漏洞被利用后会影响多个规模集实例。
    - 手工更新容易出现实例版本漂移、维护窗口遗漏和不一致回滚，延长漏洞暴露时间。
  remediation: |
    - 对支持的 VMSS 启用 Automatic OS Image Upgrade，配置健康探测、滚动升级策略和失败回滚验证。
    - 对不适合自动升级的工作负载记录例外，建立补丁 SLA、镜像版本盘点和手工升级审计。
  reference:
    - https://docs.microsoft.com/en-us/azure/virtual-machine-scale-sets/virtual-machine-scale-sets-automatic-upgrade
  metadata:
    vendor: microsoft
    product: azure-virtual-machine-scale-sets
  tags: cloud,devops,azure,microsoft,vmss,azure-cloud-config

flow: |
  code(1);
  for (let VmssData of iterate(template.vmssList)) {
    VmssData = JSON.parse(VmssData);
    set("name", VmssData.Name);
    set("resourceGroup", VmssData.ResourceGroup);
    code(2);
  }

self-contained: true
code:
  - engine:
      - sh
      - bash
    source: |
      az vmss list --output json --query '[*].{"Name":name,"ResourceGroup":resourceGroup}'

    extractors:
      - type: json
        name: vmssList
        internal: true
        json:
          - '.[]'

  - engine:
      - sh
      - bash
    source: |
      az vmss show --name "$name" --resource-group "$resourceGroup" --query '{"AutomaticOsUpgrades": upgradePolicy.automaticOsUpgradePolicy.enableAutomaticOsUpgrade}'

    matchers:
      - type: word
        words:
          - '"AutomaticOsUpgrades": null'

    extractors:
      - type: dsl
        dsl:
          - 'name + " in " + resourceGroup + " does not have automatic OS upgrades enabled"'
