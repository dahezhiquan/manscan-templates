id: shiro-detect

info:
  name: Apache Shiro 指纹识别（指纹识别）
  author: AresX
  severity: info
  description: >-
    Apache Shiro 是 Java 安全框架，用于认证、授权、会话管理和加密能力。该模板通过请求目标服务并检查预设路径或首页响应、HTTP 响应头、页面正文关键字等指纹特征，判断目标是否使用或暴露了
    Apache Shiro 相关组件；命中结果仅表示指纹特征匹配，可用于资产盘点、技术栈识别和后续安全评估，不代表已确认存在可利用漏洞。
  metadata:
    max-request: 1
  tags: tech,shiro,discovery
http:
  - method: GET
    path:
      - '{{BaseURL}}'

    headers:
      Cookie: JSESSIONID={{randstr}};rememberMe=123;
    host-redirects: true
    max-redirects: 2
    matchers:
      - type: word
        part: header
        words:
          - "rememberMe=deleteMe"
