id: netscaler-gateway

info:
  name: Netscaler Gateway 面板识别（暴露面识别）
  author: joeldeleep
  severity: info
  description: 该模板通过识别 Netscaler Gateway 面板、控制台或管理界面的页面特征，判断目标是否暴露了对应服务入口。若命中，说明该后台或运维界面对外可访问，可用于资产识别与暴露面排查。
  remediation: 确保仅授权用户可访问 NetScaler Gateway 登录入口，并结合网络边界与认证策略限制不必要的外部暴露。
  reference:
    - https://stack.watch/product/citrix/netscaler-gateway/
  classification:
    cwe-id: CWE-200
    cpe: cpe:2.3:a:citrix:netscaler_gateway:*:*:*:*:*:*:*:*
  metadata:
    max-request: 1
    vendor: citrix
    product: netscaler_gateway
  tags: panel,netscaler,citrix,discovery

http:
  - method: GET
    path:
      - "{{BaseURL}}/vpn/index.html"

    matchers:
      - type: word
        words:
          - <title>Netscaler Gateway</title>
