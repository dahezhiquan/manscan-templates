id: mismatched-ssl-certificate

info:
  name: SSL 证书主机名不匹配（证书安全）
  author: pdteam
  severity: info
  description: 该模板检测访问主机名与证书中的 CN 或 SAN 是否不一致。命中说明证书并非为当前访问域名签发，客户端无法正确完成主机身份校验。
  reference:
    - https://www.invicti.com/web-vulnerability-scanner/vulnerabilities/ssl-certificate-name-hostname-mismatch/
  metadata:
    max-request: 1
  tags: ssl,tls,mismatched,vuln
ssl:
  - address: "{{Host}}:{{Port}}"
    matchers:
      - type: dsl
        dsl:
          - "mismatched == true"
          - "ip != host"
          - "!contains(host, 'enterpriseregistration.') && !contains(host, 'enterpriseenrollment.')"
        condition: and

    extractors:
      - type: dsl
        dsl:
          - '"CN: " + subject_cn'
