id: mamp-phpinfo-exposure

info:
  name: MAMP PHP Info 暴露
  author: 0x_Akoko
  severity: low
  description: |
    该模板用于核查 MAMP PHP Info 暴露。该类问题通常源于生产环境暴露调试页面、错误回溯、诊断端点、指标接口或详细错误信息。模板会向目标发送探测请求，并依据请求 `/MAMP/phpinfo.php`、匹配 `status_code == 200`、匹配 `contains_all(body, "phpinfo()", "PHP Version")`、匹配 `contains_any(body, "MAMP", "/Applications/MAMP", "C:\\MAMP")`等证据确认目标是否存在该配置问题。
  impact: |
    - 攻击者可获取应用路径、框架版本、环境变量、内部调用栈、运行参数或依赖信息。
    - 这些信息可帮助攻击者定位组件版本、构造后续漏洞利用或发现内部系统结构。
  remediation: |
    - 关闭生产环境调试模式、错误回溯、示例页面和诊断接口。
    - 对确需保留的运维端点增加认证授权、来源限制和访问审计。
    - 统一错误处理策略，避免向外部用户返回堆栈、环境变量和内部路径。
  reference:
    - https://www.mamp.info/
    - https://www.acunetix.com/vulnerabilities/web/phpinfo-pages/
  classification:
    cvss-metrics: CVSS:3.1/AV:N/AC:L/PR:N/UI:N/S:U/C:L/I:N/A:N
    cvss-score: 5.3
    cwe-id: CWE-200
  metadata:
    verified: true
    max-request: 1
    fofa-query: title="MAMP"
  tags: mamp,phpinfo,exposure,misconfig

http:
  - method: GET
    path:
      - "{{BaseURL}}/MAMP/phpinfo.php"

    matchers:
      - type: dsl
        dsl:
          - 'status_code == 200'
          - 'contains_all(body, "phpinfo()", "PHP Version")'
          - 'contains_any(body, "MAMP", "/Applications/MAMP", "C:\\MAMP")'
        condition: and
