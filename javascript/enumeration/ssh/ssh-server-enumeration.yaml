id: ssh-server-enumeration

info:
  name: SSH 服务端软件信息暴露（服务漏洞）
  author: Ice3man543,tarunKoyalwar
  severity: low
  description: |
    SSH 服务在协议握手阶段会公开服务端标识字符串，通常包含 OpenSSH、Dropbear 等实现名称和版本线索。该模板建立 SSH 信息探测连接，并从 ServerID.Raw 字段提取服务端原始标识以确认软件信息暴露。
  impact: |
    - SSH 服务端标识会暴露软件实现、版本和发行版线索。
    - 攻击者可利用这些指纹匹配历史漏洞、弱算法默认配置或特定发行版补丁状态。
  remediation: |
    - 保持 SSH 服务端更新到受支持版本，避免暴露过时实现。
    - 限制 SSH 访问来源，减少公网指纹暴露，并审计 Banner 配置。
  metadata:
    verified: true
    max-request: 2
    shodan-query: product:"OpenSSH"
  tags: js,ssh,enum,network,discovery

javascript:
  - pre-condition: |
      isPortOpen(Host,Port);
    code: |
      var m = require("nuclei/ssh");
      var c = m.SSHClient();
      var response = c.ConnectSSHInfoMode(Host, Port);
      Export(response);
    args:
      Host: "{{Host}}"
      Port: "22"

    extractors:
      - type: json
        json:
          - '.ServerID.Raw'
