id: file-missing-nginx-hsts

info:
  name: Nginx HSTS 配置缺失（本地文件安全扫描）
  author: pussycat0x
  severity: high
  description: |
    该模板检查 Nginx 是否启用 HSTS。缺少 HSTS 可能允许用户被降级到 HTTP 或遭受中间人攻击。
  remediation: |
    在 Nginx server 块中添加 Strict-Transport-Security 响应头，例如 max-age=31536000; includeSubDomains; preload。
  reference:
    - https://wiki.devsecopsguides.com/docs/checklists/nginx/
    - https://developer.mozilla.org/en-US/docs/Web/HTTP/Headers/Strict-Transport-Security
  metadata:
    verified: true
  tags: file,audit,nginx,hardening

file:
  - extensions:
      - conf

    matchers-condition: and
    matchers:
      - type: word
        words:
          - "http"
          - "events"
        condition: and

      - type: word
        words:
          - 'add_header Strict-Transport-Security '
        negative: true
