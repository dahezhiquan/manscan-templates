id: portkey-ai-detect

info:
  name: Portkey AI 指纹识别（指纹识别）
  author: rxerium
  severity: info
  description: |
    用于识别目标是否使用 Portkey AI，模板会结合页面标题、页面正文、状态码和特定路径或已知端点进行技术指纹匹配。
  reference:
    - https://portkey.ai/
    - https://github.com/Portkey-AI/gateway
  metadata:
    verified: true
    max-request: 1
    shodan-query: html:"Portkey AI"
  tags: tech,portkey,ai,llm,gateway

http:
  - method: GET
    path:
      - "{{BaseURL}}/login"

    host-redirects: true
    max-redirects: 2

    matchers-condition: and
    matchers:
      - type: word
        words:
          - "<title>Portkey AI"
        part: body

      - type: status
        status:
          - 200
