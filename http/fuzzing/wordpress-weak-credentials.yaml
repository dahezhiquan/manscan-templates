id: wordpress-weak-credentials

info:
  name: WordPress 弱口令检测
  author: evolutionsec
  severity: critical
  description: |
    该模板用于检测 WordPress 登录入口是否存在弱口令。它使用内置用户名和密码字典向 `/wp-login.php` 组合提交登录请求，并通过后台重定向和 `wordpress_logged_in` Cookie 判断是否登录成功。
  impact: |
    - 攻击者可使用弱口令直接登录 WordPress 后台，发布恶意内容、安装插件或上传后门。
    - 后台账号被接管后，可能导致整站篡改、数据泄露和服务器进一步失陷。
  remediation: |
    - 强制所有 WordPress 用户使用高强度唯一密码，并启用多因素认证。
    - 限制登录失败次数、启用验证码或基于风险的登录保护。
    - 删除不必要的管理员账号，审计近期后台登录和插件/主题变更记录。
  reference:
    - https://www.wpwhitesecurity.com/strong-wordpress-passwords-wpscan/
  classification:
    cvss-metrics: CVSS:3.1/AV:N/AC:L/PR:N/UI:N/S:C/C:H/I:L/A:N
    cvss-score: 9.3
    cwe-id: CWE-1391
  metadata:
    max-request: 276
  tags: wordpress,default-login,fuzz,fuzzing,vuln

http:
  - raw:
      - |
        POST /wp-login.php HTTP/1.1
        Host: {{Hostname}}
        Origin: {{BaseURL}}
        Content-Type: application/x-www-form-urlencoded
        Referer: {{BaseURL}}

        log={{users}}&pwd={{passwords}}

    attack: clusterbomb
    payloads:
      users: helpers/wordlists/wp-users.txt
      passwords: helpers/wordlists/wp-passwords.txt
    stop-at-first-match: true

    matchers-condition: and
    matchers:
      - type: word
        part: header
        words:
          - '/wp-admin'
          - 'wordpress_logged_in'
        condition: and

      - type: status
        status:
          - 302
