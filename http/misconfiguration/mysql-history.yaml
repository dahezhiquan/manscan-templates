id: mysql-history

info:
  name: Mysql 历史记录 文件 泄露
  author: kazet
  severity: low
  description: |
    检测到 Mysql 历史记录 文件 泄露。目标响应或文件中可能暴露配置、凭据、密钥、令牌、环境变量或历史记录等敏感信息，可能被用于进一步入侵。
  reference:
    - http://doc.docs.sk/mysql-refman-5.5/mysql-history-file.html
  classification:
    cpe: cpe:2.3:a:oracle:mysql:*:*:*:*:*:*:*:*
  metadata:
    verified: true
    max-request: 1
    vendor: oracle
    product: mysql
    shodan-query: html:"mysql_history"
  tags: misconfig,disclosure,config,vuln

http:
  - method: GET
    path:
      - "{{BaseURL}}/.mysql_history"

    matchers-condition: and
    matchers:
      - type: word
        words:
          - "_HiStOrY_V2_"
          - "show databases;"
        condition: or

      - type: word
        part: header
        words:
          - "application/octet-stream"
          - "text/plain"
          - "filename=\".mysql_"

      - type: word
        part: response
        words:
          - "<?xml"
          - "<env"
          - "application/javascript"
          - "application/json"
          - "application/xml"
          - "html>"
          - "text/html"
          - "image/"
        negative: true

      - type: status
        status:
          - 200
