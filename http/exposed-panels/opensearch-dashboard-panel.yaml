id: opensearch-dashboard-panel

info:
  name: OpenSearch Dashboard 面板识别（暴露面识别）
  author: ritikchaddha
  severity: info
  description: |
    该模板通过识别 OpenSearch Dashboard 仪表盘或后台界面的页面特征，判断目标是否对外暴露了相关控制台。若命中，说明该服务面向外部可访问，可用于资产识别与访问控制核查。
  reference:
    - https://opensearch.org/docs/latest/dashboards/index/
  metadata:
    verified: true
    max-request: 1
    shodan-query: title:"OpenSearch"
    fofa-query: title="OpenSearch"
  tags: opensearch,dashboard,login,panel,detect,discovery

http:
  - method: GET
    path:
      - "{{BaseURL}}/app/login?"

    matchers:
      - type: word
        part: body
        words:
          - "OpenSearch Dashboard"
          - "login"
        condition: and
