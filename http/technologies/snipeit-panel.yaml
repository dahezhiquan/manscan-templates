id: snipeit-panel

info:
  name: Snipe-IT 管理面板 指纹识别（指纹识别）
  author: pikpikcu
  severity: info
  description: >-
    Snipe-IT 是 IT 资产管理系统，管理面板用于登记、分配和追踪设备、许可证与耗材。该模板通过请求目标服务并检查预设路径或首页响应、页面正文关键字、状态码等指纹特征，判断目标是否使用或暴露了
    Snipe-IT 管理面板 相关组件；命中结果仅表示指纹特征匹配，可用于资产盘点、技术栈识别和后续安全评估，不代表已确认存在可利用漏洞。
  classification:
    cvss-metrics: CVSS:3.0/AV:N/AC:L/PR:N/UI:N/S:U/C:N/I:N/A:N
    cvss-score: 0
    cwe-id: CWE-200
    cpe: cpe:2.3:a:snipeitapp:snipe-it:*:*:*:*:*:*:*:*
  metadata:
    max-request: 1
    shodan-query: http.favicon.hash:431627549
    product: snipe-it
    vendor: snipeitapp
  tags: panel,snipe-it,tech,discovery
http:
  - method: GET
    path:
      - "{{BaseURL}}/login"

    matchers-condition: and
    matchers:
      - type: word
        part: body
        words:
          - "window.snipeit"

      - type: status
        status:
          - 200
