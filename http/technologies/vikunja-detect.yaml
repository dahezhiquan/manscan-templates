id: vikunja-detect

info:
  name: Vikunja 指纹识别（指纹识别）
  author: ChrisJr404
  severity: info
  description: >-
    Vikunja 是开源任务和项目管理系统，用于管理待办事项、项目、团队和协作看板。该模板通过请求目标服务并检查预设路径或首页响应、DSL 条件等指纹特征，判断目标是否使用或暴露了
    Vikunja 相关组件；命中结果仅表示指纹特征匹配，可用于资产盘点、技术栈识别和后续安全评估，不代表已确认存在可利用漏洞。
  reference:
  - https://vikunja.io/
  - https://github.com/go-vikunja/vikunja
  - https://vikunja.io/docs/config-options/
  metadata:
    verified: true
    max-request: 1
    shodan-query: http.title:"Vikunja"
  tags: tech,vikunja,detect
http:
  - method: GET
    path:
      - "{{BaseURL}}/api/v1/info"

    matchers-condition: and
    matchers:
      - type: dsl
        dsl:
          - 'status_code == 200'
          - 'contains(content_type, "application/json")'
          - 'contains_all(body, "\"link_sharing_enabled\"", "\"available_migrators\"", "\"caldav_enabled\"")'
        condition: and

    extractors:
      - type: json
        part: body
        json:
          - '.version'
