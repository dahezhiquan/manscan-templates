id: emby-panel

info:
  name: Emby 登录面板识别（暴露面识别）
  author: idealphase
  severity: info
  description: |
    该模板通过识别 Emby 登录入口的页面标题、特征文本或重定向行为，判断目标是否暴露了对应的认证界面。若命中，说明该登录面板对外可访问，可用于暴露面梳理与后续安全评估。
  reference:
    - https://github.com/MediaBrowser/Emby
    - https://emby.media/
  classification:
    cvss-metrics: CVSS:3.0/AV:N/AC:L/PR:N/UI:N/S:U/C:N/I:N/A:N
    cwe-id: CWE-200
    cpe: cpe:2.3:a:emby:emby:*:*:*:*:*:*:*:*
  metadata:
    verified: true
    max-request: 1
    vendor: emby
    product: emby
    shodan-query: http.title:"emby"
    fofa-query: title="emby"
    google-query: intitle:"emby"
  tags: panel,emby,oss,discovery

http:
  - method: GET
    path:
      - "{{BaseURL}}"

    host-redirects: true
    max-redirects: 2

    matchers-condition: and
    matchers:
      - type: word
        part: body
        words:
          - '<title>Emby</title>'

      - type: status
        status:
          - 200

    extractors:
      - type: regex
        part: body
        group: 1
        regex:
          - '<script src="apploader\.js\?v=(.+)" defer><\/script>'
