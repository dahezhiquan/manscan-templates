id: pocketbase-panel

info:
  name: PocketBase 登录面板识别（指纹识别）
  author: userdehghani
  severity: info
  description: |-
    PocketBase 是轻量级后端平台，提供数据库、认证、文件存储和管理控制台。该模板请求 `/_/#/login` 路径，并依据 HTTP 200 状态码、页面标题、正文关键字或品牌资源特征识别目标是否部署了该系统或暴露了对应入口，适用于资产指纹确认；命中结果仅表示系统特征匹配，不代表已确认存在未授权访问或可利用漏洞。
  reference:
  - https://pocketbase.io/
  - https://pocketbase.io/docs/
  metadata:
    verified: true
    max-request: 1
    shodan-query: http.favicon.hash:981081715
  tags: panel,pocketbase,login,detect,discovery

http:
  - method: GET
    path:
      - "{{BaseURL}}/_/#/login"

    matchers-condition: and
    matchers:
      - type: word
        part: body
        words:
          - '<title>PocketBase'
        case-insensitive: true

      - type: status
        status:
          - 200
