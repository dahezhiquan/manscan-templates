id: info-cgi-env-leak

info:
  name: info.cgi 环境变量泄露
  author: pussycat0x
  severity: medium
  description: |
    该模板用于核查 info.cgi 环境变量泄露。该类问题通常源于生产环境暴露调试页面、错误回溯、诊断端点、指标接口或详细错误信息。模板会向目标发送探测请求，并依据请求 `/info.cgi`、`/cgi-bin/info.cgi`、状态码 200、匹配 `SERVER_SOFTWARE`等证据确认目标是否存在该配置问题。
  impact: |
    - 攻击者可获取应用路径、框架版本、环境变量、内部调用栈、运行参数或依赖信息。
    - 这些信息可帮助攻击者定位组件版本、构造后续漏洞利用或发现内部系统结构。
  remediation: |
    - 关闭生产环境调试模式、错误回溯、示例页面和诊断接口。
    - 对确需保留的运维端点增加认证授权、来源限制和访问审计。
    - 统一错误处理策略，避免向外部用户返回堆栈、环境变量和内部路径。
  reference:
    - https://www.acunetix.com/vulnerabilities/web/test-cgi-script-leaking-environment-variables/
    - https://book.hacktricks.xyz/network-services-pentesting/pentesting-web/cgi
  metadata:
    verified: true
    max-request: 5
  tags: cgi,exposure,info,env,disclosure,generic

http:
  - method: GET
    path:
      - "{{BaseURL}}/info.cgi"
      - "{{BaseURL}}/cgi-bin/info.cgi"
      - "{{BaseURL}}/cgi-sys/info.cgi"
      - "{{BaseURL}}/scripts/info.cgi"
      - "{{BaseURL}}/lite-scripts/info.cgi"

    stop-at-first-match: true
    matchers-condition: and
    matchers:
      - type: status
        status:
          - 200

      - type: word
        part: body
        words:
          - "SERVER_SOFTWARE"
          - "SERVER_NAME"
          - "GATEWAY_INTERFACE"
          - "SERVER_PROTOCOL"
          - "REQUEST_METHOD"
          - "QUERY_STRING"
          - "REMOTE_ADDR"
          - "HTTP_USER_AGENT"
        condition: or

      - type: word
        part: body
        words:
          - "PATH="
          - "/bin:"
          - "/usr/bin:"
          - "LD_LIBRARY_PATH"
          - "MYSQL_HOME"
          - "OPENSSL_CONF"
          - "DOCUMENT_ROOT"
          - "SCRIPT_FILENAME"
        condition: or
