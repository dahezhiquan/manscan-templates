id: php-prober-exposure

info:
  name: PHP Prober 暴露（暴露面识别）
  author: ritikchaddha
  severity: medium
  description: |
    检测到目标站点可直接访问 PHP Prober。这类配置或资源文件通常服务于应用部署、依赖管理、调试、运行参数或内部集成。该模板请求 `/prober.php`，并通过 HTTP 状态码、响应正文关键字、文件格式特征、正则匹配或响应头进行确认。此类资源公开后可能泄露部署细节、内部路径、依赖版本、环境变量、访问凭据或调试信息，增加被侦察和后续利用的风险。
  impact: |-
    - 状态、调试或指标页面可能泄露组件版本、模块清单、环境变量、内部路径、主机名和服务依赖关系。
    - 攻击者可利用这些信息筛选匹配漏洞、识别弱配置，并规划更精确的后续攻击路径。
    - 部分调试页面还可能暴露请求变量或运行参数，增加敏感信息泄露范围。
  remediation: |-
    - 关闭生产环境中的调试、状态、phpinfo、printenv、探针和未受保护的 metrics 页面。
    - 仅在内网、运维 VPN 或监控系统来源地址中开放必要的观测端点，并启用鉴权。
    - 清理页面中暴露的环境变量、内部路径、主机名、版本信息和调试参数。
    - 复核相关组件版本和配置，修复因暴露信息指向的弱配置或已知漏洞。
  metadata:
    max-request: 1
    verified: true
    shodan-query: http.component:"php"
  tags: exposure,php,prober

http:
  - method: GET
    path:
      - "{{BaseURL}}/prober.php"

    matchers-condition: and
    matchers:
      - type: word
        words:
          - 'Server Parameters'
          - 'PHP Prober'
          - 'Real-time Data'
        condition: and

      - type: status
        status:
          - 200
