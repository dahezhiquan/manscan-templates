id: mobotix-default-credentials

info:
  name: Mobotix 默认口令登录（弱口令）
  author: robotshell
  severity: high
  description: |
    该模板用于检测 Mobotix 是否仍可使用默认凭据或弱口令登录。模板主要向 `/control/userimage.html` 等认证入口发送请求，使用内置默认凭据组合进行认证尝试，并根据响应中的 `text/html` 等登录成功特征判断登录是否成功；命中说明目标未及时修改出厂、示例或初始化账号口令。
  impact: |
    - 攻击者可接管 Mobotix 的 Web 管理界面，查看设备状态、网络配置、运行日志或敏感业务参数。
    - 被接管的网络、工控、打印、视频、存储或远程管理设备可能被用于中断业务、改变访问策略、窃取流量或作为内网横向移动入口。
  remediation: |
    - 立即修改所有默认账号口令，禁用不再使用的出厂账号，并为管理账户设置高强度唯一密码。
    - 将设备管理入口限制在 VPN、堡垒机或可信管理网段内，避免直接暴露到公网。
    - 升级设备固件或管理组件，审计近期登录记录、配置变更和异常会话。
  reference:
    - https://www.mobotix.com/sites/default/files/2020-01/mx_RM_CameraSoftwareManual_en_200131.pdf
  classification:
    cwe-id: CWE-798
    cpe: cpe:2.3:h:mobotix:s14:*:*:*:*:*:*:*:*
  metadata:
    max-request: 2
    shodan-query: title:"Mobotix"
    product: s14
    vendor: mobotix
  tags: mobotix,default-login,webcam,iot,vuln

http:
  - raw:
      - |
        GET /control/userimage.html HTTP/1.1
        Host: {{Hostname}}
      - |
        GET /control/userimage.html HTTP/1.1
        Host: {{Hostname}}
        Authorization: Basic YWRtaW46bWVpbnNt

    matchers-condition: and
    matchers:
      - type: dsl
        dsl:
          - "!contains(body_1, 'Admin Menu')"
          - "contains(body_2, 'Admin Menu') || contains(body_2, 'Setup Menu') || contains(body_2, 'Audio on')"
        condition: and

      - type: word
        part: header
        words:
          - 'text/html'

      - type: status
        status:
          - 200
