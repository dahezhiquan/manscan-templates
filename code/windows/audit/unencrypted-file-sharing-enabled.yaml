id: unencrypted-file-sharing-enabled

info:
  name: 文件共享未启用加密（本地基线扫描）
  author: princechaddha
  severity: medium
  description: |
    该模板检查文件共享是否未启用加密。未加密共享会暴露传输数据。
  impact: |
    攻击者可在网络中截获或篡改共享文件内容。
  remediation: |
    启用 SMB 加密或使用受保护通道传输敏感文件。
  tags: windows,file-sharing,encryption,code,windows-audit

self-contained: true

code:
  - pre-condition: |
      IsWindows();
    engine:
      - powershell
      - powershell.exe
    args:
      - -ExecutionPolicy
      - Bypass
    pattern: "*.ps1"
    source: |
      (Get-SmbServerConfiguration).EncryptData

    matchers:
      - type: word
        words:
          - "False"
