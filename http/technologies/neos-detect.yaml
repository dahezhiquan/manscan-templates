id: neos-detect

info:
  name: Neos CMS 指纹识别（指纹识别）
  author: k11h-de
  severity: info
  description: 用于识别目标是否部署 Neos CMS 并提取相关版本或构建信息，模板会结合特定路径或已知端点和版本或标识提取结果进行指纹匹配。
  reference:
    - https://github.com/neos/
  classification:
    cwe-id: CWE-200
  metadata:
    max-request: 1
  tags: tech,neos,cms,discovery

http:
  - method: GET
    path:
      - "{{BaseURL}}"

    host-redirects: true
    max-redirects: 2
    matchers:
      - type: word
        words:
          - "This website is powered by Neos"

    extractors:
      - type: kval
        kval:
          - 'x_flow_powered'
