id: hedgedoc-detect

info:
  name: HedgeDoc Collaborative Editor 指纹识别（指纹识别）
  author: Rupendra0
  severity: info
  description: |
    用于识别目标是否部署 HedgeDoc Collaborative Editor 并提取相关版本或构建信息，模板会结合 HTTP 响应头、页面标题、页面正文、特定路径或已知端点和版本或标识提取结果进行指纹匹配。
  reference:
    - https://hedgedoc.org
    - https://github.com/hedgedoc/hedgedoc
  metadata:
    verified: true
    max-request: 2
    vendor: hedgedoc
    product: hedgedoc
    shodan-query: 'http.title:"HedgeDoc - Ideas grow better together"'
    fofa-query: 'body="Powered by <a href=\"https://hedgedoc.org\">HedgeDoc"'
  tags: tech,detect,hedgedoc

http:
  - method: GET
    path:
      - '{{BaseURL}}/'

    host-redirects: true
    stop-at-first-match: true

    matchers:
      - type: dsl
        dsl:
          - 'contains(tolower(header), "hedgedoc-version:")'
          - 'contains_any(body, "HedgeDoc - Ideas", "Powered by <a href=\"https://hedgedoc.org\">HedgeDoc")'
        condition: or

    extractors:
      - type: regex
        name: version
        part: header
        group: 1
        regex:
          - '(?i)hedgedoc-version:\s*([0-9.]+)'
