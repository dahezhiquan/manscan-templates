id: ocbc-phish

info:
  name: OCBC Bank 仿冒钓鱼网站（钓鱼网站识别）
  author: rxerium
  severity: info
  description: |
    检测到疑似仿冒 OCBC Bank 的钓鱼网站。模板在目标页面返回 200、页面内容命中 OCBC Bank 的金融或支付页面特征，且当前主机不属于 ocbc.com 官方域名时触发，用于识别借用 OCBC Bank 品牌页面诱导用户信任的仿冒站点。
  reference:
    - https://ocbc.com
  metadata:
    max-request: 1
  tags: phishing,ocbc,bank,osint,discovery
http:
  - method: GET
    path:
      - "{{BaseURL}}"

    host-redirects: true
    max-redirects: 2

    matchers-condition: and
    matchers:
      - type: word
        words:
          - "Discover a world of financial services with OCBC, the best trusted and established Singapore bank. Explore our range of banking solutions today."

      - type: status
        status:
          - 200

      - type: dsl
        dsl:
          - '!contains(host,"ocbc.com")'
