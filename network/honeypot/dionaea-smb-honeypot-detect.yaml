id: dionaea-smb-honeypot-detect

info:
  name: Dionaea SMB 蜜罐识别（蜜罐识别）
  author: UnaPibaGeek
  severity: info
  description: |
    Dionaea 可模拟 SMB 服务以捕获针对文件共享协议的扫描、漏洞利用和恶意样本投递。该模板向 TCP 445 发送 SMB 协商探测，并通过 Dionaea SMB 仿真的固定响应特征识别蜜罐。
  metadata:
    max-request: 1
    vendor: dionaea
    product: dionaea
    shodan-query: port:445
  tags: dionaea,smb,honeypot,ir,cti,network,tcp,discovery
tcp:
  - inputs:
      - data: "00000045ff534d4272000000000801c8000000000000000000000000ffff0100ffff0000002200024e54204c4d20302e31320002534d4220322e3030320002534d4220322e3f3f3f00"
        type: hex

    host:
      - "{{Hostname}}"
    port: 445
    read-size: 1024

    matchers:
      - type: binary
        binary:
          - "6538547e6c42"
