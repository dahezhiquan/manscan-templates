id: azure-aks-network-contrib-unassigned
info:
  name: Azure AKS 未分配 Network Contributor 网络权限（云安全）
  author: princechaddha
  severity: medium
  description: AKS 集群资源范围未发现 Network Contributor 角色分配时，集群身份可能无法按需管理负载均衡器、网络接口或相关网络资源。该模板先获取集群资源 ID，再查询该范围的角色分配，并在结果为空且不包含 Network Contributor 时报告问题。
  impact: |
    - 服务发布、负载均衡和网络变更可能因权限不足失败，导致应用不可达或故障恢复延迟。
    - 为绕过权限错误而临时授予订阅级 Owner 或 Contributor 等过宽角色，会扩大身份被滥用后的横向影响范围。
  remediation: |
    - 按 AKS 当前网络架构将所需 Network Contributor 权限授予正确的集群托管身份，并尽量收敛到必要资源范围。
    - 验证角色分配主体、作用域和变更审计，禁止用订阅级高权限角色替代具体网络操作权限。
  reference:
    - https://docs.microsoft.com/en-us/azure/aks/manage-azure-rbac
  metadata:
    vendor: microsoft
    product: azure-kubernetes-service
  tags: cloud,devops,azure,microsoft,aks,azure-cloud-config

flow: |
  code(1);
  for (let ClusterData of iterate(template.clusterList)) {
    ClusterData = JSON.parse(ClusterData);
    set("name", ClusterData.name);
    set("resourceGroup", ClusterData.resourceGroup);
    code(2);
    for(let subscriptionNames of iterate(template.subscription)){
      set("subscription", subscriptionNames)
      code(3);
      }
    }

self-contained: true
code:
  - engine:
      - sh
      - bash
    source: |
      az aks list --output json --query '[*].{name:name, resourceGroup:resourceGroup}'

    extractors:
      - type: json
        name: clusterList
        internal: true
        json:
          - '.[]'

  - engine:
      - sh
      - bash
    source: |
      az aks show --name "$name" --resource-group "$resourceGroup" --query 'id'

    extractors:
      - type: json
        name: subscription
        internal: true
        json:
          - '.'

  - engine:
      - sh
      - bash
    source: |
      az role assignment list --scope "$subscription" --output json --query '[*].roleDefinitionName'

    matchers-condition: and
    matchers:
      - type: word
        words:
          - "Network Contributor"
        negative: true

      - type: word
        words:
          - "[]"

    extractors:
      - type: dsl
        dsl:
          - 'name + " in resource group " + resourceGroup + " does not have Network Contributor role assigned"'
