id: tinytiny-rss-redirect

info:
  name: TinyTiny RSS - 开放重定向漏洞
  author: DhiyaneshDk
  severity: low
  description: |
    该模板用于检测 TinyTiny RSS - 开放重定向漏洞。该类漏洞通常源于跳转参数缺少可信域名校验，导致服务端或前端跳转到攻击者控制的地址。模板会向 `/public.php?return=http%3a%2f%2finteract.sh%2f&op=login&login=password=&profile=0` 等位置发送探测请求，并结合响应状态、关键字、错误信息、时间差或外带交互等证据判断目标是否受影响。
  impact: |
    - 攻击者可构造可信域名下的跳转链接诱导用户访问恶意站点。
    - 该问题常被用于钓鱼、OAuth 授权码劫持、会话令牌泄露或绕过安全网关校验。
  remediation: |
    - 对跳转目标使用固定白名单或相对路径，禁止直接跳转到任意外部 URL。
    - 在执行跳转前校验协议、主机名和编码后的最终地址，避免双重编码和协议绕过。
    - 对登录、授权和支付等敏感流程中的重定向参数进行额外审计。
  reference:
    - https://seclists.org/oss-sec/2019/q1/155
  metadata:
    verified: true
    max-request: 1
    shodan-query: html:"Tiny Tiny RSS"
  tags: redirect,tiny-tiny,rss

http:
  - method: GET
    path:
      - "{{BaseURL}}/public.php?return=http%3a%2f%2finteract.sh%2f&op=login&login=password=&profile=0"

    matchers-condition: and
    matchers:
      - type: regex
        part: header
        regex:
          - '(?m)^(?:Location\s*?:\s*?)(?:https?://|//)?(?:[a-zA-Z0-9\-_\.@]*)interact\.sh.*$'

      - type: status
        status:
          - 302
          - 301
