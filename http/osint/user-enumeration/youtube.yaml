id: youtube

info:
  name: YouTube 用户名信息枚举（OSINT）
  author: dwisiswant0
  severity: info
  description: |
    YouTube 是面向视频发布、直播、短视频或频道运营的在线平台，用户资料页通常会公开展示频道、作品、粉丝关系或创作者资料。该模板用于在公开互联网侧枚举 YouTube 用户名，不需要认证；模板请求公开路径 https://www.youtube.com/c/用户名/about，并结合响应状态为 200、页面或响应内容命中 “joinedDateText”、“canonicalBaseUrl” 等资料页特征判断目标用户名是否存在。该检查属于 OSINT 用户枚举，结果仅表示公开资料页或公开搜索结果可被访问，不代表目标平台存在可直接修复的漏洞。
  classification:
    cvss-metrics: CVSS:3.1/AV:N/AC:L/PR:N/UI:N/S:U/C:N/I:N/A:N
    cvss-score: 0
    cwe-id: CWE-200
  metadata:
    max-request: 3
  tags: osint,osint-video,youtube,discovery

self-contained: true

http:
  - method: GET
    path:
      - "https://www.youtube.com/c/{{user}}/about"
      - "https://www.youtube.com/user/{{user}}/about"
      - "https://www.youtube.com/@{{user}}"

    matchers-condition: and
    matchers:
      - type: status
        status:
          - 200

      - type: word
        part: body
        words:
          - "joinedDateText"
          - "canonicalBaseUrl"
        condition: or
