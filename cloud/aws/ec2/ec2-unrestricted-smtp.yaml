id: ec2-unrestricted-smtp
info:
  name: EC2 安全组对公网开放 SMTP 端口（云安全）
  author: princechaddha
  severity: critical
  description: EC2 安全组对公网开放 SMTP 端口是一类邮件服务滥用风险，TCP 25 面向任意来源可能被用于开放中继探测、垃圾邮件发送或邮件服务漏洞攻击。SMTP 服务应只对必要邮件系统或受信任来源开放。模板通过 `describe-security-groups` 筛选 25 端口且来源为 `0.0.0.0/0` 的入站规则，并输出命中的安全组 ID。
  impact: |
    - 邮件服务可能被滥用发送垃圾邮件，导致 IP 声誉下降或服务受限。
    - 暴露的 SMTP 服务可能遭受枚举、爆破或漏洞利用，影响邮件系统安全。
  remediation: |
    - 移除面向公网的 25 端口入站规则，仅允许必要邮件网关或可信来源访问。
    - 禁用开放中继，启用认证、速率限制、日志审计和反滥用策略。
  reference:
    - https://docs.aws.amazon.com/AWSEC2/latest/UserGuide/authorizing-access-to-an-instance.html
  metadata:
    vendor: amazon
    product: ec2
  tags: cloud,devops,aws,amazon,ec2,aws-cloud-config

variables:
  region: "us-east-1"

self-contained: true
code:
  - engine:
      - sh
      - bash
    source: |
      aws ec2 describe-security-groups --region $region --filters Name=ip-permission.from-port,Values=25 Name=ip-permission.to-port,Values=25 Name=ip-permission.cidr,Values='0.0.0.0/0' --output json --query 'SecurityGroups[*].GroupId'

    extractors:
      - type: json
        name: securitygroup
        internal: true
        json:
          - '.[]'

      - type: dsl
        dsl:
          - 'securitygroup + " security group(s) alows unrestricted access (0.0.0.0/0 or ::/0) on TCP port 25"'
