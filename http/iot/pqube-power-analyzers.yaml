id: pqube-power-analyzers

info:
  name: PQube 3 电能质量分析仪面板（IOT）
  author: pussycat0x
  severity: low
  description: |
    检测到 PQube 3 Power Analyzer 面板。该设备用于电能质量监测，暴露后可能泄露电力监测设备的状态信息和访问入口。
  impact: |
    - 工业控制、楼宇自动化或能源设备面板暴露可能泄露设施运行状态和控制系统入口。
    - 若存在弱口令或历史漏洞，可能影响生产、楼控、供电或环境控制的安全边界。
  remediation: |
    - 将 OT/IoT 管理页面放置在隔离网络中，仅允许可信运维主机或 VPN 访问。
    - 启用强认证、最小权限和设备访问审计，及时更新厂商固件。
    - 避免将控制设备直接暴露到互联网，并监控异常登录和配置变更。
  metadata:
    verified: true
    max-request: 1
    shodan-query: title:"PQube 3"
  tags: iot,exposure,discovery

http:
  - method: GET
    path:
      - '{{BaseURL}}/status.html'

    matchers-condition: and
    matchers:
      - type: word
        part: body
        words:
          - 'PQube 3 Information'
          - 'Power Configuration:'
        condition: and

      - type: status
        status:
          - 200
