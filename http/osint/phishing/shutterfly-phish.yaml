id: shutterfly-phish

info:
  name: Shutterfly 仿冒钓鱼网站（钓鱼网站识别）
  author: rxerium
  severity: info
  description: |
    检测到疑似仿冒 Shutterfly 的钓鱼网站。模板在目标页面返回 200、页面内容命中 Shutterfly 的品牌页面特征，且当前主机不属于 shutterfly.com 官方域名时触发，用于识别借用 Shutterfly 品牌页面诱导用户信任的仿冒站点。
  reference:
    - https://shutterfly.com
  metadata:
    max-request: 1
  tags: phishing,shutterfly,osint,discovery
http:
  - method: GET
    path:
      - "{{BaseURL}}"

    host-redirects: true
    max-redirects: 2

    matchers-condition: and
    matchers:
      - type: word
        words:
          - "Create photo books, personalize photo cards & stationery, and share photos with family and friends at Shutterfly.com."

      - type: status
        status:
          - 200

      - type: dsl
        dsl:
          - '!contains(host,"shutterfly.com")'
