id: webtitan-cloud-panel

info:
  name: WebTitan Cloud 登录面板识别（指纹识别）
  author: ritikchaddha
  severity: info
  description: |-
    WebTitan Cloud 是 DNS/Web 安全过滤平台，用于访问控制、过滤策略、报表和安全管理。该模板请求 `/login.php`，并依据 HTTP 200 状态码、页面标题、正文关键字或品牌资源特征识别目标是否部署了该系统或暴露了对应入口，适用于资产指纹确认；命中结果仅表示系统特征匹配，不代表已确认存在未授权访问或可利用漏洞。
  classification:
    cpe: cpe:2.3:a:titanhq:webtitan:*:*:*:*:*:*:*:*
  metadata:
    verified: true
    max-request: 1
    vendor: titanhq
    product: webtitan
    shodan-query: http.favicon.hash:1090061843
    fofa-query:
    - title="WebTitan"
    - title="webtitan"
    - icon_hash=1090061843
  tags: panel,webtitan,cloud,detect,titanhq,discovery

http:
  - method: GET
    path:
      - "{{BaseURL}}/login.php"

    matchers-condition: and
    matchers:
      - type: word
        part: body
        words:
          - '<title>WebTitan Cloud'
          - 'alt="WebTitan Cloud Logo'
          - 'title="WebTitan'
        condition: or

      - type: status
        status:
          - 200
