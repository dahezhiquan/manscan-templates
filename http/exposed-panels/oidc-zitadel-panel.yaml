id: oidc-zitadel-panel

info:
  name: ZITADEL 面板识别（指纹识别）
  author: ChrisJr404
  severity: info
  description: |-
    检测到目标站点存在 ZITADEL 相关响应特征。ZITADEL 是身份认证、访问管理或特权管理系统，用于集中管理账号、凭据、登录策略、设备和高权限访问。模板请求 `/ui/console/`，并通过页面标题或正文关键字、状态码、DSL 条件确认该系统指纹，用于资产识别、系统盘点和暴露面梳理。
  reference:
    - https://github.com/zitadel/zitadel
    - https://zitadel.com/docs
  metadata:
    verified: true
    max-request: 1
    vendor: zitadel
    product: zitadel
    shodan-query: '"X-Zitadel"'
    fofa-query: title="ZITADEL"
  tags: panel,zitadel,iam,oidc,detect
http:
  - method: GET
    path:
      - "{{BaseURL}}/ui/console/"

    host-redirects: true
    max-redirects: 2

    matchers:
      - type: dsl
        dsl:
          - 'contains_all(body, "ZITADEL", "<cnsl-root>")'
          - 'status_code == 200'
        condition: and
