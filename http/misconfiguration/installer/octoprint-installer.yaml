id: octoprint-installer

info:
  name: OctoPrint 安装 Page 暴露
  author: DhiyaneshDk
  severity: high
  description: |
    检测到 OctoPrint 安装 Page 暴露。该页面属于安装、初始化或配置向导流程，若对外暴露，攻击者可能完成初始化、创建管理员账户或重新配置目标系统。
  classification:
    cpe: cpe:2.3:a:octoprint:octoprint:*:*:*:*:*:*:*:*
  metadata:
    verified: true
    max-request: 1
    vendor: octoprint
    product: octoprint
    fofa-query: body="Thank you for installing OctoPrint"
  tags: install,octoprint,misconfig,intrusive,vuln

http:
  - method: GET
    path:
      - "{{BaseURL}}"

    matchers-condition: and
    matchers:
      - type: word
        part: body
        words:
          - "Thank you for installing OctoPrint"

      - type: status
        status:
          - 200
