id: solarview-compact-panel

info:
  name: SolarView Compact 面板识别（暴露面识别）
  author: princechaddha
  severity: info
  description: 该模板通过识别 SolarView Compact 面板、控制台或管理界面的页面特征，判断目标是否暴露了对应服务入口。若命中，说明该后台或运维界面对外可访问，可用于资产识别与暴露面排查。
  classification:
    cvss-metrics: CVSS:3.0/AV:N/AC:L/PR:N/UI:N/S:U/C:N/I:N/A:N
    cwe-id: CWE-200
    cpe: cpe:2.3:o:contec:solarview_compact_firmware:*:*:*:*:*:*:*:*
  metadata:
    verified: true
    max-request: 1
    vendor: contec
    product: solarview_compact_firmware
    shodan-query:
      - http.html:"SolarView Compact"
      - http.favicon.hash:"-244067125"
      - http.html:"solarview compact"
      - cpe:"cpe:2.3:o:contec:solarview_compact_firmware"
    fofa-query:
      - body="solarview compact" && title="top"
      - icon_hash="-244067125"
      - body="solarview compact"
  tags: panel,solarview,iot,contec,discovery

http:
  - method: GET
    path:
      - "{{BaseURL}}/Solar_Menu.php"

    matchers-condition: and
    matchers:
      - type: word
        part: body
        words:
          - "SolarViewCompact"

      - type: status
        status:
          - 200
