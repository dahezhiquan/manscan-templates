id: dkim-record-detect

info:
  name: DKIM 记录识别（dns）
  author: princechaddha
  severity: info
  description: |
    DKIM 使用 selector 对应的 DNS TXT 公钥，让收件方验证邮件签名是否由域名控制方授权生成，并检查签名覆盖的邮件内容是否被修改。公开 DKIM 公钥是协议设计的一部分，不应仅因记录可查询就认定为密钥泄露。本模板枚举常见 selector，要求 TXT 同时包含 `v=DKIM1` 和 `p=` 公钥字段，再提取匹配的记录。
  impact: |
    - selector 和公钥记录会暴露邮件发送基础设施及密钥轮换线索，可辅助外部人员识别邮件系统。
    - 若私钥泄露、旧 selector 未撤销或公钥记录配置错误，攻击者可能伪造通过 DKIM 验证的邮件，或导致合法邮件认证失败。
  remediation: |
    - 妥善保护 DKIM 私钥，使用强密钥并按轮换计划更新 selector 和公钥。
    - 删除已停用发送系统的旧 selector，核对 DNS 中的公钥与实际邮件签名配置一致。
    - 将 DKIM 与 SPF、DMARC 的对齐策略联合验证，并监控异常签名和认证失败报告。
  reference:
    - https://www.rfc-editor.org/rfc/rfc6376
    - https://dkim.org/
  metadata:
    max-request: 10
  tags: dns,dkim,email,discovery

dns:
  - name: "{{selector}}._domainkey.{{FQDN}}"
    type: TXT

    payloads:
      selector:
        - default
        - selector1
        - selector2
        - google
        - k1
        - s1
        - s2
        - dkim
        - mail
        - email
        - class
        - smtpapi
        - bfi
        - spop
        - spop1024
        - beta
        - domk
        - dk
        - ei
        - smtpout
        - sm
        - authsmtp
        - alpha
        - mesmtp
        - cm
        - prod
        - pm
        - gamma
        - dkrnt
        - dkimrnt
        - private
        - gmmailerd
        - pmta
        - x
        - selector
        - qcdkim
        - postfix
        - mikd
        - main
        - m
        - dk20050327
        - delta
        - yibm
        - wesmail
        - test
        - stigmate
        - squaremail
        - sitemail
        - sasl
        - sailthru
        - responsys
        - publickey
        - proddkim
        - mail-in
        - key
        - ED-DKIM
        - ebmailerd
        - Corporate
        - care
        - 0xdeadbeef
        - yousendit
        - www
        - tilprivate
        - testdk
        - snowcrash
        - smtpcomcustomers
        - smtpauth
        - smtp
        - sl
        - sharedpool
        - ses
        - server
        - scooby
        - scarlet
        - safe
        - s
        - pvt
        - primus
        - primary
        - postfix.private
        - outbound
        - originating
        - one
        - neomailout
        - mx
        - msa
        - monkey
        - mkt
        - mimi
        - mdaemon
        - mailrelay
        - mailjet
        - mail-dkim
        - mailo
        - mandrill
        - lists
        - iweb
        - iport
        - id
        - hubris
        - googleapps
        - global
        - gears
        - exim4u
        - exim
        - et
        - dyn
        - duh
        - dksel
        - dkimmail
        - corp
        - centralsmtp
        - ca
        - bfi
        - auth
        - allselector
        - zendesk1
        - dkim
        - proddkim
        - testdkim

    matchers-condition: and
    matchers:
      - type: word
        words:
          - "v=DKIM1"
        case-insensitive: true

      - type: regex
        regex:
          - 'p=[A-Za-z0-9+/]{20,}'
        negative: false

    extractors:
      - type: regex
        regex:
          - "v=DKIM1(.+)"
