id: mochiweb-detect

info:
  name: MochiWeb 指纹识别（指纹识别）
  author: Shivam Kamboj
  severity: info
  description: >-
    MochiWeb 是 Erlang 生态的轻量级 HTTP 服务库，用于构建高并发 Web 服务。该模板通过请求目标服务并检查预设路径或首页响应、HTTP
    响应头、正则特征等指纹特征，判断目标是否使用或暴露了 MochiWeb 相关组件；命中结果仅表示指纹特征匹配，可用于资产盘点、技术栈识别和后续安全评估，不代表已确认存在可利用漏洞。
  metadata:
    verified: true
    shodan-query: http.component:"mochiweb" country:"US"
  tags: tech,mochiweb
http:
  - method: GET
    path:
      - "{{BaseURL}}"

    matchers:
      - type: regex
        part: header
        regex:
          - 'MochiWeb'

    extractors:
      - type: regex
        part: header
        group: 1
        regex:
          - 'MochiWeb/([0-9.]+)'
