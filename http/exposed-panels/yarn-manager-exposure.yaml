id: yarn-manager-exposure

info:
  name: Apache YARN ResourceManager 面板识别（暴露面识别）
  author: pdteam
  severity: low
  description: 该模板用于识别 Apache YARN ResourceManager 是否存在对外暴露的管理、服务或状态界面。若命中，说明目标公开了相关功能入口，可作为资产盘点与攻击面收敛的依据。
  classification:
    cpe: cpe:2.3:a:apache:hadoop:*:*:*:*:*:*:*:*
  metadata:
    max-request: 1
    vendor: apache
    product: hadoop
  tags: panel,apache,yarn,exposure,discovery

http:
  - method: GET
    path:
      - '{{BaseURL}}/cluster/cluster'

    matchers:
      - type: word
        words:
          - 'hadoop'
          - 'resourcemanager'
          - 'logged in as: dr.who'
        condition: and
