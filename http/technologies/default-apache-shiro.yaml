id: default-apache-shiro

info:
  name: Apache Shiro 默认页面 指纹识别（指纹识别）
  author: DhiyaneshDK
  severity: info
  description: Apache Shiro 默认页面 是 Java 安全框架，用于认证、授权、会话和加密能力。该模板请求首页，并依据 HTTP 200 状态码、页面标题、正文关键字或品牌资源特征识别目标是否使用或暴露了 Apache Shiro 默认页面 相关组件，适用于资产盘点、技术栈识别和后续安全评估；命中结果仅表示指纹特征匹配，不代表已确认存在可利用漏洞。
  classification:
    cpe: cpe:2.3:a:apache:shiro:*:*:*:*:*:*:*:*
  metadata:
    verified: true
    max-request: 1
    vendor: apache
    product: shiro
    shodan-query: title:"Apache Shiro Quickstart"
  tags: tech,apache,shiro,discovery

http:
  - method: GET
    path:
      - '{{BaseURL}}'

    matchers-condition: and
    matchers:
      - type: word
        part: body
        words:
          - "<title>Apache Shiro Quickstart</title>"

      - type: status
        status:
          - 200
