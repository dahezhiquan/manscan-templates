id: api-abstract-company-enrichment

info:
  name: Abstract API Company Enrichment Token 可用性校验（token喷洒）
  author: daffainfo
  severity: info
  description: 该模板通过调用 Abstract Company Enrichment API 验证提供的 token 是否有效，命中后通常表示可访问企业补全与公司信息查询能力。
  reference:
    - https://www.abstractapi.com/api/company-enrichment
    - https://github.com/daffainfo/all-about-apikey/tree/main/abstract-company-enrichment
  metadata:
    max-request: 1
  tags: token-spray,abstractapi

self-contained: true

http:
  - method: GET
    path:
      - "https://companyenrichment.abstractapi.com/v1/?api_key={{token}}&domain=airbnb.com"

    matchers:
      - type: word
        part: body
        words:
          - '"name":'
          - '"domain":'
          - '"year_founded":'
        condition: and
