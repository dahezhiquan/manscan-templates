id: xploitspy-default-login

info:
  name: XploitSPY 默认口令登录（弱口令）
  author: andreluna
  severity: high
  description: |
    该模板用于检测 XploitSPY 是否仍可使用默认凭据或弱口令登录。模板主要向 `/login` 等认证入口发送请求，使用内置默认凭据组合进行认证尝试，并根据响应中的 `Change Password`、`Logout` 等登录成功特征判断登录是否成功；命中说明目标未及时修改出厂、示例或初始化账号口令。
  impact: |
    - 攻击者可接管 XploitSPY 控制台，获取或操纵远控、演练任务或攻击基础设施配置。
    - 此类系统一旦被未授权登录，可能被用于投递恶意活动、泄露测试数据，或反向暴露防守方/演练方基础设施。
  remediation: |
    - 立即修改默认凭据并禁用公开可达的管理入口，只允许可信运维来源访问。
    - 启用强认证、登录告警和完整操作审计，删除无用账号和历史测试凭据。
    - 检查近期任务、令牌、载荷、回连地址和导出数据，确认没有被未授权使用。
  reference:
    - https://github.com/XploitWizer-Community/XploitSPY
  metadata:
    max-request: 1
    shodan-query: html:XploitSPY
  tags: xploitspy,default-login,vuln

http:
  - raw:
      - |
        POST /login HTTP/1.1
        Host: {{Hostname}}
        Origin: {{RootURL}}
        Content-Type: application/x-www-form-urlencoded
        Referer: {{RootURL}}/login

        username={{user}}&password={{pass}}&hostname={{Hostname}}

    attack: pitchfork
    payloads:
      user:
        - admin
      pass:
        - password
    redirects: true
    max-redirects: 2

    matchers-condition: and
    matchers:
      - type: word
        part: body
        words:
          - "Change Password"
          - "Logout"
          - "XploitSPY"
        condition: and

      - type: status
        status:
          - 200
