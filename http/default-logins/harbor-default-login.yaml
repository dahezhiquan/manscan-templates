id: harbor-default-login

info:
  name: Harbor Registry 默认管理员凭据（弱口令）
  author: 0x_Akoko
  severity: high
  description: |
    该模板用于检测 Harbor Registry 是否仍可使用默认凭据或弱口令登录。模板主要向 `/api/v2.0/systeminfo`、`/api/v2.0/users/current` 等认证入口发送请求，使用内置默认凭据组合进行认证尝试，并根据响应中的 `status_code == 200`、`contains(content_type, "application/json")` 等登录成功特征判断登录是否成功；命中说明目标未及时修改出厂、示例或初始化账号口令。
  impact: |
    - 攻击者可登录 Harbor Registry 管理接口，读取、导出或篡改数据、索引、队列、仓库、报表或服务配置。
    - 若系统保存连接串、访问令牌或集成凭据，弱口令登录可能进一步造成业务数据泄露、权限扩大或服务中断。
  remediation: |
    - 立即修改默认账号口令，删除测试账号，并为管理员、服务账号和集成账号使用唯一强密码。
    - 启用细粒度权限控制、访问来源限制和审计日志，避免管理 API 或控制台直接对公网开放。
    - 检查数据导出、配置变更、令牌使用和异常查询记录，必要时轮换相关凭据。
  reference:
    - https://goharbor.io/docs/1.10/install-config/run-installer-script/
    - https://goharbor.io/docs/latest/administration/managing-users/
  metadata:
    verified: true
    max-request: 2
    vendor: goharbor
    product: harbor
    shodan-query: 'http.title:"Harbor"'
    fofa-query: 'title="Harbor"'
  tags: harbor,default-login,auth,registry,vuln

variables:
  username: "admin"
  password: "Harbor12345"

flow: http(1) && http(2)

http:
  - raw:
      - |
        GET /api/v2.0/systeminfo HTTP/1.1
        Host: {{Hostname}}
        Accept: application/json

    matchers:
      - type: dsl
        internal: true
        dsl:
          - 'status_code == 200'
          - 'contains(content_type, "application/json")'
          - 'contains(body, "auth_mode")'
        condition: and

  - raw:
      - |
        GET /api/v2.0/users/current HTTP/1.1
        Host: {{Hostname}}
        Authorization: Basic {{base64(username + ":" + password)}}
        Accept: application/json

    matchers:
      - type: dsl
        dsl:
          - 'status_code == 200'
          - 'contains(content_type, "application/json")'
          - 'contains_all(body, "\"username\"", "\"admin\"", "\"sysadmin_flag\"")'
        condition: and
