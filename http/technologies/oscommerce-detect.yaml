id: oscommerce-detect

info:
  name: osCommerce 指纹识别（指纹识别）
  author: Chirag Mistry
  severity: info
  description: |
    用于识别目标是否部署 osCommerce 并提取相关版本或构建信息，模板会结合 favicon 哈希、HTTP 响应头、页面正文、状态码、特定路径或已知端点和版本或标识提取结果进行指纹匹配。
  metadata:
    max-request: 8
    shodan-query: http.component:"osCommerce"
  tags: oscommerce,detect,tech

http:
  - method: GET
    path:
      - "{{BaseURL}}"
      - "{{BaseURL}}/robots.txt"
      - "{{BaseURL}}/sitemap.xml"
      - "{{BaseURL}}/favicon.ico"
      - "{{BaseURL}}/admin"
      - "{{BaseURL}}/includes/modules/"
      - "{{BaseURL}}/catalog/includes/javascript/oscommerce.js"
      - "{{BaseURL}}/checkout_payment.php"

    stop-at-first-match: true
    matchers-condition: and
    matchers:
      - type: word
        part: response
        words:
          - "Powered by osCommerce"
          - "oscommerce.com"
          - "X-Powered-By-osCommerce"
        condition: or
        case-insensitive: true

      - type: status
        status:
          - 200

    extractors:
      - type: regex
        part: body
        name: version
        regex:
          - 'osCommerce ([0-9.]+)'
          - 'Powered by osCommerce ([0-9.]+)'

      - type: regex
        part: body
        name: oscommerce_id
        regex:
          - 'oscommerce-site-id=([a-z0-9]+)'
          - 'oscommerce\.com/([^/]+)'
