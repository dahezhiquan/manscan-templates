id: persis-panel

info:
  name: Persis 面板识别（暴露面识别）
  author: righettod
  severity: info
  description: 该模板通过识别 Persis 面板、控制台或管理界面的页面特征，判断目标是否暴露了对应服务入口。若命中，说明该后台或运维界面对外可访问，可用于资产识别与暴露面排查。
  reference:
    - https://www.persis.de/
  classification:
    cvss-metrics: CVSS:3.0/AV:N/AC:L/PR:N/UI:N/S:U/C:N/I:N/A:N
    cwe-id: CWE-200
    cpe: cpe:2.3:a:persis:human_resource_management_portal:*:*:*:*:*:*:*:*
  metadata:
    verified: true
    max-request: 2
    shodan-query: title:"Persis"
    product: human_resource_management_portal
    vendor: persis
  tags: panel,persis,discovery

http:
  - method: GET
    path:
      - "{{BaseURL}}"
      - "{{BaseURL}}/main"

    stop-at-first-match: true
    host-redirects: true
    max-redirects: 2

    matchers-condition: and
    matchers:
      - type: word
        part: body
        words:
          - "<title>Persis</title>"
          - "/persis/"
          - "persis.require"
          - "persis.ui.progress"
          - "images_persis/"
        condition: or

      - type: status
        status:
          - 200
          - 301
          - 302
        condition: or
