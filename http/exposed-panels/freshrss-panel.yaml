id: freshrss-panel

info:
  name: Freshrss 面板识别（指纹识别）
  author: ritikchaddha
  severity: info
  description: |-
    检测到目标站点存在 Freshrss 相关响应特征。Freshrss 是一套通过 Web 提供访问的管理面板或业务系统，通常用于配置服务、查看状态、管理数据或执行日常运维操作。模板请求 `/`，并通过页面标题或正文关键字、状态码确认该系统指纹，用于资产识别、系统盘点和暴露面梳理。
  classification:
    cpe: cpe:2.3:a:freshrss:freshrss:*:*:*:*:*:*:*:*
  metadata:
    verified: true
    max-request: 1
    vendor: freshrss
    product: freshrss
    shodan-query: title:"Freshrss"
  tags: freshrss,panel,detect,discovery
http:
  - method: GET
    path:
      - "{{BaseURL}}"

    host-redirects: true
    max-redirects: 2

    matchers-condition: and
    matchers:
      - type: word
        part: body
        words:
          - 'content="FreshRSS'
          - 'alt="FreshRSS'
          - 'About FreshRSS'
          - 'FreshRSS</title>'
        condition: or

      - type: status
        status:
          - 200
