id: portainer-init-deploy

info:
  name: Portainer - Init Deploy Discovery
  author: princechaddha
  severity: medium
  description: |
    该模板用于检测 Portainer - Init Deploy Discovery。该类问题通常源于调试页面、配置文件、接口响应或目录资源被非预期暴露。模板会向 `/api/users/admin/check` 等位置发送探测请求，并结合响应状态、关键字、错误信息、时间差或外带交互等证据判断目标是否受影响。
  impact: |
    - 攻击者可获取系统版本、路径、账号、密钥、配置或业务数据等敏感信息。
    - 泄露的信息可能被用于后续漏洞匹配、凭据攻击、权限提升或横向移动。
  remediation: |
    - 关闭不必要的调试、示例、备份和信息展示接口，避免向未授权用户返回敏感内容。
    - 对敏感文件和接口增加访问控制，并从 Web 根目录移除备份、日志和配置文件。
    - 排查已泄露的凭据、令牌和配置，必要时执行轮换并检查访问日志。
  reference:
    - https://documentation.portainer.io/v2.0/deploy/initial/
  classification:
    cvss-metrics: CVSS:3.0/AV:N/AC:L/PR:N/UI:N/S:U/C:L/I:N/A:N
    cvss-score: 5.3
    cwe-id: CWE-200
  metadata:
    verified: true
    max-request: 1
    shodan-query: title:"Portainer"
  tags: portainer,exposure,docker,devops,disclosure,vuln

http:
  - method: GET
    path:
      - "{{BaseURL}}/api/users/admin/check"

    matchers-condition: and
    matchers:
      - type: word
        words:
          - "No administrator account found inside the database"

      - type: word
        words:
          - "application/json"
        part: header

      - type: status
        status:
          - 404
