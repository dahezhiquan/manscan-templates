id: filezilla-phish

info:
  name: FileZilla 仿冒钓鱼网站（钓鱼网站识别）
  author: rxerium
  severity: high
  description: |
    FileZilla 是面向开发者协作、代码托管、软件构建或技术社区的服务平台，通常关联源码、项目权限、访问令牌和协作资料。该模板用于识别疑似仿冒 FileZilla 的钓鱼网站；模板访问目标站点首页，在目标页面返回 200 状态码，且页面内容命中 FileZilla 官方页面常见文案或标题特征（“FileZilla - The free FTP solution”），且当前主机不属于 filezilla-project.org 等官方域名时触发。该类仿冒页面通常用于窃取控制台账号、开发者凭据、访问令牌或项目权限，可能进一步影响云资源、源码仓库和供应链安全。
  impact: |-
    - 用户可能在仿冒页面提交开发者账号、云控制台凭据、访问令牌或组织登录信息，导致源码、云资源和业务配置被未授权访问。
    - 钓鱼站点可能被用于投递恶意链接、伪造登录流程或绕过用户对官方品牌的信任判断。
    - 品牌方或被仿冒组织可能面临客户投诉、欺诈交易、信誉受损以及后续应急处置成本。
  remediation: |-
    - 确认该站点是否为授权域名；若确认为仿冒站点，立即在网关、DNS、邮件安全和浏览器安全策略中阻断访问。
    - 向被仿冒品牌、托管商、注册商、CDN 和浏览器安全浏览服务提交滥用举报或下架请求。
    - 保留 URL、域名、解析记录、页面截图、证书和命中特征等证据，用于威胁情报关联和后续追踪。
    - 排查是否已有用户访问或提交信息；对疑似受影响账号执行密码重置、会话撤销、令牌轮换和多因素认证加固。
    - 轮换可能暴露的 API Key、访问令牌、SSH Key、云访问密钥和 CI/CD Secret，并审计近期资源与代码变更。
  reference:
    - https://filezilla-project.org
  metadata:
    max-request: 1
  tags: phishing,filezilla,osint,discovery
http:
  - method: GET
    path:
      - "{{BaseURL}}"

    host-redirects: true
    max-redirects: 2

    matchers-condition: and
    matchers:
      - type: word
        words:
          - 'FileZilla - The free FTP solution'

      - type: status
        status:
          - 200

      - type: dsl
        dsl:
          - '!contains(host,"filezilla-project.org")'
