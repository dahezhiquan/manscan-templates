id: oracle-application-server-panel

info:
  name: Oracle Application Server 面板识别（指纹识别）
  author: righettod
  severity: info
  description: |-
    检测到目标站点存在 Oracle Application Server 相关响应特征。Oracle Application Server 是云原生、中间件或集群管理平台，用于管理服务、工作负载、消息流、API 网关、配置和运行状态。模板请求 `/em/console/ias/oc4j/home`、`/` 路径，并通过页面标题或正文关键字、状态码、DSL 条件确认该系统指纹，用于资产识别、系统盘点和暴露面梳理。
  reference:
    - https://www.oracle.com/middleware/technologies/internet-application-server.html
  metadata:
    verified: true
    max-request: 1
    shodan-query: http.title:"Oracle Containers for J2EE"
  tags: panel,oracle,containers,login,detect,discovery
http:
  - method: GET
    path:
      - "{{BaseURL}}/em/console/ias/oc4j/home"
      - "{{BaseURL}}"

    stop-at-first-match: true
    host-redirects: true
    max-redirects: 2

    matchers:
      - type: dsl
        dsl:
          - 'status_code == 200'
          - 'contains_any(to_lower(body), "login to oracle application server control", "oracle enterprise manager")'
        condition: and

    extractors:
      - type: regex
        group: 1
        regex:
          - '(?i)Copyright\s+&copy;\s+([0-9,\s]+),\s+Oracle'
