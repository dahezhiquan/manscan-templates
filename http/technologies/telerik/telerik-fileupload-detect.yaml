id: telerik-fileupload-detect

info:
  name: Telerik Web UI Fileupload Handler 指纹识别（指纹识别）
  author: organiccrap
  severity: info
  description: 用于识别目标是否使用 Telerik Web UI Fileupload Handler，模板会结合特定路径或已知端点进行技术指纹匹配。
  metadata:
    max-request: 1
  tags: tech,telerik,fileupload,intrusive,discovery

http:
  - method: GET
    path:
      - "{{BaseURL}}/Telerik.Web.UI.WebResource.axd?type=rau"

    matchers:
      - type: word
        words:
          - "RadAsyncUpload handler is registered succesfully"
