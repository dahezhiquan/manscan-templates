id: graylog-default-login

info:
  name: Graylog 默认口令登录（弱口令）
  author: 0x_Akoko,0xBassia
  severity: high
  description: |
    该模板用于检测 Graylog 是否仍可使用默认凭据或弱口令登录。模板主要向 `/api/`、`/api/system/sessions` 等认证入口发送请求，使用内置默认凭据组合进行认证尝试，并根据响应中的 `status_code == 200`、`contains(content_type, "application/json")` 等登录成功特征判断登录是否成功；命中说明目标未及时修改出厂、示例或初始化账号口令。
  impact: |
    - 攻击者可登录 Graylog 管理接口，读取、导出或篡改数据、索引、队列、仓库、报表或服务配置。
    - 若系统保存连接串、访问令牌或集成凭据，弱口令登录可能进一步造成业务数据泄露、权限扩大或服务中断。
  remediation: |
    - 立即修改默认账号口令，删除测试账号，并为管理员、服务账号和集成账号使用唯一强密码。
    - 启用细粒度权限控制、访问来源限制和审计日志，避免管理 API 或控制台直接对公网开放。
    - 检查数据导出、配置变更、令牌使用和异常查询记录，必要时轮换相关凭据。
  reference:
    - https://go2docs.graylog.org/current/setting_up_graylog/rest_api.html
    - https://docs.graylog.org/docs/server-conf
    - https://docs.graylog.org/docs/authentication
    - https://archivedocs.graylog.org/en/2.5/pages/installation/virtual_machine_appliances.html
  classification:
    cvss-metrics: CVSS:3.1/AV:N/AC:L/PR:N/UI:N/S:U/C:H/I:H/A:N
    cvss-score: 9.1
    cwe-id: CWE-798
  metadata:
    verified: true
    max-request: 2
    vendor: graylog
    product: graylog
    shodan-query: 'title:"Graylog Web Interface"'
    fofa-query: 'app="Graylog" || title="Graylog Web Interface"'
  tags: default-login,graylog,logging

variables:
  username: "admin"
  password: "admin"

flow: http(1) && http(2)

http:
  - raw:
      - |
        GET /api/ HTTP/1.1
        Host: {{Hostname}}
        Accept: application/json

    matchers:
      - type: dsl
        internal: true
        dsl:
          - 'status_code == 200'
          - 'contains(content_type, "application/json")'
          - 'contains_all(body, "\"cluster_id\"", "\"node_id\"", "\"version\"")'
        condition: and

  - raw:
      - |
        POST /api/system/sessions HTTP/1.1
        Host: {{Hostname}}
        Content-Type: application/json
        Accept: application/json
        X-Requested-By: nuclei

        {"username":"{{username}}","password":"{{password}}","host":""}

    matchers:
      - type: dsl
        dsl:
          - 'status_code == 200'
          - 'contains(content_type, "application/json")'
          - 'contains_all(body, "\"session_id\"", "\"valid_until\"")'
        condition: and

    extractors:
      - type: regex
        name: session_id
        part: body
        regex:
          - '"session_id"\s*:\s*"([^"]+)"'
