id: unnecessary-service-check

info:
  name: 不必要服务正在运行（本地基线扫描）
  author: nukunga[SungHyunJeon]
  severity: medium
  description: |
    该模板检查 Alerter、Clipbook、Messenger、Simple TCP/IP Services 等不必要服务是否运行。遗留服务会增加攻击面。
  impact: |
    攻击者可利用不必要服务的弱配置或漏洞进行信息收集、拒绝服务或远程攻击。
  remediation: |
    停止并禁用无业务需求的服务，仅保留必要系统组件。
  reference:
    - https://isms.kisa.or.kr/main/csap/notice/?boardId=bbs_0000000000000004&mode=view&cntId=85
  tags: service-management,code,windows-audit,kisa

self-contained: true

code:
  - pre-condition: |
      IsWindows();

    engine:
      - powershell
      - powershell.exe

    args:
      - -ExecutionPolicy
      - Bypass

    pattern: "*.ps1"
    source: |
      $servicesToCheck = @("Alerter", "Clipbook", "Messenger", "Simple TCP/IP Services")
      $vulnerable = $false
      foreach ($svc in $servicesToCheck) {
          $service = Get-Service -Name $svc -ErrorAction SilentlyContinue
          if ($service -and $service.Status -eq "Running") {
              $vulnerable = $true
              break
          }
      }
      if ($vulnerable) {
          "UNNECESSARY_SERVICE_RUNNING"
      } else {
          "UNNECESSARY_SERVICE_STOPPED"
      }

    matchers:
      - type: word
        words:
          - "UNNECESSARY_SERVICE_RUNNING"
