id: kubernetes-dockercfg-secret

info:
  name: kubernetes.io/dockercfg 密钥 泄露检测（本地文件安全扫描）
  author: dwisiswant0
  severity: high
  description: |
    kubernetes.io/dockercfg 密钥用于从镜像仓库拉取或推送容器镜像。配置中的认证信息泄露后，攻击者可能读取私有镜像，或在凭据具备写权限时植入恶意镜像和供应链内容。本模板匹配 Kubernetes `kubernetes.io/dockercfg` Secret 中的 Base64 编码 Docker 配置值。
  impact: |
    - 读取权限可能导致私有镜像、依赖和环境变量泄露，暴露应用源码和构建秘密。
    - 推送权限可能被用于上传后门镜像，影响集群部署和软件供应链。
    - Kubernetes 中的镜像凭据还可能被多个命名空间或节点复用，扩大泄露范围。
  remediation: |
    - 在 Docker Hub 或目标镜像仓库撤销并重新生成命中的令牌，限制到必要仓库、操作和有效期。
    - 更新 Kubernetes Secret、ServiceAccount 和 CI/CD 凭据，避免在镜像层、Pod 日志和清单历史中保留旧值。
    - 对镜像启用签名、扫描和发布审批，审计泄露期间的拉取、推送和标签变更。
  reference:
    - https://blog.aquasec.com/the-ticking-supply-chain-attack-bomb-of-exposed-kubernetes-secrets
  metadata:
    verified: true
  tags: kubernetes,file,keys,secret

file:
  - extensions:
      - yaml
      - yml

    extractors:
      - type: regex
        part: body
        regex:
          - \.dockercfg:\s+["']?e(w|y)[\w=]+["']?
