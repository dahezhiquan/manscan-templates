id: romm-panel

info:
  name: RomM 面板 - 检测（暴露面识别）
  author: ChrisJr404
  severity: info
  description: |-
    RomM（romm.app / github.com/rommapp/romm）是一款流行的开源自托管 ROM 管理器与播放器。其未授权访问的 /api/heartbeat 端点返回包含当前运行版本、已启用元数据源及托管平台的 JSON 配置快照。暴露的实例会泄露此配置信息，并指向可浏览的 ROM 库。
  reference:
    - https://github.com/rommapp/romm
    - https://romm.app/
    - https://docs.romm.app/
  metadata:
    verified: true
    max-request: 1
    vendor: rommapp
    product: romm
    shodan-query: http.title:"RomM"
    fofa-query: title="RomM"
  tags: panel,romm,rom,selfhosted,detect,discovery

http:
  - method: GET
    path:
      - "{{BaseURL}}/api/heartbeat"

    matchers:
      - type: dsl
        dsl:
          - 'status_code == 200'
          - 'contains(content_type, "application/json")'
          - 'contains_all(body, "\"SHOW_SETUP_WIZARD\"", "\"METADATA_SOURCES\"", "\"IGDB_API_ENABLED\"", "\"FS_PLATFORMS\"")'
        condition: and

    extractors:
      - type: regex
        part: body
        group: 1
        regex:
          - '"VERSION"\s*:\s*"([^"]+)"'
