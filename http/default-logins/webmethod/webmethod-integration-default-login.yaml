id: webmethod-integration-default-login

info:
  name: WebMethod Integration Server 默认口令登录（弱口令）
  author: ChristianPoeschl,OleWagner,usdAG
  severity: high
  description: |
    该模板用于检测 WebMethod Integration Server 是否仍可使用默认凭据或弱口令登录。模板主要向 `/invoke/pub.file/getFile` 等认证入口发送请求，使用内置默认凭据组合进行认证尝试，并根据响应中的 `com.wm.app.b2b.server`、`No filename supplied` 等登录成功特征判断登录是否成功；命中说明目标未及时修改出厂、示例或初始化账号口令。
  impact: |
    - 攻击者可进入 WebMethod Integration Server 管理后台，修改任务、服务、插件、路由、作业调度或部署配置。
    - 在 DevOps、网关、监控或运维场景中，后台失陷可能影响生产任务执行、泄露密钥配置，并扩大到下游主机或业务系统。
  remediation: |
    - 立即修改默认管理员口令并清理示例账号，按角色最小化后台管理权限。
    - 将控制台和管理 API 放入受控网络或 VPN 后方，并开启多因素认证、登录失败限制和操作审计。
    - 复核近期任务、插件、连接配置、访问令牌和部署记录，轮换可能暴露的密钥。
  reference:
    - https://documentation.softwareag.com/
  classification:
    cpe: cpe:2.3:a:softwareag:webmethods:*:*:*:*:*:*:*:*
  metadata:
    verified: true
    max-request: 5
    shodan-query: "http.favicon.hash:-234335289"
    product: webmethods
    vendor: softwareag
  tags: default-login,webmethod,vuln
flow: http(1) && http(2)

http:
  - method: GET
    path:
      - "{{BaseURL}}/invoke/pub.file/getFile"

    matchers:
      - type: dsl
        dsl:
          - status_code == 403 || status_code == 401
          - contains(to_lower(header), 'integration server')
        condition: and
        internal: true

  - method: GET
    path:
      - "{{BaseURL}}/invoke/pub.file/getFile"
    headers:
      Authorization: "{{base64(username + ':' + password)}}"
      Cookie: ssnid=

    cookie-reuse: false
    threads: 10
    attack: pitchfork
    payloads:
      username:
        - Administrator
        - Developer
        - Replicator
        - SAPUser
      password:
        - manage
        - isdev
        - iscopy
        - 22101999

    matchers-condition: and
    matchers:
      - type: word
        part: body
        words:
          - com.wm.app.b2b.server
          - No filename supplied
        condition: and

      - type: word
        words:
          - com.wm.app.b2b.server.AccessException
          - Invalid credentials
        negative: true
        condition: and
