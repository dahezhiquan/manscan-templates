id: tiny-file-manager-unauth

info:
  name: Tiny 文件 Manager 未授权 访问
  author: ritikchaddha,HuTa0
  severity: medium
  description: |
    检测到 Tiny 文件 Manager 未授权 访问。目标功能在未认证状态下可访问，可能暴露管理入口、业务数据、系统状态或可执行操作，需确认是否存在访问控制缺失。
  metadata:
    verified: true
    max-request: 1
    shodan-query: title:"Tiny File Manager"
    zoomeye-query: app="Tiny File Manager"
  tags: misconfig,filemanager,detect,vuln

http:
  - method: GET
    path:
      - '{{BaseURL}}/index.php'

    host-redirects: true
    max-redirects: 2

    matchers-condition: and
    matchers:
      - type: word
        words:
          - 'Tiny File Manager'
          - '<th>Actions'
          - 'New Item'
          - 'Upload'
        condition: and

      - type: status
        status:
          - 200
