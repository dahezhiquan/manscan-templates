id: api-abstract-website-screenshot

info:
  name: Abstract API Website Screenshot Token 可用性校验（token喷洒）
  author: daffainfo
  severity: info
  description: 该模板通过调用 Abstract Website Screenshot API 验证提供的 token 是否有效，命中后通常表示可访问网页截图能力。
  reference:
    - https://www.abstractapi.com/api/website-screenshot-api
    - https://github.com/daffainfo/all-about-apikey/tree/main/abstract-website-screenshot
  metadata:
    max-request: 1
  tags: token-spray,abstractapi

self-contained: true

http:
  - method: GET
    path:
      - "https://screenshot.abstractapi.com/v1/?api_key={{token}}&url=https://test.test"

    matchers:
      - type: word
        part: body
        words:
          - '"code":"validation_error"'
          - 'Reached error page'
        condition: and
