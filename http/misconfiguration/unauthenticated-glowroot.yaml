id: unauthenticated-glowroot

info:
  name: Glowroot 匿名 用户
  author: pussycat0x
  severity: high
  description: |
    检测到 Glowroot 匿名 用户。目标功能在未认证状态下可访问，可能暴露管理入口、业务数据、系统状态或可执行操作，需确认是否存在访问控制缺失。
  metadata:
    max-request: 1
    shodan-query: http.title:"Glowroot"
  tags: misconfig,unauth,glowroot,vuln

http:
  - method: GET
    path:
      - '{{BaseURL}}/backend/admin/users?username=anonymous'

    matchers-condition: and
    matchers:
      - type: word
        words:
          - '"username":"anonymous"'
          - '"Administrator"'
          - '"newPassword":""'
        condition: and

      - type: word
        words:
          - "application/json"
        part: header

      - type: status
        status:
          - 200
