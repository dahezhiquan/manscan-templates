id: db2-discover

info:
  name: IBM Db2 发现服务识别（指纹识别）
  author: pussycat0x
  severity: info
  description: |
    IBM Db2 是 IBM 提供的企业级关系型数据库，常用于业务数据存储、事务处理和数据分析场景。Db2 discovery 服务可通过 UDP 523 响应发现请求并返回数据库实例相关信息；该模板发送 DB2GETADDR 探测，依据 DB2RETADDRSQL 响应并解析版本号、主机名来识别 Db2 资产。
  reference:
    - https://nmap.org/nsedoc/scripts/broadcast-db2-discover.html
  metadata:
    shodan-query: port:523
    verified: true
    max-request: 1
    vendor: ibm
    product: db2
  tags: ibm,network,js,udp,discovery,detect

javascript:
  - pre-condition: |
      isUDPPortOpen(Host,Port);
    code: |
      let packet = bytes.NewBuffer();
      const c = require("nuclei/net");
      const cmd = "DB2GETADDR\0SQL09010\0"
      packet.WriteString(cmd)
      let conn = c.Open('udp', `${Host}:${Port}`);
      conn.SendHex(packet.Hex());
      const result = conn.RecvString()
      const cleanedString = result.replace(/\x00/g, '');
      let combinedResult;

      if (cleanedString.includes("DB2RETADDRSQL")) {

      const regex = /^DB2RETADDRSQL(\d{2})(\d{2})(\d{1})(.*)$/;
      const matches = cleanedString.match(regex);

      const formattedNumber = matches ? `${matches[1]}.${matches[2]}.${matches[3]}` : '';
      const hostname = matches ? matches[4] : '';

      combinedResult = `Db2 Version: ${formattedNumber}, Hostname: ${hostname}`;

      } else {
      conn.Close();
      }
      combinedResult;

    args:
      Host: "{{Host}}"
      Port: 523

    matchers:
      - type: dsl
        dsl:
          - "success == true"

    extractors:
      - type: dsl
        dsl:
          - response
