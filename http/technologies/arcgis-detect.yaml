id: arcgis-detect

info:
  name: ArcGIS 指纹识别（指纹识别）
  author: righettod
  severity: info
  description: |-
    ArcGIS 是 Esri 地理信息系统平台，用于地图服务、空间数据、分析和 GIS 应用发布。该模板请求 `/portal/sharing/rest`、`/portal/portalhelp/en/rest/`、`/arcgis/rest/services` 等路径，并依据 DSL 条件识别目标是否使用或暴露了 ArcGIS 相关组件，适用于资产盘点、技术栈识别和后续安全评估；命中结果仅表示指纹特征匹配，不代表已确认存在可利用漏洞。
  reference:
  - https://enterprise.arcgis.com/en/
  metadata:
    verified: true
    max-request: 5
    shodan-query: http.title:"ArcGIS"
  tags: tech,arcgis,detect,discovery

http:
  - method: GET
    path:
      - "{{BaseURL}}/portal/sharing/rest"
      - "{{BaseURL}}/portal/portalhelp/en/rest/"
      - "{{BaseURL}}/arcgis/rest/services"
      - "{{BaseURL}}/server/rest/services"
      - "{{BaseURL}}/arcgis/"

    stop-at-first-match: true
    matchers:
      - type: dsl
        dsl:
          - 'status_code == 200'
          - 'contains_any(to_lower(body), "<title>arcgis portal directory", "search arcgis enterprise help", "<title>arcgis</title>", "arcgis rest services directory", "<title>arcgis hub</title>")'
        condition: and

    extractors:
      - type: regex
        part: body
        group: 1
        regex:
          - '(?i)&copy;\s+([0-9]+)\s+Esri\.'
          - '<b>Current\s+Version:\s+<\/b>([0-9.]+)'
