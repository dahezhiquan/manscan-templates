id: api-aniapi

info:
  name: AniAPI API Token 可用性校验（token喷洒）
  author: daffainfo
  severity: info
  description: 该模板通过调用 AniAPI API 的已知接口验证提供的 token 是否有效，命中后通常表示可访问相关 API 能力。
  reference:
    - https://aniapi.com/docs/authentication
    - https://github.com/daffainfo/all-about-apikey/tree/main/aniapi
  metadata:
    max-request: 1
  tags: token-spray,aniapi

self-contained: true

http:
  - method: GET
    path:
      - "https://api.aniapi.com/v1/auth/me"

    headers:
      Authorization: Bearer {{token}}
    matchers:
      - type: word
        part: body
        words:
          - '"username":'
          - '"data":'
        condition: and
