id: ntfy-web-exposure

info:
  name: NTFY Web 暴露
  author: DhiyaneshDk
  severity: medium
  description: |
    检测到 NTFY Web 暴露。目标功能在未认证状态下可访问，可能暴露管理入口、业务数据、系统状态或可执行操作，需确认是否存在访问控制缺失。
  metadata:
    verified: true
    max-request: 1
    shodan-query: html:"ntfy.sh"
  tags: exposure,ntfy,web,misconfig,vuln

http:
  - method: GET
    path:
      - "{{BaseURL}}/settings"

    matchers-condition: and
    matchers:
      - type: word
        part: body
        words:
          - "<title>ntfy web</title>"

      - type: status
        status:
          - 200
