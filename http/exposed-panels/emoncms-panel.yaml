id: emoncms-panel

info:
  name: OpenEnergyMonitor emonCMS - 登录面板（暴露面识别）
  author: rxerium
  severity: info
  description: |
    该模板通过识别 OpenEnergyMonitor emonCMS 登录入口的页面标题、特征文本或重定向行为，判断目标是否暴露了对应的认证界面。若命中，说明该登录面板对外可访问，可用于暴露面梳理与后续安全评估。
  reference:
    - https://emoncms.org/
    - https://github.com/emoncms/emoncms
  metadata:
    max-request: 1
    verified: true
    vendor: OpenEnergyMonitor
    product: emoncms
    shodan-query: 'http.title:"Emoncms - user login"'
  tags: panel,emoncms,energy,iot,ics,monitoring,discovery

http:
  - method: GET
    path:
      - "{{BaseURL}}"

    host-redirects: true
    max-redirects: 2

    matchers-condition: and
    matchers:
      - type: word
        part: body
        words:
          - 'Emoncms - user login'

      - type: word
        part: header
        words:
          - 'EMONCMS_SESSID'

      - type: status
        status:
          - 200
