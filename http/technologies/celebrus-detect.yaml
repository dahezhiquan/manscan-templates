id: celebrus-detect

info:
  name: Celebrus 指纹识别（指纹识别）
  author: righettod
  severity: info
  description: |-
    Celebrus 是客户数据和数字行为分析平台，用于采集、分析和营销数据处理。该模板请求首页，并依据 DSL 条件识别目标是否使用或暴露了 Celebrus 相关组件，适用于资产盘点、技术栈识别和后续安全评估；命中结果仅表示指纹特征匹配，不代表已确认存在可利用漏洞。
  reference:
  - https://investors.celebrus.com/
  metadata:
    verified: true
    max-request: 1
    shodan-query: http.title:"Celebrus"
  tags: tech,celebrus,detect,discovery

http:
  - method: GET
    path:
      - "{{BaseURL}}"

    host-redirects: true
    max-redirects: 2

    matchers:
      - type: dsl
        dsl:
          - 'status_code == 200'
          - 'contains_any(to_lower(body), "content=\"celebrus technologies ltd", "<title>celebrus")'
        condition: and

    extractors:
      - type: regex
        part: body
        group: 1
        regex:
          - 'Celebrus\s+([0-9.]+)\s+Collection'
