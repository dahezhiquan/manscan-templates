id: password-warn-age

info:
  name: 密码过期提醒天数未配置（本地基线扫描）
  author: Th3l0newolf
  severity: medium
  description: |
    密码过期提醒天数缺失或不符合基线会导致用户无法提前获知密码即将过期，增加业务中断、临时绕过或弱化改密流程的概率。CIS Ubuntu 基线通常要求配置 `PASS_WARN_AGE`；模板读取 `/etc/login.defs` 中该值，不等于 7 时命中 Policy-Fail。
  impact: |
    - 用户可能在密码到期后才发现无法登录，诱发紧急重置和流程绕过。
    - 凭据生命周期管理不一致会影响账号基线合规。
  remediation: |
    - 在 `/etc/login.defs` 中将 `PASS_WARN_AGE` 设置为组织要求值，当前模板基线为 7 天。
    - 对已有账号使用 `chage` 同步提醒策略，并通过运维流程提前通知用户。
  reference:
    - https://www.cisecurity.org/benchmark/ubuntu_linux
  metadata:
    verified: true
  tags: cis,local,cisecurity,audit,linux,ubuntu,password

self-contained: true

code:
  - engine:
      - bash

    args:
      - "-c"
      - |
        WARN_AGE_LINE=$(grep -Pi -- '^\h*PASS_WARN_AGE\h+\d+\b' /etc/login.defs | head -n1)
        if [ -n "$WARN_AGE_LINE" ]; then
          VALUE=$(echo "$WARN_AGE_LINE" | awk '{print $2}')
          if [ "$VALUE" -eq 7 ]; then
            echo "[password-warn-age-check:Policy-Pass] [PASS_WARN_AGE is $VALUE (valid)] [CIS_PASS]"
          else
            echo "[password-warn-age-check:Policy-Fail] [PASS_WARN_AGE is $VALUE (invalid)] [CIS_FAIL]"
          fi
        else
          echo "[password-warn-age-check:Policy-Fail] [PASS_WARN_AGE not set or malformed] [CIS_FAIL]"
        fi

    matchers:
      - type: word
        name: policy-pass
        words:
          - "Policy-Pass"

      - type: word
        name: policy-fail
        words:
          - "Policy-Fail"
