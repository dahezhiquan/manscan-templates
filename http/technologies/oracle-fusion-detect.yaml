id: oracle-fusion-detect

info:
  name: Oracle Fusion Middleware 指纹识别（指纹识别）
  author: rxerium
  severity: info
  description: >-
    Oracle Fusion Middleware 是 Oracle 企业中间件套件，用于身份、门户、SOA、应用服务器和集成服务。该模板通过请求目标服务并检查预设路径或首页响应、页面正文关键字、状态码等指纹特征，判断目标是否使用或暴露了
    Oracle Fusion Middleware 相关组件；命中结果仅表示指纹特征匹配，可用于资产盘点、技术栈识别和后续安全评估，不代表已确认存在可利用漏洞。
  metadata:
    verified: true
    max-request: 1
    shodan-query: http.html:"Welcome to Oracle Fusion Middleware"
  tags: oracle,middleware,detect,tech,discovery
http:
  - method: GET
    path:
      - "{{BaseURL}}"

    matchers-condition: and
    matchers:
      - type: word
        part: body
        words:
          - "<title>Welcome to Oracle Fusion Middleware"

      - type: status
        status:
          - 200
