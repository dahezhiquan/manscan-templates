id: sqlpad-panel

info:
  name: SQLPad 登录面板识别（指纹识别）
  author: s4e-io
  severity: info
  description: |-
    SQLPad 是 SQL 查询与数据探索平台，用于连接数据库、编写查询和共享结果。该模板请求 `/signin`，并依据 DSL 条件识别目标是否部署了该系统或暴露了对应入口，适用于资产指纹确认；命中结果仅表示系统特征匹配，不代表已确认存在未授权访问或可利用漏洞。
  reference:
  - https://github.com/sqlpad/sqlpad
  metadata:
    verified: true
    max-request: 1
    fofa-query: "SQLPad"
  tags: panel,login,sqlpad,detect,discovery

http:
  - method: GET
    path:
      - "{{BaseURL}}/signin"

    matchers:
      - type: dsl
        dsl:
          - 'contains_any(body, "<title>SQLPad</title>", "webpackJsonpsqlpad")'
          - 'status_code == 200'
        condition: and
