id: datadog-rum-detect

info:
  name: Datadog Browser RUM 指纹识别（指纹识别）
  author: Shivam Kamboj
  severity: info
  description: |
    用于识别目标是否使用 Datadog Browser RUM，模板会结合页面正文和特定路径或已知端点进行技术指纹匹配。
  reference:
    - https://docs.datadoghq.com/real_user_monitoring/browser/
    - https://docs.datadoghq.com/real_user_monitoring/browser/setup/
    - https://www.npmjs.com/package/@datadog/browser-rum
  metadata:
    verified: true
    max-request: 1
    vendor: datadog
    product: browser-rum
    shodan-query: html:"DD_RUM.init"
  tags: tech,detect,rum,datadog

http:
  - method: GET
    path:
      - "{{BaseURL}}"

    redirects: true

    matchers:
      - type: word
        part: body
        words:
          - "DD_RUM.init"
          - "DD_RUM.onReady"
        condition: and
