id: max-password-age-too-high

info:
  name: 密码最长使用期限过长或无限制（本地基线扫描）
  author: princechaddha
  severity: medium
  description: |
    过长周期会延长泄露口令可用时间。对应基线项为“最大密码使用期限是否过高或未限制”；模板执行 `net accounts` 解析账户锁定或密码策略，命中超出基线的阈值时判定不合规。
  impact: |
    - 一旦口令泄露，攻击者可能长期保持访问。
    - 凭据保护不足会增加横向移动、远程登录和离线破解风险。
  remediation: |
    - 设置合理的最大密码期限，并结合 MFA、泄露检测和风险驱动轮换。
    - 变更策略后清理历史凭据，并轮换可能受影响的账户密码。
  tags: policy,code,windows-audit

self-contained: true

code:
  - pre-condition: |
      IsWindows();
    engine:
      - cmd
    args:
      - /c
    pattern: "*.cmd"
    source: |
      net accounts

    matchers:
      - type: word
        words:
          - "Maximum password age (days):                          0"
