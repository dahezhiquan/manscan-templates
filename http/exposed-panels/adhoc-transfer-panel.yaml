id: adhoc-transfer-panel

info:
  name: WS-FTP Ad Hoc Transfer 面板识别（指纹识别）
  author: johnk3r
  severity: info
  description: |-
    检测到目标站点存在 WS-FTP Ad Hoc Transfer 相关响应特征。WS-FTP Ad Hoc Transfer 是监控、日志、分析或仪表盘系统，用于展示运行指标、访问统计、日志事件和服务状态。模板请求 `/AHT/`，并通过页面标题或正文关键字、状态码确认该系统指纹，用于资产识别、系统盘点和暴露面梳理。
  metadata:
    verified: true
    max-request: 1
    vendor: progress
    product: ws_ftp
    shodan-query:
      - http.title:"Ad Hoc Transfer"
      - ws_ftp port:22
      - http.title:"ad hoc transfer"
      - http.title:"ws_ftp server web transfer"
    fofa-query:
      - title="ws_ftp server web transfer"
      - title="ad hoc transfer"
    google-query:
      - intitle:"ws_ftp server web transfer"
      - intitle:"ad hoc transfer"
    censys-query: services.http.request.uri="*/thinclient/wtm/public/index.html"
  tags: panel,ws_ftp,ad-hoc,detect,login,progress,discovery
http:
  - method: GET
    path:
      - "{{BaseURL}}/AHT/"

    host-redirects: true
    max-redirects: 2

    matchers-condition: and
    matchers:
      - type: word
        part: body
        words:
          - 'Ad Hoc Transfer'

      - type: status
        status:
          - 200
