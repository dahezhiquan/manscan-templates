id: phalcon-framework-source

info:
  name: Phalcon Framework 源码 Leakage 泄露（暴露面识别）
  author: philippedelteil
  severity: high
  description: 检测到对外可访问的 Phalcon Framework 源码 Leakage。这类配置资源可能包含部署细节、访问凭据、内部地址、组件版本或调试开关，公开暴露后会显著增加被侦察和后续利用的风险。
  metadata:
    max-request: 1
  tags: exposure,debug,phalcon,vuln

http:
  - method: GET
    path:
      - "{{BaseURL}}/anything_here"

    matchers-condition: and
    matchers:
      - type: word
        part: body
        words:
          - "Phalcon Framework"
          - "AnythingHereController"
        condition: and

      - type: status
        status:
          - 200
