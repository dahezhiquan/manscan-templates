id: set-hostname

info:
  name: pfSense 主机名未设置（本地文件安全扫描）
  author: pussycat0x
  severity: info
  description: |
    该模板检测 pfSense 主机名是否正确设置。主机名是网络中识别设备的唯一标识，缺失会影响运维和审计。
  reference:
    - https://docs.netgate.com/pfsense/en/latest/config/general.html
  classification:
    cvss-metrics: CVSS:3.1/AV:N/AC:L/PR:N/UI:N/S:U/C:N/I:N/A:N
    cvss-score: 0
    cwe-id: CWE-200
  tags: firewall,config,audit,pfsense,file

file:
  - extensions:
      - xml

    matchers-condition: and
    matchers:
      - type: word
        words:
          - "<system>"
          - "<hostname></hostname>"
          - "domain>"
        condition: and

