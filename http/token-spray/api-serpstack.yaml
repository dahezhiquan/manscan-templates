id: api-serpstack

info:
  name: serpstack API Token 可用性校验（token喷洒）
  author: daffainfo
  severity: info
  description: 该模板通过调用 serpstack API 的已知接口验证提供的 token 是否有效，命中后通常表示可访问相关 API 能力。
  reference:
    - https://serpstack.com/documentation
    - https://github.com/daffainfo/all-about-apikey/tree/main/serpstack
  metadata:
    max-request: 1
  tags: token-spray,serpstack

self-contained: true

http:
  - method: GET
    path:
      - "http://api.serpstack.com/search?access_key={{token}}&query=mcdonalds"

    matchers:
      - type: word
        part: body
        words:
          - '"total_time_taken"'
          - '"processed_timestamp"'
          - '"search_url"'
        condition: and
