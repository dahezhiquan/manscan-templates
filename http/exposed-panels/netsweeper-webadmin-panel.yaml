id: netsweeper-webadmin-panel

info:
  name: Netsweeper WebAdmin - 登录面板（暴露面识别）
  author: rxerium
  severity: info
  description: |-
    Netsweeper 是一款互联网内容过滤与 Web 策略管理平台，被 ISP、政府机构、教育机构和企事业单位用于执行可接受使用策略，并限制对有害内容的访问。
  reference:
    - https://www.netsweeper.com/
  metadata:
    max-request: 1
    shodan-query: 'http.title:"Netsweeper"'
  tags: panel,netsweeper,webfilter,vpn

http:
  - method: GET
    path:
      - "{{BaseURL}}"

    redirects: true
    max-redirects: 2
    matchers-condition: and
    matchers:
      - type: word
        words:
          - 'Netsweeper WebAdmin'
        part: body

      - type: status
        status:
          - 200
