id: adguard-panel

info:
  name: AdGuard 面板识别（指纹识别）
  author: ritikchaddha
  severity: info
  description: |
    该模板通过识别 AdGuard 面板、控制台或管理界面的页面特征，判断目标是否暴露了对应服务入口。若命中，说明该后台或运维界面对外可访问，可用于资产识别与暴露面排查。
  classification:
    cpe: cpe:2.3:a:adguard:adguard:*:*:*:*:*:*:*:*
  metadata:
    verified: true
    max-request: 1
    vendor: adguard
    product: adguard
    fofa-query: title="AdGuard Home"
  tags: adguard,panel,login,detect,discovery

http:
  - method: GET
    path:
      - "{{BaseURL}}"

    host-redirects: true
    max-redirects: 2

    matchers-condition: and
    matchers:
      - type: word
        part: body
        words:
          - 'AdGuard Home</title>'

      - type: status
        status:
          - 200
