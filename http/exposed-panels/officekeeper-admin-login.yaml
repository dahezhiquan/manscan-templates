id: officekeeper-admin-login

info:
  name: OfficeKeeper Admin 登录面板识别（暴露面识别）
  author: gy741
  severity: info
  description: 该模板通过识别 OfficeKeeper Admin 登录入口的页面标题、特征文本或重定向行为，判断目标是否暴露了对应的认证界面。若命中，说明该登录面板对外可访问，可用于暴露面梳理与后续安全评估。
  classification:
    cvss-metrics: CVSS:3.0/AV:N/AC:L/PR:N/UI:N/S:U/C:N/I:N/A:N
    cwe-id: CWE-200
  metadata:
    verified: true
    max-request: 2
    shodan-query: http.favicon.hash:-800060828
  tags: officekeeper,dlp,panel,discovery

http:
  - method: GET
    path:
      - "{{BaseURL}}"
      - "{{BaseURL}}/login"

    stop-at-first-match: true
    matchers:
      - type: word
        part: body
        words:
          - "통합PC보안이 가능한 정보유출방지 솔루션"
