id: gcloud-pg-log-statement-stats-enabled

info:
  name: PostgreSQL 数据库实例启用了 log_statement_stats（云安全）
  author: princechaddha
  severity: medium
  description: PostgreSQL log_statement_stats 会记录语句统计信息，适合短期性能诊断，不适合生产长期启用。本模板检查 Cloud SQL PostgreSQL 实例 databaseFlags 中 log_statement_stats 的值，匹配 on 时报告该统计日志已启用。
  impact: |
    - 统计日志会增加日志量、存储成本和分析噪声，可能掩盖真正异常的数据库事件。
    - 长期记录语句统计可能暴露业务访问模式，并对数据库性能产生额外影响。
  remediation: |
    - 关闭 log_statement_stats，仅在受控诊断期间临时启用。
    - 对调试类数据库 flag 建立到期复核，避免诊断结束后遗留在生产环境。
  reference:
    - https://cloud.google.com/sql/docs/postgres/flags
  metadata:
    vendor: google
    product: cloud-sql
  tags: cloud,devops,gcp,gcloud,google-cloud-sql,postgresql,gcp-cloud-config

flow: |
  code(1)
  for(let projectId of iterate(template.projectIds)){
    set("projectId", projectId)
    code(2)
    for(let sqlInstance of iterate(template.sqlInstances)){
      set("sqlInstance", sqlInstance)
      code(3)
    }
  }

self-contained: true

code:
  - engine:
      - sh
      - bash
    source: |
      gcloud projects list --format="json(projectId)"

    extractors:
      - type: json
        name: projectIds
        internal: true
        json:
          - '.[].projectId'

  - engine:
      - sh
      - bash
    source: |
      gcloud sql instances list --project $projectId --filter='DATABASE_VERSION:POSTGRES*' --format="json(name)"

    extractors:
      - type: json
        name: sqlInstances
        internal: true
        json:
          - '.[].name'

  - engine:
      - sh
      - bash
    source: |
      gcloud sql instances describe $sqlInstance --project $projectId --format=json | jq '.settings.databaseFlags // [] | map(select(.name=="log_statement_stats")) | .[].value'

    matchers:
      - type: word
        words:
          - 'on'

    extractors:
      - type: dsl
        dsl:
          - '"The log_statement_stats flag is enabled for PostgreSQL instance " + sqlInstance + " in project " + projectId'
