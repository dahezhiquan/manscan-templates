id: apache-rocketmq-broker-unauth

info:
  name: Apache RocketMQ Broker 未认证访问（服务漏洞）
  author: j4vaovo
  severity: high
  description: |
    Apache RocketMQ Broker 负责消息存储、投递和消费进度管理。Broker 远程通信端口暴露且未启用 ACL 或来源限制时，未授权客户端可能直接与 Broker 交互。该模板向 10911 端口发送 RocketMQ remoting 请求，并通过返回的 `serializeTypeCurrentRPC`、`JAVA`、`opaque` 等协议字段确认服务可被访问。
  impact: |
    - 攻击者可能探测 Broker、Topic 或集群信息，并根据权限配置进一步读写消息或干扰消息投递。
    - 未授权访问消息中间件可能导致业务数据泄露、消息篡改、消费链路异常或拒绝服务。
  remediation: |
    - 启用 RocketMQ ACL，并为生产者、消费者和管理端配置最小权限账号。
    - 将 Broker 端口限制在受信任网络内，避免 10911 等远程通信端口直接暴露。
    - 审计 Broker 访问日志和 Topic 权限，排查暴露期间的异常连接与消息操作。
  reference:
    - https://rocketmq.apache.org/docs/bestPractice/03access
  metadata:
    verified: true
    max-request: 1
    shodan-query: title:"RocketMQ"
    fofa-query: protocol="rocketmq"
  tags: network,rocketmq,broker,apache,unauth,misconfig,tcp,vuln
tcp:
  - inputs:
      - data: "000000820000007e7b22636f6465223a3130352c22666c6167223a302c226c616e6775616765223a224a415641222c226f7061717565223a312c2273657269616c697a655479706543757272656e74525043223a224a534f4e222c2276657273696f6e223a3434312c226578744669656c6473223a7b22746f706963223a2254455354227d7d"
        type: hex

    host:
      - "{{Hostname}}"
    port: 10911
    read-size: 2048

    matchers-condition: and
    matchers:
      - type: word
        words:
          - serializeTypeCurrentRPC
          - JAVA
          - opaque
          - version
        condition: and

      - type: word
        words:
          - "HTTP"
          - "FTP"
          - "html"
        negative: true
