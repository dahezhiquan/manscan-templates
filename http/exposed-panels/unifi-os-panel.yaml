id: unifi-os-panel

info:
  name: UniFi OS 面板（暴露面识别）
  author: DhiyaneshDk
  severity: info
  description: |
    该模板通过识别 UniFi OS 面板、控制台或管理界面的页面特征，判断目标是否暴露了对应服务入口。若命中，说明该后台或运维界面对外可访问，可用于资产识别与暴露面排查。
  reference:
    - https://gbhackers.com/critical-unifi-os-flaw/
  classification:
    cwe-id: CWE-200
  metadata:
    max-request: 1
    verified: true
    shodan-query: title:"UniFi OS"
  tags: panel,router,discovery

http:
  - method: GET
    path:
      - "{{BaseURL}}/login"

    matchers-condition: and
    matchers:
      - type: word
        words:
          - "<title>UniFi OS</title>"
          - "UNIFI_OS_MANIFEST"
        condition: or

      - type: status
        status:
          - 200
