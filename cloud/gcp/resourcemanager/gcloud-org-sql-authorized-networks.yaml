id: gcloud-org-sql-authorized-networks

info:
  name: Cloud SQL Authorized Networks 未Restricted（云安全）
  author: princechaddha
  severity: medium
  description: Cloud SQL authorized networks 未在组织层限制时，实例可配置过宽来源网络，甚至形成公网可访问数据库入口。本模板检查 sql.restrictAuthorizedNetworks 组织策略 booleanPolicy，返回空对象 {} 时报告未限制 Cloud SQL 授权网络。
  impact: |
    - 数据库可能允许来自非受信任 IP 范围的连接，增加暴力破解、漏洞利用和数据泄露风险。
    - 授权网络缺少组织约束会导致项目间访问策略不一致，增加审计和整改成本。
  remediation: |
    - 启用 sql.restrictAuthorizedNetworks 组织策略，并限制可配置的 Cloud SQL authorized networks。
    - 优先使用私有 IP、VPC 连接和最小来源范围，定期清理不再需要的公网来源。
  reference:
    - https://www.trendmicro.com/cloudoneconformity/knowledge-base/gcp/ResourceManager/restrict-authorized-networks.html
    - https://cloud.google.com/sql/docs/mysql/authorize-networks
  metadata:
    vendor: google
    product: resource-manager
  tags: cloud,devops,gcp,gcloud,resourcemanager,security,sql,networking,gcp-cloud-config

flow: |
  code(1)
  for(let orgId of iterate(template.orgIds)){
    set("orgId", orgId)
    code(2)
  }

self-contained: true

code:
  - engine:
      - sh
      - bash
    source: |
      gcloud organizations list --format="json(name)"

    extractors:
      - type: json
        name: orgIds
        internal: true
        json:
          - '.[].name'

  - engine:
      - sh
      - bash
    source: |
      gcloud alpha resource-manager org-policies describe sql.restrictAuthorizedNetworks --organization=$orgId --effective --format="json(booleanPolicy)"

    matchers:
      - type: word
        words:
          - "{}"

    extractors:
      - type: dsl
        dsl:
          - '"Organization " + orgId + " has not restricted authorized networks for Cloud SQL instances, allowing potential public access"'
