id: victoriametrics-panel

info:
  name: VictoriaMetrics 面板识别（暴露面识别）
  author: Shivam Kamboj
  severity: info
  description: |
    该模板通过识别 VictoriaMetrics 面板、控制台或管理界面的页面特征，判断目标是否暴露了对应服务入口。若命中，说明该后台或运维界面对外可访问，可用于资产识别与暴露面排查。
  reference:
    - https://victoriametrics.com/
    - https://docs.victoriametrics.com/
  metadata:
    verified: true
    max-request: 1
    shodan-query: http.html:"VictoriaMetrics"
  tags: victoriametrics,login,panel,discovery

http:
  - method: GET
    path:
      - "{{BaseURL}}/vmui/"

    matchers:
      - type: dsl
        dsl:
          - 'status_code == 200'
          - 'contains_any(body, "VM UI", "VictoriaMetrics")'
        condition: and
