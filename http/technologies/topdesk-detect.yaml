id: topdesk-detect

info:
  name: TOPdesk 指纹识别（指纹识别）
  author: darses
  severity: info
  description: >-
    TOPdesk 是 IT 服务管理和工单平台，用于事件、资产、服务请求和流程管理。该模板通过请求目标服务并检查预设路径或首页响应、页面正文关键字、状态码、正则特征、DSL
    条件等指纹特征，判断目标是否使用或暴露了 TOPdesk 相关组件；命中结果仅表示指纹特征匹配，可用于资产盘点、技术栈识别和后续安全评估，不代表已确认存在可利用漏洞。
  metadata:
    verified: true
    max-requests: 1
    shodan-query: html:"TOPdesk"
    fofa-query: app="TOPdesk"
  tags: topdesk,tech,detect,discovery
http:
  - method: GET
    path:
      - "{{BaseURL}}"

    matchers-condition: and
    matchers:
      - type: word
        part: body
        words:
          - 'href="/tas/'
          - "topdeskidploginforwardurl"
        condition: or

      - type: status
        status:
          - 200

    extractors:
      - type: regex
        name: extracted_unix_timestamp
        part: body
        regex:
          - "auth\\.css\\?timestamp=(\\d{10})"
        group: 1
        internal: true

      - type: dsl
        dsl:
          - '"Release date: " + date_time("%Y-%M-%D", extracted_unix_timestamp)'
