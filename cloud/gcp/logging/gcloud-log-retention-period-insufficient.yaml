id: gcloud-log-retention-period-insufficient

info:
  name: Insufficient Log Data Retention Period 中的Cloud 日志记录 Buckets（云安全）
  author: princechaddha
  severity: high
  description: Cloud Logging bucket 保留时间过短会导致安全事件发生后缺少足够历史日志用于调查和合规留存。本模板枚举项目日志 bucket，读取 retentionDays，并在少于 365 天时报告保留周期不足。
  impact: |
    - 长周期攻击、内部滥用或审计抽查可能因历史日志已过期而无法完整还原。
    - 不满足组织或法规要求的日志留存期限时，可能影响取证、追责和合规证明。
  remediation: |
    - 将关键日志 bucket 的 retentionDays 调整到组织要求的期限，至少覆盖安全调查和合规留存窗口。
    - 对高价值项目配置日志导出和归档策略，兼顾存储成本、访问控制和不可篡改要求。
  reference:
    - https://cloud.google.com/logging/docs/export/configure_storage
  metadata:
    vendor: google
    product: cloud-logging
  tags: cloud,devops,gcp,gcloud,google-cloud-logging,gcp-cloud-config

flow: |
  code(1)
  for(let projectId of iterate(template.projectIds)){
    set("projectId", projectId)
    code(2)
    for(let bucket of iterate(template.buckets)){
      set("bucket", bucket);
      code(3)
      set("retentionDays", template.retentionDays);
      javascript(1)
    }
  }

self-contained: true

code:
  - engine:
      - sh
      - bash
    source: |
      gcloud projects list --format="json(projectId)"

    extractors:
      - type: json
        name: projectIds
        internal: true
        json:
          - '.[].projectId'

  - engine:
      - sh
      - bash
    source: |
      gcloud logging buckets list --project=$projectId --format="json(name.basename())"

    extractors:
      - type: json
        name: buckets
        internal: true
        json:
          - '.[].name'

  - engine:
      - sh
      - bash
    source: |
      gcloud logging buckets describe $bucket --project=$projectId --location=global --format="json(retentionDays)"

    extractors:
      - type: json
        name: retentionDays
        internal: true
        json:
          - '.retentionDays'

javascript:
  - code: |
        let retentionDays = template.retentionDays
        if (retentionDays < 365) {
          let result = `Bucket '${template.bucket}' in project '${template.projectId}' has insufficient log retention period (${retentionDays} days).`;
          Export(result);
        }

    extractors:
      - type: dsl
        dsl:
          - response
