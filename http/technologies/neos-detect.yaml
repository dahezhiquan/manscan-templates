id: neos-detect

info:
  name: Neos CMS 指纹识别（指纹识别）
  author: k11h-de
  severity: info
  description: >-
    Neos CMS 是内容管理和内容应用平台，用于编辑、发布和管理结构化网站内容。该模板通过请求目标服务并检查预设路径或首页响应、页面正文关键字等指纹特征，判断目标是否使用或暴露了
    Neos CMS 相关组件；命中结果仅表示指纹特征匹配，可用于资产盘点、技术栈识别和后续安全评估，不代表已确认存在可利用漏洞。
  reference:
  - https://github.com/neos/
  classification:
    cwe-id: CWE-200
  metadata:
    max-request: 1
  tags: tech,neos,cms,discovery
http:
  - method: GET
    path:
      - "{{BaseURL}}"

    host-redirects: true
    max-redirects: 2
    matchers:
      - type: word
        words:
          - "This website is powered by Neos"

    extractors:
      - type: kval
        kval:
          - 'x_flow_powered'
