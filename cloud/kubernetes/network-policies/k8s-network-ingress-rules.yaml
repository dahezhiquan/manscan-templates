id: k8s-network-ingress-rules

info:
  name: Define network ingress rules（云安全）
  author: princechaddha
  severity: medium
  description: NetworkPolicy 缺少 ingress 规则时，策略无法明确限制进入 Pod 的来源和端口，容易形成过宽访问面。本模板枚举所有 NetworkPolicy，发现 spec.ingress 为空或缺失时报告。
  impact: |
    - 未经授权的 Pod 或命名空间可能访问敏感服务，增加横向移动和服务枚举风险。
    - 入站访问缺少显式边界会削弱零信任分段和合规证明能力。
  remediation: |
    - 为敏感工作负载配置默认拒绝 ingress，并按来源 Pod、命名空间和端口最小放行。
    - 结合应用拓扑和连接日志验证 NetworkPolicy 未阻断必要流量。
  reference:
    - https://kubernetes.io/docs/concepts/services-networking/network-policies/
  metadata:
    vendor: kubernetes
    product: kubernetes
  tags: cloud,devops,kubernetes,security,k8s-cluster-security
flow: |
  code(1);
  for (let policy of template.items) {
    set("policy", policy)
    javascript(1);
  }

self-contained: true
code:
  - engine:
      - sh
      - bash
    source: kubectl get networkpolicies --all-namespaces --output=json
    extractors:
      - type: json
        name: items
        internal: true
        json:
          - '.items[] | {policy: .metadata.name, ingress: .spec.ingress}'

javascript:
  - code: |
        let policyData = JSON.parse(template.policy);
        if (!policyData.ingress || policyData.ingress.length === 0) {
          let result = `Network policy '${policyData.policy}' does not define any ingress rules.`;
          Export(result);
        }

    extractors:
      - type: dsl
        dsl:
          - response
