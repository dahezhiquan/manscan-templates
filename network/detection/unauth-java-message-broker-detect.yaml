id: unauth-java-message-broker-detect

info:
  name: Java Message Broker 未认证信息泄露（服务漏洞）
  author: matejsmycka
  severity: low
  description: |
    Java Message Broker/Open Message Queue 是用于应用间消息投递、队列和主题通信的中间件服务。若 7676/TCP 在未认证状态下返回 Broker 信息，外部人员可获取集群发现和版本线索。该模板发送换行探测，并通过 `101 imqbroker` 与 `cluster_discovery` 响应确认服务可被未认证访问。
  impact: |
    - 未认证暴露的消息代理可能泄露集群发现信息、产品版本和服务拓扑，为后续弱配置或已知漏洞验证提供依据。
    - 如果队列或管理接口同样缺乏访问控制，攻击者可能进一步影响消息投递、消费链路或依赖该中间件的业务流程。
  remediation: |
    - 限制 7676/TCP 仅对可信应用节点开放，避免将消息代理直接暴露到公网或办公网。
    - 启用认证和授权策略，最小化客户端可访问的队列、主题和集群管理能力。
    - 升级 Open Message Queue/Java Message Service 相关组件，并审计异常连接和集群发现请求。
  metadata:
    verified: true
    shodan-query: product:"Java Message Service"
  tags: network,tcp,jms,openmq,unauth

tcp:
  - inputs:
      - data: "\n"

    host:
      - "{{Hostname}}"
    port: 7676

    matchers:
      - type: word
        words:
          - "101 imqbroker"
          - "cluster_discovery"
        condition: and

    extractors:
      - type: regex
        regex:
          - "imqbroker ([0-9.]+)"
