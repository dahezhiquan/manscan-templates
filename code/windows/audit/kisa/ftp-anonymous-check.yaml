id: ftp-anonymous-check

info:
  name: 匿名 FTP 未禁用（本地基线扫描）
  author: nukunga[SungHyunJeon]
  severity: medium
  description: |
    允许匿名访问会让未认证用户连接并浏览资源。对应基线项为“所有 FTP 站点是否禁用匿名认证”；模板读取 IIS/FTP WebAdministration 配置，检查认证、TLS 或访问控制项是否处于不安全状态。
  impact: |
    - 攻击者可读取公开目录，或在写权限错误时上传恶意文件。
    - 远程入口暴露或协议保护不足会增加暴力破解、中间人攻击和远程控制风险。
  remediation: |
    - 禁用匿名 FTP，仅允许经过身份验证且授权的账户访问。
    - 限制访问来源，优先使用加密和强认证，并关闭无业务需求的远程服务。
  reference:
    - https://isms.kisa.or.kr/main/csap/notice/?boardId=bbs_0000000000000004&mode=view&cntId=85
  tags: ftp,iis,security,code,windows-audit,kisa

self-contained: true

code:
  - pre-condition: |
      IsWindows();
    engine:
      - powershell
      - powershell.exe
    args:
      - -ExecutionPolicy
      - Bypass
    pattern: "*.ps1"
    source: |
      Import-Module WebAdministration -ErrorAction SilentlyContinue
      $ftpSites = Get-ChildItem IIS:\Sites | Where-Object { $_.Bindings.Collection.Protocol -eq "ftp" }
      $vulnerable = $false
      foreach ($site in $ftpSites) {
          $anonAuth = Get-WebConfigurationProperty -pspath "MACHINE/WEBROOT/APPHOST/$($site.Name)" -filter "system.ftpServer/security/authentication/anonymousAuthentication" -name "enabled" -ErrorAction SilentlyContinue
          if ($anonAuth -eq $true) {
              $vulnerable = $true
              break
          }
      }
      if ($vulnerable) {
          "ANONYMOUS_FTP_ENABLED"
      } else {
          "ANONYMOUS_FTP_DISABLED"
      }

    matchers:
      - type: word
        words:
          - "ANONYMOUS_FTP_ENABLED"
