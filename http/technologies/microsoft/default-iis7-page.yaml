id: default-iis7-page

info:
  name: Microsoft IIS 7 默认页面 指纹识别（指纹识别）
  author: dhiyaneshDk
  severity: info
  description: >-
    Microsoft IIS 7 默认页面通常表示 Windows Server Web 服务已安装并保留默认站点内容。该模板通过请求目标服务并检查预设路径或首页响应、页面正文关键字等指纹特征，判断目标是否使用或暴露了
    Microsoft IIS 7 默认页面 相关组件；命中结果仅表示指纹特征匹配，可用于资产盘点、技术栈识别和后续安全评估，不代表已确认存在可利用漏洞。
  classification:
    cpe: cpe:2.3:a:microsoft:iis:*:*:*:*:*:*:*:*
  metadata:
    max-request: 1
    vendor: microsoft
    product: iis
    shodan-query: http.title:"IIS7"
  tags: tech,iis,discovery
http:
  - method: GET
    path:
      - '{{BaseURL}}'

    matchers:
      - type: word
        words:
          - "<title>IIS7</title>"
        part: body

    extractors:
      - type: regex
        name: detected_version
        part: header
        group: 1
        regex:
          - (?mi)^Server:[ \t]*Microsoft-IIS/([0-9]+(?:[.][0-9]+)+(?:[-+._][0-9A-Za-z]+)*)(?:[ \t\r]|$)
        internal: true
      - type: dsl
        dsl:
          - 'regex("^[0-9]+(?:[.][0-9]+)*(?:[-+._][0-9A-Za-z]+)*$", detected_version) ? detected_version : ""'
