id: supermicro-bmc-panel

info:
  name: Supermicro BMC 登录面板识别（暴露面识别）
  author: idealphase
  severity: info
  description: 该模板通过识别 Supermicro BMC 登录入口的页面标题、特征文本或重定向行为，判断目标是否暴露了对应的认证界面。若命中，说明该登录面板对外可访问，可用于暴露面梳理与后续安全评估。
  reference:
    - https://www.supermicro.com/en
    - https://www.supermicro.com/en/solutions/management-software/bmc-resources
    - https://www.supermicro.com/white_paper/IPMI_white_paper.pdf
  classification:
    cvss-metrics: CVSS:3.0/AV:N/AC:L/PR:N/UI:N/S:U/C:N/I:N/A:N
    cwe-id: CWE-200
    cpe: cpe:2.3:h:supermicro:x11ssv-m4f:*:*:*:*:*:*:*:*
  metadata:
    max-request: 1
    shodan-query: http.title:"Supermicro BMC Login"
    google-query: intitle:"Supermicro BMC Login"
    product: x11ssv-m4f
    vendor: supermicro
  tags: panel,supermicro,bmc,discovery

http:
  - method: GET
    path:
      - "{{BaseURL}}"

    matchers-condition: and
    matchers:
      - type: word
        part: body
        words:
          - "<title>Supermicro BMC Login</title>"

      - type: status
        status:
          - 200
