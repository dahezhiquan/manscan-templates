id: rcdevs-webadm-panel

info:
  name: RCDevs WebADM 登录面板识别（指纹识别）
  author: righettod
  severity: info
  description: |-
    RCDevs WebADM 是身份与多因素认证管理平台，用于 LDAP、MFA、SSO 和用户访问策略管理。该模板请求首页、`/webapps/index.php`、`/websrvs/index.php` 等路径，并依据 HTTP 200 状态码、页面标题、正文关键字或品牌资源特征识别目标是否部署了该系统或暴露了对应入口，适用于资产指纹确认；命中结果仅表示系统特征匹配，不代表已确认存在未授权访问或可利用漏洞。
  reference:
  - https://www.rcdevs.com/solutions/
  metadata:
    verified: true
    max-request: 4
    shodan-query: http.html:"WebADM"
  tags: panel,rcdevs,webadm,login,detect,discovery

http:
  - method: GET
    path:
      - '{{BaseURL}}'
      - '{{BaseURL}}/webapps/index.php'
      - '{{BaseURL}}/websrvs/index.php'
      - '{{BaseURL}}/admin/login_uid.php'

    stop-at-first-match: true

    matchers-condition: and
    matchers:
      - type: word
        part: body
        words:
          - 'WebADM'
          - 'RCDevs Security'
          - 'www.rcdevs.com'
        condition: and
        case-insensitive: true

      - type: status
        status:
          - 200

    extractors:
      - type: regex
        part: body
        group: 1
        regex:
          - '(?i)webadm\s+(free|enterprise)\s+edition'
