id: gcloud-service-account-admin-restriction

info:
  name: Restrict Administrator 访问 的Service Accounts（云安全）
  author: princechaddha
  severity: medium
  description: 服务账号或其相关成员持有 Owner、Editor 或管理员类角色时，可能获得远超工作负载所需的项目管理能力。本模板遍历项目 IAM bindings，并用脚本匹配 roles/editor、roles/owner 或名称包含 admin 的角色来发现管理员权限授权。
  impact: |
    - 服务账号凭据或可冒用该服务账号的身份泄露后，攻击者可能直接修改资源、IAM 或安全配置。
    - 管理员权限赋予自动化身份会扩大供应链、CI/CD 和工作负载被攻破后的影响范围。
  remediation: |
    - 移除服务账号相关主体的不必要管理员角色，按任务改授更细粒度的预定义或自定义角色。
    - 对关键自动化身份启用变更审批、密钥禁用或 Workload Identity 等短期凭据机制，并定期复核绑定。
  reference:
    - https://cloud.google.com/iam/docs/understanding-roles
  metadata:
    vendor: google
    product: cloud-iam
  tags: cloud,devops,gcp,gcloud,google-cloud-iam,gcp-cloud-config

flow: |
  code(1)
  for(let projectId of iterate(template.projectIds)){
    set("projectId", projectId)
    code(2)
    for(let binding of iterate(template.bindings)){
      set("binding", binding)
      javascript(1)
    }
  }

self-contained: true

code:
  - engine:
      - sh
      - bash
    source: |
      gcloud projects list --format="json(projectId)"
    extractors:
      - type: json
        name: projectIds
        internal: true
        json:
          - '.[].projectId'

  - engine:
      - sh
      - bash
    source: |
      gcloud projects get-iam-policy $projectId --format=json
    extractors:
      - type: json
        name: bindings
        internal: true
        json:
          - '.bindings[]'

javascript:
  - code: |
        let binding = JSON.parse(template.binding);
        let isAdminRole = ["roles/editor", "roles/owner"].includes(binding.role) || /admin/i.test(binding.role);
        let projectId = template.projectId;
        if (isAdminRole) {
          Export("Service Account with Admin Privileges " + binding.members.join(", ") + " in project " + projectId);
        }

    extractors:
      - type: dsl
        dsl:
          - response
