id: suntrust-phish

info:
  name: SunTrust 仿冒钓鱼网站（钓鱼网站识别）
  author: rxerium
  severity: info
  description: |
    检测到疑似仿冒 SunTrust 的钓鱼网站。模板在目标页面返回 200、页面内容命中 SunTrust 的品牌页面特征，且当前主机不属于 suntrust.com 官方域名时触发，用于识别借用 SunTrust 品牌页面诱导用户信任的仿冒站点。
  reference:
    - https://suntrust.com
  metadata:
    max-request: 1
  tags: phishing,suntrust,bank,osint,discovery
http:
  - method: GET
    path:
      - "{{BaseURL}}"

    host-redirects: true
    max-redirects: 2

    matchers-condition: and
    matchers:
      - type: word
        words:
          - 'SunTrust'
          - 'Sign On'
        condition: and

      - type: status
        status:
          - 200

      - type: dsl
        dsl:
          - '!contains(host,"suntrust.com")'
