id: default-fedora-page

info:
  name: Fedora 默认测试页面 指纹识别（指纹识别）
  author: dhiyaneshDk
  severity: info
  description: Fedora 默认测试页面 是 Linux 发行版默认 Web 测试页面，用于确认 Apache 等服务安装状态。该模板请求首页，并依据页面标题、正文关键字或品牌资源特征识别目标是否使用或暴露了 Fedora 默认测试页面 相关组件，适用于资产盘点、技术栈识别和后续安全评估；命中结果仅表示指纹特征匹配，不代表已确认存在可利用漏洞。
  classification:
    cpe: cpe:2.3:o:fedoraproject:fedora:*:*:*:*:*:*:*:*
  metadata:
    max-request: 1
    vendor: fedoraproject
    product: fedora
    shodan-query: http.title:"Test Page for the HTTP Server on Fedora"
  tags: tech,fedora,discovery

http:
  - method: GET
    path:
      - '{{BaseURL}}'

    matchers:
      - type: word
        words:
          - '<title>Test Page for the HTTP Server on Fedora</title>'
        part: body
