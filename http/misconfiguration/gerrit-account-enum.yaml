id: gerrit-account-enum

info:
  name: Gerrit Code Review Account 枚举
  author: DhiyaneshDk
  severity: medium
  description: |
    检测到 Gerrit Code Review Account 枚举。目标响应或文件中可能暴露配置、凭据、密钥、令牌、环境变量或历史记录等敏感信息，可能被用于进一步入侵。
  reference:
    - https://gerrit-review.googlesource.com/Documentation/rest-api-accounts.html
    - https://gerrit-documentation.storage.googleapis.com/Documentation/2.11/rest-api-accounts.html
  metadata:
    max-request: 2
    verified: true
    shodan-query: title:"Gerrit Code Review"
    fofa-query: title="Gerrit Code Review"
  tags: gerrit,enum,exposure,misconfig

http:
  - method: GET
    path:
      - "{{BaseURL}}/accounts/?q=a&n=10"
      - "{{BaseURL}}/accounts/?suggest&q=a&n=10"

    stop-at-first-match: true

    matchers-condition: and
    matchers:
      - type: word
        part: body
        words:
          - "_account_id"
          - "username"
        condition: and

      - type: status
        status:
          - 200

    extractors:
      - type: regex
        name: usernames
        part: body
        group: 1
        regex:
          - '"username":\s*"([^"]+)"'
