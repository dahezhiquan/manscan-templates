id: remote-desktop-enabled-non-server

info:
  name: 非服务器系统启用远程桌面（本地基线扫描）
  author: princechaddha
  severity: high
  description: |
    该模板检查工作站等非服务器版本是否启用远程桌面。无必要启用会扩大远程登录攻击面。
  impact: |
    攻击者可针对终端发起 RDP 爆破或利用漏洞获得访问。
  remediation: |
    在非服务器系统上禁用不需要的远程桌面，并通过集中管理工具替代。
  tags: windows,remote-desktop,network,code,windows-audit

self-contained: true

code:
  - pre-condition: |
      IsWindows();
    engine:
      - powershell
      - powershell.exe
    args:
      - -ExecutionPolicy
      - Bypass
    pattern: "*.ps1"
    source: |
      Get-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server' -Name 'fDenyTSConnections'

    matchers:
      - type: word
        words:
          - "0"
