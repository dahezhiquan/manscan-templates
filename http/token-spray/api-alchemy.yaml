id: api-alchemy

info:
  name: Alchemy API Token 可用性校验（token喷洒）
  author: daffainfo
  severity: high
  description: |-
    平台介绍：Alchemy API 是面向加密资产、区块链节点、行情或汇率数据的服务平台，常用于查询链上数据、交易市场、账户余额、货币价格或金融数据。该模板用于校验提交的 Alchemy API Token 是否仍然有效。检测逻辑会向 `eth-mainnet.alchemyapi.io/v2/{{token}}` 发起低影响 API 请求，通过请求中的 Token 参数传递 `{{token}}`，并依据响应中的 `"id":`、`"result":` 判断凭据是否可用；命中通常表示该 Token 可被继续调用对应平台能力。
  reference:
    - https://docs.alchemy.com/alchemy/
    - https://github.com/daffainfo/all-about-apikey/tree/main/alchemy
  metadata:
    max-request: 1
  tags: token-spray,alchemy
  impact: |-
    - 攻击者可访问行情、链上查询、钱包、节点或账户相关数据，并消耗 API 配额。
    - 若 Token 绑定交易或托管能力，可能进一步造成资产操作风险或业务数据泄露。
  remediation: |-
    - 立即撤销或轮换已暴露的 API Token，并确认旧 Token 不再可用。
    - 按最小权限原则重新签发凭据，限制作用域、来源地址、项目范围和有效期。
    - 在代码仓库、CI/CD、日志和配置文件中排查泄露来源，避免 Token 再次提交或外传。
self-contained: true

http:
  - method: POST
    path:
      - "https://eth-mainnet.alchemyapi.io/v2/{{token}}"

    body: '{"jsonrpc":"2.0","method":"eth_blockNumber","params":[],"id":0}'
    matchers:
      - type: word
        part: body
        words:
          - '"id":'
          - '"result":'
        condition: and
