id: azure-phish

info:
  name: Microsoft Azure 仿冒钓鱼网站（钓鱼网站识别）
  author: rxerium
  severity: info
  description: |
    检测到疑似仿冒 Microsoft Azure 的钓鱼网站。模板在目标页面返回 200、页面内容命中 Microsoft Azure 的官方服务页面特征，且当前主机不属于 azure.com、microsoft.com 官方域名时触发，用于识别借用 Microsoft Azure 品牌页面诱导用户信任的仿冒站点。
  reference:
    - https://azure.microsoft.com
  metadata:
    max-request: 1
  tags: phishing,azure,microsoft,cloud,osint,discovery
http:
  - method: GET
    path:
      - "{{BaseURL}}"

    host-redirects: true
    max-redirects: 2

    matchers-condition: and
    matchers:
      - type: word
        words:
          - 'Invent with purpose, realize cost savings, and make your organization more efficient with Microsoft Azure’s open and flexible cloud computing platform.'

      - type: status
        status:
          - 200

      - type: dsl
        dsl:
          - '!contains(host,"azure.com")'
          - '!contains(host,"microsoft.com")'
