id: helicone-panel

info:
  name: Helicone 面板 - 检测（暴露面识别）
  author: rxerium
  severity: info
  description: |-
    检测到 Helicone，这是一款开源 LLM 可观测性平台，为 LLM 应用提供日志记录、监控与分析功能，通常通过 Docker 自托管部署。发现了一个暴露在外、未经认证的 Helicone Web 仪表盘实例。
  reference:
    - https://github.com/Helicone/helicone
    - https://helicone.ai
  metadata:
    verified: true
    max-request: 1
    vendor: helicone
    product: helicone
    shodan-query: 'http.title:"Helicone"'
  tags: panel,helicone,llm,ai,observability,detect,discovery

http:
  - method: GET
    path:
      - "{{BaseURL}}"

    host-redirects: true
    max-redirects: 2

    matchers-condition: and
    matchers:
      - type: word
        part: body
        words:
          - "Helicone - Open-Source Generative AI Platform for Developers"

      - type: status
        status:
          - 200
