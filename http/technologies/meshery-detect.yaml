id: meshery-detect

info:
  name: Meshery 指纹识别（指纹识别）
  author: righettod
  severity: info
  description: |
    用于识别目标是否部署 Meshery 并提取相关版本或构建信息，模板会结合页面标题、页面正文、特定路径或已知端点和版本或标识提取结果进行指纹匹配。
  reference:
    - https://github.com/meshery/meshery
    - https://meshery.io/
  metadata:
    verified: true
    max-request: 1
    vendor: meshery
    product: meshery
    shodan-query: http.title:"Meshery"
    fofa-query: title="Meshery"
  tags: tech,meshery,detect,discovery

http:
  - method: GET
    path:
      - "{{BaseURL}}/api/providers"

    matchers:
      - type: dsl
        dsl:
          - 'status_code == 200'
          - 'contains_all(to_lower(body), "persist-meshery-", "ismesheryuirestricted")'
        condition: and

    extractors:
      - type: regex
        part: body
        group: 1
        regex:
          - '(?i)"package_version":\s*"([a-z0-9.]+)"'
