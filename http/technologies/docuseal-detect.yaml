id: docuseal-detect

info:
  name: DocuSeal 识别（指纹识别）
  author: ChrisJr404
  severity: info
  description: |-
    通过在根页面暴露的应用主题属性和站点元数据，识别出 DocuSeal——一款开源的文档填写与签署平台。
  reference:
    - https://github.com/docusealco/docuseal
    - https://www.docuseal.com
  metadata:
    verified: true
    max-request: 1
    vendor: docusealco
    product: docuseal
    shodan-query: http.html:"data-theme=\"docuseal\""
  tags: tech,docuseal,signing,detect,discovery

http:
  - method: GET
    path:
      - "{{BaseURL}}"

    matchers-condition: and
    matchers:
      - type: word
        part: body
        words:
          - 'data-theme="docuseal"'
          - 'og:site_name" content="DocuSeal"'
        condition: and

      - type: status
        status:
          - 200
