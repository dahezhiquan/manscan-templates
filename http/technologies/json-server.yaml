id: json-server

info:
  name: json-server 指纹识别（指纹识别）
  author: DhiyaneshDK
  severity: info
  description: >-
    json-server 是开发测试工具，可根据 JSON 文件快速提供 REST API 原型服务。该模板通过请求目标服务并检查预设路径或首页响应、页面正文关键字、状态码等指纹特征，判断目标是否使用或暴露了
    json-server 相关组件；命中结果仅表示指纹特征匹配，可用于资产盘点、技术栈识别和后续安全评估，不代表已确认存在可利用漏洞。
  reference:
  - https://www.exploit-db.com/ghdb/4550
  metadata:
    verified: true
    max-request: 1
    shodan-query: title:"JSON Server"
  tags: exposure,devops,tech,discovery
http:
  - method: GET
    path:
      - "{{BaseURL}}"

    matchers-condition: and
    matchers:
      - type: word
        part: body
        words:
          - "<title>JSON Server</title>"

      - type: status
        status:
          - 200
