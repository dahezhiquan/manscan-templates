id: unleash-panel

info:
  name: Unleash 登录面板识别（指纹识别）
  author: userdehghani
  severity: info
  description: |-
    Unleash 是功能开关管理平台，用于发布控制、灰度策略、环境和项目配置。该模板请求 `/login`、`/sign-in`、`/favicon.ico`，并依据 favicon 哈希、页面标题、正文关键字或品牌资源特征、DSL 条件识别目标是否部署了该系统或暴露了对应入口，适用于资产指纹确认；命中结果仅表示系统特征匹配，不代表已确认存在未授权访问或可利用漏洞。
  reference:
  - https://www.getunleash.io/
  metadata:
    verified: true
    max-request: 3
    shodan-query: http.favicon.hash:-608690655
  tags: panel,unleash,login,detect,discovery

http:
  - method: GET
    path:
      - "{{BaseURL}}/login"
      - "{{BaseURL}}/sign-in"
      - "{{BaseURL}}/favicon.ico"

    stop-at-first-match: true
    matchers-condition: or
    matchers:
      - type: word
        part: body
        words:
          - '<title>Unleash'
          - 'content="unleash'
          - 'alt="getunleash'
          - 'Sign-in - Unleash hosted'
        case-insensitive: true
        condition: or

      - type: dsl
        dsl:
          - "status_code==200 && (\"-608690655\" == mmh3(base64_py(body)))"
