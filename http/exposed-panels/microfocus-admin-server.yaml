id: microfocus-admin-server

info:
  name: Micro Focus Enterprise Server Admin 面板识别（指纹识别）
  author: theabhinavgaur,righettod
  severity: info
  description: |-
    检测到目标站点存在 Micro Focus Enterprise Server Admin 相关响应特征。Micro Focus Enterprise Server Admin 是 AI、机器学习或 Notebook 相关平台，用于管理模型、数据集、工作区、实验、推理服务或训练任务。模板请求 `/`、`/nps/servlet/portalservice`、`/nds` 等路径，并通过页面标题或正文关键字、状态码、DSL 条件确认该系统指纹，用于资产识别、系统盘点和暴露面梳理。
  classification:
    cvss-metrics: CVSS:3.0/AV:N/AC:L/PR:N/UI:N/S:U/C:N/I:N/A:N
    cwe-id: CWE-200
    cpe: cpe:2.3:a:microfocus:enterprise_server:*:*:*:*:*:*:*:*
  metadata:
    verified: true
    max-request: 4
    vendor: microfocus
    product: "enterprise_server"
    shodan-query:
      - "Micro Focus DSD"
      - micro focus dsd
  tags: panel,microfocus,detect,login,discovery
http:
  - method: GET
    path:
      - "{{BaseURL}}"
      - "{{BaseURL}}/nps/servlet/portalservice"
      - "{{BaseURL}}/nds"
      - "{{BaseURL}}/_LOGIN_SERVER_"

    stop-at-first-match: true

    redirects: true
    max-redirects: 2

    matchers:
      - type: dsl
        dsl:
          - 'status_code == 200 && contains(to_lower(header), "micro focus dsd")'
          - 'status_code == 200 && contains_any(to_lower(body), "micro focus imanager", "micro focus imonitor", "micro focus remote manager", "micro focus open enterprise server")'
        condition: or

    extractors:
      - type: regex
        part: body
        group: 1
        regex:
          - '(?i)Micro\s+Focus\s+Open\s+Enterprise\s+Server\s+([A-Z0-9\s]+)'
          - '(?i)Copyright\s+([0-9]+)\s+Micro\s+Focus'
