id: sage-panel

info:
  name: Sage X3 登录面板识别（暴露面识别）
  author: pikpikcu,daffainfo
  severity: info
  description: 该模板通过识别 Sage X3 登录入口的页面标题、特征文本或重定向行为，判断目标是否暴露了对应的认证界面。若命中，说明该登录面板对外可访问，可用于暴露面梳理与后续安全评估。
  classification:
    cvss-metrics: CVSS:3.0/AV:N/AC:L/PR:N/UI:N/S:U/C:N/I:N/A:N
    cwe-id: CWE-200
    cpe: cpe:2.3:a:sage:x3:*:*:*:*:*:*:*:*
  metadata:
    max-request: 1
    vendor: sage
    product: x3
    shodan-query:
      - http.title:"Sage X3"
      - http.title:"sage x3"
    fofa-query: title="sage x3"
    google-query: intitle:"sage x3"
  tags: panel,sage,login,discovery

http:
  - method: GET
    path:
      - "{{BaseURL}}/auth/login/page"

    matchers-condition: and
    matchers:
      - type: word
        part: body
        words:
          - "<title>Sage  X3</title>"
          - "'/auth/sage-id/registerStart'"
        condition: and

      - type: status
        status:
          - 200
