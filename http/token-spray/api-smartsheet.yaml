id: api-smartsheet

info:
  name: Smartsheet API Token 可用性校验（token喷洒）
  author: daffainfo
  severity: info
  description: 该模板通过调用 Smartsheet API 的已知接口验证提供的 token 是否有效，命中后通常表示可访问协作、任务或项目管理能力。
  reference:
    - https://smartsheet.redoc.ly/
    - https://github.com/daffainfo/all-about-apikey/tree/main/smartsheet
  metadata:
    max-request: 1
  tags: token-spray,smartsheet

self-contained: true

http:
  - method: GET
    path:
      - "https://api.smartsheet.com/2.0/home?include=source"

    headers:
      Authorization: Bearer {{token}}

    matchers-condition: and
    matchers:
      - type: status
        status:
          - 200

      - type: word
        part: body
        words:
          - '"sheets":'
          - '"folders":'
        condition: and
