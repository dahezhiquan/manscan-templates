id: bubble-detect

info:
  name: Bubble 指纹识别（指纹识别）
  author: johnk3r
  severity: info
  description: |-
    Bubble 是无代码 Web 应用构建平台，用于构建业务应用、页面和数据工作流。该模板请求首页，并依据 DSL 条件识别目标是否使用或暴露了 Bubble 相关组件，适用于资产盘点、技术栈识别和后续安全评估；命中结果仅表示指纹特征匹配，不代表已确认存在可利用漏洞。
  reference:
  - https://bubble.io/
  metadata:
    verified: true
    max-request: 1
    vendor: bubble
    product: bubble
    shodan-query: X-Bubble-Perf
    fofa-query: header="X-Bubble"
  tags: tech,bubble,detect

http:
  - method: GET
    path:
      - "{{BaseURL}}"

    host-redirects: true
    max-redirects: 2

    matchers:
      - type: dsl
        dsl:
          - 'status_code == 200'
          - 'contains_any(to_lower(header), "x-bubble-", "__bubble") || contains_any(body, "bubble.io", "bubbleapps.io")'
        condition: and
