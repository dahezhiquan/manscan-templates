id: snapcomms-panel

info:
  name: SnapComms Content Manager 登录面板识别（指纹识别）
  author: righettod
  severity: info
  description: |-
    SnapComms Content Manager 是企业内部通信平台，用于发布通知、弹窗、调查和员工消息管理。该模板请求 `/Manager/`，并依据 HTTP 200 状态码、页面标题、正文关键字或品牌资源特征识别目标是否部署了该系统或暴露了对应入口，适用于资产指纹确认；命中结果仅表示系统特征匹配，不代表已确认存在未授权访问或可利用漏洞。
  reference:
  - https://www.snapcomms.com/
  metadata:
    verified: true
    max-request: 1
  tags: panel,snapcomms,login,detect,discovery

http:
  - method: GET
    path:
      - '{{BaseURL}}/Manager/'

    matchers-condition: and
    matchers:
      - type: word
        part: body
        words:
          - '<title>SnapComms Content Manager</title>'

      - type: status
        status:
          - 200

    extractors:
      - type: regex
        part: body
        group: 1
        regex:
          - 'version=([0-9.]+)'
