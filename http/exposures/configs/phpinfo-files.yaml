id: phpinfo-files

info:
  name: PHPinfo页面暴露（暴露面识别）
  author: pdteam,daffainfo,meme-lord,dhiyaneshDK,wabafet,mastercho
  severity: low
  description: |
    检测到目标站点可直接访问 PHPinfo页面。PHPinfo 页面展示 PHP 运行环境、模块、路径、变量和服务器配置。该模板请求 `{{paths}}`，并通过 HTTP 状态码、响应正文关键字、文件格式特征、正则匹配或响应头进行确认。此类资源公开后可能泄露部署细节、内部路径、依赖版本、环境变量、访问凭据或调试信息，增加被侦察和后续利用的风险。
  impact: |-
    - 状态、调试或指标页面可能泄露组件版本、模块清单、环境变量、内部路径、主机名和服务依赖关系。
    - 攻击者可利用这些信息筛选匹配漏洞、识别弱配置，并规划更精确的后续攻击路径。
    - 部分调试页面还可能暴露请求变量或运行参数，增加敏感信息泄露范围。
  remediation: |-
    - 关闭生产环境中的调试、状态、phpinfo、printenv、探针和未受保护的 metrics 页面。
    - 仅在内网、运维 VPN 或监控系统来源地址中开放必要的观测端点，并启用鉴权。
    - 清理页面中暴露的环境变量、内部路径、主机名、版本信息和调试参数。
    - 复核相关组件版本和配置，修复因暴露信息指向的弱配置或已知漏洞。
  classification:
    cwe-id: CWE-200
  metadata:
    max-request: 25
  tags: config,exposure,phpinfo,vuln

http:
  - method: GET
    path:
      - "{{BaseURL}}{{paths}}"
    payloads:
      paths:
        - "/php.php"
        - "/php2.php"
        - "/phpinfo.php"
        - "/info.php"
        - "/infophp.php"
        - "/php_info.php"
        - "/test.php"
        - "/i.php"
        - "/a.php"
        - "/p.php"
        - "/pi.php"
        - "/asdf.php"
        - "/pinfo.php"
        - "/phpversion.php"
        - "/time.php"
        - "/inf0.php"
        - "/index.php"
        - "/temp.php"
        - "/old_phpinfo.php"
        - "/infos.php"
        - "/linusadmin-phpinfo.php"
        - "/php-info.php"
        - "/dashboard/phpinfo.php"
        - "/_profiler/phpinfo.php"
        - "/_profiler/phpinfo"
        - "/?phpinfo=1"
        - "/l.php?act=phpinfo"
        - "/testxx.php"

    stop-at-first-match: true

    matchers-condition: and
    matchers:
      - type: word
        part: body
        words:
          - "PHP Extension"
          - "PHP Version"
        condition: and

      - type: status
        status:
          - 200

    extractors:
      - type: regex
        part: body
        group: 1
        regex:
          - '>PHP Version <\/td><td class="v">([0-9.]+)'
