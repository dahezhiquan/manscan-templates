id: easyscripts-installer

info:
  name: Easyscripts 安装向导
  author: theamanrawat
  severity: high
  description: |
    检测到 Easyscripts 安装向导。该页面属于安装、初始化或配置向导流程，若对外暴露，攻击者可能完成初始化、创建管理员账户或重新配置目标系统。
  metadata:
    verified: true
    max-request: 1
    shodan-query: http.title:"Installer - Easyscripts"
  tags: misconfig,easyscripts,installer,vuln

http:
  - method: GET
    path:
      - '{{BaseURL}}'

    matchers-condition: and
    matchers:
      - type: word
        part: body
        words:
          - 'Installer - Easyscripts'

      - type: status
        status:
          - 200
