id: drupal7-elfinder-rce

info:
  name: Drupal 7 Elfinder - 远程代码执行漏洞
  author: 1337kro
  severity: critical
  description: Drupal 7 Elfinder - 远程代码执行 存在文件上传相关安全问题。若上传点校验不足，攻击者可能上传恶意脚本或构造危险文件，进而实现远程控制或数据篡改。
  reference:
    - https://github.com/Kro0oz/drupal-7-elfinder
  remediation: |
    - 尽快升级受影响组件并移除危险功能、调试接口或可被外部调用的执行链路。
    - 结合主机侧日志、计划任务和 Web 根目录文件进行排查，确认是否已被植入后门或执行恶意命令。
  classification:
    cvss-metrics: CVSS:3.1/AV:N/AC:L/PR:N/UI:N/S:U/C:H/I:H/A:H
    cvss-score: 9.8
    cwe-id: CWE-434
  metadata:
    verified: true
    fofa-query: app="drupal"
    product: Drupal
    vendor: Drupal
  tags: drupal,elfinder,filemanager,exposure,vuln

http:
  - method: GET
    path:
      - "{{BaseURL}}/sites/all/libraries/elfinder/connectors/php/connector.php"

    matchers-condition: and
    matchers:
      - type: word
        part: body
        words:
          - '{"cwd":'

      - type: word
        part: content_type
        words:
          - 'application/json'

      - type: status
        status:
          - 200
