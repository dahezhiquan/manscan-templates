id: private-key-exposure

info:
  name: 私钥暴露 helper 检测or
  author: aashiq
  severity: high
  description: |
    检测到 私钥暴露 helper 检测or。目标响应或文件中可能暴露配置、凭据、密钥、令牌、环境变量或历史记录等敏感信息，可能被用于进一步入侵。
  metadata:
    max-request: 1
  tags: exposure,node,misconfig,vuln

http:
  - method: GET
    path:
      - "{{BaseURL}}/node_modules/mqtt/test/helpers/"

    matchers-condition: and
    matchers:
      - type: status
        status:
          - 200

      - type: word
        words:
          - "Index of /node_modules/mqtt/test/helpers"
          - "Parent Directory"
        condition: and
