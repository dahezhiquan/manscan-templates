id: olt-web-interface

info:
  name: OLT Web Management Interface 登录面板识别（暴露面识别）
  author: DhiyaneshDk
  severity: info
  description: 该模板通过识别 OLT Web Management Interface 登录入口的页面标题、特征文本或重定向行为，判断目标是否暴露了对应的认证界面。若命中，说明该登录面板对外可访问，可用于暴露面梳理与后续安全评估。
  reference:
    - https://www.exploit-db.com/ghdb/8020
  classification:
    cvss-metrics: CVSS:3.0/AV:N/AC:L/PR:N/UI:N/S:U/C:N/I:N/A:N
    cwe-id: CWE-200
  metadata:
    verified: true
    max-request: 1
    shodan-query: title:"OLT Web Management Interface"
  tags: edb,panel,olt,discovery

http:
  - method: GET
    path:
      - "{{BaseURL}}/action/login.html"

    matchers-condition: and
    matchers:
      - type: word
        words:
          - "OLT Web Management Interface"

      - type: word
        part: header
        words:
          - "text/html"

      - type: status
        status:
          - 200
