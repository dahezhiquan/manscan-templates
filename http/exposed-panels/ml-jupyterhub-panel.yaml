id: ml-jupyterhub-panel

info:
  name: JupyterHub 面板识别（指纹识别）
  author: rxerium
  severity: info
  description: |-
    检测到目标站点存在 JupyterHub 相关响应特征。JupyterHub 是 AI、机器学习或 Notebook 相关平台，用于管理模型、数据集、工作区、实验、推理服务或训练任务。模板请求 `/hub/login`，并通过状态码、正则特征确认该系统指纹，用于资产识别、系统盘点和暴露面梳理。
  reference:
    - https://github.com/jupyterhub/jupyterhub
    - https://jupyter.org/hub
  metadata:
    verified: true
    max-request: 1
    vendor: jupyter
    product: jupyterhub
    shodan-query: 'http.title:"JupyterHub"'
  tags: panel,jupyterhub,jupyter,ml,ai,detect,discovery
http:
  - method: GET
    path:
      - "{{BaseURL}}/hub/login"

    host-redirects: true
    max-redirects: 2

    matchers-condition: and
    matchers:
      - type: regex
        part: body
        regex:
          - '(?i)<title>[^<]*JupyterHub[^<]*</title>'

      - type: status
        status:
          - 200
