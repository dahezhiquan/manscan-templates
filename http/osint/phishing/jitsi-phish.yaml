id: jitsi-phish

info:
  name: Jitsi 仿冒钓鱼网站（钓鱼网站识别）
  author: rxerium
  severity: info
  description: |
    检测到疑似仿冒 Jitsi 的钓鱼网站。模板在目标页面返回 200、页面内容命中 Jitsi 的品牌页面特征，且当前主机不属于 jitsi.org、meet.jit.si 官方域名时触发，用于识别借用 Jitsi 品牌页面诱导用户信任的仿冒站点。
  reference:
    - https://jitsi.org
  metadata:
    max-request: 1
  tags: phishing,jitsi,video,communication,osint,discovery
http:
  - method: GET
    path:
      - "{{BaseURL}}"

    host-redirects: true
    max-redirects: 2

    matchers-condition: and
    matchers:
      - type: word
        words:
          - '<title>Free Video Conferencing Software for Web &amp; Mobile | Jitsi'

      - type: status
        status:
          - 200

      - type: dsl
        dsl:
          - '!contains(host,"jitsi.org")'
          - '!contains(host,"meet.jit.si")'
