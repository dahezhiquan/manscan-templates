id: gabia-server-detect

info:
  name: Gabia 服务器指纹识别（指纹识别）
  author: jadu101
  severity: info
  description: |
    用于识别目标是否部署 Gabia 服务器 并提取相关版本或构建信息，模板会结合 HTTP 响应头、状态码、特定路径或已知端点和版本或标识提取结果进行指纹匹配。
  metadata:
    verified: true
    max-request: 1
    shodan-query: "Server: gabia"
  tags: tech,gabia,detect,discovery

http:
  - method: GET
    path:
      - "{{BaseURL}}"

    matchers-condition: and
    matchers:
      - type: regex
        part: header
        regex:
          - "Server: gabia"

      - type: status
        status:
          - 200

    extractors:
      - type: kval
        part: header
        kval:
          - Server
