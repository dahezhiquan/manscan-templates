id: bmo-phish

info:
  name: BMO 仿冒钓鱼网站（钓鱼网站识别）
  author: rxerium
  severity: info
  description: |
    检测到疑似仿冒 BMO 的钓鱼网站。模板在目标页面返回 200、页面内容命中 BMO 的登录或账号页面特征，且当前主机不属于 bmo.com 官方域名时触发，用于识别借用 BMO 品牌页面诱导用户信任的仿冒站点。
  reference:
    - https://bmo.com
  metadata:
    max-request: 1
  tags: phishing,bmo,bank,osint,discovery
http:
  - method: GET
    path:
      - "{{BaseURL}}"

    host-redirects: true
    max-redirects: 2

    matchers-condition: and
    matchers:
      - type: word
        words:
          - 'BMO'
          - "We're here to help! BMO offers a wide range of personal and business banking services, including bank accounts, mortgages, credit cards, loans and more."
        condition: and

      - type: status
        status:
          - 200

      - type: dsl
        dsl:
          - '!contains(host,"bmo.com")'
