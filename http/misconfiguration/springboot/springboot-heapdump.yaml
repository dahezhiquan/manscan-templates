id: springboot-heapdump

info:
  name: Spring Boot Actuator 堆转储暴露
  author: that_juan_,dwisiswant0,wdahlenb
  severity: critical
  description: |-
    该模板用于核查 Spring Boot Actuator 堆转储端点是否对外暴露。Actuator 是 Spring Boot 的运维监控能力，错误配置会让本应受保护的运行状态、日志、指标或内部结构被匿名访问。模板访问 heapdump、actuator/heapdump，并根据响应中的 HPROF/JAVA PROFILE 文件头或 gzip 堆转储特征以及 JSON/Actuator Content-Type 判断端点是否可访问。
  reference:
    - https://github.com/pyn3rd/Spring-Boot-Vulnerability
  metadata:
    max-request: 24
  tags: springboot,exposure,misconfig,vuln
  impact: |-
    - 堆转储可能包含访问令牌、数据库连接串、用户数据、会话对象和业务敏感内容。
    - 攻击者可离线分析内存对象，进一步提取凭据、密钥或代码执行所需的上下文信息。
  remediation: |-
    - 仅暴露业务必需的 Actuator 端点，避免在生产环境开放敏感端点。
    - 为 Actuator 增加认证授权、管理端口隔离、来源 IP 限制和访问审计。
    - 通过 `management.endpoints.web.exposure.include`/`exclude`、Spring Security 或网关策略收敛公开端点。
variables:
  str: "{{rand_base(6)}}"

http:
  - raw:
      - |
        GET /{{str}} HTTP/1.1
        Host: {{Hostname}}

      - |
        GET /{{path}} HTTP/1.1
        Host: {{Hostname}}

    payloads:
      path:
        - heapdump
        - actuator/heapdump
        - bbo-admin/heapdump
        - bbo-admin/actuator/heapdump
        - bbo-rest/heapdump
        - bbo-rest/actuator/heapdump
        - bbo-search/heapdump
        - bbo-search/actuator/heapdump
        - bbo-token/heapdump
        - bbo-token/actuator/heapdump
        - bbo-vin/heapdump
        - bbo-vin/actuator/heapdump

    attack: batteringram
    stop-at-first-match: true

    max-size: 2097152

    matchers-condition: or
    matchers:
      - type: dsl
        dsl:
          - "!contains(hex_encode(body_1), '1f8b080000000000')"
          - "contains(hex_encode(body_2), '1f8b080000000000')"
        condition: and

      - type: dsl
        dsl:
          - "contains(hex_encode(body_2), '4a4156412050524f46494c45')"
          - "contains(hex_encode(body_2), '4850524f46')"
        condition: or
