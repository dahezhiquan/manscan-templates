id: aspx-debug-mode

info:
  name: ASP.NET 调试 启用
  author: dhiyaneshDk
  severity: medium
  description: |
    该模板用于核查 ASP.NET 调试启用状态。该类问题通常源于生产环境暴露调试页面、诊断端点、状态接口或详细错误信息。模板会向目标发送探测请求，并依据响应状态、关键字、响应头或 DSL 条件等证据确认目标是否存在该配置问题。
  impact: |
    - 攻击者可获取服务版本、运行状态、内部路径、模块列表、环境变量或错误栈信息。
    - 这些信息可辅助识别组件版本、构造后续攻击路径，或暴露内部系统结构与敏感配置线索。
  remediation: |
    - 关闭生产环境中的调试、状态、示例和诊断接口，避免向未授权用户返回内部细节。
    - 对确需保留的运维端点增加认证授权、来源限制和访问审计。
    - 检查历史访问日志和错误日志，确认敏感信息是否已被枚举或泄露。
  reference:
    - https://portswigger.net/kb/issues/00100800_asp-net-debugging-enabled
  metadata:
    max-request: 1
  tags: debug,misconfig,vuln

http:
  - raw:
      - |
        DEBUG /Foobar-debug.aspx HTTP/1.1
        Host: {{Hostname}}
        Command: stop-debug
        Accept: text/html,application/xhtml+xml,application/xml;q=0.9,*/*;q=0.8
        Content-Length: 2

    matchers:
      - type: dsl
        dsl:
          - 'len(body) == 2'
          - 'regex("^OK$", body)'
          - 'status_code == 200'
        condition: and
