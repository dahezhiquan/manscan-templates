id: amprion-gridloss-panel

info:
  name: Amprion Grid Loss 登录面板识别（指纹识别）
  author: righettod
  severity: info
  description: |-
    检测到目标站点存在 Amprion Grid Loss 相关响应特征。Amprion Grid Loss 是监控、日志、分析或仪表盘系统，用于展示运行指标、访问统计、日志事件和服务状态。模板请求 `/config/public`，并通过页面标题或正文关键字、状态码、DSL 条件确认该系统指纹，用于资产识别、系统盘点和暴露面梳理。
  reference:
    - https://www.amprion.net/index-2.html
  metadata:
    verified: true
    max-request: 1
  tags: panel,amprion,login,detect,discovery
http:
  - method: GET
    path:
      - "{{BaseURL}}/config/public"

    matchers:
      - type: dsl
        dsl:
          - 'status_code == 200'
          - 'contains(to_lower(body), "amprion") && contains(to_lower(body), "grid loss")'
        condition: and

    extractors:
      - type: regex
        part: body
        group: 1
        regex:
          - '"envTitle":"([A-Z0-9a-z]+)"'
