id: gcloud-bucket-website-config-not-defined

info:
  name: Define Index Page Suffix and Error Page 的Bucket Website Configuration（云安全）
  author: princechaddha
  severity: high
  description: 用于托管静态网站的 Cloud Storage bucket 需要明确 index page suffix 和 error page，否则可能出现错误响应不一致或对象路径暴露。本模板枚举 bucket 并执行 gsutil web get，返回 has no website configuration 时报告静态网站配置缺失。
  impact: |
    - 公开网站 bucket 缺少标准错误页和首页配置时，用户可能看到不一致错误信息或对象结构线索。
    - 对外站点配置不完整会增加运维误判和内容暴露风险。
  remediation: |
    - 对用于静态网站托管的 bucket 配置 index page suffix 和 error page。
    - 如果 bucket 不应托管网站，移除公开访问和网站用途配置，改为受控访问。
  reference:
    - https://cloud.google.com/storage/docs/hosting-static-website
  metadata:
    vendor: google
    product: cloud-storage
  tags: cloud,devops,gcp,gcloud,google-cloud-storage,website-config,static-website,gcp-cloud-config

flow: |
  code(1)
  for(let projectId of iterate(template.projectIds)){
    set("projectId", projectId)
    code(2)
    for(let bucketName of iterate(template.buckets)){
      set("bucketName", bucketName)
      code(3)
    }
  }

self-contained: true

code:
  - engine:
      - sh
      - bash
    source: |
      gcloud projects list --format="json(projectId)"

    extractors:
      - type: json
        name: projectIds
        internal: true
        json:
          - '.[].projectId'

  - engine:
      - sh
      - bash
    source: |
      gsutil ls -p $projectId | jq -R . | jq -s .

    extractors:
      - type: json
        name: buckets
        internal: true
        json:
          - '.[]'

  - engine:
      - sh
      - bash
    source: |
      gsutil web get $bucketName

    matchers:
      - type: word
        words:
          - 'has no website configuration'

    extractors:
      - type: dsl
        dsl:
          - '"The bucket " + bucketName + " in project " + projectId + " does not have a valid static website configuration with both index page suffix and error page defined"'
