id: bun-lock

info:
  name: Bun Lock 文件泄露（暴露面识别）
  author: noraj
  severity: info
  description: |
    检测到对外可访问的 Bun Lock 文件。相关文件可能泄露项目结构、依赖关系、部署细节、敏感参数或其他不应公开的内部信息。
  reference:
    - https://bun.sh/docs/install/lockfile
  metadata:
    verified: true
    max-request: 1
    fofa-query: body=="bun.lockb"
  tags: exposure,files,node,npm,bun,vuln

http:
  - method: GET
    path:
      - "{{BaseURL}}/bun.lockb"

    matchers-condition: and
    matchers:
      - type: word
        part: body
        words:
          - "bun-lockfile-format-v0"
          - "#!/usr/bin/env bun"
        condition: or

      - type: word
        part: header
        words:
          - "application/octet-stream"

      - type: status
        status:
          - 200
