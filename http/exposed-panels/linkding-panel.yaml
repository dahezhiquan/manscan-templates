id: linkding-panel

info:
  name: Linkding 面板 - 检测（指纹识别）
  author: ChrisJr404
  severity: info
  description: |-
    linkding（github.com/sissbruecker/linkding）是一款基于 Django 构建的流行开源自托管书签管理器。默认 Docker 端口为 9090。暴露的实例可能泄露用户保存的书签、标签及归档页面。
  reference:
    - https://github.com/sissbruecker/linkding
    - https://linkding.link/
  metadata:
    verified: false
    max-request: 2
    vendor: sissbruecker
    product: linkding
    shodan-query: http.title:"Linkding"
    fofa-query: title="Linkding"
  tags: panel,linkding,bookmarks,selfhosted,detect,discovery

http:
  - method: GET
    path:
      - "{{BaseURL}}"

    host-redirects: true
    max-redirects: 2

    matchers:
      - type: dsl
        dsl:
          - 'status_code == 200'
          - 'contains_all(to_lower(body), "self-hosted bookmark service", "linkding")'
        condition: and
