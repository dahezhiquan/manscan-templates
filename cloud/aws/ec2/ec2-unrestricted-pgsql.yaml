id: ec2-unrestricted-pgsql
info:
  name: EC2 安全组对公网开放 PostgreSQL 端口（云安全）
  author: princechaddha
  severity: critical
  description: EC2 安全组对公网开放 PostgreSQL 端口是一类数据库服务暴露风险，TCP 5432 面向任意来源会增加账号爆破、未授权访问和数据库漏洞利用风险。PostgreSQL 服务通常应仅对应用私有子网或受控管理网络开放。模板通过 `describe-security-groups` 筛选 5432 端口且来源为 `0.0.0.0/0` 的入站规则，并输出命中的安全组 ID。
  impact: |
    - PostgreSQL 服务可能被扫描、爆破或利用，导致数据库凭据和数据泄露。
    - 暴露数据库端口可能绕过应用层控制，使攻击者直接接触数据层。
  remediation: |
    - 移除面向公网的 5432 端口入站规则，仅允许应用子网或受控管理入口访问。
    - 启用强认证、TLS、最小权限角色和数据库审计。
  reference:
    - https://docs.aws.amazon.com/AWSEC2/latest/UserGuide/using-network-security.html#security-group-rules
  metadata:
    vendor: amazon
    product: ec2
  tags: cloud,devops,aws,amazon,ec2,aws-cloud-config

variables:
  region: "us-east-1"

self-contained: true
code:
  - engine:
      - sh
      - bash
    source: |
      aws ec2 describe-security-groups --region $region --filters Name=ip-permission.from-port,Values=5432 Name=ip-permission.to-port,Values=5432 Name=ip-permission.cidr,Values='0.0.0.0/0' --query 'SecurityGroups[*].GroupId' --output json

    extractors:
      - type: json
        name: securitygroup
        internal: true
        json:
          - '.[]'

      - type: dsl
        dsl:
          - 'securitygroup + " security group(s) alows unrestricted access (0.0.0.0/0 or ::/0) on TCP port 5432"'
