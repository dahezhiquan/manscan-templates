id: enable-secret-for-user-and-password

info:
  name: Cisco enable secret 与用户密码配置检测（本地文件安全扫描）
  author: pussycat0x
  severity: high
  description: |
    Cisco `enable secret` 使用比明文或旧式 `enable password` 更强的本地特权口令保护机制。若设备没有特权口令或仅依赖弱保护，获得管理面访问的攻击者可能直接进入高权限 EXEC 模式。本模板在配置文件中检查是否缺少 `enable secret`，并要求出现配置上下文；它不验证口令强度、哈希类型或 AAA 授权策略。
  impact: |
    - 攻击者一旦获得普通设备访问或控制台访问，可能直接提升到特权模式，修改路由、ACL、镜像和管理账户。
    - 网络设备被接管可能造成流量重定向、监控绕过、凭据窃取和大范围横向移动。
  reference:
    - https://www.cisco.com/E-Learning/bulk/public/tac/cim/cib/using_cisco_ios_software/cmdrefs/service_timestamps.htm
  remediation: |
    - 为设备配置强随机的 `enable secret`，使用支持的安全哈希类型，并避免在配置、脚本和备份中保留明文凭据。
    - 结合 AAA、命令授权和管理面 ACL 限制特权操作，定期轮换本地 break-glass 凭据并审计使用记录。
  tags: file,audit,cisco,config-audit,cisco-switch,router

file:
  - extensions:
      - conf

    matchers-condition: and
    matchers:
      - type: word
        words:
          - "enable secret"
        negative: true

      - type: word
        words:
          - "configure terminal"
