id: wp-nextgen-gallery-log

info:
  name: WordPress Gallery Plugin NextGEN Gallery (nextgen gallery) 错误 日志 泄露
  author: DhiyaneshDk
  severity: low
  description: |
    检测到 WordPress Gallery Plugin NextGEN Gallery (nextgen gallery) 错误 日志 泄露。目标暴露了调试、错误或堆栈信息，可能泄露应用路径、框架版本、环境变量、源码位置或内部调用细节。
  reference:
    - https://wordpress.org/plugins/nextgen-gallery/
  metadata:
    verified: true
    max-requests: 1
    publicwww-query: "/wp-content/plugins/nextgen-gallery/"
  tags: debug,wordpress,wp,wp-plugin,nextgen-gallery,log

http:
  - method: GET
    path:
      - "{{BaseURL}}/wp-content/plugins/nextgen-gallery/admin/php_errors.log"

    matchers:
      - type: dsl
        dsl:
          - 'status_code == 200'
          - 'contains(body, "nextgen-gallery")'
          - 'contains_any(body, "PHP Warning:", "failed to open dir")'
        condition: and
