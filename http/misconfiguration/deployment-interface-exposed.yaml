id: deployment-interface-exposed

info:
  name: Deployment 管理 Interface 暴露
  author: DhiyaneshDK
  severity: medium
  description: |
    检测到 Deployment 管理 Interface 暴露。目标功能在未认证状态下可访问，可能暴露管理入口、业务数据、系统状态或可执行操作，需确认是否存在访问控制缺失。
  metadata:
    verified: true
    max-request: 1
  tags: deployment,management,misconfig,vuln

http:
  - method: GET
    path:
      - "{{BaseURL}}/"

    matchers-condition: and
    matchers:
      - type: word
        part: body
        words:
          - "<title>Deployment Management Interface</title>"

      - type: status
        status:
          - 200
