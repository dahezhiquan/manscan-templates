id: aem-forms-panel

info:
  name: Adobe Experience Manager Forms 面板（指纹识别）
  author: darses
  severity: info
  description: |-
    检测到目标站点存在 Adobe Experience Manager Forms 相关响应特征。Adobe Experience Manager 是企业级内容管理与数字体验平台，用于管理站点内容、资源、表单和发布流程。模板请求 `/lc/libs/livecycle/core/content/login.html`，并通过页面标题或正文关键字、状态码确认该系统指纹，用于资产识别、系统盘点和暴露面梳理。
  metadata:
    verified: true
    max-request: 1
    vendor: adobe
    product: experience_manager_forms
  tags: panel,login,adobe,detect,discovery
http:
  - method: GET
    path:
      - "{{BaseURL}}/lc/libs/livecycle/core/content/login.html"

    matchers-condition: and
    matchers:
      - type: word
        words:
          - "<title>Adobe Experience Manager forms</title>"
        case-insensitive: true

      - type: status
        status:
          - 200
