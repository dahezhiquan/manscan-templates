id: kubernetes-fake-certificate

info:
  name: Kubernetes 默认伪造 Ingress 证书识别（证书安全）
  author: kchason
  severity: low
  description: 该模板检测目标是否使用 `Kubernetes Ingress Controller Fake Certificate` 默认测试证书。命中通常说明生产入口仍在使用占位证书或自签临时证书，而非面向实际域名签发的正式证书。
  remediation: 为对应的 Ingress 服务配置与实际域名匹配、且由受信任 CA 签发的正式 SSL/TLS 证书。
  reference:
    - https://snyk.io/blog/setting-up-ssl-tls-for-kubernetes-ingress/
  metadata:
    verified: true
    max-request: 1
    shodan-query: ssl:"Kubernetes Ingress Controller Fake Certificate"
  tags: ssl,tls,kubernetes,self-signed,vuln
ssl:
  - address: "{{Host}}:{{Port}}"
    matchers:
      - type: dsl
        dsl:
          - 'subject_cn == "Kubernetes Ingress Controller Fake Certificate"'
          - 'issuer_cn == "Kubernetes Ingress Controller Fake Certificate"'
        condition: or

    extractors:
      - type: dsl
        dsl:
          - '"Issuer: " + issuer_cn'
