id: zerof-webserver-detect

info:
  name: ZEROF Web Server 指纹识别（指纹识别）
  author: princechaddha
  severity: info
  description: >-
    ZEROF Web Server 是 Web 服务组件，响应头或默认页面标识可用于判断目标服务器类型。该模板通过请求目标服务并检查预设路径或首页响应、页面正文关键字、状态码等指纹特征，判断目标是否使用或暴露了
    ZEROF Web Server 相关组件；命中结果仅表示指纹特征匹配，可用于资产盘点、技术栈识别和后续安全评估，不代表已确认存在可利用漏洞。
  metadata:
    max-request: 1
  tags: tech,zerof,discovery
http:
  - method: GET
    path:
      - "{{BaseURL}}"

    matchers-condition: and
    matchers:
      - type: word
        part: body
        words:
          - "<title>ZEROF Web Server</title>"

      - type: status
        status:
          - 200
