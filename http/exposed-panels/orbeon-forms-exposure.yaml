id: orbeon-forms-exposure

info:
  name: Orbeon Forms 暴露（暴露面识别）
  author: ritikchaddha
  severity: info
  description: |
    该模板用于识别 Orbeon Forms 是否存在对外暴露的管理、服务或状态界面。若命中，说明目标公开了相关功能入口，可作为资产盘点与攻击面收敛的依据。
  reference:
    - https://doc.orbeon.com/
    - https://github.com/orbeon/orbeon-forms
  metadata:
    max-request: 2
    vendor: orbeon
    product: orbeon-forms
    shodan-query: http.favicon.hash:1253194620
  tags: exposure,orbeon,forms,form-runner

http:
  - method: GET
    path:
      - "{{BaseURL}}/orbeon/"
      - "{{BaseURL}}"

    redirects: true
    stop-at-first-match: true

    matchers-condition: and
    matchers:
      - type: word
        part: body
        words:
          - "Orbeon"
          - "home</a>"
          - "Quick Links"
        condition: and

      - type: status
        status:
          - 200
