id: gcloud-sql-ssl-tls-connections-not-enforced

info:
  name: Allow SSL/TLS Connections Only（云安全）
  author: princechaddha
  severity: medium
  description: Cloud SQL 允许未加密连接时，数据库传输链路无法保证机密性和完整性。本模板读取 settings.ipConfiguration.sslMode，匹配 ALLOW_UNENCRYPTED_AND_ENCRYPTED 时报告实例未强制只允许 SSL/TLS 连接。
  impact: |
    - 明文数据库连接可能泄露账号凭据、业务数据和查询参数。
    - 未强制 TLS 会导致客户端安全配置不一致，增加审计和合规风险。
  remediation: |
    - 配置 Cloud SQL 仅接受 SSL/TLS 连接，并为客户端启用证书校验或受支持的安全连接方式。
    - 清理仍使用未加密连接的旧客户端，持续监控数据库连接方式和失败日志。
  reference:
    - https://cloud.google.com/sql/docs/mysql/configure-ssl
  metadata:
    vendor: google
    product: cloud-sql
  tags: cloud,devops,gcp,gcloud,google-cloud-sql,networking,security,ssl,gcp-cloud-config

flow: |
  code(1)
  for(let projectId of iterate(template.projectIds)){
    set("projectId", projectId)
    code(2)
    for(let sqlInstance of iterate(template.sqlInstances)){
      set("sqlInstance", sqlInstance)
      code(3)
    }
  }

self-contained: true

code:
  - engine:
      - sh
      - bash
    source: |
      gcloud projects list --format="json(projectId)"

    extractors:
      - type: json
        name: projectIds
        internal: true
        json:
          - '.[].projectId'

  - engine:
      - sh
      - bash
    source: |
      gcloud sql instances list --project $projectId --format="json(name)"

    extractors:
      - type: json
        name: sqlInstances
        internal: true
        json:
          - '.[].name'

  - engine:
      - sh
      - bash
    source: |
      gcloud sql instances describe $sqlInstance --project $projectId --format="value(settings.ipConfiguration.sslMode)"

    matchers:
      - type: word
        words:
          - 'ALLOW_UNENCRYPTED_AND_ENCRYPTED'

    extractors:
      - type: dsl
        dsl:
          - '"The SQL instance " + sqlInstance + " in project " + projectId + " does not enforce SSL/TLS connections and allows unencrypted access"'
