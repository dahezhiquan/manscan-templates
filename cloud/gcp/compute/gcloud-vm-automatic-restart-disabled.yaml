id: gcloud-vm-automatic-restart-disabled

info:
  name: VM Instance Automatic Restart未启用（云安全）
  author: princechaddha
  severity: medium
  description: Compute Engine 实例关闭 automaticRestart 后，宿主机维护或非用户触发故障后不会自动重启，影响服务恢复能力。本模板枚举虚拟机并检查 scheduling.automaticRestart，值为 false 时报告自动重启未启用。
  impact: |
    - 实例故障后可能保持停止状态，导致单实例服务或未充分冗余的工作负载中断。
    - 需要人工介入恢复，延长故障时间并增加告警遗漏风险。
  remediation: |
    - 对需要持续运行的 VM 启用 automaticRestart，并结合托管实例组或负载均衡提升可用性。
    - 对批处理、测试或特殊维护实例记录例外，确保监控能够发现非预期停止状态。
  reference:
    - https://www.trendmicro.com/cloudoneconformity/knowledge-base/gcp/ComputeEngine/enable-automatic-restart.html
    - https://cloud.google.com/compute/docs/instances/setting-instance-scheduling-options
  metadata:
    vendor: google
    product: compute-engine
  tags: cloud,devops,gcp,gcloud,compute,reliability,automatic-restart,gcp-cloud-config

flow: |
  code(1)
  for(let projectId of iterate(template.projectIds)){
    set("projectId", projectId)
    code(2)
    for(let instance of iterate(template.instances)){
      instance = JSON.parse(instance)
      set("instanceName", instance.name)
      set("zone", instance.zone)
      code(3)
    }
  }

self-contained: true

code:
  - engine:
      - sh
      - bash
    source: |
      gcloud projects list --format="json(projectId)"

    extractors:
      - type: json
        name: projectIds
        internal: true
        json:
          - '.[].projectId'

  - engine:
      - sh
      - bash
    source: |
      gcloud compute instances list --project $projectId --format="json(name,zone.basename())"

    extractors:
      - type: json
        name: instances
        internal: true
        json:
          - '.[]'

  - engine:
      - sh
      - bash
    source: |
      gcloud compute instances describe $instanceName --zone $zone --project $projectId --format="json(scheduling.automaticRestart)" | jq '. // "false"'

    matchers:
      - type: word
        words:
          - "false"

    extractors:
      - type: dsl
        dsl:
          - '"VM instance " + instanceName + " in zone " + zone + " of project " + projectId + " does not have automatic restart enabled"'
