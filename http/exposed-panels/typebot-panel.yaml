id: typebot-panel

info:
  name: Typebot 面板识别（指纹识别）
  author: rxerium
  severity: info
  description: |
    该模板通过识别 Typebot 面板、控制台或管理界面的页面特征，判断目标是否暴露了对应服务入口。若命中，说明该后台或运维界面对外可访问，可用于资产识别与暴露面排查。
  reference:
    - https://github.com/baptisteArno/typebot.io
    - https://typebot.io
  metadata:
    verified: true
    max-request: 1
    vendor: typebot
    product: typebot
    shodan-query: 'http.title:"Typebot"'
  tags: panel,typebot,chatbot,ai,detect,discovery

http:
  - method: GET
    path:
      - "{{BaseURL}}"

    host-redirects: true
    max-redirects: 2

    matchers-condition: and
    matchers:
      - type: word
        part: body
        words:
          - "typebot"
        case-insensitive: true

      - type: status
        status:
          - 200
