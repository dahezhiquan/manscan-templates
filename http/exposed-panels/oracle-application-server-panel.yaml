id: oracle-application-server-panel

info:
  name: Oracle Application Server 面板识别（暴露面识别）
  author: righettod
  severity: info
  description: |
    该模板通过识别 Oracle Application Server 登录入口的页面标题、特征文本或重定向行为，判断目标是否暴露了对应的认证界面。若命中，说明该登录面板对外可访问，可用于暴露面梳理与后续安全评估。
  reference:
    - https://www.oracle.com/middleware/technologies/internet-application-server.html
  metadata:
    verified: true
    max-request: 1
    shodan-query: http.title:"Oracle Containers for J2EE"
  tags: panel,oracle,containers,login,detect,discovery

http:
  - method: GET
    path:
      - "{{BaseURL}}/em/console/ias/oc4j/home"
      - "{{BaseURL}}"

    stop-at-first-match: true
    host-redirects: true
    max-redirects: 2

    matchers:
      - type: dsl
        dsl:
          - 'status_code == 200'
          - 'contains_any(to_lower(body), "login to oracle application server control", "oracle enterprise manager")'
        condition: and

    extractors:
      - type: regex
        group: 1
        regex:
          - '(?i)Copyright\s+&copy;\s+([0-9,\s]+),\s+Oracle'
