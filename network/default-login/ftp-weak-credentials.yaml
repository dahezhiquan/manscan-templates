id: ftp-weak-credentials

info:
  name: FTP 弱口令检测（服务漏洞）
  author: pussycat0x,h3h3qaq,theamanrawat
  severity: high
  description: |
    该模板用于检测 FTP 服务是否存在可被常见弱口令直接登录的账户。弱口令或默认凭据会让攻击者绕过正常访问控制，读取、篡改或上传账户权限范围内的文件；若 FTP 目录关联 Web 根目录或部署目录，风险会进一步扩大。模板使用内置用户名与密码字典进行组合尝试，并通过 `230 Login successful` 响应确认弱凭据登录成功。
  impact: |
    - 攻击者可使用弱口令直接登录 FTP 服务，读取、篡改或删除账户有权限访问的文件。
    - 若 FTP 目录关联 Web 根目录、备份目录或部署目录，弱口令可能进一步导致敏感信息泄露、恶意文件投放或主机被接管。
  remediation: |
    - 禁用默认账户和弱口令，强制使用唯一、复杂且定期轮换的 FTP 凭据。
    - 为 FTP 账户配置最小权限和目录隔离，避免账户访问系统目录、备份文件或 Web 可执行路径。
    - 开启登录失败限制、访问来源控制和审计告警，排查是否已经存在异常登录或文件变更。
  reference:
    - https://docs.microsoft.com/en-us/iis/configuration/system.applicationhost/sites/sitedefaults/ftpserver/security/authentication/
  classification:
    cvss-metrics: CVSS:3.0/AV:N/AC:L/PR:L/UI:N/S:C/C:H/I:L/A:N
    cvss-score: 8.5
    cwe-id: CWE-521
  metadata:
    max-request: 1
  tags: network,ftp,default-login,service,tcp,vuln

tcp:

  - inputs:
      - data: "USER {{username}}\r\n"
        read: 1024
      - data: "PASS {{password}}\r\n"
        read: 1024

    host:
      - "{{Hostname}}"
    port: 21

    attack: clusterbomb
    payloads:
      username:
        - admin
        - root
        - ftp
      password:
        - password
        - toor
        - nas
        - guest
        - default
        - pass1
        - stingray
        - 123456

    matchers:
      - type: word
        part: raw
        words:
          - "230 Login successful"
