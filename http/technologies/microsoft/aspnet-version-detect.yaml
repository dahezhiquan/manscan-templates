id: aspnet-version-detect

info:
  name: ASP.NET 指纹识别（指纹识别）
  author: lucky0x0d,PulseSecurity.co.nz
  severity: info
  description: >-
    ASP.NET 是 Microsoft .NET 生态的 Web 应用框架，用于构建动态网站、API 和企业应用。该模板通过请求目标服务并检查预设路径或首页响应、DSL
    条件、HTTP 响应头、正则特征等指纹特征，判断目标是否使用或暴露了 ASP.NET 相关组件；命中结果仅表示指纹特征匹配，可用于资产盘点、技术栈识别和后续安全评估，不代表已确认存在可利用漏洞。
  classification:
    cvss-metrics: CVSS:3.1/AV:N/AC:L/PR:N/UI:N/S:U/C:N/I:N/A:N
    cvss-score: 0
    cwe-id: CWE-200
  metadata:
    verified: true
    max-request: 1
    shodan-query: "X-AspNet-Version"
  tags: tech,detect,aspnet,discovery
http:
  - method: GET
    path:
      - "{{BaseURL}}"
      - "{{BaseURL}}/%3f"

    stop-at-first-match: true
    host-redirects: true
    max-redirects: 3

    matchers-condition: and
    matchers:
      - type: dsl
        dsl:
          - 'contains(tolower(header), "x-aspnet-version")'

      - type: regex
        part: header
        regex:
          - '(?i)^X-AspNet-Version:\s*$'
        negative: true

    extractors:
      - type: kval
        kval:
          - X_AspNet_Version
