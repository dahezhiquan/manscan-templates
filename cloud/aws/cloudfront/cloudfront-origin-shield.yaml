id: cloudfront-origin-shield

info:
  name: CloudFront Origin Shield 未启用（云安全）
  author: DhiyaneshDK
  severity: low
  description: CloudFront Origin Shield 未启用是一类源站韧性和缓存效率配置风险，源站可能承受更多来自多个边缘区域的回源请求。对于高流量或源站容量敏感的业务，缺少集中缓存层可能增加成本、延迟和源站压力。模板读取 `DistributionConfig.Origins.Items[*].OriginShield.Enabled`，当返回 `False` 时判定未启用 Origin Shield。
  impact: |
    - 缓存未命中或流量突增时，源站可能承受更多直接请求，增加性能和可用性压力。
    - 多边缘区域同时回源时，缺少集中缓存层可能导致源站成本上升和响应不稳定。
  remediation: |
    - 对高流量、跨区域访问或源站容量敏感的分配启用 Origin Shield。
    - 选择靠近源站或网络路径更优的 Origin Shield 区域，并观察缓存命中率和源站负载变化。
  reference:
    - https://www.trendmicro.com/cloudoneconformity-staging/knowledge-base/aws/CloudFront/enable-origin-shield.html
    - https://docs.aws.amazon.com/AmazonCloudFront/latest/DeveloperGuide/origin-shield.html
  metadata:
    vendor: amazon
    product: cloudfront
  tags: cloud,devops,aws,amazon,cloudfront,aws-cloud-config

variables:
  region: "us-west-2"

flow: |
  code(1)
  for(let DistributionListItemsId of iterate(template.distributions)){
    set("distribution", DistributionListItemsId)
    code(2)
  }

self-contained: true

code:
  - engine:
      - sh
      - bash

    source: |
      aws cloudfront list-distributions --output table --query 'DistributionList.Items[*].Id' --region $region --output json

    extractors:
      - type: json
        name: distributions
        internal: true
        json:
          - '.[]'

  - engine:
      - sh
      - bash

    source: |
        aws cloudfront get-distribution-config --id $distribution --query 'DistributionConfig.Origins.Items[*].OriginShield.Enabled' --region $region --output text

    matchers:
      - type: word
        words:
          - "False"

    extractors:
      - type: dsl
        dsl:
          - '"CloudFront Origin Shield " + distribution + " not Enabled"'
