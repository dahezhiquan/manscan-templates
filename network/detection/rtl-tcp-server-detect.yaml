id: rtl-tcp-server-detect

info:
  name: RTL-TCP 服务识别（指纹识别）
  author: RandomRobbie
  severity: info
  description: |
    RTL-TCP 是 RTL-SDR 软件无线电设备的网络转发服务，用于将射频采样数据通过 TCP 提供给远程客户端。该模板连接 1234,8888,50000,50001,1235,8889/TCP 并读取协议响应，通过匹配 `RTL0`、`SoapySDR`、`GNU Radio` 等响应特征识别目标服务。
  reference:
    - https://github.com/steve-m/librtlsdr
    - https://osmocom.org/projects/rtl-sdr/wiki/Rtl-sdr
  metadata:
    verified: true
    max-request: 2
  tags: rtl-sdr,sdr,radio,iot,network,detect

tcp:
  - inputs:
      - data: "{{hex_decode('01000000070b8140')}}"
      - data: "{{hex_decode('020000000024f600')}}"

    host:
      - "{{Hostname}}"
    port: "1234,8888,50000,50001,1235,8889"
    read-size: 1024

    matchers-condition: or
    matchers:
      - type: word
        name: rtl0-handshake
        words:
          - "RTL0"

      - type: word
        name: sdr-software
        words:
          - "SoapySDR"
          - "GNU Radio"
          - "rtl_tcp"
        condition: or

      - type: dsl
        name: iq-data-stream
        dsl:
          - "len(body) > 100"

    extractors:
      - type: kval
        name: server-info
        kval:
          - host
          - port
