id: seagate-nas-login

info:
  name: Seagate NAS 登录识别（暴露面识别）
  author: JustaAcat
  severity: info
  description: |
    该模板通过识别 Seagate NAS 登录入口的页面标题、特征文本或重定向行为，判断目标是否暴露了对应的认证界面。若命中，说明该登录面板对外可访问，可用于暴露面梳理与后续安全评估。
  classification:
    cpe: cpe:2.3:o:seagate:nas_os:*:*:*:*:*:*:*:*
  metadata:
    verified: true
    max-request: 1
    vendor: seagate
    product: nas_os
    shodan-query:
      - title:"Seagate NAS - SEAGATE"
      - http.title:"seagate nas - seagate"
    fofa-query: title="seagate nas - seagate"
    google-query: intitle:"seagate nas - seagate"
  tags: panel,seagate,login,discovery

http:
  - method: GET
    path:
      - "{{BaseURL}}"

    matchers-condition: and
    matchers:
      - type: word
        words:
          - Seagate NAS - SEAGATE
        case-insensitive: true

      - type: status
        status:
          - 200
