id: strapi-cms-detect

info:
  name: Strapi CMS 指纹识别（指纹识别）
  author: cyllective,daffainfo,idealphase
  severity: info
  description: >-
    Strapi 是 Node.js 无头内容管理系统，用于构建 API 驱动的内容服务和后台管理。该模板通过请求目标服务并检查预设路径或首页响应、页面正文关键字、状态码、正则特征等指纹特征，判断目标是否使用或暴露了
    Strapi CMS 相关组件；命中结果仅表示指纹特征匹配，可用于资产盘点、技术栈识别和后续安全评估，不代表已确认存在可利用漏洞。
  reference:
  - https://github.com/strapi/strapi
  metadata:
    max-request: 1
  tags: tech,strapi,cms,discovery
http:
  - method: GET
    path:
      - "{{BaseURL}}/admin/init"

    matchers-condition: and
    matchers:
      - type: word
        part: body
        words:
          - '"data"'
          - '"uuid"'
          - '"hasAdmin"'
        condition: and

      - type: status
        status:
          - 200

    extractors:
      - type: regex
        part: body
        group: 1
        regex:
          - '"strapiVersion":"([0-9.]+)"'
