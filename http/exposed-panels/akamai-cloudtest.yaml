id: akamai-cloudtest

info:
  name: Akamai CloudTest 面板（暴露面识别）
  author: emadshanab
  severity: info
  description: 该模板通过识别 Akamai CloudTest 面板、控制台或管理界面的页面特征，判断目标是否暴露了对应服务入口。若命中，说明该后台或运维界面对外可访问，可用于资产识别与暴露面排查。
  reference:
    - https://techdocs.akamai.com/cloudtest/docs
  classification:
    cwe-id: CWE-200
    cpe: cpe:2.3:a:akamai:cloudtest:*:*:*:*:*:*:*:*
  metadata:
    max-request: 1
    vendor: akamai
    product: cloudtest
  tags: panel,akamai,discovery

http:
  - method: GET
    path:
      - "{{BaseURL}}/concerto/Login?goto=Central"

    matchers-condition: and
    matchers:
      - type: word
        words:
          - "Akamai Inc. All rights reserved"
          - "Akamai CloudTest"
        condition: and

      - type: status
        status:
          - 200
