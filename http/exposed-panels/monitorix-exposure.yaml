id: monitorix-exposure

info:
  name: Monitorix 面板识别（暴露面识别）
  author: geeknik
  severity: info
  description: 该模板用于识别 Monitorix 是否存在对外暴露的管理、服务或状态界面。若命中，说明目标公开了相关功能入口，可作为资产盘点与攻击面收敛的依据。
  reference:
    - https://www.monitorix.org/
  classification:
    cvss-metrics: CVSS:3.0/AV:N/AC:L/PR:N/UI:N/S:U/C:N/I:N/A:N
    cwe-id: CWE-200
  metadata:
    max-request: 1
  tags: monitorix,exposure,logs,panel,discovery

http:
  - method: GET
    path:
      - "{{BaseURL}}/monitorix-cgi/monitorix.cgi?mode=localhost&graph=all&when=1day"

    matchers-condition: and
    matchers:
      - type: word
        part: body
        words:
          - "<!-- graph table begins -->"
          - "Global kernel usage</b>"
          - "Kernel usage per processor</b>"
          - "<!-- graph table ends -->"
          - "1day.png'"
        condition: and

      - type: status
        status:
          - 200
