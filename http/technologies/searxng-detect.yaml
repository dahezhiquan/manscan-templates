id: searxng-detect

info:
  name: SearXNG 指纹识别（指纹识别）
  author: rxerium
  severity: info
  description: |
    用于识别目标是否使用 SearXNG，模板会结合页面标题、页面正文、状态码和特定路径或已知端点进行技术指纹匹配。
  reference:
    - https://github.com/searxng/searxng
  metadata:
    max-request: 1
    verified: true
    shodan-query: http.title:SearXNG
  tags: searxng,search-engine,tech,discovery

http:
  - method: GET
    path:
      - "{{BaseURL}}"

    matchers-condition: and
    matchers:
      - type: word
        part: body
        words:
          - "<title>SearXNG</title>"

      - type: status
        status:
          - 200
