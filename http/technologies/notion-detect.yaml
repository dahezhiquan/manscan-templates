id: notion-detect

info:
  name: Notion 指纹识别（指纹识别）
  author: tess
  severity: info
  description: >-
    Notion 是在线协作文档和知识管理平台，用于笔记、数据库、项目管理和团队协作空间。该模板通过请求目标服务并检查预设路径或首页响应、页面正文关键字、状态码等指纹特征，判断目标是否使用或暴露了
    Notion 相关组件；命中结果仅表示指纹特征匹配，可用于资产盘点、技术栈识别和后续安全评估，不代表已确认存在可利用漏洞。
  classification:
    cpe: cpe:2.3:a:notion:notion:*:*:*:*:*:*:*:*
  metadata:
    verified: true
    max-request: 1
    vendor: notion
    product: notion
    shodan-query: title:"Notion – One workspace. Every team."
  tags: notion,tech,discovery
http:
  - method: GET
    path:
      - '{{BaseURL}}'

    matchers-condition: and
    matchers:
      - type: word
        part: body
        words:
          - "Notion – One workspace. Every team."
          - "Notion Labs, Inc."
        condition: or

      - type: status
        status:
          - 200
