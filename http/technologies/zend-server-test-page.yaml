id: zend-server-test-page

info:
  name: Zend Server 测试页面 指纹识别（指纹识别）
  author: DhiyaneshDk
  severity: info
  description: >-
    Zend Server 是 PHP 应用服务器和运行环境，测试页面通常用于确认 PHP/Zend 服务部署状态。该模板通过请求目标服务并检查预设路径或首页响应、页面正文关键字、HTTP
    响应头、状态码等指纹特征，判断目标是否使用或暴露了 Zend Server 测试页面 相关组件；命中结果仅表示指纹特征匹配，可用于资产盘点、技术栈识别和后续安全评估，不代表已确认存在可利用漏洞。
  classification:
    cpe: cpe:2.3:a:zend:zend_server:*:*:*:*:*:*:*:*
  metadata:
    verified: true
    max-request: 1
    vendor: zend
    product: zend_server
    shodan-query: title:"Zend Server Test Page"
  tags: tech,zend,discovery
http:
  - method: GET
    path:
      - "{{BaseURL}}"

    matchers-condition: and
    matchers:
      - type: word
        part: body
        words:
          - '<title>Zend Server Test Page</title>'

      - type: word
        part: header
        words:
          - text/html

      - type: status
        status:
          - 200
