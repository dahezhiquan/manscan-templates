id: linux-automountd-enabled

info:
  name: automountd 服务已启用（本地基线扫描）
  author: songyaeji
  severity: medium
  description: |
    automountd 自动挂载服务运行时会按需挂载文件系统，若无业务需求，可能被恶意挂载点、网络共享或配置错误扩大本地文件系统攻击面。模板通过进程检查确认 `automountd` 是否正在运行，命中 `[VULNERABLE]` 表示服务仍启用。
  impact: |
    - 攻击者可能利用自动挂载行为诱导访问不可信文件系统或暴露内部共享。
    - 不必要的挂载服务会增加权限边界、可用性和审计复杂度。
  remediation: |
    - 如无需求，停止并禁用 automount/automountd 相关服务，卸载对应组件。
    - 如必须使用，限制挂载来源、挂载选项和访问权限，并审计自动挂载配置。
  reference:
    - https://isms.kisa.or.kr
  metadata:
    verified: true
  tags: local,linux,privesc,kisa

self-contained: true

code:
  - engine:
      - sh
      - bash
    source: |
      whoami

  - engine:
      - sh
      - bash
    source: |
      if pgrep -x "automountd" > /dev/null; then
        echo "[VULNERABLE] automountd service is running"
      else
        echo "[SAFE] automountd service is not running"
      fi

    matchers-condition: and
    matchers:
      - type: word
        part: response
        words:
          - "root"
        negative: true

      - type: word
        part: response
        words:
          - "[VULNERABLE]"
