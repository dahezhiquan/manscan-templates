id: s3-mfa-delete-check
info:
  name: S3 Bucket MFA Delete 未配置（云安全）
  author: princechaddha
  severity: low
  description: S3 MFA Delete 可要求使用 MFA 才能永久删除对象版本或暂停 versioning，适合保护关键备份和审计数据。该模板枚举 bucket，并检查 get-bucket-versioning 返回的 MFADelete 是否为 null。
  impact: |
    - 拥有足够权限的身份在凭据泄露或误操作场景下可直接删除历史版本。
    - 对备份、日志和合规归档 bucket 而言，缺少 MFA Delete 会降低防篡改和恢复能力。
  remediation: |
    - 对承载关键备份或审计数据的 versioning bucket 启用 MFA Delete。
    - 收敛 s3:DeleteObjectVersion、s3:PutBucketVersioning 等高危权限，并配合 Object Lock 或备份策略提升保护强度。
  reference:
    - https://docs.aws.amazon.com/cli/latest/reference/s3api/get-bucket-versioning.html
  metadata:
    max-request: 2
    vendor: amazon
    product: s3
  tags: cloud,devops,aws,amazon,s3,aws-cloud-config

flow: |
  code(1)
  for(let bucketName of iterate(template.buckets)){
    set("bucket", bucketName)
    code(2)
  }

self-contained: true
code:
  - engine:
      - sh
      - bash
    source: |
      aws s3api list-buckets --query 'Buckets[*].Name'

    extractors:
      - type: json # type of the extractor
        internal: true
        name: buckets
        json:
          - '.[]'

  - engine:
      - sh
      - bash
    source: |
        aws s3api get-bucket-versioning --bucket $bucket --query 'MFADelete'

    matchers:
      - type: word
        words:
          - "null"

    extractors:
      - type: dsl
        dsl:
          - '"The S3 bucket " + bucket +" is not configured to use MFA Delete feature"'
