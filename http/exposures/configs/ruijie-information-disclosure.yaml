id: ruijie-information-disclosure

info:
  name: Ruijie Login Panel暴露（暴露面识别）
  author: pikpikcu
  severity: high
  description: |
    检测到目标站点可直接访问 Ruijie Login Panel。锐捷网络设备和管理页面常用于校园、企业网络接入和网关管理，公开配置或状态信息可能暴露设备细节。该模板请求 `/login.php`，并通过 HTTP 状态码、响应正文关键字、文件格式特征、正则匹配或响应头进行确认。配置文件公开后可能泄露部署细节、内部路径、依赖版本、环境变量、访问凭据或调试信息，增加被侦察和后续利用的风险。
  impact: |-
    - 公开文件可能泄露内部路径、组件版本、依赖清单、资源命名、环境变量名称或业务配置线索。
    - 攻击者可利用这些信息缩小目标范围，选择匹配漏洞、弱口令、凭据攻击或目录枚举策略。
    - 若文件中包含真实凭据、令牌、连接串或敏感数据，可能进一步导致数据、代码仓库、云资源或后台系统被未授权访问。
  remediation: |-
    - 确认该文件是否必须公网可访问；如非业务必需，应立即从 Web 根目录、静态资源目录、对象存储或反向代理公开路径中移除。
    - 在 Web 服务器、网关、CDN 或应用路由层增加拒绝规则、身份认证、IP allowlist 或内网访问限制。
    - 检查访问日志、下载记录和缓存记录，评估该资源是否已被外部访问或搜索引擎收录。
    - 若文件中包含凭据、令牌、连接串或私有地址，应执行密钥轮换、权限收敛和受影响系统访问审计。
  reference:
    - https://www.ruijienetworks.com/
    - https://www.cnblogs.com/cHr1s/p/14499858.html
  classification:
    cvss-metrics: CVSS:3.1/AV:N/AC:L/PR:N/UI:N/S:U/C:H/I:N/A:N
    cvss-score: 7.5
    cwe-id: CWE-200
  metadata:
    max-request: 1
  tags: ruijie,config,exposure,vuln

http:
  - method: GET
    path:
      - '{{BaseURL}}/login.php'

    matchers-condition: and
    matchers:
      - type: regex
        regex:
          - '"role":"super_admin","name":"(.*)","password":"(.*)"'
        part: body
        condition: and

      - type: status
        status:
          - 200
