id: unauth-temporal-web-ui

info:
  name: Temporal Web UI 未授权访问
  author: ggranjus
  severity: high
  description: |-
    该模板用于核查 Temporal Web UI 未授权访问。目标管理界面、控制台或敏感接口在未登录状态下可访问，通常源于默认开放、反向代理绕过、初始化流程遗留或访问控制配置错误。模板访问 /favicon.ico、/api/v1/namespaces/default/workflows?query=，并根据页面标题、接口响应、重定向或关键业务字段确认未授权访问。
  reference:
    - https://docs.temporal.io/web-ui
  classification:
    cvss-metrics: CVSS:3.0/AV:N/AC:L/PR:N/UI:N/S:U/C:N/I:N/A:N
    cwe-id: CWE-200
    cpe: cpe:2.3:a:temporal:temporal:*:*:*:*:*:*:*:*
  metadata:
    verified: 'true'
    max-request: 2
    shodan-query: http.favicon.hash:557327884
    product: temporal
    vendor: temporal
  tags: misconfig,temporal,unauth,vuln
  impact: |-
    - 攻击者可查看或操作管理功能、任务队列、监控数据、配置项、项目数据或设备状态。
    - 若界面提供写入、执行、上传或注册能力，可能进一步造成服务接管、数据泄露或业务中断。
  remediation: |-
    - 为管理入口和 API 强制启用认证授权，关闭匿名访问、访客登录和公开注册。
    - 将控制台限制在内网、VPN 或可信来源，并在网关层增加访问控制。
    - 复核默认配置、反向代理规则和初始化状态，清理测试账户并开启审计日志。
http:
  - method: GET
    path:
      - "{{BaseURL}}/favicon.ico"
      - "{{BaseURL}}/api/v1/namespaces/default/workflows?query="

    matchers-condition: and
    matchers:
      - type: dsl
        dsl:
          - "status_code_1 == 200 && (\"44c856843ce2631b1d6968ac11fa9ec4\" == md5(body_1))"

      - type: dsl
        dsl:
          - "contains(body_2, 'nextPageToken') && status_code_2 == 200"
          - "contains(body_2, 'Namespace default is not found.') && status_code_2 == 404"
        condition: or
