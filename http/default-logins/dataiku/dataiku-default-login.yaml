id: dataiku-default-login

info:
  name: Dataiku 默认口令登录（弱口令）
  author: random-robbie
  severity: high
  description: 该模板通过尝试 Dataiku 的默认账号口令，并依据认证成功后的响应特征判断目标是否仍在使用未修改的弱口令。若命中，攻击者可直接登录系统，进一步访问敏感信息、修改配置或执行未授权操作。 在部分部署场景下，还可能进一步造成远程代码执行。
  reference:
    - https://www.dataiku.com
  classification:
    cvss-metrics: CVSS:3.0/AV:N/AC:L/PR:N/UI:N/S:C/C:L/I:L/A:L
    cvss-score: 8.3
    cwe-id: CWE-522
    cpe: cpe:2.3:a:dataiku:data_science_studio:*:*:*:*:*:*:*:*
  metadata:
    verified: true
    max-request: 1
    shodan-query: title:"dataiku"
    product: data_science_studio
    vendor: dataiku
  tags: default-login,dataiku,vuln

http:
  - raw:
      - |
        POST /dip/api/login HTTP/1.1
        Host: {{Hostname}}
        Content-Type: application/x-www-form-urlencoded;charset=utf-8

        login=admin&password=admin

    matchers-condition: and
    matchers:
      - type: word
        part: header
        words:
          - 'dss_access_token'

      - type: status
        status:
          - 200
