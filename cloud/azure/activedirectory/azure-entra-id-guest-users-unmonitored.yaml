id: azure-entra-id-guest-users-unmonitored
info:
  name: Azure Entra ID 存在未监控的 Guest 用户（云安全）
  author: princechaddha
  severity: medium
  description: Microsoft Entra ID Guest 用户用于外部协作，若缺少持续审查和监控，外部身份可能在项目结束后仍保留访问能力。该模板通过 az ad user list 查询 userType 为 Guest 的用户，并在返回 Guest 用户对象时提示需要审计。
  impact: |
    - 外部协作账号可能长期保留对应用、组或资源的访问权限，形成权限残留。
    - Guest 用户被接管后可借助已有授权访问内部数据或参与横向移动。
  remediation: |
    - 定期执行 Guest 用户访问评审，移除不再需要的外部身份和组成员关系。
    - 对 Guest 用户启用条件访问、MFA、登录风险监控和邀请/协作策略限制。
  reference:
    - https://docs.microsoft.com/en-us/azure/active-directory/external-identities/
  metadata:
    vendor: microsoft
    product: entra-id
  tags: cloud,devops,azure,microsoft,entra-id,azure-cloud-config

self-contained: true
code:
  - engine:
      - sh
      - bash
    source: |
      az ad user list --query "[?userType=='Guest']" --output json

    matchers:
      - type: word
        words:
          - '"userType": "Guest"'

    extractors:
      - type: dsl
        dsl:
          - '"Azure Account han an Entra ID guest user Microsoft Entra ID"'
