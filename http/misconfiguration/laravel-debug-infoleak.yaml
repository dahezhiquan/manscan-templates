id: laravel-debug-infoleak

info:
  name: Laravel 调试 信息泄露
  author: pwnhxl
  severity: medium
  description: |
    该模板用于核查 Laravel 调试 信息泄露。该类问题通常源于生产环境暴露调试页面、错误回溯、诊断端点、指标接口或详细错误信息。模板会向目标发送探测请求，并依据匹配 `vendor/laravel/framework/src/Illuminate/`、匹配 `MethodNotAllowedHttpException`、匹配 `DB_PASSWORD`等证据确认目标是否存在该配置问题。
  impact: |
    - 攻击者可获取应用路径、框架版本、环境变量、内部调用栈、运行参数或依赖信息。
    - 这些信息可帮助攻击者定位组件版本、构造后续漏洞利用或发现内部系统结构。
  remediation: |
    - 关闭生产环境调试模式、错误回溯、示例页面和诊断接口。
    - 对确需保留的运维端点增加认证授权、来源限制和访问审计。
    - 统一错误处理策略，避免向外部用户返回堆栈、环境变量和内部路径。
  reference:
    - https://github.com/dem0ns/improper/blob/master/laravel/5_debug/1.png
  classification:
    cvss-metrics: CVSS:3.1/AV:N/AC:L/PR:N/UI:N/S:U/C:L/I:L/A:N
    cvss-score: 6.5
    cwe-id: CWE-215
    cpe: cpe:2.3:a:laravel:framework:*:*:*:*:*:*:*:*
  metadata:
    verified: true
    max-request: 1
    shodan-query: Laravel-Framework
    fofa-query: app="Laravel-Framework"
    product: framework
    vendor: laravel
  tags: misconfig,laravel,debug,info-leak,vuln

http:
  - raw:
      - |
        POST / HTTP/1.1
        Host: {{Hostname}}

    matchers-condition: and
    matchers:
      - type: word
        part: body
        words:
          - 'vendor/laravel/framework/src/Illuminate/'
          - 'MethodNotAllowedHttpException'
        condition: and

      - type: word
        part: body
        words:
          - 'DB_PASSWORD'
          - 'REDIS_PASSWORD'
          - 'MAIL_PASSWORD'
          - 'ALIYUN_ACCESSKEYSECRET'
          - 'ALIYUN_ACCESSKEYID'
          - 'SMS_AUTH_TOKEN'
          - 'APP_KEY'
        condition: or

      - type: status
        status:
          - 405
