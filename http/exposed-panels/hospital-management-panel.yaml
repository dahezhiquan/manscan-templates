id: hospital-management-panel

info:
  name: Hospital Management System 登录面板识别（暴露面识别）
  author: arafatansari
  severity: info
  description: 该模板通过识别 Hospital Management System 登录入口的页面标题、特征文本或重定向行为，判断目标是否暴露了对应的认证界面。若命中，说明该登录面板对外可访问，可用于暴露面梳理与后续安全评估。
  classification:
    cvss-metrics: CVSS:3.0/AV:N/AC:L/PR:N/UI:N/S:U/C:N/I:N/A:N
    cwe-id: CWE-200
    cpe: cpe:2.3:a:hospital_management_system_project:hospital_management_system:*:*:*:*:*:*:*:*
  metadata:
    verified: true
    max-request: 1
    vendor: hospital_management_system_project
    product: hospital_management_system
    shodan-query:
      - http.html:"Hospital Management System"
      - http.html:"hospital management system"
    fofa-query: body="hospital management system"
  tags: panel,hms,cms,hospital_management_system_project,discovery

http:
  - method: GET
    path:
      - "{{BaseURL}}/index.html"

    matchers-condition: and
    matchers:
      - type: word
        part: body
        words:
          - 'Hospital Management System'
          - 'Doctors Login'
          - 'Admin Login'
        condition: and

      - type: status
        status:
          - 200
