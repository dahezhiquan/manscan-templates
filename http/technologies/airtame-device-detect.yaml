id: airtame-device-detect

info:
  name: Airtame Device 指纹识别（指纹识别）
  author: princechaddha
  severity: info
  description: Airtame Device 是无线投屏和数字标牌设备，用于会议室屏幕共享、展示和设备管理。该模板请求首页，并依据 HTTP 200 状态码、页面标题、正文关键字或品牌资源特征识别目标是否使用或暴露了 Airtame Device 相关组件，适用于资产盘点、技术栈识别和后续安全评估；命中结果仅表示指纹特征匹配，不代表已确认存在可利用漏洞。
  metadata:
    max-request: 1
  tags: tech,airtame,iot,discovery

http:
  - method: GET
    path:
      - "{{BaseURL}}"

    matchers-condition: and
    matchers:
      - type: word
        part: body
        words:
          - "To access the settings of your Airtame"
          - "https://airtame.com/download"
        condition: and

      - type: status
        status:
          - 200
