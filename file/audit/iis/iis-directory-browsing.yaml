id: iis-directory-browsing

info:
  name: IIS 目录浏览未禁用（本地文件安全扫描）
  author: pussycat0x
  severity: high
  description: |
    该模板检查 IIS 目录浏览是否关闭。目录浏览开启会暴露站点文件结构和敏感文件名。
  reference:
    - https://wiki.devsecopsguides.com/docs/checklists/iis/
  tags: iis,windows,file,hardening

file:
  - extensions:
      - all

    matchers-condition: and
    matchers:
      - type: word
        words:
          - "<system.webServer>"

      - type: word
        words:
          - '<directoryBrowse enabled="true" />'
        negative: true
