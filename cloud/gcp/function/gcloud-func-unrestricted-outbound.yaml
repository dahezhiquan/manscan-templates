id: gcloud-func-unrestricted-outbound

info:
  name: Unrestricted Outbound Network 访问 中的Google Cloud Functions（云安全）
  author: princechaddha
  severity: high
  description: Cloud Functions 出站流量未限制到受控 VPC 路径时，函数可能直接访问公网或绕过集中出口策略。本模板枚举函数并检查 serviceConfig.vpcConnectorEgressSettings，字段为空或为 ALL_TRAFFIC 时报告函数出站网络访问配置需要复核。
  impact: |
    - 函数被滥用后可能直接访问外部地址，增加数据外传、恶意回连或绕过网络审计的风险。
    - 未统一出口路径会削弱防火墙、NAT、DLP 和流量日志等集中控制。
  remediation: |
    - 根据业务需要配置 Serverless VPC Access 和合适的 egress settings，将敏感函数出站流量纳入受控网络。
    - 对确需公网访问的函数限制目标域名、API 权限和调用凭据，并启用日志监控。
  reference:
    - https://cloud.google.com/functions/docs/networking/network-settings
  metadata:
    vendor: google
    product: cloud-functions
  tags: cloud,devops,gcp,gcloud,google-cloud-functions,gcp-cloud-config

flow: |
  code(1)
  for(let projectId of iterate(template.projectIds)){
    set("projectId", projectId)
    code(2)
    for(let functionDetail of iterate(template.functions)){
      set("functionName", functionDetail)
      code(3)
    }
  }

self-contained: true

code:
  - engine:
      - sh
      - bash
    source: |
      gcloud projects list --format="json(projectId)"

    extractors:
      - type: json
        name: projectIds
        internal: true
        json:
          - '.[].projectId'

  - engine:
      - sh
      - bash
    source: |
      gcloud functions list --project $projectId --format="json(name)"

    extractors:
      - type: json
        name: functions
        internal: true
        json:
          - '.[].name'

  - engine:
      - sh
      - bash
    source: |
      gcloud functions describe $functionName --format="json(serviceConfig.vpcConnectorEgressSettings)"

    matchers:
      - type: word
        words:
          - 'null'
          - 'ALL_TRAFFIC'
        condition: or

    extractors:
      - type: dsl
        dsl:
          - '"Unrestricted Outbound Network Access in function: " + functionName + ", Region: " + functionRegion + ", Project: " + projectId'
