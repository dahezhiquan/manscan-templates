id: azure-custom-owner-role-unrestricted
info:
  name: Azure 自定义 Owner 角色作用域过宽（云安全）
  author: princechaddha
  severity: medium
  description: Azure 自定义角色若在根范围或订阅级范围授予所有操作权限，实质上会形成自定义 Owner 类角色。该模板枚举自定义角色，并检查 assignableScopes 是否覆盖根或订阅范围且 actions 为 *。
  impact: |
    - 角色一旦被分配给错误主体，会授予对大量资源的创建、修改和删除能力。
    - 自定义 Owner 类角色容易绕过内置角色治理，增加权限蔓延和审计盲区。
  remediation: |
    - 删除或重构不必要的自定义 Owner 类角色，改用内置角色或最小权限自定义角色。
    - 对必须保留的高权限角色启用审批、PIM、到期分配和定期访问评审。
  reference:
    - https://docs.microsoft.com/en-us/azure/role-based-access-control/custom-roles
  metadata:
    vendor: microsoft
    product: azure-rbac
  tags: cloud,devops,azure,microsoft,role-management,azure-cloud-config

flow: |
  code(1);
  for (let RoleData of iterate(template.roleList)) {
    set("roleName", RoleData);
    code(2);
  }

self-contained: true
code:
  - engine:
      - sh
      - bash
    source: |
      az role definition list --custom-role-only true --query '[].{roleName:roleName}' --output json

    extractors:
      - type: json
        name: roleList
        internal: true
        json:
          - '.[]'

  - engine:
      - sh
      - bash
    source: |
      az role definition list --name "$roleName" --output json --query '[?(assignableScopes == `/` || assignableScopes == `/subscriptions/` && actions == `*`)].roleName'

    matchers-condition: and
    matchers:
      - type: word
        words:
          - 'roleName'

    extractors:
      - type: dsl
        dsl:
          - 'roleName + " is a custom owner role with excessive permissions"'
