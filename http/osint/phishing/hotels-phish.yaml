id: hotels-phish

info:
  name: Hotels.com 仿冒钓鱼网站（钓鱼网站识别）
  author: rxerium
  severity: info
  description: |
    检测到疑似仿冒 Hotels.com 的钓鱼网站。模板在目标页面返回 200、页面内容命中 Hotels.com 的品牌页面特征，且当前主机不属于 hotels.com 官方域名时触发，用于识别借用 Hotels.com 品牌页面诱导用户信任的仿冒站点。
  reference:
    - https://hotels.com
  metadata:
    max-request: 1
  tags: phishing,hotels,travel,osint,discovery
http:
  - method: GET
    path:
      - "{{BaseURL}}"

    host-redirects: true
    max-redirects: 2

    matchers-condition: and
    matchers:
      - type: word
        words:
          - 'Hotels.com'
          - '<title>Hotels.com - Deals &amp; Discounts for Hotel Reservations from Luxury Hotels to Budget Accommodations'
        condition: and

      - type: status
        status:
          - 200

      - type: dsl
        dsl:
          - '!contains(host,"hotels.com")'
