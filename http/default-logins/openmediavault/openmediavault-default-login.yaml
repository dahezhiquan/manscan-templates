id: openmediavault-default-login

info:
  name: OpenMediaVault 默认口令登录（弱口令）
  author: DhiyaneshDK
  severity: high
  description: |
    该模板用于检测 OpenMediaVault 是否仍可使用默认凭据或弱口令登录。模板主要向 `/rpc.php` 等认证入口发送请求，使用内置默认凭据组合进行认证尝试，并根据响应中的 `"authenticated":true`、`"permissions":` 等登录成功特征判断登录是否成功；命中说明目标未及时修改出厂、示例或初始化账号口令。
  impact: |
    - 攻击者可登录 OpenMediaVault 管理接口，读取、导出或篡改数据、索引、队列、仓库、报表或媒体资源。
    - 若系统保存连接串、访问令牌或集成凭据，弱口令登录可能进一步造成业务数据泄露、权限扩大或服务中断。
  remediation: |
    - 立即修改默认账号口令，删除测试账号，并为管理员、服务账号和集成账号使用唯一强密码。
    - 启用细粒度权限控制、访问来源限制和审计日志，避免管理 API 或控制台直接对公网开放。
    - 检查数据导出、配置变更、令牌使用和异常查询记录，必要时轮换相关凭据。
  reference:
    - https://forum.openmediavault.org/index.php?thread/7784-default-login/
    - https://soltveit.org/openmediavault-default-password/
  classification:
    cvss-metrics: CVSS:3.0/AV:N/AC:L/PR:N/UI:N/S:C/C:L/I:L/A:L
    cvss-score: 8.3
    cwe-id: CWE-522
    cpe: cpe:2.3:a:openmediavault:openmediavault:*:*:*:*:*:*:*:*
  metadata:
    verified: true
    max-request: 1
    shodan-query: title:"OpenMediaVault"
    product: openmediavault
    vendor: openmediavault
  tags: default-login,openmediavault,vuln

http:
  - raw:
      - |
        POST /rpc.php HTTP/1.1
        Host: {{Hostname}}
        Content-Type: application/json

        {"service":"Session","method":"login","params":{"username":"{{username}}","password":"{{password}}"},"options":null}

    attack: pitchfork
    payloads:
      username:
        - admin
      password:
        - openmediavault

    matchers-condition: and
    matchers:
      - type: word
        part: body
        words:
          - '"authenticated":true'
          - '"permissions":'
        condition: and

      - type: word
        part: header
        words:
          - application/json

      - type: status
        status:
          - 200
