id: ftp-anonymous-login

info:
  name: FTP 匿名登录检测（服务漏洞）
  author: C3l3si4n,pussycat0x
  severity: medium
  description: |
    该模板检测 FTP 服务是否允许匿名登录。命中说明未认证用户可能直接访问公开目录，甚至具备上传能力。
  reference:
    - https://tools.ietf.org/html/rfc2577
  metadata:
    max-request: 1
    verified: true
  tags: network,ftp,default-login,tcp,vuln

tcp:
  - inputs:
      - data: "USER anonymous\r\n"
        read: 1024
      - data: "PASS anonymous\r\n"
        read: 1024

    host:
      - "{{Hostname}}"
    port: 21

    matchers-condition: and
    matchers:
      - type: word
        part: raw
        words:
          - "Anonymous access allowed,"
          - "Logged in anonymously"
          - "Anonymous user logged"
          - "Login successful"
          - "Guest login ok"
          - "User anonymous logged in"
        condition: or
        case-insensitive: true

      - type: word
        part: raw
        words:
          - "HTTP/1.1"
          - "230."
          - ".230"
          - "User cannot log"
          - "ESMTP"
        negative: true
        condition: or
