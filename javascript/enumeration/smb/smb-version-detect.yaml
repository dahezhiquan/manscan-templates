id: smb-version-detect

info:
  name: SMB 版本识别（指纹识别）
  author: pussycat0x
  severity: low
  description: |
    该模板识别目标 SMB 服务支持的协议版本。模板发起 SMB 协商并提取 smb-version 字段，用于判断是否存在 SMBv1、SMBv2/3 等协议暴露面。
  impact: |
    - SMB 协议版本信息可帮助攻击者判断是否存在 SMBv1 或特定 SMB2/3 能力。
    - 暴露的版本指纹会提高后续漏洞匹配、协议降级测试和配置审计效率。
  remediation: |
    - 限制 SMB 端口访问来源，减少未认证协议指纹暴露。
    - 禁用旧 SMB 方言，保持系统补丁更新并启用安全基线。
  metadata:
    max-request: 1
    shodan-query: "port:445"
  tags: js,network,smb,enum,discovery,detect

javascript:
  - pre-condition: |
      isPortOpen(Host,Port);
    code: |
      let m = require("nuclei/smb");
      let c = new m.SMBClient();
      let response = c.ConnectSMBInfoMode(Host, Port);
      Export(response);

    args:
      Host: "{{Host}}"
      Port: "445"

    extractors:
      - type: json
        name: smb-version
        json:
          - '.Version.VerString'
