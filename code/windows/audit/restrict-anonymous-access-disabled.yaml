id: restrict-anonymous-access-disabled

info:
  name: 匿名访问限制已禁用（本地基线扫描）
  author: princechaddha
  severity: high
  description: |
    该模板检查匿名访问限制是否禁用。禁用限制会允许未认证用户枚举更多系统信息。
  impact: |
    攻击者可收集用户、共享和策略信息，辅助后续攻击。
  remediation: |
    将 RestrictAnonymous 配置为 1 或 2，并验证业务兼容性。
  tags: windows,anonymous-access,code,windows-audit

self-contained: true

code:
  - pre-condition: |
      IsWindows();
    engine:
      - powershell
      - powershell.exe
    args:
      - -ExecutionPolicy
      - Bypass
    pattern: "*.ps1"
    source: |
      $restrictAnonymous = Get-ItemProperty -Path 'HKLM:\SYSTEM\CurrentControlSet\Control\Lsa' -Name 'RestrictAnonymous'
      Write-Host "RestrictAnonymous: $($restrictAnonymous.RestrictAnonymous)"

    matchers:
      - type: word
        words:
          - "RestrictAnonymous: 0"
