id: windows-administrative-shares-enabled

info:
  name: Windows 管理共享已启用（本地基线扫描）
  author: princechaddha
  severity: high
  description: |
    该模板检查 C$、D$ 等管理共享是否启用。管理共享可远程访问磁盘根目录。
  impact: |
    攻击者获取管理员凭据后可借助管理共享投放工具或窃取文件。
  remediation: |
    禁用不需要的管理共享，并限制远程管理访问来源。
  tags: windows,shares,administrative,code,windows-audit

self-contained: true

code:
  - pre-condition: |
      IsWindows();
    engine:
      - powershell
      - powershell.exe
    args:
      - -ExecutionPolicy
      - Bypass
    pattern: "*.ps1"
    source: |
      $Share = Get-SmbShare -Name C$
      Write-Host "Administrative Share Found: $($Share.Name)"

    matchers:
      - type: word
        words:
          - "Administrative Share Found: C$"
