id: ngsurvey-panel

info:
  name: ngSurvey 登录面板识别（暴露面识别）
  author: righettod
  severity: info
  description: |
    该模板通过识别 ngSurvey 登录入口的页面标题、特征文本或重定向行为，判断目标是否暴露了对应的认证界面。若命中，说明该登录面板对外可访问，可用于暴露面梳理与后续安全评估。
  reference:
    - https://www.ngsurvey.com/
  metadata:
    max-request: 1
    verified: true
    shodan-query: http.title:"ngSurvey enterprise survey software"
  tags: panel,ngsurvey,login,detect,discovery

http:
  - method: GET
    path:
      - "{{BaseURL}}/home/login"

    matchers:
      - type: dsl
        dsl:
          - 'status_code == 200'
          - 'contains_all(to_lower(body), "<title>ngsurvey enterprise survey software</title>", "ngsconfig.js")'
        condition: and
