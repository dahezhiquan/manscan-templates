id: lighttpd-default

info:
  name: lighttpd 指纹识别（指纹识别）
  author: dhiyaneshDK
  severity: info
  description: >-
    lighttpd 是轻量级 Web 服务器，常用于资源受限设备、嵌入式环境和高性能静态服务。该模板通过请求目标服务并检查预设路径或首页响应、页面正文关键字、状态码等指纹特征，判断目标是否使用或暴露了
    lighttpd 相关组件；命中结果仅表示指纹特征匹配，可用于资产盘点、技术栈识别和后续安全评估，不代表已确认存在可利用漏洞。
  classification:
    cpe: cpe:2.3:a:lighttpd:lighttpd:*:*:*:*:*:*:*:*
  metadata:
    max-request: 1
    vendor: lighttpd
    product: lighttpd
    shodan-query: http.title:"Powered by lighttpd"
  tags: tech,lighttpd,discovery
http:
  - method: GET
    path:
      - '{{BaseURL}}'

    matchers-condition: and
    matchers:
      - type: word
        words:
          - "<title>Powered by lighttpd</title>"

      - type: status
        status:
          - 200
