id: fastchat-panel

info:
  name: 检测 FastChat 面板（暴露面识别）
  author: rxerium
  severity: info
  description: |-
    检测到 FastChat——由 LMSYS 开发的开放平台，用于训练、部署和评估基于大语言模型的聊天机器人（被 Vicuna 和 Chatbot Arena 使用）。发现一个暴露在公网、无需认证的 FastChat 基于 Gradio 的 Web 演示实例（"Chat with Open Large Language Models"）。
  reference:
    - https://github.com/lm-sys/FastChat
    - https://github.com/lm-sys/FastChat/blob/main/fastchat/serve/gradio_web_server.py
  metadata:
    verified: true
    max-request: 1
    vendor: lm-sys
    product: fastchat
    shodan-query: 'html:"notice_markdown" html:"Chat with Open Large Language Models"'
  tags: panel,fastchat,llm,ai,detect,discovery

http:
  - method: GET
    path:
      - "{{BaseURL}}"

    host-redirects: true
    max-redirects: 2

    matchers-condition: and
    matchers:
      - type: word
        part: body
        words:
          - "Chat with Open Large Language Models"
          - "notice_markdown"
        condition: and

      - type: status
        status:
          - 200
