id: suse-manager-panel

info:
  name: SUSE Manager Server 面板（指纹识别）
  severity: info
  author: darses
  description: |
    该模板通过识别 SUSE Manager Server 登录入口的页面标题、特征文本或重定向行为，判断目标是否暴露了对应的认证界面。若命中，说明该登录面板对外可访问，可用于暴露面梳理与后续安全评估。
  metadata:
    verify: true
    shodan-query:
      - title:"SUSE Manager - Sign In"
      - title:"SUSE Multi-Linux Manager - Sign In"
      - title:"Uyuni - Sign In"
      - http.favicon.hash:1158194469
    fofa-query:
      - title="SUSE Manager - Sign In"
      - title="SUSE Multi-Linux Manager - Sign In"
      - title="Uyuni - Sign In"
      - icon_hash="1158194469"
  tags: panel,detect,suse,login,discovery

http:
  - method: GET
    path:
      - "{{BaseURL}}"

    redirects: true
    max-redirects: 1

    matchers-condition: and
    matchers:
      - type: word
        words:
          - "<title>SUSE Manager - Sign In</title>"
          - "<title>SUSE Multi-Linux Manager - Sign In</title>"
          - "<title>Uyuni - Sign In</title>"
        condition: or

      - type: status
        status:
          - 200

    extractors:
      - type: regex
        group: 1
        regex:
          - "webVersion:\\s+'([\\d\\.\\s\\w]+)',"
