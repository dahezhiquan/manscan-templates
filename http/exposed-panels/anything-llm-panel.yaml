id: anything-llm-panel

info:
  name: AnythingLLM 面板识别（指纹识别）
  author: rxerium
  severity: info
  description: |-
    检测到目标站点存在 AnythingLLM 相关响应特征。AnythingLLM 是面向企业和个人的私有化 LLM 应用平台，用于接入模型、知识库、工作区和聊天应用。模板请求 `/`，并通过页面标题或正文关键字、状态码确认该系统指纹，用于资产识别、系统盘点和暴露面梳理。
  reference:
    - https://github.com/Mintplex-Labs/anything-llm
    - https://anythingllm.com/
  metadata:
    verified: true
    max-request: 1
    vendor: mintplex-labs
    product: anything-llm
    shodan-query: http.title:"AnythingLLM | Your personal LLM trained on anything"
  tags: panel,anything-llm,detect,discovery,ai,llm
http:
  - method: GET
    path:
      - "{{BaseURL}}"

    host-redirects: true
    max-redirects: 2

    matchers-condition: and
    matchers:
      - type: word
        part: body
        words:
          - "AnythingLLM | Your personal LLM trained on anything"

      - type: status
        status:
          - 200
