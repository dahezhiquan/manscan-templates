id: showdoc-default-login

info:
  name: Showdoc 默认口令登录（弱口令）
  author: pikpikcu
  severity: medium
  description: |
    该模板用于检测 Showdoc 是否仍可使用默认凭据或弱口令登录。模板主要向 `/server/index.php?s=/api/user/login` 等认证入口发送请求，使用内置默认凭据组合进行认证尝试，并根据响应中的 `"username":"showdoc"`、`"user_token":` 等登录成功特征判断登录是否成功；命中说明目标未及时修改出厂、示例或初始化账号口令。
  impact: |
    - 攻击者可登录 Showdoc 后台，管理内容、用户、插件、主题、文件、表单或业务流程配置。
    - 后台权限被滥用后，可能导致页面篡改、恶意文件上传、敏感资料泄露，或进一步取得服务器执行能力。
  remediation: |
    - 立即修改默认管理员凭据，删除安装向导、演示账号和不必要的后台用户。
    - 限制后台登录入口访问来源，启用多因素认证、登录失败锁定和验证码等防护。
    - 检查近期内容、插件、主题、文件上传和管理员操作记录，确认没有持久化后门。
  reference:
    - https://blog.star7th.com/2016/05/2007.html
  classification:
    cvss-metrics: CVSS:3.0/AV:N/AC:L/PR:N/UI:N/S:C/C:L/I:N/A:N
    cvss-score: 5.8
    cwe-id: CWE-522
  metadata:
    max-request: 1
  tags: showdoc,default-login,vuln

http:
  - raw:
      - |
        POST /server/index.php?s=/api/user/login HTTP/1.1
        Host: {{Hostname}}
        Content-Type: application/x-www-form-urlencoded;charset=UTF-8

        username={{username}}&password={{password}}&v_code=

    payloads:
      username:
        - showdoc
      password:
        - 123456
    attack: pitchfork

    matchers-condition: and
    matchers:
      - type: word
        words:
          - '"username":"showdoc"'
          - '"user_token":'
        condition: and

      - type: status
        status:
          - 200
