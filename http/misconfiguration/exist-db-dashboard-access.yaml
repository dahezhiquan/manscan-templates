id: exist-db-dashboard-access

info:
  name: eXist 数据库 仪表盘 访问
  author: ritikchaddha
  severity: high
  description: |
    检测到 eXist 数据库 仪表盘 访问。目标响应或文件中可能暴露配置、凭据、密钥、令牌、环境变量或历史记录等敏感信息，可能被用于进一步入侵。
  reference:
    - https://exist-db.org/
  metadata:
    verified: true
    max-request: 2
    shodan-query: title:"eXist db"
    fofa-query: title="eXist db"
  tags: misconfig,exist-db,dashboard,login,exposure

variables:
  username: "admin"

http:
  - raw:
      - |
        POST /exist/apps/dashboard/login HTTP/1.1
        Host: {{Hostname}}
        Content-Type: application/x-www-form-urlencoded

        user={{username}}&password=

    matchers-condition: and
    matchers:
      - type: regex
        regex:
          - 'user"\s*:\s*"admin"'
          - 'dba"\s*:\s*"true"'
        condition: and

      - type: word
        part: content_type
        words:
          - "application/xml"

      - type: status
        status:
          - 200
