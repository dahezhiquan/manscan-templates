id: oracle-httpserver12c

info:
  name: Oracle HTTP Server 12c 指纹识别（指纹识别）
  author: tess,dhiyaneshDK
  severity: info
  description: >-
    Oracle HTTP Server 12c 是 Oracle 基于 Apache 的 Web 服务器组件，常与 Oracle Fusion Middleware
    配套部署。该模板通过请求目标服务并检查预设路径或首页响应、页面正文关键字、HTTP 响应头、状态码等指纹特征，判断目标是否使用或暴露了 Oracle HTTP
    Server 12c 相关组件；命中结果仅表示指纹特征匹配，可用于资产盘点、技术栈识别和后续安全评估，不代表已确认存在可利用漏洞。
  metadata:
    verified: true
    max-request: 1
    shodan-query: http.html:"Oracle HTTP Server"
  tags: tech,oracle,httpserver,discovery
http:
  - method: GET
    path:
      - '{{BaseURL}}'

    matchers-condition: and
    matchers:
      - type: word
        part: body
        words:
          - '<title>Oracle HTTP Server 12c</title>'

      - type: word
        part: header
        words:
          - "text/html"

      - type: status
        status:
          - 200
