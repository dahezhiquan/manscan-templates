id: vikunja-panel

info:
  name: Vikunja 登录面板识别（暴露面识别）
  author: matheusalbarello
  severity: info
  description: |
    该模板通过识别 Vikunja 登录入口的页面标题、特征文本或重定向行为，判断目标是否暴露了对应的认证界面。若命中，说明该登录面板对外可访问，可用于暴露面梳理与后续安全评估。
  reference:
    - https://vikunja.io
    - https://github.com/go-vikunja/vikunja
  metadata:
    verified: true
    max-request: 1
    vendor: vikunja
    product: vikunja
    shodan-query: http.title:"vikunja"
    fofa-query: title="Vikunja"
  tags: panel,vikunja,login,discovery

http:
  - method: GET
    path:
      - "{{BaseURL}}"

    matchers-condition: and
    matchers:
      - type: word
        part: header
        words:
          - "Server: Vikunja"

      - type: word
        part: body
        words:
          - "<title>Vikunja</title>"
          - "The to-do app to organize your life"
        condition: and

      - type: status
        status:
          - 200
