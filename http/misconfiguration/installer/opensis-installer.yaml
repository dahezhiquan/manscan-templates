id: opensis-installer

info:
  name: openSIS 安装 Wizard
  author: DhiyaneshDk
  severity: high
  description: |
    检测到 openSIS 安装 Wizard。该页面属于安装、初始化或配置向导流程，若对外暴露，攻击者可能完成初始化、创建管理员账户或重新配置目标系统。
  classification:
    cpe: cpe:2.3:a:os4ed:opensis:*:*:*:*:*:*:*:*
  metadata:
    verified: true
    max-request: 1
    vendor: os4ed
    product: opensis
    shodan-query: title:"openSIS"
  tags: misconfig,opensis,install,exposure,vuln

http:
  - method: GET
    path:
      - "{{BaseURL}}/install/index.php"

    matchers-condition: and
    matchers:
      - type: word
        part: body
        words:
          - "openSIS Installer"

      - type: word
        part: header
        words:
          - "text/html"

      - type: status
        status:
          - 200
