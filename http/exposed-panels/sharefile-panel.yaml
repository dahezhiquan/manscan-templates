id: sharefile-panel

info:
  name: Sharefile Login 面板（暴露面识别）
  author: irshad ahamed
  severity: info
  description: |
    该模板通过识别 Sharefile Login 登录入口的页面标题、特征文本或重定向行为，判断目标是否暴露了对应的认证界面。若命中，说明该登录面板对外可访问，可用于暴露面梳理与后续安全评估。
  reference:
    - https://www.sharefile.com/
  classification:
    cpe: cpe:2.3:a:citrix:sharefile:*:*:*:*:*:*:*:*
  metadata:
    verified: true
    max-request: 1
    vendor: citrix
    product: sharefile
    shodan-query:
      - title:"ShareFile Login"
      - http.title:"sharefile login"
    fofa-query: title="sharefile login"
    google-query: intitle:"sharefile login"
  tags: sharefile,login,panel,detect,citrix,discovery

http:
  - method: GET
    path:
      - "{{BaseURL}}/Authentication/Login"

    matchers-condition: and
    matchers:
      - type: word
        words:
          - 'ShareFile Login'
          - 'password'
        condition: and

      - type: status
        status:
          - 200
