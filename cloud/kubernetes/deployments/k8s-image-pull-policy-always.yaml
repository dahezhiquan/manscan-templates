id: k8s-image-pull-policy-always

info:
  name: Image Pull 策略 set to Always（云安全）
  author: princechaddha
  severity: low
  description: 该规则用于检查 Kubernetes deployments 相关身份、权限或口令安全策略是否符合最小权限和强认证要求，避免因过度授权或弱认证导致资源被滥用。
  impact: |
    - 过度授权、弱口令策略或缺少 MFA 会显著提升账户被滥用的风险。
    - 一旦身份被攻破，攻击者可能借助合法权限直接访问或控制云资源。
  remediation: |
    - 落实最小权限原则，收敛高危权限、通配授权和不必要的管理员能力。
    - 对关键账户和控制台访问强制启用 MFA，并完善口令复杂度、轮换与重用限制策略。
  reference:
    - https://kubernetes.io/docs/concepts/containers/images/#updating-images
  tags: cloud,devops,kubernetes,k8s,devsecops,deployments,images,docker,k8s-cluster-security

flow: |
  code(1);
  for (let deployment of template.items) {
    set("deployment",deployment)
    javascript(1);
  }

self-contained: true

code:
  - engine:
      - sh
      - bash
    source: kubectl get deployments --all-namespaces --output=json
    extractors:
      - type: json
        name: items
        internal: true
        json:
          - '.items[]'

javascript:
  - code: |
        deployment = JSON.parse(template.deployment);
        if (!deployment.spec.template.spec.containers.every(container => container.imagePullPolicy === 'Always')) {
          let result = (`Deployment '${deployment.metadata.name}' in namespace '${deployment.metadata.namespace}' does not have image pull policy set to Always.`);
          Export(result);
        }

    extractors:
      - type: dsl
        dsl:
          - response
