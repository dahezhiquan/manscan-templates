id: privesc-rlwrap

info:
  name: rlwrap 可被滥用进行本地提权（本地基线扫描）
  author: daffainfo
  severity: high
  description: |
    该模板基于 GTFOBins 思路检测 `rlwrap` 是否可在本地被滥用于提权。模板会对比当前用户与直接/通过 sudo 执行 `rlwrap` 后的身份，判断该二进制是否可能以 root 权限运行命令。
  reference:
    - https://gtfobins.github.io/gtfobins/rlwrap/
  metadata:
    verified: true
    max-request: 3
  tags: code,linux,rlwrap,privesc,local

self-contained: true
code:
  - engine:
      - sh
      - bash
    source: |
      whoami

  - engine:
      - sh
      - bash
    source: |
      rlwrap whoami

  - engine:
      - sh
      - bash
    source: |
      sudo rlwrap whoami

    matchers-condition: and
    matchers:
      - type: word
        part: code_1_response
        words:
          - "root"
        negative: true

      - type: dsl
        dsl:
          - 'contains(code_2_response, "root")'
          - 'contains(code_3_response, "root")'
        condition: or
