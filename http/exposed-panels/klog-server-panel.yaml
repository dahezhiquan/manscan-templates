id: klog-server-panel

info:
  name: Klog Server 面板识别（指纹识别）
  author: s4e-io
  severity: info
  description: |-
    检测到目标站点存在 Klog Server 相关响应特征。Klog Server 是监控、日志、分析或可观测性系统，用于展示运行指标、告警事件、日志数据和服务状态。模板请求 `/login.php`，并通过页面标题或正文关键字、状态码、DSL 条件确认该系统指纹，用于资产识别、系统盘点和暴露面梳理。
  reference:
    - https://www.klogserver.com/
  metadata:
    max-request: 1
    vendor: klogserver
    product: klog_server
  tags: panel,login,klog-server,detect,discovery
http:
  - method: GET
    path:
      - "{{BaseURL}}/login.php"

    matchers:
      - type: dsl
        dsl:
          - 'contains(body, "<title>KLog Server")'
          - 'status_code == 200'
        condition: and
