id: aws-access-key

info:
  name: Amazon Web Services 访问密钥 ID 泄露检测（本地文件安全扫描）
  author: gaurang
  severity: info
  description: |
    该模板检测文件中暴露的 Amazon Web Services Access Key ID。此类凭据一旦泄露，可能被用于访问对应云服务、代码仓库、SaaS 平台或业务接口。
  classification:
    cvss-metrics: CVSS:3.1/AV:N/AC:L/PR:N/UI:N/S:U/C:N/I:N/A:N
    cvss-score: 0
    cwe-id: CWE-200
  tags: file,keys,token,aws,amazon

file:
  - extensions:
      - all

    extractors:
      - type: regex
        regex:
          - "(A3T[A-Z0-9]|AKIA|AGPA|AROA|AIPA|ANPA|ANVA|ASIA)[A-Z0-9]{16}"
