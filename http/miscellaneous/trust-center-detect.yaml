id: trust-center-detect

info:
  name: 信任中心页面检测
  author: ajdumanhug
  severity: low
  description: |
    检测由 Safebase、Vanta 或 TrustCloud 等平台提供的 Trust Center 页面或子域名。该页面通常用于展示安全、合规和隐私资料。
  impact: |
    - 命中内容可用于资产画像、人员/社群关联、公开目录发现或业务线索收集。
    - 单独结果通常不等同于漏洞，但与其他信息组合后可能降低攻击者侦察成本。
  remediation: |
    - 确认公开信息是否符合预期，移除不必要的联系人、目录、社群或资源索引。
    - 对必须公开的文件和链接进行最小化披露，避免包含内部路径或敏感标识。
    - 定期巡检公开页面，确保内容仍然准确且未泄露额外信息。
  metadata:
    verified: true
    max-request: 6
    shodan-query: http.title:"Trust Center"
  tags: misc,trust,center,generic,vuln

http:
  - method: GET
    path:
      - "{{BaseURL}}"
      - "{{BaseURL}}/trust"
      - "{{BaseURL}}/trust-center"
      - "{{BaseURL}}/trust-center.html"
      - "{{BaseURL}}/security"
      - "{{BaseURL}}/compliance"

    stop-at-first-match: true
    redirects: true
    max-redirects: 2

    matchers-condition: and
    matchers:
      - type: word
        words:
          - "Trust Center"
          - "Powered by Safebase"
          - "TrustShare Overview"
          - "static.vanta.com/static/entry-trust-report.js"
        condition: or
        case-insensitive: true

      - type: status
        status:
          - 200
