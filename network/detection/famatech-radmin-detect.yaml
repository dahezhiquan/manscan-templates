id: famatech-radmin-detect

info:
  name: Famatech Radmin 识别（指纹识别）
  author: matejsmycka
  severity: info
  description: |
    Famatech Radmin 是 Windows 远程控制和远程管理软件，用于桌面控制、文件传输和运维支持。该模板连接 4899/TCP，通过匹配 `0100000009` 等二进制响应特征识别目标服务。
  reference:
    - https://www.famatech.com/
    - https://seclists.org/nmap-dev/2008/q1/89
  metadata:
    verified: true
    max-request: 1
    shodan-query: port:4899 product:"Famatech Radmin"
  tags: network,detect,tcp,famatech,radmin,discovery

tcp:
  - inputs:
      - data: "\x01\x00\x00\x00\x01\x00\x00\x00\x08\x08"

    host:
      - "{{Hostname}}"
    port: 4899
    read-size: 1024

    matchers:
      - type: binary
        binary:
          - "0100000009"
