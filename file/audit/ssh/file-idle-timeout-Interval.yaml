id: file-idle-timeout-interval

info:
  name: SSH 空闲会话超时未设置（本地文件安全扫描）
  author: pussycat0x
  severity: unknown
  description: |
    该模板检查 SSH ClientAliveInterval 等空闲超时配置。缺少超时会让无人值守会话长期保持开放。
  remediation: |
    在 /etc/ssh/sshd_config 中设置 ClientAliveInterval 300 和 ClientAliveCountMax 0，并重启 SSH 服务。
  reference:
    - https://vishalraj82.medium.com/hardening-openssh-security-37f5d634015f
    - https://support.forcepoint.com/s/article/000015900
  metadata:
    verified: true
  tags: audit,config,file,ssh

file:
  - extensions:
      - all

    matchers-condition: and
    matchers:
      - type: word
        words:
          - "# This is the sshd server system-wide configuration file"

      - type: word
        words:
          - "ClientAliveInterval"
          - "ClientAliveCountMax"
        condition: or
        negative: true
