id: sso-pomerium-detect

info:
  name: Pomerium 指纹识别（指纹识别）
  author: rxerium
  severity: info
  description: >-
    Pomerium 是身份感知访问代理，用于基于用户身份和策略保护内部 Web 应用。该模板通过请求目标服务并检查预设路径或首页响应、页面正文关键字、状态码等指纹特征，判断目标是否使用或暴露了
    Pomerium 相关组件；命中结果仅表示指纹特征匹配，可用于资产盘点、技术栈识别和后续安全评估，不代表已确认存在可利用漏洞。
  reference:
  - https://www.pomerium.com/
  metadata:
    max-request: 1
    verified: true
    shodan-query: html:"pomerium"
  tags: pomerium,sso,detect,tech,discovery
http:
  - method: GET
    path:
      - "{{BaseURL}}/.pomerium/index.js"

    matchers-condition: and
    matchers:
      - type: word
        part: body
        words:
          - "https://pomerium.com/docs"
          - "https://discuss.pomerium.com"
        condition: and

      - type: word
        part: content_type
        words:
          - "text/javascript"

      - type: status
        status:
          - 200
