id: mail-imap-detect

info:
  name: IMAP 识别（指纹识别）
  author: pussycat0x
  severity: info
  description: |
    IMAP 是邮件访问协议，用于客户端在服务器端读取、同步和管理邮箱内容。该模板连接 143/TCP 并读取协议响应，通过匹配 `OK `、`IMAP4rev1` 等响应特征识别目标服务。
  classification:
    cvss-metrics: CVSS:3.1/AV:N/AC:L/PR:N/UI:N/S:U/C:N/I:N/A:N
    cwe-id: CWE-200
  metadata:
    verified: true
    max-request: 1
    shodan-query: imap
  tags: network,detect,imap,mail,tcp,discovery
tcp:
  - inputs:
      - data: "\n"

    host:
      - "{{Hostname}}"
    port: 143

    matchers-condition: and
    matchers:
      - type: word
        words:
          - "OK "
          - "IMAP4rev1"
        condition: and
