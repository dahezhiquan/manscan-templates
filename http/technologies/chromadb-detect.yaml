id: chromadb-detect

info:
  name: ChromaDB Vector Database 指纹识别（指纹识别）
  author: rxerium
  severity: info
  description: |-
    ChromaDB Vector Database 是向量数据库，用于嵌入向量存储、相似度检索和 AI 应用知识库。该模板请求首页，并依据页面标题、正文关键字或品牌资源特征、DSL 条件识别目标是否使用或暴露了 ChromaDB Vector Database 相关组件，适用于资产盘点、技术栈识别和后续安全评估；命中结果仅表示指纹特征匹配，不代表已确认存在可利用漏洞。
  reference:
  - https://docs.trychroma.com/
  metadata:
    verified: true
    max-request: 1
    vendor: chroma-core
    product: chromadb
    shodan-query: 'http.html:"nanosecond heartbeat"'
    fofa-query: 'body="nanosecond heartbeat"'
  tags: chromadb,vector-database,ai,exposure,detect,discovery

http:
  - raw:
      - |
        GET /api/v1/heartbeat HTTP/1.1
        Host: {{Hostname}}

    host-redirects: true
    max-redirects: 2

    matchers-condition: and
    matchers:
      - type: word
        part: body
        words:
          - "nanosecond heartbeat"

      - type: dsl
        dsl:
          - status_code == 200
          - contains(content_type, "application/json")
        condition: and

    extractors:
      - type: regex
        name: version
        part: body
        regex:
          - '"nanosecond heartbeat":\s*([0-9]+)'
