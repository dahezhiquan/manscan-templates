id: cube-105-install

info:
  name: Cube 105 暴露 安装
  author: ritikchaddha
  severity: high
  description: |
    检测到 Cube 105 暴露 安装。该页面属于安装、初始化或配置向导流程，若对外暴露，攻击者可能完成初始化、创建管理员账户或重新配置目标系统。
  metadata:
    verified: true
    max-request: 1
    fofa-query: title="Cube-105 Setup Wizard"
  tags: misconfig,cube,cube105,install,vuln

http:
  - method: GET
    path:
      - "{{BaseURL}}/wizard/wizard.cs"

    matchers-condition: and
    matchers:
      - type: word
        words:
          - 'Cube-105 Setup Wizard'
          - 'initial setup'
        condition: and

      - type: status
        status:
          - 200
