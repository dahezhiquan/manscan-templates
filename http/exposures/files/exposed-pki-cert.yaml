id: exposed-pki-cert

info:
  name: 暴露 Internal PKI Infrastructure 检测（暴露面识别）
  author: nullenc0de
  severity: high
  description: |
    检测到对外可访问的 暴露 Internal PKI Infrastructure。相关文件可能泄露项目结构、依赖关系、部署细节、敏感参数或其他不应公开的内部信息。
  metadata:
    verified: true
    max-request: 10
  tags: pki,exposure,misconfig,vuln

http:
  - method: GET
    path:
      - "{{BaseURL}}{{paths}}"

    payloads:
      paths:
        - "/"
        - "/certsrv/"
        - "/pki/"
        - "/PKI/"
        - "/crl/"
        - "/CRL/"
        - "/.well-known/pki-validation/"
        - "/ocsp/"
        - "/CertEnroll/"
        - "/CertSrv/"

    stop-at-first-match: true
    host-redirects: true
    max-redirects: 2

    matchers-condition: or
    matchers:
      - type: dsl
        dsl:
          - 'contains_any(body, "Certificate Services", "CRL Distribution Point", "OCSP Responder")'
          - '!regex("(?i)^\\s*This is an OCSP responder\\.?\\s*$", body)'
        condition: and

      - type: regex
        regex:
          - '\\bCN=[A-Za-z0-9-]+-CA\\b'
          - '(?i)href\s*=\s*"[^"]+\.(?:crl|cer|p7b)"'

    extractors:
      - type: regex
        name: certificate_details
        regex:
          - 'CN=[A-Za-z0-9-]+-CA'
          - 'O=[A-Za-z0-9 ]+'
          - 'OU=[A-Za-z0-9 ]+'
