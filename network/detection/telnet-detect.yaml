id: telnet-detect

info:
  name: Telnet 识别（指纹识别）
  author: dahezhiquan
  severity: info
  description: |
    Telnet 是传统远程终端协议，用于网络设备、嵌入式系统或旧式服务器的命令行访问。该模板连接 23/TCP 并发送 Telnet 选项协商请求，通过连续的协议协商指令或明确的 Telnet 登录提示识别目标服务。
  metadata:
    verified: true
    max-request: 1
    shodan-query: port:23 telnet
  tags: network,telnet,detect,tcp,discovery
tcp:
  - inputs:
      - data: "{{hex_decode('fffb03fffd18fffd20')}}"

    host:
      - "{{Hostname}}"
    port: 23
    read-size: 1024

    matchers-condition: or
    matchers:
      - type: word
        words:
          - "Telnet"
          - "Login authentication"
        condition: and
      - type: dsl
        dsl:
          - "regex('(ff(fb|fc|fd|fe)[0-9a-f]{2}){3}', hex_encode(data))"
      - type: word
        words:
          - "Telnet service is disabled"
