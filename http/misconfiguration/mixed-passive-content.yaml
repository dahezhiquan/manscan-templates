id: mixed-passive-content

info:
  name: 混合被动内容检测
  author: Liwermor
  severity: low
  description: |
    该模板用于核查 混合被动内容检测。该类问题通常源于配置文件、备份文件、管理页面、服务状态或敏感资源被错误暴露到 Web 访问路径。模板会向目标发送探测请求，并依据匹配 `<img[^>]*src=['"]http://[^'">]+['"]`、匹配 `<audio[^>]*src=['"]http://[^'">]+['"]`、匹配 `<video[^>]*src=['"]http://[^'">]+['"]`等证据确认目标是否存在该配置问题。
  impact: |
    - 攻击者可获取版本、路径、账号、密钥、令牌、配置或业务数据等敏感信息。
    - 泄露的信息可能被用于凭据攻击、漏洞匹配、权限提升或横向移动。
  remediation: |
    - 移除 Web 根目录下不应公开的配置、备份、日志和临时文件。
    - 为敏感页面和资源增加访问控制，并按最小暴露原则收敛公开路径。
    - 轮换已暴露的密钥、令牌和凭据，并审计异常下载或枚举行为。
  reference:
    - https://developer.mozilla.org/en-US/docs/Web/Security/Mixed_content
    - https://portswigger.net/kb/issues/01000400_mixed-content
    - https://resources.infosecinstitute.com/topics/vulnerabilities/https-mixed-content-vulnerability/
    - https://docs.gitlab.com/ee/user/application_security/dast/checks/319.1.html
  metadata:
    max-request: 1
  tags: misconfig,vuln

http:
  - method: GET
    path:
      - "{{BaseURL}}"

    host-redirects: true
    max-redirects: 3
    matchers-condition: or
    matchers:
      - type: regex
        part: body
        name: img
        regex:
          - "<img[^>]*src=['\"]http://[^'\">]+['\"]"

      - type: regex
        part: body
        name: audio
        regex:
          - "<audio[^>]*src=['\"]http://[^'\">]+['\"]"

      - type: regex
        part: body
        name: video
        regex:
          - "<video[^>]*src=['\"]http://[^'\">]+['\"]"

    extractors:
      - type: regex
        group: 1
        part: body
        regex:
          - "<img[^>]*src=['\"](http[^s'\">][^'\">]*)['\"]"
          - "<audio[^>]*src=['\"](http[^s'\">][^'\">]*)['\"]"
          - "<video[^>]*src=['\"](http[^s'\">][^'\">]*)['\"]"
