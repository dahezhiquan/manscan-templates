id: crushftp-default-login

info:
  name: CrushFTP 默认口令登录（弱口令）
  author: pussycat0x
  severity: high
  description: |
    该模板用于检测 CrushFTP 是否仍可使用默认凭据或弱口令登录。模板主要向 `/WebInterface/`、`/WebInterface/function/` 等认证入口发送请求，使用内置默认凭据组合进行认证尝试，并根据响应中的 `<response>success</response>`、`text/xml` 等登录成功特征判断登录是否成功；命中说明目标未及时修改出厂、示例或初始化账号口令。
  impact: |
    - 攻击者可使用默认凭据登录 CrushFTP，获得与该账号对应的管理或业务权限。
    - 成功登录后可能进一步查看敏感信息、修改配置、创建账号、调用管理接口，或以该系统为入口访问内网其他资源。
  remediation: |
    - 立即修改或禁用默认账号，要求所有账户使用高强度唯一密码。
    - 将登录入口限制在可信网络范围内，并启用多因素认证、登录失败限制和异常登录告警。
    - 审计近期登录、配置变更和账号新增记录，必要时轮换相关密钥、令牌和业务凭据。
  classification:
    cpe: cpe:2.3:a:crushftp:crushftp:*:*:*:*:*:*:*:*
  metadata:
    verified: true
    max-request: 2
    vendor: crushftp
    product: crushftp
    shodan-query: html:"CrushFTP"
  tags: default-login,crushftp,vuln

http:
  - raw:
      - |
        GET /WebInterface/ HTTP/1.1
        Host: {{Hostname}}
      - |
        POST /WebInterface/function/ HTTP/1.1
        Host: {{Hostname}}
        Origin: {{RootURL}}
        Referer: {{RootURL}}/WebInterface/login.html

        command=login&username={{username}}&password={{password}}&encoded=true&language=en&random=0.34712915617878926

    attack: pitchfork
    payloads:
      username:
        - crushadmin
      password:
        - crushadmin
    stop-at-first-match: true

    matchers-condition: and
    matchers:
      - type: word
        part: body_2
        words:
          - "<response>success</response>"

      - type: word
        part: header_2
        words:
          - "text/xml"

    extractors:
      - type: regex
        name: auth
        internal: true
        part: header_2
        group: 1
        regex:
          - 'currentAuth=([0-9a-zA-Z]+)'
