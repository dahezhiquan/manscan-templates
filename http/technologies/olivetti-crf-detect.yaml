id: olivetti-crf-detect

info:
  name: Olivetti CRF 指纹识别（指纹识别）
  author: pussycat0x
  severity: info
  description: >-
    Olivetti CRF 是 Olivetti 相关设备或服务的 Web 管理界面，用于设备配置、状态查看或业务服务访问。该模板通过请求目标服务并检查预设路径或首页响应、页面正文关键字、状态码等指纹特征，判断目标是否使用或暴露了
    Olivetti CRF 相关组件；命中结果仅表示指纹特征匹配，可用于资产盘点、技术栈识别和后续安全评估，不代表已确认存在可利用漏洞。
  metadata:
    max-request: 1
    shodan-query: http.title:"Olivetti CRF"
  tags: tech,olivetti,discovery
http:
  - method: GET
    path:
      - '{{BaseURL}}'

    matchers-condition: and
    matchers:
      - type: word
        words:
          - "<TITLE>Olivetti CRF</TITLE>"
        part: body

      - type: status
        status:
          - 200
