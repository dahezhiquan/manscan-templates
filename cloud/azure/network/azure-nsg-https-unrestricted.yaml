id: azure-nsg-https-unrestricted
info:
  name: Azure NSG 对互联网开放 HTTPS 端口 443（云安全）
  author: princechaddha
  severity: high
  description: TCP 443 通常承载 HTTPS 服务；即使流量经过加密，面向互联网开放仍意味着服务端点持续暴露于扫描、认证攻击和应用层漏洞利用。本模板查询入站允许的 TCP 443 NSG 规则，并在来源地址为 *、internet 或 any 时报告。
  impact: |
    - 公开端点可能遭受口令攻击、恶意请求、漏洞利用和资源耗尽，导致数据泄露或业务中断。
    - 若后端连接数据库、存储或管理接口，应用层被攻破后可能进一步访问云内敏感资源。
  remediation: |
    - 仅在确需公网提供服务时保留 TCP 443，并通过 WAF、身份认证、速率限制和最小权限保护应用。
    - 对管理面和内部服务改用 Private Endpoint、VPN 或受限源地址，持续审计入站请求和异常告警。
  reference:
    - https://docs.microsoft.com/en-us/azure/virtual-network/network-security-groups-overview
  metadata:
    vendor: microsoft
    product: azure-network-security-group
  tags: cloud,devops,azure,microsoft,nsg,azure-cloud-config

flow: |
  code(1);
  for (let NsgData of iterate(template.nsgdata)) {
    NsgData = JSON.parse(NsgData)
    set("nsg", NsgData.name)
    set("resourcegroup", NsgData.resourceGroup)
    code(2)
  }

self-contained: true
code:
  - engine:
      - sh
      - bash
    source: |
      az network nsg list --query '[*].{name:name, resourceGroup:resourceGroup}' --output json

    extractors:
      - type: json
        name: nsgdata
        internal: true
        json:
          - '.[]'

  - engine:
      - sh
      - bash
    source: |
      az network nsg rule list --nsg-name $nsg --resource-group $resourcegroup --query "[?direction=='Inbound' && access=='Allow' && protocol=='TCP' && (destinationPortRange=='443')]"

    matchers:
      - type: word
        words:
          - '"sourceAddressPrefix": "*"'
          - '"sourceAddressPrefix": "internet"'
          - '"sourceAddressPrefix": "any"'

    extractors:
      - type: dsl
        dsl:
          - 'nsg + " has unrestricted access on TCP port 443"'
