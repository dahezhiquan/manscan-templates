id: adminset-panel

info:
  name: Adminset 登录面板（暴露面识别）
  author: ffffffff0x
  severity: info
  description: 该模板通过识别 Adminset 登录入口的页面标题、特征文本或重定向行为，判断目标是否暴露了对应的认证界面。若命中，说明该登录面板对外可访问，可用于暴露面梳理与后续安全评估。
  classification:
    cwe-id: CWE-200
  metadata:
    max-request: 1
    fofa-query: app="AdminSet"
    reference:
      - https://github.com/guhongze/adminset/
  tags: adminset,panel,discovery

http:
  - method: GET
    path:
      - "{{BaseURL}}"

    host-redirects: true
    max-redirects: 2

    matchers-condition: and
    matchers:
      - type: word
        part: body
        words:
          - "<title>AdminSet Login</title>"

      - type: status
        status:
          - 200
