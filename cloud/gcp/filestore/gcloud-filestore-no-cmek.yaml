id: gcloud-filestore-no-cmek

info:
  name: Filestore Instance 未Using Customer-Managed 加密 Keys（云安全）
  author: princechaddha
  severity: high
  description: Filestore 实例未使用 Customer-Managed Encryption Key 时，共享文件数据无法通过客户管理密钥进行独立生命周期控制。本模板枚举实例并检查 kmsKeyName，值为 null 时报告该实例未使用 CMEK。
  impact: |
    - 敏感文件共享缺少客户侧密钥轮换、禁用和访问审计能力，可能不满足加密合规要求。
    - 多团队共享的文件存储若密钥治理不一致，会增加数据隔离和应急处置难度。
  remediation: |
    - 为敏感 Filestore 实例配置 Cloud KMS CMEK，并授予 Filestore 服务代理密钥使用权限。
    - 对现有实例制定迁移或重建计划，统一实例创建模板中的加密配置。
  reference:
    - https://www.trendmicro.com/cloudoneconformity/knowledge-base/gcp/Filestore/instances-encrypted-with-cmeks.html
    - https://cloud.google.com/filestore/docs/encryption
  metadata:
    vendor: google
    product: filestore
  tags: cloud,devops,gcp,gcloud,filestore,security,encryption,cmek,gcp-cloud-config

flow: |
  code(1)
  for(let projectId of iterate(template.projectIds)){
    set("projectId", projectId)
    code(2)
    for(let instance of iterate(template.instances)){
      instance = JSON.parse(instance)
      set("instanceName", instance.name)
      code(3)
    }
  }

self-contained: true

code:
  - engine:
      - sh
      - bash
    source: |
      gcloud projects list --format="json(projectId)"

    extractors:
      - type: json
        name: projectIds
        internal: true
        json:
          - '.[].projectId'

  - engine:
      - sh
      - bash
    source: |
      gcloud filestore instances list --project $projectId --format="json"

    extractors:
      - type: json
        name: instances
        internal: true
        json:
          - '.[]'

  - engine:
      - sh
      - bash
    source: |
      gcloud filestore instances describe $instanceName --format="json(kmsKeyName)"

    matchers:
      - type: word
        words:
          - "null"

    extractors:
      - type: dsl
        dsl:
          - '"Filestore instance " + instanceName + " in project " + projectId + " is not encrypted with Customer-Managed Keys"'
