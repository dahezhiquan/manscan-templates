id: elmah-log-file

info:
  name: ELMAH 暴露（暴露面识别）
  author: shine,idealphase
  severity: high
  description: |
    检测到可直接访问的 ELMAH。日志、异常页面或调试输出通常会泄露堆栈信息、内部路径、查询语句、账号标识、令牌片段或业务数据，不应向未授权用户开放。
  reference:
    - https://code.google.com/archive/p/elmah/
    - https://www.troyhunt.com/aspnet-session-hijacking-with-google/
  metadata:
    verified: true
    max-request: 2
  tags: logs,elmah,exposure,vuln

http:
  - method: GET
    path:
      - "{{BaseURL}}/elmah"
      - "{{BaseURL}}/elmah.axd"

    stop-at-first-match: true
    host-redirects: true
    max-redirects: 2

    matchers-condition: and
    matchers:
      - type: word
        words:
          - 'Error Log for'

      - type: status
        status:
          - 200
