id: squid-analysis-report-generator

info:
  name: Squid Analysis Report Generator 泄露（暴露面识别）
  author: geeknik
  severity: high
  description: 检测到可直接访问的 Squid Analysis Report Generator。日志、异常页面或调试输出通常会泄露堆栈信息、内部路径、查询语句、账号标识、令牌片段或业务数据，不应向未授权用户开放。
  reference:
    - https://sourceforge.net/projects/sarg/
  metadata:
    max-request: 1
  tags: sarg,exposure,logs,vuln

http:
  - method: GET
    path:
      - "{{BaseURL}}"

    matchers-condition: and
    matchers:
      - type: word
        part: body
        words:
          - "Squid User Access Report"
          - "Squid User's Access Report"
        condition: or

      - type: word
        part: body
        words:
          - "<td>Daily reports"
          - "FILE/PERIOD"
        condition: or

    extractors:
      - type: regex
        part: body
        regex:
          - sarg-[0-99].[0-99].[0-99]
