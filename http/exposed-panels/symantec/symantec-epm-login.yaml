id: symantec-epm-login

info:
  name: Symantec Endpoint Protection Manager 登录面板识别（暴露面识别）
  author: princechaddha
  severity: info
  description: 该模板通过识别 Symantec Endpoint Protection Manager 登录入口的页面标题、特征文本或重定向行为，判断目标是否暴露了对应的认证界面。若命中，说明该登录面板对外可访问，可用于暴露面梳理与后续安全评估。
  classification:
    cvss-metrics: CVSS:3.0/AV:N/AC:L/PR:N/UI:N/S:U/C:N/I:N/A:N
    cwe-id: CWE-200
    cpe: cpe:2.3:a:symantec:endpoint_protection_manager:*:*:*:*:*:*:*:*
  metadata:
    max-request: 1
    vendor: symantec
    product: endpoint_protection_manager
    shodan-query:
      - http.title:"Symantec Endpoint Protection Manager"
      - http.title:"symantec endpoint protection manager"
    fofa-query: title="symantec endpoint protection manager"
    google-query: intitle:"symantec endpoint protection manager"
  tags: symantec,panel,login,discovery

http:
  - method: GET
    path:
      - '{{BaseURL}}'

    matchers-condition: and
    matchers:
      - type: word
        words:
          - "<title>Symantec Endpoint Protection Manager</title>"
        part: body

      - type: status
        status:
          - 200
