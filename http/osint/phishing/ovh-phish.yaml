id: ovh-phish

info:
  name: OVHcloud 仿冒钓鱼网站（钓鱼网站识别）
  author: rxerium
  severity: info
  description: |
    检测到疑似仿冒 OVHcloud 的钓鱼网站。模板在目标页面返回 200、页面内容命中 OVHcloud 的官方服务页面特征，且当前主机不属于 ovhcloud.com、ovh.com 官方域名时触发，用于识别借用 OVHcloud 品牌页面诱导用户信任的仿冒站点。
  reference:
    - https://ovhcloud.com
  metadata:
    max-request: 1
  tags: phishing,ovh,cloud,hosting,osint,discovery
http:
  - method: GET
    path:
      - "{{BaseURL}}"

    host-redirects: true
    max-redirects: 2

    matchers-condition: and
    matchers:
      - type: word
        words:
          - '<title>Global Cloud Service Provider'

      - type: status
        status:
          - 200

      - type: dsl
        dsl:
          - '!contains(host,"ovhcloud.com")'
          - '!contains(host,"ovh.com")'
