id: microsoft-ftp-service

info:
  name: Microsoft FTP 服务识别（指纹识别）
  author: pussycat0x
  severity: info
  description: |
    Microsoft FTP Service 是 Windows/IIS 生态中的 FTP 服务组件，用于文件发布和传输。该模板连接 21/TCP 并读取协议响应，通过匹配 `Microsoft FTP Service` 等响应特征识别目标服务。
  metadata:
    verified: true
    max-request: 1
    shodan-query: Microsoft FTP Service
  tags: network,ftp,microsoft,detect,tcp,discovery
tcp:

  - inputs:
      - data: "\n"
    host:
      - "{{Hostname}}"
    port: 21

    matchers:
      - type: word
        words:
          - "Microsoft FTP Service"
