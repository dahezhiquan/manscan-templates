id: redhat-infinispan-detect

info:
  name: Red Hat Infinispan Console 指纹识别（指纹识别）
  author: DhiyaneshDk
  severity: info
  description: >-
    Red Hat Infinispan Console 是分布式缓存和数据网格的管理界面，用于查看缓存、集群和运行状态。该模板通过请求目标服务并检查预设路径或首页响应、DSL
    条件、正则特征等指纹特征，判断目标是否使用或暴露了 Red Hat Infinispan Console 相关组件；命中结果仅表示指纹特征匹配，可用于资产盘点、技术栈识别和后续安全评估，不代表已确认存在可利用漏洞。
  reference:
  - https://infinispan.org/
  - https://infinispan.org/docs/stable/titles/rest/rest.html
  - https://github.com/infinispan/infinispan
  classification:
    cpe: cpe:/a:redhat:infinispan
  metadata:
    max-request: 2
    vendor: redhat
    product: infinispan
    shodan-query: title:"Infinispan"
    fofa-query: title="Infinispan" || body="/console/main.bundle.js"
  tags: tech,detect,infinispan,redhat
http:
  - method: GET
    path:
      - "{{BaseURL}}/console/welcome"
      - "{{BaseURL}}/rest/v2/cache-managers/default"

    stop-at-first-match: true

    redirects: true
    max-redirects: 2

    matchers-condition: or
    matchers:
      - type: dsl
        name: console
        dsl:
          - 'status_code == 200'
          - 'contains_all(body, "<title>Console</title>", "/console/main.bundle.js", "pf-m-redhat-font")'
        condition: and

      - type: dsl
        name: rest-api
        dsl:
          - 'status_code == 401'
          - 'contains_all(tolower(header), "www-authenticate", "digest realm=\"default\"")'
        condition: and

    extractors:
      - type: regex
        name: version
        part: body
        group: 1
        regex:
          - '"version"\s*:\s*"([0-9.]+(?:\.[A-Za-z0-9-]+)?)"'
