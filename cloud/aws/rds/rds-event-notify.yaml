id: rds-event-notify
info:
  name: RDS 事件通知缺失（云安全）
  author: princechaddha
  severity: medium
  description: RDS 事件订阅可将实例、集群、安全组或快照事件发送到通知渠道，帮助及时发现故障、配置变化和安全相关事件。该模板检查 EventSubscriptionsList 是否为空。
  impact: |
    - 数据库故障、备份失败、配置变化或安全组事件可能无法及时通知运维和安全团队。
    - 事件响应依赖人工巡检，容易延误故障恢复和安全调查。
  remediation: |
    - 创建 RDS event subscription，并将关键事件发送到 SNS 或集中告警平台。
    - 覆盖生产实例、集群、快照和安全组等关键 source type，并定期验证通知链路。
  reference:
    - https://docs.aws.amazon.com/AmazonRDS/latest/UserGuide/USER_Events.html
  metadata:
    vendor: amazon
    product: rds
  tags: cloud,devops,aws,amazon,rds,aws-cloud-config
variables:
  region: "ap-northeast-1"

self-contained: true
code:
  - engine:
      - sh
      - bash
    source: |
      aws rds describe-event-subscriptions --region $region --query 'EventSubscriptionsList'

    matchers:
      - type: word
        words:
          - '[]'

    extractors:
      - type: dsl
        dsl:
          - '"No event notifications for RDS resources in " + region + " AWS region"'
