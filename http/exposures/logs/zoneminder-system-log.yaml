id: zoneminder-system-log

info:
  name: zm-system-log-检测（暴露面识别）
  author: pussycat0x
  severity: low
  description: 检测到可直接访问的 zm-system-log-。日志、异常页面或调试输出通常会泄露堆栈信息、内部路径、查询语句、账号标识、令牌片段或业务数据，不应向未授权用户开放。
  reference:
    - https://www.exploit-db.com/ghdb/6926
  classification:
    cpe: cpe:2.3:a:zoneminder:zoneminder:*:*:*:*:*:*:*:*
  metadata:
    max-request: 2
  tags: logs,zoneminder,exposure,discovery

http:
  - method: GET
    path:
      - "{{BaseURL}}/?view=log"
      - "{{BaseURL}}/zm/?view=log"

    stop-at-first-match: true

    matchers-condition: and
    matchers:
      - type: word
        words:
          - "<title>ZM - System Log</title>"

      - type: status
        status:
          - 200
