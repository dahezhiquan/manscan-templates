id: lomnido-panel

info:
  name: Lomnido 面板识别（指纹识别）
  author: righettod
  severity: info
  description: |-
    检测到目标站点存在 Lomnido 相关响应特征。Lomnido 是监控、日志、分析或可观测性系统，用于展示运行指标、告警事件、日志数据和服务状态。模板请求 `/`，并通过页面标题或正文关键字、状态码确认该系统指纹，用于资产识别、系统盘点和暴露面梳理。
  reference:
    - https://lomnido.com/
  metadata:
    verified: true
    max-request: 1
    shodan-query: http.title:"Lomnido Login"
  tags: lomnido,panel,login,detect,discovery
http:
  - method: GET
    path:
      - "{{BaseURL}}/"

    matchers-condition: and
    matchers:
      - type: word
        part: body
        words:
          - "<title>Lomnido Login</title>"
          - "/lomnido/saml"
        condition: and

      - type: status
        status:
          - 200
