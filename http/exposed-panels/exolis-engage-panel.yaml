id: exolis-engage-panel

info:
  name: Exolis Engage 面板识别（暴露面识别）
  author: righettod
  severity: info
  description: 该模板通过识别 Exolis Engage 面板、控制台或管理界面的页面特征，判断目标是否暴露了对应服务入口。若命中，说明该后台或运维界面对外可访问，可用于资产识别与暴露面排查。
  reference:
    - https://www.exolis.fr/en/solution-2/
  classification:
    cvss-metrics: CVSS:3.0/AV:N/AC:L/PR:N/UI:N/S:U/C:N/I:N/A:N
    cwe-id: CWE-200
  metadata:
    verified: true
    max-request: 1
    shodan-query: html:"engage - Portail soignant"
    google-query: intitle:"engage - Portail soignant"
  tags: panel,exolis,engage,discovery

http:
  - method: GET
    path:
      - "{{BaseURL}}/app.js"

    matchers-condition: and
    matchers:
      - type: word
        part: body
        words:
          - "engage-specific-config"
          - "engage-lastAppUserType"
          - "engage-lastHelperPatientContext"
          - "engage-preferred-language"
          - "engageManager.admin"
          - "engageManager.user"
        condition: or

      - type: status
        status:
          - 200
