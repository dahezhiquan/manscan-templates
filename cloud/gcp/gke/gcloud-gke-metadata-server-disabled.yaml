id: gcloud-gke-metadata-server-disabled

info:
  name: GKE Clusters 未启用Metadata Server已启用（云安全）
  author: princechaddha
  severity: medium
  description: GKE Metadata Server 是 Workload Identity 的关键组件，可避免 Pod 直接使用节点元数据身份。本模板枚举节点池并检查 config.workloadMetadataConfig，发现 GCE_METADATA 时报告未启用 GKE Metadata Server。
  impact: |
    - Pod 可能更容易接触节点服务账号凭据，扩大单个工作负载被攻破后的云权限影响面。
    - 无法充分使用 Workload Identity 的身份隔离能力，增加权限收敛难度。
  remediation: |
    - 为节点池启用 GKE Metadata Server，并配置 Workload Identity 将 Kubernetes ServiceAccount 映射到专用 Google 服务账号。
    - 迁移后收敛节点服务账号权限，避免工作负载继续依赖节点默认身份。
  reference:
    - https://cloud.google.com/kubernetes-engine/docs/how-to/protecting-cluster-metadata
    - https://www.trendmicro.com/cloudoneconformity/knowledge-base/gcp/GKE/enable-metadata-server.html
  metadata:
    vendor: google
    product: google-kubernetes-engine
  tags: cloud,devops,gcp,gcloud,gke,kubernetes,security,metadata,gcp-cloud-config

flow: |
  code(1)
  for(let projectId of iterate(template.projectIds)){
    set("projectId", projectId)
    code(2)
    for(let cluster of iterate(template.clusters)){
      cluster = JSON.parse(cluster)
      set("clusterName", cluster.name)
      set("location", cluster.location)
      code(3)
      for(let nodePool of iterate(template.nodePools)){
        nodePool = JSON.parse(nodePool)
        set("nodePoolName", nodePool.name)
        code(4)
      }
    }
  }

self-contained: true

code:
  - engine:
      - sh
      - bash
    source: |
      gcloud projects list --format="json(projectId)"

    extractors:
      - type: json
        name: projectIds
        internal: true
        json:
          - '.[].projectId'

  - engine:
      - sh
      - bash
    source: |
      gcloud container clusters list --project $projectId --format="json(name,location)"

    extractors:
      - type: json
        name: clusters
        internal: true
        json:
          - '.[]'

  - engine:
      - sh
      - bash
    source: |
      gcloud container node-pools list --cluster $clusterName --location $location --project $projectId --format="json(name)"

    extractors:
      - type: json
        name: nodePools
        internal: true
        json:
          - '.[]'

  - engine:
      - sh
      - bash
    source: |
      gcloud container node-pools describe $nodePoolName --cluster $clusterName --location $location --project $projectId --format="value(config.workloadMetadataConfig)"

    matchers:
      - type: word
        words:
          - "GCE_METADATA"

    extractors:
      - type: dsl
        dsl:
          - '"Node pool " + nodePoolName + " in GKE cluster " + clusterName + " (" + location + ") of project " + projectId + " does not have GKE Metadata Server enabled"'
