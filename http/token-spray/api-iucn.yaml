id: api-iucn

info:
  name: IUCN API Token 可用性校验（token喷洒）
  author: daffainfo
  severity: info
  description: 该模板通过调用 IUCN API 的已知接口验证提供的 token 是否有效，命中后通常表示可访问安全情报与资产查询能力。
  reference:
    - http://apiv3.iucnredlist.org/api/v3/docs
    - https://github.com/daffainfo/all-about-apikey/tree/main/iucn
  metadata:
    max-request: 1
  tags: token-spray,iucn

self-contained: true

http:
  - method: GET
    path:
      - "http://apiv3.iucnredlist.org/api/v3/country/list?token={{token}}"

    matchers:
      - type: word
        part: body
        words:
          - 'taxonid'
          - 'scientific_name'
          - 'subspecies'
        condition: and
