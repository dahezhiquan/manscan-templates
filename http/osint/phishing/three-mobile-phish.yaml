id: three-mobile-phish

info:
  name: Three 仿冒钓鱼网站（钓鱼网站识别）
  author: rxerium
  severity: info
  description: |
    检测到疑似仿冒 Three 的钓鱼网站。模板在目标页面返回 200、页面内容命中 Three 的品牌页面特征，且当前主机不属于 three.co.uk 官方域名时触发，用于识别借用 Three 品牌页面诱导用户信任的仿冒站点。
  reference:
    - https://three.co.uk
  metadata:
    max-request: 1
  tags: phishing,three,osint,discovery
http:
  - method: GET
    path:
      - "{{BaseURL}}"

    host-redirects: true
    max-redirects: 2

    matchers-condition: and
    matchers:
      - type: word
        words:
          - 'Three | Phones, Broadband &amp; SIM Only deals'

      - type: status
        status:
          - 200

      - type: dsl
        dsl:
          - '!contains(host,"three.co.uk")'
