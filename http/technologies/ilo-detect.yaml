id: ilo-detect

info:
  name: HP iLO 指纹识别（指纹识别）
  author: milo2012
  severity: info
  description: 用于识别目标是否部署 HP iLO 并提取相关版本或构建信息，模板会结合 HTTP 响应头、页面正文、状态码、特定路径或已知端点和版本或标识提取结果进行指纹匹配。
  metadata:
    max-request: 1
  tags: tech,ilo,discovery

http:
  - method: GET
    path:
      - "{{BaseURL}}/xmldata?item=all"

    matchers-condition: and
    matchers:
      - type: status
        status:
          - 200

      - type: word
        words:
          - text/xml
        part: header

      - type: word
        words:
          - <RIMP>
          - <HSI>
        condition: and

    extractors:
      - type: regex
        part: body
        group: 1
        regex:
          - "<FWRI>([0-9.]+)</FWRI>"
