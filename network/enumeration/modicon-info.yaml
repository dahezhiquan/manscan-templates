id: modicon-info

info:
  name: Schneider Modicon PLC 信息泄露（服务漏洞）
  author: biero-el-corridor
  severity: info
  description: |
    该模板通过协议交互枚举 Schneider Modicon PLC Information Disclosure 相关服务的版本、配置、用户或其他可公开获取的信息。
  metadata:
    verified: true
    shodan-query: "Device Identification: Schneider Electric"
  tags: ics,modicon,schneider,detect,network,tcp

tcp:
  - inputs:
      - data: "000000000005002b0e0200"
        type: hex
        read: 200
        name: info
      - data: "000f0000000d005a002000140064000000f600"
        type: hex
        read: 200
        name: note
      - data: "000400000005005a000300"
        type: hex
        read: 200
        name: info

    host:
      - "{{Hostname}}"
    port: 502
    read-size: 1024

    matchers:
      - type: word
        part: raw
        words:
          - "Schneider Electric"

    extractors:
      - type: regex
        group: 1
        regex:
          - "Schneider Electric    ([A-Z 0-9a-z.]+)"
