id: azure-nsg-postgresql-unrestricted
info:
  name: Azure NSG 对互联网开放 PostgreSQL 端口（云安全）
  author: princechaddha
  severity: high
  description: PostgreSQL 通常使用 TCP 5432 提供数据库连接；将该端口对互联网开放会扩大数据库认证和数据平面的攻击面。本模板查询入站允许的 TCP 5432 NSG 规则，并在来源地址为 *、internet 或 any 时报告。
  impact: |
    - 弱口令、错误的 pg_hba 规则、泄露凭据或软件漏洞可能导致数据被读取、篡改和删除。
    - 数据库权限突破后，攻击者可能进一步访问应用主机、备份和同一网络中的其他服务。
  remediation: |
    - 删除面向互联网的 TCP 5432 入站规则，改用私有网络、VPN 或 Private Endpoint 连接 PostgreSQL。
    - 限制数据库来源网段和账户权限，启用 TLS、补丁管理及登录和查询审计。
  reference:
    - https://docs.microsoft.com/en-us/azure/virtual-network/network-security-groups-overview
  metadata:
    vendor: microsoft
    product: azure-network-security-group
  tags: cloud,devops,azure,microsoft,nsg,azure-cloud-config

flow: |
  code(1);
  for (let NsgData of iterate(template.nsgdata)) {
    NsgData = JSON.parse(NsgData)
    set("nsg", NsgData.name)
    set("resourcegroup", NsgData.resourceGroup)
    code(2)
  }

self-contained: true
code:
  - engine:
      - sh
      - bash
    source: |
      az network nsg list --query '[*].{name:name, resourceGroup:resourceGroup}' --output json

    extractors:
      - type: json
        name: nsgdata
        internal: true
        json:
          - '.[]'

  - engine:
      - sh
      - bash
    source: |
      az network nsg rule list --nsg-name $nsg --resource-group $resourcegroup --query "[?direction=='Inbound' && access=='Allow' && protocol=='TCP' && (destinationPortRange=='5432')]"

    matchers:
      - type: word
        words:
          - '"sourceAddressPrefix": "*"'
          - '"sourceAddressPrefix": "internet"'
          - '"sourceAddressPrefix": "any"'

    extractors:
      - type: dsl
        dsl:
          - 'nsg + " has unrestricted access on TCP port 5432"'
