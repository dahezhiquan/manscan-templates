id: gcp-phish

info:
  name: Google Cloud Platform 仿冒钓鱼网站（钓鱼网站识别）
  author: rxerium
  severity: info
  description: |
    检测到疑似仿冒 Google Cloud Platform 的钓鱼网站。模板在目标页面返回 200、页面内容命中 Google Cloud Platform 的官方服务页面特征，且当前主机不属于 cloud.google.com、google.com 官方域名时触发，用于识别借用 Google Cloud Platform 品牌页面诱导用户信任的仿冒站点。
  reference:
    - https://cloud.google.com
  metadata:
    max-request: 1
  tags: phishing,gcp,google-cloud,cloud,osint,discovery
http:
  - method: GET
    path:
      - "{{BaseURL}}"

    host-redirects: true
    max-redirects: 2

    matchers-condition: and
    matchers:
      - type: word
        words:
          - "Meet your business challenges head on with cloud computing services from Google, including data management, hybrid & multi-cloud, and AI & ML."

      - type: status
        status:
          - 200

      - type: dsl
        dsl:
          - '!contains(host,"cloud.google.com")'
          - '!contains(host,"google.com")'
