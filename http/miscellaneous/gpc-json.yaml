id: gpc-json

info:
  name: Global Privacy Control 策略文件披露
  author: MihhailSokolov
  severity: low
  description: |
    检测网站是否定义 Global Privacy Control (GPC) 策略文件。该文件用于表达站点对用户隐私控制信号的支持和处理方式。
  impact: |
    - well-known 策略或身份文件通常用于公开声明域名、应用、邮件、证书或身份关联。
    - 若内容过期、配置错误或非预期暴露，可能泄露组织关系、端点能力、用户标识或验证材料。
  remediation: |
    - 确认该 well-known 文件是否为业务或合规所需；非必要内容应删除或限制访问。
    - 定期检查文件内容是否准确、未过期且不包含敏感信息。
    - 对应用关联、邮件策略、证书验证和身份声明文件建立变更审计。
  metadata:
    verified: true
    max-request: 2
  tags: miscellaneous,misc,generic,gpc,vuln

http:
  - method: GET
    path:
      - "{{RootURL}}/.well-known/gpc.json"
      - "{{RootURL}}/gpc.json"

    stop-at-first-match: true

    matchers-condition: and
    matchers:
      - type: word
        words:
          - '"gpc"'

      - type: status
        status:
          - 200

      - type: dsl
        dsl:
          - "len(body) <= 1024 && len(body) > 0"

    extractors:
      - type: json
        part: body
        name: gpc-version
        json:
          - ".version?"
