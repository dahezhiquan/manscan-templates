id: tyk-gateway-detect

info:
  name: Tyk API Gateway 指纹识别（指纹识别）
  author: davidfegyver
  severity: info
  description: >-
    Tyk 是 API 网关和管理平台，用于 API 路由、认证、限流、监控和开发者门户管理。该模板通过请求目标服务并检查预设路径或首页响应、页面正文关键字、正则特征等指纹特征，判断目标是否使用或暴露了
    Tyk API Gateway 相关组件；命中结果仅表示指纹特征匹配，可用于资产盘点、技术栈识别和后续安全评估，不代表已确认存在可利用漏洞。
  reference:
  - https://github.com/TykTechnologies/tyk
  metadata:
    verified: true
    max-request: 1
  tags: tyk,gateway,tech,detect,discovery
http:
  - method: GET
    path:
      - "{{BaseURL}}/hello"

    matchers-condition: and
    matchers:
      - type: word
        part: body
        words:
          - "Tyk GW"
          - "description"
        condition: and

      - type: word
        part: content_type
        words:
          - application/json

    extractors:
      - type: regex
        name: version
        part: body
        regex:
          - "\"version\":\"([^\"]*)\""
