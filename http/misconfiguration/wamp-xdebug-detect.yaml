id: wamp-xdebug-detect

info:
  name: WampServer Xdebug 配置暴露
  author: e_schultze_
  severity: medium
  description: |-
    该模板用于核查 WampServer Xdebug 配置暴露。调试模式、错误页面或诊断组件在生产环境暴露时，会返回堆栈、路径、配置项、请求上下文或运行参数。模板访问 /?phpinfo=-1，并根据调试标识、异常类名、phpinfo/Xdebug 配置或错误关键字确认暴露。
  reference:
    - https://github.com/random-robbie/My-Shodan-Scripts/blob/1b01bceecc9be0b74b202f445874920eee48bba5/wamp-xdebug/wamp-xdebug.py
  classification:
    cvss-metrics: CVSS:3.1/AV:N/AC:L/PR:N/UI:N/S:U/C:N/I:N/A:N
    cvss-score: 0
    cwe-id: CWE-200
  metadata:
    max-request: 1
  tags: debug,config,wamp,misconfig,vuln
  impact: |-
    - 攻击者可获取应用路径、框架版本、环境变量、内部调用栈、请求参数和依赖信息。
    - 这些信息可帮助定位组件缺陷、构造后续漏洞利用或绕过安全控制。
  remediation: |-
    - 关闭生产环境调试模式、错误详情展示、Profiler 和 phpinfo 页面。
    - 将错误写入受保护日志，统一返回通用错误页面。
    - 限制诊断入口访问来源，升级框架并复核生产配置。
http:
  - method: GET
    path:
      - "{{BaseURL}}/?phpinfo=-1"

    matchers:
      - type: word
        words:
          - 'xdebug.remote_connect_back</td><td class="v">On</td><td class="v">On</td>'
        part: body
