id: mozilla-bugzilla-detect

info:
  name: Bugzilla 指纹识别（指纹识别）
  author: icarot
  severity: info
  description: >-
    Bugzilla 是缺陷跟踪和工单管理系统，用于软件项目的问题记录、分派和发布管理。该模板通过请求目标服务并检查预设路径或首页响应、页面正文关键字、状态码、正则特征等指纹特征，判断目标是否使用或暴露了
    Bugzilla 相关组件；命中结果仅表示指纹特征匹配，可用于资产盘点、技术栈识别和后续安全评估，不代表已确认存在可利用漏洞。
  reference:
  - https://github.com/bugzilla/bugzilla/
  classification:
    cpe: cpe:2.3:a:mozilla:bugzilla:-:*:*:*:*:*:*:*
  metadata:
    verified: true
    max-request: 1
    vendor: mozilla
    product: bugzilla
    shodan-query: title:"Bugzilla"
  tags: tech,bugzilla,mozilla,detect,discovery
http:
  - method: GET
    path:
      - "{{BaseURL}}"

    matchers-condition: and
    matchers:
      - type: word
        words:
          - "<title>Bugzilla Main"
          - 'title="Bugzilla'
          - 'href="https://bugzilla.readthedocs.org/'
        condition: or

      - type: status
        status:
          - 200

    extractors:
      - type: regex
        group: 1
        regex:
          - "class=\"header_addl_info\">version ([^<]+)</span>"
