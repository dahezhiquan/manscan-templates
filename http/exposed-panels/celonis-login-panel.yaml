id: celonis-login-panel

info:
  name: Celonis Login 面板（暴露面识别）
  author: r3dg33k
  severity: info
  description: |
    该模板通过识别 Celonis Login 登录入口的页面标题、特征文本或重定向行为，判断目标是否暴露了对应的认证界面。若命中，说明该登录面板对外可访问，可用于暴露面梳理与后续安全评估。
  reference: https://www.celonis.com
  metadata:
    max-request: 1
    vendor: celonis
    product: celonis
    shodan-query:
      - http.title:"Celonis"
      - html:"Amazing insights. Better results."
    fofa-query: body="Amazing insights. Better results."
    google-query: intitle:"Celonis" "welcome"
    verified: true
  tags: panel,celonis,login,detect,discovery

http:
  - method: GET
    path:
      - "{{BaseURL}}/welcome"

    matchers-condition: and
    matchers:
      - type: word
        part: body
        words:
          - "Amazing insights. Better results."
          - "draw-celonis-logo"
        condition: and
        case-insensitive: true

      - type: status
        status:
          - 200

    extractors:
      - type: regex
        name: version
        group: 1
        regex:
          - "Celonis\\s([0-9]+\\.[0-9]+)"
