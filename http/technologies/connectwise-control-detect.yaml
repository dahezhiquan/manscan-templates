id: connectwise-control-detect

info:
  name: ConnectWise Control 指纹识别（指纹识别）
  author: pikpikcu
  severity: info
  description: ConnectWise Control 是远程支持与远程访问平台，用于客服接入、无人值守访问和会话管理。该模板请求首页，并依据 HTTP 200 状态码、页面标题、正文关键字或品牌资源特征识别目标是否使用或暴露了 ConnectWise Control 相关组件，适用于资产盘点、技术栈识别和后续安全评估；命中结果仅表示指纹特征匹配，不代表已确认存在可利用漏洞。
  classification:
    cpe: cpe:2.3:a:connectwise:control:*:*:*:*:*:*:*:*
  metadata:
    verified: true
    max-request: 1
    vendor: connectwise
    product: control
    shodan-query: title="ConnectWise Control Remote Support Software"
  tags: tech,connectwise,discovery

http:
  - method: GET
    path:
      - "{{BaseURL}}"

    matchers-condition: and
    matchers:
      - type: word
        part: body
        words:
          - "ConnectWise Control Remote Support Software"

      - type: status
        status:
          - 200
