id: interactsh-server

info:
  name: Interactsh 指纹识别（指纹识别）
  author: pdteam
  severity: info
  description: >-
    Interactsh 是带外交互检测服务器，用于安全测试中接收 DNS、HTTP、SMTP 等回连信号。该模板通过请求目标服务并检查预设路径或首页响应、页面正文关键字、正则特征、状态码等指纹特征，判断目标是否使用或暴露了
    Interactsh 相关组件；命中结果仅表示指纹特征匹配，可用于资产盘点、技术栈识别和后续安全评估，不代表已确认存在可利用漏洞。
  classification:
    cpe: cpe:2.3:a:projectdiscovery:interactsh:*:*:*:*:*:*:*:*
  metadata:
    verified: true
    max-request: 1
    vendor: projectdiscovery
    product: interactsh
    shodan-query: http.html:"Interactsh Server"
  tags: tech,interactsh,discovery
http:
  - method: GET
    path:
      - "{{BaseURL}}"

    matchers-condition: and
    matchers:
      - type: word
        words:
          - "Interactsh Server"

      - type: status
        status:
          - 200

    extractors:
      - type: regex
        group: 1
        regex:
          - '<b>(.*)<\/b> server'
          - 'from <b>(.*)<\/b>'
