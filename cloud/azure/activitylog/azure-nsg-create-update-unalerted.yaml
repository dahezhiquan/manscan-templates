id: azure-nsg-create-update-unalerted
info:
  name: Azure NSG 创建或更新告警未配置（云安全）
  author: princechaddha
  severity: high
  description: Network Security Group 创建或更新可能改变子网和网卡的入站、出站访问边界；未配置 Activity Log 告警时，网络控制面变化可能不被及时发现。该模板枚举已启用的 Activity Log Alert，并检查 condition 是否缺少 Microsoft.Network/networkSecurityGroups/write 操作条件。
  impact: |
    - 恶意或错误更新可能开放管理端口、放宽出站访问或绕过分层网络控制。
    - 缺少告警会延长公网暴露、横向移动和数据外传配置的存续时间。
  remediation: |
    - 创建针对 NSG 创建和更新操作的 Activity Log Alert，并接入网络安全响应流程。
    - 对 NSG 规则变更实施最小权限、审批和基线对比，重点监控 0.0.0.0/0 等宽泛来源。
  reference:
    - https://docs.microsoft.com/en-us/azure/azure-monitor/platform/alerts-activity-log
  metadata:
    vendor: microsoft
    product: azure-monitor
  tags: cloud,devops,azure,microsoft,network-security-group,azure-cloud-config

flow: |
  code(1);
  for (let AlertData of iterate(template.alertList)) {
    set("nsg", AlertData);
    code(2);
  }

self-contained: true
code:
  - engine:
      - sh
      - bash
    source: |
      az monitor activity-log alert list --output json --query '[?(enabled==`true`)].id'

    extractors:
      - type: json
        name: alertList
        internal: true
        json:
          - '.[]'

  - engine:
      - sh
      - bash
    source: |
      az monitor activity-log alert show --ids "$nsg" --query 'condition'

    matchers-condition: and
    matchers:
      - type: word
        words:
          - '"field": "operationName"'

      - type: word
        words:
          - "Microsoft.Network/networkSecurityGroups/write"
        negative: true

    extractors:
      - type: dsl
        dsl:
          - 'nsg + " does not have the correct alert configuration for Create/Update Network Security Group events"'
