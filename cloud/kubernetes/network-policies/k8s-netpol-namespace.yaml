id: k8s-netpol-namespace

info:
  name: Network 策略 specify namespace（云安全）
  author: princechaddha
  severity: medium
  description: 该规则用于检查 Kubernetes network-policies 相关资源是否满足推荐的云安全与合规配置要求，命中通常表示当前配置仍存在可改进的风险项。
  impact: |
    - 当前配置偏离推荐的云安全基线，可能增加攻击面、审计缺口或运维失误带来的风险。
    - 具体影响取决于受影响资源的重要性、暴露范围以及周边安全控制是否到位。
  remediation: |
    - 参考云厂商安全基线和官方文档修正当前配置偏差。
    - 建议结合资源标签、自动化检测与周期性审计，持续跟踪该类风险项的整改状态。
  reference:
    - https://kubernetes.io/docs/concepts/services-networking/network-policies/
  tags: cloud,devops,kubernetes,devsecops,k8s,k8s-cluster-security

flow: |
  code(1);
  for (let policy of template.items) {
    set("policy", policy)
    javascript(1);
  }

self-contained: true
code:
  - engine:
      - sh
      - bash
    source: kubectl get netpol --all-namespaces --output=json
    extractors:
      - type: json
        name: items
        internal: true
        json:
          - '.items[] | {policy: .metadata.name, namespace: .metadata.namespace}'

javascript:
  - code: |
        let policyData = JSON.parse(template.policy);
        if (!policyData.namespace) {
          let result = (`Network Policy '${policyData.policy}' does not specify a namespace.`);
          Export(result);
        }

    extractors:
      - type: dsl
        dsl:
          - response
