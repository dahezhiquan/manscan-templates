id: gcloud-bigquery-public-datasets

info:
  name: 公开可访问 BigQuery Datasets（云安全）
  author: princechaddha
  severity: high
  description: BigQuery 数据集访问策略如果向 allUsers 或 allAuthenticatedUsers 授予数据查看、编辑或所有者角色，数据集可能被公开访问。本模板枚举数据集并检查 access 配置中的公共 specialGroup 和角色，命中时报告公开数据集。
  impact: |
    - 数据集中的表、视图或元数据可能被未授权读取，造成业务数据、用户数据或分析结果泄露。
    - 若公共主体具备编辑或所有者权限，还可能导致数据被篡改、删除或访问控制被进一步放宽。
  remediation: |
    - 从 BigQuery 数据集访问控制中移除 allUsers 和 allAuthenticatedUsers，仅向明确身份授予最小必要角色。
    - 复核公开数据集中的历史内容，必要时轮换或清理已暴露的敏感数据。
  reference:
    - https://cloud.google.com/bigquery/docs/managing-dataset-access
  metadata:
    vendor: google
    product: bigquery
  tags: cloud,devops,gcp,gcloud,bigquery,gcp-cloud-config

flow: |
  code(1)
  for(let projectId of iterate(template.projectIds)){
    set("projectId", projectId)
    code(2)
    for(let datasetId of iterate(template.datasetIds)){
      set("datasetId", datasetId)
      code(3)
    }
  }

self-contained: true

code:
  - engine:
      - sh
      - bash
    source: |
      gcloud projects list --format="json(projectId)"

    extractors:
      - type: json
        name: projectIds
        internal: true
        json:
          - '.[].projectId'

  - engine:
      - sh
      - bash
    source: |
      bq ls --project_id $projectId --format=json

    extractors:
      - type: json
        name: datasetIds
        internal: true
        json:
          - '.[].datasetId'

  - engine:
      - sh
      - bash
    source: |
      bq show --format=prettyjson $projectId:$datasetId | jq '.access[] | select(.role != null and (.specialGroup == "allUsers" or .specialGroup == "allAuthenticatedUsers")) | .role'

    matchers:
      - type: word
        words:
          - 'roles/bigquery.dataViewer'
          - 'roles/bigquery.dataEditor'
          - 'roles/bigquery.dataOwner'
        condition: or

    extractors:
      - type: dsl
        dsl:
          - '"Publicly Accessible BigQuery Dataset: " + datasetId + " in Project: " + projectId'
