id: slack-webhook

info:
  name: Slack Webhook 地址泄露检测（本地文件安全扫描）
  author: gaurang
  severity: high
  description: |
    Slack Webhook 地址本质上是包含路由和鉴权信息的可调用地址。地址泄露后，攻击者可能伪造消息、触发自动化流程或向目标工作区发送垃圾内容。本模板在全部文件中使用服务名、凭据前缀或字段上下文，并结合令牌长度和字符集约束提取候选值；正则命中只表示格式相似，不能单独证明凭据仍有效或拥有相应权限。
  impact: |
    - 攻击者可伪造通知、创建垃圾消息或反复触发下游自动化，造成业务干扰和资源消耗。
    - Webhook 若连接部署、工单、支付或数据处理流程，可能进一步触发未授权变更或敏感数据流转。
  remediation: |
    - 在 Slack 工作区和应用 API 中立即轮换或删除命中的 Webhook，并审计历史投递、触发记录和下游动作。
    - 使用签名校验、来源限制、最小化事件权限和幂等处理，避免仅凭 URL 即执行高风险操作。
    - 将 Webhook 放入受控配置或 Secret 管理系统，禁止写入前端资源、日志和公开仓库。
  tags: file,keys,token,slack
file:
  - extensions:
      - all

    extractors:
      - type: regex
        regex:
          - "https://hooks.slack.com/services/T[0-9A-Za-z\\-_]{8}/B[0-9A-Za-z\\-_]{8}/[0-9A-Za-z\\-_]{24}"
