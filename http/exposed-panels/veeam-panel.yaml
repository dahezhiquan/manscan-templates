id: veeam-panel

info:
  name: Veeam 登录面板识别（暴露面识别）
  author: DhiyaneshDK
  severity: info
  description: 该模板通过识别 Veeam 登录入口的页面标题、特征文本或重定向行为，判断目标是否暴露了对应的认证界面。若命中，说明该登录面板对外可访问，可用于暴露面梳理与后续安全评估。
  classification:
    cvss-metrics: CVSS:3.0/AV:N/AC:L/PR:N/UI:N/S:U/C:N/I:N/A:N
    cwe-id: CWE-200
    cpe: cpe:2.3:a:veeam:one_reporter:*:*:*:*:*:*:*:*
  metadata:
    max-request: 1
    product: one_reporter
    shodan-query: http.favicon.hash:-633512412
    vendor: veeam
    verified: true
  tags: panel,veeam,discovery

http:
  - method: GET
    path:
      - "{{BaseURL}}/login.aspx"

    matchers-condition: and
    matchers:
      - type: word
        words:
          - "Login - Veeam ONE Reporter"

      - type: word
        part: header
        words:
          - "text/html"

      - type: status
        status:
          - 200
