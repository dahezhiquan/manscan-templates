id: vpc-endpoints-not-deployed
info:
  name: VPC Endpoint 未部署（云安全）
  author: princechaddha
  severity: medium
  description: VPC Endpoint 可让 VPC 内资源通过私有连接访问支持的 AWS 服务，减少对公网路径、NAT 或 Internet Gateway 的依赖。该模板枚举 VPC，并检查对应 VPC 的 endpoint 列表是否为空。
  impact: |
    - 私有工作负载访问 AWS 服务时可能经过公网出口或 NAT，增加网络暴露面和出站治理复杂度。
    - 无法通过 endpoint policy 对服务访问进行更细粒度的私有通道控制。
  remediation: |
    - 为需要私有访问的 AWS 服务部署 Gateway Endpoint 或 Interface Endpoint。
    - 为 endpoint 配置最小权限 policy，并更新路由表、安全组和 DNS 设置以使用私有访问路径。
  reference:
    - https://docs.aws.amazon.com/vpc/latest/userguide/vpc-endpoints.html
  metadata:
    max-request: 2
    vendor: amazon
    product: vpc
  tags: cloud,devops,aws,amazon,vpc,aws-cloud-config
variables:
  region: "us-east-1"

flow: |
  code(1)
  for(let VpcIds of iterate(template.VpcId)){
    set("vpc", VpcIds)
    code(2)
  }

self-contained: true
code:
  - engine:
      - sh
      - bash
    source: |
      aws ec2 describe-vpcs --region $region --query 'Vpcs[*].VpcId' --output json

    extractors:
      - type: json
        name: VpcId
        internal: true
        json:
          - '.[]'

  - engine:
      - sh
      - bash
    source: |
         aws ec2 describe-vpc-endpoints --region $region --filters Name=vpc-id,Values=$vpc --query 'VpcEndpoints[*].VpcEndpointId'

    matchers:
      - type: word
        words:
          - "[]"

    extractors:
      - type: dsl
        dsl:
          - '"VPC Endpoints Not Deployed in the VPC network " + vpc'
