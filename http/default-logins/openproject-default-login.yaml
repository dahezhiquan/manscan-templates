id: openproject-default-login

info:
  name: OpenProject 默认管理员凭据（弱口令）
  author: 0x_Akoko
  severity: high
  description: |
    该模板用于检测 OpenProject 是否仍可使用默认凭据或弱口令登录。模板主要向 `/login`、`/api/v3/users/me` 等认证入口发送请求，使用内置默认凭据组合进行认证尝试，并根据状态码、认证 Cookie、跳转位置或登录后的页面关键字判断登录是否成功；命中说明目标未及时修改出厂、示例或初始化账号口令。
  impact: |
    - 攻击者可进入 OpenProject 管理后台，修改任务、服务、插件、路由、作业调度或部署配置。
    - 在 DevOps、网关、监控或运维场景中，后台失陷可能影响生产任务执行、泄露密钥配置，并扩大到下游主机或业务系统。
  remediation: |
    - 立即修改默认管理员口令并清理示例账号，按角色最小化后台管理权限。
    - 将控制台和管理 API 放入受控网络或 VPN 后方，并开启多因素认证、登录失败限制和操作审计。
    - 复核近期任务、插件、连接配置、访问令牌和部署记录，轮换可能暴露的密钥。
  reference:
    - https://www.openproject.org/docs/installation-and-operations/installation/manual/
    - https://www.openproject.org/docs/api/introduction/
    - https://github.com/opf/openproject
  metadata:
    max-request: 3
    verified: true
    fofa-query: app="OpenProject"
    shodan-query: http.title:"OpenProject"
  tags: openproject,default-login,auth,misconfig

variables:
  username: "admin"
  password: "admin"

flow: http(1) && http(2) && http(3)

http:
  - raw:
      - |
        GET /login HTTP/1.1
        Host: {{Hostname}}

    extractors:
      - type: regex
        name: csrf_token
        part: body
        group: 1
        regex:
          - '<meta name="csrf-token" content="([^"]+)"'
        internal: true

    matchers:
      - type: dsl
        dsl:
          - 'status_code == 200 && contains(body, "OpenProject")'
        internal: true

  - raw:
      - |
        POST /login HTTP/1.1
        Host: {{Hostname}}
        Content-Type: application/x-www-form-urlencoded

        authenticity_token={{url_encode(csrf_token)}}&username={{username}}&password={{password}}&login=Sign+in

    redirects: true
    max-redirects: 3

    matchers:
      - type: dsl
        dsl:
          - 'status_code == 302'
        internal: true

  - raw:
      - |
        GET /api/v3/users/me HTTP/1.1
        Host: {{Hostname}}

    matchers:
      - type: dsl
        dsl:
          - 'contains_all(body, "\"_type\":\"User\"", "\"admin\":true", "\"login\":\"admin\"")'
          - 'status_code == 200'
        condition: and
