id: nocodb-panel

info:
  name: NocoDB 面板识别（指纹识别）
  author: userdehghani
  severity: info
  description: |-
    检测到目标站点存在 NocoDB 相关响应特征。NocoDB 是开源无代码数据库和表格平台，用于基于数据库构建表格视图、权限、自动化和 API。模板请求 `/dashboard/#/signin`、`/dashboard/favicon.ico` 路径，并通过页面标题或正文关键字、状态码、favicon 哈希、DSL 条件确认该系统指纹，用于资产识别、系统盘点和暴露面梳理。
  reference:
    - https://www.nocodb.com/
    - https://docs.nocodb.com/
  classification:
    cpe: cpe:2.3:a:xgenecloud:nocodb:*:*:*:*:*:*:*:*
  metadata:
    verified: true
    max-request: 2
    vendor: xgenecloud
    product: nocodb
    shodan-query: "http.favicon.hash:206985584"
  tags: panel,nocodb,login,detect,discovery
http:
  - method: GET
    path:
      - "{{BaseURL}}/dashboard/#/signin"
      - "{{BaseURL}}/dashboard/favicon.ico"

    stop-at-first-match: true

    matchers-condition: or
    matchers:
      - type: word
        part: body
        words:
          - 'content="NocoDB'
        case-insensitive: true

      - type: dsl
        dsl:
          - "status_code==200 && (\"206985584\" == mmh3(base64_py(body)))"
