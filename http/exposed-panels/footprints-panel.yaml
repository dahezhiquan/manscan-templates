id: footprints-panel

info:
  name: FootPrints Service Core 登录面板识别（指纹识别）
  author: tess
  severity: info
  description: |-
    检测到目标站点存在 FootPrints Service Core 相关响应特征。FootPrints Service Core 是一套通过 Web 提供访问的管理面板或业务系统，通常用于配置服务、查看状态、管理数据或执行日常运维操作。模板请求 `/MRcgi/MRlogin.pl`、`/MRcgi/MRentrancePage.pl` 路径，并通过页面标题或正文关键字、状态码确认该系统指纹，用于资产识别、系统盘点和暴露面梳理。
  classification:
    cvss-metrics: CVSS:3.0/AV:N/AC:L/PR:N/UI:N/S:U/C:N/I:N/A:N
    cwe-id: CWE-200
    cpe: cpe:2.3:a:bmc:footprints_service_core:*:*:*:*:*:*:*:*
  metadata:
    verified: true
    max-request: 2
    shodan-query: title:"FootPrints Service Core Login"
    product: footprints_service_core
    vendor: bmc
  tags: tech,panel,footprints,discovery
http:
  - method: GET
    path:
      - '{{BaseURL}}/MRcgi/MRlogin.pl'
      - '{{BaseURL}}/MRcgi/MRentrancePage.pl'

    stop-at-first-match: true

    matchers-condition: and
    matchers:
      - type: word
        part: body
        words:
          - 'FootPrints Service Core Login'

      - type: status
        status:
          - 200
