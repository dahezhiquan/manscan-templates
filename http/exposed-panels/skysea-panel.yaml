id: skysea-panel

info:
  name: SKYSEA Client View 登录面板识别（指纹识别）
  author: rxerium
  severity: info
  description: |-
    SKYSEA Client View 是终端资产与安全管理平台，用于客户端状态、补丁、设备和策略管理。该模板请求首页，并依据 HTTP 200 状态码、页面标题、正文关键字或品牌资源特征识别目标是否部署了该系统或暴露了对应入口，适用于资产指纹确认；命中结果仅表示系统特征匹配，不代表已确认存在未授权访问或可利用漏洞。
  reference:
  - https://www.skyseaclientview.net/
  metadata:
    verified: true
    max-request: 1
    shodan-query: http.favicon.hash:385597939
  tags: panel,skysea,detect,login,discovery

http:
  - method: GET
    path:
      - "{{BaseURL}}"

    host-redirects: true
    max-redirects: 2

    matchers-condition: and
    matchers:
      - type: word
        words:
          - "SKYSEA Client View"

      - type: status
        status:
          - 200
