id: aem-explorer-nodetypes

info:
  name: Adobe AEM Explorer NodeTypes 暴露
  author: dhiyaneshDk
  severity: high
  description: |
    检测到 Adobe AEM Explorer NodeTypes 暴露。目标响应或文件中可能暴露配置、凭据、密钥、令牌、环境变量或历史记录等敏感信息，可能被用于进一步入侵。
  reference:
    - https://raw.githubusercontent.com/danielmiessler/SecLists/master/Discovery/Web-Content/aem2.txt
  classification:
    cpe: cpe:2.3:a:adobe:experience_manager_cloud_service:*:*:*:*:*:*:*:*
  metadata:
    max-request: 1
    vendor: adobe
    product: experience_manager_cloud_service
    shodan-query:
      - http.title:"AEM Sign In"
      - http.component:"Adobe Experience Manager"
  tags: misconfig,aem,adobe,exposure,vuln

http:
  - method: GET
    path:
      - "{{BaseURL}}/crx/explorer/nodetypes/index.jsp"

    matchers-condition: and
    matchers:
      - type: word
        words:
          - 'nodetypeadmin'
          - 'Registered Node Types'
        condition: and

      - type: word
        part: header
        words:
          - text/html

      - type: status
        status:
          - 200
