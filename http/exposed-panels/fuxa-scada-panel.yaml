id: fuxa-scada-panel

info:
  name: FUXA - SCADA/HMI 面板（暴露面识别）
  author: rxerium
  severity: info
  description: |
    该模板用于识别 FUXA - SCADA/HMI 是否存在对外暴露的管理、服务或状态界面。若命中，说明目标公开了相关功能入口，可作为资产盘点与攻击面收敛的依据。
  reference:
    - https://github.com/frangoteam/FUXA
  metadata:
    max-request: 1
    verified: true
    vendor: frangoteam
    product: fuxa
    shodan-query: http.title:"FUXA"
  tags: panel,scada,hmi,ics,fuxa,open-source,nodejs,modbus,opc-ua,discovery

http:
  - method: GET
    path:
      - '{{BaseURL}}'

    host-redirects: true
    max-redirects: 2

    matchers-condition: and
    matchers:
      - type: word
        part: body
        words:
          - '<title>FUXA</title>'
          - 'assets/lib/svgeditor'
          - 'FUXA'
        condition: or

      - type: status
        status:
          - 200
