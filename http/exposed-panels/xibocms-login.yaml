id: xibocms-login

info:
  name: Xibo CMS 登录面板识别（暴露面识别）
  author: ritikchaddha,daffainfo
  severity: info
  description: 该模板通过识别 Xibo CMS 登录入口的页面标题、特征文本或重定向行为，判断目标是否暴露了对应的认证界面。若命中，说明该登录面板对外可访问，可用于暴露面梳理与后续安全评估。
  classification:
    cvss-metrics: CVSS:3.0/AV:N/AC:L/PR:N/UI:N/S:U/C:N/I:N/A:N
    cwe-id: CWE-200
    cpe: cpe:2.3:a:springsignage:xibo:*:*:*:*:*:*:*:*
  metadata:
    verified: true
    max-request: 1
    shodan-query: http.html:"/xibosignage/xibo-cms"
    product: xibo
    vendor: springsignage
  tags: panel,xibocms,discovery

http:
  - method: GET
    path:
      - "{{BaseURL}}/login"

    matchers-condition: and
    matchers:
      - type: word
        part: body
        words:
          - 'xibo-cms'
          - 'class="XiboFormButton'
        condition: and

      - type: status
        status:
          - 200

    extractors:
      - type: regex
        part: body
        group: 1
        regex:
          - '([0-9.]+)            | <a id="source-link"'
