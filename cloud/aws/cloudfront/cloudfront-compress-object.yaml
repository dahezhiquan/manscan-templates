id: cloudfront-compress-object

info:
  name: CloudFront 对象自动压缩未启用（云安全）
  author: DhiyaneshDK
  severity: low
  description: CloudFront 对象自动压缩未启用是一类边缘分发性能与可用性配置缺陷，会增加可压缩内容的传输体积。高流量或跨地域访问场景下，额外带宽消耗可能放大源站压力和访问延迟。模板枚举分配 ID 后读取 `DistributionConfig.CacheBehaviors.Items[*].Compress`，当返回 `False` 时判定自动压缩未启用。
  impact: |
    - 静态资源未压缩会增加传输体积，影响用户访问性能和源站/边缘流量成本。
    - 在流量突增时，额外带宽消耗可能放大源站压力并降低服务韧性。
  remediation: |
    - 对适合压缩的缓存行为启用 CloudFront `Compress` 配置。
    - 确认源站、缓存策略和客户端 `Accept-Encoding` 支持预期压缩格式，并验证关键资源的响应结果。
  reference:
    - https://www.trendmicro.com/cloudoneconformity-staging/knowledge-base/aws/CloudFront/compress-objects-automatically.html
    - https://docs.aws.amazon.com/AmazonCloudFront/latest/DeveloperGuide/ServingCompressedFiles.html
  metadata:
    vendor: amazon
    product: cloudfront
  tags: cloud,devops,aws,amazon,cloudfront,aws-cloud-config

variables:
  region: "us-west-2"

flow: |
  code(1)
  for(let DistributionListItemsId of iterate(template.distributions)){
    set("distribution", DistributionListItemsId)
    code(2)
  }

self-contained: true

code:
  - engine:
      - sh
      - bash

    source: |
      aws cloudfront list-distributions --output table --query 'DistributionList.Items[*].Id' --region $region --output json

    extractors:
      - type: json
        name: distributions
        internal: true
        json:
          - '.[]'

  - engine:
      - sh
      - bash

    source: |
        aws cloudfront get-distribution-config --id $distribution --query 'DistributionConfig.CacheBehaviors.Items[*].Compress' --region $region --output text

    matchers:
      - type: word
        words:
          - "False"

    extractors:
      - type: dsl
        dsl:
          - '"CloudFront Compress Objects Automatically " + distribution + " is Disabled"'
