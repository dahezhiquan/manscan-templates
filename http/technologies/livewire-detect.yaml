id: livewire-detect

info:
  name: Laravel Livewire 指纹识别（指纹识别）
  author: Shivam Kamboj
  severity: info
  description: |
    用于识别目标前端或应用中是否使用 Laravel Livewire，模板会结合页面正文和特定路径或已知端点进行技术栈指纹匹配。
  reference:
    - https://livewire.laravel.com/
  metadata:
    verified: true
    max-request: 1
    product: livewire
    vendor: laravel
    shodan-query: html:"wire:id"
  tags: tech,discovery,livewire

http:
  - method: GET
    path:
      - "{{BaseURL}}"

    redirects: true

    matchers:
      - type: word
        part: body
        words:
          - "wire:id="
          - "wire:initial-data="
          - "window.livewire_app_url"
          - "window.livewire_token"
          - "livewire.js"
          - "livewire.min.js"
        condition: or
