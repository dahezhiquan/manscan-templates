id: jeecg-boot-jdbc-rce
info:
  name: JEECG Boot - 远程代码执行漏洞
  author: Chaitin
  severity: critical
  metadata:
    verified: true
    max-request: 2
    vuln-id: CT-839424
    vendor: jeecg
    product: jimureport
  tags: rce,vuln,jeecg
variables:
  db: '{{to_lower(rand_text_alpha(8))}}'
  host: '{{to_lower(rand_text_alpha(8))}}'
  port: '{{rand_int(1, 65535)}}'
flow: http(1) || http(2)
http:
  - method: POST
    path:
      - '{{BaseURL}}/jeecg-boot/jmreport/testConnection'
    redirects: false
    headers:
      Content-Type: application/json
    body: |-
      {
        "id":"1",
        "code":"dataSource",
        "dbType":"MySQL","dbDriver":"com.mysql.cj.jdbc.Driver",
        "dbUrl":"jdbc:mysql://{{host}}:{{port}}/{{db}}",
        "dbName":"test" ,
        "dbUsername" :"test","dbPassword":"test",
        "connectTimes":3
      }
    matchers:
      - type: dsl
        dsl:
          - 'status_code == 200 && contains(to_lower(header), to_lower("application/json")) && ( contains(to_lower(body), to_lower("数据库连接失败")) || contains(to_lower(body), to_lower("数据源已连接错误3次以上,请检查配置信息！")) )'
  - method: POST
    path:
      - '{{BaseURL}}/jmreport/testConnection'
    redirects: false
    headers:
      Content-Type: application/json
    body: |-
      {
        "id":"1",
        "code":"dataSource",
        "dbType":"MySQL","dbDriver":"com.mysql.cj.jdbc.Driver",
        "dbUrl":"jdbc:mysql://{{host}}:{{port}}/{{db}}",
        "dbName":"test" ,
        "dbUsername" :"test","dbPassword":"test",
        "connectTimes":3
      }
    matchers:
      - type: dsl
        dsl:
          - 'status_code == 200 && contains(to_lower(header), to_lower("application/json")) && ( contains(to_lower(body), to_lower("数据库连接失败")) || contains(to_lower(body), to_lower("数据源已连接错误3次以上,请检查配置信息！")) )'
