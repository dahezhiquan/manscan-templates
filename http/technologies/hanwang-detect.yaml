id: hanwang-detect

info:
  name: hanwang 指纹识别（指纹识别）
  author: ffffffff0x
  severity: info
  description: >-
    汉王相关 Web 系统用于企业办公、识别设备或业务管理场景，页面标识可用于判断目标是否部署该系统。该模板通过请求目标服务并检查预设路径或首页响应、页面正文关键字、状态码等指纹特征，判断目标是否使用或暴露了
    hanwang 相关组件；命中结果仅表示指纹特征匹配，可用于资产盘点、技术栈识别和后续安全评估，不代表已确认存在可利用漏洞。
  metadata:
    max-request: 1
    fofa-query: 汉王人脸考勤管理系统
  tags: hanwang,tech,discovery
http:
  - method: GET
    path:
      - "{{BaseURL}}"

    host-redirects: true
    max-redirects: 2

    matchers-condition: and
    matchers:
      - type: word
        words:
          - "汉王人脸考勤管理系统"
        part: body

      - type: status
        status:
          - 200
