id: appdynamics-rum-detect

info:
  name: AppDynamics (Cisco) RUM 指纹识别（指纹识别）
  author: Shivam Kamboj
  severity: info
  description: |-
    AppDynamics (Cisco) RUM 是应用性能监控平台，用于采集用户体验、性能指标和业务交易数据。该模板请求首页，并依据 HTTP 200 状态码、页面标题、正文关键字或品牌资源特征识别目标是否使用或暴露了 AppDynamics (Cisco) RUM 相关组件，适用于资产盘点、技术栈识别和后续安全评估；命中结果仅表示指纹特征匹配，不代表已确认存在可利用漏洞。
  reference:
  - https://docs.appdynamics.com/appd/24.x/latest/en/end-user-monitoring/browser-monitoring/browser-real-user-monitoring
  metadata:
    max-request: 1
    verified: true
    shodan-query: html:"adrum"
  tags: tech,discovery,rum,appdynamics

http:
  - method: GET
    path:
      - "{{BaseURL}}"

    redirects: true

    matchers-condition: and
    matchers:
      - type: word
        part: body
        words:
          - "adrum-config"
          - "adrum-start-time"
          - "adrumExtUrlHttp"
          - "adrumExtUrlHttps"
        condition: or

      - type: status
        status:
          - 200
