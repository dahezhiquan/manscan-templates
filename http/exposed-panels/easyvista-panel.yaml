id: easyvista-panel

info:
  name: EasyVista 登录面板识别（指纹识别）
  author: righettod
  severity: info
  description: |-
    检测到目标站点存在 EasyVista 相关响应特征。EasyVista 是 IT 服务管理和工单平台，用于管理服务请求、资产、流程、知识库和支持工单。模板请求 `/index.php`，并通过页面标题或正文关键字、状态码、DSL 条件确认该系统指纹，用于资产识别、系统盘点和暴露面梳理。
  reference:
    - https://www.easyvista.com/
  metadata:
    verified: true
    max-request: 1
    shodan-query: http.title:"Easyvista"
  tags: panel,easyvista,login,detect,discovery
http:
  - method: GET
    path:
      - "{{BaseURL}}/index.php"

    matchers:
      - type: dsl
        dsl:
          - 'status_code == 200'
          - 'contains_any(to_lower(body), "<title>easyvista apps</title>", "easyvista-bundle.min.js", "packages_com_easyvista_core")'
        condition: and

    extractors:
      - type: regex
        part: body
        group: 1
        regex:
          - '(?i)package:\s+"([a-z0-9._-]+)"'
          - '(?i)version&nbsp;:&nbsp;([a-z0-9._-]+)'
