id: dash-panel-detect

info:
  name: Dash 面板 指纹识别（指纹识别）
  author: tess
  severity: info
  description: Dash 面板 是 Python 数据可视化 Web 框架，用于构建交互式数据仪表盘。该模板请求首页，并依据 HTTP 200 状态码、页面标题、正文关键字或品牌资源特征识别目标是否使用或暴露了 Dash 面板 相关组件，适用于资产盘点、技术栈识别和后续安全评估；命中结果仅表示指纹特征匹配，不代表已确认存在可利用漏洞。
  classification:
    cpe: cpe:2.3:a:dash:dash_core:*:*:*:*:*:*:*:*
  metadata:
    verified: true
    max-request: 1
    vendor: dash
    product: dash_core
    shodan-query: html:"DashRenderer"
  tags: tech,dash,discovery

http:
  - method: GET
    path:
      - '{{BaseURL}}'

    host-redirects: true
    max-redirects: 2

    matchers-condition: and
    matchers:
      - type: word
        part: body
        words:
          - '_dash-config'
          - 'DashRenderer'
        condition: and

      - type: status
        status:
          - 200
