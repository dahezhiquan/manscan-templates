id: lesshst-history

info:
  name: Less 历史记录 文件 泄露
  author: kazet
  severity: low
  description: |
    检测到 Less 历史记录 文件 泄露。目标响应或文件中可能暴露配置、凭据、密钥、令牌、环境变量或历史记录等敏感信息，可能被用于进一步入侵。
  metadata:
    verified: true
    max-request: 1
    shodan-query: html:"lesshst"
  tags: misconfig,disclosure,config,files,vuln

http:
  - method: GET
    max-redirects: 1
    path:
      - "{{BaseURL}}/.lesshst"

    matchers-condition: and
    matchers:
      - type: word
        words:
          - ".less-history-file:"

      - type: word
        part: response
        words:
          - "<?xml"
          - "<env"
          - "application/javascript"
          - "application/json"
          - "application/xml"
          - "html>"
          - "text/html"
          - "image/"
        negative: true

      - type: status
        status:
          - 200
