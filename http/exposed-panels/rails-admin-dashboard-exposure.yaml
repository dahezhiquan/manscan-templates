id: rails-admin-dashboard-exposure

info:
  name: RailsAdmin Dashboard 管理面板暴露（暴露面识别）
  author: 0x_Akoko
  severity: high
  description: |-
    RailsAdmin Dashboard 是 Ruby on Rails 应用的后台管理界面，用于模型数据、配置和业务对象维护。该模板请求 `/admin`、`/rails_admin` 路径，并依据 DSL 条件判断目标是否对外暴露了 RailsAdmin Dashboard 的管理面板，用于发现互联网可访问的后台、控制台或业务入口。
  impact: "- 暴露的 RailsAdmin Dashboard 管理面板会泄露目标正在使用的产品、部署路径、页面特征或组织业务入口，便于攻击者进行指纹确认和漏洞匹配。\n- 如果认证、访问控制或默认凭据策略薄弱，攻击者可能进一步尝试进入后台，影响后台配置、业务数据、用户账号或设备运行状态。\n- 对互联网开放的管理入口会增加暴力破解、凭据填充、已知漏洞利用和钓鱼仿冒的攻击面。"
  remediation: "- 将 RailsAdmin Dashboard 的管理面板限制在内网、VPN、零信任代理或专用管理网段访问，避免直接暴露在互联网。\n- 启用强密码、多因素认证、登录失败限制和审计告警，排查默认账号、弱口令及长期未使用账号。\n- 保持 RailsAdmin Dashboard 及其依赖组件更新到受支持版本，并通过反向代理、ACL 或防火墙限制敏感路径访问。"
  reference:
  - https://github.com/railsadminteam/rails_admin
  metadata:
    max-request: 2
    verified: true
    shodan-query: http.html:"RailsAdmin"
    fofa-query: body="RailsAdmin"
  tags: rails,admin,exposure,misconfig,panel

http:
  - method: GET
    path:
      - "{{BaseURL}}/admin"
      - "{{BaseURL}}/rails_admin"

    stop-at-first-match: true

    matchers:
      - type: dsl
        dsl:
          - 'status_code == 200'
          - 'contains_all(body, "Settings</a>", "rails_admin_sidebar", "rails_admin_content")'
          - '!contains_any(body, "Sign in", "Log in", "login_form", "devise")'
        condition: and
