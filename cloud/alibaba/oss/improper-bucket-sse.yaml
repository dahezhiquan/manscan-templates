id: improper-bucket-sse

info:
  name: 阿里云 OSS Bucket 未使用 KMS 服务端加密（云安全）
  author: ritikchaddha
  severity: medium
  description: OSS Bucket 未启用 SSE-KMS 或仍使用 AES256 默认服务端加密时，密钥生命周期、授权和审计控制能力弱于 KMS 管理模式。模板枚举 Bucket 后读取 bucket-encryption 配置，当检测到 SSEAlgorithm 为 AES256 或加密配置不存在时，判定 Bucket 服务端加密未按 KMS 要求配置。
  impact: |
    - 静态对象数据缺少 KMS 密钥治理能力，难以满足按业务隔离、密钥轮换和访问审计要求。
    - 敏感对象在备份、复制或误授权场景下的加密控制不足，增加合规和数据保护风险。
  remediation: |
    - 为目标 Bucket 启用服务端加密 SSE-KMS，并选择符合组织要求的 KMS 密钥。
    - 定期检查 Bucket 加密配置、KMS 密钥状态和授权范围，避免使用不符合数据分级要求的加密方式。
  reference:
    - https://www.trendmicro.com/cloudoneconformity/knowledge-base/alibaba-cloud/AlibabaCloud-OSS/enable-sse-with-customer-managed-key.html
  metadata:
    max-request: 1
    verified: true
    vendor: alibaba
    product: oss
  tags: cloud,devops,aliyun,alibaba,aliyun-cloud-config,oss

variables:
  region: "cn-hangzhou"

flow: |
  code(1)
  for (let BucketName of iterate(template.bucketname)) {
    set("bucket", BucketName)
    code(2)
  }

self-contained: true

code:
  - engine:
      - sh
      - bash
    source: |
      ossutil ls -s --region $region

    extractors:
      - type: regex
        name: bucketname
        internal: true
        regex:
          - 'oss://([a-zA-Z0-9-]+)'

  - engine:
      - sh
      - bash
    source: |
      ossutil bucket-encryption --method get $bucket

    matchers:
      - type: regex
        regex:
          - 'SSEAlgorithm:\s?AES256'
          - 'StatusCode=404'

    extractors:
      - type: dsl
        dsl:
          - 'bucket + " Bucket SSEAlgorithm is not set to KMS"'
