id: apigee-panel

info:
  name: Apigee 登录面板识别（暴露面识别）
  author: righettod
  severity: info
  description: |
    该模板通过识别 Apigee 登录入口的页面标题、特征文本或重定向行为，判断目标是否暴露了对应的认证界面。若命中，说明该登录面板对外可访问，可用于暴露面梳理与后续安全评估。
  reference:
    - https://cloud.google.com/apigee?hl=en
  metadata:
    verified: true
    max-request: 1
    shodan-query: http.favicon.hash:"-839356603"
  tags: panel,apigee,login,discovery

http:
  - method: GET
    path:
      - "{{BaseURL}}/login"

    matchers:
      - type: dsl
        dsl:
          - 'status_code == 200'
          - 'contains_any(body, "<title>Apigee", "content=\"Apigee")'
        condition: and

    extractors:
      - type: regex
        part: body
        group: 1
        regex:
          - 'Version:?\s+([0-9.]+)'
