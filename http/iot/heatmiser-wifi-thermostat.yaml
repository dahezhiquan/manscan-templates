id: heatmiser-wifi-thermostat

info:
  name: Heatmiser WiFi 温控器面板（IOT）
  author: dhiyaneshDK
  severity: medium
  description: |
    检测到 Heatmiser WiFi 温控器面板。该入口用于远程管理温控设备，暴露后可能泄露楼宇或家庭环境控制设备的访问入口。
  impact: |
    - 工业控制、楼宇自动化或能源设备面板暴露可能泄露设施运行状态和控制系统入口。
    - 若存在弱口令或历史漏洞，可能影响生产、楼控、供电或环境控制的安全边界。
  remediation: |
    - 将 OT/IoT 管理页面放置在隔离网络中，仅允许可信运维主机或 VPN 访问。
    - 启用强认证、最小权限和设备访问审计，及时更新厂商固件。
    - 避免将控制设备直接暴露到互联网，并监控异常登录和配置变更。
  reference:
    - https://www.exploit-db.com/ghdb/7445
  classification:
    cvss-metrics: CVSS:3.1/AV:N/AC:L/PR:N/UI:N/S:U/C:N/I:N/A:N
    cvss-score: 0
    cwe-id: CWE-200
  metadata:
    max-request: 1
    shodan-query: http.title:"Heatmiser Wifi Thermostat"
  tags: iot,edb,discovery

http:
  - method: GET
    path:
      - '{{BaseURL}}/index.htm'

    matchers-condition: and
    matchers:
      - type: word
        words:
          - '<title>Heatmiser Wifi Thermostat</title>'

      - type: status
        status:
          - 200
