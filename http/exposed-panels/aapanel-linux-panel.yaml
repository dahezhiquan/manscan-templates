id: aapanel-linux-panel

info:
  name: aaPanel Linux 面板识别（暴露面识别）
  author: Th3l0newolf
  severity: info
  description: |
    该模板通过识别 aaPanel Linux 登录入口的页面标题、特征文本或重定向行为，判断目标是否暴露了对应的认证界面。若命中，说明该登录面板对外可访问，可用于暴露面梳理与后续安全评估。
  classification:
    cvss-metrics: CVSS:3.0/AV:N/AC:L/PR:N/UI:N/S:U/C:N/I:N/A:N
    cwe-id: CWE-200
  metadata:
    max-request: 2
    verified: true
    vendor: aapanel
    product: aapanel
    shodan-query: html:"aaPanel Linux panel"
    fofa-query: title="aaPanel Linux panel"
  tags: panel,aapanel,linux,detect

http:
  - method: GET
    path:
      - "{{BaseURL}}/"
      - "{{BaseURL}}/login"

    stop-at-first-match: true

    matchers:
      - type: dsl
        dsl:
          - 'status_code == 200'
          - 'contains_any(body, "<title>aaPanel Linux panel", "Login with aaPanel Mobile", "aaPanel Linux panel")'
        condition: and
