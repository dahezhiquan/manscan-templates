id: facebook-secret-key

info:
  name: Facebook 密钥泄露检测（本地文件安全扫描）
  author: gaurang
  severity: low
  description: |
    该模板检测文件中暴露的 Facebook 密钥。此类凭据一旦泄露，可能被用于访问对应云服务、代码仓库、SaaS 平台或业务接口。
  tags: keys,file,token,facebook

file:
  - extensions:
      - all

    extractors:
      - type: regex
        regex:
          - "(?i)(facebook|fb)(.{0,20})?(?-i)['\"][0-9a-f]{32}['\"]"
