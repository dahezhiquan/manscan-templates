id: hp-device-info-detect

info:
  name: HP 设备信息泄露（IOT）
  author: pussycat0x
  severity: low
  description: |
    检测到 HP 设备内部信息对外暴露。未授权访问者可能读取设备型号、状态或配置相关信息，为后续攻击或资产测绘提供线索。
  impact: |
    - 攻击者无需认证即可访问设备页面或功能，可能读取状态、配置和网络信息。
    - 若接口允许写操作，可能进一步导致设备配置被篡改或服务被滥用。
  remediation: |
    - 启用设备 Web 管理认证并修改默认口令，关闭匿名访问。
    - 升级固件并检查是否存在已知未授权访问漏洞。
    - 将管理页面限制在内网、管理 VLAN 或 VPN 内，并开启访问审计。
  reference:
    - https://www.exploit-db.com/ghdb/6905
  metadata:
    max-request: 1
  tags: iot,hp,discovery

http:
  - method: GET
    path:
      - "{{BaseURL}}/hp/device/DeviceInformation/View"

    matchers-condition: and
    matchers:
      - type: word
        words:
          - "Device Information"
          - "hp"
        condition: and

      - type: status
        status:
          - 200
