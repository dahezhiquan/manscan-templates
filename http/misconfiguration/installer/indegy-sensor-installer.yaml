id: indegy-sensor-installer

info:
  name: Indegy Sensor 安装配置 安装向导
  author: ritikchaddha
  severity: high
  description: |
    检测到 Indegy Sensor 安装配置 安装向导。该页面属于安装、初始化或配置向导流程，若对外暴露，攻击者可能完成初始化、创建管理员账户或重新配置目标系统。
  metadata:
    verified: true
    max-request: 1
    shodan-query: title:"Setup Wizard" http.favicon.hash:-1851491385
  tags: misconfig,indegy,sensor,installer,vuln

http:
  - method: GET
    path:
      - '{{BaseURL}}/settings'

    matchers-condition: and
    matchers:
      - type: word
        part: body
        words:
          - '<title>Setup Wizard</title>'

      - type: status
        status:
          - 200
