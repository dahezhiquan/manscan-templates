id: api-nytimes

info:
  name: NYTimes API Token 可用性校验（token喷洒）
  author: daffainfo
  severity: info
  description: 该模板通过调用 NYTimes API 的已知接口验证提供的 token 是否有效，命中后通常表示可访问相关 API 能力。
  reference:
    - https://developer.nytimes.com/apis
  metadata:
    max-request: 1
  tags: token-spray,nytimes

self-contained: true

http:
  - raw:
      - |
        GET https://api.nytimes.com/svc/mostpopular/v2/shared/1.json?api-key={{token}} HTTP/1.1
        Host: api.nytimes.com

    matchers:
      - type: word
        part: body
        words:
          - '"status":'
          - '"copyright":'
          - '"num_results":'
        condition: and
