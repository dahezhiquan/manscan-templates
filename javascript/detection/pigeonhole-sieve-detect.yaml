id: pigeonhole-sieve-detect

info:
  name: Pigeonhole Sieve 服务识别（指纹识别）
  author: pussycat0x
  severity: info
  description: |
    Dovecot Pigeonhole 是 Dovecot 邮件服务器的 Sieve 过滤规则实现，ManageSieve 服务通常用于让用户远程管理邮件过滤脚本。该模板连接 TCP 4190 端口并读取服务端欢迎语与能力响应，通过 SIEVE、IMPLEMENTATION 和 Pigeonhole 标识确认服务；仅在 IMPLEMENTATION 明确披露 Pigeonhole 软件版本时提取版本，不将 VERSION 字段中的 ManageSieve 协议版本作为产品版本。
  metadata:
    verified: true
    vendor: dovecot
    product: pigeonhole
    shodan-query: product:"Dovecot Pigeonhole sieve"
  tags: sieve,network,js,tcp,detect,discovery

javascript:

  - pre-condition: |
      isPortOpen(Host,Port);

    code: |
      let packet = bytes.NewBuffer();
      const c = require("nuclei/net");
      const cmd = "00000000"
      packet.WriteString(cmd)
      let conn = c.Open('tcp', `${Host}:${Port}`);
      conn.SendHex(packet.Hex());
      const result = conn.RecvString();
      Export(result);

    args:
      Host: "{{Host}}"
      Port: 4190

    matchers:
      - type: dsl
        name: pigeonhole
        dsl:
          - "success == true"
          - contains_all(response, "SIEVE","IMPLEMENTATION","Pigeonhole")
        condition: and

    extractors:
      - type: regex
        name: version
        part: response
        group: 1
        regex:
          - '(?im)^"?IMPLEMENTATION"?\s+"(?:Dovecot\s+)?Pigeonhole(?:/|\s+v?)([0-9]+(?:\.[0-9]+)*(?:[A-Za-z][0-9A-Za-z]*)?(?:[-+~._][0-9A-Za-z]+)*)(?:"|\s)'
