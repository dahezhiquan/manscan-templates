id: miniflux-panel

info:
  name: Miniflux - 登录面板（暴露面识别）
  author: ashish-cybersec
  severity: info
  description: |-
    Miniflux 是一款用 Go 编写的、极简且立场鲜明的自托管 RSS 阅读器。检测到其登录面板。
  reference:
    - https://miniflux.app/docs/index.html
  metadata:
    verified: true
    max-request: 1
    vendor: miniflux
    product: miniflux
    shodan-query: http.title:"Sign In - Miniflux"
  tags: panel,miniflux,rss,login,signin

http:
  - method: GET
    path:
      - "{{BaseURL}}"

    host-redirects: true
    max-redirects: 2

    matchers-condition: and
    matchers:
      - type: word
        part: body
        words:
          - "<title>Sign In - Miniflux</title>"

      - type: word
        part: body
        words:
          - 'data-add-subscription-url="/subscribe"'
          - 'data-refresh-all-feeds-url="/feeds/refresh"'
        condition: and

      - type: status
        status:
          - 200
