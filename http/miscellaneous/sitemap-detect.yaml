id: sitemap-detect

info:
  name: Sitemap 文件检测
  author: houdinis
  severity: low
  description: |
    检测站点地图文件。sitemap 用于描述网站页面、视频和其他文件及其关系，可帮助搜索引擎或扫描器了解站点结构。
  impact: |
    - 命中内容可用于资产画像、人员/社群关联、公开目录发现或业务线索收集。
    - 单独结果通常不等同于漏洞，但与其他信息组合后可能降低攻击者侦察成本。
  remediation: |
    - 确认公开信息是否符合预期，移除不必要的联系人、目录、社群或资源索引。
    - 对必须公开的文件和链接进行最小化披露，避免包含内部路径或敏感标识。
    - 定期巡检公开页面，确保内容仍然准确且未泄露额外信息。
  metadata:
    verified: true
    max-request: 3
    google-query: intext:"sitemap" filetype:txt,filetype:xml inurl:sitemap,inurl:"/sitemap.xsd" ext:xsd
  tags: miscellaneous,misc,generic,sitemap,vuln

http:
  - method: GET
    path:
      - "{{BaseURL}}/sitemap.xml"
      - "{{BaseURL}}/sitemap.xsl"
      - "{{BaseURL}}/sitemap.xsd"

    stop-at-first-match: true

    matchers-condition: and
    matchers:
      - type: word
        words:
          - "sitemap>"
        case-insensitive: true

      - type: word
        part: header
        words:
          - 'application/xml'

      - type: status
        status:
          - 200
