id: sshd-dropbear-detect

info:
  name: Dropbear sshd 识别（服务漏洞）
  author: pussycat0x
  severity: info
  description: |
    该模板通过网络响应特征识别目标是否开放 Dropbear sshd 相关服务。
  metadata:
    verified: true
    max-request: 1
    shodan-query: product:"Dropbear sshd"
  tags: network,ssh,dropbear,detect,detection,tcp,discovery
tcp:

  - inputs:
      - data: "\n"
    host:
      - "{{Hostname}}"
    port: 22

    matchers:
      - type: word
        words:
          - "dropbear"

    extractors:
      - type: regex
        regex:
          - "SSH-([0-9.]+)-dropbear_([0-9.]+)"
