id: ejbca-enterprise-installer

info:
  name: EJBCA Enterprise Cloud 配置 Wizard 暴露
  author: DhiyaneshDK
  severity: high
  description: |
    检测到 EJBCA Enterprise Cloud 配置 Wizard 暴露。该页面属于安装、初始化或配置向导流程，若对外暴露，攻击者可能完成初始化、创建管理员账户或重新配置目标系统。
  reference:
    - https://aws.amazon.com/marketplace/pp/prodview-u2xdo5mkuilke
  classification:
    cpe: cpe:2.3:a:primekey:ejbca:*:*:*:*:*:*:*:*
  metadata:
    verified: true
    max-request: 1
    vendor: primekey
    product: ejbca
    shodan-query: html:"EJBCA Enterprise Cloud Configuration Wizard"
  tags: misconfig,install,exposure,ejbca,vuln

http:
  - method: GET
    path:
      - "{{BaseURL}}"

    matchers-condition: and
    matchers:
      - type: word
        part: body
        words:
          - "EJBCA Enterprise Cloud Configuration Wizard"

      - type: status
        status:
          - 200
