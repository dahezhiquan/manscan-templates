id: zipline-panel

info:
  name: Diced Zipline 识别（暴露面识别）
  author: icarot
  severity: info
  description: |
    该模板通过识别 Diced Zipline 面板、控制台或管理界面的页面特征，判断目标是否暴露了对应服务入口。若命中，说明该后台或运维界面对外可访问，可用于资产识别与暴露面排查。
  reference:
    - https://github.com/diced/zipline
  metadata:
    verified: true
    max-request: 1
    vendor: diced
    product: zipline
    shodan-query: html:"Zipline"
  tags: diced,zipline,login,panel,detect,discovery

http:
  - method: GET
    path:
      - "{{BaseURL}}/auth/login"

    matchers-condition: and
    matchers:
      - type: word
        words:
          - '"title":"Zipline"'
          - 'Zipline – Login</title>'
        condition: or
        case-insensitive: true

      - type: status
        status:
          - 200
