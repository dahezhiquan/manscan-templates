id: limesurvey-detect

info:
  name: LimeSurvey Survey Software 指纹识别（指纹识别）
  author: Matt Galligan
  severity: info
  description: |
    用于识别目标是否使用 LimeSurvey Survey Software，模板会结合 favicon 哈希、状态码和特定路径或已知端点进行技术指纹匹配。
  reference:
    - https://github.com/LimeSurvey/LimeSurvey
  classification:
    cpe: cpe:2.3:a:limesurvey:limesurvey:*:*:*:*:*:*:*:*
  metadata:
    verified: true
    max-request: 1
    vendor: limesurvey
    product: limesurvey
    shodan-query: http.favicon.hash:1781653957
  tags: tech,limesurvey,discovery

http:
  - method: GET
    path:
      - "{{BaseURL}}"

    host-redirects: true
    max-redirects: 2

    matchers-condition: and
    matchers:
      - type: word
        words:
          - 'content="LimeSurvey'
          - 'alt="LimeSurvey Survey Software'
          - 'data-limesurvey-lang='
          - 'alt="Powered by LimeSurvey'
        condition: or
        case-insensitive: true

      - type: status
        status:
          - 200
