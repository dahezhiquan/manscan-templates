id: gcloud-vm-project-ssh-keys-enabled

info:
  name: Block Project-Wide SSH Keys未启用（云安全）
  author: princechaddha
  severity: medium
  description: 未阻止 project-wide SSH keys 的实例会继承项目元数据中的 SSH 公钥，可能让不需要访问该实例的用户获得登录能力。本模板检查实例 metadata.items，未发现实例级阻断配置时报告未启用 Block Project-Wide SSH Keys。
  impact: |
    - 项目级 SSH key 范围过大时，实例访问权限难以按业务和人员精确隔离。
    - 离职、权限调整或共享密钥残留可能继续影响所有继承项目级 SSH key 的实例。
  remediation: |
    - 在实例元数据中启用 block-project-ssh-keys，改用 OS Login 或实例级 SSH key 精准授权。
    - 清理项目元数据中的历史 SSH key，并将 SSH 访问纳入 IAM 和审计流程。
  reference:
    - https://www.trendmicro.com/cloudoneconformity/knowledge-base/gcp/ComputeEngine/enable-block-project-wide-ssh-keys.html
    - https://cloud.google.com/compute/docs/instances/adding-removing-ssh-keys
  metadata:
    vendor: google
    product: compute-engine
  tags: cloud,devops,gcp,gcloud,compute,security,ssh,gcp-cloud-config

flow: |
  code(1)
  for(let projectId of iterate(template.projectIds)){
    set("projectId", projectId)
    code(2)
    for(let instance of iterate(template.instances)){
      instance = JSON.parse(instance)
      set("instanceName", instance.name)
      set("zone", instance.zone)
      code(3)
    }
  }

self-contained: true

code:
  - engine:
      - sh
      - bash
    source: |
      gcloud projects list --format="json(projectId)"

    extractors:
      - type: json
        name: projectIds
        internal: true
        json:
          - '.[].projectId'

  - engine:
      - sh
      - bash
    source: |
      gcloud compute instances list --project $projectId --format="json(name,zone.basename())"

    extractors:
      - type: json
        name: instances
        internal: true
        json:
          - '.[]'

  - engine:
      - sh
      - bash
    source: |
      gcloud compute instances describe $instanceName --zone $zone --project $projectId --format="json(metadata.items)"

    matchers:
      - type: word
        words:
          - "null"

    extractors:
      - type: dsl
        dsl:
          - '"VM instance " + instanceName + " in zone " + zone + " of project " + projectId + " is not configured to block project-wide SSH keys"'
