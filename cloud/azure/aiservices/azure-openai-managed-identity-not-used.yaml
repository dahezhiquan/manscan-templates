id: azure-openai-managed-identity-not-used
info:
  name: Azure OpenAI 服务实例未使用托管身份（云安全）
  author: princechaddha
  severity: medium
  description: Azure OpenAI 服务实例未配置托管身份时，应用通常需要依赖资源密钥或其他长期凭据访问服务，凭据管理和轮换压力更大。该模板枚举 kind 为 OpenAI 的服务实例，并调用 Azure CLI 查询其身份配置；当 IdentityType 返回 null 或 None 时判定未使用托管身份。
  impact: |
    - 资源密钥被写入代码、配置文件或日志后，可能被用于调用模型、消耗配额，甚至造成敏感提示词和业务数据泄露。
    - 长期凭据依赖人工分发和轮换，增加凭据失控、权限过宽及异常调用难以及时识别的风险。
  remediation: |
    - 为 Azure OpenAI 资源启用系统分配或用户分配的托管身份，并通过 Microsoft Entra ID 和 Azure RBAC 授予调用所需的最小权限。
    - 在完成身份迁移后限制或轮换旧资源密钥，审计令牌使用范围，并持续监控异常调用和权限变更。
  reference:
    - https://docs.microsoft.com/en-us/azure/cognitive-services/authentication
  metadata:
    vendor: microsoft
    product: azure-openai
  tags: cloud,devops,azure,microsoft,openai,azure-cloud-config,ai

flow: |
  code(1);
  for (let ServiceInstance of iterate(template.instanceList)) {
    ServiceInstance = JSON.parse(ServiceInstance);
    set("name", ServiceInstance.Name);
    set("resourceGroup", ServiceInstance.ResourceGroup);
    code(2);
  }

self-contained: true
code:
  - engine:
      - sh
      - bash
    source: |
      az cognitiveservices account list --output json --query '[?(kind==`OpenAI`)].{"Name":name,"ResourceGroup":resourceGroup}'

    extractors:
      - type: json
        name: instanceList
        internal: true
        json:
          - '.[]'

  - engine:
      - sh
      - bash
    source: |
      az cognitiveservices account identity show --name "$name" --resource-group "$resourceGroup" --query '{"IdentityType":type}'

    matchers-condition: and
    matchers:
      - type: word
        words:
          - '"IdentityType": null'
          - '"IdentityType": "None"'

    extractors:
      - type: dsl
        dsl:
          - 'name + " in " + resourceGroup + " does not use a managed identity"'
