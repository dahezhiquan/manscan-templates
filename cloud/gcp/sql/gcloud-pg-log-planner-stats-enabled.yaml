id: gcloud-pg-log-planner-stats-enabled

info:
  name: PostgreSQL 数据库实例启用了 log_planner_stats（云安全）
  author: princechaddha
  severity: medium
  description: PostgreSQL log_planner_stats 会输出查询规划器统计信息，长期启用会造成日志噪声和性能开销。本模板检查 Cloud SQL PostgreSQL 实例 databaseFlags 中 log_planner_stats 的值，匹配 on 时报告该统计日志已启用。
  impact: |
    - 查询规划细节可能暴露业务查询模式，同时增加日志量和数据库诊断噪声。
    - 高负载场景下额外统计开销可能影响查询性能，并干扰安全日志分析。
  remediation: |
    - 关闭 log_planner_stats，仅在明确的性能诊断窗口中临时启用。
    - 将数据库 flag 纳入基线巡检，避免调试配置长期遗留在生产实例。
  reference:
    - https://cloud.google.com/sql/docs/postgres/flags
  metadata:
    vendor: google
    product: cloud-sql
  tags: cloud,devops,gcp,gcloud,google-cloud-sql,postgresql,gcp-cloud-config

flow: |
  code(1)
  for(let projectId of iterate(template.projectIds)){
    set("projectId", projectId)
    code(2)
    for(let sqlInstance of iterate(template.sqlInstances)){
      set("sqlInstance", sqlInstance)
      code(3)
    }
  }

self-contained: true

code:
  - engine:
      - sh
      - bash
    source: |
      gcloud projects list --format="json(projectId)"

    extractors:
      - type: json
        name: projectIds
        internal: true
        json:
          - '.[].projectId'

  - engine:
      - sh
      - bash
    source: |
      gcloud sql instances list --project $projectId --filter='DATABASE_VERSION:POSTGRES*' --format="json(name)"

    extractors:
      - type: json
        name: sqlInstances
        internal: true
        json:
          - '.[].name'

  - engine:
      - sh
      - bash
    source: |
      gcloud sql instances describe $sqlInstance --project $projectId --format=json | jq '.settings.databaseFlags // [] | .[] | select(.name=="log_planner_stats") | .value'

    matchers:
      - type: word
        words:
          - 'on'

    extractors:
      - type: dsl
        dsl:
          - '"The log_planner_stats flag is enabled for PostgreSQL instance " + sqlInstance + " in project " + projectId'
