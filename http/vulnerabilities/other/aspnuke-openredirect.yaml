id: aspnuke-openredirect

info:
  name: ASP-Nuke - 开放重定向漏洞
  author: pdteam
  severity: medium
  description: ASP-Nuke - 开放重定向 存在开放重定向漏洞。攻击者可构造恶意跳转链接诱导用户访问钓鱼站点，或配合其他业务流程绕过安全校验。
  reference:
    - https://packetstormsecurity.com/files/125931/ASP-Nuke-2.0.7-Open-Redirect.html
  classification:
    cvss-metrics: CVSS:3.1/AV:N/AC:L/PR:N/UI:R/S:C/C:L/I:L/A:N
    cvss-score: 6.1
    cwe-id: CWE-601
  metadata:
    max-request: 1
  tags: packetstorm,aspnuke,redirect,vuln

http:
  - method: GET
    path:
      - "{{BaseURL}}/gotoURL.asp?url=interact.sh&id=43569"

    matchers:
      - type: regex
        part: header
        regex:
          - '(?m)^(?:Location\s*:\s*)(?:https?://|//)?(?:[a-zA-Z0-9\-_]*\.)?interact\.sh(?:\s*)$'
