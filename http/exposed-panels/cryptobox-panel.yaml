id: cryptobox-panel

info:
  name: Cryptobox 面板识别（指纹识别）
  author: righettod
  severity: info
  description: |-
    检测到目标站点存在 Cryptobox 相关响应特征。Cryptobox 是监控、日志、分析或可观测性系统，用于展示运行指标、告警事件、日志数据和服务状态。模板请求 `/`，并通过页面标题或正文关键字、状态码确认该系统指纹，用于资产识别、系统盘点和暴露面梳理。
  reference:
    - https://www.ercom.com/solutions/cryptobox-presentation
  metadata:
    verified: true
    max-request: 1
    shodan-query: title:"Cryptobox"
  tags: panel,cryptobox,login,detect,discovery
http:
  - method: GET
    path:
      - '{{BaseURL}}'

    host-redirects: true
    max-redirects: 2

    matchers-condition: and
    matchers:
      - type: word
        part: body
        words:
          - 'Cryptobox</title>'
        case-insensitive: true

      - type: status
        status:
          - 200

    extractors:
      - type: regex
        part: body
        group: 1
        regex:
          - 'version[0-9%A]+v([0-9.\-a-z]+)'
