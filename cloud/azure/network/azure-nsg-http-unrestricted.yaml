id: azure-nsg-http-unrestricted
info:
  name: Azure NSG 对互联网开放 HTTP 端口 80（云安全）
  author: princechaddha
  severity: high
  description: TCP 80 通常承载未加密的 HTTP 请求；对互联网开放时，客户端与服务端之间的明文流量可能被窃听或篡改，并扩大 Web 应用的攻击面。本模板查询入站允许的 TCP 80 NSG 规则，并在来源地址为 *、internet 或 any 时报告。
  impact: |
    - 会话信息、认证令牌或业务数据可能在传输中被窃取或修改，用户可能被重定向到恶意页面。
    - 公网 Web 服务还会持续暴露于扫描、应用漏洞利用和资源耗尽攻击。
  remediation: |
    - 将公网 HTTP 请求重定向到 HTTPS，关闭不必要的 TCP 80 入站规则并强制使用安全传输。
    - 通过 WAF、访问限制和最小化后端暴露面保护仍需公网提供服务的 Web 应用。
  reference:
    - https://docs.microsoft.com/en-us/azure/virtual-network/network-security-groups-overview
  metadata:
    vendor: microsoft
    product: azure-network-security-group
  tags: cloud,devops,azure,microsoft,nsg,azure-cloud-config

flow: |
  code(1);
  for (let NsgData of iterate(template.nsgdata)) {
    NsgData = JSON.parse(NsgData)
    set("nsg", NsgData.name)
    set("resourcegroup", NsgData.resourceGroup)
    code(2)
  }

self-contained: true
code:
  - engine:
      - sh
      - bash
    source: |
      az network nsg list --query '[*].{name:name, resourceGroup:resourceGroup}' --output json

    extractors:
      - type: json
        name: nsgdata
        internal: true
        json:
          - '.[]'

  - engine:
      - sh
      - bash
    source: |
      az network nsg rule list --nsg-name $nsg --resource-group $resourcegroup --query "[?direction=='Inbound' && access=='Allow' && protocol=='TCP' && (destinationPortRange=='80')]"

    matchers:
      - type: word
        words:
          - '"sourceAddressPrefix": "*"'
          - '"sourceAddressPrefix": "internet"'
          - '"sourceAddressPrefix": "any"'

    extractors:
      - type: dsl
        dsl:
          - 'nsg + " has unrestricted access on TCP port 80"'
