id: cisco-expressway-panel

info:
  name: CISCO Expressway 登录面板识别（指纹识别）
  author: righettod
  severity: info
  description: |
    该模板通过识别 CISCO Expressway 登录入口的页面标题、特征文本或重定向行为，判断目标是否暴露了对应的认证界面。若命中，说明该登录面板对外可访问，可用于暴露面梳理与后续安全评估。
  reference:
    - https://www.cisco.com/c/en/us/products/unified-communications/expressway-series/index.html
  classification:
    cpe: cpe:2.3:a:cisco:expressway_software:*:*:*:*:*:*:*:*
  metadata:
    verified: true
    max-request: 1
    vendor: cisco
    product: expressway_software
    shodan-query: html:"Cisco Expressway"
  tags: panel,cisco,login,detect,discovery

http:
  - method: GET
    path:
      - "{{BaseURL}}/login"

    matchers:
      - type: dsl
        dsl:
          - 'status_code == 200'
          - 'contains_any(to_lower(body), "cisco expressway", "cisco expway")'
        condition: and

    extractors:
      - type: regex
        part: body
        group: 1
        regex:
          - 'Cisco\s+(?:Expressway|Expway)\s+([A-Za-z\s]+)<\/legend>'
