id: azure-storage-public-access
info:
  name: Azure Storage 公开可访问 Web Containers（云安全）
  author: princechaddha
  severity: high
  description: Azure Monitor 订阅级诊断设置可能将活动日志写入 Storage 账户的 insights-operational-logs 容器；该容器的 publicAccess 为 container 时，容器内日志可被匿名读取。本模板枚举订阅诊断设置，获取其 storageAccountId，再查询 insights-operational-logs 的 properties.publicAccess，在返回 container 时报告日志容器公开可访问。
  impact: |
    - 未授权用户可能读取活动日志中的资源名称、订阅标识、操作记录和错误信息，辅助枚举环境与构造后续攻击。
    - 日志若包含敏感参数或租户内部信息，公开读取会造成信息泄露，并削弱对审计数据访问边界的控制。
  remediation: |
    - 将 insights-operational-logs 容器的公共访问级别设置为 Private，并检查账户级 allowBlobPublicAccess 和现有容器 ACL。
    - 对存储诊断日志的账户启用网络限制、Private Endpoint 和最小权限访问，随后核验诊断设置仍能正常写入并设置合理保留期。
  reference:
    - https://docs.microsoft.com/en-us/azure/storage/common/storage-account-overview
  metadata:
    vendor: microsoft
    product: azure-storage
  tags: cloud,devops,azure,microsoft,storage,azure-cloud-config

flow: |
  code(1);
  for (let subName of iterate(template.subscriptionNames)) {
    set("subName", subName);
    code(2);
    for (let containerDetails of iterate(template.containerDetails)) {
      set("containerDetails", containerDetails);
      code(3);
    }
  }

self-contained: true
code:
  - engine:
      - sh
      - bash
    source: |
      az monitor diagnostic-settings subscription list --query 'value[*].name'

    extractors:
      - type: json
        name: subscriptionNames
        internal: true
        json:
          - '.[]'

  - engine:
      - sh
      - bash
    source: |
      az monitor diagnostic-settings subscription show --name "$subName" --query 'storageAccountId'

    extractors:
      - type: json
        name: containerDetails
        internal: true
        json:
          - '.'

  - engine:
      - sh
      - bash
    source: |
      az storage container show --account-name $containerDetails --name insights-operational-logs --query 'properties.publicAccess'

    matchers:
      - type: word
        words:
          - 'container'

    extractors:
      - type: dsl
        dsl:
          - 'subName + " storage container insights-operational-logs is publicly accessible"'
