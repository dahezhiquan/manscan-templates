id: gcloud-backend-bucket-missing-storage

info:
  name: Backend Buckets Referencing 缺失 Storage Buckets（云安全）
  author: princechaddha
  severity: high
  description: Cloud CDN backend bucket 引用的 Cloud Storage bucket 如果已不存在，负载均衡转发可能指向无效源站。本模板枚举项目 URL map 和 backend bucket，并通过 gcloud storage buckets describe 检查目标 bucket，返回 404 时报告后端引用缺失存储桶。
  impact: |
    - CDN 或负载均衡请求可能无法从源站取回内容，造成静态资源访问失败或业务可用性下降。
    - 残留的后端引用会增加排障成本，并可能掩盖已下线资源仍被生产流量依赖的问题。
  remediation: |
    - 修正 backend bucket 指向的 Cloud Storage bucket，或重新创建并加固确需使用的源站 bucket。
    - 清理无效 URL map、backend bucket 和负载均衡配置，避免已下线资源继续承载流量路径。
  reference:
    - https://cloud.google.com/cdn/docs/backends
  metadata:
    vendor: google
    product: cloud-cdn
  tags: cloud,devops,gcp,gcloud,cdn,cloud-cdn,gcp-cloud-config

flow: |
  code(1)
  for(let projectId of iterate(template.projectIds)){
    set("projectId", projectId)
    code(2)
    for(let urlMap of iterate(template.urlMaps)){
      set("urlMapName", urlMap)
      code(3)
      for(let backendBucket of iterate(template.backendBuckets)){
        set("backendBucketName", backendBucket)
        code(4)
      }
    }
  }

self-contained: true

code:
  - engine:
      - sh
      - bash
    source: |
      gcloud projects list --format="json(projectId)"

    extractors:
      - type: json
        name: projectIds
        internal: true
        json:
          - '.[].projectId'

  - engine:
      - sh
      - bash
    source: |
      gcloud compute url-maps list --project $projectId --format="json(name,defaultService)"

    extractors:
      - type: json
        name: urlMaps
        internal: true
        json:
          - '.[].name'

  - engine:
      - sh
      - bash
    source: |
      gcloud compute backend-buckets describe $backendBucket --project $projectId --format="json(bucketName)"

    extractors:
      - type: json
        name: backendBuckets
        internal: true
        json:
          - '.bucketName'

  - engine:
      - sh
      - bash
    source: |
      gcloud storage buckets describe gs://$backendBucket --project $projectId

    matchers:
      - type: word
        words:
          - "404"

    extractors:
      - type: dsl
        dsl:
          - '"Missing Storage Bucket for Backend Bucket: " + backendBucketName + " in URL Map: " + urlMapName + " of Project: " + projectId'
