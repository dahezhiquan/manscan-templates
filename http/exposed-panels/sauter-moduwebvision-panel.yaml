id: sauter-moduwebvision-panel

info:
  name: SAUTER moduWeb Vision 面板识别（暴露面识别）
  author: righettod
  severity: info
  description: |
    该模板通过识别 SAUTER moduWeb Vision 面板、控制台或管理界面的页面特征，判断目标是否暴露了对应服务入口。若命中，说明该后台或运维界面对外可访问，可用于资产识别与暴露面排查。
  reference:
    - https://www.sauter-controls.com
  classification:
    cpe: cpe:2.3:o:sauter:moduweb_vision:*:*:*:*:*:*:*:*
  metadata:
    verified: true
    max-request: 1
    vendor: sauter
    product: moduweb_vision
    shodan-query: http.favicon.hash:-1663319756
    fofa-query: icon_hash=-1663319756
  tags: panel,moduweb,sauter,login,discovery

http:
  - method: GET
    path:
      - '{{BaseURL}}/login'

    host-redirects: true
    max-redirects: 2

    matchers-condition: and
    matchers:
      - type: word
        part: body
        words:
          - '<title>SAUTER moduWeb Vision</title>'

      - type: status
        status:
          - 200
