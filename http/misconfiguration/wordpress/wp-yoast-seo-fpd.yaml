id: wp-yoast-seo-fpd

info:
  name: WordPress Yoast SEO 完整路径泄露
  author: ritikchaddha
  severity: low
  description: |
    检测到 WordPress Yoast SEO 完整路径泄露。目标暴露了调试、错误或堆栈信息，可能泄露应用路径、框架版本、环境变量、源码位置或内部调用细节。
  reference:
    - https://wordpress.org/plugins/wordpress-seo/
  metadata:
    verified: true
    max-request: 3
    vendor: yoast
    product: wordpress-seo
    framework: wordpress
    fofa-query: body="/wp-content/plugins/wordpress-seo/"
  tags: wp,wordpress,wp-plugin,fpd,yoast,seo,exposure

http:
  - method: GET
    path:
      - "{{BaseURL}}/wp-content/plugins/wordpress-seo/src/main.php"
      - "{{BaseURL}}/wp-content/plugins/wordpress-seo/admin/class-admin.php"
      - "{{BaseURL}}/wp-content/plugins/wordpress-seo/inc/class-wpseo-utils.php"

    stop-at-first-match: true

    matchers-condition: and
    matchers:
      - type: word
        part: body
        words:
          - "Fatal error"
          - "/plugins/wordpress-seo"
          - "Uncaught TypeError:"
        condition: and

      - type: status
        status:
          - 200
