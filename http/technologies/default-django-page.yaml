id: default-django-page

info:
  name: Django 默认页面 指纹识别（指纹识别）
  author: dhiyaneshDk
  severity: info
  description: Django 默认页面 是 Python Web 框架，用于构建后端应用、管理后台和 API 服务。该模板请求首页，并依据页面标题、正文关键字或品牌资源特征识别目标是否使用或暴露了 Django 默认页面 相关组件，适用于资产盘点、技术栈识别和后续安全评估；命中结果仅表示指纹特征匹配，不代表已确认存在可利用漏洞。
  classification:
    cpe: cpe:2.3:a:djangoproject:django:*:*:*:*:*:*:*:*
  metadata:
    max-request: 1
    vendor: djangoproject
    product: django
    shodan-query: http.title:"The install worked successfully! Congratulations!"
  tags: tech,django,discovery

http:
  - method: GET
    path:
      - '{{BaseURL}}'

    matchers:
      - type: word
        words:
          - "<title>The install worked successfully! Congratulations!</title>"
        part: body
