id: crypto-address-detect

info:
  name: 加密货币钱包地址暴露检测
  author: rxerium
  severity: info
  description: |
    检测网页内容中是否暴露 Bitcoin、Monero、Ethereum 或 XRP 等加密货币钱包地址。该信息可用于 OSINT 关联分析，也可能暴露业务收款地址或链上资产线索。
  reference:
    - https://bitcoin.org/
    - https://xrpl.org/
    - https://www.getmonero.org/
    - https://en.wikipedia.org/wiki/Ethereum
  metadata:
    max-request: 1
    verified: true
  tags: crypto,bitcoin,monero,ethereum,xrp,ripple,osint,discovery

http:
  - method: GET
    path:
      - "{{BaseURL}}"

    matchers:
      - name: bitcoin-address
        type: dsl
        dsl:
          - 'regex("([13][a-km-zA-HJ-NP-Z1-9]{25,34})", body)'
          - 'status_code == 200'
        condition: and

      - name: monero-address
        type: dsl
        dsl:
          - 'regex("(4[0-9AB][1-9A-HJ-NP-Za-km-z]{93})", body)'
          - 'status_code == 200'
        condition: and

      - name: ethereum-address
        type: dsl
        dsl:
          - 'regex("(0x[a-fA-F0-9]{40})", body)'
          - 'status_code == 200'
        condition: and

      - name: xrp-address
        type: dsl
        dsl:
          - 'regex("(r[0-9a-zA-Z]{24,34})", body)'
          - 'status_code == 200'
        condition: and
