id: weebly-detect

info:
  name: Weebly 指纹识别（指纹识别）
  author: Chirag Mistry
  severity: info
  description: |
    用于识别目标是否部署 Weebly 并提取相关版本或构建信息，模板会结合 favicon 哈希、HTTP 响应头、页面正文、状态码、特定路径或已知端点和版本或标识提取结果进行指纹匹配。
  metadata:
    max-request: 7
    shodan-query: product:"Weebly"
  tags: weebly, detect, tech

http:
  - method: GET
    path:
      - "{{BaseURL}}"
      - "{{BaseURL}}/robots.txt"
      - "{{BaseURL}}/sitemap.xml"
      - "{{BaseURL}}/favicon.ico"
      - "{{BaseURL}}/index.php"
      - "{{BaseURL}}/weebly/"
      - "{{BaseURL}}/site/"

    stop-at-first-match: true
    matchers-condition: and
    matchers:
      - type: word
        part: response
        words:
          - "Powered by Weebly"
          - "weebly.com"
          - "X-Powered-By-Weebly"
        condition: or
        case-insensitive: true

      - type: status
        status:
          - 200
          - 403

    extractors:
      - type: regex
        part: body
        name: version
        regex:
          - 'Weebly ([0-9.]+)'
          - 'Powered by Weebly ([0-9.]+)'

      - type: regex
        part: body
        name: weebly_id
        regex:
          - 'weebly-site-id=([a-z0-9]+)'
          - 'weebly\.com/([^/]+)'
