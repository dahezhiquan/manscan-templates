id: jazzhr-takeover

info:
  name: JazzHR 账号停用接管检测（子域名接管）
  author: pdteam
  severity: high
  description: 检测 JazzHR 返回账号不再活跃的提示，说明目标招聘子域名可能仍指向 JazzHR 但关联账号已停用，存在被重新配置后接管的风险。
  reference:
    - https://github.com/EdOverflow/can-i-take-over-xyz
  metadata:
    max-request: 1
  tags: takeover,vuln

http:
  - method: GET
    path:
      - "{{BaseURL}}"

    matchers-condition: and
    matchers:
      - type: dsl
        dsl:
          - Host != ip

      - type: word
        words:
          - This account no longer active

    extractors:
      - type: dsl
        dsl:
          - cname
