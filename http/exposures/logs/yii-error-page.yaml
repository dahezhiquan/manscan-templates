id: yii-error-page

info:
  name: Yii Error 页面 Detct 泄露（暴露面识别）
  author: DhiyaneshDk
  severity: unknown
  description: 检测到可直接访问的 Yii Error 页面 Detct。日志、异常页面或调试输出通常会泄露堆栈信息、内部路径、查询语句、账号标识、令牌片段或业务数据，不应向未授权用户开放。
  classification:
    cpe: cpe:2.3:a:yii_software:yii:*:*:*:*:*:*:*:*
  metadata:
    verified: true
    max-request: 1
    vendor: yii_software
    product: yii
    shodan-query: html:"yii\base\ErrorException"
  tags: exposure,yii,logs,vuln

http:
  - method: GET
    path:
      - "{{BaseURL}}"

    matchers-condition: and
    matchers:
      - type: word
        part: body
        words:
          - '<title>yii\base\ErrorException</title>'

      - type: status
        status:
          - 500
