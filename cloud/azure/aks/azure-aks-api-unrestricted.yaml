id: azure-aks-api-unrestricted
info:
  name: Azure AKS API Server 未限制授权 IP 范围（云安全）
  author: princechaddha
  severity: high
  description: AKS API Server 未配置授权 IP 范围时，控制平面入口可能从更广泛的公网位置接收连接，增加凭据滥用和控制面探测风险。该模板枚举 AKS 集群，查询 apiServerAccessProfile.authorizedIpRanges，并在返回结果未包含有效授权 IP 范围时报告问题。
  impact: |
    - 攻击者可从非受信网络持续探测 Kubernetes API，并在窃取 kubeconfig、令牌或其他凭据后尝试控制集群。
    - 控制平面暴露面过大，会增加暴力尝试、漏洞利用和异常管理操作的发现与阻断难度。
  remediation: |
    - 为 AKS API Server 配置仅覆盖办公出口、运维跳板机和 CI/CD 出口的授权 IP 范围。
    - 对高敏感集群优先使用 Private Cluster，并结合 Entra ID、RBAC 和最小权限控制 API 访问。
  reference:
    - https://docs.microsoft.com/en-us/azure/aks/api-server-authorized-ip-ranges
  metadata:
    vendor: microsoft
    product: azure-kubernetes-service
  tags: cloud,devops,azure,microsoft,aks,azure-cloud-config

flow: |
  code(1);
  for (let ClusterData of iterate(template.clusterList)) {
    ClusterData = JSON.parse(ClusterData);
    set("name", ClusterData.name);
    set("resourceGroup", ClusterData.resourceGroup);
    code(2);
  }

self-contained: true
code:
  - engine:
      - sh
      - bash
    source: |
      az aks list --output json --query '[*].{name:name, resourceGroup:resourceGroup}'

    extractors:
      - type: json
        name: clusterList
        internal: true
        json:
          - '.[]'

  - engine:
      - sh
      - bash
    source: |
      az aks show --name "$name" --resource-group "$resourceGroup" --query 'apiServerAccessProfile.authorizedIpRanges'

    matchers-condition: and
    matchers:
      - type: word
        part: body
        negative: true

    extractors:
      - type: dsl
        dsl:
          - 'name + " in " + resourceGroup + " does not have authorized IP ranges configured for AKS API server access"'
