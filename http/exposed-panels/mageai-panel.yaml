id: mageai-panel

info:
  name: Mage AI 面板识别（暴露面识别）
  author: ChrisJr404
  severity: info
  description: |
    该模板用于识别 Mage AI 是否存在对外暴露的管理、服务或状态界面。若命中，说明目标公开了相关功能入口，可作为资产盘点与攻击面收敛的依据。
  reference:
    - https://github.com/mage-ai/mage-ai
    - https://docs.mage.ai/
  metadata:
    verified: true
    max-request: 2
    vendor: mage_ai
    product: mage-ai
    shodan-query: http.title:"Mage"
    fofa-query: title="Mage"
  tags: panel,mageai,detect

http:
  - method: GET
    path:
      - "{{BaseURL}}"
      - "{{BaseURL}}/api/status"

    host-redirects: true
    max-redirects: 2
    stop-at-first-match: true

    matchers:
      - type: dsl
        dsl:
          - 'status_code == 200 && contains(to_lower(body), "<title>mage</title>")'
          - 'status_code == 200 && contains_all(body, "status\":\"OK", "\"is_instance_healthy\":true")'
          - 'status_code == 200 && contains_all(body, "statuses\":", "is_instance_manager\":", "scheduler_status\":")'
        condition: or
