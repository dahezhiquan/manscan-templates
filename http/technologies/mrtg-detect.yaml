id: mrtg-detect

info:
  name: MRTG 指纹识别（指纹识别）
  author: geeknik
  severity: info
  description: >-
    MRTG 是网络流量监控工具，用于采集 SNMP 数据并生成带宽和设备状态图表。该模板通过请求目标服务并检查预设路径或首页响应、状态码、页面正文关键字等指纹特征，判断目标是否使用或暴露了
    MRTG 相关组件；命中结果仅表示指纹特征匹配，可用于资产盘点、技术栈识别和后续安全评估，不代表已确认存在可利用漏洞。
  reference:
  - https://oss.oetiker.ch/mrtg/
  metadata:
    max-request: 3
  tags: tech,mrtg,discovery
http:
  - method: GET
    path:
      - "{{BaseURL}}"
      - "{{BaseURL}}/mrtg/"
      - "{{BaseURL}}/MRTG/"

    stop-at-first-match: true

    matchers-condition: and
    matchers:
      - type: status
        status:
          - 200

      - type: word
        part: body
        words:
          - "MRTG Index Page"
          - "Multi Router Traffic Grapher"
        condition: and
