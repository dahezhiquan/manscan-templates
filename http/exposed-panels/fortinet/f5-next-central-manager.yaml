id: f5-next-central-manager

info:
  name: F5 Next Central Manager 面板识别（暴露面识别）
  author: EgemenKochisarli
  severity: info
  description: |
    该模板通过识别 F5 Next Central Manager 登录入口的页面标题、特征文本或重定向行为，判断目标是否暴露了对应的认证界面。若命中，说明该登录面板对外可访问，可用于暴露面梳理与后续安全评估。
  reference:
    - https://clouddocs.f5.com/bigip-next/latest/use_cm/
  classification:
    cvss-metrics: CVSS:3.0/AV:N/AC:L/PR:N/UI:N/S:U/C:N/I:N/A:N
    cwe-id: CWE-200
    cpe: cpe:2.3:h:f5:big-ip:*:*:*:*:*:*:*:*
  metadata:
    verified: true
    max-request: 1
    vendor: f5
    product: big-ip
  tags: panel,fortinet,login,f5,discovery

http:
  - method: GET
    path:
      - "{{BaseURL}}/gui/login"

    matchers-condition: and
    matchers:
      - type: word
        words:
          - "<title>BIG-IP Next | Central Manager"

      - type: status
        status:
          - 200
