id: gitea-detect

info:
  name: Gitea 指纹识别（指纹识别）
  author: pikpikcu,righettod
  severity: info
  description: >-
    Gitea 是轻量级自托管 Git 代码托管平台，提供仓库、工单、合并请求和用户管理功能。该模板通过请求目标服务并检查预设路径或首页响应、页面正文关键字、正则特征、状态码等指纹特征，判断目标是否使用或暴露了
    Gitea 相关组件；命中结果仅表示指纹特征匹配，可用于资产盘点、技术栈识别和后续安全评估，不代表已确认存在可利用漏洞。
  reference:
  - https://about.gitea.com/
  - https://docs.gitea.com/api
  metadata:
    verified: true
    max-request: 1
    shodan-query: http.title:"Gitea"
  tags: tech,gitea,discovery
http:
  - method: GET
    path:
      - "{{BaseURL}}/user/login"

    matchers-condition: and
    matchers:
      - type: word
        part: body
        words:
          - "Powered by Gitea"
          - 'content="Gitea'
        condition: or

      - type: status
        status:
          - 200

    extractors:
      - type: regex
        part: body
        group: 1
        regex:
          - "Powered by Gitea(\\s*)Version:(\\s*)([\\d.]+)"
          - "Gitea Version: ([0-9a-z+-.~]+)"
          - 'theme-gitea-auto.css\?v=([0-9a-z+-.~]+)'
          - 'encodeURIComponent.{2}([0-9a-z+-.~]+).{2}'
