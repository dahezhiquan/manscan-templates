id: churchcrm-panel

info:
  name: ChurchCRM 面板识别（指纹识别）
  author: Kazgangap
  severity: info
  description: |-
    检测到目标站点存在 ChurchCRM 相关响应特征。ChurchCRM 是监控、日志、分析或可观测性系统，用于展示运行指标、告警事件、日志数据和服务状态。模板请求 `/session/begin`，并通过页面标题或正文关键字、状态码、DSL 条件确认该系统指纹，用于资产识别、系统盘点和暴露面梳理。
  reference:
    - https://github.com/ChurchCRM/CRM
  metadata:
    vendor: churchcrm
    product: churchcrm
    shodan-query: http.title:"churchcrm"
    fofa-query: app="churchcrm"
  tags: panel,login,churchcrm,detect,discovery
http:
  - method: GET
    path:
      - "{{BaseURL}}/session/begin"

    host-redirects: true
    max-redirects: 2
    matchers:
      - type: dsl
        dsl:
          - 'contains_all(body, "<title>ChurchCRM", "Login")'
          - "status_code == 200"
        condition: and
