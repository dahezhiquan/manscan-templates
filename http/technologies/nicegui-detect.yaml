id: nicegui-detect

info:
  name: NiceGUI 指纹识别（指纹识别）
  author: theamanrawat
  severity: info
  description: >-
    NiceGUI 是 Python Web UI 框架，用于快速构建浏览器端交互界面、仪表盘和内部工具。该模板通过请求目标服务并检查预设路径或首页响应、HTTP
    响应头、页面正文关键字、正则特征等指纹特征，判断目标是否使用或暴露了 NiceGUI 相关组件；命中结果仅表示指纹特征匹配，可用于资产盘点、技术栈识别和后续安全评估，不代表已确认存在可利用漏洞。
  metadata:
    max-request: 1
    shodan-query: "x-nicegui-content"
  tags: nicegui,detect,tech
http:
  - method: GET
    path:
      - "{{BaseURL}}"

    matchers-condition: and
    matchers:
      - type: word
        part: header
        words:
          - "x-nicegui-content"
        case-insensitive: true

    extractors:
      - type: regex
        part: body
        group: 1
        regex:
          - '/_nicegui/([0-9.]+)/'
