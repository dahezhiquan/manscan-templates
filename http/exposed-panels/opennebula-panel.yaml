id: opennebula-panel

info:
  name: OpenNebula 登录面板识别（暴露面识别）
  author: kh4sh3i,darses
  severity: info
  description: |
    该模板通过识别 OpenNebula 登录入口的页面标题、特征文本或重定向行为，判断目标是否暴露了对应的认证界面。若命中，说明该登录面板对外可访问，可用于暴露面梳理与后续安全评估。
  reference:
    - https://opennebula.io/
    - https://github.com/OpenNebula
  classification:
    cvss-metrics: CVSS:3.0/AV:N/AC:L/PR:N/UI:N/S:U/C:N/I:N/A:N
    cwe-id: CWE-200
  metadata:
    verified: true
    max-request: 1
    shodan-query:
      - http.html:"opennebula"
      - title:"OpenNebula Sunstone Login"
      - http.favicon.hash:-1616420987
      - http.favicon.hash:656672194
    fofa-query:
      - title="OpenNebula Sunstone Login"
      - icon_hash="-119786698"
      - icon_hash="656672194"
  tags: panel,opennebula,discovery

http:
  - method: GET
    path:
      - "{{BaseURL}}"

    matchers-condition: and
    matchers:
      - type: word
        part: body
        words:
          - "<title>OpenNebula"
          - "OpenNebula Systems"
          - 'target="_blank">OpenNebula'
        condition: or

      - type: status
        status:
          - 200

    extractors:
      - type: regex
        group: 1
        regex:
          - "href=\"css/app\\.min\\.css\\?v=([\\d\\.]+)\""
