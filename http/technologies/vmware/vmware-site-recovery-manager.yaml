id: vmware-site-recovery-manager

info:
  name: VMware Site Recovery Manager 面板指纹识别（指纹识别）
  author: dhiyaneshDk
  severity: info
  description: 用于识别目标暴露的 VMware Site Recovery Manager 面板，模板会结合页面标题、页面正文、状态码和特定路径或已知端点判断是否存在对应技术或默认页面特征。
  classification:
    cvss-metrics: CVSS:3.0/AV:N/AC:L/PR:N/UI:N/S:U/C:N/I:N/A:N
    cvss-score: 0
    cwe-id: CWE-200
  metadata:
    max-request: 1
    shodan-query: http.title:"Welcome to VMware Site Recovery Manager"
  tags: panel,vmware,tech,discovery

http:
  - method: GET
    path:
      - "{{BaseURL}}/configure/app/landing/welcome-srm-va.html"

    matchers-condition: and
    matchers:
      - type: word
        part: body
        words:
          - "<title>Welcome to VMware Site Recovery Manager</title>"

      - type: status
        status:
          - 200
