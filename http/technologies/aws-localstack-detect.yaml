id: aws-localstack-detect

info:
  name: LocalStack 指纹识别（指纹识别）
  author: ChrisJr404
  severity: info
  description: |-
    LocalStack 是本地 AWS 云服务模拟平台，用于开发测试云服务 API 和集成流程。该模板请求 `/_localstack/health`，并依据 DSL 条件识别目标是否使用或暴露了 LocalStack 相关组件，适用于资产盘点、技术栈识别和后续安全评估；命中结果仅表示指纹特征匹配，不代表已确认存在可利用漏洞。
  reference:
  - https://github.com/localstack/localstack
  - https://docs.localstack.cloud/references/internal-endpoints/
  metadata:
    verified: true
    max-request: 1
    vendor: localstack
    product: localstack
    shodan-query: '"localstack"'
    fofa-query: 'body="LocalStack"'
  tags: localstack,aws,cloud,detect,discovery,tech

http:
  - method: GET
    path:
      - "{{BaseURL}}/_localstack/health"

    matchers:
      - type: dsl
        dsl:
          - 'status_code == 200'
          - 'contains(body, "\"services\"")'
          - 'contains(body, "\"edition\"") || contains(body, "\"version\"")'
          - 'contains(to_lower(header), "application/json")'
        condition: and

    extractors:
      - type: regex
        part: body
        group: 1
        regex:
          - '"version"\s*:\s*"([^"]+)"'
          - '"edition"\s*:\s*"([^"]+)"'
