id: azure-vm-boot-disk-unencrypted
info:
  name: Azure VM Boot Disk 未Encrypted（云安全）
  author: princechaddha
  severity: medium
  description: Azure VM 操作系统磁盘保存系统文件、应用配置、日志和本地凭据；未启用磁盘加密时，磁盘介质、快照或备份被读取可能导致离线数据泄露。本模板枚举虚拟机并执行 az vm encryption show，在标准错误中匹配 Azure Disk Encryption is not enabled 时报告。
  impact: |
    - 本地账户凭据、配置文件、密钥和业务数据可能在磁盘脱离虚拟机后被恢复，造成主机或云资源进一步被接管。
    - 未加密的启动盘不满足高敏感数据的静态保护要求，并增加备份、迁移和退役介质的泄露风险。
  remediation: |
    - 为操作系统磁盘启用 Azure Disk Encryption 或适用的服务器端加密，并根据治理要求配置客户管理密钥。
    - 启用前确认恢复、扩容和备份流程，完成后验证磁盘、快照及备份的加密状态并持续审计密钥访问。
  reference:
    - https://docs.microsoft.com/en-us/azure/virtual-machines/linux/encrypt-disks
  metadata:
    vendor: microsoft
    product: azure-virtual-machines
  tags: cloud,devops,azure,microsoft,vm-disk-encryption,azure-cloud-config

flow: |
  code(1);
  for (let VMData of iterate(template.vmList)) {
    VMData = JSON.parse(VMData);
    set("ids", VMData.id);
    code(2);
  }

self-contained: true
code:
  - engine:
      - sh
      - bash
    source: |
      az vm list --query '[*].{"id":id}'

    extractors:
      - type: json
        name: vmList
        internal: true
        json:
          - '.[]'

  - engine:
      - sh
      - bash
    source: |
      az vm encryption show --ids "$ids" --query 'osDisk'

    matchers-condition: and
    matchers:
      - type: word
        part: stderr
        words:
          - 'Azure Disk Encryption is not enabled'

    extractors:
      - type: dsl
        dsl:
          - 'ids + " VM Boot Disk is not encrypted"'
