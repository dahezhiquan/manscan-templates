id: froxlor-installer

info:
  name: Froxlor 服务器 管理 安装向导
  author: DhiyaneshDK
  severity: high
  description: |
    检测到 Froxlor 服务器 管理 安装向导。该页面属于安装、初始化或配置向导流程，若对外暴露，攻击者可能完成初始化、创建管理员账户或重新配置目标系统。
  reference:
    - https://www.exploit-db.com/ghdb/8397
  classification:
    cpe: cpe:2.3:a:froxlor:froxlor:*:*:*:*:*:*:*:*
  metadata:
    verified: true
    max-request: 1
    vendor: froxlor
    product: froxlor
    fofa-query: title="Froxlor Server Management Panel - Installation"
  tags: misconfig,froxlor,installer,vuln

http:
  - method: GET
    path:
      - "{{BaseURL}}/install/install.php"

    matchers-condition: and
    matchers:
      - type: word
        part: body
        words:
          - "<title>Froxlor Server Management Panel - Installation"

      - type: status
        status:
          - 200
