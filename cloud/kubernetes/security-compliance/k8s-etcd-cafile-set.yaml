id: k8s-etcd-cafile-set

info:
  name: Ensure etcd-cafile argument set（云安全）
  author: princechaddha
  severity: medium
  description: etcd 未设置可信 CA 文件会削弱客户端或对端证书校验，增加中间人攻击和未授权连接风险。本模板读取 kube-system 中 etcd Pod 启动命令，发现包含 etcd 但缺少 etcd-cafile 参数时报告。
  impact: |
    - etcd 与客户端之间的 TLS 信任链不完整，敏感集群状态数据可能被窃听或篡改。
    - 攻击者可能利用弱校验连接 etcd，进一步读取或修改集群关键数据。
  remediation: |
    - 为 etcd 配置 etcd-cafile，并确保客户端证书由可信 CA 签发。
    - 定期轮换 CA 和证书，限制 etcd 监听地址与网络访问来源。
  reference:
    - https://etcd.io/docs/v3.5/op-guide/security/
  metadata:
    vendor: kubernetes
    product: etcd
  tags: cloud,devops,kubernetes,devsecops,etcd,k8s-cluster-security
variables:
  argument: "etcd-cafile"

self-contained: true
code:
  - engine:
      - sh
      - bash
    source: |
      kubectl get pods -n kube-system -l component=etcd -o jsonpath="{.items[*].spec.containers[*].command}"

    matchers-condition: and
    matchers:
      - type: word
        words:
          - 'etcd'

      - type: word
        words:
          - "etcd-cafile"
        negative: true

    extractors:
      - type: dsl
        dsl:
          - '"Etcd configuration is missing the " + argument + " argument"'
