id: wildcard-dns-detect

info:
  name: 通配符 DNS 配置检测（dns）
  author: rxerium
  severity: info
  description: |
    通配符 DNS 记录会让未显式配置的多个子域名解析到同一地址或服务，常用于统一入口，但也会掩盖真实资产边界和拼写错误。本模板查询两个随机生成的不存在子域名，若第二次查询返回 `IN A` 及 IPv4 地址，则将其作为通配符解析线索；命中不代表该配置一定不安全。
  impact: |
    - 随机子域名也能解析会降低子域名枚举和漏洞扫描的准确性，造成资产误报并掩盖已下线主机。
    - 如果后端未正确校验 Host、租户或路由，任意子域名被导向共享服务可能扩大未预期的内容暴露和域名滥用范围。
  remediation: |
    - 仅在确有业务需要时使用通配符记录，并将其指向专用默认站点或受控入口，而不是敏感管理服务。
    - 在应用、反向代理和 CDN 层严格校验 Host 和租户映射，对未知子域名返回明确的拒绝或空响应。
    - 将通配符配置纳入资产发现策略，定期复核其覆盖范围、目标地址和后端服务是否仍由组织控制。
  reference:
    - https://en.wikipedia.org/wiki/Wildcard_DNS_record
    - https://developers.cloudflare.com/dns/manage-dns-records/reference/wildcard-dns-records/
  classification:
    cwe-id: CWE-200
  metadata:
    max-request: 2
  tags: dns,wildcard,discovery

dns:
  - name: "{{randstr}}.{{FQDN}}"
    type: A

  - name: "{{randstr}}-{{randstr}}.{{FQDN}}"
    type: A

    matchers-condition: and
    matchers:
      - type: word
        words:
          - "IN\tA\t"
        part: answer

      - type: regex
        regex:
          - "IN\tA\t([0-9]{1,3}\\.[0-9]{1,3}\\.[0-9]{1,3}\\.[0-9]{1,3})"
        part: answer

    extractors:
      - type: regex
        group: 1
        regex:
          - "IN\tA\t([0-9]{1,3}\\.[0-9]{1,3}\\.[0-9]{1,3}\\.[0-9]{1,3})"
