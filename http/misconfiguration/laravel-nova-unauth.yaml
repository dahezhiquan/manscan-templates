id: laravel-nova-unauth

info:
  name: Laravel Nova 未授权 管理面板 访问
  author: moamenbasel
  severity: high
  description: |
    检测到 Laravel Nova 未授权 管理面板 访问。目标功能在未认证状态下可访问，可能暴露管理入口、业务数据、系统状态或可执行操作，需确认是否存在访问控制缺失。
  remediation: |
    - 为相关管理界面和 API 启用强认证、授权校验和最小权限控制。
    - 将后台端点限制在可信网络或 VPN 内，并记录访问审计日志。
  reference:
    - https://nova.laravel.com/docs/4.0/installation.html#authorizing-nova
  metadata:
    verified: true
    max-request: 2
    shodan-query: html:"nova-resources" html:"laravel"
  tags: laravel,nova,admin,unauth,exposure

http:
  - method: GET
    path:
      - "{{BaseURL}}/nova/dashboards/main"
      - "{{BaseURL}}/nova/resources"

    stop-at-first-match: true

    matchers-condition: and
    matchers:
      - type: word
        part: body
        words:
          - "Nova.booting"
          - "nova-resources"
        condition: or

      - type: word
        part: body
        words:
          - "nova-login"
          - "/nova/login"
        negative: true

      - type: status
        status:
          - 200
