id: api-bitquery

info:
  name: Bitquery API Token 可用性校验（token喷洒）
  author: daffainfo
  severity: info
  description: 该模板通过调用 Bitquery API 的已知接口验证提供的 token 是否有效，命中后通常表示可访问相关 API 能力。
  reference:
    - https://graphql.bitquery.io/ide
    - https://github.com/daffainfo/all-about-apikey/tree/main/bitquery
  metadata:
    max-request: 1
  tags: token-spray,bitquery

self-contained: true

http:
  - raw:
      - |
        POST https://graphql.bitquery.io HTTP/1.1
        Host: graphql.bitquery.io
        X-API-KEY: {{token}}

    matchers:
      - type: word
        part: body
        words:
          - '"message": "No query string was present"'
