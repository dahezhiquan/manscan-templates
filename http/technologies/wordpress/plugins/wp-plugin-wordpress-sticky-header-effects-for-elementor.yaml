id: wp-plugin-wordpress-sticky-header-effects-for-elementor

info:
  name: WordPress Sticky Header Effects for Elementor 插件指纹识别（指纹识别）
  author: ricardomaia
  severity: info
  description: >-
    Sticky Header Effects for Elementor 是 WordPress 插件，主要用于页面构建、区块组件、模板库、短代码或主题框架扩展。该模板通过请求目标服务并检查预设路径或首页响应、正则特征、DSL
    条件等指纹特征，判断目标是否使用或暴露了 WordPress Sticky Header Effects for Elementor 插件 相关组件；命中结果仅表示指纹特征匹配，可用于资产盘点、技术栈识别和后续安全评估，不代表已确认存在可利用漏洞。
  reference:
  - https://wordpress.org/plugins/sticky-header-effects-for-elementor/
  metadata:
    plugin_namespace: sticky-header-effects-for-elementor
    wpscan: https://wpscan.com/plugin/sticky-header-effects-for-elementor
  tags: tech,wordpress,wp-plugin,top-200,discovery
http:
  - method: GET
    path:
      - "{{BaseURL}}/wp-content/plugins/sticky-header-effects-for-elementor/readme.txt"

    payloads:
      last_version: helpers/wordpress/plugins/sticky-header-effects-for-elementor.txt

    extractors:
      - type: regex
        part: body
        internal: true
        name: internal_detected_version
        group: 1
        regex:
          - '(?i)Stable.tag:\s?([\w.]+)'

      - type: regex
        part: body
        name: detected_version
        group: 1
        regex:
          - '(?i)Stable.tag:\s?([\w.]+)'

    matchers-condition: or
    matchers:
      - type: dsl
        name: "outdated_version"
        dsl:
          - compare_versions(internal_detected_version, concat("< ", last_version))

      - type: regex
        part: body
        regex:
          - '(?i)Stable.tag:\s?([\w.]+)'
