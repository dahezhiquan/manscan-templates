id: afterlogic-webmail-login

info:
  name: AfterLogic WebMail 登录面板识别（指纹识别）
  author: johnk3r
  severity: info
  description: 该模板通过识别 AfterLogic WebMail 登录入口的页面标题、特征文本或重定向行为，判断目标是否暴露了对应的认证界面。若命中，说明该登录面板对外可访问，可用于暴露面梳理与后续安全评估。
  classification:
    cvss-metrics: CVSS:3.0/AV:N/AC:L/PR:N/UI:N/S:U/C:N/I:N/A:N
    cwe-id: CWE-200
    cpe: cpe:2.3:a:afterlogic:aurora:*:*:*:*:*:*:*:*
  metadata:
    fofa-query: 'X-Server: AfterlogicDAVServer'
    max-request: 1
    product: aurora
    vendor: afterlogic
  tags: panel,afterlogic,login,detect,discovery

http:
  - method: GET
    path:
      - '{{BaseURL}}'

    matchers-condition: and
    matchers:
      - type: word
        part: body
        words:
          - "afterlogic"
          - "dav_url"
        condition: and
        case-insensitive: true

      - type: status
        status:
          - 200
