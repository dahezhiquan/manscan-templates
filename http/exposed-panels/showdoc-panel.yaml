id: showdoc-panel

info:
  name: ShowDoc 面板识别（指纹识别）
  author: rxerium
  severity: info
  description: |
    该模板通过识别 ShowDoc 面板、控制台或管理界面的页面特征，判断目标是否暴露了对应服务入口。若命中，说明该后台或运维界面对外可访问，可用于资产识别与暴露面排查。
  classification:
    cwe-id: CWE-200
  metadata:
    max-request: 1
    vendor: showdoc
    product: showdoc
    shodan-query: http.html:"showdoc"
  tags: panel,discovery,showdoc,tech

http:
  - method: GET
    path:
      - "{{BaseURL}}/web/#/user/login"

    matchers-condition: and
    matchers:
      - type: word
        part: body
        words:
          - '<title>ShowDoc</title>'

      - type: status
        status:
          - 200
