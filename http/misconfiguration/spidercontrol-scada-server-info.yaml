id: spidercontrol-scada-server-info

info:
  name: SpiderControl SCADA Web 服务器 敏感信息 暴露
  author: geeknik
  severity: high
  description: |
    检测到 SpiderControl SCADA Web 服务器 敏感信息 暴露。目标响应或文件中可能暴露配置、凭据、密钥、令牌、环境变量或历史记录等敏感信息，可能被用于进一步入侵。
  reference:
    - https://spidercontrol.net/spidercontrol-inside/
  metadata:
    max-request: 1
  tags: spidercontrol,scada,exposure,misconfig,vuln

http:
  - method: GET
    path:
      - '{{BaseURL}}/cgi-bin/GetSrvInfo.exe'

    matchers-condition: and
    matchers:
      - type: status
        status:
          - 200

      - type: word
        words:
          - "powered by SpiderControl"
          - "LSWEBSERVER"
          - "SCWEBSERVICES"
        condition: and

    extractors:
      - type: kval
        part: header
        kval:
          - Server
