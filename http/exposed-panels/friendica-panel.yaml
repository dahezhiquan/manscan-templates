id: friendica-panel

info:
  name: Friendica 面板识别（指纹识别）
  author: righettod
  severity: info
  description: |-
    检测到目标站点存在 Friendica 相关响应特征。Friendica 是监控、日志、分析或可观测性系统，用于展示运行指标、告警事件、日志数据和服务状态。模板请求 `/`，并通过页面标题或正文关键字、状态码确认该系统指纹，用于资产识别、系统盘点和暴露面梳理。
  reference:
    - https://friendi.ca
  classification:
    cpe: cpe:2.3:a:friendica:friendica:*:*:*:*:*:*:*:*
  metadata:
    verified: true
    max-request: 1
    vendor: friendica
    product: friendica
    shodan-query:
      - http.title:"Friendica"
      - http.title:"friendica"
    fofa-query: title="friendica"
    google-query: intitle:"friendica"
  tags: friendica,panel,login,detect,discovery
http:
  - method: GET
    path:
      - "{{BaseURL}}"

    matchers-condition: and
    matchers:
      - type: word
        part: body
        words:
          - 'title="Search in Friendica'
          - 'Welcome to Friendica Social Network'
          - 'content="Friendica'
        condition: or

      - type: status
        status:
          - 200

    extractors:
      - type: regex
        part: body
        group: 1
        regex:
          - '(?i)v=([a-z0-9.-]+)'
