id: guardduty-findings

info:
  name: GuardDuty 存在未处理发现项（云安全）
  author: DhiyaneshDK
  severity: medium
  description: Amazon GuardDuty findings 表示账号、工作负载或数据源中出现了可疑行为、恶意活动或异常访问迹象；长期未处理会削弱威胁响应闭环。该模板枚举 detector 后调用 list-findings，并在返回非空 finding ID 时报告风险。
  impact: |
    - 可疑 API 调用、凭据滥用、恶意软件或数据侦察活动可能未被及时处置，扩大攻击停留时间。
    - 安全团队难以区分已确认风险和历史噪声，影响事件优先级判断与审计追踪。
  remediation: |
    - 在 GuardDuty 控制台或告警流程中逐项研判 open finding，并按严重程度完成遏制、调查和修复。
    - 对已确认无风险或已完成处置的 finding 执行归档，并建立 EventBridge、Security Hub 或工单联动流程。
  reference:
    - https://www.trendmicro.com/cloudoneconformity-staging/knowledge-base/aws/GuardDuty/findings.html
    - https://docs.aws.amazon.com/guardduty/latest/ug/guardduty_findings.html
  metadata:
    vendor: amazon
    product: guardduty
  tags: cloud,devops,aws,amazon,guardduty,aws-cloud-config
variables:
  region: "us-west-2"

flow: |
  code(1)
  for(let DetectorIds of iterate(template.detectors)){
    set("detector", DetectorIds)
    code(2)}

self-contained: true

code:
  - engine:
      - sh
      - bash
    source: |
      aws guardduty list-detectors --region $region --query 'DetectorIds' --output json

    extractors:
      - type: json
        name: detectors
        internal: true
        json:
          - '.[]'

  - engine:
      - sh
      - bash
    source: |
        aws guardduty list-findings --region $region --detector-id $detector --query 'FindingIds' --output json

    matchers:
      - type: regex
        regex:
          - '\"(.*)\"'

    extractors:
      - type: dsl
        dsl:
          - '"The AWS account has open GuardDuty Findings"'
