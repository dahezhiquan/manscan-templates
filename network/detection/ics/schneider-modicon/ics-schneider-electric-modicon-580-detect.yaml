id: ics-schneider-electric-modicon-580-detect

info:
  name: Schneider Electric Modicon 580 Series PLC 识别（指纹识别）
  author: biero-el-corridor
  severity: info
  description: |
    Schneider Electric Modicon 580 Series PLC 是 Schneider Electric Modicon 工业控制器系列，常用于 PLC 控制、生产线自动化和基础设施控制场景。该模板连接 502/TCP 并读取协议响应，通过匹配 `BME P58`、`Schneider Electric` 等响应特征识别目标服务。
  metadata:
    verified: true
    max-request: 2
    shodan-query: port:502 "P58"
  tags: ics,schneider-electric,modicon,detect,network

tcp:
  - inputs:
      - data: "000000000005002b0e0200"
        type: hex
        read: 200
        name: info
      - data: "000100000004005a0002"
        type: hex
        read: 200
        name: note

    host:
      - "{{Hostname}}"
    port: 502
    read-size: 1024

    matchers-condition: and
    matchers:
      - type: word
        part: note
        words:
          - "BME P58"

      - type: word
        part: info
        words:
          - "Schneider Electric"
