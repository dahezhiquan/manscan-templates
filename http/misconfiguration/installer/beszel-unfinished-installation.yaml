id: beszel-unfinished-installation

info:
  name: Beszel 未完成安装ation
  author: 0x_Akoko
  severity: high
  description: |
    检测到 Beszel 未完成安装ation。该页面属于安装、初始化或配置向导流程，若对外暴露，攻击者可能完成初始化、创建管理员账户或重新配置目标系统。
  reference:
    - https://github.com/henrygd/beszel
  metadata:
    verified: true
    max-request: 1
    shodan-query: html:"globalThis.BESZEL"
    fofa-query: body="globalThis.BESZEL"
  tags: beszel,misconfig,install,exposure

http:
  - method: GET
    path:
      - "{{BaseURL}}/api/beszel/first-run"

    matchers:
      - type: dsl
        dsl:
          - 'status_code == 200'
          - 'contains(content_type, "application/json")'
          - 'contains(body, "\"firstRun\":true")'
        condition: and
