id: wp-links-opml

info:
  name: WordPress wp-links-opml.php Version 泄露（暴露面识别）
  author: princechaddha
  severity: info
  description: |
    检测到对外可访问的 WordPress wp-links-opml.php Version。相关文件可能泄露项目结构、依赖关系、部署细节、敏感参数或其他不应公开的内部信息。
  reference:
    - https://www.acunetix.com/vulnerabilities/web/wordpress-version-disclosed/
    - https://wordpress.org/
  classification:
    cpe: cpe:2.3:a:wordpress:wordpress:*:*:*:*:*:*:*:*
  metadata:
    verified: true
    max-request: 1
    vendor: wordpress
    product: wordpress
    shodan-query:
      - http.component:"wordpress"
      - cpe:"cpe:2.3:a:wordpress:wordpress"
  tags: exposure,wordpress,wp,version,files

http:
  - method: GET
    path:
      - "{{BaseURL}}/wp-links-opml.php"

    matchers-condition: and
    matchers:
      - type: word
        part: body
        words:
          - "generator="
          - "WordPress/"
        condition: and

      - type: word
        part: header
        words:
          - "text/xml"

      - type: status
        status:
          - 200

    extractors:
      - type: regex
        name: version
        group: 1
        regex:
          - '(?i)generator="?WordPress/([0-9.]+)"?'
