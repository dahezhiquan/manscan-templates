id: shopware-detect-panel

info:
  name: Shopware 指纹识别（指纹识别）
  author: cyllective,pascalheidmann
  severity: info
  description: >-
    Shopware 是电商平台，用于构建在线商城、商品管理和数字商务体验。该模板通过请求目标服务并检查预设路径或首页响应、页面正文关键字、状态码等指纹特征，判断目标是否使用或暴露了
    Shopware 相关组件；命中结果仅表示指纹特征匹配，可用于资产盘点、技术栈识别和后续安全评估，不代表已确认存在可利用漏洞。
  reference:
  - https://github.com/shopware/shopware
  - https://github.com/shopware/platform
  classification:
    cpe: cpe:2.3:a:shopware:shopware:*:*:*:*:*:*:*:*
  metadata:
    verified: true
    max-request: 2
    vendor: shopware
    product: shopware
    shodan-query: title:"shopware AG"
  tags: tech,shopware,cms,panel,discovery
http:
  - method: GET
    path:
      - "{{BaseURL}}/admin"
      - "{{BaseURL}}/backend"

    stop-at-first-match: false

    matchers-condition: and
    matchers:
      - type: word
        part: body
        words:
          - 'Realisiert mit Shopware'
          - 'Realised with Shopware'
          - 'Shopware Administration (c) shopware AG'
          - '<title>Shopware 5 - Backend (c) shopware AG</title>'
          - 'Shopware.Application.start'
        condition: or

      - type: status
        status:
          - 200

    extractors:
      - type: regex
        name: detected_version
        part: body
        group: 1
        regex:
          - (?i)<title>Shopware\s+([0-9]+(?:[.][0-9]+)+(?:[-+._][0-9A-Za-z]+)*)\s
        internal: true
      - type: dsl
        dsl:
          - 'regex("^[0-9]+(?:[.][0-9]+)*(?:[-+._][0-9A-Za-z]+)*$", detected_version) ? detected_version : ""'
