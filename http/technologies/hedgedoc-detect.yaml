id: hedgedoc-detect

info:
  name: HedgeDoc Collaborative Editor 指纹识别（指纹识别）
  author: Rupendra0
  severity: info
  description: >-
    HedgeDoc 是协作文档和 Markdown 编辑平台，用于多人实时编写、共享和发布笔记。该模板通过请求目标服务并检查预设路径或首页响应、HTTP 响应头、正则特征、DSL
    条件等指纹特征，判断目标是否使用或暴露了 HedgeDoc Collaborative Editor 相关组件；命中结果仅表示指纹特征匹配，可用于资产盘点、技术栈识别和后续安全评估，不代表已确认存在可利用漏洞。
  reference:
  - https://hedgedoc.org
  - https://github.com/hedgedoc/hedgedoc
  metadata:
    verified: true
    max-request: 2
    vendor: hedgedoc
    product: hedgedoc
    shodan-query: 'http.title:"HedgeDoc - Ideas grow better together"'
    fofa-query: 'body="Powered by <a href=\"https://hedgedoc.org\">HedgeDoc"'
  tags: tech,detect,hedgedoc
http:
  - method: GET
    path:
      - '{{BaseURL}}/'

    host-redirects: true
    stop-at-first-match: true

    matchers:
      - type: dsl
        dsl:
          - 'contains(tolower(header), "hedgedoc-version:")'
          - 'contains_any(body, "HedgeDoc - Ideas", "Powered by <a href=\"https://hedgedoc.org\">HedgeDoc")'
        condition: or

    extractors:
      - type: regex
        name: version
        part: header
        group: 1
        regex:
          - '(?i)hedgedoc-version:\s*([0-9.]+)'
