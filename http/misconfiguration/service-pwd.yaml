id: service-pwd

info:
  name: 服务.pwd Sensitive 信息泄露
  author: pussycat0x
  severity: high
  description: |
    检测到 服务.pwd Sensitive 信息泄露。Web 服务器或应用目录允许列出文件内容，可能泄露备份文件、配置文件、日志、源码或其他未公开资源。
  reference:
    - https://www.exploit-db.com/ghdb/7256
  metadata:
    max-request: 1
  tags: exposure,listing,service,edb,misconfig,vuln

http:
  - method: GET
    path:
      - "{{BaseURL}}/_vti_pvt/service.pwd"

    matchers-condition: and
    matchers:
      - type: word
        words:
          - "# -FrontPage-"
        part: body

      - type: status
        status:
          - 200
