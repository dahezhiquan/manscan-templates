id: nacos-version

info:
  name: Nacos 指纹识别（指纹识别）
  author: Arm!tage
  severity: info
  description: >-
    Nacos 是动态服务发现、配置管理和服务管理平台，常用于微服务注册中心和配置中心。该模板通过请求目标服务并检查预设路径或首页响应、正则特征、状态码等指纹特征，判断目标是否使用或暴露了
    Nacos 相关组件；命中结果仅表示指纹特征匹配，可用于资产盘点、技术栈识别和后续安全评估，不代表已确认存在可利用漏洞。
  classification:
    cvss-metrics: CVSS:3.1/AV:N/AC:L/PR:N/UI:N/S:U/C:N/I:N/A:N
    cwe-id: CWE-200
    cpe: cpe:2.3:a:alibaba:nacos:*:*:*:*:*:*:*:*
  metadata:
    verified: true
    max-request: 2
    shodan-query: title:"Nacos"
    product: nacos
    vendor: alibaba
  tags: tech,detect,nacos,discovery
http:
  - method: GET
    path:
      - "{{BaseURL}}/v1/console/server/state?accessToken=&username="
      - "{{BaseURL}}/nacos/v1/console/server/state?accessToken=&username="

    stop-at-first-match: true
    matchers-condition: and
    matchers:
      - type: regex
        part: body
        regex:
          - '"version":"(\d+\.\d+\.\d+(?:-[^"]+)?)"'

      - type: regex
        part: content_type
        regex:
          - 'application/json'

      - type: status
        status:
          - 200

    extractors:
      - type: regex
        part: body
        regex:
          - '"version":"(\d+\.\d+\.\d+(?:-[^"]+)?)"'
