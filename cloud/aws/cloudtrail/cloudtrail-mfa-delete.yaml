id: cloudtrail-mfa-delete
info:
  name: CloudTrail 日志桶未启用 MFA Delete（云安全）
  author: princechaddha
  severity: high
  description: CloudTrail 日志桶未启用 MFA Delete 是一类审计日志删除保护不足风险，删除对象版本或修改版本控制状态时缺少额外认证门槛。若具备足够 S3 权限的主体误删或恶意删除日志对象，审计证据完整性会受到影响。模板先获取 trail 关联的 `S3BucketName`，再调用 `aws s3api get-bucket-versioning --query MFADelete`，当返回 `null` 时判定未启用 MFA Delete。
  impact: |
    - 拥有足够 S3 权限的主体可能更容易删除 CloudTrail 日志对象版本或修改版本控制状态。
    - 审计日志缺少额外删除保护，会削弱安全事件后的取证完整性和抗抵赖能力。
  remediation: |
    - 在满足运维条件的情况下，为 CloudTrail 日志桶启用版本控制和 MFA Delete。
    - 同时收紧日志桶删除权限，结合对象锁、跨账户日志归档或备份策略提升日志不可篡改性。
  reference:
    - https://docs.aws.amazon.com/AmazonS3/latest/userguide/MultiFactorAuthenticationDelete.html
  metadata:
    max-request: 3
    vendor: amazon
    product: s3
  tags: cloud,devops,aws,amazon,s3,aws-cloud-config
variables:
  region: "ap-south-1"

flow: |
  code(1)
  for(let CloudTrail of iterate(template.cloudtrailname)){
    set("trail", CloudTrail)
    code(2)
    for(let BucketNames of iterate(template.buckets)){
      set("bucket", BucketNames)
      code(3)
    }
  }

self-contained: true
code:
  - engine:
      - sh
      - bash
    source: |
      aws cloudtrail list-trails --region $region --query 'Trails[*].Name' --output json

    extractors:
      - type: json
        name: cloudtrailname
        internal: true
        json:
          - '.[]'

  - engine:
      - sh
      - bash
    source: |
      aws cloudtrail describe-trails --region $region --trail-name-list $trail --query 'trailList[*].S3BucketName'

    extractors:
      - type: json
        name: buckets
        internal: true
        json:
          - '.[]'

  - engine:
      - sh
      - bash
    source: |
      aws s3api get-bucket-versioning --bucket $bucket --query 'MFADelete'

    matchers:
      - type: word
        words:
          - 'null'

    extractors:
      - type: dsl
        dsl:
          - '"The MFA Delete feature is not enabled for the S3 bucket " + bucket + " associated with the CloudTrail " + trail'
