id: rancher-incomplete-setup

info:
  name: Rancher 未完成配置 暴露
  author: 0x_Akoko
  severity: low
  description: |
    检测到 Rancher 未完成配置 暴露。该页面属于安装、初始化或配置向导流程，若对外暴露，攻击者可能完成初始化、创建管理员账户或重新配置目标系统。
  reference:
    - https://rancher.com/docs/rancher/v2.6/en/installation/
  metadata:
    verified: true
    max-request: 1
    shodan-query: title:"Rancher"
    fofa-query: title="Rancher"
  tags: rancher,misconfig,exposure

http:
  - method: GET
    path:
      - "{{BaseURL}}/v3/settings/first-login"

    matchers-condition: and
    matchers:
      - type: word
        part: body
        words:
          - '"value":"true"'
          - '"name":"first-login"'
        condition: and

      - type: status
        status:
          - 200
