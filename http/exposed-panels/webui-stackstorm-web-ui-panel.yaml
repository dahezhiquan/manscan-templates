id: webui-stackstorm-web-ui-panel

info:
  name: StackStorm Web UI 面板识别（指纹识别）
  author: Th3l0newolf
  severity: info
  description: |-
    StackStorm Web UI 是自动化运维平台 StackStorm 的 Web 界面，用于规则、动作、工作流和执行历史管理。该模板请求首页，并依据 DSL 条件识别目标是否部署了该系统或暴露了对应入口，适用于资产指纹确认；命中结果仅表示系统特征匹配，不代表已确认存在未授权访问或可利用漏洞。
  reference:
  - https://stackstorm.com/
  metadata:
    max-request: 1
    verified: true
    shodan-query: html:"StackStorm Web UI"
    vendor: stackstorm
    product: stackstorm
  tags: panel,stackstorm,webui,detect

http:
  - method: GET
    path:
      - "{{BaseURL}}"

    host-redirects: true
    max-redirects: 2

    matchers:
      - type: dsl
        dsl:
          - 'status_code == 200'
          - 'contains(to_lower(body), "<title>stackstorm web ui")'
        condition: and
