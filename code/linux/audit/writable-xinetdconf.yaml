id: writable-xinetdconf

info:
  name: inetd/xinetd 配置文件权限异常（本地基线扫描）
  author: songyaeji
  severity: high
  description: |
    `/etc/xinetd.conf` 或 `/etc/inetd.conf` 可被非 root 写入时，攻击者可能注册、修改或启用网络服务，并借助 inetd/xinetd 以更高权限运行恶意入口。模板通过 `stat` 检查两个配置文件是否为 `root:root` 且权限为 `600`、`640` 或 `644`，不满足时表示配置文件权限异常。
  impact: |
    - 本地攻击者可能植入新的网络服务，实现持久化、远程访问或权限提升。
    - inetd/xinetd 服务配置被篡改会扩大主机暴露面并干扰审计。
  remediation: |
    - 将 `/etc/xinetd.conf` 和 `/etc/inetd.conf` 属主设置为 `root:root`，权限设置为 `644` 或更严格。
    - 审计 xinetd/inetd 服务条目，禁用不必要服务并重载守护进程。
  reference:
    - https://isms.kisa.or.kr/main/csap/notice/
  tags: linux,code,audit,compliance,local

self-contained: true

code:
  - engine:
      - bash

    source: |
      stat -c "%U %G %a" /etc/xinetd.conf 2>/dev/null || echo "not-found"

  - engine:
      - bash

    source: |
      stat -c "%U %G %a" /etc/inetd.conf 2>/dev/null || echo "not-found"

    matchers:
      - type: regex
        part: code_1_response
        regex:
          - '^root\s+root\s+(600|640|644)$'

      - type: regex
        part: code_2_response
        regex:
          - '^root\s+root\s+(600|640|644)$'
