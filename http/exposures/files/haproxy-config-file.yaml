id: haproxy-config-file

info:
  name: Haproxy 配置 文件泄露（暴露面识别）
  author: DhiyaneshDk
  severity: low
  description: |
    检测到对外可访问的 Haproxy 配置 文件。相关文件可能泄露项目结构、依赖关系、部署细节、敏感参数或其他不应公开的内部信息。
  reference:
    - https://www.haproxy.com/documentation/haproxy-configuration-manual/latest/
  metadata:
    verified: true
    max-request: 1
    shodan-query: html:"haproxy.cfg"
  tags: exposure,files,haproxy,vuln

http:
  - method: GET
    path:
      - '{{BaseURL}}/haproxy.cfg'

    matchers-condition: and
    matchers:
      - type: word
        part: body
        words:
          - '/var/run/haproxy.pid'
          - 'pidfile'
        condition: and
        case-insensitive: true

      - type: word
        part: content_type
        words:
          - 'text/plain'
