id: ms-exchange-server

info:
  name: Microsoft Exchange Server 指纹识别（指纹识别）
  author: pikpikcu,dhiyaneshDK
  severity: info
  description: >-
    Microsoft Exchange Server 是企业邮件和协作服务器，用于邮箱、日历、通讯录和移动同步服务。该模板通过请求目标服务并检查预设路径或首页响应、HTTP
    响应头、正则特征、页面正文关键字等指纹特征，判断目标是否使用或暴露了 Microsoft Exchange Server 相关组件；命中结果仅表示指纹特征匹配，可用于资产盘点、技术栈识别和后续安全评估，不代表已确认存在可利用漏洞。
  reference:
  - https://github.com/GossiTheDog/scanning/blob/main/http-vuln-exchange.nse
  metadata:
    max-request: 1
  tags: microsoft,exchange,tech,discovery
http:
  - method: GET
    path:
      - "{{BaseURL}}/owa/auth/logon.aspx"

    matchers-condition: or
    matchers:
      - type: regex
        part: header
        regex:
          - "(?i)(X-Owa-Version:)"

      - type: regex
        part: body
        regex:
          - "/owa/auth/[0-9.]+/"

      - type: word
        words:
          - '<title>Exchange Log In</title>'
          - '<title>Microsoft Exchange - Outlook Web Access</title>'

    extractors:
      - type: kval
        kval:
          - x_owa_version

      - type: regex
        part: body
        group: 1
        regex:
          - "/owa/auth/([0-9.]+)/"
