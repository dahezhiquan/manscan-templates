id: wp-security-hidden-login-exposure

info:
  name: WordPress All-in-One Security <=4.4.1 - Hidden Login Page Exposure
  author: theamanrawat
  severity: medium
  description: WordPress All-in-One Security <=4.4.1 - Hidden Login Page Exposure 存在安全漏洞。该模板依据实际请求路径、返回特征与命中证据验证目标是否暴露相应漏洞。
  remediation: |
    - 按厂商公告升级到已修复版本；原始说明中提到的版本信息为：Upgrade to 4。
    - 根据厂商安全公告或补丁说明升级到最新安全版本。
    - 结合访问控制、日志审计和暴露面收敛，降低相同问题再次被利用的风险。
  reference:
    - https://wpscan.com/vulnerability/467673ad-d0ad-46a3-80c7-8ebb3813a4b3/
    - https://wordpress.org/plugins/all-in-one-wp-security-and-firewall
  metadata:
    verified: true
    max-request: 1
  tags: wp-plugin,exposure,wordpress,wp,wpscan,vuln

http:
  - method: GET
    path:
      - "{{BaseURL}}/?aiowpsec_do_log_out=1&al_additional_data=1"

    host-redirects: true

    matchers-condition: and
    matchers:
      - type: word
        part: body
        words:
          - "Username or Email Address"
          - "wp_attempt_focus"
        condition: and

      - type: status
        status:
          - 200
