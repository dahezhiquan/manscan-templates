id: mysql-native-password

info:
  name: MySQL 原生密码认证暴露（服务漏洞）
  author: iamthefrogy
  severity: medium
  description: |
    `mysql_native_password` 是 MySQL 早期常用的口令认证插件。服务握手阶段会暴露认证插件名称，攻击者可据此判断数据库版本兼容性和认证面。该模板连接 3306 端口并匹配握手响应中的 `mysql_native_password`，用于发现仍暴露该认证方式的 MySQL 服务。
  impact: |
    - 攻击者可确认数据库服务类型和认证插件，为口令喷洒、暴力破解或兼容性降级分析提供依据。
    - 若同时存在弱口令、默认账号或网络暴露，旧认证方式会扩大数据库被未授权访问的概率。
  remediation: |
    - 优先使用 MySQL 8 推荐的 `caching_sha2_password` 等更现代认证插件，并淘汰不必要的旧客户端兼容配置。
    - 限制 3306 端口访问来源，禁止数据库服务直接暴露到公网。
    - 配合强口令、账号锁定、最小权限和登录审计降低口令攻击风险。
  reference:
    - https://github.com/Tinram/MySQL-Brute
  classification:
    cvss-metrics: CVSS:3.1/AV:N/AC:L/PR:N/UI:N/S:U/C:N/I:N/A:N
    cwe-id: CWE-200
  metadata:
    max-request: 1
  tags: network,mysql,db,misconfig,tcp,vuln

tcp:
  - host:
      - "{{Hostname}}"
    port: 3306

    matchers:
      - type: word
        words:
          - "mysql_native_password"
