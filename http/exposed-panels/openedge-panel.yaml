id: openedge-panel

info:
  name: OpenEdge 登录面板识别（指纹识别）
  author: rxerium
  severity: info
  description: |-
    检测到目标站点存在 OpenEdge 相关响应特征。OpenEdge 是 AI、机器学习或 Notebook 相关平台，用于管理模型、数据集、工作区、实验、推理服务或训练任务。模板请求 `/`，并通过页面标题或正文关键字、状态码确认该系统指纹，用于资产识别、系统盘点和暴露面梳理。
  classification:
    cpe: cpe:2.3:a:progress:openedge:*:*:*:*:*:*:*:*
  metadata:
    verified: true
    max-request: 1
    vendor: progress
    product: openedge
    shodan-query: html:"Welcome to Progress Application Server for OpenEdge"
  tags: panel,openedge,login,detect,discovery
http:
  - method: GET
    path:
      - '{{BaseURL}}'

    matchers-condition: and
    matchers:
      - type: word
        part: body
        words:
          - "Welcome to Progress Application Server for OpenEdge"

      - type: status
        status:
          - 200
