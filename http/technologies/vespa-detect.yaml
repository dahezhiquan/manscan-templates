id: vespa-detect

info:
  name: Vespa - 检测（指纹识别）
  author: rxerium
  severity: info
  description: |-
    检测到 Vespa，一个用于低延迟搜索、推荐和向量/嵌入检索的开源大数据服务引擎，越来越多地作为 AI 和 RAG（检索增强生成）流水线中的检索后端进行部署。暴露的 config-server 或容器端点可能泄露应用部署元数据、集群状态和版本信息，并且如果查询 API 保持开放，可能允许未认证访问索引化/向量化数据。
  reference:
    - https://vespa.ai/
    - https://github.com/vespa-engine/vespa
    - https://docs.vespa.ai/en/reference/state-v1.html
  metadata:
    verified: true
    max-request: 1
    vendor: vespa.ai
    product: vespa
    shodan-query: 'product:"Vespa"'
  tags: tech,vespa,ai,vector-db,search,detect,discovery

http:
  - method: GET
    path:
      - "{{BaseURL}}/ApplicationStatus"

    matchers-condition: and
    matchers:
      - type: word
        part: body
        words:
          - '"vespa"'
          - '"version"'
        condition: and

    extractors:
      - type: regex
        part: body
        group: 1
        regex:
          - '"vespa"\s*:\s*\{\s*"version"\s*:\s*"([0-9\.]+)"'
