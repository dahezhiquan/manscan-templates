id: struts-problem-report

info:
  name: Apache Struts Dev Mode 检测（暴露面识别）
  author: dhiyaneshDK
  severity: low
  description: 检测到可直接访问的 Apache Struts Dev Mode。日志、异常页面或调试输出通常会泄露堆栈信息、内部路径、查询语句、账号标识、令牌片段或业务数据，不应向未授权用户开放。
  reference:
    - https://www.exploit-db.com/ghdb/4278
  metadata:
    max-request: 1
  tags: struts,debug,edb,exposure,apache,vuln

http:
  - method: GET
    path:
      - '{{BaseURL}}'

    matchers-condition: and
    matchers:
      - type: word
        words:
          - '<title>Struts Problem Report</title>'

      - type: status
        status:
          - 200
