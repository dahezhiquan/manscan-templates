id: opencart-error-log

info:
  name: OpenCart Error Log 泄露（暴露面识别）
  author: DhiyaneshDk
  severity: medium
  description: |
    检测到可直接访问的 OpenCart Error Log。日志、异常页面或调试输出通常会泄露堆栈信息、内部路径、查询语句、账号标识、令牌片段或业务数据，不应向未授权用户开放。
  reference:
    - https://www.opencart.com/
    - https://docs.opencart.com/en-gb/administration/
  metadata:
    verified: true
    max-request: 5
  tags: opencart,exposure,logs,disclosure

http:
  - method: GET
    path:
      - "{{BaseURL}}/system/storage/logs/error.log"
      - "{{BaseURL}}/opencart/system/storage/logs/error.log"
      - "{{BaseURL}}/storage/logs/error.log"
      - "{{BaseURL}}/error.log"
      - "{{BaseURL}}/system/logs/error.log"

    stop-at-first-match: true

    matchers-condition: and
    matchers:
      - type: word
        part: body
        words:
          - "PHP Notice"
          - "PHP Warning"
          - "PHP Error"
          - "PHP Fatal error"
          - "opencart"
          - "catalog/controller"
          - "catalog/model"
          - "system/library"
          - "Undefined index"
          - "MySQL"
          - "mysqli"
        condition: or

      - type: regex
        part: body
        regex:
          - "\\d{4}-\\d{2}-\\d{2}\\s+\\d{2}:\\d{2}:\\d{2}"
          - "\\[error\\]|\\[warning\\]|\\[notice\\]"
        condition: or

      - type: status
        status:
          - 200
