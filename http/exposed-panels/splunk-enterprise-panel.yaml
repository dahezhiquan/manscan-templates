id: splunk-enterprise-panel

info:
  name: Splunk Enterprise 登录面板识别（暴露面识别）
  author: praetorian-thendrickson
  severity: info
  description: 该模板通过识别 Splunk Enterprise 登录入口的页面标题、特征文本或重定向行为，判断目标是否暴露了对应的认证界面。若命中，说明该登录面板对外可访问，可用于暴露面梳理与后续安全评估。
  reference:
    - https://www.splunk.com/en_us/software/splunk-enterprise.html
  classification:
    cvss-metrics: CVSS:3.0/AV:N/AC:L/PR:N/UI:N/S:U/C:N/I:N/A:N
    cwe-id: CWE-200
    cpe: cpe:2.3:a:splunk:splunk:*:*:*:*:*:*:*:*
  metadata:
    max-request: 1
    vendor: splunk
    product: splunk
    shodan-query:
      - http.title:"Login - Splunk"
      - http.title:"login - splunk"
    fofa-query: title="login - splunk"
    google-query: intitle:"login - splunk"
  tags: panel,splunk,discovery

http:
  - method: GET
    path:
      - '{{BaseURL}}/en-US/account/login'

    host-redirects: true

    matchers-condition: and
    matchers:
      - type: word
        words:
          - 'Splunk Inc.'

      - type: status
        status:
          - 200

    extractors:
      - type: regex
        part: body
        group: 1
        regex:
          - '"version": "(.*)"'
          - 'versionNumber": "([0-9.]+)"'
          - '"VERSION_LABEL": "([0-9.]+)"'
