id: phplist-detect

info:
  name: phpList 指纹识别（指纹识别）
  author: ricardomaia
  severity: info
  description: >-
    phpList 是邮件列表和电子邮件营销系统，用于订阅者管理、邮件群发和投递跟踪。该模板通过请求目标服务并检查预设路径或首页响应、页面正文关键字、正则特征等指纹特征，判断目标是否使用或暴露了
    phpList 相关组件；命中结果仅表示指纹特征匹配，可用于资产盘点、技术栈识别和后续安全评估，不代表已确认存在可利用漏洞。
  reference:
  - https://www.phplist.org/
  classification:
    cpe: cpe:2.3:a:phplist:phplist:*:*:*:*:*:*:*:*
  metadata:
    verified: true
    max-request: 1
    vendor: phplist
    product: phplist
    shodan-query: html:"phplist"
  tags: tech,phplist,detect,discovery
http:
  - method: GET
    path:
      - "{{BaseURL}}"

    host-redirects: true
    max-redirects: 2
    matchers:
      - type: word
        part: body
        words:
          - 'content="phpList'
          - 'phpList Ltd'
          - 'phpList</a>'
        condition: or
        case-insensitive: true

    extractors:
      - type: regex
        name: version
        part: body
        group: 1
        regex:
          - '(?i)version.((\d\.?)+)'
