id: cj-pony-parts-phish

info:
  name: CJ Pony Parts 仿冒钓鱼网站（钓鱼网站识别）
  author: rxerium
  severity: info
  description: |
    检测到疑似仿冒 CJ Pony Parts 的钓鱼网站。模板在目标页面返回 200、页面内容命中 CJ Pony Parts 的品牌页面特征，且当前主机不属于 cjponyparts.com 官方域名时触发，用于识别借用 CJ Pony Parts 品牌页面诱导用户信任的仿冒站点。
  reference:
    - https://cjponyparts.com
  metadata:
    max-request: 1
  tags: phishing,cj-pony-parts,ecommerce,osint,discovery
http:
  - method: GET
    path:
      - "{{BaseURL}}"

    host-redirects: true
    max-redirects: 2

    matchers-condition: and
    matchers:
      - type: word
        words:
          - 'Empowering enthusiasts to build their dream vehicles with top aftermarket parts for Ford Mustangs, Broncos, Focus STs, F-100s, and Chevy C10s. Shop now!'

      - type: status
        status:
          - 200

      - type: dsl
        dsl:
          - '!contains(host,"cjponyparts.com")'
