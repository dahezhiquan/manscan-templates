id: wp-popup-maker-fpd

info:
  name: Popup Maker 完整路径泄露
  author: theamanrawat
  severity: low
  description: |
    检测到 Popup Maker 完整路径泄露。目标功能在未认证状态下可访问，可能暴露管理入口、业务数据、系统状态或可执行操作，需确认是否存在访问控制缺失。
  impact: |
    - 未授权用户可能访问管理功能、业务数据或系统状态。
    - 暴露接口可能被用于进一步枚举、修改配置或执行敏感操作。
  reference:
    - https://wordpress.org/plugins/popup-maker/
  metadata:
    verified: true
    max-requests: 1
    public-www: "/wp-content/plugins/popup-maker/"
  tags: debug,wordpress,wp,wp-plugin,popup-maker,fpd

http:
  - method: GET
    path:
      - "{{BaseURL}}/wp-content/plugins/popup-maker/classes/Activator.php"

    matchers:
      - type: dsl
        dsl:
          - 'status_code == 200'
          - 'contains_all(body, "Fatal error", "undefined function", "popup-maker")'
        condition: and
