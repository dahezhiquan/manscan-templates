id: unauth-mercurial

info:
  name: 未授权 Mercurial 检测
  author: pussycat0x
  severity: high
  description: |
    检测到 未授权 Mercurial 检测。目标功能在未认证状态下可访问，可能暴露管理入口、业务数据、系统状态或可执行操作，需确认是否存在访问控制缺失。
  classification:
    cpe: cpe:2.3:a:mercurial:mercurial:*:*:*:*:*:*:*:*
  metadata:
    verified: true
    max-request: 1
    vendor: mercurial
    product: mercurial
    shodan-query: html:"Mercurial repositories index"
  tags: misconfig,unauth,mercurial,vuln

http:
  - method: GET
    path:
      - "{{BaseURL}}"

    matchers-condition: and
    matchers:
      - type: word
        part: body
        words:
          - "Mercurial Repositories"
          - "Last modified"
        condition: and

      - type: status
        status:
          - 200
