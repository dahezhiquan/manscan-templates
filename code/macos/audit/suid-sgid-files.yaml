id: suid-sgid-files

info:
  name: macOS SUID/SGID 文件检测（本地基线扫描）
  author: geeknik
  severity: high
  description: |
    用户可写或第三方路径中的 SUID/SGID 文件会在执行时带有额外权限，若文件存在漏洞或可被替换，可能成为本地提权入口。模板在 `/usr/local`、`/opt`、`/Applications` 中查找带 SUID/SGID 位的文件，匹配到结果时要求复核。
  impact: |
    - 本地攻击者可能利用脆弱的特权文件提升权限或绕过访问控制。
    - 第三方目录中的异常 SUID/SGID 文件也可能成为持久化和隐藏入口。
  remediation: |
    - 建立 SUID/SGID 允许清单，移除第三方路径中非必要的特权位。
    - 校验命中文件来源和完整性，更新或卸载存在风险的应用。
  tags: macos,audit,local,security,privesc

self-contained: true

code:
  - engine:
      - sh
      - bash
    source: |
      find /usr/local /opt /Applications -perm -4000 -o -perm -2000 -type f -ls 2>/dev/null
    matchers:
      - type: regex
        regex:
          - "^-rws.*"
          - "^-..s.*"
