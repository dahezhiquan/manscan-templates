id: gcloud-alb-ssl-google-managed

info:
  name: Use Google-Managed SSL 证书 的Application Load Balancers（云安全）
  author: princechaddha
  severity: high
  description: Application Load Balancer 使用非 Google 托管证书时，证书续期、吊销和配置一致性需要自行维护，容易出现过期或错误部署。本模板关联 URL map、target HTTPS proxy 和 sslCertificates，并在 certificate-manager describe 返回 NOT_FOUND 时报告使用了非托管证书。
  impact: |
    - 证书过期、链配置错误或私钥管理不当会导致 HTTPS 访问中断、降级或中间人攻击风险上升。
    - 手工证书生命周期管理容易遗漏，影响面可能覆盖同一负载均衡器承载的多个业务域名。
  remediation: |
    - 优先为 Application Load Balancer 使用 Google-managed SSL certificate 或 Certificate Manager 托管证书。
    - 对必须自管理的证书建立到期监控、自动续期、私钥保护和变更复核流程。
  reference:
    - https://cloud.google.com/load-balancing/docs/ssl-certificates
  metadata:
    vendor: google
    product: cloud-load-balancing
  tags: cloud,devops,gcp,gcloud,google-cloud-load-balancing,gcp-cloud-config

flow: |
  code(1)
  for(let projectId of iterate(template.projectIds)){
    set("projectId", projectId)
    code(2)
    for(let urlMap of iterate(template.urlMaps)){
      set("urlMap", urlMap)
      code(3)
      let filteredProxies = template.targetProxies.filter(proxy => proxy.urlMap === urlMap)
      for(let proxy of filteredProxies){
        proxy = JSON.parse(proxy)
        set("targetProxy", proxy.name)
        set("sslCertificate", proxy.sslCertificates[0])
        code(4)
      }
    }
  }

self-contained: true

code:
  - engine:
      - sh
      - bash
    source: |
      gcloud projects list --format="json(projectId)"

    extractors:
      - type: json
        name: projectIds
        internal: true
        json:
          - '.[].projectId'

  - engine:
      - sh
      - bash
    source: |
      gcloud compute url-maps list --project $projectId --format="json(name)"

    extractors:
      - type: json
        name: urlMaps
        internal: true
        json:
          - '.[].name'

  - engine:
      - sh
      - bash
    source: |
      gcloud compute target-https-proxies list --project $projectId --global --format="json(name,urlMap,sslCertificates)"

    extractors:
      - type: json
        name: targetProxies
        internal: true
        json:
          - '.[] | {name, urlMap, sslCertificates}'

  - engine:
      - sh
      - bash
    source: |
      gcloud certificate-manager certificates describe $sslCertificate --project $projectId

    matchers:
      - type: word
        part: body
        words:
          - "NOT_FOUND"

    extractors:
      - type: dsl
        dsl:
          - '"ALB with non-managed SSL certificate: " + urlMap + ", Proxy: " + targetProxy + ", Certificate: " + sslCertificate + ", Project: " + projectId'
