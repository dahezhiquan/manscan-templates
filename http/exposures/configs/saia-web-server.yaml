id: saia-web-server

info:
  name: Saia PCD Web-Server 配置信息页面检测暴露（暴露面识别）
  author: DhiyaneshDk
  severity: medium
  description: |
    检测到目标站点可直接访问 Saia PCD Web-Server 配置信息页面检测。数据库相关文件通常包含连接参数、表结构、查询历史、导出数据或业务数据线索。该模板请求 `/loadtextfile.htm#programinfo`，并通过 HTTP 状态码、响应正文关键字、文件格式特征、正则匹配或响应头进行确认。配置文件公开后可能泄露部署细节、内部路径、依赖版本、环境变量、访问凭据或调试信息，增加被侦察和后续利用的风险。
  impact: |-
    - 数据库配置、结构或历史文件可能泄露连接地址、账号、表结构、查询语句和业务数据线索。
    - 攻击者可利用这些信息定位数据库入口、构造更精确的注入或凭据攻击，并推断业务模型。
    - 若文件包含真实凭据或数据片段，可能进一步导致敏感数据读取、篡改或合规事件。
  remediation: |-
    - 将数据库配置、结构文件、连接历史和导出文件迁移到非 Web 可访问位置，并限制备份和调试产物发布。
    - 轮换可能暴露的数据库账号、密码、连接串和只读/写入凭据。
    - 收敛数据库账号权限，限制来源地址，并审计近期连接、查询和数据导出记录。
    - 在 Web 服务器、CDN 和对象存储层阻断数据库配置、历史文件和转储文件的公开访问。
  reference:
    - https://www.exploit-db.com/ghdb/6865
  classification:
    cvss-metrics: CVSS:3.1/AV:N/AC:L/PR:N/UI:N/S:U/C:N/I:N/A:N
    cvss-score: 0
    cwe-id: CWE-200
  metadata:
    max-request: 1
  tags: edb,config,exposure,vuln

http:
  - method: GET
    path:
      - "{{BaseURL}}/loadtextfile.htm#programinfo"

    matchers-condition: and
    matchers:
      - type: word
        words:
          - "<title>Saia PCD Web Server</title>"
        part: body

      - type: status
        status:
          - 200
