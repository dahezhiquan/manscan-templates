id: uni-gui-framework

info:
  name: UniGUI Framework 指纹识别（指纹识别）
  author: serrapa
  severity: info
  description: >-
    UniGUI 是 Delphi 生态的 Web 应用框架，用于将桌面式业务界面发布为浏览器应用。该模板通过请求目标服务并检查预设路径或首页响应、页面正文关键字、正则特征等指纹特征，判断目标是否使用或暴露了
    UniGUI Framework 相关组件；命中结果仅表示指纹特征匹配，可用于资产盘点、技术栈识别和后续安全评估，不代表已确认存在可利用漏洞。
  metadata:
    verified: true
    max-request: 1
    shodan-query: http.title:"UniGUI"
  tags: tech,unigui,discovery
http:
  - method: GET
    path:
      - "{{BaseURL}}"

    host-redirects: true
    max-redirects: 2

    matchers-condition: and
    matchers:
      - type: word
        part: body
        words:
          - "uni-xtheme-"
          - "ext-all.js"
          - "uniVars._extVer="
        condition: or

      - type: regex
        part: body
        regex:
          - 'uni-(\d+\.\d+\.\d+\.\d+)/'
          - 'uniVars._extVer="(\d+\.\d+\.\d+)"'

    extractors:
      - type: regex
        part: body
        name: uni_gui_version
        regex:
          - 'uni-(\d+\.\d+\.\d+\.\d+)'

      - type: regex
        part: body
        name: ext_js_version
        regex:
          - 'uniVars._extVer="(\d+\.\d+\.\d+)"'
