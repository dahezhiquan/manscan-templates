id: apostrophecms-detect

info:
  name: ApostropheCMS 指纹识别（指纹识别）
  author: Shivam Kamboj
  severity: info
  description: |-
    ApostropheCMS 是 Node.js 内容管理系统，用于网站内容、页面、模块和编辑工作流管理。该模板请求首页，并依据页面标题、正文关键字或品牌资源特征识别目标是否使用或暴露了 ApostropheCMS 相关组件，适用于资产盘点、技术栈识别和后续安全评估；命中结果仅表示指纹特征匹配，不代表已确认存在可利用漏洞。
  reference:
  - https://apostrophecms.com/
  metadata:
    verified: true
    max-request: 1
    shodan-query: html:"window.apos"
  tags: tech,cms,apostrophe,discovery

http:
  - method: GET
    path:
      - "{{BaseURL}}"

    redirects: true

    matchers:
      - type: regex
        part: body
        regex:
          - '(?i)window\.apos\s*='
          - '(?i)/modules/apostrophe-'
        condition: and
