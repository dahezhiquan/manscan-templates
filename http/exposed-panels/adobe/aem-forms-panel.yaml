id: aem-forms-panel

info:
  name: Adobe Experience Manager Forms 面板（指纹识别）
  author: darses
  severity: info
  description: |
    该模板通过识别 Adobe Experience Manager Forms 面板、控制台或管理界面的页面特征，判断目标是否暴露了对应服务入口。若命中，说明该后台或运维界面对外可访问，可用于资产识别与暴露面排查。
  metadata:
    verified: true
    max-request: 1
    vendor: adobe
    product: experience_manager_forms
  tags: panel,login,adobe,detect,discovery

http:
  - method: GET
    path:
      - "{{BaseURL}}/lc/libs/livecycle/core/content/login.html"

    matchers-condition: and
    matchers:
      - type: word
        words:
          - "<title>Adobe Experience Manager forms</title>"
        case-insensitive: true

      - type: status
        status:
          - 200
