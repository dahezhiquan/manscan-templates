id: pki-validation-exposure

info:
  name: Well-Known PKI 验证目录暴露
  author: rxerium
  severity: low
  description: |
    检测 CA/B Forum 证书签发 HTTP 验证目录中的 PKI validation 文件或路径。该目录通常用于域名控制权验证。
  impact: |
    - well-known 策略或身份文件通常用于公开声明域名、应用、邮件、证书或身份关联。
    - 若内容过期、配置错误或非预期暴露，可能泄露组织关系、端点能力、用户标识或验证材料。
  remediation: |
    - 确认该 well-known 文件是否为业务或合规所需；非必要内容应删除或限制访问。
    - 定期检查文件内容是否准确、未过期且不包含敏感信息。
    - 对应用关联、邮件策略、证书验证和身份声明文件建立变更审计。
  reference:
    - https://www.namecheap.com/support/knowledgebase/article.aspx/10025/68/how-to-complete-httpbased-validation-upload-a-validation-file-option/
  metadata:
    verified: true
    max-request: 1
    google-query: inurl:"/.well-known/pki-validation/"
  tags: well-known,pki,certificate,validation,miscellaneous,misc,vuln

http:
  - method: GET
    path:
      - "{{BaseURL}}/.well-known/pki-validation/"
      - "{{BaseURL}}/well-known/pki-validation/"

    redirects: true
    stop-at-first-match: true
    matchers-condition: and
    matchers:
      - type: word
        part: body
        words:
          - "pki-validation"
          - "Parent Directory"
        condition: and

      - type: status
        status:
          - 200
