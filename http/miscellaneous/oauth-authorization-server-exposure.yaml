id: oauth-authorization-server-exposure

info:
  name: Well-Known OAuth 授权服务器元数据暴露
  author: rxerium
  severity: info
  description: |
    检测 OAuth 2.0 授权服务器元数据 (RFC 8414)。该元数据用于公开授权端点、令牌端点、支持的算法和能力信息。
  impact: |
    该 well-known 资源可能暴露 OAuth/OIDC 服务配置、端点地址和安全能力细节，便于攻击者进行身份系统测绘。
  reference:
    - https://www.rfc-editor.org/rfc/rfc8414
  metadata:
    verified: true
    max-request: 1
    google-query: inurl:"/.well-known/oauth-authorization-server"
  tags: well-known,oauth,oidc,security,rfc8414,miscellaneous,misc,vuln

http:
  - method: GET
    path:
      - "{{BaseURL}}/.well-known/oauth-authorization-server"

    matchers-condition: and
    matchers:
      - type: word
        part: body
        words:
          - "issuer"
          - "authorization_endpoint"
        condition: and

      - type: status
        status:
          - 200
