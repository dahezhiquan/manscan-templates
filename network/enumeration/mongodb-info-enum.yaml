id: mongodb-info-enum

info:
  name: MongoDB 信息枚举（服务漏洞）
  author: pussycat0x,h4sh5
  severity: medium
  description: |
    MongoDB 是文档型数据库服务，部分配置会允许未认证或低权限客户端读取构建信息与服务状态。该模板向 27017/TCP 发送 MongoDB 信息查询请求，并通过 `version`、`maxBsonObjectSize` 等字段确认可枚举数据库版本和运行参数。
  impact: |
    - 攻击者可能获取 MongoDB 版本、构建参数和服务状态，为后续已知漏洞匹配或未授权访问尝试提供依据。
    - 暴露的数据库信息还可能泄露部署架构、功能开关和资源限制，增加数据服务被定向攻击的风险。
  remediation: |
    - 限制 27017/TCP 仅允许可信应用和运维网段访问，避免数据库端口直接暴露。
    - 启用 MongoDB 认证和最小权限账号，关闭不必要的信息查询能力。
    - 审计数据库访问日志，排查异常信息查询和未授权连接。
  reference:
    - https://nmap.org/nsedoc/scripts/mongodb-info.html
  classification:
    cvss-metrics: CVSS:3.1/AV:N/AC:L/PR:N/UI:N/S:U/C:N/I:N/A:N
    cwe-id: CWE-200
  metadata:
    verified: true
    max-request: 1
    shodan-query: mongodb server information
  tags: network,mongodb,enum,tcp,discovery

tcp:
  - inputs:
      - data: 3b0000003c300000ffffffffd40700000000000061646d696e2e24636d640000000000ffffffff14000000106275696c64696e666f000100000000
        type: hex

    host:
      - "{{Hostname}}"
    port: 27017
    read-size: 2048

    matchers:
      - type: word
        part: raw
        words:
          - "version"
          - "maxBsonObjectSize"
        condition: and

    extractors:
      - type: regex
        group: 1
        regex:
          - "version.....([0-9.]+)"
