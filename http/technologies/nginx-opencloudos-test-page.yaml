id: nginx-opencloudos-test-page

info:
  name: Nginx OpenCloudOS 测试页面 指纹识别（指纹识别）
  author: pussycat0x
  severity: info
  description: >-
    Nginx OpenCloudOS 测试页面通常表示 OpenCloudOS 环境中已安装并启用 Nginx 默认站点。该模板通过请求目标服务并检查预设路径或首页响应、DSL
    条件等指纹特征，判断目标是否使用或暴露了 Nginx OpenCloudOS 测试页面 相关组件；命中结果仅表示指纹特征匹配，可用于资产盘点、技术栈识别和后续安全评估，不代表已确认存在可利用漏洞。
  metadata:
    verified: true
    shodan-query: http.title:"OpenCloudOS"
  tags: tech,nginx,opencloudos
http:
  - method: GET
    path:
      - "{{BaseURL}}"

    matchers:
      - type: dsl
        dsl:
          - 'status_code == 200'
          - 'contains(body, "<title>Nginx test page for OpenCloudOS</title>")'
        condition: and
