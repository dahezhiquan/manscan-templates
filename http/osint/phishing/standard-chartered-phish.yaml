id: standard-chartered-phish

info:
  name: Standard Chartered 仿冒钓鱼网站（钓鱼网站识别）
  author: rxerium
  severity: info
  description: |
    检测到疑似仿冒 Standard Chartered 的钓鱼网站。模板在目标页面返回 200、页面内容命中 Standard Chartered 的金融或支付页面特征，且当前主机不属于 sc.com 官方域名时触发，用于识别借用 Standard Chartered 品牌页面诱导用户信任的仿冒站点。
  reference:
    - https://sc.com
  metadata:
    max-request: 1
  tags: phishing,standard-chartered,bank,osint,discovery
http:
  - method: GET
    path:
      - "{{BaseURL}}"

    host-redirects: true
    max-redirects: 2

    matchers-condition: and
    matchers:
      - type: word
        words:
          - "Standard Chartered Bank"

      - type: status
        status:
          - 200

      - type: dsl
        dsl:
          - '!contains(host,"sc.com")'
