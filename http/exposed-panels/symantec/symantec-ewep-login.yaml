id: symantec-ewep-login

info:
  name: Symantec Encryption Server 登录面板识别（暴露面识别）
  author: johnk3r
  severity: info
  description: 该模板通过识别 Symantec Encryption Server 登录入口的页面标题、特征文本或重定向行为，判断目标是否暴露了对应的认证界面。若命中，说明该登录面板对外可访问，可用于暴露面梳理与后续安全评估。
  classification:
    cvss-metrics: CVSS:3.0/AV:N/AC:L/PR:N/UI:N/S:U/C:N/I:N/A:N
    cwe-id: CWE-200
  metadata:
    max-request: 1
    shodan-query: http.title:"Symantec Encryption Server"
  tags: panel,symantec,login,discovery

http:
  - method: GET
    path:
      - "{{BaseURL}}/b/l.e"

    matchers-condition: and
    matchers:
      - type: word
        words:
          - "<TITLE>Symantec Encryption Server: Web Email Protection - Login</TITLE>"
        part: body

      - type: status
        status:
          - 200
