id: basic-auth-detect

info:
  name: Basic Auth 指纹识别（指纹识别）
  author: w4cky_,bhutch
  severity: info
  description: Basic Auth 是 HTTP 基本认证机制，用于通过浏览器认证弹窗保护受限资源。该模板请求首页，并依据 HTTP 401 状态码、页面标题、正文关键字或品牌资源特征、响应头特征识别目标是否使用或暴露了 Basic Auth 相关组件，适用于资产盘点、技术栈识别和后续安全评估；命中结果仅表示指纹特征匹配，不代表已确认存在可利用漏洞。
  metadata:
    max-request: 1
    shodan-query: "www-authenticate:"
  tags: tech,basic,auth,discovery

http:
  - method: GET
    path:
      - "{{BaseURL}}"

    matchers-condition: and
    matchers:
      - type: regex
        part: header
        regex:
          - "(?i)www-authenticate: basic"

      - type: status
        status:
          - 401

    extractors:
      - type: regex
        part: header
        group: 1
        regex:
          - '(?i)www-authenticate: (basic.*)\r\n'
