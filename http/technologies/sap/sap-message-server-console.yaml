id: sap-message-server-console

info:
  name: SAP Message Server Console 指纹识别（指纹识别）
  author: LRVT,l4rm4nd
  severity: info
  description: >-
    SAP Message Server Console 是 SAP 系统消息服务器控制台，用于查看实例通信、登录组和路由相关状态。该模板通过请求目标服务并检查预设路径或首页响应、页面正文关键字、HTTP
    响应头、状态码等指纹特征，判断目标是否使用或暴露了 SAP Message Server Console 相关组件；命中结果仅表示指纹特征匹配，可用于资产盘点、技术栈识别和后续安全评估，不代表已确认存在可利用漏洞。
  metadata:
    max-request: 1
    shodan-query: http.html:SAP Message Server
  tags: sap,console,exposure,detect
http:
  - method: GET
    path:
      - "{{RootURL}}/msgserver"

    matchers-condition: and
    matchers:
      - type: word
        part: body
        words:
          - "<TITLE>List of commands</TITLE>"
          - "/msgserver/commands"
        condition: and

      - type: word
        part: header
        words:
          - "SAP Message Server"

      - type: status
        status:
          - 200
