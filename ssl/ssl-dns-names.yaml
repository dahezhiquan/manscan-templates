id: ssl-dns-names

info:
  name: SSL 证书 DNS 名称提取（证书安全）
  author: pdteam
  severity: info
  description: 该模板提取目标证书中的 Subject Alternative Name（SAN）DNS 名称，用于识别该证书可覆盖的主机名范围。
  metadata:
    max-request: 1
  tags: ssl,tls,vuln
ssl:
  - address: "{{Host}}:{{Port}}"

    extractors:
      - type: json
        json:
          - ".subject_an[]"
