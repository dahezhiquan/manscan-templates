id: apache-filename-enum

info:
  name: Apache 文件name 枚举
  author: geeknik
  severity: low
  description: |
    检测到 Apache 文件name 枚举。Web 服务器或应用目录允许列出文件内容，可能泄露备份文件、配置文件、日志、源码或其他未公开资源。
  reference:
    - https://hackerone.com/reports/210238
    - https://www.acunetix.com/vulnerabilities/web/apache-mod_negotiation-filename-bruteforcing/
  metadata:
    max-request: 1
  tags: apache,misconfig,hackerone,vuln

http:
  - method: GET

    headers:
      Accept: "fake/value"
    path:
      - "{{BaseURL}}/index"

    matchers-condition: and
    matchers:
      - type: status
        status:
          - 406

      - type: word
        words:
          - "Not Acceptable"
          - "Available variants:"
          - "<address>Apache Server at"
        condition: and
