id: hyperplanning-panel

info:
  name: HYPERPLANNING 登录面板识别（指纹识别）
  author: righettod
  severity: info
  description: |
    该模板通过识别 HYPERPLANNING 登录入口的页面标题、特征文本或重定向行为，判断目标是否暴露了对应的认证界面。若命中，说明该登录面板对外可访问，可用于暴露面梳理与后续安全评估。
  reference:
    - https://www.index-education.com/fr/presentation-hyperplanning.php
  metadata:
    max-request: 1
    shodan-query: http.title:"HYPERPLANNING"
  tags: panel,hyperplanning,login,detect,discovery

http:
  - method: GET
    path:
      - "{{BaseURL}}"

    host-redirects: true

    matchers:
      - type: dsl
        dsl:
          - 'status_code == 200'
          - 'contains_any(to_lower(body), "hyperplanning</title>", "content=\"hyperplanning\"")'
        condition: and

    extractors:
      - type: regex
        part: header
        group: 1
        regex:
          - '(?i)Server:\s+HYPERPLANNING\s+([0-9.\s\-]+)'
