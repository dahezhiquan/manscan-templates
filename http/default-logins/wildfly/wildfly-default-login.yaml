id: wildfly-default-login

info:
  name: Wildfly 默认管理员登录（弱口令）
  author: s0obi
  severity: high
  description: |
    该模板用于检测 Wildfly 是否仍可使用默认凭据或弱口令登录。模板主要向 `/management` 等认证入口发送请求，使用内置默认凭据组合进行认证尝试，并根据响应中的 `management-major-version`、`product-version` 等登录成功特征判断登录是否成功；命中说明目标未及时修改出厂、示例或初始化账号口令。
  impact: |
    - 攻击者可进入 Wildfly 管理后台，修改任务、服务、插件、路由、作业调度或部署配置。
    - 在 DevOps、网关、监控或运维场景中，后台失陷可能影响生产任务执行、泄露密钥配置，并扩大到下游主机或业务系统。
  remediation: |
    - 立即修改默认管理员口令并清理示例账号，按角色最小化后台管理权限。
    - 将控制台和管理 API 放入受控网络或 VPN 后方，并开启多因素认证、登录失败限制和操作审计。
    - 复核近期任务、插件、连接配置、访问令牌和部署记录，轮换可能暴露的密钥。
  reference:
    - https://docs.wildfly.org/26.1/#administrator-guides
  metadata:
    max-request: 1
  tags: wildfly,default-login,vuln

http:
  - raw:
      - |
        GET /management HTTP/1.1
        Host: {{Hostname}}

    digest-username: admin
    digest-password: admin

    matchers-condition: and
    matchers:
      - type: word
        part: body
        words:
          - "management-major-version"
          - "product-version"
        condition: and

      - type: word
        part: header
        words:
          - "application/json"

      - type: status
        status:
          - 200
