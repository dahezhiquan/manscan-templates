id: photoprism-panel

info:
  name: PhotoPrism 登录面板识别（指纹识别）
  author: rxerium,ritikchaddha
  severity: info
  description: |-
    PhotoPrism 是照片管理与图库系统，用于图片索引、相册、元数据和搜索。该模板请求 `/library/login` 路径，并依据 DSL 条件识别目标是否部署了该系统或暴露了对应入口，适用于资产指纹确认；命中结果仅表示系统特征匹配，不代表已确认存在未授权访问或可利用漏洞。
  reference:
  - https://docs.photoprism.app/getting-started/
  metadata:
    verified: true
    max-request: 1
    shodan-query: title:"PhotoPrism"
    fofa-query: title="PhotoPrism"
  tags: photoprism,panel,login,detect,discovery

http:
  - method: GET
    path:
      - "{{BaseURL}}/library/login"

    matchers:

      - type: dsl
        dsl:
          - 'status_code == 200'
          - 'contains_all(body, "PhotoPrism", "login")'
        condition: and
