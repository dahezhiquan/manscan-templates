id: cockroachdb-unauth-exposure

info:
  name: CockroachDB 未授权 控制台 暴露
  author: pussycat0x
  severity: high
  description: |
    该模板用于核查 CockroachDB 未授权 控制台暴露状态。该类问题通常源于管理端、API、控制台或调试接口缺少认证授权，导致未登录用户可直接访问敏感功能。模板会向目标发送探测请求，并依据请求 `/_status/nodes`等证据确认目标是否存在该配置问题。
  impact: |
    - 攻击者可在未授权状态下查看系统状态、任务信息、配置数据或业务内容。
    - 若接口允许执行操作，可能进一步导致配置被修改、任务被触发、数据被导出或服务被接管。
  remediation: |
    - 为相关管理入口和 API 增加强认证、细粒度授权与访问审计。
    - 限制控制台、调试页和内部服务的公网访问，仅允许可信网络或堡垒机访问。
    - 排查访问日志，确认是否存在未授权访问、异常操作或批量枚举行为。
  metadata:
    verified: true
    shodan-query: product:cockroachdb
  tags: cockroachdb,exposure,misconfig,unauth

flow: http(1) && http(2)

http:
  - method: GET
    path:
      - "{{BaseURL}}"
    matchers:
      - type: dsl
        dsl:
          - 'status_code == 200'
          - 'contains(body, "<title>Cockroach Console")'
        condition: and
        internal: true

  - method: GET
    path:
      - "{{BaseURL}}/_status/nodes"

    matchers:
      - type: dsl
        dsl:
          - 'contains_all(body, "nodes", "ServerVersion","buildInfo")'
          - 'status_code == 200'
        condition: and
