id: gcloud-vpc-service-controls-not-configured

info:
  name: Use VPC Service Controls 的Cloud Storage Buckets（云安全）
  author: princechaddha
  severity: medium
  description: VPC Service Controls 可为 Cloud Storage 等服务建立服务边界，降低凭据泄露后的数据外传风险。本模板枚举 Access Context Manager perimeters，并检查 restrictedServices 是否包含 storage.googleapis.com。
  impact: |
    - 敏感 bucket 缺少服务边界保护时，被盗凭据可能从边界外访问或复制数据。
    - 项目间数据流动缺少统一边界控制，增加数据外传和合规审计难度。
  remediation: |
    - 为承载敏感数据的项目配置 VPC Service Controls perimeter，并将 storage.googleapis.com 加入 restricted services。
    - 测试业务访问路径和例外规则，避免服务边界影响合法数据处理流程。
  reference:
    - https://cloud.google.com/vpc-service-controls/docs/overview
  metadata:
    vendor: google
    product: cloud-storage
  tags: cloud,devops,gcp,gcloud,google-cloud-storage,vpc-service-controls,security,gcp-cloud-config

flow: |
  code(1)
  for(let projectId of iterate(template.projectIds)){
    set("projectId", projectId)
    code(2)
    for(let perimeterName of iterate(template.perimeters)){
      set("perimeterName", perimeterName)
      code(3)
    }
  }

self-contained: true

code:
  - engine:
      - sh
      - bash
    source: |
      gcloud projects list --format="json(projectId)"

    extractors:
      - type: json
        name: projectIds
        internal: true
        json:
          - '.[].projectId'

  - engine:
      - sh
      - bash
    source: |
      gcloud access-context-manager perimeters list --project $projectId --format="json(name)"

    extractors:
      - type: json
        name: perimeters
        internal: true
        json:
          - '.[].name'

  - engine:
      - sh
      - bash
    source: |
      gcloud access-context-manager perimeters describe $perimeterName --project $projectId --format=json | jq -r '.status.restrictedServices[]? // "null"'

    matchers:
      - type: word
        words:
          - 'storage.googleapis.com'

    extractors:
      - type: dsl
        dsl:
          - '"The VPC Service Perimeter " + perimeterName + " in project " + projectId + " does not include storage.googleapis.com, leaving Cloud Storage buckets unprotected."'
