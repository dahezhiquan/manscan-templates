id: azure-sql-failover-not-enabled
info:
  name: Azure SQL 自动故障转移组未配置（云安全）
  author: princechaddha
  severity: medium
  description: Azure SQL 故障转移组通过配对逻辑服务器和只读/读写终结点提供区域级业务连续性，未配置时数据库恢复主要依赖单一区域。本模板枚举 Azure SQL 服务器并执行 az sql failover-group list，在返回空数组时报告未配置自动故障转移组。
  impact: |
    - 主区域发生故障、区域级网络中断或灾难时，数据库可能长时间不可用，恢复过程需要人工介入。
    - 无跨区域副本和连接终结点切换机制时，可能超出业务恢复时间目标并造成未同步数据丢失。
  remediation: |
    - 根据业务恢复目标在配对区域创建故障转移组，并纳入需要保护的数据库。
    - 配置合适的故障转移策略、连接终结点和告警，定期执行跨区域故障转移与恢复演练。
  reference:
    - https://docs.microsoft.com/en-us/azure/azure-sql/database/auto-failover-group-overview
  metadata:
    vendor: microsoft
    product: azure-sql-database
  tags: cloud,devops,azure,microsoft,azure-sql,azure-cloud-config

flow: |
  code(1);
  for (let ServerData of iterate(template.serverList)) {
    ServerData = JSON.parse(ServerData);
    set("id", ServerData.id);
    code(2);
    }

self-contained: true
code:
  - engine:
      - sh
      - bash
    source: |
      az sql server list --query '[*].{"id":id}'

    extractors:
      - type: json
        name: serverList
        internal: true
        json:
          - '.[]'

  - engine:
      - sh
      - bash
    source: |
      az sql failover-group list --ids "$id" --output json

    matchers-condition: and
    matchers:
      - type: word
        words:
          - '[]'

    extractors:
      - type: dsl
        dsl:
          - 'id + " does not have auto-failover enabled."'
