id: bmc-remedy-sso-panel

info:
  name: BMC Remedy SSO 登录面板识别（暴露面识别）
  author: righettod
  severity: info
  description: |
    该模板通过识别 BMC Remedy SSO 登录入口的页面标题、特征文本或重定向行为，判断目标是否暴露了对应的认证界面。若命中，说明该登录面板对外可访问，可用于暴露面梳理与后续安全评估。
  reference:
    - https://www.bmc.com/it-solutions/remedy-itsm.html
  metadata:
    verified: true
    max-request: 2
    shodan-query: http.title:"BMC Remedy Single Sign-On domain data entry"
  tags: panel,bmc,login,detect,discovery

http:
  - method: GET
    path:
      - "{{BaseURL}}/arsys/"
      - "{{BaseURL}}/webUI/userHome.do"

    stop-at-first-match: true

    matchers:
      - type: dsl
        dsl:
          - 'status_code == 200'
          - 'contains(to_lower(body), "<title>bmc remedy single sign-on domain data entry")'
        condition: and
