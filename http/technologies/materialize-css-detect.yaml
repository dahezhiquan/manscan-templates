id: materialize-css-detect

info:
  name: Materialize CSS 指纹识别（指纹识别）
  author: Shivam Kamboj
  severity: info
  description: >-
    Materialize CSS 是基于 Material Design 的前端 UI 框架，用于快速构建响应式网页界面。该模板通过请求目标服务并检查预设路径或首页响应、页面正文关键字、正则特征等指纹特征，判断目标是否使用或暴露了
    Materialize CSS 相关组件；命中结果仅表示指纹特征匹配，可用于资产盘点、技术栈识别和后续安全评估，不代表已确认存在可利用漏洞。
  reference:
  - https://materializecss.com/
  metadata:
    product: materialize
    verified: true
    max-request: 1
    shodan-query: html:"materialize.min.css"
  tags: tech,materialize,discovery
http:
  - method: GET
    path:
      - "{{BaseURL}}"

    host-redirects: true
    max-redirects: 2

    matchers:
      - type: regex
        part: body
        regex:
          - '(?i)href=["''][^"'']*materialize(?:[\.-]min)?\.css'
          - '(?i)src=["''][^"'']*materialize(?:[\.-]min)?\.js'
          - '(?i)class=["''][^"'']*waves-effect'
          - '(?i)class=["''][^"'']*materialize-textarea'
        condition: or

    extractors:
      - type: regex
        name: detected_version
        part: body
        group: 1
        regex:
          - (?i)(?:materialize(?:-css)?/|materialize(?:-css)?@)([0-9]+(?:[.][0-9]+)+(?:[-+._][0-9A-Za-z]+)*)/(?:[^"\x27<> ]*/)?materialize(?:[.-]min)?\.(?:css|js)
        internal: true
      - type: dsl
        dsl:
          - 'regex("^[0-9]+(?:[.][0-9]+)*(?:[-+._][0-9A-Za-z]+)*$", detected_version) ? detected_version : ""'
