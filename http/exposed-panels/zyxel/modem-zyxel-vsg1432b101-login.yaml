id: modem-zyxel-vsg1432b101-login

info:
  name: Zyxel VSG1432-B101 登录面板识别（指纹识别）
  author: princechaddha
  severity: info
  description: Zyxel VSG1432-B101 是 Zyxel 调制解调器/路由器管理界面，用于宽带、无线、路由和设备状态配置。该模板请求首页，并依据 HTTP 200 状态码、页面标题、正文关键字或品牌资源特征识别目标是否部署了该系统或暴露了对应入口，适用于资产指纹确认；命中结果仅表示系统特征匹配，不代表已确认存在未授权访问或可利用漏洞。
  metadata:
    verified: true
    max-request: 1
    shodan-query: http.html:"VSG1432-B101"
  tags: tech,zyxel,modem,router,panel,discovery

http:
  - method: GET
    path:
      - "{{BaseURL}}"

    matchers-condition: and
    matchers:
      - type: word
        part: body
        words:
          - "Welcome to ZyXEL VSG1432-B101::"

      - type: status
        status:
          - 200
