id: wordpress-site

info:
  name: WordPress 站点 用户名信息枚举（OSINT）
  author: gl0bal01
  severity: info
  description: |
    WordPress 站点 是面向博客写作、长文发布或个人内容归档的在线平台，用户资料页通常会公开展示文章、作者资料、评论或订阅信息。该模板用于在公开互联网侧枚举 WordPress 站点 用户名，不需要认证；模板请求公开路径 https://用户名.wordpress.com，并结合响应状态为 200、页面或响应内容命中 “https://用户名.wordpress.com”、“siteID” 等资料页特征判断目标用户名是否存在。该检查属于 OSINT 用户枚举，结果仅表示公开资料页或公开搜索结果可被访问，不代表目标平台存在可直接修复的漏洞。
  classification:
    cvss-metrics: CVSS:3.1/AV:N/AC:L/PR:N/UI:N/S:U/C:N/I:N/A:N
    cvss-score: 0
    cwe-id: CWE-200
  metadata:
    verified: true
    max-request: 1
  tags: osint,osint-blog,wordpress,discovery

self-contained: true

http:
  - method: GET
    path:
      - "https://{{user}}.wordpress.com"

    matchers-condition: and
    matchers:
      - type: word
        part: body
        words:
          - "https://{{user}}.wordpress.com"
          - "siteID"
          - "user_id"
        condition: and

      - type: status
        status:
          - 200
