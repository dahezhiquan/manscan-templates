id: jboss-web-console

info:
  name: JBoss 管理控制台信息页面暴露
  author: dhiyaneshDK
  severity: medium
  description: |
    该模板用于核查 JBoss 管理控制台信息页面暴露。该类问题通常源于管理端、API、控制台或服务接口缺少认证授权，导致未登录用户可直接访问敏感功能。模板会向目标发送探测请求，并依据请求 `/web-console/ServerInfo.jsp`、匹配 `Application Server`、匹配 `Management Console`、状态码 200 等证据确认目标是否存在该配置问题。
  impact: |
    - 攻击者可在未授权状态下查看系统状态、业务数据、任务信息或管理接口。
    - 若接口支持写操作，可能进一步导致配置篡改、服务接管、数据删除或横向移动。
  remediation: |
    - 为相关管理端和 API 启用认证授权，并按最小权限限制可访问功能。
    - 将管理接口限制在内网、VPN 或可信来源范围内，并开启访问审计。
    - 检查历史访问日志，确认是否存在未授权访问、批量枚举或异常操作。
  reference:
    - https://www.exploit-db.com/ghdb/5215
    - https://access.redhat.com/documentation/en-us/red_hat_jboss_enterprise_application_platform/6.4/html/administration_and_configuration_guide/sect-the_management_console
  classification:
    cvss-metrics: CVSS:3.1/AV:N/AC:L/PR:N/UI:N/S:U/C:N/I:N/A:N
    cvss-score: 0
    cwe-id: CWE-200
    cpe: cpe:2.3:a:redhat:jboss_enterprise_application_platform:*:*:*:*:*:*:*:*
  metadata:
    verified: true
    max-request: 1
    google-query: inurl:/web-console/ServerInfo.jsp | inurl:/status?full=true
    product: jboss_enterprise_application_platform
    vendor: redhat
  tags: jboss,unauth,edb,misconfig,vuln

http:
  - method: GET
    path:
      - "{{BaseURL}}/web-console/ServerInfo.jsp"

    matchers-condition: and
    matchers:
      - type: word
        words:
          - "Application Server"
          - "Management Console"
        condition: and

      - type: status
        status:
          - 200
