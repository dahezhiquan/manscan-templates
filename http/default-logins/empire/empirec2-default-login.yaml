id: empirec2-default-login

info:
  name: Empire C2 / Starkiller Interface 默认口令登录（弱口令）
  author: clem9669,parzival
  severity: high
  description: |
    该模板用于检测 Empire C2 / Starkiller Interface 是否仍可使用默认凭据或弱口令登录。模板主要向 `/token`、`/api/admin/login` 等认证入口发送请求，使用内置默认凭据组合进行认证尝试，并根据响应中的 `access_token`、`{"token":".*"}` 等登录成功特征判断登录是否成功；命中说明目标未及时修改出厂、示例或初始化账号口令。
  impact: |
    - 攻击者可接管 Empire C2 / Starkiller Interface 控制台，获取或操纵钓鱼、C2、演练任务或攻击基础设施配置。
    - 此类系统一旦被未授权登录，可能被用于投递恶意活动、泄露测试数据，或反向暴露防守方/演练方基础设施。
  remediation: |
    - 立即修改默认凭据并禁用公开可达的管理入口，只允许可信运维来源访问。
    - 启用强认证、登录告警和完整操作审计，删除无用账号和历史测试凭据。
    - 检查近期任务、令牌、载荷、回连地址和导出数据，确认没有被未授权使用。
  reference:
    - https://github.com/BC-SECURITY/Empire
    - https://github.com/BC-SECURITY/empire-docs/blob/main/restful-api/README.md
  metadata:
    verified: true
    max-request: 2
  tags: default-login,empire,c2,intrusive,vuln

http:
  - raw:
      - |
        POST /token HTTP/1.1
        Host: {{Hostname}}
        Content-Type: multipart/form-data; boundary=----WebKitFormBoundaryoZwyedGcQU4FrcFV
        Accept: application/json, text/plain, */*

        ------WebKitFormBoundaryoZwyedGcQU4FrcFV
        Content-Disposition: form-data; name="username"

        {{username}}
        ------WebKitFormBoundaryoZwyedGcQU4FrcFV
        Content-Disposition: form-data; name="password"

        {{password}}
        ------WebKitFormBoundaryoZwyedGcQU4FrcFV--
      - |
        POST /api/admin/login HTTP/1.1
        Host: {{Hostname}}
        Content-Type: application/json

        {"username":"{{username}}","password":"{{password}}"}

    attack: pitchfork
    payloads:
      username:
        - empireadmin
      password:
        - password123
    stop-at-first-match: true

    matchers-condition: and
    matchers:
      - type: word
        part: body
        words:
          - 'access_token'
          - '{"token":".*"}'
        condition: or

      - type: word
        part: body
        words:
          - '"code":1001'
        negative: true

      - type: word
        part: content_type
        words:
          - application/json

      - type: status
        status:
          - 200
