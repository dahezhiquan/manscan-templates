id: aws-cloudfront-service

info:
  name: AWS CloudFront 服务 指纹识别（指纹识别）
  author: jiheon-dev
  severity: info
  description: AWS CloudFront 服务 是 AWS CDN 服务，用于边缘缓存、内容加速和全球流量分发。该模板请求首页，并依据 DSL 条件识别目标是否使用或暴露了 AWS CloudFront 服务 相关组件，适用于资产盘点、技术栈识别和后续安全评估；命中结果仅表示指纹特征匹配，不代表已确认存在可利用漏洞。
  metadata:
    max-request: 1
  tags: aws,tech,service,discovery

http:
  - method: GET
    path:
      - "{{BaseURL}}"

    matchers:
      - type: dsl
        condition: or
        dsl:
          - "contains(tolower(header), 'x-cache: hit from cloudfront')"
          - "contains(tolower(header), 'x-cache: refreshhit from cloudfront')"
          - "contains(tolower(header), 'x-cache: miss from cloudfront')"
          - "contains(tolower(header), 'x-cache: error from cloudfront')"
