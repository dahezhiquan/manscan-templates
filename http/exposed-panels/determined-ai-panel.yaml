id: determined-ai-panel

info:
  name: Determined AI 面板 - 检测（暴露面识别）
  author: rxerium
  severity: info
  description: |-
    通过匹配应用根路径返回的应用标题和 meta 描述，检测到 Determined AI。它是一款开源深度学习训练平台，提供分布式训练、超参数调优与实验追踪功能，并可通过基于 Web 的 UI 以及由 "master" 组件提供的 REST/gRPC-gateway API 访问。
  reference:
    - https://github.com/determined-ai/determined
    - https://docs.determined.ai
  metadata:
    verified: true
    max-request: 1
    vendor: determined-ai
    product: determined
    shodan-query: 'html:"Determined Deep Learning Training Platform"'
  tags: panel,determined-ai,ml,ai,mlops,detect,discovery

http:
  - method: GET
    path:
      - "{{BaseURL}}"

    host-redirects: true
    max-redirects: 2

    matchers-condition: and
    matchers:
      - type: word
        part: body
        words:
          - "Determined Deep Learning Training Platform"
          - "<title>Determined</title>"
        condition: and

      - type: status
        status:
          - 200
