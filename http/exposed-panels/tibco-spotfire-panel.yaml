id: tibco-spotfire-panel

info:
  name: TIBCO Spotfire 登录面板识别（指纹识别）
  author: righettod
  severity: info
  description: |-
    TIBCO Spotfire 是商业智能分析平台，用于数据可视化、分析应用和仪表盘管理。该模板请求首页、`/spotfire/login.html`，并依据页面标题、正文关键字或品牌资源特征识别目标是否部署了该系统或暴露了对应入口，适用于资产指纹确认；命中结果仅表示系统特征匹配，不代表已确认存在未授权访问或可利用漏洞。
  reference:
  - https://www.tibco.com/products/tibco-spotfire
  classification:
    cpe: cpe:2.3:a:tibco:spotfire_server:*:*:*:*:*:*:*:*
  metadata:
    verified: true
    max-request: 2
    shodan-query: "TIBCO Spotfire Server"
    product: spotfire_server
    vendor: tibco
  tags: panel,tibco,login,detect,discovery

http:
  - method: GET
    path:
      - "{{BaseURL}}"
      - "{{BaseURL}}/spotfire/login.html"

    stop-at-first-match: true
    host-redirects: true
    max-redirects: 2

    matchers:
      - type: word
        part: body
        words:
          - '<title>TIBCO Spotfire Server'
          - 'content="TIBCO Spotfire'
          - '/spotfire/ui/'
        condition: or
