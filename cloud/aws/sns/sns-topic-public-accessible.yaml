id: sns-topic-public-accessible

info:
  name: SNS Topic Policy 允许公共访问（云安全）
  author: Ritesh_Gohil(#L4stPL4Y3R)
  severity: high
  description: SNS topic policy 中 Principal 为 * 且 Effect 为 Allow、又没有 Condition 约束时，可能允许外部主体对 topic 执行策略授予的操作。该模板读取 Attributes.Policy，并匹配公共 Allow 语句且排除包含 Condition 的策略。
  impact: |
    - Topic 可能被未授权主体订阅、发布或执行其他被策略允许的操作，造成消息泄露或滥发。
    - 公共 topic policy 会扩大事件分发和控制面攻击面，增加业务告警被干扰的风险。
  remediation: |
    - 移除 topic policy 中面向 * 的非必要 Allow 语句，仅授权明确可信主体。
    - 对确需跨账号访问的场景使用 SourceArn、SourceAccount、aws:PrincipalOrgID 等条件限制并持续审计。
  reference:
    - https://docs.aws.amazon.com/sns/latest/api/API_GetTopicAttributes.html
  metadata:
    max-request: 2
    vendor: amazon
    product: sns
  tags: cloud,devops,aws,amazon,sns,aws-cloud-config

flow: |
  code(1)
  for (let topicArn of iterate(template.topics)) {
    set("topicArn", topicArn)
    code(2)
  }

self-contained: true
code:
  - engine:
      - sh
      - bash
    source: |
      aws sns list-topics --query 'Topics[*].TopicArn'

    extractors:
      - type: json
        internal: true
        name: topics
        json:
          - '.[]'

  - engine:
      - sh
      - bash
    source: |
      aws sns get-topic-attributes --topic-arn $topicArn --query Attributes.Policy --output text

    matchers-condition: and
    matchers:
      - type: word
        part: body
        words:
          - '"Effect":"Allow"'

      - type: word
        part: body
        words:
          - '"Principal":{"AWS":"*"}'

      - type: regex
        part: body
        negative: true
        regex:
          - '"Condition"'

    extractors:
      - type: dsl
        dsl:
          - '"The SNS topic " + topicArn + " is publicly accessible via Policy"'
