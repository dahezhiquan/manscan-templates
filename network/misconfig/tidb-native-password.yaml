id: tidb-native-password

info:
  name: TiDB 原生密码认证暴露（服务漏洞）
  author: lu4nx
  severity: medium
  description: |
    TiDB 是兼容 MySQL 协议的分布式数据库，客户端握手中可能暴露 `mysql_native_password` 认证插件信息。该模板连接 4000 端口并同时匹配 `TiDB` 与 `mysql_native_password`，用于发现 TiDB 服务暴露较旧的 MySQL 兼容认证面。
  impact: |
    - 攻击者可确认目标为 TiDB 数据库并识别其认证插件，为口令攻击、资产测绘或版本兼容性分析提供线索。
    - 若数据库端口暴露且账号口令较弱，攻击者可能进一步尝试登录并访问业务数据。
  remediation: |
    - 限制 TiDB 4000 端口仅对应用和运维可信网段开放，避免直接暴露到公网。
    - 使用强口令、最小权限账号和登录审计，逐步淘汰不必要的旧认证兼容配置。
    - 根据 PingCAP 官方建议保持 TiDB 集群版本和安全配置更新。
  classification:
    cvss-metrics: CVSS:3.0/AV:N/AC:L/PR:N/UI:N/S:U/C:L/I:N/A:N
    cvss-score: 5.3
    cwe-id: CWE-200
  metadata:
    max-request: 1
  tags: network,tidb,db,misconfig,tcp,vuln

tcp:
  - host:
      - "{{Hostname}}"
    port: 4000

    matchers:
      - type: word
        words:
          - "mysql_native_password"
          - "TiDB"
        condition: and
