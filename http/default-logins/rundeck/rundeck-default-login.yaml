id: rundeck-default-login

info:
  name: Rundeck 默认口令登录（弱口令）
  author: karkis3c
  severity: high
  description: |
    该模板用于检测 Rundeck 是否仍可使用默认凭据或弱口令登录。模板主要向 `/j_security_check`、`/menu/home` 等认证入口发送请求，使用内置默认凭据组合进行认证尝试，并根据响应中的 `/user/logout`、`Hi admin` 等登录成功特征判断登录是否成功；命中说明目标未及时修改出厂、示例或初始化账号口令。
  impact: |
    - 攻击者可进入 Rundeck 管理后台，修改任务、服务、插件、路由、作业调度或部署配置。
    - 在 DevOps、网关、监控或运维场景中，后台失陷可能影响生产任务执行、泄露密钥配置，并扩大到下游主机或业务系统。
  remediation: |
    - 立即修改默认管理员口令并清理示例账号，按角色最小化后台管理权限。
    - 将控制台和管理 API 放入受控网络或 VPN 后方，并开启多因素认证、登录失败限制和操作审计。
    - 复核近期任务、插件、连接配置、访问令牌和部署记录，轮换可能暴露的密钥。
  reference:
    - https://raw.githubusercontent.com/karkis3c/bugbounty/main/nuclei-templates/default-login/rundeck-default-login.yaml
    - https://docs.rundeck.com/docs/learning/
  classification:
    cpe: cpe:2.3:a:pagerduty:rundeck:*:*:*:*:*:*:*:*
  metadata:
    verified: true
    max-request: 2
    vendor: pagerduty
    product: rundeck
    fofa-query: app="Rundeck-Login"
  tags: default-login,rundeck,vuln
variables:
  username: admin
  password: admin

http:
  - raw:
      - |
        POST /j_security_check HTTP/1.1
        Host: {{Hostname}}
        Content-Type: application/x-www-form-urlencoded; charset=UTF-8

        j_username={{username}}&j_password={{password}}
      - |
        GET /menu/home HTTP/1.1
        Host: {{Hostname}}

    matchers-condition: and
    matchers:
      - type: word
        part: body_2
        words:
          - "/user/logout"
          - "Hi admin"
        condition: and

      - type: status
        status:
          - 200
