id: docmosis-tornado-server

info:
  name: Docmosis Tornado 服务 暴露
  author: tess
  severity: low
  description: |
    该模板用于核查 Docmosis Tornado 服务 暴露。该类问题通常源于配置文件、备份文件、管理页面、服务状态或敏感资源被错误暴露到 Web 访问路径。模板会向目标发送探测请求，并依据请求 ``、匹配 `Docmosis Tornado`、匹配 `href="WebServerDownload.css`、状态码 200等证据确认目标是否存在该配置问题。
  impact: |
    - 攻击者可获取版本、路径、账号、密钥、令牌、配置或业务数据等敏感信息。
    - 泄露的信息可能被用于凭据攻击、漏洞匹配、权限提升或横向移动。
  remediation: |
    - 移除 Web 根目录下不应公开的配置、备份、日志和临时文件。
    - 为敏感页面和资源增加访问控制，并按最小暴露原则收敛公开路径。
    - 轮换已暴露的密钥、令牌和凭据，并审计异常下载或枚举行为。
  classification:
    cpe: cpe:2.3:a:docmosis:tornado:*:*:*:*:*:*:*:*
  metadata:
    verified: true
    max-request: 1
    vendor: docmosis
    product: tornado
    shodan-query: title:"Docmosis Tornado"
  tags: misconfig,tornado,exposure,vuln

http:
  - method: GET
    path:
      - '{{BaseURL}}'

    matchers-condition: and
    matchers:
      - type: word
        part: body
        words:
          - "Docmosis Tornado"
          - 'href="WebServerDownload.css'
        condition: and

      - type: status
        status:
          - 200
