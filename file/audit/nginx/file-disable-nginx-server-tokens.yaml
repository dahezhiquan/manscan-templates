id: file-disable-nginx-server-tokens

info:
  name: Nginx server_tokens 未禁用（本地文件安全扫描）
  author: pussycat0x
  severity: medium
  description: |
    该模板检测 Nginx server_tokens 是否启用。开启后可能在响应中暴露版本信息，便于攻击者进行指纹识别。
  remediation: |
    在 /etc/nginx/nginx.conf 中设置 server_tokens off; 并重启 Nginx。
  reference:
    - https://wiki.devsecopsguides.com/docs/checklists/nginx/
    - https://nginx.org/en/docs/http/ngx_http_core_module.html#server_tokens
  metadata:
    verified: true
  tags: audit,nginx,file,hardening

file:
  - extensions:
      - conf

    matchers-condition: and
    matchers:
      - type: word
        words:
          - "http"
          - "events"
        condition: and

      - type: word
        words:
          - "server_tokens off"
        negative: true
