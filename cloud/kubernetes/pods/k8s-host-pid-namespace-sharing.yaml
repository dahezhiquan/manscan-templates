id: k8s-host-pid-namespace-sharing

info:
  name: Host PID Namespace Sharing（云安全）
  author: princechaddha
  severity: critical
  description: Pod 启用 hostPID 会共享宿主机进程命名空间，使容器能够观察节点进程列表和部分进程信息。本模板枚举 Pod，并在 hostPID 为 true 时报告。
  impact: |
    - 容器可能枚举宿主机进程、收集敏感运行信息或辅助权限提升攻击。
    - 被攻陷容器可更容易定位节点关键进程和同节点工作负载。
  remediation: |
    - 除受控诊断组件外禁用 hostPID。
    - 通过 Pod Security Admission、OPA/Gatekeeper 或 Kyverno 阻止普通工作负载使用 hostPID。
  reference:
    - https://kubernetes.io/docs/concepts/policy/pod-security-policy/#host-namespaces
  metadata:
    vendor: kubernetes
    product: kubernetes
  tags: cloud,devops,kubernetes,devsecops,pods,k8s-cluster-security
flow: |
  code(1);
  for (let pod of template.items) {
    set("pod", pod)
    javascript(1);
  }

self-contained: true
code:
  - engine:
      - sh
      - bash
    source: kubectl get pods --all-namespaces --output=json
    extractors:
      - type: json
        name: items
        internal: true
        json:
          - '.items[]'

javascript:
  - code: |
        pod = JSON.parse(template.pod);
        if (pod.spec.hostPID) {
          let result = (`Pod '${pod.metadata.name}' in namespace '${pod.metadata.namespace}' is sharing the host's PID namespace.`);
          Export(result);
        }
    extractors:
      - type: dsl
        dsl:
          - response
