id: suprema-biostar-panel

info:
  name: Suprema BioStar 2 登录面板识别（指纹识别）
  author: ritikchaddha
  severity: info
  description: Suprema BioStar 2 是门禁与生物识别管理平台，用于用户、指纹、人脸、门禁设备和考勤管理。该模板请求 `/#/login`，并依据 HTTP 200 状态码、页面标题、正文关键字或品牌资源特征识别目标是否部署了该系统或暴露了对应入口，适用于资产指纹确认；命中结果仅表示系统特征匹配，不代表已确认存在未授权访问或可利用漏洞。
  classification:
    cpe: cpe:2.3:a:supremainc:biostar_2:*:*:*:*:*:*:*:*
  metadata:
    verified: true
    max-request: 1
    vendor: supremainc
    product: biostar_2
    shodan-query: title:"Biostar"
  tags: panel,login,biostar,detect,discovery

http:
  - method: GET
    path:
      - "{{BaseURL}}/#/login"

    matchers-condition: and
    matchers:
      - type: word
        part: body
        words:
          - "BioStar 2</title>"

      - type: status
        status:
          - 200
