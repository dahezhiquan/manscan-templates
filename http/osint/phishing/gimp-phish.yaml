id: gimp-phish

info:
  name: GIMP 仿冒钓鱼网站（钓鱼网站识别）
  author: rxerium
  severity: info
  description: |
    检测到疑似仿冒 GIMP 的钓鱼网站。模板在目标页面返回 200、页面内容命中 GIMP 的品牌页面特征，且当前主机不属于 gimp.org 官方域名时触发，用于识别借用 GIMP 品牌页面诱导用户信任的仿冒站点。
  reference:
    - https://gimp.org
  metadata:
    max-request: 1
  tags: phishing,gimp,osint,discovery
http:
  - method: GET
    path:
      - "{{BaseURL}}"

    host-redirects: true
    max-redirects: 2

    matchers-condition: and
    matchers:
      - type: word
        words:
          - 'GIMP - GNU Image Manipulation Program'

      - type: status
        status:
          - 200

      - type: dsl
        dsl:
          - '!contains(host,"gimp.org")'
