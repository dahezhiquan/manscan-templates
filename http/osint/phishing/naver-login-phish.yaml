id: naver-login-phish

info:
  name: Naver 登录页 仿冒钓鱼网站（钓鱼网站识别）
  author: hahwul
  severity: info
  description: |
    检测到疑似仿冒 Naver 登录页 的钓鱼网站。模板在目标页面返回 200、页面内容命中 Naver 登录页 的品牌页面特征，且当前主机不属于 nid.naver.com 官方域名时触发，用于识别借用 Naver 登录页 品牌页面诱导用户信任的仿冒站点。
  reference:
    - https://nid.naver.com
    - https://www.navercorp.com
  metadata:
    max-request: 1
  tags: phishing,naver,osint,discovery
http:
  - method: GET
    path:
      - "{{BaseURL}}"

    host-redirects: true
    max-redirects: 2

    matchers-condition: and
    matchers:
      - type: word
        words:
          - '네이버 : 로그인'
          - '로그인'

      - type: status
        status:
          - 200

      - type: dsl
        dsl:
          - '!contains(host,"nid.naver.com")'
