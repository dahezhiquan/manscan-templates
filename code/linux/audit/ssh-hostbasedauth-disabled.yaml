id: ssh-hostbasedauth-disabled

info:
  name: SSH HostbasedAuthentication 未禁用（本地基线扫描）
  author: Th3l0newolf
  severity: high
  description: |
    SSH HostbasedAuthentication 会基于主机信任关系进行认证，若启用，受信主机或 DNS/主机密钥配置异常可能导致未授权访问。CIS Ubuntu 基线建议禁用主机认证；模板检查 `/etc/ssh/sshd_config` 中是否显式设置 `HostbasedAuthentication yes`，命中 Policy-Fail 表示风险存在。
  impact: |
    - 攻击者一旦控制受信主机或伪造信任关系，可能绕过常规用户认证。
    - 主机信任机制会增加横向移动风险，并削弱单用户级别的审计边界。
  remediation: |
    - 在 `/etc/ssh/sshd_config` 中设置 `HostbasedAuthentication no` 或保持默认禁用，并重载 sshd。
    - 清理遗留的 hostbased/rhosts 信任配置，统一使用密钥、MFA 和集中授权。
  reference:
    - https://www.cisecurity.org/benchmark/ubuntu_linux
    - https://docs.datadoghq.com/security/default_rules/def-000-fqw/
  metadata:
    verified: true
  tags: cis,local,ssh,linux,audit,ubuntu,benchmark

self-contained: true

code:
  - engine:
      - bash

    args:
      - "-c"
      - |
        SSHD_CONFIG="/etc/ssh/sshd_config"
        # Check if the parameter is set to yes (bad)
        if grep -i '^\s*HostbasedAuthentication\s\+yes' "$SSHD_CONFIG" >/dev/null; then
          current_value=$(grep -i '^\s*HostbasedAuthentication' "$SSHD_CONFIG" | head -1 | tr -d '\n')
          echo "[cis-ssh-hostbasedauth-disabled:Policy-Fail] [$current_value] [CIS_FAIL] [medium]"
        else
          echo "[cis-ssh-hostbasedauth-disabled:Policy-Pass] [HostbasedAuthentication no or not set] [CIS_PASS] [medium]"
        fi

    matchers:
      - type: word
        name: policy-pass
        words:
          - "Policy-Pass"

      - type: word
        name: policy-fail
        words:
          - "Policy-Fail"
