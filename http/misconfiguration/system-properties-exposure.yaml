id: system-properties-exposure

info:
  name: System 属性 暴露
  author: DhiyaneshDk
  severity: low
  description: |
    检测到 System 属性 暴露。目标响应或文件中可能暴露配置、凭据、密钥、令牌、环境变量或历史记录等敏感信息，可能被用于进一步入侵。
  metadata:
    verified: true
    max-request: 1
    shodan-query: title:"System Properties"
  tags: misconfig,system,exposure,vuln

http:
  - method: GET
    path:
      - '{{BaseURL}}'

    matchers-condition: and
    matchers:
      - type: word
        part: body
        words:
          - "System Properties:"
          - "Environment Variables:"
        condition: and

      - type: status
        status:
          - 200
