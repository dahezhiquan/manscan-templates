id: paperless-ngx-panel

info:
  name: Paperless-ngx 登录面板识别（指纹识别）
  author: ChrisJr404
  severity: info
  description: |-
    Paperless-ngx 是文档归档与 OCR 管理系统，用于扫描件、票据和文档的索引与检索。该模板请求 `/accounts/login/` 路径，并依据 DSL 条件识别目标是否部署了该系统或暴露了对应入口，适用于资产指纹确认；命中结果仅表示系统特征匹配，不代表已确认存在未授权访问或可利用漏洞。
  reference:
  - https://github.com/paperless-ngx/paperless-ngx
  - https://docs.paperless-ngx.com/
  metadata:
    verified: true
    max-request: 1
    vendor: paperless-ngx
    product: paperless-ngx
    shodan-query: http.title:"Paperless-ngx"
    fofa-query: title="Paperless-ngx"
  tags: panel,paperless-ngx,paperless,discovery,detect

http:
  - method: GET
    path:
      - "{{BaseURL}}/accounts/login/"

    matchers:
      - type: dsl
        dsl:
          - 'status_code == 200'
          - 'contains_all(body, "Paperless-ngx", "Paperless-ngx project and contributors")'
        condition: and
