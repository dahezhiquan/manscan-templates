id: ssh-password-auth

info:
  name: SSH 密码认证支持检测（服务漏洞）
  author: princechaddha
  severity: low
  description: |
    目标 SSH 服务启用了密码认证，攻击面因而包含口令猜测、凭据填充和弱口令登录。模板建立 SSH 信息探测连接，并检查服务端公布的 UserAuth 认证方式中是否包含 password；该探测会发起认证协商，可能被目标记录。
  impact: |
    - 启用 SSH 密码认证会使远程管理入口暴露于口令猜测、凭据填充和撞库攻击。
    - 若缺少多因素认证、限速或账号锁定，弱口令被成功利用后可能导致主机接管。
  remediation: |
    - 优先禁用 SSH 密码认证，改用密钥认证和多因素认证。
    - 如必须保留密码认证，应限制来源、启用限速/锁定策略并监控暴力破解行为。
  reference:
    - https://nmap.org/nsedoc/scripts/ssh-auth-methods.html
  metadata:
    verified: true
    max-request: 2
    shodan-query: product:"OpenSSH"
  tags: ssh,js,enum,network,discovery

javascript:
  - pre-condition: |
      isPortOpen(Host,Port);
    code: |
      var m = require("nuclei/ssh");
      var c = m.SSHClient();
      var response = c.ConnectSSHInfoMode(Host, Port);
      Export(response);
    args:
      Host: "{{Host}}"
      Port: "22"
    matchers:
      - type: word
        words:
          - '"UserAuth":'
          - '"password"'
        condition: and
