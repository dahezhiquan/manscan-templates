id: node-red-unauth

info:
  name: Node-RED 未授权访问
  author: 0xBassia
  severity: high
  description: |
    该模板用于核查 Node-RED 未授权访问。该类问题通常源于高危管理接口未授权开放、危险方法启用或可写接口暴露，攻击者可借助接口能力写入文件或触发命令执行。模板会向目标发送探测请求，并依据请求 `/flows`、匹配 `"id"`、匹配 `"type"`、匹配 `"wires"`等证据确认目标是否存在该配置问题。
  impact: |
    - 攻击者可能上传文件、执行命令、提交任务或控制目标服务。
    - 成功利用后可导致主机沦陷、数据泄露、横向移动和业务中断。
  remediation: |
    - 立即为相关接口启用认证授权并限制可信来源访问。
    - 关闭不必要的危险 HTTP 方法、远程执行能力和可写管理接口。
    - 检查系统进程、上传目录和访问日志，清理异常文件并轮换凭据。
  reference:
    - https://nodered.org/docs/user-guide/runtime/securing-node-red
    - https://nodered.org/docs/user-guide/runtime/configuration
  classification:
    cvss-metrics: CVSS:3.1/AV:N/AC:L/PR:N/UI:N/S:U/C:H/I:H/A:H
    cvss-score: 9.8
    cwe-id: CWE-306
  metadata:
    verified: true
    max-request: 1
    shodan-query: title:"Node-RED"
  tags: misconfig,nodered,unauth,rce

http:
  - method: GET
    path:
      - '{{BaseURL}}/flows'

    matchers-condition: and
    matchers:
      - type: word
        part: body
        words:
          - '"id"'
          - '"type"'
          - '"wires"'
        condition: and

      - type: word
        part: header
        words:
          - "application/json"

      - type: status
        status:
          - 200
