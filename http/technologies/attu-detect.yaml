id: attu-detect

info:
  name: Attu 指纹识别（指纹识别）
  author: s4e-io
  severity: info
  description: Attu 是 Milvus 向量数据库的 Web 管理工具，用于集合、向量数据和查询调试。该模板请求首页，并依据页面标题、正文关键字或品牌资源特征识别目标是否使用或暴露了 Attu 相关组件，适用于资产盘点、技术栈识别和后续安全评估；命中结果仅表示指纹特征匹配，不代表已确认存在可利用漏洞。
  reference:
  - https://github.com/zilliztech/attu
  metadata:
    verified: true
    max-request: 1
    fofa-query: title="Attu"
  tags: tech,vector-database,attu,detect,discovery

http:
  - method: GET
    path:
      - "{{BaseURL}}"

    matchers:
      - type: word
        part: body
        words:
          - '<title>Attu</title>'
          - 'content="Attu'
        condition: or
