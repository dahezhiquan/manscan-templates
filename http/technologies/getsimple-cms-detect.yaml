id: getsimple-cms-detect

info:
  name: GetSimple CMS 指纹识别（指纹识别）
  author: pikpikcu,philippedelteil
  severity: info
  description: >-
    GetSimple CMS 是轻量级 PHP 内容管理系统，使用 XML 文件存储内容并提供站点后台管理能力。该模板通过请求目标服务并检查预设路径或首页响应、页面正文关键字、状态码等指纹特征，判断目标是否使用或暴露了
    GetSimple CMS 相关组件；命中结果仅表示指纹特征匹配，可用于资产盘点、技术栈识别和后续安全评估，不代表已确认存在可利用漏洞。
  metadata:
    max-request: 2
  tags: tech,getsimple,discovery
http:
  - method: GET
    path:
      - "{{BaseURL}}"
      - "{{BaseURL}}/readme.txt"

    stop-at-first-match: true

    matchers-condition: and
    matchers:
      - type: status
        status:
          - 200

      - type: word
        words:
          - "Powered by  GetSimple"
          - 'GetSimple CMS is a flatfile CMS'
        part: body
        condition: or
