id: autorun-scripts-startup-folder

info:
  name: 启动文件夹存在自启动脚本（本地基线扫描）
  author: princechaddha
  severity: medium
  description: |
    该模板检查 Windows 启动文件夹中是否存在未授权脚本或可执行文件。此类文件会在用户登录时自动运行。
  impact: |
    恶意脚本可实现持久化、凭据窃取或横向移动。
  remediation: |
    清理非授权启动项，限制普通用户写入启动目录，并使用应用控制策略。
  tags: windows,startup,autorun,code,windows-audit

self-contained: true

code:
  - pre-condition: |
      IsWindows();
    engine:
      - powershell
      - powershell.exe
    args:
      - -ExecutionPolicy
      - Bypass
    pattern: "*.ps1"
    source: |
      Get-ChildItem -Path "$env:ProgramData\Microsoft\Windows\Start Menu\Programs\StartUp"

    matchers:
      - type: word
        words:
          - ".exe"
          - ".ps1"
