id: mspcontrol-login

info:
  name: MSPControl 登录面板识别（暴露面识别）
  author: idealphase
  severity: info
  description: 该模板通过识别 MSPControl 登录入口的页面标题、特征文本或重定向行为，判断目标是否暴露了对应的认证界面。若命中，说明该登录面板对外可访问，可用于暴露面梳理与后续安全评估。
  reference:
    - https://mspcontrol.org/
    - https://mspcontrol.org/downloads/
  classification:
    cvss-metrics: CVSS:3.0/AV:N/AC:L/PR:N/UI:N/S:U/C:N/I:N/A:N
    cwe-id: CWE-200
  metadata:
    max-request: 1
    shodan-query: http.title:"MSPControl - Sign In"
    google-query: intitle:"MSPControl - Sign In"
  tags: panel,mspcontrol,discovery

http:
  - method: GET
    path:
      - "{{BaseURL}}/Default.aspx?pid=Login"

    headers:
      Cookie: UserCulture=en-US

    matchers-condition: and
    matchers:
      - type: word
        part: body
        words:
          - "MSPControl - Sign In"
          - "Sign In to Control Panel"
        condition: or

      - type: status
        status:
          - 200
