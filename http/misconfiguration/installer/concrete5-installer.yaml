id: concrete5-installer

info:
  name: Concrete5 安装面板暴露
  author: osamahamad,princechaddha
  severity: high
  description: |
    该模板用于核查 Concrete5 安装面板暴露。该类问题通常源于安装、初始化、升级或配置向导在部署完成后仍可从公网访问。模板会向目标发送探测请求，并依据请求 `/index.php/install`、`/concrete5/index.php/install`、匹配 `<title>Install concrete5</title>`、状态码 200 等证据确认目标是否存在该配置问题。
  impact: |
    - 攻击者可能完成初始化流程、创建管理员账户、覆盖配置或触发升级逻辑。
    - 在部分系统中，暴露安装入口还可能导致数据库连接信息泄露、站点被重新配置或业务被接管。
  remediation: |
    - 完成部署后立即删除、禁用或限制安装与升级入口。
    - 对初始化流程增加来源限制和一次性安装校验，避免公网直接访问。
    - 检查系统是否已被异常初始化或创建未知管理员账户，并轮换相关凭据。
  reference:
    - https://documentation.concretecms.org/developers/introduction/installing-concrete-cms
  classification:
    cpe: cpe:2.3:a:concrete5:concrete5:*:*:*:*:*:*:*:*
  metadata:
    verified: true
    max-request: 2
    vendor: concrete5
    product: concrete5
    shodan-query:
      - http.title:"Install concrete5"
      - cpe:"cpe:2.3:a:concrete5:concrete5"
      - http.title:"install concrete5"
      - http.title:"concrete5"
    fofa-query:
      - title="install concrete5"
      - title="concrete5"
    google-query:
      - intitle:"concrete5"
      - intitle:"install concrete5"
  tags: misconfig,install,exposure,concrete5,vuln

http:
  - method: GET
    path:
      - "{{BaseURL}}/index.php/install"
      - "{{BaseURL}}/concrete5/index.php/install"

    stop-at-first-match: true

    matchers-condition: and
    matchers:
      - type: word
        part: body
        words:
          - '<title>Install concrete5</title>'

      - type: status
        status:
          - 200

    extractors:
      - type: regex
        part: body
        group: 1
        regex:
          - 'Version ([0-9.]+)'
