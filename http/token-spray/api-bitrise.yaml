id: api-bitrise

info:
  name: Bitrise API Token 可用性校验（token喷洒）
  author: daffainfo
  severity: info
  description: 该模板通过调用 Bitrise API 的已知接口验证提供的 token 是否有效，命中后通常表示可访问构建、测试或交付流水线能力。
  reference:
    - https://api-docs.bitrise.io/
    - https://github.com/daffainfo/all-about-apikey/tree/main/bitrise
  metadata:
    max-request: 1
  tags: token-spray,bitrise

self-contained: true

http:
  - raw:
      - |
        GET https://api.bitrise.io/v0.1/me HTTP/1.1
        Host: api.bitrise.io
        Authorization: {{token}}

    matchers:
      - type: word
        part: body
        words:
          - '"username":'
          - '"slug":'
          - '"email":'
        condition: and
