id: khoj-detect

info:
  name: Khoj 指纹识别（指纹识别）
  author: s4e-io
  severity: info
  description: >-
    Khoj 是开源个人 AI 助手和知识检索系统，用于基于个人文档、笔记或外部数据进行问答与搜索。该模板通过请求目标服务并检查预设路径或首页响应、页面正文关键字、状态码等指纹特征，判断目标是否使用或暴露了
    Khoj 相关组件；命中结果仅表示指纹特征匹配，可用于资产盘点、技术栈识别和后续安全评估，不代表已确认存在可利用漏洞。
  reference:
  - https://github.com/khoj-ai/khoj
  metadata:
    verified: true
    max-request: 1
    fofa-query: icon_hash="-272853549"
  tags: tech,khoj,discovery
http:
  - method: GET
    path:
      - "{{BaseURL}}"

    host-redirects: true
    max-redirects: 2
    matchers-condition: and
    matchers:
      - type: word
        part: body
        words:
          - '<title>Khoj AI'
          - 'content="Khoj AI'
          - 'khoj.dev'
        condition: or

      - type: status
        status:
          - 200
