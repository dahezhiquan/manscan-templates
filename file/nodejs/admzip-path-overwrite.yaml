id: admzip-path-overwrite

info:
  name: adm-zip 路径覆盖风险（本地文件安全扫描）
  author: me_dheeraj (https://twitter.com/Dheerajmadhukar)
  severity: medium
  description: |
    Node.js 使用 adm-zip 解压不可信 ZIP 归档时，若直接采用归档条目路径创建文件，可能受到目录穿越和 Zip Slip 影响，将文件写入目标目录之外。该模板在任意扩展名文件中匹配 adm-zip 引入、遍历归档条目以及 createWriteStream、writeFile 或 writeFileSync 写入组合；命中表示存在需要人工确认的危险解压代码路径，不等于已确认可利用。
  impact: |
    - 攻击者可借助恶意归档覆盖应用配置、启动脚本或其他可写文件，造成代码执行、权限提升或持久化。
    - 覆盖关键文件还可能导致服务启动失败、数据损坏或安全配置被绕过。
  remediation: |
    - 升级到已修复的 adm-zip 版本（如项目公告提供修复版本则优先采用），并在解压前规范化路径，拒绝绝对路径和包含 .. 的条目。
    - 将解压目录限制在专用低权限目录，校验最终路径必须位于目标目录内，并避免覆盖现有文件。
    - 对归档来源、大小、条目数量和符号链接实施校验，解压服务使用最小权限运行。
  tags: file,nodejs,admzip
file:
  - extensions:
      - all
    matchers:
      - type: regex
        regex:
          - "require\\\\('adm-zip'\\\\)"
          - "\\.forEach\\(function .*\\(.*, \\.\\*\\) \\{"
          - "\\.createWriteStream\\(.*\\) \\}, \\.\\*\\)"
          - "\\.writeFile\\(.*\\)"
          - "\\.writeFileSync\\(.*\\) \\}, \\.\\*\\)"
        condition: or
