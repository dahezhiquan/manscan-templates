id: tftp-service-enabled

info:
  name: TFTP 服务应禁用（本地基线扫描）
  author: songyaeji
  severity: medium
  description: |
    TFTP 缺少认证和加密保护，适合受控网络中的简单文件分发，但不应在普通主机或生产环境中默认启用。模板检查 `/etc/xinetd.d/tftp` 是否存在且未设置 `disable = yes`，命中 `[VULNERABLE]` 表示 TFTP 服务未被禁用。
  impact: |
    - 未授权用户可能读取或写入 TFTP 目录中的文件，造成配置泄露或恶意文件投放。
    - 明文传输会暴露文件内容，并可能被用于网络设备配置窃取。
  remediation: |
    - 禁用 TFTP xinetd 服务，设置 `disable = yes` 并重载 xinetd，或卸载 TFTP 服务端。
    - 如必须使用，限制源地址、根目录和文件权限，并隔离在专用管理网络。
  reference:
    - https://isms.kisa.or.kr
  tags: linux,local,code,audit,compliance,kisas

self-contained: true

code:
  - engine:
      - sh
      - bash
    source: |
      file="/etc/xinetd.d/tftp"
      if [ -f "$file" ]; then
        if grep -q "disable[[:space:]]*=[[:space:]]*yes" "$file"; then
          echo "[SAFE] tftp is disabled."
        else
          echo "[VULNERABLE] tftp is not disabled in $file."
        fi
      else
        echo "[SAFE] tftp service config file not found. Assuming not installed."
      fi
    matchers:
      - type: word
        words:
          - "[VULNERABLE]"
