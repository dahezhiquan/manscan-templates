id: azure-appservice-entra-id-missing
info:
  name: Azure App Service 托管身份未配置（云安全）
  author: princechaddha
  severity: medium
  description: Azure App Service 未配置托管身份时，应用访问 Key Vault、存储和其他 Azure 资源通常需要长期密钥或服务主体凭据。该模板枚举 Web App，查询 identity principalId，并在命令结果为空时报告未配置托管身份。
  impact: |
    - 长期凭据可能被写入应用设置、代码或部署流水线，泄露后可被用于访问关联 Azure 资源。
    - 缺少工作负载身份会增加密钥分发、轮换和权限回收成本，导致权限范围难以持续审计。
  remediation: |
    - 为 App Service 启用系统分配或用户分配托管身份，并通过 Azure RBAC 授予访问依赖资源所需的最小权限。
    - 迁移应用凭据后轮换或撤销旧密钥，检查应用设置、流水线和日志中的残留敏感信息。
  reference:
    - https://docs.microsoft.com/en-us/azure/app-service/overview-managed-identity
  metadata:
    vendor: microsoft
    product: azure-app-service
  tags: cloud,devops,azure,microsoft,appservice,azure-cloud-config

flow: |
  code(1);
  for (let AppServiceData of iterate(template.appServiceList)) {
    AppServiceData = JSON.parse(AppServiceData);
    set("id", AppServiceData.id);
    code(2);
  }

self-contained: true
code:
  - engine:
      - sh
      - bash
    source: |
      az webapp list --output json --query '[*].{id:id}'

    extractors:
      - type: json
        name: appServiceList
        internal: true
        json:
          - '.[]'

  - engine:
      - sh
      - bash
    source: |
      az webapp identity show --ids "$ids" --query 'principalId' --output json

    matchers:
      - type: word
        part: all
        words:
          - ""

    extractors:
      - type: dsl
        dsl:
          - 'id + " does not have Microsoft Entra ID configured"'
