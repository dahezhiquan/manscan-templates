id: linux-world-writable-file

info:
  name: Linux 全局可写文件权限异常（本地基线扫描）
  author: songyaeji
  severity: high
  description: |
    全局可写文件允许任意本地用户修改内容，若出现在系统目录、脚本路径或服务读取位置，可能被用于篡改配置、植入恶意代码或破坏数据完整性。模板在文件系统中查找排除 `/tmp` 后仍具有 `other write` 权限的普通文件，返回结果表示存在异常全局可写文件。
  impact: |
    - 本地攻击者可篡改可写文件内容，造成持久化、配置污染或服务异常。
    - 若可写文件被高权限进程读取或执行，可能进一步形成提权链条。
  remediation: |
    - 逐项确认全局可写文件业务必要性，移除 `o+w` 权限或迁移到受控目录。
    - 对系统目录、脚本、配置和服务读取文件进行完整性检查，并清理异常属主。
  reference:
    - https://isms.kisa.or.kr
  tags: linux,local,audit,compliance,kisa

self-contained: true

code:
  - engine:
      - sh
      - bash
    source: |
      find / -type f -perm -0002 ! -path "/tmp/*" -exec ls -l {} \; 2>/dev/null

    matchers:
      - type: regex
        name: world-writable-files
        part: response
        regex:
          - "^-........w.*"
