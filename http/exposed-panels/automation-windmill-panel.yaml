id: automation-windmill-panel

info:
  name: Windmill 面板识别（指纹识别）
  author: ChrisJr404
  severity: info
  description: |-
    检测到目标站点存在 Windmill 相关响应特征。Windmill 是自动化或工作流编排平台，用于连接应用、执行流程、管理任务和调度业务自动化。模板请求 `/`、`/api/version` 路径，并通过页面标题或正文关键字、状态码、DSL 条件确认该系统指纹，用于资产识别、系统盘点和暴露面梳理。
  reference:
    - https://github.com/windmill-labs/windmill
    - https://windmill.dev/
  metadata:
    verified: true
    max-request: 2
    vendor: windmill_labs
    product: windmill
    shodan-query: http.title:"Windmill"
    fofa-query: title="Windmill"
  tags: panel,windmill,workflow,automation,detect,discovery,login
http:
  - method: GET
    path:
      - "{{BaseURL}}"
      - "{{BaseURL}}/api/version"

    host-redirects: true
    max-redirects: 2
    stop-at-first-match: true

    matchers:
      - type: dsl
        dsl:
          - 'status_code == 200 && contains(to_lower(body), "<title>windmill</title>")'
          - 'status_code == 200 && contains(to_lower(body), "windmill_labs")'
          - 'status_code == 200 && regex("^v[0-9]+\\.[0-9]+\\.[0-9]+", body)'
        condition: or

    extractors:
      - type: regex
        part: body
        group: 0
        regex:
          - 'v[0-9]+\.[0-9]+\.[0-9]+'
