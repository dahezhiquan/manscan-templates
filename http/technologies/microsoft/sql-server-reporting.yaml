id: sql-server-reporting

info:
  name: Microsoft SQL Server Reporting Services 指纹识别（指纹识别）
  author: puzzlepeaches
  severity: info
  description: >-
    Microsoft SQL Server Reporting Services 是 Microsoft 报表服务平台，用于生成、发布和管理企业报表。该模板通过请求目标服务并检查预设路径或首页响应、页面正文关键字等指纹特征，判断目标是否使用或暴露了
    Microsoft SQL Server Reporting Services 相关组件；命中结果仅表示指纹特征匹配，可用于资产盘点、技术栈识别和后续安全评估，不代表已确认存在可利用漏洞。
  metadata:
    max-request: 1
  tags: tech,microsoft,discovery
http:
  - method: GET
    path:
      - "{{BaseURL}}/Reports/Pages/Folder.aspx"

    matchers:
      - type: word
        words:
          - "Report Manager"
