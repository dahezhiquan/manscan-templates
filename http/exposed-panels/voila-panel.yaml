id: voila-panel

info:
  name: Voilà 面板识别（指纹识别）
  author: rxerium
  severity: info
  description: |
    该模板通过识别 Voilà 仪表盘或后台界面的页面特征，判断目标是否对外暴露了相关控制台。若命中，说明该服务面向外部可访问，可用于资产识别与访问控制核查。
  reference:
    - https://github.com/voila-dashboards/voila
    - https://voila.readthedocs.io
  metadata:
    verified: true
    max-request: 1
    vendor: Voilà
    product: Voilà
    shodan-query: 'html:"/voila/"'
  tags: panel,voila,jupyter,notebook,ai,detect,discovery

http:
  - method: GET
    path:
      - "{{BaseURL}}"

    host-redirects: true
    max-redirects: 2

    matchers-condition: and
    matchers:
      - type: word
        part: body
        words:
          - "voila-notebooks"

      - type: regex
        part: body
        regex:
          - '(?i)<title>[^<]*Voil[^<]*</title>'

      - type: status
        status:
          - 200
