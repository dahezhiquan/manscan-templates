id: azure-postgresql-geo-backup-disabled
info:
  name: Azure PostgreSQL 异地冗余备份未启用（云安全）
  author: princechaddha
  severity: high
  description: Azure PostgreSQL 的异地冗余备份会将备份复制到主区域之外的配对区域，为区域级故障和灾难恢复提供额外数据副本，关闭后仅依赖本区域备份。本模板枚举 PostgreSQL 服务器并查询 storageProfile.geoRedundantBackup，在返回值为 Disabled 时报告。
  impact: |
    - 主区域发生故障、区域级网络中断或灾害时，可能无法在其他区域及时恢复数据库。
    - 备份副本集中在单一区域会增加恢复时间目标和恢复点目标无法满足的概率，并可能造成数据丢失。
  remediation: |
    - 根据数据重要性和合规要求启用 geoRedundantBackup，并确认目标区域和费用符合业务需求。
    - 定期执行跨区域恢复演练，验证备份可用性、恢复权限、恢复时间和应用重新连接流程。
  reference:
    - https://docs.microsoft.com/en-us/azure/postgresql/concepts-backup
  metadata:
    vendor: microsoft
    product: azure-postgresql
  tags: cloud,devops,azure,microsoft,postgresql,azure-cloud-config

flow: |
  code(1);
  for (let ServerData of iterate(template.serverList)) {
    ServerData = JSON.parse(ServerData);
    set("name", ServerData.name);
    set("resourceGroup", ServerData.resourceGroup);
    code(2);
  }

self-contained: true
code:
  - engine:
      - sh
      - bash
    source: |
      az postgres server list --output json --query '[*].{"name":name, "resourceGroup":resourceGroup}'

    extractors:
      - type: json
        name: serverList
        internal: true
        json:
          - '.[]'

  - engine:
      - sh
      - bash
    source: |
      az postgres server show --name "$name" --resource-group "$resourceGroup" --query 'storageProfile.geoRedundantBackup'

    matchers:
      - type: word
        words:
          - '"Disabled"'

    extractors:
      - type: dsl
        dsl:
          - 'name + " in " + resourceGroup + " does not have geo-redundant backups enabled"'
