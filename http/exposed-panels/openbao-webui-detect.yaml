id: openbao-webui-detect

info:
  name: OpenBao Web UI 面板识别（指纹识别）
  author: ritikchaddha
  severity: info
  description: |-
    检测到目标站点存在 OpenBao Web UI 相关响应特征。OpenBao 是密钥和敏感配置管理平台，用于管理 Secret、加密、访问策略和身份认证。模板请求 `/ui`，并通过页面标题或正文关键字、状态码确认该系统指纹，用于资产识别、系统盘点和暴露面梳理。
  reference:
    - https://github.com/openbao/openbao
  metadata:
    verified: true
    max-request: 1
    shodan-query: http.title:"OpenBao"
    fofa-query: title="OpenBao"
  tags: panel,openbao,detect,ui
http:
  - method: GET
    path:
      - "{{BaseURL}}/ui"

    host-redirects: true
    max-redirects: 2

    matchers-condition: and
    matchers:
      - type: word
        part: body
        words:
          - "<title>OpenBao"
          - "Welcome to OpenBao"
        condition: or

      - type: status
        status:
          - 200
