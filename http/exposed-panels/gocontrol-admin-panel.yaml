id: gocontrol-event-admin-panel

info:
  name: Go.Control Event Administration 面板识别（暴露面识别）
  author: Mys7ic
  severity: info
  description: |
    该模板通过识别 Go.Control Event Administration 登录入口的页面标题、特征文本或重定向行为，判断目标是否暴露了对应的认证界面。若命中，说明该登录面板对外可访问，可用于暴露面梳理与后续安全评估。
  reference:
    - https://www.go-control.de/
  classification:
    cvss-metrics: CVSS:3.0/AV:N/AC:L/PR:N/UI:N/S:U/C:N/I:N/A:N
    cwe-id: CWE-200
  metadata:
    verified: true
    max-request: 1
    vendor: go-control
    product: gocontrol
    fofa-query: title="Go.Control"
    zoomeye-query: title="Go.Control"
  tags: panel,gocontrol,login,detect,discovery

http:
  - method: GET
    path:
      - "{{BaseURL}}/admin/"
      - "{{BaseURL}}/admin/index.php"

    stop-at-first-match: true
    host-redirects: true
    max-redirects: 2

    matchers-condition: and
    matchers:
      - type: word
        part: body
        words:
          - '<title>Event Administration | Superuser Login'

      - type: status
        status:
          - 200
