id: checkmk-default-login

info:
  name: Checkmk 默认口令登录（弱口令）
  author: 0xBassia
  severity: high
  description: |
    该模板用于检测 Checkmk 是否仍可使用默认凭据或弱口令登录。模板主要向 `{变量}` 等认证入口发送请求，使用内置默认凭据组合进行认证尝试，并根据响应中的 `status_code == 302`、`contains_all(to_lower(header), "set-cookie", "auth_", "index.py")` 等登录成功特征判断登录是否成功；命中说明目标未及时修改出厂、示例或初始化账号口令。
  impact: |
    - 攻击者可进入 Checkmk 管理界面，查看或修改用户、权限、认证策略、流程或资产配置。
    - 身份、流程或资产管理系统被弱口令接管后，可能造成越权访问、策略绕过、敏感资产信息泄露和更大范围的权限扩散。
  remediation: |
    - 立即修改默认管理员口令，禁用初始化账号，并为高权限账户启用多因素认证。
    - 限制管理入口来源，按最小权限拆分管理员角色，并开启认证、授权和配置变更审计。
    - 复核用户、角色、认证策略、访问令牌和近期登录记录，必要时强制重置相关账号凭据。
  reference:
    - https://docs.checkmk.com/latest/en/intro_setup.html
    - https://docs.checkmk.com/latest/en/wato_user.html
  classification:
    cvss-metrics: CVSS:3.1/AV:N/AC:L/PR:N/UI:N/S:U/C:H/I:H/A:N
    cvss-score: 9.1
    cwe-id: CWE-798
  metadata:
    verified: true
    max-request: 2
    shodan-query: http.title:"Check_MK"
  tags: default-login,checkmk,monitoring

flow: http(1) && http(2)

http:
  - method: GET
    path:
      - "{{BaseURL}}"

    redirects: true
    max-redirects: 5

    extractors:
      - type: regex
        part: header
        group: 1
        name: endpoint
        regex:
          - 'Location:\s(.*)\?'
        internal: true

  - raw:
      - |
        POST {{endpoint}} HTTP/1.1
        Host: {{Hostname}}
        Content-Type: multipart/form-data; boundary=----WebKitFormBoundary0FYqMzKWywSgTEcE

        ------WebKitFormBoundary0FYqMzKWywSgTEcE
        Content-Disposition: form-data; name="filled_in"

        login
        ------WebKitFormBoundary0FYqMzKWywSgTEcE
        Content-Disposition: form-data; name="_login"

        1
        ------WebKitFormBoundary0FYqMzKWywSgTEcE
        Content-Disposition: form-data; name="_origtarget"

        index.py
        ------WebKitFormBoundary0FYqMzKWywSgTEcE
        Content-Disposition: form-data; name="_username"

        cmkadmin
        ------WebKitFormBoundary0FYqMzKWywSgTEcE
        Content-Disposition: form-data; name="_password"

        cmkadmin
        ------WebKitFormBoundary0FYqMzKWywSgTEcE
        Content-Disposition: form-data; name="_login"

        Login
        ------WebKitFormBoundary0FYqMzKWywSgTEcE--

    matchers:
      - type: dsl
        dsl:
          - 'status_code == 302'
          - 'contains_all(to_lower(header), "set-cookie", "auth_", "index.py")'
        condition: and
