id: apache-zeppelin-detect

info:
  name: Apache Zeppelin 指纹识别（指纹识别）
  author: pikpikcu
  severity: info
  description: Apache Zeppelin 是交互式数据分析笔记本，用于 Spark、SQL、Python 等多引擎数据分析。该模板请求首页，并依据 HTTP 200 状态码、页面标题、正文关键字或品牌资源特征识别目标是否使用或暴露了 Apache Zeppelin 相关组件，适用于资产盘点、技术栈识别和后续安全评估；命中结果仅表示指纹特征匹配，不代表已确认存在可利用漏洞。
  classification:
    cpe: cpe:2.3:a:apache:zeppelin:*:*:*:*:*:*:*:*
  metadata:
    max-request: 1
    vendor: apache
    product: zeppelin
    fofa-query: app="APACHE-Zeppelin"
  tags: apache,zeppelin,tech,discovery

http:
  - method: GET
    path:
      - "{{BaseURL}}"

    matchers-condition: and
    matchers:
      - type: word
        part: body
        words:
          - '<title ng-bind="$root.pageTitle">Zeppelin</title>'

      - type: status
        status:
          - 200
