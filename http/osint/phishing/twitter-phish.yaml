id: twitter-phish

info:
  name: Twitter/X 仿冒钓鱼网站（钓鱼网站识别）
  author: rxerium
  severity: info
  description: |
    检测到疑似仿冒 Twitter/X 的钓鱼网站。模板在目标页面返回 200、页面内容命中 Twitter/X 的登录或账号页面特征，且当前主机不属于 twitter.com、x.com 官方域名时触发，用于识别借用 Twitter/X 品牌页面诱导用户信任的仿冒站点。
  reference:
    - https://twitter.com
    - https://x.com
  metadata:
    max-request: 1
  tags: phishing,twitter,x,osint,discovery
http:
  - method: GET
    path:
      - "{{BaseURL}}"

    host-redirects: true
    max-redirects: 2

    matchers-condition: and
    matchers:
      - type: word
        words:
          - 'Sign in to X'
          - 'Happening now'
          - 'Join today'
        condition: or

      - type: status
        status:
          - 200

      - type: dsl
        dsl:
          - '!contains(host,"twitter.com")'
          - '!contains(host,"x.com")'
