id: apache-tika-detect

info:
  name: Apache Tika 指纹识别（指纹识别）
  author: icarot
  severity: info
  description: |
    用于识别目标是否部署 Apache Tika 并提取相关版本或构建信息，模板会结合页面标题、状态码、特定路径或已知端点和版本或标识提取结果进行指纹匹配。
  reference:
    - https://github.com/apache/tika/
  classification:
    cpe: cpe:2.3:a:apache:tika:*:*:*:*:*:*:*:*
  metadata:
    max-request: 3
    shodan-query: title:"Welcome to the Apache Tika"
    vendor: apache
    product: tika
  tags: tech,tika,apache,detect

http:
  - method: GET
    path:
      - "{{BaseURL}}/"
      - "{{BaseURL}}/tika"
      - "{{BaseURL}}/version"

    stop-at-first-match: true

    matchers-condition: and
    matchers:
      - type: word
        words:
          - 'Apache Tika'
          - 'apache.tika'
        condition: and

      - type: status
        status:
          - 200

    extractors:
      - type: regex
        part: response
        regex:
          - "Apache Tika [0-9]{1,3}\\.[0-9]{1,3}\\.[0-9]{1,3}"
