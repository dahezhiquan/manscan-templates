id: gcloud-vm-disk-autodelete-enabled

info:
  name: Auto-Delete 未Disabled 的VM Instance Persistent Disks（云安全）
  author: princechaddha
  severity: medium
  description: VM 持久磁盘启用 autoDelete 后，实例删除时磁盘会随之删除；对需要保留数据的工作负载可能造成数据丢失。本模板枚举虚拟机并检查 disks[].autoDelete，发现 true 时报告存在随实例自动删除的持久磁盘。
  impact: |
    - 误删实例或自动化清理可能连带删除磁盘，导致业务数据、日志或取证证据丢失。
    - 未按数据重要性区分启动盘和数据盘会增加恢复成本，并可能影响备份合规要求。
  remediation: |
    - 对需要保留的数据盘关闭 autoDelete，并通过快照、备份和生命周期策略管理数据。
    - 对可重建的临时盘保留 autoDelete 时记录例外，确保实例删除流程不会影响持久业务数据。
  reference:
    - https://www.trendmicro.com/cloudoneconformity/knowledge-base/gcp/ComputeEngine/disable-auto-delete.html
    - https://cloud.google.com/compute/docs/disks/add-persistent-disk
  metadata:
    vendor: google
    product: compute-engine
  tags: cloud,devops,gcp,gcloud,compute,security,storage,disk,gcp-cloud-config

flow: |
  code(1)
  for(let projectId of iterate(template.projectIds)){
    set("projectId", projectId)
    code(2)
    for(let instance of iterate(template.instances)){
      instance = JSON.parse(instance)
      set("instanceName", instance.name)
      set("zone", instance.zone)
      code(3)
    }
  }

self-contained: true

code:
  - engine:
      - sh
      - bash
    source: |
      gcloud projects list --format="json(projectId)"

    extractors:
      - type: json
        name: projectIds
        internal: true
        json:
          - '.[].projectId'

  - engine:
      - sh
      - bash
    source: |
      gcloud compute instances list --project $projectId --format="json(name,zone.basename())"

    extractors:
      - type: json
        name: instances
        internal: true
        json:
          - '.[]'

  - engine:
      - sh
      - bash
    source: |
      gcloud compute instances describe $instanceName --zone $zone --project $projectId --format="json(disks[].autoDelete)"

    matchers:
      - type: word
        words:
          - '"autoDelete": true'

    extractors:
      - type: dsl
        dsl:
          - '"VM instance " + instanceName + " in zone " + zone + " of project " + projectId + " has one or more disks with auto-delete enabled"'
