id: mailpit-app-info-disclosure

info:
  name: Mailpit App 信息泄露
  author: DhiyaneshDK
  severity: medium
  description: |
    该模板用于核查 Mailpit App 信息泄露。该类问题通常源于配置文件、备份文件、管理页面、服务状态或敏感资源被错误暴露到 Web 访问路径。模板会向目标发送探测请求，并依据请求 `/api/v1/messages`、匹配 `"messages":`、匹配 `"ID":`、匹配 `application/json`等证据确认目标是否存在该配置问题。
  impact: |
    - 攻击者可获取版本、路径、账号、密钥、令牌、配置或业务数据等敏感信息。
    - 泄露的信息可能被用于凭据攻击、漏洞匹配、权限提升或横向移动。
  remediation: |
    - 移除 Web 根目录下不应公开的配置、备份、日志和临时文件。
    - 为敏感页面和资源增加访问控制，并按最小暴露原则收敛公开路径。
    - 轮换已暴露的密钥、令牌和凭据，并审计异常下载或枚举行为。
  reference:
    - https://github.com/axllent/mailpit
    - https://mailpit.axllent.org/docs/api/
  metadata:
    verified: true
    max-request: 1
    shodan-query: title:"Mailpit"
  tags: mailpit,exposure,disclosure,misconfig,vuln

http:
  - method: GET
    path:
      - "{{BaseURL}}/api/v1/messages"

    matchers-condition: and
    matchers:
      - type: word
        part: body
        words:
          - '"messages":'
          - '"ID":'
        condition: and

      - type: word
        part: content_type
        words:
          - 'application/json'

      - type: status
        status:
          - 200
