id: api-gorest

info:
  name: Gorest API Token 可用性校验（token喷洒）
  author: daffainfo
  severity: info
  description: 该模板通过调用 Gorest API 的已知接口验证提供的 token 是否有效，命中后通常表示可访问相关 API 能力。
  reference:
    - https://gorest.co.in/
    - https://github.com/daffainfo/all-about-apikey/tree/main/gorest
  metadata:
    max-request: 1
  tags: token-spray,gorest

self-contained: true

http:
  - raw:
      - |
        GET https://gorest.co.in/public/v2/users HTTP/1.1
        Host: gorest.co.in
        Content-Type: application/json
        Authorization: Bearer {{token}}

        {"name":"Tenali Ramakrishna", "gender":"male", "email":"tenali.rdamakrishna@15ce.com", "status":"active"}

    matchers-condition: and
    matchers:
      - type: status
        status:
          - 201

      - type: word
        part: body
        words:
          - '"name"'
