id: deep-sea-electronics-dse855-detect

info:
  name: Deep Sea Electronics DSE 855 Generator Controller 识别（指纹识别）
  author: rxerium
  severity: info
  description: |-
    检测到目标站点存在 Deep Sea Electronics DSE 855 Generator Controller 相关响应特征。Deep Sea Electronics DSE 855 Generator Controller 是与 C2、远控、窃密或钓鱼基础设施相关的 Web 管理入口，通常用于会话管理、任务下发、受害主机或钓鱼流程的集中控制。模板请求 `/`，并通过页面标题或正文关键字、状态码确认该基础设施指纹；命中结果主要用于威胁狩猎、恶意基础设施识别和外部暴露面梳理。
  reference:
    - https://www.deepseaelectronics.com/products/auto-mains-failure-modules/855.html
  metadata:
    max-request: 1
    verified: true
    shodan-query: http.title:"DSE 855"
    vendor: deep-sea-electronics
    product: dse855
  tags: tech,panel,dse,ics,generator,energy,scada,detect
http:
  - method: GET
    path:
      - "{{BaseURL}}"

    host-redirects: true
    max-redirects: 2

    matchers-condition: and
    matchers:
      - type: word
        part: body
        words:
          - '<title>DSE 855</title>'
          - 'tab-view.css'
          - 'gui.css'
        condition: or

      - type: status
        status:
          - 200
