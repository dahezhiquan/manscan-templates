id: panasonic-network-management

info:
  name: Panasonic 网络摄像机管理系统暴露（IOT）
  author: dhiyaneshDk
  severity: medium
  description: |
    检测到 Panasonic Network Camera Management System 页面及实时画面入口。该页面暴露可能导致摄像头管理界面或视频视图被未授权访问。
  impact: |
    - 攻击者无需认证即可访问设备页面或功能，可能读取状态、配置和网络信息。
    - 若接口允许写操作，可能进一步导致设备配置被篡改或服务被滥用。
  remediation: |
    - 启用设备 Web 管理认证并修改默认口令，关闭匿名访问。
    - 升级固件并检查是否存在已知未授权访问漏洞。
    - 将管理页面限制在内网、管理 VLAN 或 VPN 内，并开启访问审计。
  reference:
    - https://www.exploit-db.com/ghdb/6487
  classification:
    cvss-metrics: CVSS:3.1/AV:N/AC:L/PR:N/UI:N/S:U/C:L/I:N/A:N
    cvss-score: 5.3
    cwe-id: CWE-200
  metadata:
    max-request: 1
  tags: iot,camera,panasonic,edb,discovery

http:
  - method: GET
    path:
      - "{{BaseURL}}/config/cam_portal.cgi"

    matchers-condition: and
    matchers:
      - type: word
        words:
          - '<TITLE>Panasonic Network Camera Management System</TITLE>'
        part: body

      - type: status
        status:
          - 200
