id: vtun-server

info:
  name: VTUN 服务识别（指纹识别）
  author: pussycat0x
  severity: info
  description: |
    VTUN 是用于在 TCP/IP 网络上创建虚拟隧道的软件，支持流量整形、压缩和加密等能力。该模板连接 5001/TCP 并发送换行探测，通过 `VTUN server` Banner 及版本提取结果识别目标是否运行 VTUN 服务。
  impact: |
    - VTUN 服务对外暴露会泄露隧道入口和版本信息，攻击者可据此评估认证、加密和历史漏洞风险。
    - 若隧道配置或凭据保护不当，可能影响内部网络边界隔离和远程接入安全。
  remediation: |
    - 确认 VTUN 是否仍为业务必需；如无必要，关闭服务或限制监听地址。
    - 仅允许可信来源访问 5001/TCP，并检查隧道认证、加密和服务版本配置。
    - 审计隧道连接日志，排查异常远程接入和弱凭据风险。
  reference:
    - https://vtun.sourceforge.net/
    - https://linux.die.net/man/8/vtund
  metadata:
    verified: true
    max-request: 1
    shodan-query: product:"Vtun Virtual Tunnel"
    fofa-query: server=="VTUN server"
  tags: network,vtun,detect,tcp,service,discovery

tcp:
  - inputs:
      - data: "\n"

    host:
      - "{{Hostname}}"
    port: 5001

    matchers:
      - type: word
        words:
          - "VTUN server"

    extractors:
      - type: regex
        regex:
          - '(VTUN server ver\s+[0-9A-Za-z.]+(?:\s+[0-9]{2}/[0-9]{2}/[0-9]{4})?)'
