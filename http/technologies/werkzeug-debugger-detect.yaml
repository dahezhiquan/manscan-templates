id: werkzeug-debugger-detect

info:
  name: Werkzeug Debugger Console 指纹识别（指纹识别）
  author: pdteam
  severity: info
  description: >-
    Werkzeug Debugger Console 是 Python Werkzeug/Flask 调试控制台，用于开发环境中查看异常、堆栈和交互式调试信息。该模板通过请求目标服务并检查预设路径或首页响应、页面正文关键字等指纹特征，判断目标是否使用或暴露了
    Werkzeug Debugger Console 相关组件；命中结果仅表示指纹特征匹配，可用于资产盘点、技术栈识别和后续安全评估，不代表已确认存在可利用漏洞。
  metadata:
    max-request: 1
  tags: tech,werkzeug,discovery
http:
  - method: GET
    path:
      - "{{BaseURL}}/console"

    matchers:
      - type: word
        words:
          - "<h1>Interactive Console</h1>"
        part: body
