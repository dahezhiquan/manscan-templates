id: go-pprof-debug

info:
  name: Go pprof Debug 页面 泄露（暴露面识别）
  author: w8ay
  severity: low
  description: 检测到可直接访问的 Go pprof Debug 页面。日志、异常页面或调试输出通常会泄露堆栈信息、内部路径、查询语句、账号标识、令牌片段或业务数据，不应向未授权用户开放。
  metadata:
    max-request: 2
  tags: logs,exposure,go,pprof,vuln

http:
  - method: GET
    path:
      - "{{BaseURL}}/debug/pprof/heap?debug=1"
      - "{{BaseURL}}/pprof/heap?debug=1"

    stop-at-first-match: true
    matchers-condition: and
    matchers:
      - type: word
        words:
          - 'heap profile:'
          - 'Alloc'
        condition: and

      - type: word
        words:
          - "text/plain"
        part: header

      - type: status
        status:
          - 200
