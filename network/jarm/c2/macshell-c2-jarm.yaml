id: macshell-c2-jarm

info:
  name: MacShell C2 JARM 识别（C2 识别）
  author: pussycat0x
  severity: high
  description: |
    MacShell 是面向 macOS 的远程 shell/C2 工具，常用于 macOS 目标的命令执行与任务控制。该模板计算目标 TLS 服务的 JARM 指纹，并与已知 MacShell 指纹匹配，用于发现疑似 MacShell 控制基础设施。
  reference:
    - https://github.com/cedowens/C2-JARM
    - https://github.com/cedowens/MacShellSwift
  metadata:
    max-request: 1
  tags: jarm,network,c2,ir,osint,cti,macshell,tcp,vuln
tcp:
  - inputs:
      - data: 2E
        type: hex
    host:
      - "{{Hostname}}"
    matchers:
      - type: dsl
        dsl:
          - "jarm(Hostname) == '2ad000000000000000000000000000eeebf944d0b023a00f510f06a29b4f46'"
