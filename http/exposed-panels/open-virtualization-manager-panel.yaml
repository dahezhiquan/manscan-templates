id: open-virtualization-manager-panel

info:
  name: Open Virtualization Userportal & Webadmin 面板识别（暴露面识别）
  author: idealphase
  severity: info
  description: 该模板通过识别 Open Virtualization Userportal & Webadmin 面板、控制台或管理界面的页面特征，判断目标是否暴露了对应服务入口。若命中，说明该后台或运维界面对外可访问，可用于资产识别与暴露面排查。
  reference:
    - https://www.ovirt.org/
    - https://www.ovirt.org/dropped/admin-guide/virt/console-client-resources.html
  classification:
    cvss-metrics: CVSS:3.0/AV:N/AC:L/PR:N/UI:N/S:U/C:N/I:N/A:N
    cwe-id: CWE-668
  metadata:
    max-request: 2
    shodan-query: title:"Ovirt-Engine"
    google-query: intitle:"Ovirt-Engine"
  tags: panel,ovirt,oss,discovery

http:
  - method: GET
    path:
      - '{{BaseURL}}/ovirt-engine/userportal/'
      - '{{BaseURL}}/ovirt-engine/webadmin/'

    matchers-condition: and
    matchers:
      - type: word
        words:
          - '"application_title":"oVirt Engine User Portal"'
          - '"application_title":"oVirt Engine Web Administration"'
        condition: or

      - type: status
        status:
          - 200

    extractors:
      - type: regex
        group: 1
        regex:
          - '"application_title":"(([a-zA-Z]+\s)*[a-zA-Z]+)"'
