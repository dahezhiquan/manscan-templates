id: azure-disk-encryption-unattached-volumes
info:
  name: Azure Disk 加密 未Enabled 的Unattached Disk Volumes（云安全）
  author: princechaddha
  severity: medium
  description: 未挂载的 Azure Managed Disk 仍可能保留历史业务数据、凭据和备份内容；其 encryptionSettingsCollection 为 null 时，模板无法确认旧版磁盘加密配置。本模板枚举 diskState 为 Unattached 的磁盘，查询 encryptionSettingsCollection，并在返回 null 时报告未发现该加密配置。
  impact: |
    - 获得磁盘读取、快照或导出权限的攻击者可能离线读取残留数据，造成敏感信息泄露。
    - 长期闲置磁盘还会扩大未盘点资产和数据保留范围，增加误共享、误删除及合规处置风险。
  remediation: |
    - 先确认磁盘是否仍需保留；不需要时按数据保留要求安全删除，并同步清理相关快照和备份。
    - 需要保留时启用适用的服务器端加密或客户管理密钥，限制磁盘和快照权限并建立闲置磁盘定期复核。
  reference:
    - https://docs.microsoft.com/en-us/azure/virtual-machines/disks-enable-host-based-encryption-cli
  metadata:
    vendor: microsoft
    product: azure-virtual-machines
  tags: cloud,devops,azure,microsoft,disk-encryption,azure-cloud-config

flow: |
  code(1);
  for (let DiskData of iterate(template.diskList)) {
    set("ids", DiskData);
    code(2);
  }

self-contained: true
code:
  - engine:
      - sh
      - bash
    source: |
      az disk list --query '[?diskState == `Unattached`].{"id":id}'

    extractors:
      - type: json
        name: diskList
        internal: true
        json:
          - '.[]'

  - engine:
      - sh
      - bash
    source: |
      az disk show --ids "$ids" --query '{encryptionSettingsCollection: encryptionSettingsCollection}'

    matchers:
      - type: word
        words:
          - '"encryptionSettingsCollection": null'

    extractors:
      - type: dsl
        dsl:
          - 'ids + " disk volume is not encrypted"'
