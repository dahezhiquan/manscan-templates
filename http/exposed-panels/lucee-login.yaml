id: lucee-login

info:
  name: Lucee Web and Lucee Server Admin 登录面板识别（暴露面识别）
  author: dhiyaneshDK,unp4ck
  severity: info
  description: 该模板通过识别 Lucee Web and Lucee Server Admin 登录入口的页面标题、特征文本或重定向行为，判断目标是否暴露了对应的认证界面。若命中，说明该登录面板对外可访问，可用于暴露面梳理与后续安全评估。
  classification:
    cvss-metrics: CVSS:3.0/AV:N/AC:L/PR:N/UI:N/S:U/C:N/I:N/A:N
    cwe-id: CWE-200
  metadata:
    max-request: 2
    shodan-query: http.title:"Lucee"
  tags: panel,lucee,discovery

http:
  - method: GET
    path:
      - '{{BaseURL}}/lucee/admin/web.cfm'
      - '{{BaseURL}}/lucee/admin/server.cfm'

    matchers-condition: and
    matchers:
      - type: word
        words:
          - '<title>Login - Lucee Web Administrator</title>'
          - '<title>Login - Lucee Server Administrator</title>'
          - "lucee-admin-search-input"
          - "lucee-docs-search-input"
          - "server-lucee-small.png.cfm"
        condition: or

      - type: status
        status:
          - 200
