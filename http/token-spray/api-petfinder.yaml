id: api-petfinder

info:
  name: Petfinder API Token 可用性校验（token喷洒）
  author: daffainfo
  severity: info
  description: 该模板通过调用 Petfinder API 的已知接口验证提供的 token 是否有效，命中后通常表示可访问相关 API 能力。
  reference:
    - https://www.petfinder.com/developers/v2/docs/
    - https://github.com/daffainfo/all-about-apikey/tree/main/petfinder
  metadata:
    max-request: 1
  tags: token-spray,petfinder

self-contained: true

http:
  - raw:
      - |
        POST https://api.petfinder.com/v2/oauth2/token HTTP/1.1
        Host: api.petfinder.com
        Content-Type: application/x-www-form-urlencoded
        Content-Length: 81

        grant_type=client_credentials&client_id={{id}}&client_secret={{secret}}

    matchers:
      - type: word
        part: body
        words:
          - '"token_type"'
          - '"expires_in"'
          - '"access_token"'
        condition: and
