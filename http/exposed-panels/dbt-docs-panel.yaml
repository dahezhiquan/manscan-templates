id: dbt-docs-panel

info:
  name: dbt Docs 面板识别（暴露面识别）
  author: johnk3r
  severity: info
  description: 该模板通过识别 dbt Docs 面板、控制台或管理界面的页面特征，判断目标是否暴露了对应服务入口。若命中，说明该后台或运维界面对外可访问，可用于资产识别与暴露面排查。
  metadata:
    max-request: 1
    shodan-query: http.title:"dbt Docs"
  tags: panel,dbt,discovery

http:
  - method: GET
    path:
      - "{{BaseURL}}"

    matchers-condition: and
    matchers:
      - type: word
        part: body
        words:
          - "<title>dbt Docs</title>"

      - type: status
        status:
          - 200
