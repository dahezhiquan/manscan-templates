id: zap-rest-api-detect

info:
  name: OWASP ZAP REST API 指纹识别（指纹识别）
  author: hahwul
  severity: info
  description: >-
    OWASP ZAP REST API 是 ZAP 安全测试工具的接口服务，用于自动化扫描、代理控制和安全测试集成。该模板通过请求目标服务并检查预设路径或首页响应、页面正文关键字等指纹特征，判断目标是否使用或暴露了
    OWASP ZAP REST API 相关组件；命中结果仅表示指纹特征匹配，可用于资产盘点、技术栈识别和后续安全评估，不代表已确认存在可利用漏洞。
  reference:
  - https://www.zaproxy.org/docs/api/
  metadata:
    max-request: 1
  tags: zap,tech,discovery
http:
  - method: GET
    path:
      - "{{BaseURL}}"

    matchers:
      - type: word
        part: response
        words:
          - '<title>ZAP API UI</title>'
          - 'Welcome to the OWASP Zed Attack Proxy (ZAP)'
          - 'Access-Control-Allow-Headers: ZAP-Header'
        condition: or
