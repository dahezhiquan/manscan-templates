id: azure-sql-tde-not-enabled
info:
  name: Azure SQL 透明数据加密未启用（云安全）
  author: princechaddha
  severity: medium
  description: Azure SQL 透明数据加密用于保护数据库文件、备份和静态数据，TDE 被禁用时，底层存储或备份副本缺少数据库级加密保护。本模板枚举 SQL 服务器及其数据库，执行 az sql db tde show，并在 status 返回 Disabled 时报告。
  impact: |
    - 存储介质、备份副本或快照被非预期访问时，攻击者可能直接获得可离线分析的数据库文件。
    - 数据泄露影响可能扩展到业务记录、凭据和个人信息，并导致静态数据加密合规要求不满足。
  remediation: |
    - 为受保护的 SQL 数据库启用 TDE，并根据治理要求选择服务托管密钥或客户管理密钥。
    - 启用后验证数据库、备份和恢复流程的加密状态，并限制对密钥和数据库管理面的访问权限。
  reference:
    - https://docs.microsoft.com/en-us/azure/azure-sql/database/transparent-data-encryption-tde-overview
  metadata:
    vendor: microsoft
    product: azure-sql-database
  tags: cloud,devops,azure,microsoft,sql-database,azure-cloud-config

flow: |
  code(1);
  for (let serverId of iterate(template.serverIds)) {
    set("serverId", serverId);
    code(2);
    for (let databaseId of iterate(template.databaseIds)) {
      set("databaseId", databaseId);
      code(3);
    }
  }

self-contained: true
code:
  - engine:
      - sh
      - bash
    source: |
      az sql server list --query '[*].id'

    extractors:
      - type: json
        name: serverIds
        internal: true
        json:
          - '.[]'

  - engine:
      - sh
      - bash
    source: |
      az sql db list --ids "$serverId" --query '[*].id'

    extractors:
      - type: json
        name: databaseIds
        internal: true
        json:
          - '.[]'

  - engine:
      - sh
      - bash
    source: |
      az sql db tde show --ids "$databaseId" --query 'status'

    matchers:
      - type: word
        words:
          - 'Disabled'

    extractors:
      - type: dsl
        dsl:
          - 'serverId + " database " + databaseId + " has TDE disabled"'
