id: intercom-identity-misconfiguration

info:
  name: Intercom Identity Verification 配置不当
  author: domwhewell-sage
  severity: medium
  description: |
    该模板用于核查 Intercom Identity Verification 配置不当。该类问题通常源于管理端、API、控制台或服务接口缺少认证授权，导致未登录用户可直接访问敏感功能。模板会向目标发送探测请求，并依据匹配 `app_id:`、匹配 `widget.intercom.io/widget`、匹配 `app_id:\s*"([a-zA-Z0-9\-]+)"`等证据确认目标是否存在该配置问题。
  impact: |
    - 攻击者可在未授权状态下查看系统状态、业务数据、任务信息或管理接口。
    - 若接口支持写操作，可能进一步导致配置篡改、服务接管、数据删除或横向移动。
  remediation: |
    - 为相关管理端和 API 启用认证授权，并按最小权限限制可访问功能。
    - 将管理接口限制在内网、VPN 或可信来源范围内，并开启访问审计。
    - 检查历史访问日志，确认是否存在未授权访问、批量枚举或异常操作。
  reference:
    - https://medium.com/@hellother18/uncovering-a-vulnerability-in-intercom-widget-chat-configuration-e5633d06df60
    - https://www.intercom.com/help/en/articles/183-set-up-identity-verification-for-web-and-mobile
  tags: intercom,unauth,exposure,misconfig,vuln

variables:
  user_email: "test@example.com"

flow: http(1) && http(2)

http:
  - method: GET
    path:
      - "{{BaseURL}}"

    redirects: true
    max-redirects: 3

    matchers:
      - type: word
        words:
          - "app_id:"
          - "widget.intercom.io/widget"
        internal: true

    extractors:
      - type: regex
        name: intercom_app_id
        part: body
        group: 1
        regex:
          - 'app_id:\s*"([a-zA-Z0-9\-]+)"'
          - "widget\\.intercom\\.io/widget/([^\"']+)"
        internal: true

  - method: POST
    path:
      - "https://api-iam.intercom.io/messenger/web/ping"

    body: |
      app_id={{intercom_app_id}}&user_data={"email":"{{user_email}}"}

    matchers:
      - type: status
        status:
          - 200

    extractors:
      - type: dsl
        dsl:
          - Input
