id: cmsimple-detect

info:
  name: CMSimple 指纹识别（指纹识别）
  author: Shivam Kamboj
  severity: info
  description: |-
    CMSimple 是轻量级内容管理系统，用于小型网站页面、模板和内容维护。该模板请求首页，并依据页面标题、正文关键字或品牌资源特征识别目标是否使用或暴露了 CMSimple 相关组件，适用于资产盘点、技术栈识别和后续安全评估；命中结果仅表示指纹特征匹配，不代表已确认存在可利用漏洞。
  reference:
  - https://www.cmsimple.org/
  metadata:
    verified: true
    max-request: 1
    shodan-query: html:"CMSimple"
  tags: tech,cmsimple,discovery

http:
  - method: GET
    path:
      - "{{BaseURL}}"

    matchers-condition: or
    matchers:
      - type: regex
        part: body
        regex:
          - '(?i)content=["'']CMSimple(?:["''\s>])'

      - type: word
        part: body
        words:
          - "cmsimpleLocatorElement"
          - "Welcome_to_CMSimple"
          - "templates/__cmsimple_"
        condition: or

    extractors:
      - type: regex
        name: version
        part: body
        group: 1
        regex:
          - '(?i)content=["'']CMSimple ([0-9.]+)'
