id: hmc-hybris-panel

info:
  name: Hybris Management Console 登录面板识别（暴露面识别）
  author: dogasantos
  severity: info
  description: 该模板通过识别 Hybris Management Console 登录入口的页面标题、特征文本或重定向行为，判断目标是否暴露了对应的认证界面。若命中，说明该登录面板对外可访问，可用于暴露面梳理与后续安全评估。
  classification:
    cvss-metrics: CVSS:3.0/AV:N/AC:L/PR:N/UI:N/S:U/C:N/I:N/A:N
    cwe-id: CWE-200
    cpe: cpe:2.3:a:sap:hybris:*:*:*:*:*:*:*:*
  metadata:
    max-request: 2
    vendor: sap
    product: hybris
    shodan-query: http.title:"hybris"
    fofa-query: title="hybris"
    google-query: intitle:"hybris"
  tags: panel,sap,discovery

http:
  - method: GET
    path:
      - "{{BaseURL}}/hmc/hybris"
      - "{{BaseURL}}/hybris/hmc/hybris"

    matchers:
      - type: word
        words:
          - "hybris Management Console"
        part: body
