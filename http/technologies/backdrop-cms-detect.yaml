id: backdrop-cms-detect

info:
  name: Backdrop CMS 指纹识别（指纹识别）
  author: 5tr1x
  severity: info
  description: Backdrop CMS 是内容管理系统，用于网站内容、用户、模块和主题管理。该模板请求首页、`/core/profiles/testing/testing.info`，并依据页面标题、正文关键字或品牌资源特征识别目标是否使用或暴露了 Backdrop CMS 相关组件，适用于资产盘点、技术栈识别和后续安全评估；命中结果仅表示指纹特征匹配，不代表已确认存在可利用漏洞。
  metadata:
    max-request: 1
    verified: true
    shodan-query: html:"Backdrop CMS"
  tags: tech,backdrop,cms,detect,discovery

http:
  - method: GET
    path:
      - "{{BaseURL}}"
      - "{{BaseURL}}/core/profiles/testing/testing.info"

    host-redirects: true
    max-redirects: 2

    stop-at-first-match: true

    matchers:
      - type: word
        part: response
        words:
          - "Added by Backdrop CMS packaging script"
          - "X-Generator: Backdrop CMS"
        condition: or

    extractors:
      - type: regex
        part: body
        name: version
        regex:
          - "version = ([0-9.x-]+)"
