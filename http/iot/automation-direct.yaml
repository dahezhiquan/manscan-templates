id: automation-direct

info:
  name: AutomationDirect C-more HMI 面板（IOT）
  author: DhiyaneshDK
  severity: medium
  description: |
    检测到 AutomationDirect C-more HMI 面板。该模板通过页面标题识别工业人机界面，公网暴露可能泄露自动化控制系统的远程访问入口。
  impact: |
    - 工业控制、楼宇自动化或能源设备面板暴露可能泄露设施运行状态和控制系统入口。
    - 若存在弱口令或历史漏洞，可能影响生产、楼控、供电或环境控制的安全边界。
  remediation: |
    - 将 OT/IoT 管理页面放置在隔离网络中，仅允许可信运维主机或 VPN 访问。
    - 启用强认证、最小权限和设备访问审计，及时更新厂商固件。
    - 避免将控制设备直接暴露到互联网，并监控异常登录和配置变更。
  reference:
    - https://www.exploit-db.com/ghdb/7295
  classification:
    cvss-metrics: CVSS:3.1/AV:N/AC:L/PR:N/UI:N/S:U/C:N/I:N/A:N
    cvss-score: 0
    cwe-id: CWE-200
    cpe: cpe:2.3:h:automationdirect:ea9-t6cl:*:*:*:*:*:*:*:*
  metadata:
    max-request: 1
    shodan-query: http.title:"C-more -- the best HMI presented by AutomationDirect"
    google-query: intitle:"C-more -- the best HMI presented by AutomationDirect"
    product: ea9-t6cl
    vendor: automationdirect
  tags: panel,iot,edb,discovery

http:
  - method: GET
    path:
      - '{{BaseURL}}/index.html'

    matchers-condition: and
    matchers:
      - type: word
        words:
          - "<TITLE>C-more -- the best HMI presented by AutomationDirect</TITLE>"

      - type: status
        status:
          - 200

    extractors:
      - type: regex
        part: body
        group: 1
        regex:
          - '<P align="right">([A-Za-z. 0-9]+)<\/P>'
