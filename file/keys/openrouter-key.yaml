id: openrouter-key

info:
  name: OpenRouter API 密钥泄露检测（本地文件安全扫描）
  author: mmqnym
  severity: info
  description: |
    该模板检测文件中暴露的 OpenRouter API 密钥。此类凭据一旦泄露，可能被用于访问对应云服务、代码仓库、SaaS 平台或业务接口。
  classification:
    cvss-metrics: CVSS:3.1/AV:N/AC:L/PR:N/UI:N/S:U/C:N/I:N/A:N
    cvss-score: 0
    cwe-id: CWE-200
  reference:
    - https://openrouter.ai/docs/api-reference/overview
    - https://openrouter.ai/docs/api-reference/authentication
  metadata:
    verified: true
    max-request: 1
  tags: file,keys,openrouter,token,api
file:
  - extensions:
      - all

    extractors:
      - type: regex
        part: body
        regex:
          - \b(sk-or-v1-[a-fA-F0-9]{48,64})\b
