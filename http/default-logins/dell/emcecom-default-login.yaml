id: emcecom-default-login

info:
  name: Dell EMC ECOM 默认口令登录（弱口令）
  author: Techryptic (@Tech)
  severity: high
  description: 该模板通过尝试 Dell EMC ECOM 的默认账号口令（如 admin:#1Password），并依据认证成功后的响应特征判断目标是否仍在使用未修改的弱口令。若命中，攻击者可直接登录系统，进一步访问敏感信息、修改配置或执行未授权操作。
  remediation: 可通过执行 `remsys` 与 `addsys` 重新添加阵列并在重新接入时指定新密码来修复该问题。执行期间不应同时进行其他操作；若 `addsys` 过程异常，建议按对应 SMI-S Provider 文档重启各 SP 上的管理服务器。
  reference:
    - https://www.dell.com/support/kbdoc/en-za/000171270/vipr-controller-operation-denied-by-clariion-array-you-are-not-privileged-to-perform-the-requested-operation
  classification:
    cwe-id: CWE-798
  metadata:
    max-request: 1
  tags: dell,emc,ecom,default-login,vuln

http:
  - method: GET
    path:
      - "{{BaseURL}}/"
    headers:
      Authorization: "Basic {{base64(username + ':' + password)}}"

    payloads:
      username:
        - 'admin'
      password:
        - '#1Password'
    attack: pitchfork

    matchers-condition: and
    matchers:
      - type: word
        words:
          - "Set-Cookie: ECOMSecurity"
        part: header

      - type: word
        words:
          - "Welcome to ECOM"

      - type: status
        status:
          - 200
