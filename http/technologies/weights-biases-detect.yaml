id: weights-biases-detect

info:
  name: Weights & Biases 指纹识别（指纹识别）
  author: rxerium
  severity: info
  description: |
    用于识别目标是否部署 Weights & Biases 并提取相关版本或构建信息，模板会结合页面标题、页面正文、状态码、特定路径或已知端点和版本或标识提取结果进行指纹匹配。
  reference:
    - https://github.com/wandb/wandb
    - https://wandb.ai/
  metadata:
    verified: true
    max-request: 1
    vendor: wandb
    product: weights-and-biases
    shodan-query: 'http.html:"wandb" http.title:"Weights & Biases"'
  tags: tech,weights-biases,wandb,mlops,ai,detect,discovery

http:
  - method: GET
    path:
      - "{{BaseURL}}"

    host-redirects: true
    max-redirects: 2

    matchers-condition: and
    matchers:
      - type: word
        part: body
        words:
          - "<title>Weights & Biases"

      - type: status
        status:
          - 200
