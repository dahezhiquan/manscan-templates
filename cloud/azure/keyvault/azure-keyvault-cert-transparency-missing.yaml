id: azure-keyvault-cert-transparency-missing
info:
  name: Azure Key Vault 证书未启用证书透明度（云安全）
  author: princechaddha
  severity: medium
  description: 证书透明度（Certificate Transparency，CT）通过公开日志帮助域名所有者和安全团队发现错误签发或滥发的公网证书。证书策略关闭 CT 时，异常证书的外部发现和监测能力会下降。本模板读取 policy.issuerParameters.certificateTransparency，并在值为 false 时报告。
  impact: |
    - 错误签发的公网证书可能更晚被发现，攻击者可利用其冒充业务域名实施钓鱼、中间人攻击或流量劫持。
    - 缺少透明度记录会削弱证书资产监测和事件响应的外部证据来源。
  remediation: |
    - 对互联网信任链中的公网证书启用 certificateTransparency，并确认所用签发机构支持该策略。
    - 对内部 CA 或不适用 CT 的证书记录明确例外，结合证书库存、到期监控和域名监测补足发现能力。
  reference:
    - https://docs.microsoft.com/en-us/azure/key-vault/certificates/how-to-enable-certificate-transparency
  metadata:
    vendor: microsoft
    product: azure-key-vault
  tags: cloud,devops,azure,microsoft,keyvault,azure-cloud-config

flow: |
  code(1);
  for (let KeyVaultName of iterate(template.keyVaultNames)) {
    set("vaultName", KeyVaultName)
    code(2);
    for (let CertificateId of iterate(template.certificateIds)) {
      set("certificateId", CertificateId)
      code(3)
    }
  }

self-contained: true
code:
  - engine:
      - sh
      - bash
    source: |
      az keyvault list --query '[*].name' --output json

    extractors:
      - type: json
        name: keyVaultNames
        internal: true
        json:
          - '.[]'

  - engine:
      - sh
      - bash
    source: |
      az keyvault certificate list --vault-name $vaultName --query '[?(attributes.enabled==`true`)].id' --output json

    extractors:
      - type: json
        name: certificateIds
        internal: true
        json:
          - '.[]'

  - engine:
      - sh
      - bash
    source: |
      az keyvault certificate show --id $certificateId --query 'policy.issuerParameters.certificateTransparency' --output json

    matchers:
      - type: word
        words:
          - 'false'

    extractors:
      - type: dsl
        dsl:
          - 'vaultName + " SSL/TLS certificate " + certificateId + " does not have Certificate Transparency enabled"'
