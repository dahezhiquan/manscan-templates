id: oracle-xmldb-ftp-detect
info:
  name: Oracle XML DB FTP 服务 识别（指纹识别）
  author: pussycat0x
  severity: info
  description: |
    该模板通过 FTP Banner、响应特征或协商行为识别目标是否运行 Oracle XML DB 相关 FTP 服务实现。
  metadata:
    shodan-query: "FTP Server (Oracle XML DB"
    max-request: 1
  tags: network,ftp,oracle,detect,tcp,discovery

tcp:
  - inputs:
      - data: 00000000
        type: hex

    host:
      - "{{Hostname}}"
    port: 21
    read-size: 1024

    matchers:
      - type: word
        words:
          - "FTP Server (Oracle XML DB"

    extractors:
      - type: regex
        group: 1
        name: version
        regex:
          - "Release ([0-9.]+)"
