id: gcloud-vm-maintenance-terminate

info:
  name: VM Instance Maintenance 策略 Set to Terminate（云安全）
  author: princechaddha
  severity: high
  description: Compute Engine 实例的 onHostMaintenance 设置为 TERMINATE 时，宿主机维护期间实例会被终止而不是实时迁移。本模板枚举 VM 并检查 scheduling.onHostMaintenance，命中 TERMINATE 时报告维护策略可能影响可用性。
  impact: |
    - 宿主机维护事件可能直接中断实例，影响未做冗余的业务进程和长时间运行任务。
    - 生产工作负载需要额外依赖应用层重试、实例组或调度策略才能降低维护中断影响。
  remediation: |
    - 对需要持续运行的 VM 将 onHostMaintenance 设置为 MIGRATE，并验证机型和配置支持实时迁移。
    - 对必须使用 TERMINATE 的特殊实例记录例外，并通过冗余部署、检查点或任务重试降低中断风险。
  reference:
    - https://www.trendmicro.com/cloudoneconformity/knowledge-base/gcp/ComputeEngine/configure-maintenance-behavior.html
    - https://cloud.google.com/compute/docs/instances/setting-instance-scheduling-options
  metadata:
    vendor: google
    product: compute-engine
  tags: cloud,devops,gcp,gcloud,compute,reliability,maintenance,gcp-cloud-config

flow: |
  code(1)
  for(let projectId of iterate(template.projectIds)){
    set("projectId", projectId)
    code(2)
    for(let instance of iterate(template.instances)){
      instance = JSON.parse(instance)
      set("instanceName", instance.name)
      set("zone", instance.zone)
      code(3)
    }
  }

self-contained: true

code:
  - engine:
      - sh
      - bash
    source: |
      gcloud projects list --format="json(projectId)"

    extractors:
      - type: json
        name: projectIds
        internal: true
        json:
          - '.[].projectId'

  - engine:
      - sh
      - bash
    source: |
      gcloud compute instances list --project $projectId --format="json(name,zone.basename())"

    extractors:
      - type: json
        name: instances
        internal: true
        json:
          - '.[]'

  - engine:
      - sh
      - bash
    source: |
      gcloud compute instances describe $instanceName --zone $zone --project $projectId --format="json(scheduling.onHostMaintenance)"

    matchers:
      - type: word
        words:
          - '"onHostMaintenance": "TERMINATE"'

    extractors:
      - type: dsl
        dsl:
          - '"VM instance " + instanceName + " in zone " + zone + " of project " + projectId + " is configured to terminate instead of migrate during maintenance events"'
