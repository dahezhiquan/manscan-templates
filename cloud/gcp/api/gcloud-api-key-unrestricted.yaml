id: gcloud-api-key-unrestricted

info:
  name: Unrestricted API Key Usage（云安全）
  author: princechaddha
  severity: medium
  description: 未设置应用限制或 API 限制的 Google Cloud API Key 可被任意来源复用，泄露后更容易被滥用。本模板枚举项目 API Key，并检查 restrictions 字段是否为 null，命中时报告该 API Key 未配置限制条件。
  impact: |
    - 攻击者可在任意客户端或服务器环境中复用泄露的 API Key，调用关联项目中允许的 API。
    - 未受限密钥可能导致异常费用、配额耗尽、服务滥用，并扩大客户端配置泄露后的影响面。
  remediation: |
    - 为 API Key 同时配置应用限制和 API restrictions，例如 HTTP referrer、IP、Android 或 iOS 应用限制。
    - 删除不再使用的 API Key，轮换无法确认用途的密钥，并通过监控发现异常调用。
  reference:
    - https://cloud.google.com/docs/authentication/api-keys#restricting_api_keys
  metadata:
    vendor: google
    product: api-keys
  tags: cloud,devops,gcp,gcloud,apikey,gcp-cloud-config

flow: |
  code(1)
  for(let projectId of iterate(template.projectIds)){
    set("projectId", projectId)
    code(2)
    for(let uid of iterate(template.uids)){
      set("uid", uid)
      code(3)
    }
  }

self-contained: true

code:
  - engine:
      - sh
      - bash
    source: |
      gcloud projects list --format="json(projectId)"

    extractors:
      - type: json
        name: projectIds
        internal: true
        json:
          - '.[].projectId'

  - engine:
      - sh
      - bash
    source: |
      gcloud alpha services api-keys list --project $projectId --format="json(uid)"

    extractors:
      - type: json
        name: uids
        internal: true
        json:
          - '.[].uid'

  - engine:
      - sh
      - bash
    source: |
      gcloud alpha services api-keys describe $uid --format="json(restrictions)"

    matchers:
      - type: word
        words:
          - 'null'

    extractors:
      - type: dsl
        dsl:
          - '"Unrestricted API Key: " + uid + " in Project: " + projectId'
