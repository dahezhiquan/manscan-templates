id: api-bingmaps

info:
  name: Bing Maps API Token 可用性校验（token喷洒）
  author: zzeitlin
  severity: high
  reference:
    - https://docs.microsoft.com/en-us/bingmaps/rest-services/locations/find-a-location-by-address
  metadata:
    max-request: 1
  tags: token-spray,bing,maps,bingmaps
  description: |-
    平台介绍：Bing Maps API 是面向地图、地理位置、天气、地址解析或设备识别的数据服务平台，常用于查询位置、路线、地理编码、环境或终端信息。该模板用于校验提交的 Bing Maps API Token 是否仍然有效。检测逻辑会向 `dev.virtualearth.net/REST/v1/Locations` 发起低影响 API 请求，通过查询参数中的 API Key/Token 传递 `{{token}}`，并依据响应中的 `ValidCredentials` 判断凭据是否可用；命中通常表示该 Token 可被继续调用对应平台能力。
  impact: |-
    - 攻击者可确认 Token 有效并调用平台 API，读取账户、资源、配额或业务数据。
    - 有效 Token 可能被持续滥用，造成数据泄露、配额消耗、费用增加、服务滥用或进一步横向访问。
  remediation: |-
    - 立即撤销或轮换已暴露的 API Token，并确认旧 Token 不再可用。
    - 按最小权限原则重新签发凭据，限制作用域、来源地址、项目范围和有效期。
    - 在代码仓库、CI/CD、日志和配置文件中排查泄露来源，避免 Token 再次提交或外传。
self-contained: true

http:
  - method: GET
    path:
      - "https://dev.virtualearth.net/REST/v1/Locations?CountryRegion=US&adminDistrict=WA&locality=Somewhere&postalCode=98001&addressLine=100%20Main%20St.&key={{token}}"

    matchers:
      - type: word
        part: body
        words:
          - 'ValidCredentials'
