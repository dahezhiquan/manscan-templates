id: forgejo-eol

info:
  name: Forgejo EOL 指纹识别（指纹识别）
  author: Shivam Kamboj
  severity: info
  description: >-
    Forgejo 是轻量级代码托管与协作平台，EOL 版本表示目标实例运行的分支已不再获得官方维护。该模板通过请求目标服务并检查预设路径或首页响应、页面正文关键字、正则特征、DSL
    条件等指纹特征，判断目标是否使用或暴露了 Forgejo EOL 相关组件；命中结果仅表示指纹特征匹配，可用于资产盘点、技术栈识别和后续安全评估，不代表已确认存在可利用漏洞。
  reference:
  - https://endoflife.date/forgejo
  - https://forgejo.org/docs/latest/admin/upgrade/#release-life-cycle
  - https://forgejo.org/docs/next/user/versions/
  metadata:
    verified: true
    max-request: 1
    shodan-query: 'http.title:"Forgejo"'
    fofa-query: 'title="Forgejo"'
  tags: tech,forgejo,eol
http:
  - method: GET
    path:
      - "{{BaseURL}}"
      - "{{BaseURL}}/api/v1/version"

    matchers-condition: and
    matchers:
      - type: dsl
        dsl:
          - 'len(version) > 0'

      - type: dsl
        dsl:
          - 'compare_versions(version, "< 11.0.0") || compare_versions(version, ">= 12.0.0", "< 14.0.0")'
          - 'contains(tolower(body_1), "forgejo")'
        condition: and

    extractors:
      - type: regex
        part: body
        name: version
        group: 1
        regex:
          - '"version"\s*:\s*"([0-9]+\.[0-9]+\.[0-9]+)'
        internal: true
