id: couchbase-sync-gateway

info:
  name: Couchbase Sync 网关 指纹识别（指纹识别）
  author: dhiyaneshDk
  severity: info
  description: Couchbase Sync 网关 是 Couchbase 移动同步网关，用于移动端数据同步、认证和离线数据访问。该模板请求首页，并依据页面标题、正文关键字或品牌资源特征、响应头特征识别目标是否使用或暴露了 Couchbase Sync 网关 相关组件，适用于资产盘点、技术栈识别和后续安全评估；命中结果仅表示指纹特征匹配，不代表已确认存在可利用漏洞。
  classification:
    cpe: cpe:2.3:a:couchbase:sync_gateway:*:*:*:*:*:*:*:*
  metadata:
    max-request: 1
    vendor: couchbase
    product: sync_gateway
    shodan-query: html:"Couchbase Sync Gateway"
  tags: tech,couchbase,discovery

http:
  - method: GET
    path:
      - "{{BaseURL}}"

    matchers-condition: and
    matchers:
      - type: word
        part: body
        words:
          - "Couchbase Sync Gateway"
        condition: and

      - type: word
        part: header
        words:
          - "application/json"

    extractors:
      - type: regex
        part: body
        group: 1
        regex:
          - 'version":"Couchbase Sync Gateway\/([0-9.(;a-z)]+)'
