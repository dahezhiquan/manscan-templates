id: bootstrap-admin-panel-template

info:
  name: Bootstrap 管理面板 Template 面板 检测
  author: tess
  severity: low
  description: |
    该模板用于核查 Bootstrap 管理面板 Template 面板相关配置。该类问题通常源于管理面板、仪表盘或监控控制台暴露在公网或缺少足够访问控制。模板会向目标发送探测请求，并依据匹配 `Dashboard - Bootstrap Admin Template`、`Bootstrap Responsive Admin Template`等证据确认目标是否存在该配置问题。
  impact: |
    - 攻击者可获取系统状态、业务指标、任务信息、拓扑结构或管理入口线索。
    - 若面板存在默认凭据、弱认证或操作接口，可能进一步导致未授权管理或服务接管。
  remediation: |
    - 将管理面板和仪表盘限制在内网、VPN 或可信访问网关后。
    - 启用强认证、多因素认证、细粒度授权和操作审计。
    - 隐藏或关闭不需要公开的默认面板，并监控异常访问与暴力探测。
  classification:
    cvss-metrics: CVSS:3.0/AV:N/AC:L/PR:N/UI:N/S:U/C:N/I:N/A:N
    cvss-score: 0
    cwe-id: CWE-200
    cpe: cpe:2.3:a:teamworktec:responsive_bootstrap_admin_template:*:*:*:*:*:*:*:*
  metadata:
    verified: true
    max-request: 1
    shodan-query: title:"Dashboard - Bootstrap Admin Template"
    product: responsive_bootstrap_admin_template
    vendor: teamworktec
  tags: bootstrap,panel,misconfig,exposure,vuln

http:
  - method: GET
    path:
      - '{{BaseURL}}'

    matchers-condition: or
    matchers:
      - type: word
        part: body
        words:
          - "Dashboard - Bootstrap Admin Template"
          - "Bootstrap Responsive Admin Template"
        condition: and

      - type: word
        part: body
        words:
          - "Bootstrap Admin Template"
