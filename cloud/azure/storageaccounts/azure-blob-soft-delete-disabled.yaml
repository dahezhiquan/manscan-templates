id: azure-blob-soft-delete-disabled
info:
  name: Azure Blob Storage Blob 软删除未启用（云安全）
  author: princechaddha
  severity: medium
  description: Azure Blob 软删除在 Blob 被删除或覆盖后保留可恢复版本，可降低误删、恶意删除和勒索软件破坏造成的数据损失。本模板枚举存储账户并查询 Blob delete policy 的 enabled 字段，在返回 false 时报告。
  impact: |
    - 攻击者或误操作删除 Blob 后，数据可能无法恢复，影响业务文件、备份和审计证据的完整性。
    - 缺少恢复窗口会增加勒索软件、批量删除和错误发布造成的业务中断及数据丢失风险。
  remediation: |
    - 启用 Blob 软删除并根据数据恢复目标设置合理保留天数，同时配置容器软删除和版本控制等配套能力。
    - 定期执行删除和恢复演练，限制能够永久清理软删除数据的权限并监控策略变更。
  reference:
    - https://docs.microsoft.com/en-us/azure/storage/blobs/soft-delete-overview
  metadata:
    vendor: microsoft
    product: azure-blob-storage
  tags: cloud,devops,azure,microsoft,blob-storage,azure-cloud-config

flow: |
  code(1);
  for (let storageAccount of iterate(template.storageAccountNames)) {
    storageAccount = JSON.parse(storageAccount);
    set("name", storageAccount.Name);
    code(2);
  }

self-contained: true
code:
  - engine:
      - sh
      - bash
    source: |
      az storage account list --query '[*].{"Name":name}'

    extractors:
      - type: json
        name: storageAccountNames
        internal: true
        json:
          - '.[]'

  - engine:
      - sh
      - bash
    source: |
      az storage blob service-properties delete-policy show --account-name "$name" --output json --query 'enabled'

    matchers-condition: and
    matchers:
      - type: word
        words:
          - 'false'

    extractors:
      - type: dsl
        dsl:
          - 'name + " blob storage does not have Soft Delete enabled"'
