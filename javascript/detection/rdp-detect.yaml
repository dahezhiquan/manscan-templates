id: rdp-detect

info:
  name: RDP 服务识别（服务漏洞）
  author: pussycat0x
  severity: info
  description: |
    该模板通过远程桌面协商特征识别目标是否开放 RDP 服务。
  metadata:
    verified: true
    max-request: 1
    shodan-query: port:"3389"
  tags: js,network,rdp,info,enum,discovery

javascript:
  - code: |
      let m = require('nuclei/rdp');
      let response = m.IsRDP(Host,Port);
      Export(response);

    args:
      Host: "{{Host}}"
      Port: "3389"

    matchers:
      - type: dsl
        dsl:
          - 'success == true'
          - 'contains(response, "\"IsRDP\": true")'
        condition: and
