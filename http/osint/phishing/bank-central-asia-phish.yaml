id: bank-central-asia-phish

info:
  name: Bank Central Asia (BCA) 仿冒钓鱼网站（钓鱼网站识别）
  author: bocgoInfosec
  severity: info
  description: |
    检测到疑似仿冒 Bank Central Asia (BCA) 的钓鱼网站。模板在目标页面返回 200、页面内容命中 Bank Central Asia (BCA) 的品牌页面特征，且当前主机不属于 bca.co.id 官方域名时触发，用于识别借用 Bank Central Asia (BCA) 品牌页面诱导用户信任的仿冒站点。
  reference:
    - https://bca.co.id
  metadata:
    max-request: 1
  tags: phishing,bca,osint,discovery
http:
  - method: GET
    path:
      - "{{BaseURL}}"

    host-redirects: true
    max-redirects: 2

    matchers-condition: and
    matchers:
      - type: word
        words:
          - "BCA - Senantiasa di sisi Anda"
          - "BCA - Always by your side"
          - "myBCA"
        condition: or

      - type: status
        status:
          - 200

      - type: dsl
        dsl:
          - '!contains(host,"bca.co.id")'
