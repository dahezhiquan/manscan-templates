id: traggo-server-detect

info:
  name: Traggo Time Tracking 服务器指纹识别（指纹识别）
  author: 0x_Akoko
  severity: info
  description: |
    用于识别目标是否部署 Traggo Time Tracking 服务器 并提取相关版本或构建信息，模板会结合页面标题、页面正文和版本或标识提取结果进行指纹匹配。
  reference:
    - https://github.com/traggo/server
  metadata:
    verified: true
    max-request: 2
    shodan-query: http.title:"Traggo"
  tags: tech,traggo,detect,graphql,discovery

http:
  - raw:
      - |
        GET / HTTP/1.1
        Host: {{Hostname}}

      - |
        POST /graphql HTTP/1.1
        Host: {{Hostname}}
        Content-Type: application/json

        {"query":"{ version { name commit buildDate } }"}

    matchers:
      - type: dsl
        dsl:
          - 'contains(body_1, "<title>Traggo</title>") && contains(body_1, "webpackJsonpui") && contains(body_2, "\"data\"") && contains(body_2, "\"version\"")'

    extractors:
      - type: json
        name: version
        part: body_2
        json:
          - '.data.version.name'
