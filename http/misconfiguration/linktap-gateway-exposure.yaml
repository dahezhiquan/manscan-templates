id: linktap-gateway-exposure

info:
  name: LinkTap Gateway 暴露
  author: DhiyaneshDk
  severity: low
  description: |
    检测到 LinkTap Gateway 暴露。目标响应或文件中可能暴露配置、凭据、密钥、令牌、环境变量或历史记录等敏感信息，可能被用于进一步入侵。
  metadata:
    verified: true
    max-request: 1
    shodan-query: title:"LinkTap Gateway"
  tags: misconfig,linktap,iot,exposure,vuln

http:
  - method: GET
    path:
      - '{{BaseURL}}'

    matchers-condition: and
    matchers:
      - type: word
        part: body
        words:
          - 'Device infomation'
          - 'Ethernet settings'
        condition: and

      - type: status
        status:
          - 200
