id: kylin-default-login

info:
  name: Apache Kylin Console 默认口令登录（弱口令）
  author: SleepingBag945
  severity: high
  description: |
    该模板用于检测 Apache Kylin Console 是否仍可使用默认凭据或弱口令登录。模板主要向 `/kylin/api/user/authentication` 等认证入口发送请求，使用内置默认凭据组合进行认证尝试，并根据响应中的 `"userDetails":`、`"username":` 等登录成功特征判断登录是否成功；命中说明目标未及时修改出厂、示例或初始化账号口令。
  impact: |
    - 攻击者可登录 Apache Kylin Console 管理接口，读取、导出或篡改数据、索引、队列、仓库、报表或服务配置。
    - 若系统保存连接串、访问令牌或集成凭据，弱口令登录可能进一步造成业务数据泄露、权限扩大或服务中断。
  remediation: |
    - 立即修改默认账号口令，删除测试账号，并为管理员、服务账号和集成账号使用唯一强密码。
    - 启用细粒度权限控制、访问来源限制和审计日志，避免管理 API 或控制台直接对公网开放。
    - 检查数据导出、配置变更、令牌使用和异常查询记录，必要时轮换相关凭据。
  reference:
    - https://github.com/hanc00l/pocGoby2Xray/blob/main/xraypoc/Apache_Kylin_Console_Default_password.yml
    - https://github.com/Wker666/Demo/blob/main/script/%E6%BC%8F%E6%B4%9E%E6%8E%A2%E6%B5%8B/Kylin/Apache%20Kylin%20Console%20%E6%8E%A7%E5%88%B6%E5%8F%B0%E5%BC%B1%E5%8F%A3%E4%BB%A4.wker
  classification:
    cpe: cpe:2.3:a:apache:kylin:*:*:*:*:*:*:*:*
  metadata:
    verified: true
    max-request: 6
    vendor: apache
    product: kylin
    fofa-query: app="APACHE-kylin"
  tags: kylin,default-login,apache,vuln

http:
  - raw:
      - |
        GET /kylin/api/user/authentication  HTTP/1.1
        Host: {{Hostname}}
        Authorization: Basic {{base64(username + ':' + password)}}

    attack: clusterbomb
    payloads:
      username:
        - ADMIN
        - admin
      password:
        - KYLIN
        - kylin
        - 123456
    stop-at-first-match: true

    matchers-condition: and
    matchers:
      - type: word
        part: body
        words:
          - '"userDetails":'
          - '"username":'
          - '"password":'
        condition: and

      - type: word
        part: header
        words:
          - 'application/json'

      - type: status
        status:
          - 200
