id: azure-sql-mi-tde-cmk-not-enabled
info:
  name: Azure SQL Managed Instance TDE 未使用客户管理密钥（云安全）
  author: princechaddha
  severity: medium
  description: Azure SQL Managed Instance 的透明数据加密可以使用客户管理密钥，将密钥生命周期和撤销控制权交给组织；使用服务托管密钥时，无法按组织密钥策略独立管理加密根密钥。本模板枚举托管实例并查询 serverKeyType，在返回 ServiceManaged 时报告未使用客户管理密钥。
  impact: |
    - 组织无法独立执行密钥轮换、吊销和访问审批，可能不满足高敏感数据或监管场景的密钥控制要求。
    - 当密钥治理账户、租户隔离或离职回收流程要求客户拥有密钥控制权时，服务托管密钥会扩大合规和权限管理风险。
  remediation: |
    - 在 Key Vault 或 Managed HSM 中准备客户管理密钥，并按 Azure SQL Managed Instance 要求配置权限和网络访问。
    - 将实例 TDE 保护器切换为客户管理密钥，建立轮换、备份、吊销和密钥不可用时的应急流程。
  reference:
    - https://docs.microsoft.com/en-us/azure/azure-sql/database/transparent-data-encryption-tde-overview
  metadata:
    vendor: microsoft
    product: azure-sql-managed-instance
  tags: cloud,devops,azure,microsoft,sql-managed-instance,azure-cloud-config

flow: |
  code(1);
  for (let SQLMI of iterate(template.sqlManagedInstanceList)) {
    set("ids", SQLMI);
    code(2);
  }

self-contained: true
code:
  - engine:
      - sh
      - bash
    source: |
      az sql mi list --query '[*].{"id":id}'

    extractors:
      - type: json
        name: sqlManagedInstanceList
        internal: true
        json:
          - '.[]'

  - engine:
      - sh
      - bash
    source: |
      az sql mi tde-key show --ids "$ids" --query 'serverKeyType'

    matchers-condition: and
    matchers:
      - type: word
        words:
          - '"ServiceManaged"'

    extractors:
      - type: dsl
        dsl:
          - 'ids + " is using a service-managed key for TDE, not a CMK"'
