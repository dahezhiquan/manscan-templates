id: rw-hosts-file

info:
  name: /etc/hosts 可被非 root 写入（本地基线扫描）
  author: songyaeji
  severity: high
  description: |
    该模板检查 /etc/hosts 是否可被非 root 用户写入。若可写，攻击者可伪造域名解析并重定向合法访问。
  reference:
    - https://isms.kisa.or.kr/main/csap/notice/
  metadata:
    verified: true
  tags: local,linux,hosts,file,audit,kisa

self-contained: true

code:
  - engine:
      - sh
      - bash
    source: |
      stat -c "%U %G %a" /etc/hosts 2>/dev/null || echo "not-found"

    matchers:
      - type: regex
        part: response
        regex:
          - '^root\s+root\s+(600|644)$'
