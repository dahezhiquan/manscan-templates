id: apache-casbin-mcp-gateway-detect

info:
  name: Apache Casbin MCP 网关指纹识别（指纹识别）
  author: icarot
  severity: info
  description: |
    用于识别目标是否部署 Apache Casbin MCP 网关 并提取相关版本或构建信息，模板会结合页面正文、状态码、特定路径或已知端点和版本或标识提取结果进行指纹匹配。
  reference:
    - https://github.com/apache/casbin-mcp-gateway
  metadata:
    vendor: apache
    product: casbin-mcp-gateway
  tags: tech,casbin-mcp-gateway,apache,detect
http:
  - method: GET
    path:
      - "{{BaseURL}}/health"

    matchers-condition: and
    matchers:
      - type: word
        words:
          - '"service": "mcp-gateway"'
        condition: and
      - type: status
        status:
          - 200
    extractors:
      - type: json
        name: version
        part: body
        json:
          - '.version'
