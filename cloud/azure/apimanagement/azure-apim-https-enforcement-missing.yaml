id: azure-apim-https-enforcement-missing
info:
  name: Azure API Management API 未强制仅使用 HTTPS（云安全）
  author: princechaddha
  severity: high
  description: Azure API Management API 同时允许 HTTP 和 HTTPS 访问时，客户端可能通过明文连接传输令牌、请求参数和业务数据。该模板枚举 APIM 实例及 API，查询每个 API 的 protocols，并在包含 https 且未排除 http 时报告未强制 HTTPS。
  impact: |
    - 网络窃听者可能获取认证令牌、会话信息和敏感请求内容，进而重放请求或读取响应数据。
    - HTTP 入口还可能被用于降级访问、流量篡改和绕过依赖 TLS 的安全控制。
  remediation: |
    - 将受影响 API 的协议限制为 HTTPS，移除 HTTP 协议并确认客户端已更新为 TLS 访问。
    - 在网关、后端和自定义域名层面同步检查 TLS 配置、重定向策略和证书有效期，避免保留明文旁路入口。
  reference:
    - https://docs.microsoft.com/en-us/azure/api-management/api-management-howto-secure-backend
  metadata:
    vendor: microsoft
    product: azure-api-management
  tags: cloud,devops,azure,microsoft,apim,azure-cloud-config

flow: |
  code(1);
  for (let Service of iterate(template.serviceList)) {
    Service = JSON.parse(Service);
    set("servicename", Service.name);
    set("resourcegroup", Service.resourceGroup);
    code(2);
    for (let Api of iterate(template.apiList)) {
      set("apiid", Api);
      code(3);
    }
  }

self-contained: true
code:
  - engine:
      - sh
      - bash
    source: |
      az apim list --output json --query '[*].{name:name, resourceGroup:resourceGroup}'

    extractors:
      - type: json
        name: serviceList
        internal: true
        json:
          - '.[]'

  - engine:
      - sh
      - bash
    source: |
      az apim api list -g $resourcegroup -n $servicename  --query '[].name'

    extractors:
      - type: json
        name: apiList
        internal: true
        json:
          - '.[]'

  - engine:
      - sh
      - bash
    source: |
      az apim api show --api-id "$apiid" --service-name $servicename --resource-group $resourcegroup --query 'protocols'

    matchers-condition: and
    matchers:
      - type: word
        words:
          - "https"

      - type: word
        words:
          - "http"
        negative: true

    extractors:
      - type: dsl
        dsl:
          - '"Service: " + service-name + " API: " + api-id + " does not enforce HTTPS exclusively"'

      - type: dsl
        dsl:
          - stderr
