id: smf-installer

info:
  name: SMF 安装向导
  author: DhiyaneshDk
  severity: high
  description: |
    检测到 SMF 安装向导。该页面属于安装、初始化或配置向导流程，若对外暴露，攻击者可能完成初始化、创建管理员账户或重新配置目标系统。
  classification:
    cpe: cpe:2.3:a:simplemachines:simple_machine_forum:*:*:*:*:*:*:*:*
  metadata:
    verified: true
    max-request: 1
    vendor: simplemachines
    product: simple_machine_forum
    shodan-query: title:"SMF Installer"
  tags: misconfig,smf,install,exposure,vuln

http:
  - method: GET
    path:
      - '{{BaseURL}}/install.php'

    matchers-condition: and
    matchers:
      - type: word
        part: body
        words:
          - 'SMF Installer'
          - 'Progress'
        condition: and

      - type: word
        part: header
        words:
          - 'text/html'

      - type: status
        status:
          - 200
