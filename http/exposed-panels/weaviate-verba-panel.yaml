id: weaviate-verba-panel

info:
  name: Verba（The Golden RAGtriever）面板识别（指纹识别）
  author: rxerium
  severity: info
  description: |-
    Verba（The Golden RAGtriever） 是基于 Weaviate 的 RAG 应用，用于文档索引、语义搜索和大模型问答。该模板请求首页，并依据 HTTP 200 状态码、页面标题、正文关键字或品牌资源特征识别目标是否部署了该系统或暴露了对应入口，适用于资产指纹确认；命中结果仅表示系统特征匹配，不代表已确认存在未授权访问或可利用漏洞。
  reference:
  - https://github.com/weaviate/Verba
  - https://weaviate.io
  metadata:
    verified: true
    max-request: 1
    vendor: weaviate
    product: verba
    shodan-query: 'html:"bg-bg-verba"'
  tags: panel,verba,weaviate,llm,ai,rag,detect,discovery

http:
  - method: GET
    path:
      - "{{BaseURL}}"

    host-redirects: true
    max-redirects: 2

    matchers-condition: and
    matchers:
      - type: word
        part: body
        words:
          - "bg-bg-verba"

      - type: status
        status:
          - 200
