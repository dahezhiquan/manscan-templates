id: api-intigriti-researcher

info:
  name: Intigriti-Researcher API Token 可用性校验（token喷洒）
  author: 0xpugal
  severity: info
  description: 该模板通过调用 Intigriti-Researcher API 的已知接口验证提供的 token 是否有效，命中后通常表示可访问相关 API 能力。
  reference:
    - https://kb.intigriti.com/en/articles/8529303-intigriti-researcher-api
  metadata:
    verified: true
    max-request: 1
  tags: token-spray,intigriti

self-contained: true

http:
  - method: GET
    path:
      - "https://api.intigriti.com/external/researcher/v1/programs"

    headers:
      Authorization: Bearer {{token}}
      Content-Type: application/json

    matchers-condition: and
    matchers:
      - type: word
        part: body
        words:
          - '"records"'
          - '"webLinks"'
          - '"detail"'
          - '"handle"'
          - '"value"'
          - '"status"'
        condition: and

      - type: word
        part: header
        words:
          - 'application/json'

      - type: status
        status:
          - 200
