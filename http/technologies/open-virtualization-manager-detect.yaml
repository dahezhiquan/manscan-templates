id: open-virtualization-manager-detect

info:
  name: Open Virtualization Manager 指纹识别（指纹识别）
  author: idealphase
  severity: info
  description: 用于识别目标是否部署 Open Virtualization Manager 并提取相关版本或构建信息，模板会结合页面标题、特定路径或已知端点和版本或标识提取结果进行指纹匹配。
  reference:
    - https://www.ovirt.org/
    - https://www.ovirt.org/dropped/admin-guide/virt/console-client-resources.html
  classification:
    cvss-metrics: CVSS:3.0/AV:N/AC:L/PR:N/UI:N/S:U/C:N/I:N/A:N
    cvss-score: 0
    cwe-id: CWE-200
  metadata:
    max-request: 1
    shodan-query: title:"Ovirt-Engine"
    google-query: intitle:"Ovirt-Engine"
  tags: tech,ovirt,discovery

http:
  - method: GET
    path:
      - '{{BaseURL}}/ovirt-engine/'

    matchers-condition: and
    matchers:
      - type: word
        words:
          - "Welcome to Open Virtualization Manager"
          - "<title>Ovirt-Engine</title>"
          - "<title>oVirt Engine</title>"
          - "<title>oVirt Engine Error</title>"
        condition: or

    extractors:
      - type: regex
        group: 1
        regex:
          - '<span class="version-text">(.+)<\/span>'
