id: acemanager-login

info:
  name: ACEmanager 识别（指纹识别）
  author: pussycat0x
  severity: info
  description: |-
    检测到目标站点存在 ACEmanager 相关响应特征。ACEmanager 是 Sierra Wireless 网关和路由设备的管理界面，用于配置蜂窝连接、网络参数、VPN 与设备维护功能。模板请求 `/`，并通过页面标题或正文关键字、状态码确认该系统指纹，用于资产识别、系统盘点和暴露面梳理。
  classification:
    cwe-id: CWE-200
    cpe: cpe:2.3:a:sierrawireless:airlink_mobility_manager:*:*:*:*:*:*:*:*
  metadata:
    max-request: 1
    vendor: sierrawireless
    product: airlink_mobility_manager
    fofa-query:
      - app="ACEmanager"
      - app="acemanager"
  tags: panel,login,tech,acemanager,sierrawireless,discovery
http:
  - method: GET
    path:
      - "{{BaseURL}}"

    matchers-condition: and
    matchers:
      - type: word
        part: body
        words:
          - '<title>::: ACEmanager :::</title>'
        condition: and

      - type: status
        status:
          - 200

    extractors:
      - type: regex
        part: body
        regex:
          - 'ALEOS Version ([0-9.]+) \| Copyright &co'
