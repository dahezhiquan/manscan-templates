id: tolgee-api

info:
  name: Tolgee API 检测（暴露面识别）
  author: matejsmycka
  severity: info
  description: 检测到对外可访问的 Tolgee API。公开的接口文档、调试端点或管理 API 可能泄露路由结构、参数格式、鉴权方式和内部功能边界，从而帮助攻击者快速完成接口枚举与利用准备。
  reference:
    - https://docs.tolgee.io/api
  metadata:
    max-request: 1
    verified: true
    shodan-query: html:"tolgee"
  tags: exposure,api,tolgee,discovery

http:
  - method: GET
    path:
      - "{{BaseURL}}/api/public/configuration"

    matchers-condition: and
    matchers:
      - type: word
        part: body
        words:
          - Tolgee
          - version
        condition: and

      - type: word
        part: content_type
        words:
          - application/json

      - type: status
        status:
          - 200

    extractors:
      - type: regex
        part: body
        regex:
          - '"version"\s*:\s*"([^"]+)"'
        group: 1
        name: version
