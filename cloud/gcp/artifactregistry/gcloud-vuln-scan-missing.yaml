id: gcloud-vuln-scan-missing

info:
  name: Artifact Registry Vulnerability Scanning未启用（云安全）
  author: princechaddha
  severity: high
  description: Artifact Registry 漏洞扫描依赖 Container Scanning API 识别镜像和制品中的已知漏洞。该模板检查项目已启用服务，若未发现 containerscanning.googleapis.com 且服务列表可用，则报告 Artifact Registry 漏洞扫描能力未启用。
  impact: |
    - 易受攻击的镜像或包可能在构建和部署前未被发现，增加供应链和运行时被利用的概率。
    - 安全团队缺少制品漏洞清单，难以按严重性安排修复和阻断高危发布。
  remediation: |
    - 为使用 Artifact Registry 的项目启用 Container Scanning API，并确认计费和权限满足扫描要求。
    - 将漏洞扫描结果接入 CI/CD 准入和修复流程，对高危漏洞镜像设置阻断或例外审批。
  reference:
    - https://cloud.google.com/artifact-registry/docs/vulnerability-scanning
  metadata:
    vendor: google
    product: artifact-registry
  tags: cloud,devops,gcp,gcloud,artifact-registry,container-scanning,gcp-cloud-config

flow: |
  code(1)
  for(let projectId of iterate(template.projectIds)){
    set("projectId", projectId)
    code(2)
  }

self-contained: true

code:
  - engine:
      - sh
      - bash
    source: |
      gcloud projects list --format="json(projectId)"
    extractors:
      - type: json
        name: projectIds
        internal: true
        json:
          - '.[].projectId'

  - engine:
      - sh
      - bash
    source: |
      gcloud services list --enabled --project $projectId --format="json(config.name)"

    matchers:
      - type: word
        words:
          - 'containerscanning.googleapis.com'
        negative: true

      - type: word
        words:
          - '"config":'

    extractors:
      - type: dsl
        dsl:
          - '"Vulnerability Scanning not enabled for Artifact Registry in Project: " + projectId'
