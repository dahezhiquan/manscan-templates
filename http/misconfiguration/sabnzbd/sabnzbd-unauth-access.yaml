id: sabnzbd-unauth-access

info:
  name: SABnzbd 未授权 Web 界面 访问
  author: 0x_Akoko
  severity: high
  description: |
    该模板用于核查 SABnzbd 未授权 Web 界面 访问。该类问题通常源于管理端、API、控制台或服务接口缺少认证授权，导致未登录用户可直接访问敏感功能。模板会向目标发送探测请求，并依据请求 `/config/`、匹配 `status_code == 200`、匹配 `contains(content_type, "text/html")`等证据确认目标是否存在该配置问题。
  impact: |
    - 攻击者可在未授权状态下查看系统状态、业务数据、任务信息或管理接口。
    - 若接口支持写操作，可能进一步导致配置篡改、服务接管、数据删除或横向移动。
  remediation: |
    - 为相关管理端和 API 启用认证授权，并按最小权限限制可访问功能。
    - 将管理接口限制在内网、VPN 或可信来源范围内，并开启访问审计。
    - 检查历史访问日志，确认是否存在未授权访问、批量枚举或异常操作。
  reference:
    - https://sabnzbd.org/wiki/extra/access-denied.html
    - https://sabnzbd.org/wiki/configuration/4.5/api
  classification:
    cwe-id: CWE-306
  metadata:
    max-request: 1
    verified: true
    shodan-query: http.title:"SABnzbd"
    fofa-query: title="SABnzbd"
  tags: sabnzbd,unauth,misconfig,exposure,iot

http:
  - method: GET
    path:
      - "{{BaseURL}}/config/"

    matchers:
      - type: dsl
        dsl:
          - 'status_code == 200'
          - 'contains_all(body, "var sabSession =", "configTranslate", "SABnzbd Config")'
          - 'contains(content_type, "text/html")'
        condition: and
