id: dnsmasq-service

info:
  name: dnsmasq 服务不应安装（本地基线扫描）
  author: Th3l0newolf
  severity: info
  description: |
    该模板检查本机是否安装了不必要的 DNS 解析 组件。若系统没有明确业务需求，保留该组件会增加本地基线暴露面和后续被误用的风险。
  remediation: |
    如无明确业务需求，卸载对应软件包；如必须保留，应限制访问来源并纳入补丁和审计管理。
  reference:
    - https://www.cisecurity.org/benchmark/ubuntu_linux
  metadata:
    verified: true
  tags: cis,local,cisecurity,audit,linux,ubuntu

self-contained: true

code:
  - engine:
      - bash
    args:
      - "-c"
      - |
        if dpkg-query -s dnsmasq &>/dev/null; then
          echo "[dnsmasq-service-check:Policy-Fail] [dnsmasq is installed] [CIS_FAIL]"
        else
          echo "[dnsmasq-service-check:Policy-Pass] [dnsmasq is not installed] [CIS_PASS]"
        fi

    matchers:
      - type: word
        name: policy-pass
        words:
          - "Policy-Pass"

      - type: word
        name: policy-fail
        words:
          - "Policy-Fail"
