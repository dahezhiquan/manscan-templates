id: ntlm-info

info:
  name: SMB NTLM 信息枚举（服务漏洞）
  author: pussycat0x
  severity: medium
  description: |
    NTLM 是 Windows 环境中常见的挑战响应式认证机制，在 SMB 协商过程中可能返回主机名、域名、DNS 名称和身份验证相关信息。该模板发起 SMB/NTLM 信息探测，并从返回结构中提取 NTLM 与主机标识字段。
  impact: |
    - NTLM 响应可能泄露主机名、域名、DNS 名称和身份验证环境信息。
    - 攻击者可利用这些信息构建域内资产图谱，并辅助中继、枚举或定向口令攻击。
  remediation: |
    - 限制 SMB 端口仅对可信网段开放，减少匿名或预认证阶段可泄露的信息。
    - 强化 NTLM/SMB 配置，优先使用 Kerberos，禁用不必要的旧协议和匿名枚举。
  reference:
    - https://www.crowdstrike.com/cybersecurity-101/ntlm-windows-new-technology-lan-manager/
  metadata:
    shodan-query: "port:445"
    verified: true
  tags: js,network,smb,enum,discovery

javascript:
  - code: |
      var m = require("nuclei/smb");
      var c = m.SMBClient();
      var response = c.ConnectSMBInfoMode(Host, Port);
      to_json(response);

    args:
      Host: "{{Host}}"
      Port: "445"

    matchers:
      - type: dsl
        dsl:
          - "len(ntlm) != 0"

    extractors:
      - type: json
        internal: true
        part: response
        name: ntlm
        json:
          - '.NTLM'

      - type: json
        json:
          - '"NTLM: "+ .NTLM'
