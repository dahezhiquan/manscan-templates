id: proftpd-server-detect

info:
  name: ProFTPD 服务识别（指纹识别）
  author: pussycat0x
  severity: info
  description: |
    ProFTPD 是类 Unix 系统常见的 FTP 服务端软件，用于提供文件传输服务。该模板连接 21/TCP 并读取欢迎横幅，识别带版本号或隐藏版本号的 ProFTPD Server 响应；仅在横幅明确包含版本号时提取版本，保留 1.3.5e 等版本后缀。
  reference:
    - https://github.com/nmap/nmap/blob/master/nmap-service-probes
  metadata:
    verified: true
    max-request: 1
    shodan-query: product:"ProFTPD"
    product: proftpd
  tags: network,ftp,proftpd,detect,tcp,discovery
tcp:
  - inputs:
      - data: "\n"
        read: 1
    host:
      - "{{Hostname}}"
    port: 21
    read-all: true

    matchers:
      - type: regex
        part: raw
        regex:
          - '(?i)^220(?:-[^\r\n]*\r?\n220)*[ -]ProFTPD(?: [0-9][0-9a-z._+-]*)? Server(?:[ \t]|\r?\n|$)'

    extractors:
      - type: regex
        regex:
          - '(?i)^220(?:-[^\r\n]*\r?\n220)*[ -]ProFTPD ([0-9][0-9a-z._+-]*) Server(?:[ \t]|\r?\n|$)'
        group: 1
        name: version
        part: raw
