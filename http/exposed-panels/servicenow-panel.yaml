id: servicenow-panel

info:
  name: ServiceNow 登录面板识别（暴露面识别）
  author: righettod
  severity: info
  description: |
    该模板通过识别 ServiceNow 登录入口的页面标题、特征文本或重定向行为，判断目标是否暴露了对应的认证界面。若命中，说明该登录面板对外可访问，可用于暴露面梳理与后续安全评估。
  reference:
    - https://www.servicenow.com/
  classification:
    cpe: cpe:2.3:a:servicenow:servicenow:*:*:*:*:*:*:*:*
  metadata:
    verified: true
    max-request: 1
    vendor: servicenow
    product: servicenow
    shodan-query:
      - http.favicon.hash:1701804003
      - http.title:"servicenow"
    fofa-query:
      - icon_hash=1701804003
      - title="servicenow"
    google-query: intitle:"servicenow"
  tags: panel,servicenow,login,detect,discovery

http:
  - method: GET
    path:
      - '{{BaseURL}}/login.do'

    matchers-condition: and
    matchers:
      - type: word
        part: body
        words:
          - 'ServiceNow'
          - 'window.NOW.'
          - 'NOW.user.userID'
        condition: and
        case-insensitive: true

      - type: status
        status:
          - 200

    extractors:
      - type: regex
        part: body
        group: 1
        regex:
          - '(?i)g_builddate\s+=\s+"([0-9._-]+)"'
