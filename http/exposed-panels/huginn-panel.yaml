id: huginn-panel

info:
  name: Huginn 登录面板识别（暴露面识别）
  author: righettod
  severity: info
  description: |
    该模板通过识别 Huginn 登录入口的页面标题、特征文本或重定向行为，判断目标是否暴露了对应的认证界面。若命中，说明该登录面板对外可访问，可用于暴露面梳理与后续安全评估。
  reference:
    - https://github.com/huginn/huginn
  metadata:
    max-request: 1
    verified: true
    shodan-query: http.favicon.hash:-1951475503
  tags: panel,huginn,login,discovery

http:
  - method: GET
    path:
      - "{{BaseURL}}/users/sign_in"

    matchers:
      - type: dsl
        dsl:
          - 'status_code == 200'
          - 'contains_any(to_lower(body), "huginn</title>", "huginn</a>", "Huginn monitors")'
        condition: and
