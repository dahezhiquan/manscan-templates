id: itch-io-phish

info:
  name: itch.io 仿冒钓鱼网站（钓鱼网站识别）
  author: rxerium
  severity: info
  description: |
    检测到疑似仿冒 itch.io 的钓鱼网站。模板在目标页面返回 200、页面内容命中 itch.io 的官方服务页面特征，且当前主机不属于 itch.io 官方域名时触发，用于识别借用 itch.io 品牌页面诱导用户信任的仿冒站点。
  reference:
    - https://itch.io
  metadata:
    max-request: 1
  tags: phishing,itch-io,osint,discovery
http:
  - method: GET
    path:
      - "{{BaseURL}}"

    host-redirects: true
    max-redirects: 2

    matchers-condition: and
    matchers:
      - type: word
        words:
          - "itch.io is a simple way to find, download and distribute indie games online. Whether you're a developer looking to upload your game or just someone looking for something new to play itch.io has you covered."

      - type: status
        status:
          - 200

      - type: dsl
        dsl:
          - '!contains(host,"itch.io")'
