id: terraform-detect

info:
  name: Terraform Provider 指纹识别（指纹识别）
  author: geeknik
  severity: info
  description: >-
    Terraform Provider 是 Terraform 的资源插件，用于对接云平台、SaaS 或基础设施 API 并管理资源生命周期。该模板通过请求目标服务并检查预设路径或首页响应、页面正文关键字、状态码等指纹特征，判断目标是否使用或暴露了
    Terraform Provider 相关组件；命中结果仅表示指纹特征匹配，可用于资产盘点、技术栈识别和后续安全评估，不代表已确认存在可利用漏洞。
  metadata:
    max-request: 1
  tags: tech,terraform,discovery
http:
  - method: GET
    path:
      - "{{BaseURL}}/provider.tf"

    matchers-condition: and
    matchers:
      - type: word
        part: body
        words:
          - "access_key"
          - "terraform"
        condition: and

      - type: status
        status:
          - 200
