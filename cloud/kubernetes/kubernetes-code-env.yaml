id: kubernetes-code-env
info:
  name: Kubernetes Cluster 校验（云安全）
  author: princechaddha
  severity: info
  description: 该规则用于检查 Kubernetes kubernetes-code-env.yaml 相关资源是否满足推荐的云安全与合规配置要求，命中通常表示当前配置仍存在可改进的风险项。
  reference:
    - https://kubernetes.io/
  tags: cloud,devops,kubernetes,k8s,k8s-cluster-security

self-contained: true
code:
  - engine:
      - sh
      - bash
    source: |
      kubectl version

    extractors:
      - type: regex
        internal: true
        name: server_version
        group: 1
        regex:
          - 'Server Version:\s*(v[0-9]+\.[0-9]+\.[0-9]+)'

      - type: dsl
        dsl:
          - '"kubectl is successfully connected to the Kubernetes API Server Version: " + server_version'
