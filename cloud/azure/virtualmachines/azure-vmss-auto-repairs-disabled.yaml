id: azure-vmss-auto-repairs-disabled
info:
  name: Azure VMSS Automatic Instance Repairs未启用（云安全）
  author: princechaddha
  severity: medium
  description: Azure VMSS Automatic Instance Repairs 可根据应用健康状态自动修复不健康实例；automaticRepairsPolicy.enabled 为 null 时，本模板无法确认该策略已启用。本模板枚举规模集并查询该字段，在返回 AutomaticRepairsPolicyEnabled 为 null 时报告。
  impact: |
    - 失效、卡死或被异常修改的实例可能持续接收流量，造成服务降级和攻击面扩大。
    - 缺少自动修复会延长恶意进程或错误配置在实例池中的存留时间，增加人工处置和恢复压力。
  remediation: |
    - 配置 VMSS 应用健康扩展、探测端点和 Automatic Instance Repairs，设置合理的修复等待和实例替换策略。
    - 确认应用具备无状态或可恢复能力，避免自动替换掩盖取证证据，并将修复事件接入监控和审计。
  reference:
    - https://docs.microsoft.com/en-us/azure/virtual-machine-scale-sets/virtual-machine-scale-sets-automatic-instance-repairs
  metadata:
    vendor: microsoft
    product: azure-virtual-machine-scale-sets
  tags: cloud,devops,azure,microsoft,vmss,azure-cloud-config

flow: |
  code(1);
  for (let ScaleSetData of iterate(template.scaleSetList)) {
    ScaleSetData = JSON.parse(ScaleSetData);
    set("name", ScaleSetData.name);
    set("resourceGroup", ScaleSetData.resourceGroup);
    code(2);
  }

self-contained: true
code:
  - engine:
      - sh
      - bash
    source: |
      az vmss list --output json --query '[*].{"name":name,"resourceGroup":resourceGroup}'

    extractors:
      - type: json
        name: scaleSetList
        internal: true
        json:
          - '.[]'

  - engine:
      - sh
      - bash
    source: |
      az vmss show --name "$name" --resource-group "$resourceGroup" --query '{"AutomaticRepairsPolicyEnabled": automaticRepairsPolicy.enabled}'

    matchers-condition: and
    matchers:
      - type: word
        words:
          - '"AutomaticRepairsPolicyEnabled": null'

    extractors:
      - type: dsl
        dsl:
          - 'name + " in " + resourceGroup + " does not have automatic instance repairs enabled"'
