id: cleanweb-panel

info:
  name: CleanWeb 登录面板识别（指纹识别）
  author: righettod
  severity: info
  description: |-
    检测到目标站点存在 CleanWeb 相关响应特征。CleanWeb 是监控、日志、分析或可观测性系统，用于展示运行指标、告警事件、日志数据和服务状态。模板请求 `/`，并通过页面标题或正文关键字、状态码、DSL 条件确认该系统指纹，用于资产识别、系统盘点和暴露面梳理。
  reference:
    - https://tentelemed.com/
  metadata:
    verified: true
    max-request: 1
    shodan-query: http.title:"CleanWeb"
  tags: panel,cleanweb,login,detect,discovery
http:
  - method: GET
    path:
      - "{{BaseURL}}"

    redirects: true
    max-redirects: 4

    matchers:
      - type: dsl
        dsl:
          - 'status_code == 200'
          - 'contains_any(to_lower(body), "<title>cleanweb","logo cleanweb", "-cleanweb-")'
        condition: and

    extractors:
      - type: regex
        part: body
        group: 1
        regex:
          - 'title="version\s+([0-9A-Za-z\s\.\-]+)"'
