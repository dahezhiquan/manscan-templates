id: pronote-panel

info:
  name: PRONOTE 登录面板识别（暴露面识别）
  author: righettod
  severity: info
  description: |
    该模板通过识别 PRONOTE 登录入口的页面标题、特征文本或重定向行为，判断目标是否暴露了对应的认证界面。若命中，说明该登录面板对外可访问，可用于暴露面梳理与后续安全评估。
  reference:
    - https://www.index-education.com/fr/logiciel-gestion-vie-scolaire.php
  metadata:
    max-request: 1
    shodan-query: http.title:"PRONOTE"
  tags: panel,pronote,login,discovery

http:
  - method: GET
    path:
      - "{{BaseURL}}"

    host-redirects: true

    matchers:
      - type: dsl
        dsl:
          - 'status_code == 200'
          - 'contains_any(to_lower(body), "<title>pronote", "content=\"pronote\"")'
        condition: and

    extractors:
      - type: regex
        part: header
        group: 1
        regex:
          - '(?i)Server:\s+PRONOTE\s+([0-9.\s\-]+)'
