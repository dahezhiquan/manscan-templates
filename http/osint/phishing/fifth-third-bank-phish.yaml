id: fifth-third-bank-phish

info:
  name: Fifth Third Bank 仿冒钓鱼网站（钓鱼网站识别）
  author: rxerium
  severity: info
  description: |
    检测到疑似仿冒 Fifth Third Bank 的钓鱼网站。模板在目标页面返回 200、页面内容命中 Fifth Third Bank 的金融或支付页面特征，且当前主机不属于 53.com 官方域名时触发，用于识别借用 Fifth Third Bank 品牌页面诱导用户信任的仿冒站点。
  reference:
    - https://53.com
  metadata:
    max-request: 1
  tags: phishing,fifth-third-bank,bank,osint,discovery
http:
  - method: GET
    path:
      - "{{BaseURL}}"

    host-redirects: true
    max-redirects: 2

    matchers-condition: and
    matchers:
      - type: word
        words:
          - '<title>Personal Banking | Fifth Third Bank'

      - type: status
        status:
          - 200

      - type: dsl
        dsl:
          - '!contains(host,"53.com")'
