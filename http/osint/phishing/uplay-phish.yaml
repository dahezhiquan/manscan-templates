id: uplay-phish

info:
  name: Uplay 仿冒钓鱼网站（钓鱼网站识别）
  author: rxerium
  severity: info
  description: |
    检测到疑似仿冒 Uplay 的钓鱼网站。模板在目标页面返回 200、页面内容命中 Uplay 的品牌页面特征，且当前主机不属于 ubisoft.com 官方域名时触发，用于识别借用 Uplay 品牌页面诱导用户信任的仿冒站点。
  reference:
    - https://ubisoft.com
  metadata:
    max-request: 1
  tags: phishing,uplay,ubisoft,osint,discovery
http:
  - method: GET
    path:
      - "{{BaseURL}}"

    host-redirects: true
    max-redirects: 2

    matchers-condition: and
    matchers:
      - type: word
        words:
          - "Welcome to the official website for Ubisoft, creator of Assassin's Creed, Just Dance, Tom Clancy's video game series, Rayman, Far Cry, Watch Dogs and many others. Learn more about our breathtaking games here!"

      - type: status
        status:
          - 200

      - type: dsl
        dsl:
          - '!contains(host,"ubisoft.com")'
