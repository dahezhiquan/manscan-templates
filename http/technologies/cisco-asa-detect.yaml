id: cisco-asa-detect

info:
  name: Cisco ASA 指纹识别（指纹识别）
  author: sdcampbell
  severity: info
  description: Cisco ASA 是 Cisco 防火墙和 VPN 设备，用于网络边界安全、远程访问和访问控制。该模板请求首页，并依据 HTTP 200 状态码、页面标题、正文关键字或品牌资源特征识别目标是否使用或暴露了 Cisco ASA 相关组件，适用于资产盘点、技术栈识别和后续安全评估；命中结果仅表示指纹特征匹配，不代表已确认存在可利用漏洞。
  metadata:
    max-request: 1
  tags: tech,cisco,detect,discovery

http:
  - raw:
      - |
        GET / HTTP/1.1
        Host: {{Hostname}}
        X-Aggregate-Auth: 1

        TESTME

    matchers-condition: and
    matchers:
      - type: word
        part: body
        words:
          - 'config-auth client="vpn"'

      - type: status
        status:
          - 200

    extractors:
      - type: regex
        part: body
        group: 1
        regex:
          - "<version who=\"sg\">(.*?)</version>"
