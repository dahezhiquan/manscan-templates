id: versa-director-login

info:
  name: Versa Director 登录面板识别（暴露面识别）
  author: c-sh0,darses
  severity: info
  description: 该模板通过识别 Versa Director 登录入口的页面标题、特征文本或重定向行为，判断目标是否暴露了对应的认证界面。若命中，说明该登录面板对外可访问，可用于暴露面梳理与后续安全评估。
  reference:
    - https://versa-networks.com/products/components/
  classification:
    cvss-metrics: CVSS:3.0/AV:N/AC:L/PR:N/UI:N/S:U/C:N/I:N/A:N
    cwe-id: CWE-200
    cpe: cpe:2.3:a:versa-networks:versa_director:*:*:*:*:*:*:*:*
  metadata:
    verified: true
    max-request: 1
    shodan-query:
      - http.title:"Versa Director"
      - "Set-Cookie: VD-CSRF-TOKEN"
    fofa-query:
      - title="Versa Director"
      - "Set-Cookie: VD-CSRF-TOKEN"
    product: versa_director
    vendor: versa-networks
  tags: panel,versa,director,discovery

http:
  - method: GET
    path:
      - "{{BaseURL}}/versa/login"

    matchers-condition: and
    matchers:
      - type: word
        words:
          - "versa-login-logo"
          - "VERSA DIRECTOR"
        condition: or

      - type: status
        status:
          - 200
