id: azure-nsg-dns-unrestricted
info:
  name: Azure NSG 对互联网开放 DNS 端口 53（云安全）
  author: princechaddha
  severity: high
  description: DNS 服务使用 UDP/TCP 53 提供名称解析；将该端口对互联网开放会扩大解析服务的暴露面，并可能暴露内部域名、遭受递归滥用或被用于反射放大攻击。本模板查询入站允许的 TCP 或 UDP 53 NSG 规则，并在来源地址为 *、internet 或 any 时报告。
  impact: |
    - 外部攻击者可能枚举内部主机名和服务信息，或利用配置错误的解析器发起递归查询和反射流量。
    - DNS 服务被滥用或压垮后，应用可能出现解析失败、连接延迟和业务不可用。
  remediation: |
    - 仅向受信任的 DNS 客户端开放必要的 UDP/TCP 53 规则，关闭不需要的公网解析入口。
    - 禁止对互联网提供开放递归解析，使用分离 DNS、访问控制和查询速率限制降低滥用风险。
  reference:
    - https://docs.microsoft.com/en-us/azure/virtual-network/network-security-groups-overview
  metadata:
    vendor: microsoft
    product: azure-network-security-group
  tags: cloud,devops,azure,microsoft,nsg,azure-cloud-config

flow: |
  code(1);
  for (let NsgData of iterate(template.nsgdata)) {
    NsgData = JSON.parse(NsgData)
    set("nsg", NsgData.name)
    set("resourcegroup", NsgData.resourceGroup)
    code(2)
  }

self-contained: true
code:
  - engine:
      - sh
      - bash
    source: |
      az network nsg list --query '[*].{name:name, resourceGroup:resourceGroup}' --output json

    extractors:
      - type: json
        name: nsgdata
        internal: true
        json:
          - '.[]'

  - engine:
      - sh
      - bash
    source: |
      az network nsg rule list --nsg-name $nsg --resource-group $resourcegroup --query "[?direction=='Inbound' && access=='Allow' && (protocol=='TCP' || protocol=='UDP') && (destinationPortRange=='53')]"

    matchers:
      - type: word
        words:
          - '"sourceAddressPrefix": "*"'
          - '"sourceAddressPrefix": "internet"'
          - '"sourceAddressPrefix": "any"'

    extractors:
      - type: dsl
        dsl:
          - 'nsg + " has unrestricted access on TCP and UDP port 53"'
