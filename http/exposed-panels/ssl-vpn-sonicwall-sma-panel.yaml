id: ssl-vpn-sonicwall-sma-panel

info:
  name: SonicWall Secure Mobile Access (SMA) 登录面板识别（指纹识别）
  author: DhiyaneshDk
  severity: info
  description: |-
    SonicWall Secure Mobile Access (SMA) 是 SonicWall SMA 远程访问平台，用于 SSL VPN、用户认证和移动办公接入。该模板请求首页、`/workplace/home.action`，并依据页面标题、正文关键字或品牌资源特征、响应头特征识别目标是否部署了该系统或暴露了对应入口，适用于资产指纹确认；命中结果仅表示系统特征匹配，不代表已确认存在未授权访问或可利用漏洞。
  reference:
  - https://www.sonicwall.com/products/remote-access/
  - https://www.sonicwall.com/support/technical-documentation/?category=Secure%20Remote%20Access
  classification:
    cvss-metrics: CVSS:3.1/AV:N/AC:L/PR:N/UI:N/S:U/C:N/I:N/A:N
    cvss-score: 0.0
  metadata:
    verified: true
    max-request: 2
    shodan-query: html:“SonicWall SMA”
    fofa-query: body=“SonicWall SMA”
  tags: sonicwall,sma,ssl-vpn,vpn,tech,detect,login,panel

http:
  - method: GET
    path:
      - "{{BaseURL}}/"
      - "{{BaseURL}}/workplace/home.action"

    redirects: true
    max-redirects: 3

    stop-at-first-match: true

    matchers-condition: or
    matchers:
      - type: regex
        part: header
        regex:
          - '(?i)Server:\s*SMA/\d'

      - type: word
        part: header
        words:
          - "EXTRAWEB_REFERER"

      - type: word
        part: body
        words:
          - "/__extraweb__/"
          - "SonicWall"
        condition: and

    extractors:
      - type: regex
        part: header
        group: 1
        name: sma-version
        regex:
          - '(?i)Server:\s*(SMA/[\d.]+)'
