id: mapbox-token-disclosure

info:
  name: Mapbox 令牌暴露（暴露面识别）
  author: Devang-Solanki
  severity: medium
  description: |
    检测到目标站点响应中暴露 Mapbox 令牌。Mapbox Token 用于地图、地理编码、样式、瓦片和位置服务 API 调用。该模板检查`/geocoding/v5/mapbox.places/Los%20Angeles.json?access_token={{token}}`，并先在目标响应中提取疑似凭据，再通过对应服务 API 的响应特征辅助确认有效性。公开后可能导致对应平台资源、数据、流水线、消息发送、支付能力或第三方集成被未授权访问。
  impact: |-
    - 泄露的 API Key、访问令牌、客户端密钥、Webhook、连接串或服务账号凭据可能被用于直接调用对应平台 API 或访问受保护资源。
    - 攻击者可能借助有效凭据读取、修改或删除数据，触发构建/部署任务，发送消息，管理云资源，或冒用集成应用身份。
    - 即使令牌权限有限，也会暴露账号、项目、组织或环境边界，辅助横向移动、供应链攻击和定向社工。
  remediation: |-
    - 立即撤销并轮换暴露的 API Key、访问令牌、客户端密钥、Webhook Secret、连接串或服务账号凭据。
    - 在对应平台检查令牌权限、作用域、有效期和最近调用记录，移除不必要的高权限或长期凭据。
    - 将密钥迁移到密钥管理系统、受保护的 CI/CD 变量或运行时注入机制，避免写入前端页面、日志、源码和公开配置。
    - 启用最小权限、IP/来源限制、MFA、告警和审计日志，并排查是否存在未授权资源访问或数据变更。
  reference:
    - https://docs.gitguardian.com/secrets-detection/detectors/specifics/mapbox_token
    - https://github.com/zricethezav/gitleaks/blob/master/cmd/generate/config/rules/mapbox.go
    - https://docs.mapbox.com/api/accounts/tokens/#token-format
    - https://docs.mapbox.com/help/getting-started/access-tokens/
  metadata:
    verified: true
    max-request: 2
  tags: token,exposure,mapbox,vuln

flow: http(1) && http(2)

http:
  - method: GET
    path:
      - "{{BaseURL}}"

    matchers:
      - type: regex
        part: body
        name: token
        regex:
          - 'sk\.eyJ1Ijoi\w+\.[\w-]*'
        internal: true

  - raw:
      - |
        @Host: https://api.mapbox.com:443
        GET /geocoding/v5/mapbox.places/Los%20Angeles.json?access_token={{token}} HTTP/1.1
        Host: api.mapbox.com

    disable-path-automerge: true
    matchers:
      - type: dsl
        dsl:
          - 'status_code == 200'
          - 'contains_all(body, "type","query","features")'
        condition: and

    extractors:
      - type: dsl
        dsl:
          - token
