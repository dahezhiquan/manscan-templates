id: gcloud-vertexai-auto-upgrades

info:
  name: Automatic Upgrades 未Enabled 的Vertex AI Notebooks（云安全）
  author: princechaddha
  severity: medium
  description: Vertex AI Workbench/Notebook 未启用自动升级时，实例镜像和组件可能长期停留在包含已知漏洞的版本。本模板检查 gceSetup.metadata.notebook-upgrade-schedule，返回 null 时报告自动升级未启用。
  impact: |
    - Notebook 运行环境可能缺少安全补丁，增加被利用、凭据泄露或数据集被访问的风险。
    - 手工升级容易遗漏，导致不同项目中的 AI 开发环境安全基线不一致。
  remediation: |
    - 为 Vertex AI notebook 配置 automatic upgrades 或定期维护升级计划。
    - 对不能自动升级的实例建立补丁窗口、负责人和例外复核流程。
  reference:
    - https://www.trendmicro.com/cloudoneconformity/knowledge-base/gcp/VertexAI/enable-auto-upgrades.html
    - https://cloud.google.com/vertex-ai/docs/workbench/user-managed/manage-instance
  metadata:
    vendor: google
    product: vertex-ai
  tags: cloud,devops,gcp,gcloud,vertexai,security,upgrades,gcp-cloud-config,ai

flow: |
  code(1)
  for(let projectId of iterate(template.projectIds)){
    set("projectId", projectId)
    code(2)
  }

self-contained: true

code:
  - engine:
      - sh
      - bash
    source: |
      gcloud projects list --format="json(projectId)"

    extractors:
      - type: json
        name: projectIds
        internal: true
        json:
          - '.[].projectId'

  - engine:
      - sh
      - bash
    source: |
      gcloud workbench instances describe tm-vertex-ai-notebook-instance --location=us-central1-a --project=$projectId --format="yaml(gceSetup.metadata.notebook-upgrade-schedule)"

    matchers:
      - type: word
        words:
          - "null"

    extractors:
      - type: dsl
        dsl:
          - '"Project " + projectId + " has Vertex AI notebook instances without automatic upgrades enabled"'
