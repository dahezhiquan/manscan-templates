id: weak-csp-detect

info:
  name: 弱 Content Security Policy 配置
  author: pussycat0x,celbahraoui
  severity: low
  description: |-
    该模板用于核查弱 Content Security Policy 配置。目标安全响应头或前端消息通信策略配置过宽，可能削弱浏览器侧防护。模板访问 目标入口，并根据响应头策略或页面脚本中的通配来源特征判断配置是否薄弱。
  reference:
    - https://developer.mozilla.org/en-US/docs/Web/HTTP/Headers/Content-Security-Policy/frame-ancestors
    - https://developer.mozilla.org/en-US/docs/Web/HTTP/Headers/Content-Security-Policy/script-src
    - https://developer.mozilla.org/en-US/docs/Web/HTTP/Headers/Content-Security-Policy/object-src
    - https://content-security-policy.com/
  classification:
    cwe-id: CWE-693
  metadata:
    max-request: 1
    verified: true
  tags: csp,misconfig,headers
  impact: |-
    - 弱 CSP 可能降低跨站脚本防护效果，弱 HSTS 可能增加降级或中间人攻击面。
    - 通配 `postMessage` 来源可能允许不可信页面接收敏感消息或触发前端逻辑。
  remediation: |-
    - 为 CSP 设置明确的脚本、样式、连接和 frame 来源，避免使用不必要的通配符。
    - 配置包含合理 `max-age`、`includeSubDomains` 和 `preload` 的 HSTS 策略。
    - 对 `postMessage` 明确校验 `origin` 和消息结构，避免向 `*` 发送敏感数据。
http:
  - method: GET
    path:
      - "{{BaseURL}}"

    matchers-condition: or
    matchers:
      - type: dsl
        name: missing-script-src
        dsl:
          - "contains(to_lower(header), 'content-security-policy:')"
          - "!contains(to_lower(header), 'script-src')"
          - "!contains(to_lower(header), 'default-src')"
        condition: and

      - type: dsl
        name: missing-object-src
        dsl:
          - "contains(to_lower(header), 'content-security-policy:')"
          - "!contains(to_lower(header), 'object-src')"
          - "!contains(to_lower(header), 'default-src')"
        condition: and

      - type: dsl
        name: unsafe-script-src
        dsl:
          - "contains(to_lower(header), 'content-security-policy:')"
          - "regex('(?i)script-src[^;]*(unsafe-inline|unsafe-eval|unsafe-hashes|\\\\*|data:|blob:)', header)"
        condition: and

      - type: dsl
        name: unsafe-default-src
        dsl:
          - "contains(to_lower(header), 'content-security-policy:')"
          - "regex('(?i)default-src[^;]*(unsafe-inline|unsafe-eval|unsafe-hashes|\\\\*|data:|blob:)', header)"
        condition: and

    extractors:
      - type: regex
        part: header
        name: csp-header
        group: 1
        regex:
          - "(?i)content-security-policy:\\s*([^\\r\\n]+)"
