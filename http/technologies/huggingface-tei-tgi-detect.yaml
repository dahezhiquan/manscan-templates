id: huggingface-tei-tgi-detect

info:
  name: HuggingFace TEI 与 TGI 检测（指纹识别）
  author: insidetrust,hdm
  severity: info
  description: |-
    检测 HuggingFace 文本嵌入推理服务（TEI，一个用于提供文本嵌入与重排序模型服务的工具包）以及 HuggingFace 文本生成推理服务（TGI，一个基于 Rust/Python、用于部署和服务大语言模型的工具包）是否存在。
  reference:
    - https://github.com/huggingface/text-embeddings-inference
    - https://github.com/huggingface/text-generation-inference
    - https://huggingface.co/docs/text-embeddings-inference/index
  metadata:
    verified: true
    max-request: 1
    vendor: huggingface
    product: text-embeddings-inference
  tags: tech,detect,tei,tgi,llm

http:
  - method: GET
    path:
      - "{{BaseURL}}/info"

    matchers-condition: and
    matchers:
      - type: word
        part: body
        words:
          - '"model_id"'
        condition: and

      - type: dsl
        dsl:
          - 'contains(content_type, "application/json")'
          - 'status_code == 200'
          - 'contains(body, "\"model_type\"") && contains(body, "\"embedding\"") || contains(body, "\"text-generation-router\"")'
        condition: and

    extractors:
      - type: regex
        name: version
        part: body
        group: 1
        regex:
          - '"version"\s*:\s*"([0-9][0-9A-Za-z.\-+]*)"'

      - type: regex
        name: model_id
        part: body
        group: 1
        regex:
          - '"model_id"\s*:\s*"([^"]+)"'
