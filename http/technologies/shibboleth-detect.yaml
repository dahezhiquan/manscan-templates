id: shibboleth-detect

info:
  name: Shibboleth SSO 指纹识别（指纹识别）
  author: rxerium
  severity: info
  description: >-
    Shibboleth 是基于 SAML 的单点登录和身份联合系统，用于教育、科研和企业身份认证场景。该模板通过请求目标服务并检查预设路径或首页响应、页面正文关键字、状态码等指纹特征，判断目标是否使用或暴露了
    Shibboleth SSO 相关组件；命中结果仅表示指纹特征匹配，可用于资产盘点、技术栈识别和后续安全评估，不代表已确认存在可利用漏洞。
  reference:
  - https://www.shibboleth.net/
  metadata:
    verified: true
    max-request: 1
    shodan-query: http.title:"Shibboleth IdP"
  tags: shibboleth,sso,detect,tech,discovery
http:
  - method: GET
    path:
      - "{{BaseURL}}"
      - "{{BaseURL}}/shibboleth-idp"

    stop-at-first-match: true

    host-redirects: true
    max-redirects: 2

    matchers-condition: and
    matchers:
      - type: word
        part: body
        words:
          - '<title>Shibboleth IdP</title>'
        case-insensitive: true

      - type: status
        status:
          - 200
