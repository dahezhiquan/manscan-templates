id: credential-guard-disabled

info:
  name: Credential Guard 未启用（本地基线扫描）
  author: princechaddha
  severity: high
  description: |
    未启用时，凭据材料更容易被内存抓取工具访问。对应基线项为“Windows Defender Credential Guard 是否未启用”；模板查询 `Win32_DeviceGuard` 状态，检查 Credential Guard、Device Guard 或 VBS 安全服务是否配置并运行。
  impact: |
    - 攻击者在入侵主机后更容易转储凭据并进行横向移动。
    - 凭据保护不足会增加横向移动、远程登录和离线破解风险。
  remediation: |
    - 在支持的系统上启用 Credential Guard、虚拟化安全和相关组策略。
    - 变更策略后清理历史凭据，并轮换可能受影响的账户密码。
  tags: credential-guard,code,windows-audit

self-contained: true

code:
  - pre-condition: |
      IsWindows();
    engine:
      - powershell
      - powershell.exe
    args:
      - -ExecutionPolicy
      - Bypass
    pattern: "*.ps1"
    source: |
      Get-CimInstance -ClassName Win32_DeviceGuard -Namespace root\Microsoft\Windows\DeviceGuard

    matchers-condition: and
    matchers:
      - type: word
        words:
          - "AvailableSecurityProperties"

      - type: word
        words:
          - "Credential Guard"
        negative: true
