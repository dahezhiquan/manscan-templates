id: traccar-settings-disclosure

info:
  name: Traccar 服务器 Settings 泄露
  author: DhiyaneshDk
  severity: low
  description: |
    检测到 Traccar 服务器 Settings 泄露。目标功能在未认证状态下可访问，可能暴露管理入口、业务数据、系统状态或可执行操作，需确认是否存在访问控制缺失。
  reference:
    - https://www.traccar.org/api-reference/
  metadata:
    verified: true
    max-request: 1
    shodan-query: title:"Traccar"
  tags: traccar,disclosure,unauth,misconfig,vuln

http:
  - method: GET
    path:
      - "{{BaseURL}}/api/server"

    matchers-condition: and
    matchers:
      - type: word
        part: body
        words:
          - '"version":'
          - '"forceSettings":'
        condition: and

      - type: word
        part: content_type
        words:
          - 'application/json'

      - type: status
        status:
          - 200
