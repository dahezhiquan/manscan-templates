id: gcloud-vertexai-secure-boot

info:
  name: Secure Boot 未Enabled 的Vertex AI Notebooks（云安全）
  author: princechaddha
  severity: medium
  description: Secure Boot 可阻止未签名或被篡改的启动组件加载，Vertex AI notebook 未启用时启动链可信度降低。本模板检查 gceSetup.shieldedInstanceConfig.enableSecureBoot，输出包含 shieldedInstanceConfig 空对象时报告 Secure Boot 未启用。
  impact: |
    - 启动链被篡改或加载未授权内核组件时，实例缺少关键防护。
    - Notebook 处理模型、数据和凭据时，底层运行环境可信度下降。
  remediation: |
    - 为 Vertex AI notebook 启用 Shielded VM Secure Boot。
    - 对依赖自定义内核或驱动的场景先完成兼容性验证，并记录例外审批。
  reference:
    - https://www.trendmicro.com/cloudoneconformity/knowledge-base/gcp/VertexAI/enable-secure-boot.html
    - https://cloud.google.com/vertex-ai/docs/workbench/user-managed/manage-instance
  metadata:
    vendor: google
    product: vertex-ai
  tags: cloud,devops,gcp,gcloud,vertexai,security,secure-boot,gcp-cloud-config,ai

flow: |
  code(1)
  for(let projectId of iterate(template.projectIds)){
    set("projectId", projectId)
    code(2)
  }

self-contained: true

code:
  - engine:
      - sh
      - bash
    source: |
      gcloud projects list --format="json(projectId)"

    extractors:
      - type: json
        name: projectIds
        internal: true
        json:
          - '.[].projectId'

  - engine:
      - sh
      - bash
    source: |
      gcloud workbench instances describe tm-vertex-ai-notebook-instance --location=us-central1-a --project=$projectId --format="yaml(gceSetup.shieldedInstanceConfig.enableSecureBoot)"

    matchers:
      - type: word
        words:
          - "shieldedInstanceConfig: {}"

    extractors:
      - type: dsl
        dsl:
          - '"Project " + projectId + " has Vertex AI notebook instances without Secure Boot enabled"'
