id: hugegraph-studio-detect

info:
  name: HugeGraph Studio 指纹识别（指纹识别）
  author: pussycat0x
  severity: info
  description: >-
    HugeGraph Studio 是 HugeGraph 的 Web 管理与可视化工具，用于管理图数据库、执行查询和查看图数据。该模板通过请求目标服务并检查预设路径或首页响应、页面正文关键字、状态码等指纹特征，判断目标是否使用或暴露了
    HugeGraph Studio 相关组件；命中结果仅表示指纹特征匹配，可用于资产盘点、技术栈识别和后续安全评估，不代表已确认存在可利用漏洞。
  reference:
  - https://github.com/hugegraph/hugegraph-studio
  metadata:
    verified: true
    max-request: 1
    fofa-query: app="HugeGraph-Studio"
  tags: hugegraph,studio,detect,tech,discovery
http:
  - method: GET
    path:
      - "{{BaseURL}}"

    matchers-condition: and
    matchers:
      - type: word
        part: body
        words:
          - "<title>HugeGraph Studio"

      - type: status
        status:
          - 200
