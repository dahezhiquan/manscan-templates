id: adiscon-loganalyzer

info:
  name: Adiscon LogAnalyzer - 信息泄露（暴露面识别）
  author: geeknik
  severity: high
  description: 该模板用于识别 Adiscon LogAnalyzer 相关暴露入口或页面特征。若命中，说明目标可能对外公开了可访问的管理或信息接口，存在进一步泄露系统信息、配置数据或服务细节的风险。
  reference:
    - https://loganalyzer.adiscon.com/
  classification:
    cvss-metrics: CVSS:3.1/AV:N/AC:L/PR:N/UI:N/S:U/C:H/I:N/A:N
    cvss-score: 7.5
    cwe-id: CWE-200
    cpe: cpe:2.3:a:adiscon:loganalyzer:*:*:*:*:*:*:*:*
  metadata:
    max-request: 1
    vendor: adiscon
    product: loganalyzer
  tags: adiscon,loganalyzer,syslog,exposure,panel,discovery

http:
  - method: GET
    path:
      - '{{BaseURL}}'

    matchers-condition: and
    matchers:
      - type: word
        part: body
        words:
          - 'Adiscon LogAnalyzer'
          - 'value="SYSLOG"'
          - 'value="EVTRPT"'
          - 'value="WEBLOG"'
        condition: and

      - type: status
        status:
          - 200

      - type: word
        part: header
        words:
          - 'text/html'
