id: maven-settings-xml-exposure

info:
  name: Apache Maven settings.xml 凭据暴露（暴露面识别）
  author: ChrisJr404
  severity: high
  description: |-
    检测到 Apache Maven 的 settings.xml 文件已暴露。该文件的 server 部分存储了 Maven 用于向远程仓库和分发服务器认证的凭据，因此公开副本可能泄漏仓库的用户名和密码。
  reference:
    - https://maven.apache.org/settings.html
    - https://maven.apache.org/guides/mini/guide-encryption.html
  classification:
    cvss-metrics: CVSS:3.1/AV:N/AC:L/PR:N/UI:N/S:U/C:H/I:N/A:N
    cvss-score: 7.5
    cwe-id: CWE-522
  metadata:
    verified: false
    max-request: 3
    google-query: intitle:"index of" "settings.xml" "maven.apache.org/SETTINGS"
  tags: exposure,config,maven,java,credentials,files

http:
  - method: GET
    path:
      - "{{BaseURL}}/settings.xml"
      - "{{BaseURL}}/.m2/settings.xml"
      - "{{BaseURL}}/conf/settings.xml"

    stop-at-first-match: true

    matchers:
      - type: dsl
        dsl:
          - 'status_code == 200'
          - 'contains_all(body, "maven.apache.org/SETTINGS", "<server>", "<password>")'
          - '!contains_any(tolower(body), "<html", "<!doctype", "<script", "<meta", "application/json", "application/javascript", "image/", "mongodb over http")'
        condition: and

    extractors:
      - type: regex
        part: body
        group: 1
        regex:
          - '<username>([^<]+)</username>'
