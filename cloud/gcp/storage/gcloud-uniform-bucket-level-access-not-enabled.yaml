id: gcloud-uniform-bucket-level-access-not-enabled

info:
  name: Enable Uniform Bucket-Level 访问 的Cloud Storage Buckets（云安全）
  author: princechaddha
  severity: medium
  description: Uniform bucket-level access 可统一使用 IAM 管理对象访问，避免对象 ACL 与 IAM 混用带来的权限盲区。本模板执行 gsutil uniformbucketlevelaccess get，返回 Enabled 为 False 时报告未启用统一桶级访问。
  impact: |
    - 对象 ACL 可能产生难以发现的单对象公开或越权访问，削弱集中权限治理。
    - IAM 与 ACL 混用会增加权限审计、故障排查和合规证明复杂度。
  remediation: |
    - 启用 uniform bucket-level access，并迁移依赖对象 ACL 的应用到 IAM 授权模型。
    - 配合 Public Access Prevention 和最小权限角色定期审计 bucket 访问控制。
  reference:
    - https://cloud.google.com/storage/docs/uniform-bucket-level-access
  metadata:
    vendor: google
    product: cloud-storage
  tags: cloud,devops,gcp,gcloud,google-cloud-storage,security,access-control,gcp-cloud-config

flow: |
  code(1)
  for(let projectId of iterate(template.projectIds)){
    set("projectId", projectId)
    code(2)
    for(let bucketName of iterate(template.buckets)){
      set("bucketName", bucketName)
      code(3)
    }
  }

self-contained: true

code:
  - engine:
      - sh
      - bash
    source: |
      gcloud projects list --format="json(projectId)"

    extractors:
      - type: json
        name: projectIds
        internal: true
        json:
          - '.[].projectId'

  - engine:
      - sh
      - bash
    source: |
      gsutil ls -p $projectId | jq -R . | jq -s .

    extractors:
      - type: json
        name: buckets
        internal: true
        json:
          - '.[]'

  - engine:
      - sh
      - bash
    source: |
      gsutil uniformbucketlevelaccess get $bucketName

    matchers:
      - type: word
        words:
          - 'Enabled: False'

    extractors:
      - type: dsl
        dsl:
          - '"Uniform bucket-level access is not enabled for the bucket " + bucketName + " in project " + projectId'
