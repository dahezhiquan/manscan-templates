id: idea-folder-exposure

info:
  name: .idea 目录敏感文件泄露（暴露面识别）
  author: martincodes-de
  severity: info
  description: 检测到对外可访问的 .idea 目录敏感文件。相关文件可能泄露项目结构、依赖关系、部署细节、敏感参数或其他不应公开的内部信息。
  metadata:
    max-request: 2
  tags: phpstorm,jetbrains,idea,exposure,files,vuln

http:
  - method: GET
    path:
      - "{{BaseURL}}/.idea/deployment.xml"
      - "{{BaseURL}}/.idea/workspace.xml"

    matchers-condition: and
    matchers:
      - type: status
        status:
          - 200

      - type: word
        words:
          - "<?xml version="
          - "<project version"
        part: body
        condition: and
