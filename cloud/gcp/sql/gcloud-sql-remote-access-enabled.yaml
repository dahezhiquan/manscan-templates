id: gcloud-sql-remote-access-enabled

info:
  name: SQL Server 数据库实例启用了远程访问（云安全）
  author: princechaddha
  severity: high
  description: SQL Server remote access 允许从本地或远程服务器执行远程存储过程调用，现代环境通常不应启用。本模板检查 Cloud SQL SQL Server 实例 databaseFlags 中 remote access 的值，匹配 on 时报告远程访问已启用。
  impact: |
    - 被攻破账号可能利用远程调用能力扩大数据库间或服务器间操作范围。
    - 该功能增加攻击面和审计复杂度，可能引入非预期的远程执行路径。
  remediation: |
    - 关闭 SQL Server remote access flag，除非存在明确且受控的兼容性需求。
    - 对必须启用的场景限制账号权限、调用来源和审计规则，并定期复核业务必要性。
  reference:
    - https://cloud.google.com/sql/docs/sqlserver/configure-instance-settings
  metadata:
    vendor: google
    product: cloud-sql
  tags: cloud,devops,gcp,gcloud,google-cloud-sql,mssql,gcp-cloud-config

flow: |
  code(1)
  for(let projectId of iterate(template.projectIds)){
    set("projectId", projectId)
    code(2)
    for(let sqlInstance of iterate(template.sqlInstances)){
      set("sqlInstance", sqlInstance)
      code(3)
    }
  }

self-contained: true

code:
  - engine:
      - sh
      - bash
    source: |
      gcloud projects list --format="json(projectId)"

    extractors:
      - type: json
        name: projectIds
        internal: true
        json:
          - '.[].projectId'

  - engine:
      - sh
      - bash
    source: |
      gcloud sql instances list --project $projectId --filter='DATABASE_VERSION:SQLSERVER*' --format="json(name)"

    extractors:
      - type: json
        name: sqlInstances
        internal: true
        json:
          - '.[].name'

  - engine:
      - sh
      - bash
    source: |
      gcloud sql instances describe $sqlInstance --format=json | jq '.settings.databaseFlags // [] | .[] | select(.name=="remote access") | .value'

    matchers:
      - type: word
        words:
          - 'on'

    extractors:
      - type: dsl
        dsl:
          - '"Remote Access is enabled for SQL instance " + sqlInstance + " in project " + projectId'
