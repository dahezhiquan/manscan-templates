id: unauth-esphome

info:
  name: ESPHome Web 服务器 访问 未授权 访问
  author: pussycat0x
  severity: high
  description: |
    检测到 ESPHome Web 服务器 访问 未授权 访问。目标功能在未认证状态下可访问，可能暴露管理入口、业务数据、系统状态或可执行操作，需确认是否存在访问控制缺失。
  reference:
    - https://esphome.io/components/web_server/
  metadata:
    verified: true
    max-request: 1
    shodan-query: http.title:"ESPHome"
  tags: esphome,iot,unauth,misconfig,vuln

http:
  - method: GET
    path:
      - "{{BaseURL}}"

    matchers:
      - type: dsl
        dsl:
          - 'status_code == 200'
          - 'contains(body, "<title>Dashboard - ESPHome")'
        condition: and
