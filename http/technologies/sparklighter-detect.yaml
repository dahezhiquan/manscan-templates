id: sparklighter-detect

info:
  name: Spark Lighter 指纹识别（指纹识别）
  author: icarot
  severity: info
  description: |
    用于识别目标是否运行 Spark Lighter，模板会结合 favicon 哈希、页面标题、页面正文、状态码和特定路径或已知端点进行服务指纹匹配。
  classification:
    cpe: cpe:2.3:a:apache:spark:*:*:*:*:*:*:*:*
  metadata:
    verified: true
    max-request: 1
    vendor: apache
    product: spark
    category: productivity
    shodan-query:
      - http.html:"/apps/imt/html/"
      - http.title:"spark master at"
    fofa-query:
      - title="spark master at"
      - body="/apps/imt/html/"
    google-query: intitle:"spark master at"
  tags: tech,lighter,spark,detect,apache,discovery

http:
  - method: GET
    path:
      - "{{BaseURL}}/lighter/api"

    matchers-condition: and
    matchers:
      - type: word
        part: body
        words:
          - '<title>Lighter</title>'
          - '/lighter/favicon.svg'
        condition: and

      - type: status
        status:
          - 200
