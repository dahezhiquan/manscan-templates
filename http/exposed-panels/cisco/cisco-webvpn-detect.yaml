id: cisco-webvpn-detect

info:
  name: Cisco WebVPN 面板识别（暴露面识别）
  author: ricardomaia
  severity: info
  description: 该模板通过识别 Cisco WebVPN 面板、控制台或管理界面的页面特征，判断目标是否暴露了对应服务入口。若命中，说明该后台或运维界面对外可访问，可用于资产识别与暴露面排查。
  reference:
    - https://askanydifference.com/difference-between-cisco-clientless-ssl-vpn-and-anyconnect-with-table/
  classification:
    cvss-metrics: CVSS:3.0/AV:N/AC:L/PR:N/UI:N/S:U/C:N/I:N/A:N
    cwe-id: CWE-200
  metadata:
    verified: true
    max-request: 2
    fofa-query: fid="U1TP/SJklrT9VLIEpZkQNg=="
    google-query: intitle:"SSLVPN Service"
  tags: panel,cisco,vpn,discovery

http:
  - method: GET
    path:
      - "{{BaseURL}}"
      - "{{BaseURL}}/webvpn.html"

    host-redirects: true
    max-redirects: 2
    stop-at-first-match: true

    matchers-condition: and
    matchers:
      - type: word
        part: body
        words:
          - "CISCO"
          - "AnyConnect"
          - "SSLVPN Service"
        condition: or
        case-insensitive: true

      - type: regex
        part: header
        regex:
          - "webvpncontext=00@.+"
          - "webvpn="
        condition: or
