id: chatbot-botpress-panel

info:
  name: Botpress Admin 面板识别（指纹识别）
  author: rxerium
  severity: info
  description: |-
    检测到目标站点存在 Botpress Admin 相关响应特征。Botpress Admin 是 AI、LLM 或机器学习相关平台，用于管理模型、数据集、工作区、推理服务或可观测性信息。模板请求 `/admin`，并通过页面标题或正文关键字、状态码确认该系统指纹，用于资产识别、系统盘点和暴露面梳理。
  reference:
    - https://github.com/botpress/botpress
    - https://botpress.com/
  metadata:
    verified: true
    max-request: 1
    vendor: botpress
    product: botpress
    shodan-query: 'http.html:"@botpress/ui-admin"'
  tags: panel,botpress,chatbot,ai,detect,discovery
http:
  - method: GET
    path:
      - "{{BaseURL}}/admin"

    host-redirects: true
    max-redirects: 2

    matchers-condition: and
    matchers:
      - type: word
        part: body
        words:
          - '@botpress/ui-admin'
          - 'webpackJsonp'
        condition: and

      - type: status
        status:
          - 200
