id: ecology-mysql-config

info:
  name: Fanwei OA E-Office - 信息泄露漏洞
  author: ritikchaddha
  severity: medium
  description: Fanwei OA E-Office - 信息泄露 存在信息泄露漏洞。该模板依据实际请求路径、返回特征与命中证据验证目标是否暴露相应漏洞。
  metadata:
    verified: true
    max-request: 1
    fofa-query: app="泛微-EOffice"
  tags: fanwei,ecology,exposure,config,vuln

http:
  - method: GET
    path:
      - "{{BaseURL}}/mysql_config.ini"

    matchers-condition: and
    matchers:
      - type: word
        part: body
        words:
          - "dataurl"
          - "datapassword"
          - "datauser"
        condition: and

      - type: word
        part: header
        words:
          - text/plain

      - type: status
        status:
          - 200
