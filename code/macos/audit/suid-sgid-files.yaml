id: suid-sgid-files

info:
  name: macOS SUID/SGID 文件检测（本地基线扫描）
  author: geeknik
  severity: high
  description: |
    该模板检查用户可写目录中的 SUID/SGID 文件。此类文件若可被低权限用户影响，可能形成提权入口。
  impact: |
    本地攻击者可能篡改可自动执行或高权限相关文件，造成持久化、权限提升或配置破坏。
  remediation: |
    收紧相关文件或目录权限，移除全局可写位，确保关键配置仅由 root 或授权管理员维护。
  tags: macos,audit,local,security,privesc

self-contained: true

code:
  - engine:
      - sh
      - bash
    source: |
      find /usr/local /opt /Applications -perm -4000 -o -perm -2000 -type f -ls 2>/dev/null
    matchers:
      - type: regex
        regex:
          - "^-rws.*"
          - "^-..s.*"
