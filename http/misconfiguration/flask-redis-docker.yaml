id: flask-redis-docker

info:
  name: Flask Redis Queue Docker 暴露
  author: DhiyaneshDk
  severity: low
  description: |
    该模板用于核查 Flask Redis Queue Docker 暴露。该类问题通常源于容器、CI/CD、注册表、服务发现或运维 API 暴露在公网且缺少访问控制。模板会向目标发送探测请求，并依据请求 ``、匹配 `<title>Flask + Redis Queue + Docker</title>`、状态码 200等证据确认目标是否存在该配置问题。
  impact: |
    - 攻击者可查看镜像、容器、任务、节点、配置、构建流水线或运行状态。
    - 若接口允许操作，可能导致容器创建、任务执行、镜像篡改、配置泄露或集群接管。
  remediation: |
    - 禁止将运维 API、容器接口和注册表直接暴露到公网。
    - 启用 TLS、认证授权、来源限制和最小权限访问策略。
    - 审计镜像、容器、任务和访问日志，清理未知资源并轮换相关令牌。
  reference:
    - https://www.facebook.com/photo/?fbid=623621413141715&set=a.467014098802448
  metadata:
    verified: true
    max-request: 1
    shodan-query: title:"Flask + Redis Queue + Docker"
  tags: misconfig,exposure,flask,redis,docker,vuln

http:
  - method: GET
    path:
      - "{{BaseURL}}"

    host-redirects: true
    max-redirects: 2

    matchers-condition: and
    matchers:
      - type: word
        part: body
        words:
          - '<title>Flask + Redis Queue + Docker</title>'

      - type: status
        status:
          - 200
