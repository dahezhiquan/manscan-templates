id: smb-version-detect

info:
  name: SMB 版本识别（指纹识别）
  author: pussycat0x
  severity: low
  description: |
    SMB 是 Windows 文件共享、打印共享和域环境访问常用协议，服务端会在协商阶段声明支持的协议方言。该模板发起 SMB 协商并提取 Version.VerString 字段，用于识别目标 SMB 服务支持的协议版本指纹。
  metadata:
    max-request: 1
    shodan-query: "port:445"
  tags: js,network,smb,enum,discovery,detect

javascript:
  - pre-condition: |
      isPortOpen(Host,Port);
    code: |
      let m = require("nuclei/smb");
      let c = new m.SMBClient();
      let response = c.ConnectSMBInfoMode(Host, Port);
      Export(response);

    args:
      Host: "{{Host}}"
      Port: "445"

    extractors:
      - type: json
        name: smb-version
        json:
          - '.Version.VerString'
