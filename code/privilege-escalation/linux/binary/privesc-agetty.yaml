id: privesc-agetty

info:
  name: agetty 可被滥用进行本地提权（本地基线扫描）
  author: bobakabill
  severity: high
  description: |
    该模板基于 GTFOBins 思路检测 `agetty` 是否可在本地被滥用于提权。模板会对比当前用户与直接/通过 sudo 执行 `agetty` 后的身份，判断该二进制是否可能以 root 权限运行命令。
  reference:
    - https://gtfobins.github.io/gtfobins/agetty/
  metadata:
    verified: true
    max-request: 2
  tags: code,linux,find,privesc,local

self-contained: true
code:
  - engine:
      - sh
      - bash
    source: |
     find /bin /sbin /usr/bin /usr/sbin /usr/local/sbin -type f -name agetty 2>/dev/null -perm /4000
     find /bin /sbin /usr/bin /usr/sbin /usr/local/sbin -type f -name agetty 2>/dev/null -perm /6000

    matchers:
      - type: word
        words:
          - "agetty"
