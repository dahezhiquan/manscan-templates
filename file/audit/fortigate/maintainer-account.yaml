id: maintainer-account

info:
  name: FortiGate Maintainer 账户配置检测（本地文件安全扫描）
  author: pussycat0x
  severity: info
  description: |
    该模板检测 FortiGate maintainer 账户相关配置。该账户用于特定恢复场景，若策略不当可能带来物理访问下的管理风险。
  reference:
    - https://docs.fortinet.com/document/fortigate/6.4.0/hardening-your-fortigate/612504/hardening-your-fortigate
  classification:
    cvss-metrics: CVSS:3.1/AV:N/AC:L/PR:N/UI:N/S:U/C:N/I:N/A:N
    cvss-score: 0
    cwe-id: CWE-200
  tags: audit,config,file,firewall,fortigate

file:
  - extensions:
      - conf

    matchers-condition: and
    matchers:
      - type: word
        words:
          - "set admin-maintainer"
        negative: true

      - type: word
        words:
          - "config system"
          - "config router"
          - "config firewall"
        condition: or
