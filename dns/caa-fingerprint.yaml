id: caa-fingerprint

info:
  name: CAA 记录识别（dns）
  author: pdteam
  severity: info
  description: |
    该模板检测域名是否存在 CAA 记录。CAA 记录用于声明哪些证书颁发机构可以为该域名签发证书，有助于降低误签发风险。
  reference:
    - https://support.dnsimple.com/articles/caa-record/#whats-a-caa-record
  classification:
    cwe-id: CWE-200
  metadata:
    max-request: 1
  tags: dns,caa,discovery

dns:
  - name: "{{FQDN}}"
    type: CAA
    matchers:
      - type: regex
        regex:
          - "IN\\s+CAA\\s+(.+)"

    extractors:
      - type: regex
        group: 1
        regex:
          - 'issue "(.*)"'
          - 'issuewild "(.*)"'
          - 'iodef "(.*)"'
