id: eslint-ignore-exposure

info:
  name: Eslint Ignore 文件 暴露
  author: DhiyaneshDk
  severity: low
  description: |
    检测到 Eslint Ignore 文件 暴露。目标响应或文件中可能暴露配置、凭据、密钥、令牌、环境变量或历史记录等敏感信息，可能被用于进一步入侵。
  reference:
    - https://eslint.org/docs/latest/use/configure/ignore
  metadata:
    max-request: 1
    shodan-query: html:"eslintignore"
  tags: eslintignore,misconfig,vuln

http:
  - method: GET
    path:
      - "{{BaseURL}}/.eslintignore"

    matchers-condition: and
    matchers:
      - type: word
        part: body
        words:
          - 'xtscancodes.js'

      - type: word
        part: content_type
        words:
          - "application/octet-stream"

      - type: status
        status:
          - 200
