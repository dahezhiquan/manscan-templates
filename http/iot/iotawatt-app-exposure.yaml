id: iotawatt-app-exposure

info:
  name: IoTaWatt 配置应用暴露（IOT）
  author: pussycat0x
  severity: high
  description: |
    检测到 IoTaWatt 能源监测器配置应用暴露。未授权访问该配置界面可能允许攻击者修改上传目标或连接第三方能源网站、数据库的参数。
  reference:
    - https://docs.iotawatt.com/en/master/passConfig.html
  classification:
    cvss-metrics: CVSS:3.0/AV:N/AC:L/PR:N/UI:N/S:C/C:L/I:L/A:L
    cvss-score: 8.3
    cwe-id: CWE-522
  metadata:
    max-request: 1
    fofa-query: app="IoTaWatt-Configuration-app"
  tags: iot,exposure,vuln,discovery

http:
  - method: GET
    path:
      - "{{BaseURL}}"

    matchers-condition: and
    matchers:
      - type: word
        part: body
        words:
          - '<h3>Configure IoTaWatt Device</h3>'
          - '<title>IoTaWatt Configuration app</title>'
        condition: and

      - type: status
        status:
          - 200
