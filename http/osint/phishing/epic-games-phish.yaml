id: epic-games-phish

info:
  name: Epic Games 仿冒钓鱼网站（钓鱼网站识别）
  author: rxerium
  severity: info
  description: |
    检测到疑似仿冒 Epic Games 的钓鱼网站。模板在目标页面返回 200、页面内容命中 Epic Games 的品牌页面特征，且当前主机不属于 epicgames.com 官方域名时触发，用于识别借用 Epic Games 品牌页面诱导用户信任的仿冒站点。
  reference:
    - https://epicgames.com
  metadata:
    max-request: 1
  tags: phishing,epic-games,osint,discovery
http:
  - method: GET
    path:
      - "{{BaseURL}}"

    host-redirects: true
    max-redirects: 2

    matchers-condition: and
    matchers:
      - type: word
        words:
          - 'The Epic Games Store is now open.'
          - 'Epic Games'
        condition: and

      - type: status
        status:
          - 200

      - type: dsl
        dsl:
          - '!contains(host,"epicgames.com")'
