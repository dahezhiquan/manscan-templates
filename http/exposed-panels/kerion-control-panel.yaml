id: kerion-control-panel

info:
  name: Kerio Controle 面板识别（暴露面识别）
  author: johnk3r
  severity: info
  description: |
    该模板通过识别 Kerio Controle 面板、控制台或管理界面的页面特征，判断目标是否暴露了对应服务入口。若命中，说明该后台或运维界面对外可访问，可用于资产识别与暴露面排查。
  reference:
    - https://gfi.ai/products-and-solutions/network-security-solutions/keriocontrol
  metadata:
    verified: true
    max-request: 1
    shodan-query: http.favicon.hash:-631002664
  tags: panel,kerio,login,discovery

http:
  - method: GET
    path:
      - "{{BaseURL}}"

    matchers-condition: and
    matchers:
      - type: regex
        part: header
        regex:
          - "Kerio Control Embedded Web Server"

      - type: status
        status:
          - 302

    extractors:
      - type: kval
        part: header
        kval:
          - Server
