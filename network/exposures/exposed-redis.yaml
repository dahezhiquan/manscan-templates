id: exposed-redis

info:
  name: Redis 未认证访问（服务漏洞）
  author: pdteam
  severity: high
  description: |
    Redis 常用于缓存、队列和会话存储，未认证暴露会使任意客户端直接执行 INFO、读写键值甚至危险管理命令。该模板向 6379/6380 发送 `info` 与 `quit`，并在返回 `redis_version` 且非 Sentinel 模式时确认 Redis 未认证访问。
  impact: |
    - 攻击者可读取缓存数据、会话令牌、业务配置或敏感临时数据。
    - 在配置不当环境中，写入、持久化或模块相关命令可能进一步导致数据破坏、权限提升或主机入侵。
  remediation: |
    - 启用 Redis ACL/密码认证，禁止公网直连，并将服务绑定到可信内网接口。
    - 限制危险命令、启用最小权限账号，排查历史暴露期间是否存在异常写入或配置修改。
  reference:
    - https://redis.io/topics/security
  classification:
    cvss-metrics: CVSS:3.0/AV:N/AC:L/PR:N/UI:N/S:C/C:L/I:L/A:N
    cvss-score: 7.2
    cwe-id: CWE-306
  metadata:
    max-request: 2
  tags: network,redis,unauth,exposure,tcp,discovery

tcp:
  - inputs:
      - data: "info\r\nquit\r\n"

    host:
      - "{{Hostname}}"
      - "tls://{{Hostname}}"
    port: 6379,6380
    read-size: 2048

    matchers-condition: and
    matchers:
      - type: word
        words:
          - "redis_version"
      - type: word
        negative: true
        words:
          - "redis_mode:sentinel"
