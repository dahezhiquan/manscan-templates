id: cascade-cms-panel

info:
  name: Cascade CMS 面板识别（指纹识别）
  author: righettod
  severity: info
  description: |
    该模板通过识别 Cascade CMS 面板、控制台或管理界面的页面特征，判断目标是否暴露了对应服务入口。若命中，说明该后台或运维界面对外可访问，可用于资产识别与暴露面排查。
  reference:
    - https://www.hannonhill.com/products/cascade-cms-web-content-management/index.html
  metadata:
    verified: true
    max-request: 1
    shodan-query: http.title:"Cascade CMS"
  tags: panel,cascade,detect

http:
  - method: GET
    path:
      - "{{BaseURL}}/login.act"

    matchers:
      - type: dsl
        dsl:
          - 'status_code == 200'
          - 'contains_any(to_lower(body), "cascade cms</title>", "window.cascade_")'
        condition: and

    extractors:
      - type: regex
        part: body
        group: 1
        regex:
          - '(?i)\-\s*v([0-9\.]+)'
