id: hoobs-panel

info:
  name: HOOBS 面板识别（暴露面识别）
  author: rxerium
  severity: info
  description: |
    该模板通过识别 HOOBS 面板、控制台或管理界面的页面特征，判断目标是否暴露了对应服务入口。若命中，说明该后台或运维界面对外可访问，可用于资产识别与暴露面排查。
  reference:
    - https://hoobs.com
  metadata:
    verified: true
    max-request: 1
    shodan-query: http.title:"HOOBS"
  tags: panel,iot,homekit,hoobs,discovery

http:
  - method: GET
    path:
      - "{{BaseURL}}/login?url=%2F"

    matchers-condition: and
    matchers:
      - type: word
        part: body
        words:
          - '<title>HOOBS'

      - type: status
        status:
          - 200
