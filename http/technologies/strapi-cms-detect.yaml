id: strapi-cms-detect

info:
  name: Strapi CMS 指纹识别（指纹识别）
  author: cyllective,daffainfo,idealphase
  severity: info
  description: 用于识别目标是否部署 Strapi CMS 并提取相关版本或构建信息，模板会结合页面正文、状态码、特定路径或已知端点和版本或标识提取结果进行指纹匹配。
  reference:
    - https://github.com/strapi/strapi
  metadata:
    max-request: 1
  tags: tech,strapi,cms,discovery

http:
  - method: GET
    path:
      - "{{BaseURL}}/admin/init"

    matchers-condition: and
    matchers:
      - type: word
        part: body
        words:
          - '"data"'
          - '"uuid"'
          - '"hasAdmin"'
        condition: and

      - type: status
        status:
          - 200

    extractors:
      - type: regex
        part: body
        group: 1
        regex:
          - '"strapiVersion":"([0-9.]+)"'
