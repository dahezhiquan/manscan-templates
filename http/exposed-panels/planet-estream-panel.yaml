id: planet-estream-panel

info:
  name: Planet eStream 登录面板识别（暴露面识别）
  author: arafatansari
  severity: info
  description: 该模板通过识别 Planet eStream 登录入口的页面标题、特征文本或重定向行为，判断目标是否暴露了对应的认证界面。若命中，说明该登录面板对外可访问，可用于暴露面梳理与后续安全评估。
  classification:
    cvss-metrics: CVSS:3.0/AV:N/AC:L/PR:N/UI:N/S:U/C:N/I:N/A:N
    cwe-id: CWE-200
    cpe: cpe:2.3:a:planetestream:planet_estream:*:*:*:*:*:*:*:*
  metadata:
    verified: true
    max-request: 1
    vendor: planetestream
    product: planet_estream
    shodan-query:
      - title:"Login - Planet eStream"
      - http.title:"login - planet estream"
    fofa-query: title="login - planet estream"
    google-query: intitle:"login - planet estream"
  tags: panel,planet,estream,planetestream,discovery

http:
  - method: GET
    path:
      - "{{BaseURL}}/Login.aspx"

    host-redirects: true
    max-redirects: 2

    matchers-condition: and
    matchers:
      - type: word
        words:
          - 'Login - Planet eStream'
          - 'Powered by Planet eStream'
          - 'aria-label="Planet eStream Website'
        condition: or

      - type: status
        status:
          - 200
