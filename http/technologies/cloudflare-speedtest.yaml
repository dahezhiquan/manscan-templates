id: cloudflare-speedtest

info:
  name: Cloudflare Speedtest 指纹识别（指纹识别）
  author: DhiyaneshDk
  severity: info
  description: |
    用于识别目标暴露的 Cloudflare Speedtest，模板会结合页面正文和特定路径或已知端点判断是否存在对应技术或默认页面特征。
  metadata:
    max-request: 1
    verified: true
    shodan-query: html:"cloudflare/speedtest"
  tags: tech,cloudflare,speedtest,discovery

http:
  - method: GET
    path:
      - '{{BaseURL}}'

    matchers:
      - type: word
        words:
          - "@cloudflare/speedtest"
        part: body
