id: apostrophecms-detect

info:
  name: ApostropheCMS 指纹识别（指纹识别）
  author: Shivam Kamboj
  severity: info
  description: |
    用于识别目标是否使用 ApostropheCMS，模板会结合页面正文和特定路径或已知端点匹配内容管理系统相关指纹。
  reference:
    - https://apostrophecms.com/
  metadata:
    verified: true
    max-request: 1
    shodan-query: html:"window.apos"
  tags: tech,cms,apostrophe,discovery

http:
  - method: GET
    path:
      - "{{BaseURL}}"

    redirects: true

    matchers:
      - type: regex
        part: body
        regex:
          - '(?i)window\.apos\s*='
          - '(?i)/modules/apostrophe-'
        condition: and
