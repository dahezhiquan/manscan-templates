id: web-viewer-panel

info:
  name: Web Viewer for Samsung DVR 面板识别（指纹识别）
  author: JustaAcat
  severity: info
  description: Web Viewer for Samsung DVR 是 Samsung DVR/NVR Web 查看界面，用于视频预览、录像和监控设备访问。该模板请求首页，并依据 HTTP 200 状态码、页面标题、正文关键字或品牌资源特征识别目标是否部署了该系统或暴露了对应入口，适用于资产指纹确认；命中结果仅表示系统特征匹配，不代表已确认存在未授权访问或可利用漏洞。
  classification:
    cpe: cpe:2.3:h:samsung:dvr:*:*:*:*:*:*:*:*
  metadata:
    verified: true
    max-request: 1
    vendor: samsung
    product: dvr
    shodan-query:
    - title:"Web Viewer for Samsung DVR"
    - http.title:"web viewer for samsung dvr"
    fofa-query: title="web viewer for samsung dvr"
    google-query: intitle:"web viewer for samsung dvr"
  tags: panel,web-viewer,detect,samsung,discovery

http:
  - method: GET
    path:
      - '{{BaseURL}}'

    matchers-condition: and
    matchers:
      - type: word
        words:
          - "<title>Web Viewer for Samsung DVR</title>"

      - type: status
        status:
          - 200
