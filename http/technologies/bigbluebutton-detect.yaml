id: bigbluebutton-detect

info:
  name: BigBlueButton 指纹识别（指纹识别）
  author: pikpikcu
  severity: info
  description: BigBlueButton 是开源视频会议和在线教学平台，用于会议、课堂、录制和实时协作。该模板请求首页，并依据 HTTP 200 状态码、页面标题、正文关键字或品牌资源特征识别目标是否使用或暴露了 BigBlueButton 相关组件，适用于资产盘点、技术栈识别和后续安全评估；命中结果仅表示指纹特征匹配，不代表已确认存在可利用漏洞。
  classification:
    cpe: cpe:2.3:a:bigbluebutton:bigbluebutton:*:*:*:*:*:*:*:*
  metadata:
    max-request: 1
    vendor: bigbluebutton
    product: bigbluebutton
    shodan-query: http.title:"BigBlueButton"
  tags: tech,bigbluebutton,discovery

http:
  - method: GET
    path:
      - "{{BaseURL}}"

    matchers-condition: and
    matchers:
      - type: word
        part: body
        words:
          - "<title>BigBlueButton</title>"

      - type: status
        status:
          - 200
