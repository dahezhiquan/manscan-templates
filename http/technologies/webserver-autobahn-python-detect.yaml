id: webserver-autobahn-python-detect

info:
  name: Autobahn Python Web Server 指纹识别（指纹识别）
  author: pussycat0x
  severity: info
  description: >-
    Autobahn Python 是 Python 的 WebSocket/WAMP 网络库，用于构建实时通信服务和异步 Web 应用。该模板通过请求目标服务并检查预设路径或首页响应、正则特征、状态码等指纹特征，判断目标是否使用或暴露了
    Autobahn Python Web Server 相关组件；命中结果仅表示指纹特征匹配，可用于资产盘点、技术栈识别和后续安全评估，不代表已确认存在可利用漏洞。
  classification:
    cpe: cpe:2.3:a:crossbar:autobahn:*:*:*:*:*:*:*:*
  metadata:
    max-request: 1
    vendor: crossbar
    product: autobahn
    shodan-query: "AutobahnPython"
  tags: tech,webserver,discovery
http:
  - method: GET
    path:
      - '{{BaseURL}}'

    matchers-condition: and
    matchers:
      - type: regex
        regex:
          - '<h1>AutobahnPython([ 0-9.]+)<\/h1>'

      - type: status
        status:
          - 200

    extractors:
      - type: regex
        part: body
        regex:
          - 'AutobahnPython([ 0-9.]+)'
