id: password-complexity-disabled

info:
  name: 密码复杂度要求已禁用（本地基线扫描）
  author: princechaddha
  severity: high
  description: |
    缺少复杂度要求会允许弱口令。对应基线项为“密码复杂度策略是否禁用”；模板读取注册表 `HKLM:\SYSTEM\CurrentControlSet\Control\Lsa` 的 `LimitBlankPasswordUse` 值，结合命中值判断策略是否不符合基线。
  impact: |
    - 弱口令更容易被猜解、喷洒或离线破解。
    - 凭据保护不足会增加横向移动、远程登录和离线破解风险。
  remediation: |
    - 启用密码复杂度要求，并结合长度、历史和锁定策略。
    - 变更策略后清理历史凭据，并轮换可能受影响的账户密码。
  tags: windows,code,windows-audit

self-contained: true

code:
  - pre-condition: |
      IsWindows();
    engine:
      - powershell
      - powershell.exe
    args:
      - -ExecutionPolicy
      - Bypass
    pattern: "*.ps1"
    source: |
      if ((Get-ItemProperty -Path 'HKLM:\SYSTEM\CurrentControlSet\Control\Lsa' -Name 'LimitBlankPasswordUse').LimitBlankPasswordUse -eq 0) { "Password complexity is disabled" }

    matchers:
      - type: word
        words:
          - "Password complexity is disabled"
