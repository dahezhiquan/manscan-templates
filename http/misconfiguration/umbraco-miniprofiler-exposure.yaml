id: umbraco-miniprofiler-exposure

info:
  name: Umbraco Mini Pro文件r 暴露
  author: theamanrawat
  severity: low
  description: |
    检测到 Umbraco Mini Pro文件r 暴露。目标暴露了调试、错误或堆栈信息，可能泄露应用路径、框架版本、环境变量、源码位置或内部调用细节。
  reference:
    - https://miniprofiler.com/
    - https://umbraco.com/
  metadata:
    shodan-query: http.title:"Umbraco"
    fofa-query: title="Umbraco"
  tags: umbraco,miniprofiler,exposure,debug,misconfig

http:
  - method: GET
    path:
      - "{{BaseURL}}/mini-profiler-resources/results"
      - "{{BaseURL}}/umbraco/mini-profiler-resources/results"

    stop-at-first-match: true

    matchers-condition: and
    matchers:
      - type: word
        part: body
        words:
          - "StartupProfiler"
          - "var profiler ="
          - '"DurationMilliseconds"'
        condition: and

      - type: status
        status:
          - 200
