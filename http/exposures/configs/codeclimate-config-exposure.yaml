id: codeclimate-config-exposure

info:
  name: CodeClimate 配置文件暴露（暴露面识别）
  author: 0x_Akoko
  severity: info
  description: |
    检测到对外可访问的 CodeClimate 配置文件。这类配置资源可能包含部署细节、访问凭据、内部地址、组件版本或调试开关，公开暴露后会显著增加被侦察和后续利用的风险。
  reference:
    - https://docs.codeclimate.com/docs/configuring-your-workflow
  metadata:
    verified: true
    max-request: 1
  tags: exposure,config,codeclimate

http:
  - method: GET
    path:
      - "{{BaseURL}}/.codeclimate.yml"

    matchers-condition: and
    matchers:
      - type: word
        part: body
        words:
          - "languages:"
          - "engines:"
          - "exclude_paths:"
        condition: and

      - type: status
        status:
          - 200
