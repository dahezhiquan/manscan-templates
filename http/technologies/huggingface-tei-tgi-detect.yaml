id: huggingface-tei-tgi-detect

info:
  name: Hugging Face TEI/TGI 指纹识别（指纹识别）
  author: insidetrust,hdm
  severity: info
  description: >-
    Hugging Face Text Embeddings Inference 和 Text Generation Inference 是用于部署嵌入模型与大语言模型推理服务的组件。该模板通过请求目标服务并检查预设路径或首页响应、页面正文关键字、正则特征、DSL
    条件等指纹特征，判断目标是否使用或暴露了 Hugging Face TEI/TGI 相关组件；命中结果仅表示指纹特征匹配，可用于资产盘点、技术栈识别和后续安全评估，不代表已确认存在可利用漏洞。
  reference:
  - https://github.com/huggingface/text-embeddings-inference
  - https://github.com/huggingface/text-generation-inference
  - https://huggingface.co/docs/text-embeddings-inference/index
  metadata:
    verified: true
    max-request: 1
    vendor: huggingface
    product: text-embeddings-inference
  tags: tech,detect,tei,tgi,llm
http:
  - method: GET
    path:
      - "{{BaseURL}}/info"

    matchers-condition: and
    matchers:
      - type: word
        part: body
        words:
          - '"model_id"'
        condition: and

      - type: dsl
        dsl:
          - 'contains(content_type, "application/json")'
          - 'status_code == 200'
          - 'contains(body, "\"model_type\"") && contains(body, "\"embedding\"") || contains(body, "\"text-generation-router\"")'
        condition: and

    extractors:
      - type: regex
        name: version
        part: body
        group: 1
        regex:
          - '"version"\s*:\s*"([0-9][0-9A-Za-z.\-+]*)"'

      - type: regex
        name: model_id
        part: body
        group: 1
        regex:
          - '"model_id"\s*:\s*"([^"]+)"'
