id: microfocus-lifecycle-panel

info:
  name: Micro Focus Application Lifecycle Management 面板（指纹识别）
  author: righettod
  severity: info
  description: |-
    检测到目标站点存在 Micro Focus Application Lifecycle Management 相关响应特征。Micro Focus Application Lifecycle Management 是 AI、机器学习或 Notebook 相关平台，用于管理模型、数据集、工作区、实验、推理服务或训练任务。模板请求 `/qcbin/`，并通过页面标题或正文关键字、状态码、DSL 条件确认该系统指纹，用于资产识别、系统盘点和暴露面梳理。
  reference:
    - https://www.opentext.com/products/alm-quality-center
  metadata:
    verified: true
    max-request: 1
    shodan-query: http.html:"Micro Focus Application Lifecycle Management"
  tags: panel,microfocus,login,detect,discovery
http:
  - method: GET
    path:
      - "{{BaseURL}}/qcbin/"

    redirects: true
    max-redirects: 2

    matchers:
      - type: dsl
        dsl:
          - 'status_code == 200'
          - 'contains_any(to_lower(body), "micro focus application lifecycle management", "<div class=\"alm_name\">application lifecycle", "<p class=\"alm_header\">application lifecycle")'
        condition: and

    extractors:
      - type: regex
        part: body
        group: 1
        regex:
          - '(?i)Micro\s+Focus\s+Application\s+Lifecycle\s+Management\s+([0-9.]+)'
