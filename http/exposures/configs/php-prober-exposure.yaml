id: php-prober-exposure

info:
  name: PHP Prober 暴露（暴露面识别）
  author: ritikchaddha
  severity: medium
  description: 检测到对外可访问的 PHP Prober。这类配置资源可能包含部署细节、访问凭据、内部地址、组件版本或调试开关，公开暴露后会显著增加被侦察和后续利用的风险。
  metadata:
    max-request: 1
    verified: true
    shodan-query: http.component:"php"
  tags: exposure,php,prober

http:
  - method: GET
    path:
      - "{{BaseURL}}/prober.php"

    matchers-condition: and
    matchers:
      - type: word
        words:
          - 'Server Parameters'
          - 'PHP Prober'
          - 'Real-time Data'
        condition: and

      - type: status
        status:
          - 200
