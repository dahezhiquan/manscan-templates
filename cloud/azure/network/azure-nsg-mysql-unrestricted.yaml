id: azure-nsg-mysql-unrestricted
info:
  name: Azure NSG 对互联网开放 MySQL 端口（云安全）
  author: princechaddha
  severity: high
  description: MySQL 通常使用 TCP 3306 提供数据库连接；将该端口对互联网开放会把数据库认证和数据平面暴露给外部探测。本模板查询入站允许的 TCP 3306 NSG 规则，并在来源地址为 *、internet 或 any 时报告。
  impact: |
    - 弱口令、泄露凭据或数据库漏洞可能导致业务数据被读取、篡改或删除。
    - 攻击者还可能利用数据库主机作为横向移动跳板，影响同一虚拟网络中的其他资源。
  remediation: |
    - 删除面向互联网的 TCP 3306 入站规则，使用私有网络、VPN 或 Private Endpoint 连接 MySQL。
    - 启用 TLS、强认证和最小数据库权限，仅允许应用网段访问，并持续审计登录和查询异常。
  reference:
    - https://docs.microsoft.com/en-us/azure/virtual-network/network-security-groups-overview
  metadata:
    vendor: microsoft
    product: azure-network-security-group
  tags: cloud,devops,azure,microsoft,nsg,azure-cloud-config

flow: |
  code(1);
  for (let NsgData of iterate(template.nsgdata)) {
    NsgData = JSON.parse(NsgData)
    set("nsg", NsgData.name)
    set("resourcegroup", NsgData.resourceGroup)
    code(2)
  }

self-contained: true
code:
  - engine:
      - sh
      - bash
    source: |
      az network nsg list --query '[*].{name:name, resourceGroup:resourceGroup}' --output json

    extractors:
      - type: json
        name: nsgdata
        internal: true
        json:
          - '.[]'

  - engine:
      - sh
      - bash
    source: |
      az network nsg rule list --nsg-name $nsg --resource-group $resourcegroup --query "[?direction=='Inbound' && access=='Allow' && protocol=='TCP' && (destinationPortRange=='3306')]"

    matchers:
      - type: word
        words:
          - '"sourceAddressPrefix": "*"'
          - '"sourceAddressPrefix": "internet"'
          - '"sourceAddressPrefix": "any"'

    extractors:
      - type: dsl
        dsl:
          - 'nsg + " has unrestricted access on TCP port 3306"'
