id: locust-exposure

info:
  name: Locust 暴露
  author: DhiyaneshDK,bhutch
  severity: medium
  description: |
    检测到 Locust 暴露。目标响应或文件中可能暴露配置、凭据、密钥、令牌、环境变量或历史记录等敏感信息，可能被用于进一步入侵。
  classification:
    cpe: cpe:2.3:a:locust:locust:*:*:*:*:*:*:*:*
  metadata:
    verified: true
    max-request: 1
    vendor: locust
    product: locust
    shodan-query: title:"Locust"
  tags: exposure,locust,misconfig,vuln

http:
  - method: GET
    path:
      - '{{BaseURL}}'

    matchers-condition: and
    matchers:
      - type: regex
        part: body
        regex:
          - '<title>Locust(?: for.+)?</title>'

      - type: word
        part: body
        words:
          - 'locust.js'
          - 'Charts</a>'
        condition: or

      - type: status
        status:
          - 200
