id: jhipster-default-login

info:
  name: JHipster Platform 默认口令登录（弱口令）
  author: ritikchaddha
  severity: high
  description: |
    该模板用于检测 JHipster Platform 是否仍可使用默认凭据或弱口令登录。模板主要向 `/api/authenticate` 等认证入口发送请求，使用内置默认凭据组合进行认证尝试，并根据响应中的 `{"id_token":"ey`、`application/json` 等登录成功特征判断登录是否成功；命中说明目标未及时修改出厂、示例或初始化账号口令。
  impact: |
    - 攻击者可登录 JHipster Platform 后台，管理内容、用户、插件、主题、文件、表单或业务流程配置。
    - 后台权限被滥用后，可能导致页面篡改、恶意文件上传、敏感资料泄露，或进一步取得服务器执行能力。
  remediation: |
    - 立即修改默认管理员凭据，删除安装向导、演示账号和不必要的后台用户。
    - 限制后台登录入口访问来源，启用多因素认证、登录失败锁定和验证码等防护。
    - 检查近期内容、插件、主题、文件上传和管理员操作记录，确认没有持久化后门。
  reference:
    - https://www.jhipster.tech/security/
  metadata:
    verified: true
    max-request: 2
    shodan-query: title:"JHipster"
    fofa-query: title="JHipster"
  tags: jhipster,default-login,exposure,misconfig

http:
  - raw:
      - |
        POST /api/authenticate HTTP/1.1
        Host: {{Hostname}}
        Content-Type: application/json

        {"username":"{{username}}","password":"{{password}}","rememberMe":false}

    payloads:
      username:
        - "admin"
        - "user"
      password:
        - "admin"
        - "user"
    attack: pitchfork

    matchers-condition: and
    matchers:
      - type: word
        part: body
        words:
          - '{"id_token":"ey'

      - type: word
        part: header
        words:
          - "application/json"
          - "Authorization: Bearer"
        condition: and

      - type: status
        status:
          - 200
