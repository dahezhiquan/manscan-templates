id: gcloud-func-auto-runtime-updates-disabled

info:
  name: Google Cloud Functions 自动运行时安全更新未启用（云安全）
  author: princechaddha
  severity: medium
  description: Google Cloud Functions 的运行时与服务配置需要纳入持续基线管理，避免函数长期以不完整配置运行。本模板枚举函数并读取 serviceConfig.minInstanceCount，字段为 null 时作为当前基线不满足的证据报告该函数需要复核运行时安全更新和实例配置。
  impact: |
    - 函数运行时和实例配置未纳入基线时，安全更新、容量预热和稳定性要求可能被忽略。
    - 对关键函数而言，配置缺口会增加冷启动、运行时过期或安全维护遗漏带来的风险。
  remediation: |
    - 复核函数运行时版本、安全更新策略和最小实例配置，确保符合组织基线。
    - 将 Cloud Functions 配置纳入 IaC 或部署流水线，避免新函数缺少必要运行时安全配置。
  reference:
    - https://cloud.google.com/functions/docs/securing/managing-security
  metadata:
    vendor: google
    product: cloud-functions
  tags: cloud,devops,gcp,gcloud,google-cloud-functions,gcp-cloud-config

flow: |
  code(1)
  for(let projectId of iterate(template.projectIds)){
    set("projectId", projectId)
    code(2)
    for(let functionDetail of iterate(template.functions)){
      set("functionName", functionDetail)
      code(3)
    }
  }

self-contained: true

code:
  - engine:
      - sh
      - bash
    source: |
      gcloud projects list --format="json(projectId)"

    extractors:
      - type: json
        name: projectIds
        internal: true
        json:
          - '.[].projectId'

  - engine:
      - sh
      - bash
    source: |
      gcloud functions list --project $projectId --format="json(name)"

    extractors:
      - type: json
        name: functions
        internal: true
        json:
          - '.[].name'

  - engine:
      - sh
      - bash
    source: |
      gcloud functions describe $functionName --format="json(serviceConfig.minInstanceCount)"

    matchers:
      - type: word
        words:
          - 'null'

    extractors:
      - type: dsl
        dsl:
          - '"Automatic Runtime Security Updates Disabled in function: " + functionName + " in Project: " + projectId'
