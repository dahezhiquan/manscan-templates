id: azure-keyvault-update-unalerted
info:
  name: Azure Key Vault 更新告警未配置（云安全）
  author: princechaddha
  severity: high
  description: Key Vault 更新操作可能改变网络访问、权限、密钥和机密保护设置；未配置 Activity Log 告警时，敏感控制面变更可能长期不被发现。该模板枚举已启用的 Activity Log Alert，并检查 condition 是否缺少 Microsoft.KeyVault/vaults/write 操作条件。
  impact: |
    - 未授权更新可能放宽 Key Vault 网络或访问策略，使机密和密钥暴露给不必要的主体。
    - 关键配置被篡改后，应用可能出现认证失败、证书失效或数据保护边界下降。
  remediation: |
    - 创建针对 Key Vault 写入和更新操作的 Activity Log Alert，并将通知接入变更审批和安全审计。
    - 限制 Key Vault 管理权限，启用诊断日志和配置漂移检测，及时回滚未经批准的变更。
  reference:
    - https://docs.microsoft.com/en-us/azure/azure-monitor/platform/alerts-activity-log
  metadata:
    vendor: microsoft
    product: azure-monitor
  tags: cloud,devops,azure,microsoft,keyvault,azure-cloud-config

flow: |
  code(1);
  for (let AlertData of iterate(template.alertList)) {
    set("id", AlertData);
    code(2);
  }

self-contained: true
code:
  - engine:
      - sh
      - bash
    source: |
      az monitor activity-log alert list --output json --query '[?(enabled==`true`)].id'

    extractors:
      - type: json
        name: alertList
        internal: true
        json:
          - '.[]'

  - engine:
      - sh
      - bash
    source: |
      az monitor activity-log alert show --ids "$id" --query 'condition'

    matchers-condition: and
    matchers:
      - type: word
        words:
          - '"field": "operationName"'

      - type: word
        words:
          - "Microsoft.KeyVault/vaults/write"
        negative: true

    extractors:
      - type: dsl
        dsl:
          - 'id + " does not have the correct alert configuration for Update Key Vault events"'
