id: wp-plugin-wordpress-adminimize

info:
  name: WordPress Adminimize 插件指纹识别（指纹识别）
  author: ricardomaia
  severity: info
  description: >-
    Adminimize 是 WordPress 插件，主要用于站点后台管理、角色权限、维护模式、健康检查或多站点运维。该模板通过请求目标服务并检查预设路径或首页响应、正则特征、DSL
    条件等指纹特征，判断目标是否使用或暴露了 WordPress Adminimize 插件 相关组件；命中结果仅表示指纹特征匹配，可用于资产盘点、技术栈识别和后续安全评估，不代表已确认存在可利用漏洞。
  reference:
  - https://wordpress.org/plugins/adminimize/
  metadata:
    max-request: 1
    plugin_namespace: adminimize
    wpscan: https://wpscan.com/plugin/adminimize
  tags: tech,wordpress,wp-plugin,top-200,discovery
http:
  - method: GET
    path:
      - "{{BaseURL}}/wp-content/plugins/adminimize/readme.txt"

    payloads:
      last_version: helpers/wordpress/plugins/adminimize.txt

    extractors:
      - type: regex
        part: body
        internal: true
        name: internal_detected_version
        group: 1
        regex:
          - '(?i)Stable.tag:\s?([\w.]+)'

      - type: regex
        part: body
        name: detected_version
        group: 1
        regex:
          - '(?i)Stable.tag:\s?([\w.]+)'

    matchers-condition: or
    matchers:
      - type: dsl
        name: "outdated_version"
        dsl:
          - compare_versions(internal_detected_version, concat("< ", last_version))

      - type: regex
        part: body
        regex:
          - '(?i)Stable.tag:\s?([\w.]+)'
