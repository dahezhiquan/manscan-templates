id: s3-public-write-acp
info:
  name: S3 Bucket ACL 允许公共 WRITE_ACP（云安全）
  author: princechaddha
  severity: critical
  description: S3 ACL 对 AllUsers 授予 WRITE_ACP 时，匿名互联网用户可能修改 bucket 或对象 ACL，进而改变访问控制。该模板检查 bucket ACL 中 AllUsers 组是否具有 WRITE_ACP 权限。
  impact: |
    - 攻击者可扩大公开访问、锁定合法用户或为外部主体添加持久化权限。
    - ACL 被篡改后可能造成数据泄露、权限绕过和取证困难。
  remediation: |
    - 立即移除 AllUsers 的 WRITE_ACP 授权，并审计近期 ACL 变更。
    - 启用 S3 Block Public Access 和 Object Ownership 的 Bucket owner enforced 模式，尽量禁用 ACL 依赖。
  reference:
    - https://docs.aws.amazon.com/cli/latest/reference/s3api/get-bucket-acl.html
  metadata:
    max-request: 2
    vendor: amazon
    product: s3
  tags: cloud,devops,aws,amazon,s3,aws-cloud-config

flow: |
  code(1)
  for(let bucketName of iterate(template.buckets)){
    set("bucket", bucketName)
    code(2)
  }

self-contained: true
code:
  - engine:
      - sh
      - bash
    source: |
      aws s3api list-buckets --query 'Buckets[*].Name'

    extractors:
      - type: json # type of the extractor
        internal: true
        name: buckets
        json:
          - '.[]'

  - engine:
      - sh
      - bash
    source: |
        aws s3api get-bucket-acl --bucket $bucket --query 'Grants[?(Grantee.URI==`http://acs.amazonaws.com/groups/global/AllUsers`)]'

    matchers:
      - type: word
        words:
          - '"Permission": "WRITE_ACP"'

    extractors:
      - type: dsl
        dsl:
          - '"The S3 bucket " + bucket +" have public WRITE_ACP access"'
