id: starttls-mail-detect

info:
  name: STARTTLS Mail 服务 识别（服务漏洞）
  author: r3dg33k,userdehghani
  severity: info
  description: |
    该模板通过网络响应特征识别目标是否开放 STARTTLS Mail Server 相关服务。
  metadata:
    max-request: 1
  tags: mail,starttls,network,detect,smtp,detection,tcp,discovery

tcp:
  - inputs:
      - data: "65686c6f20636865636b746c730a"
        type: hex
    read-size: 2048

    host:
      - "{{Hostname}}"
    port: 25,2525,465,587

    matchers:
      - type: word
        words:
          - "250-STARTTLS"
