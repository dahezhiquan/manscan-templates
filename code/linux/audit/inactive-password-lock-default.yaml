id: inactive-password-lock-default

info:
  name: 默认非活跃账号锁定未正确配置（本地基线扫描）
  author: Th3l0newolf
  severity: high
  description: |
    密码过期后的非活跃账号若不会按期锁定，长期闲置账户仍可能被用于密码猜测、凭据复用或离职账号滥用。CIS Ubuntu 基线建议配置默认非活跃锁定周期；模板读取 `useradd -D` 中的 `INACTIVE` 值，缺失或大于 45 天时命中 Policy-Fail。
  impact: |
    - 闲置账号在密码过期后仍保留可恢复登录窗口，扩大账号接管风险。
    - 离职、停用或低频使用账号可能成为持久化入口。
  remediation: |
    - 使用 `useradd -D -f 45` 或组织基线要求的更严格值设置默认非活跃锁定天数。
    - 对已有账号同步检查 `chage -l` 配置，清理长期未使用或已离职账号。
  reference:
    - https://www.cisecurity.org/benchmark/ubuntu_linux
  metadata:
    verified: true
  tags: cis,local,cisecurity,audit,linux,ubuntu,password

self-contained: true

code:
  - engine:
      - bash
    args:
      - "-c"
      - |
        INACTIVE_DAYS=$(useradd -D | grep -i INACTIVE | awk -F= '{print $2}')
        if [ -z "$INACTIVE_DAYS" ] || [ "$INACTIVE_DAYS" -gt 45 ]; then
          echo "[inactive-password-lock-default-check:Policy-Fail] [INACTIVE=$INACTIVE_DAYS (invalid)] [CIS_FAIL]"
        else
          echo "[inactive-password-lock-default-check:Policy-Pass] [INACTIVE=$INACTIVE_DAYS (valid)] [CIS_PASS]"
        fi

    matchers:
      - type: word
        name: policy-pass
        words:
          - "Policy-Pass"

      - type: word
        name: policy-fail
        words:
          - "Policy-Fail"
