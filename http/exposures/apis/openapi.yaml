id: openapi

info:
  name: OpenAPI 检测（暴露面识别）
  author: pdteam,ynnirc
  severity: info
  description: 检测到对外可访问的 OpenAPI。公开的接口文档、调试端点或管理 API 可能泄露路由结构、参数格式、鉴权方式和内部功能边界，从而帮助攻击者快速完成接口枚举与利用准备。
  reference:
    - https://www.openapis.org/
  classification:
    cvss-metrics: CVSS:3.1/AV:N/AC:L/PR:N/UI:N/S:U/C:N/I:N/A:N
    cvss-score: 0
    cwe-id: CWE-200
  metadata:
    max-request: 1
  tags: exposure,api,discovery

http:
  - method: GET
    path:
      - "{{BaseURL}}/openapi.json"

    matchers-condition: and
    matchers:
      - type: word
        words:
          - openapi
          - paths
        condition: and

      - type: word
        part: header
        words:
          - application/openapi+json
          - application/json
        condition: or

      - type: status
        status:
          - 200
