id: websocket-switch-protocol

info:
  name: WebSocket Switching Protocol 指纹识别（指纹识别）
  author: pdteam
  severity: info
  description: >-
    WebSocket Switching Protocol 是 HTTP 升级到 WebSocket 或 h2c 等协议的响应特征，用于识别目标是否支持协议切换。该模板通过请求目标服务并检查预设路径或首页响应、DSL
    条件等指纹特征，判断目标是否使用或暴露了 WebSocket Switching Protocol 相关组件；命中结果仅表示指纹特征匹配，可用于资产盘点、技术栈识别和后续安全评估，不代表已确认存在可利用漏洞。
  metadata:
    verified: true
    max-request: 1
    shodan-query: '"connection: upgrade"'
  tags: protocol,switching,tech,websocket,h2c,discovery
http:
  - method: GET
    path:
      - "{{BaseURL}}"

    matchers:
      - type: dsl
        dsl:
          - 'status_code == 101'
          - 'contains(to_lower(header), "switching protocols")'
          - 'contains(to_lower(header), "connection: upgrade")'
          - 'contains(to_lower(header), "upgrade:")'

    extractors:
      - type: dsl
        dsl:
          - upgrade
