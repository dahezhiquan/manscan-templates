id: gcloud-sql-pgaudit-not-enabled

info:
  name: pg审计 Flags 未Enabled 的PostgreSQL Instances 中的Cloud SQL（云安全）
  author: princechaddha
  severity: medium
  description: pgAudit 可为 PostgreSQL 提供更细粒度的数据库审计日志，未启用会降低对敏感操作的可见性。本模板检查 Cloud SQL PostgreSQL 实例 databaseFlags 中 cloudsql.enable_pgaudit 的值，匹配 off 时报告 pgAudit 未启用。
  impact: |
    - DDL、权限变更和敏感数据访问可能缺少足够审计证据，影响入侵调查和合规证明。
    - 数据库内部滥用行为更难与账号、来源和具体语句关联。
  remediation: |
    - 启用 cloudsql.enable_pgaudit，并按审计目标配置 pgaudit.log 等相关参数。
    - 将 pgAudit 日志导出到集中日志平台，设置权限变更、批量访问和异常语句告警。
  reference:
    - https://cloud.google.com/sql/docs/postgres/flags
  metadata:
    vendor: google
    product: cloud-sql
  tags: cloud,devops,gcp,gcloud,google-cloud-sql,postgresql,gcp-cloud-config

flow: |
  code(1)
  for(let projectId of iterate(template.projectIds)){
    set("projectId", projectId)
    code(2)
    for(let sqlInstance of iterate(template.sqlInstances)){
      set("sqlInstance", sqlInstance)
      code(3)
    }
  }

self-contained: true

code:
  - engine:
      - sh
      - bash
    source: |
      gcloud projects list --format="json(projectId)"

    extractors:
      - type: json
        name: projectIds
        internal: true
        json:
          - '.[].projectId'

  - engine:
      - sh
      - bash
    source: |
      gcloud sql instances list --project $projectId --filter='DATABASE_VERSION:POSTGRES*' --format="json(name)"

    extractors:
      - type: json
        name: sqlInstances
        internal: true
        json:
          - '.[].name'

  - engine:
      - sh
      - bash
    source: |
      gcloud sql instances describe $sqlInstance --format=json | jq '.settings.databaseFlags[]? | select(.name=="cloudsql.enable_pgaudit") | .value'

    matchers:
      - type: word
        words:
          - 'off'

    extractors:
      - type: dsl
        dsl:
          - '"Cloud SQL instance " + sqlInstance + " in project " + projectId + " has pgAudit flag disabled (cloudsql.enable_pgaudit=off or pgaudit.log!=all)."'
