id: compreface-panel

info:
  name: CompreFace 面板检测（指纹识别）
  author: rxerium
  severity: info
  description: |-
    检测到目标站点存在 CompreFace 面板检测 相关响应特征。CompreFace 面板检测 是 AI、LLM 或机器学习相关平台，用于管理模型、数据集、工作区、推理服务或可观测性信息。模板请求 `/`，并通过页面标题或正文关键字、状态码确认该系统指纹，用于资产识别、系统盘点和暴露面梳理。
  reference:
    - https://github.com/exadel-inc/CompreFace
    - https://exadel.com/compreface/
  metadata:
    verified: true
    max-request: 1
    vendor: exadel
    product: compreface
    shodan-query: 'http.title:"CompreFace"'
  tags: panel,compreface,ai,computer-vision,face-recognition,detect,discovery
http:
  - method: GET
    path:
      - "{{BaseURL}}"

    host-redirects: true
    max-redirects: 2

    matchers-condition: and
    matchers:
      - type: word
        part: body
        words:
          - "<title>CompreFace</title>"

      - type: status
        status:
          - 200
