id: configure-service-timestamps-debug

info:
  name: Cisco Debug 时间戳未配置（本地文件安全扫描）
  author: pussycat0x
  severity: info
  description: |
    该模板检测 Cisco 设备调试消息是否配置 service timestamps。缺少时间戳会降低故障排查和安全事件时间线分析能力。
  reference:
    - https://www.cisco.com/E-Learning/bulk/public/tac/cim/cib/using_cisco_ios_software/cmdrefs/service_timestamps.htm
  classification:
    cvss-metrics: CVSS:3.1/AV:N/AC:L/PR:N/UI:N/S:U/C:N/I:N/A:N
    cvss-score: 0
    cwe-id: CWE-200
  tags: file,audit,cisco,config-audit,cisco-switch,router

file:
  - extensions:
      - conf

    matchers-condition: and
    matchers:
      - type: word
        words:
          - "service timestamps debug datetime msec show-timezone localtime"
        negative: true

      - type: word
        words:
          - "configure terminal"

