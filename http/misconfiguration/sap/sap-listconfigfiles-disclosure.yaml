id: sap-listconfigfiles-disclosure

info:
  name: SAPControl ListConfigFiles 泄露
  author: LRVT,l4rm4nd
  severity: medium
  description: |
    该模板用于核查 SAPControl ListConfigFiles 泄露。该类问题通常源于 SAP NetWeaver、SAPControl 或 ICM 管理接口暴露，导致未授权用户可读取系统信息、日志、配置或执行管理操作。模板会向目标发送探测请求，并依据匹配 `ListConfigFilesResponse`、匹配 `<configfiles>`、状态码 200 等证据确认目标是否存在该配置问题。
  impact: |
    - 攻击者可获取 SAP 版本、实例属性、配置文件、日志内容和系统路径等敏感信息。
    - 若管理方法可被调用，可能进一步导致命令执行、系统操作或业务中断。
  remediation: |
    - 限制 SAPControl、ICM Admin 和相关 SOAP/Web 管理接口的来源地址。
    - 启用强认证、最小权限和访问审计，关闭不需要公开的管理方法。
    - 检查 SAP 日志和实例配置，确认是否存在未授权访问或敏感信息泄露。
  reference:
    - https://itsiti.com/csmon/
    - https://cloud.ibm.com/docs/sap?topic=sap-monitoring-prereqs
    - https://help.sap.com/docs/SUPPORT_CONTENT/si/3362959700.html
  metadata:
    max-request: 1
  tags: misconfig,sap,sapcontrol,soap,config,disclosure

http:
  - raw:
      - |
        POST / HTTP/1.1
        Host: {{Hostname}}
        Content-Type: text/xml; charset=UTF-8
        SOAPAction: '""'

        <?xml version="1.0" encoding="utf-8"?>
        <SOAP-ENV:Envelope xmlns:SOAP-ENV="http://schemas.xmlsoap.org/soap/envelope/">
          <SOAP-ENV:Header>
            <sapsess:Session xmlns:sapsess="http://www.sap.com/webas/630/soap/features/session/">
              <enableSession>true</enableSession>
            </sapsess:Session>
          </SOAP-ENV:Header>
          <SOAP-ENV:Body>
            <ns1:ListConfigFiles xmlns:ns1="urn:SAPControl"/>
          </SOAP-ENV:Body>
        </SOAP-ENV:Envelope>

    matchers-condition: and
    matchers:
      - type: word
        part: body
        words:
          - "ListConfigFilesResponse"
          - "<configfiles>"
        condition: and

      - type: status
        status:
          - 200
