id: opensign-panel

info:
  name: OpenSign 登录面板识别（指纹识别）
  author: righettod
  severity: info
  description: |-
    检测到目标站点存在 OpenSign 相关响应特征。OpenSign 是 AI、机器学习或 Notebook 相关平台，用于管理模型、数据集、工作区、实验、推理服务或训练任务。模板请求 `/locales/en/translation.json`、`/` 路径，并通过页面标题或正文关键字、状态码、DSL 条件确认该系统指纹，用于资产识别、系统盘点和暴露面梳理。
  reference:
    - https://www.opensignlabs.com/
    - https://github.com/OpenSignLabs/OpenSign
  metadata:
    max-request: 2
    verified: true
    shodan-query: http.title:"opensign"
  tags: panel,opensign,login,detect,discovery
http:
  - method: GET
    path:
      - "{{BaseURL}}/locales/en/translation.json"
      - "{{BaseURL}}/"

    stop-at-first-match: true
    matchers:
      - type: dsl
        dsl:
          - 'status_code == 200'
          - 'contains(body, "OpenSign")'
        condition: and
