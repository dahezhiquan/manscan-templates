id: haivision-gateway-panel

info:
  name: Haivision Gateway 登录面板识别（暴露面识别）
  author: righettod
  severity: info
  description: 该模板通过识别 Haivision Gateway 登录入口的页面标题、特征文本或重定向行为，判断目标是否暴露了对应的认证界面。若命中，说明该登录面板对外可访问，可用于暴露面梳理与后续安全评估。
  reference:
    - https://www.haivision.com/
  metadata:
    verified: true
    max-request: 1
    shodan-query: http.title:"Haivision Gateway"
  tags: panel,haivision,login,detect,discovery

http:
  - method: GET
    path:
      - "{{BaseURL}}"

    matchers:
      - type: dsl
        dsl:
          - 'status_code == 200'
          - 'contains_any(body, "<title>Haivision Gateway", "content=\"Haivision Gateway")'
        condition: and
