id: macshell-c2-jarm

info:
  name: Macshell C2 JARM 识别（服务漏洞）
  author: pussycat0x
  severity: info
  description: |
    该模板通过 JARM TLS 指纹识别目标是否可能为 Macshell C2 相关命令控制基础设施。
  reference:
    - https://github.com/cedowens/C2-JARM
    - https://github.com/cedowens/MacShellSwift
  metadata:
    max-request: 1
  tags: jarm,network,c2,ir,osint,cti,macshell,tcp,vuln
tcp:
  - inputs:
      - data: 2E
        type: hex
    host:
      - "{{Hostname}}"
    matchers:
      - type: dsl
        dsl:
          - "jarm(Hostname) == '2ad000000000000000000000000000eeebf944d0b023a00f510f06a29b4f46'"
