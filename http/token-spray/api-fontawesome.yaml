id: api-fontawesome

info:
  name: FontAwesome API Token 可用性校验（token喷洒）
  author: dwisiswant0
  severity: high
  reference:
    - https://fontawesome.com/v6.0/docs/apis/graphql/get-started
  metadata:
    max-request: 1
  tags: token-spray,fontawesome
  description: |-
    平台介绍：FontAwesome API 是面向开发者提供 API 能力的在线服务平台，常用于通过访问令牌调用账户、数据查询、自动化或集成功能。该模板用于校验提交的 FontAwesome API Token 是否仍然有效。检测逻辑会向 `api.fontawesome.com/token` 发起低影响 API 请求，通过 Bearer Token 认证头传递 `{{token}}`，并依据响应中的 `"access_token":`、`"scopes":`、状态码 200 判断凭据是否可用；命中通常表示该 Token 可被继续调用对应平台能力。
  impact: |-
    - 攻击者可确认 Token 有效并调用平台 API，读取账户、资源、配额或业务数据。
    - 有效 Token 可能被持续滥用，造成数据泄露、配额消耗、费用增加、服务滥用或进一步横向访问。
  remediation: |-
    - 立即撤销或轮换已暴露的 API Token，并确认旧 Token 不再可用。
    - 按最小权限原则重新签发凭据，限制作用域、来源地址、项目范围和有效期。
    - 在代码仓库、CI/CD、日志和配置文件中排查泄露来源，避免 Token 再次提交或外传。
self-contained: true

http:
  - method: GET
    path:
      - "https://api.fontawesome.com/token"

    headers:
      Authorization: Bearer {{token}}

    matchers-condition: and
    matchers:
      - type: status
        status:
          - 200

      - type: word
        part: body
        words:
          - '"access_token":'
          - '"scopes":'
        condition: and
