id: directory-listing

info:
  name: 目录列出启用检测
  author: theMiddle
  severity: low
  description: |
    目录索引是一种 Web 服务器功能，当目录中不存在索引文件时会直接展示目录内容。若对外启用，可能暴露敏感文件、旧备份文件或未被引用的内部资源。
  impact: |
    敏感文件和目录可能被未授权用户浏览、下载或用于进一步攻击。
  remediation: |
    在 Web 服务器配置中禁用目录列出，并为敏感目录添加访问控制或默认索引文件。
  reference:
    - https://owasp.org/www-project-web-security-testing-guide/v42/4-Web_Application_Security_Testing/02-Configuration_and_Deployment_Management_Testing/04-Review_Old_Backup_and_Unreferenced_Files_for_Sensitive_Information
    - https://portswigger.net/kb/issues/00600100_directory-listing
  metadata:
    max-request: 2
  tags: misc,generic,misconfig,fuzz,miscellaneous,vuln
flow: |
  function target_is_in_scope(url) {
    if (url.startsWith(template.http_1_host) || url.startsWith("/")) {
      return true;
    }
    return false;
  }

  http(1);

  if(template.links) {
    var path_checked = [];
    var paths = [];

    for(i=0; i<template.links.length; i++) {
      if (target_is_in_scope(template.links[i])) {

        var path = template.links[i].replace(template.http_1_host, "");
        var path_split = path.split("/");
        var path_to_check = "";

        for(p in path_split) {
          if (path_split[p] != "") {
            path_to_check += "/"+path_split[p];

            if (!path_checked.includes(path_to_check)) {
              path_checked.push(path_to_check);

              set("path_to_check", path_to_check);
              http(2);
            }
          }
        }

      }
    }
  }

http:
  - method: GET
    path:
      - "{{BaseURL}}"

    host-redirects: true
    max-redirects: 2
    matchers:
      - type: dsl
        internal: true
        dsl:
          - contains(header, "text/html")
          - status_code_1 == 200
        condition: and

    extractors:
      - type: xpath
        name: links
        part: body
        internal: true
        xpath:
          - "//*/@href|//*/@src"

  - method: GET
    path:
      - "{{BaseURL}}{{path_to_check}}"

    host-redirects: true
    max-redirects: 2

    matchers-condition: and
    matchers:
      - type: word
        part: body
        words:
          - "<title>Index of"
        case-insensitive: true

      - type: word
        part: header
        words:
          - "text/html"

      - type: status
        status:
          - 200
