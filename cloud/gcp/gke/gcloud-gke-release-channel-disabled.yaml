id: gcloud-gke-release-channel-disabled

info:
  name: GKE Clusters 未启用Release Channel Configuration（云安全）
  author: princechaddha
  severity: medium
  description: GKE 集群未配置 Regular 或 Stable release channel 时，版本升级和安全更新节奏可能不符合生产基线。本模板检查 releaseChannel.channel，值为 RAPID 或 null 时报告集群未使用推荐发布通道。
  impact: |
    - 未纳入合适发布通道可能导致版本维护不可控，或过快接收变更影响生产稳定性。
    - 安全补丁和 Kubernetes 版本升级流程不统一会增加版本漂移和维护风险。
  remediation: |
    - 为生产集群选择 Regular 或 Stable release channel，并结合维护窗口管理升级节奏。
    - 对需要 Rapid 通道的测试集群记录用途和例外，持续监控版本兼容性。
  reference:
    - https://cloud.google.com/kubernetes-engine/docs/concepts/release-channels
    - https://www.trendmicro.com/cloudoneconformity/knowledge-base/gcp/GKE/automate-version-upgrades.html
  metadata:
    vendor: google
    product: google-kubernetes-engine
  tags: cloud,devops,gcp,gcloud,gke,kubernetes,security,updates,maintenance,gcp-cloud-config

flow: |
  code(1)
  for(let projectId of iterate(template.projectIds)){
    set("projectId", projectId)
    code(2)
    for(let cluster of iterate(template.clusters)){
      cluster = JSON.parse(cluster)
      set("clusterName", cluster.name)
      set("location", cluster.location)
      code(3)
    }
  }

self-contained: true

code:
  - engine:
      - sh
      - bash
    source: |
      gcloud projects list --format="json(projectId)"

    extractors:
      - type: json
        name: projectIds
        internal: true
        json:
          - '.[].projectId'

  - engine:
      - sh
      - bash
    source: |
      gcloud container clusters list --project $projectId --format="json(name,location)"

    extractors:
      - type: json
        name: clusters
        internal: true
        json:
          - '.[]'

  - engine:
      - sh
      - bash
    source: |
      gcloud container clusters describe $clusterName --location $location --project $projectId --format="value(releaseChannel.channel)"

    matchers:
      - type: word
        words:
          - "RAPID"
          - "null"
        condition: or

    extractors:
      - type: dsl
        dsl:
          - '"GKE cluster " + clusterName + " in " + location + " of project " + projectId + " is not configured with Regular or Stable release channel"'
