id: php-proxy-detect

info:
  name: PHP Proxy 指纹识别（指纹识别）
  author: pikpikcu
  severity: info
  description: >-
    PHP Proxy 是基于 PHP 的 Web 代理应用，用于通过服务器中转访问网页内容。该模板通过请求目标服务并检查预设路径或首页响应、页面正文关键字、状态码、正则特征等指纹特征，判断目标是否使用或暴露了
    PHP Proxy 相关组件；命中结果仅表示指纹特征匹配，可用于资产盘点、技术栈识别和后续安全评估，不代表已确认存在可利用漏洞。
  metadata:
    max-request: 2
  tags: tech,php,proxy,discovery
http:
  - method: GET
    path:
      - "{{BaseURL}}"
      - "{{BaseURL}}/proxy"

    matchers-condition: and
    matchers:
      - type: word
        part: body
        words:
          - "<title>PHP-Proxy</title>"

      - type: status
        status:
          - 200

    extractors:
      - type: regex
        part: body
        group: 1
        regex:
          - '<meta name="version" content="([0-9.]+)">'
