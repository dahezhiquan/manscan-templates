id: yourls-detect

info:
  name: YOURLS 指纹识别（指纹识别）
  author: lstatro
  severity: info
  description: >-
    YOURLS 是开源短链接管理系统，用于创建、管理和统计自定义短 URL。该模板通过请求目标服务并检查预设路径或首页响应、页面正文关键字、状态码、正则特征等指纹特征，判断目标是否使用或暴露了
    YOURLS 相关组件；命中结果仅表示指纹特征匹配，可用于资产盘点、技术栈识别和后续安全评估，不代表已确认存在可利用漏洞。
  reference:
  - https://github.com/YOURLS/YOURLS
  classification:
    cpe: cpe:2.3:a:yourls:yourls:*:*:*:*:*:*:*:*
  metadata:
    verified: true
    max-request: 1
    vendor: yourls
    product: yourls
    shodan-query: title:"Your Own URL Shortener"
    fofa-query: title="Your Own URL Shortener"
  tags: tech,yourls,discovery
http:
  - method: GET
    path:
      - "{{BaseURL}}"

    redirects: true
    max-redirects: 3

    matchers-condition: and
    matchers:
      - type: word
        part: body
        words:
          - '<title>YOURLS'
          - 'content="YOURLS'
          - 'alt="YOURLS'
          - '/yourls-logo'
        condition: or

      - type: status
        status:
          - 200

    extractors:
      - type: regex
        part: body
        group: 1
        regex:
          - 'YOURLS<\/a>([ a-z0-9.-]+)'
          - 'content="YOURLS([ 0-9.]+)"'
