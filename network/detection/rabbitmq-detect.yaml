id: rabbitmq-detect

info:
  name: RabbitMQ 识别（服务漏洞）
  author: pussycat0x
  severity: info
  description: |
    该模板通过网络响应特征识别目标是否开放 RabbitMQ 相关服务。
  reference:
    - https://nmap.org/nsedoc/scripts/amqp-info.html
  metadata:
    verified: true
    max-request: 1
    shodan-query: product:"RabbitMQ"
  tags: network,rabbitmq,oss,detect,detection,tcp,discovery
tcp:
  - inputs:
      - data: "AMQP\u0000\u0000\t\u0001"

    host:
      - "{{Hostname}}"
    port: 5672

    matchers-condition: and
    matchers:
      - type: word
        words:
          - "publisher_confirmst"
          - "RabbitMQ"
        condition: and
