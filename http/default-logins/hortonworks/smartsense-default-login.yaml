id: smartsense-default-login

info:
  name: HortonWorks SmartSense 默认口令登录（弱口令）
  author: Techryptic (@Tech)
  severity: high
  description: 该模板通过尝试 HortonWorks SmartSense 的默认管理员账号口令，并依据认证成功后的响应特征判断目标是否仍在使用未修改的弱口令。若命中，攻击者通常可直接获得后台管理权限，进一步访问敏感信息、修改配置或执行未授权操作。
  reference:
    - https://docs.cloudera.com/HDPDocuments/SS1/SmartSense-1.2.2/bk_smartsense_admin/content/manual_server_login.html
  classification:
    cvss-metrics: CVSS:3.0/AV:N/AC:L/PR:N/UI:N/S:C/C:L/I:L/A:L
    cvss-score: 8.3
    cwe-id: CWE-522
  metadata:
    max-request: 1
  tags: hortonworks,smartsense,default-login,vuln

http:
  - raw:
      - |
        GET /apt/v1/context HTTP/1.1
        Host: {{Hostname}}
        Authorization: Basic {{base64(username + ':' + password)}}

    payloads:
      username:
        - admin
      password:
        - admin
    attack: pitchfork

    matchers-condition: and
    matchers:
      - type: word
        words:
          - "Set-Cookie: SUPPORTSESSIONID"
        part: header

      - type: word
        words:
          - "smartsenseId"

      - type: status
        status:
          - 200
