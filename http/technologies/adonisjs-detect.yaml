id: adonisjs-detect

info:
  name: AdonisJS 指纹识别（指纹识别）
  author: rxerium
  severity: info
  description: 用于识别目标前端或应用中是否使用 AdonisJS，模板会结合 HTTP 响应头和特定路径或已知端点进行技术栈指纹匹配。
  reference:
    - https://adonisjs.com
  metadata:
    verified: true
    max-request: 1
    vendor: adonisjs
    product: adonisjs
    shodan-query: 'X-Powered-By: AdonisJs'
  tags: tech,adonisjs,detect,discovery

http:
  - method: GET
    path:
      - "{{BaseURL}}"

    host-redirects: true
    max-redirects: 2

    matchers:
      - type: word
        part: header
        words:
          - "X-Powered-By: AdonisJs"
        case-insensitive: true
