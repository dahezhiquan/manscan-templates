id: meteor-detect

info:
  name: Meteor.js 框架指纹识别（指纹识别）
  author: Shivam Kamboj
  severity: info
  description: |
    用于识别目标前端或应用中是否使用 Meteor.js 框架，模板会结合页面正文和特定路径或已知端点进行技术栈指纹匹配。
  reference:
    - https://www.meteor.com/
    - https://docs.meteor.com/
  metadata:
    verified: true
    max-request: 1
    shodan-query: html:"__meteor_runtime_config__"
  tags: tech,discovery,meteor

http:
  - method: GET
    path:
      - "{{BaseURL}}"

    redirects: true

    matchers:
      - type: word
        part: body
        words:
          - "__meteor_runtime_config__"
          - "__meteor-css__"
        condition: and
