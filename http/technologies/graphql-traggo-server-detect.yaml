id: graphql-traggo-server-detect

info:
  name: Traggo Time Tracking 指纹识别（指纹识别）
  author: 0x_Akoko
  severity: info
  description: >-
    Traggo 是开源时间跟踪系统，用于记录项目、任务和标签维度的工作时间。该模板通过请求目标服务并检查页面正文关键字、DSL 条件等指纹特征，判断目标是否使用或暴露了
    Traggo Time Tracking 相关组件；命中结果仅表示指纹特征匹配，可用于资产盘点、技术栈识别和后续安全评估，不代表已确认存在可利用漏洞。
  reference:
  - https://github.com/traggo/server
  metadata:
    verified: true
    max-request: 2
    shodan-query: http.title:"Traggo"
  tags: tech,traggo,detect,graphql,discovery
http:
  - raw:
      - |
        GET / HTTP/1.1
        Host: {{Hostname}}

      - |
        POST /graphql HTTP/1.1
        Host: {{Hostname}}
        Content-Type: application/json

        {"query":"{ version { name commit buildDate } }"}

    matchers:
      - type: dsl
        dsl:
          - 'contains(body_1, "<title>Traggo</title>") && contains(body_1, "webpackJsonpui") && contains(body_2, "\"data\"") && contains(body_2, "\"version\"")'

    extractors:
      - type: json
        name: version
        part: body_2
        json:
          - '.data.version.name'
