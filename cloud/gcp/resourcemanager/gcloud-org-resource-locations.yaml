id: gcloud-org-resource-locations

info:
  name: Resource Location Restrictions 未Configured（云安全）
  author: princechaddha
  severity: medium
  description: 组织未限制资源位置时，项目可在任意区域或多区域创建资源，可能违反数据驻留和运营边界要求。本模板检查 gcp.resourceLocations 组织策略 listPolicy.allValues，值为 ALLOW 时报告资源位置未受限制。
  impact: |
    - 敏感数据或工作负载可能被部署到不符合监管、合同或延迟要求的位置。
    - 资源分散到未批准区域会增加成本治理、灾备设计和安全监控复杂度。
  remediation: |
    - 配置 gcp.resourceLocations 组织策略，仅允许业务和合规批准的位置。
    - 对需要跨区域部署的场景记录例外依据，并定期核对资源实际位置和策略继承情况。
  reference:
    - https://www.trendmicro.com/cloudoneconformity/knowledge-base/gcp/ResourceManager/resource-location-restriction.html
    - https://cloud.google.com/resource-manager/docs/organization-policy/org-policy-constraints
  metadata:
    vendor: google
    product: resource-manager
  tags: cloud,devops,gcp,gcloud,resourcemanager,security,compliance,location,gcp-cloud-config

flow: |
  code(1)
  for(let orgId of iterate(template.orgIds)){
    set("orgId", orgId)
    code(2)
  }

self-contained: true

code:
  - engine:
      - sh
      - bash
    source: |
      gcloud organizations list --format="json(name)"

    extractors:
      - type: json
        name: orgIds
        internal: true
        json:
          - '.[].name'

  - engine:
      - sh
      - bash
    source: |
      gcloud alpha resource-manager org-policies describe gcp.resourceLocations --organization=$orgId --effective --format="json(listPolicy.allValues)"

    matchers:
      - type: word
        words:
          - "ALLOW"

    extractors:
      - type: dsl
        dsl:
          - '"Organization " + orgId + " has not restricted resource locations, allowing resources to be created in any region"'
