id: wishpond-takeover

info:
  name: Wishpond 活动页面缺失接管检测（子域名接管）
  author: pdteam
  severity: high
  description: 检测 Wishpond 返回 404 活动页面或未发布活动提示的情况，表明目标域名可能仍指向 Wishpond 但没有有效活动内容，存在接管风险。
  reference:
    - https://github.com/EdOverflow/can-i-take-over-xyz
  metadata:
    max-request: 1
  tags: takeover,wishpond,vuln

http:
  - method: GET
    path:
      - "{{BaseURL}}"

    matchers-condition: and
    matchers:
      - type: dsl
        dsl:
          - Host != ip

      - type: word
        words:
          - https://www.wishpond.com/404?campaign=true
          - 'Oops! There isn’t a Wishpond Campaign published to this page.'
        condition: or

    extractors:
      - type: dsl
        dsl:
          - cname
