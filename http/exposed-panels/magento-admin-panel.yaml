id: magento-admin-panel

info:
  name: Magento Admin 登录面板识别（暴露面识别）
  author: TechbrunchFR,ritikchaddha
  severity: info
  description: |
    该模板通过识别 Magento Admin 登录入口的页面标题、特征文本或重定向行为，判断目标是否暴露了对应的认证界面。若命中，说明该登录面板对外可访问，可用于暴露面梳理与后续安全评估。
  reference:
    - https://docs.magento.com/user-guide/stores/store-urls-custom-admin.html
  classification:
    cvss-metrics: CVSS:3.0/AV:N/AC:L/PR:N/UI:N/S:U/C:N/I:N/A:N
    cwe-id: CWE-200
    cpe: cpe:2.3:a:magento:magento:*:*:*:*:*:*:*:*
  metadata:
    verified: true
    max-request: 1
    vendor: magento
    product: magento
    shodan-query:
      - http.component:"Magento"
      - cpe:"cpe:2.3:a:magento:magento"
      - http.component:"magento"
  tags: magento,panel,discovery

http:
  - method: GET
    path:
      - '{{BaseURL}}/admin'

    host-redirects: true
    max-redirects: 2

    matchers-condition: and
    matchers:
      - type: word
        part: body
        words:
          - "Magento"
          - "Admin Panel"
        condition: and
