id: trendmicro-apexone-panel

info:
  name: Trend Micro Apex One 登录面板识别（指纹识别）
  author: johnk3r,s4e-io
  severity: info
  description: Trend Micro Apex One 是终端安全管理平台，用于防病毒、EDR、策略、告警和终端资产管理。该模板请求 `/officescan/console/html/cgi/cgiChkMasterPwd.exe`、`/SMB/console/html/cgi/cgiChkMasterPwd.exe`，并依据 HTTP 200 状态码、页面标题、正文关键字或品牌资源特征识别目标是否部署了该系统或暴露了对应入口，适用于资产指纹确认；命中结果仅表示系统特征匹配，不代表已确认存在未授权访问或可利用漏洞。
  classification:
    cwe-id: CWE-200
  metadata:
    verified: true
    max-request: 1
    shodan-query: http.title:"officescan"
  tags: panel,trendmicro,login,detect,discovery

http:
  - method: GET
    path:
      - "{{BaseURL}}/officescan/console/html/cgi/cgiChkMasterPwd.exe"
      - "{{BaseURL}}/SMB/console/html/cgi/cgiChkMasterPwd.exe"

    stop-at-first-match: true

    matchers-condition: and
    matchers:
      - type: word
        part: body
        words:
          - "Trend Micro"
          - "TMlogonEncrypted"
        condition: and

      - type: status
        status:
          - 200
