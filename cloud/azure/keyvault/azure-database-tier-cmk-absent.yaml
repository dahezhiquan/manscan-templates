id: azure-database-tier-cmk-absent
info:
  name: Azure Key Vault 数据库层密钥缺少必要标签（云安全）
  author: princechaddha
  severity: high
  description: Azure Key Vault 密钥标签用于记录密钥用途、所属数据库、环境和责任人等管理元数据。启用的数据库层密钥没有标签时，数据库加密密钥的归属、轮换和审计难以自动确认。本模板列出启用的密钥并查询 tags，在返回空对象 {} 时报告缺少数据库层密钥标签。
  impact: |
    - 数据库客户管理密钥可能无法与具体数据服务和责任团队对应，增加误授权、误删或错误轮换导致数据库不可用的风险。
    - 缺少标签会削弱加密资产盘点、合规证明和到期或轮换告警能力，延长异常处置时间。
  remediation: |
    - 为每个数据库层密钥补充数据库标识、环境、用途、责任人和数据分级等必需标签，不要在标签中写入密钥或连接凭据。
    - 使用 Azure Policy 或自动化流程校验新建密钥的标签完整性，并定期审计既有密钥与数据库加密配置的对应关系。
  reference:
    - https://docs.microsoft.com/en-us/azure/key-vault/keys/about-keys
  metadata:
    vendor: microsoft
    product: azure-key-vault
  tags: cloud,devops,azure,microsoft,azure-key-vault,azure-cloud-config

flow: |
  code(1);
  for (let vaultName of iterate(template.vaultNames)) {
    set("vaultName", vaultName);
    code(2);
    for (let keyId of iterate(template.keyIds)) {
      set("keyId", keyId);
      code(3);
    }
  }

self-contained: true
code:
  - engine:
      - sh
      - bash
    source: |
      az keyvault list --query '[*].name' --output json

    extractors:
      - type: json
        name: vaultNames
        internal: true
        json:
          - '.[]'

  - engine:
      - sh
      - bash
    source: |
      az keyvault key list --vault-name $vaultName --query '[?(attributes.enabled==`true`)].kid' --output json

    extractors:
      - type: json
        name: keyIds
        internal: true
        json:
          - '.[]'

  - engine:
      - sh
      - bash
    source: |
      az keyvault key show --id $keyId --query 'tags' --output json

    matchers:
      - type: word
        words:
          - '{}'

    extractors:
      - type: dsl
        dsl:
          - 'vaultName + " key " + keyId + " does not have required database-tier tags"'
