id: 7777botnet-detect

info:
  name: 7777 僵尸网络识别（服务漏洞）
  author: johnk3r
  severity: high
  description: |
    该模板用于识别监听在 7777 端口、呈现特定 Telnet 登录交互的 7777 Botnet 相关服务。该类服务通常意味着主机暴露了僵尸网络控制端、感染节点或被恶意程序占用的交互入口，命中后应按入侵事件处理而不是普通端口开放处理。模板发送 Telnet 协商报文后读取服务端响应，并要求同时出现 `xlog` 与 `in` 字符串，以确认目标符合该僵尸网络登录提示特征。
  impact: |
    - 命中通常说明目标主机可能已经被恶意程序控制，或正在暴露与 7777 Botnet 相关的命令控制服务。
    - 受感染资产可能被用于分布式攻击、凭据窃取、代理转发、横向移动或持续化控制。
  remediation: |
    - 立即隔离命中资产，保留内存、进程、网络连接和磁盘样本用于取证分析。
    - 清除恶意程序和持久化项，轮换相关账户凭据，并从边界防火墙阻断异常 7777 端口暴露。
    - 排查同网段是否存在相同指纹或异常外联，确认控制端通信链路已被切断。
  reference:
    - https://gi7w0rm.medium.com/the-curious-case-of-the-7777-botnet-86e3464c3ffd
  metadata:
    verified: true
    max-request: 1
    shodan-query: 'hash:1357418825'
  tags: network,c2,ir,osint,cti,darktrack,botnet,tcp,vuln

tcp:
  - inputs:
      - data: "fffc01fffb1ffffa1f00500018fff0fffd01fffd03"
        read: 2048

    host:
      - "{{Hostname}}"
    port: 7777

    matchers:
      - type: word
        part: data
        words:
          - "xlog"
          - "in"
        condition: and
