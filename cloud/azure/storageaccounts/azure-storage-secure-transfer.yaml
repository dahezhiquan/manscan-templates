id: azure-storage-secure-transfer
info:
  name: Azure Storage 安全传输未启用（云安全）
  author: princechaddha
  severity: medium
  description: Azure Storage 的 enableHttpsTrafficOnly 为 false 时，账户可能接受未加密的 HTTP 数据平面请求，SAS、访问令牌和业务数据缺少传输层保护。本模板枚举存储账户并查询 enableHttpsTrafficOnly，在返回 false 时报告未强制安全传输。
  impact: |
    - 网络攻击者可窃听或篡改 HTTP 流量，获取 SAS、令牌、对象内容或队列消息。
    - 明文请求还可能被用于重放和会话劫持，增加数据泄露、恶意修改及业务中断风险。
  remediation: |
    - 将存储账户的 enableHttpsTrafficOnly 设置为 true，并让所有客户端使用 HTTPS 终结点和现代 TLS。
    - 升级仍使用 HTTP 的 SDK、脚本和业务集成，检查重定向、代理及共享访问签名配置，避免保留明文旁路。
  reference:
    - https://docs.microsoft.com/en-us/azure/storage/common/storage-require-secure-transfer
  metadata:
    vendor: microsoft
    product: azure-storage
  tags: cloud,devops,azure,microsoft,azure-storage,azure-cloud-config

flow: |
  code(1);
  for (let StorageAccount of iterate(template.storageAccounts)) {
    StorageAccount = JSON.parse(StorageAccount);
    set("name", StorageAccount.Name);
    code(2);
  }

self-contained: true
code:
  - engine:
      - sh
      - bash
    source: |
      az storage account list --query '[*].{"Name":name}'

    extractors:
      - type: json
        name: storageAccounts
        internal: true
        json:
          - '.[]'

  - engine:
      - sh
      - bash
    source: |
      az storage account show --name "$name" --query 'enableHttpsTrafficOnly'

    matchers-condition: and
    matchers:
      - type: word
        words:
          - 'false'

    extractors:
      - type: dsl
        dsl:
          - 'name + " storage account does not have secure transfer enabled"'
