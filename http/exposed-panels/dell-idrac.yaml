id: dell-idrac

info:
  name: Dell IDRAC 面板识别（指纹识别）
  author: kazet
  severity: info
  description: |-
    检测到目标站点存在 Dell IDRAC 相关响应特征。Dell IDRAC 是服务器、带外管理或远程运维控制台，用于监控硬件状态、远程控制、电源管理和固件维护。模板请求 `/restgui/start.html`、`/login.html` 路径，并通过页面标题或正文关键字、状态码确认该系统指纹，用于资产识别、系统盘点和暴露面梳理。
  classification:
    cvss-metrics: CVSS:3.0/AV:N/AC:L/PR:N/UI:N/S:U/C:N/I:N/A:N
    cwe-id: CWE-200
    cpe: cpe:2.3:a:dell:emc_idrac_service_module:*:*:*:*:*:*:*:*
  metadata:
    verified: true
    max-request: 2
    shodan-query: html:"thisIDRACText"
    product: emc_idrac_service_module
    vendor: dell
  tags: panel,idrac,dell,detect,discovery
http:
  - method: GET
    path:
      - '{{BaseURL}}/restgui/start.html'
      - '{{BaseURL}}/login.html'

    stop-at-first-match: true

    matchers-condition: and
    matchers:
      - type: word
        part: body
        words:
          - '<idrac-start-screen'
          - 'thisIDRACText'
        condition: or

      - type: status
        status:
          - 200
