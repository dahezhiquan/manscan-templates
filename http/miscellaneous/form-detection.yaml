id: form-detection

info:
  name: HTML 表单检测
  author: pdteam
  severity: low
  description: |
    检测页面响应中是否存在 HTML 表单。该信息可用于识别登录、搜索、上传或其他交互入口。
  impact: |
    - 命中结果可帮助攻击者了解站点功能、公开文件、接口能力或技术栈线索。
    - 若该信息并非预期公开，可能辅助目录枚举、版本识别或后续攻击链构造。
  remediation: |
    - 确认该页面、文件或响应头是否需要公开；非必要内容应删除或限制访问。
    - 最小化公开响应中的版本、路径、账号和内部实现信息。
    - 将相关端点纳入资产巡检，定期检查是否出现意外暴露。
  reference:
    - https://github.com/dirtycoder0124/formcrawler
  metadata:
    max-request: 1
  tags: form,misc,miscellaneous,vuln

http:
  - method: GET
    path:
      - "{{BaseURL}}"

    redirects: true
    max-redirects: 2

    matchers:
      - type: word
        part: body
        words:
          - "<form"
          - "</form>"
          - "<button"
        condition: and
