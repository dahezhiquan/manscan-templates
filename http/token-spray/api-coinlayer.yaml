id: api-coinlayer

info:
  name: Coinlayer API Token 可用性校验（token喷洒）
  author: daffainfo
  severity: info
  description: 该模板通过调用 Coinlayer API 的已知接口验证提供的 token 是否有效，命中后通常表示可访问汇率、货币或金融校验能力。
  reference:
    - https://coinlayer.com/documentation
    - https://github.com/daffainfo/all-about-apikey/tree/main/coinlayer
  metadata:
    max-request: 1
  tags: token-spray,coinlayer

self-contained: true

http:
  - method: GET
    path:
      - "https://api.coinlayer.com/live?access_key={{token}}"

    matchers:
      - type: word
        part: body
        words:
          - '"success"'
          - '"terms"'
          - '"privacy"'
        condition: and
