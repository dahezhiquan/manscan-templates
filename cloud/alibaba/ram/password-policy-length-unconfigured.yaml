id: password-policy-length-unconfigured

info:
  name: 阿里云 RAM 密码最小长度小于 14 位（云安全）
  author: DhiyaneshDK
  severity: medium
  description: RAM 密码策略未要求至少 14 位长度时，控制台密码更容易被猜测或暴力破解。模板调用 GetPasswordPolicy 检查 MinimumPasswordLength，当该值小于 14 或未满足 14 位基线时判定密码长度策略不足。
  impact: |
    - 较短密码降低暴力破解成本，尤其在缺少 MFA 或登录失败限制时风险更高。
    - 账号密码强度不达标会削弱身份安全基线并影响合规检查结果。
  remediation: |
    - 将 RAM 密码策略的 MinimumPasswordLength 设置为 14 或更高。
    - 同时启用大小写字母、数字、符号、密码复用限制和 MFA，提高整体账号防护强度。
  reference:
    - https://www.alibabacloud.com/help/en/ram/user-guide/configure-a-password-policy-for-ram-users
    - https://www.trendmicro.com/cloudoneconformity/knowledge-base/alibaba-cloud/AlibabaCloud-RAM/require-14-characters-password-policy.html
  metadata:
    max-request: 1
    verified: true
    vendor: alibaba
    product: ram
  tags: cloud,devops,aliyun,alibaba,alibaba-cloud-config,alibaba-ram

variables:
  region: "cn-hangzhou"

self-contained: true

code:
  - engine:
      - sh
      - bash

    source: |
      aliyun ram GetPasswordPolicy --region $region


    matchers-condition: and
    matchers:
      - type: regex
        regex:
          - \"MinimumPasswordLength\":\s*(1[4-9]|[2-9][0-9]{1,})
        negative: true

      - type: regex
        regex:
          - \"MinimumPasswordLength":\s*(\d|1[0-3])

    extractors:
      - type: dsl
        dsl:
          - '"RAM Password Policy Does not contain Minimum Length "'
