id: netflix-conductor-ui

info:
  name: Netflix Conductor UI 面板识别（暴露面识别）
  author: c-sh0
  severity: info
  description: 该模板通过识别 Netflix Conductor UI 面板、控制台或管理界面的页面特征，判断目标是否暴露了对应服务入口。若命中，说明该后台或运维界面对外可访问，可用于资产识别与暴露面排查。
  classification:
    cvss-metrics: CVSS:3.0/AV:N/AC:L/PR:N/UI:N/S:U/C:N/I:N/A:N
    cwe-id: CWE-200
    cpe: cpe:2.3:a:netflix:conductor:*:*:*:*:*:*:*:*
  metadata:
    max-request: 1
    vendor: netflix
    product: conductor
    shodan-query:
      - http.title:"Conductor UI", http.title:"Workflow UI"
      - http.title:"conductor ui", http.title:"workflow ui"
    fofa-query: title="conductor ui", http.title:"workflow ui"
    google-query: intitle:"conductor ui", http.title:"workflow ui"
  tags: webserver,netflix,conductor,panel,discovery

http:
  - method: GET
    path:
      - "{{BaseURL}}"

    host-redirects: true
    max-redirects: 2

    matchers-condition: and
    matchers:
      - type: status
        status:
          - 200

      - type: word
        part: body
        words:
          - '<title>Conductor UI</title>'
          - '<title>Workflow UI</title>'
        condition: or
