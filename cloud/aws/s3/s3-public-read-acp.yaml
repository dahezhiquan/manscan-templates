id: s3-public-read-acp

info:
  name: S3 Bucket ACL 允许公共 READ_ACP（云安全）
  author: princechaddha
  severity: critical
  description: S3 ACL 对 AllUsers 授予 READ_ACP 时，匿名互联网用户可读取 bucket 或对象 ACL，获得权限结构和授权主体信息。该模板检查 bucket ACL 中 AllUsers 组是否具有 READ_ACP 权限。
  impact: |
    - 攻击者可枚举 ACL 信息，辅助识别可利用的授权关系和公开对象。
    - ACL 暴露会增加侦察面，并可能暴露内部账号、canonical user 等访问控制线索。
  remediation: |
    - 移除 AllUsers 的 READ_ACP 授权，避免通过 ACL 向公众开放权限信息。
    - 启用 S3 Block Public Access，并优先采用 bucket policy 与 IAM policy 管理访问。
  reference:
    - https://docs.aws.amazon.com/cli/latest/reference/s3api/get-bucket-acl.html
  metadata:
    max-request: 2
    vendor: amazon
    product: s3
  tags: cloud,devops,aws,amazon,s3,aws-cloud-config

flow: |
  code(1)
  for(let bucketName of iterate(template.buckets)){
    set("bucket", bucketName)
    code(2)
  }

self-contained: true
code:
  - engine:
      - sh
      - bash
    source: |
      aws s3api list-buckets --query 'Buckets[*].Name'

    extractors:
      - type: json # type of the extractor
        internal: true
        name: buckets
        json:
          - '.[]'

  - engine:
      - sh
      - bash
    source: |
        aws s3api get-bucket-acl --bucket $bucket --query 'Grants[?(Grantee.URI==`http://acs.amazonaws.com/groups/global/AllUsers`)]'

    matchers:
      - type: word
        words:
          - '"Permission": "READ_ACP"'

    extractors:
      - type: dsl
        dsl:
          - '"The S3 bucket " + bucket +" have public READ_ACP access"'
