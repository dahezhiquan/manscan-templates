id: apache-dubbo-unauth

info:
  name: Apache Dubbo 未认证访问（服务漏洞）
  author: j4vaovo
  severity: high
  description: |
    Apache Dubbo 是面向 Java 微服务的 RPC 框架，Dubbo 服务端口暴露在不受信任网络且缺少认证或访问控制时，外部人员可能直接枚举服务接口或调用暴露方法。该模板向 20880 端口发送 `help` 命令，并通过返回的 Dubbo 命令帮助信息确认服务可被未认证访问。
  impact: |
    - 攻击者可能枚举 Dubbo 服务、方法和运行状态，为后续调用敏感接口或横向移动提供信息。
    - 如果业务接口本身缺少鉴权，暴露的 Dubbo 端口可能被直接调用，造成数据泄露、业务篡改或远程执行风险。
  remediation: |
    - 不要将 Dubbo 服务端口直接暴露到公网或不受信任网段，使用防火墙、安全组或服务网格限制访问来源。
    - 启用 Dubbo 认证、鉴权和访问控制能力，并为管理或调试入口设置独立保护。
    - 检查历史访问日志，确认暴露期间是否存在异常服务枚举或接口调用。
  reference:
    - https://dubbo.apache.org/en/docs3-v2/java-sdk/advanced-features-and-usage/security/auth/
  metadata:
    verified: true
    max-request: 1
    fofa-query: apache dubbo
  tags: network,dubbo,apache,unauth,misconfig,tcp,vuln
tcp:
  - inputs:
      - data: "68656c700d0a"
        type: hex

    host:
      - "{{Hostname}}"
    port: 20880
    read-size: 2048

    matchers:
      - type: word
        words:
          - "trace [service] [method] [times]"
