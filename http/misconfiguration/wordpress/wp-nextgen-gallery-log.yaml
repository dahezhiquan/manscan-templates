id: wp-nextgen-gallery-log

info:
  name: WordPress NextGEN Gallery 日志泄露
  author: DhiyaneshDk
  severity: low
  description: |-
    该模板用于核查 WordPress NextGEN Gallery 日志泄露。目标公开了 WordPress 插件日志、调试日志或运行记录，可能泄露请求上下文、错误堆栈、文件路径和组件信息。模板访问 /wp-content/plugins/nextgen-gallery/admin/php_errors.log，并根据日志文件路径、插件关键字或响应内容确认泄露。
  reference:
    - https://wordpress.org/plugins/nextgen-gallery/
  metadata:
    verified: true
    max-requests: 1
    publicwww-query: /wp-content/plugins/nextgen-gallery/
  tags: debug,wordpress,wp-plugin,nextgen-gallery,log
  impact: |-
    - 攻击者可获取站点路径、插件运行状态、异常信息、请求参数或敏感业务线索。
    - 日志内容可能辅助定位组件版本、发现隐藏接口，并为后续攻击提供上下文。
  remediation: |-
    - 禁止通过 Web 直接访问插件日志、调试日志和临时目录。
    - 关闭生产环境调试日志公开输出，将日志保存到受保护目录。
    - 清理历史日志并轮换可能出现在日志中的令牌、密钥和账号凭据。
http:
  - method: GET
    path:
      - "{{BaseURL}}/wp-content/plugins/nextgen-gallery/admin/php_errors.log"

    matchers:
      - type: dsl
        dsl:
          - 'status_code == 200'
          - 'contains(body, "nextgen-gallery")'
          - 'contains_any(body, "PHP Warning:", "failed to open dir")'
        condition: and
