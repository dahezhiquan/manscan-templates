id: nacos-cluster-nodes-info-leak

info:
  name: Alibaba Nacos - 集群节点敏感信息泄露漏洞
  author: dahe
  severity: low
  description: |
    该模板用于检测 Alibaba Nacos - 集群节点敏感信息泄露漏洞。该类问题通常源于调试页面、配置文件、接口响应或目录资源被非预期暴露。模板会向 `/nacos/v1/core/cluster/nodes`、`/v1/core/cluster/nodes` 等位置发送探测请求，并结合响应状态、关键字、错误信息、时间差或外带交互等证据判断目标是否受影响。
  impact: |
    - 攻击者可获取系统版本、路径、账号、密钥、配置或业务数据等敏感信息。
    - 泄露的信息可能被用于后续漏洞匹配、凭据攻击、权限提升或横向移动。
  remediation: |
    - 关闭不必要的调试、示例、备份和信息展示接口，避免向未授权用户返回敏感内容。
    - 对敏感文件和接口增加访问控制，并从 Web 根目录移除备份、日志和配置文件。
    - 排查已泄露的凭据、令牌和配置，必要时执行轮换并检查访问日志。
  reference:
    - https://nacos.io/blog/faq/nacos-user-question-history11845/
    - https://github.com/alibaba/nacos/issues/7872
    - https://github.com/alibaba/nacos/issues/8015
    - https://github.com/alibaba/nacos/issues/10583
  classification:
    cwe-id: CWE-200
    cpe: cpe:2.3:a:alibaba:nacos:*:*:*:*:*:*:*:*
  metadata:
    verified: true
    shodan-query: title:"Nacos"
    fofa-query: app="NACOS"
    product: nacos
    vendor: alibaba
  tags: nacos,alibaba,info-leak,exposure,vuln

http:
  - method: GET
    path:
      - "{{BaseURL}}/nacos/v1/core/cluster/nodes"
      - "{{BaseURL}}/v1/core/cluster/nodes"

    stop-at-first-match: true
    matchers-condition: and
    matchers:
      - type: status
        status:
          - 200

      - type: word
        part: header
        words:
          - "application/json"

      - type: regex
        part: body
        regex:
          - '"code"\s*:\s*200'
          - '"data"\s*:\s*\['
          - '"ip"\s*:\s*"(?:\d{1,3}\.){3}\d{1,3}"'
          - '"port"\s*:\s*\d+'
          - '"state"\s*:\s*"(?:UP|DOWN)"'
          - '"address"\s*:\s*"(?:\d{1,3}\.){3}\d{1,3}:\d+"'
        condition: and

      - type: word
        part: body
        words:
          - '"raftPort"'
          - '"abilities"'
          - '"version"'
        condition: or
