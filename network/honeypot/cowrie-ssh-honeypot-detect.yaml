id: cowrie-ssh-honeypot-detect

info:
  name: Cowrie SSH 蜜罐识别（蜜罐识别）
  author: UnaPibaGeek
  severity: info
  description: |
    Cowrie 是常用于捕获 SSH/Telnet 暴力破解和命令行为的中交互蜜罐。该模板发送异常的 SSH 协议版本横幅 `SSH-1337-OpenSSH_9.0`，并通过 `Protocol major versions differ` 或 `bad version 1337` 等响应特征识别 Cowrie SSH 蜜罐。
  metadata:
    max-request: 1
    vendor: cowrie
    product: ssh
  tags: cowrie,twisted,ssh,honeypot,ir,cti,network,tcp,discovery
tcp:
  - inputs:
      - data: "SSH-1337-OpenSSH_9.0\r\n"

    host:
      - '{{Hostname}}'
    port: 22

    matchers-condition: and
    matchers:
      - type: regex
        part: body
        regex:
          - 'SSH\-([0-9.-A-Za-z_ ]+)'

      - type: word
        words:
          - Protocol major versions differ.
          - bad version 1337
        condition: or
