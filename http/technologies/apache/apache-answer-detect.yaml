id: apache-answer-detect

info:
  name: Apache Answer 指纹识别（指纹识别）
  author: omranisecurity
  severity: info
  description: |-
    Apache Answer 是问答社区平台，用于知识问答、内容组织和用户协作。该模板请求 `/answer/api/v1/siteinfo`，并依据 HTTP 200 状态码、页面标题、正文关键字或品牌资源特征、响应头特征识别目标是否使用或暴露了 Apache Answer 相关组件，适用于资产盘点、技术栈识别和后续安全评估；命中结果仅表示指纹特征匹配，不代表已确认存在可利用漏洞。
  reference:
  - https://answer.apache.org/
  classification:
    cpe: cpe:2.3:a:apache:answer:*:*:*:*:*:*:*:*
  metadata:
    verified: true
    max-request: 1
    vendor: apache
    product: answer
    shodan-query: http.favicon.hash:523757057
    fofa-query: icon_hash="523757057"
  tags: detect,tech,apache,discovery

http:
  - method: GET
    path:
      - "{{BaseURL}}/answer/api/v1/siteinfo"

    matchers-condition: and
    matchers:
      - type: word
        part: body
        words:
          - '"code":'

      - type: word
        part: header
        words:
          - application/json

      - type: status
        status:
          - 200

    extractors:
      - type: regex
        part: body
        name: version
        regex:
          - '"version":"([^"]+)"'
