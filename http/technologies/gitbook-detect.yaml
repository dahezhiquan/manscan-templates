id: gitbook-detect

info:
  name: GitBook 指纹识别（指纹识别）
  author: ffffffff0x,daffainfo
  severity: info
  description: >-
    GitBook 是文档托管和知识库平台，用于发布产品文档、开发者文档和内部知识库。该模板通过请求目标服务并检查预设路径或首页响应、页面正文关键字、正则特征等指纹特征，判断目标是否使用或暴露了
    GitBook 相关组件；命中结果仅表示指纹特征匹配，可用于资产盘点、技术栈识别和后续安全评估，不代表已确认存在可利用漏洞。
  reference:
  - https://www.gitbook.com/
  classification:
    cpe: cpe:2.3:a:gitbook:gitbook:*:*:*:*:*:*:*:*
  metadata:
    verified: true
    max-request: 1
    vendor: gitbook
    product: gitbook
    shodan-query: http.title:"gitbook"
    fofa-query: app="Introduction-GitBook"
  tags: tech,gitbook,discovery
http:
  - method: GET
    path:
      - "{{BaseURL}}"

    matchers-condition: or
    matchers:
      - type: word
        part: body
        words:
          - 'gitbook.page.hasChanged'
          - '<meta name="generator" content="GitBook'
        condition: and

      - type: regex
        part: body
        regex:
          - "<title>.*[Gg]it[bB]ook</title>"
          - "<title>.*· [Gg]it[bB]ook.*</title>"
        condition: or

    extractors:
      - type: regex
        group: 1
        regex:
          - '<meta name="generator" content="GitBook ([0-9.]+)">'
          - '(?m)<meta name=generator content="GitBook ([0-9.]+)">'
