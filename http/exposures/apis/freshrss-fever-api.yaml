id: freshrss-fever-api

info:
  name: FreshRSS Fever API 暴露（暴露面识别）
  author: ritikchaddha
  severity: low
  description: |
    检测到对外可访问的 FreshRSS Fever API。公开的接口文档、调试端点或管理 API 可能泄露路由结构、参数格式、鉴权方式和内部功能边界，从而帮助攻击者快速完成接口枚举与利用准备。
  reference:
    - https://freshrss.github.io/FreshRSS/en/developers/06_Fever_API.html
  metadata:
    max-request: 1
    verified: true
    shodan-query: http.html:"FreshRSS"
  tags: exposure,freshrss,fever,api

http:
  - method: GET
    path:
      - "{{BaseURL}}/api/"

    matchers-condition: and
    matchers:
      - type: word
        part: body
        words:
          - "FreshRSS API endpoints"
          - "Fever compatible API"
        condition: and

      - type: status
        status:
          - 200
