id: gcloud-public-access-prevention-not-enabled

info:
  name: Enforce Public 访问 Prevention 的Cloud Storage Buckets（云安全）
  author: princechaddha
  severity: high
  description: Public Access Prevention 可阻止 bucket 或对象被授予公开访问，未启用时更容易因 IAM 或 ACL 误配置导致数据公开。本模板检查 bucket public_access_prevention 字段，未返回 inherited 或 enforced 时报告未启用公开访问防护。
  impact: |
    - allUsers 或 allAuthenticatedUsers 授权可能导致敏感对象被匿名访问或下载。
    - 缺少防护栏会增加人为误配置导致公开泄露的概率。
  remediation: |
    - 在 bucket 或组织层启用 Public Access Prevention，优先使用 enforced 模式保护敏感 bucket。
    - 同时清理历史公开 IAM/ACL 授权，并定期审计公开访问状态。
  reference:
    - https://cloud.google.com/storage/docs/public-access-prevention
  metadata:
    vendor: google
    product: cloud-storage
  tags: cloud,devops,gcp,gcloud,google-cloud-storage,security,public-access-prevention,gcp-cloud-config

flow: |
  code(1)
  for(let projectId of iterate(template.projectIds)){
    set("projectId", projectId)
    code(2)
    for(let bucketName of iterate(template.buckets)){
      set("bucketName", bucketName)
      code(3)
    }
  }

self-contained: true

code:
  - engine:
      - sh
      - bash
    source: |
      gcloud projects list --format="json(projectId)"

    extractors:
      - type: json
        name: projectIds
        internal: true
        json:
          - ".[].projectId"

  - engine:
      - sh
      - bash
    source: |
      gcloud storage buckets list --project $projectId --format="json(name)"

    extractors:
      - type: json
        name: buckets
        internal: true
        json:
          - ".[].name"

  - engine:
      - sh
      - bash
    source: |
      gcloud storage buckets describe gs://$bucketName --format="json(public_access_prevention)" | jq -r '. // "null"'

    matchers:
      - type: word
        negative: true
        words:
          - "inherited"
          - "enforced"

    extractors:
      - type: dsl
        dsl:
          - '"Public Access Prevention is not enabled for the bucket " + bucketName + " in project " + projectId'
