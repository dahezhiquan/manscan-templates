id: salesforce-aura

info:
  name: Salesforce Lightning API 暴露
  author: aaron_costello (@ConspiracyProof),Ph33rr
  severity: medium
  description: |
    该模板用于核查 Salesforce Lightning API 暴露。该类问题通常源于高危管理接口未授权开放、危险方法启用或可写接口暴露，攻击者可借助接口能力写入文件或触发命令执行。模板会向目标发送探测请求，并依据请求 `/aura`、`/s/sfsites/aura`、匹配 `aura:invalidSession`等证据确认目标是否存在该配置问题。
  impact: |
    - 攻击者可能上传文件、执行命令、提交任务或控制目标服务。
    - 成功利用后可导致主机沦陷、数据泄露、横向移动和业务中断。
  remediation: |
    - 立即为相关接口启用认证授权并限制可信来源访问。
    - 关闭不必要的危险 HTTP 方法、远程执行能力和可写管理接口。
    - 检查系统进程、上传目录和访问日志，清理异常文件并轮换凭据。
  reference:
    - https://www.enumerated.de/index/salesforce
    - https://github.com/Ph33rr/cirrusgo (test endpoint)
  classification:
    cvss-metrics: CVSS:3.0/AV:N/AC:L/PR:N/UI:N/S:U/C:N/I:N/A:N
    cvss-score: 0
    cwe-id: CWE-200
  metadata:
    max-request: 5
  tags: aura,unauth,salesforce,exposure,misconfig,vuln

http:
  - method: POST
    path:
      - "{{BaseURL}}/aura"
      - "{{BaseURL}}/s/sfsites/aura"
      - "{{BaseURL}}/sfsites/aura"
      - "{{BaseURL}}/s/aura"
      - "{{BaseURL}}/s/fact"

    body: "{}"
    matchers:
      - type: word
        part: body
        words:
          - 'aura:invalidSession'
