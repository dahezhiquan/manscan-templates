id: java-rmi-detect

info:
  name: Java Remote Method Invocation 协议识别（指纹识别）
  author: F1tz
  severity: info
  description: |
    Java Remote Method Invocation（RMI）是 Java 远程对象调用机制，用于跨 JVM 调用远程服务。该模板发送 RMI 协议探测并读取握手或协商响应中的产品标识，用于识别目标是否开放 Java RMI 服务。
  classification:
    cvss-metrics: CVSS:3.1/AV:N/AC:L/PR:N/UI:N/S:U/C:N/I:N/A:N
    cvss-score: 0
    cwe-id: CWE-200
  metadata:
    max-request: 1
  tags: network,rmi,java,detect,tcp,discovery
tcp:
  - inputs:
      - data: "{{hex_decode('4a524d4900024b')}}"
    host:
      - "{{Hostname}}"
    read-size: 1024
    matchers:
      - type: regex
        part: raw
        regex:
          - "^N\\x00\\x0e(\\d{1,3}\\.){3}\\d{1,3}\\x00\\x00"
