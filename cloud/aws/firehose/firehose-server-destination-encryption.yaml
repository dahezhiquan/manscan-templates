id: firehose-server-destination-encryption

info:
  name: Firehose 目标存储加密未启用（云安全）
  author: DhiyaneshDK
  severity: medium
  description: Amazon Data Firehose 目标端加密未配置时，投递到 S3 等目的地的数据缺少显式的服务端加密约束和密钥审计能力。该模板枚举 delivery stream，并检查 ExtendedS3 目标的 EncryptionConfiguration 是否返回 NoEncryption。
  impact: |
    - 日志、事件或业务数据在落盘到目标存储时可能缺少预期的 KMS 密钥保护，增加敏感数据泄露后的影响范围。
    - 缺少客户管理密钥时，密钥轮换、访问审计和合规证明能力会变弱。
  remediation: |
    - 为 Firehose 目标存储启用服务端加密，并按敏感度选择 AWS KMS 客户管理密钥。
    - 同步检查目标 S3 bucket 的默认加密、bucket policy 和 KMS key policy，确保投递链路持续满足加密要求。
  reference:
    - https://www.trendmicro.com/cloudoneconformity-staging/knowledge-base/aws/Firehose/delivery-stream-destination-encryption.html
    - https://docs.aws.amazon.com/AmazonS3/latest/dev/UsingKMSEncryption.html
  metadata:
    vendor: amazon
    product: firehose
  tags: cloud,devops,aws,amazon,firehose,aws-cloud-config
variables:
  region: "us-west-2"

flow: |
  code(1)
  for(let DeliveryStreamNames of iterate(template.deliverys)){
    set("delivery", DeliveryStreamNames)
    code(2)
  }

self-contained: true

code:
  - engine:
      - sh
      - bash
    source: |
      aws firehose list-delivery-streams --region $region --query 'DeliveryStreamNames' --output json

    extractors:
      - type: json
        name: deliverys
        internal: true
        json:
          - '.[]'

  - engine:
      - sh
      - bash
    source: |
        aws firehose describe-delivery-stream --region $region --delivery-stream-name $delivery --query 'DeliveryStreamDescription.Destinations[*].ExtendedS3DestinationDescription.EncryptionConfiguration' --output json

    matchers:
      - type: word
        words:
          - "NoEncryption"

    extractors:
      - type: dsl
        dsl:
          - '"Firehose Delivery Stream Destination " + delivery + " Encryption is Disabled"'
