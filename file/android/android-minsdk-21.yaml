id: android-minsdk-21

info:
  name: Android minSdkVersion 过低（本地文件安全扫描）
  author: Th3l0newolf
  severity: medium
  description: |
    该模板检测 AndroidManifest.xml 中 minSdkVersion 是否设置为 21。过低的最低 SDK 会允许应用运行在缺少现代安全特性的旧 Android 系统上。
  metadata:
    verified: true
    github-query: path:**/AndroidManifest.xml
  tags: android,file

file:
  - extensions:
      - xml

    matchers:
      - type: regex
        part: body
        regex:
          - "android:minSdkVersion\\s*=\\s*['\"]21['\"]"
