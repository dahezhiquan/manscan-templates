id: gcloud-logging-sink-not-configured

info:
  name: Export All Log Entries Using Sinks 未Configured（云安全）
  author: princechaddha
  severity: medium
  description: 日志 sink 用于将项目日志导出到集中存储、SIEM 或长期归档位置，缺少全量导出会影响跨项目审计。本模板列出项目 logging sinks，并以 filter 为空的接收器作为全量日志导出配置的检查信号。
  impact: |
    - 关键日志可能只保留在项目本地，安全团队无法集中关联查询或长期归档。
    - 项目删除、权限误改或保留期不足时，缺少外部导出会增加日志丢失风险。
  remediation: |
    - 为项目、文件夹或组织配置 logging sink，将需要保留的日志导出到集中且受控的目标。
    - 根据审计目标设置合适的 filter、接收端权限和保留策略，并定期验证 sink 是否持续工作。
  reference:
    - https://cloud.google.com/logging/docs/export/configure_export_v2
  metadata:
    vendor: google
    product: cloud-logging
  tags: cloud,devops,gcp,gcloud,google-cloud-logging,gcp-cloud-config

flow: |
  code(1)
  for(let projectId of iterate(template.projectIds)){
    set("projectId", projectId)
    code(2)
  }

self-contained: true

code:
  - engine:
      - sh
      - bash
    source: |
      gcloud projects list --format="json(projectId)"

    extractors:
      - type: json
        name: projectIds
        internal: true
        json:
          - '.[].projectId'

  - engine:
      - sh
      - bash
    source: |
      gcloud logging sinks list --project=$projectId --format="json(name,filter)"

    matchers:
      - type: word
        words:
          - '"filter": ""'

    extractors:
      - type: dsl
        dsl:
          - '"No log sinks configured to export all entries in project: " + projectId'
