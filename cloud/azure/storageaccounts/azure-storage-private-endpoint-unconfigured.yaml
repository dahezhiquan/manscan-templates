id: azure-storage-private-endpoint-unconfigured
info:
  name: Azure Storage Private Endpoint 未Configured（云安全）
  author: princechaddha
  severity: high
  description: Azure Storage Private Endpoint 可将数据平面访问引入虚拟网络并减少对公共终结点的依赖；未配置 Private Endpoint 时，敏感账户通常仍通过公共终结点提供服务。本模板枚举存储账户并查询 privateEndpointConnections，在返回空数组 [] 时报告未发现已配置的 Private Endpoint；是否构成风险还需结合公网访问、网络 ACL 和业务用途复核。
  impact: |
    - 数据平面可从公共网络到达时，泄露的凭据、SAS 或应用漏洞更容易被用于探测、数据外传和恶意写入。
    - 缺少私有网络路径会降低网络隔离和出站控制能力；但若账户已关闭公共访问或有严格 ACL，未配置 Private Endpoint 不必然表示可被未授权访问。
  remediation: |
    - 对承载敏感数据或内部服务的账户配置 Private Endpoint、对应的私有 DNS 区域和虚拟网络路由。
    - 同步关闭不需要的公共网络访问或将 defaultAction 设置为 Deny，并根据业务依赖保留已批准的网络规则；对明确需要公共访问的账户记录例外。
  reference:
    - https://docs.microsoft.com/en-us/azure/storage/common/storage-private-endpoints
  metadata:
    vendor: microsoft
    product: azure-storage
  tags: cloud,devops,azure,microsoft,azure-storage,azure-cloud-config

flow: |
  code(1);
  for (let StorageAccount of iterate(template.storageAccounts)) {
    StorageAccount = JSON.parse(StorageAccount);
    set("name", StorageAccount.Name);
    code(2);
  }

self-contained: true
code:
  - engine:
      - sh
      - bash
    source: |
      az storage account list --query '[*].{"Name":name}'

    extractors:
      - type: json
        name: storageAccounts
        internal: true
        json:
          - '.[]'

  - engine:
      - sh
      - bash
    source: |
      az storage account show --name "$name" --query 'privateEndpointConnections' --output json

    matchers-condition: and
    matchers:
      - type: word
        words:
          - '[]'

    extractors:
      - type: dsl
        dsl:
          - 'name + " does not have any configured private endpoints."'
