id: seafile-api

info:
  name: Seafile API 识别（指纹识别）
  author: righettod
  severity: info
  description: |
    Seafile 是企业文件同步与共享系统，常用于文档协作、文件库管理和私有云盘部署。该模板用于识别目标是否部署了相关系统或接口，检测时请求 `/api2/server-info/`，并依据 HTTP 状态码、页面标题、响应正文关键字、接口返回字段或其他指纹特征进行判断。该模板仅用于资产识别和暴露面梳理，不代表目标一定存在可利用漏洞。
  reference:
    - https://download.seafile.com/published/web-api/home.md
    - https://manual.seafile.com/
    - https://www.seafile.com/en/home/
  classification:
    cpe: cpe:2.3:a:seafile:seafile:*:*:*:*:*:*:*:*
  metadata:
    verified: true
    max-request: 1
    vendor: seafile
    product: seafile
    shodan-query: http.html:"seafile"
  tags: exposure,api,detect,discovery

http:
  - method: GET
    path:
      - '{{BaseURL}}/api2/server-info/'

    matchers-condition: and
    matchers:
      - type: word
        part: body
        words:
          - 'seafile-basic'
          - 'seafile-pro'
        condition: or

      - type: word
        part: header
        words:
          - 'application/json'

      - type: status
        status:
          - 200

    extractors:
      - type: regex
        part: body
        group: 1
        regex:
          - '"version":\s*"([0-9.]+)"'
