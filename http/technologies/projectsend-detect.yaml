id: projectsend-detect

info:
  name: ProjectSend 登录面板 指纹识别（指纹识别）
  author: idealphase
  severity: info
  description: >-
    ProjectSend 是文件共享和客户文件交付系统，登录面板用于访问文件管理、客户和权限配置。该模板通过请求目标服务并检查预设路径或首页响应、正则特征、状态码等指纹特征，判断目标是否使用或暴露了
    ProjectSend 登录面板 相关组件；命中结果仅表示指纹特征匹配，可用于资产盘点、技术栈识别和后续安全评估，不代表已确认存在可利用漏洞。
  reference:
  - https://www.exploit-db.com/ghdb/7380
  - https://github.com/projectsend/projectsend
  classification:
    cvss-metrics: CVSS:3.1/AV:N/AC:L/PR:N/UI:N/S:U/C:N/I:N/A:N
    cvss-score: 0
    cwe-id: CWE-200
    cpe: cpe:2.3:a:projectsend:projectsend:*:*:*:*:*:*:*:*
  metadata:
    max-request: 1
    google-query: intext:Provided by ProjectSend
    product: projectsend
    vendor: projectsend
  tags: tech,projectsend,edb,discovery
http:
  - method: GET
    path:
      - '{{BaseURL}}'

    matchers-condition: and
    matchers:
      - type: regex
        part: body
        regex:
          - 'Provided by <a href="https?:\/\/www\.projectsend\.org\/" target="_blank">ProjectSend<\/a>'

      - type: status
        status:
          - 200

    extractors:
      - type: regex
        part: body
        group: 1
        regex:
          - "version (.*) - Free software"
