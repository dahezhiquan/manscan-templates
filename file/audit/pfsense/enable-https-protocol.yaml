id: enable-https-protocol

info:
  name: pfSense Web 管理入口未强制 HTTPS（本地文件安全扫描）
  author: pussycat0x
  severity: info
  description: |
    该模板检测 pfSense Web 管理入口是否仅允许 HTTPS。HTTP 会明文传输密码和管理数据，且无法验证服务端身份。
  reference:
    - https://docs.netgate.com/pfsense/en/latest/config/advanced-admin.html
  classification:
    cvss-metrics: CVSS:3.1/AV:N/AC:L/PR:N/UI:N/S:U/C:N/I:N/A:N
    cvss-score: 0
    cwe-id: CWE-200
  metadata:
    verified: true
  tags: firewall,config,audit,pfsense,file

file:
  - extensions:
      - xml

    matchers-condition: and
    matchers:
      - type: word
        words:
          - "<webgui>"
          - "<protocol>https</protocol>"
        condition: and
        negative: true

      - type: word
        words:
          - "<pfsense>"
          - "<system>"
        condition: and

