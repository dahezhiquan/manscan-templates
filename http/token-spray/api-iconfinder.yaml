id: api-iconfinder

info:
  name: IconFinder API Token 可用性校验（token喷洒）
  author: daffainfo
  severity: info
  description: 该模板通过调用 IconFinder API 的已知接口验证提供的 token 是否有效，命中后通常表示可访问相关 API 能力。
  reference:
    - https://developer.iconfinder.com/reference/overview-1
    - https://github.com/daffainfo/all-about-apikey/tree/main/iconfinder
  metadata:
    max-request: 1
  tags: token-spray,iconfinder

self-contained: true

http:
  - raw:
      - |
        GET https://api.iconfinder.com/v4/icons/search?query=arrow&count=10 HTTP/1.1
        Host: api.iconfinder.com
        Accept: application/json
        Authorization: Bearer {{token}}

    matchers:
      - type: word
        part: body
        words:
          - '"icons":'
          - '"is_icon_glyph":'
          - '"download_url":'
        condition: and
