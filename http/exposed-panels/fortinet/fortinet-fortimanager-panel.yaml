id: fortinet-fortimanager-panel

info:
  name: Fortinet FortiManager 面板识别（暴露面识别）
  author: johnk3r
  severity: info
  description: |
    该模板通过识别 Fortinet FortiManager 面板、控制台或管理界面的页面特征，判断目标是否暴露了对应服务入口。若命中，说明该后台或运维界面对外可访问，可用于资产识别与暴露面排查。
  reference:
    - https://www.fortinet.com/br/products/management/fortimanager
  classification:
    cvss-metrics: CVSS:3.0/AV:N/AC:L/PR:N/UI:N/S:U/C:N/I:N/A:N
    cwe-id: CWE-200
    cpe: cpe:2.3:a:fortinet:fortimanager:*:*:*:*:*:*:*:*
  metadata:
    max-request: 1
    vendor: fortinet
    product: fortimanager
    shodan-query: 'http.html_hash:-1527157728 "Model: FMG-VM"'
    fofa-query: title="FortiManager-"
  tags: panel,fortinet,fortios,fortimanager,detect,discovery

http:
  - method: GET
    path:
      - "{{BaseURL}}/p/login/"

    matchers-condition: and
    matchers:
      - type: word
        part: body
        words:
          - "FortiManager"

      - type: status
        status:
          - 200

    extractors:
      - type: regex
        part: body
        group: 1
        regex:
          - '<span class="platform">(.*?)</span>'
