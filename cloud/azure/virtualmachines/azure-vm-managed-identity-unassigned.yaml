id: azure-vm-managed-identity-unassigned
info:
  name: Azure VM Managed Identity 未Assigned（云安全）
  author: princechaddha
  severity: medium
  description: Azure VM 的 Managed Identity 可让应用使用短期 Entra 令牌访问 Key Vault、Storage 等服务，避免在代码或磁盘中保存长期凭据。本模板枚举虚拟机并查询 identity，在 IdentityConfig 返回 null 时报告未配置托管身份。
  impact: |
    - 应用可能退回使用账户密钥、连接字符串或服务主体密码，凭据泄露后难以及时撤销并可能影响多个资源。
    - 缺少工作负载身份还会削弱按资源隔离权限、审计调用来源和自动轮换凭据的能力。
  remediation: |
    - 按应用依赖配置系统分配或用户分配的 Managed Identity，并仅授予目标资源所需的最小 RBAC 权限。
    - 迁移应用使用 Entra 令牌后删除旧密钥和连接字符串，审计身份令牌访问并设置权限定期评审。
  reference:
    - https://docs.microsoft.com/en-us/azure/active-directory/managed-identities-azure-resources/overview
  metadata:
    vendor: microsoft
    product: azure-virtual-machines
  tags: cloud,devops,azure,microsoft,vm,azure-cloud-config

flow: |
  code(1);
  for (let VMData of iterate(template.vmList)) {
    VMData = JSON.parse(VMData);
    set("ids", VMData.id);
    code(2);
  }

self-contained: true
code:
  - engine:
      - sh
      - bash
    source: |
      az vm list --query '[*].{"id":id}'

    extractors:
      - type: json
        name: vmList
        internal: true
        json:
          - '.[]'

  - engine:
      - sh
      - bash
    source: |
      az vm show --ids "$ids" --query '{"IdentityConfig": identity}'

    matchers-condition: and
    matchers:
      - type: word
        words:
          - '"IdentityConfig": null'

    extractors:
      - type: dsl
        dsl:
          - 'ids + " does not have a system-assigned managed identity enabled"'
