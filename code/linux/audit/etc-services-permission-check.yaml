id: etc-services-permission-check

info:
  name: /etc/services 权限异常（本地基线扫描）
  author: songyaeji
  severity: high
  description: |
    `/etc/services` 维护端口与服务名称映射，属主或权限异常会让非授权用户篡改服务标识，干扰运维排障、审计分析和安全工具判断。模板通过 `stat` 检查该文件是否归 `root:root` 所有且权限为 `600`、`640` 或 `644`，不满足时表示本地基线异常。
  impact: |
    - 本地攻击者可能修改端口名称映射，掩盖异常通信或误导日志分析。
    - 权限过宽会破坏系统关键配置文件的完整性基线。
  remediation: |
    - 将 `/etc/services` 属主和属组设置为 `root:root`。
    - 将权限收敛到 `644` 或更严格值，并排查是否存在异常变更来源。
  reference:
    - https://isms.kisa.or.kr
  tags: linux,code,audit,compliance,local

self-contained: true

code:
  - engine:
      - sh
      - bash
    source: |
      stat -c "%U %G %a" /etc/services 2>/dev/null || echo "not-found"

    matchers:
      - type: regex
        part: response
        regex:
          - '^root\s+root\s+(600|640|644)$'
