id: appcms-detect

info:
  name: AppCms 指纹识别（指纹识别）
  author: princechaddha
  severity: info
  description: AppCms 是内容管理系统，用于网站内容、栏目和后台配置管理。该模板请求首页，并依据 HTTP 200 状态码、页面标题、正文关键字或品牌资源特征识别目标是否使用或暴露了 AppCms 相关组件，适用于资产盘点、技术栈识别和后续安全评估；命中结果仅表示指纹特征匹配，不代表已确认存在可利用漏洞。
  classification:
    cpe: cpe:2.3:a:appcms:appcms:*:*:*:*:*:*:*:*
  metadata:
    max-request: 1
    vendor: appcms
    product: appcms
    shodan-query: http.html:"Powerd by AppCMS"
  tags: tech,appcms,discovery

http:
  - method: GET
    path:
      - "{{BaseURL}}"

    matchers-condition: and
    matchers:
      - type: regex
        part: body
        regex:
          - '<!-- Powerd by AppCMS (.*) -->'

      - type: status
        status:
          - 200

    extractors:
      - type: regex
        part: body
        group: 1
        regex:
          - '<!-- Powerd by AppCMS (.*) -->'
