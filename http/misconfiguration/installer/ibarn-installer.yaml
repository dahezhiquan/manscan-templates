id: ibarn-installer

info:
  name: iBarn 安装向导 暴露
  author: ritikchaddha
  severity: high
  description: |
    检测到 iBarn 安装向导 暴露。该页面属于安装、初始化或配置向导流程，若对外暴露，攻击者可能完成初始化、创建管理员账户或重新配置目标系统。
  metadata:
    verified: true
    max-request: 1
    product: ibarn
    shodan-query: title:"iBarn"
    fofa-query: title="iBarn"
  tags: ibarn,installer,exposure,misconfig,vuln

http:
  - method: GET
    path:
      - "{{BaseURL}}"

    matchers-condition: and
    matchers:
      - type: word
        part: body
        words:
          - "iBarn"
          - "install()"
        condition: and

      - type: status
        status:
          - 200
