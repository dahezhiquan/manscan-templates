id: wordpress-elementor-plugin-listing

info:
  name: WordPress Elementor Plugin Directory Listing
  author: dhiyaneshDK
  severity: info
  description: WordPress Elementor Plugin Directory Listing 存在安全漏洞。该模板依据实际请求路径、返回特征与命中证据验证目标是否暴露相应漏洞。
  reference:
    - https://www.exploit-db.com/ghdb/6297
  metadata:
    max-request: 1
  tags: listing,plugin,edb,wordpress,vuln

http:
  - method: GET
    path:
      - "{{BaseURL}}/wp-content/plugins/elementor/"

    matchers-condition: and
    matchers:
      - type: word
        words:
          - "Index of"
          - "/wp-content/plugins/elementor/"
        condition: and

      - type: status
        status:
          - 200
