id: k8s-cpu-requests-not-set

info:
  name: CPU Requests not set 中的Deployments（云安全）
  author: princechaddha
  severity: medium
  description: Deployment 未设置 CPU requests 会让调度器无法准确评估 Pod 的基础 CPU 需求，容易造成节点过度承载。本模板枚举所有 Deployment，检查 Pod 模板容器是否缺少 resources.requests.cpu。
  impact: |
    - 调度器可能把过多工作负载放到同一节点，导致资源争抢和服务性能不可预测。
    - 在高峰或故障场景下，缺少 requests 会增加驱逐、延迟和可用性问题。
  remediation: |
    - 为每个容器配置合理的 resources.requests.cpu，并基于历史监控数据调整。
    - 在命名空间层使用 ResourceQuota 和 LimitRange 约束新工作负载默认资源请求。
  reference:
    - https://kubernetes.io/docs/tasks/configure-pod-container/assign-cpu-resource/
  metadata:
    vendor: kubernetes
    product: kubernetes
  tags: cloud,devops,kubernetes,devsecops,deployments,k8s-cluster-security
flow: |
  code(1);
  for (let deployment of template.items) {
    set("deployment",deployment)
    javascript(1);
  }

self-contained: true

code:
  - engine:
      - sh
      - bash
    source: kubectl get deployments --all-namespaces --output=json
    extractors:
      - type: json
        name: items
        internal: true
        json:
          - '.items[]'

javascript:
  - code: |
        deployment = JSON.parse(template.deployment);
        if (!deployment.spec.template.spec.containers.some(container => container.resources && container.resources.requests && container.resources.requests.cpu)) {
          let result = (`Deployment '${deployment.metadata.name}' in namespace '${deployment.metadata.namespace}' lacks CPU requests.`);
          Export(result);
        }

    extractors:
      - type: dsl
        dsl:
          - response
