id: redmine-cli-detect

info:
  name: Redmine CLI 配置文件 指纹识别（指纹识别）
  author: geeknik
  severity: info
  description: >-
    Redmine 是项目管理和问题跟踪系统，CLI 配置文件可反映相关工具或集成环境的存在。该模板通过请求目标服务并检查预设路径或首页响应、页面正文关键字、状态码等指纹特征，判断目标是否使用或暴露了
    Redmine CLI 配置文件 相关组件；命中结果仅表示指纹特征匹配，可用于资产盘点、技术栈识别和后续安全评估，不代表已确认存在可利用漏洞。
  metadata:
    max-request: 1
  tags: tech,redmine,discovery
http:
  - method: GET
    path:
      - "{{BaseURL}}/.redmine-cli"

    matchers-condition: and
    matchers:
      - type: word
        part: body
        words:
          - "default"
          - "my_id"
          - "root_url"
        condition: and

      - type: status
        status:
          - 200
