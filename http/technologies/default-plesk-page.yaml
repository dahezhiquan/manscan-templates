id: default-plesk-page

info:
  name: Plesk 默认测试页面 指纹识别（指纹识别）
  author: dhiyaneshDk
  severity: info
  description: Plesk 默认测试页面 是服务器托管控制面板，用于网站、域名、邮箱、数据库和证书管理。该模板请求首页，并依据页面标题、正文关键字或品牌资源特征识别目标是否使用或暴露了 Plesk 默认测试页面 相关组件，适用于资产盘点、技术栈识别和后续安全评估；命中结果仅表示指纹特征匹配，不代表已确认存在可利用漏洞。
  classification:
    cpe: cpe:2.3:a:plesk:plesk:*:*:*:*:*:*:*:*
  metadata:
    max-request: 1
    vendor: plesk
    product: plesk
    shodan-query: http.title:"Web Server's Default Page"
  tags: tech,plesk,discovery

http:
  - method: GET
    path:
      - '{{BaseURL}}'

    matchers:
      - type: word
        words:
          - "<title>Web Server's Default Page</title>"
        part: body
