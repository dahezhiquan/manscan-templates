id: gcloud-org-detailed-audit-logging

info:
  name: Detailed 审计 日志记录 Mode未启用（云安全）
  author: princechaddha
  severity: medium
  description: Detailed audit logging mode 可增强 Cloud Storage 等资源的审计细节，未启用会降低对数据访问和管理操作的可见性。本模板检查 gcp.detailedAuditLoggingMode 组织策略 booleanPolicy，返回空对象 {} 时报告详细审计日志模式未启用。
  impact: |
    - 数据访问和对象操作缺少更细粒度审计证据，影响泄露调查、责任追踪和合规留痕。
    - 安全检测规则可用字段减少，可能延迟发现异常访问模式。
  remediation: |
    - 启用 gcp.detailedAuditLoggingMode 组织策略，并确认日志接收端、保留期和访问控制满足要求。
    - 将详细审计日志接入集中分析和告警流程，定期验证关键数据访问场景的日志完整性。
  reference:
    - https://www.trendmicro.com/cloudoneconformity/knowledge-base/gcp/ResourceManager/enable-detailed-audit-logging.html
    - https://cloud.google.com/resource-manager/docs/organization-policy/org-policy-constraints
  metadata:
    vendor: google
    product: resource-manager
  tags: cloud,devops,gcp,gcloud,resourcemanager,security,audit,logging,gcp-cloud-config

flow: |
  code(1)
  for(let orgId of iterate(template.orgIds)){
    set("orgId", orgId)
    code(2)
  }

self-contained: true

code:
  - engine:
      - sh
      - bash
    source: |
      gcloud organizations list --format="json(name)"

    extractors:
      - type: json
        name: orgIds
        internal: true
        json:
          - '.[].name'

  - engine:
      - sh
      - bash
    source: |
      gcloud alpha resource-manager org-policies describe gcp.detailedAuditLoggingMode --organization=$orgId --effective --format="json(booleanPolicy)"

    matchers:
      - type: word
        words:
          - "{}"

    extractors:
      - type: dsl
        dsl:
          - '"Organization " + orgId + " has not enabled detailed audit logging mode for Cloud Storage resources"'
