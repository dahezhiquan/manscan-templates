id: default-apache-miracle

info:
  name: Default Apache Miracle Linux Web 服务器 Page 指纹识别（指纹识别）
  author: DhiyaneshDK
  severity: info
  description: Default Apache Miracle Linux Web 服务器 Page 是 Apache 在 Miracle Linux 上的默认测试页面，用于确认 Web 服务器安装状态。该模板请求首页，并依据 HTTP 200 状态码、页面标题、正文关键字或品牌资源特征识别目标是否使用或暴露了 Default Apache Miracle Linux Web 服务器 Page 相关组件，适用于资产盘点、技术栈识别和后续安全评估；命中结果仅表示指纹特征匹配，不代表已确认存在可利用漏洞。
  metadata:
    verified: true
    max-request: 1
    shodan-query: title:"Apache Miracle Linux Web Server"
  tags: tech,default-page,apache,miracle,discovery

http:
  - method: GET
    path:
      - '{{BaseURL}}'

    matchers-condition: and
    matchers:
      - type: word
        part: body
        words:
          - '<TITLE>Apache Miracle Linux Web Server</TITLE>'

      - type: status
        status:
          - 200
