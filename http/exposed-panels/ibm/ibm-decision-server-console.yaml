id: ibm-decision-server-console

info:
  name: IBM Decision Server Console 面板识别（指纹识别）
  author: DhiyaneshDK
  severity: info
  description: |-
    检测到目标站点存在 IBM Decision Server Console 相关响应特征。IBM Decision Server Console 是自动化运维、持续集成或任务编排平台，用于管理作业、流水线、凭据、执行记录和部署流程。模板请求 `/res/login.jsf`，并通过页面标题或正文关键字、状态码确认该系统指纹，用于资产识别、系统盘点和暴露面梳理。
  reference:
    - https://www.ibm.com/docs/en/odm/8.12.0?topic=overview-introducing-rule-execution-server
  metadata:
    verified: true
    max-request: 1
    shodan-query: title:"Rule Execution Server"
  tags: panel,ibm,login,detect,decision-server,discovery
http:
  - method: GET
    path:
      - "{{BaseURL}}/res/login.jsf"

    matchers-condition: and
    matchers:
      - type: word
        part: body
        words:
          - "<title>Rule Execution Server</title>"
          - "Rule Execution Server console"
        condition: or

      - type: status
        status:
          - 200
