id: cisco-ise-admin-panel

info:
  name: Cisco ISE Admin 登录面板识别（指纹识别）
  author: bhutch
  severity: info
  description: |-
    检测到目标站点存在 Cisco ISE Admin 相关响应特征。Cisco ISE Admin 是自动化运维、持续集成或任务编排平台，用于管理作业、流水线、凭据、执行记录和部署流程。模板请求 `/admin/login.jsp`，并通过页面标题或正文关键字、状态码、DSL 条件确认该系统指纹，用于资产识别、系统盘点和暴露面梳理。
  metadata:
    verified: true
    max-request: 1
    shodan-query:
      - html:"Identity Services Engine"
      - '"Set-Cookie: APPSESSIONID=" "Path=/admin"'
      - http.favicon.hash:-945076912
      - http.favicon.hash:-12304266
    fofa-query:
      - body="Identity Services Engine"
      - '"Set-Cookie: APPSESSIONID=" && "Path=/admin"'
      - icon_hash="-945076912"
      - icon_hash="-12304266"
  tags: cisco,ise,admin,login,panel,detect,discovery
http:
  - method: GET
    path:
      - "{{BaseURL}}/admin/login.jsp"

    matchers:
      - type: dsl
        dsl:
          - status_code == 200 && contains(body, "document.title =\'Identity Services Engine\';")
          - status_code == 403 && contains(body, "<title>Identity Services Engine</title>")

    extractors:
      - type: regex
        name: extracted_unix_timestamp
        part: body
        regex:
          - "\\?_isever=(\\d{10})"
        group: 1
        internal: true

      - type: dsl
        name: extracted_date
        dsl:
          - "date_time('%Y-%M-%D', extracted_unix_timestamp)"
