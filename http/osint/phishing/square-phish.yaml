id: square-phish

info:
  name: Square 仿冒钓鱼网站（钓鱼网站识别）
  author: rxerium
  severity: info
  description: |
    检测到疑似仿冒 Square 的钓鱼网站。模板在目标页面返回 200、页面内容命中 Square 的品牌页面特征，且当前主机不属于 squareup.com、square.com 官方域名时触发，用于识别借用 Square 品牌页面诱导用户信任的仿冒站点。
  reference:
    - https://squareup.com
  metadata:
    max-request: 1
  tags: phishing,square,payment,osint,discovery
http:
  - method: GET
    path:
      - "{{BaseURL}}"

    host-redirects: true
    max-redirects: 2

    matchers-condition: and
    matchers:
      - type: word
        words:
          - "Sell anywhere. Diversify revenue streams. Streamline operations. Manage your staff. Get paid faster. Sign up for Square today."
          - 'Square Dashboard'
        condition: or

      - type: status
        status:
          - 200

      - type: dsl
        dsl:
          - '!contains(host,"squareup.com")'
          - '!contains(host,"square.com")'
