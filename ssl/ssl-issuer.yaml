id: ssl-issuer

info:
  name: SSL 证书颁发者提取（证书安全）
  author: Lingtren
  severity: info
  description: 该模板从目标证书中提取颁发者组织信息，用于识别证书签发机构及其信任来源。
  metadata:
    max-request: 1
  tags: ssl,tls,discovery
ssl:
  - address: "{{Host}}:{{Port}}"

    extractors:
      - type: json
        json:
          - " .issuer_org[]"
