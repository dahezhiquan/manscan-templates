id: apache-hbase-unauth

info:
  name: Apache Hbase 未授权
  author: pikpikcu
  severity: medium
  description: |
    检测到 Apache Hbase 未授权。目标功能在未认证状态下可访问，可能暴露管理入口、业务数据、系统状态或可执行操作，需确认是否存在访问控制缺失。
  metadata:
    max-request: 1
  tags: apache,unauth,misconfig,vuln

http:
  - method: GET
    path:
      - '{{BaseURL}}/conf'

    matchers-condition: and
    matchers:
      - type: word
        words:
          - '<name>hbase.defaults.for.version</name>'
          - '<source>hbase-default.xml</source>'

      - type: status
        status:
          - 200
