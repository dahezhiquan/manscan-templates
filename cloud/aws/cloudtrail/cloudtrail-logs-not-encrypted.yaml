id: cloudtrail-logs-not-encrypted
info:
  name: CloudTrail 日志未使用 KMS 加密（云安全）
  author: princechaddha
  severity: medium
  description: CloudTrail 日志未使用 KMS 加密是一类日志机密性与密钥治理不足风险，审计日志缺少客户管理密钥提供的独立授权和访问审计能力。虽然日志仍可由 S3 服务端加密保护，但对需要分离职责或合规密钥控制的环境可能不足。模板枚举 trail 及其 HomeRegion 后读取 `trailList[*].KmsKeyId`，当返回为空数组时判定未启用 SSE-KMS。
  impact: |
    - 日志加密无法使用客户管理密钥策略进行细粒度授权、吊销和访问审计。
    - 对需要自主管理密钥、分离职责或满足特定合规要求的环境，默认加密能力可能不足。
  remediation: |
    - 为 CloudTrail trail 配置合适的 AWS KMS key，并授予 CloudTrail 使用该密钥写入日志的权限。
    - 定期审计 KMS key policy、密钥轮换和解密权限，确保日志加密与访问控制符合组织要求。
  reference:
    - https://docs.aws.amazon.com/awscloudtrail/latest/userguide/encrypting-cloudtrail-log-files-with-aws-kms.html
  metadata:
    max-request: 2
    vendor: amazon
    product: cloudtrail
  tags: cloud,devops,aws,amazon,cloudtrail,aws-cloud-config
variables:
  region: "us-east-1"

flow: |
  code(1)
  for(let CloudTrail of iterate(template.cloudtrailname)){
    set("trail", CloudTrail)
    set("region", template.trailregion)
    code(2)
  }

self-contained: true
code:
  - engine:
      - sh
      - bash
    source: |
      aws cloudtrail list-trails --region $region --query 'Trails[*].[Name, HomeRegion]' --output json

    extractors:
      - type: json
        name: cloudtrailname
        internal: true
        json:
          - '.[] | .[0]'

      - type: json
        name: trailregion
        internal: true
        json:
          - '.[] | .[1]'

  - engine:
      - sh
      - bash
    source: |
         aws cloudtrail describe-trails --region $region --trail-name-list $trail --query 'trailList[*].KmsKeyId'

    matchers:
      - type: word
        words:
          - "[]"

    extractors:
      - type: dsl
        dsl:
          - '"CloudTrail trail " + trail + " is not configured to encrypt log files using SSE-KMS encryption"'
