id: azure-appservice-http2-not-enabled
info:
  name: Azure App Service HTTP/2 未启用（云安全）
  author: princechaddha
  severity: low
  description: Azure App Service 未启用 HTTP/2 时，客户端无法使用该协议的多路复用和头部压缩能力，可能影响高并发 HTTPS 应用的连接效率。该模板枚举 Web App，查询 http20Enabled，并在返回 false 时报告 HTTP/2 未启用。
  impact: |
    - 高并发请求可能产生更多连接和握手开销，增加延迟及应用服务资源消耗。
    - 依赖 HTTP/2 的客户端体验、流式传输或连接复用能力可能退化。
  remediation: |
    - 在应用和客户端兼容的前提下启用 App Service HTTP/2，并确保应用通过 HTTPS 访问。
    - 变更后监控协议协商、响应延迟、错误率和资源消耗，避免将性能问题误判为应用故障。
  reference:
    - https://docs.microsoft.com/en-us/azure/app-service/configure-language-http2
  metadata:
    vendor: microsoft
    product: azure-app-service
  tags: cloud,devops,azure,microsoft,appservice,azure-cloud-config

flow: |
  code(1);
  for (let WebAppId of iterate(template.webAppIds)) {
    set("id", WebAppId);
    code(2);
  }

self-contained: true
code:
  - engine:
      - sh
      - bash
    source: |
      az webapp list --query '[*].id' --output json

    extractors:
      - type: json
        name: webAppIds
        internal: true
        json:
          - '.[]'

  - engine:
      - sh
      - bash
    source: |
      az webapp config show --ids $id --query 'http20Enabled' --output json

    matchers:
      - type: word
        words:
          - "false"

    extractors:
      - type: dsl
        dsl:
          - 'id + " does not have HTTP/2 enabled"'
