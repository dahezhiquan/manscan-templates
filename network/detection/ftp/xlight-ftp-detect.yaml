id: xlight-ftp-detect
info:
  name: Xlight FTP 服务 识别（服务漏洞）
  author: pussycat0x
  severity: info
  description: |
    该模板通过 FTP Banner、响应特征或协商行为识别目标是否运行 Xlight 相关 FTP 服务实现。
  metadata:
    verified: true
    shodan-query: "Xlight FTP Server"
    max-request: 1
  tags: network,ftp,xlight,detect,tcp,discovery

tcp:
  - inputs:
      - data: 00000000
        type: hex

    host:
      - "{{Hostname}}"
    port: 21
    read-size: 1024

    matchers:
      - type: word
        words:
          - "Xlight FTP Server"

    extractors:
      - type: regex
        group: 1
        name: version
        regex:
          - "Xlight FTP Server ([0-9.]+)"
