id: api-coinapi

info:
  name: CoinAPI API Token 可用性校验（token喷洒）
  author: daffainfo
  severity: info
  description: 该模板通过调用 CoinAPI API 的已知接口验证提供的 token 是否有效，命中后通常表示可访问汇率、货币或金融校验能力。
  reference:
    - https://docs.coinapi.io/
    - https://github.com/daffainfo/all-about-apikey/tree/main/coinapi
  metadata:
    max-request: 1
  tags: token-spray,coinapi

self-contained: true

http:
  - raw:
      - |
        GET https://rest.coinapi.io/v1/exchanges HTTP/1.1
        Host: rest.coinapi.io
        X-CoinAPI-Key: {{token}}

    matchers:
      - type: word
        part: body
        words:
          - '"exchange_id":'
          - '"website":'
          - '"name":'
        condition: and
