id: fortinet-fortisandbox-panel

info:
  name: Fortinet FortiSandbox 面板识别（指纹识别）
  author: Umut ÖZEN,rxerium
  severity: info
  description: |-
    检测到目标站点存在 Fortinet FortiSandbox 相关响应特征。Fortinet FortiSandbox 是安全网关、防火墙、终端安全或安全管理平台，用于维护访问控制、威胁防护、策略配置、告警和设备状态。模板请求 `/`、`/fsa/login`、`/ng/login?returnUrl=%2F` 路径，并通过页面标题或正文关键字、正则特征确认该系统指纹，用于资产识别、系统盘点和暴露面梳理。
  reference:
    - https://www.fortinet.com/products/sandbox/fortisandbox
    - https://www.fortinet.com/content/dam/fortinet/assets/data-sheets/FortiSandbox.pdf
  classification:
    cpe: cpe:2.3:a:fortinet:fortisandbox:*:*:*:*:*:*:*:*
  metadata:
    verified: true
    max-request: 1
    vendor: fortinet
    product: fortisandbox
    shodan-query: title:"FortiSandbox"
  tags: panel,fortinet,fortisandbox,tech,login,discovery
http:
  - method: GET
    path:
      - "{{BaseURL}}"
      - "{{BaseURL}}/fsa/login"
      - "{{BaseURL}}/ng/login?returnUrl=%2F"

    stop-at-first-match: true

    host-redirects: true
    max-redirects: 2

    matchers-condition: or
    matchers:
      - type: word
        part: body
        words:
          - "<title>FortiSandbox</title>"
          - "<span>FortiSandbox"
          - "fsa_login_logo"
          - "/images/fsa_logo"
          - "FortiSandbox"
        condition: or
        case-insensitive: true

      - type: regex
        part: header
        regex:
          - 'Set-Cookie: FSA_SESSION_ID='
