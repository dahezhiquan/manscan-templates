id: wordfence-config-disclosure

info:
  name: WordPress Wordfence 配置文件泄露
  author: ritikchaddha
  severity: medium
  description: |-
    该模板用于核查 WordPress Wordfence 配置文件泄露。目标公开了配置、日志、源码、数据库文件或示例信息页面，可能泄露本应仅限服务器内部访问的数据。模板访问 /wp-content/wflogs/config.php、/wp-content/wflogs/config-synced.php，并根据文件特征、配置字段、日志内容、源码目录或响应状态确认泄露。
  reference:
    - https://wordpress.org/support/topic/files-created-in-wflogs-before-plugin-activated/
    - https://forum.ait-pro.com/forums/topic/wordfence-firewall-wp-contentwflogsconfig-php-file-quarantined/
  classification:
    cvss-metrics: CVSS:3.1/AV:N/AC:L/PR:N/UI:N/S:U/C:L/I:N/A:N
    cvss-score: 5.3
    cwe-id: CWE-200
  metadata:
    max-request: 2
    verified: true
    fofa-query: body="/plugins/wordfence"
  tags: wordpress,wp-plugin,wordfence,config,exposure
  impact: |-
    - 攻击者可获取密钥、令牌、数据库连接信息、源码结构、内部路径、历史日志或业务配置。
    - 泄露内容可能被用于凭据复用、供应链漏洞匹配、权限提升或进一步攻击。
  remediation: |-
    - 将配置、日志、源码仓库和数据库文件移出 Web 可访问目录。
    - 在 Web 服务器和对象存储层添加拒绝规则，阻断敏感扩展名和内部目录访问。
    - 轮换可能泄露的密钥、令牌和账号凭据，并排查访问日志。
flow: http(1) && http(2)

http:
  - method: GET
    path:
      - "{{BaseURL}}"

    redirects: true
    matchers:
      - type: word
        part: body
        words:
          - "plugins/wordfence"
        internal: true

  - method: GET
    path:
      - "{{BaseURL}}/wp-content/wflogs/config.php"
      - "{{BaseURL}}/wp-content/wflogs/config-synced.php"

    stop-at-first-match: true
    matchers-condition: and
    matchers:
      - type: word
        part: body
        words:
          - 'authKey"'
          - '{s'
        condition: and

      - type: status
        status:
          - 200
