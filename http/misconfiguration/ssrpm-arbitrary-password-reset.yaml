id: ssrpm-arbitrary-password-reset

info:
  name: SSRPM Arbitary 密码 Reset 默认 Client Interface 安装
  author: vince-isec
  severity: high
  description: |
    检测到 SSRPM Arbitary 密码 Reset 默认 Client Interface 安装。该页面属于安装、初始化或配置向导流程，若对外暴露，攻击者可能完成初始化、创建管理员账户或重新配置目标系统。
  remediation: |
    - 删除或限制安装向导、初始化页面和示例配置入口。
    - 完成部署后强制关闭安装流程，并为后台入口启用认证和访问控制。
  reference:
    - https://www.synacktiv.com/advisories/ssrpm-arbitrary-password-reset-on-default-client-web-interface-installation
  metadata:
    shodan-query: http.favicon.hash:-916902413
    max-request: 1
    verified: true
  tags: ssrpm,intrusive,vuln

variables:
  string: "{{to_lower(rand_text_alpha(5))}}"

http:
  - raw:
      - |
        POST /Onboarding/Import HTTP/1.1
        Host: {{Hostname}}
        Content-Type: application/x-www-form-urlencoded

        OnboardingToken=7e30bebc-d17c-4833-98b6-d4c09e076b24&Action={{string}}

    matchers-condition: and
    matchers:
      - type: word
        part: body
        words:
          - '"ErrorCode":-55'
          - '"Success":false'
        condition: and

      - type: word
        part: content_type
        words:
          - 'application/json'

      - type: status
        status:
          - 200

    extractors:
      - type: kval
        kval:
          - string
