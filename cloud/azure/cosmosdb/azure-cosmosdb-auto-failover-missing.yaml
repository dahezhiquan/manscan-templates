id: azure-cosmosdb-auto-failover-missing
info:
  name: Azure Cosmos DB 未启用自动故障转移（云安全）
  author: princechaddha
  severity: high
  description: Azure Cosmos DB 可通过多区域复制和服务管理的自动故障转移，在区域不可用时恢复数据库访问。未启用自动故障转移时，区域故障可能需要人工切换，延长业务恢复时间。本模板遍历 Cosmos DB 账户并查询 enableAutomaticFailover，在返回 false 时报告该配置缺失。
  impact: |
    - 区域故障时无法按服务管理策略自动切换，应用可能出现读写失败、请求超时或业务中断。
    - 依赖人工恢复会延长故障处置时间，并增加切换不及时或操作失误导致的可用性风险。
  remediation: |
    - 为具备多区域部署条件的 Cosmos DB 账户启用自动故障转移，并设置合理的区域故障转移优先级。
    - 结合业务恢复目标开展故障转移演练；单区域账户应先配置额外区域和应用侧重试策略。
  reference:
    - https://docs.microsoft.com/en-us/azure/cosmos-db/high-availability
  metadata:
    vendor: microsoft
    product: azure-cosmos-db
  tags: cloud,devops,azure,microsoft,cosmosdb,azure-cloud-config

flow: |
  code(1);
  for (let CosmosDBData of iterate(template.cosmosDBAccounts)) {
    set("id", CosmosDBData);
    code(2);
  }

self-contained: true
code:
  - engine:
      - sh
      - bash
    source: |
      az cosmosdb list --query '[*].id' --output json

    extractors:
      - type: json
        name: cosmosDBAccounts
        internal: true
        json:
          - '.[]'

  - engine:
      - sh
      - bash
    source: |
      az cosmosdb show --ids $id --query 'enableAutomaticFailover' --output json

    matchers:
      - type: word
        words:
          - "false"

    extractors:
      - type: dsl
        dsl:
          - 'id + " does not have Automatic Failover enabled"'
