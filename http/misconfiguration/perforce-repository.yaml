id: perforce-repository

info:
  name: Perforce 仓库 泄露
  author: DhiyaneshDk
  severity: low
  description: |
    检测到 Perforce 仓库 泄露。目标响应或文件中可能暴露配置、凭据、密钥、令牌、环境变量或历史记录等敏感信息，可能被用于进一步入侵。
  reference:
    - https://help.perforce.com/helix-core/server-apps/cmdref/current/Content/CmdRef/P4IGNORE.html
  metadata:
    max-request: 1
    verified: true
    shodan-query: html:"Perforce"
  tags: exposure,perforce,repo,disclosure

http:
  - method: GET
    path:
      - "{{BaseURL}}/.p4ignore"

    matchers-condition: and
    matchers:
      - type: word
        part: body
        words:
          - "*.log"
          - "yarn-error.log"
        condition: or

      - type: word
        part: content_type
        words:
          - "application/octet-stream"

      - type: dsl
        dsl:
          - "!contains_any(tolower(body), '<html','<body','<!doctype')"

      - type: status
        status:
          - 200
