id: cloudtrail-global-disabled
info:
  name: CloudTrail 全局服务事件未启用（云安全）
  author: princechaddha
  severity: high
  description: CloudTrail 全局服务事件未启用是一类身份与账户级审计缺失风险，IAM、STS 等全局服务活动可能不会被该 trail 记录。缺少这些事件会导致权限变更、凭据使用和账户级异常行为证据不完整。模板读取 `trailList[*].IncludeGlobalServiceEvents`，当值为 `false` 时判定全局服务事件记录未启用。
  impact: |
    - IAM 用户、角色、策略等全局服务变更可能无法被该 trail 捕获。
    - 身份权限异常、凭据滥用和账户级入侵调查会缺少关键审计证据。
  remediation: |
    - 为至少一个账户级或组织级 CloudTrail trail 启用全局服务事件记录。
    - 在多 trail 环境中避免重复记录，同时确保 IAM、STS 等全局服务活动持续可审计。
  reference:
    - https://docs.aws.amazon.com/awscloudtrail/latest/userguide/cloudtrail-create-and-update-a-trail.html
  metadata:
    max-request: 2
    vendor: amazon
    product: cloudtrail
  tags: cloud,devops,aws,amazon,cloudtrail,aws-cloud-config
variables:
  region: "ap-south-1"

flow: |
  code(1)
  for(let CloudTrail of iterate(template.cloudtrailname)){
    set("trail", CloudTrail)
    code(2)
  }

self-contained: true
code:
  - engine:
      - sh
      - bash
    source: |
      aws cloudtrail list-trails --region $region --query 'Trails[*].Name' --output json

    extractors:
      - type: json
        name: cloudtrailname
        internal: true
        json:
          - '.[]'

  - engine:
      - sh
      - bash
    source: |
         aws cloudtrail describe-trails --region $region --trail-name-list $trail --query 'trailList[*].IncludeGlobalServiceEvents'

    matchers:
      - type: word
        words:
          - "false"

    extractors:
      - type: dsl
        dsl:
          - '"CloudTrail trail" + trail + " is not configured to record API calls for AWS global services"'
