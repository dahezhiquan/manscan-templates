id: wordpress-takeover

info:
  name: WordPress.com 站点可注册接管检测（子域名接管）
  author: pdteam,geeknik
  severity: high
  description: 检测 WordPress.com 返回站点不存在、是否注册该站点等提示的情况，说明目标域名可能指向可重新注册的 WordPress.com 站点，存在接管风险。
  reference:
    - https://github.com/EdOverflow/can-i-take-over-xyz/pull/176
    - https://hackerone.com/reports/274336
  metadata:
    max-request: 1
  tags: takeover,wordpress,hackerone,vuln

http:
  - method: GET
    path:
      - "{{BaseURL}}"

    matchers-condition: and
    matchers:
      - type: dsl
        dsl:
          - Host != ip

      - type: word
        words:
          - "Do you want to register"
          - ".wordpress.com</em> doesn&#8217;t&nbsp;exist"
        condition: and

      - type: word
        words:
          - "cannot be registered"
        negative: true

    extractors:
      - type: dsl
        dsl:
          - cname
