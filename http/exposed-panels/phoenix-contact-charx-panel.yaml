id: phoenix-contact-charx-panel

info:
  name: Phoenix Contact CHARX SEC-3XXX AC Charging Controller 面板识别（暴露面识别）
  author: inokii
  severity: info
  description: |
    该模板通过识别 Phoenix Contact CHARX SEC-3XXX AC Charging Controller 面板、控制台或管理界面的页面特征，判断目标是否暴露了对应服务入口。若命中，说明该后台或运维界面对外可访问，可用于资产识别与暴露面排查。
  reference:
    - https://www.phoenixcontact.com/en-us/products/ac-charging-controllers
  metadata:
    verified: true
    max-request: 1
    shodan-query: title:"Phoenix Contact - CHARX"
  tags: panel,phoenix-contact,charx,ics,discovery

http:
  - method: GET
    path:
      - "{{BaseURL}}"

    matchers-condition: and
    matchers:
      - type: word
        part: body
        words:
          - "<title>Phoenix Contact - CHARX</title>"

      - type: status
        status:
          - 200
