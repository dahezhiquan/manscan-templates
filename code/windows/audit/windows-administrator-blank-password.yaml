id: windows-administrator-blank-password

info:
  name: 内置 Administrator 账户空密码（本地基线扫描）
  author: princechaddha
  severity: high
  description: |
    该模板检查内置 Administrator 账户是否使用空密码。空密码账户极易被本地或远程滥用。
  impact: |
    攻击者可无需破解口令直接取得管理员权限。
  remediation: |
    为内置 Administrator 设置强密码，或禁用并重命名该账户。
  tags: windows,administrator,password,code,windows-audit

self-contained: true

code:
  - pre-condition: |
      IsWindows();
    engine:
      - powershell
      - powershell.exe
    args:
      - -ExecutionPolicy
      - Bypass
    pattern: "*.ps1"
    source: |
      $PasswordRequired = (net user Administrator | Select-String "Password required").Line
      Write-Host "$PasswordRequired"

    matchers:
      - type: word
        words:
          - "Password required            No"
