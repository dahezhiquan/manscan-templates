id: edelbrock-phish

info:
  name: Edelbrock 仿冒钓鱼网站（钓鱼网站识别）
  author: rxerium
  severity: info
  description: |
    检测到疑似仿冒 Edelbrock 的钓鱼网站。模板在目标页面返回 200、页面内容命中 Edelbrock 的品牌页面特征，且当前主机不属于 edelbrock.com 官方域名时触发，用于识别借用 Edelbrock 品牌页面诱导用户信任的仿冒站点。
  reference:
    - https://edelbrock.com
  metadata:
    max-request: 1
  tags: phishing,edelbrock,ecommerce,osint,discovery
http:
  - method: GET
    path:
      - "{{BaseURL}}"

    host-redirects: true
    max-redirects: 2

    matchers-condition: and
    matchers:
      - type: word
        words:
          - 'Edelbrock'
          - 'Edelbrock is the most respected name in performance! Since 1938, Edelbrock has manufactured its core products in the USA for quality and performance.'
        condition: and

      - type: status
        status:
          - 200

      - type: dsl
        dsl:
          - '!contains(host,"edelbrock.com")'
