id: gcloud-service-account-user-keys

info:
  name: User-Managed Service Account Keys Found（云安全）
  author: princechaddha
  severity: medium
  description: 用户管理的服务账号密钥属于可下载的长期凭据，通常比平台托管的短期凭据更难控制和追踪。本模板枚举项目服务账号并执行 keys list --managed-by=user，命中 USER_MANAGED 或 KEY_ID 时报告存在用户管理密钥。
  impact: |
    - 密钥文件可能被复制到本地、CI/CD、镜像或代码仓库中，泄露后可在外部环境持续访问云资源。
    - 用户管理密钥越多，轮换、吊销和归属追踪成本越高，凭据暴露窗口也越长。
  remediation: |
    - 删除不必要的用户管理服务账号密钥，优先使用 Workload Identity、ADC 或运行环境绑定的服务账号。
    - 对必须保留的密钥设置用途、保管位置、轮换周期和访问审计，发现暴露后立即吊销并重建。
  reference:
    - https://cloud.google.com/iam/docs/managing-service-account-keys
  metadata:
    vendor: google
    product: cloud-iam
  tags: cloud,devops,gcp,gcloud,google-cloud-iam,gcp-cloud-config

flow: |
  code(1)
  for(let projectId of iterate(template.projectIds)){
    set("projectId", projectId)
    code(2)
    for(let email of iterate(template.emails)){
      set("email", email)
      code(3)
    }
  }

self-contained: true

code:
  - engine:
      - sh
      - bash
    source: |
      gcloud projects list --format="json(projectId)"

    extractors:
      - type: json
        name: projectIds
        internal: true
        json:
          - ".[].projectId"

  - engine:
      - sh
      - bash
    source: |
      gcloud iam service-accounts list --project $projectId --format="json(email)"

    extractors:
      - type: json
        name: emails
        internal: true
        json:
          - ".[].email"

  - engine:
      - sh
      - bash
    source: |
      gcloud iam service-accounts keys list --iam-account=$email --managed-by=user --format="json"

    matchers:
      - type: word
        words:
          - "USER_MANAGED"
          - "KEY_ID"
        condition: or

    extractors:
      - type: dsl
        dsl:
          - '"User-Managed Keys Found in Service Account " + email + " in project " + projectId'
