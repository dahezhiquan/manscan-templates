id: procore-panel

info:
  name: Procore 登录面板识别（指纹识别）
  author: rxerium
  severity: info
  description: Procore 是工程项目管理平台，用于建筑项目文档、任务、合同和现场协作。该模板请求首页、`/favicon.ico`、`/images/favicon.ico` 路径，并依据页面标题、正文关键字或品牌资源特征、DSL 条件识别目标是否部署了该系统或暴露了对应入口，适用于资产指纹确认；命中结果仅表示系统特征匹配，不代表已确认存在未授权访问或可利用漏洞。
  metadata:
    max-request: 2
    verified: true
    shodan-query: http.favicon.hash:1952289652
  tags: panel,login,detect,procore,discovery

http:
  - method: GET
    path:
      - "{{BaseURL}}"
      - "{{BaseURL}}/favicon.ico"
      - "{{BaseURL}}/images/favicon.ico"

    stop-at-first-match: true
    matchers-condition: or
    matchers:
      - type: dsl
        dsl:
          - "status_code==200 && (\"1952289652\" == mmh3(base64_py(body)))"

      - type: word
        words:
          - '<title>Procore Log In</title>'
          - 'Log in to your Procore account using your email and password'
        condition: and
