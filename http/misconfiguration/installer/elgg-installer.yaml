id: elgg-installer

info:
  name: Elgg 安装
  author: s4e-io
  severity: high
  description: |
    检测到 Elgg 安装。该页面属于安装、初始化或配置向导流程，若对外暴露，攻击者可能完成初始化、创建管理员账户或重新配置目标系统。
  reference:
    - https://github.com/elgg/elgg
  classification:
    cpe: cpe:2.3:a:elgg:elgg:*:*:*:*:*:*:*:*
  metadata:
    verified: true
    max-request: 1
    vendor: elgg
    product: elgg
    fofa-query: title="Welcome to Elgg"
  tags: install,elgg,exposure,misconfig,vuln

http:
  - method: GET
    path:
      - "{{BaseURL}}/install.php"

    matchers:
      - type: dsl
        dsl:
          - 'contains_any(body,"Elgg Install : Welcome", "Installing Elgg", "Welcome to Elgg")'
          - 'status_code == 200'
        condition: and
