id: azure-network-watcher
info:
  name: Azure Network Watcher 未在所有区域启用（云安全）
  author: princechaddha
  severity: high
  description: Azure Network Watcher 提供网络监控、连接故障排查、路由诊断和日志相关能力，是 Azure IaaS 网络可观测性的重要组件。未在承载虚拟机和虚拟网络的区域启用时，网络异常、错误路由和安全事件的定位会缺少必要证据。本模板执行 az network watcher list，并在结果为空数组 [] 时报告未在所有区域发现 Network Watcher。
  impact: |
    - 网络连通性、下一跳和连接故障可能无法及时诊断，导致业务中断和恢复时间延长。
    - 缺少网络流量与拓扑分析能力会削弱对异常通信、横向移动和错误暴露面的发现与取证。
  remediation: |
    - 在每个实际使用 IaaS 资源的 Azure 区域启用 Network Watcher，并确认实例处于可用状态。
    - 按需启用 NSG 流日志、连接监视和诊断工具，将日志发送到集中化且受访问控制的存储或 Log Analytics。
  reference:
    - https://docs.microsoft.com/en-us/azure/network-watcher/network-watcher-monitoring-overview
  metadata:
    vendor: microsoft
    product: azure-network-watcher
  tags: cloud,devops,azure,microsoft,network-watcher,azure-cloud-config

self-contained: true
code:
  - engine:
      - sh
      - bash
    source: |
      az network watcher list --query '[*].{"location":location,"provisioningState":provisioningState,"resourceGroup":resourceGroup}' --output json

    matchers:
      - type: word
        words:
          - '[]'

    extractors:
      - type: dsl
        dsl:
          - '"Azure Network Watcher is not enabled in all locations."'
