id: revoked-ssl-certificate

info:
  name: 已吊销 SSL 证书检测（证书安全）
  author: pussycat0x
  severity: low
  description: 该模板检测目标是否仍在使用已被吊销且尚未过期的 SSL/TLS 证书。证书被吊销通常意味着私钥泄露、证书误签发或对应业务身份已不再可信。
  reference:
    - https://www.invicti.com/web-vulnerability-scanner/vulnerabilities/revoked-ssl-certificate/
    - https://www.tenable.com/plugins/nnm/5837
  metadata:
    max-request: 1
  tags: ssl,tls,revoked,vuln

ssl:
  - address: "{{Host}}:{{Port}}"

    matchers-condition: and
    matchers:
      - type: dsl
        dsl:
          - "revoked == true"

      - type: dsl
        dsl:
          - "expired == true"
        negative: true
