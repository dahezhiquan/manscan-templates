id: onedev-panel

info:
  name: OneDev 面板识别（指纹识别）
  author: vultza
  severity: info
  description: |-
    检测到目标站点存在 OneDev 相关响应特征。OneDev 是研发运维、制品或代码管理平台，用于管理构建、代码、制品、任务、插件、凭据和执行记录。模板请求 `/~login`，并通过页面标题或正文关键字、状态码确认该系统指纹，用于资产识别、系统盘点和暴露面梳理。
  reference:
    - https://github.com/theonedev/onedev
  metadata:
    verified: true
    max-request: 1
    shodan-query: title:"OneDev"
  tags: tech,detect,onedev,discovery
http:
  - method: GET
    path:
      - "{{BaseURL}}/~login"

    matchers-condition: and
    matchers:
      - type: word
        part: body
        words:
          - "OneDev"
          - "Git Server"
        condition: and
        case-insensitive: true

      - type: status
        status:
          - 200
