id: addonfinance-portal

info:
  name: AddOnFinance Portal 识别（指纹识别）
  author: ritikchaddha
  severity: info
  description: 该模板通过识别 AddOnFinance Portal 面板、控制台或管理界面的页面特征，判断目标是否暴露了对应服务入口。若命中，说明该后台或运维界面对外可访问，可用于资产识别与暴露面排查。
  metadata:
    verified: "true"
    max-request: 1
    shodan-query: title:"AddOnFinancePortal"
  tags: panel,addon,finance,detect,discovery

http:
  - method: GET
    path:
      - '{{BaseURL}}'

    matchers-condition: and
    matchers:
      - type: word
        part: body
        words:
          - 'AddOnFinancePortal</title>'

      - type: status
        status:
          - 200
