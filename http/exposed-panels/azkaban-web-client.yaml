id: azkaban-web-client

info:
  name: Azkaban Web 客户端（暴露面识别）
  author: dhiyaneshDK
  severity: info
  description: 该模板通过识别 Azkaban 面板、控制台或管理界面的页面特征，判断目标是否暴露了对应服务入口。若命中，说明该后台或运维界面对外可访问，可用于资产识别与暴露面排查。
  reference:
    - https://azkaban.github.io/
  classification:
    cwe-id: CWE-200
    cpe: cpe:2.3:a:azkaban_project:azkaban:*:*:*:*:*:*:*:*
  metadata:
    max-request: 1
    shodan-query: http.title:"Azkaban Web Client"
    product: azkaban
    vendor: azkaban_project
  tags: panel,azkaban,discovery

http:
  - method: GET
    path:
      - '{{BaseURL}}'

    matchers-condition: and
    matchers:
      - type: word
        words:
          - 'Azkaban Web Client'

      - type: status
        status:
          - 200
