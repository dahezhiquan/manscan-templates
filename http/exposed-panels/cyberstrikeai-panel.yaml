id: cyberstrikeai-panel

info:
  name: Ed1s0nZ CyberStrikeAI - 控制面板（指纹识别）
  author: darses
  severity: info
  description: |-
    检测到目标站点存在 Ed1s0nZ CyberStrikeAI - 控制 相关响应特征。Ed1s0nZ CyberStrikeAI - 控制 是 AI、LLM 或机器学习相关平台，用于管理模型、数据集、工作区、推理服务或可观测性信息。模板请求 `/`，并通过页面标题或正文关键字、状态码确认该系统指纹，用于资产识别、系统盘点和暴露面梳理。
  reference:
    - https://github.com/Ed1s0nZ/CyberStrikeAI
  metadata:
    verified: true
    max-requests: 1
    vendor: ed1s0nz
    product: cyberstrikeai
    shodan-query: title:"CyberStrikeAI"
  tags: ed1s0nz,cyberstrikeai,detect,panel
http:
  - method: GET
    path:
      - "{{BaseURL}}"

    matchers-condition: and
    matchers:
      - type: word
        words:
          - "aria-label=\"CyberStrikeAI"
          - "alt=\"CyberStrikeAI Logo"
          - "/Ed1s0nZ/CyberStrikeAI"
          - "placeholder=\"CyberStrikeAI"
        condition: or

      - type: status
        status:
          - 200

    extractors:
      - type: regex
        group: 1
        regex:
          - class="version-badge".*>(v[\d\.]+)<
