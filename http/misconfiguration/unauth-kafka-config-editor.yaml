id: unauth-kafka-config-editor

info:
  name: Kafka 配置 Editor 未授权 访问
  author: DhiyaneshDk
  severity: high
  description: |
    检测到 Kafka 配置 Editor 未授权 访问。目标功能在未认证状态下可访问，可能暴露管理入口、业务数据、系统状态或可执行操作，需确认是否存在访问控制缺失。
  classification:
    cwe-id: CWE-200
  metadata:
    verified: true
    max-request: 1
  tags: kafka,misconfig,unauth,dashboard,vuln

http:
  - method: GET
    path:
      - "{{BaseURL}}"

    host-redirects: true
    max-redirects: 2

    matchers:
      - type: dsl
        dsl:
          - 'contains_all(body, "Config Editor", "Current Config", "Update Config")'
          - 'status_code == 200'
        condition: and
