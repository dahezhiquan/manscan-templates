id: mautic-crm-panel

info:
  name: Mautic CRM 登录面板识别（指纹识别）
  author: cyllective,daffainfo
  severity: info
  description: |-
    检测到目标站点存在 Mautic CRM 相关响应特征。Mautic 是开源营销自动化与 CRM 平台，用于管理联系人、活动、邮件营销、线索评分和客户旅程。模板请求 `/s/login`，并通过页面标题或正文关键字、状态码确认该系统指纹，用于资产识别、系统盘点和暴露面梳理。
  reference:
    - https://github.com/mautic/mautic
  classification:
    cvss-metrics: CVSS:3.1/AV:N/AC:L/PR:N/UI:N/S:U/C:N/I:N/A:N
    cwe-id: CWE-200
  metadata:
    max-request: 1
  tags: tech,mautic,crm,panel,discovery
http:
  - method: GET
    path:
      - "{{BaseURL}}/s/login"

    matchers-condition: and
    matchers:
      - type: word
        part: body
        words:
          - '<title>Mautic</title>'
          - 'var mauticBasePath'
        condition: and

      - type: status
        status:
          - 200
