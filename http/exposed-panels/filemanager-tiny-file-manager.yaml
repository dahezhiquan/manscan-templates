id: filemanager-tiny-file-manager

info:
  name: Tiny File Manager 面板识别（指纹识别）
  author: DhiyaneshDK,HuTa0
  severity: info
  description: |-
    检测到目标站点存在 Tiny File Manager 相关响应特征。Tiny File Manager 是监控、日志、分析或可观测性系统，用于展示运行指标、告警事件、日志数据和服务状态。模板请求 `/index.php`，并通过页面标题或正文关键字、状态码确认该系统指纹，用于资产识别、系统盘点和暴露面梳理。
  classification:
    cvss-metrics: CVSS:3.0/AV:N/AC:L/PR:N/UI:N/S:U/C:N/I:N/A:N
    cwe-id: CWE-200
  metadata:
    verified: true
    max-request: 1
    shodan-query: title:"Tiny File Manager"
    zoomeye-query: app="Tiny File Manager"
  tags: panel,filemanager,login,detect,discovery
http:
  - method: GET
    path:
      - '{{BaseURL}}/index.php'

    host-redirects: true
    max-redirects: 2

    matchers-condition: and
    matchers:
      - type: word
        words:
          - "<title>Tiny File Manager"
        condition: and

      - type: status
        status:
          - 200
