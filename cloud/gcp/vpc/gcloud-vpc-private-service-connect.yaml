id: gcloud-vpc-private-service-connect

info:
  name: Private Service Connect Endpoints 未Configured（云安全）
  author: princechaddha
  severity: medium
  description: Private Service Connect 可通过私有端点访问 Google API、第三方或自建服务，减少流量经公网暴露的需求。项目未配置 PSC 端点时，敏感服务访问可能继续依赖公网路径或更宽泛的网络出口控制。本模板查询项目中 target 匹配 serviceAttachments 的转发规则，返回空列表时报告未配置 PSC 端点。
  impact: |
    - 服务访问可能缺少私有连接边界，增加公网暴露、出口路径绕行和访问控制复杂度。
    - 对需要私有化访问的关键服务，未使用 PSC 会削弱网络隔离和合规证明能力。
  remediation: |
    - 为需要私有访问的 Google API、生产者服务或第三方服务规划并创建 Private Service Connect 端点。
    - 配合 DNS、IAM、路由和防火墙策略验证访问路径仅经过预期私有连接。
  reference:
    - https://www.trendmicro.com/cloudoneconformity/knowledge-base/gcp/VPC/vpc-with-private-service-connect-endpoints.html
    - https://cloud.google.com/vpc/docs/private-service-connect
  metadata:
    vendor: google
    product: cloud-vpc
  tags: cloud,devops,gcp,gcloud,vpc,networking,security,psc,gcp-cloud-config

flow: |
  code(1)
  for(let projectId of iterate(template.projectIds)){
    set("projectId", projectId)
    code(2)
  }

self-contained: true

code:
  - engine:
      - sh
      - bash
    source: |
      gcloud projects list --format="json(projectId)"

    extractors:
      - type: json
        name: projectIds
        internal: true
        json:
          - '.[].projectId'

  - engine:
      - sh
      - bash
    source: |
      gcloud compute forwarding-rules list --project=$projectId --filter="target~serviceAttachments" --format="json(name)"

    matchers:
      - type: word
        words:
          - "[]"

    extractors:
      - type: dsl
        dsl:
          - '"Project " + projectId + " has no Private Service Connect endpoints configured"'
