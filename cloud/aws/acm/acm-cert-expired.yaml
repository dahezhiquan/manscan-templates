id: acm-cert-expired
info:
  name: 已过期 ACM 证书（云安全）
  author: princechaddha
  severity: high
  description: ACM 证书过期是一类证书生命周期管理风险，会使依赖该证书的 HTTPS 服务失去有效身份凭证。过期证书继续绑定到负载均衡、CloudFront 或其他业务入口时，客户端可能出现 TLS 握手失败或信任告警。模板通过 `aws acm list-certificates --certificate-statuses EXPIRED` 枚举过期证书，并以返回的 `CertificateArn` 作为命中证据。
  impact: |
    - 依赖该证书的 HTTPS 服务可能出现访问失败、浏览器安全告警或客户端连接中断。
    - 证书过期会削弱服务身份可信度，并可能影响合规审计中对传输加密有效性的证明。
  remediation: |
    - 重新签发或续期过期证书，并将依赖资源切换到有效证书。
    - 对 ACM 证书启用可持续的续期流程，定期检查证书状态、域名验证记录和关联资源。
  reference:
    - https://docs.aws.amazon.com/acm/latest/userguide/acm-certificate.html
  metadata:
    vendor: amazon
    product: acm
  tags: cloud,devops,aws,amazon,acm,aws-cloud-config

variables:
  region: "us-east-1"

self-contained: true
code:
  - engine:
      - sh
      - bash
    source: |
      aws acm list-certificates --region $region --certificate-statuses EXPIRED

    matchers:
      - type: word
        words:
          - 'CertificateArn'

    extractors:
      - type: json
        name: certificatearn
        json:
          - '.CertificateSummaryList[] | .CertificateArn'

      - type: dsl
        dsl:
          - 'region + " AWS region have expired SSL/TLS certificates"'
