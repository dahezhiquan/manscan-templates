id: mealie-detect

info:
  name: Mealie 检测（指纹识别）
  author: ChrisJr404
  severity: info
  description: |-
    通过未认证的 about API 端点检测 Mealie 实例，并提取其运行版本。Mealie 是一款自托管的食谱管理与膳食规划工具。
  reference:
    - https://mealie.io/
    - https://github.com/mealie-recipes/mealie
    - https://docs.mealie.io/
  metadata:
    verified: true
    max-request: 1
    shodan-query: http.title:"Mealie"
  tags: tech,mealie,detect

http:
  - method: GET
    path:
      - "{{BaseURL}}/api/app/about"

    matchers:
      - type: dsl
        dsl:
          - 'status_code == 200'
          - 'contains(content_type, "json")'
          - 'contains_all(body, "\"allowPasswordLogin\"", "\"defaultHouseholdSlug\"", "\"allowedIframeHosts\"")'
        condition: and

    extractors:
      - type: json
        part: body
        json:
          - '.version'
