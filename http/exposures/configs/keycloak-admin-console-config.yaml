id: keycloak-admin-console-config

info:
  name: Keycloak Admin Console 配置 泄露（暴露面识别）
  author: 0x_Akoko
  severity: low
  description: |
    检测到对外可访问的 Keycloak Admin Console 配置。这类配置资源可能包含部署细节、访问凭据、内部地址、组件版本或调试开关，公开暴露后会显著增加被侦察和后续利用的风险。
  reference:
    - https://www.keycloak.org/docs/latest/server_admin/index.html
    - https://www.keycloak.org/docs/latest/securing_apps/index.html
  metadata:
    verified: true
    max-request: 4
    shodan-query: app:"Keycloak"
  tags: keycloak,config,exposure,disclosure

http:
  - method: GET
    path:
      - "{{BaseURL}}/admin/master/console/config"
      - "{{BaseURL}}/admin/main/console/config"
      - "{{BaseURL}}/auth/admin/master/console/config"
      - "{{BaseURL}}/auth/admin/main/console/config"

    stop-at-first-match: true

    matchers-condition: and
    matchers:
      - type: word
        part: body
        words:
          - '"realm":'
          - '"resource":'
          - '"auth-server-url":'
        condition: and

      - type: word
        part: content_type
        words:
          - 'application/json'

      - type: status
        status:
          - 200
