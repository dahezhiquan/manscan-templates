id: scalar-detection

info:
  name: Scalar API Documentation 面板识别（指纹识别）
  author: recepgunes
  severity: info
  description: Scalar API Documentation 是 API 文档展示界面，用于发布 OpenAPI/Swagger 文档并辅助接口调试。该模板请求 `/scalar`、首页 路径，并依据 HTTP 200 状态码、页面标题、正文关键字或品牌资源特征识别目标是否部署了该系统或暴露了对应入口，适用于资产指纹确认；命中结果仅表示系统特征匹配，不代表已确认存在未授权访问或可利用漏洞。
  classification:
    cvss-metrics: CVSS:3.0/AV:N/AC:L/PR:N/UI:N/S:U/C:N/I:N/A:N
    cwe-id: CWE-200
  metadata:
    verified: true
    max-request: 2
    vendor: scalar
    product: scalar
    shodan-query: title:"Scalar API Reference"
    fofa-query: title="Scalar API Reference"
    google-query: intitle:"Scalar API Reference"
  tags: panel,scalar,api,documentation,detect,discovery

http:
  - method: GET
    path:
      - "{{BaseURL}}/scalar"
      - "{{BaseURL}}"

    host-redirects: true
    max-redirects: 2
    stop-at-first-match: true

    matchers-condition: and
    matchers:
      - type: word
        part: response
        words:
          - "Scalar API Reference"
          - "@scalar/api-reference"
          - "scalar-references"
          - 'src="scalar.js'
          - './scalar.aspnetcore.js'
          - '/scalar/v1'
        condition: or

      - type: status
        status:
          - 200

    extractors:
      - type: regex
        name: version
        part: body
        group: 1
        regex:
          - '@scalar/api-reference@([0-9.]+)'
          - 'scalar.*version.*([0-9.]+)'
