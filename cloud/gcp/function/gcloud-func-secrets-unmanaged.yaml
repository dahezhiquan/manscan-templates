id: gcloud-func-secrets-unmanaged

info:
  name: Use Secrets Manager 的Managing Secrets 中的Google Cloud Functions（云安全）
  author: princechaddha
  severity: medium
  description: 将密码、API Key、Token 等敏感值直接放入 Cloud Functions 环境变量会增加泄露和轮换难度。本模板检查 serviceConfig 与 buildConfig 的 environmentVariables，并匹配 PASSWORD、API_KEY、SECRET_KEY、ACCESS_TOKEN、TOKEN 等敏感关键词。
  impact: |
    - 有权限查看函数配置、构建配置或日志的主体可能接触明文敏感信息。
    - 环境变量中的长期凭据难以集中轮换和审计，泄露后可能被用于访问下游系统。
  remediation: |
    - 将敏感值迁移到 Secret Manager，并通过函数的 Secret 挂载或环境变量引用机制按最小权限访问。
    - 轮换已暴露的密钥或令牌，清理函数配置、构建变量和日志中的明文凭据。
  reference:
    - https://cloud.google.com/functions/docs/securing/managing-secrets
  metadata:
    vendor: google
    product: cloud-functions
  tags: cloud,devops,gcp,gcloud,google-cloud-functions,gcp-cloud-config

flow: |
  code(1)
  for(let projectId of iterate(template.projectIds)){
    set("projectId", projectId)
    code(2)
    for(let functionName of iterate(template.functions)){
      set("functionName", functionName)
      code(3)
    }
  }

self-contained: true

code:
  - engine:
      - sh
      - bash
    source: |
      gcloud projects list --format="json(projectId)"

    extractors:
      - type: json
        name: projectIds
        internal: true
        json:
          - '.[].projectId'

  - engine:
      - sh
      - bash
    source: |
      gcloud functions list --project $projectId --format="json(name)"

    extractors:
      - type: json
        name: functions
        internal: true
        json:
          - '.[].name'

  - engine:
      - sh
      - bash
    source: |
      gcloud functions describe $functionName --format="json(serviceConfig.environmentVariables,buildConfig.environmentVariables)"

    matchers:
      - type: word
        words:
          - 'PASSWORD'
          - 'API_KEY'
          - 'SECRET_KEY'
          - 'ACCESS_TOKEN'
          - 'TOKEN'
        case-insensitive: true
        condition: or

    extractors:
      - type: dsl
        dsl:
          - '"Sensitive information found in environment variables for function: " + functionName + ", Project: " + projectId'
