id: azure-security-policy-update-unalerted
info:
  name: Azure 安全策略更新告警未配置（云安全）
  author: princechaddha
  severity: high
  description: Microsoft.Security 安全策略更新可能改变 Defender for Cloud 和资源安全基线的评估或保护范围；未配置 Activity Log 告警时，安全策略变更可能不被及时发现。该模板枚举已启用的 Activity Log Alert，并检查 condition 是否缺少 Microsoft.Security/policies/write 操作条件。
  impact: |
    - 未授权更新可能关闭或放宽安全评估，导致高风险资源长期不被识别。
    - 安全基线被篡改后，组织的合规状态、告警覆盖和修复优先级可能失真。
  remediation: |
    - 创建针对 Microsoft.Security/policies/write 的 Activity Log Alert，并通知安全运营团队。
    - 限制安全策略修改权限，启用 Defender for Cloud 持续评估和策略漂移复核。
  reference:
    - https://docs.microsoft.com/en-us/azure/azure-monitor/platform/alerts-activity-log
  metadata:
    vendor: microsoft
    product: azure-monitor
  tags: cloud,devops,azure,microsoft,security,azure-cloud-config

flow: |
  code(1);
  for (let AlertData of iterate(template.alertList)) {
    set("id", AlertData);
    code(2);
  }

self-contained: true
code:
  - engine:
      - sh
      - bash
    source: |
      az monitor activity-log alert list --output json --query '[?(enabled==`true`)].id'

    extractors:
      - type: json
        name: alertList
        internal: true
        json:
          - '.[]'

  - engine:
      - sh
      - bash
    source: |
      az monitor activity-log alert show --ids "$id" --query 'condition'

    matchers-condition: and
    matchers:
      - type: word
        words:
          - '"field": "operationName"'

      - type: word
        words:
          - "Microsoft.Security/policies/write"
        negative: true

    extractors:
      - type: dsl
        dsl:
          - 'id + " does not have the correct alert configuration for Update Security Policy events"'
