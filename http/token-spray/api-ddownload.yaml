id: api-ddownload

info:
  name: ddownload API Token 可用性校验（token喷洒）
  author: daffainfo
  severity: info
  description: 该模板通过调用 ddownload API 的已知接口验证提供的 token 是否有效，命中后通常表示可访问文件存储与分发能力。
  reference:
    - https://ddownload.com/api
    - https://github.com/daffainfo/all-about-apikey/tree/main/ddownload
  metadata:
    max-request: 1
  tags: token-spray,ddownload

self-contained: true

http:
  - method: GET
    path:
      - "https://api-v2.ddownload.com/api/account/info?key={{token}}"

    matchers:
      - type: word
        part: body
        words:
          - '"storage_left"'
          - '"premium_traffic_left"'
          - '"email"'
        condition: and
