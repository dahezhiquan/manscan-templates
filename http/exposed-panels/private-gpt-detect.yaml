id: private-gpt-detect

info:
  name: PrivateGPT 面板识别（指纹识别）
  author: ritikchaddha
  severity: info
  description: |-
    PrivateGPT 是本地私有知识问答应用，用于在私有文档上进行大语言模型检索增强问答。该模板请求首页，并依据 HTTP 200 状态码、页面标题、正文关键字或品牌资源特征识别目标是否部署了该系统或暴露了对应入口，适用于资产指纹确认；命中结果仅表示系统特征匹配，不代表已确认存在未授权访问或可利用漏洞。
  reference:
  - https://github.com/zylon-ai/private-gpt
  metadata:
    verified: true
    max-request: 1
    shodan-query: html:"private gpt"
    product: private-gpt
  tags: panel,private-gpt,detect,discovery,ai

http:
  - method: GET
    path:
      - "{{BaseURL}}"

    matchers-condition: and
    matchers:
      - type: word
        part: body
        words:
          - 'alt=PrivateGPT'
          - 'title":"My Private GPT'
          - 'content="My Private GPT'
        condition: or

      - type: status
        status:
          - 200
