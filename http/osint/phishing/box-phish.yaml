id: box-phish

info:
  name: Box 仿冒钓鱼网站（钓鱼网站识别）
  author: rxerium
  severity: info
  description: |
    检测到疑似仿冒 Box 的钓鱼网站。模板在目标页面返回 200、页面内容命中 Box 的官方服务页面特征，且当前主机不属于 box.com 官方域名时触发，用于识别借用 Box 品牌页面诱导用户信任的仿冒站点。
  reference:
    - https://box.com
  metadata:
    max-request: 1
  tags: phishing,box-storage,osint,discovery
http:
  - method: GET
    path:
      - "{{BaseURL}}"

    host-redirects: true
    max-redirects: 2

    matchers-condition: and
    matchers:
      - type: word
        words:
          - 'Secure File Sharing, Storage, and Collaboration | Box'

      - type: status
        status:
          - 200

      - type: dsl
        dsl:
          - '!contains(host,"box.com")'
