id: kubernetes-exposing-docker-socket-hostpath

info:
  name: Kubernetes Exposing Host's Docker Socket（云安全）
  author: dwisiswant0
  severity: high
  description: Pod 通过 hostPath 挂载 /var/run/docker.sock 会把宿主机 Docker daemon 控制接口暴露给容器，OWASP Docker 安全建议明确避免将 Docker socket 暴露给容器。本模板枚举所有 Pod 的 volume.hostPath.path，并在卷内容包含 /var/run/docker.sock 时报告。
  impact: |
    - 容器内进程可通过 Docker socket 创建特权容器、挂载宿主机路径或控制宿主机容器运行时。
    - 应用被攻陷后可能直接升级为节点控制权，进而窃取凭据或影响同节点工作负载。
  remediation: |
    - 移除 /var/run/docker.sock hostPath 挂载，改用受控构建服务、Kaniko、BuildKit rootless 或独立 CI 运行环境。
    - 使用 Pod Security Admission 或策略引擎禁止挂载容器运行时 socket。
  reference:
    - https://kubernetes.io/docs/concepts/storage/volumes/#hostpath
    - https://kubernetes.io/docs/concepts/policy/pod-security-policy/#volumes-and-file-systems
    - https://kubernetes.io/docs/tasks/configure-pod-container/security-context/
    - https://cheatsheetseries.owasp.org/cheatsheets/Docker_Security_Cheat_Sheet.html#rule-1-do-not-expose-the-docker-daemon-socket-even-to-the-containers
  metadata:
    vendor: kubernetes
    product: kubernetes
  tags: cloud,devops,kubernetes
flow: |
  code(1);
  for (let pod of template.items) {
    pod = JSON.parse(pod);
    if (!pod.spec.hasOwnProperty('volumes')) continue;
    for (const volume of pod.spec.volumes) {
      if (volume.hasOwnProperty('hostPath')) {
        if (!volume.hostPath.hasOwnProperty('path')) continue;
        const path = volume.hostPath.path;
        if (path && path !== '/var/run/docker.sock') continue
      }
      set('volume', JSON.stringify(volume));
      set('pod', pod.metadata.name);
      set('namespace', pod.metadata.namespace);
      code(2)
    }
  }

self-contained: true
code:
  - engine:
      - sh
      - bash
    source: kubectl get pods --all-namespaces --output=json
    extractors:
      - type: json
        name: items
        internal: true
        json:
          - '.items[]'

  - engine:
      - sh
      - bash
    source: echo -e '$volume'

    matchers:
      - type: word
        words:
          - "/var/run/docker.sock"

    extractors:
      - type: dsl
        dsl:
          - '"Exposed Docker socket via a volume in the " + pod + " pod of " + namespace + " namespace"'
