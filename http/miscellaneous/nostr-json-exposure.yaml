id: nostr-json-exposure

info:
  name: Well-Known Nostr JSON 暴露
  author: rxerium
  severity: info
  description: |
    检测 Nostr 公钥发现 JSON 文件。该资源用于将域名或用户标识与 Nostr 公钥关联。
  impact: |
    该 well-known 资源的存在可能暴露 Nostr 身份、公钥映射和相关实现策略。
  reference:
    - https://github.com/nostr-protocol/nips/blob/master/05.md
  metadata:
    google-query: inurl:"/.well-known/nostr.json"
  tags: well-known,nostr,miscellaneous,misc,vuln

http:
  - method: GET
    path:
      - "{{BaseURL}}/.well-known/nostr.json"

    max-redirects: 1
    redirects: true

    matchers-condition: and
    matchers:
      - type: word
        part: body
        words:
          - '"names": {'

      - type: word
        part: header
        words:
          - "application/json"

      - type: status
        status:
          - 200
