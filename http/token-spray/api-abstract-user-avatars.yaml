id: api-abstract-user-avatars

info:
  name: Abstract API User Avatars Token 可用性校验（token喷洒）
  author: daffainfo
  severity: info
  description: 该模板通过调用 Abstract User Avatars API 验证提供的 token 是否有效，命中后通常表示可访问头像生成能力。
  reference:
    - https://www.abstractapi.com/api/user-avatar-api
    - https://github.com/daffainfo/all-about-apikey/tree/main/abstract-user-avatars
  metadata:
    max-request: 1
  tags: token-spray,abstractapi

self-contained: true

http:
  - method: GET
    path:
      - "https://avatars.abstractapi.com/v1/?api_key={{token}}&name=example"

    matchers:
      - type: word
        part: header
        words:
          - 'image/png'
