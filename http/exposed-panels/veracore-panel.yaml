id: veracore-panel

info:
  name: Veracore 登录面板识别（指纹识别）
  author: rxerium
  severity: info
  description: |-
    Veracore 是物流或仓储业务管理系统入口，用于订单、库存、发运和后台操作。该模板请求 `/veracore/Home/#systems`，并依据 HTTP 200 状态码、页面标题、正文关键字或品牌资源特征识别目标是否部署了该系统或暴露了对应入口，适用于资产指纹确认；命中结果仅表示系统特征匹配，不代表已确认存在未授权访问或可利用漏洞。
  reference:
  - https://www.advantive.com/brands/veracore/
  metadata:
    verified: true
    max-request: 1
    shodan-query: html:"veraCoreScreenHeight"
    fofa-query: body="veraCoreScreenHeight"
  tags: panel,veracore,login,detect,discovery

http:
  - method: GET
    path:
      - "{{BaseURL}}/veracore/Home/#systems"

    matchers-condition: and
    matchers:
      - type: word
        part: body
        words:
          - 'VeraCore'
          - '/veracore/img/LoginLogo.png'
        condition: and

      - type: status
        status:
          - 200
