id: deployment-ini

info:
  name: FTP Deployment 配置 文件暴露（暴露面识别）
  author: Michal Mikolas (nanuqcz)
  severity: medium
  description: |
    检测到对外可访问的 FTP Deployment 配置 文件。这类配置资源可能包含部署细节、访问凭据、内部地址、组件版本或调试开关，公开暴露后会显著增加被侦察和后续利用的风险。
  remediation: |
    - 将相关文件或接口移出 Web 根目录，或通过鉴权与访问控制限制访问。
    - 清理已暴露内容中的敏感信息，并评估是否需要轮换关联凭据。
    - 检查部署、备份与静态资源发布流程，防止同类资源再次被公开访问。
  reference:
    - https://github.com/dg/ftp-deployment
  metadata:
    max-request: 12
    vendor: dg
    product: "ftp-deployment"
  tags: config,exposure,dg,vuln

http:
  - method: GET
    path:
      - "{{BaseURL}}{{paths}}"
    payloads:
      paths:
        - "/deployment.ini"
        - "/deploy.ini"
        - "/production.ini"
        - "/prod.ini"
        - "/deployment.production.ini"
        - "/deployment.prod.ini"
        - "/deploy.production.ini"
        - "/deploy.prod.ini"
        - "/server.ini"
        - "/ftp.ini"
        - "/ftps.ini"
        - "/sftp.ini"

    stop-at-first-match: true

    matchers:
      - type: regex
        regex:
          - "^remote\\s*=\\s*"
          - '^\[(.*?)\]$'
        condition: and
