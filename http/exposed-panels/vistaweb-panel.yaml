id: vistaweb-panel

info:
  name: Vista Web 登录面板（暴露面识别）
  author: righettod
  severity: info
  description: |
    该模板通过识别 Vista Web 登录入口的页面标题、特征文本或重定向行为，判断目标是否暴露了对应的认证界面。若命中，说明该登录面板对外可访问，可用于暴露面梳理与后续安全评估。
  reference:
    - https://resa.aero/solutions-operations-facturation/vista-web/
  metadata:
    verified: true
    max-request: 1
  tags: panel,vistaweb,login,discovery

http:
  - method: GET
    path:
      - "{{BaseURL}}/account/login"

    matchers:
      - type: dsl
        dsl:
          - 'status_code == 200'
          - 'contains(body, "login") && contains(body, "/lib/@resa/identityserver/") && contains(body, "resa.aero")'
        condition: and

    extractors:
      - type: regex
        part: body
        group: 1
        regex:
          - 'v=([0-9.]+)'
