id: bynder-panel

info:
  name: Bynder 登录面板识别（指纹识别）
  author: righettod
  severity: info
  description: |-
    检测到目标站点存在 Bynder 相关响应特征。Bynder 是监控、日志、分析或仪表盘系统，用于展示运行指标、访问统计、日志事件和服务状态。模板请求 `/login/`，并通过页面标题或正文关键字、状态码、DSL 条件确认该系统指纹，用于资产识别、系统盘点和暴露面梳理。
  reference:
    - https://www.bynder.com/en/
  metadata:
    verified: true
    max-request: 1
    shodan-query: http.favicon.hash:1017650009
  tags: panel,bynder,login,detect,discovery
http:
  - method: GET
    path:
      - "{{BaseURL}}/login/"

    matchers:
      - type: dsl
        dsl:
          - 'status_code == 200'
          - 'contains_any(to_lower(body), "bynder.", "bynder brand portal", "bynder login")'
        condition: and

    extractors:
      - type: regex
        part: body
        group: 1
        regex:
          - 'http-equiv="version"\s+content="([0-9\.]+)"'
