id: openx-panel

info:
  name: OpenX/Revive Adserver 登录面板识别（暴露面识别）
  author: pikpikcu,righettod
  severity: info
  description: 该模板通过识别 OpenX/Revive Adserver 登录入口的页面标题、特征文本或重定向行为，判断目标是否暴露了对应的认证界面。若命中，说明该登录面板对外可访问，可用于暴露面梳理与后续安全评估。
  reference:
    - https://www.revive-adserver.com/download/
  classification:
    cvss-metrics: CVSS:3.0/AV:N/AC:L/PR:N/UI:N/S:U/C:N/I:N/A:N
    cwe-id: CWE-200
    cpe: cpe:2.3:a:revive-adserver:revive_adserver:*:*:*:*:*:*:*:*
  metadata:
    verified: true
    max-request: 2
    vendor: revive-adserver
    product: revive_adserver
    shodan-query:
      - title:"Revive Adserver"
      - http.title:"revive adserver"
      - http.favicon.hash:106844876
    fofa-query:
      - icon_hash=106844876
      - title="revive adserver"
    google-query: intitle:"revive adserver"
  tags: panel,openx,revive,adserver,login,revive-adserver,discovery

http:
  - method: GET
    path:
      - "{{BaseURL}}/www/admin/index.php"
      - "{{BaseURL}}/admin/index.php"

    stop-at-first-match: true
    matchers-condition: and
    matchers:
      - type: regex
        part: body
        regex:
          - '<title>OpenX</title>'
          - '<title>Revive Adserver</title>'
        condition: or

      - type: status
        status:
          - 200

    extractors:
      - type: regex
        part: body
        group: 1
        regex:
          - '(.*)- http://www.openx.org'

      - type: regex
        part: body
        group: 1
        regex:
          - 'v=([0-9a-z.\-]+)'
