id: homer-panel

info:
  name: Homer 面板识别（暴露面识别）
  author: rxerium
  severity: info
  description: |
    该模板通过识别 Homer 面板、控制台或管理界面的页面特征，判断目标是否暴露了对应服务入口。若命中，说明该后台或运维界面对外可访问，可用于资产识别与暴露面排查。
  reference:
    - https://github.com/bastienwirtz/homer
    - https://homer-demo.netlify.app/
  metadata:
    verified: true
    max-request: 1
    shodan-query: http.favicon.hash:-417785140
  tags: panel,homer,detect,login,discovery

http:
  - method: GET
    path:
      - "{{BaseURL}}/index.html"

    matchers-condition: and
    matchers:
      - type: word
        part: body
        words:
          - '<title>Homer</title>'

      - type: status
        status:
          - 200
