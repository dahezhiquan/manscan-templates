id: loytec-device

info:
  name: Loytec 设备信息面板（IOT）
  author: pussycat0x
  severity: medium
  description: |
    检测到 Loytec 设备信息面板。该页面可用于识别楼宇自动化或控制设备，并可能暴露设备型号和管理入口。
  impact: |
    - 工业控制、楼宇自动化或能源设备面板暴露可能泄露设施运行状态和控制系统入口。
    - 若存在弱口令或历史漏洞，可能影响生产、楼控、供电或环境控制的安全边界。
  remediation: |
    - 将 OT/IoT 管理页面放置在隔离网络中，仅允许可信运维主机或 VPN 访问。
    - 启用强认证、最小权限和设备访问审计，及时更新厂商固件。
    - 避免将控制设备直接暴露到互联网，并监控异常登录和配置变更。
  classification:
    cpe: cpe:2.3:h:loytec:lvis-3me:*:*:*:*:*:*:*:*
  metadata:
    verified: true
    max-request: 1
    vendor: loytec
    product: lvis-3me
    shodan-query: "loytec"
  tags: iot,loytec,discovery

http:
  - method: GET
    path:
      - "{{BaseURL}}/webui/device_info/device_info"

    matchers-condition: and
    matchers:
      - type: word
        words:
          - 'device_info'
          - 'syslog'
        condition: and

      - type: status
        status:
          - 200
