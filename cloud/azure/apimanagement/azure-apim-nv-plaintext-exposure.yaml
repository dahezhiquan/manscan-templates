id: azure-apim-nv-plaintext-exposure
info:
  name: Azure API Management Named Values 未标记为机密（云安全）
  author: princechaddha
  severity: high
  description: Azure API Management Named Values 未设置为 secret 时，可能将 API 密钥、后端凭据或其他敏感配置以普通值保存，并被策略或管理操作不当暴露。该模板枚举 APIM 实例和 Named Values，查询每个值的 secret 属性，并在返回 false 时报告明文配置风险。
  impact: |
    - 读取 APIM 配置、策略或日志的人员和流程可能接触后端凭据，造成未授权调用、数据访问或服务接管。
    - 凭据以普通 Named Value 保存会扩大误导出、误记录和权限配置错误后的泄露范围。
  remediation: |
    - 将敏感 Named Values 标记为 secret，限制读取权限，并轮换已经暴露或可能被读取的凭据。
    - 优先使用 Azure Key Vault 引用保存和轮换密钥，避免在策略、脚本、日志和导出配置中硬编码敏感值。
  reference:
    - https://docs.microsoft.com/en-us/azure/api-management/api-management-howto-properties
  metadata:
    vendor: microsoft
    product: azure-api-management
  tags: cloud,devops,azure,microsoft,api-management,azure-cloud-config

flow: |
  code(1);
  for (let ServiceData of iterate(template.serviceList)) {
    ServiceData = JSON.parse(ServiceData);
    set("name", ServiceData.name);
    set("resourceGroup", ServiceData.resourceGroup);
    code(2);
    for (let namedvalue of iterate(template.nvList)) {
      set("nv", namedvalue);
      code(3);
    }
  }

self-contained: true
code:
  - engine:
      - sh
      - bash
    source: |
      az apim list --output json --query '[*].{name:name, resourceGroup:resourceGroup}'

    extractors:
      - type: json
        name: serviceList
        internal: true
        json:
          - '.[]'

  - engine:
      - sh
      - bash
    source: |
      az apim nv list --service-name $name --resource-group $resourceGroup --query '[].name'

    extractors:
      - type: json
        name: nvList
        internal: true
        json:
          - '.[]'

  - engine:
      - sh
      - bash
    source: |
      az apim nv show --service-name $name --resource-group $resourceGroup --named-value-id $nv --query 'secret'

    matchers-condition: and
    matchers:
      - type: word
        words:
          - "false"

    extractors:
      - type: dsl
        dsl:
          - 'name + " in " + resourceGroup + " has named values exposed in plaintext"'
