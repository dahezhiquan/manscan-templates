id: gcloud-iam-service-roles-project-level

info:
  name: Service Account Roles at Project Level（云安全）
  author: princechaddha
  severity: medium
  description: 将服务账号使用或令牌创建类角色授予到项目层级，会让成员可作用于项目内更大范围的服务账号，偏离最小权限原则。本模板遍历项目 IAM bindings，并通过脚本检查 Service Account User 与 Token Creator 等服务账号操作角色的项目级授权。
  impact: |
    - 成员可能冒用多个服务账号或为其创建访问令牌，扩大横向移动和权限提升空间。
    - 项目级授权难以体现具体业务边界，增加权限复核和异常访问定位难度。
  remediation: |
    - 将 Service Account User、Service Account Token Creator 等角色限制到具体服务账号资源级别。
    - 按工作负载和自动化任务拆分服务账号，定期审计项目级服务账号相关角色绑定。
  reference:
    - https://cloud.google.com/iam/docs/understanding-roles
  metadata:
    vendor: google
    product: cloud-iam
  tags: cloud,devops,gcp,gcloud,google-cloud-iam,gcp-cloud-config

flow: |
  code(1)
  for(let projectId of iterate(template.projectIds)){
    set("projectId", projectId)
    code(2)
    for(let binding of iterate(template.bindings)){
        set("binding", binding)
        javascript(1);
    }
  }

self-contained: true

code:
  - engine:
      - sh
      - bash
    source: |
      gcloud projects list --format="json(projectId)"

    extractors:
      - type: json
        name: projectIds
        internal: true
        json:
          - '.[].projectId'

  - engine:
      - sh
      - bash
    source: |
      gcloud projects get-iam-policy $projectId --format=json

    extractors:
      - type: json
        name: bindings
        internal: true
        json:
          - '.bindings[]'

javascript:
  - code: |
        let binding = JSON.parse(template.binding);
        let projectId = template.projectId;
        if (binding.role == "roles/iam.serviceAccountUser" && binding.role == "roles/iam.serviceAccountTokenCreator"){
          Export("Service Role Misconfiguration for role " + binding.role + " for member " + binding.members + " in Project " + projectId);
        }

    extractors:
      - type: dsl
        dsl:
          - response
