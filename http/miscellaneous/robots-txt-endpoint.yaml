id: robots-txt-endpoint

info:
  name: robots.txt 端点探测
  author: CasperGN,pdteam,TheZakMan
  severity: low
  description: |
    检测 `robots.txt` 文件并提取其中的 `Allow` 或 `Disallow` 路径。该文件用于搜索引擎爬虫规则，也可能暴露后台、测试或敏感目录线索。
  impact: |
    - 命中内容可用于资产画像、人员/社群关联、公开目录发现或业务线索收集。
    - 单独结果通常不等同于漏洞，但与其他信息组合后可能降低攻击者侦察成本。
  remediation: |
    - 确认公开信息是否符合预期，移除不必要的联系人、目录、社群或资源索引。
    - 对必须公开的文件和链接进行最小化披露，避免包含内部路径或敏感标识。
    - 定期巡检公开页面，确保内容仍然准确且未泄露额外信息。
  metadata:
    max-request: 1
    verified: true
  tags: miscellaneous,misc,generic,discovery

http:
  - method: GET
    path:
      - "{{BaseURL}}/robots.txt"

    extractors:
      - type: regex
        name: endpoints
        group: 1
        regex:
          - '(?i:(?:Allow|Disallow):\s*(/[\.a-zA-Z0-9/_-]+/?))'

    matchers-condition: and
    matchers:
      - type: word
        part: body
        words:
          - 'User-agent:'

      - type: word
        part: content_type
        words:
          - text/plain

      - type: status
        status:
          - 200
