id: azure-db-enum

info:
  name: Azure Databases - Cloud Enumeration（云安全）
  author: initstring
  severity: info
  description: 该规则用于检查 enum azure-db-enum.yaml 相关资源是否满足推荐的云安全与合规配置要求，命中通常表示当前配置仍存在可改进的风险项。
  metadata:
    verified: true
    max-request: 1
  tags: cloud,enum,cloud-enum,azure,dns,discovery

self-contained: true

variables:
  BaseDNS: "database.windows.net"

dns:
  - name: "{{wordlist}}.{{BaseDNS}}"
    type: A
    class: inet

    recursion: true

    attack: batteringram
    matchers:
      - type: word
        part: answer
        words:
          - "IN\tA"
