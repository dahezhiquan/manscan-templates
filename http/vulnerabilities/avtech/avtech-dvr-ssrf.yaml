id: avtech-dvr-ssrf

info:
  name: AVTECH DVR - 服务端请求伪造漏洞
  author: ritikchaddha
  severity: medium
  description: AVTECH DVR - 服务端请求伪造 存在服务端请求伪造漏洞。该模板依据实际请求路径、返回特征与命中证据验证目标是否暴露相应漏洞。
  classification:
    cwe-id: CWE-918
  metadata:
    verified: true
    max-request: 1
    shodan-query: title:"login" product:"Avtech"
    fofa-query: app="AVTECH-视频监控"
  tags: ssrf,avtech,unauth,iot,vuln

http:
  - method: GET
    path:
      - "{{BaseURL}}/cgi-bin/nobody/Search.cgi?action=scan"

    matchers-condition: and
    matchers:
      - type: word
        part: body
        words:
          - 'Search.Device'
          - 'Proto='
          - 'IPAddress='
        condition: and

      - type: word
        part: header
        words:
          - text/plain

      - type: status
        status:
          - 200
