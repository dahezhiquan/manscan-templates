id: core-dump

info:
  name: 暴露 Core 转储文件泄露（暴露面识别）
  author: kazet
  severity: medium
  description: 检测到对外可访问的 暴露 Core 转储文件。相关文件可能泄露项目结构、依赖关系、部署细节、敏感参数或其他不应公开的内部信息。
  reference:
    - https://github.com/hannob/snallygaster/blob/4c5a9b54501f64da96787c2a2e3a12ce2e09c1ab/snallygaster#L295
  metadata:
    verified: true
    max-request: 1
  tags: exposure,files,core-dump,vuln

http:
  - method: GET
    path:
      - "{{BaseURL}}/core"

    matchers:
      - type: regex
        regex:
          - '^\x7fELF'
