id: gdm-disable-user-list-enabled-check

info:
  name: 确保 GDM 的 disable-user-list 选项已启用（本地基线扫描）
  author: Th3l0newolf
  severity: low
  description: |
    GDM 登录界面显示本地用户列表会泄露有效账号名称，降低攻击者进行密码猜测或定向登录尝试的成本。CIS Ubuntu 基线建议隐藏用户列表；模板读取 `org.gnome.login-screen disable-user-list`，值不是 `true` 时命中 Policy-Fail。
  impact: |
    - 未授权人员可直接获取本机有效用户名，提升暴力破解和社工攻击成功率。
    - 对共享终端或暴露屏幕的设备，账号枚举信息会被动泄露。
  remediation: |
    - 通过 GDM/dconf 策略设置 `disable-user-list=true`。
    - 配合账户锁定、强密码和登录审计降低本地登录枚举风险。
  reference:
    - https://www.cisecurity.org/benchmark/ubuntu_linux
  tags: cis,linux,ubuntu,gdm,login,audit
  metadata:
    verified: true

self-contained: true

code:
  - engine:
      - bash
    args:
      - "-c"
      - |
        if [ "$(gsettings get org.gnome.login-screen disable-user-list 2>/dev/null)" = "true" ]; then
          echo "[gdm-disable-user-list-enabled-check:Policy-Pass] [GDM disable-user-list option is enabled] [CIS_PASS] [low]"
        else
          echo "[gdm-disable-user-list-enabled-check:Policy-Fail] [GDM disable-user-list option is not enabled] [CIS_FAIL] [low]"
        fi

    matchers:
      - type: word
        name: policy-pass
        words:
          - "Policy-Pass"

      - type: word
        name: policy-fail
        words:
          - "Policy-Fail"
