id: klog-server-panel

info:
  name: Klog Server 面板识别（指纹识别）
  author: s4e-io
  severity: info
  description: |
    该模板通过识别 Klog Server 面板、控制台或管理界面的页面特征，判断目标是否暴露了对应服务入口。若命中，说明该后台或运维界面对外可访问，可用于资产识别与暴露面排查。
  reference:
    - https://www.klogserver.com/
  metadata:
    max-request: 1
    vendor: klogserver
    product: klog_server
  tags: panel,login,klog-server,detect,discovery

http:
  - method: GET
    path:
      - "{{BaseURL}}/login.php"

    matchers:
      - type: dsl
        dsl:
          - 'contains(body, "<title>KLog Server")'
          - 'status_code == 200'
        condition: and
