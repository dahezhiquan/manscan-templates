id: irs-phish

info:
  name: IRS 仿冒钓鱼网站（钓鱼网站识别）
  author: rxerium
  severity: info
  description: |
    检测到疑似仿冒 IRS 的钓鱼网站。模板在目标页面返回 200、页面内容命中 IRS 的品牌页面特征，且当前主机不属于 irs.gov 官方域名时触发，用于识别借用 IRS 品牌页面诱导用户信任的仿冒站点。
  reference:
    - https://irs.gov
  metadata:
    max-request: 1
  tags: phishing,irs,government,osint,discovery
http:
  - method: GET
    path:
      - "{{BaseURL}}"

    host-redirects: true
    max-redirects: 2

    matchers-condition: and
    matchers:
      - type: word
        words:
          - "Pay your taxes. Get your refund status. Find IRS forms and answers to tax questions. We help you understand and meet your federal tax responsibilities."

      - type: status
        status:
          - 200

      - type: dsl
        dsl:
          - '!contains(host,"irs.gov")'
