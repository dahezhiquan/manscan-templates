id: eks-managed-policy-ecr-access

info:
  name: EKS 节点角色未使用推荐 ECR 只读策略（云安全）
  author: princechaddha
  severity: high
  description: EKS 节点角色未使用推荐 ECR 只读策略是一类容器镜像拉取权限配置风险，节点可能缺少从 Amazon ECR 拉取镜像所需的标准权限。缺失策略会影响工作负载启动，过宽自定义策略则会扩大节点角色被滥用后的影响。模板枚举集群和节点组，读取节点角色后检查附加策略中是否缺少 `arn:aws:iam::aws:policy/AmazonEC2ContainerRegistryReadOnly`。
  impact: |
    - 节点可能无法稳定拉取 ECR 镜像，导致 Pod 启动失败或部署中断。
    - 使用过宽自定义 ECR 权限可能使被攻陷节点访问或操作超出需求的镜像资产。
  remediation: |
    - 为 EKS 节点角色附加 `AmazonEC2ContainerRegistryReadOnly` 或等效最小只读权限。
    - 审计节点角色中与 ECR 无关或过宽的镜像仓库权限，按仓库和操作范围收敛。
  reference:
    - https://www.trendmicro.com/cloudoneconformity/knowledge-base/aws/EKS/managed-policy-ecr-access.html
    - https://docs.aws.amazon.com/AmazonECR/latest/userguide/ecr_managed_policies.html
  metadata:
    vendor: amazon
    product: eks
  tags: cloud,devops,aws,amazon,eks,aws-cloud-config

variables:
  region: "us-east-1"

flow: |
  code(1)
  for(let cluster of iterate(template.clusters)){
    set("cluster", cluster)
    code(2)
    for(let nodegroup of iterate(template.nodegroups)){
      set("nodegroup", nodegroup)
      code(3)
      code(4)
    }
  }

self-contained: true

code:
  - engine:
      - sh
      - bash
    source: |
      aws eks list-clusters --region $region --query 'clusters' --output json

    extractors:
      - type: json
        name: clusters
        internal: true
        json:
          - '.[]'

  - engine:
      - sh
      - bash
    source: |
      aws eks list-nodegroups --region $region --cluster-name $cluster --query 'nodegroups' --output json

    extractors:
      - type: json
        name: nodegroups
        internal: true
        json:
          - '.[]'

  - engine:
      - sh
      - bash
    source: |
      aws eks describe-nodegroup --region $region --cluster-name $cluster --nodegroup-name $nodegroup --query 'nodegroup.nodeRole' --output json

    extractors:
      - type: json
        name: rolearn
        internal: true
        json:
          - '.'

  - engine:
      - sh
      - bash
    source: |
      aws iam list-attached-role-policies --role-name $(echo $rolearn | cut -d'/' -f2) --query 'AttachedPolicies[*].PolicyArn' --output json

    matchers-condition: and
    matchers:
      - type: word
        words:
          - "arn:aws:iam::aws:policy/AmazonEC2ContainerRegistryReadOnly"
        negative: true

      - type: word
        words:
          - "["

    extractors:
      - type: dsl
        dsl:
          - '"EKS node group " + nodegroup + " in cluster " + cluster + " does not have AmazonEC2ContainerRegistryReadOnly policy attached to its IAM role"'
