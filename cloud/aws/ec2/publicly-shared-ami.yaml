id: publicly-shared-ami
info:
  name: EC2 AMI 被公开共享（云安全）
  author: princechaddha
  severity: medium
  description: EC2 AMI 被公开共享是一类镜像资产泄露风险，任何 AWS 账户都可能基于该镜像启动实例。AMI 可能包含系统配置、软件版本、脚本、密钥残留或敏感业务文件，公开共享会扩大信息泄露和供应链滥用风险。模板枚举当前账户自有 AMI 后读取 `Images[*].Public`，当值为 `true` 时判定 AMI 已公开。
  impact: |
    - 镜像中的配置、软件清单、历史文件或凭据残留可能被外部账户获取。
    - 攻击者可分析镜像弱点，针对基于同一 AMI 部署的实例制定攻击路径。
  remediation: |
    - 取消不必要的 AMI 公开共享，仅向明确需要的 AWS 账户或组织共享。
    - 发布镜像前清理凭据、日志、临时文件和敏感配置，并建立 AMI 共享审批流程。
  reference:
    - https://docs.aws.amazon.com/AWSEC2/latest/UserGuide/sharingamis-explicit.html
  metadata:
    max-request: 2
    vendor: amazon
    product: ec2
  tags: cloud,devops,aws,amazon,ami,aws-cloud-config
variables:
  region: "us-east-1"

flow: |
  code(1)
  for(let AmiName of iterate(template.amis)){
    set("ami", AmiName)
    code(2)
  }

self-contained: true
code:
  - engine:
      - sh
      - bash
    source: |
      aws ec2 describe-images --region $region --owners self --output json --query 'Images[*].ImageId' --output json

    extractors:
      - type: json
        name: amis
        internal: true
        json:
          - '.[]'

  - engine:
      - sh
      - bash
    source: |
         aws ec2 describe-images --region $region --image-ids $ami --owners self --query 'Images[*].Public'

    matchers:
      - type: word
        words:
          - "true"

    extractors:
      - type: dsl
        dsl:
          - 'ami + " AMI is publically shared"'
