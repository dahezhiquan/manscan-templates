id: veritas-netbackup-panel

info:
  name: Veritas NetBackup OpsCenter Analytics 登录识别（暴露面识别）
  author: rxerium
  severity: info
  description: |
    该模板通过识别 Veritas NetBackup OpsCenter Analytics 登录入口的页面标题、特征文本或重定向行为，判断目标是否暴露了对应的认证界面。若命中，说明该登录面板对外可访问，可用于暴露面梳理与后续安全评估。
  reference:
    - https://www.veritas.com/
  metadata:
    verified: true
    max-request: 1
    shodan-query: html:"Veritas NetBackup OpsCenter Analytics"
  tags: panel,veritas,netbackup,opscenter,login,detect,discovery

http:
  - method: GET
    path:
      - "{{BaseURL}}/opscenter/"

    matchers-condition: and
    matchers:
      - type: word
        part: body
        words:
          - '<title>Veritas NetBackup OpsCenter Analytics'

      - type: status
        status:
          - 200
