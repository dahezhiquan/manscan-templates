id: regify-panel

info:
  name: Regify 登录面板识别（指纹识别）
  author: righettod
  severity: info
  description: |
    该模板通过识别 Regify 登录入口的页面标题、特征文本或重定向行为，判断目标是否暴露了对应的认证界面。若命中，说明该登录面板对外可访问，可用于暴露面梳理与后续安全评估。
  reference:
    - https://www.regify.com/
  metadata:
    verified: true
    max-request: 1
    shodan-query: http.favicon.hash:1817615343
  tags: panel,regify,login,detect,discovery

http:
  - method: GET
    path:
      - '{{BaseURL}}/phpLogin.php'

    matchers-condition: and
    matchers:
      - type: word
        part: body
        words:
          - 'regify'
          - 'regibill'
          - 'regify_default.css'
        condition: and
        case-insensitive: true

      - type: status
        status:
          - 200

    extractors:
      - type: regex
        part: body
        group: 1
        regex:
          - '(?i)appv=([0-9.-]+)'
