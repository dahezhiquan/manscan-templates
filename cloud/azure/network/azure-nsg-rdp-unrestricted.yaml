id: azure-nsg-rdp-unrestricted
info:
  name: Azure NSG 对互联网开放 RDP 端口 3389（云安全）
  author: princechaddha
  severity: high
  description: RDP 使用 TCP 3389 提供 Windows 远程桌面访问；将该端口对互联网开放会把主机登录面直接暴露给扫描、口令攻击和远程桌面漏洞利用。本模板查询入站允许的 TCP 3389 NSG 规则，并在来源地址为 *、internet 或 any 时报告。
  impact: |
    - 攻击者可能通过弱口令、凭据填充或未修复漏洞取得交互式主机访问权限。
    - 主机被控制后可能导致勒索、敏感数据窃取、持久化和云内横向移动。
  remediation: |
    - 删除面向互联网的 TCP 3389 入站规则，优先通过 Bastion、VPN 或受限跳板机管理 Windows 主机。
    - 强制多因素认证、网络级身份验证和账户锁定策略，限制管理源地址并及时安装系统补丁。
  reference:
    - https://docs.microsoft.com/en-us/azure/virtual-network/network-security-groups-overview
  metadata:
    vendor: microsoft
    product: azure-network-security-group
  tags: cloud,devops,azure,microsoft,nsg,azure-cloud-config

flow: |
  code(1);
  for (let NsgData of iterate(template.nsgdata)) {
    NsgData = JSON.parse(NsgData)
    set("nsg", NsgData.name)
    set("resourcegroup", NsgData.resourceGroup)
    code(2)
  }

self-contained: true
code:
  - engine:
      - sh
      - bash
    source: |
      az network nsg list --query '[*].{name:name, resourceGroup:resourceGroup}' --output json

    extractors:
      - type: json
        name: nsgdata
        internal: true
        json:
          - '.[]'

  - engine:
      - sh
      - bash
    source: |
      az network nsg rule list --nsg-name $nsg --resource-group $resourcegroup --query "[?direction=='Inbound' && access=='Allow' && protocol=='TCP' && (destinationPortRange=='3389')]"

    matchers:
      - type: word
        words:
          - '"sourceAddressPrefix": "*"'
          - '"sourceAddressPrefix": "internet"'
          - '"sourceAddressPrefix": "any"'

    extractors:
      - type: dsl
        dsl:
          - 'nsg + " has unrestricted access on TCP port 3389"'
