id: zyxel-firewall-panel

info:
  name: Zyxel Firewall 面板识别（暴露面识别）
  author: 0x240x23elu
  severity: info
  description: 该模板通过识别 Zyxel Firewall 面板、控制台或管理界面的页面特征，判断目标是否暴露了对应服务入口。若命中，说明该后台或运维界面对外可访问，可用于资产识别与暴露面排查。
  classification:
    cvss-metrics: CVSS:3.0/AV:N/AC:L/PR:N/UI:N/S:U/C:N/I:N/A:N
    cwe-id: CWE-200
    cpe: cpe:2.3:o:zyxel:zywall_vpn50_firmware:*:*:*:*:*:*:*:*
  metadata:
    verified: true
    max-request: 1
    shodan-query: http.favicon.hash:-440644339
    product: zywall_vpn50_firmware
    vendor: zyxel
  tags: panel,xyxel,firewall,discovery

http:
  - method: GET
    path:
      - '{{BaseURL}}'

    matchers-condition: and
    matchers:
      - type: word
        part: body
        words:
          - "/lib/mode_ana"

      - type: word
        part: body
        words:
          - "VPN"
          - "USG"
          - "ATP"
        condition: or

    extractors:
      - type: regex
        part: body
        group: 1
        regex:
          - "<title>(.*)</title>"
