id: mitel-version-detect

info:
  name: Mitel MiCollab Unified Communications 服务器 (UCS) 指纹识别（指纹识别）
  author: aushack
  severity: info
  description: |
    用于识别目标是否部署 Mitel MiCollab Unified Communications 服务器 (UCS) 并提取相关版本或构建信息，模板会结合页面正文、特定路径或已知端点和版本或标识提取结果进行指纹匹配。
  metadata:
    verified: true
    max-request: 1
    shodan-query: html:"MiCollab End User Portal"
  tags: mitel,micollab,ucs,version,detect,discovery

http:
  - method: GET
    path:
      - "{{BaseURL}}/ucs/micollab/version.json"

    matchers:
      - type: dsl
        dsl:
          - 'status_code == 200'
          - 'contains(body, "{\"version\":")'
        condition: and

    extractors:
      - type: json
        part: body
        name: version
        group: 1
        json:
          - ".version"
