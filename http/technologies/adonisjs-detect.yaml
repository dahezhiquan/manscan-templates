id: adonisjs-detect

info:
  name: AdonisJS 指纹识别（指纹识别）
  author: rxerium
  severity: info
  description: AdonisJS 是 Node.js Web 应用框架，用于构建后端服务、API 和 MVC 应用。该模板请求首页，并依据页面标题、正文关键字或品牌资源特征、响应头特征识别目标是否使用或暴露了 AdonisJS 相关组件，适用于资产盘点、技术栈识别和后续安全评估；命中结果仅表示指纹特征匹配，不代表已确认存在可利用漏洞。
  reference:
  - https://adonisjs.com
  metadata:
    verified: true
    max-request: 1
    vendor: adonisjs
    product: adonisjs
    shodan-query: 'X-Powered-By: AdonisJs'
  tags: tech,adonisjs,detect,discovery

http:
  - method: GET
    path:
      - "{{BaseURL}}"

    host-redirects: true
    max-redirects: 2

    matchers:
      - type: word
        part: header
        words:
          - "X-Powered-By: AdonisJs"
        case-insensitive: true
