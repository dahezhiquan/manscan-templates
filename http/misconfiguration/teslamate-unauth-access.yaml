id: teslamate-unauth-access

info:
  name: TeslaMate 未授权访问
  author: For3stCo1d
  severity: medium
  description: |-
    该模板用于核查 TeslaMate 未授权访问。目标管理界面、控制台或敏感接口在未登录状态下可访问，通常源于默认开放、反向代理绕过、初始化流程遗留或访问控制配置错误。模板访问 /settings，并根据页面标题、接口响应、重定向或关键业务字段确认未授权访问。
  classification:
    cpe: cpe:2.3:a:teslamate_project:teslamate:*:*:*:*:*:*:*:*
  metadata:
    verified: true
    max-request: 1
    vendor: teslamate_project
    product: teslamate
    shodan-query: http.favicon.hash:-1478287554
    fofa-query: title="teslamate"
  tags: misconfig,teslamate,unauth,vuln
  impact: |-
    - 攻击者可查看或操作管理功能、任务队列、监控数据、配置项、项目数据或设备状态。
    - 若界面提供写入、执行、上传或注册能力，可能进一步造成服务接管、数据泄露或业务中断。
  remediation: |-
    - 为管理入口和 API 强制启用认证授权，关闭匿名访问、访客登录和公开注册。
    - 将控制台限制在内网、VPN 或可信来源，并在网关层增加访问控制。
    - 复核默认配置、反向代理规则和初始化状态，清理测试账户并开启审计日志。
http:
  - method: GET
    path:
      - "{{BaseURL}}/settings"

    matchers-condition: and
    matchers:
      - type: word
        part: body
        words:
          - "Settings · TeslaMate"
          - "URLs</h2>"
        condition: and

      - type: status
        status:
          - 200

    extractors:
      - type: regex
        part: body
        group: 1
        regex:
          - "<td>([0-9.]+)<strong>"
