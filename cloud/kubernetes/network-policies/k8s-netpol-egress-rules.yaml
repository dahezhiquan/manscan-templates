id: k8s-netpol-egress-rules

info:
  name: Network policies define egress rules（云安全）
  author: princechaddha
  severity: medium
  description: NetworkPolicy 缺少 egress 规则时，策略可能只限制入站而未收敛 Pod 出站访问路径。本模板枚举所有 NetworkPolicy，发现 spec.egress 为空或缺失时报告。
  impact: |
    - 被攻陷 Pod 仍可能连接外部地址、内部敏感服务或命令控制端点。
    - 缺少出站边界会削弱数据外泄控制和依赖访问审计。
  remediation: |
    - 为敏感命名空间配置默认拒绝 egress，并按目标命名空间、Pod、IPBlock 和端口逐项放行。
    - 结合 DNS、代理或服务网格策略监控和审计出站访问。
  reference:
    - https://kubernetes.io/docs/concepts/services-networking/network-policies/
  metadata:
    vendor: kubernetes
    product: kubernetes
  tags: cloud,devops,kubernetes,devsecops,k8s-cluster-security
flow: |
  code(1);
  for (let policy of template.items) {
    set("policy", policy)
    javascript(1);
  }

self-contained: true
code:
  - engine:
      - sh
      - bash
    source: kubectl get networkpolicies --all-namespaces --output=json
    extractors:
      - type: json
        name: items
        internal: true
        json:
          - '.items[] | {policy: .metadata.name, egress: .spec.egress}'

javascript:
  - code: |
        let policyData = JSON.parse(template.policy);
        if (!policyData.egress || policyData.egress.length === 0) {
          let result = (`Network policy '${policyData.policy}' does not define egress rules.`);
          Export(result);
        }

    extractors:
      - type: dsl
        dsl:
          - response
