id: unauthenticated-popup-upload

info:
  name: 未授权 Popup 文件上传 检测
  author: DhiyaneshDk
  severity: info
  description: |
    检测到 未授权 Popup 文件上传 检测。目标功能在未认证状态下可访问，可能暴露管理入口、业务数据、系统状态或可执行操作，需确认是否存在访问控制缺失。
  reference:
    - https://www.exploit-db.com/ghdb/6671
  classification:
    cvss-metrics: CVSS:3.0/AV:N/AC:L/PR:N/UI:N/S:U/C:N/I:N/A:N
    cvss-score: 0
    cwe-id: CWE-200
  metadata:
    max-request: 1
  tags: edb,fileupload,misconfig,intrusive,vuln

http:
  - method: GET
    path:
      - "{{BaseURL}}/RichWidgets/Popup_Upload.aspx"

    matchers-condition: and
    matchers:
      - type: word
        words:
          - "Popup Upload"
        part: body

      - type: status
        status:
          - 200
