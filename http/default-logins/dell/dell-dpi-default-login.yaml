id: dell-dpi-default-login

info:
  name: Dell DPI Remote Power Management 默认口令登录（弱口令）
  author: megamansec
  severity: medium
  description: |
    该模板用于检测 Dell DPI Remote Power Management 是否仍可使用默认凭据或弱口令登录。模板主要向 `/index2.html` 等认证入口发送请求，使用内置默认凭据组合进行认证尝试，并根据响应中的 `status_code_1 == 200 && status_code_2 == 401`、`contains(body_2, "Unauthorized")` 等登录成功特征判断登录是否成功；命中说明目标未及时修改出厂、示例或初始化账号口令。
  impact: |
    - 攻击者可接管 Dell DPI Remote Power Management 的 Web 管理界面，查看设备状态、网络配置、运行日志或敏感业务参数。
    - 被接管的网络、工控、打印、语音、存储或远程管理设备可能被用于中断业务、改变路由/访问策略、窃取流量或作为内网横向移动入口。
  remediation: |
    - 立即修改所有默认账号口令，禁用不再使用的出厂账号，并为管理账户设置高强度唯一密码。
    - 将设备管理入口限制在 VPN、堡垒机或可信管理网段内，避免直接暴露到公网。
    - 升级设备固件或管理组件，审计近期登录记录、配置变更和异常会话。
  reference:
    - https://dl.dell.com/manuals/all-products/esuprt_ser_stor_net/esuprt_rack_infrastructure/dell-metered-pdu_user%27s%20guide3_en-us.pdf
  classification:
    cwe-id: CWE-798
  metadata:
    max-request: 2
  tags: dell,dpi,rpm,default-login,vuln
variables:
  str: "{{to_lower(rand_text_alpha(5))}}"

http:
  - raw:
      - |
        POST /index2.html HTTP/1.1
        Host: {{Hostname}}
        Authorization: Basic {{base64('{{username}}:{{password}}')}}
      - |
        POST /index2.html HTTP/1.1
        Host: {{Hostname}}
        Authorization: Basic {{base64('{{str}}:{{str}}')}}

    payloads:
      username:
        - admin
      password:
        - admin
    attack: pitchfork
    host-redirects: true
    max-redirects: 2

    matchers-condition: and
    matchers:
      - type: dsl
        dsl:
          - 'status_code_1 == 200 && status_code_2 == 401'
          - 'contains(body_2, "Unauthorized")'
          - '!contains(body_1, "/index.html")'
          - 'contains_any(tolower(body_1), "<TITLE>DELL DPI Remote Power Management", "title=\"DELL DPI Remote Power Management")'
        condition: and
