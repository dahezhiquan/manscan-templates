id: dns-axfr-enabled

info:
  name: DNS 区域传送 AXFR 已开放（本地基线扫描）
  author: matejsmycka
  severity: medium
  description: |
    该模板检查指定域名是否允许 DNS AXFR 区域传送。开放区域传送会一次性泄露该区域的 DNS 记录。
  reference:
    - https://beaglesecurity.com/blog/vulnerability/dns-zone-transfer.html
  metadata:
    verified: true
    shodan-query: port:53
  tags: dns,tcp,axfr,code

code:
  - engine:
      - bash
    source: |
      domain=$Host
      dig axfr $domain @$(dig $domain ns +short | head -n1)

    matchers:
      - type: regex
        regex:
          - 'XFR size: [1-9][0-9]* records?'
        condition: and

    extractors:
      - type: regex
        regex:
          - 'SOA\s+([^\s]+)'
        group: 1
