id: pghero-detect

info:
  name: PgHero 指纹识别（指纹识别）
  author: righettod
  severity: info
  description: >-
    PgHero 是 PostgreSQL 数据库性能仪表盘，用于查看查询、索引、空间和运行状态。该模板通过请求目标服务并检查预设路径或首页响应、DSL 条件等指纹特征，判断目标是否使用或暴露了
    PgHero 相关组件；命中结果仅表示指纹特征匹配，可用于资产盘点、技术栈识别和后续安全评估，不代表已确认存在可利用漏洞。
  reference:
  - https://github.com/ankane/pghero
  metadata:
    verified: true
    max-request: 1
    shodan-query: http.title:"PgHero"
  tags: tech,pghero,detect,discovery
http:
  - method: GET
    path:
      - "{{BaseURL}}"

    host-redirects: true
    matchers:
      - type: dsl
        dsl:
          - 'status_code == 200'
          - 'contains_any(to_lower(body), "<title>pghero", "/assets/pghero/", ">pghero</a>")'
        condition: and
