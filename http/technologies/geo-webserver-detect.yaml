id: geo-webserver-detect

info:
  name: GeoWebServer 指纹识别（指纹识别）
  author: dhiyaneshDK,daffainfo
  severity: info
  description: >-
    GeoWebServer 是地理信息服务相关 Web 平台，用于发布、管理或访问 GIS 数据服务。该模板通过请求目标服务并检查预设路径或首页响应、页面正文关键字、HTTP
    响应头、正则特征、状态码等指纹特征，判断目标是否使用或暴露了 GeoWebServer 相关组件；命中结果仅表示指纹特征匹配，可用于资产盘点、技术栈识别和后续安全评估，不代表已确认存在可利用漏洞。
  classification:
    cvss-metrics: CVSS:3.0/AV:N/AC:L/PR:N/UI:N/S:U/C:N/I:N/A:N
    cvss-score: 0
    cwe-id: CWE-200
  metadata:
    verified: true
    max-request: 1
    shodan-query: http.title:"GeoWebServer"
  tags: panel,geowebserver,tech,discovery
http:
  - method: GET
    path:
      - "{{BaseURL}}"

    matchers-condition: and
    matchers:
      - type: status
        status:
          - 200

      - type: word
        words:
          - "<TITLE>GeoWebServer</TITLE>"

    extractors:
      - type: regex
        part: header
        group: 1
        regex:
          - 'Server: GeoWebServer ([0-9.]+)'
