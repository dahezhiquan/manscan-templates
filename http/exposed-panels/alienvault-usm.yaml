id: alienVault-usm

info:
  name: AlienVault USM 登录面板（暴露面识别）
  author: dhiyaneshDK
  severity: info
  description: 该模板通过识别 AlienVault USM 登录入口的页面标题、特征文本或重定向行为，判断目标是否暴露了对应的认证界面。若命中，说明该登录面板对外可访问，可用于暴露面梳理与后续安全评估。
  classification:
    cwe-id: CWE-200
  metadata:
    max-request: 1
    shodan-query: http.title:"AlienVault USM"
  tags: panel,alienvault,discovery

http:
  - method: GET
    path:
      - '{{BaseURL}}/ossim/session/login.php'

    matchers-condition: and
    matchers:
      - type: word
        words:
          - '<title>AlienVault USM'

      - type: status
        status:
          - 200
