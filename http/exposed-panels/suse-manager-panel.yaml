id: suse-manager-panel

info:
  name: SUSE Manager Server 登录面板识别（指纹识别）
  severity: info
  author: darses
  description: |-
    SUSE Manager Server 是 Linux 系统管理平台，用于补丁、软件仓库、配置和主机生命周期管理。该模板请求首页，并依据 HTTP 200 状态码、页面标题、正文关键字或品牌资源特征识别目标是否部署了该系统或暴露了对应入口，适用于资产指纹确认；命中结果仅表示系统特征匹配，不代表已确认存在未授权访问或可利用漏洞。
  metadata:
    verify: true
    shodan-query:
    - title:"SUSE Manager - Sign In"
    - title:"SUSE Multi-Linux Manager - Sign In"
    - title:"Uyuni - Sign In"
    - http.favicon.hash:1158194469
    fofa-query:
    - title="SUSE Manager - Sign In"
    - title="SUSE Multi-Linux Manager - Sign In"
    - title="Uyuni - Sign In"
    - icon_hash="1158194469"
  tags: panel,detect,suse,login,discovery

http:
  - method: GET
    path:
      - "{{BaseURL}}"

    redirects: true
    max-redirects: 1

    matchers-condition: and
    matchers:
      - type: word
        words:
          - "<title>SUSE Manager - Sign In</title>"
          - "<title>SUSE Multi-Linux Manager - Sign In</title>"
          - "<title>Uyuni - Sign In</title>"
        condition: or

      - type: status
        status:
          - 200

    extractors:
      - type: regex
        group: 1
        regex:
          - "webVersion:\\s+'([\\d\\.\\s\\w]+)',"
