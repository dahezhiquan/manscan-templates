id: decision-center-ibm-odm-panel

info:
  name: IBM Operational Decision Manager 面板识别（指纹识别）
  author: DhiyaneshDK,righettod
  severity: info
  description: |-
    检测到目标站点存在 IBM Operational Decision Manager 相关响应特征。IBM Operational Decision Manager 是自动化运维、持续集成或任务编排平台，用于管理作业、流水线、凭据、执行记录和部署流程。模板请求 `/decisioncenter/login`，并通过页面标题或正文关键字、状态码确认该基础设施指纹；命中结果主要用于威胁狩猎、恶意基础设施识别和外部暴露面梳理。
  reference:
    - https://www.ibm.com/docs/en/odm/8.12.0
    - https://www.ibm.com/products/operational-decision-manager
  classification:
    cpe: cpe:2.3:a:ibm:operational_decision_manager:*:*:*:*:*:*:*:*
  metadata:
    verified: true
    max-request: 1
    vendor: ibm
    product: operational_decision_manager
    shodan-query: http.title:"Decision Center | Business Console"
    fofa-query: title="Decision Center | Business Console"
  tags: panel,ibm,login,detect,decision-center,discovery
http:
  - method: GET
    path:
      - "{{BaseURL}}/decisioncenter/login"

    matchers-condition: and
    matchers:
      - type: word
        part: body
        words:
          - '<title>Decision Center | Business Console</title>'
          - '<h1 class="title">Decision Center | Business Console</h1>'
          - 'com/ibm/rules/decisioncenter/setup/Login'
        condition: or

      - type: status
        status:
          - 200

    extractors:
      - type: regex
        part: body
        group: 1
        regex:
          - '(?i)"js/dist/([0-9.]+)/decisioncenter"'
