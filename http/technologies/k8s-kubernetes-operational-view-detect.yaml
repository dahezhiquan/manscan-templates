id: k8s-kubernetes-operational-view-detect

info:
  name: Kubernetes Operational View 指纹识别（指纹识别）
  author: idealphase
  severity: info
  description: >-
    Kubernetes Operational View 是 Kubernetes 集群可视化工具，用于展示节点、Pod 和资源运行状态。该模板通过请求目标服务并检查预设路径或首页响应、页面正文关键字、正则特征、状态码等指纹特征，判断目标是否使用或暴露了
    Kubernetes Operational View 相关组件；命中结果仅表示指纹特征匹配，可用于资产盘点、技术栈识别和后续安全评估，不代表已确认存在可利用漏洞。
  reference:
  - https://github.com/hjacobs/kube-ops-view
  - https://codeberg.org/hjacobs/kube-ops-view
  metadata:
    verified: true
    max-request: 1
    shodan-query: http.title:"Kubernetes Operational View"
  tags: tech,kubernetes,devops,kube,discovery
http:
  - method: GET
    path:
      - '{{BaseURL}}'

    matchers-condition: and
    matchers:
      - type: word
        words:
          - "<title>Kubernetes Operational View"

      - type: status
        status:
          - 200

    extractors:
      - type: regex
        group: 1
        regex:
          - '<title>Kubernetes Operational View (.+)<\/title>'
