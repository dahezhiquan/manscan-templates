id: smb-v1-enabled

info:
  name: SMBv1 协议已启用（本地基线扫描）
  author: princechaddha
  severity: critical
  description: |
    SMBv1 已废弃且存在大量已知攻击面。对应基线项为“SMBv1 是否启用”；模板读取 SMB 服务或共享配置，检查协议、签名、加密或管理共享是否符合基线。
  impact: |
    - 系统可能暴露于 EternalBlue/WannaCry 类攻击和协议降级风险。
    - 远程入口暴露或协议保护不足会增加暴力破解、中间人攻击和远程控制风险。
  remediation: |
    - 禁用 SMBv1，使用 SMBv2/v3，并移除依赖旧协议的系统。
    - 限制访问来源，优先使用加密和强认证，并关闭无业务需求的远程服务。
  tags: windows,smb,network,protocol,code,windows-audit

self-contained: true

code:
  - pre-condition: |
      IsWindows();
    engine:
      - powershell
      - powershell.exe
    args:
      - -ExecutionPolicy
      - Bypass
    pattern: "*.ps1"
    source: |
      (Get-SmbServerConfiguration).EnableSMB1Protocol

    matchers:
      - type: word
        words:
          - "True"
