id: caldera-c2

info:
  name: Caldera C2 识别（暴露面识别）
  author: pussycat0x
  severity: info
  description: |
    该模板通过识别 Caldera C2 相关页面或响应特征，判断目标是否暴露了疑似 C2、窃密或钓鱼基础设施面板。若命中，可作为外部暴露面排查、威胁狩猎与恶意基础设施识别的线索。
  reference:
    - https://github.com/mitre/caldera
    - https://github.com/montysecurity/C2-Tracker/blob/main/tracker.py
  classification:
    cpe: cpe:2.3:a:mitre:caldera:*:*:*:*:*:*:*:*
  metadata:
    verified: true
    max-request: 1
    vendor: mitre
    product: caldera
    fofa-query: http.favicon.hash:-636718605
  tags: c2,ir,osint,caldera,panel,vuln

http:
  - method: GET
    path:
      - '{{BaseURL}}'

    matchers-condition: and
    matchers:
      - type: word
        part: body
        words:
          - '<title>Login | CALDERA</title>'

      - type: status
        status:
          - 200
