id: brother-printer-panel

info:
  name: Brother Printer 面板识别（暴露面识别）
  author: pdteam
  severity: medium
  description: |-
    检测到目标站点暴露 Brother Printer 相关面板或登录入口。Brother Printer Web 管理面板是 Brother 打印设备的管理界面，用于查看设备状态、配置网络、维护耗材和管理打印服务。模板请求 `/general/status.html`，并通过页面标题或正文关键字、状态码、DSL 条件确认入口可访问；此类面板若直接暴露在公网，会增加账号枚举、口令攻击、漏洞匹配和未授权访问尝试的机会。
  impact: |-
    - 攻击者可确认目标部署了 Brother Printer 或相关组件，并据此开展账号枚举、口令喷洒、默认凭据尝试或针对性漏洞匹配。
    - 若面板存在弱口令、默认配置、访问控制缺陷或未修复漏洞，可能导致后台权限被获取、配置被篡改、敏感数据泄露或业务系统被接管。
    - 管理入口长期暴露在公网会扩大攻击面，增加自动化扫描、撞库、社会工程和后续横向移动的风险。
  remediation: |-
    - 将 Brother Printer 面板限制在内网、VPN、堡垒机或可信源 IP 访问范围内，避免管理入口直接暴露在公网。
    - 启用强密码、多因素认证、登录失败限制和默认账户清理，定期审计登录日志与管理员账号权限。
    - 保持系统和相关组件更新到受支持版本，关闭不必要的管理路径，并在必须公网访问时增加反向代理访问控制、WAF 或零信任访问策略。
  reference:
    - https://www.rapid7.com/blog/post/multiple-brother-devices-multiple-vulnerabilities-fixed
    - https://support.brother.com/g/b/faqend.aspx?c=eu_ot&lang=en&prod=group2&faqid=faq00100846_000
  classification:
    cvss-metrics: CVSS:3.1/AV:N/AC:L/PR:N/UI:N/S:U/C:N/I:N/A:N
    cwe-id: CWE-200
  metadata:
    verified: true
    max-request: 3
    shodan-query:
      - http.title:"Brother" OR http.title:"Printer" AND "Brother Industries"
    fofa-query:
      - app="brother-Printer"
    zoomeye-query:
      - device="brother-Printer" || app="brother-Printer"
  tags: panel,brother,printer,iot,discovery
http:
  - method: GET
    path:
      - "{{BaseURL}}/general/status.html"

    matchers:
      - type: dsl
        dsl:
          - 'status_code == 200 && contains(tolower(body), "brother industries")'
          - 'status_code == 200 && contains(tolower(body), "brother printer")'
          - 'status_code == 200 && contains(tolower(body), "brother mfc")'
          - 'status_code == 200 && contains(tolower(body), "brother hl")'
          - 'status_code == 200 && contains(tolower(body), "brother dcp")'
        condition: or

      - type: dsl
        dsl:
          - 'status_code == 200 && contains(tolower(body), "solutions.brother.com")'

    extractors:
      - type: regex
        group: 1
        part: body
        regex:
          - '(?i)<title[^>]*>([^<]+)</title>'
