id: ipswitch-imail-detect

info:
  name: Ipswitch IMail 服务器指纹识别（指纹识别）
  author: Shivam Kamboj
  severity: info
  description: |
    用于识别目标是否部署 Ipswitch IMail 服务器 并提取相关版本或构建信息，模板会结合 HTTP 响应头、特定路径或已知端点和版本或标识提取结果进行指纹匹配。
  metadata:
    verified: true
    max-request: 1
    shodan-query: "Ipswitch-IMail"
  tags: tech,ipswitch,imail,detect,discovery

http:
  - method: GET
    path:
      - "{{BaseURL}}"

    matchers:
      - type: dsl
        dsl:
          - 'contains(header, "Ipswitch-IMail")'

    extractors:
      - type: regex
        name: imail_version
        part: header
        group: 1
        regex:
          - 'Ipswitch-IMail/([0-9.]+)'
