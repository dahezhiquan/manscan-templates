id: isams-panel

info:
  name: iSAMS 面板识别（暴露面识别）
  author: righettod
  severity: info
  description: |
    该模板通过识别 iSAMS 面板、控制台或管理界面的页面特征，判断目标是否暴露了对应服务入口。若命中，说明该后台或运维界面对外可访问，可用于资产识别与暴露面排查。
  reference:
    - https://www.isams.com/platform/the-platform
  classification:
    cpe: cpe:2.3:a:iris:isams:*:*:*:*:*:*:*:*
  metadata:
    verified: true
    max-request: 1
    vendor: iris
    product: isams
    shodan-query: http.favicon.hash:-81573405
  tags: panel,isams,login,discovery

http:
  - method: GET
    path:
      - '{{BaseURL}}/auth'

    host-redirects: true
    max-redirects: 2

    matchers-condition: and
    matchers:
      - type: word
        part: body
        words:
          - 'iSAMS Ltd'
          - 'iSAMS Authentication Server'
        condition: and

      - type: status
        status:
          - 200

    extractors:
      - type: regex
        part: body
        group: 1
        regex:
          - 'Version&nbsp;([0-9\.]+)'
