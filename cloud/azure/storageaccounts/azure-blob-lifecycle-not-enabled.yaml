id: azure-blob-lifecycle-not-enabled
info:
  name: Azure Blob Storage 生命周期管理未配置（云安全）
  author: princechaddha
  severity: medium
  description: Azure Blob 生命周期管理通过规则自动分层、归档或删除不再使用的数据，缺少管理策略会使过期数据长期保留并增加存储暴露面。本模板枚举非经典 Storage 账户并执行 management-policy show，在 stderr 返回 No ManagementPolicy found for account 时报告。
  impact: |
    - 过期备份、临时文件和历史数据可能长期存在，增加敏感信息被误共享或被攻击者获取的时间窗口。
    - 存储容量和成本持续增长，也会使数据保留、删除和合规生命周期管理失控。
  remediation: |
    - 根据数据分类和业务保留要求创建 Blob 管理策略，配置分层、归档、删除和快照清理规则。
    - 在策略生效前评估恢复需求和最小保留期限，并持续审计策略变更和执行结果。
  reference:
    - https://docs.microsoft.com/en-us/azure/storage/blobs/storage-lifecycle-management-concepts
  metadata:
    vendor: microsoft
    product: azure-blob-storage
  tags: cloud,devops,azure,microsoft,blob-storage,azure-cloud-config

flow: |
  code(1);
  for (let AccountData of iterate(template.accountList)) {
    AccountData = JSON.parse(AccountData);
    set("name", AccountData.name);
    set("resourceGroup", AccountData.resourceGroup);
    code(2);
  }

self-contained: true
code:
  - engine:
      - sh
      - bash
    source: |
      az storage account list --query '[?kind!=`Storage`].{"Name":name,"ResourceGroup":resourceGroup}'

    extractors:
      - type: json
        name: accountList
        internal: true
        json:
          - '.[]'

  - engine:
      - sh
      - bash
    source: |
      az storage account management-policy show --account-name "$name" --resource-group "$resourceGroup" --output json

    matchers-condition: and
    matchers:
      - type: word
        part: stderr
        words:
          - "No ManagementPolicy found for account"

    extractors:
      - type: dsl
        dsl:
          - 'name + " in " + resourceGroup + " has no lifecycle management policy enabled"'
