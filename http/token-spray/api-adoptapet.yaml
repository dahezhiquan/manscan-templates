id: api-adoptapet

info:
  name: AdoptAPet API Token 可用性校验（token喷洒）
  author: daffainfo
  severity: high
  description: |-
    平台介绍：AdoptAPet API 是面向内容、媒体、社交、文化数据或公共信息查询的 API 平台，常用于访问图片、视频、文章、活动、资料库或开放数据。该模板用于校验提交的 AdoptAPet API Token 是否仍然有效。检测逻辑会向 `api.adoptapet.com/search/pets_at_shelter` 发起低影响 API 请求，通过查询参数中的 API Key/Token 传递 `{{token}}`，并依据响应中的 `returned_pets":`、`total_pets":` 判断凭据是否可用；命中通常表示该 Token 可被继续调用对应平台能力。
  reference:
    - https://www.adoptapet.com/public/apis/pet_list.html
    - https://github.com/daffainfo/all-about-apikey/tree/main/adoptapet
  metadata:
    max-request: 1
  tags: token-spray,adoptapet
  impact: |-
    - 攻击者可确认 Token 有效并调用平台 API，读取账户、资源、配额或业务数据。
    - 有效 Token 可能被持续滥用，造成数据泄露、配额消耗、费用增加、服务滥用或进一步横向访问。
  remediation: |-
    - 立即撤销或轮换已暴露的 API Token，并确认旧 Token 不再可用。
    - 按最小权限原则重新签发凭据，限制作用域、来源地址、项目范围和有效期。
    - 在代码仓库、CI/CD、日志和配置文件中排查泄露来源，避免 Token 再次提交或外传。
self-contained: true

http:
  - method: GET
    path:
      - "https://api.adoptapet.com/search/pets_at_shelter?key={{token}}&v=2&output=json&shelter_id=79570&start_number=1&end_number=500"

    matchers:
      - type: word
        part: body
        words:
          - 'returned_pets":'
          - 'total_pets":'
        condition: and
