id: onimai-rat-c2

info:
  name: Onimai RAT C2 证书识别（证书安全）
  author: worldwidefuckfest
  severity: high
  description: 该模板在证书颁发者通用名称（`issuer_cn`）中匹配 `Onimai Academies CA`，用于发现可能与 Onimai RAT 相关的 TLS C2 服务。命中表示证书使用了该家族公开的命名特征，但不能单独证明目标存在 RAT 感染或恶意通信。
  impact: |
    - 若目标确为 Onimai RAT C2，攻击者可能通过它接收回连、执行远程命令、窃取数据并维持受害主机控制。
    - C2 服务若暴露公网，可能成为攻击者持续运营和追踪受害资产的基础设施。
    - 证书名称可被伪造或复用，需结合网络连接、主机进程和恶意样本确认。
  remediation: |
    - 对命中资产进行网络和主机取证，核查 Onimai RAT 进程、启动项和外连行为。
    - 确认恶意后隔离主机、阻断 C2 域名/IP、清理持久化并轮换凭据。
    - 组织自有证书若包含该标识，应立即替换并审计私钥是否被未授权访问。
  metadata:
    verified: true
    max-request: 1
    shodan-query: ssl.cert.subject.cn:"Onimai Academies CA"
    censys-query: 'services.tls.certificates.leaf_data.subject.common_name: {"Onimai Academies CA"}'
  tags: c2,ir,osint,malware,onimai,rat,discovery

ssl:
  - address: "{{Host}}:{{Port}}"

    matchers:
      - type: word
        part: issuer_cn
        words:
          - "Onimai Academies CA"

    extractors:
      - type: json
        json:
          - " .issuer_cn"
