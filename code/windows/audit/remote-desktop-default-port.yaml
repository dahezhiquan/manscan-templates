id: remote-desktop-default-port

info:
  name: 远程桌面使用默认 3389 端口（本地基线扫描）
  author: asteria121
  severity: info
  description: |
    该模板检查 RDP 是否监听默认 TCP 3389 端口。默认端口更容易被扫描和暴力破解。
  impact: |
    暴露默认端口会增加自动化攻击、密码喷洒和勒索软件入侵风险。
  remediation: |
    将 RDP 置于 VPN/堡垒机后，限制来源；如策略要求，可改用非默认端口降低噪声。
  tags: windows,rdp,audit

self-contained: true

code:
  - pre-condition: |
      IsWindows();
    engine:
      - powershell
      - powershell.exe
    args:
      - -ExecutionPolicy
      - Bypass
    pattern: "*.ps1"
    source: |
      $rdpService = Get-Service -Name TermService;
      $rdpPort = (Get-ItemProperty -Path "HKLM:\SYSTEM\CurrentControlSet\Control\Terminal Server\WinStations\RDP-Tcp").PortNumber;
      if ($rdpService.Status -eq 'Running' -and $rdpPort -eq 3389) { Write-Host "True" } else { Write-Host "False" }

    matchers:
      - type: word
        words:
          - "True"
