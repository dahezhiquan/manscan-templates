id: password-policy-expiration-unconfigured

info:
  name: 阿里云 RAM 密码有效期策略未合规配置（云安全）
  author: DhiyaneshDK
  severity: medium
  description: RAM 密码有效期过长或未按基线配置时，泄露密码可被长期使用，增加控制台账号被持续滥用的风险。模板调用 GetPasswordPolicy 并检查 MaxPasswordAge，当密码有效期不满足 90 天内轮换要求时判定该策略未合规配置。
  impact: |
    - 长期不轮换密码会延长泄露凭据的可利用窗口，增加未授权控制台访问风险。
    - 密码生命周期缺少约束会影响身份治理和合规审计要求。
  remediation: |
    - 在 RAM 密码策略中设置 MaxPasswordAge 为 1 到 90 天内的合理值，并配合到期提醒流程。
    - 对高权限账号优先采用 MFA、临时凭据和角色扮演，减少长期密码依赖。
  reference:
    - https://www.alibabacloud.com/help/en/ram/user-guide/configure-a-password-policy-for-ram-users
    - https://www.trendmicro.com/cloudoneconformity/knowledge-base/alibaba-cloud/AlibabaCloud-RAM/require-password-expiration-policy.html
  metadata:
    max-request: 1
    verified: true
    vendor: alibaba
    product: ram
  tags: cloud,devops,aliyun,alibaba,alibaba-cloud-config,alibaba-ram

variables:
  region: "cn-hangzhou"

self-contained: true

code:
  - engine:
      - sh
      - bash

    source: |
      aliyun ram GetPasswordPolicy --region $region

    matchers-condition: and
    matchers:
      - type: regex
        regex:
          - '"MaxPasswordAge":\s*(9[1-9]|[1-9][0-9]{2,})'  # Matches values greater than 90

      - type: regex
        regex:
          - '"MaxPasswordAge":\s*(0|[1-9][0-9]?)'  # Excludes values between 0 and 90

    extractors:
      - type: dsl
        dsl:
          - '"RAM Password Policy Expiration is Greater than 90 Days "'
