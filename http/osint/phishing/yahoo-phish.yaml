id: yahoo-phish

info:
  name: Yahoo 仿冒钓鱼网站（钓鱼网站识别）
  author: rxerium
  severity: info
  description: |
    检测到疑似仿冒 Yahoo 的钓鱼网站。模板在目标页面返回 200、页面内容命中 Yahoo 的品牌页面特征，且当前主机不属于 yahoo.com 官方域名时触发，用于识别借用 Yahoo 品牌页面诱导用户信任的仿冒站点。
  reference:
    - https://yahoo.com
  metadata:
    max-request: 1
  tags: phishing,yahoo,osint,discovery
http:
  - method: GET
    path:
      - "{{BaseURL}}"

    host-redirects: true
    max-redirects: 2

    matchers-condition: and
    matchers:
      - type: word
        words:
          - 'Best-in-class Yahoo Mail, breaking local, national and global news, finance, sport, music, films and more. You get more out of the web, you get more out of life.'

      - type: status
        status:
          - 200

      - type: dsl
        dsl:
          - '!contains(host,"yahoo.com")'
