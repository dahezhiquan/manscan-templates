id: hyperv-enhanced-session-mode-enabled

info:
  name: Hyper-V 增强会话模式已启用（本地基线扫描）
  author: princechaddha
  severity: medium
  description: |
    该模板检查 Hyper-V Enhanced Session Mode 是否在无需时启用。该功能会扩展主机与虚拟机之间的剪贴板、磁盘和设备重定向能力。
  impact: |
    不必要的会话增强可能扩大数据泄露和主客机边界滥用风险。
  remediation: |
    仅在确有管理需求时启用增强会话模式，并限制可使用该功能的管理员。
  tags: windows,hyperv,code,windows-audit

self-contained: true

code:
  - pre-condition: |
      IsWindows();
    engine:
      - powershell
      - powershell.exe
    args:
      - -ExecutionPolicy
      - Bypass
    pattern: "*.ps1"
    source: |
      $enhancedSession = Get-VMHost | Select-Object -ExpandProperty EnhancedSessionTransportType
      Write-Host "EnhancedSessionMode: $enhancedSession"

    matchers:
      - type: word
        words:
          - "EnhancedSessionMode: VMBus"
