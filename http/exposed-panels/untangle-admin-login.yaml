id: untangle-admin-login

info:
  name: Untangle Administrator 登录面板识别（暴露面识别）
  author: irshad ahamed
  severity: info
  description: |
    该模板通过识别 Untangle Administrator 登录入口的页面标题、特征文本或重定向行为，判断目标是否暴露了对应的认证界面。若命中，说明该登录面板对外可访问，可用于暴露面梳理与后续安全评估。
  reference:
    - https://edge.arista.com/ng-firewall/
  classification:
    cvss-metrics: CVSS:3.0/AV:N/AC:L/PR:N/UI:N/S:U/C:N/I:N/A:N
    cwe-id: CWE-200
    cpe: cpe:2.3:a:untangle:ng_firewall:*:*:*:*:*:*:*:*
  metadata:
    verified: true
    max-request: 2
    vendor: untangle
    product: ng_firewall
    shodan-query:
      - title:"Untangle Administrator Login"
      - http.title:"untangle administrator login"
    fofa-query: title="untangle administrator login"
    google-query: intitle:"untangle administrator login"
  tags: panel,untangle,admin,login,discovery

http:
  - method: GET
    path:
      - '{{BaseURL}}'
      - '{{BaseURL}}/auth/login'

    stop-at-first-match: true
    host-redirects: true
    max-redirects: 2

    matchers-condition: and
    matchers:
      - type: word
        part: body
        words:
          - "Untangle Administrator Login"

      - type: status
        status:
          - 200
