id: laravel-terminal-exposure

info:
  name: Laravel Terminal 暴露
  author: pussycat0x
  severity: high
  description: |
    检测到 Laravel Terminal 暴露。目标响应或文件中可能暴露配置、凭据、密钥、令牌、环境变量或历史记录等敏感信息，可能被用于进一步入侵。
  reference:
    - https://github.com/recca0120/laravel-terminal
    - https://www.acunetix.com/vulnerabilities/web/laravel-terminal-open/
  metadata:
    max-request: 1
    verified: false
  tags: laravel,terminal,exposure,misconfig,rce

http:
  - method: GET
    path:
      - "{{BaseURL}}/asf/terminal"

    matchers-condition: and
    matchers:
      - type: word
        part: body
        words:
          - "Laravel Terminal"
          - "terminal.endpoint"
        condition: or

      - type: status
        status:
          - 200
