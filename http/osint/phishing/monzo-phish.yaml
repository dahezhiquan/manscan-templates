id: monzo-phish

info:
  name: Monzo 仿冒钓鱼网站（钓鱼网站识别）
  author: rxerium
  severity: info
  description: |
    检测到疑似仿冒 Monzo 的钓鱼网站。模板在目标页面返回 200、页面内容命中 Monzo 的登录或账号页面特征，且当前主机不属于 monzo.com 官方域名时触发，用于识别借用 Monzo 品牌页面诱导用户信任的仿冒站点。
  reference:
    - https://monzo.com
  metadata:
    max-request: 1
  tags: phishing,monzo,fintech,osint,discovery
http:
  - method: GET
    path:
      - "{{BaseURL}}"

    host-redirects: true
    max-redirects: 2

    matchers-condition: and
    matchers:
      - type: word
        words:
          - "Organise, save & invest with a free UK current account, joint account or business account. Make your money more Monzo."

      - type: status
        status:
          - 200

      - type: dsl
        dsl:
          - '!contains(host,"monzo.com")'
