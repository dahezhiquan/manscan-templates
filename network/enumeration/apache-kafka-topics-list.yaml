id: apache-kafka-topics-list

info:
  name: Apache Kafka Topics 枚举（指纹识别）
  author: pussycat0x
  severity: info
  description: |
    Apache Kafka 是分布式事件流与消息队列平台，Topic 用于承载业务事件和消息流。该模板与 9092/TCP 的 Kafka Broker 进行协议交互，尝试列举可见 Topic，并通过响应中的 Topic/主机特征确认 Broker 暴露的枚举能力。
  metadata:
    verified: true
    max-request: 1
    shodan-query: product:"Kafka"
  tags: network,detect,enum,kafka,apache,tcp,discovery
tcp:
  - inputs:
      - data: 00000020000300000000000200126b61666b612d707974686f6e2d322e302e3200000000
        type: hex
        read: 1024

      - data: 00000020000300000000000200126b61666b612d707974686f6e2d322e302e3200000000
        type: hex
        read: 1024

    host:
      - "{{Hostname}}"
    port: 9092

    matchers-condition: or
    matchers:
      - type: word
        part: raw
        words:
          - "localhost"

      - type: regex
        name: ip
        part: raw
        regex:
          - '(?:[0-9]{1,3}\.){3}[0-9]{1,3}'

    extractors:
      - type: regex
        part: raw
        name: value
        regex:
          - '([a-z.A-Z_0-9-]+)'
