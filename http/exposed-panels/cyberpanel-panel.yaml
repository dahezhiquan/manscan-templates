id: cyberpanel-panel

info:
  name: Cyberpanel 登录面板识别（指纹识别）
  author: mailler
  severity: info
  description: |-
    检测到目标站点存在 Cyberpanel 相关响应特征。Cyberpanel 是监控、日志、分析或可观测性系统，用于展示运行指标、告警事件、日志数据和服务状态。模板请求 `/`，并通过状态码、正则特征确认该系统指纹，用于资产识别、系统盘点和暴露面梳理。
  reference:
    - https://cyberpanel.net/KnowledgeBase/
  classification:
    cvss-metrics: CVSS:3.0/AV:N/AC:L/PR:N/UI:N/S:U/C:N/I:N/A:N
    cwe-id: CWE-200
  metadata:
    max-request: 1
    shodan-query: html:"cyberpanel"
    fofa-query: app="Cyberpanel"
    product: cyberpanel
  tags: cyberpanel,panel,login,detect,discovery
http:
  - method: GET
    path:
      - "{{BaseURL}}"

    matchers-condition: and
    matchers:
      - type: regex
        part: body
        regex:
          - "<title>(.*)CyberPanel(.*)</title>"

      - type: status
        status:
          - 200
