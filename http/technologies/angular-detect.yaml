id: angular-detect

info:
  name: Angular 指纹识别（指纹识别）
  author: TechbrunchFR
  severity: info
  description: Angular 是前端 Web 应用框架，用于构建单页应用和组件化客户端界面。该模板请求首页，并依据页面标题、正文关键字或品牌资源特征识别目标是否使用或暴露了 Angular 相关组件，适用于资产盘点、技术栈识别和后续安全评估；命中结果仅表示指纹特征匹配，不代表已确认存在可利用漏洞。
  reference:
  - https://github.com/angular/angular
  classification:
    cpe: cpe:2.3:a:angular:angular:*:*:*:*:node.js:*:*:*
  metadata:
    verified: true
    max-request: 1
    vendor: angular
    product: angular
    shodan-query: html:"ng-version="
  tags: tech,angular,discovery

http:
  - method: GET
    path:
      - "{{BaseURL}}"

    matchers-condition: and
    matchers:
      - part: body
        type: word
        words:
          - "ng-version="

    extractors:
      - type: regex
        group: 1
        regex:
          - 'ng-version="([0-9.]+)"'
