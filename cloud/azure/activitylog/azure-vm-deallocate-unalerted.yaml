id: azure-vm-deallocate-unalerted
info:
  name: Azure 虚拟机解除分配告警未配置（云安全）
  author: princechaddha
  severity: high
  description: 虚拟机解除分配会停止计算实例并释放计算资源，未配置 Activity Log 告警时，异常停机可能不被及时发现。该模板枚举已启用的 Activity Log Alert，并检查 condition 是否缺少 Microsoft.Compute/virtualMachines/deallocate/action 操作条件。
  impact: |
    - 生产虚拟机被解除分配可能造成应用中断、任务失败和数据处理延迟。
    - 攻击者可利用停机掩盖其他操作，或破坏依赖持续运行的安全代理和监控。
  remediation: |
    - 创建针对虚拟机解除分配操作的 Activity Log Alert，并配置业务和安全值班通知。
    - 限制停止和解除分配权限，结合业务可用性监控、自动恢复和变更审批降低影响。
  reference:
    - https://docs.microsoft.com/en-us/azure/azure-monitor/platform/alerts-activity-log
  metadata:
    vendor: microsoft
    product: azure-monitor
  tags: cloud,devops,azure,microsoft,virtual-machines,azure-cloud-config

flow: |
  code(1);
  for (let AlertData of iterate(template.alertList)) {
    set("id", AlertData);
    code(2);
  }

self-contained: true
code:
  - engine:
      - sh
      - bash
    source: |
      az monitor activity-log alert list --output json --query '[?(enabled==`true`)].id'

    extractors:
      - type: json
        name: alertList
        internal: true
        json:
          - '.[]'

  - engine:
      - sh
      - bash
    source: |
      az monitor activity-log alert show --ids "$id" --query 'condition'

    matchers-condition: and
    matchers:
      - type: word
        words:
          - '"field": "operationName"'

      - type: word
        words:
          - "Microsoft.Compute/virtualMachines/deallocate/action"
        negative: true

    extractors:
      - type: dsl
        dsl:
          - 'id + " does not have the correct alert configuration for Deallocate Virtual Machine events"'
