id: file-hide-last-login-information

info:
  name: SSH 最后登录信息未隐藏（本地文件安全扫描）
  author: pussycat0x
  severity: unknown
  description: |
    该模板检查 SSH 是否打印最后登录信息。该信息有助于用户发现异常访问，但也可能向攻击者泄露用户活动线索。
  remediation: |
    在 /etc/ssh/sshd_config 中设置 PrintLastLog no，并重启 SSH 服务。
  reference:
    - https://vishalraj82.medium.com/hardening-openssh-security-37f5d634015f
    - https://bugs.freebsd.org/bugzilla/show_bug.cgi?id=209441
  metadata:
    verified: true
  tags: audit,config,file,ssh

file:
  - extensions:
      - all

    matchers-condition: and
    matchers:
      - type: word
        words:
          - "# This is the sshd server system-wide configuration file"

      - type: word
        words:
          - "PrintLastLog no"
        negative: true
