id: society6-phish

info:
  name: Society6 仿冒钓鱼网站（钓鱼网站识别）
  author: rxerium
  severity: info
  description: |
    检测到疑似仿冒 Society6 的钓鱼网站。模板在目标页面返回 200、页面内容命中 Society6 的品牌页面特征，且当前主机不属于 society6.com 官方域名时触发，用于识别借用 Society6 品牌页面诱导用户信任的仿冒站点。
  reference:
    - https://society6.com
  metadata:
    max-request: 1
  tags: phishing,society6,osint,discovery
http:
  - method: GET
    path:
      - "{{BaseURL}}"

    host-redirects: true
    max-redirects: 2

    matchers-condition: and
    matchers:
      - type: word
        words:
          - 'Society6'
          - 'Society6 features art prints, home decor, bed &amp; bath, iPhone cases, apparel and tech accessories you&#39;ll love with designs by artists worldwide.'
        condition: and

      - type: status
        status:
          - 200

      - type: dsl
        dsl:
          - '!contains(host,"society6.com")'
