id: appsmith-web-login

info:
  name: Appsmith User Login 面板识别（暴露面识别）
  author: powerexploit
  severity: info
  description: 该模板通过识别 Appsmith User Login 登录入口的页面标题、特征文本或重定向行为，判断目标是否暴露了对应的认证界面。若命中，说明该登录面板对外可访问，可用于暴露面梳理与后续安全评估。
  reference:
    - https://www.appsmith.com
  classification:
    cvss-metrics: CVSS:3.0/AV:N/AC:L/PR:N/UI:N/S:U/C:N/I:N/A:N
    cwe-id: CWE-200
    cpe: cpe:2.3:a:appsmith:appsmith:*:*:*:*:*:*:*:*
  metadata:
    verified: true
    max-request: 1
    vendor: appsmith
    product: appsmith
    shodan-query: http.title:"appsmith"
    fofa-query: title="appsmith"
    google-query: intitle:"appsmith"
  tags: panel,appsmith,discovery

http:
  - method: GET
    path:
      - "{{BaseURL}}/user/login"

    matchers-condition: and
    matchers:
      - type: word
        part: body
        words:
          - "<title>Appsmith</title>"

      - type: status
        status:
          - 200
