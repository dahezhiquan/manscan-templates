id: sse-cmk-disabled

info:
  name: 阿里云 OSS 服务端加密未使用客户管理密钥（云安全）
  author: ritikchaddha
  severity: high
  description: OSS Bucket 服务端加密未使用客户管理密钥时，密钥创建、轮换、禁用和审计能力无法完全由租户侧掌控。模板读取 Bucket 加密配置中的 KMSMasterKeyID 后调用 KMS DescribeKey，当密钥创建者显示为云服务托管来源时，判定未使用客户管理密钥进行 SSE-KMS 加密。
  impact: |
    - 关键对象数据缺少独立 CMK 的生命周期控制，难以满足高敏数据隔离、密钥轮换和吊销要求。
    - 安全团队对密钥访问审计和授权边界的控制粒度不足，增加合规审计压力。
  remediation: |
    - 在 KMS 中创建或导入客户管理密钥，并将 OSS Bucket 默认加密配置切换为使用该 CMK 的 SSE-KMS。
    - 最小化 CMK 使用权限，定期审计 KMS 授权、密钥轮换和 Bucket 加密状态。
  reference:
    - https://www.trendmicro.com/cloudoneconformity/knowledge-base/alibaba-cloud/AlibabaCloud-OSS/enable-sse-with-customer-managed-key.html
  metadata:
    max-request: 1
    verified: true
    vendor: alibaba
    product: oss
  tags: cloud,devops,aliyun,alibaba,aliyun-cloud-config,ecs

variables:
  region: "cn-hangzhou"

flow: |
  code(1)
  for (let BucketName of iterate(template.bucketname)) {
    set("bucket", BucketName)
    code(2)
    for (let KMSMasterKeyID of iterate(template.KmsID)) {
      set("KmsID", KMSMasterKeyID)
      code(3)
    }
  }

self-contained: true

code:
  - engine:
      - sh
      - bash
    source: |
      ossutil ls -s --region $region

    extractors:
      - type: regex
        name: bucketname
        internal: true
        regex:
          - 'oss://([a-zA-Z0-9-]+)'

  - engine:
      - sh
      - bash
    source: |
      ossutil bucket-encryption --method get $bucket --RegionId $region

    extractors:
      - type: regex
        name: KmsID
        internal: true
        regex:
          - 'KMSMasterKeyID: ([a-z0-9-]+)'

  - engine:
      - sh
      - bash

    source: |
      aliyun kms DescribeKey --KeyId $KmsID --RegionId $region

    matchers-condition: and
    matchers:
      - type: word
        words:
          - 'Creator": "Rds'

    extractors:
      - type: dsl
        dsl:
          - 'KmsID + " SSE with customer-managed keys Disable"'
