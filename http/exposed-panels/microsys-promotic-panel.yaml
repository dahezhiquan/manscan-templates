id: microsys-promotic-panel

info:
  name: Microsys Promotic SCADA - 登录面板（暴露面识别）
  author: rxerium
  severity: info
  description: |
    该模板通过识别 Microsys Promotic SCADA 登录入口的页面标题、特征文本或重定向行为，判断目标是否暴露了对应的认证界面。若命中，说明该登录面板对外可访问，可用于暴露面梳理与后续安全评估。
  reference:
    - https://www.microsys.cz/en/products/promotic/
  metadata:
    max-request: 1
    verified: true
    vendor: MicroSys
    product: promotic
    shodan-query: 'http.title:"PROMOTIC"'
  tags: panel,microsys,promotic,scada,ics,ot,discovery

http:
  - method: GET
    path:
      - '{{BaseURL}}'

    host-redirects: true
    max-redirects: 2

    matchers-condition: and
    matchers:
      - type: word
        part: body
        words:
          - '<title>PROMOTIC Redirection</title>'

      - type: word
        part: header
        words:
          - 'Server: Promotic'

      - type: status
        status:
          - 200
