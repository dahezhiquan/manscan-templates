id: frp-default-login

info:
  name: FRP 默认口令登录（弱口令）
  author: pikpikcu
  severity: high
  description: 该模板通过尝试 FRP 的默认账号口令，并依据认证成功后的响应特征判断目标是否仍在使用未修改的弱口令。若命中，攻击者可直接登录系统，进一步访问敏感信息、修改配置或执行未授权操作。
  reference:
    - https://github.com/fatedier/frp/issues/1840
  classification:
    cwe-id: CWE-798
  metadata:
    max-request: 1
  tags: frp,default-login,vuln

http:
  - raw:
      - |
        GET /api/proxy/tcp HTTP/1.1
        Host: {{Hostname}}
        Authorization: Basic {{base64(username + ':' + password)}}

    payloads:
      username:
        - admin
      password:
        - admin
    attack: pitchfork

    matchers-condition: and
    matchers:
      - type: word
        words:
          - '"proxies":'
        part: body
        condition: and

      - type: status
        status:
          - 200
