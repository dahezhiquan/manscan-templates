id: wallix-accessmanager-panel

info:
  name: Wallix Access Manager 面板识别（暴露面识别）
  author: righettod
  severity: info
  description: 该模板通过识别 Wallix Access Manager 面板、控制台或管理界面的页面特征，判断目标是否暴露了对应服务入口。若命中，说明该后台或运维界面对外可访问，可用于资产识别与暴露面排查。
  reference:
    - https://www.wallix.com/privileged-access-management/access-manager/
  classification:
    cvss-metrics: CVSS:3.0/AV:N/AC:L/PR:N/UI:N/S:U/C:N/I:N/A:N
    cwe-id: CWE-200
    cpe: cpe:2.3:a:wallix:bastion_access_manager:*:*:*:*:*:*:*:*
  metadata:
    max-request: 2
    shodan-query: http.title:"Wallix Access Manager"
    product: bastion_access_manager
    vendor: wallix
  tags: panel,wallix,discovery

http:
  - method: GET
    path:
      - '{{BaseURL}}/wabam'
      - '{{BaseURL}}/wabam/favicon.ico'

    stop-at-first-match: true
    host-redirects: true
    max-redirects: 3

    matchers-condition: or
    matchers:
      - type: dsl
        dsl:
          - "status_code==200"
          - "contains(tolower(body), '<title>wallix access manager</title>')"
        condition: and

      - type: dsl
        dsl:
          - "status_code==200"
          - "('1745235488' == mmh3(base64_py(body)))"
        condition: and
