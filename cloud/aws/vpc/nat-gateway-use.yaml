id: nat-gateway-use
info:
  name: VPC 未使用托管 NAT Gateway（云安全）
  author: princechaddha
  severity: medium
  description: 托管 NAT Gateway 可为私有子网资源提供受控出站互联网访问，避免实例直接暴露公网入口；VPC 中缺少可用 NAT Gateway 时，私有工作负载可能依赖不一致的出站方案。该模板枚举 VPC，并检查可用状态的 NAT Gateway 列表是否为空。
  impact: |
    - 私有子网资源可能被迫使用公网 IP、临时 NAT 实例或不受控路由进行出站访问。
    - 出站路径缺少统一治理会影响补丁下载、依赖访问、日志上报和网络审计。
  remediation: |
    - 根据业务需要在 VPC 中部署高可用 NAT Gateway，并为私有子网配置指向 NAT Gateway 的默认路由。
    - 对无需互联网出站的工作负载优先使用 VPC Endpoint，减少经过公网的服务访问。
  reference:
    - https://docs.aws.amazon.com/vpc/latest/userguide/vpc-nat-gateway.html
  metadata:
    max-request: 2
    vendor: amazon
    product: vpc
  tags: cloud,devops,aws,amazon,vpc,aws-cloud-config
variables:
  region: "us-east-1"

flow: |
  code(1)
  for(let VPCIds of iterate(template.vpcid)){
    set("vpc", VPCIds)
    code(2)
  }

self-contained: true
code:
  - engine:
      - sh
      - bash
    source: |
      aws ec2 describe-vpcs --region $region --query 'Vpcs[*].VpcId' --output json

    extractors:
      - type: json
        name: vpcid
        internal: true
        json:
          - '.[]'

  - engine:
      - sh
      - bash
    source: |
         aws ec2 describe-nat-gateways --region $region --filter "Name=vpc-id,Values=$vpc" "Name=state,Values=available" --query 'NatGateways'

    matchers:
      - type: word
        words:
          - "[]"

    extractors:
      - type: dsl
        dsl:
          - 'vpc + " VPC is not using Managed NAT Gateways"'
