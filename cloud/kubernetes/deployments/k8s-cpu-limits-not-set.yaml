id: k8s-cpu-limits-not-set

info:
  name: CPU limits not set 中的Deployments（云安全）
  author: princechaddha
  severity: medium
  description: Deployment 未设置 CPU limits 会使容器在负载异常或被滥用时消耗过多节点 CPU，影响同节点其他工作负载稳定性。本模板枚举所有命名空间的 Deployment，检查 Pod 模板中是否存在容器缺少 resources.limits.cpu。
  impact: |
    - 单个容器可能抢占节点 CPU，导致业务抖动、调度拥塞或邻近工作负载性能下降。
    - 攻击者或故障进程可利用无上限资源消耗扩大拒绝服务影响。
  remediation: |
    - 为每个容器设置符合业务峰值的 resources.limits.cpu，并结合 LimitRange 为命名空间设置默认值。
    - 持续观察实际使用量，避免限制过低造成频繁节流。
  reference:
    - https://kubernetes.io/docs/tasks/configure-pod-container/assign-cpu-resource/
  metadata:
    vendor: kubernetes
    product: kubernetes
  tags: cloud,devops,kubernetes,devsecops,deployments,k8s-cluster-security
flow: |
  code(1);
  for (let deployment of template.items) {
    set("deployment",deployment)
    javascript(1);
  }

self-contained: true

code:
  - engine:
      - sh
      - bash
    source: kubectl get deployments --all-namespaces --output=json
    extractors:
      - type: json
        name: items
        internal: true
        json:
          - '.items[]'

javascript:
  - code: |
        deployment = JSON.parse(template.deployment);
        if (!deployment.spec.template.spec.containers.some(container => container.resources && container.resources.limits && container.resources.limits.cpu)) {
          let result = (`Deployment '${deployment.metadata.name}' in namespace '${deployment.metadata.namespace}' lacks CPU limits.`);
          Export(result);
        }

    extractors:
      - type: dsl
        dsl:
          - response
