id: azure-postgres-double-encryption-disabled
info:
  name: Azure PostgreSQL 基础设施双重加密未启用（云安全）
  author: princechaddha
  severity: medium
  description: Azure PostgreSQL Single Server 的 infrastructureEncryption 用于在平台存储加密之外增加基础设施层加密，关闭时会减少静态数据保护的纵深。本模板枚举 PostgreSQL 服务器并查询 infrastructureEncryption，仅当返回值为 Disabled 时报告。
  impact: |
    - 存储介质、备份或底层基础设施暴露时，数据库文件和临时数据缺少额外加密层保护。
    - 对受监管或高敏感数据场景，单层静态加密可能无法满足组织的纵深防御和合规要求。
  remediation: |
    - 按业务和服务能力启用 infrastructureEncryption，并确认新建或迁移方案是否需要在实例创建阶段完成配置。
    - 对无法原地启用的现有实例，规划到支持该能力的安全配置实例迁移，并在迁移前验证备份和恢复流程。
  reference:
    - https://docs.microsoft.com/en-us/azure/postgresql/concepts-data-security-encryption
  metadata:
    vendor: microsoft
    product: azure-postgresql
  tags: cloud,devops,azure,microsoft,postgresql,azure-cloud-config

flow: |
  code(1);
  for (let ServerData of iterate(template.serverList)) {
    ServerData = JSON.parse(ServerData);
    set("name", ServerData.Name);
    set("resourceGroup", ServerData.ResourceGroup);
    code(2);
  }

self-contained: true
code:
  - engine:
      - sh
      - bash
    source: |
      az postgres server list --output json --query '[*].{"Name":name,"ResourceGroup":resourceGroup}'

    extractors:
      - type: json
        name: serverList
        internal: true
        json:
          - '.[]'

  - engine:
      - sh
      - bash
    source: |
      az postgres server show --name "$name" --resource-group "$resourceGroup" --query 'infrastructureEncryption'

    matchers-condition: and
    matchers:
      - type: word
        words:
          - '"Disabled"'

    extractors:
      - type: dsl
        dsl:
          - 'name + " in " + resourceGroup + " does not have double encryption enabled"'
