id: graphql-graphiql-detect

info:
  name: GraphiQL 指纹识别（指纹识别）
  author: Adam Crosser
  severity: info
  description: >-
    GraphiQL 是 GraphQL 的交互式浏览器 IDE，用于调试 schema、编写查询和查看接口文档。该模板通过请求目标服务并检查预设路径或首页响应、页面正文关键字、状态码等指纹特征，判断目标是否使用或暴露了
    GraphiQL 相关组件；命中结果仅表示指纹特征匹配，可用于资产盘点、技术栈识别和后续安全评估，不代表已确认存在可利用漏洞。
  metadata:
    max-request: 1
  tags: tech,graphiql,graphql,discovery
http:
  - method: GET
    path:
      - "{{BaseURL}}"

    matchers-condition: and
    matchers:
      - type: word
        part: body
        words:
          - '<title>GraphiQL'

      - type: status
        status:
          - 200
