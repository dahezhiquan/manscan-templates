id: gitlab-saml

info:
  name: Gitlab SAML - 识别（暴露面识别）
  author: rootxharsh,iamnoooob,pdresearch
  severity: info
  description: |
    该模板用于识别 Gitlab SAML 相关页面或服务入口是否对外暴露。若命中，说明目标可被识别为对应产品或组件，可用于资产发现与攻击面管理。
  metadata:
    verified: true
    max-request: 1
    vendor: gitlab
    product: gitlab
    shodan-query:
      - http.title:"gitlab"
      - cpe:"cpe:2.3:a:gitlab:gitlab"
      - http.html:"gitlab enterprise edition"
    fofa-query:
      - body="gitlab enterprise edition"
      - title="gitlab"
    google-query: intitle:"gitlab"
  tags: panel,saml,gitlab,discovery

http:
  - raw:
      - |
        GET /users/auth/saml/metadata HTTP/1.1
        Host: {{Hostname}}

    matchers-condition: and
    matchers:
      - type: word
        part: body
        words:
          - "EntityDescriptor"
          - "SAML"
        condition: and

      - type: word
        part: content_type
        words:
          - "application/xml"

      - type: status
        status:
          - 200
