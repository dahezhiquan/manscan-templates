id: rds-log-export-disabled

info:
  name: RDS 日志导出到 CloudWatch 未启用（云安全）
  author: DhiyaneshDK
  severity: low
  description: RDS 日志导出可将数据库错误日志、慢查询日志、审计日志等发送到 CloudWatch Logs；未启用时，数据库审计和故障分析数据分散或不可见。该模板检查 EnabledCloudwatchLogsExports 是否为空数组。
  impact: |
    - 数据库异常、慢查询、认证失败或潜在攻击痕迹可能无法被集中检索和告警。
    - 安全调查和故障排查缺少历史日志，增加定位难度和响应时间。
  remediation: |
    - 为支持的 RDS 引擎启用必要日志类型的 CloudWatch Logs export。
    - 配置日志保留期、访问控制和告警规则，确保日志可用于审计、检测和取证。
  reference:
    - https://www.trendmicro.com/cloudoneconformity-staging/knowledge-base/aws/RDS/log-exports.html
    - https://docs.aws.amazon.com/AmazonRDS/latest/UserGuide/USER_LogAccess.html
  metadata:
    vendor: amazon
    product: rds
  tags: cloud,devops,aws,amazon,rds,aws-cloud-config
variables:
  region: "us-west-2"

flow: |
  code(1)
  for(let DBClusterIdentifier of iterate(template.dbclusters)){
    set("dbcluster", DBClusterIdentifier)
    code(2)
  }

self-contained: true

code:
  - engine:
      - sh
      - bash
    source: |
      aws rds describe-db-instances --region $region --output table --query 'DBInstances[?Engine==`mysql` || Engine==`aurora-mysql` || Engine==`mariadb`].DBInstanceIdentifier | []' --output json

    extractors:
      - type: json
        name: dbclusters
        internal: true
        json:
          - '.[]'

  - engine:
      - sh
      - bash

    source: |
        aws rds describe-db-instances --region $region --db-instance-identifier $dbcluster --query 'DBInstances[*].EnabledCloudwatchLogsExports' --output json

    matchers:
      - type: word
        words:
          - '[]'

    extractors:
      - type: dsl
        dsl:
          - 'dbcluster + " RDS Log Exports is Disabled"'
