id: struts-debug-mode

info:
  name: Apache Struts setup in Debug-Mode 泄露（暴露面识别）
  author: pdteam
  severity: low
  description: 检测到可直接访问的 Apache Struts setup in Debug-Mode。日志、异常页面或调试输出通常会泄露堆栈信息、内部路径、查询语句、账号标识、令牌片段或业务数据，不应向未授权用户开放。
  metadata:
    max-request: 1
  tags: logs,struts,apache,exposure,setup,vuln

http:
  - method: GET
    path:
      - '{{BaseURL}}'

    matchers:
      - type: word
        words:
          - "<debug>"
          - "<struts.actionMapping>"
        condition: and
