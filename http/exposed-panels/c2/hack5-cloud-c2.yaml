id: hack5-cloud-c2

info:
  name: Hack5 Cloud C2 识别（暴露面识别）
  author: pussycat0x
  severity: info
  description: |
    该模板通过识别 Hack5 Cloud C2 相关页面或响应特征，判断目标是否暴露了疑似 C2、窃密或钓鱼基础设施面板。若命中，可作为外部暴露面排查、威胁狩猎与恶意基础设施识别的线索。
  reference:
    - https://twitter.com/fofabot/status/1742737671037091854
  metadata:
    verified: true
    max-request: 1
    fofa-query: app="Hak5-C2"
  tags: c2,ir,osint,hack5c2,panel,vuln

http:
  - method: GET
    path:
      - '{{BaseURL}}'

    matchers-condition: and
    matchers:
      - type: word
        part: body
        words:
          - '<title>Hak5 Cloud C²</title>'

      - type: status
        status:
          - 200
