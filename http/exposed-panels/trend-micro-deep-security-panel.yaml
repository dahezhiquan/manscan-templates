id: trend-micro-deep-security-panel

info:
  name: Trend Micro Deep Security Manager - 登录面板（暴露面识别）
  author: rxerium
  severity: info
  description: |-
    Trend Micro Deep Security Manager 是一款企业级服务器安全平台，可为物理、虚拟和云环境提供入侵检测、反恶意软件、防火墙及完整性监控能力。
  reference:
    - https://www.trendmicro.com/en_us/business/products/hybrid-cloud/deep-security.html
  metadata:
    max-request: 1
    shodan-query: 'http.title:"Deep Security Manager"'
  tags: panel,trend-micro,deep-security,vpn

http:
  - method: GET
    path:
      - "{{BaseURL}}"

    redirects: true
    max-redirects: 2

    matchers-condition: and
    matchers:
      - type: word
        words:
          - 'Trend Micro Deep Security Manager'
        part: body

      - type: status
        status:
          - 200
