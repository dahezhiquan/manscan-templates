id: winrm-enabled

info:
  name: WinRM 已启用（本地基线扫描）
  author: princechaddha
  severity: medium
  description: |
    WinRM 提供远程命令和管理能力。对应基线项为“WinRM 是否在无业务需求时启用”；模板读取 WinRM 服务状态，匹配 `Running` 时判定远程管理服务已启用。
  impact: |
    - 不必要的 WinRM 暴露会增加远程命令执行和凭据攻击面。
    - 远程入口暴露或协议保护不足会增加暴力破解、中间人攻击和远程控制风险。
  remediation: |
    - 如无远程管理需求，禁用 WinRM；如必须启用，限制来源并启用加密认证。
    - 限制访问来源，优先使用加密和强认证，并关闭无业务需求的远程服务。
  tags: windows,winrm,code,windows-audit

self-contained: true

code:
  - pre-condition: |
      IsWindows();
    engine:
      - powershell
      - powershell.exe
    args:
      - -ExecutionPolicy
      - Bypass
    pattern: "*.ps1"
    source: |
      Get-Service -Name WinRM | Select-Object -ExpandProperty Status

    matchers:
      - type: word
        words:
          - "Running"
