id: hugo-detect

info:
  name: Hugo 指纹识别（指纹识别）
  author: daffainfo
  severity: info
  description: >-
    Hugo 是 Go 编写的静态站点生成器，用于快速构建博客、文档和内容网站。该模板通过请求目标服务并检查预设路径或首页响应、页面正文关键字、正则特征、状态码等指纹特征，判断目标是否使用或暴露了
    Hugo 相关组件；命中结果仅表示指纹特征匹配，可用于资产盘点、技术栈识别和后续安全评估，不代表已确认存在可利用漏洞。
  classification:
    cpe: cpe:2.3:a:gohugo:hugo:*:*:*:*:*:*:*:*
  metadata:
    verified: true
    max-request: 1
    vendor: gohugo
    product: hugo
    shodan-query: http.html:'Hugo'
  tags: tech,hugo,discovery
http:
  - method: GET
    path:
      - "{{BaseURL}}"

    redirects: true
    max-redirects: 2

    matchers-condition: and
    matchers:
      - type: word
        part: body
        words:
          - '<meta name=generator content="Hugo'

      - type: status
        status:
          - 200

    extractors:
      - type: regex
        group: 1
        regex:
          - '(?m)<meta name=generator content="Hugo ([0-9.]+)">'
