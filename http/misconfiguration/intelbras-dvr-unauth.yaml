id: intelbras-dvr-unauth

info:
  name: Intelbras DVR Unrestricted 访问
  author: pussycat0x
  severity: low
  description: |
    检测到 Intelbras DVR Unrestricted 访问。目标功能在未认证状态下可访问，可能暴露管理入口、业务数据、系统状态或可执行操作，需确认是否存在访问控制缺失。
  reference:
    - https://github.com/netsecfish/intelbras_cap_js
  metadata:
    verified: true
    max-request: 1
    fofa-query: "body=\"Intelbras\""
  tags: unauth,intelbras,dvr,misconfig,vuln

http:
  - method: GET
    path:
      - "{{BaseURL}}/cap.js"

    matchers-condition: and
    matchers:
      - type: word
        words:
          - "var talkTypes="
          - "var userInfo="
        condition: and

      - type: status
        status:
          - 200
