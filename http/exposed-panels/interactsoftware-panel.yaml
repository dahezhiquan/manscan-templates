id: interactsoftware-panel

info:
  name: Interact Software 面板识别（指纹识别）
  author: righettod
  severity: info
  description: |-
    检测到目标站点存在 Interact Software 相关响应特征。Interact Software 是一套通过 Web 提供访问的管理面板或业务系统，通常用于配置服务、查看状态、管理数据或执行日常运维操作。模板请求 `/login`，并通过页面标题或正文关键字、状态码确认该系统指纹，用于资产识别、系统盘点和暴露面梳理。
  reference:
    - https://www.interactsoftware.com
  metadata:
    verified: true
    max-request: 1
  tags: panel,interactsoftware,interact,detect,discovery
http:
  - method: GET
    path:
      - '{{BaseURL}}/login'

    host-redirects: true
    max-redirects: 2

    matchers-condition: and
    matchers:
      - type: word
        part: body
        words:
          - 'www.interactsoftware.com'
          - 'community.interact-intranet.com'
          - '/InteractV'
        condition: and

      - type: status
        status:
          - 200

    extractors:
      - type: regex
        part: body
        group: 1
        regex:
          - '(?:v=)([0-9]+\.[0-9]+\.?[0-9]*\.?[0-9]*)'
