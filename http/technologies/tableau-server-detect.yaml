id: tableau-server-detect

info:
  name: Tableau Server 指纹识别（指纹识别）
  author: TechbrunchFR,aringo
  severity: info
  description: >-
    Tableau Server 是商业智能和数据可视化平台，用于发布、共享和管理仪表盘与数据源。该模板通过请求目标服务并检查预设路径或首页响应、HTTP 响应头、页面正文关键字、正则特征等指纹特征，判断目标是否使用或暴露了
    Tableau Server 相关组件；命中结果仅表示指纹特征匹配，可用于资产盘点、技术栈识别和后续安全评估，不代表已确认存在可利用漏洞。
  metadata:
    max-request: 1
    vendor: salesforce
    product: tableau_server
    shodan-query:
    - product:"Tableau Server"
    - "X-Tableau: Tableau Server"
    - "Server: Tableau"
    - http.favicon.hash:-1441956789
    fofa-query:
    - "X-Tableau: Tableau Server"
    - server=="Tableau"
    - icon_hash="-1441956789"
    zoomeye-query: app:"Tableau Server"
  tags: tech,detect,tableau,salesforce,discovery
http:
  - method: GET
    path:
      - "{{BaseURL}}"

    matchers-condition: or
    matchers:
      - type: word
        part: header
        words:
          - "X-Tableau: Tableau Server"
          - "Server: Tableau"
        condition: or

      - type: word
        part: body
        words:
          - "VizPortalRun"
          - "vizportal"
        condition: or

    extractors:
      - type: regex
        part: body
        group: 1
        regex:
          - 'data-build[iI]d="([0-9a-z_]*)'
