id: dns-internal-ip-disclosure

info:
  name: 公共 DNS 解析到私有 IP 地址（dns）
  author: infosec-asish,DevamShah
  severity: low
  description: |-
    公共 DNS 将域名解析到私有、环回或保留 IPv4 地址时，可能把内部网络命名、拓扑和部署关系暴露给外部人员，并使不应公开的主机进入资产画像。本模板查询 A 记录，仅匹配 `10.0.0.0/8`、`127.0.0.0/8`、`192.168.0.0/16` 和 `172.16.0.0/12` 范围内的响应并提取地址，不覆盖所有保留地址范围。
  impact: |
    - 外部人员可利用域名与内网地址的对应关系辅助内网侦察、资产关联和 SSRF 目标发现。
    - 若客户端、代理或解析器能够访问该地址，公开解析还可能把内部服务意外暴露给不应访问的网络路径。
  remediation: |
    - 将内部主机名迁移到分离的内部 DNS 或 split-horizon DNS，避免通过公共权威 DNS 返回私有地址。
    - 清理停用主机和旧环境的公共 A 记录，并核对 CDN、反向代理和服务发现配置是否误将内部地址发布到公网。
    - 在网络出口、代理和云安全组层面继续限制对私有地址的访问，不能仅依赖 DNS 隐藏。
  reference:
    - https://tools.ietf.org/html/rfc1918
    - https://tools.ietf.org/html/rfc6598
    - https://cwe.mitre.org/data/definitions/200.html
  classification:
    cwe-id: CWE-200
  metadata:
    max-request: 1
  tags: dns,exposure,misconfig,recon

dns:
  - name: "{{FQDN}}"
    type: A

    matchers-condition: and
    matchers:
      - type: regex
        name: a-record-present
        part: answer
        regex:
          - "IN\tA\t(.+)$"

      - type: regex
        name: rfc1918-or-loopback
        part: answer
        regex:
          - "IN\tA\t(10|127|192\\.168|172\\.(1[6-9]|2[0-9]|3[01]))\\.[0-9]{1,3}\\.[0-9]{1,3}"

    extractors:
      - type: regex
        group: 1
        part: answer
        regex:
          - "IN\tA\t((?:10|127|192\\.168|172\\.(?:1[6-9]|2[0-9]|3[01]))\\.[0-9.]+)"
