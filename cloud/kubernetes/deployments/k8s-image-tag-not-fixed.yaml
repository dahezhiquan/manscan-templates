id: k8s-image-tag-not-fixed

info:
  name: Image Tag should be fixed - not latest or blank（云安全）
  author: princechaddha
  severity: low
  description: Deployment 使用 latest 或空镜像标签会让实际运行镜像随仓库状态变化，削弱供应链可追溯性和变更可控性。本模板枚举容器 image 字段，命中标签为空或为 latest 的 Deployment。
  impact: |
    - 相同配置在不同时间可能拉取不同镜像，导致不可预测变更和回滚困难。
    - 被污染或误推的 latest 镜像可能快速影响生产工作负载。
  remediation: |
    - 使用不可变版本标签或镜像 digest 固定部署内容。
    - 在 CI/CD 中阻止 latest 或空标签进入生产，并保留镜像签名与漏洞扫描记录。
  reference:
    - https://kubernetes.io/docs/concepts/containers/images/
  metadata:
    vendor: kubernetes
    product: kubernetes
  tags: cloud,devops,kubernetes,devsecops,deployments,k8s-cluster-security
flow: |
  code(1);
  for (let deployment of template.items) {
    set("deployment",deployment)
    javascript(1);
  }

self-contained: true

code:
  - engine:
      - sh
      - bash
    source: kubectl get deployments --all-namespaces --output=json
    extractors:
      - type: json
        name: items
        internal: true
        json:
          - '.items[]'

javascript:
  - code: |
        deployment = JSON.parse(template.deployment);
        deployment.spec.template.spec.containers.forEach(container => {
          const tag = container.image.split(':').pop();
          if (tag === 'latest' || tag === '') {
            let result = (`Deployment '${deployment.metadata.name}' in namespace '${deployment.metadata.namespace}' uses 'latest' or blank image tag for container '${container.name}'.`);
            Export(result);
          }
        });

    extractors:
      - type: dsl
        dsl:
          - response
