id: cockroachdb-detect

info:
  name: CockroachDB DB Console 指纹识别（指纹识别）
  author: rxerium
  severity: info
  description: |-
    CockroachDB DB Console 是分布式 SQL 数据库，用于高可用事务数据存储和集群管理。该模板请求首页，并依据 HTTP 200 状态码、页面标题、正文关键字或品牌资源特征识别目标是否使用或暴露了 CockroachDB DB Console 相关组件，适用于资产盘点、技术栈识别和后续安全评估；命中结果仅表示指纹特征匹配，不代表已确认存在可利用漏洞。
  reference:
  - https://www.cockroachlabs.com/docs/stable/ui-overview
  metadata:
    max-request: 1
    shodan-query: 'product:"CockroachDB"'
  tags: tech,cockroachdb,database,console

http:
  - method: GET
    path:
      - "{{BaseURL}}"

    matchers-condition: and
    matchers:
      - type: word
        part: body
        words:
          - "<title>Cockroach Console</title>"

      - type: status
        status:
          - 200
