id: asus-aicloud-panel

info:
  name: ASUS AiCloud 面板识别（指纹识别）
  author: ritikchaddha
  severity: info
  description: |-
    检测到目标站点存在 ASUS AiCloud 相关响应特征。ASUS AiCloud 是 AI、LLM 或机器学习相关平台，用于管理模型、数据集、工作区、代理任务或可观测性信息。模板请求 `/`，并通过页面标题或正文关键字、状态码确认该系统指纹，用于资产识别、系统盘点和暴露面梳理。
  reference:
    - https://www.asus.com/in/content/aicloud/
  metadata:
    verified: "true"
    max-request: 1
    shodan-query: title:"AiCloud"
  tags: panel,asus,aicloud,detect,discovery
http:
  - method: GET
    path:
      - '{{BaseURL}}'

    matchers-condition: and
    matchers:
      - type: word
        part: body
        words:
          - 'AiCloud</title>'

      - type: status
        status:
          - 200
          - 401
        condition: or
