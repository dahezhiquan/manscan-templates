id: fiftyone-panel

info:
  name: 检测 FiftyOne 面板（指纹识别）
  author: rxerium
  severity: info
  description: |-
    检测到 FiftyOne——由 Voxel51 构建的、用于计算机视觉工作流的开源数据集可视化与整理工具。该应用默认不启用认证，因此任何暴露的实例都会将可浏览的数据集内容（图像、标签、元数据）直接呈现给未认证访客。本次通过匹配其特有的页面标题、meta description 及界面专属元素 ID 识别该实例。
  reference:
    - https://github.com/voxel51/fiftyone
    - https://docs.voxel51.com
  metadata:
    verified: true
    max-request: 1
    vendor: voxel51
    product: fiftyone
    shodan-query: 'http.title:"FiftyOne"'
  tags: panel,fiftyone,ml,ai,computer-vision,detect,discovery

http:
  - method: GET
    path:
      - "{{BaseURL}}"

    host-redirects: true
    max-redirects: 2

    matchers-condition: and
    matchers:
      - type: word
        part: body
        words:
          - "<title>FiftyOne</title>"
          - "Explore, Analyze, Curate"
          - 'id="colorModal"'
        condition: and

      - type: status
        status:
          - 200
