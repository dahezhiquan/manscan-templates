id: mealie-panel

info:
  name: Mealie 面板识别（指纹识别）
  author: ChrisJr404
  severity: info
  description: |-
    检测到目标站点存在 Mealie 相关响应特征。Mealie 是自托管食谱和家庭餐饮管理系统，用于管理菜谱、购物清单、餐单和家庭共享数据。模板请求 `/`、`/api/app/about` 路径，并通过页面标题或正文关键字、状态码、DSL 条件确认该系统指纹，用于资产识别、系统盘点和暴露面梳理。
  reference:
    - https://github.com/mealie-recipes/mealie
    - https://mealie.io/
  metadata:
    verified: true
    max-request: 2
    vendor: mealie-recipes
    product: mealie
    shodan-query: http.title:"Mealie"
    fofa-query: title="Mealie"
  tags: panel,mealie,recipe,selfhosted,detect,discovery
flow: http(1) && http(2)

http:
  - method: GET
    path:
      - "{{BaseURL}}"

    host-redirects: true
    max-redirects: 2

    matchers:
      - type: dsl
        dsl:
          - 'status_code == 200'
          - 'contains(to_lower(body), "<title>mealie</title>")'
        internal: true
        condition: and

  - method: GET
    path:
      - "{{BaseURL}}/api/app/about"

    matchers:
      - type: dsl
        dsl:
          - 'status_code == 200'
          - 'contains_all(body, "\"production\"", "\"version\"", "\"demoStatus\"", "\"allowSignup\"")'
          - 'contains(content_type, "application/json")'
        condition: and

    extractors:
      - type: regex
        part: body
        group: 1
        regex:
          - '"version"\s*:\s*"([^"]+)"'
