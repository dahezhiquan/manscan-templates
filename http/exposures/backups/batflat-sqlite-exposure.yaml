id: batflat-sqlite-exposure

info:
  name: Batflat SQLite 数据库 暴露（暴露面识别）
  author: DhiyaneshDk
  severity: high
  description: |
    检测到可下载的 Batflat SQLite 数据库。备份文件或数据库转储往往包含源码、配置、用户数据、历史记录或认证信息，一旦暴露可能直接导致敏感数据外泄。
  reference:
    - https://batflat.org/
    - https://github.com/sruupl/batflat
  classification:
    cwe-id: CWE-219,CWE-552
  metadata:
    verified: true
    max-request: 1
    shodan-query: html:"Batflat"
  tags: batflat,database,sqlite,unauth,backup,exposure

http:
  - method: GET
    path:
      - "{{BaseURL}}/inc/data/database.sdb"

    matchers-condition: and
    matchers:
      - type: binary
        binary:
          - "53514c69746520666f726d6174203300"  # "SQLite format 3\0" hex
        part: body

      - type: status
        status:
          - 200
