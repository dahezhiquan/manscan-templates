id: firebase-auth-fingerprint

info:
  name: Firebase 身份认证 - 指纹识别（指纹识别）
  author: zomasec,zomaxsec
  severity: info
  description: |-
    通过请求认证辅助脚本并检查 Firebase 许可证、SDK 版本和服务条款引用，识别使用 Firebase 进行身份认证的应用。
  reference:
    - https://firebase.google.com/docs/auth/web/redirect-best-practices
  metadata:
    max-request: 1
  tags: firebase,fingerprint,tech

http:
  - method: GET
    path:
      - "{{BaseURL}}/__/auth/handler.js"

    matchers-condition: and
    matchers:
      - type: word
        part: body
        words:
          - "@license Firebase"

      - type: regex
        part: body
        regex:
          - "Build: [0-9]+\\.[0-9]+\\.[0-9]+(-rc\\.[0-9]+)?"

      - type: word
        part: body
        words:
          - "https://firebase.google.com/terms/"
