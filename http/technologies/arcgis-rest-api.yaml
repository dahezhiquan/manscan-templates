id: arcgis-rest-api

info:
  name: ArcGIS Exposed REST API 文档指纹识别（指纹识别）
  author: Podalirius
  severity: info
  description: 用于识别目标暴露的 ArcGIS Exposed REST API 文档，模板会结合状态码和特定路径或已知端点判断是否存在对应技术或默认页面特征。
  reference:
    - https://enterprise.arcgis.com/en/
  classification:
    cwe-id: CWE-200
    cpe: cpe:2.3:a:esri:arcgis_engine:*:*:*:*:*:*:*:*
  metadata:
    max-request: 1
    vendor: esri
    product: arcgis_engine
  tags: api,arcgis,cms,tech,esri,discovery

http:
  - method: GET
    path:
      - '{{BaseURL}}/server/sdk/rest/index.html'

    matchers-condition: and
    matchers:
      - type: word
        words:
          - 'ArcGIS REST API'

      - type: status
        status:
          - 200
