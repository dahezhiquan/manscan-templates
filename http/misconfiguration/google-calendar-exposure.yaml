id: google-calendar-exposure

info:
  name: Google Calendar 暴露
  author: DhiyaneshDk
  severity: low
  description: |
    该模板用于核查 Google Calendar 暴露。该类问题通常源于配置文件、备份文件、管理页面、服务状态或敏感资源被错误暴露到 Web 访问路径。模板会向目标发送探测请求，并依据请求 ``、匹配 `calendar.google.com/calendar/embed`、匹配 `calendar.google.com/calendar/ical`、匹配 `calendar.google.com/calendar/u/0/embed`等证据确认目标是否存在该配置问题。
  impact: |
    - 攻击者可获取版本、路径、账号、密钥、令牌、配置或业务数据等敏感信息。
    - 泄露的信息可能被用于凭据攻击、漏洞匹配、权限提升或横向移动。
  remediation: |
    - 移除 Web 根目录下不应公开的配置、备份、日志和临时文件。
    - 为敏感页面和资源增加访问控制，并按最小暴露原则收敛公开路径。
    - 轮换已暴露的密钥、令牌和凭据，并审计异常下载或枚举行为。
  reference:
    - https://support.google.com/calendar/answer/37083
  metadata:
    verified: true
    max-request: 1
  tags: google,calendar,exposure,misconfig

http:
  - method: GET
    path:
      - "{{BaseURL}}"

    host-redirects: true
    max-redirects: 2

    matchers-condition: and
    matchers:
      - type: word
        part: body
        words:
          - "calendar.google.com/calendar/embed"
          - "calendar.google.com/calendar/ical"
          - "calendar.google.com/calendar/u/0/embed"
          - "www.googleapis.com/calendar"
        condition: or

      - type: status
        status:
          - 200

      - type: word
        part: body
        words:
          - "reviewable_default_visibility"
        negative: true

    extractors:
      - type: regex
        name: calendar-url
        part: body
        regex:
          - "(https?://calendar\\.google\\.com/calendar/(?:embed|ical|u/0/embed)[^\"'\\s>]+)"
