id: opentext-filr-guest-access

info:
  name: OpenText Filr Guest 访问 启用
  author: pussycat0x
  severity: medium
  description: |
    该模板用于核查 OpenText Filr Guest 访问 启用。该类问题通常源于配置文件、备份文件、管理页面、服务状态或敏感资源被错误暴露到 Web 访问路径。模板会向目标发送探测请求，并依据请求 `/ssf/a/do?p_name=ss_forum&p_action=1&action=__login`、匹配 `contains_all(body, 'GuestUser','true')`、匹配 `contains_any(body, 'Filr', 'filr', 'Vibe')`、匹配 `status_code == 200`等证据确认目标是否存在该配置问题。
  impact: |
    - 攻击者可获取版本、路径、账号、密钥、令牌、配置或业务数据等敏感信息。
    - 泄露的信息可能被用于凭据攻击、漏洞匹配、权限提升或横向移动。
  remediation: |
    - 移除 Web 根目录下不应公开的配置、备份、日志和临时文件。
    - 为敏感页面和资源增加访问控制，并按最小暴露原则收敛公开路径。
    - 轮换已暴露的密钥、令牌和凭据，并审计异常下载或枚举行为。
  reference:
    - https://www.microfocus.com/documentation/filr/filr-23.2/filr-admin/access.html
    - https://www.microfocus.com/documentation/filr/filr-23.2/filr-inst/bjm9tb7.html
    - https://opentext.com/products/filr
  classification:
    cwe-id: CWE-284
    cvss-metrics: CVSS:3.1/AV:N/AC:L/PR:N/UI:N/S:U/C:L/I:N/A:N
    cvss-score: 5.3
  metadata:
    max-request: 1
    verified: true
    shodan-query: html:"OpenText Filr"
    product: filr
    vendor: opentext
  tags: misconfig,opentext,filr,exposure

http:
  - method: GET
    path:
      - "{{BaseURL}}/ssf/a/do?p_name=ss_forum&p_action=1&action=__login"

    host-redirects: true
    max-redirects: 3

    matchers:
      - type: dsl
        dsl:
          - "contains_all(body, 'GuestUser','true')"
          - "contains_any(body, 'Filr', 'filr', 'Vibe')"
          - "status_code == 200"
        condition: and
