id: magento-eol

info:
  name: Magento EOL 指纹识别（指纹识别）
  author: dogancanbakir
  severity: info
  description: >-
    Magento 是电商网站平台，EOL 版本表示目标站点运行的 Magento 分支已结束官方维护。该模板通过请求目标服务并检查预设路径或首页响应、页面正文关键字、正则特征、DSL
    条件等指纹特征，判断目标是否使用或暴露了 Magento EOL 相关组件；命中结果仅表示指纹特征匹配，可用于资产盘点、技术栈识别和后续安全评估，不代表已确认存在可利用漏洞。
  reference:
  - https://www.magento.com/
  classification:
    cvss-metrics: CVSS:3.0/AV:N/AC:L/PR:N/UI:N/S:U/C:N/I:N/A:N
    cwe-id: CWE-200
    cpe: cpe:2.3:a:magento:magento:*:*:*:*:*:*:*:*
  metadata:
    verified: true
    max-request: 1
    shodan-query: http.component:"Magento"
    product: magento
    vendor: magento
  tags: magento,tech,cms,discovery
http:
  - method: GET
    path:
      - "{{BaseURL}}"

    extractors:
      - type: regex
        part: body
        internal: true
        name: version
        group: 1
        regex:
          - 'Magento\/([0-9.]+) '
    matchers:
      - type: dsl
        dsl:
          - compare_versions(version, '<=2.4')

      - type: regex
        part: body
        regex:
          - 'Magento\/([0-9.]+) '
