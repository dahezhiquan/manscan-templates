id: gunicorn-detect

info:
  name: Gunicorn 服务器指纹识别（指纹识别）
  author: joanbono
  severity: info
  description: 用于识别目标是否部署 Gunicorn 服务器 并提取相关版本或构建信息，模板会结合 HTTP 响应头、特定路径或已知端点和版本或标识提取结果进行指纹匹配。
  reference:
    - https://github.com/benoitc/gunicorn
  metadata:
    max-request: 1
  tags: tech,gunicorn,discovery

http:
  - method: GET
    path:
      - "{{BaseURL}}"

    matchers-condition: and
    matchers:
      - type: regex
        part: header
        regex:
          - gunicorn+

    extractors:
      - type: kval
        part: header
        kval:
          - Server
