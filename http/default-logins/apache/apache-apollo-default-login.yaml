id: apache-apollo-default-login

info:
  name: Apache Apollo 默认口令登录（弱口令）
  author: ritikchaddha
  severity: high
  description: |
    该模板用于检测 Apache Apollo 是否仍可使用默认凭据或弱口令登录。模板主要向 `/api/json/session/signin`、`/console/index.html` 等认证入口发送请求，使用内置默认凭据组合进行认证尝试，并根据响应中的 `^\s*true\s*$`、`<strong>Log Details:` 等登录成功特征判断登录是否成功；命中说明目标未及时修改出厂、示例或初始化账号口令。
  impact: |
    - 攻击者可进入 Apache Apollo 管理后台，修改任务、服务、插件、路由、作业调度或部署配置。
    - 在 DevOps、网关、监控或调度场景中，后台失陷可能影响生产任务执行、泄露密钥配置，并扩大到下游主机或业务系统。
  remediation: |
    - 立即修改默认管理员口令并清理示例账号，按角色最小化后台管理权限。
    - 将控制台和管理 API 放入受控网络或 VPN 后方，并开启多因素认证、登录失败限制和操作审计。
    - 复核近期任务、插件、连接配置、访问令牌和部署记录，轮换可能暴露的密钥。
  classification:
    cpe: cpe:2.3:a:apache:activemq_apollo:*:*:*:*:*:*:*:*
  metadata:
    verified: true
    max-request: 1
    vendor: apache
    product: activemq_apollo
    shodan-query: title:"Apache Apollo"
  tags: apache,apollo,default-login,misconfig,vuln
variables:
  username: 'admin'
  password: 'admin'

http:
  - raw:
      - |
        POST /api/json/session/signin HTTP/1.1
        Host: {{Hostname}}
        Content-Type: application/x-www-form-urlencoded; charset=UTF-8

        username={{username}}&password={{password}}
      - |
        GET /console/index.html HTTP/1.1
        Host: {{Hostname}}

    matchers-condition: and
    matchers:
      - type: regex
        part: body_1
        regex:
          - '^\s*true\s*$'

      - type: word
        part: body_2
        words:
          - '<strong>Log Details:'
          - 'Store Status'
          - 'Logout</a>'
        condition: and

      - type: status
        status:
          - 200
