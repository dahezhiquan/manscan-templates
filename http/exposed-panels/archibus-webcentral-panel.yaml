id: archibus-webcentral-panel

info:
  name: Archibus Web Central Login 面板识别（暴露面识别）
  author: righettod,PJBorah,Hardik-Rathod
  severity: info
  description: 该模板通过识别 Archibus Web Central Login 登录入口的页面标题、特征文本或重定向行为，判断目标是否暴露了对应的认证界面。若命中，说明该登录面板对外可访问，可用于暴露面梳理与后续安全评估。
  reference:
    - https://archibus.com/products/
  classification:
    cvss-metrics: CVSS:3.0/AV:N/AC:L/PR:N/UI:N/S:U/C:N/I:N/A:N
    cwe-id: CWE-200
    cpe: cpe:2.3:a:archibus:web_central:*:*:*:*:*:*:*:*
  metadata:
    verified: true
    max-request: 3
    vendor: archibus
    product: web_central
    shodan-query: http.favicon.hash:889652940
    fofa-query: icon_hash=889652940
  tags: panel,archibus,discovery

http:
  - method: GET
    path:
      - '{{BaseURL}}'
      - '{{BaseURL}}/archibus/login.axvw'
      - '{{BaseURL}}/archibus/schema/ab-core/views/sign-in/ab-sign-in.jsp'

    host-redirects: true
    max-redirects: 2
    stop-at-first-match: true

    matchers-condition: and
    matchers:
      - type: word
        words:
          - "ARCHIBUS"

      - type: word
        words:
          - "Continue As a Guest"
          - "login"
        condition: or

      - type: status
        status:
          - 200
