id: CNVD-2019-01348

info:
  name: Xiuno BBS 系统重装漏洞（CNVD-2019-01348）
  author: princechaddha
  severity: high
  description: Xiuno BBS 安装完成后若 `install` 目录未被妥善处理，攻击者仍可直接访问安装向导并发起系统重装。模板通过检测 `/install/` 页面中的安装资源与语言选择内容来识别该风险。
  remediation: 升级到已修复版本，并在部署后及时删除、限制或关闭安装目录及其访问入口。
  reference:
    - https://www.cnvd.org.cn/flaw/show/CNVD-2019-01348
  classification:
    cvss-metrics: CVSS:3.0/AV:N/AC:L/PR:N/UI:N/S:U/C:N/I:N/A:H
    cvss-score: 7.5
    cwe-id: CWE-284
  metadata:
    max-request: 1
  tags: cnvd2019,cnvd,xiuno,vuln

http:
  - method: GET
    path:
      - "{{BaseURL}}/install/"

    headers:
      Accept-Encoding: deflate

    matchers-condition: and
    matchers:
      - type: status
        status:
          - 200

      - type: word
        part: body
        words:
          - "/view/js/xiuno.js"
          - "Choose Language (选择语言)"
        condition: and
