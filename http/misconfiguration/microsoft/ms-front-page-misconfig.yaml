id: ms-front-page-misconfig

info:
  name: Microsoft FrontPage 配置暴露
  author: JTeles,pikpikcu
  severity: low
  description: |
    该模板用于核查 Microsoft FrontPage 配置暴露。该类问题通常源于配置文件、备份文件、管理页面、服务状态或敏感资源被错误暴露到 Web 访问路径。模板会向目标发送探测请求，并依据请求 `/_vti_inf.html`、`/_vti_pvt/service.cnf`、匹配 `vti_extenderversion:`、匹配 `FPVersion=`等证据确认目标是否存在该配置问题。
  impact: |
    - 攻击者可获取版本、路径、账号、密钥、令牌、配置或业务数据等敏感信息。
    - 泄露的信息可能被用于凭据攻击、漏洞匹配、权限提升或横向移动。
  remediation: |
    - 移除 Web 根目录下不应公开的配置、备份、日志和临时文件。
    - 为敏感页面和资源增加访问控制，并按最小暴露原则收敛公开路径。
    - 轮换已暴露的密钥、令牌和凭据，并审计异常下载或枚举行为。
  reference:
    - https://docs.microsoft.com/en-us/archive/blogs/fabdulwahab/security-protecting-sharepoint-server-applications
    - https://www.tenable.com/plugins/was/112772
    - https://stackoverflow.com/questions/1163820/what-are-vti-cnf-vti-pvt-vti-script-and-vti-txt-folders
  metadata:
    verified: true
    max-request: 2
  tags: misconfig,exposure,frontpage,microsoft,vuln

http:
  - method: GET
    path:
      - "{{BaseURL}}/_vti_inf.html"
      - "{{BaseURL}}/_vti_pvt/service.cnf"
      - "{{BaseURL}}/_vti_pvt/access.cnf"
      - "{{BaseURL}}/_vti_txt/default.wti/All.cat"

    matchers-condition: and
    matchers:
      - type: word
        part: body
        words:
          - "vti_extenderversion:"
          - "FPVersion="
          - "PasswordDir:"
          - "Catalog for database:"

      - type: status
        status:
          - 200
