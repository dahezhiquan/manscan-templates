id: dynatrace-rum-detect

info:
  name: Dynatrace RUM 指纹识别（指纹识别）
  author: Shivam Kamboj
  severity: info
  description: |-
    Dynatrace RUM 是 Dynatrace 真实用户监控组件，用于采集前端性能、用户会话和错误数据。该模板请求首页，并依据 HTTP 200 状态码、页面标题、正文关键字或品牌资源特征识别目标是否使用或暴露了 Dynatrace RUM 相关组件，适用于资产盘点、技术栈识别和后续安全评估；命中结果仅表示指纹特征匹配，不代表已确认存在可利用漏洞。
  reference:
  - https://docs.dynatrace.com/docs/observe/digital-experience/rum-concepts/rum-overview
  metadata:
    max-request: 1
    verified: true
    shodan-query: html:"ruxitagentjs"
  tags: tech,discovery,rum,dynatrace

http:
  - method: GET
    path:
      - "{{BaseURL}}"

    redirects: true

    matchers-condition: and
    matchers:
      - type: word
        part: body
        words:
          - "ruxitagentjs_"
          - "data-dtconfig="
        condition: and

      - type: status
        status:
          - 200
