id: gcloud-nat-subnet-unrestricted

info:
  name: NAT Gateway Subnets 未Restricted to Specific VPCs（云安全）
  author: princechaddha
  severity: medium
  description: 该规则用于检查 GCP nat 相关资源是否存在公开暴露、未受限访问或匿名可访问等高风险配置，避免敏感数据、管理接口或网络服务直接暴露在公网。
  impact: |
    - 公开暴露的资源可能被未授权访问、枚举、下载或恶意利用。
    - 一旦涉及管理接口、对象存储或数据库服务，可能进一步导致数据泄露、权限滥用或业务中断。
  remediation: |
    - 收敛公网暴露面，仅允许受信任网络、IP 范围或必要身份访问相关资源。
    - 对对象存储、负载均衡、数据库或控制台接口启用更严格的访问控制与网络隔离策略。
  reference:
    - https://cloud.google.com/nat/docs/using-nat
  tags: cloud,devops,gcp,gcloud,google-cloud-nat,gcp-cloud-config

flow: |
  code(1)
  for(let projectId of iterate(template.projectIds)){
    set("projectId", projectId)
    code(2)
    for(let vpcNetwork of iterate(template.vpcNetworks)){
      set("vpcNetwork", vpcNetwork)
      code(3)
      for(let router of iterate(template.routers)){
        set("router", router)
        code(4)
        for(let natGateway of iterate(template.natGateways)){
          set("natGateway", natGateway)
          code(5)
        }
      }
    }
  }

self-contained: true

code:
  - engine:
      - sh
      - bash
    source: |
      gcloud projects list --format="json(projectId)"

    extractors:
      - type: json
        name: projectIds
        internal: true
        json:
          - '.[].projectId'

  - engine:
      - sh
      - bash
    source: |
      gcloud compute networks list --project $projectId --format="json(name)"

    extractors:
      - type: json
        name: vpcNetworks
        internal: true
        json:
          - '.[].name'

  - engine:
      - sh
      - bash
    source: |
      gcloud compute routers list --project $projectId --filter="network:($vpcNetwork)" --format="json(name)"

    extractors:
      - type: json
        name: routers
        internal: true
        json:
          - '.[].name'

  - engine:
      - sh
      - bash
    source: |
      gcloud compute routers nats list --router=$router --project=$projectId --format="json(name)"

    extractors:
      - type: json
        name: natGateways
        internal: true
        json:
          - '.[].name'

  - engine:
      - sh
      - bash
    source: |
      gcloud compute routers nats describe $natGateway --router=$router --project=$projectId --format="json(subnetworks)"

    matchers:
      - type: word
        words:
          - 'ALL_IP_RANGES'

    extractors:
      - type: dsl
        dsl:
          - '"NAT gateway " + natGateway + " under router " + router + " in project " + projectId + " is associated with unrestricted subnets."'
