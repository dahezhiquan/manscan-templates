id: pyload-default-login

info:
  name: PyLoad 默认口令登录（弱口令）
  author: DhiyaneshDk
  severity: high
  description: |
    该模板通过尝试 PyLoad 的默认凭据，并依据认证成功后的响应特征判断目标是否仍在使用未修改的弱口令。若命中，攻击者可直接登录系统并访问相应管理功能或业务数据。
  reference:
    - https://pypi.org/project/pyload-ng/#:~:text=Default%20username%3A%20pyload%20.,Default%20password%3A%20pyload%20.
  classification:
    cpe: cpe:2.3:a:pyload:pyload:*:*:*:*:*:*:*:*
  metadata:
    verified: true
    max-request: 1
    vendor: pyload
    product: pyload
    shodan-query: html:"pyload"
  tags: default-login,pyload,vuln

http:
  - raw:
      - |
        POST /login HTTP/1.1
        Host: {{Hostname}}
        Content-Type: application/x-www-form-urlencoded

        do=login&username={{username}}&password={{password}}&submit=Login

    payloads:
      username:
        - pyload
      password:
        - pyload
    attack: pitchfork

    matchers-condition: and
    matchers:
      - type: word
        part: header
        words:
          - 'Set-Cookie: pyload_session='
          - '/dashboard'
        condition: and

      - type: status
        status:
          - 302
