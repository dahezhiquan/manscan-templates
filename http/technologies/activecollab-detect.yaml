id: activecollab-detect

info:
  name: activecollab 指纹识别（指纹识别）
  author: ffffffff0x
  severity: info
  description: activecollab 是项目管理与团队协作平台，用于任务、项目、工时和客户协作管理。该模板请求首页，并依据 HTTP 200 状态码、页面标题、正文关键字或品牌资源特征识别目标是否使用或暴露了 activecollab 相关组件，适用于资产盘点、技术栈识别和后续安全评估；命中结果仅表示指纹特征匹配，不代表已确认存在可利用漏洞。
  classification:
    cpe: cpe:2.3:a:activecollab:activecollab:*:*:*:*:*:*:*:*
  metadata:
    max-request: 1
    vendor: activecollab
    product: activecollab
    fofa-query: app="ActiveCollab"
  tags: acsoft,tech,activecollab,discovery

http:
  - method: GET
    path:
      - "{{BaseURL}}"

    host-redirects: true
    max-redirects: 2

    matchers-condition: and
    matchers:
      - type: word
        words:
          - "http://www.activecollab.com"
          - '<form method="post" id="system_form_2" class="uniForm focusFirstField">'
        condition: or

      - type: status
        status:
          - 200
