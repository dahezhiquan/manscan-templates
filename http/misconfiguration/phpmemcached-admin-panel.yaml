id: phpmemcached-admin-panel

info:
  name: phpMemcached管理面板
  author: tess
  severity: medium
  description: |
    检测到 phpMemcached管理面板。目标响应或文件中可能暴露配置、凭据、密钥、令牌、环境变量或历史记录等敏感信息，可能被用于进一步入侵。
  metadata:
    verified: true
    max-request: 1
    shodan-query: title:"phpMemcachedAdmin"
  tags: phpmemcached,exposure,misconfig,vuln

http:
  - method: GET
    path:
      - '{{BaseURL}}'

    matchers-condition: and
    matchers:
      - type: word
        part: body
        words:
          - "phpMemcachedAdmin"
          - "Execute Commands on Servers"
        condition: and
        case-insensitive: true

    extractors:
      - type: regex
        part: body
        group: 1
        regex:
          - "MemcachedAdmin ([0-9.]+)"
