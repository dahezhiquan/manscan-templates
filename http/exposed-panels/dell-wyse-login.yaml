id: dell-wyse-login

info:
  name: Dell Wyse Management Suite 登录面板识别（暴露面识别）
  author: gy741
  severity: info
  description: 该模板通过识别 Dell Wyse Management Suite 登录入口的页面标题、特征文本或重定向行为，判断目标是否暴露了对应的认证界面。若命中，说明该登录面板对外可访问，可用于暴露面梳理与后续安全评估。
  reference:
    - https://research.nccgroup.com/2021/07/06/technical-advisory-arbitrary-file-read-in-dell-wyse-management-suite-cve-2021-21586-cve-2021-21587/
  classification:
    cvss-metrics: CVSS:3.0/AV:N/AC:L/PR:N/UI:N/S:U/C:N/I:N/A:N
    cwe-id: CWE-200
    cpe: cpe:2.3:a:dell:wyse_management_suite:*:*:*:*:*:*:*:*
  metadata:
    max-request: 1
    vendor: dell
    product: wyse_management_suite
  tags: panel,dell,login,discovery

http:
  - method: GET
    path:
      - '{{BaseURL}}/ccm-web/'

    matchers-condition: and
    matchers:
      - type: word
        words:
          - "<title>Wyse Management Suite</title>"

      - type: status
        status:
          - 200
