id: valorant-phish

info:
  name: VALORANT 仿冒钓鱼网站（钓鱼网站识别）
  author: rxerium
  severity: info
  description: |
    检测到疑似仿冒 VALORANT 的钓鱼网站。模板在目标页面返回 200、页面内容命中 VALORANT 的品牌页面特征，且当前主机不属于 playvalorant.com、riotgames.com 官方域名时触发，用于识别借用 VALORANT 品牌页面诱导用户信任的仿冒站点。
  reference:
    - https://playvalorant.com
  metadata:
    max-request: 1
  tags: phishing,valorant,riot-games,osint,discovery
http:
  - method: GET
    path:
      - "{{BaseURL}}"

    host-redirects: true
    max-redirects: 2

    matchers-condition: and
    matchers:
      - type: word
        words:
          - "Riot Games presents VALORANT: a 5v5 character-based tactical FPS where precise gunplay meets unique agent abilities. Learn about VALORANT and its stylish cast"

      - type: status
        status:
          - 200

      - type: dsl
        dsl:
          - '!contains(host,"playvalorant.com")'
          - '!contains(host,"riotgames.com")'
