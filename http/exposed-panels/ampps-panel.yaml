id: ampps-panel

info:
  name: AMPPS 登录面板（暴露面识别）
  author: deFr0ggy
  severity: info
  description: 该模板通过识别 AMPPS 登录入口的页面标题、特征文本或重定向行为，判断目标是否暴露了对应的认证界面。若命中，说明该登录面板对外可访问，可用于暴露面梳理与后续安全评估。
  classification:
    cwe-id: CWE-200
  metadata:
    max-request: 1
  tags: panel,ampps,login,discovery

http:
  - method: GET
    path:
      - "{{BaseURL}}/ampps/index.php?act=login"

    host-redirects: true
    max-redirects: 2

    matchers-condition: and
    matchers:
      - type: word
        part: body
        words:
          - '<a href="http://www.ampps.com">'
          - '<title>Login</title>'
          - 'themes/default/images/ampps/favicon.ico'
        condition: and

      - type: status
        status:
          - 200

    extractors:
      - type: regex
        part: body
        group: 1
        regex:
          - 'mpps\.com">Powered By FREE ([A-Z 0-9.]+)<\/a>'
