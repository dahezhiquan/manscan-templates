id: dell-laser-printer-unauth

info:
  name: Dell 激光打印机未授权访问（IOT）
  author: pussycat0x
  severity: high
  description: |
    检测到 Dell 激光打印机 Web 接口可在未认证状态下访问。攻击者可能读取设备状态、打印配置或尝试进一步操作打印服务。
  impact: |
    - 攻击者无需认证即可访问设备页面或功能，可能读取状态、配置和网络信息。
    - 若接口允许写操作，可能进一步导致设备配置被篡改或服务被滥用。
  remediation: |
    - 启用设备 Web 管理认证并修改默认口令，关闭匿名访问。
    - 升级固件并检查是否存在已知未授权访问漏洞。
    - 将管理页面限制在内网、管理 VLAN 或 VPN 内，并开启访问审计。
  metadata:
    max-request: 1
    shodan-query: title="Laser Printer"
    verified: true
  tags: dell,iot,unauth,misconfig,printer,intrusive,vuln,discovery

flow: http(1) && http(2)

http:
  - method: GET
    path:
      - "{{BaseURL}}"

    matchers:
      - type: dsl
        dsl:
          - "status_code == 200"
          - "contains_all(body, '<TITLE>Dell','Laser Printer</TITLE>')"
        condition: and

    extractors:
      - type: regex
        part: body
        name: printer_version
        regex:
          - 'Dell([ 0-9A-Za-z]+).*Laser Printer'

  - method: GET
    path:
      - "{{BaseURL}}/cgi-bin/dynamic/config/secure/security.html"

    matchers:
      - type: dsl
        dsl:
          - "status_code == 200"
          - "contains_all(body, 'Security','Security')"
        condition: and
        internal: true
