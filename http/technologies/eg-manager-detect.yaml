id: eg-manager-detect

info:
  name: eG Manager 指纹识别（指纹识别）
  author: pikpikcu
  severity: info
  description: eG Manager 是应用和基础设施监控平台，用于性能指标、服务健康和告警管理。该模板请求 `/final/`，并依据 HTTP 200 状态码、页面标题、正文关键字或品牌资源特征识别目标是否使用或暴露了 eG Manager 相关组件，适用于资产盘点、技术栈识别和后续安全评估；命中结果仅表示指纹特征匹配，不代表已确认存在可利用漏洞。
  metadata:
    max-request: 1
  tags: tech,eg,discovery

http:
  - method: GET
    path:
      - "{{BaseURL}}/final/"

    matchers-condition: and
    matchers:
      - type: word
        part: body
        words:
          - "<title> eG Innovations, Inc.</title>"
          - "eG Innovations, Inc. All Rights Reserved"

      - type: status
        status:
          - 200
