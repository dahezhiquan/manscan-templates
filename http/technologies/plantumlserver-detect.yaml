id: plantumlserver-detect

info:
  name: PlantUML Server 指纹识别（指纹识别）
  author: s4e-io
  severity: info
  description: >-
    PlantUML Server 是在线 UML 图生成服务，用于根据文本描述渲染时序图、类图和架构图。该模板通过请求目标服务并检查预设路径或首页响应、DSL
    条件等指纹特征，判断目标是否使用或暴露了 PlantUML Server 相关组件；命中结果仅表示指纹特征匹配，可用于资产盘点、技术栈识别和后续安全评估，不代表已确认存在可利用漏洞。
  reference:
  - https://github.com/plantuml/plantuml-server
  - https://plantuml.com
  metadata:
    verified: true
    max-request: 1
    fofa-query: app="PlantUMLServer"
  tags: tech,uml,plantuml,detect,discovery
http:
  - method: GET
    path:
      - "{{BaseURL}}"

    host-redirects: true
    max-redirects: 2

    matchers:
      - type: dsl
        dsl:
          - 'contains(body, "<title>PlantUMLServer")'
