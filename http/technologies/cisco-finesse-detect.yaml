id: cisco-finesse-detect

info:
  name: Cisco Finesse 指纹识别（指纹识别）
  author: 0x_Akoko
  severity: info
  description: |
    用于识别目标是否部署 Cisco Finesse 并提取相关版本或构建信息，模板会结合特定路径或已知端点和版本或标识提取结果进行指纹匹配。
  metadata:
    verified: true
    max-request: 1
  tags: tech,cisco,finesse,detect,discovery

http:
  - method: GET
    path:
      - "{{BaseURL}}/desktop/assets/js/finesse.js"

    matchers:
      - type: dsl
        dsl:
          - 'status_code == 200'
          - 'contains(body, "Cisco Finesse")'
        condition: and

    extractors:
      - type: regex
        name: version
        group: 1
        regex:
          - '(?i)Version\s+([\d.]+[(]\d+[)])'
