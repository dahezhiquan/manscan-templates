id: unauthenticated-prtg

info:
  name: PRTG Traffic Grapher 未授权 访问
  author: dhiyaneshDK
  severity: high
  description: |
    检测到 PRTG Traffic Grapher 未授权 访问。目标功能在未认证状态下可访问，可能暴露管理入口、业务数据、系统状态或可执行操作，需确认是否存在访问控制缺失。
  reference:
    - https://www.exploit-db.com/ghdb/5808
  metadata:
    max-request: 1
  tags: config,unauth,prtg,edb,misconfig,vuln

http:
  - method: GET
    path:
      - "{{BaseURL}}/sensorlist.htm"

    matchers-condition: and
    matchers:
      - type: word
        words:
          - 'PRTG Traffic Grapher'
        condition: and

      - type: status
        status:
          - 200
