id: gophish-default-login

info:
  name: Gophish < v0.10.1 默认凭据（弱口令）
  author: arcc,dhiyaneshDK
  severity: high
  description: |
    该模板用于检测 Gophish < v0.10.1 是否仍可使用默认凭据或弱口令登录。模板主要向 `/login` 等认证入口发送请求，使用内置默认凭据组合进行认证尝试，并根据响应中的 `!contains(tolower(header), 'location: /login')`、`contains(tolower(header), 'location: /')` 等登录成功特征判断登录是否成功；命中说明目标未及时修改出厂、示例或初始化账号口令。
  impact: |
    - 攻击者可接管 Gophish < v0.10.1 控制台，获取或操纵钓鱼、C2、演练任务或攻击基础设施配置。
    - 此类系统一旦被未授权登录，可能被用于投递恶意活动、泄露测试数据，或反向暴露防守方/演练方基础设施。
  remediation: |
    - 立即修改默认凭据并禁用公开可达的管理入口，只允许可信运维来源访问。
    - 启用强认证、登录告警和完整操作审计，删除无用账号和历史测试凭据。
    - 检查近期任务、令牌、载荷、回连地址和导出数据，确认没有被未授权使用。
  reference:
    - https://docs.getgophish.com/user-guide/getting-started
  classification:
    cvss-metrics: CVSS:3.0/AV:N/AC:L/PR:N/UI:N/S:C/C:L/I:L/A:L
    cvss-score: 8.3
    cwe-id: CWE-522
  metadata:
    max-request: 2
  tags: gophish,default-login,vuln

http:
  - raw:
      - |
        GET /login HTTP/1.1
        Host: {{Hostname}}
      - |
        POST /login HTTP/1.1
        Host: {{Hostname}}
        Content-Type: application/x-www-form-urlencoded

        username={{user}}&password={{pass}}&csrf_token={{replace(url_encode(html_unescape(csrf_token)), "+", "%2B")}}

    attack: pitchfork
    payloads:
      user:
        - admin
      pass:
        - gophish

    extractors:
      - type: regex
        name: csrf_token
        part: body
        internal: true
        group: 1
        regex:
          - 'name="csrf_token" value="(.+?)"'
    matchers:
      - type: dsl
        dsl:
          - "!contains(tolower(header), 'location: /login')"
          - "contains(tolower(header), 'location: /')"
          - "contains(tolower(header), 'gophish')"
          - "status_code==302"
        condition: and
