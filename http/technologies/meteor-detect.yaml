id: meteor-detect

info:
  name: Meteor.js 指纹识别（指纹识别）
  author: Shivam Kamboj
  severity: info
  description: >-
    Meteor.js 是 JavaScript 全栈应用框架，用于快速构建实时 Web 和移动应用。该模板通过请求目标服务并检查预设路径或首页响应、页面正文关键字等指纹特征，判断目标是否使用或暴露了
    Meteor.js 相关组件；命中结果仅表示指纹特征匹配，可用于资产盘点、技术栈识别和后续安全评估，不代表已确认存在可利用漏洞。
  reference:
  - https://www.meteor.com/
  - https://docs.meteor.com/
  metadata:
    verified: true
    max-request: 1
    shodan-query: html:"__meteor_runtime_config__"
  tags: tech,discovery,meteor
http:
  - method: GET
    path:
      - "{{BaseURL}}"

    redirects: true

    matchers:
      - type: word
        part: body
        words:
          - "__meteor_runtime_config__"
          - "__meteor-css__"
        condition: and
