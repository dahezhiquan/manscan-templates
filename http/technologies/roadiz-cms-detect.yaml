id: roadiz-cms-detect

info:
  name: Roadiz CMS 指纹识别（指纹识别）
  author: righettod
  severity: info
  description: >-
    Roadiz CMS 是基于 Symfony 的内容管理系统，用于构建结构化内容网站和多语言站点。该模板通过请求目标服务并检查预设路径或首页响应、DSL 条件、正则特征等指纹特征，判断目标是否使用或暴露了
    Roadiz CMS 相关组件；命中结果仅表示指纹特征匹配，可用于资产盘点、技术栈识别和后续安全评估，不代表已确认存在可利用漏洞。
  reference:
  - https://github.com/roadiz/roadiz
  - https://www.roadiz.io/
  metadata:
    verified: true
    max-request: 1
    vendor: roadiz
    product: roadiz
    shodan-query: http.html:"roadiz"
    fofa-query: body="roadiz"
  tags: tech,cms,roadiz,detect,discovery
http:
  - method: GET
    path:
      - "{{BaseURL}}/"

    matchers:
      - type: dsl
        dsl:
          - 'status_code == 200'
          - 'contains(to_lower(body), "<meta name=\"generator\" content=\"roadiz ")'
        condition: and

    extractors:
      - type: regex
        part: body
        group: 1
        regex:
          - '(?i)roadiz\s*([a-z0-9.\s]+)-'
