id: azure-vm-jit-access-not-enabled
info:
  name: Azure VM JIT 即时 访问未启用（云安全）
  author: princechaddha
  severity: high
  description: Azure Just-in-Time VM access 通过按需、限时开放管理端口减少 SSH 和 RDP 的持续暴露；没有匹配的 JIT 策略时，管理端口可能长期暴露在网络边界。本模板枚举虚拟机并查询 JIT policy 关联的虚拟机 ID，在返回空数组 [] 时报告未发现 JIT 保护关联。
  impact: |
    - 持续开放的 SSH、RDP 或其他管理端口容易被扫描、暴力破解和漏洞利用，凭据泄露后可能导致主机接管。
    - 主机被攻破后，攻击者可利用实例身份、网络连通性和本地凭据横向访问云内资源。
  remediation: |
    - 为需要远程管理的 VM 配置 Defender for Cloud Just-in-Time policy，限制允许端口、来源 IP、最长开放时间和审批主体。
    - 同时通过 NSG、跳板机、Entra 登录和 MFA 限制管理访问，定期审计 JIT 策略和临时开放记录。
  reference:
    - https://docs.microsoft.com/en-us/azure/security-center/security-center-just-in-time
  metadata:
    vendor: microsoft
    product: defender-for-cloud
  tags: cloud,devops,azure,microsoft,security-center,azure-cloud-config

flow: |
  code(1);
  for (let VMData of iterate(template.vmList)) {
    VMData = JSON.parse(VMData);
    set("vmId", VMData.id);
    code(2);
  }

self-contained: true
code:
  - engine:
      - sh
      - bash
    source: |
      az vm list --query '[*].{"id":id}'

    extractors:
      - type: json
        name: vmList
        internal: true
        json:
          - '.[]'

  - engine:
      - sh
      - bash
    source: |
      az security jit-policy list --query '[*].virtualMachines[*].{"id":id} | []'

    matchers-condition: and
    matchers:
      - type: word
        words:
          - '[]'

    extractors:
      - type: dsl
        dsl:
          - 'vmId + " does not have Just-in-Time access enabled."'
