id: gcloud-gke-shielded-nodes-disabled

info:
  name: GKE Cluster 未Using Shielded Nodes（云安全）
  author: princechaddha
  severity: medium
  description: GKE Shielded Nodes 使用 vTPM、Secure Boot 和完整性监控增强节点启动与运行环境保护。本模板检查 shieldedNodes.enabled，未发现 enabled true 时报告集群未启用 Shielded Nodes。
  impact: |
    - 节点启动链和底层运行环境缺少额外完整性保护，增加镜像篡改和低层级持久化风险。
    - 集群无法充分利用 Shielded VM 的完整性告警和安全启动能力。
  remediation: |
    - 为适用的 GKE 节点启用 Shielded Nodes，并结合 Secure Boot 与 Integrity Monitoring。
    - 对不兼容节点池记录例外，优先在新建节点池和实例模板中启用。
  reference:
    - https://www.trendmicro.com/cloudoneconformity/knowledge-base/gcp/GKE/use-shielded-cluster-nodes.html
    - https://cloud.google.com/kubernetes-engine/docs/how-to/shielded-gke-nodes
  metadata:
    vendor: google
    product: google-kubernetes-engine
  tags: cloud,devops,gcp,gcloud,gke,kubernetes,security,shielded-nodes,gcp-cloud-config

flow: |
  code(1)
  for(let projectId of iterate(template.projectIds)){
    set("projectId", projectId)
    code(2)
    for(let cluster of iterate(template.clusters)){
      cluster = JSON.parse(cluster)
      set("clusterName", cluster.name)
      set("location", cluster.location)
      code(3)
    }
  }

self-contained: true

code:
  - engine:
      - sh
      - bash
    source: |
      gcloud projects list --format="json(projectId)"

    extractors:
      - type: json
        name: projectIds
        internal: true
        json:
          - '.[].projectId'

  - engine:
      - sh
      - bash
    source: |
      gcloud container clusters list --project $projectId --format="json(name,location)"

    extractors:
      - type: json
        name: clusters
        internal: true
        json:
          - '.[]'

  - engine:
      - sh
      - bash
    source: |
      gcloud container clusters describe $clusterName --location $location --project $projectId --format="json(shieldedNodes.enabled)"

    matchers-condition: and
    matchers:
      - type: word
        words:
          - "shieldedNodes"

      - type: word
        words:
          - '"enabled": true'
        negative: true

    extractors:
      - type: dsl
        dsl:
          - '"GKE cluster " + clusterName + " in " + location + " of project " + projectId + " does not have Shielded Nodes enabled"'
