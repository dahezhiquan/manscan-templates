id: open-webui-panel

info:
  name: Openweb UI 面板识别（指纹识别）
  author: rxerium,righettod
  severity: info
  description: |-
    检测到目标站点存在 Openweb UI 相关响应特征。Openweb UI 是 AI、机器学习或 Notebook 相关平台，用于管理模型、数据集、工作区、实验、推理服务或训练任务。模板请求 `/`、`/api/config`、`/auth` 等路径，并通过页面标题或正文关键字、状态码、DSL 条件确认该系统指纹，用于资产识别、系统盘点和暴露面梳理。
  reference:
    - https://openwebui.com/
  metadata:
    verified: true
    max-request: 1
    shodan-query: http.favicon.hash:-286484075 http.title:"Open WebUI"
  tags: panel,open-webui,login,detect,discovery
http:
  - method: GET
    path:
      - "{{BaseURL}}"
      - "{{BaseURL}}/api/config"
      - "{{BaseURL}}/auth"
      - "{{BaseURL}}/opensearch.xml"

    host-redirects: true
    max-redirects: 2

    stop-at-first-match: true
    matchers:
      - type: dsl
        dsl:
          - 'status_code == 200'
          - 'contains_any(to_lower(body), "<title>open webui</title>", "\"name\":\"open webui\"", "<shortname>open webui</shortname>")'
        condition: and

    extractors:
      - type: regex
        part: body
        group: 1
        regex:
          - '"version"\s*:\s*"([0-9\.]+)"'
