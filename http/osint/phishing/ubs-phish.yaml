id: ubs-phish

info:
  name: UBS 仿冒钓鱼网站（钓鱼网站识别）
  author: rxerium
  severity: info
  description: |
    检测到疑似仿冒 UBS 的钓鱼网站。模板在目标页面返回 200、页面内容命中 UBS 的品牌页面特征，且当前主机不属于 ubs.com 官方域名时触发，用于识别借用 UBS 品牌页面诱导用户信任的仿冒站点。
  reference:
    - https://ubs.com
  metadata:
    max-request: 1
  tags: phishing,ubs,bank,osint,discovery
http:
  - method: GET
    path:
      - "{{BaseURL}}"

    host-redirects: true
    max-redirects: 2

    matchers-condition: and
    matchers:
      - type: word
        words:
          - "UBS is a global firm providing financial services in over 50 countries. Visit our site to find out what we offer."

      - type: status
        status:
          - 200

      - type: dsl
        dsl:
          - '!contains(host,"ubs.com")'
