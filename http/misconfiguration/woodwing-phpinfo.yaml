id: woodwing-phpinfo

info:
  name: WoodWing Studio Server phpinfo 页面暴露
  author: pdteam
  severity: medium
  description: |-
    该模板用于核查 WoodWing Studio Server phpinfo 页面暴露。调试模式、错误页面或诊断组件在生产环境暴露时，会返回堆栈、路径、配置项、请求上下文或运行参数。模板访问 /StudioServer/server/wwtest/phpinfo.php、/server/wwtest/phpinfo.php，并根据调试标识、异常类名、phpinfo/Xdebug 配置或错误关键字确认暴露。
  reference:
    - https://twitter.com/ynsmroztas/status/1680961398011047936
  metadata:
    max-request: 2
    shodan-query: http.title:"WoodWing Studio Server"
    fofa-query: title=="WoodWing Studio Server"
  tags: misconfig,woodwing,phpinfo,vuln
  impact: |-
    - 攻击者可获取应用路径、框架版本、环境变量、内部调用栈、请求参数和依赖信息。
    - 这些信息可帮助定位组件缺陷、构造后续漏洞利用或绕过安全控制。
  remediation: |-
    - 关闭生产环境调试模式、错误详情展示、Profiler 和 phpinfo 页面。
    - 将错误写入受保护日志，统一返回通用错误页面。
    - 限制诊断入口访问来源，升级框架并复核生产配置。
http:
  - method: GET
    path:
      - "{{BaseURL}}/StudioServer/server/wwtest/phpinfo.php"
      - "{{BaseURL}}/server/wwtest/phpinfo.php"

    stop-at-first-match: true
    redirects: true
    max-redirects: 2
    matchers:
      - type: dsl
        dsl:
          - contains(tolower(body), 'woodwing')
          - contains(tolower(body), 'php extension')
          - contains(tolower(body), 'php version')
          - status_code == 200
        condition: and
