id: api-api2convert

info:
  name: Api2Convert API Token 可用性校验（token喷洒）
  author: daffainfo
  severity: info
  description: 该模板通过调用 Api2Convert API 的已知接口验证提供的 token 是否有效，命中后通常表示可访问文档转换或 PDF 处理能力。
  reference:
    - https://www.api2convert.com/docs/index.html
    - https://github.com/daffainfo/all-about-apikey/tree/main/api2convert
  metadata:
    max-request: 1
  tags: token-spray,api2convert

self-contained: true

http:
  - raw:
      - |
        POST https://api.api2convert.com/v2/jobs HTTP/1.1
        Host: api.api2convert.com
        X-Oc-Api-Key: {{token}}
        Content-Type: application/json

        {
            "input": [{
                "type": "remote",
                "source": "https://example-files.online-convert.com/raster%20image/jpg/example_small.jpg"
            }],
            "conversion": [{
                "target": "png"
            }]
        }

    matchers:
      - type: word
        part: body
        words:
          - '"id"'
          - '"token"'
          - '"type"'
        condition: and
