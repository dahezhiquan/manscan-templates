id: azure-aks-use-private-kv
info:
  name: Azure AKS 静态加密未使用私有 Key Vault（云安全）
  author: princechaddha
  severity: high
  description: AKS 使用 Azure Key Vault 管理静态加密密钥时，Key Vault 网络访问仍为 Public 会使密钥管理请求经过公共终结点，削弱网络隔离和访问路径控制。该模板查询 securityProfile.azureKeyVaultKms.keyVaultNetworkAccess，并在返回 Public 时报告未使用私有 Key Vault 网络访问。
  impact: |
    - 公共终结点扩大了 Key Vault 的可达范围，增加凭据泄露、网络误配置和异常密钥操作难以及时阻断的风险。
    - AKS 控制平面或工作负载访问密钥时缺少私有网络边界，可能导致静态数据保护不符合内部隔离和合规要求。
  remediation: |
    - 为 Key Vault 创建 Private Endpoint，将 AKS 使用的 Key Vault KMS 网络访问配置为 Private，并设置正确的私有 DNS 解析。
    - 为 AKS 托管身份授予访问密钥所需的最小权限，验证密钥轮换、集群加密和故障恢复流程后再关闭公共访问。
  reference:
    - https://docs.microsoft.com/en-us/azure/aks/developer-best-practices-resource-management
  metadata:
    vendor: microsoft
    product: azure-kubernetes-service
  tags: cloud,devops,azure,microsoft,aks,azure-cloud-config

flow: |
  code(1);
  for (let ClusterData of iterate(template.clusterList)) {
    ClusterData = JSON.parse(ClusterData);
    set("name", ClusterData.name);
    set("resourceGroup", ClusterData.resourceGroup);
    code(2);
  }

self-contained: true
code:
  - engine:
      - sh
      - bash
    source: |
      az aks list --output json --query '[*].{name:name, resourceGroup:resourceGroup}'

    extractors:
      - type: json
        name: clusterList
        internal: true
        json:
          - '.[]'

  - engine:
      - sh
      - bash
    source: |
      az aks show --name "$name" --resource-group "$resourceGroup" --query 'securityProfile.azureKeyVaultKms.keyVaultNetworkAccess'

    matchers:
      - type: word
        words:
          - "Public"

    extractors:
      - type: dsl
        dsl:
          - 'name + " in " + resourceGroup + " does not use a private Key Vault for encryption at rest"'
