id: idemia-biometrics-default-login

info:
  name: IDEMIA BIOMetrics 默认口令登录（弱口令）
  author: Techryptic (@Tech)
  severity: medium
  description: |
    该模板用于检测 IDEMIA BIOMetrics 是否仍可使用默认凭据或弱口令登录。模板主要向 `/cgi-bin/login.cgi` 等认证入口发送请求，使用内置默认凭据组合进行认证尝试，并根据响应中的 `document.cookie ="session_id`、`MA5G_general_configurations.htm` 等登录成功特征判断登录是否成功；命中说明目标未及时修改出厂、示例或初始化账号口令。
  impact: |
    - 攻击者可接管 IDEMIA BIOMetrics 的 Web 管理界面，查看设备状态、网络配置、运行日志或敏感业务参数。
    - 被接管的网络、工控、打印、语音、存储或远程管理设备可能被用于中断业务、改变路由/访问策略、窃取流量或作为内网横向移动入口。
  remediation: |
    - 立即修改所有默认账号口令，禁用不再使用的出厂账号，并为管理账户设置高强度唯一密码。
    - 将设备管理入口限制在 VPN、堡垒机或可信管理网段内，避免直接暴露到公网。
    - 升级设备固件或管理组件，审计近期登录记录、配置变更和异常会话。
  reference:
    - https://www.google.com/search?q=idemia+password%3D+"12345"
  classification:
    cvss-metrics: CVSS:3.0/AV:N/AC:L/PR:N/UI:N/S:C/C:L/I:N/A:N
    cvss-score: 5.8
    cwe-id: CWE-522
    cpe: cpe:2.3:h:idemia:sigma_wide:*:*:*:*:*:*:*:*
  metadata:
    verified: true
    max-request: 1
    shodan-query: title:"IDEMIA"
    product: sigma_wide
    vendor: idemia
  tags: idemia,biometrics,default-login,vuln

http:
  - raw:
      - |
        POST /cgi-bin/login.cgi HTTP/1.1
        Host: {{Hostname}}

        password={{password}}

    payloads:
      password:
        - "12345"

    matchers-condition: and
    matchers:
      - type: word
        part: body
        words:
          - 'document.cookie ="session_id'
          - 'MA5G_general_configurations.htm'
        condition: and

      - type: word
        part: body
        words:
          - "Invalid Password"
        negative: true

      - type: status
        status:
          - 200
