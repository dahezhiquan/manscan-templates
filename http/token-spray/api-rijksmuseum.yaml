id: api-rijksmuseum

info:
  name: Rijksmuseum API Token 可用性校验（token喷洒）
  author: daffainfo
  severity: info
  description: 该模板通过调用 Rijksmuseum API 的已知接口验证提供的 token 是否有效，命中后通常表示可访问相关 API 能力。
  reference:
    - https://data.rijksmuseum.nl/user-generated-content/api/
    - https://github.com/daffainfo/all-about-apikey/tree/main/rijksmuseum
  metadata:
    max-request: 1
  tags: token-spray,rijksmuseum

self-contained: true

http:
  - method: GET
    path:
      - "https://www.rijksmuseum.nl/api/nl/usersets?key={{token}}&format=json&page=2"

    matchers:
      - type: word
        part: body
        words:
          - '"count":'
          - '"userSets":'
          - '"user":'
        condition: and
