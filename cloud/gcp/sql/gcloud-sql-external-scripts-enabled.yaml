id: gcloud-sql-external-scripts-enabled

info:
  name: SQL Server 数据库实例启用了外部脚本（云安全）
  author: princechaddha
  severity: high
  description: SQL Server external scripts enabled 允许执行外部脚本运行时，启用后会显著扩大数据库实例的代码执行面。本模板检查 Cloud SQL SQL Server 实例 databaseFlags 中 external scripts enabled 的值，匹配 on 时报告该功能已启用。
  impact: |
    - 高权限数据库用户或被攻破账号可能利用外部脚本能力执行非预期代码或访问额外资源。
    - 外部脚本运行时会增加补丁、依赖、权限和审计复杂度，扩大攻击面。
  remediation: |
    - 关闭 external scripts enabled，除非业务有明确且受控的分析脚本需求。
    - 对必须启用的场景限制数据库权限、脚本来源和执行账号，并配置审计和变更审批。
  reference:
    - https://cloud.google.com/sql/docs/sqlserver/flags
  metadata:
    vendor: google
    product: cloud-sql
  tags: cloud,devops,gcp,gcloud,google-cloud-sql,mssql,gcp-cloud-config

flow: |
  code(1)
  for(let projectId of iterate(template.projectIds)){
    set("projectId", projectId)
    code(2)
    for(let sqlInstance of iterate(template.sqlInstances)){
      set("sqlInstance", sqlInstance)
      code(3)
    }
  }

self-contained: true

code:
  - engine:
      - sh
      - bash
    source: |
      gcloud projects list --format="json(projectId)"

    extractors:
      - type: json
        name: projectIds
        internal: true
        json:
          - '.[].projectId'

  - engine:
      - sh
      - bash
    source: |
      gcloud sql instances list --project $projectId --filter='DATABASE_VERSION:SQLSERVER*' --format="json(name)"

    extractors:
      - type: json
        name: sqlInstances
        internal: true
        json:
          - '.[].name'

  - engine:
      - sh
      - bash
    source: |
      gcloud sql instances describe $sqlInstance --project $projectId --format=json | jq '.settings.databaseFlags[]? | select(.name=="external scripts enabled") | .value'

    matchers:
      - type: word
        words:
          - 'on'

    extractors:
      - type: dsl
        dsl:
          - '"The external scripts enabled flag is enabled for SQL Server instance " + sqlInstance + " in project " + projectId'
