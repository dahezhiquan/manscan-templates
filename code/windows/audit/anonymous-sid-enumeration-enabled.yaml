id: anonymous-sid-enumeration-enabled

info:
  name: 允许匿名枚举 SID（本地基线扫描）
  author: princechaddha
  severity: medium
  description: |
    该模板检查匿名用户是否可以枚举安全标识符（SID）。暴露 SID 会帮助攻击者映射本地用户、组和权限关系。
  impact: |
    攻击者可利用 SID 信息识别高价值账户并辅助后续口令攻击。
  remediation: |
    通过本地安全策略或注册表禁用匿名 SID 枚举。
  tags: windows,code,windows-audit

self-contained: true

code:
  - pre-condition: |
      IsWindows();
    engine:
      - powershell
      - powershell.exe
    args:
      - -ExecutionPolicy
      - Bypass
    pattern: "*.ps1"
    source: |
      Get-ItemProperty -Path 'HKLM:\SYSTEM\CurrentControlSet\Control\Lsa' -Name 'EveryoneIncludesAnonymous'

    matchers:
      - type: word
        words:
          - "everyoneincludesanonymous : 1"
