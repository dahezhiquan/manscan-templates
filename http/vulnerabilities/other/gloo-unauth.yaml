id: gloo-unauth

info:
  name: 未授权访问漏洞
  author: dhiyaneshDk
  severity: high
  description: 未授权 Gloo UI 存在未授权访问漏洞。该模板依据实际请求路径、返回特征与命中证据验证目标是否暴露相应漏洞。
  metadata:
    max-request: 1
  tags: unauth,gloo,vuln

http:
  - method: GET
    path:
      - '{{BaseURL}}/fed.rpc.solo.io.GlooInstanceApi/ListClusterDetails'

    headers:
      Content-type: "application/grpc-web+proto"
      Referer: "{{BaseURL}}/admin/"

    matchers-condition: and
    matchers:
      - type: word
        words:
          - "gke-remote"
        part: body

      - type: word
        words:
          - "application/grpc-web+proto"
        part: header

      - type: status
        status:
          - 200
