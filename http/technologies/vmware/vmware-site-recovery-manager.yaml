id: vmware-site-recovery-manager

info:
  name: VMware Site Recovery Manager 指纹识别（指纹识别）
  author: dhiyaneshDk
  severity: info
  description: >-
    VMware Site Recovery Manager 是灾难恢复编排平台，用于自动化虚拟化环境的故障切换和恢复流程。该模板通过请求目标服务并检查预设路径或首页响应、页面正文关键字、状态码等指纹特征，判断目标是否使用或暴露了
    VMware Site Recovery Manager 相关组件；命中结果仅表示指纹特征匹配，可用于资产盘点、技术栈识别和后续安全评估，不代表已确认存在可利用漏洞。
  classification:
    cvss-metrics: CVSS:3.0/AV:N/AC:L/PR:N/UI:N/S:U/C:N/I:N/A:N
    cvss-score: 0
    cwe-id: CWE-200
  metadata:
    max-request: 1
    shodan-query: http.title:"Welcome to VMware Site Recovery Manager"
  tags: panel,vmware,tech,discovery
http:
  - method: GET
    path:
      - "{{BaseURL}}/configure/app/landing/welcome-srm-va.html"

    matchers-condition: and
    matchers:
      - type: word
        part: body
        words:
          - "<title>Welcome to VMware Site Recovery Manager</title>"

      - type: status
        status:
          - 200
