id: graylog-default-login

info:
  name: Graylog 默认口令登录（弱口令）
  author: 0x_Akoko,0xBassia
  severity: high
  description: |
    该模板通过向 Graylog 会话接口尝试默认管理员账号口令，并依据返回的有效会话信息判断目标是否仍在使用未修改的弱口令。若命中，攻击者可直接获得日志平台的完整后台访问权限。
  impact: |
    - 攻击者可读取 Graylog 中已采集的全部日志，其中可能包含账号口令、API Key、内部 IP 及业务敏感信息。
    - 攻击者可新建输入源以截获后续日志流量，或修改流水线规则以重定向、篡改或压制日志。
  remediation: |
    - 修改 Graylog `server.conf` 配置文件中的 `root_password_sha2`。
    - 为管理员账户设置强且唯一的密码，并避免复用其他系统口令。
  reference:
    - https://go2docs.graylog.org/current/setting_up_graylog/rest_api.html
    - https://docs.graylog.org/docs/server-conf
    - https://docs.graylog.org/docs/authentication
    - https://archivedocs.graylog.org/en/2.5/pages/installation/virtual_machine_appliances.html
  classification:
    cvss-metrics: CVSS:3.1/AV:N/AC:L/PR:N/UI:N/S:U/C:H/I:H/A:N
    cvss-score: 9.1
    cwe-id: CWE-798
  metadata:
    verified: true
    max-request: 2
    vendor: graylog
    product: graylog
    shodan-query: 'title:"Graylog Web Interface"'
    fofa-query: 'app="Graylog" || title="Graylog Web Interface"'
  tags: default-login,graylog,logging

variables:
  username: "admin"
  password: "admin"

flow: http(1) && http(2)

http:
  - raw:
      - |
        GET /api/ HTTP/1.1
        Host: {{Hostname}}
        Accept: application/json

    matchers:
      - type: dsl
        internal: true
        dsl:
          - 'status_code == 200'
          - 'contains(content_type, "application/json")'
          - 'contains_all(body, "\"cluster_id\"", "\"node_id\"", "\"version\"")'
        condition: and

  - raw:
      - |
        POST /api/system/sessions HTTP/1.1
        Host: {{Hostname}}
        Content-Type: application/json
        Accept: application/json
        X-Requested-By: nuclei

        {"username":"{{username}}","password":"{{password}}","host":""}

    matchers:
      - type: dsl
        dsl:
          - 'status_code == 200'
          - 'contains(content_type, "application/json")'
          - 'contains_all(body, "\"session_id\"", "\"valid_until\"")'
        condition: and

    extractors:
      - type: regex
        name: session_id
        part: body
        regex:
          - '"session_id"\s*:\s*"([^"]+)"'
