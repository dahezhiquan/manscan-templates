id: fastly-backend-info-disclosure

info:
  name: Fastly Backend 服务器 信息泄露
  author: 0x_Akoko
  severity: low
  description: |
    该模板用于核查 Fastly Backend 服务器 信息泄露。该类问题通常源于配置文件、备份文件、管理页面、服务状态或敏感资源被错误暴露到 Web 访问路径。模板会向目标发送探测请求，并依据请求 ``、匹配 `contains_all(tolower(header), "x-served-by", "x-cache-hits", "fastly")`、匹配 `contains(tolower(header), "x-backend-server")`、匹配 `!regex("(?i)x-backend-server:\\s*(nginx|apache|httpd|iis|tomcat)\\s*$", header)`等证据确认目标是否存在该配置问题。
  impact: |
    - 攻击者可获取版本、路径、账号、密钥、令牌、配置或业务数据等敏感信息。
    - 泄露的信息可能被用于凭据攻击、漏洞匹配、权限提升或横向移动。
  remediation: |
    - 移除 Web 根目录下不应公开的配置、备份、日志和临时文件。
    - 为敏感页面和资源增加访问控制，并按最小暴露原则收敛公开路径。
    - 轮换已暴露的密钥、令牌和凭据，并审计异常下载或枚举行为。
  reference:
    - https://developer.fastly.com/reference/http/http-headers/
  classification:
    cvss-metrics: CVSS:3.1/AV:N/AC:L/PR:N/UI:N/S:U/C:L/I:N/A:N
    cvss-score: 5.3
    cwe-id: CWE-200
  metadata:
    max-request: 1
    shodan-query: "X-backend-server"
    verified: true
  tags: exposure,fastly,cdn,misconfig

http:
  - method: GET
    path:
      - "{{BaseURL}}"

    host-redirects: true
    max-redirects: 2

    matchers:
      - type: dsl
        dsl:
          - 'contains_all(tolower(header), "x-served-by", "x-cache-hits", "fastly")'
          - 'contains(tolower(header), "x-backend-server")'
          - '!regex("(?i)x-backend-server:\\s*(nginx|apache|httpd|iis|tomcat)\\s*$", header)'
        condition: and

    extractors:
      - type: kval
        kval:
          - x_backend_server
