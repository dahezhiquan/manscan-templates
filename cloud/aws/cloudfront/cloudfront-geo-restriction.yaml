id: cloudfront-geo-restriction

info:
  name: CloudFront 地域限制未启用（云安全）
  author: DhiyaneshDK
  severity: low
  description: CloudFront 地域限制未启用是一类内容访问范围控制不足风险，适用于内容受版权、合规、出口管制或业务区域约束的场景。缺少地理位置限制时，分发内容可能被非预期地区访问并扩大滥用流量面。模板读取 `DistributionConfig.Restrictions.GeoRestriction.RestrictionType`，当值为 `none` 时判定未使用允许列表或拒绝列表。
  impact: |
    - 受版权、合规或业务策略约束的内容可能被非授权地区访问。
    - 面向特定地区的业务入口暴露范围扩大，可能增加滥用流量和合规处置成本。
  remediation: |
    - 根据业务要求为 CloudFront 分配配置地理位置允许列表或拒绝列表。
    - 对需要更精细访问控制的场景，结合 AWS WAF、自定义鉴权或应用层授权策略。
  reference:
    - https://www.trendmicro.com/cloudoneconformity-staging/knowledge-base/aws/CloudFront/geo-restriction.html
    - https://docs.aws.amazon.com/AmazonCloudFront/latest/DeveloperGuide/georestrictions.html
  metadata:
    vendor: amazon
    product: cloudfront
  tags: cloud,devops,aws,amazon,cloudfront,aws-cloud-config

variables:
  region: "us-west-2"

flow: |
  code(1)
  for(let DistributionListItemsId of iterate(template.distributions)){
    set("distribution", DistributionListItemsId)
    code(2)
  }

self-contained: true

code:
  - engine:
      - sh
      - bash

    source: |
      aws cloudfront list-distributions --output table --query 'DistributionList.Items[*].Id' --region $region --output json

    extractors:
      - type: json
        name: distributions
        internal: true
        json:
          - '.[]'

  - engine:
      - sh
      - bash

    source: |
        aws cloudfront get-distribution-config --id $distribution --query "DistributionConfig.Restrictions.GeoRestriction.RestrictionType" --region $region --output text

    matchers:
      - type: word
        words:
          - "none"

    extractors:
      - type: dsl
        dsl:
          - '"CloudFront Compress Objects Automatically " + distribution + " is Disabled"'
