id: ec2-public-ip
info:
  name: EC2 实例绑定公网 IP（云安全）
  author: princechaddha
  severity: medium
  description: EC2 实例绑定公网 IP 是一类公网暴露面扩大风险，实例网络接口可直接从互联网寻址。即使安全组限制了端口，公网地址仍会增加扫描、误配置暴露和后续攻击面。模板枚举 EC2 实例 ID 后读取网络接口公网地址关联信息，当 `IpOwnerId` 包含 `amazon` 时判定实例存在 AWS 分配的公网 IP。
  impact: |
    - 实例更容易被互联网扫描和指纹识别，安全组误配置时会快速暴露服务。
    - 管理服务、调试端口或业务端口若同时开放，可能导致未授权访问或横向入口被建立。
  remediation: |
    - 对不需要公网访问的实例移除公网 IP，并放置在私有子网中。
    - 通过负载均衡、堡垒机、SSM Session Manager 或 VPN 提供受控访问路径。
  reference:
    - https://docs.aws.amazon.com/AWSEC2/latest/UserGuide/using-instance-addressing.html#concepts-public-addresses
  metadata:
    max-request: 2
    vendor: amazon
    product: ec2
  tags: cloud,devops,aws,amazon,ec2,aws-cloud-config
variables:
  region: "us-east-1"

flow: |
  code(1)
  for(let InstancesName of iterate(template.instances)){
    set("ec2instance", InstancesName)
    code(2)
  }

self-contained: true
code:
  - engine:
      - sh
      - bash
    source: |
      aws ec2 describe-instances --region $region --output json --query 'Reservations[*].Instances[*].InstanceId'

    extractors:
      - type: json
        name: instances
        internal: true
        json:
          - '.[].[]'

  - engine:
      - sh
      - bash
    source: |
         aws ec2 describe-instances --region $region --instance-ids $ec2instance --query "Reservations[*].Instances[*].NetworkInterfaces[*].Association.IpOwnerId[] | []"

    matchers:
      - type: word
        words:
          - "amazon"

    extractors:
      - type: dsl
        dsl:
          - '"The Amazon Instance " + ec2instance + " uses public IP addresses"'
