id: solar-log-authbypass

info:
  name: Solar-Log 500 2.8.2 - Incorrect Access Control
  author: geeknik
  severity: high
  description: Solar-Log 500 2.8.2 - Incorrect Access Control 存在安全漏洞。该模板依据实际请求路径、返回特征与命中证据验证目标是否暴露相应漏洞。
  reference:
    - https://www.exploit-db.com/exploits/49986
  classification:
    cwe-id: CWE-284
  metadata:
    max-request: 1
  tags: solarlog,auth-bypass,edb,vuln

http:
  - method: GET
    path:
      - "{{BaseURL}}/lan.html"

    matchers-condition: and
    matchers:
      - type: status
        status:
          - 200

      - type: word
        part: header
        words:
          - "IPC@CHIP"

      - type: word
        part: body
        words:
          - " Solare Datensysteme GmbH"
          - "mailto:info@solar-log.com"
        condition: and
