id: microchip-syncserver-panel

info:
  name: Symmetricom SyncServer 面板识别（指纹识别）
  author: DhiyaneshDk
  severity: info
  description: |-
    检测到目标站点存在 Symmetricom SyncServer 相关响应特征。Symmetricom SyncServer 是 AI、机器学习或 Notebook 相关平台，用于管理模型、数据集、工作区、实验、推理服务或训练任务。模板请求 `/login.php`，并通过页面标题或正文关键字、状态码确认该系统指纹，用于资产识别、系统盘点和暴露面梳理。
  classification:
    cpe: cpe:2.3:o:microchip:syncserver_s650_firmware:*:*:*:*:*:*:*:*
  metadata:
    verified: true
    max-request: 1
    vendor: microchip
    product: syncserver_s650_firmware
    shodan-query:
      - html:"Symmetricom SyncServer"
      - http.html:"symmetricom syncserver"
    fofa-query: body="symmetricom syncserver"
  tags: panel,login,syncserver,symmetricom,detect,microchip,discovery
http:
  - method: GET
    path:
      - "{{BaseURL}}/login.php"

    matchers-condition: and
    matchers:
      - type: word
        part: body
        words:
          - 'Symmetricom SyncServer'
          - 'login'
        condition: and

      - type: status
        status:
          - 200

    extractors:
      - type: regex
        part: body
        group: 1
        regex:
          - "Symmetricom SyncServer ([A-Z0-9]+)"
