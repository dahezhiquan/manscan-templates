id: mythic-c2

info:
  name: Mythic C2 识别（暴露面识别）
  author: pussycat0x
  severity: info
  description: |
    该模板通过识别 Mythic C2 相关页面或响应特征，判断目标是否暴露了疑似 C2、窃密或钓鱼基础设施面板。若命中，可作为外部暴露面排查、威胁狩猎与恶意基础设施识别的线索。
  reference:
    - https://www.socinvestigation.com/shodan-filters-to-hunt-adversaries-infrastructure-and-c2/
  metadata:
    verified: true
    max-request: 1
    shodan-query: ssl:Mythic port:7443
  tags: c2,ir,osint,mythic,panel,vuln

http:
  - method: GET
    path:
      - '{{BaseURL}}/new/login'

    matchers-condition: and
    matchers:
      - type: word
        part: body
        words:
          - '<title>Mythic</title><'

      - type: status
        status:
          - 200
