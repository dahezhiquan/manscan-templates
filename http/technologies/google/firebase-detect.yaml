id: firebase-detect

info:
  name: Firebase 指纹识别（指纹识别）
  author: organiccrap
  severity: info
  description: >-
    Firebase 是 Google 的应用开发平台，提供托管、数据库、认证、云函数和消息推送等能力。该模板通过请求目标服务并检查预设路径或首页响应、页面正文关键字等指纹特征，判断目标是否使用或暴露了
    Firebase 相关组件；命中结果仅表示指纹特征匹配，可用于资产盘点、技术栈识别和后续安全评估，不代表已确认存在可利用漏洞。
  reference:
  - http://ghostlulz.com/google-exposed-firebase-database/
  metadata:
    max-request: 1
  tags: tech,firebase,discovery
http:
  - method: GET
    path:
      - "{{BaseURL}}/.settings/rules.json?auth=FIREBASE_SECRET"

    matchers:
      - type: word
        words:
          - "Could not parse auth token"
        part: body
