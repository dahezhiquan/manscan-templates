id: barracuda-message-panel

info:
  name: Barracuda Message Archiver 面板识别（暴露面识别）
  author: inokii
  severity: info
  description: |
    该模板通过识别 Barracuda Message Archiver 面板、控制台或管理界面的页面特征，判断目标是否暴露了对应服务入口。若命中，说明该后台或运维界面对外可访问，可用于资产识别与暴露面排查。
  reference:
    - https://www.barracuda.com/products/email-protection/message-archiver
  metadata:
    max-request: 1
    shodan-query: http.favicon.hash:1436966696 http.html:"/css/archiver.css"
  tags: barracuda,panel,login,discovery

http:
  - method: GET
    path:
      - "{{BaseURL}}/cgi-mod/index.cgi"

    matchers-condition: and
    matchers:
      - type: word
        part: body
        words:
          - '<link href="/css/archiver.css'
          - '<div id="barracuda_info" style="float:right">'
        condition: and

      - type: status
        status:
          - 200
