id: monitoring-ml-evidently-ai-panel

info:
  name: Evidently AI 面板识别（指纹识别）
  author: rxerium
  severity: info
  description: |-
    检测到目标站点存在 Evidently AI 相关响应特征。Evidently AI 是 AI、机器学习或 Notebook 相关平台，用于管理模型、数据集、工作区、实验、推理服务或训练任务。模板请求 `/`，并通过状态码、正则特征确认该系统指纹，用于资产识别、系统盘点和暴露面梳理。
  reference:
    - https://github.com/evidentlyai/evidently
    - https://www.evidentlyai.com
  metadata:
    verified: true
    max-request: 1
    vendor: evidently-ai
    product: evidently
    shodan-query: 'http.title:"Evidently"'
  tags: panel,evidently,ai,ml,monitoring,observability,detect,discovery
http:
  - method: GET
    path:
      - "{{BaseURL}}"

    host-redirects: true
    max-redirects: 2

    matchers-condition: and
    matchers:
      - type: regex
        part: body
        regex:
          - '(?i)<title>[^<]*Evidently[^<]*</title>'

      - type: status
        status:
          - 200
