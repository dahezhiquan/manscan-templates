id: anteon-dashboard-unauth

info:
  name: Anteon 仪表盘 未授权
  author: DhiyaneshDk
  severity: medium
  description: |
    检测到 Anteon 仪表盘 未授权。目标功能在未认证状态下可访问，可能暴露管理入口、业务数据、系统状态或可执行操作，需确认是否存在访问控制缺失。
  impact: |
    - 未授权用户可能访问管理功能、业务数据或系统状态。
    - 暴露接口可能被用于进一步枚举、修改配置或执行敏感操作。
  metadata:
    verified: true
    max-request: 1
    fofa-query: title="Anteon:"
  tags: anteon,misconfig,dashboard,unauth,vuln

http:
  - method: GET
    path:
      - "{{BaseURL}}/dashboard"

    matchers:
      - type: dsl
        dsl:
          - "contains_all(body, 'Anteon','Monitoring Solution')"
          - "status_code == 200"
        condition: and
