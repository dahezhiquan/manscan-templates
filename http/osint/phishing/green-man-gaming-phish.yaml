id: green-man-gaming-phish

info:
  name: Green Man Gaming 仿冒钓鱼网站（钓鱼网站识别）
  author: rxerium
  severity: info
  description: |
    检测到疑似仿冒 Green Man Gaming 的钓鱼网站。模板在目标页面返回 200、页面内容命中 Green Man Gaming 的品牌页面特征，且当前主机不属于 greenmangaming.com 官方域名时触发，用于识别借用 Green Man Gaming 品牌页面诱导用户信任的仿冒站点。
  reference:
    - https://greenmangaming.com
  metadata:
    max-request: 1
  tags: phishing,green-man-gaming,osint,discovery
http:
  - method: GET
    path:
      - "{{BaseURL}}"

    host-redirects: true
    max-redirects: 2

    matchers-condition: and
    matchers:
      - type: word
        words:
          - "Buy games & game keys with Green Man Gaming - get the best prices, awesome bundles & exclusive game deals daily! Visit to explore Green Man Gaming now!"

      - type: status
        status:
          - 200

      - type: dsl
        dsl:
          - '!contains(host,"greenmangaming.com")'
