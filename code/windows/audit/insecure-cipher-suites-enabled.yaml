id: insecure-cipher-suites-enabled

info:
  name: 不安全加密套件已启用（本地基线扫描）
  author: princechaddha
  severity: high
  description: |
    该模板检查系统是否启用了弱加密套件。弱套件可能使用过时算法或密钥交换方式。
  impact: |
    攻击者可利用弱加密套件降低通信安全性，增加解密、篡改或中间人攻击风险。
  remediation: |
    禁用 RC4、3DES、EXPORT 等弱套件，优先启用现代 TLS 加密套件。
  tags: windows,cipher,security,code,windows-audit

self-contained: true

code:
  - pre-condition: |
      IsWindows();
    engine:
      - powershell
      - powershell.exe
    args:
      - -ExecutionPolicy
      - Bypass
    pattern: "*.ps1"
    source: |
      Get-TlsCipherSuite | Where-Object { $_.CipherSuite -match "RC4|DES" }

    matchers:
      - type: word
        words:
          - "RC4"
          - "DES"
