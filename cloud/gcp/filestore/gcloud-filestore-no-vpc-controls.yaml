id: gcloud-filestore-no-vpc-controls

info:
  name: Filestore Instance 未Protected by VPC Service Controls（云安全）
  author: princechaddha
  severity: medium
  description: VPC Service Controls 可为 Filestore API 访问建立服务边界，降低数据从受控环境外泄的风险。本模板枚举 Access Context Manager perimeter，并检查 restrictedServices 是否包含 file.googleapis.com，未包含时报告 Filestore 未受 VPC Service Controls 保护。
  impact: |
    - Filestore 管理 API 缺少服务边界约束，受保护项目与外部环境之间的数据访问控制更弱。
    - 对敏感数据环境，缺少 VPC Service Controls 会增加凭据滥用和跨边界访问风险。
  remediation: |
    - 将 file.googleapis.com 纳入合适的 VPC Service Controls perimeter，并验证访问级别和桥接配置。
    - 对不适用服务边界的项目记录例外，并使用 IAM、网络和审计日志补偿控制。
  reference:
    - https://www.trendmicro.com/cloudoneconformity/knowledge-base/gcp/Filestore/use-vpc-service-controls.html
    - https://cloud.google.com/vpc-service-controls/docs/supported-products
  metadata:
    vendor: google
    product: filestore
  tags: cloud,devops,gcp,gcloud,filestore,security,networking,vpc,gcp-cloud-config

flow: |
  code(1)
  for(let projectId of iterate(template.projectIds)){
    set("projectId", projectId)
    code(2)
    for(let perimeter of iterate(template.perimeters)){
      set("perimeterName", perimeter.name)
      code(3)
    }
  }

self-contained: true

code:
  - engine:
      - sh
      - bash
    source: |
      gcloud projects list --format="json(projectId)"

    extractors:
      - type: json
        name: projectIds
        internal: true
        json:
          - '.[].projectId'

  - engine:
      - sh
      - bash
    source: |
      gcloud access-context-manager perimeters list --project $projectId --format="json"

    extractors:
      - type: json
        name: perimeters
        internal: true
        json:
          - '.[]'

  - engine:
      - sh
      - bash
    source: |
      gcloud access-context-manager perimeters describe $perimeterName --format="json(status.restrictedServices)"

    matchers-condition: and
    matchers:
      - type: word
        words:
          - "file.googleapis.com"
        negative: true

      - type: word
        words:
          - "restrictedServices"

    extractors:
      - type: dsl
        dsl:
          - '"Project " + projectId + " does not have VPC Service Controls configured to protect Filestore instances"'
