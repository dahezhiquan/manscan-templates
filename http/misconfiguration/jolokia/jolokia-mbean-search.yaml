id: jolokia-mbean-search

info:
  name: Jolokia MBean 搜索接口暴露
  author: pussycat0x
  severity: low
  description: |
    该模板用于核查 Jolokia MBean 搜索接口暴露。该类问题通常源于容器、Kubernetes、CI/CD、注册表、服务发现或运维 API 暴露在公网且缺少访问控制。模板会向目标发送探测请求，并依据请求 `/jolokia/search/*:test=test`、`/actuator/jolokia/search/*:test=test`、状态码 200、匹配 `"type":"search"`、匹配 `"value":`等证据确认目标是否存在该配置问题。
  impact: |
    - 攻击者可查看集群对象、容器、任务、节点、配置、构建流水线或运行状态。
    - 若接口允许操作，可能导致容器创建、任务执行、配置泄露、集群接管或远程代码执行。
  remediation: |
    - 禁止将 Kubernetes、容器运行时、CI/CD 和运维 API 直接暴露到公网。
    - 启用 TLS、认证授权、RBAC、来源限制和最小权限访问策略。
    - 审计集群对象、任务、容器和访问日志，清理未知资源并轮换相关令牌。
  reference:
    - https://thinkloveshare.com/hacking/ssrf_to_rce_with_jolokia_and_mbeans/
    - https://github.com/laluka/jolokia-exploitation-toolkit
  metadata:
    max-request: 2
  tags: jolokia,springboot,mbean,tomcat,misconfig,vuln

http:
  - method: GET
    path:
      - "{{BaseURL}}/jolokia/search/*:test=test"
      - "{{BaseURL}}/actuator/jolokia/search/*:test=test"

    stop-at-first-match: true

    matchers-condition: and
    matchers:
      - type: status
        status:
          - 200

      - type: word
        part: body
        words:
          - '"type":"search"'
          - '"value":'
        condition: and
