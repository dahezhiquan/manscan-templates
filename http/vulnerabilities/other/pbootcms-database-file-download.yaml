id: pbootcms-database-file-download

info:
  name: PbootCMS 2.0.7 - SQL 注入漏洞
  author: ritikchaddha
  severity: critical
  description: PbootCMS 2.0.7 - SQL 注入 存在SQL 注入漏洞。攻击者可借助可控参数干预后端 SQL 查询，从而读取敏感数据、绕过鉴权或进一步影响数据库完整性。
  reference:
    - https://xz.aliyun.com/t/7628
    - https://www.cnblogs.com/0daybug/p/12786036.html
  classification:
    cvss-metrics: CVSS:3.0/AV:N/AC:L/PR:N/UI:N/S:C/C:H/I:H/A:H
    cvss-score: 10
    cwe-id: CWE-89
  metadata:
    max-request: 1
  tags: pbootcms,db,exposure,database,sqlite,sqli,vuln

http:
  - method: GET
    path:
      - "{{BaseURL}}/data/pbootcms.db"

    max-size: 20000

    matchers-condition: and
    matchers:
      - type: word
        part: body
        words:
          - "PbootCMS"
          - "SQLite format 3"
        condition: and

      - type: status
        status:
          - 200
