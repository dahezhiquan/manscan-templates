id: gcloud-iam-least-privilege-nat

info:
  name: Least Privilege 访问 的Cloud NAT Management（云安全）
  author: princechaddha
  severity: medium
  description: Cloud NAT 管理权限应限制给确有网络运维职责的身份，Owner、Editor 或 compute.networkAdmin 会带来过宽的网络控制能力。本模板检查项目 IAM policy bindings，发现这些高权限角色时报告 Cloud NAT 管理相关的过度授权。
  impact: |
    - 身份被攻破后，攻击者可能修改 NAT、路由、子网或防火墙相关配置，影响出站访问路径和网络边界。
    - 过宽网络权限会增加误操作和越权变更风险，削弱职责分离。
  remediation: |
    - 移除非必要的 Owner、Editor 和 compute.networkAdmin 授权，改用满足具体任务的最小权限角色。
    - 对网络管理权限使用受控组、审批流程和定期审计，关键操作启用变更记录和告警。
  reference:
    - https://cloud.google.com/iam/docs/understanding-roles
    - https://cloud.google.com/nat/docs/overview
  metadata:
    vendor: google
    product: cloud-nat
  tags: cloud,devops,gcp,gcloud,iam,cloud-nat,gcp-cloud-config

flow: |
  code(1)
  for(let projectId of iterate(template.projectIds)){
    set("projectId", projectId)
    code(2)
  }

self-contained: true

code:
  - engine:
      - sh
      - bash
    source: |
      gcloud projects list --format="json(projectId)"

    extractors:
      - type: json
        name: projectIds
        internal: true
        json:
          - '.[].projectId'

  - engine:
      - sh
      - bash
    source: |
      gcloud projects get-iam-policy $projectId --format="json(bindings)"

    matchers:
      - type: word
        words:
          - '"roles/owner"'
          - '"roles/editor"'
          - '"roles/compute.networkAdmin"'
        condition: or

    extractors:
      - type: dsl
        dsl:
          - '"Overprivileged role found in project: " + projectId'
