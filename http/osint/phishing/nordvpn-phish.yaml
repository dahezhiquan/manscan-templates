id: nordvpn-phish

info:
  name: NordVPN 仿冒钓鱼网站（钓鱼网站识别）
  author: rxerium
  severity: info
  description: |
    检测到疑似仿冒 NordVPN 的钓鱼网站。模板在目标页面返回 200、页面内容命中 NordVPN 的官方服务页面特征，且当前主机不属于 nordvpn.com 官方域名时触发，用于识别借用 NordVPN 品牌页面诱导用户信任的仿冒站点。
  reference:
    - https://nordvpn.com
  metadata:
    max-request: 1
  tags: phishing,nordvpn,vpn,osint,discovery
http:
  - method: GET
    path:
      - "{{BaseURL}}"

    host-redirects: true
    max-redirects: 2

    matchers-condition: and
    matchers:
      - type: word
        words:
          - '<title>The best VPN service online for free, open internet | NordVPN'

      - type: status
        status:
          - 200

      - type: dsl
        dsl:
          - '!contains(host,"nordvpn.com")'
