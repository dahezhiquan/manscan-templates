id: weebly-detect

info:
  name: Weebly 指纹识别（指纹识别）
  author: Chirag Mistry
  severity: info
  description: >-
    Weebly 是托管建站平台，用于创建网站、博客和在线商店。该模板通过请求目标服务并检查预设路径或首页响应、页面正文关键字、状态码、正则特征等指纹特征，判断目标是否使用或暴露了
    Weebly 相关组件；命中结果仅表示指纹特征匹配，可用于资产盘点、技术栈识别和后续安全评估，不代表已确认存在可利用漏洞。
  metadata:
    max-request: 7
    shodan-query: product:"Weebly"
  tags: weebly,detect,tech
http:
  - method: GET
    path:
      - "{{BaseURL}}"
      - "{{BaseURL}}/robots.txt"
      - "{{BaseURL}}/sitemap.xml"
      - "{{BaseURL}}/favicon.ico"
      - "{{BaseURL}}/index.php"
      - "{{BaseURL}}/weebly/"
      - "{{BaseURL}}/site/"

    stop-at-first-match: true
    matchers-condition: and
    matchers:
      - type: word
        part: response
        words:
          - "Powered by Weebly"
          - "weebly.com"
          - "X-Powered-By-Weebly"
        condition: or
        case-insensitive: true

      - type: status
        status:
          - 200
          - 403

    extractors:
      - type: regex
        part: body
        name: version
        regex:
          - 'Weebly ([0-9.]+)'
          - 'Powered by Weebly ([0-9.]+)'

      - type: regex
        part: body
        name: weebly_id
        regex:
          - 'weebly-site-id=([a-z0-9]+)'
          - 'weebly\.com/([^/]+)'
