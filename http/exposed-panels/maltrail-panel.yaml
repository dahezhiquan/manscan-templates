id: maltrail-panel

info:
  name: Maltrail 面板识别（指纹识别）
  author: ritikchaddha
  severity: info
  description: |
    该模板通过识别 Maltrail 面板、控制台或管理界面的页面特征，判断目标是否暴露了对应服务入口。若命中，说明该后台或运维界面对外可访问，可用于资产识别与暴露面排查。
  metadata:
    verified: true
    max-request: 1
    shodan-query: title:"Maltrail"
  tags: panel,maltrail,detect,discovery

http:
  - method: GET
    path:
      - "{{BaseURL}}"

    matchers-condition: and
    matchers:
      - type: word
        part: body
        words:
          - "Maltrail</title>"
          - "/stamparm/maltrail/wiki"
          - "<b>M</b>altrail"
        condition: or

      - type: status
        status:
          - 200

    extractors:
      - type: regex
        part: body
        group: 1
        regex:
          - '<b>M<\/b>altrail \(v<b>([0-9.]+)<\/b>'
