id: ollama-llm-panel

info:
  name: Ollama LLM 面板识别（指纹识别）
  author: pbuff07
  severity: info
  description: |-
    检测到目标站点存在 Ollama LLM 相关响应特征。Ollama 是本地 LLM 模型运行服务，用于拉取、运行和管理大语言模型推理接口。模板请求 `/`，并通过页面标题或正文关键字、状态码确认该系统指纹，用于资产识别、系统盘点和暴露面梳理。
  classification:
    cvss-metrics: CVSS:3.0/AV:N/AC:L/PR:N/UI:N/S:U/C:N/I:N/A:N
    cwe-id: CWE-200
    cpe: cpe:2.3:a:ollama:ollama:*:*:*:*:*:*:*:*
  metadata:
    max-request: 1
    shodan-query: "Ollama is running"
    zoomeye-query: app="Ollama"
    product: ollama
    vendor: ollama
  tags: panel,ollama,llm,detect,discovery,ai
http:
  - method: GET
    path:
      - "{{BaseURL}}"

    matchers-condition: and
    matchers:
      - type: word
        words:
          - "Ollama is running"

      - type: status
        status:
          - 200
