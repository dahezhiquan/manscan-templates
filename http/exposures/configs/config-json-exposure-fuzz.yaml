id: config-json-exposure-fuzz

info:
  name: 暴露 JSON 配置文件泄露（暴露面识别）
  author: geeknik
  severity: critical
  description: |
    检测到目标站点可直接访问 暴露 JSON 配置文件。这类配置或资源文件通常服务于应用部署、依赖管理、调试、运行参数或内部集成。该模板请求 `{{path}}`，并通过 HTTP 状态码、响应正文关键字、文件格式特征、正则匹配或响应头进行确认。此类资源公开后可能泄露部署细节、内部路径、依赖版本、环境变量、访问凭据或调试信息，增加被侦察和后续利用的风险。
  impact: |-
    - 公开配置可能泄露内部路径、组件版本、依赖清单、环境变量名称、服务地址或访问控制线索。
    - 攻击者可利用这些信息缩小目标范围，选择匹配漏洞、弱口令、凭据攻击或目录枚举策略。
    - 若文件中包含真实凭据、令牌或连接串，可能进一步导致数据、代码仓库、云资源或后台系统被未授权访问。
  remediation: |-
    - 确认该资源是否必须公网可访问；如非业务必需，应立即从 Web 根目录、静态资源目录、对象存储或反向代理公开路径中移除。
    - 在 Web 服务器、网关、CDN 或应用路由层增加拒绝规则、身份认证、IP allowlist 或内网访问限制。
    - 检查访问日志、下载记录和缓存记录，评估该资源是否已被外部访问或搜索引擎收录。
    - 若文件中包含凭据、令牌、连接串或私有地址，应执行密钥轮换、权限收敛和受影响系统访问审计。
  classification:
    cvss-metrics: CVSS:3.1/AV:N/AC:L/PR:N/UI:N/S:C/C:H/I:H/A:H
    cvss-score: 10.0
    cwe-id: CWE-552
  metadata:
    max-request: 50
    github-query: filename:config.json
  tags: config,exposure,files,vuln

http:
  - method: GET
    path:
      - "{{BaseURL}}{{path}}"

    payloads:
      path:
        # Root level configs
        - /config.json
        - /configuration.json
        - /settings.json
        - /configs.json
        - /conf.json
        - /app.config.json
        - /application.json
        # Environment specific configs
        - /config.prod.json
        - /config.production.json
        - /config.dev.json
        - /config.development.json
        - /config.staging.json
        - /config.test.json
        - /config.local.json
        # Common config paths
        - /config/config.json
        - /config/default.json
        - /config/prod.json
        - /config/production.json
        - /config/development.json
        - /config/app.json
        # Application specific paths
        - /app/config.json
        - /src/config.json
        - /assets/config.json
        - /assets/config.production.json
        - /assets/configs.json
        - /static/config.json
        - /public/config.json
        - /dist/config.json
        - /js/config.json
        # API configs
        - /api/config.json
        - /api/v1/config.json
        - /api/v2/config.json
        - /apiconfig.json
        # Framework specific
        - /angular/config.json
        - /react/config.json
        - /vue/config.json
        # Credentials & secrets
        - /credentials/config.json
        - /secrets/config.json
        - /secret/config.json
        - /keys/config.json
        - /auth/config.json
        # AWS related
        - /aws/config.json
        - /aws/credentials.json
        - /cloud/config.json
        - /s3/config.json
        # Database configs
        - /db/config.json
        - /database/config.json
        - /mysql/config.json
        - /postgres/config.json
        - /mongodb/config.json

    stop-at-first-match: true

    matchers-condition: and
    matchers:
      - type: word
        part: header
        words:
          - "application/json"
          - "text/json"
          - "text/plain"
        condition: or

      - type: word
        part: header
        words:
          - "text/html"
          - "text/php"
        condition: or
        negative: true

      - type: status
        status:
          - 200

      - type: regex
        part: body
        regex:
          - '(?i)(\"(api_key|apikey|token|secret|password|passwd|pwd|auth|access_key|secret_key)\":\s*\"[^\"]{8,}\")'
          - '(?i)(\"(aws|azure|gcp|google|slack|github|twitter|facebook)\":\s*\{)'
          - '(?i)(\"(host|endpoint|url|uri|connection|server)\":\s*\"[^\"]+\")'
          - '(?i)(\"(username|user|uid|login)\":\s*\"[^\"]+\")'
          - '(?i)(\"(db|database|mongo|mysql|postgresql|redis)\":\s*\{)'
          - '(?i)"production":\s*(true|false)'
          - '(?i)"baseUrl":\s*"[^"]+"'
          - '(?i)"(accessCode|recaptchaSiteKey|tokenExpire)":\s*"[^"]+"'
          - '(?i)"(fileUrl|loginAppUrl|aimBaseUrl)":\s*"[^"]+"'
        condition: or

    extractors:
      # Original extractors
      - type: regex
        name: api_credentials
        regex:
          - '\"(api_key|apikey|token|secret|auth)\":\s*\"([^\"]{8,})\"'
          - '\"access_token\":\s*\"([^\"]{8,})\"'
          - '\"authorization\":\s*\"([^\"]{8,})\"'

      - type: regex
        name: aws_credentials
        regex:
          - '\"aws_access_key_id\":\s*\"([^\"]{20,})\"'
          - '\"aws_secret_access_key\":\s*\"([^\"]{20,})\"'
          - '\"aws_session_token\":\s*\"([^\"]{20,})\"'

      - type: regex
        name: database_credentials
        regex:
          - '\"(db_password|database_password|mysql_password|postgresql_password|mongo_password)\":\s*\"([^\"]{8,})\"'
          - '\"(connection_string|connection_url|database_url)\":\s*\"([^\"]+)\"'

      - type: regex
        name: endpoints
        regex:
          - '\"(url|endpoint|uri|host|server)\":\s*\"(https?://[^\"]+)\"'
          - '\"(webhook|callback)\":\s*\"(https?://[^\"]+)\"'

      # New specific extractors
      - type: regex
        name: base_urls
        regex:
          - '"baseUrl":\s*"(https?://[^"]+)"'
          - '"baseURL":\s*"(https?://[^"]+)"'
          - '"fileUrl":\s*"(https?://[^"]+)"'
          - '"loginAppUrl":\s*"(https?://[^"]+)"'
          - '"aimBaseUrl":\s*"(https?://[^"]+)"'

      - type: regex
        name: access_codes
        regex:
          - '"accessCode":\s*"([A-Za-z0-9+/=]{40,})"'
          - '"recaptchaSiteKey":\s*"([A-Za-z0-9_-]{40,})"'

      - type: regex
        name: token_config
        regex:
          - '"tokenExpire":\s*(\d+)'
          - '"refreshTokenExpire":\s*(\d+)'

      - type: regex
        name: environment
        regex:
          - '"production":\s*(true|false)'

      - type: regex
        name: sensitive_endpoints
        regex:
          - 'https?://[a-zA-Z0-9.-]+\.[a-zA-Z]{2,}/(?:login|api|admin|dashboard|auth)'
