id: http-etcd-unauthenticated-api-data-leak

info:
  name: etcd 未授权 HTTP API Leak
  author: dhiyaneshDk
  severity: high
  description: |
    检测到 etcd 未授权 HTTP API Leak。目标功能在未认证状态下可访问，可能暴露管理入口、业务数据、系统状态或可执行操作，需确认是否存在访问控制缺失。
  reference:
    - https://hackerone.com/reports/1088429
  metadata:
    max-request: 1
  tags: misconfig,hackerone,unauth,etcd,vuln

http:
  - method: GET
    path:
      - "{{BaseURL}}/v2/auth/roles"

    matchers-condition: and
    matchers:
      - type: word
        part: body
        words:
          - '"roles"'
          - '"permissions"'
          - '"role"'
          - '"kv"'
        condition: and

      - type: word
        part: header
        words:
          - "text/plain"
          - "application/json"
        condition: or

      - type: status
        status:
          - 200
