id: polarion-siemens-panel

info:
  name: Polarion Siemens Login 面板（暴露面识别）
  author: Th3l0newolf
  severity: info
  description: |
    该模板通过识别 Polarion Siemens Login 登录入口的页面标题、特征文本或重定向行为，判断目标是否暴露了对应的认证界面。若命中，说明该登录面板对外可访问，可用于暴露面梳理与后续安全评估。
  reference:
    - https://polarion.plm.automation.siemens.com/
  metadata:
    verified: true
    shodan-query:
      - http.favicon.hash:-1135703796
      - http.favicon.hash:707299418
  tags: polarion,siemens,login,panel,detect,discovery

http:
  - method: GET
    path:
      - "{{BaseURL}}/polarion/"

    matchers-condition: and
    matchers:
      - type: word
        part: body
        words:
          - "Polarion AG"

      - type: status
        status:
          - 200

    extractors:
      - type: regex
        name: version
        group: 1
        regex:
          - "buildId=([\\d\\w\\-\\_]+)\""
