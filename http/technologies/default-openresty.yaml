id: default-openresty

info:
  name: Nginx OpenResty 默认页面 指纹识别（指纹识别）
  author: dhiyaneshDk
  severity: info
  description: OpenResty 默认页面 是基于 Nginx 和 LuaJIT 的 Web 平台，用于高性能网关、代理和动态 Web 服务。该模板请求首页，并依据页面标题、正文关键字或品牌资源特征识别目标是否使用或暴露了 OpenResty 默认页面 相关组件，适用于资产盘点、技术栈识别和后续安全评估；命中结果仅表示指纹特征匹配，不代表已确认存在可利用漏洞。
  classification:
    cpe: cpe:2.3:a:openresty:openresty:*:*:*:*:*:*:*:*
  metadata:
    max-request: 1
    vendor: openresty
    product: openresty
    shodan-query: http.title:"Welcome to OpenResty!"
  tags: tech,openresty,nginx,discovery

http:
  - method: GET
    path:
      - '{{BaseURL}}'

    matchers:
      - type: word
        words:
          - "<title>Welcome to OpenResty!</title>"
        part: body

    extractors:
      - type: regex
        name: detected_version
        part: header
        group: 1
        regex:
          - (?mi)^Server:[ \t]*openresty/([0-9]+(?:[.][0-9]+)+(?:[-+._][0-9A-Za-z]+)*)(?:[ \t\r]|$)
        internal: true
      - type: dsl
        dsl:
          - 'regex("^[0-9]+(?:[.][0-9]+)*(?:[-+._][0-9A-Za-z]+)*$", detected_version) ? detected_version : ""'
