id: copa-data-zenon-panel

info:
  name: Copa-Data zenon - 登录面板（暴露面识别）
  author: rxerium
  severity: info
  description: |
    该模板通过识别 Copa-Data zenon 登录入口的页面标题、特征文本或重定向行为，判断目标是否暴露了对应的认证界面。若命中，说明该登录面板对外可访问，可用于暴露面梳理与后续安全评估。
  reference:
    - https://www.copadata.com/en/products/zenon-software-platform/zenon-supervisor/
    - https://www.copadata.com/en/support-services/knowledge-base-documents/zenon-web-server/
  metadata:
    max-request: 1
    verified: true
    vendor: COPA-DATA
    product: zenon
    shodan-query: 'http.title:"COPA-DATA :: zenon"'
  tags: panel,scada,hmi,ics,copa-data,zenon,discovery

http:
  - method: GET
    path:
      - "{{BaseURL}}"

    host-redirects: true
    max-redirects: 2

    matchers-condition: and
    matchers:
      - type: word
        part: body
        words:
          - 'COPA-DATA'
          - 'zenon'
        condition: and

      - type: status
        status:
          - 200
