id: winrm-enabled

info:
  name: WinRM 已启用（本地基线扫描）
  author: princechaddha
  severity: medium
  description: |
    该模板检查 WinRM 是否在无业务需求时启用。WinRM 提供远程命令和管理能力。
  impact: |
    不必要的 WinRM 暴露会增加远程命令执行和凭据攻击面。
  remediation: |
    如无远程管理需求，禁用 WinRM；如必须启用，限制来源并启用加密认证。
  tags: windows,winrm,code,windows-audit

self-contained: true

code:
  - pre-condition: |
      IsWindows();
    engine:
      - powershell
      - powershell.exe
    args:
      - -ExecutionPolicy
      - Bypass
    pattern: "*.ps1"
    source: |
      Get-Service -Name WinRM | Select-Object -ExpandProperty Status

    matchers:
      - type: word
        words:
          - "Running"
