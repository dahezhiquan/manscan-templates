id: aem-groovyconsole

info:
  name: AEM Groovy 控制台 Discovery
  author: Dheerajmadhukar
  severity: critical
  description: |
    该模板用于核查 AEM Groovy 控制台 Discovery相关配置。该类问题通常源于管理面板、仪表盘或监控控制台暴露在公网或缺少足够访问控制。模板会向目标发送探测请求，并依据请求 `/groovyconsole`、`/etc/groovyconsole.html`、匹配 `<title>Groovy Console</title>`、`Run Script`、状态码 200 等证据确认目标是否存在该配置问题。
  impact: |
    - 攻击者可获取系统状态、业务指标、任务信息、拓扑结构或管理入口线索。
    - 若面板存在默认凭据、弱认证或操作接口，可能进一步导致未授权管理或服务接管。
  remediation: |
    - 将管理面板和仪表盘限制在内网、VPN 或可信访问网关后。
    - 启用强认证、多因素认证、细粒度授权和操作审计。
    - 隐藏或关闭不需要公开的默认面板，并监控异常访问与暴力探测。
  reference:
    - https://hackerone.com/reports/672243
    - https://twitter.com/XHackerx007/status/1435139576314671105
  classification:
    cpe: cpe:2.3:a:adobe:experience_manager_cloud_service:*:*:*:*:*:*:*:*
  metadata:
    max-request: 2
    vendor: adobe
    product: experience_manager_cloud_service
    shodan-query: http.component:"Adobe Experience Manager"
  tags: aem,adobe,hackerone,misconfig,vuln

http:
  - method: GET
    path:
      - "{{BaseURL}}/groovyconsole"
      - "{{BaseURL}}/etc/groovyconsole.html"

    headers:
      Accept: text/html,application/xhtml+xml,application/xml;q=0.9,image/avif,image/webp,image/apng,*/*;q=0.8,application/signed-exchange;v=b3;q=0.9
      Accept-Language: en-US,en;q=0.9,hi;q=0.8
    stop-at-first-match: true

    matchers-condition: and
    matchers:
      - type: word
        words:
          - "<title>Groovy Console</title>"
          - "Run Script"
          - "Groovy Web Console"
        part: body
        condition: and

      - type: status
        status:
          - 200
