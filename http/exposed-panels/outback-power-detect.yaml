id: outback-power-detect

info:
  name: OutBack Power Mate3s Gateway 识别（指纹识别）
  author: rxerium
  severity: info
  description: |
    该模板通过识别 OutBack Power Mate3s Gateway 面板、控制台或管理界面的页面特征，判断目标是否暴露了对应服务入口。若命中，说明该后台或运维界面对外可访问，可用于资产识别与暴露面排查。
  reference:
    - https://www.outbackpower.com/outback-products/communications/detail/mate3s
  metadata:
    max-request: 1
    verified: true
    shodan-query: http.title:"Outback Power"
    vendor: outback-power
    product: mate3s
  tags: tech,panel,outback,ics,solar,energy,scada,detect

http:
  - method: GET
    path:
      - "{{BaseURL}}"

    host-redirects: true
    max-redirects: 2

    matchers-condition: and
    matchers:
      - type: word
        part: body
        words:
          - '<title>Outback Power</title>'
          - 'status_tab'
          - 'meters_tab'
        condition: or

      - type: status
        status:
          - 200
