id: froxlor-detect

info:
  name: Froxlor 指纹识别（指纹识别）
  author: pikpikcu
  severity: info
  description: >-
    Froxlor 是开源服务器和主机托管控制面板，用于管理域名、Web 服务、邮件和用户账户。该模板通过请求目标服务并检查预设路径或首页响应、页面正文关键字、状态码等指纹特征，判断目标是否使用或暴露了
    Froxlor 相关组件；命中结果仅表示指纹特征匹配，可用于资产盘点、技术栈识别和后续安全评估，不代表已确认存在可利用漏洞。
  metadata:
    max-request: 1
  tags: tech,froxlor,discovery
http:
  - method: GET
    path:
      - "{{BaseURL}}"

    matchers-condition: and
    matchers:
      - type: word
        part: body
        words:
          - "<title>Froxlor Server Management Panel</title>"

      - type: status
        status:
          - 200
