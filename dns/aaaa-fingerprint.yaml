id: aaaa-fingerprint

info:
  name: AAAA 记录 IPv6 识别（dns）
  author: rxerium
  severity: info
  description: |
    该模板检测域名是否存在 AAAA 记录。AAAA 记录用于将域名解析到 IPv6 地址，可帮助识别目标是否启用了 IPv6 访问面。
  reference:
    - https://www.cloudflare.com/learning/dns/dns-records/dns-aaaa-record/
    - https://en.wikipedia.org/wiki/IPv6_address
  classification:
    cwe-id: CWE-200
  metadata:
    max-request: 1
  tags: dns,aaaa,ipv6,discovery

dns:
  - name: "{{FQDN}}"
    type: AAAA

    matchers:
      - type: regex
        part: answer
        regex:
          - "IN\tAAAA\t(.+)$"

    extractors:
      - type: regex
        group: 1
        regex:
          - "IN\tAAAA\t([0-9a-fA-F:]+)"
