id: allegro-rompager-panel

info:
  name: Allegro RomPager 面板（指纹识别）
  author: matejsmycka
  severity: info
  description: |
    该模板通过识别 Allegro RomPager 面板、控制台或管理界面的页面特征，判断目标是否暴露了对应服务入口。若命中，说明该后台或运维界面对外可访问，可用于资产识别与暴露面排查。
  reference:
    - http://rompager.com
  metadata:
    verified: true
    shodan-query: product:"Allegro RomPager"
  tags: tech,allegro,rompager,panel,login,discovery

http:
  - method: GET
    path:
      - "{{BaseURL}}"

    host-redirects: true
    max-redirects: 2

    matchers-condition: and
    matchers:
      - type: word
        part: server
        words:
          - "Allegro-Software-RomPager/"

      - type: status
        status:
          - 200

    extractors:
      - type: regex
        name: version
        part: header
        group: 1
        regex:
          - "RomPager/([\\d\\.]+)"
