id: aerocms-detect

info:
  name: AeroCMS 指纹识别（指纹识别）
  author: pikpikcu
  severity: info
  description: AeroCMS 是内容管理系统，用于网站页面、文章和后台内容维护。该模板请求首页，并依据 HTTP 200 状态码、页面标题、正文关键字或品牌资源特征识别目标是否使用或暴露了 AeroCMS 相关组件，适用于资产盘点、技术栈识别和后续安全评估；命中结果仅表示指纹特征匹配，不代表已确认存在可利用漏洞。
  classification:
    cpe: cpe:2.3:a:aerocms_project:aerocms:*:*:*:*:*:*:*:*
  metadata:
    verified: true
    max-request: 1
    vendor: aerocms_project
    product: aerocms
    shodan-query: title:"AeroCMS"
    fofa-query: "AeroCMS"
  tags: tech,aerocms,discovery

http:
  - method: GET
    path:
      - "{{BaseURL}}"

    matchers-condition: and
    matchers:
      - type: regex
        part: body
        regex:
          - 'content="(.*)AeroCMS(.*)'

      - type: status
        status:
          - 200
