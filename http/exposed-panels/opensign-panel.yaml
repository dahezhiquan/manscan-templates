id: opensign-panel

info:
  name: OpenSign 登录面板识别（暴露面识别）
  author: righettod
  severity: info
  description: |
    该模板通过识别 OpenSign 登录入口的页面标题、特征文本或重定向行为，判断目标是否暴露了对应的认证界面。若命中，说明该登录面板对外可访问，可用于暴露面梳理与后续安全评估。
  reference:
    - https://www.opensignlabs.com/
    - https://github.com/OpenSignLabs/OpenSign
  metadata:
    max-request: 2
    verified: true
    shodan-query: http.title:"opensign"
  tags: panel,opensign,login,detect,discovery

http:
  - method: GET
    path:
      - "{{BaseURL}}/locales/en/translation.json"
      - "{{BaseURL}}/"

    stop-at-first-match: true
    matchers:
      - type: dsl
        dsl:
          - 'status_code == 200'
          - 'contains(body, "OpenSign")'
        condition: and
