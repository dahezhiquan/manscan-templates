id: vnc-service-detect

info:
  name: VNC 服务识别（指纹识别）
  author: pussycat0x
  severity: info
  description: |
    VNC 使用 RFB 协议提供图形化远程桌面访问。该模板连接目标后不发送数据，仅在收到完整的 `RFB xxx.xxx` 协议横幅时确认服务并提取 RFB 协议版本；该版本不代表 VNC 软件版本。
  classification:
    cwe-id: CWE-200
  metadata:
    max-request: 1
  tags: network,vnc,detect,tcp,discovery

javascript:
  - code: |
      const net = require("nuclei/net");
      const conn = net.Open("tcp", `${Host}:${Port}`);
      conn.SetTimeout(3);

      let evidence = "";
      try {
        let banner = conn.RecvFullString(12);
        if (banner.endsWith("\r")) banner += conn.RecvFullString(1);
        if (/^RFB [0-9]{3}\.[0-9]{3}\r?\n$/.test(banner)) {
          evidence = banner.substring(0, 11);
        }
      } catch (error) {
        // Incomplete banners are not RFB fingerprints.
      } finally {
        conn.Close();
      }
      Export(evidence);

    args:
      Host: "{{Host}}"
      Port: 5900

    matchers:
      - type: regex
        part: response
        regex:
          - '^RFB [0-9]{3}\.[0-9]{3}$'

    extractors:
      - type: regex
        name: rfb-protocol-version
        part: response
        group: 1
        regex:
          - '^RFB ([0-9]{3}\.[0-9]{3})$'
