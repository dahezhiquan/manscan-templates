id: budibase-admin-installer

info:
  name: Budibase - 管理员安装程序
  author: 0x_Akoko
  severity: high
  description: |
    该模板用于核查 Budibase - 管理员安装程序。该类问题通常源于安装、初始化、升级或配置向导在部署完成后仍可从公网访问。模板会向目标发送探测请求，并依据请求 `/api/global/configs/checklist`、匹配 `status_code == 200`、匹配 `contains(content_type, "application/json")`、匹配 `contains(header, "X-Budibase-Tenant-Id")`等证据确认目标是否存在该配置问题。
  impact: |
    - 攻击者可能完成初始化流程、创建管理员账户、覆盖配置或触发升级逻辑。
    - 在部分系统中，暴露安装入口还可能导致数据库连接信息泄露、站点被重新配置或业务被接管。
  remediation: |
    - 完成部署后立即删除、禁用或限制安装与升级入口。
    - 对初始化流程增加来源限制和一次性安装校验，避免公网直接访问。
    - 检查系统是否已被异常初始化或创建未知管理员账户，并轮换相关凭据。
  reference:
    - https://github.com/Budibase/budibase
  metadata:
    verified: true
    max-request: 1
    vendor: budibase
    product: budibase
    fofa-query: app="Budibase"
    shodan-query: http.title:"Budibase"
  tags: exposure,setup,installer,budibase

http:
  - method: GET
    path:
      - "{{BaseURL}}/api/global/configs/checklist"

    matchers:
      - type: dsl
        dsl:
          - 'status_code == 200'
          - 'contains(content_type, "application/json")'
          - 'contains(header, "X-Budibase-Tenant-Id")'
          - 'contains_all(body, "\"adminUser\":{\"checked\":false", "\"smtp\"", "\"branding\"", "/builder/portal")'
        condition: and
