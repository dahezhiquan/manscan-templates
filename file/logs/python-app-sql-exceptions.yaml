id: python-app-sql-exceptions

info:
  name: Python 应用 SQL 异常检测（本地文件安全扫描）
  author: geeknik
  severity: medium
  description: |
    该模板根据 PEP 249 相关数据库异常特征检测 Python 应用中的通用 SQL 错误信息，可能暴露注入探测或数据库错误。
  reference:
    - https://www.python.org/dev
    - https://peps.python.org/pep-0249/
  tags: file,logs,python,sql
file:
  - extensions:
      - all

    extractors:
      - type: regex
        name: exception
        part: body
        regex:
          - 'DataError'
          - 'IntegrityError'
          - 'ProgrammingError'
          - 'OperationalError'
