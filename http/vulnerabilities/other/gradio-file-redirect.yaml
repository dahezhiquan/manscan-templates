id: gradio-file-redirect

info:
  name: Gradio - 开放重定向漏洞
  author: neo-ai-engineer,DhiyaneshDk
  severity: low
  description: Gradio - 开放重定向 存在开放重定向漏洞。攻击者可构造恶意跳转链接诱导用户访问钓鱼站点，或配合其他业务流程绕过安全校验。
  metadata:
    verified: true
    max-request: 2
    fofa-query: "Gradio"
  tags: gradio,redirect,vuln,oos

http:
  - method: GET
    path:
      - "{{BaseURL}}/gradio_api/file=http://example.com"
      - "{{BaseURL}}/file=http://example.com"

    stop-at-first-match: true
    matchers:
      - type: regex
        part: header
        regex:
          - '(?m)^(?:Location\s*?:\s*?)(?:https?:\/\/|\/\/|\/\\\\|\/\\)(?:[a-zA-Z0-9\-_\.@]*)example\.com\/?(\/|[^.].*)?$'
