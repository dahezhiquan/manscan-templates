id: gcloud-postgresql-log-hostname-disabled

info:
  name: PostgreSQL 数据库实例未启用 log_hostname 标志（云安全）
  author: princechaddha
  severity: medium
  description: PostgreSQL log_hostname 可在连接日志中记录客户端主机名，增强来源识别能力。本模板检查 Cloud SQL PostgreSQL 实例 databaseFlags 中 log_hostname 的值，匹配 off 时报告该标志未启用。
  impact: |
    - 连接日志缺少主机名信息时，安全团队更难将可疑数据库访问关联到具体客户端或应用节点。
    - 来源识别不足会影响事件调查、访问基线分析和异常连接告警。
  remediation: |
    - 按组织审计要求启用 log_hostname，并评估反向解析带来的性能和可靠性影响。
    - 同时启用连接日志并确保日志被集中保存，便于关联客户端身份和访问来源。
  reference:
    - https://cloud.google.com/sql/docs/postgres/configure-instance-settings
  metadata:
    vendor: google
    product: cloud-sql
  tags: cloud,devops,gcp,gcloud,google-cloud-sql,postgresql,gcp-cloud-config

flow: |
  code(1)
  for(let projectId of iterate(template.projectIds)){
    set("projectId", projectId)
    code(2)
    for(let sqlInstance of iterate(template.sqlInstances)){
      set("sqlInstance", sqlInstance)
      code(3)
    }
  }

self-contained: true

code:
  - engine:
      - sh
      - bash
    source: |
      gcloud projects list --format="json(projectId)"

    extractors:
      - type: json
        name: projectIds
        internal: true
        json:
          - '.[].projectId'

  - engine:
      - sh
      - bash
    source: |
      gcloud sql instances list --project $projectId --filter='DATABASE_VERSION:POSTGRES*' --format="json(name)"

    extractors:
      - type: json
        name: sqlInstances
        internal: true
        json:
          - '.[].name'

  - engine:
      - sh
      - bash
    source: |
      gcloud sql instances describe $sqlInstance --project=$projectId --format=json | jq '.settings.databaseFlags // [] | map(select(.name=="log_hostname")) | .[].value'

    matchers:
      - type: word
        words:
          - 'off'

    extractors:
      - type: dsl
        dsl:
          - '"Log Hostname flag is disabled for PostgreSQL instance: " + sqlInstance + " in project: " + projectId'
