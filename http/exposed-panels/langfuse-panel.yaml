id: langfuse-panel

info:
  name: Langfuse AI 面板识别（指纹识别）
  author: ChrisJr404
  severity: info
  description: |-
    检测到目标站点存在 Langfuse 相关响应特征。Langfuse 是 LLM 应用可观测性平台，用于跟踪提示词、调用链路、评估、成本、用户反馈和模型行为。模板请求 `/`、`/api/public/health` 路径，并通过页面标题或正文关键字、状态码、DSL 条件确认该系统指纹，用于资产识别、系统盘点和暴露面梳理。
  reference:
    - https://github.com/langfuse/langfuse
    - https://langfuse.com/
  metadata:
    verified: true
    max-request: 2
    vendor: langfuse
    product: langfuse
    shodan-query: http.title:"Langfuse"
    fofa-query: title="Langfuse"
  tags: panel,langfuse,llm,ai,detect,login
http:
  - method: GET
    path:
      - '{{BaseURL}}'
      - '{{BaseURL}}/api/public/health'
    host-redirects: true
    max-redirects: 2
    stop-at-first-match: false
    matchers:
      - type: dsl
        dsl:
          - status_code_1 == 200 && (contains(to_lower(body_1), "<title>langfuse") || contains(to_lower(all_headers_1), "x-langfuse-"))
    req-condition: true
    extractors:
      - type: regex
        name: detected_version
        part: body_2
        group: 1
        regex:
          - '"version"\s*:\s*"([0-9]+(?:[.][0-9]+)+(?:[-+._][0-9A-Za-z]+)*)"'
        internal: true
      - type: dsl
        dsl:
          - 'status_code_2 == 200 && regex("^[0-9]+(?:[.][0-9]+)*(?:[-+._][0-9A-Za-z]+)*$", detected_version) ? detected_version : ""'
