id: pytorch-torchserve-detect

info:
  name: TorchServe 指纹识别（指纹识别）
  author: DhiyaneshDk
  severity: info
  description: >-
    TorchServe 是 PyTorch 官方模型服务框架，用于部署、管理和调用深度学习模型推理接口。该模板通过请求目标服务并检查预设路径或首页响应、DSL
    条件等指纹特征，判断目标是否使用或暴露了 TorchServe 相关组件；命中结果仅表示指纹特征匹配，可用于资产盘点、技术栈识别和后续安全评估，不代表已确认存在可利用漏洞。
  reference:
  - https://github.com/pytorch/serve
  - https://pytorch.org/serve/
  metadata:
    verified: true
    max-request: 3
    vendor: pytorch
    product: torchserve
    shodan-query: 'http.html:"TorchServe"'
    fofa-query: 'body="Requested method is not allowed, please refer to API document"'
  tags: tech,detect,torchserve,pytorch,ai,llm,inference,discovery
http:
  - method: GET
    path:
      - "{{BaseURL}}/api-description"
      - "{{BaseURL}}/models"
      - "{{BaseURL}}/ping"

    stop-at-first-match: true
    matchers:
      - type: dsl
        dsl:
          - 'contains_any(body, "\"TorchServe APIs\"", "\"apiDescription\"", "\"operationId\"") || contains_all(body, "\"models\"", "\"modelName\"") || contains_all(body, "\"status\"", "Healthy")'
          - 'contains(content_type, "application/json")'
          - 'status_code == 200'
        condition: and
