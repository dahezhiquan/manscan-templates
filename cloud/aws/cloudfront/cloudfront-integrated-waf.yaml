id: cloudfront-integrated-waf

info:
  name: CloudFront 未集成 AWS WAF（云安全）
  author: DhiyaneshDK
  severity: medium
  description: CloudFront 未集成 AWS WAF 是一类边缘入口防护缺失风险，公网分发缺少统一的 Web ACL 来过滤恶意请求。没有 WAF 时，常见 Web 攻击、自动化扫描、速率滥用等流量更容易直接到达源站或应用。模板读取 `Distribution.DistributionConfig.WebACLId`，当值为空或不包含 ARN 时判定未关联 AWS WAF Web ACL。
  impact: |
    - 暴露在公网的 CloudFront 入口缺少边缘层规则过滤，可能更容易受到恶意流量和常见 Web 攻击影响。
    - 安全团队难以在分发层统一实施 IP 信誉、速率限制、托管规则和请求可视化控制。
  remediation: |
    - 为需要公网访问保护的 CloudFront 分配关联合适的 AWS WAF Web ACL。
    - 根据业务流量启用托管规则、速率限制和日志分析，并在变更后观察误拦截情况。
  reference:
    - https://www.trendmicro.com/cloudoneconformity-staging/knowledge-base/aws/CloudFront/cloudfront-integrated-with-waf.html
    - http://docs.aws.amazon.com/waf/latest/developerguide/what-is-aws-waf.html
  metadata:
    vendor: amazon
    product: cloudfront
  tags: cloud,devops,aws,amazon,cloudfront,aws-cloud-config

variables:
  region: "us-west-2"

flow: |
  code(1)
  for(let DistributionListItemsId of iterate(template.distributions)){
    set("distribution", DistributionListItemsId)
    code(2)
  }

self-contained: true

code:
  - engine:
      - sh
      - bash

    source: |
      aws cloudfront list-distributions --output table --query 'DistributionList.Items[*].Id' --region $region --output json

    extractors:
      - type: json
        name: distributions
        internal: true
        json:
          - '.[]'

  - engine:
      - sh
      - bash

    source: |
        aws cloudfront get-distribution --id $distribution --query 'Distribution.DistributionConfig.WebACLId' --region $region --output json

    matchers-condition: and
    matchers:
      - type: word
        words:
          - '""'

      - type: word
        words:
          - 'arn:'
        negative: true

    extractors:
      - type: dsl
        dsl:
          - '"CloudFront Integrated With WAF " + distribution + " is Disabled"'
