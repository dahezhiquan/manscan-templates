id: openethereum-server

info:
  name: OpenEthereum JSON-RPC HTTP Server 指纹识别（指纹识别）
  author: Nullfuzz
  severity: info
  description: >-
    OpenEthereum 是以太坊执行客户端，JSON-RPC HTTP Server 用于提供区块链节点查询和交易广播接口。该模板通过请求目标服务并检查DSL
    条件、正则特征等指纹特征，判断目标是否使用或暴露了 OpenEthereum JSON-RPC HTTP Server 相关组件；命中结果仅表示指纹特征匹配，可用于资产盘点、技术栈识别和后续安全评估，不代表已确认存在可利用漏洞。
  reference:
  - https://github.com/openethereum/openethereum
  - https://openethereum.github.io/
  metadata:
    max-request: 1
    shodan-query: product:OpenEthereum
  tags: tech,openethereum,ethereum,web3,blockchain,discovery
http:
  - raw:
      - |
        POST / HTTP/1.1
        Host: {{Hostname}}
        Content-Type: application/json
        Content-Length: 66

        {"method":"web3_clientVersion","params":[],"id":1,"jsonrpc":"2.0"}

    matchers:
      - type: dsl
        dsl:
          - 'status_code == 200'
          - 'contains(header, "application/json")'
          - 'contains(body, "OpenEthereum")'
        condition: and

    extractors:
      - type: regex
        part: body
        group: 1
        regex:
          - '(v[0-9a-z-_.]+)'
