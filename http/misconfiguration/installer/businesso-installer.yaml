id: businesso-installer

info:
  name: Businesso 安装向导 暴露
  author: ritikchaddha
  severity: high
  description: |
    检测到 Businesso 安装向导 暴露。该页面属于安装、初始化或配置向导流程，若对外暴露，攻击者可能完成初始化、创建管理员账户或重新配置目标系统。
  metadata:
    verified: true
    max-request: 1
    shodan-query: title:"Businesso Installer"
    fofa-query: title="Businesso Installer"
  tags: misconfig,businesso,install,exposure,vuln

http:
  - method: GET
    path:
      - '{{BaseURL}}/install/'

    host-redirects: true
    max-redirects: 2
    matchers-condition: and
    matchers:
      - type: word
        part: body
        words:
          - 'Businesso Installer</title>'

      - type: status
        status:
          - 200
