id: autologon-control

info:
  name: Autologon 功能未禁用（本地基线扫描）
  author: nukunga[SungHyunJeon]
  severity: medium
  description: |
    启用自动登录通常意味着凭据被本地保存。对应基线项为“AutoAdminLogon 注册表值，确认自动登录功能是否被禁用”；模板读取注册表 `HKLM:\Software\Microsoft\Windows NT\CurrentVersion\Winlogon` 的 `AutoAdminLogon` 值，结合命中值判断策略是否不符合基线。
  impact: |
    - 攻击者可读取或滥用保存的自动登录凭据进入系统。
    - 日志缺失会降低入侵发现、事件溯源和合规取证能力。
  remediation: |
    - 将 AutoAdminLogon 设置为禁用，并清理 DefaultPassword 等敏感注册表值。
    - 确认日志容量、归档和集中转发链路可用，并监控审计策略被关闭的情况。
  reference:
    - https://isms.kisa.or.kr/main/csap/notice/?boardId=bbs_0000000000000004&mode=view&cntId=85
  tags: autologon,account-management,code,windows-audit,kisa

self-contained: true

code:
  - pre-condition: |
      IsWindows();
    engine:
      - powershell
      - powershell.exe
    args:
      - -ExecutionPolicy
      - Bypass
    pattern: "*.ps1"
    source: |
      $regPath = "HKLM:\Software\Microsoft\Windows NT\CurrentVersion\Winlogon"
      $autologon = (Get-ItemProperty -Path $regPath -Name AutoAdminLogon -ErrorAction SilentlyContinue).AutoAdminLogon
      if ($null -eq $autologon -or $autologon -eq "0") {
          "AUTO_ADMIN_LOGON_DISABLED"
      } else {
          "AUTO_ADMIN_LOGON_ENABLED"
      }

    matchers:
      - type: word
        words:
          - "AUTO_ADMIN_LOGON_ENABLED"
