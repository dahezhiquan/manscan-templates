id: allen-bradley-slc-500-detect

info:
  name: Allen-Bradley SLC-500 Series PLC 识别（服务漏洞）
  author: biero-el-corridor
  severity: info
  description: |
    该模板通过工业协议指纹识别目标是否运行 Allen-Bradley SLC-500 Series PLC 相关设备或控制系统。
  metadata:
    shodan-query: 'port:44818 "Vendor ID: Rockwell Automation/Allen-Bradley"'
  tags: ics,allen-bradley,slc-500,detect,network,tcp

tcp:
  - inputs:
      - data: "630000000000000000000000000000000000000000000000"
        type: hex
        read: 200
        name: info

    host:
      - "{{Hostname}}"
    port: 44818
    read-size: 1024

    matchers:
      - type: binary
        part: info
        binary:
          - "313734362d" # 1746-
          - "313737322d" # 1747-
        condition: or
