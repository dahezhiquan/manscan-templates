id: gcloud-func-no-vpc-access

info:
  name: No Serverless VPC 访问 中的Google Cloud Functions（云安全）
  author: princechaddha
  severity: high
  description: Cloud Functions 未配置 Serverless VPC Access Connector 时，函数无法通过受控私网路径访问 VPC 内资源或统一出站网络。本模板枚举函数并检查 vpcConnector，值为 null 时报告函数未配置 Serverless VPC Access。
  impact: |
    - 函数访问数据库、缓存或内部 API 时可能被迫走公网或临时放宽网络访问控制。
    - 缺少统一 VPC 出站路径会削弱防火墙、NAT、审计和私有服务访问策略。
  remediation: |
    - 为需要访问私有资源的函数配置 Serverless VPC Access Connector，并按需设置出站流量策略。
    - 对无需 VPC 访问的函数记录例外，确保其依赖资源不需要通过公网暴露。
  reference:
    - https://cloud.google.com/functions/docs/connecting-vpc
  metadata:
    vendor: google
    product: cloud-functions
  tags: cloud,devops,gcp,gcloud,google-cloud-functions,gcp-cloud-config

flow: |
  code(1)
  for(let projectId of iterate(template.projectIds)){
    set("projectId", projectId)
    code(2)
    for(let functionName of iterate(template.functions)){
      set("functionName", functionName)
      code(3)
    }
  }

self-contained: true

code:
  - engine:
      - sh
      - bash
    source: |
      gcloud projects list --format="json(projectId)"

    extractors:
      - type: json
        name: projectIds
        internal: true
        json:
          - '.[].projectId'

  - engine:
      - sh
      - bash
    source: |
      gcloud functions list --project $projectId --format="json(name)"

    extractors:
      - type: json
        name: functions
        internal: true
        json:
          - '.[].name'

  - engine:
      - sh
      - bash
    source: |
      gcloud functions describe $functionName --region=us-central1 --format="json(vpcConnector)"

    matchers:
      - type: word
        words:
          - 'null'

    extractors:
      - type: dsl
        dsl:
          - '"No Serverless VPC Access in function: " + functionName + " in " + projectId + " project"'
