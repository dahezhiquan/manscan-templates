id: rabbitmq-detect

info:
  name: RabbitMQ 识别（指纹识别）
  author: pussycat0x
  severity: info
  description: |
    RabbitMQ 是基于 AMQP 的消息队列服务，用于异步消息投递、任务队列和系统解耦。该模板连接 5672/TCP 并读取协议响应，通过匹配 `publisher_confirmst`、`RabbitMQ` 等响应特征识别目标服务。
  reference:
    - https://nmap.org/nsedoc/scripts/amqp-info.html
  metadata:
    verified: true
    max-request: 1
    shodan-query: product:"RabbitMQ"
  tags: network,rabbitmq,oss,detect,tcp,discovery
tcp:
  - inputs:
      - data: "AMQP\u0000\u0000\t\u0001"

    host:
      - "{{Hostname}}"
    port: 5672

    matchers-condition: and
    matchers:
      - type: word
        words:
          - "publisher_confirmst"
          - "RabbitMQ"
        condition: and
