id: misconfigured-concrete5

info:
  name: 配置不当 Concrete5
  author: pdteam
  severity: low
  description: |
    检测到 配置不当 Concrete5。目标响应或文件中可能暴露配置、凭据、密钥、令牌、环境变量或历史记录等敏感信息，可能被用于进一步入侵。
  metadata:
    max-request: 1
  tags: misconfig,concrete,cms,vuln

http:
  - method: GET
    path:
      - "{{BaseURL}}"

    host-redirects: true
    max-redirects: 2
    matchers:
      - type: word
        part: body
        words:
          - 'concrete5 has encountered an issue'
