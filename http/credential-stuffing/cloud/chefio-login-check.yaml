id: chefio-login-check

info:
  name: Chef.io 登录有效性检查（撞库）
  author: parthmalhotra,pdresearch
  severity: critical
  description: Chef.io 面向基础设施自动化和配置管理场景，账号通常关联组织、节点管理、自动化策略或相关服务入口。该模板向 Chef.io 登录接口提交用户名和密码，依据响应头中的登录成功跳转地址与 302 状态码判断给定凭据是否有效，可用于撞库场景下验证 Chef.io 账号是否可被成功登录。
  impact: |-
    - 攻击者可使用有效凭据访问 Chef.io 相关服务，查看组织配置、自动化资源或与基础设施管理相关的信息。
    - 高权限账号被接管后，可能影响配置管理流程、自动化策略或运维协作数据的完整性。
    - 凭据复用还可能使同一账号在其他 DevOps 或云平台服务中面临进一步接管风险。
  remediation: |-
    - 立即轮换命中账号密码，撤销异常会话，并检查组织内角色、成员和访问记录。
    - 启用多因素认证，限制高权限账号使用长期复用密码登录。
    - 对登录接口启用速率限制、异常地理位置识别和失败尝试告警，削弱撞库自动化能力。
    - 清点外泄凭据来源，推动用户使用唯一强密码并定期复核 Chef.io 相关权限。
  reference:
    - https://owasp.org/www-community/attacks/Credential_stuffing
  metadata:
    max-request: 1
  tags: cloud,creds-stuffing,login-check,chefio,vuln

self-contained: true

http:
  - raw:
      - |
        POST https://api.chef.io/login HTTP/1.1
        Host: api.chef.io
        Content-Type: application/x-www-form-urlencoded

        utf8=%E2%9C%93&authenticity_token=&authenticity_token=&to=https://api.chef.io/login-success&username={{username}}&password={{password}}&commit=Sign+In

    matchers-condition: and
    matchers:
      - type: word
        part: header
        words:
          - 'Location: https://api.chef.io/login-success'

      - type: status
        status:
          - 302
