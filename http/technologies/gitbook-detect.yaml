id: gitbook-detect

info:
  name: GitBook 指纹识别（指纹识别）
  author: ffffffff0x,daffainfo
  severity: info
  description: 用于识别目标是否部署 GitBook 并提取相关版本或构建信息，模板会结合页面标题、页面正文、特定路径或已知端点和版本或标识提取结果进行指纹匹配。
  reference:
    - https://www.gitbook.com/
  classification:
    cpe: cpe:2.3:a:gitbook:gitbook:*:*:*:*:*:*:*:*
  metadata:
    verified: true
    max-request: 1
    vendor: gitbook
    product: gitbook
    shodan-query: http.title:"gitbook"
    fofa-query: app="Introduction-GitBook"
  tags: tech,gitbook,discovery

http:
  - method: GET
    path:
      - "{{BaseURL}}"

    matchers-condition: or
    matchers:
      - type: word
        part: body
        words:
          - 'gitbook.page.hasChanged'
          - '<meta name="generator" content="GitBook'
        condition: and

      - type: regex
        part: body
        regex:
          - "<title>.*[Gg]it[bB]ook</title>"
          - "<title>.*· [Gg]it[bB]ook.*</title>"
        condition: or

    extractors:
      - type: regex
        group: 1
        regex:
          - '<meta name="generator" content="GitBook ([0-9.]+)">'
          - '(?m)<meta name=generator content="GitBook ([0-9.]+)">'
