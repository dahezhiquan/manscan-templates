id: gcs-bucket-listing

info:
  name: Google Cloud Storage Public 存储桶列出
  author: 0x_Akoko
  severity: unknown
  description: |
    检测到 Google Cloud Storage Public 存储桶列出。Web 服务器或应用目录允许列出文件内容，可能泄露备份文件、配置文件、日志、源码或其他未公开资源。
  reference:
    - https://cloud.google.com/storage/docs/public-access-prevention
  metadata:
    verified: true
    max-request: 1
    shodan-query: "storage.googleapis.com"
  tags: exposure,gcs,google,cloud,bucket,misconfig

http:
  - method: GET
    path:
      - "{{BaseURL}}"

    matchers:
      - type: dsl
        dsl:
          - 'status_code == 200'
          - 'contains_all(body, "ListBucketResult", "<Contents>", "<Generation>")'
        condition: and
