id: ibm-mqseries-web-console

info:
  name: IBM MQ Web Console 登录面板识别（暴露面识别）
  author: righettod
  severity: info
  description: 该模板通过识别 IBM MQ Web Console 登录入口的页面标题、特征文本或重定向行为，判断目标是否暴露了对应的认证界面。若命中，说明该登录面板对外可访问，可用于暴露面梳理与后续安全评估。
  reference:
    - https://www.ibm.com/docs/en/ibm-mq/9.0?topic=console-getting-started-mq
  classification:
    cvss-metrics: CVSS:3.0/AV:N/AC:L/PR:N/UI:N/S:U/C:N/I:N/A:N
    cwe-id: CWE-200
    cpe: cpe:2.3:a:ibm:mq:*:*:*:*:*:*:*:*
  metadata:
    max-request: 1
    vendor: ibm
    product: mq
  tags: panel,ibm,discovery

http:
  - method: GET
    path:
      - '{{BaseURL}}/ibmmq/console/login.html'

    matchers-condition: and
    matchers:
      - type: word
        words:
          - '<title>MQ Console</title>'

      - type: status
        status:
          - 200
