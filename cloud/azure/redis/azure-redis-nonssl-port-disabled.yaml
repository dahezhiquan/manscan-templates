id: azure-redis-nonssl-port-disabled
info:
  name: Azure Redis Cache In-Transit 加密未启用（云安全）
  author: princechaddha
  severity: high
  description: 该规则用于检查 Azure redis 相关安全控制、保护能力或合规配置是否处于未启用、缺失或未正确配置状态，以降低持续暴露风险并提升整体云安全基线。
  impact: |
    - 关键安全控制缺失会降低防护深度，使风险长期处于不可见或不可控状态。
    - 这类配置问题通常不会立即触发故障，但会显著增加后续入侵、横向移动或合规违规的概率。
  remediation: |
    - 按厂商最佳实践启用缺失的安全控制、保护功能或基线配置。
    - 将该类配置纳入持续巡检与自动化合规检查，避免后续资源再次以不安全默认值部署。
  reference:
    - https://docs.microsoft.com/en-us/azure/azure-cache-for-redis/cache-configure#ssl-ports
  tags: cloud,devops,azure,microsoft,redis,azure-cloud-config

flow: |
  code(1);
  for (let CacheData of iterate(template.redisList)) {
    set("name", CacheData);
    code(2);
  }

self-contained: true
code:
  - engine:
      - sh
      - bash
    source: |
      az redis list --query '[*].id'

    extractors:
      - type: json
        name: redisList
        internal: true
        json:
          - '.[]'

  - engine:
      - sh
      - bash
    source: |
      az redis show --ids "$name" --query 'enableNonSslPort'

    matchers-condition: and
    matchers:
      - type: word
        words:
          - 'true'

    extractors:
      - type: dsl
        dsl:
          - 'name + " has non-SSL port enabled, therefore encryption in transit is not enforced."'
