id: linux-rexec-service

info:
  name: rexec 服务应禁用（本地基线扫描）
  author: songyaeji
  severity: high
  description: |
    该模板检查 rexec 服务应禁用 是否仍在运行或启用。该类传统远程服务通常缺少加密和细粒度访问控制，在现代基线中应保持禁用。
  reference:
    - https://isms.kisa.or.kr
  tags: linux,local,audit,kisa,compliance

self-contained: true

code:
  - engine:
      - sh
      - bash
    source: |
      if grep -i 'disable[[:space:]]*=[[:space:]]*no' /etc/xinetd.d/rexec 2>/dev/null; then
          echo "[VULNERABLE] rexec service is enabled"
      else
          echo "[SAFE] rexec service is disabled"
      fi

    matchers:
      - type: word
        part: response
        words:
          - "[VULNERABLE]"
