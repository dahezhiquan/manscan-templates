id: rockauto-phish

info:
  name: RockAuto 仿冒钓鱼网站（钓鱼网站识别）
  author: rxerium
  severity: info
  description: |
    检测到疑似仿冒 RockAuto 的钓鱼网站。模板在目标页面返回 200、页面内容命中 RockAuto 的品牌页面特征，且当前主机不属于 rockauto.com 官方域名时触发，用于识别借用 RockAuto 品牌页面诱导用户信任的仿冒站点。
  reference:
    - https://rockauto.com
  metadata:
    max-request: 1
  tags: phishing,rockauto,ecommerce,osint,discovery
http:
  - method: GET
    path:
      - "{{BaseURL}}"

    host-redirects: true
    max-redirects: 2

    matchers-condition: and
    matchers:
      - type: word
        words:
          - "Auto Parts for Your Vehicle at Reliably Low Prices. Fast Online Catalog. DIY-Easy. Your Choice of Quality. Full Manufacturer Warranty."

      - type: status
        status:
          - 200

      - type: dsl
        dsl:
          - '!contains(host,"rockauto.com")'
