id: azure-nsg-ssh-unrestricted
info:
  name: Azure NSG 对互联网开放 SSH 端口 22（云安全）
  author: princechaddha
  severity: high
  description: SSH 使用 TCP 22 提供远程管理和文件传输；将其对互联网开放会让主机持续暴露于账号枚举、口令攻击和 SSH 服务漏洞利用。本模板查询入站允许的 TCP 22 NSG 规则，并在来源地址为 *、internet 或 any 时报告。
  impact: |
    - 攻击者可能通过弱口令、泄露私钥或未修复漏洞取得远程 shell 和文件访问权限。
    - 主机被入侵后，可能造成凭据窃取、持久化、数据外泄及云内横向移动。
  remediation: |
    - 删除面向互联网的 TCP 22 规则，优先通过 Bastion、VPN 或专用跳板机进行管理。
    - 禁止密码登录、使用受保护的短期密钥或证书，限制管理源地址并及时更新 SSH 和操作系统补丁。
  reference:
    - https://docs.microsoft.com/en-us/azure/virtual-network/network-security-groups-overview
  metadata:
    vendor: microsoft
    product: azure-network-security-group
  tags: cloud,devops,azure,microsoft,nsg,azure-cloud-config

flow: |
  code(1);
  for (let NsgData of iterate(template.nsgdata)) {
    NsgData = JSON.parse(NsgData)
    set("nsg", NsgData.name)
    set("resourcegroup", NsgData.resourceGroup)
    code(2)
  }

self-contained: true
code:
  - engine:
      - sh
      - bash
    source: |
      az network nsg list --query '[*].{name:name, resourceGroup:resourceGroup}' --output json

    extractors:
      - type: json
        name: nsgdata
        internal: true
        json:
          - '.[]'

  - engine:
      - sh
      - bash
    source: |
      az network nsg rule list --nsg-name $nsg --resource-group $resourcegroup --query "[?direction=='Inbound' && access=='Allow' && protocol=='TCP' && (destinationPortRange=='22')]"

    matchers:
      - type: word
        words:
          - '"sourceAddressPrefix": "*"'
          - '"sourceAddressPrefix": "internet"'
          - '"sourceAddressPrefix": "any"'

    extractors:
      - type: dsl
        dsl:
          - 'nsg + " has unrestricted access on TCP port 22"'
