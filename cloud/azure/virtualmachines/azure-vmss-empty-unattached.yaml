id: azure-vmss-empty-unattached
info:
  name: Azure Virtual Machine Scale Sets Empty and Unattached（云安全）
  author: princechaddha
  severity: low
  description: 该规则用于检查 Azure virtualmachines 相关资源是否满足推荐的云安全与合规配置要求，命中通常表示当前配置仍存在可改进的风险项。
  impact: |
    - 当前配置偏离推荐的云安全基线，可能增加攻击面、审计缺口或运维失误带来的风险。
    - 具体影响取决于受影响资源的重要性、暴露范围以及周边安全控制是否到位。
  remediation: |
    - 参考云厂商安全基线和官方文档修正当前配置偏差。
    - 建议结合资源标签、自动化检测与周期性审计，持续跟踪该类风险项的整改状态。
  reference:
    - https://docs.microsoft.com/en-us/azure/virtual-machine-scale-sets/
  tags: cloud,devops,azure,microsoft,vmss,azure-cloud-config

flow: |
  code(1);
  for (let ScaleSetData of iterate(template.scaleSetList)) {
    ScaleSetData = JSON.parse(ScaleSetData);
    set("name", ScaleSetData.Name);
    set("resourceGroup", ScaleSetData.ResourceGroup);
    code(2);
  }

self-contained: true
code:
  - engine:
      - sh
      - bash
    source: |
      az vmss list --output json --query '[*].{"Name":name,"ResourceGroup":resourceGroup}'

    extractors:
      - type: json
        name: scaleSetList
        internal: true
        json:
          - '.[]'

  - engine:
      - sh
      - bash
    source: |
      az vmss list-instances --name "$name" --resource-group "$resourceGroup" --query '[*].id'

    matchers-condition: and
    matchers:
      - type: word
        words:
          - '[]'

    extractors:
      - type: dsl
        dsl:
          - 'name + " in " + resourceGroup + " is empty and unattached"'
