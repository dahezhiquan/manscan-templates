id: webmodule-ee-panel

info:
  name: Webmodule 登录面板识别（暴露面识别）
  author: pussycat0x,daffainfo
  severity: info
  description: 该模板通过识别 Webmodule 登录入口的页面标题、特征文本或重定向行为，判断目标是否暴露了对应的认证界面。若命中，说明该登录面板对外可访问，可用于暴露面梳理与后续安全评估。
  reference:
    - https://www.exploit-db.com/ghdb/7001
  classification:
    cvss-metrics: CVSS:3.0/AV:N/AC:L/PR:N/UI:N/S:U/C:N/I:N/A:N
    cwe-id: CWE-200
  metadata:
    max-request: 1
    shodan-query: title:"Webmodule"
    google-query: intitle:"Webmodule" inurl:"/webmodule-ee/login.seam" "Version"
  tags: edb,panel,webmodule-ee,login,discovery

http:
  - method: GET
    path:
      - "{{BaseURL}}/webmodule-ee/login.seam"

    matchers-condition: and
    matchers:
      - type: word
        words:
          - "<title>Webmodule</title>"

      - type: status
        status:
          - 200

    extractors:
      - type: regex
        part: body
        group: 1
        regex:
          - 'Version: ([0-9.]+)'
