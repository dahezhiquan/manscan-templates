id: hazelcast-management-exposure

info:
  name: Hazelcast 管理 Center 配置 暴露
  author: S3R4PH
  severity: medium
  description: |
    检测到 Hazelcast 管理 Center 配置 暴露。目标响应或文件中可能暴露配置、凭据、密钥、令牌、环境变量或历史记录等敏感信息，可能被用于进一步入侵。
  remediation: |
    - 立即移除公开文件中的敏感信息并轮换已暴露的凭据、密钥和令牌。
    - 使用安全的密钥管理方案，并阻止配置、日志和历史文件被 Web 直接访问。
  reference:
    - https://docs.hazelcast.com/imdg/latest/management-center/rest-api
  classification:
    cvss-metrics: CVSS:3.1/AV:N/AC:L/PR:N/UI:N/S:U/C:L/I:N/A:N
    cvss-score: 5.3
    cwe-id: CWE-306
  metadata:
    verified: true
    shodan-query: html:"hazelcast"
  tags: config,exposure,hazelcast

http:
  - method: GET
    path:
      - "{{BaseURL}}/hazelcast/rest/cluster"

    matchers-condition: and
    matchers:
      - type: word
        part: body
        words:
          - "memberVersion"
          - "members"
        condition: and

      - type: status
        status:
          - 200

    extractors:
      - type: regex
        name: cluster-uuids
        part: body
        group: 1
        regex:
          - '"uuid":"([^"]+)"'
