id: keybase-domain-owwnership-verification

info:
  name: Keybase 域名所有权验证检测
  author: rxerium
  severity: low
  description: |
    检测 keybase.txt 是否存在，该文件用于通过 Keybase 身份证明域名所有权。暴露该文件可帮助关联域名与 Keybase 身份信息。
  impact: |
    - well-known 策略或身份文件通常用于公开声明域名、应用、邮件、证书或身份关联。
    - 若内容过期、配置错误或非预期暴露，可能泄露组织关系、端点能力、用户标识或验证材料。
  remediation: |
    - 确认该 well-known 文件是否为业务或合规所需；非必要内容应删除或限制访问。
    - 定期检查文件内容是否准确、未过期且不包含敏感信息。
    - 对应用关联、邮件策略、证书验证和身份声明文件建立变更审计。
  reference:
    - https://book.keybase.io/account#proofs
  metadata:
    verified: true
    max-request: 1
    shodan-query: html:"keybase.txt"
  tags: keybase,identity,well-known,pgp,discovery,osint,misc,vuln

http:
  - method: GET
    path:
      - "{{BaseURL}}/.well-known/keybase.txt"

    matchers:
      - type: dsl
        dsl:
          - "status_code == 200 && contains(body, 'https://keybase.io/')"

    extractors:
      - type: regex
        name: keybase-username
        part: body
        regex:
          - "([a-zA-Z0-9_-]+) \\(https://keybase.io/[a-zA-Z0-9_-]+\\)"

      - type: regex
        name: pgp-message
        part: body
        regex:
          - "-----BEGIN PGP MESSAGE-----[\\s\\S]+?-----END PGP MESSAGE-----"
