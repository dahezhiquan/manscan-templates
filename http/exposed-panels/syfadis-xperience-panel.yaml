id: syfadis-xperience-panel

info:
  name: Syfadis Xperience 登录面板识别（暴露面识别）
  author: righettod
  severity: info
  description: |
    该模板通过识别 Syfadis Xperience 登录入口的页面标题、特征文本或重定向行为，判断目标是否暴露了对应的认证界面。若命中，说明该登录面板对外可访问，可用于暴露面梳理与后续安全评估。
  reference:
    - https://syfadis.fr/xperience
  metadata:
    verified: true
    max-request: 1
    fofa-query: title="Syfadis Xperience"
  tags: panel,syfadis,login,detect,discovery

http:
  - method: GET
    path:
      - "{{BaseURL}}/Directory/Login/Login.aspx"

    matchers:
      - type: dsl
        dsl:
          - 'status_code == 200'
          - 'contains_any(to_lower(body), "syfadis xperience", "syfadis.supervision.browsersupport") && contains(to_lower(body), "loginpage")'
        condition: and

    extractors:
      - type: regex
        part: body
        group: 1
        regex:
          - 'ajaxz/([0-9.]+)/Common'
