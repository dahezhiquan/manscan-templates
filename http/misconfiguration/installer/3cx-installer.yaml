id: 3cx-installer

info:
  name: 3CX Phone System 安装向导 Page 暴露
  author: DhiyaneshDk
  severity: high
  description: |
    检测到 3CX Phone System 安装向导 Page 暴露。该页面属于安装、初始化或配置向导流程，若对外暴露，攻击者可能完成初始化、创建管理员账户或重新配置目标系统。
  impact: |
    - 攻击者可能接管初始化流程、创建管理员账户或覆盖现有配置。
    - 暴露的安装页面可能导致系统被重新部署或植入恶意配置。
  remediation: |
    - 删除或限制安装向导、初始化页面和示例配置入口。
    - 完成部署后强制关闭安装流程，并为后台入口启用认证和访问控制。
  reference:
    - https://www.3cx.com/docs/manual/install/
    - https://www.3cx.com/
  classification:
    cwe-id: CWE-668
  metadata:
    verified: true
    max-request: 1
    vendor: 3cx
    product: 3cx
    shodan-query: http.title:"3CX Phone System Management Console"
    fofa-query: title="3CX Phone System Management Console"
  tags: 3cx,voip,exposure,misconfig,installer,panel

http:
  - method: GET
    path:
      - "{{BaseURL}}"

    host-redirects: true
    max-redirects: 2

    matchers-condition: and
    matchers:
      - type: word
        part: body
        words:
          - "3CX Configuration Tool"
          - "3CX Initial Setup"
          - "Welcome to the 3CX Management Console"
        condition: or

      - type: status
        status:
          - 200
