id: exposed-adb

info:
  name: Android Debug Bridge 暴露（服务漏洞）
  author: pdteam,pikpikcu
  severity: critical
  description: |
    Android Debug Bridge 是 Android 设备调试、文件传输和 shell 管理接口，通常不应暴露在不可信网络。若 TCP 5555 直接开放且未做授权控制，攻击者可能远程执行 ADB 命令；该模板发送 ADB CNXN 与 feature 查询报文，并通过 device/product 等返回字段确认 ADB 暴露。
  impact: |
    - 攻击者可能获得设备 shell、安装或卸载应用、读取文件、转发端口并进一步控制 Android 设备。
    - 对机顶盒、IoT 设备或移动终端而言，暴露 ADB 可能导致数据泄露、设备接管或被植入恶意程序。
  remediation: |
    - 关闭网络 ADB 调试，仅在受控 USB 或可信管理网络中临时启用。
    - 通过防火墙限制 TCP 5555 访问来源，清理已暴露设备上的未知应用、密钥和持久化项。
  reference:
    - https://doublepulsar.com/root-bridge-how-thousands-of-internet-connected-android-devices-now-have-no-security-and-are-b46a68cb0f20
    - https://www.hackeracademy.org/how-to-hack-android-device-with-adb-android-debugging-bridge
    - https://www.securezoo.com/2018/06/thousands-of-android-devices-leave-debug-port-5555-exposed/
  metadata:
    max-request: 1
  tags: network,adb,rce,android,exposure,tcp,discovery

tcp:
  - inputs:
      - data: "434e584e0100000100001000ea000000445b0000bcb1a7b1"  # Generated using https://github.com/projectdiscovery/network-fingerprint
        type: hex

      - data: ""
        type: hex

    host:
      - "{{Hostname}}"
    port: 5555

    matchers:
      - type: word
        words:
          - "device"
          - "product"
        condition: and
