id: samba-swat-panel

info:
  name: Samba SWAT 面板识别（暴露面识别）
  author: PR3R00T
  severity: info
  description: 该模板通过识别 Samba SWAT 面板、控制台或管理界面的页面特征，判断目标是否暴露了对应服务入口。若命中，说明该后台或运维界面对外可访问，可用于资产识别与暴露面排查。
  classification:
    cvss-metrics: CVSS:3.0/AV:N/AC:L/PR:N/UI:N/S:U/C:N/I:N/A:N
    cwe-id: CWE-200
    cpe: cpe:2.3:a:samba:samba:*:*:*:*:*:*:*:*
  metadata:
    max-request: 1
    vendor: samba
    product: samba
  tags: panel,samba,discovery

http:
  - method: GET
    path:
      - "{{BaseURL}}"

    matchers:
      - type: word
        words:
          - 'Basic realm="SWAT"'
        part: header
