id: insecure-powershell-execution-policy

info:
  name: PowerShell 执行策略不安全（本地基线扫描）
  author: JeonSungHyun[nukunga]
  severity: medium
  description: |
    PowerShell Execution Policy 过宽时，未签名或来自不可信来源的脚本更容易在终端上直接运行，削弱脚本执行管控。对应基线项为“PowerShell Execution Policy 是否设置为不安全级别”；模板枚举 PowerShell 各作用域 Execution Policy，发现 `Bypass` 或 `Unrestricted` 时判定脚本执行策略过宽。
  reference:
    - https://learn.microsoft.com/en-us/powershell/module/microsoft.powershell.core/about/about_execution_policies?view=powershell-7.4
  impact: |
    - 攻击者更容易通过 PowerShell 执行载荷、建立持久化或绕过传统防护。
  remediation: |
    - 将执行策略配置为 RemoteSigned、AllSigned 或组织认可的安全级别，并配合脚本日志。
  tags: windows,powershell,audit,code

self-contained: true

code:
  - pre-condition: |
      IsWindows();
    engine:
      - powershell
      - powershell.exe

    args:
      - -ExecutionPolicy
      - Bypass

    pattern: "*.ps1"

    source: |
      $policies = Get-ExecutionPolicy -List
      foreach ($p in $policies) {
        if ($p.ExecutionPolicy -in @("Bypass", "Unrestricted")) {
           Write-Output "Insecure Execution Policy found: $($p.Scope) - $($p.ExecutionPolicy)"
        }
      }

    matchers:
      - type: word
        words:
          - "Insecure Execution Policy found:"
