id: azure-custom-admin-role-unrestricted
info:
  name: Azure 自定义管理员角色权限过度宽泛（云安全）
  author: princechaddha
  severity: high
  description: Azure RBAC 自定义角色若在订阅或更高范围内授予通配操作权限，会形成接近管理员级别的控制面访问能力，偏离最小权限原则。该模板枚举自定义角色，读取 assignableScopes 与 permissions.actions，并在作用域包含根级路径且 actions 包含 * 时命中。
  impact: |
    - 被分配该角色的身份可能管理大量 Azure 资源，凭据泄露后会快速扩大为订阅级控制面风险。
    - 过宽自定义角色会削弱职责分离、审批边界和审计可解释性。
  remediation: |
    - 拆分自定义角色权限，仅保留业务必需的 resource provider 操作，避免使用 * 通配授权。
    - 将 assignableScopes 限制到必要的资源组或资源范围，并定期审计高权限自定义角色分配。
  reference:
    - https://docs.microsoft.com/en-us/azure/role-based-access-control/custom-roles
  metadata:
    vendor: microsoft
    product: azure-rbac
  tags: cloud,devops,azure,microsoft,role-based-access,azure-cloud-config

flow: |
  code(1);
  for (let RoleData of iterate(template.roleList)) {
    set("roleName", RoleData);
    code(2);
  }

self-contained: true
code:
  - engine:
      - sh
      - bash
    source: |
      az role definition list --custom-role-only true --output json --query '[].{roleName:roleName}'
    extractors:
      - type: json
        name: roleList
        internal: true
        json:
          - '.[]'

  - engine:
      - sh
      - bash
    source: |
      az role definition list --name "$roleName" --query '[*].{"assignableScopes":assignableScopes,"actions":permissions[].actions[]}' --output json

    matchers-condition: and
    matchers:
      - type: word
        words:
          - '"assignableScopes": "/'

      - type: word
        words:
          - '"actions": "*"'

    extractors:
      - type: dsl
        dsl:
          - 'roleName + " grants full administrative access and should not exist under POLP guidelines"'
