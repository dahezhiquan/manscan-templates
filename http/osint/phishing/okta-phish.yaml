id: okta-phish

info:
  name: Okta 仿冒钓鱼网站（钓鱼网站识别）
  author: rxerium
  severity: info
  description: |
    检测到疑似仿冒 Okta 的钓鱼网站。模板在目标页面返回 200、页面内容命中 Okta 的官方服务页面特征，且当前主机不属于 okta.com 官方域名时触发，用于识别借用 Okta 品牌页面诱导用户信任的仿冒站点。
  reference:
    - https://okta.com
  metadata:
    max-request: 1
  tags: phishing,okta,sso,osint,discovery
http:
  - method: GET
    path:
      - "{{BaseURL}}"

    host-redirects: true
    max-redirects: 2

    matchers-condition: and
    matchers:
      - type: word
        words:
          - "The Okta and Auth0 Platforms enable secure access, authentication, and automation — putting Identity at the heart of business security and growth."

      - type: status
        status:
          - 200

      - type: dsl
        dsl:
          - '!contains(host,"okta.com")'
