id: firewall-disabled

info:
  name: macOS 应用防火墙已禁用（本地基线扫描）
  author: geeknik
  severity: medium
  description: |
    该模板检查 macOS 应用防火墙是否关闭。防火墙关闭会减少对入站连接和应用网络访问的限制。
  impact: |
    关键 macOS 安全控制关闭会降低数据保护、应用校验或系统完整性防护能力。
  remediation: |
    启用 macOS 应用防火墙，并按需配置允许的入站应用。
  tags: macos,audit,local,security

self-contained: true

code:
  - engine:
      - sh
      - bash
    source: |
      /usr/libexec/ApplicationFirewall/socketfilterfw --getglobalstate
    matchers:
      - type: word
        words:
          - "Firewall is disabled. (State = 0)"
