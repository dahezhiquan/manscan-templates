id: exposed-zookeeper

info:
  name: Apache ZooKeeper 未认证访问（服务漏洞）
  author: pdteam
  severity: high
  description: |
    该模板检测 Apache ZooKeeper 是否允许未认证访问管理接口。命中说明节点状态、配置信息或协调数据可能被直接读取甚至修改。
  reference:
    - https://zookeeper.apache.org/security.html
    - https://zookeeper.apache.org/doc/r3.5.5/zookeeperAdmin.html#sc_zkCommands
    - https://github.com/h1thub/Unauthorized-zookeeper
  classification:
    cwe-id: CWE-306
  metadata:
    verified: true
    max-request: 2
    shodan-query: 'X-Powered-By: ZooKeeper'
    fofa-query: protocol="zookeeper"
  tags: network,zookeeper,unauth,exposure,tcp,discovery

flow: tcp(1) || tcp(2)

tcp:
  - inputs:
      - data: "envi\r\nquit\r\n"

    host:
      - "{{Hostname}}"
    port: 2181
    read-size: 2048

    matchers:
      - type: word
        words:
          - "zookeeper.version"

    extractors:
      - type: regex
        regex:
          - "zookeeper\\.version=([^\r\n]+)"

  - inputs:
      - data: "0000002d000000000000000000000000000075300000000000000000000000100000000000000000000000000000000000"
        type: hex
        read: 1024

      - data: "0000000e0000000100000008000000012f00"
        type: hex
        read: 4096

    host:
      - "{{Hostname}}"
    port: 2181

    matchers-condition: and
    matchers:
      - type: word
        part: raw
        words:
          - "zookeeper"

      - type: dsl
        dsl:
          - "len(raw) > 70"

    extractors:
      - type: regex
        part: raw
        regex:
          - "zookeeper"
