id: microsoft-ftp-detect

info:
  name: Microsoft FTP 服务 识别（服务漏洞）
  author: pussycat0x
  severity: info
  description: |
    该模板通过 FTP Banner、响应特征或协商行为识别目标是否运行 Microsoft 相关 FTP 服务实现。
  metadata:
    max-request: 1
    verified: true
    shodan-query: 'product:"Microsoft ftpd"'
  tags: network,ftp,sambar,detect,detection,tcp,discovery

tcp:
  - inputs:
      - data: 00000000
        type: hex

    host:
      - "{{Hostname}}"
    port: 21
    read-size: 1024

    matchers:
      - type: word
        part: body
        words:
          - "Microsoft FTP Service"
