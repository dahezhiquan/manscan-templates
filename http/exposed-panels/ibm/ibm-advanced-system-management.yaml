id: ibm-advanced-system-management

info:
  name: IBM Advanced System Management 面板识别（指纹识别）
  author: dhiyaneshDK,righettod
  severity: info
  description: |-
    检测到目标站点存在 IBM Advanced System Management 相关响应特征。IBM Advanced System Management 是监控、日志、分析或可观测性系统，用于展示运行指标、告警事件、日志数据和服务状态。模板请求 `/cgi-bin/cgi?form=1`、`/cgi-bin/cgi` 路径，并通过页面标题或正文关键字、状态码确认该系统指纹，用于资产识别、系统盘点和暴露面梳理。
  reference:
    - https://www.ibm.com/docs/en/power8/9080-MME?topic=operations-advanced-system-management
  classification:
    cvss-metrics: CVSS:3.0/AV:N/AC:L/PR:N/UI:N/S:U/C:N/I:N/A:N
    cwe-id: CWE-200
  metadata:
    max-request: 2
    verified: true
    shodan-query: title:"Advanced System Management"
    fofa-query: title="Advanced System Management"
  tags: panel,ibm,login,detect,discovery
http:
  - method: GET
    path:
      - '{{BaseURL}}/cgi-bin/cgi?form=1'
      - '{{BaseURL}}/cgi-bin/cgi'

    stop-at-first-match: true
    matchers-condition: and
    matchers:
      - type: word
        part: body
        words:
          - 'Advanced System Management'

      - type: status
        status:
          - 200

    extractors:
      - type: regex
        part: body
        group: 1
        regex:
          - '(?i)Update\s+Access\s+Key\s+Exp\s+Date\s+\(YYYY-MM-DD\):\s+([0-9\-]+)'
