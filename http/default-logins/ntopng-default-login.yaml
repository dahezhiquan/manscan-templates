id: ntopng-default-login

info:
  name: ntopng 默认口令登录（弱口令）
  author: 0x_Akoko
  severity: high
  description: |
    该模板用于检测 ntopng 是否仍可使用默认凭据或弱口令登录。模板主要向 `/`、`/authorize.html` 等认证入口发送请求，使用内置默认凭据组合进行认证尝试，并根据状态码、认证 Cookie、跳转位置或登录后的页面关键字判断登录是否成功；命中说明目标未及时修改出厂、示例或初始化账号口令。
  impact: |
    - 攻击者可登录 ntopng 管理接口，读取、导出或篡改数据、索引、队列、仓库、报表或媒体资源。
    - 若系统保存连接串、访问令牌或集成凭据，弱口令登录可能进一步造成业务数据泄露、权限扩大或服务中断。
  remediation: |
    - 立即修改默认账号口令，删除测试账号，并为管理员、服务账号和集成账号使用唯一强密码。
    - 启用细粒度权限控制、访问来源限制和审计日志，避免管理 API 或控制台直接对公网开放。
    - 检查数据导出、配置变更、令牌使用和异常查询记录，必要时轮换相关凭据。
  reference:
    - https://www.ntop.org/guides/ntopng/faq.html
    - https://www.ntop.org/guides/ntopng/api/rest/api_v2.html
  metadata:
    verified: true
    max-request: 3
    vendor: ntop
    product: ntopng
    shodan-query: 'http.title:"ntopng" port:3000'
    fofa-query: 'title="ntopng" && port="3000"'
  tags: ntopng,default-login,auth,vuln

variables:
  username: "admin"
  password: "admin"

flow: http(1) && http(2) && http(3)

http:
  - raw:
      - |
        GET / HTTP/1.1
        Host: {{Hostname}}

    extractors:
      - type: regex
        name: ntopng_check
        part: header
        internal: true
        regex:
          - 'Location:.*login\.lua'

  - raw:
      - |
        POST /authorize.html HTTP/1.1
        Host: {{Hostname}}
        Content-Type: application/x-www-form-urlencoded

        user={{username}}&password={{password}}&referer=%2F

    matchers:
      - type: dsl
        internal: true
        dsl:
          - 'status_code == 302'
          - '!contains(to_lower(header), "login.lua")'
        condition: and

  - raw:
      - |
        GET / HTTP/1.1
        Host: {{Hostname}}

    redirects: true
    max-redirects: 3
    matchers:
      - type: dsl
        dsl:
          - 'status_code == 200'
          - 'contains_all(body, "loggedUser = \"admin\"", "isAdministrator = true")'
        condition: and
