id: plesk-onyx-login

info:
  name: Plesk 登录面板识别（暴露面识别）
  author: dhiyaneshDK,daffainfo,righettod
  severity: info
  description: 该模板通过识别 Plesk 登录入口的页面标题、特征文本或重定向行为，判断目标是否暴露了对应的认证界面。若命中，说明该登录面板对外可访问，可用于暴露面梳理与后续安全评估。
  reference:
    - https://www.exploit-db.com/ghdb/6501
    - https://www.plesk.com/
  classification:
    cvss-metrics: CVSS:3.0/AV:N/AC:L/PR:N/UI:N/S:U/C:N/I:N/A:N
    cwe-id: CWE-200
    cpe: cpe:2.3:a:plesk:onyx:*:*:*:*:*:*:*:*
  metadata:
    verified: true
    max-request: 1
    vendor: plesk
    product: onyx
    shodan-query:
      - http.html:"Plesk Onyx" http.html:"plesk-build"
      - http.html:"plesk onyx" http.html:"plesk-build"
    google-query:
      - inurl:login_up.php "Plesk Onyx"
      - inurl:login_up.php "plesk onyx"
    fofa-query: body="plesk onyx" http.html:"plesk-build"
  tags: panel,plesk,login,edb,discovery

http:
  - method: GET
    path:
      - '{{BaseURL}}/login_up.php'

    matchers-condition: and
    matchers:
      - type: word
        part: body
        words:
          - 'alt="Plesk Onyx'
          - 'plesk-build'
          - 'plesk-revision'
          - 'plesk-root'
        condition: or
        case-insensitive: true

      - type: status
        status:
          - 200

    extractors:
      - type: regex
        part: body
        group: 1
        regex:
          - 'alt="Plesk Onyx ([0-9.]+)"'
          - '(?i)"urlArgs":"([0-9.-]+)"'
