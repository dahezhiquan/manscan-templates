id: dw-spectrum-digital-watchdog-panel

info:
  name: Digital Watchdog 识别（指纹识别）
  author: ritikchaddha
  severity: info
  description: |-
    检测到目标站点存在 Digital Watchdog 相关响应特征。Digital Watchdog 是网络设备或网关的 Web 管理界面，用于配置路由、无线、蜂窝接入、端口转发和设备运维参数。模板请求 `/static/images/favicon.ico`、`/static/customization/favicon.ico` 路径，并通过状态码、favicon 哈希、DSL 条件确认该系统指纹，用于资产识别、系统盘点和暴露面梳理。
  metadata:
    verified: true
    max-request: 2
    shodan-query: "http.favicon.hash:868509217"
    fofa-query: "icon_hash=\"868509217\""
  tags: digital-watchdog,panel,detect,login,dw,spectrum,discovery
http:
  - method: GET
    path:
      - "{{BaseURL}}/static/images/favicon.ico"
      - "{{BaseURL}}/static/customization/favicon.ico"

    stop-at-first-match: true

    matchers:
      - type: dsl
        dsl:
          - "status_code==200 && ('868509217' == mmh3(base64_py(body)))"
