id: tactical-rmm-panel

info:
  name: Tactical RMM 登录面板识别（指纹识别）
  author: johnk3r
  severity: info
  description: Tactical RMM 是远程监控与管理平台，用于终端代理、脚本、补丁和设备维护。该模板请求首页，并依据 HTTP 200 状态码、页面标题、正文关键字或品牌资源特征识别目标是否部署了该系统或暴露了对应入口，适用于资产指纹确认；命中结果仅表示系统特征匹配，不代表已确认存在未授权访问或可利用漏洞。
  classification:
    cwe-id: CWE-200
  metadata:
    verified: true
    max-request: 1
    shodan-query: http.title:"Tactical RMM - Login"
  tags: panel,tacticalrmm,login,detect,discovery

http:
  - method: GET
    path:
      - "{{BaseURL}}"

    matchers-condition: and
    matchers:
      - type: word
        part: body
        words:
          - "<title>Tactical RMM - Login"

      - type: status
        status:
          - 200
