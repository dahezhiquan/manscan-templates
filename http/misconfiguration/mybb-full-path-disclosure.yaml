id: mybb-full-path-disclosure

info:
  name: MyBB 完整路径泄露
  author: 0x_Akoko
  severity: low
  description: |
    检测到 MyBB 完整路径泄露。目标暴露了调试、错误或堆栈信息，可能泄露应用路径、框架版本、环境变量、源码位置或内部调用细节。
  reference:
    - https://mybb.com/
  metadata:
    verified: true
    max-request: 1
    shodan-query: http.html:"MyBB"
    fofa-query: body="Powered by MyBB"
  tags: mybb,misconfig,fpd

http:
  - method: GET
    path:
      - "{{BaseURL}}/inc/cachehandlers/disk.php"

    matchers:
      - type: dsl
        dsl:
          - 'status_code == 200'
          - 'contains_all(body, "Fatal error", "Uncaught Error")'
        condition: and
