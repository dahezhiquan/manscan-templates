id: schneider-modicon-340-detect

info:
  name: Schneider Electric Modicon 340 Series PLC 识别（服务漏洞）
  author: biero-el-corridor
  severity: info
  description: |
    该模板通过工业协议指纹识别目标是否运行 Schneider Electric Modicon 340 Series PLC 相关设备或控制系统。
  metadata:
    verified: true
    shodan-query: port:502 "P34"
  tags: ics,schenider,modicon,detect,network

tcp:
  - inputs:
      - data: "000000000005002b0e0200"
        type: hex
        read: 200
        name: info
      - data: "000100000004005a0002"
        type: hex
        read: 200
        name: note

    host:
      - "{{Hostname}}"
    port: 502
    read-size: 1024

    matchers-condition: and
    matchers:
      - type: word
        part: note
        words:
          - "BMX P34"

      - type: word
        part: info
        words:
          - "Schneider Electric"
