id: roundcube-installer-exposure

info:
  name: Roundcube Webmail 安装向导 暴露
  author: theamanrawat
  severity: high
  description: |
    检测到 Roundcube Webmail 安装向导 暴露。该页面属于安装、初始化或配置向导流程，若对外暴露，攻击者可能完成初始化、创建管理员账户或重新配置目标系统。
  reference:
    - https://roundcube.net/
    - https://github.com/roundcube/roundcubemail/wiki/Installation
  metadata:
    verified: true
    max-request: 2
  tags: roundcube,webmail,installer,config,misconfig,exposure

http:
  - method: GET
    path:
      - "{{BaseURL}}/installer/"
      - "{{BaseURL}}/installer/index.php?_step=2"

    matchers:
      - type: dsl
        dsl:
          - 'status_code == 200'
          - 'contains_all(body, "Roundcube Webmail Installer", "wiki/Installation", "General configuration")'
        condition: and
