id: kubernetes-version

info:
  name: Kubernetes 版本 Exposure 指纹识别（指纹识别）
  author: raesene,idealphase
  severity: info
  description: 用于识别目标是否部署 Kubernetes 版本 Exposure 并提取相关版本或构建信息，模板会结合特定路径或已知端点和版本或标识提取结果进行指纹匹配。
  reference:
    - https://cloud.google.com/kubernetes-engine/docs/release-notes
    - https://docs.aws.amazon.com/eks/latest/userguide/kubernetes-versions.html
  metadata:
    max-request: 1
    shodan-query: product:"Kubernetes" version:"1.21.5-eks-bc4871b"
  tags: tech,k8s,kubernetes,devops,discovery

http:
  - method: GET
    path:
      - "{{BaseURL}}/version"

    matchers:
      - type: word
        words:
          - "gitVersion"
          - "goVersion"
          - "platform"
        condition: and

    extractors:
      - type: json
        json:
          - '.gitVersion'
