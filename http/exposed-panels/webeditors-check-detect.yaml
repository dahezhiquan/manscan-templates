id: webeditors-check-detect

info:
  name: Web Editor Check 面板暴露（暴露面识别）
  author: princechaddha,bernardofsr,gy741
  severity: low
  description: Web Editor Check 是在线编辑器或文件管理组件检测入口，用于识别 CKEditor 等编辑器相关资源暴露。该模板请求 `{{paths}}`，并依据页面标题、正文关键字或品牌资源特征判断目标是否对外暴露了 Web Editor Check 的面板，用于发现互联网可访问的后台、控制台或业务入口。
  impact: "- 暴露的 Web Editor Check 面板会泄露目标正在使用的产品、部署路径、页面特征或组织业务入口，便于攻击者进行指纹确认和漏洞匹配。\n- 如果认证、访问控制或默认凭据策略薄弱，攻击者可能进一步尝试进入后台，影响后台配置、业务数据、用户账号或设备运行状态。\n- 对互联网开放的管理入口会增加暴力破解、凭据填充、已知漏洞利用和钓鱼仿冒的攻击面。"
  remediation: "- 将 Web Editor Check 的面板限制在内网、VPN、零信任代理或专用管理网段访问，避免直接暴露在互联网。\n- 启用强密码、多因素认证、登录失败限制和审计告警，排查默认账号、弱口令及长期未使用账号。\n- 保持 Web Editor Check 及其依赖组件更新到受支持版本，并通过反向代理、ACL 或防火墙限制敏感路径访问。"
  classification:
    cvss-metrics: CVSS:3.0/AV:N/AC:L/PR:N/UI:N/S:U/C:N/I:N/A:N
    cwe-id: CWE-200
    cpe: cpe:2.3:a:ckeditor:ckeditor:*:*:*:*:drupal:*:*:*
  metadata:
    max-request: 17
    vendor: ckeditor
    product: ckeditor
    shodan-query: cpe:"cpe:2.3:a:ckeditor:ckeditor"
  tags: panel,webeditors,ckeditor,discovery

http:
  - method: GET
    path:
      - "{{BaseURL}}{{paths}}"
    payloads:
      paths:
        - "/fckeditor/_samples/default.html"
        - "/fckeditor/editor/filemanager/connectors/uploadtest.html"
        - "/ckeditor/samples/"
        - "/editor/ckeditor/samples/"
        - "/ckeditor/samples/sample_posteddata.php"
        - "/editor/ckeditor/samples/sample_posteddata.php"
        - "/fck/editor/dialog/fck_spellerpages/spellerpages/server-scripts/spellchecker.php"
        - "/fckeditor/editor/dialog/fck_spellerpages/spellerpages/server-scripts/spellcheckder.php"
        - "/plugin/editor/smarteditor2/SmartEditor2Skin.html"
        - "/js/se2/SmartEditor2.html"
        - "/nse/SmartEditor2.html"
        - "/SmartEditor2.html"
        - "/apps/ckeditor/samples/old/replacebyclass.html"
        - "/plugin/editor/ckeditor/samples/old/replacebyclass.html"
        - "/latest/samples/old/replacebyclass.html"
        - "/Content/ckeditor/samples/old/replacebyclass.html"
        - "/ckeditor/samples/plugins/htmlwriter/outputhtml.html"

    matchers:
      - type: word
        words:
          - "<title>FCKeditor"
          - "<title>CKEditor Samples</title>"
          - "http://ckeditor.com</a>"
          - "Custom Uploader URL:"
          - "init_spell()"
          - "'tip':'"
          - ":: Smart Editor 2"
          - "Replace Textareas by Class Name"
          - "CKEditor - The text editor for the Internet"
        condition: or
