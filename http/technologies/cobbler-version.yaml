id: cobbler-version

info:
  name: Cobbler 版本 指纹识别（指纹识别）
  author: c-sh0
  severity: info
  description: Cobbler 版本 是 Linux 安装和配置管理平台，用于系统装机、PXE、仓库和配置自动化。该模板请求 `/cobbler_api`，并依据 HTTP 200 状态码、页面标题、正文关键字或品牌资源特征识别目标是否使用或暴露了 Cobbler 版本 相关组件，适用于资产盘点、技术栈识别和后续安全评估；命中结果仅表示指纹特征匹配，不代表已确认存在可利用漏洞。
  metadata:
    max-request: 1
  tags: tech,cobbler,api,discovery

http:
  - method: POST
    path:
      - "{{BaseURL}}/cobbler_api"

    body: |
      <?xml version='1.0'?>
      <methodCall>
      <methodName>extended_version</methodName>
      <params></params>
      </methodCall>

    headers:
      Content-Type: text/xml

    matchers-condition: and
    matchers:
      - type: status
        status:
          - 200

      - type: word
        part: body
        words:
          - '<name>version</name>'

    extractors:
      - type: regex
        part: body
        group: 1
        regex:
          - "<value><string>([0-9]{1,3}.[0-9]{1,3}.[0-9]{1,3})</string></value>"
