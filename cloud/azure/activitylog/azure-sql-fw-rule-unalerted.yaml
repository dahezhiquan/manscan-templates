id: azure-sql-fw-rule-unalerted
info:
  name: Azure SQL Server 防火墙规则变更告警未配置（云安全）
  author: princechaddha
  severity: high
  description: Azure SQL Server 防火墙规则创建、更新或删除会直接改变数据库网络访问边界；未配置 Activity Log 告警时，公网放行和来源范围变化可能不被及时发现。该模板枚举已启用的 Activity Log Alert，并检查 condition 是否缺少 Microsoft.Sql/servers/firewallRules/write 操作条件。
  impact: |
    - 恶意或错误规则可能允许互联网或非可信网络访问数据库，增加暴力破解和数据窃取风险。
    - 删除合法规则也可能造成业务中断，并掩盖对数据库访问边界的恶意调整。
  remediation: |
    - 创建针对 SQL Server 防火墙规则写入操作的 Activity Log Alert，并接入数据库安全告警流程。
    - 禁止使用宽泛公网来源，优先采用私有网络、Private Link 和最小来源范围，并审计规则变更。
  reference:
    - https://docs.microsoft.com/en-us/azure/azure-monitor/platform/alerts-activity-log
  metadata:
    vendor: microsoft
    product: azure-monitor
  tags: cloud,devops,azure,microsoft,mssql,azure-cloud-config

flow: |
  code(1);
  for (let AlertData of iterate(template.alertList)) {
    set("id", AlertData);
    code(2);
  }

self-contained: true
code:
  - engine:
      - sh
      - bash
    source: |
      az monitor activity-log alert list --output json --query '[?(enabled==`true`)].id'

    extractors:
      - type: json
        name: alertList
        internal: true
        json:
          - '.[]'

  - engine:
      - sh
      - bash
    source: |
      az monitor activity-log alert show --ids "$id" --query 'condition'

    matchers-condition: and
    matchers:
      - type: word
        words:
          - '"field": "operationName"'

      - type: word
        words:
          - "Microsoft.Sql/servers/firewallRules/write"
        negative: true

    extractors:
      - type: dsl
        dsl:
          - 'id + " does not have the correct alert configuration for Create/Update/Delete SQL Server Firewall Rule events"'
