id: rubrik-panel

info:
  name: Rubrik - 登录面板（暴露面识别）
  author: rxerium
  severity: info
  description: |-
    已检测到 Rubrik 设备 Web 管理登录面板。Rubrik 提供数据保护、备份、恢复及网络弹性能力。
  reference:
    - https://www.rubrik.com/
  metadata:
    max-request: 1
    shodan-query: http.title:"Rubrik" -hostname:"my.rubrik.com"
  tags: panel,rubrik,backup,storage,login

http:
  - method: GET
    redirects: true
    max-redirects: 2
    path:
      - "{{BaseURL}}"

    matchers-condition: and
    matchers:
      - type: word
        part: body
        words:
          - '<title>Rubrik</title>'
          - 'ng-app="rubrikApp"'
        condition: and

      - type: status
        status:
          - 200
