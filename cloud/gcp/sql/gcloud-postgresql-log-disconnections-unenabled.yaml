id: gcloud-postgresql-log-disconnections-unenabled

info:
  name: Log Disconnections Flag 未Enabled 的PostgreSQL Instances（云安全）
  author: princechaddha
  severity: medium
  description: PostgreSQL log_disconnections 可记录会话断开信息，便于追踪连接生命周期和异常断连。本模板检查 Cloud SQL PostgreSQL 实例 databaseFlags 中 log_disconnections 的值，匹配 off 时报告未启用断连日志。
  impact: |
    - 异常断连、短连接风暴或可疑连接行为缺少完整记录，影响安全调查和稳定性分析。
    - 无法准确关联连接开始和结束时间，降低审计和资源消耗分析质量。
  remediation: |
    - 启用 log_disconnections，并与 log_connections 配合记录 PostgreSQL 会话生命周期。
    - 将连接日志纳入集中分析，配置异常断连、连接量突增和来源异常告警。
  reference:
    - https://cloud.google.com/sql/docs/postgres/flags
  metadata:
    vendor: google
    product: cloud-sql
  tags: cloud,devops,gcp,gcloud,google-cloud-sql,postgresql,gcp-cloud-config

flow: |
  code(1)
  for(let projectId of iterate(template.projectIds)){
    set("projectId", projectId)
    code(2)
    for(let sqlInstance of iterate(template.sqlInstances)){
      set("sqlInstance", sqlInstance)
      code(3)
    }
  }

self-contained: true

code:
  - engine:
      - sh
      - bash
    source: |
      gcloud projects list --format="json(projectId)"

    extractors:
      - type: json
        name: projectIds
        internal: true
        json:
          - '.[].projectId'

  - engine:
      - sh
      - bash
    source: |
      gcloud sql instances list --project $projectId --filter='DATABASE_VERSION:POSTGRES*' --format="json(name)"

    extractors:
      - type: json
        name: sqlInstances
        internal: true
        json:
          - '.[].name'

  - engine:
      - sh
      - bash
    source: |
      gcloud sql instances describe $sqlInstance --project $projectId --format=json | jq '.settings.databaseFlags[]? | select(.name=="log_disconnections") | .value'

    matchers:
      - type: word
        words:
          - 'off'

    extractors:
      - type: dsl
        dsl:
          - '"Log Disconnections flag is not enabled for PostgreSQL instance " + sqlInstance + " in project: " + projectId'
