id: ssh-weakkey-exchange-algo

info:
  name: SSH 弱密钥交换算法启用（服务漏洞）
  author: pussycat0x
  severity: low
  description: |
    目标 SSH 服务启用了安全性不足的密钥交换算法，可能降低会话密钥协商强度。模板枚举 KEX 算法列表，并在发现弱密钥交换算法时确认配置风险。
  impact: |
    - 弱密钥交换算法会降低 SSH 会话密钥协商强度。
    - 攻击者可能在特定网络位置结合降级或离线分析削弱远程管理会话安全性。
  remediation: |
    - 禁用弱 KEX 算法，仅保留符合安全基线的密钥交换算法。
    - 更新 SSH 服务端配置并重启服务，逐步淘汰不兼容的旧客户端。
  reference:
    - https://www.tenable.com/plugins/nessus/153953
  metadata:
    verified: true
    max-request: 2
    shodan-query: product:"OpenSSH"
  tags: js,enum,ssh,misconfig,network,vuln

javascript:
  - pre-condition: |
      isPortOpen(Host,Port);
    code: |
      let m = require("nuclei/ssh");
      let c = m.SSHClient();
      let response = c.ConnectSSHInfoMode(Host, Port);
      Export(response);
    args:
      Host: "{{Host}}"
      Port: "22"

    matchers-condition: and
    matchers:
      - type: word
        words:
          - "ServerKex"

      - type: word
        words:
          - "diffie-hellman-group-exchange-sha1"
          - "diffie-hellman-group1-sha1"
          - "gss-gex-sha1"
          - "gss-group1-sha1"
          - "gss-group14-sha1"
          - "rsa1024-sha1"
        condition: or
