id: emqx-default-login

info:
  name: Emqx 默认管理员登录（弱口令）
  author: For3stCo1d
  severity: high
  description: |
    该模板用于检测 Emqx 是否仍可使用默认凭据或弱口令登录。模板主要向 `{变量}` 等认证入口发送请求，使用内置默认凭据组合进行认证尝试，并根据响应中的 `body == "{\"code\":0}"`、`status_code == 200` 等登录成功特征判断登录是否成功；命中说明目标未及时修改出厂、示例或初始化账号口令。
  impact: |
    - 攻击者可使用默认凭据登录 Emqx，获得与该账号对应的管理或业务权限。
    - 成功登录后可能进一步查看敏感信息、修改配置、创建账号、调用管理接口，或以该系统为入口访问内网其他资源。
  remediation: |
    - 立即修改或禁用默认账号，要求所有账户使用高强度唯一密码。
    - 将登录入口限制在可信网络范围内，并启用多因素认证、登录失败限制和异常登录告警。
    - 审计近期登录、配置变更和账号新增记录，必要时轮换相关密钥、令牌和业务凭据。
  classification:
    cvss-metrics: CVSS:3.0/AV:N/AC:L/PR:N/UI:N/S:C/C:L/I:L/A:L
    cvss-score: 8.3
    cwe-id: CWE-522
  metadata:
    max-request: 1
    shodan-query: http.favicon.hash:"-670975485"
  tags: emqx,default-login,vuln

variables:
  username: "admin"
  password: "public"

http:
  - raw:
      - |
        POST {{path}} HTTP/1.1
        Host: {{Hostname}}
        Content-Type: application/json

        {"username":"{{username}}","password":"{{password}}"}

    attack: clusterbomb
    payloads:
      path:
        - "/api/v4/auth"
        - "/api/v5/login"

    matchers-condition: or
    matchers:
      - type: dsl
        dsl:
          - body == "{\"code\":0}"
          - status_code == 200
        condition: and

      - type: dsl
        dsl:
          - contains(body, "\"token\":") && contains(body, "\"license\":")
          - contains(content_type, 'application/json')
          - status_code == 200
        condition: and
