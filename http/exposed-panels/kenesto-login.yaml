id: kenesto-login

info:
  name: Kenesto - Login Detect 面板识别（指纹识别）
  author: pussycat0x
  severity: info
  description: |-
    检测到目标站点存在 Kenesto - Login Detect 相关响应特征。Kenesto - Login Detect 是监控、日志、分析或可观测性系统，用于展示运行指标、告警事件、日志数据和服务状态。模板请求 `/Kenesto/Account/LogOn?ReturnUrl=%2fkenesto`，并通过页面标题或正文关键字、状态码确认该系统指纹，用于资产识别、系统盘点和暴露面梳理。
  reference:
    - https://www.kenesto.com/
  classification:
    cvss-metrics: CVSS:3.1/AV:N/AC:L/PR:N/UI:N/S:U/C:N/I:N/A:N
    cwe-id: CWE-200
  metadata:
    max-request: 1
    fofa-query: app="kenesto"
  tags: login,tech,kenesto,panel,discovery
http:
  - method: GET
    path:
      - "{{BaseURL}}/Kenesto/Account/LogOn?ReturnUrl=%2fkenesto"

    matchers-condition: and
    matchers:
      - type: word
        part: body
        words:
          - '<title>Welcome To Kenesto&reg;</title>'
        condition: and

      - type: status
        status:
          - 200
