id: line-phish

info:
  name: LINE 仿冒钓鱼网站（钓鱼网站识别）
  author: rxerium
  severity: info
  description: |
    检测到疑似仿冒 LINE 的钓鱼网站。模板在目标页面返回 200、页面内容命中 LINE 的品牌页面特征，且当前主机不属于 line.me 官方域名时触发，用于识别借用 LINE 品牌页面诱导用户信任的仿冒站点。
  reference:
    - https://line.me
  metadata:
    max-request: 1
  tags: phishing,line,osint,discovery
http:
  - method: GET
    path:
      - "{{BaseURL}}"

    host-redirects: true
    max-redirects: 2

    matchers-condition: and
    matchers:
      - type: word
        words:
          - "メッセンジャーアプリを超え、新しいコミュニケーションの形を目指して、新時代のインフラ体験をLINEはひとりひとりに届けていきます。"

      - type: status
        status:
          - 200

      - type: dsl
        dsl:
          - '!contains(host,"line.me")'
