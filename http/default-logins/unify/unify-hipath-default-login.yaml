id: unify-hipath-default-login

info:
  name: Unify HiPath Cordless IP 默认口令登录（弱口令）
  author: FLX
  severity: high
  description: |
    该模板通过尝试 Unify HiPath Cordless IP 的默认账号口令，并依据认证成功后的响应特征判断目标是否仍在使用未修改的弱口令。若命中，攻击者可直接登录系统，进一步访问敏感信息、修改配置或执行未授权操作。
  impact: |
    - 攻击者可未授权进入 Unify HiPath Cordless IP 管理中心，并修改该服务下挂设备的关键配置。
  remediation: |
    - 立即将默认密码修改为高强度且唯一的管理员口令。
  reference:
    - https://wiki.unify.com/images/d/dd/HiPath_Cordless_IP_V1,_Administrator_Documentation.pdf
  classification:
    cvss-metrics: CVSS:3.0/AV:N/AC:L/PR:N/UI:N/S:C/C:L/I:L/A:L
    cvss-score: 8.3
    cwe-id: CWE-522
    cpe: cpe:2.3:a:unify:hipath:*:*:*:*:*:*:*:*
  metadata:
    verified: true
    max-request: 2
    product: hipath
    vendor: unify
  tags: default-login,unify,hipath,vuln

http:
  - method: GET
    path:
      - "{{BaseURL}}"

    matchers:
      - type: word
        part: body
        words:
          - "/html/wbm_login.html"

  - raw:
      - |
        POST /cgi-bin/ikon_button.exe?page=1500&button=51&line=0&eventid=0&WbmSessionId=nosession&Username={{user}}&Password={{pass}}&CountryCode=en&NoSessionTimeout=false&SwitchLanguage=false HTTP/1.1
        Host: {{Hostname}}

    attack: pitchfork
    payloads:
      user:
        - Unify
      pass:
        - 1q21q2

    matchers-condition: and
    matchers:
      - type: status
        status:
          - 200

      - type: word
        part: body
        words:
          - "{\"success\":true"
          - "There is another user logged in"
        condition: or
