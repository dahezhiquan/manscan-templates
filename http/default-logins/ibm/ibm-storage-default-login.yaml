id: ibm-storage-default-login

info:
  name: IBM Storage Management 默认口令登录（弱口令）
  author: madrobot
  severity: high
  description: 该模板通过尝试 IBM Storage Management 的默认管理员账号口令，并依据认证成功后的响应特征判断目标是否仍在使用未修改的弱口令。若命中，攻击者通常可直接获得后台管理权限，进一步访问敏感信息、修改配置或执行未授权操作。
  reference:
    - https://www.ibm.com/docs/en/power-sys-solutions/0008-ESS?topic=5148-starting-elastic-storage-server-management-server-gui
  classification:
    cvss-metrics: CVSS:3.0/AV:N/AC:L/PR:N/UI:N/S:C/C:L/I:L/A:L
    cvss-score: 8.3
    cwe-id: CWE-522
  metadata:
    max-request: 1
  tags: default-login,ibm,storage,vuln

http:
  - raw:
      - |
        POST /0/Authenticate HTTP/1.1
        Host: {{Hostname}}
        Origin: {{BaseURL}}
        Content-Type: application/x-www-form-urlencoded

        j_username={{username}}&j_password={{password}}&continue=&submit=submit+form

    payloads:
      username:
        - admin
      password:
        - admin
    attack: pitchfork

    matchers-condition: and
    matchers:
      - type: word
        words:
          - "/0/Console"
          - "Property of IBM"
        condition: and
        part: body

      - type: word
        words:
          - "JSESSIONID"
        part: header

      - type: status
        status:
          - 200
