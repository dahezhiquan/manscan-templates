id: fuelcms-default-login

info:
  name: Fuel CMS 默认管理员账户发现（弱口令）
  author: Adam Crosser
  severity: high
  description: |
    该模板用于检测 Fuel CMS 是否仍可使用默认凭据或弱口令登录。模板主要向 `/fuel/login` 等认证入口发送请求，使用内置默认凭据组合进行认证尝试，并根据响应中的 `/fuel/dashboard`、`fuel_(.*)=` 等登录成功特征判断登录是否成功；命中说明目标未及时修改出厂、示例或初始化账号口令。
  impact: |
    - 攻击者可登录 Fuel CMS 后台，管理内容、用户、插件、主题、文件或站点配置。
    - 后台权限被滥用后，可能导致页面篡改、恶意文件上传、敏感资料泄露，或进一步取得服务器执行能力。
  remediation: |
    - 立即修改默认管理员凭据，删除安装向导、演示账号和不必要的后台用户。
    - 限制后台登录入口访问来源，启用多因素认证、登录失败锁定和验证码等防护。
    - 检查近期内容、插件、主题、文件上传和管理员操作记录，确认没有持久化后门。
  reference:
    - https://docs.getfuelcms.com/general/security
  classification:
    cvss-metrics: CVSS:3.0/AV:N/AC:L/PR:N/UI:N/S:C/C:L/I:L/A:L
    cvss-score: 8.3
    cwe-id: CWE-522
  metadata:
    max-request: 2
  tags: fuelcms,default-login,oss,vuln

http:
  - raw:
      - |
        GET /fuel/login HTTP/1.1
        Host: {{Hostname}}
      - |
        POST /fuel/login HTTP/1.1
        Host: {{Hostname}}
        Content-Type: application/x-www-form-urlencoded

        user_name={{username}}&password={{password}}&Login=Login&forward=&ci_csrf_token_FUEL={{csrftoken}}

    attack: pitchfork
    payloads:
      username:
        - admin
      password:
        - admin

    matchers-condition: and
    matchers:
      - type: word
        part: header
        words:
          - "/fuel/dashboard"

      - type: regex
        part: header
        regex:
          - 'fuel_(.*)='

      - type: status
        status:
          - 302

    extractors:
      - type: regex
        part: body
        name: csrftoken
        internal: true
        group: 1
        regex:
          - 'id="ci_csrf_token_FUEL" value="([0-9a-z]+)" \/>'
