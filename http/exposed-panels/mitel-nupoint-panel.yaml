id: mitel-nupoint-panel

info:
  name: Mitel NuPoint Unified Messaging 面板识别（指纹识别）
  author: s4e-io
  severity: info
  description: |-
    检测到目标站点存在 Mitel NuPoint Unified Messaging 相关响应特征。Mitel NuPoint Unified Messaging 是 AI、机器学习或 Notebook 相关平台，用于管理模型、数据集、工作区、实验、推理服务或训练任务。模板请求 `/npm-admin/showLoginPage.do`，并通过页面标题或正文关键字、状态码、DSL 条件确认该系统指纹，用于资产识别、系统盘点和暴露面梳理。
  metadata:
    verified: true
    max-request: 1
    vendor: mitel
    product: micollab
    shodan-query:
      - http.html:"mitel networks"
      - http.favicon.hash:"-1922044295"
      - http.html:"micollab end user portal"
    fofa-query:
      - body="mitel networks"
      - '"micollab end user portal" && title=="redirecting..."'
      - body="micollab end user portal"
      - icon_hash="-1922044295"
  tags: panel,mitel,nupoint-unified-messaging,detect,discovery
http:
  - method: GET
    path:
      - "{{BaseURL}}/npm-admin/showLoginPage.do"

    host-redirects: true
    matchers:
      - type: dsl
        dsl:
          - 'contains(body, "<title>NuPoint Unified Messaging - Login</title>")'
          - "status_code == 200"
        condition: and
