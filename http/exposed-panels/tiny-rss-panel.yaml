id: tiny-rss-panel

info:
  name: Tiny RSS 登录面板识别（指纹识别）
  author: userdehghani
  severity: info
  description: |-
    Tiny RSS 是自托管 RSS 阅读器，用于订阅源、文章、过滤器和用户阅读管理。该模板请求首页，并依据 DSL 条件识别目标是否部署了该系统或暴露了对应入口，适用于资产指纹确认；命中结果仅表示系统特征匹配，不代表已确认存在未授权访问或可利用漏洞。
  reference:
  - https://tt-rss.org/
  classification:
    cpe: cpe:2.3:a:tt-rss:tiny_tiny_rss:*:*:*:*:*:*:*:*
  metadata:
    verified: true
    max-request: 1
    vendor: tt-rss
    product: tiny_tiny_rss
    shodan-query: http.favicon.hash:-418614327
  tags: panel,tiny-rss,login,detect,discovery

http:
  - method: GET
    path:
      - "{{BaseURL}}"

    matchers:
      - type: dsl
        dsl:
          - 'status_code==200'
          - 'contains_any(body, "Tiny Tiny RSS", "ttrss_login", "ttrss_utility")'
        condition: and
