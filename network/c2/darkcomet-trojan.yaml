id: darkcomet-trojan

info:
  name: DarkComet 木马识别（服务漏洞）
  author: pussycat0x
  severity: info
  description: 该模板通过协议特征或已知指纹识别目标是否与 DarkComet 木马相关的命令控制流量相匹配。
  reference:
    - https://github.com/montysecurity/C2-Tracker/blob/main/tracker.py
  metadata:
    verified: true
    max-request: 1
    shodan-query: product:'DarkComet Trojan'
  tags: network,c2,ir,osint,cti,darkcomet,tcp,vuln

tcp:
  - inputs:
      - data: 2E
        type: hex

    host:
      - "{{Hostname}}"
    port: 1604
    read-size: 1024

    matchers:
      - type: word
        words:
          - "BF7CAB464EFB"
