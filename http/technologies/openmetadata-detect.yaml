id: openmetadata-detect

info:
  name: OpenMetadata 指纹识别（指纹识别）
  author: icarot
  severity: info
  description: >-
    OpenMetadata 是数据目录和元数据管理平台，用于发现、治理和协作管理数据资产。该模板通过请求目标服务并检查预设路径或首页响应、页面正文关键字、状态码等指纹特征，判断目标是否使用或暴露了
    OpenMetadata 相关组件；命中结果仅表示指纹特征匹配，可用于资产盘点、技术栈识别和后续安全评估，不代表已确认存在可利用漏洞。
  reference:
  - https://github.com/open-metadata/OpenMetadata
  classification:
    cpe: cpe:2.3:a:open-metadata:openmetadata:1.7.0:*:*:*:*:*:*:*
  metadata:
    max-request: 1
    vendor: open-metadata
    product: openmetadata
    fofa-query: title="OpenMetadata"
    shodan-query: title:"OpenMetadata"
  tags: tech,openmetadata,detect,discovery
http:
  - method: GET
    path:
      - "{{BaseURL}}"

    host-redirects: true
    max-redirects: 2

    matchers-condition: and
    matchers:
      - type: word
        words:
          - '<title>OpenMetadata'
          - 'content="OpenMetadata'
          - '/openmetadata.bundle'
        condition: or
        case-insensitive: true

      - type: status
        status:
          - 200
          - 404
