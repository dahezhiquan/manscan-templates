id: automatisch-panel

info:
  name: Automatisch 面板识别（暴露面识别）
  author: rxerium
  severity: info
  description: |
    该模板通过识别 Automatisch 面板、控制台或管理界面的页面特征，判断目标是否暴露了对应服务入口。若命中，说明该后台或运维界面对外可访问，可用于资产识别与暴露面排查。
  reference:
    - https://automatisch.io/
    - https://github.com/automatisch/automatisch
  metadata:
    verified: true
    max-request: 2
    shodan-query: title:"Automatisch"
  tags: panel,automatisch,detect,discovery

http:
  - method: GET
    path:
      - "{{BaseURL}}"
      - "{{BaseURL}}/login"

    stop-at-first-match: true

    matchers-condition: and
    matchers:
      - type: word
        words:
          - '<title>Automatisch'

      - type: status
        status:
          - 200
