id: laravel-eol

info:
  name: Laravel End-of-Life 指纹识别（指纹识别）
  author: Shivam Kamboj
  severity: info
  description: |
    用于识别目标是否部署 Laravel End-of-Life 并提取相关版本或构建信息，模板会结合 HTTP 响应头、页面正文、特定路径或已知端点和版本或标识提取结果进行指纹匹配。
  reference:
    - https://endoflife.date/laravel
    - https://laravel.com/docs/releases
  metadata:
    verified: true
    max-requests: 4
    product: laravel
    vendor: laravel
    fofa-query: "x-laravel-version"
  tags: tech,laravel,eol,framework

http:
  - method: GET
    path:
      - "{{BaseURL}}"
      - "{{BaseURL}}/composer.json"
      - "{{BaseURL}}/composer.lock"

    redirects: true
    stop-at-first-match: true

    matchers-condition: and
    matchers:
      - type: dsl
        name: eol-version-detected
        dsl:
          - "compare_versions(version, '<= 11.51.0')"

      - type: dsl
        dsl:
          - 'contains(tolower(body), "laravel")'
          - 'contains_any(tolower(header), "x-powered-by", "x-laravel-version")'
        condition: or

    extractors:
      - type: regex
        name: version
        group: 1
        part: header
        regex:
          - '(?i)x-powered-by:\s*Laravel[/\s]+([0-9]+\.[0-9]+(?:\.[0-9]+)?)'
          - '(?i)x-laravel-version:\s*([0-9]+\.[0-9]+(?:\.[0-9]+)?)'

      - type: regex
        name: version
        group: 1
        part: body
        regex:
          - '"laravel/framework":\s*"\^([0-9]+\.[0-9]+)'
          - '&quot;laravelVersion&quot;:&quot;([0-9.]+)&quot;'
