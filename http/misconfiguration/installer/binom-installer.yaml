id: binom-installer

info:
  name: Binom 安装向导 暴露
  author: tess
  severity: high
  description: |
    检测到 Binom 安装向导 暴露。该页面属于安装、初始化或配置向导流程，若对外暴露，攻击者可能完成初始化、创建管理员账户或重新配置目标系统。
  metadata:
    verified: true
    max-request: 2
    shodan-query: title:"Install Binom"
  tags: misconfig,binom,install,exposure,vuln

http:
  - method: GET
    path:
      - '{{BaseURL}}/'
      - '{{BaseURL}}/?page=step_1'

    stop-at-first-match: true

    matchers-condition: and
    matchers:
      - type: word
        part: body
        words:
          - '<title>Install Binom</title>'
          - 'System check'
        condition: and

      - type: status
        status:
          - 200
