id: api-abstract-vat-validation-rates

info:
  name: Abstract API VAT Validation Rates Token 可用性校验（token喷洒）
  author: daffainfo
  severity: info
  description: 该模板通过调用 Abstract VAT Validation API 验证提供的 token 是否有效，命中后通常表示可访问 VAT 校验与税率查询能力。
  reference:
    - https://www.abstractapi.com/api/vat-validation-rates-api
    - https://github.com/daffainfo/all-about-apikey/tree/main/abstract-vat-validation-rates
  metadata:
    max-request: 1
  tags: token-spray,abstractapi

self-contained: true

http:
  - method: GET
    path:
      - "https://vat.abstractapi.com/v1/?api_key={{token}}&vat_number=SE556656688001"

    matchers:
      - type: word
        part: body
        words:
          - '"vat_number":'
          - '"is_vat_valid":'
          - '"company_name":'
        condition: and
