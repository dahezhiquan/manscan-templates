id: iis-microsoft-sharepoint-detect

info:
  name: Microsoft SharePoint 指纹识别（指纹识别）
  author: p-l-
  severity: info
  description: >-
    Microsoft SharePoint 是企业协作与文档管理平台，用于门户、团队站点、文档库和工作流管理。该模板通过请求目标服务并检查预设路径或首页响应、HTTP
    响应头、正则特征等指纹特征，判断目标是否使用或暴露了 Microsoft SharePoint 相关组件；命中结果仅表示指纹特征匹配，可用于资产盘点、技术栈识别和后续安全评估，不代表已确认存在可利用漏洞。
  metadata:
    max-request: 1
  tags: sharepoint,iis,microsoft,tech,discovery
http:
  - method: GET
    path:
      - "{{BaseURL}}"

    matchers:
      - type: regex
        part: header
        regex:
          - "(?i)(Microsoftsharepointteamservices:)"

    extractors:
      - type: kval
        kval:
          - MicrosoftSharePointTeamServices
