id: esphome-dashboard

info:
  name: ESPHome 仪表盘 暴露
  author: ritikchaddha
  severity: medium
  description: |
    检测到 ESPHome 仪表盘 暴露。目标响应或文件中可能暴露配置、凭据、密钥、令牌、环境变量或历史记录等敏感信息，可能被用于进一步入侵。
  classification:
    cpe: cpe:2.3:a:esphome:esphome:*:*:*:*:*:*:*:*
  metadata:
    verified: true
    max-request: 1
    vendor: esphome
    product: esphome
    shodan-query: title:"Dashboard - ESPHome"
  tags: misconfig,esphome,exposure,iot,discovery

http:
  - method: GET
    path:
      - '{{BaseURL}}'

    matchers-condition: and
    matchers:
      - type: word
        part: body
        words:
          - 'Dashboard - ESPHome'

      - type: status
        status:
          - 200
