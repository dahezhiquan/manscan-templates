id: null-session-allowed

info:
  name: 允许空会话访问（本地基线扫描）
  author: princechaddha
  severity: high
  description: |
    该模板检查 NullSessionPipes 等配置是否允许空会话。空会话会向未认证访问者暴露命名管道或资源。
  impact: |
    攻击者可未认证枚举系统信息并辅助后续攻击。
  remediation: |
    清理 NullSessionPipes 配置，禁用空会话访问并启用匿名访问限制。
  tags: windows,null-session,code,windows-audit

self-contained: true

code:
  - pre-condition: |
      IsWindows();
    engine:
      - powershell
      - powershell.exe
    args:
      - -ExecutionPolicy
      - Bypass
    pattern: "*.ps1"
    source: |
      if ((Get-ItemProperty -Path 'HKLM:\SYSTEM\CurrentControlSet\Services\LanmanServer\Parameters' -Name 'NullSessionPipes').NullSessionPipes.Count -gt 0) { "Null sessions are allowed" }

    matchers:
      - type: word
        words:
          - "Null sessions are allowed"
