id: openreplay-rum-detect

info:
  name: OpenReplay RUM 指纹识别（指纹识别）
  author: Shivam Kamboj
  severity: info
  description: >-
    OpenReplay 是开源会话回放和前端监控平台，RUM 组件用于采集用户行为、性能和错误数据。该模板通过请求目标服务并检查预设路径或首页响应、DSL 条件、正则特征等指纹特征，判断目标是否使用或暴露了
    OpenReplay RUM 相关组件；命中结果仅表示指纹特征匹配，可用于资产盘点、技术栈识别和后续安全评估，不代表已确认存在可利用漏洞。
  reference:
  - https://github.com/openreplay/openreplay
  - https://docs.openreplay.com/en/sdk/
  metadata:
    max-request: 1
    verified: true
    shodan-query: http.html:"static.openreplay.com"
  tags: tech,discovery,rum,openreplay
http:
  - method: GET
    path:
      - "{{BaseURL}}/"

    redirects: true
    max-redirects: 3

    matchers-condition: and
    matchers:
      - type: dsl
        dsl:
          - "status_code >= 200 && status_code < 400"
          - "contains(tolower(all_headers), 'text/html')"
        condition: and

      - type: regex
        part: body
        name: sdk_implementation
        regex:
          - "static\\.openreplay\\.com/(?:latest|[0-9.]+)/openreplay\\.js"
          - "projectKey[\"']?\\s*:\\s*[\"'][A-Za-z0-9]{10,}[\"']"
          - "ingestPoint[\"']?\\s*:\\s*[\"']https?://[^\"']+/ingest[\"']"
          - "[a-z0-9-]+\\.openreplay\\.cloud/ingest"
          - "window\\.OpenReplay\\s*=\\s*\\["
          - "openReplay\\s*:\\s*\\{\\s*projectKey"
          - "window\\.asayer\\s*=\\s*\\["
          - "asayer\\.io/ingest"
        condition: or
