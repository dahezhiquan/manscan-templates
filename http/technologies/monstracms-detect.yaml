id: monstracms-detect

info:
  name: Monstra CMS 指纹识别（指纹识别）
  author: ritikchaddha
  severity: info
  description: >-
    Monstra CMS 是轻量级 PHP 内容管理系统，用于构建小型网站和内容页面。该模板通过请求目标服务并检查预设路径或首页响应、页面正文关键字、状态码、正则特征等指纹特征，判断目标是否使用或暴露了
    Monstra CMS 相关组件；命中结果仅表示指纹特征匹配，可用于资产盘点、技术栈识别和后续安全评估，不代表已确认存在可利用漏洞。
  reference:
  - https://github.com/monstra-cms/monstra/
  metadata:
    verified: true
    max-request: 1
    shodan-query: http.favicon.hash:419828698
    product: monstra_cms
    vendor: monstra
    fofa-query: icon_hash=419828698
  tags: tech,monstra,monstracms,discovery
http:
  - method: GET
    path:
      - "{{BaseURL}}"

    host-redirects: true
    max-redirects: 2

    matchers-condition: and
    matchers:
      - type: word
        part: body
        words:
          - 'content="Powered by Monstra'

      - type: status
        status:
          - 200

    extractors:
      - type: regex
        part: body
        group: 1
        regex:
          - 'content="Powered by Monstra ([0-9.]+)'
