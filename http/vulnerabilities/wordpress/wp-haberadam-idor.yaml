id: wp-haberadam-idor

info:
  name: WordPress Themes Haberadam JSON API - IDOR and Path Disclosure
  author: pussycat0x
  severity: low
  description: |
    该模板用于检测 WordPress Themes Haberadam JSON API - IDOR and Path Disclosure。该类漏洞通常源于对象标识、记录编号或资源路径缺少服务端权限校验，攻击者可直接访问不属于自己的数据。模板会向 `/wp-content/themes/haberadam/api/mobile-info.php?id=`、`/blog/wp-content/themes/haberadam/api/mobile-info.php?id=` 等位置发送探测请求，并结合响应状态、关键字、错误信息、时间差或外带交互等证据判断目标是否受影响。
  impact: |
    - 攻击者可能枚举或篡改其他用户、订单、文件、工单等业务对象。
    - 在敏感业务系统中，IDOR 可能导致批量数据泄露、越权操作或权限边界被绕过。
  remediation: |
    - 对每个对象访问在服务端执行所属关系和权限校验，避免仅依赖前端隐藏或不可预测 ID。
    - 使用间接引用、访问控制列表和细粒度授权策略保护敏感资源。
    - 审计异常枚举、越权访问和批量导出行为，并修复受影响接口。
  reference:
    - https://cxsecurity.com/issue/WLB-2021090078
  metadata:
    max-request: 2
    google-query: inurl:/wp-content/themes/haberadam/
  tags: wordpress,idor,wp-theme,disclosure,vuln

http:
  - method: GET
    path:
      - '{{BaseURL}}/wp-content/themes/haberadam/api/mobile-info.php?id='
      - '{{BaseURL}}/blog/wp-content/themes/haberadam/api/mobile-info.php?id='

    stop-at-first-match: true

    matchers-condition: and
    matchers:
      - type: word
        part: body
        words:
          - '"status"'
          - '"hava"'
          - '"degree"'
          - '"icon"'
        condition: and

      - type: status
        status:
          - 200

      - type: word
        part: header
        words:
          - text/html
