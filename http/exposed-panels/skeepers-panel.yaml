id: skeepers-panel

info:
  name: Skeepers 登录面板识别（指纹识别）
  author: righettod
  severity: info
  description: |-
    Skeepers 是客户体验和评价管理平台，用于用户反馈、营销内容和客户互动管理。该模板请求 `/backend/login`、首页，并依据 DSL 条件识别目标是否部署了该系统或暴露了对应入口，适用于资产指纹确认；命中结果仅表示系统特征匹配，不代表已确认存在未授权访问或可利用漏洞。
  reference:
  - https://skeepers.io
  metadata:
    verified: true
    max-request: 2
    shodan-query: http.title:"Skeepers"
  tags: panel,skeepers,login,detect,discovery

http:
  - method: GET
    path:
      - "{{BaseURL}}/backend/login"
      - "{{BaseURL}}"

    stop-at-first-match: true

    matchers:
      - type: dsl
        dsl:
          - 'status_code == 200'
          - 'contains(to_lower(body), "skeepers") && contains(to_lower(body), "login")'
        condition: and

    extractors:
      - type: regex
        part: body
        group: 1
        regex:
          - 'Version\s+([0-9\.]+)\s+-'
