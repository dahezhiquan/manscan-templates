id: atlassian-bamboo-panel

info:
  name: Atlassian Bamboo 登录面板识别（暴露面识别）
  author: righettod
  severity: info
  description: |
    该模板通过识别 Atlassian Bamboo 登录入口的页面标题、特征文本或重定向行为，判断目标是否暴露了对应的认证界面。若命中，说明该登录面板对外可访问，可用于暴露面梳理与后续安全评估。
  reference:
    - https://www.atlassian.com/software/bamboo
  classification:
    cpe: cpe:2.3:a:atlassian:bamboo:*:*:*:*:*:*:*:*
  metadata:
    verified: true
    max-request: 1
    vendor: atlassian
    product: bamboo
    shodan-query: http.title:"Bamboo"
  tags: panel,bamboo,login,detect,discovery

http:
  - method: GET
    path:
      - "{{BaseURL}}/userlogin!doDefault.action?os_destination=%2Fstart.action"

    matchers-condition: and
    matchers:
      - type: word
        part: body
        words:
          - '<title>Log in as a Bamboo user'
          - 'content="Bamboo'
          - 'atlassian.bamboo.plugins'
          - 'Atlassian Bamboo</a>'
        condition: or

      - type: status
        status:
          - 200

    extractors:
      - type: regex
        part: body
        group: 1
        regex:
          - 'version\s+([0-9A-Za-z\s\.]+)\s+-'
          - 'pvpVersion = "([a-z0-9.]+)";'
