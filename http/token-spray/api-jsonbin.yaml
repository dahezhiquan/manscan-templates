id: api-jsonbin

info:
  name: JSONBin API Token 可用性校验（token喷洒）
  author: daffainfo
  severity: info
  description: 该模板通过调用 JSONBin API 的已知接口验证提供的 token 是否有效，命中后通常表示可访问数据管理与集成能力。
  reference:
    - https://jsonbin.io/api-reference
    - https://github.com/daffainfo/all-about-apikey/tree/main/jsonbin
  metadata:
    max-request: 1
  tags: token-spray,jsonbin

self-contained: true

http:
  - raw:
      - |
        GET https://api.jsonbin.io/v3/c HTTP/1.1
        Host: api.jsonbin.io
        X-Master-key: {{token}}

    matchers:
      - type: word
        part: body
        words:
          - '"record"'
          - '"collectionMeta"'
          - '"schemaDocId"'
        condition: and
