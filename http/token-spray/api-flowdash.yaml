id: api-flowdash

info:
  name: Flowdash API Token 可用性校验（token喷洒）
  author: daffainfo
  severity: info
  description: 该模板通过调用 Flowdash API 的已知接口验证提供的 token 是否有效，命中后通常表示可访问相关 API 能力。
  reference:
    - https://docs.flowdash.com/docs/api-introduction
    - https://github.com/daffainfo/all-about-apikey/tree/main/flowdash
  metadata:
    max-request: 1
  tags: token-spray,flowdash

self-contained: true

http:
  - raw:
      - |
        GET https://app.flowdash.com/api/v1/workflows HTTP/1.1
        Host: app.flowdash.com
        Authorization: Bearer {{token}}

    matchers:
      - type: word
        part: body
        words:
          - '"id":'
          - '"name":'
        condition: and
