id: cas-login

info:
  name: CAS 登录面板识别（暴露面识别）
  author: pdteam
  severity: info
  description: 该模板通过识别 CAS 登录入口的页面标题、特征文本或重定向行为，判断目标是否暴露了对应的认证界面。若命中，说明该登录面板对外可访问，可用于暴露面梳理与后续安全评估。
  classification:
    cvss-metrics: CVSS:3.0/AV:N/AC:L/PR:N/UI:N/S:U/C:N/I:N/A:N
    cwe-id: CWE-200
    cpe: cpe:2.3:a:apereo:central_authentication_service:*:*:*:*:*:*:*:*
  metadata:
    max-request: 1
    vendor: apereo
    product: central_authentication_service
    shodan-query:
      - http.title:'CAS - Central Authentication Service'
      - http.title:'cas - central authentication service'
    github: https://github.com/apereo/cas
    fofa-query: title='cas - central authentication service'
    google-query: intitle:'cas - central authentication service'
  tags: apereo,cas,panel,login,discovery

http:
  - method: GET
    path:
      - "{{BaseURL}}/cas/login"

    host-redirects: true
    max-redirects: 2
    matchers:
      - type: word
        words:
          - 'Central Authentication Service'
