id: riseup-panel

info:
  name: Rise Up 登录面板识别（暴露面识别）
  author: righettod
  severity: info
  description: 该模板通过识别 Rise Up 登录入口的页面标题、特征文本或重定向行为，判断目标是否暴露了对应的认证界面。若命中，说明该登录面板对外可访问，可用于暴露面梳理与后续安全评估。
  reference:
    - https://www.riseup.ai/en/
  classification:
    cvss-metrics: CVSS:3.0/AV:N/AC:L/PR:N/UI:N/S:U/C:N/I:N/A:N
    cwe-id: CWE-200
  metadata:
    verified: true
    max-request: 1
  tags: panel,riseup,discovery

http:
  - method: GET
    path:
      - "{{BaseURL}}/Account/login"

    matchers-condition: and
    matchers:
      - type: word
        part: body
        words:
          - "cfg.envRiseUp"
          - "imgresize.riseup.ai"
          - "content.riseup.ai"
        condition: or

      - type: word
        part: body
        words:
          - "login-page"

      - type: status
        status:
          - 200
