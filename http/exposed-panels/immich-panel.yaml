id: immich-panel

info:
  name: Immich 面板识别（暴露面识别）
  author: rxerium
  severity: info
  description: |
    该模板通过识别 Immich 面板、控制台或管理界面的页面特征，判断目标是否暴露了对应服务入口。若命中，说明该后台或运维界面对外可访问，可用于资产识别与暴露面排查。
  reference:
    - https://immich.app/
    - https://github.com/immich-app/immich
  metadata:
    verified: true
    max-request: 1
    shodan-query: http.favicon.hash:-43504595
  tags: panel,immich,detect,discovery

http:
  - method: GET
    path:
      - "{{BaseURL}}/auth/login"

    matchers-condition: and
    matchers:
      - type: word
        words:
          - '<title>Login - Immich'
          - '"PUBLIC_IMMICH_'
          - 'alt="Immich Logo'
          - 'Welcome to Immich'
        condition: or

      - type: status
        status:
          - 200
