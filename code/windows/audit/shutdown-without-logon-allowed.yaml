id: shutdown-without-logon-allowed

info:
  name: 系统允许未登录关机（本地基线扫描）
  author: princechaddha
  severity: medium
  description: |
    该模板检查系统是否允许在未登录状态下关机。该配置可被本地人员造成服务中断。
  impact: |
    攻击者或未授权人员可关闭系统，造成拒绝服务。
  remediation: |
    仅允许已登录且授权用户执行关机操作。
  tags: windows,shutdown,logon,code,windows-audit

self-contained: true

code:
  - pre-condition: |
      IsWindows();
    engine:
      - powershell
      - powershell.exe
    args:
      - -ExecutionPolicy
      - Bypass
    pattern: "*.ps1"
    source: |
      Get-ItemProperty -Path 'HKLM:\SOFTWARE\Microsoft\Windows\CurrentVersion\Policies\System' -Name 'ShutdownWithoutLogon'

    matchers:
      - type: word
        words:
          - "shutdownwithoutlogon : 1"
