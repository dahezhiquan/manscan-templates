id: pbootcms-detect

info:
  name: PbootCMS 指纹识别（指纹识别）
  author: princechaddha,daffainfo
  severity: info
  description: >-
    PbootCMS 是 PHP 内容管理系统，用于企业网站、内容发布和模板化站点建设。该模板通过请求目标服务并检查预设路径或首页响应、页面正文关键字、正则特征等指纹特征，判断目标是否使用或暴露了
    PbootCMS 相关组件；命中结果仅表示指纹特征匹配，可用于资产盘点、技术栈识别和后续安全评估，不代表已确认存在可利用漏洞。
  reference:
  - https://www.pbootcms.com/
  classification:
    cpe: cpe:2.3:a:pbootcms:pbootcms:*:*:*:*:*:*:*:*
  metadata:
    verified: true
    max-request: 1
    vendor: pbootcms
    product: pbootcms
    shodan-query: http.html:"PbootCMS"
  tags: tech,pbootcms,discovery
http:
  - method: GET
    path:
      - "{{BaseURL}}"

    matchers-condition: or
    matchers:
      - type: word
        part: body
        words:
          - 'content="PbootCMS'

      - type: regex
        regex:
          - '<title>PbootCMS(.*)</title>'

    extractors:
      - type: regex
        part: body
        group: 1
        regex:
          - 'title="(.*)正式发布">'
