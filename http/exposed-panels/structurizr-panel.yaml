id: structurizr-panel

info:
  name: Structurizr 登录面板识别（指纹识别）
  author: DhiyaneshDk
  severity: info
  description: Structurizr 是软件架构建模平台，用于 C4 模型、架构文档和团队协作设计。该模板请求首页、`/signin`，并依据 HTTP 200 状态码、页面标题、正文关键字或品牌资源特征识别目标是否部署了该系统或暴露了对应入口，适用于资产指纹确认；命中结果仅表示系统特征匹配，不代表已确认存在未授权访问或可利用漏洞。
  classification:
    cvss-metrics: CVSS:3.0/AV:N/AC:L/PR:N/UI:N/S:U/C:N/I:N/A:N
    cwe-id: CWE-200
    cpe: cpe:2.3:a:structurizr:on-premises_installation:*:*:*:*:*:*:*:*
  metadata:
    verified: true
    max-request: 2
    vendor: structurizr
    product: on-premises_installation
    shodan-query: http.favicon.hash:1199592666
    fofa-query: icon_hash=1199592666
  tags: panel,structurizr,detect,discovery

http:
  - method: GET
    path:
      - "{{BaseURL}}"
      - "{{BaseURL}}/signin"

    host-redirects: true
    max-redirects: 2
    stop-at-first-match: true

    matchers-condition: and
    matchers:
      - type: word
        part: body
        words:
          - '<title>Structurizr'
          - 'alt="Structurizr'
          - 'structurizrBackground'
        condition: or

      - type: status
        status:
          - 200
