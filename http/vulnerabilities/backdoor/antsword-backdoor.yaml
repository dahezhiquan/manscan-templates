id: antsword-backdoor

info:
  name: AntSword 后门检测
  author: ffffffff0x
  severity: critical
  description: |
    该模板用于检测 AntSword 后门检测。命中通常表示目标存在后门、植入组件、恶意脚本或可疑未授权入口。模板主要向 `/.antproxy.php` 等路径发送探测请求，并根据响应中的 `951d11e51392117311602d0c25435d7f` 等特征确认漏洞是否存在。
  impact: |
    - 命中通常表示目标存在后门、植入组件或可疑恶意脚本，攻击者可能已具备未授权访问能力。
    - 后门可能被用于执行命令、窃取数据、维持持久化访问或作为进一步入侵的跳板。
  remediation: |
    - 立即隔离受影响资产，保留证据并开展入侵排查，不要仅删除单个可疑文件后恢复上线。
    - 清理后门文件、恶意脚本、异常账号、计划任务和持久化项，并从可信介质重建受影响组件。
    - 升级相关产品，轮换系统、数据库、应用和第三方集成凭据。
  reference:
    - https://github.com/AntSwordProject/AntSword-Labs/tree/master/bypass_disable_functions/9
  classification:
    cvss-metrics: CVSS:3.1/AV:N/AC:L/PR:N/UI:N/S:C/C:H/I:H/A:H
    cvss-score: 10
    cwe-id: CWE-553
  metadata:
    max-request: 1
  tags: backdoor,antsword,vuln

http:
  - method: POST
    path:
      - "{{BaseURL}}/.antproxy.php"

    headers:
      Content-Type: application/x-www-form-urlencoded

    body: 'ant=echo md5("antproxy.php");'

    matchers-condition: and
    matchers:
      - type: word
        part: body
        words:
          - "951d11e51392117311602d0c25435d7f"

      - type: status
        status:
          - 200
