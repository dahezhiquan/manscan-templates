id: atlassian-bamboo-cicd-detect

info:
  name: Bamboo 指纹识别（指纹识别）
  author: bhutch
  severity: info
  description: |-
    Bamboo 是 Atlassian 持续集成与部署平台，用于构建计划、测试、制品和发布流水线。该模板请求首页，并依据 DSL 条件识别目标是否使用或暴露了 Bamboo 相关组件，适用于资产盘点、技术栈识别和后续安全评估；命中结果仅表示指纹特征匹配，不代表已确认存在可利用漏洞。
  classification:
    cpe: cpe:2.3:a:atlassian:bamboo:*:*:*:*:*:*:*:*
  metadata:
    verified: true
    max-request: 1
    vendor: atlassian
    product: bamboo
    shodan-query: http.favicon.hash:-1379982221
    category: devops
  tags: tech,bamboo,atlassian,detect,cicd,discovery

http:
  - method: GET
    path:
      - "{{BaseURL}}"

    redirects: true
    matchers:
      - type: dsl
        dsl:
          - contains(to_lower(body), "<title>log into atlassian - atlassian bamboo</title>")
          - contains(to_lower(body), "meta name=\"application-name\" content=\"bamboo\" />")

    extractors:
      - type: regex
        name: version
        group: 1
        regex:
          - '(?i)atlassian bamboo</a> version (.*) -'
