id: skyscanner-phish

info:
  name: Skyscanner 仿冒钓鱼网站（钓鱼网站识别）
  author: rxerium
  severity: info
  description: |
    检测到疑似仿冒 Skyscanner 的钓鱼网站。模板在目标页面返回 200、页面内容命中 Skyscanner 的品牌页面特征，且当前主机不属于 skyscanner.net 官方域名时触发，用于识别借用 Skyscanner 品牌页面诱导用户信任的仿冒站点。
  reference:
    - https://skyscanner.net
  metadata:
    max-request: 1
  tags: phishing,skyscanner,osint,discovery
http:
  - method: GET
    path:
      - "{{BaseURL}}"

    host-redirects: true
    max-redirects: 2

    matchers-condition: and
    matchers:
      - type: word
        words:
          - 'Compare Cheap Flights &amp; Book Airline Tickets to Everywhere | Skyscanner'

      - type: status
        status:
          - 200

      - type: dsl
        dsl:
          - '!contains(host,"skyscanner.net")'
