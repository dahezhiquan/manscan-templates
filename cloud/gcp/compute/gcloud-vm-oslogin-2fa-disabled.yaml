id: gcloud-vm-oslogin-2fa-disabled

info:
  name: OS Login 使用2FA Authentication 未Enabled 的VM Instances（云安全）
  author: princechaddha
  severity: high
  description: OS Login 2FA 可为 Compute Engine SSH 登录增加二次验证，降低单一账号凭据泄露后的风险。本模板枚举 VM 并检查 enable-oslogin-2fa 元数据，值为 FALSE 或缺失时报告实例未启用 OS Login 2FA。
  impact: |
    - 攻击者获得用户凭据或 SSH 访问路径后，缺少二次验证会降低登录防护强度。
    - 管理员访问无法完全纳入强认证基线，增加高权限 SSH 会话被滥用的概率。
  remediation: |
    - 在项目或实例级元数据中启用 enable-oslogin-2fa，并确保用户账号已配置两步验证。
    - 结合 OS Login、IAM 角色和最小权限管理 SSH 访问，清理绕过强认证的项目级 SSH key。
  reference:
    - https://cloud.google.com/compute/docs/oslogin/set-up-oslogin
  metadata:
    vendor: google
    product: compute-engine
  tags: cloud,devops,gcp,gcloud,compute,security,2fa,gcp-cloud-config

flow: |
  code(1)
  for(let projectId of iterate(template.projectIds)){
    set("projectId", projectId)
    code(2)
    for(let instance of iterate(template.instances)){
      instance = JSON.parse(instance)
      set("instanceName", instance.name)
      set("zone", instance.zone)
      code(3)
    }
  }

self-contained: true

code:
  - engine:
      - sh
      - bash
    source: |
      gcloud projects list --format="json(projectId)"

    extractors:
      - type: json
        name: projectIds
        internal: true
        json:
          - '.[].projectId'

  - engine:
      - sh
      - bash
    source: |
      gcloud compute instances list --project $projectId --format="json[](name,zone.basename())"

    extractors:
      - type: json
        name: instances
        internal: true
        json:
          - '.[]'

  - engine:
      - sh
      - bash
    source: |
      gcloud compute instances describe $instanceName --zone $zone --project $projectId --format="json(metadata.items)" | jq '.items[]? | select(.key=="enable-oslogin-2fa") | .value // "null"'

    matchers:
      - type: word
        words:
          - "FALSE"
          - "null"
        condition: or

    extractors:
      - type: dsl
        dsl:
          - '"OS Login with 2FA authentication is not enabled for VM instance " + instanceName + " in zone " + zone + " of project " + projectId'
