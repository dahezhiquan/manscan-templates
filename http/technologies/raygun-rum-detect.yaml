id: raygun-rum-detect

info:
  name: Raygun RUM 指纹识别（指纹识别）
  author: Shivam Kamboj
  severity: info
  description: |
    用于识别目标是否使用 Raygun RUM，模板会结合 HTTP 响应头、页面正文和特定路径或已知端点进行技术指纹匹配。
  reference:
    - https://raygun.com/
  metadata:
    max-request: 1
    verified: true
    vendor: raygun
    product: raygun4js
    shodan-query: http.html:"cdn.raygun.io"
    fofa-query: body="cdn.raygun.io/raygun4js" || body="RaygunObject"
  tags: tech,discovery,rum,raygun

http:
  - method: GET
    path:
      - "{{BaseURL}}"

    host-redirects: true
    max-redirects: 3

    matchers-condition: and
    matchers:
      - type: word
        part: header
        words:
          - "text/html"

      - type: dsl
        dsl:
          - "!contains(body, 'markdown-body')"
          - "!contains(body, 'blob-code')"
        condition: and

      - type: regex
        part: body
        regex:
          - "(?m)^[^/\\n]*rg4js\\s*\\(\\s*['\"]apiKey['\"]"
          - "(?m)^[^/\\n]*rg4js\\s*\\(\\s*['\"]enableCrashReporting['\"]\\s*,\\s*(?:true|!)"
          - "(?m)^[^/\\n]*rg4js\\s*\\(\\s*['\"]enableRealUserMonitoring['\"]\\s*,\\s*true"
        condition: or
