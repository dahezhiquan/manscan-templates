id: livehelperchat-admin-panel

info:
  name: Live Helper Chat Admin 登录面板识别（暴露面识别）
  author: ritikchaddha
  severity: info
  description: 该模板通过识别 Live Helper Chat Admin 登录入口的页面标题、特征文本或重定向行为，判断目标是否暴露了对应的认证界面。若命中，说明该登录面板对外可访问，可用于暴露面梳理与后续安全评估。
  classification:
    cvss-metrics: CVSS:3.0/AV:N/AC:L/PR:N/UI:N/S:U/C:N/I:N/A:N
    cwe-id: CWE-200
    cpe: cpe:2.3:a:livehelperchat:live_helper_chat:*:*:*:*:*:*:*:*
  metadata:
    verified: true
    max-request: 1
    vendor: livehelperchat
    product: live_helper_chat
    shodan-query:
      - title:"Live Helper Chat"
      - http.title:"live helper chat"
    fofa-query:
      - title="Live Helper Chat"
      - title="live helper chat"
    google-query: intitle:"live helper chat"
  tags: livehelperchat,panel,discovery

http:
  - method: GET
    path:
      - "{{BaseURL}}/site_admin/user/login"

    matchers-condition: and
    matchers:
      - type: word
        part: body
        words:
          - "Live Helper Chat"
          - "Please login"
        condition: and

      - type: status
        status:
          - 200
