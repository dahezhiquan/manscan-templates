id: pfsense-default-login

info:
  name: pfSense 默认管理员凭据（弱口令）
  author: 0x_Akoko
  severity: high
  description: |
    该模板用于检测 pfSense 是否仍可使用默认凭据或弱口令登录。模板主要向 `/index.php` 等认证入口发送请求，使用内置默认凭据组合进行认证尝试，并根据状态码、认证 Cookie、跳转位置或登录后的页面关键字判断登录是否成功；命中说明目标未及时修改出厂、示例或初始化账号口令。
  impact: |
    - 攻击者可接管 pfSense 的 Web 管理界面，查看设备状态、网络配置、运行日志或敏感业务参数。
    - 被接管的网络、工控、打印、视频、存储或远程管理设备可能被用于中断业务、改变访问策略、窃取流量或作为内网横向移动入口。
  remediation: |
    - 立即修改所有默认账号口令，禁用不再使用的出厂账号，并为管理账户设置高强度唯一密码。
    - 将设备管理入口限制在 VPN、堡垒机或可信管理网段内，避免直接暴露到公网。
    - 升级设备固件或管理组件，审计近期登录记录、配置变更和异常会话。
  reference:
    - https://docs.netgate.com/pfsense/en/latest/
  metadata:
    verified: true
    max-request: 2
    vendor: netgate
    product: pfsense
    shodan-query: 'http.title:"pfSense"'
    fofa-query: 'title="pfSense"'
  tags: default-login,pfsense,firewall,network

variables:
  username: "admin"
  password: "pfsense"

flow: http(1) && http(2)

http:
  - raw:
      - |
        GET /index.php HTTP/1.1
        Host: {{Hostname}}
        Accept: text/html

    matchers:
      - type: dsl
        internal: true
        dsl:
          - 'status_code == 200'
          - 'contains_all(body, "pfSense", "__csrf_magic")'
        condition: and

    extractors:
      - type: regex
        name: csrf
        part: body
        group: 1
        internal: true
        regex:
          - 'var csrfMagicToken = "([^"]+)"'

      - type: regex
        name: phpsessid
        part: header
        group: 1
        internal: true
        regex:
          - 'Set-Cookie: (PHPSESSID=[^;]+)'

  - raw:
      - |
        POST /index.php HTTP/1.1
        Host: {{Hostname}}
        Content-Type: application/x-www-form-urlencoded
        Accept: text/html
        Cookie: {{phpsessid}}

        __csrf_magic={{csrf}}&usernamefld={{username}}&passwordfld={{password}}&login=Sign+In

    matchers:
      - type: dsl
        dsl:
          - 'status_code == 302'
          - 'contains(to_lower(header), "location: /")'
          - '!contains(to_lower(header), "index.php")'
        condition: and
