id: spip-detect

info:
  name: SPIP 指纹识别（指纹识别）
  author: s4e-io
  severity: info
  description: >-
    SPIP 是开源内容管理系统，常用于新闻、协会和公共机构网站。该模板通过请求目标服务并检查预设路径或首页响应、HTTP 响应头、正则特征、状态码等指纹特征，判断目标是否使用或暴露了
    SPIP 相关组件；命中结果仅表示指纹特征匹配，可用于资产盘点、技术栈识别和后续安全评估，不代表已确认存在可利用漏洞。
  reference:
  - https://www.spip.net/
  metadata:
    max-request: 1
    vendor: spip
    product: spip
    fofa-query: app="SPIP"
  tags: spip,tech,detect,discovery
http:
  - method: GET
    path:
      - "{{BaseURL}}"

    matchers-condition: and
    matchers:
      - type: regex
        part: header
        regex:
          - 'Composed-By: SPIP'
          - 'X-Spip-Cache:'
        condition: or

      - type: status
        status:
          - 200

    extractors:
      - type: regex
        name: spip_version
        group: 1
        part: header
        regex:
          - 'Composed-By: SPIP ([0-9]{1,2}.[0-9]{1,2}.[0-9]{1,2}) @ www.spip.net'
