id: unleash-panel

info:
  name: Unleash 面板识别（暴露面识别）
  author: userdehghani
  severity: info
  description: |
    该模板通过识别 Unleash 面板、控制台或管理界面的页面特征，判断目标是否暴露了对应服务入口。若命中，说明该后台或运维界面对外可访问，可用于资产识别与暴露面排查。
  reference:
    - https://www.getunleash.io/
  metadata:
    verified: true
    max-request: 3
    shodan-query: http.favicon.hash:-608690655
  tags: panel,unleash,login,detect,discovery

http:
  - method: GET
    path:
      - "{{BaseURL}}/login"
      - "{{BaseURL}}/sign-in"
      - "{{BaseURL}}/favicon.ico"

    stop-at-first-match: true
    matchers-condition: or
    matchers:
      - type: word
        part: body
        words:
          - '<title>Unleash'
          - 'content="unleash'
          - 'alt="getunleash'
          - 'Sign-in - Unleash hosted'
        case-insensitive: true
        condition: or

      - type: dsl
        dsl:
          - "status_code==200 && (\"-608690655\" == mmh3(base64_py(body)))"
