id: piwigo-panel

info:
  name: Piwigo 登录面板识别（指纹识别）
  author: daffainfo
  severity: info
  description: Piwigo 是开源图片相册系统，用于照片上传、分类、展示和用户访问控制。该模板请求首页、`/identification.php` 路径，并依据 HTTP 200 状态码、页面标题、正文关键字或品牌资源特征识别目标是否部署了该系统或暴露了对应入口，适用于资产指纹确认；命中结果仅表示系统特征匹配，不代表已确认存在未授权访问或可利用漏洞。
  classification:
    cvss-metrics: CVSS:3.0/AV:N/AC:L/PR:N/UI:N/S:U/C:N/I:N/A:N
    cwe-id: CWE-200
    cpe: cpe:2.3:a:piwigo:piwigo:*:*:*:*:*:*:*:*
  metadata:
    verified: true
    max-request: 2
    vendor: piwigo
    product: piwigo
    shodan-query: http.favicon.hash:540706145
    fofa-query:
    - title="piwigo"
    - icon_hash=540706145
    google-query:
    - Powered by Piwigo
    - powered by piwigo
  tags: panel,piwigo,detect,discovery

http:
  - method: GET
    path:
      - "{{BaseURL}}"
      - "{{BaseURL}}/identification.php"

    stop-at-first-match: true
    redirects: true
    max-redirects: 2

    matchers-condition: and
    matchers:
      - type: word
        part: body
        words:
          - 'content="Piwigo'
          - '>Piwigo</a>'
          - '<body id=theIdentificationPage>'
        condition: or

      - type: status
        status:
          - 200

    extractors:
      - type: regex
        part: body
        group: 1
        regex:
          - 'jquery\.min\.js\?v([0-9.]+)">'
