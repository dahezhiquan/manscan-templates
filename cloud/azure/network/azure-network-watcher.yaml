id: azure-network-watcher
info:
  name: Azure Network Watcher Service未启用（云安全）
  author: princechaddha
  severity: high
  description: 该规则用于检查 Azure network 相关安全控制、保护能力或合规配置是否处于未启用、缺失或未正确配置状态，以降低持续暴露风险并提升整体云安全基线。
  impact: |
    - 关键安全控制缺失会降低防护深度，使风险长期处于不可见或不可控状态。
    - 这类配置问题通常不会立即触发故障，但会显著增加后续入侵、横向移动或合规违规的概率。
  remediation: |
    - 按厂商最佳实践启用缺失的安全控制、保护功能或基线配置。
    - 将该类配置纳入持续巡检与自动化合规检查，避免后续资源再次以不安全默认值部署。
  reference:
    - https://docs.microsoft.com/en-us/azure/network-watcher/network-watcher-monitoring-overview
  tags: cloud,devops,azure,microsoft,network-watcher,azure-cloud-config

self-contained: true
code:
  - engine:
      - sh
      - bash
    source: |
      az network watcher list --query '[*].{"location":location,"provisioningState":provisioningState,"resourceGroup":resourceGroup}' --output json

    matchers:
      - type: word
        words:
          - '[]'

    extractors:
      - type: dsl
        dsl:
          - '"Azure Network Watcher is not enabled in all locations."'
