id: fortiwlm-panel

info:
  name: Fortinet FortiWLM 登录面板识别（暴露面识别）
  author: EgemenKochisarli
  severity: info
  description: |
    该模板通过识别 Fortinet FortiWLM 登录入口的页面标题、特征文本或重定向行为，判断目标是否暴露了对应的认证界面。若命中，说明该登录面板对外可访问，可用于暴露面梳理与后续安全评估。
  reference:
    - https://docs.fortinet.com/product/fortiwlm/8.6
  classification:
    cvss-metrics: CVSS:3.0/AV:N/AC:L/PR:N/UI:N/S:U/C:N/I:N/A:N
    cwe-id: CWE-200
    cpe: cpe:2.3:a:fortinet:fortiwlm:*:*:*:*:*:*:*:*
  metadata:
    max-request: 1
    vendor: fortinet
    product: fortiwlm
    shodan-query:
      - html:"fortiwlm"
      - http.html:"fortiwlm"
      - http.title:"fortiwlm"
    fofa-query:
      - title="fortiwlm"
      - body="fortiwlm"
    google-query: intitle:"fortiwlm"
  tags: panel,fortinet,fortiwlm,login,discovery

http:
  - method: GET
    path:
      - "{{BaseURL}}/wlm/login?next=/wlm"

    matchers-condition: and
    matchers:
      - type: word
        words:
          - "<title>FortiWLM Login</title>"

      - type: word
        part: header
        words:
          - "text/html"

      - type: status
        status:
          - 200
