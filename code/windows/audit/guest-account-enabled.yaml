id: guest-account-enabled

info:
  name: Guest 来宾账户已启用（本地基线扫描）
  author: princechaddha
  severity: high
  description: |
    该模板检查 Guest 账户是否启用。来宾账户通常权限较低但认证要求弱，容易被滥用为入口。
  impact: |
    攻击者可利用来宾账户获取初始访问并枚举系统资源。
  remediation: |
    禁用 Guest 账户，并确认共享和本地登录策略不允许来宾访问。
  tags: windows,user,account,guest,code,windows-audit

self-contained: true

code:
  - pre-condition: |
      IsWindows();
    engine:
      - powershell
      - powershell.exe
    args:
      - -ExecutionPolicy
      - Bypass
    pattern: "*.ps1"
    source: |
      (Get-WmiObject -Class Win32_UserAccount -Filter "Name='Guest' and LocalAccount=True").Disabled

    matchers:
      - type: word
        words:
          - "False"
