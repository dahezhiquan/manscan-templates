id: api-europeana

info:
  name: Europeana API Token 可用性校验（token喷洒）
  author: daffainfo
  severity: info
  description: 该模板通过调用 Europeana API 的已知接口验证提供的 token 是否有效，命中后通常表示可访问相关 API 能力。
  reference:
    - https://pro.europeana.eu/page/search
    - https://github.com/daffainfo/all-about-apikey/tree/main/europeana
  metadata:
    max-request: 1
  tags: token-spray,europeana

self-contained: true

http:
  - method: GET
    path:
      - "https://api.europeana.eu/record/v2/search.json?wskey={{token}}&query=*&rows=0&profile=facets"

    matchers:
      - type: word
        part: body
        words:
          - 'success'
          - 'apikey'
          - 'action'
        condition: and
