id: gcloud-storage-logs-not-enabled

info:
  name: Enable Usage and Storage Logs 的Cloud Storage Buckets（云安全）
  author: princechaddha
  severity: medium
  description: Cloud Storage usage and storage logs 可记录 bucket 使用情况和请求统计，未启用会降低对访问模式和容量变化的可见性。本模板检查 bucket logging_config，返回 null 时报告未启用使用和存储日志。
  impact: |
    - 异常访问、流量增长、对象使用变化和容量异常缺少日志证据，影响排查和成本治理。
    - 安全事件发生后难以快速还原 bucket 访问趋势和对象使用情况。
  remediation: |
    - 为关键 bucket 启用 usage and storage logs，并将日志写入受控的日志 bucket。
    - 结合 Data Access audit logs 建立对象访问、流量异常和存储增长告警。
  reference:
    - https://cloud.google.com/storage/docs/access-logs
  metadata:
    vendor: google
    product: cloud-storage
  tags: cloud,devops,gcp,gcloud,google-cloud-storage,logging,security,gcp-cloud-config

flow: |
  code(1)
  for(let projectId of iterate(template.projectIds)){
    set("projectId", projectId)
    code(2)
    for(let bucketName of iterate(template.buckets)){
      set("bucketName", bucketName)
      code(3)
    }
  }

self-contained: true

code:
  - engine:
      - sh
      - bash
    source: |
      gcloud projects list --format="json(projectId)"

    extractors:
      - type: json
        name: projectIds
        internal: true
        json:
          - '.[].projectId'

  - engine:
      - sh
      - bash
    source: |
      gcloud storage buckets list --project $projectId --format="json(name)"

    extractors:
      - type: json
        name: buckets
        internal: true
        json:
          - '.[].name'

  - engine:
      - sh
      - bash
    source: |
      gcloud storage buckets describe gs://$bucketName --format="json(logging_config)" | jq -r '. // "null"'

    matchers:
      - type: word
        words:
          - 'null'

    extractors:
      - type: dsl
        dsl:
          - '"Usage and storage logs are not enabled for the bucket " + bucketName + " in project " + projectId'
