id: gcloud-vertexai-external-ip

info:
  name: External IP Addresses Assigned to Vertex AI Notebooks（云安全）
  author: princechaddha
  severity: medium
  description: Vertex AI notebook 分配外部 IP 会扩大互联网暴露面，尤其在处理敏感数据集或凭据时风险更高。本模板检查 gceSetup.disablePublicIp，返回 null 时报告实例仍允许外部 IP。
  impact: |
    - Notebook 服务、开发端口或运行环境可能被互联网扫描和攻击。
    - 外部 IP 增加数据外传和凭据暴露风险，也绕过私网访问治理。
  remediation: |
    - 禁用 Vertex AI notebook 外部 IP，使用私有网络、IAP、VPN 或受控代理访问。
    - 对确需公网访问的环境限制来源、启用强认证和日志监控，并定期复核必要性。
  reference:
    - https://www.trendmicro.com/cloudoneconformity/knowledge-base/gcp/VertexAI/prevent-external-ip-usage.html
    - https://cloud.google.com/vertex-ai/docs/workbench/user-managed/manage-instance
  metadata:
    vendor: google
    product: vertex-ai
  tags: cloud,devops,gcp,gcloud,vertexai,security,networking,gcp-cloud-config,ai

flow: |
  code(1)
  for(let projectId of iterate(template.projectIds)){
    set("projectId", projectId)
    code(2)
  }

self-contained: true

code:
  - engine:
      - sh
      - bash
    source: |
      gcloud projects list --format="json(projectId)"

    extractors:
      - type: json
        name: projectIds
        internal: true
        json:
          - '.[].projectId'

  - engine:
      - sh
      - bash
    source: |
      gcloud workbench instances describe tm-vertex-ai-notebook-instance --location=us-central1-a --project=$projectId --format="yaml(gceSetup.disablePublicIp)"

    matchers:
      - type: word
        words:
          - "null"

    extractors:
      - type: dsl
        dsl:
          - '"Project " + projectId + " has Vertex AI notebook instances with external IP addresses enabled"'
