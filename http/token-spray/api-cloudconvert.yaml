id: api-cloudconvert

info:
  name: CloudConvert API Token 可用性校验（token喷洒）
  author: daffainfo
  severity: info
  description: 该模板通过调用 CloudConvert API 的已知接口验证提供的 token 是否有效，命中后通常表示可访问文档转换或 PDF 处理能力。
  reference:
    - https://cloudconvert.com/api/v2
    - https://github.com/daffainfo/all-about-apikey/tree/main/cloudconvert
  metadata:
    max-request: 1
  tags: token-spray,cloudconvert

self-contained: true

http:
  - raw:
      - |
        GET https://api.cloudconvert.com/v2/tasks HTTP/1.1
        Host: api.cloudconvert.com
        Authorization: Bearer {{token}}

    matchers:
      - type: word
        part: body
        words:
          - '"data":'
          - '"id":'
        condition: and
