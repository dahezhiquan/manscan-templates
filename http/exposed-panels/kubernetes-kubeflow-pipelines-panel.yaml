id: kubernetes-kubeflow-pipelines-panel

info:
  name: Kubeflow Pipelines 面板识别（指纹识别）
  author: rxerium
  severity: info
  description: |-
    检测到目标站点存在 Kubeflow Pipelines 相关响应特征。Kubeflow Pipelines 是云原生、中间件或集群管理平台，用于管理服务、工作负载、消息流、API 网关、配置和运行状态。模板请求 `/`，并通过页面标题或正文关键字、状态码确认该系统指纹，用于资产识别、系统盘点和暴露面梳理。
  reference:
    - https://github.com/kubeflow/pipelines
    - https://www.kubeflow.org
  metadata:
    verified: true
    max-request: 1
    vendor: Kubeflow
    product: Kubeflow Pipelines
    shodan-query: 'http.title:"Kubeflow Pipelines"'
  tags: panel,kubeflow,kubernetes,mlops,ai,detect,discovery
http:
  - method: GET
    path:
      - "{{BaseURL}}"

    host-redirects: true
    max-redirects: 2

    matchers-condition: and
    matchers:
      - type: word
        part: body
        words:
          - "<title>Kubeflow Pipelines</title>"

      - type: word
        part: body
        words:
          - "window.KFP_FLAGS"
          - "KFP_FLAGS"
        condition: or

      - type: status
        status:
          - 200
