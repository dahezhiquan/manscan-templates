id: 4D-detect

info:
  name: 4D 指纹识别（指纹识别）
  author: righettod
  severity: info
  description: 4D 是低代码应用开发平台和数据库环境，用于构建、部署和运行业务应用。该模板请求首页，并依据 HTTP 200 状态码、页面标题、正文关键字或品牌资源特征识别目标是否使用或暴露了 4D 相关组件，适用于资产盘点、技术栈识别和后续安全评估；命中结果仅表示指纹特征匹配，不代表已确认存在可利用漏洞。
  reference:
  - https://us.4d.com/
  - https://doc.4d.com/4Dv18/4D/18.4/URLs-and-Form-Actions.300-5232844.en.html
  - https://doc.4d.com/4Dv18/4D/18.4/Information-about-the-Web-Site.300-5232828.en.html
  classification:
    cpe: cpe:2.3:a:4d:4d:*:*:*:*:*:*:*:*
  metadata:
    verified: true
    max-request: 1
    vendor: 4d
    product: 4d
    shodan-query: http.html:"4DACTION/"
  tags: 4d,detect,tech,discovery

http:
  - method: GET
    path:
      - "{{BaseURL}}/"

    host-redirects: true
    max-redirects: 2

    matchers-condition: and
    matchers:
      - type: word
        part: body
        words:
          - "/4DACTION/"
          - "/4DSTATS"
          - "/4DHTMLSTATS"
          - "/4DCACHECLEAR"
          - "/4DWEBTEST"
        condition: or

      - type: status
        status:
          - 200

    extractors:
      - type: regex
        part: header
        group: 1
        regex:
          - 'Server:\s+4D(?:_V[0-9]+)?/([0-9.]+)'
