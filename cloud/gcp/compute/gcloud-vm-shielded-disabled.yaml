id: gcloud-vm-shielded-disabled

info:
  name: Shielded VM Security Features未启用（云安全）
  author: princechaddha
  severity: medium
  description: Shielded VM 的 vTPM 和 Integrity Monitoring 可帮助发现启动链或内核级篡改；未完整启用会降低实例完整性保护。本模板枚举 VM 并检查 enableVtpm 与 enableIntegrityMonitoring，发现 false 或 null 时报告 Shielded VM 功能未完整启用。
  impact: |
    - 实例启动完整性和运行环境变更难以及时发现，增加低层级持久化或镜像篡改的侦测盲区。
    - 对高敏感工作负载，未启用 Shielded VM 功能可能不满足组织强化基线。
  remediation: |
    - 对支持的实例启用 vTPM 和 Integrity Monitoring，并优先使用受信任的镜像和实例模板。
    - 对不兼容的旧实例制定迁移计划，并监控 Shielded VM 完整性告警。
  reference:
    - https://www.trendmicro.com/cloudoneconformity/knowledge-base/gcp/ComputeEngine/enable-shielded-vm.html
    - https://cloud.google.com/compute/docs/instances/modifying-shielded-vm
  metadata:
    vendor: google
    product: compute-engine
  tags: cloud,devops,gcp,gcloud,compute,security,shielded-vm,gcp-cloud-config

flow: |
  code(1)
  for(let projectId of iterate(template.projectIds)){
    set("projectId", projectId)
    code(2)
    for(let instance of iterate(template.instances)){
      instance = JSON.parse(instance)
      set("instanceName", instance.name)
      set("zone", instance.zone)
      code(3)
    }
  }

self-contained: true

code:
  - engine:
      - sh
      - bash
    source: |
      gcloud projects list --format="json(projectId)"

    extractors:
      - type: json
        name: projectIds
        internal: true
        json:
          - '.[].projectId'

  - engine:
      - sh
      - bash
    source: |
      gcloud compute instances list --project $projectId --format="json(name,zone.basename())"

    extractors:
      - type: json
        name: instances
        internal: true
        json:
          - '.[]'

  - engine:
      - sh
      - bash
    source: |
      gcloud compute instances describe $instanceName --zone $zone --project $projectId --format="json(shieldedInstanceConfig.enableVtpm,shieldedInstanceConfig.enableIntegrityMonitoring)"

    matchers:
      - type: word
        words:
          - '"enableIntegrityMonitoring": false'
          - '"enableVtpm": false'
          - 'null'

    extractors:
      - type: dsl
        dsl:
          - '"VM instance " + instanceName + " in zone " + zone + " of project " + projectId + " does not have Shielded VM features (vTPM and Integrity Monitoring) fully enabled"'
