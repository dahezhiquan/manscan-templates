id: ec2-sg-egress-open
info:
  name: EC2 安全组出站规则对所有地址开放（云安全）
  author: princechaddha
  severity: high
  description: EC2 安全组出站规则对所有地址开放是一类出站访问边界过宽风险，实例可向任意 IPv4 或 IPv6 目标发起连接。若实例被入侵，开放出站会便利数据外传、恶意载荷下载或连接外部控制端。模板枚举安全组 ID 后读取 `IpPermissionsEgress`，当规则包含 `0.0.0.0/0` 或 `::/0` 时判定出站访问过宽。
  impact: |
    - 被攻陷实例可直接访问任意外部目标，增加数据外传和远程控制风险。
    - 缺少出站最小权限会降低网络分段和检测策略的有效性。
  remediation: |
    - 按业务依赖收敛安全组出站目标，仅允许必要 CIDR、端口和服务前缀列表。
    - 对确需广泛出站的实例，结合网络防火墙、代理和流量日志进行监控。
  reference:
    - https://docs.aws.amazon.com/AWSEC2/latest/UserGuide/ec2-security-groups.html#sg-rules
  metadata:
    max-request: 2
    vendor: amazon
    product: ec2
  tags: cloud,devops,aws,amazon,ec2,aws-cloud-config
variables:
  region: "us-east-1"

flow: |
  code(1)
  for(let SecurityGroup of iterate(template.securitygroups)){
    set("groupid", SecurityGroup)
    code(2)
  }

self-contained: true
code:
  - engine:
      - sh
      - bash
    source: |
      aws ec2 describe-security-groups --region $region --output json --query 'SecurityGroups[*].GroupId'

    extractors:
      - type: json
        name: securitygroups
        internal: true
        json:
          - '.[]'

  - engine:
      - sh
      - bash
    source: |
         aws ec2 describe-security-groups --region $region --group-ids $groupid --query 'SecurityGroups[*].IpPermissionsEgress[]'

    matchers:
      - type: word
        words:
          - "0.0.0.0/0"
          - "::/0"

    extractors:
      - type: dsl
        dsl:
          - '"Amazon EC2 security group(s) " + groupid + " allows unrestricted outbound traffic"'
