id: apache-guacamole

info:
  name: Apache Guacamole 指纹识别（指纹识别）
  author: r3dg33k
  severity: info
  description: Apache Guacamole 是无客户端远程桌面网关，用于通过浏览器访问 RDP、VNC 和 SSH 会话。该模板请求 `/translations/en.json`，并依据 HTTP 200 状态码、页面标题、正文关键字或品牌资源特征识别目标是否使用或暴露了 Apache Guacamole 相关组件，适用于资产盘点、技术栈识别和后续安全评估；命中结果仅表示指纹特征匹配，不代表已确认存在可利用漏洞。
  metadata:
    max-request: 1
  tags: apache,guacamole,tech,login,discovery

http:
  - method: GET
    path:
      - "{{BaseURL}}/translations/en.json"

    matchers-condition: and
    matchers:
      - type: word
        words:
          - 'Apache Guacamole'

      - type: status
        status:
          - 200

    extractors:
      - type: regex
        part: body
        regex:
          - '"VERSION":"[0-9]+\.2\.0"'
