id: api-instatus

info:
  name: Instatus API Token 可用性校验（token喷洒）
  author: daffainfo
  severity: info
  description: 该模板通过调用 Instatus API 的已知接口验证提供的 token 是否有效，命中后通常表示可访问相关 API 能力。
  reference:
    - https://instatus.com/help/api
    - https://github.com/daffainfo/all-about-apikey/tree/main/instatus
  metadata:
    max-request: 1
  tags: token-spray,instatus

self-contained: true

http:
  - method: GET
    path:
      - "https://api.instatus.com/v1/pages"

    headers:
      Authorization: Bearer {{token}}
    matchers:
      - type: word
        part: body
        words:
          - '"id":'
          - '"subdomain":'
          - '"name":'
          - '"logoUrl":'
        condition: and
