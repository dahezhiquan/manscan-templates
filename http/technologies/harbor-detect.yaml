id: harbor-detect

info:
  name: Harbor 指纹识别（指纹识别）
  author: pikpikcu,daffainfo
  severity: info
  description: >-
    Harbor 是企业级容器镜像仓库，用于存储、签名、扫描和分发 OCI/Docker 镜像。该模板通过请求目标服务并检查预设路径或首页响应、页面正文关键字、正则特征、状态码等指纹特征，判断目标是否使用或暴露了
    Harbor 相关组件；命中结果仅表示指纹特征匹配，可用于资产盘点、技术栈识别和后续安全评估，不代表已确认存在可利用漏洞。
  reference:
  - https://github.com/goharbor/harbor
  metadata:
    verified: true
    max-request: 1
    shodan-query: http.favicon.hash:657337228
    product: harbor
    vendor: linuxfoundation
    fofa-query: icon_hash=657337228
  tags: tech,harbor,discovery
http:
  - method: GET
    path:
      - '{{BaseURL}}/api/v2.0/systeminfo'

    matchers-condition: and
    matchers:
      - type: word
        part: body
        words:
          - '"auth_mode"'
          - '"harbor_version"'
        condition: and

      - type: status
        status:
          - 200

    extractors:
      - type: regex
        group: 1
        regex:
          - '(?m)"harbor_version":"([0-9.]+)",'
