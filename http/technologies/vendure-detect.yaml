id: vendure-detect

info:
  name: Vendure 指纹识别（指纹识别）
  author: theamanrawat
  severity: info
  description: >-
    Vendure 是基于 Node.js 和 GraphQL 的无头电商平台，用于商品、订单、支付和渠道管理。该模板通过请求目标服务并检查HTTP 响应头、页面正文关键字、状态码等指纹特征，判断目标是否使用或暴露了
    Vendure 相关组件；命中结果仅表示指纹特征匹配，可用于资产盘点、技术栈识别和后续安全评估，不代表已确认存在可利用漏洞。
  reference:
  - https://github.com/vendure-ecommerce/vendure
  - https://docs.vendure.io/
  metadata:
    verified: true
    max-request: 1
    shodan-query: http.header:"vendure-auth-token"
    fofa-query: header="vendure-auth-token"
    google-query: inurl:"/shop-api"
  tags: tech,vendure,detect
http:
  - raw:
      - |
        POST /shop-api HTTP/1.1
        Host: {{Hostname}}
        Content-Type: application/json

        {"query":"{ __typename }"}

    matchers-condition: and
    matchers:
      - type: word
        part: header
        words:
          - "vendure-auth-token"

      - type: word
        part: body
        words:
          - '"data"'

      - type: status
        status:
          - 200
