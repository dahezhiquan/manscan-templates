id: chronos-panel

info:
  name: Chronos 面板识别（指纹识别）
  author: righettod
  severity: info
  description: |
    该模板通过识别 Chronos 登录入口的页面标题、特征文本或重定向行为，判断目标是否暴露了对应的认证界面。若命中，说明该登录面板对外可访问，可用于暴露面梳理与后续安全评估。
  reference:
    - https://www.asys.fr/chronos
  metadata:
    verified: true
    max-request: 1
    shodan-query: http.html:"chronoslogin.js"
    fofa-query: body="chronoslogin.js"
  tags: panel,chronos,login,detect,discovery

http:
  - method: GET
    path:
      - '{{BaseURL}}/chronos.wsc/asparamlogin.html'

    matchers-condition: and
    matchers:
      - type: word
        part: body
        words:
          - 'chronoslogin.html'
          - 'urlcli'
          - 'url_portail'
        condition: and
        case-insensitive: true

      - type: status
        status:
          - 200

    extractors:
      - type: regex
        part: body
        group: 1
        regex:
          - '(?i)chronos\s+([0-9.-]+)'
