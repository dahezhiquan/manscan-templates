id: photoprism-unauth

info:
  name: PhotoPrism 未授权访问
  author: ritikchaddha
  severity: high
  description: |
    该模板用于核查 PhotoPrism 未授权访问。该类问题通常源于管理端、API、控制台或服务接口缺少认证授权，导致未登录用户可直接访问敏感功能。模板会向目标发送探测请求，并依据匹配 `status_code == 200`、匹配 `contains_all(body, "mode\":\"user", "PhotoPrism")`、匹配 `contains(content_type, "application/json")`等证据确认目标是否存在该配置问题。
  impact: |
    - 攻击者可在未授权状态下查看系统状态、业务数据、任务信息或管理接口。
    - 若接口支持写操作，可能进一步导致配置篡改、服务接管、数据删除或横向移动。
  remediation: |
    - 为相关管理端和 API 启用认证授权，并按最小权限限制可访问功能。
    - 将管理接口限制在内网、VPN 或可信来源范围内，并开启访问审计。
    - 检查历史访问日志，确认是否存在未授权访问、批量枚举或异常操作。
  reference:
    - https://docs.photoprism.app/getting-started/
  metadata:
    verified: true
    max-request: 1
    shodan-query: title:"PhotoPrism"
    fofa-query: title="PhotoPrism"
  tags: photoprism,misconfig,unauth,vuln

http:
  - raw:
      - |
        GET /api/v1/config HTTP/1.1
        Host: {{Hostname}}

    matchers:
      - type: dsl
        dsl:
          - 'status_code == 200'
          - 'contains_all(body, "mode\":\"user", "PhotoPrism")'
          - 'contains(content_type, "application/json")'
        condition: and
