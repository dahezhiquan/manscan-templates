id: aspnetmvc-version-disclosure

info:
  name: AspNetMvc 版本指纹识别（指纹识别）
  author: lucky0x0d,PulseSecurity.co.nz
  severity: info
  description: |
    用于识别目标是否部署 AspNetMvc 版本 并提取相关版本或构建信息，模板会结合特定路径或已知端点和版本或标识提取结果进行指纹匹配。
  classification:
    cvss-metrics: CVSS:3.1/AV:N/AC:L/PR:N/UI:N/S:U/C:N/I:N/A:N
    cvss-score: 0
    cwe-id: CWE-200
  metadata:
    verified: true
    max-request: 1
    shodan-query: "X-AspNetMvc-Version"
  tags: aspnetmvc,tech,detect,discovery

http:
  - method: GET
    path:
      - "{{BaseURL}}"
      - "{{BaseURL}}/%3f"

    stop-at-first-match: true
    redirects: true
    max-redirects: 4
    matchers:
      - type: dsl
        dsl:
          - 'contains(tolower(header), "x-aspnetmvc-version")'

    extractors:
      - type: kval
        kval:
          - X_AspNetMvc_Version
