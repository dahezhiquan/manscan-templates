id: goliath-detect

info:
  name: Goliath 指纹识别（指纹识别）
  author: geeknik
  severity: info
  description: >-
    Goliath 是 Ruby 异步 Web 服务器框架，用于构建高并发 HTTP 服务。该模板通过请求目标服务并检查预设路径或首页响应、HTTP 响应头、正则特征等指纹特征，判断目标是否使用或暴露了
    Goliath 相关组件；命中结果仅表示指纹特征匹配，可用于资产盘点、技术栈识别和后续安全评估，不代表已确认存在可利用漏洞。
  reference:
  - https://github.com/postrank-labs/goliath
  classification:
    cpe: cpe:2.3:a:goliath_project:goliath:*:*:*:*:ruby:*:*:*
  metadata:
    verified: true
    max-request: 1
    vendor: goliath_project
    product: goliath
    shodan-query: 'Server: Goliath'
  tags: tech,goliath,discovery
http:
  - method: GET
    path:
      - "{{BaseURL}}"

    matchers-condition: and
    matchers:
      - type: regex
        part: header
        regex:
          - Goliath+

    extractors:
      - type: kval
        part: header
        kval:
          - Server
