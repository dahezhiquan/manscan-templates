id: photoprism-default-login

info:
  name: PhotoPrism 默认口令登录（弱口令）
  author: ritikchaddha
  severity: high
  description: |
    该模板用于检测 PhotoPrism 是否仍可使用默认凭据或弱口令登录。模板主要向 `/api/v1/session` 等认证入口发送请求，使用内置默认凭据组合进行认证尝试，并根据状态码、认证 Cookie、跳转位置或登录后的页面关键字判断登录是否成功；命中说明目标未及时修改出厂、示例或初始化账号口令。
  impact: |
    - 攻击者可登录 PhotoPrism 管理接口，读取、导出或篡改数据、索引、队列、仓库、报表或媒体资源。
    - 若系统保存连接串、访问令牌或集成凭据，弱口令登录可能进一步造成业务数据泄露、权限扩大或服务中断。
  remediation: |
    - 立即修改默认账号口令，删除测试账号，并为管理员、服务账号和集成账号使用唯一强密码。
    - 启用细粒度权限控制、访问来源限制和审计日志，避免管理 API 或控制台直接对公网开放。
    - 检查数据导出、配置变更、令牌使用和异常查询记录，必要时轮换相关凭据。
  reference:
    - https://docs.photoprism.app/getting-started/
  metadata:
    verified: true
    max-request: 2
    shodan-query: title:"PhotoPrism"
    fofa-query: title="PhotoPrism"
  tags: photoprism,default-login,misconfig,vuln

variables:
  username: admin
  password: admin321

http:
  - raw:
      - |
        POST /api/v1/session HTTP/1.1
        Host: {{Hostname}}
        Content-Type: application/json

        {"username":"{{username}}","password":"{{password}}","code":""}

    matchers:
      - type: dsl
        dsl:
          - 'status_code == 200'
          - 'contains_all(body, "access_token\":", "config\":{")'
          - 'contains(content_type, "application/json")'
        condition: and
