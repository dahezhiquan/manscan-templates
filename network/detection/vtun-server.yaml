id: vtun-server

info:
  name: VTUN 服务 识别（服务漏洞）
  author: pussycat0x
  severity: info
  description: |
    该模板通过网络响应特征识别目标是否开放 VTUN Server 相关服务。
  impact: |
    - 命中通常意味着目标对外暴露了可被继续探测或针对性利用的网络服务。
    - 该结果可作为后续版本识别、弱配置检查或漏洞验证的前置依据。
  remediation: |
    - 核查该服务是否确需对当前网络开放，并限制仅允许受信任来源访问。
    - 结合版本、认证与加密配置继续评估是否存在更高风险问题。
  reference:
    - https://vtun.sourceforge.net/
    - https://linux.die.net/man/8/vtund
  metadata:
    verified: true
    max-request: 1
    shodan-query: product:"Vtun Virtual Tunnel"
    fofa-query: server=="VTUN server"
  tags: network,vtun,detect,tcp,service,discovery

tcp:
  - inputs:
      - data: "\n"

    host:
      - "{{Hostname}}"
    port: 5001

    matchers:
      - type: word
        words:
          - "VTUN server"

    extractors:
      - type: regex
        regex:
          - '(VTUN server ver\s+[0-9A-Za-z.]+(?:\s+[0-9]{2}/[0-9]{2}/[0-9]{4})?)'
