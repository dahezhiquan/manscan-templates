id: default-lucee-page

info:
  name: Lucee 默认页面 指纹识别（指纹识别）
  author: dhiyaneshDk
  severity: info
  description: Lucee 默认页面 是 CFML 应用服务器，用于运行 ColdFusion 兼容 Web 应用。该模板请求首页，并依据页面标题、正文关键字或品牌资源特征识别目标是否使用或暴露了 Lucee 默认页面 相关组件，适用于资产盘点、技术栈识别和后续安全评估；命中结果仅表示指纹特征匹配，不代表已确认存在可利用漏洞。
  metadata:
    max-request: 1
    shodan-query: http.title:"Lucee"
  tags: tech,lucee,discovery

http:
  - method: GET
    path:
      - '{{BaseURL}}'

    matchers:
      - type: word
        words:
          - "<title>Rapid web development with Lucee!</title>"
        part: body

    extractors:
      - type: regex
        part: body
        group: 1
        regex:
          - "Lucee ([0-9.\\-A-Z]+) on your system"
