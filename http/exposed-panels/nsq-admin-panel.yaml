id: nsq-admin-panel

info:
  name: NSQ Admin 面板识别（暴露面识别）
  author: random-robbie
  severity: medium
  description: 该模板通过识别 NSQ Admin 面板、控制台或管理界面的页面特征，判断目标是否暴露了对应服务入口。若命中，说明该后台或运维界面对外可访问，可用于资产识别与暴露面排查。
  reference:
    - https://nsq.io/components/nsqd.html
  classification:
    cvss-metrics: CVSS:3.1/AV:N/AC:L/PR:N/UI:N/S:U/C:L/I:L/A:N
    cvss-score: 6.5
    cwe-id: CWE-200
  metadata:
    verified: true
    max-request: 1
    shodan-query: title:"nsqadmin"
  tags: nsq,admin,panel,exposure,discovery

http:
  - method: GET
    path:
      - '{{BaseURL}}'

    matchers-condition: and
    matchers:
      - type: word
        words:
          - '<title>nsqadmin</title>'

      - type: status
        status:
          - 200

    extractors:
      - type: regex
        part: body
        group: 1
        regex:
          - "nsqadmin/v([0-9.]+)"
