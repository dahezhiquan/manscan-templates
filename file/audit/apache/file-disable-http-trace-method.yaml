id: file-disable-http-trace-method

info:
  name: Apache2 HTTP TRACE 方法未禁用（本地文件安全扫描）
  author: pussycat0x
  severity: high
  description: |
    该模板检查 Apache 是否禁用 HTTP TRACE 方法。TRACE 开启可能被用于 Cross-Site Tracing XST 攻击并辅助窃取客户端信息。
  remediation: |
    在 Apache 配置中设置 TraceEnable Off，并重启服务。
  reference:
    - https://httpd.apache.org/docs/2.4/mod/core.html#traceenable
  metadata:
    verified: true
  tags: audit,config,file,apache,hardening

file:
  - extensions:
      - conf

    matchers-condition: and
    matchers:
      - type: word
        words:
          - "<Directory"
          - "<FilesMatch"
        condition: and

      - type: word
        words:
          - "TraceEnable On"
          - "<IfModule mod_core.c>"
        condition: and
        negative: true
