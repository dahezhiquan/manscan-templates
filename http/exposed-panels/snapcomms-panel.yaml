id: snapcomms-panel

info:
  name: SnapComms Content Manager 面板识别（暴露面识别）
  author: righettod
  severity: info
  description: |
    该模板通过识别 SnapComms Content Manager 面板、控制台或管理界面的页面特征，判断目标是否暴露了对应服务入口。若命中，说明该后台或运维界面对外可访问，可用于资产识别与暴露面排查。
  reference:
    - https://www.snapcomms.com/
  metadata:
    verified: true
    max-request: 1
  tags: panel,snapcomms,login,detect,discovery

http:
  - method: GET
    path:
      - '{{BaseURL}}/Manager/'

    matchers-condition: and
    matchers:
      - type: word
        part: body
        words:
          - '<title>SnapComms Content Manager</title>'

      - type: status
        status:
          - 200

    extractors:
      - type: regex
        part: body
        group: 1
        regex:
          - 'version=([0-9.]+)'
