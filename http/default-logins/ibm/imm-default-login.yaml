id: imm-default-login

info:
  name: Integrated Management Module 默认口令登录（弱口令）
  author: jpg0mez
  severity: high
  description: |
    该模板通过尝试 Integrated Management Module 的默认账号口令，并依据认证成功后的响应特征判断目标是否仍在使用未修改的弱口令。若命中，攻击者可直接登录系统，进一步访问敏感信息、修改配置或执行未授权操作。
  reference:
    - https://pubs.lenovo.com/x3650-m4/t_logging_web_interface
    - https://www.ibm.com/docs/en/tcs-service?topic=oip-logging-imm-web-interface
  classification:
    cwe-id: CWE-798
    cpe: cpe:2.3:h:ibm:integrated_management_module:*:*:*:*:*:*:*:*
  metadata:
    verified: true
    max-request: 1
    shodan-query: html:"ibmdojo"
    fofa-query: "integrated management module"
    product: integrated_management_module
    vendor: ibm
  tags: imm,ibm,default-login,vuln

http:
  - method: POST
    path:
      - "{{BaseURL}}/data/login"
    body: "user=USERID&password=PASSW0RD"

    redirects: true
    matchers-condition: and
    matchers:
      - type: word
        words:
          - "<authResult>0</authResult>"
          - 'authResult":"0'
        condition: or

      - type: word
        words:
          - "index-console.php"
          - "home.php"
        condition: and

      - type: status
        status:
          - 200
