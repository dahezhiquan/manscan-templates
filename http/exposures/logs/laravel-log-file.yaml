id: laravel-log-file

info:
  name: Laravel 日志文件泄露（暴露面识别）
  author: sheikhrishad,geeknik
  severity: high
  description: 检测到可直接访问的 Laravel 日志文件。日志、异常页面或调试输出通常会泄露堆栈信息、内部路径、查询语句、账号标识、令牌片段或业务数据，不应向未授权用户开放。
  reference:
    - https://laravel.com/docs/master/logging
  metadata:
    max-request: 1
  tags: laravel,logs,exposure,vuln

http:
  - method: GET
    path:
      - "{{BaseURL}}/storage/logs/laravel.log"

    matchers-condition: and
    matchers:
      - type: word
        part: body
        words:
          - "InvalidArgumentException"
          - "local.ERROR"
          - "ErrorException"
          - "syntax error"
        condition: or

      - type: word
        part: header
        words:
          - "text/plain"
          - "text/x-log"
        condition: or

      - type: status
        status:
          - 200
