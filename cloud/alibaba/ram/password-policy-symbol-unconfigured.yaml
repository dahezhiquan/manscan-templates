id: password-policy-symbol-unconfigured

info:
  name: 阿里云 RAM 密码未要求包含特殊字符（云安全）
  author: DhiyaneshDK
  severity: medium
  description: RAM 密码策略未要求特殊字符会降低密码复杂度，使控制台密码更容易落入常见口令模式。模板调用 GetPasswordPolicy，当 RequireSymbols 为 false 时判定密码策略未要求包含特殊字符。
  impact: |
    - 密码搜索空间不足，攻击者更容易通过字典攻击或规则化爆破猜中密码。
    - 对云控制台身份入口而言，复杂度不足会增加账号接管风险。
  remediation: |
    - 在 RAM 密码策略中启用 RequireSymbols。
    - 与最小长度、大小写字母、数字和 MFA 共同作为控制台登录基线。
  reference:
    - https://www.alibabacloud.com/help/en/ram/user-guide/configure-a-password-policy-for-ram-users
    - https://www.trendmicro.com/cloudoneconformity/knowledge-base/alibaba-cloud/AlibabaCloud-RAM/require-symbol-password-policy.html
  metadata:
    max-request: 1
    verified: true
    vendor: alibaba
    product: ram
  tags: cloud,devops,aliyun,alibaba,alibaba-cloud-config,alibaba-ram

variables:
  region: "cn-hangzhou"

self-contained: true

code:
  - engine:
      - sh
      - bash
    source: |
      aliyun ram GetPasswordPolicy --region $region

    matchers:
      - type: word
        name: policy
        words:
          - '"RequireSymbols": false'

    extractors:
      - type: dsl
        dsl:
          - '"RAM Password Policy Does not contain One Symbol "'
