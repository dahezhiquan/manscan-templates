id: wing-ftp-service-detect

info:
  name: Wing FTP Server 指纹识别（指纹识别）
  author: ritikchaddha
  severity: info
  description: >-
    Wing FTP Server 是文件传输服务器，支持 FTP、SFTP、HTTP/S 和 Web 管理能力。该模板通过请求目标服务并检查预设路径或首页响应、HTTP
    响应头、页面正文关键字等指纹特征，判断目标是否使用或暴露了 Wing FTP Server 相关组件；命中结果仅表示指纹特征匹配，可用于资产盘点、技术栈识别和后续安全评估，不代表已确认存在可利用漏洞。
  classification:
    cpe: cpe:2.3:a:wftpserver:wing_ftp_server:*:*:*:*:*:*:*:*
  metadata:
    verified: true
    max-request: 1
    vendor: wftpserver
    product: wing_ftp_server
    shodan-query: "Wing FTP Server"
  tags: tech,ftp,wing,detect,discovery
http:
  - method: GET
    path:
      - "{{BaseURL}}"

    matchers:
      - type: word
        part: header
        words:
          - "Wing FTP Server"
