id: aurora-copy-tags-snap
info:
  name: Aurora 快照标签复制未启用（云安全）
  author: princechaddha
  severity: high
  description: Aurora 集群未启用 CopyTagsToSnapshot 时，快照不会自动继承源集群标签，容易造成备份资产缺少归属、环境、敏感级别或成本标签。该模板枚举 Aurora 集群，并检查 CopyTagsToSnapshot 是否为 false。
  impact: |
    - 快照缺少标签会影响备份资产盘点、成本分摊、保留策略和合规审计。
    - 安全自动化可能因标签缺失而遗漏敏感快照或错误应用生命周期策略。
  remediation: |
    - 为 Aurora 集群启用 CopyTagsToSnapshot，确保新建快照自动继承关键标签。
    - 对已有快照补齐 owner、environment、data-classification 等治理标签，并纳入定期检查。
  reference:
    - https://docs.aws.amazon.com/AmazonRDS/latest/AuroraUserGuide/USER_Tagging.html
  metadata:
    max-request: 2
    vendor: amazon
    product: rds
  tags: cloud,devops,aws,amazon,aurora,rds,aws-cloud-config
variables:
  region: "ap-northeast-1"

flow: |
  code(1)
  for(let clustername of iterate(template.clusters)){
    set("cluster", clustername)
    code(2)
  }

self-contained: true
code:
  - engine:
      - sh
      - bash
    source: |
      aws rds describe-db-clusters --region $region --output json --query 'DBClusters[?Engine==`aurora-mysql` || Engine==`aurora-postgresql`].DBClusterIdentifier | []'

    extractors:
      - type: json
        name: clusters
        internal: true
        json:
          - '.[]'

  - engine:
      - sh
      - bash
    source: |
         aws rds describe-db-clusters --region $region --db-cluster-identifier $cluster --query 'DBClusters[*].CopyTagsToSnapshot'

    matchers:
      - type: word
        words:
          - 'false'

    extractors:
      - type: dsl
        dsl:
          - '"Copy Tags To Snapshot is not enable for cluster " + cluster'
