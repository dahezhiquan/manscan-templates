id: mdns-ptzoptics-detect

info:
  name: 通过 mDNS 识别 PTZOptics 设备（服务漏洞）
  author: rxerium
  severity: medium
  description: |
    该模板通过 mDNS 广播特征识别 PTZOptics 摄像设备及其开放服务。模板查询 mDNS 记录并匹配 PTZOptics 标识，同时提取设备名、服务项和地址信息。
  impact: |
    - 暴露的 PTZOptics mDNS 广播会泄露摄像设备名称、服务和地址信息。
    - 攻击者可利用这些信息定位音视频设备、识别管理接口并开展后续弱口令或固件漏洞验证。
  remediation: |
    - 将 PTZOptics 设备放入受控管理 VLAN，限制 UDP 5353 和管理接口访问来源。
    - 更新设备固件，关闭不必要的服务广播，并更改默认管理凭据。
  metadata:
    verified: true
    max-request: 1
    shodan-query: port:5353 ptzoptics
    vendor: ptzoptics
    product: ptzoptics
  tags: mdns,udp,js,ptzoptics,camera,iot,exposure

javascript:
  - pre-condition: |
      isUDPPortOpen(Host,Port);

    code: |
      let c = require("nuclei/net");
      let conn = c.Open('udp', `${Host}:${Port}`);
      // Query for _services._dns-sd._udp.local PTR records
      // This queries for all advertised mDNS services
      let packet = "e3bc01200001000000000001095f7365727669636573075f646e732d7364045f756470056c6f63616c00000c000100002904d000000000000c000a00083e6e072b14fd0be3";
      conn.SendHex(packet);
      let resp = conn.Recv(512);
      resp;

    args:
      Host: "{{Host}}"
      Port: 5353

    matchers-condition: and
    matchers:
      - type: dsl
        dsl:
          - "success == true"
          - "len(response) > 0"

      - type: word
        words:
          - "_ndi"
          - "_ssh"
        condition: and

    extractors:
      - type: regex
        name: device_name
        regex:
          - "Name=([^\n\r]+)"
        group: 1

      - type: regex
        name: services
        regex:
          - "_ndi\\._tcp"
          - "_ssh\\._tcp"
          - "_sftp-ssh\\._tcp"

      - type: regex
        name: ip_address
        regex:
          - "Address=([0-9]{1,3}\\.[0-9]{1,3}\\.[0-9]{1,3}\\.[0-9]{1,3})"
        group: 1
