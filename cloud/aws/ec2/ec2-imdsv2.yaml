id: ec2-imdsv2
info:
  name: EC2 实例未强制使用 IMDSv2（云安全）
  author: princechaddha
  severity: medium
  description: EC2 实例未强制使用 IMDSv2 是一类实例元数据服务防护不足风险，实例仍允许使用 IMDSv1 访问临时凭据和元数据。IMDSv2 通过会话令牌降低 SSRF 等路径直接获取实例角色凭据的风险。模板枚举 EC2 实例 ID 后读取 `MetadataOptions.HttpTokens`，当值为 `optional` 时判定未强制使用 IMDSv2。
  impact: |
    - 存在 SSRF 或本机进程被利用时，攻击者更容易尝试访问实例元数据并获取临时凭据。
    - 如果实例角色权限较高，泄露的临时凭据可能被用于访问其他 AWS 资源。
  remediation: |
    - 将 EC2 实例元数据选项中的 `HttpTokens` 设置为 `required`，强制使用 IMDSv2。
    - 验证实例内应用和代理均兼容 IMDSv2 token 获取流程，再批量推广到生产实例。
  reference:
    - https://docs.aws.amazon.com/AWSEC2/latest/UserGuide/configuring-instance-metadata-service.html
  metadata:
    max-request: 2
    vendor: amazon
    product: ec2
  tags: cloud,devops,aws,amazon,ec2,aws-cloud-config
variables:
  region: "us-east-1"

flow: |
  code(1)
  for(let InstancesName of iterate(template.instances)){
    set("ec2instance", InstancesName)
    code(2)
  }

self-contained: true
code:
  - engine:
      - sh
      - bash
    source: |
      aws ec2 describe-instances --region $region --output table --query 'Reservations[*].Instances[*].InstanceId' --output json

    extractors:
      - type: json
        name: instances
        internal: true
        json:
          - '.[]'

  - engine:
      - sh
      - bash
    source: |
         aws ec2 describe-instances --region $region --instance-ids $ec2instance --query 'Reservations[*].Instances[*].MetadataOptions.HttpTokens[]'
    matchers:
      - type: word
        words:
          - "optional"

    extractors:
      - type: dsl
        dsl:
          - 'ami + " is publically shared"'
