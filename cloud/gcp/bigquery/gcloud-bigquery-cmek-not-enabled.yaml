id: gcloud-bigquery-cmek-not-enabled

info:
  name: BigQuery Dataset 加密 使用Customer-Managed 加密 Keys未启用（云安全）
  author: princechaddha
  severity: high
  description: BigQuery 数据集未配置默认 Customer-Managed Encryption Key 时，新建表将使用 Google 管理的默认加密密钥，无法满足部分密钥自主控制要求。本模板枚举项目数据集，并检查 defaultEncryptionConfiguration.kmsKeyName 是否为 null。
  impact: |
    - 组织无法对数据集默认加密密钥执行自主轮换、禁用、销毁或细粒度访问控制。
    - 涉及敏感数据或合规要求的数据集可能不满足客户管理密钥和密钥审计要求。
  remediation: |
    - 为敏感 BigQuery 数据集配置默认 CMEK，并确保 BigQuery 服务账号具备使用对应 Cloud KMS 密钥的权限。
    - 将数据集创建流程纳入基线控制，持续检查 kmsKeyName 为空的数据集并安排迁移。
  reference:
    - https://cloud.google.com/bigquery/docs/customer-managed-encryption
  metadata:
    vendor: google
    product: bigquery
  tags: cloud,devops,gcp,gcloud,bigquery,gcp-cloud-config

flow: |
  code(1)
  for(let projectId of iterate(template.projectIds)){
    set("projectId", projectId)
    code(2)
    for(let dataset of iterate(template.datasets)){
      set("datasetId", dataset)
      code(3)
    }
  }

self-contained: true

code:
  - engine:
      - sh
      - bash
    source: |
      gcloud projects list --format="json(projectId)"
    extractors:
      - type: json
        name: projectIds
        internal: true
        json:
          - '.[].projectId'

  - engine:
      - sh
      - bash
    source: |
      bq ls --project_id $projectId --format="prettyjson"

    extractors:
      - type: json
        name: datasets
        internal: true
        json:
          - '.[] | .datasetReference.datasetId'

  - engine:
      - sh
      - bash
    source: |
      bq show --format=prettyjson $projectId:$datasetId | jq '.defaultEncryptionConfiguration.kmsKeyName'

    matchers:
      - type: word
        words:
          - 'null'

    extractors:
      - type: dsl
        dsl:
          - '"Dataset without CMEK: " + datasetId + " in Project: " + projectId'
