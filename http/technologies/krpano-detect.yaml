id: krpano-detect

info:
  name: Krpano Panorama Viewer 指纹识别（指纹识别）
  author: matejsmycka
  severity: info
  description: >-
    krpano 是全景图和虚拟漫游查看器，用于在网页中展示 360 度图片、VR 场景和交互式导览。该模板通过请求目标服务并检查预设路径或首页响应、页面正文关键字等指纹特征，判断目标是否使用或暴露了
    Krpano Panorama Viewer 相关组件；命中结果仅表示指纹特征匹配，可用于资产盘点、技术栈识别和后续安全评估，不代表已确认存在可利用漏洞。
  reference:
  - https://krpano.com/
  metadata:
    vendor: krpano
    product: panorama_viewer
    shodan-query: http.html:"embedpano"
  tags: tech,krpano,viewer,discovery
http:
  - method: GET
    path:
      - "{{BaseURL}}"
      - "{{BaseURL}}/krpano.html"

    stop-at-first-match: true

    host-redirects: true
    max-redirects: 2

    matchers:
      - type: word
        part: body
        words:
          - "embedpano({"
          - "passQueryParameters:true"
          - "swf"
        condition: and
