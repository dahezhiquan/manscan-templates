id: wp-bricks-builder-theme

info:
  name: WordPress Bricks Builder Theme 主题 指纹识别（指纹识别）
  author: Anonymous
  severity: info
  description: >-
    Bricks Builder Theme 是 WordPress 主题或主题构建组件，用于控制站点外观、模板布局和前端展示效果。该模板通过请求目标服务并检查预设路径或首页响应、页面正文关键字、正则特征、状态码等指纹特征，判断目标是否使用或暴露了
    WordPress Bricks Builder Theme 主题 相关组件；命中结果仅表示指纹特征匹配，可用于资产盘点、技术栈识别和后续安全评估，不代表已确认存在可利用漏洞。
  reference:
  - https://0day.today/exploit/description/39489
  classification:
    cpe: cpe:2.3:a:bricksbuilder:bricks:*:*:*:*:wordpress:*:*:*
  metadata:
    verified: true
    max-request: 1
    vendor: bricksbuilder
    product: bricks
    publicwww-query: "/wp-content/themes/bricks/"
  tags: wordpress,theme,wp-theme,bricks,discovery,detect
http:
  - method: GET
    path:
      - "{{BaseURL}}/wp-content/themes/bricks/readme.txt"

    matchers-condition: and
    matchers:
      - type: word
        part: body
        words:
          - "Bricks - Visual Website Builder"

      - type: regex
        part: body
        regex:
          - "Stable tag:([ 0-9.]+)"

      - type: status
        status:
          - 200
