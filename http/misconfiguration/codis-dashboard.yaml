id: codis-dashboard

info:
  name: Codis 仪表盘 暴露
  author: tess
  severity: low
  description: |
    检测到 Codis 仪表盘 暴露。目标响应或文件中可能暴露配置、凭据、密钥、令牌、环境变量或历史记录等敏感信息，可能被用于进一步入侵。
  metadata:
    verified: true
    max-request: 1
    shodan-query: title:"Codis • Dashboard"
  tags: misconfig,exposure,codis,discovery

http:
  - method: GET
    path:
      - "{{BaseURL}}"

    matchers-condition: and
    matchers:
      - type: word
        part: body
        words:
          - "Codis • Dashboard"
          - "Sessions"
        condition: and

      - type: word
        part: header
        words:
          - "text/html"

      - type: status
        status:
          - 200
