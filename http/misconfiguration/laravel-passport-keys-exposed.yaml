id: laravel-passport-keys-exposed

info:
  name: Laravel Passport OAuth2 密钥s 暴露
  author: moamenbasel
  severity: high
  description: |
    检测到 Laravel Passport OAuth2 密钥s 暴露。目标响应或文件中可能暴露配置、凭据、密钥、令牌、环境变量或历史记录等敏感信息，可能被用于进一步入侵。
  remediation: |
    - 立即移除公开文件中的敏感信息并轮换已暴露的凭据、密钥和令牌。
    - 使用安全的密钥管理方案，并阻止配置、日志和历史文件被 Web 直接访问。
  reference:
    - https://laravel.com/docs/10.x/passport#installation
  metadata:
    verified: true
    max-request: 2
  tags: laravel,passport,oauth,exposure,keys

http:
  - method: GET
    path:
      - "{{BaseURL}}/storage/oauth-private.key"
      - "{{BaseURL}}/storage/oauth-public.key"

    stop-at-first-match: true

    matchers-condition: and
    matchers:
      - type: word
        part: body
        words:
          - "-----BEGIN RSA PRIVATE KEY-----"
          - "-----BEGIN PUBLIC KEY-----"
        condition: or

      - type: word
        part: body
        words:
          - "<html"
          - "<!DOCTYPE"
        negative: true

      - type: status
        status:
          - 200
