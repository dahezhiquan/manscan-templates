id: gcloud-gke-cost-allocation-disabled

info:
  name: GKE Clusters 未启用Cost Allocation已启用（云安全）
  author: princechaddha
  severity: medium
  description: GKE Cost Allocation 未启用时，集群成本难以按命名空间和标签细分到团队或应用。本模板枚举集群并检查 costManagementConfig.enabled，字段为空时报告集群未启用成本分摊。
  impact: |
    - 无法精确识别高成本命名空间或工作负载，影响容量治理和成本异常排查。
    - 成本归属不清会削弱团队资源责任边界和预算控制。
  remediation: |
    - 为 GKE 集群启用 cost allocation，并规范命名空间、Pod 和资源标签。
    - 将成本报告纳入团队预算和容量治理流程，定期处理异常消耗。
  reference:
    - https://cloud.google.com/kubernetes-engine/docs/how-to/cluster-usage-metering
    - https://www.trendmicro.com/cloudoneconformity/knowledge-base/gcp/GKE/enable-cost-allocation.html
  metadata:
    vendor: google
    product: google-kubernetes-engine
  tags: cloud,devops,gcp,gcloud,gke,kubernetes,cost,monitoring,gcp-cloud-config

flow: |
  code(1)
  for(let projectId of iterate(template.projectIds)){
    set("projectId", projectId)
    code(2)
    for(let cluster of iterate(template.clusters)){
      cluster = JSON.parse(cluster)
      set("clusterName", cluster.name)
      set("location", cluster.location)
      code(3)
    }
  }

self-contained: true

code:
  - engine:
      - sh
      - bash
    source: |
      gcloud projects list --format="json(projectId)"

    extractors:
      - type: json
        name: projectIds
        internal: true
        json:
          - '.[].projectId'

  - engine:
      - sh
      - bash
    source: |
      gcloud container clusters list --project $projectId --format="json(name,location)"

    extractors:
      - type: json
        name: clusters
        internal: true
        json:
          - '.[]'

  - engine:
      - sh
      - bash
    source: |
      gcloud container clusters describe $clusterName --location $location --project $projectId --format="json(costManagementConfig.enabled)"

    matchers:
      - type: word
        words:
          - "null"

    extractors:
      - type: dsl
        dsl:
          - '"GKE cluster " + clusterName + " in " + location + " of project " + projectId + " does not have cost allocation enabled"'
