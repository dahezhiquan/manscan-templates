id: sysreptor-detect

info:
  name: Sysreptor 指纹识别（指纹识别）
  author: icarot
  severity: info
  description: |
    用于识别目标是否部署 Sysreptor 并提取相关版本或构建信息，模板会结合页面正文、状态码、特定路径或已知端点和版本或标识提取结果进行指纹匹配。
  reference:
    - https://github.com/Syslifters/sysreptor
  metadata:
    max-request: 2
    vendor: syslifters
    product: sysreptor
  tags: tech,syslifters,sysreptor,detect

flow: http(1) && http(2)

http:
  - method: GET
    path:
      - "{{BaseURL}}"


    host-redirects: true
    max-redirects: 2

    extractors:
      - type: regex
        name: nuxjs
        group: 1
        part: body
        regex:
          - '(?<nuxjs>\/static\/_nuxt\/\w+.js)'
        internal: true

  - raw:
      - |
        GET {{nuxjs}} HTTP/1.1
        Host: {{BaseURL}}
        Content-type: text/javascript; charset="utf-8"

    matchers-condition: and
    matchers:
      - type: word
        words:
          - "SysReptor"
          - "sysreptor"
          - "Syslifters"
        condition: and

      - type: status
        status:
          - 200
