id: windows-min-password-length-short

info:
  name: 最小密码长度过短（本地基线扫描）
  author: princechaddha
  severity: high
  description: |
    过短密码容易被猜解或离线破解。对应基线项为“本地账户最小密码长度是否小于 8 个字符”；模板读取注册表 `HKLM:\SYSTEM\CurrentControlSet\Services\Netlogon\Parameters` 的 `MinimumPasswordLength` 值，结合命中值判断策略是否不符合基线。
  impact: |
    - 弱短密码会增加账户被暴力破解的风险。
    - 凭据保护不足会增加横向移动、远程登录和离线破解风险。
  remediation: |
    - 将最小密码长度至少设置为 8 个字符，优先采用更高组织基线。
    - 变更策略后清理历史凭据，并轮换可能受影响的账户密码。
  tags: windows,code,windows-audit

self-contained: true

code:
  - pre-condition: |
      IsWindows();
    engine:
      - powershell.exe
    args:
      - -ExecutionPolicy
      - Bypass
    pattern: "*.ps1"
    source: |
      $policy = Get-ItemProperty -Path 'HKLM:\SYSTEM\CurrentControlSet\Services\Netlogon\Parameters' -Name 'MinimumPasswordLength' -ErrorAction SilentlyContinue;
      if ($policy -and $policy.MinimumPasswordLength -lt 8) {
        Write-Output 'Minimum password length is too short';
      }

    matchers:
      - type: word
        part: body
        words:
          - "Minimum password length is too short"
