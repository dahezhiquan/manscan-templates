id: exposed-dockerd

info:
  name: Docker Daemon 暴露（服务漏洞）
  author: arafatansari
  severity: critical
  description: |
    该模板检测 Docker Daemon 是否在网络侧直接暴露。若未启用认证或仅依赖错误的边界配置，攻击者可能直接控制容器与宿主环境。
  metadata:
    verified: true
    max-request: 1
    shodan-query: port:2375 product:"docker"
  tags: network,docker,exposure,tcp,discovery
tcp:
  - inputs:
      - data: "Docker:\nVersion:\n"

    host:
      - "{{Hostname}}"
    port: 2375

    matchers:
      - type: word
        words:
          - "Server: Docker"
