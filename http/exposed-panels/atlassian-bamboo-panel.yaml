id: atlassian-bamboo-panel

info:
  name: Atlassian Bamboo 登录面板识别（指纹识别）
  author: righettod
  severity: info
  description: |-
    检测到目标站点存在 Atlassian Bamboo 相关响应特征。Atlassian Bamboo 是持续集成与发布管理平台，用于配置构建计划、部署流水线和构建代理。模板请求 `/userlogin!doDefault.action?os_destination=%2Fstart.action`，并通过页面标题或正文关键字、状态码确认该系统指纹，用于资产识别、系统盘点和暴露面梳理。
  reference:
    - https://www.atlassian.com/software/bamboo
  classification:
    cpe: cpe:2.3:a:atlassian:bamboo:*:*:*:*:*:*:*:*
  metadata:
    verified: true
    max-request: 1
    vendor: atlassian
    product: bamboo
    shodan-query: http.title:"Bamboo"
  tags: panel,bamboo,login,detect,discovery
http:
  - method: GET
    path:
      - "{{BaseURL}}/userlogin!doDefault.action?os_destination=%2Fstart.action"

    matchers-condition: and
    matchers:
      - type: word
        part: body
        words:
          - '<title>Log in as a Bamboo user'
          - 'content="Bamboo'
          - 'atlassian.bamboo.plugins'
          - 'Atlassian Bamboo</a>'
        condition: or

      - type: status
        status:
          - 200

    extractors:
      - type: regex
        part: body
        group: 1
        regex:
          - 'version\s+([0-9A-Za-z\s\.]+)\s+-'
          - 'pvpVersion = "([a-z0-9.]+)";'
