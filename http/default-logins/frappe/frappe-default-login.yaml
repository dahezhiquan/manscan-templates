id: frappe-default-login

info:
  name: Frappe Framework - Default Login Credentials（弱口令）
  author: DhiyaneshDk
  severity: high
  description: |
    该模板通过尝试 Frappe Framework - Default Login Credentials 的默认凭据（如 Administrator:admin.），并依据认证成功后的响应特征判断目标是否仍在使用未修改的弱口令。若命中，攻击者可直接登录系统并访问相应管理功能或业务数据。
  reference:
    - https://frappeframework.com
    - https://docs.erpnext.com
  metadata:
    verified: true
    max-request: 1
  tags: default-login,frappe,erpnext

http:
  - method: POST
    path:
      - "{{BaseURL}}/api/method/login"

    headers:
      Content-Type: application/x-www-form-urlencoded
      Accept: application/json

    body: "usr=Administrator&pwd=admin"

    matchers-condition: and
    matchers:
      - type: word
        words:
          - "Logged In"
          - "full_name"
        part: body
        condition: and

      - type: status
        status:
          - 200

    extractors:
      - type: json
        name: full_name
        json:
          - ".full_name"
        part: body
