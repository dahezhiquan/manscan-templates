id: oracle-enterprise-manager-login

info:
  name: Oracle Enterprise Manager 登录面板识别（暴露面识别）
  author: dogasantos
  severity: info
  description: 该模板通过识别 Oracle Enterprise Manager 登录入口的页面标题、特征文本或重定向行为，判断目标是否暴露了对应的认证界面。若命中，说明该登录面板对外可访问，可用于暴露面梳理与后续安全评估。
  classification:
    cvss-metrics: CVSS:3.0/AV:N/AC:L/PR:N/UI:N/S:U/C:N/I:N/A:N
    cwe-id: CWE-200
    cpe: cpe:2.3:a:oracle:enterprise_manager_base_platform:*:*:*:*:*:*:*:*
  metadata:
    max-request: 1
    vendor: oracle
    product: enterprise_manager_base_platform
  tags: panel,oracle,manager,login,discovery

http:
  - method: GET
    path:
      - "{{BaseURL}}/em/console/logon/logon"

    matchers-condition: and
    matchers:
      - type: word
        words:
          - "Oracle UIX"
          - "libNPSVG3.so"
          - "Oracle Enterprise Manager"
        condition: or

      - type: status
        status:
          - 200
