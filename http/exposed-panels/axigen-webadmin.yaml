id: axigen-webadmin

info:
  name: Axigen Web Admin 识别（暴露面识别）
  author: dhiyaneshDk
  severity: info
  description: 该模板通过识别 Axigen Web Admin 面板、控制台或管理界面的页面特征，判断目标是否暴露了对应服务入口。若命中，说明该后台或运维界面对外可访问，可用于资产识别与暴露面排查。
  reference:
    - https://www.axigen.com/
  classification:
    cwe-id: CWE-200
    cpe: cpe:2.3:a:axigen:axigen_mail_server:*:*:*:*:*:*:*:*
  metadata:
    max-request: 1
    shodan-query: http.title:"Axigen WebAdmin"
    product: axigen_mail_server
    vendor: axigen
  tags: axigen,panel,discovery

http:
  - method: GET
    path:
      - "{{BaseURL}}"

    matchers-condition: and
    matchers:
      - type: word
        words:
          - '<title>Axigen WebAdmin</title>'

      - type: status
        status:
          - 200
