id: gatekeeper-disabled

info:
  name: macOS Gatekeeper 已禁用（本地基线扫描）
  author: geeknik
  severity: high
  description: |
    该模板检查 macOS Gatekeeper 是否关闭。关闭后系统不会严格校验下载应用是否来自已识别开发者。
  impact: |
    关键 macOS 安全控制关闭会降低数据保护、应用校验或系统完整性防护能力。
  remediation: |
    启用 Gatekeeper，仅允许运行来自 App Store 或已识别开发者的应用。
  tags: macos,audit,local,security

self-contained: true

code:
  - engine:
      - sh
      - bash
    source: |
      spctl --status
    matchers:
      - type: word
        words:
          - "assessments disabled"
