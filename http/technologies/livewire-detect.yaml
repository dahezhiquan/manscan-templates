id: livewire-detect

info:
  name: Laravel Livewire 指纹识别（指纹识别）
  author: Shivam Kamboj
  severity: info
  description: >-
    Laravel Livewire 是 Laravel 的全栈交互组件框架，用于在 PHP 模板中构建动态前端交互。该模板通过请求目标服务并检查预设路径或首页响应、页面正文关键字等指纹特征，判断目标是否使用或暴露了
    Laravel Livewire 相关组件；命中结果仅表示指纹特征匹配，可用于资产盘点、技术栈识别和后续安全评估，不代表已确认存在可利用漏洞。
  reference:
  - https://livewire.laravel.com/
  metadata:
    verified: true
    max-request: 1
    product: livewire
    vendor: laravel
    shodan-query: html:"wire:id"
  tags: tech,discovery,livewire
http:
  - method: GET
    path:
      - "{{BaseURL}}"

    redirects: true

    matchers:
      - type: word
        part: body
        words:
          - "wire:id="
          - "wire:initial-data="
          - "window.livewire_app_url"
          - "window.livewire_token"
          - "livewire.js"
          - "livewire.min.js"
        condition: or
