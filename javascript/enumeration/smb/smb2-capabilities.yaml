id: smb2-capabilities

info:
  name: SMB2 能力枚举（服务漏洞）
  author: pussycat0x
  severity: low
  description: |
    SMB2/SMB3 服务会在协商响应中声明持久句柄、目录租约、多通道、加密等能力标志。该模板发起 SMB2 能力查询并输出启用的 Capabilities 字段，用于评估服务端协议能力与安全配置。
  impact: |
    - SMB2 能力信息会暴露服务是否支持签名、加密、持久句柄等安全与可用性特性。
    - 攻击者可据此判断中继、降级或旧客户端兼容攻击的可行性。
  remediation: |
    - 启用并强制 SMB 签名/加密等安全能力，禁用不需要的旧兼容选项。
    - 限制 SMB 服务访问来源，并定期审计 SMB2/3 安全配置。
  reference:
    - https://nmap.org/nsedoc/scripts/smb2-capabilities.html
  metadata:
    max-request: 1
    shodan-query: port:445
  tags: js,network,smb,enum,discovery

javascript:
  - pre-condition: |
      isPortOpen(Host,Port);
    code: |
      var m = require("nuclei/smb");
      var c = m.SMBClient();
      var response = c.ConnectSMBInfoMode(Host, Port);
      Export(response);

    args:
      Host: "{{Host}}"
      Port: "445"

    extractors:
      - type: json
        part: response
        json:
          - '.Capabilities | with_entries(select(.value == true)) | keys'
