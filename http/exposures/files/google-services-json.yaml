id: google-services-json

info:
  name: Google Service JSON 泄露（暴露面识别）
  author: DhiyaneshDK
  severity: low
  description: 检测到对外可访问的 Google Service JSON。相关文件可能泄露项目结构、依赖关系、部署细节、敏感参数或其他不应公开的内部信息。
  reference:
    - https://www.exploit-db.com/ghdb/6886
  metadata:
    verified: true
    max-request: 3
    google-query: intitle:"index of" "google-services.json"
  tags: google,cloud,exposure,files,vuln

http:
  - method: GET
    path:
      - "{{BaseURL}}/google-services.json"
      - "{{BaseURL}}/app/google-services.json"
      - "{{BaseURL}}/android/app/google-services.json"

    stop-at-first-match: true

    matchers-condition: and
    matchers:
      - type: word
        words:
          - 'storage_bucket'
          - 'oauth_client'
        condition: and

      - type: status
        status:
          - 200
