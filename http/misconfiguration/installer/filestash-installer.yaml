id: filestash-installer

info:
  name: 文件tash 安装向导 暴露
  author: DhiyaneshDk
  severity: high
  description: |
    检测到 文件tash 安装向导 暴露。该页面属于安装、初始化或配置向导流程，若对外暴露，攻击者可能完成初始化、创建管理员账户或重新配置目标系统。
  classification:
    cpe: cpe:2.3:a:filestash:filestash:*:*:*:*:*:*:*:*
  metadata:
    verified: true
    max-request: 1
    vendor: filestash
    product: filestash
    shodan-query: html:"Admin Console" html:"component-loader"
  tags: misconfig,exposure,install,filestash,vuln

http:
  - method: GET
    path:
      - "{{BaseURL}}/admin/setup"

    matchers-condition: and
    matchers:
      - type: word
        part: body
        words:
          - "<title>Admin Console</title>"
          - "component-loader"
        condition: and

      - type: status
        status:
          - 200
