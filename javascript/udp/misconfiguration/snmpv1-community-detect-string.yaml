id: snmpv1-community-detect-string

info:
  name: SNMPv1 默认 public 团体字串（服务漏洞）
  author: matejsmycka
  severity: high
  description: |
    SNMPv1 使用明文 community 作为访问控制凭据，默认 public 团体字串通常代表只读访问。若网络设备或服务器仍接受 public 查询，远程攻击者可能未授权读取系统名称、接口、路由和运行状态等 OID 信息；该模板使用 public community 发送 SNMPv1 sysName.0 查询，并以有效响应作为命中依据。
  impact: |
    - 攻击者可未授权读取 SNMP 对象，获取设备名称、接口、路由、服务状态和部分配置线索。
    - 枚举结果可用于绘制网络拓扑、识别关键设备、定位管理地址并辅助横向移动。
    - 在同时存在可写 community、ACL 缺失或旧固件漏洞时，弱 SNMP 配置可能进一步放大配置篡改或业务中断风险。
  remediation: |
    - 禁用 SNMPv1/v2c 或立即移除默认 public 团体字串，优先使用带认证和加密的 SNMPv3。
    - 为必须保留的 SNMP 服务配置强 community、只读最小权限和来源 ACL，仅允许可信监控系统访问。
    - 轮换可能泄露的 community，审计异常 SNMP 轮询，并关闭不需要暴露的 OID 视图。
  reference:
    - https://hackers-arise.com/exploiting-snmpv1-for-reconnaissance/
    - https://hacktricks.boitatech.com.br/pentesting/pentesting-snmp
    - https://www.tenable.com/plugins/nnm/1344
    - https://linux.die.net/man/1/snmpwalk
  classification:
    cwe-id: CWE-306
  metadata:
    verified: true
    max-request: 1
    shodan-query: product:"SNMP"
  tags: js,udp,network,snmp,vuln

javascript:
  - pre-condition: |
      isUDPPortOpen(Host, Port);

    code: |
      const c = require("nuclei/net");
      const conn = c.Open('udp', `${Host}:${Port}`, `${Timeout}`);
      let community_string =  bytes.NewBuffer();
      community_string.WriteString(Community);
      let payload = "30290201010406";
      payload += community_string.Hex();
      payload += "a01c02040eb376f4020100020100"
      payload += "300e300c06082b060102010105000500" // VarBind list for sysName.0
      conn.SendHex(payload);
      let resp = conn.RecvFull(64);
      resp;

    args:
      Host: "{{Host}}"
      Port: 161
      Timeout: 2
      Community: "{{community_string}}"

    attack: clusterbomb

    payloads:
      community_string:
        - public

    matchers:
      - type: binary
        binary:
          - "0201010406"

    extractors:
      - type: regex
        group: 1
        regex:
          - "public.*\x00\x04.(.*)"
