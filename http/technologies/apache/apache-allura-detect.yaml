id: apache-allura-detect

info:
  name: Apache Allura 指纹识别（指纹识别）
  author: icarot
  severity: info
  description: |-
    Apache Allura 是开源项目托管和协作平台，用于代码仓库、工单、Wiki 和讨论管理。该模板请求 `/neighborhood`，并依据 HTTP 200 状态码、页面标题、正文关键字或品牌资源特征识别目标是否使用或暴露了 Apache Allura 相关组件，适用于资产盘点、技术栈识别和后续安全评估；命中结果仅表示指纹特征匹配，不代表已确认存在可利用漏洞。
  reference:
  - https://allura.apache.org/
  classification:
    cpe: cpe:2.3:a:apache:allura:*:*:*:*:*:*:*:*
  metadata:
    max-request: 1
    vendor: apache
    product: allura
    verified: true
    fofa-query: body="Apache Allura"
  tags: tech,allura,apache,detect,discovery

http:
  - method: GET
    path:
      - "{{BaseURL}}/neighborhood"

    matchers-condition: and
    matchers:
      - type: word
        words:
          - '<title>All Neighborhoods</title>'
          - '>Apache Allura</a>'
        condition: and

      - type: status
        status:
          - 200
