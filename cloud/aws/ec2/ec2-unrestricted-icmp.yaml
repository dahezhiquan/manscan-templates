id: ec2-unrestricted-icmp
info:
  name: EC2 安全组对公网开放 ICMP（云安全）
  author: princechaddha
  severity: critical
  description: EC2 安全组对公网开放 ICMP 是一类网络探测面扩大风险，实例可被任意来源进行 ping 或其他 ICMP 探测。虽然 ICMP 不等同于应用服务暴露，但会帮助外部攻击者识别存活主机和网络路径。模板通过 `describe-security-groups` 筛选协议为 ICMP 且来源为 `0.0.0.0/0` 的入站规则，并输出命中的安全组 ID。
  impact: |
    - 外部攻击者可更容易发现实例存活状态，辅助后续端口扫描和攻击路径选择。
    - 宽泛 ICMP 规则可能暴露网络诊断面，并增加异常流量和探测噪声。
  remediation: |
    - 移除面向公网的 ICMP 入站规则，或仅允许受信任运维网段进行诊断。
    - 对确需公网 ICMP 的服务，限制 ICMP 类型和来源范围，并监控异常探测流量。
  reference:
    - https://docs.aws.amazon.com/AWSEC2/latest/UserGuide/security-group-rules-reference.html
  metadata:
    vendor: amazon
    product: ec2
  tags: cloud,devops,aws,amazon,ec2,aws-cloud-config


variables:
  region: "us-east-1"

self-contained: true
code:
  - engine:
      - sh
      - bash
    source: |
      aws ec2 describe-security-groups --region $region --filters Name=ip-permission.protocol,Values=icmp Name=ip-permission.cidr,Values='0.0.0.0/0' --query 'SecurityGroups[*].GroupId' --output json

    extractors:
      - type: json
        name: securitygroup
        internal: true
        json:
          - '.[]'

      - type: dsl
        dsl:
          - 'securitygroup + " security group(s) alows unrestricted ICMP access (0.0.0.0/0 or ::/0)"'
