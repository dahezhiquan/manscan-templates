id: mosparo-install

info:
  name: mosparo 暴露 安装
  author: DhiyaneshDK
  severity: high
  description: |
    检测到 mosparo 暴露 安装。该页面属于安装、初始化或配置向导流程，若对外暴露，攻击者可能完成初始化、创建管理员账户或重新配置目标系统。
  classification:
    cpe: cpe:2.3:a:mosparo:mosparo:*:*:*:*:*:*:*:*
  metadata:
    verified: true
    max-request: 1
    vendor: mosparo
    product: mosparo
    shodan-query: title:"Setup - mosparo"
  tags: misconfig,mosparo,install,vuln

http:
  - method: GET
    path:
      - "{{BaseURL}}/setup/"

    matchers-condition: and
    matchers:
      - type: word
        words:
          - '<title>Setup - mosparo'

      - type: status
        status:
          - 200
