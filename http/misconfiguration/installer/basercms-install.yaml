id: basercms-install

info:
  name: baserCMS 安装 暴露
  author: ritikchaddha
  severity: critical
  description: |
    检测到 baserCMS 安装 暴露。该页面属于安装、初始化或配置向导流程，若对外暴露，攻击者可能完成初始化、创建管理员账户或重新配置目标系统。
  remediation: |
    - 删除或限制安装向导、初始化页面和示例配置入口。
    - 完成部署后强制关闭安装流程，并为后台入口启用认证和访问控制。
  reference:
    - https://basercms.net/
  classification:
    cvss-metrics: CVSS:3.1/AV:N/AC:L/PR:N/UI:N/S:U/C:L/I:H/A:H
    cvss-score: 9.4
    cwe-id: CWE-284
  metadata:
    max-request: 1
    verified: true
    product: baserCMS
    shodan-query: http.favicon.hash:-236105569
    fofa-query: app="baserCMS"
  tags: misconfig,install,basercms,cms,exposure,vuln

http:
  - method: GET
    path:
      - "{{BaseURL}}"

    host-redirects: true
    max-redirects: 2
    matchers-condition: and
    matchers:
      - type: word
        part: body
        words:
          - "basercms"
          - "<form action=\"/installations/step"
        condition: and
        case-insensitive: true

      - type: status
        status:
          - 200
