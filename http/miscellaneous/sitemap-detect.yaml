id: sitemap-detect

info:
  name: Sitemap 文件检测
  author: houdinis
  severity: info
  description: |
    检测站点地图文件。sitemap 用于描述网站页面、视频和其他文件及其关系，可帮助搜索引擎或扫描器了解站点结构。
  metadata:
    verified: true
    max-request: 3
    google-query: intext:"sitemap" filetype:txt,filetype:xml inurl:sitemap,inurl:"/sitemap.xsd" ext:xsd
  tags: miscellaneous,misc,generic,sitemap,vuln

http:
  - method: GET
    path:
      - "{{BaseURL}}/sitemap.xml"
      - "{{BaseURL}}/sitemap.xsl"
      - "{{BaseURL}}/sitemap.xsd"

    stop-at-first-match: true

    matchers-condition: and
    matchers:
      - type: word
        words:
          - "sitemap>"
        case-insensitive: true

      - type: word
        part: header
        words:
          - 'application/xml'

      - type: status
        status:
          - 200
