id: postiz-registration-enabled

info:
  name: Postiz - 用户注册已启用
  author: Th3l0newolf
  severity: low
  description: |
    该模板用于核查 Postiz - 用户注册已启用。该类问题通常源于公开注册、自助开户或默认初始化策略未按业务预期关闭。模板会向目标发送探测请求，并依据请求 `/auth`、匹配 `<title>Postiz Register</title>`、匹配 `Create Account</div></button>`、匹配 `Sign Up</h1>`等证据确认目标是否存在该配置问题。
  impact: |
    - 攻击者可自行创建账号进入系统，枚举内部功能、数据或协作空间。
    - 若新账号默认权限过高，可能进一步导致数据泄露、配置变更或平台滥用。
  remediation: |
    - 关闭不需要的公开注册和自助开户入口。
    - 对必须开放的注册流程增加审批、邮箱域限制、验证码和速率限制。
    - 审计近期新建账号、权限分配和异常登录行为。
  classification:
    cpe: cpe:2.3:a:postiz:postiz:*:*:*:*:*:*:*:*
  metadata:
    max-request: 1
    verified: true
    shodan-query: html:"Postiz Register"
  tags: postiz,misconfig,exposure

http:
  - method: GET
    path:
      - "{{BaseURL}}/auth"

    matchers-condition: and
    matchers:
      - type: word
        part: body
        words:
          - "<title>Postiz Register</title>"
          - "Create Account</div></button>"
          - "Sign Up</h1>"
        condition: and

      - type: status
        status:
          - 200
