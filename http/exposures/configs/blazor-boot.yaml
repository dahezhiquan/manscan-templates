id: blazor-boot

info:
  name: Blazor Boot 文件泄露（暴露面识别）
  author: freakyclown
  severity: info
  description: 检测到对外可访问的 Blazor Boot 文件。这类配置资源可能包含部署细节、访问凭据、内部地址、组件版本或调试开关，公开暴露后会显著增加被侦察和后续利用的风险。
  reference:
    - https://github.com/freakyclown/Nuclei_templates/blob/main/blazor_server.yaml
  metadata:
    verified: true
    max-request: 1
    github-query: 'blazor.boot.json language:JSON'
  tags: blazor,boot,exposure,config,disclosure,vuln

http:
  - method: GET
    path:
      - "{{BaseURL}}/_framework/blazor.boot.json"

    matchers:
      - type: word
        words:
          - 'Blazor'
          - '"config":'
        condition: and

    extractors:
      - type: regex
        part: body
        regex:
          - \"([^"\r\n]+\.dll)\"
