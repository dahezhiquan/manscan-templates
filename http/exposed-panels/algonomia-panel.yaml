id: algonomia-panel

info:
  name: Algonomia Leaf Platform 面板识别（暴露面识别）
  author: righettod
  severity: info
  description: |
    该模板通过识别 Algonomia Leaf Platform 登录入口的页面标题、特征文本或重定向行为，判断目标是否暴露了对应的认证界面。若命中，说明该登录面板对外可访问，可用于暴露面梳理与后续安全评估。
  reference:
    - https://algonomia.com/
  metadata:
    verified: true
    max-request: 1
  tags: tech,algonomia,detect,panel,discovery

http:
  - method: GET
    path:
      - "{{BaseURL}}/assets/i18n/en.json"

    matchers:
      - type: dsl
        dsl:
          - 'status_code == 200'
          - 'contains(to_lower(body), "logincomponent\":")'
          - 'contains_any(to_lower(body), "leafplatform", "leaf platform")'
          - 'contains(header, "application/json")'
        condition: and
