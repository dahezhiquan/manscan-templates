id: symfony-lock-exposure

info:
  name: Symfony Lock 文件暴露（暴露面识别）
  author: ritikchaddha
  severity: low
  description: |
    检测到对外可访问的 Symfony Lock 文件。这类配置资源可能包含部署细节、访问凭据、内部地址、组件版本或调试开关，公开暴露后会显著增加被侦察和后续利用的风险。
  impact: |
    - 暴露的资源可能泄露敏感配置、内部实现细节或历史数据。
    - 攻击者可结合这些信息开展进一步侦察、未授权访问或定向利用。
  remediation: |
    - 将相关文件或接口移出 Web 根目录，或通过鉴权与访问控制限制访问。
    - 清理已暴露内容中的敏感信息，并评估是否需要轮换关联凭据。
    - 检查部署、备份与静态资源发布流程，防止同类资源再次被公开访问。
  reference:
    - https://cheatsheetseries.owasp.org/cheatsheets/Information_Leakage.html
    - https://symfony.com/doc/current/deployment.html
  metadata:
    verified: true
    max-request: 1
    vendor: symfony
    product: symfony
    shodan-query: http.component:"symfony"
    fofa-query: body="symfony.lock"
  tags: symfony,exposure,composer,php,config

http:
  - method: GET
    path:
      - "{{BaseURL}}/symfony.lock"

    matchers:
      - type: dsl
        dsl:
          - 'contains_all(body, "version\":", ": {", "branch\":")'
          - 'contains_any(body, "symfony/", "php\":")'
          - 'status_code == 200'
        condition: and
