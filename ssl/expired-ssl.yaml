id: expired-ssl

info:
  name: 过期 SSL 证书（证书安全）
  author: pdteam
  severity: low
  description: 该模板检测目标是否部署了已过期的 SSL/TLS 证书。证书过期后，客户端无法再可靠验证站点身份，浏览器和安全组件通常会给出显著告警。
  remediation: |
    - 及时续签或重新签发新的 SSL/TLS 证书，并替换已过期证书。
    - 建立证书到期监控与自动续期机制，避免业务因证书过期而中断。
  reference:
    - https://www.acunetix.com/vulnerabilities/web/tls-ssl-certificate-about-to-expire/
  metadata:
    max-request: 1
  tags: ssl,tls,vuln
ssl:
  - address: "{{Host}}:{{Port}}"
    matchers:
      - type: dsl
        dsl:
          - "expired == true"

    extractors:
      - type: kval
        kval:
          - "not_after"
