id: phppgadmin-version

info:
  name: PhpPgAdmin 版本 Information 指纹识别（指纹识别）
  author: dr0pd34d
  severity: info
  description: 用于识别目标是否部署 PhpPgAdmin 版本 Information 并提取相关版本或构建信息，模板会结合页面正文、状态码、特定路径或已知端点和版本或标识提取结果进行指纹匹配。
  classification:
    cvss-metrics: CVSS:3.1/AV:N/AC:L/PR:N/UI:N/S:U/C:N/I:N/A:N
    cvss-score: 0
    cwe-id: CWE-200
  metadata:
    max-request: 1
  tags: tech,phppgadmin,discovery

http:
  - method: GET
    path:
      - "{{BaseURL}}/phppgadmin/intro.php"

    matchers-condition: and
    matchers:
      - type: regex
        part: body
        regex:
          - '<span class="appname">phpPgAdmin</span> <span class="version">.*</span>'

      - type: status
        status:
          - 200

    extractors:
      - type: regex
        part: body
        regex:
          - 'phpPgAdmin.*\(.*\)'
