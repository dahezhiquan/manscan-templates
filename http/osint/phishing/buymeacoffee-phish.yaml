id: buymeacoffee-phish

info:
  name: Buy Me a Coffee 仿冒钓鱼网站（钓鱼网站识别）
  author: rxerium
  severity: info
  description: |
    检测到疑似仿冒 Buy Me a Coffee 的钓鱼网站。模板在目标页面返回 200、页面内容命中 Buy Me a Coffee 的品牌页面特征，且当前主机不属于 buymeacoffee.com 官方域名时触发，用于识别借用 Buy Me a Coffee 品牌页面诱导用户信任的仿冒站点。
  reference:
    - https://buymeacoffee.com
  metadata:
    max-request: 1
  tags: phishing,buymeacoffee,osint,discovery
http:
  - method: GET
    path:
      - "{{BaseURL}}"

    host-redirects: true
    max-redirects: 2

    matchers-condition: and
    matchers:
      - type: word
        words:
          - 'Buy Me a Coffee is the best way for creators and artists to accept support and membership from their fans.'
          - '<title>Buy Me a Coffee'
        condition: and

      - type: status
        status:
          - 200

      - type: dsl
        dsl:
          - '!contains(host,"buymeacoffee.com")'
