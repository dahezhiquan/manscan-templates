id: spinnaker-detect

info:
  name: Spinnaker 指纹识别（指纹识别）
  author: Adam Crosser
  severity: info
  description: >-
    Spinnaker 是持续交付平台，用于跨云部署、流水线编排和发布管理。该模板通过请求目标服务并检查预设路径或首页响应、页面正文关键字、DSL 条件等指纹特征，判断目标是否使用或暴露了
    Spinnaker 相关组件；命中结果仅表示指纹特征匹配，可用于资产盘点、技术栈识别和后续安全评估，不代表已确认存在可利用漏洞。
  metadata:
    max-request: 1
  tags: tech,spinnaker,discovery
http:
  - method: GET
    path:
      - "{{BaseURL}}"

    matchers-condition: or
    matchers:
      - type: word
        part: body
        words:
          - '<spinnaker ng-if="!authenticating"></spinnaker>'

      - type: dsl
        dsl:
          - "contains(tolower(header), 'x-spinnaker-priority')"
