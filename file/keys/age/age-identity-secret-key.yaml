id: age-identity-secret-key

info:
  name: Age X25519 身份私钥敏感信息检测（本地文件安全扫描）
  author: DhiyaneshDK
  severity: high
  description: |
    Age X25519 身份私钥用于证明设备、用户或应用的加密身份。私钥一旦泄露，攻击者可能冒充持有者建立 SSH、VPN、签名或解密关系；公钥材料本身通常不具备同等风险。本模板匹配 `AGE-SECRET-KEY-1` 开头的 age X25519 身份私钥格式。
  impact: |
    - 攻击者可利用该身份私钥解密发往对应 age 收件方的文件，或在依赖该身份的自动化流程中冒充合法接收方。
    - 私钥若与仓库、备份或部署系统中的加密数据同时泄露，可能导致历史敏感文件被批量解密。
    - 该格式命中不代表密钥仍在使用，但应结合密钥分发记录和加密文件来源核实影响范围。
  remediation: |
    - 生成新的 age 身份密钥并从允许的收件方配置中移除旧身份，重新加密仍需保护的文件。
    - 将身份私钥保存在受控密钥存储中，限制文件权限和自动化任务访问范围，不要提交到源码、日志或构建产物。
    - 清理仓库历史、备份和缓存中的旧私钥，并检查相关加密文件是否已被未授权读取或解密。
  reference:
    - https://github.com/praetorian-inc/noseyparker/blob/main/crates/noseyparker/data/default/builtin/rules/age.yml
    - https://github.com/FiloSottile/age/blob/main/doc/age.1.html
    - https://github.com/C2SP/C2SP/blob/8b6a842e0360d35111c46be2a8019b2276295914/age.md#the-x25519-recipient-type
  metadata:
    verified: true
  tags: file,keys,age-encryption,token

file:
  - extensions:
      - all

    extractors:
      - type: regex
        part: body
        regex:
          - '\bAGE-SECRET-KEY-1[0-9A-Z]{58}\b'
