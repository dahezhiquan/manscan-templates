id: vmware-authentication-daemon

info:
  name: VMware Authentication Daemon 识别（指纹识别）
  author: pussycat0x
  severity: info
  description: |
    VMware Authentication Daemon 是 VMware 主机相关的认证与远程控制支持服务。该模板连接 902/TCP，不发送数据，读取服务端主动返回的 220 横幅；根据登录提示、SOAP/IPC 与 VNC 协议声明，或 SSL Required 提示确认服务，并提取横幅中的守护进程版本。SSL Required 表示服务要求加密连接，不代表模板已完成 TLS 握手。
  metadata:
    verified: true
    max-request: 1
    shodan-query: product:"VMware Authentication Daemon"
  tags: network,vmware-auth,authenticated,detect,tcp,discovery
tcp:
  - host:
      - "{{Hostname}}"
    port: 902
    read-size: 2048

    matchers-condition: or
    matchers:
      - type: regex
        part: data
        regex:
          - '^220 VMware Authentication Daemon Version [0-9][A-Za-z0-9._-]*[^\r\n]*\r\n530 Please login with USER and PASS\.\r\n'
          - '^220 VMware Authentication Daemon Version [0-9][A-Za-z0-9._-]*, ServerDaemonProtocol:(?:SOAP|IPC), MKSDisplayProtocol:VNC'
          - '^220 VMware Authentication Daemon Version [0-9][A-Za-z0-9._-]*: SSL [rR]equired\r\n'
          - '^220 VMware Authentication Daemon Version [0-9][A-Za-z0-9._-]*: SSL [rR]equired, MKSDisplayProtocol:VNC[ \t]*\r\n'
          - '^220 VMware Authentication Daemon Version [0-9][A-Za-z0-9._-]*: SSL [rR]equired, ServerDaemonProtocol:(?:SOAP|IPC), MKSDisplayProtocol:VNC'

    extractors:
      - type: regex
        name: vmware-auth-version
        part: data
        regex:
          - '^220 VMware Authentication Daemon Version ([0-9][A-Za-z0-9._-]*)'
        group: 1
