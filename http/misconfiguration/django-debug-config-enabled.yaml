id: django-debug-config-enabled

info:
  name: Django 调试 配置 启用
  author: dhiyaneshDK,hackergautam
  severity: medium
  description: |
    该模板用于核查 Django 调试 配置 启用。该类问题通常源于生产环境暴露调试页面、错误回溯、诊断端点、指标接口或详细错误信息。模板会向目标发送探测请求，并依据请求 `/NON_EXISTING_PATH/`、匹配 `URLconf defined`、匹配 `Page not found`、匹配 `Django tried these URL patterns, in this order`等证据确认目标是否存在该配置问题。
  impact: |
    - 攻击者可获取应用路径、框架版本、环境变量、内部调用栈、运行参数或依赖信息。
    - 这些信息可帮助攻击者定位组件版本、构造后续漏洞利用或发现内部系统结构。
  remediation: |
    - 关闭生产环境调试模式、错误回溯、示例页面和诊断接口。
    - 对确需保留的运维端点增加认证授权、来源限制和访问审计。
    - 统一错误处理策略，避免向外部用户返回堆栈、环境变量和内部路径。
  metadata:
    max-request: 1
  tags: django,debug,misconfig,vuln

http:
  - method: GET
    path:
      - "{{BaseURL}}/NON_EXISTING_PATH/"

    matchers-condition: and
    matchers:
      - type: word
        words:
          - URLconf defined
          - Page not found
          - Django tried these URL patterns, in this order
        condition: and

      - type: status
        status:
          - 404
