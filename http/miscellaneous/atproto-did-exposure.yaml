id: atproto-did-exposure

info:
  name: Well-Known ATProto DID 暴露
  author: rxerium
  severity: low
  description: |
    检测 Bluesky/AT Protocol 使用的 .well-known/atproto-did 资源。该资源用于将域名与 AT Protocol 的去中心化标识符关联。
  impact: |
    - well-known 策略或身份文件通常用于公开声明域名、应用、邮件、证书或身份关联。
    - 若内容过期、配置错误或非预期暴露，可能泄露组织关系、端点能力、用户标识或验证材料。
  remediation: |
    - 确认该 well-known 文件是否为业务或合规所需；非必要内容应删除或限制访问。
    - 定期检查文件内容是否准确、未过期且不包含敏感信息。
    - 对应用关联、邮件策略、证书验证和身份声明文件建立变更审计。
  reference:
    - https://atproto.com/specs/did
  metadata:
    verified: true
    max-request: 1
    google-query: inurl:"/.well-known/atproto-did"
  tags: well-known,atproto,bluesky,misc,identity,miscellaneous,vuln

http:
  - method: GET
    path:
      - "{{BaseURL}}/.well-known/atproto-did"
      - "{{BaseURL}}/well-known-atproto-did"

    redirects: true
    stop-at-first-match: true

    matchers-condition: and
    matchers:
      - type: word
        words:
          - 'atproto'
          - 'did:plc'
        condition: and

      - type: status
        status:
          - 200
