id: catalog-creator-detect

info:
  name: CATALOGcreator Page 登录面板指纹识别（指纹识别）
  author: ritikchaddha
  severity: info
  description: 用于识别目标暴露的 CATALOGcreator Page 登录面板，模板会结合页面正文、状态码和特定路径或已知端点判断是否存在对应技术或默认页面特征。
  classification:
    cvss-metrics: CVSS:3.0/AV:N/AC:L/PR:N/UI:N/S:U/C:N/I:N/A:N
    cvss-score: 0
    cwe-id: CWE-200
  metadata:
    verified: true
    max-request: 2
    shodan-query: http.html:"powered by CATALOGcreator"
  tags: tech,catalogcreater,panel,discovery

http:
  - method: GET
    path:
      - '{{BaseURL}}'
      - '{{BaseURL}}/index.php'

    stop-at-first-match: true
    host-redirects: true
    max-redirects: 2

    matchers-condition: and
    matchers:
      - type: word
        part: body
        words:
          - 'Powered by CATALOGcreator'
          - 'content="CATALOGcreator'
        condition: or
        case-insensitive: true

      - type: status
        status:
          - 200
