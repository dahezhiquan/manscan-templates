id: hotjar-rum-detect

info:
  name: Hotjar RUM 指纹识别（指纹识别）
  author: Shivam Kamboj
  severity: info
  description: >-
    Hotjar 是用户行为分析平台，RUM 脚本用于采集页面热力图、会话回放和用户反馈数据。该模板通过请求目标服务并检查预设路径或首页响应、页面正文关键字、正则特征、DSL
    条件等指纹特征，判断目标是否使用或暴露了 Hotjar RUM 相关组件；命中结果仅表示指纹特征匹配，可用于资产盘点、技术栈识别和后续安全评估，不代表已确认存在可利用漏洞。
  reference:
  - https://www.hotjar.com/
  metadata:
    max-request: 1
    verified: true
    shodan-query: http.html:"static.hotjar.com"
    fofa-query: body="hotjar" || header="hotjar"
  tags: tech,discovery,rum,hotjar
http:
  - method: GET
    path:
      - "{{BaseURL}}"

    redirects: true
    max-redirects: 3

    matchers-condition: and
    matchers:
      - type: dsl
        dsl:
          - "status_code == 200 || status_code == 400"
        condition: and

      - type: regex
        part: body
        regex:
          - "h\\._hjSettings\\s*=\\s*\\{\\s*hjid\\s*:"
          - "_hjSettings\\s*=\\s*\\{\\s*hjid\\s*:"
          - "<script[^>]*src=['\"][^'\"]*static\\.hotjar\\.com[^'\"]*['\"]"
          - "<script[^>]*src=['\"][^'\"]*script\\.hotjar\\.com[^'\"]*['\"]"
          - "window\\.hj\\s*=\\s*window\\.hj\\s*\\|\\|"
          - "\\(function\\s*\\([^)]*\\)\\s*\\{[^}]*hotjar[^}]*hjid"
        condition: or
