id: gcloud-pg-log-min-duration-statement-enabled

info:
  name: PostgreSQL 数据库实例启用了 log_min_duration_statement（云安全）
  author: princechaddha
  severity: medium
  description: PostgreSQL log_min_duration_statement 控制慢语句记录阈值，阈值过低会记录大量 SQL 语句并增加敏感信息暴露与日志噪声。本模板检查 Cloud SQL PostgreSQL 实例的 log_min_duration_statement，值不为 -1 且匹配 1 到 100 毫秒范围时报告配置不符合基线。
  impact: |
    - 过低阈值可能将大量业务 SQL、参数和访问模式写入日志，增加敏感数据暴露面。
    - 日志量激增会提高存储成本，并影响安全团队从日志中识别真正异常事件。
  remediation: |
    - 按组织数据库审计基线设置 log_min_duration_statement，避免长期使用过低阈值。
    - 对需要诊断慢查询的场景使用临时变更窗口，并在完成分析后恢复到批准配置。
  reference:
    - https://cloud.google.com/sql/docs/postgres/flags
  metadata:
    vendor: google
    product: cloud-sql
  tags: cloud,devops,gcp,gcloud,google-cloud-sql,postgresql,gcp-cloud-config

flow: |
  code(1)
  for(let projectId of iterate(template.projectIds)){
    set("projectId", projectId)
    code(2)
    for(let sqlInstance of iterate(template.sqlInstances)){
      set("sqlInstance", sqlInstance)
      code(3)
    }
  }

self-contained: true

code:
  - engine:
      - sh
      - bash
    source: |
      gcloud projects list --format="json(projectId)"

    extractors:
      - type: json
        name: projectIds
        internal: true
        json:
          - '.[].projectId'

  - engine:
      - sh
      - bash
    source: |
      gcloud sql instances list --project $projectId --filter='DATABASE_VERSION:POSTGRES*' --format="json(name)"

    extractors:
      - type: json
        name: sqlInstances
        internal: true
        json:
          - '.[].name'

  - engine:
      - sh
      - bash
    source: |
      gcloud sql instances describe $sqlInstance --project $projectId --format=json | jq '.settings.databaseFlags // [] | .[] | select(.name=="log_min_duration_statement") | .value'

    matchers-condition: and
    matchers:
      - type: word
        part: body
        words:
          - "-1"
        negative: true

      - type: regex
        regex:
          - '^(?:100|[1-9][0-9]?)$'

    extractors:
      - type: dsl
        dsl:
          - '"The log_min_duration_statement flag is set to a non-compliant value for PostgreSQL instance " + sqlInstance + " in project " + projectId'
