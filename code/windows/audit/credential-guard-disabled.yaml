id: credential-guard-disabled

info:
  name: Credential Guard 未启用（本地基线扫描）
  author: princechaddha
  severity: high
  description: |
    该模板检查 Windows Defender Credential Guard 是否未启用。未启用时，凭据材料更容易被内存抓取工具访问。
  impact: |
    攻击者在入侵主机后更容易转储凭据并进行横向移动。
  remediation: |
    在支持的系统上启用 Credential Guard、虚拟化安全和相关组策略。
  tags: credential-guard,code,windows-audit

self-contained: true

code:
  - pre-condition: |
      IsWindows();
    engine:
      - powershell
      - powershell.exe
    args:
      - -ExecutionPolicy
      - Bypass
    pattern: "*.ps1"
    source: |
      Get-CimInstance -ClassName Win32_DeviceGuard -Namespace root\Microsoft\Windows\DeviceGuard

    matchers-condition: and
    matchers:
      - type: word
        words:
          - "AvailableSecurityProperties"

      - type: word
        words:
          - "Credential Guard"
        negative: true
