id: middleware-apache-axis-detect

info:
  name: Apache Axis/Axis2 指纹识别（指纹识别）
  author: dogasantos
  severity: info
  description: Apache Axis/Axis2 是 SOAP Web Service 框架，用于 Java Web 服务发布和调用。该模板请求首页、`/axis2/`、`/axis/`，并依据 HTTP 200 状态码、页面标题、正文关键字或品牌资源特征识别目标是否使用或暴露了 Apache Axis/Axis2 相关组件，适用于资产盘点、技术栈识别和后续安全评估；命中结果仅表示指纹特征匹配，不代表已确认存在可利用漏洞。
  classification:
    cpe: cpe:2.3:a:apache:axis:*:*:*:*:*:*:*:*
  metadata:
    verified: true
    max-request: 3
    vendor: apache
    product: axis
    shodan-query: http.html:"Apache Axis"
  tags: tech,axis2,middleware,apache,discovery

http:
  - method: GET
    path:
      - "{{BaseURL}}"
      - "{{BaseURL}}/axis2/"
      - "{{BaseURL}}/axis/"

    stop-at-first-match: true

    matchers-condition: and
    matchers:
      - type: word
        words:
          - "Validate"
          - "Welcome"
          - "Axis"
          - "deployed"
          - "installation"
          - "Admin"
        condition: and

      - type: status
        status:
          - 200
