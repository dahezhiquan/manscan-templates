id: devdojo-voyager-default-login

info:
  name: DevDojo Voyager 默认口令登录（弱口令）
  author: iamnoooob,rootxharsh,pdresearch
  severity: high
  description: |
    该模板通过尝试 DevDojo Voyager 的默认凭据，并依据认证成功后的响应特征判断目标是否仍在使用未修改的弱口令。若命中，攻击者可直接登录系统并访问相应管理功能或业务数据。
  reference:
    - https://voyager-docs.devdojo.com/getting-started/installation
  metadata:
    verified: true
    max-request: 5
    shodan-query: title:"Voyager"
  tags: default-login,voyager,devdojo,vuln

variables:
  username: "admin@admin.com"
  password: "password"

http:
  - raw:
      - |
        GET /admin/login HTTP/1.1
        Host: {{Hostname}}

    extractors:
      - type: regex
        part: body
        internal: true
        name: csrf
        group: 1
        regex:
          - 'name="_token" value="([a-zA-Z0-9]+)"'

  - raw:
      - |
        POST /admin/login HTTP/1.1
        Host: {{Hostname}}
        Content-Type: application/x-www-form-urlencoded

        _token={{csrf}}&email={{username}}&password={{password}}&

    matchers:
      - type: dsl
        dsl:
          - "contains(body,'/admin</title>')"
          - "status_code == 302"
        condition: and
