id: eks-iam-managed-policy-networking

info:
  name: EKS 节点角色未使用推荐 CNI 托管策略（云安全）
  author: princechaddha
  severity: high
  description: EKS 节点角色未使用推荐 CNI 托管策略是一类集群网络组件 IAM 权限配置风险，Amazon VPC CNI 可能缺少管理弹性网卡和 Pod IP 地址所需的标准权限。自定义或缺失策略可能导致 Pod 网络异常，过宽策略则扩大节点角色被滥用后的影响。模板枚举集群和节点组，读取 `nodegroup.nodeRole` 后检查角色附加策略中是否缺少 `arn:aws:iam::aws:policy/AmazonEKS_CNI_Policy`。
  impact: |
    - VPC CNI 权限不足可能导致 Pod 网络分配失败、节点不可用或工作负载异常。
    - 节点角色权限设计不当会扩大被攻陷节点对 VPC 网络资源的影响范围。
  remediation: |
    - 为需要运行 VPC CNI 的节点角色附加 AWS 推荐的 `AmazonEKS_CNI_Policy` 或等效最小权限策略。
    - 定期审计节点角色附加策略，移除不必要的通配权限和历史遗留权限。
  reference:
    - https://www.trendmicro.com/cloudoneconformity/knowledge-base/aws/EKS/eks-iam-managed-policy-networking.html
    - https://docs.aws.amazon.com/eks/latest/userguide/cni-iam-role.html
  metadata:
    vendor: amazon
    product: eks
  tags: cloud,devops,aws,amazon,eks,aws-cloud-config

variables:
  region: "us-east-1"

flow: |
  code(1)
  for(let cluster of iterate(template.clusters)){
    set("cluster", cluster)
    code(2)
    for(let nodegroup of iterate(template.nodegroups)){
      set("nodegroup", nodegroup)
      code(3)
      code(4)
    }
  }

self-contained: true

code:
  - engine:
      - sh
      - bash
    source: |
      aws eks list-clusters --region $region --query 'clusters' --output json

    extractors:
      - type: json
        name: clusters
        internal: true
        json:
          - '.[]'

  - engine:
      - sh
      - bash
    source: |
      aws eks list-nodegroups --region $region --cluster-name $cluster --query 'nodegroups' --output json

    extractors:
      - type: json
        name: nodegroups
        internal: true
        json:
          - '.[]'

  - engine:
      - sh
      - bash
    source: |
      aws eks describe-nodegroup --region $region --cluster-name $cluster --nodegroup-name $nodegroup --query 'nodegroup.nodeRole' --output json

    extractors:
      - type: json
        name: rolearn
        internal: true
        json:
          - '.'

  - engine:
      - sh
      - bash
    source: |
      aws iam list-attached-role-policies --role-name $(echo $rolearn | cut -d'/' -f2) --query 'AttachedPolicies[*].PolicyArn' --output json

    matchers-condition: and
    matchers:
      - type: word
        words:
          - "arn:aws:iam::aws:policy/AmazonEKS_CNI_Policy"
        negative: true

      - type: word
        words:
          - "["

    extractors:
      - type: dsl
        dsl:
          - '"EKS node group " + nodegroup + " in cluster " + cluster + " does not have AmazonEKS_CNI_Policy attached to its IAM role"'
