id: api-thecatapi

info:
  name: TheCatApi API Token 可用性校验（token喷洒）
  author: daffainfo
  severity: info
  description: 该模板通过调用 TheCatApi API 的已知接口验证提供的 token 是否有效，命中后通常表示可访问相关 API 能力。
  reference:
    - https://docs.thecatapi.com/
    - https://github.com/daffainfo/all-about-apikey/tree/main/thecatapi
  metadata:
    max-request: 1
  tags: token-spray,thecatapi

self-contained: true

http:
  - method: GET
    path:
      - "https://api.thecatapi.com/v1/votes"

    headers:
      x-api-key: "{{token}}"
    matchers:
      - type: word
        part: body
        words:
          - '"country_code":'
          - '"created_at":'
        condition: and
