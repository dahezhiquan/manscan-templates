id: qdrant-detect

info:
  name: Qdrant 检测（指纹识别）
  author: rxerium
  severity: info
  description: |-
    检测到 Qdrant，一款开源的向量数据库与向量相似度搜索引擎。
  reference:
    - https://qdrant.tech/documentation/
  metadata:
    max-request: 1
    shodan-query: 'html:"qdrant - vector search engine"'
  tags: tech,qdrant,database,vector

http:
  - method: GET
    path:
      - "{{BaseURL}}"

    matchers-condition: and
    matchers:
      - type: word
        part: body
        words:
          - '"title":"qdrant - vector search engine"'

      - type: status
        status:
          - 200
