id: kibana-panel

info:
  name: Kibana 登录面板识别（暴露面识别）
  author: petruknisme,daffainfo,c-sh0
  severity: info
  description: 该模板通过识别 Kibana 登录入口的页面标题、特征文本或重定向行为，判断目标是否暴露了对应的认证界面。若命中，说明该登录面板对外可访问，可用于暴露面梳理与后续安全评估。
  classification:
    cvss-metrics: CVSS:3.0/AV:N/AC:L/PR:N/UI:N/S:U/C:N/I:N/A:N
    cwe-id: CWE-200
    cpe: cpe:2.3:a:elastic:kibana:*:*:*:*:*:*:*:*
  metadata:
    max-request: 3
    vendor: elastic
    product: kibana
    shodan-query:
      - http.title:"Kibana"
      - http.title:"kibana"
    fofa-query: title="kibana"
    google-query: intitle:"kibana"
  tags: panel,kibana,elastic,discovery

http:
  - method: GET
    path:
      - "{{BaseURL}}"
      - "{{BaseURL}}/login"
      - "{{BaseURL}}/app/kibana"

    stop-at-first-match: true
    host-redirects: true
    max-redirects: 2

    matchers-condition: or
    matchers:
      - type: word
        part: body
        words:
          - "<title>Kibana</title>"
          - "<title>Elastic</title>"
          - "<title>Kibana Login</title>"
        condition: or

      - type: regex
        part: header
        regex:
          - '(?i)(Kbn-Name)'
