id: akuiteo-panel

info:
  name: Akuiteo 登录面板识别（指纹识别）
  author: righettod
  severity: info
  description: |-
    检测到目标站点存在 Akuiteo 相关响应特征。Akuiteo 是监控、日志、分析或仪表盘系统，用于展示运行指标、访问统计、日志事件和服务状态。模板请求 `/`、`/akuiteo.collabs/login/login.html`、`/akuiteo/login.html/` 路径，并通过页面标题或正文关键字、DSL 条件确认该系统指纹，用于资产识别、系统盘点和暴露面梳理。
  reference:
    - https://www.akuiteo.com/en/
  metadata:
    verified: true
    max-request: 1
    shodan-query: title:"Akuiteo"
  tags: panel,akuiteo,login,detect,discovery
http:
  - method: GET
    path:
      - "{{BaseURL}}"
      - "{{BaseURL}}/akuiteo.collabs/login/login.html"
      - "{{BaseURL}}/akuiteo/login.html/"

    redirects: true
    max-redirects: 2

    stop-at-first-match: true
    matchers:
      - type: dsl
        dsl:
          - 'contains_any(to_lower(body), "akuiteo collabs</title>", "akuiteo mobile</title>", "akuiteo</title>", "<title>[akuiteo]")'
        condition: and

    extractors:
      - type: regex
        part: header
        group: 1
        regex:
          - '(?i)x-akuiteo-masterhash:\s+([0-9a-f]+)'
