id: ko-fi-phish

info:
  name: Ko-fi 仿冒钓鱼网站（钓鱼网站识别）
  author: rxerium
  severity: high
  description: |
    Ko-fi 是面向电商、零售、创作者变现或线上交易的品牌平台，通常提供商品浏览、账号登录、订单、收货地址和支付流程。该模板用于识别疑似仿冒 Ko-fi 的钓鱼网站；模板访问目标站点首页，在目标页面返回 200 状态码，且页面内容命中 Ko-fi 官方页面常见文案或标题特征（“Ko-fi”、“<title>Ko-fi | Make money doing what you love”），且当前主机不属于 ko-fi.com 等官方域名时触发。该类仿冒页面通常用于诱导用户提交登录凭据、收货地址、订单信息或支付资料，可能造成账户接管、支付欺诈或个人信息泄露。
  impact: |-
    - 用户可能在仿冒页面提交登录凭据、订单、收货地址、支付卡或订阅信息，导致账号接管、支付欺诈和个人信息泄露。
    - 钓鱼站点可能被用于投递恶意链接、伪造登录流程或绕过用户对官方品牌的信任判断。
    - 品牌方或被仿冒组织可能面临客户投诉、欺诈交易、信誉受损以及后续应急处置成本。
  remediation: |-
    - 确认该站点是否为授权域名；若确认为仿冒站点，立即在网关、DNS、邮件安全和浏览器安全策略中阻断访问。
    - 向被仿冒品牌、托管商、注册商、CDN 和浏览器安全浏览服务提交滥用举报或下架请求。
    - 保留 URL、域名、解析记录、页面截图、证书和命中特征等证据，用于威胁情报关联和后续追踪。
    - 排查是否已有用户访问或提交信息；对疑似受影响账号执行密码重置、会话撤销、令牌轮换和多因素认证加固。
  reference:
    - https://ko-fi.com
  metadata:
    max-request: 1
  tags: phishing,ko-fi,osint,discovery
http:
  - method: GET
    path:
      - "{{BaseURL}}"

    host-redirects: true
    max-redirects: 2

    matchers-condition: and
    matchers:
      - type: word
        words:
          - 'Ko-fi'
          - '<title>Ko-fi | Make money doing what you love'
        condition: and

      - type: status
        status:
          - 200

      - type: dsl
        dsl:
          - '!contains(host,"ko-fi.com")'
