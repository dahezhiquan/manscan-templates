id: windows-active-desktop-enabled

info:
  name: Active Desktop 已启用（本地基线扫描）
  author: princechaddha
  severity: medium
  description: |
    该模板检查 Active Desktop 是否启用。该旧功能可加载动态内容，增加恶意脚本或内容注入风险。
  impact: |
    攻击者可能通过桌面内容投递恶意脚本或诱导用户执行。
  remediation: |
    除非确有业务需要，禁用 Active Desktop。
  tags: windows,active-desktop,security,code,windows-audit

self-contained: true

code:
  - pre-condition: |
      IsWindows();
    engine:
      - powershell.exe
    args:
      - -ExecutionPolicy
      - Bypass
    pattern: "*.ps1"
    source: |
      if ((Get-ItemProperty -Path 'HKCU:\Software\Microsoft\Windows\CurrentVersion\Policies\Explorer' -Name 'NoActiveDesktop' -ErrorAction SilentlyContinue).NoActiveDesktop -eq 0) { Write-Output 'Active Desktop enabled'; }

    matchers:
      - type: word
        words:
          - "Active Desktop enabled"
