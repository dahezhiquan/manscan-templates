id: rconfig-default-login

info:
  name: rConfig 默认口令登录（弱口令）
  author: theamanrawat
  severity: high
  description: |
    该模板用于检测 rConfig 是否仍可使用默认凭据或弱口令登录。模板主要向 `/login.php`、`/lib/crud/userprocess.php` 等认证入口发送请求，使用内置默认凭据组合进行认证尝试，并根据响应中的 `Logged in as`、`rConfig - Configuration Management` 等登录成功特征判断登录是否成功；命中说明目标未及时修改出厂、示例或初始化账号口令。
  impact: |
    - 攻击者可使用默认凭据登录 rConfig，获得与该账号对应的管理或业务权限。
    - 成功登录后可能进一步查看敏感信息、修改配置、创建账号、调用管理接口，或以该系统为入口访问内网其他资源。
  remediation: |
    - 立即修改或禁用默认账号，要求所有账户使用高强度唯一密码。
    - 将登录入口限制在可信网络范围内，并启用多因素认证、登录失败限制和异常登录告警。
    - 审计近期登录、配置变更和账号新增记录，必要时轮换相关密钥、令牌和业务凭据。
  reference:
    - https://github.com/rconfig/rconfig
  classification:
    cpe: cpe:2.3:a:rconfig:rconfig:*:*:*:*:*:*:*:*
  metadata:
    verified: true
    max-request: 2
    vendor: rconfig
    product: rconfig
    shodan-query: http.title:"rConfig"
  tags: rconfig,default-login,vuln

http:
  - raw:
      - |
        GET /login.php HTTP/1.1
        Host: {{Hostname}}
      - |
        POST /lib/crud/userprocess.php HTTP/1.1
        Host: {{Hostname}}
        Content-Type: application/x-www-form-urlencoded

        user={{username}}&pass={{password}}&sublogin=1

    attack: pitchfork
    payloads:
      username:
        - "admin"
      password:
        - "admin"
    host-redirects: true

    matchers-condition: and
    matchers:
      - type: word
        part: body_2
        words:
          - "Logged in as"
          - "rConfig - Configuration Management"
          - "dashboadFieldSet"
        condition: and

      - type: word
        part: header_2
        words:
          - text/html

      - type: status
        part: header_2
        status:
          - 200
