id: vespa-detect

info:
  name: Vespa 指纹识别（指纹识别）
  author: rxerium
  severity: info
  description: >-
    Vespa 是面向大规模搜索、推荐和向量检索的开源平台，用于低延迟查询和机器学习排序。该模板通过请求目标服务并检查预设路径或首页响应、页面正文关键字、正则特征等指纹特征，判断目标是否使用或暴露了
    Vespa 相关组件；命中结果仅表示指纹特征匹配，可用于资产盘点、技术栈识别和后续安全评估，不代表已确认存在可利用漏洞。
  reference:
  - https://vespa.ai/
  - https://github.com/vespa-engine/vespa
  - https://docs.vespa.ai/en/reference/state-v1.html
  metadata:
    verified: true
    max-request: 1
    vendor: vespa.ai
    product: vespa
    shodan-query: 'product:"Vespa"'
  tags: tech,vespa,ai,vector-db,search,detect,discovery
http:
  - method: GET
    path:
      - "{{BaseURL}}/ApplicationStatus"

    matchers-condition: and
    matchers:
      - type: word
        part: body
        words:
          - '"vespa"'
          - '"version"'
        condition: and

    extractors:
      - type: regex
        part: body
        group: 1
        regex:
          - '"vespa"\s*:\s*\{\s*"version"\s*:\s*"([0-9\.]+)"'
