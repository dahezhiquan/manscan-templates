id: azure-vm-guest-diagnostics-unenabled
info:
  name: Azure VM 客户机级诊断未启用（云安全）
  author: princechaddha
  severity: medium
  description: Azure VM 客户机级诊断可采集操作系统内的性能、事件和应用遥测；缺少 guest diagnostics 配置时，主机内部异常和安全事件可能无法集中分析。本模板枚举虚拟机，查询 resources.settings.ladCfg.diagnosticMonitorConfiguration，并在返回 null 时报告未发现客户机诊断配置。
  impact: |
    - 恶意登录、异常进程、资源耗尽和应用故障缺少遥测时，攻击者驻留时间可能延长，事件调查证据也会不足。
    - 诊断缺失会降低对横向移动、数据外传和主机配置漂移的发现能力。
  remediation: |
    - 根据操作系统和监控架构启用 Azure Monitor Agent 或适用的客户机诊断配置，选择必要的日志和指标类别。
    - 将诊断数据发送到受控 Log Analytics 工作区，配置最小权限、保留期、脱敏和针对异常主机行为的告警。
  reference:
    - https://docs.microsoft.com/en-us/azure/virtual-machines/windows/diagnostics
  metadata:
    vendor: microsoft
    product: azure-virtual-machines
  tags: cloud,devops,azure,microsoft,virtual-machines,azure-cloud-config

flow: |
  code(1);
  for (let VMData of iterate(template.vmList)) {
    VMData = JSON.parse(VMData);
    set("ids", VMData.id);
    code(2);
  }

self-contained: true
code:
  - engine:
      - sh
      - bash
    source: |
      az vm list --query '[*].{"id":id}'

    extractors:
      - type: json
        name: vmList
        internal: true
        json:
          - '.[]'

  - engine:
      - sh
      - bash
    source: |
      az vm show --ids "$ids" --query '{"GuestLevelDiagnosticsConfig": resources[*].settings.ladCfg.diagnosticMonitorConfiguration}'

    matchers-condition: and
    matchers:
      - type: word
        words:
          - '"GuestLevelDiagnosticsConfig": null'

    extractors:
      - type: dsl
        dsl:
          - 'ids + " does not have Guest-Level Diagnostics enabled"'
