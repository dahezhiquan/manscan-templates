id: unauthorized-printer-hp

info:
  name: HP Office Pro 打印机未授权访问
  author: pussycat0x,r3naissance
  severity: high
  description: |
    该模板用于核查 HP Office Pro 打印机未授权访问。该类问题通常源于管理端、API、控制台或服务接口缺少认证授权，导致未登录用户可直接访问敏感功能。模板会向目标发送探测请求，并依据请求 ``、`/hp/device/webAccess/index.htm?content=security`、状态码 200等证据确认目标是否存在该配置问题。
  impact: |
    - 攻击者可在未授权状态下查看系统状态、业务数据、任务信息或管理接口。
    - 若接口支持写操作，可能进一步导致配置篡改、服务接管、数据删除或横向移动。
  remediation: |
    - 为相关管理端和 API 启用认证授权，并按最小权限限制可访问功能。
    - 将管理接口限制在内网、VPN 或可信来源范围内，并开启访问审计。
    - 检查历史访问日志，确认是否存在未授权访问、批量枚举或异常操作。
  classification:
    cpe: cpe:2.3:h:hp:officejet_pro_8730_m9l80a:*:*:*:*:*:*:*:*
  metadata:
    max-request: 2
    vendor: hp
    product: officejet_pro_8730_m9l80a
    shodan-query: http.title:"Hp Officejet pro"
  tags: hp,iot,unauth,misconfig,intrusive,vuln

http:
  - method: GET
    path:
      - "{{BaseURL}}"
      - "{{BaseURL}}/hp/device/webAccess/index.htm?content=security"

    matchers-condition: and
    matchers:
      - type: regex
        regex:
          - '<title>(HP Officejet Pro([ 0-9A-Za-z]+)|HP Designjet([ 0-9A-Za-z]+).*)<\/title>'

      - type: status
        status:
          - 200
