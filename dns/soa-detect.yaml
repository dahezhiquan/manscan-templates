id: soa-detect

info:
  name: SOA 记录服务识别（dns）
  author: rxerium
  severity: info
  description: |
    SOA 记录包含权威区域的主名称服务器、管理员邮箱、序列号、刷新和失效时间等区域元数据。不同 DNS 托管商会使用稳定的主机名特征，因此可以据此识别 Cloudflare、AWS、Azure、Google、Akamai、阿里云等可能的 DNS 提供商。本模板查询 SOA，并按预置的厂商主机名进行匹配。
  impact: |
    - DNS 服务商、区域管理邮箱和序列信息可帮助攻击者完善基础设施画像，定位托管账户和供应链依赖。
    - 过期的 SOA 管理信息或未受保护的 DNS 托管账户可能造成故障通知遗漏、变更失控和域名解析中断。
  remediation: |
    - 使用受控的运维邮箱维护 SOA 管理联系人，避免暴露个人邮箱和已失效的责任人信息。
    - 保护 DNS 托管与注册商账户，启用多因素认证、变更审计和异常 SOA/NS 变更告警。
    - 定期核对 SOA、NS、序列号和区域刷新参数与当前 DNS 提供商及业务恢复要求的一致性。
  reference:
    - https://www.cloudflare.com/learning/dns/dns-records/dns-soa-record/
  metadata:
    verified: true
    max-request: 1
  tags: dns,soa,discovery

dns:
  - name: "{{FQDN}}"

    type: SOA

    matchers-condition: or
    matchers:
      - type: word
        name: "cloudflare"
        words:
          - "dns.cloudflare.com"

      - type: word
        name: "amazon-web-services"
        words:
          - "awsdns"

      - type: word
        name: "akamai"
        words:
          - "hostmaster.akamai.com"

      - type: word
        name: "azure"
        words:
          - "azure-dns.com"

      - type: word
        name: "ns1"
        words:
