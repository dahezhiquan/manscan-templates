id: microsoft-iis-8

info:
  name: Microsoft IIS 8 指纹识别（指纹识别）
  author: dhiyaneshDK
  severity: info
  description: >-
    Microsoft IIS 8 是 Windows Server 上的 Web 服务器组件，用于承载 ASP.NET、静态站点和企业 Web 应用。该模板通过请求目标服务并检查预设路径或首页响应、状态码、页面正文关键字等指纹特征，判断目标是否使用或暴露了
    Microsoft IIS 8 相关组件；命中结果仅表示指纹特征匹配，可用于资产盘点、技术栈识别和后续安全评估，不代表已确认存在可利用漏洞。
  classification:
    cpe: cpe:2.3:a:microsoft:iis:*:*:*:*:*:*:*:*
  metadata:
    max-request: 1
    vendor: microsoft
    product: iis
    shodan-query: http.title:"Microsoft Internet Information Services 8"
  tags: tech,iis,microsoft,discovery
http:
  - method: GET
    path:
      - "{{BaseURL}}"

    matchers-condition: and
    matchers:
      - type: status
        status:
          - 200

      - type: word
        words:
          - "<title>Microsoft Internet Information Services 8</title>"

    extractors:
      - type: regex
        name: detected_version
        part: header
        group: 1
        regex:
          - (?mi)^Server:[ \t]*Microsoft-IIS/([0-9]+(?:[.][0-9]+)+(?:[-+._][0-9A-Za-z]+)*)(?:[ \t\r]|$)
        internal: true
      - type: dsl
        dsl:
          - 'regex("^[0-9]+(?:[.][0-9]+)*(?:[-+._][0-9A-Za-z]+)*$", detected_version) ? detected_version : ""'
