id: ulanzi-clock

info:
  name: Ulanzi 时钟面板识别（IOT）
  author: fabaff
  severity: low
  description: |
    检测到 Ulanzi Clock 面板。该页面用于识别智能时钟设备的 Web 入口，暴露后可能泄露设备状态或配置入口。
  impact: |
    - 暴露的设备面板会泄露资产类型、产品型号、部署位置或管理入口，为后续弱口令和漏洞利用提供线索。
    - 若设备本身存在默认凭据或旧固件问题，攻击者可能进一步访问或控制设备。
  remediation: |
    - 确认该面板是否需要对当前网络开放；如无必要，应限制到内网、管理 VLAN 或 VPN。
    - 启用强认证，修改默认口令，并保持设备固件为受支持版本。
    - 对管理入口访问、登录失败和配置变更启用审计。
  metadata:
    max-request: 1
  tags: panel,ulanzi,iot,discovery

http:
  - method: GET
    path:
      - '{{BaseURL}}'

    matchers-condition: and
    matchers:
      - type: word
        part: body
        words:
          - '<title>Ulanzi Clock</title>'

      - type: status
        status:
          - 200
