id: x-backend-server-header-detect

info:
  name: X Backend 服务器 Header 暴露
  author: pussycat0x
  severity: low
  description: |
    检测到 X Backend 服务器 Header 暴露。目标响应或文件中可能暴露配置、凭据、密钥、令牌、环境变量或历史记录等敏感信息，可能被用于进一步入侵。
  remediation: |
    - 立即移除公开文件中的敏感信息并轮换已暴露的凭据、密钥和令牌。
    - 使用安全的密钥管理方案，并阻止配置、日志和历史文件被 Web 直接访问。
  reference:
    - https://docs.gitlab.com/user/application_security/dast/browser/checks/16.4/
    - https://www.zaproxy.org/docs/alerts/10039/
  metadata:
    verified: true
    max-request: 1
    shodan-query: "X-Backend-Server"
  tags: headers,misconfig,exposure

http:
  - method: GET
    path:
      - "{{BaseURL}}/en"

    matchers:
      - type: word
        part: header
        words:
          - "X-Backend-Server"

    extractors:
      - type: regex
        part: header
        name: hostname
        group: 1
        regex:
          - 'X-Backend-Server: ([A-Za-z0-9.-]+)'
