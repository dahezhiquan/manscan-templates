id: default-microsoft-azure-page

info:
  name: Microsoft Azure 默认页面 指纹识别（指纹识别）
  author: dhiyaneshDk
  severity: info
  description: >-
    Microsoft Azure 默认页面通常出现在 Azure 托管服务、应用服务或默认 Web 站点环境中。该模板通过请求目标服务并检查预设路径或首页响应、页面正文关键字等指纹特征，判断目标是否使用或暴露了
    Microsoft Azure 默认页面 相关组件；命中结果仅表示指纹特征匹配，可用于资产盘点、技术栈识别和后续安全评估，不代表已确认存在可利用漏洞。
  classification:
    cpe: cpe:2.3:a:microsoft:azure:*:*:*:*:*:*:*:*
  metadata:
    max-request: 1
    vendor: microsoft
    product: azure
    shodan-query: http.title:"Microsoft Azure App Service - Welcome"
  tags: tech,azure,microsoft,discovery
http:
  - method: GET
    path:
      - '{{BaseURL}}'

    matchers:
      - type: word
        words:
          - "<title>Microsoft Azure App Service - Welcome</title>"
        part: body
