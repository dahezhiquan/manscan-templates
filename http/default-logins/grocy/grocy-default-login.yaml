id: grocy-default-login

info:
  name: Grocy 默认管理员凭据（弱口令）
  author: 0x_Akoko
  severity: high
  description: |
    该模板用于检测 Grocy 是否仍可使用默认凭据或弱口令登录。模板主要向 `/login`、`/stockoverview` 等认证入口发送请求，使用内置默认凭据组合进行认证尝试，并根据响应中的 `status_code == 200`、`contains_all(to_lower(body), "grocy", "username", "password")` 等登录成功特征判断登录是否成功；命中说明目标未及时修改出厂、示例或初始化账号口令。
  impact: |
    - 攻击者可登录 Grocy 后台，管理内容、用户、插件、主题、文件或站点配置。
    - 后台权限被滥用后，可能导致页面篡改、恶意文件上传、敏感资料泄露，或进一步取得服务器执行能力。
  remediation: |
    - 立即修改默认管理员凭据，删除安装向导、演示账号和不必要的后台用户。
    - 限制后台登录入口访问来源，启用多因素认证、登录失败锁定和验证码等防护。
    - 检查近期内容、插件、主题、文件上传和管理员操作记录，确认没有持久化后门。
  reference:
    - https://github.com/grocy/grocy
    - https://docs.linuxserver.io/images/docker-grocy/
  metadata:
    verified: true
    max-request: 3
    vendor: grocy
    product: grocy
    shodan-query: 'http.title:"grocy"'
    fofa-query: 'title="grocy" || body="grocy-version"'
  tags: default-login,grocy,auth

variables:
  username: "admin"
  password: "admin"

flow: http(1) && http(2) && http(3)

http:
  - raw:
      - |
        GET /login HTTP/1.1
        Host: {{Hostname}}
        Accept: text/html

    matchers:
      - type: dsl
        internal: true
        dsl:
          - 'status_code == 200'
          - 'contains_all(to_lower(body), "grocy", "username", "password")'
        condition: and

  - raw:
      - |
        POST /login HTTP/1.1
        Host: {{Hostname}}
        Content-Type: application/x-www-form-urlencoded
        Accept: text/html

        username={{username}}&password={{password}}

    matchers:
      - type: dsl
        internal: true
        dsl:
          - 'status_code == 302'
          - '!contains(to_lower(header), "/login")'
        condition: and

  - raw:
      - |
        GET /stockoverview HTTP/1.1
        Host: {{Hostname}}
        Accept: text/html

    matchers:
      - type: dsl
        dsl:
          - 'status_code == 200'
          - 'contains_all(to_lower(body), "stock overview", "grocy")'
        condition: and
