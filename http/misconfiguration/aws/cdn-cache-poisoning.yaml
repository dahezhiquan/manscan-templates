id: cdn-cache-poisoning

info:
  name: 配置不当 CDN 缓存投毒 X Amz 服务器 Side Encryption Header
  author: 0xcharan
  severity: high
  description: |
    该模板用于核查 配置不当 CDN 缓存投毒 X Amz 服务器 Side Encryption Header相关配置。该类问题通常源于 CDN、反向代理或缓存层对 Host、路径、查询参数或异常请求头处理不一致，导致攻击者可污染缓存内容。模板会向目标发送探测请求，并依据请求 `/?{{string}}`等证据确认目标是否存在该配置问题。
  impact: |
    - 攻击者可能让缓存层保存恶意响应，使后续用户访问到被篡改的页面、脚本或重定向结果。
    - 在共享缓存命中的场景下，可能导致跨用户内容投毒、XSS、钓鱼或业务内容被替换。
  remediation: |
    - 统一源站与缓存层的 Host、路径、查询参数和异常请求头处理策略。
    - 仅缓存可信、可预期且不依赖用户输入的响应，并为动态页面设置合适的 Cache-Control。
    - 清理已污染缓存，审计 CDN/代理规则和异常缓存命中记录。
  reference:
    - https://portswigger.net/web-security/web-cache-poisoning
  metadata:
    verified: true
    max-request: 2
    shodan-query: X-Amz-Server-Side-Encryption
  tags: cache,aws,poisoning,cdn,misconfig,vuln
variables:
  string: "{{to_lower(rand_base(8))}}={{to_lower(rand_base(8))}}"

http:
  - raw:
      - |
        GET /?{{string}} HTTP/1.1
        Host: {{Hostname}}
        X-Amz-Server-Side-Encryption: {{randstr}}

      - |
        GET /?{{string}} HTTP/1.1
        Host: {{Hostname}}

    matchers:
      - type: dsl
        dsl:
          - 'contains(body_2, "{{randstr}}")'
          - 'status_code_2==400'
        condition: and
