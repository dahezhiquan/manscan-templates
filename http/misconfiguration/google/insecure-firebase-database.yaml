id: insecure-firebase-database

info:
  name: Insecure Firebase 数据库
  author: rafaelwdornelas
  severity: high
  description: |
    该模板用于核查 Insecure Firebase 数据库。该类问题通常源于云对象存储桶或兼容对象存储服务开启了公开读取、公开列表或错误访问策略。模板会向目标发送探测请求，并依据匹配 `{"id":"insecure-firebase-database"}`、匹配 `application/json`、状态码 200等证据确认目标是否存在该配置问题。
  impact: |
    - 攻击者可枚举对象列表并下载公开文件，造成业务资料、备份、日志或静态资源泄露。
    - 若桶内资源被业务系统引用，攻击者还可能利用公开内容辅助供应链攻击或品牌仿冒。
  remediation: |
    - 关闭对象存储桶公共访问和列表权限，按业务需要配置最小化 Bucket Policy。
    - 启用云厂商的公共访问阻断、访问日志和异常访问告警。
    - 检查桶内历史文件，移除敏感对象并轮换已暴露的密钥、令牌或下载链接。
  reference:
    - https://blog.securitybreached.org/2020/02/04/exploiting-insecure-firebase-database-bugbounty
  metadata:
    verified: true
    max-request: 2
  tags: firebase,google,misconfig,intrusive,vuln

http:
  - raw:
      - |
        PUT /{{randstr}}.json HTTP/1.1
        Host: {{Hostname}}
        Content-Type: application/json

        {"id":"insecure-firebase-database"}
      - |
        GET /{{randstr}}.json HTTP/1.1
        Host: {{Hostname}}

    matchers-condition: and
    matchers:
      - type: word
        part: body_2
        words:
          - '{"id":"insecure-firebase-database"}'

      - type: word
        part: header
        words:
          - "application/json"

      - type: status
        status:
          - 200
