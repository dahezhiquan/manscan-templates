id: mysql-native-password

info:
  name: MySQL 原生密码认证暴露（服务漏洞）
  author: iamthefrogy
  severity: info
  description: 该模板用于识别目标 MySQL 服务是否启用了 `mysql_native_password` 认证方式。命中说明服务仍暴露较旧的认证机制，后续可能被用于口令攻击或兼容性降级分析。
  reference:
    - https://github.com/Tinram/MySQL-Brute
  classification:
    cvss-metrics: CVSS:3.1/AV:N/AC:L/PR:N/UI:N/S:U/C:N/I:N/A:N
    cwe-id: CWE-200
  metadata:
    max-request: 1
  tags: network,mysql,db,misconfig,tcp,vuln

tcp:
  - host:
      - "{{Hostname}}"
    port: 3306

    matchers:
      - type: word
        words:
          - "mysql_native_password"
