id: anonymous-sam-enumeration-enabled

info:
  name: 允许匿名枚举 SAM 账户（本地基线扫描）
  author: princechaddha
  severity: high
  description: |
    该模板检查匿名用户是否可以枚举 Security Account Manager（SAM）账户。该配置会向未认证访问者暴露本地账户信息。
  impact: |
    攻击者可收集用户名并开展密码喷洒、暴力破解或定向社工攻击。
  remediation: |
    启用匿名访问限制，禁止匿名枚举 SAM 账户和共享信息。
  tags: windows,sam,enumeration,anonymous,code,windows-audit

self-contained: true

code:
  - pre-condition: |
      IsWindows();
    engine:
      - powershell
      - powershell.exe
    args:
      - -ExecutionPolicy
      - Bypass
    pattern: "*.ps1"
    source: |
      Get-ItemProperty -Path 'HKLM:\SYSTEM\CurrentControlSet\Control\Lsa' -Name 'RestrictAnonymousSAM'

    matchers:
      - type: word
        words:
          - "restrictanonymoussam : 0"
