id: oneblog-detect

info:
  name: OneBlog 指纹识别（指纹识别）
  author: pikpikcu,daffainfo
  severity: info
  description: >-
    OneBlog 是博客内容发布系统，用于文章编辑、分类、评论和站点管理。该模板通过请求目标服务并检查预设路径或首页响应、页面正文关键字、状态码等指纹特征，判断目标是否使用或暴露了
    OneBlog 相关组件；命中结果仅表示指纹特征匹配，可用于资产盘点、技术栈识别和后续安全评估，不代表已确认存在可利用漏洞。
  metadata:
    max-request: 1
  tags: tech,oneblog,discovery
http:
  - method: GET
    path:
      - "{{BaseURL}}"

    matchers-condition: and
    matchers:
      - type: word
        part: body
        words:
          - '<title>OneBlog开源博客后台管理系统</title>'
          - '<meta name="keywords" content="OneBlog'
        condition: or

      - type: status
        status:
          - 200
