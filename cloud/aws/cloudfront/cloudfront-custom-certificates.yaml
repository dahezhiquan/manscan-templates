id: cloudfront-custom-certificates

info:
  name: CloudFront 使用自定义 SSL/TLS 证书（云安全）
  author: DhiyaneshDK
  severity: medium
  description: CloudFront 使用自定义 SSL/TLS 证书本身不是漏洞，但会引入额外的证书生命周期和域名匹配管理风险。若自定义证书过期、SAN 不匹配或 TLS 策略配置偏弱，访问者可能遇到证书告警或弱加密连接。模板读取 `ViewerCertificate.CloudFrontDefaultCertificate`，当值为 `False` 时说明该分配绑定了自定义证书。
  impact: |
    - 自定义证书过期、域名不匹配或绑定错误会导致用户访问失败或证书告警。
    - 如果证书生命周期和 TLS 策略缺少集中管理，可能引入弱协议或不符合合规要求的加密配置。
  remediation: |
    - 优先使用 ACM 管理的有效证书，并确保备用域名、证书 SAN 和 CloudFront 分配配置一致。
    - 持续监控证书到期时间和最低 TLS 版本，必要时切换到更严格的安全策略。
  reference:
    - https://www.trendmicro.com/cloudoneconformity-staging/knowledge-base/aws/CloudFront/cloudfront-distro-custom-tls.html
    - https://docs.aws.amazon.com/AmazonCloudFront/latest/DeveloperGuide/CNAMEs.html
  metadata:
    vendor: amazon
    product: cloudfront
  tags: cloud,devops,aws,amazon,cloudfront,aws-cloud-config

variables:
  region: "us-west-2"

flow: |
  code(1)
  for(let DistributionListItemsId of iterate(template.distributions)){
    set("distribution", DistributionListItemsId)
    code(2)
  }

self-contained: true

code:
  - engine:
      - sh
      - bash

    source: |
      aws cloudfront list-distributions --output table --query 'DistributionList.Items[*].Id' --region $region --output json

    extractors:
      - type: json
        name: distributions
        internal: true
        json:
          - '.[]'

  - engine:
      - sh
      - bash

    source: |
        aws cloudfront get-distribution --region $region --id $distribution --query 'Distribution.DistributionConfig.ViewerCertificate.CloudFrontDefaultCertificate' --output text

    matchers:
      - type: word
        words:
          - "False"

    extractors:
      - type: dsl
        dsl:
          - '"Cloudfront Custom SSL/TLS Certificates " + distribution + " In Use"'
