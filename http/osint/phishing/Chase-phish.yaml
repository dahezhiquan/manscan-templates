id: Chase-phish

info:
  name: Chase 仿冒钓鱼网站（钓鱼网站识别）
  author: rxerium
  severity: info
  description: |
    检测到疑似仿冒 Chase 的钓鱼网站。模板在目标页面返回 200、页面内容命中 Chase 的金融或支付页面特征，且当前主机不属于 chase.com 官方域名时触发，用于识别借用 Chase 品牌页面诱导用户信任的仿冒站点。
  reference:
    - https://chase.com
  metadata:
    max-request: 1
  tags: phishing,Chase,osint,discovery
http:
  - method: GET
    path:
      - "{{BaseURL}}"

    host-redirects: true
    max-redirects: 2

    matchers-condition: and
    matchers:
      - type: word
        words:
          - 'Credit Card, Mortgage, Banking, Auto | Chase Online | Chase.com'

      - type: status
        status:
          - 200

      - type: dsl
        dsl:
          - '!contains(host,"chase.com")'
