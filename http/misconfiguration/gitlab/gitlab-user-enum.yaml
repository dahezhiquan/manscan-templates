id: gitlab-user-enum

info:
  name: GitLab 用户枚举
  author: Suman_Kar
  severity: medium
  description: |
    该模板用于核查 GitLab 用户枚举。该类问题通常源于用户、账号、仓库或接口查询端点缺少枚举防护，导致攻击者可批量验证目标对象是否存在。模板会向目标发送探测请求，并依据状态码 200、匹配 `application/json`等证据确认目标是否存在该配置问题。
  impact: |
    - 攻击者可收集有效账号、仓库、用户资料或组织结构信息。
    - 枚举结果可被用于密码喷洒、钓鱼、凭据填充或后续权限攻击。
  remediation: |
    - 对枚举接口增加认证授权、速率限制和统一错误响应。
    - 避免在未授权响应中区分“存在”和“不存在”等状态差异。
    - 监控批量查询、异常失败率和针对账号空间的自动化探测。
  reference:
    - https://github.com/danielmiessler/SecLists/blob/master/Usernames/Names/malenames-usa-top1000.txt
  metadata:
    max-request: 100
    shodan-query: http.title:"GitLab"
  tags: gitlab,enum,misconfig,fuzz,vuln

http:
  - raw:
      - |
        GET /users/{{user}}/exists HTTP/1.1
        Host: {{Hostname}}
        Accept: application/json, text/plain, */*
        Referer: {{BaseURL}}

    payloads:
      user: helpers/wordlists/user-list.txt
    stop-at-first-match: true

    matchers-condition: and
    matchers:
      - type: regex
        part: body
        regex:
          - "exists.*:true"

      - type: status
        status:
          - 200

      - type: word
        part: header
        words:
          - "application/json"
