id: gitea-public-signup

info:
  name: Gitea 公开注册已启用
  author: edoardottt
  severity: high
  description: |
    该模板用于核查 Gitea 公开注册已启用。该类问题通常源于公开注册、自助开户或默认初始化策略未按业务预期关闭。模板会向目标发送探测请求，并依据请求 `/user/sign_up`、匹配 `Powered by Gitea`、匹配 `Register -`、匹配注册关闭提示等证据确认目标是否存在该配置问题。
  impact: |
    - 攻击者可自行创建账号进入系统，枚举内部功能、数据或协作空间。
    - 若新账号默认权限过高，可能进一步导致数据泄露、配置变更或平台滥用。
  remediation: |
    - 关闭不需要的公开注册和自助开户入口。
    - 对必须开放的注册流程增加审批、邮箱域限制、验证码和速率限制。
    - 审计近期新建账号、权限分配和异常登录行为。
  reference:
    - https://www.youtube.com/watch?v=oHhofSj9lEM&t=157s
    - https://gitea.io/en-us/
  classification:
    cpe: cpe:2.3:a:gitea:gitea:*:*:*:*:*:*:*:*
  metadata:
    verified: true
    max-request: 1
    vendor: gitea
    product: gitea
    shodan-query: html:"Powered by Gitea"
  tags: misconfig,gitea,vuln

http:
  - method: GET
    path:
      - '{{BaseURL}}/user/sign_up'

    matchers-condition: and
    matchers:
      - type: word
        words:
          - 'Powered by Gitea'
          - 'Register -'
        condition: and

      - type: word
        part: body
        words:
          - "Registration is disabled. Please contact your site administrator."
        negative: true

      - type: status
        status:
          - 200
