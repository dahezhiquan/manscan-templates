id: azure-functions-hostjson-exposure

info:
  name: Azure Functions host.JSON 配置暴露（暴露面识别）
  author: pussycat0x
  severity: medium
  description: |
    检测到对外可访问的 Az。这类配置资源可能包含部署细节、访问凭据、内部地址、组件版本或调试开关，公开暴露后会显著增加被侦察和后续利用的风险。
  metadata:
    max-request: 1
    verified: false
  tags: azure,config,exposure,misconfig

http:
  - method: GET
    path:
      - "{{BaseURL}}/host.json"

    matchers-condition: and
    matchers:
      - type: word
        part: body
        words:
          - '"version"'

      - type: word
        part: body
        words:
          - '"extensionBundle"'
          - '"functionTimeout"'
          - '"logging"'
          - '"extensions"'
          - '"healthMonitor"'
          - '"singleton"'
          - '"concurrency"'
          - '"Microsoft.Azure.Functions.ExtensionBundle"'
        condition: or

      - type: status
        status:
          - 200
