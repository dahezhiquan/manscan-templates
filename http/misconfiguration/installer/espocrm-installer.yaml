id: espocrm-installer

info:
  name: Espocrm 安装向导
  author: DhiyaneshDk
  severity: high
  description: |
    检测到 Espocrm 安装向导。该页面属于安装、初始化或配置向导流程，若对外暴露，攻击者可能完成初始化、创建管理员账户或重新配置目标系统。
  classification:
    cpe: cpe:2.3:a:espocrm:espocrm:*:*:*:*:*:*:*:*
  metadata:
    verified: true
    max-request: 1
    vendor: espocrm
    product: espocrm
    shodan-query: html:"Welcome to Espocrm"
  tags: misconfig,espocrm,install,exposure,vuln

http:
  - method: GET
    path:
      - '{{BaseURL}}/install/'

    matchers-condition: and
    matchers:
      - type: word
        part: body
        words:
          - '<title>EspoCRM Installation'

      - type: status
        status:
          - 200
