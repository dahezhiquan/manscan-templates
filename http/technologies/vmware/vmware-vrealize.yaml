id: vmware-vrealize

info:
  name: VMware vRealize 指纹识别（指纹识别）
  author: milo2012
  severity: info
  description: >-
    VMware vRealize 是 VMware 云管理和自动化套件，用于资源编排、运维监控和私有云管理。该模板通过请求目标服务并检查预设路径或首页响应、状态码、页面正文关键字、HTTP
    响应头、正则特征等指纹特征，判断目标是否使用或暴露了 VMware vRealize 相关组件；命中结果仅表示指纹特征匹配，可用于资产盘点、技术栈识别和后续安全评估，不代表已确认存在可利用漏洞。
  metadata:
    max-request: 1
  tags: vmware,vrealize,tech,discovery
http:
  - method: GET
    path:
      - "{{BaseURL}}/ui/login.action"

    matchers-condition: and
    matchers:
      - type: status
        status:
          - 200

      - type: word
        words:
          - text/html
        part: header

      - type: word
        words:
          - '<title>vRealize Operations Manager</title>'
        part: body

    extractors:
      - type: regex
        part: body
        group: 1
        regex:
          - "SessionProvider.js\\?version=([0-9.]+)"
