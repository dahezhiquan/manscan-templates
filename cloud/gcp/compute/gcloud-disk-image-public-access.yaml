id: gcloud-disk-image-public-access

info:
  name: Disk Images Publicly Shared（云安全）
  author: princechaddha
  severity: medium
  description: 自定义 Compute Engine 镜像如果授予 allAuthenticatedUsers 访问权限，所有 Google Cloud 认证用户都可能发现并使用该镜像。本模板枚举项目自定义镜像并读取 IAM policy，匹配 allAuthenticatedUsers 时报告磁盘镜像被公开共享。
  impact: |
    - 镜像中可能包含系统配置、预装软件、脚本、凭据残留或敏感业务数据，公开共享会造成信息泄露。
    - 攻击者可基于镜像内容分析运行环境和弱点，为后续攻击或供应链滥用提供线索。
  remediation: |
    - 从自定义镜像 IAM policy 中移除 allAuthenticatedUsers，仅向明确项目、组或服务账号授权。
    - 复核已公开镜像是否包含敏感数据，必要时删除镜像、重建干净版本并轮换可能暴露的凭据。
  reference:
    - https://www.trendmicro.com/cloudoneconformity/knowledge-base/gcp/ComputeEngine/publicly-shared-disk-images.html
    - https://cloud.google.com/compute/docs/images/managing-access-custom-images
  metadata:
    vendor: google
    product: compute-engine
  tags: cloud,devops,gcp,gcloud,compute,security,storage,disk-images,gcp-cloud-config

flow: |
  code(1)
  for(let projectId of iterate(template.projectIds)){
    set("projectId", projectId)
    code(2)
    for(let image of iterate(template.images)){
      image = JSON.parse(image)
      set("imageName", image.name)
      code(3)
    }
  }

self-contained: true

code:
  - engine:
      - sh
      - bash
    source: |
      gcloud projects list --format="json(projectId)"

    extractors:
      - type: json
        name: projectIds
        internal: true
        json:
          - '.[].projectId'

  - engine:
      - sh
      - bash
    source: |
      gcloud compute images list --project $projectId --no-standard-images --format="json(name)"

    extractors:
      - type: json
        name: images
        internal: true
        json:
          - '.[]'

  - engine:
      - sh
      - bash
    source: |
      gcloud compute images get-iam-policy $imageName --project $projectId --format="json(bindings[].members[])"

    matchers:
      - type: word
        words:
          - '"allAuthenticatedUsers"'

    extractors:
      - type: dsl
        dsl:
          - '"Disk image " + imageName + " in project " + projectId + " is publicly shared with all Google Cloud users"'
