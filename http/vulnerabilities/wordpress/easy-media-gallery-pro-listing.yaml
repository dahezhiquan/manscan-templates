id: easy-media-gallery-pro-listing

info:
  name: WordPress Plugin Media Gallery Pro Listing
  author: pussycat0x
  severity: info
  description: WordPress Plugin Media Gallery Pro Listing 存在安全漏洞。该模板依据实际请求路径、返回特征与命中证据验证目标是否暴露相应漏洞。
  reference:
    - https://www.exploit-db.com/ghdb/6455
  metadata:
    max-request: 1
  tags: wordpress,listing,wp-plugin,vuln

http:
  - method: GET
    path:
      - "{{BaseURL}}/wp-content/plugins/easy-media-gallery-pro/"

    matchers-condition: and
    matchers:
      - type: word
        words:
          - "Index of"
          - "wp-content/plugins/easy-media-gallery-pro/"
        condition: and

      - type: status
        status:
          - 200
