id: graylog-panel

info:
  name: Graylog 登录面板识别（暴露面识别）
  author: righettod
  severity: info
  description: |
    该模板通过识别 Graylog 登录入口的页面标题、特征文本或重定向行为，判断目标是否暴露了对应的认证界面。若命中，说明该登录面板对外可访问，可用于暴露面梳理与后续安全评估。
  reference:
    - https://graylog.org/
  classification:
    cpe: cpe:2.3:a:graylog:graylog:*:*:*:*:*:*:*:*
  metadata:
    verified: true
    max-request: 1
    vendor: graylog
    product: graylog
    shodan-query: http.title:"Graylog Web Interface"
  tags: panel,graylog,login,detect,discovery

http:
  - method: GET
    path:
      - "{{BaseURL}}"

    matchers:
      - type: dsl
        dsl:
          - 'status_code == 200'
          - 'contains(body, "<title>Graylog Web Interface")'
        condition: and
