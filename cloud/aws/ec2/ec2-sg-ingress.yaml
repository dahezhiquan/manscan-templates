id: ec2-sg-ingress
info:
  name: EC2 安全组入站规则对所有地址开放（云安全）
  author: princechaddha
  severity: high
  description: EC2 安全组入站规则对所有地址开放是一类公网入站访问控制不足风险，实例端口可能接受来自任意 IPv4 或 IPv6 地址的连接。安全组是实例网络边界的关键控制，过宽入站规则会放大暴力破解、漏洞扫描和未授权访问风险。模板枚举含公网入站规则的安全组并读取 `IpPermissions`，当规则包含 `0.0.0.0/0` 或 `::/0` 时判定命中。
  impact: |
    - 暴露端口可能被互联网扫描、爆破或利用，尤其是管理、数据库和内部服务端口。
    - 一旦实例服务存在弱认证或漏洞，攻击者可能获得初始访问并进一步横向移动。
  remediation: |
    - 按最小权限收敛安全组入站 CIDR，仅允许可信办公网、VPN、负载均衡或必要对端访问。
    - 对管理端口优先使用 SSM Session Manager、堡垒机或私有网络访问，避免直接面向公网。
  reference:
    - https://docs.aws.amazon.com/AWSEC2/latest/UserGuide/security-group-rules-reference.html
  metadata:
    max-request: 2
    vendor: amazon
    product: ec2
  tags: cloud,devops,aws,amazon,ec2,aws-cloud-config
variables:
  region: "us-east-1"

flow: |
  code(1)
  for(let SecurityGroup of iterate(template.securitygroups)){
    set("groupid", SecurityGroup)
    code(2)
  }

self-contained: true
code:
  - engine:
      - sh
      - bash
    source: |
      aws ec2 describe-security-groups --region $region --filters Name=ip-permission.cidr,Values='0.0.0.0/0' --output json --query 'SecurityGroups[*].GroupId'

    extractors:
      - type: json
        name: securitygroups
        internal: true
        json:
          - '.[]'

  - engine:
      - sh
      - bash
    source: |
         aws ec2 describe-security-groups --region $region --group-ids $groupid --query 'SecurityGroups[*].IpPermissions[]'

    matchers:
      - type: word
        words:
          - "0.0.0.0/0"
          - "::/0"

    extractors:
      - type: dsl
        dsl:
          - '"Amazon EC2 security group(s) " + groupid + " allows unrestricted inbound traffic"'
