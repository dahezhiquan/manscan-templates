id: gcloud-pubsub-crossproject-access

info:
  name: Pub/Sub Subscription Cross-Project 访问（云安全）
  author: princechaddha
  severity: high
  description: Pub/Sub subscription 被授予跨项目或不受信任成员访问时，消息消费链路可能超出项目边界控制。本模板枚举项目订阅并读取 subscription IAM policy，发现绑定成员中包含邮箱形式主体时报告存在需要复核的跨项目访问授权。
  impact: |
    - 外部或非预期项目身份可能读取、确认或管理订阅消息，造成敏感事件流泄露或消费链路被干扰。
    - 订阅权限跨项目分散后，权限审计、责任归属和异常消费定位都会变得困难。
  remediation: |
    - 复核 subscription IAM policy，移除不受信任或不再需要的跨项目成员。
    - 使用受控组或服务账号授予最小权限，并通过条件、项目边界和定期审计限制消息访问范围。
  reference:
    - https://cloud.google.com/pubsub/docs/access-control
    - https://cloudone.trendmicro.com/docs/conformity
  metadata:
    vendor: google
    product: google-cloud-pubsub
  tags: cloud,devops,gcp,gcloud,google-cloud-pubsub,gcp-cloud-config

flow: |
  code(1)
  for(let projectId of iterate(template.projectIds)){
    set("projectId", projectId)
    code(2)
    for(let pubsubSubscription of iterate(template.subscriptions)){
      set("subscriptionName", pubsubSubscription)
      code(3)
    }
  }

self-contained: true

code:
  - engine:
      - sh
      - bash
    source: |
      gcloud projects list --format="json(projectId)"

    extractors:
      - type: json
        name: projectIds
        internal: true
        json:
          - '.[].projectId'

  - engine:
      - sh
      - bash
    source: |
      gcloud pubsub subscriptions list --project $projectId --format="json(name)"

    extractors:
      - type: json
        name: subscriptions
        internal: true
        json:
          - '.[].name'

  - engine:
      - sh
      - bash
    source: |
      gcloud pubsub subscriptions get-iam-policy $subscriptionName --format=json | jq '.bindings[]'

    matchers:
      - type: word
        words:
          - '@'

    extractors:
      - type: dsl
        dsl:
          - '"Pub/Sub subscription " + subscriptionName + " in project " + projectId + " has cross-project access configured with one or more untrusted members."'
