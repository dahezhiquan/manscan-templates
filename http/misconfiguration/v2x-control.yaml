id: v2x-control

info:
  name: V2X Control 仪表盘 暴露
  author: DhiyaneshDk
  severity: low
  description: |
    检测到 V2X Control 仪表盘 暴露。目标响应或文件中可能暴露配置、凭据、密钥、令牌、环境变量或历史记录等敏感信息，可能被用于进一步入侵。
  reference:
    - https://www.facebook.com/photo/?fbid=606940284809828&set=a.467014098802448
  metadata:
    verified: true
    max-request: 1
    shodan-query: title:"V2X Control"
  tags: misconfig,exposure,v2x,control,vuln

http:
  - method: GET
    path:
      - "{{BaseURL}}"

    matchers-condition: and
    matchers:
      - type: word
        part: body
        words:
          - '<title>V2X control</title>'
          - 'Chemtronics'
        condition: and

      - type: status
        status:
          - 200
