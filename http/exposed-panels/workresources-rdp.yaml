id: workresources-rdp

info:
  name: RDWeb RemoteApp and Desktop Connections - Web Access 面板识别（暴露面识别）
  author: dhiyaneshDK
  severity: info
  description: 该模板用于识别 RDWeb RemoteApp and Desktop Connections - Web Access 相关页面或服务入口是否对外暴露。若命中，说明目标可被识别为对应产品或组件，可用于资产发现与攻击面管理。
  classification:
    cvss-metrics: CVSS:3.0/AV:N/AC:L/PR:N/UI:N/S:U/C:N/I:N/A:N
    cwe-id: CWE-200
  metadata:
    max-request: 1
    shodan-query: http.title:"RD Web Access"
  tags: panel,workresources,discovery

http:
  - method: GET
    path:
      - '{{BaseURL}}/RDWeb/Pages/en-US/login.aspx'

    matchers-condition: and
    matchers:
      - type: word
        words:
          - '<title>Error: Unable to display RD Web Access</title>'

      - type: status
        status:
          - 200
