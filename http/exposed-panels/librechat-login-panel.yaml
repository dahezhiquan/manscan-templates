id: librechat-login-panel

info:
  name: LibreChat Login Panel - 识别（暴露面识别）
  author: Kazgangap
  severity: info
  description: |
    该模板通过识别 LibreChat Login 登录入口的页面标题、特征文本或重定向行为，判断目标是否暴露了对应的认证界面。若命中，说明该登录面板对外可访问，可用于暴露面梳理与后续安全评估。
  reference:
    - https://github.com/danny-avila/LibreChat
  metadata:
    fofa-query: app="LibreChat"
  tags: panel,librechat,discovery

http:
  - method: GET
    path:
      - "{{BaseURL}}/login"

    host-redirects: true

    matchers-condition: and
    matchers:
      - type: word
        words:
          - "<title>LibreChat</title>"
        part: body

      - type: status
        status:
          - 200
