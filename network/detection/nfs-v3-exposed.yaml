id: nfs-v3-exposed

info:
  name: NFSv3 暴露识别（指纹识别）
  author: johnk3r
  severity: info
  description: |
    NFSv3 是基于 RPC 的网络文件共享协议，常用于 Unix/Linux 主机之间共享目录。该模板向 2049/TCP 发送 RPC NULL 调用，请求程序号 100003、版本 3，并匹配相同 XID 与 `MSG_ACCEPTED/SUCCESS` 特征，同时排除 HTTP 响应，用于确认目标可处理 NFSv3 RPC 请求。
  impact: |
    - NFSv3 服务暴露会泄露文件共享攻击面，若导出策略、源地址限制或权限映射配置不当，可能导致目录枚举、文件读取或写入。
    - 攻击者可据此继续枚举 mountd/rpcbind 信息、导出路径和访问权限，扩大到数据泄露或横向移动风险。
  remediation: |
    - 将 NFS 仅暴露给可信内网主机，并通过防火墙限制 2049/TCP 以及相关 RPC 服务端口。
    - 检查 `/etc/exports` 或等效配置，避免对不可信网段开放读写、匿名映射不当或过宽的导出目录。
    - 优先使用更严格的认证、最小权限导出和日志审计，并及时修补 NFS 服务端组件。
  reference:
    - https://medium.com/@zoomeye_team/threat-intell-report-nfs-exposed-the-silent-attack-vector-8aa4ea0cbce1
  metadata:
    verified: true
    zoomeye-query: service=nfs && port=2049
    shodan-query: nfs
  tags: network,nfs,rpc,detect,tcp,discovery

tcp:
  - inputs:
      # Record Marking (0x80000028) + XDR CALL:
      # xid='VER3' (0x56455233), CALL(0), rpcvers=2, prog=100003, vers=3, proc=NULL(0),
      # cred=AUTH_NONE(0,len=0), verf=AUTH_NONE(0,len=0)
      - data: "80000028564552330000000000000002000186a3000000030000000000000000000000000000000000000000"
        type: hex

    host:
      - "{{Hostname}}"
    port: 2049

    read-size: 256

    matchers-condition: and
    matchers:
      - type: binary
        name: nfs-v3-success
        binary:
          # XID 'VER3' + REPLY(1) + MSG_ACCEPTED(0) + AUTH_NONE(0,0) + accept_stat=SUCCESS(0)
          - "564552330000000100000000000000000000000000000000"

      - type: word
        words:
          - "HTTP/1.1"
        negative: true
