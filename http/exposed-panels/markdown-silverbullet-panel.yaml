id: markdown-silverbullet-panel

info:
  name: SilverBullet 面板检测（指纹识别）
  author: ChrisJr404
  severity: info
  description: |-
    检测到目标站点存在 SilverBullet 面板检测 相关响应特征。SilverBullet 是 Markdown 笔记和个人知识库平台，用于通过 Web 编辑、搜索和组织 Markdown 文档。模板请求 `/`，并通过页面标题或正文关键字、状态码、DSL 条件确认该系统指纹，用于资产识别、系统盘点和暴露面梳理。
  reference:
    - https://github.com/silverbulletmd/silverbullet
    - https://silverbullet.md/
  metadata:
    verified: true
    max-request: 1
    vendor: silverbulletmd
    product: silverbullet
    shodan-query: http.title:"SilverBullet"
    fofa-query: title="SilverBullet"
  tags: panel,silverbullet,notes,markdown,selfhosted,detect,discovery
http:
  - method: GET
    path:
      - "{{BaseURL}}"

    host-redirects: true
    max-redirects: 2

    matchers:
      - type: dsl
        dsl:
          - 'status_code == 200'
          - 'contains(body, "<title>SilverBullet</title>")'
        condition: and
