id: openshift-oauth-proxy-panel

info:
  name: OpenShift OAuth Proxy 面板识别（暴露面识别）
  author: r3dg33k
  severity: info
  description: |
    该模板通过识别 OpenShift OAuth Proxy 登录入口的页面标题、特征文本或重定向行为，判断目标是否暴露了对应的认证界面。若命中，说明该登录面板对外可访问，可用于暴露面梳理与后续安全评估。
  metadata:
    verified: true
    max-request: 2
    fofa-query: body="Openshift" && port="9001"
  tags: openshift,redhat,detect,oauth,proxy,login,discovery

http:
  - method: GET
    path:
      - "{{BaseURL}}"
      - "{{RootURL}}:9001"

    stop-at-first-match: true

    matchers-condition: and
    matchers:
      - type: word
        part: body
        words:
          - "OpenShift"
          - "Log in with"
        condition: and

      - type: regex
        part: header
        name: csrf-cookie-header
        regex:
          - "(?i)_oauth_proxy_csrf=[^;]+"
          - "(?i)_oauth_proxy=[^;]*"

      - type: status
        status:
          - 403
