id: g2a-phish

info:
  name: G2A 仿冒钓鱼网站（钓鱼网站识别）
  author: rxerium
  severity: info
  description: |
    检测到疑似仿冒 G2A 的钓鱼网站。模板在目标页面返回 200、页面内容命中 G2A 的品牌页面特征，且当前主机不属于 g2a.com 官方域名时触发，用于识别借用 G2A 品牌页面诱导用户信任的仿冒站点。
  reference:
    - https://g2a.com
  metadata:
    max-request: 1
  tags: phishing,g2a,osint,discovery
http:
  - method: GET
    path:
      - "{{BaseURL}}"

    host-redirects: true
    max-redirects: 2

    matchers-condition: and
    matchers:
      - type: word
        words:
          - 'G2A'
          - 'G2A.COM - Open the Gate 2 Adventure in the Digital World'
        condition: and

      - type: status
        status:
          - 200

      - type: dsl
        dsl:
          - '!contains(host,"g2a.com")'
