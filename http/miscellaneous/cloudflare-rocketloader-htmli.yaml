id: cloudflare-transform-via-url-injection

info:
  name: Cloudflare Transform via URL 图片注入
  author: j3ssie
  severity: unknown
  description: |
    Cloudflare 的 Transform via URL 功能在配置不当时可能允许攻击者通过构造 URL 向访问者展示任意图片内容。该行为可被用于钓鱼、页面篡改或品牌冒充等攻击场景。
  remediation: |
    在 Cloudflare 控制台中禁用 Images > Transformations > Resize from any origin 设置，并限制允许转换图片的可信来源。
  reference:
    - https://developers.cloudflare.com/images/transform-images/transform-via-url/
  metadata:
    verified: true
    max-request: 1
  tags: misconfig,cloudflare,htmli,miscellaneous,vuln

http:
  - method: GET
    path:
      - "{{BaseURL}}/cdn-cgi/image/width=1000,format=auto/https://raw.githubusercontent.com/simple-icons/simple-icons/develop/icons/cloudflare.svg"

    matchers-condition: and
    matchers:
      - type: word
        part: body
        words:
          - 'Cloudflare'
          - '<svg'
          - 'M16.5088 16.8447c.1475-.5068.0908-.9707-.1553-1.3154-.2246-.3164-.6045-.499-1.0615-.5205l-'
          - '1475.5068-.0918.9707.1543 1.3164.2256.3164.6055.498'
        condition: and

      - type: word
        part: header
        words:
          - 'image/svg+xml'

      - type: status
        status:
          - 200
