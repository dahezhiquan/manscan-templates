id: api-monday

info:
  name: Monday API Token 可用性校验（token喷洒）
  author: daffainfo
  severity: high
  description: |-
    平台介绍：Monday API 是面向团队协作、项目管理或业务流程自动化的平台，常用于管理任务、表格、项目、工作流、成员或组织数据。该模板用于校验提交的 Monday API Token 是否仍然有效。检测逻辑会向 `api.monday.com/v2` 发起低影响 API 请求，通过模板配置的认证字段传递 `{{token}}`，并依据响应中的 `"me"`、`"name"`、`"account_id"` 判断凭据是否可用；命中通常表示该 Token 可被继续调用对应平台能力。
  reference:
    - https://api.developer.monday.com/docs
    - https://github.com/daffainfo/all-about-apikey/tree/main/monday
  metadata:
    max-request: 1
  tags: token-spray,monday
  impact: |-
    - 攻击者可读取项目、任务、表格、工作流、成员或业务协作数据。
    - 高权限 Token 可能允许修改项目内容、创建任务、导出数据或影响团队协作流程。
  remediation: |-
    - 立即撤销或轮换已暴露的 API Token，并确认旧 Token 不再可用。
    - 按最小权限原则重新签发凭据，限制作用域、来源地址、项目范围和有效期。
    - 在代码仓库、CI/CD、日志和配置文件中排查泄露来源，避免 Token 再次提交或外传。
self-contained: true

http:
  - raw:
      - |
        POST https://api.monday.com/v2 HTTP/1.1
        Host: api.monday.com
        Authorization: {{token}}
        Content-Type: application/json

        {"query": "query { me { is_guest created_at name id}}"}

    matchers:
      - type: word
        part: body
        words:
          - '"me"'
          - '"name"'
          - '"account_id"'
        condition: and
