id: crushftp-login

info:
  name: CrushFTP WebInterface 面板识别（指纹识别）
  author: dhiyaneshDK
  severity: info
  description: 该模板通过识别 CrushFTP WebInterface 登录入口的页面标题、特征文本或重定向行为，判断目标是否暴露了对应的认证界面。若命中，说明该登录面板对外可访问，可用于暴露面梳理与后续安全评估。
  reference:
    - https://www.exploit-db.com/ghdb/6591
  classification:
    cvss-metrics: CVSS:3.0/AV:N/AC:L/PR:N/UI:N/S:U/C:N/I:N/A:N
    cwe-id: CWE-200
    cpe: cpe:2.3:a:crushftp:crushftp:*:*:*:*:*:*:*:*
  metadata:
    verified: true
    max-request: 1
    vendor: crushftp
    product: crushftp
    shodan-query: http.html:"crushftp"
    fofa-query: body="crushftp"
  tags: panel,edb,crushftp,detect,discovery

http:
  - method: GET
    path:
      - '{{BaseURL}}/WebInterface/login.html'

    matchers-condition: or
    matchers:
      - type: word
        part: body
        words:
          - '<title>CrushFTP WebInterface</title>'
          - '<title>CrushFTP - Login</title>'
          - 'src="/WebInterface/Resources/js/crushftp.customize.js"'
        condition: or

      - type: word
        part: header
        words:
          - 'Server: CrushFTP HTTP Server'
