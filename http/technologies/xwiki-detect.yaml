id: xwiki-detect

info:
  name: XWiki 指纹识别（指纹识别）
  author: matejsmycka
  severity: info
  description: >-
    XWiki 是开源企业 Wiki 和协作文档平台，用于知识库、结构化内容和团队协作。该模板通过请求目标服务并检查预设路径或首页响应、DSL 条件、正则特征等指纹特征，判断目标是否使用或暴露了
    XWiki 相关组件；命中结果仅表示指纹特征匹配，可用于资产盘点、技术栈识别和后续安全评估，不代表已确认存在可利用漏洞。
  metadata:
    verified: true
    max-request: 2
    vendor: xwiki
    product: xwiki
    shodan-query: html:"data-xwiki-reference"
    fofa-query: body="data-xwiki-reference"
  tags: xwiki,detect,tech
http:
  - method: GET
    path:
      - "{{BaseURL}}"
      - "{{BaseURL}}/xwiki/"

    host-redirects: true
    max-redirects: 2

    stop-at-first-match: true

    matchers-condition: and
    matchers:
      - type: dsl
        dsl:
          - 'status_code == 200 || status_code == 401'
          - 'contains(body, "xwikiplatformversion")'
        condition: and

    extractors:
      - type: regex
        group: 1
        regex:
          - '<html.*?data-xwiki-page="(.*?)"'
