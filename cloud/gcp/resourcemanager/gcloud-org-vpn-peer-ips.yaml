id: gcloud-org-vpn-peer-ips

info:
  name: VPN Peer IP Addresses 未Restricted（云安全）
  author: princechaddha
  severity: medium
  description: VPN peer IP 未受限制时，项目可配置任意对端 IP 建立 VPN 连接，可能接入未批准网络。本模板检查 compute.restrictVpnPeerIPs 组织策略 listPolicy.allValues，值为 ALLOW 时报告 VPN peer IP 未受限制。
  impact: |
    - 未授权 VPN 对端可能将云网络连接到不可信环境，扩大横向访问和数据外传路径。
    - VPN 对端缺少集中清单时，事件响应和网络变更审计会明显受阻。
  remediation: |
    - 配置 compute.restrictVpnPeerIPs，仅允许批准的 VPN peer IP 地址。
    - 对 VPN 连接建立审批、标签和监控，定期核对对端地址、共享密钥和路由范围。
  reference:
    - https://www.trendmicro.com/cloudoneconformity/knowledge-base/gcp/ResourceManager/restrict-vpn-peer-ips.html
    - https://cloud.google.com/vpc/docs/using-vpn
  metadata:
    vendor: google
    product: resource-manager
  tags: cloud,devops,gcp,gcloud,resourcemanager,security,networking,vpn,gcp-cloud-config

flow: |
  code(1)
  for(let orgId of iterate(template.orgIds)){
    set("orgId", orgId)
    code(2)
  }

self-contained: true

code:
  - engine:
      - sh
      - bash
    source: |
      gcloud organizations list --format="json(name)"

    extractors:
      - type: json
        name: orgIds
        internal: true
        json:
          - '.[].name'

  - engine:
      - sh
      - bash
    source: |
      gcloud alpha resource-manager org-policies describe compute.restrictVpnPeerIPs --organization=$orgId --effective --format="json(listPolicy.allValues)"

    matchers:
      - type: word
        words:
          - "ALLOW"

    extractors:
      - type: dsl
        dsl:
          - '"Organization " + orgId + " has not restricted VPN peer IP addresses, allowing any IP to be configured as a VPN peer"'
