id: darktrack-rat-trojan

info:
  name: DarkTrack RAT 木马识别（服务漏洞）
  author: pussycat0x
  severity: info
  description: 该模板通过协议特征或已知指纹识别目标是否与 DarkTrack RAT 木马相关的命令控制流量相匹配。
  reference:
    - https://github.com/montysecurity/C2-Tracker/blob/main/tracker.py
  metadata:
    verified: true
    max-request: 1
    shodan-query: product:'DarkTrack RAT Trojan'
  tags: network,c2,ir,osint,cti,darktrack,rat,tcp,vuln

tcp:
  - inputs:
      - data: 2E
        type: hex

    host:
      - "{{Hostname}}"
    port: 60129
    read-size: 1024

    matchers:
      - type: word
        encoding: hex
        words:
          - "0100000000000000034761"
