id: azure-nsg-ftp-unrestricted
info:
  name: Azure NSG 对互联网开放 FTP 端口 20 和 21（云安全）
  author: princechaddha
  severity: high
  description: FTP 使用 TCP 20 和 21 传输文件及控制命令，传统 FTP 通常以明文传输凭据和数据。将这两个端口对互联网开放会使文件服务暴露于扫描、撞库和协议攻击。本模板查询入站允许的 TCP 20 或 21 NSG 规则，并在来源地址为 *、internet 或 any 时报告。
  impact: |
    - 凭据和文件内容可能被窃听，攻击者还可能通过弱口令、匿名访问或服务漏洞读取、篡改和投递文件。
    - 被入侵的文件传输服务可能成为恶意软件投递和内部主机横向移动的入口。
  remediation: |
    - 关闭面向互联网的 FTP 端口，优先迁移到 SFTP 或配置经过加密保护的 FTPS。
    - 必须保留 FTP 时限制来源地址、关闭匿名登录、强制强认证，并对传输日志和文件权限进行审计。
  reference:
    - https://docs.microsoft.com/en-us/azure/virtual-network/network-security-groups-overview
  metadata:
    vendor: microsoft
    product: azure-network-security-group
  tags: cloud,devops,azure,microsoft,nsg,azure-cloud-config

flow: |
  code(1);
  for (let NsgData of iterate(template.nsgdata)) {
    NsgData = JSON.parse(NsgData)
    set("nsg", NsgData.name)
    set("resourcegroup", NsgData.resourceGroup)
    code(2)
  }

self-contained: true
code:
  - engine:
      - sh
      - bash
    source: |
      az network nsg list --query '[*].{name:name, resourceGroup:resourceGroup}' --output json

    extractors:
      - type: json
        name: nsgdata
        internal: true
        json:
          - '.[]'

  - engine:
      - sh
      - bash
    source: |
      az network nsg rule list --nsg-name $nsg --resource-group $resourcegroup --query "[?direction=='Inbound' && access=='Allow' && protocol=='TCP' && (destinationPortRange=='20' || destinationPortRange=='21')]"

    matchers:
      - type: word
        words:
          - '"sourceAddressPrefix": "*"'
          - '"sourceAddressPrefix": "internet"'
          - '"sourceAddressPrefix": "any"'

    extractors:
      - type: dsl
        dsl:
          - 'nsg + " has unrestricted access on TCP ports 20 and 21"'
