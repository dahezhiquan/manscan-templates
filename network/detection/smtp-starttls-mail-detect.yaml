id: smtp-starttls-mail-detect

info:
  name: STARTTLS Mail 服务识别（指纹识别）
  author: r3dg33k,userdehghani
  severity: info
  description: |
    SMTP STARTTLS 是邮件服务器的传输加密协商能力，用于在明文 SMTP 连接上升级到 TLS。该模板连接 25,2525,465,587/TCP 并读取协议响应，通过匹配 `250-STARTTLS` 等响应特征识别目标服务。
  metadata:
    max-request: 1
  tags: mail,starttls,network,detect,smtp,tcp,discovery

tcp:
  - inputs:
      - data: "65686c6f20636865636b746c730a"
        type: hex
    read-size: 2048

    host:
      - "{{Hostname}}"
    port: 25,2525,465,587

    matchers:
      - type: word
        words:
          - "250-STARTTLS"
