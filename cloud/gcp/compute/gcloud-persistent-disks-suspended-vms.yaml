id: gcloud-persistent-disks-suspended-vms

info:
  name: Persistent Disks Attached to Suspended Virtual Machines（云安全）
  author: princechaddha
  severity: high
  description: 持久磁盘挂载在处于 SUSPENDED 或 SUSPENDING 状态的虚拟机上时，资源可能长期闲置但仍保留数据和费用。本模板枚举磁盘及其关联实例，并在实例状态为 SUSPENDED 或 SUSPENDING 时报告该磁盘挂载在已暂停虚拟机上。
  impact: |
    - 闲置磁盘仍可能保存敏感数据，若权限或快照策略不当会形成长期数据暴露面。
    - 资源持续产生存储成本，且暂停实例可能被遗忘在备份、加密和补丁管理流程之外。
  remediation: |
    - 复核暂停虚拟机和挂载磁盘的业务归属，恢复、快照归档或删除不再需要的资源。
    - 对保留磁盘检查加密、IAM、快照和标签，确保闲置数据仍纳入生命周期治理。
  reference:
    - https://cloud.google.com/compute/docs/disks
  metadata:
    vendor: google
    product: compute-engine
  tags: cloud,devops,gcp,gcloud,compute,storage,cost-optimization,gcp-cloud-config

flow: |
  code(1)
  for(let projectId of iterate(template.projectIds)){
    set("projectId", projectId)
    code(2)
    for(let disk of iterate(template.disks)){
      disk = JSON.parse(disk)
      set("diskName", disk.name)
      set("zone", disk.zone)
      code(3)
      for(let instanceUrl of iterate(template.instanceUrls)){
        set("instanceUrl", instanceUrl)
        code(4)
      }
    }
  }

self-contained: true

code:
  - engine:
      - sh
      - bash
    source: |
      gcloud projects list --format="json(projectId)"

    extractors:
      - type: json
        name: projectIds
        internal: true
        json:
          - '.[].projectId'

  - engine:
      - sh
      - bash
    source: |
      gcloud compute disks list --project $projectId --format="json(name,zone.basename())"

    extractors:
      - type: json
        name: disks
        internal: true
        json:
          - '.[]'

  - engine:
      - sh
      - bash
    source: |
      gcloud compute disks describe $diskName --zone $zone --project $projectId --format="json(users[])" | jq -r '.[] // "null"'

    extractors:
      - type: json
        name: instanceUrls
        internal: true
        json:
          - '.[]'

  - engine:
      - sh
      - bash
    source: |
      gcloud compute instances describe $instanceUrl --zone $zone --project $projectId --format="json(status)"

    matchers:
      - type: word
        words:
          - "SUSPENDED"
          - "SUSPENDING"
        condition: or

    extractors:
      - type: dsl
        dsl:
          - '"Persistent disk " + diskName + " is attached to suspended VM instance in zone " + zone + " of project " + projectId'
