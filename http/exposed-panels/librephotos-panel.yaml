id: librephotos-panel

info:
  name: LibrePhotos 面板识别（指纹识别）
  author: ritikchaddha
  severity: info
  description: |-
    检测到目标站点存在 LibrePhotos 相关响应特征。LibrePhotos 是监控、日志、分析或可观测性系统，用于展示运行指标、告警事件、日志数据和服务状态。模板请求 `/login`，并通过页面标题或正文关键字、状态码确认该系统指纹，用于资产识别、系统盘点和暴露面梳理。
  reference:
    - https://github.com/LibrePhotos/librephotos
  classification:
    cpe: cpe:2.3:a:librephotos_project:librephotos:*:*:*:*:*:*:*:*
  metadata:
    verified: true
    max-request: 1
    vendor: librephotos_project
    product: librephotos
    shodan-query: title:"LibrePhotos"
  tags: panel,librephotos,detect,login,discovery
http:
  - method: GET
    path:
      - "{{BaseURL}}/login"

    matchers-condition: and
    matchers:
      - type: word
        part: body
        words:
          - '<title>LibrePhotos'

      - type: status
        status:
          - 200
          - 404
