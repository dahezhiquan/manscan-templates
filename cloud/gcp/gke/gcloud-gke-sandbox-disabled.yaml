id: gcloud-gke-sandbox-disabled

info:
  name: GKE Cluster 未Using Sandbox 使用gVisor（云安全）
  author: princechaddha
  severity: medium
  description: GKE Sandbox 使用 gVisor 为 Pod 提供额外运行时隔离，适合运行不可信或高风险工作负载。本模板检查 nodePools[].config.sandboxConfig.type，字段为空时报告集群未启用 Sandbox with gVisor。
  impact: |
    - 不可信工作负载与节点内核之间缺少额外隔离层，容器逃逸或内核攻击面的风险更高。
    - 多租户或高风险任务场景下，运行时隔离能力不足会削弱租户边界。
  remediation: |
    - 为需要额外隔离的节点池启用 GKE Sandbox with gVisor，并通过 RuntimeClass 调度对应工作负载。
    - 评估 gVisor 对性能和兼容性的影响，对不适用工作负载记录例外。
  reference:
    - https://cloud.google.com/kubernetes-engine/docs/how-to/sandbox-pods
    - https://www.trendmicro.com/cloudoneconformity/knowledge-base/gcp/GKE/enable-gke-sandbox-with-gvisor.html
  metadata:
    vendor: google
    product: google-kubernetes-engine
  tags: cloud,devops,gcp,gcloud,gke,kubernetes,security,sandbox,gvisor,gcp-cloud-config

flow: |
  code(1)
  for(let projectId of iterate(template.projectIds)){
    set("projectId", projectId)
    code(2)
    for(let cluster of iterate(template.clusters)){
      cluster = JSON.parse(cluster)
      set("clusterName", cluster.name)
      set("location", cluster.location)
      code(3)
    }
  }

self-contained: true

code:
  - engine:
      - sh
      - bash
    source: |
      gcloud projects list --format="json(projectId)"

    extractors:
      - type: json
        name: projectIds
        internal: true
        json:
          - '.[].projectId'

  - engine:
      - sh
      - bash
    source: |
      gcloud container clusters list --project $projectId --format="json(name,location)"

    extractors:
      - type: json
        name: clusters
        internal: true
        json:
          - '.[]'

  - engine:
      - sh
      - bash
    source: |
      gcloud container clusters describe $clusterName --location $location --project $projectId --format="json(nodePools[].config.sandboxConfig.type)"

    matchers:
      - type: word
        words:
          - "null"

    extractors:
      - type: dsl
        dsl:
          - '"GKE cluster " + clusterName + " in " + location + " of project " + projectId + " does not have Sandbox with gVisor enabled"'
