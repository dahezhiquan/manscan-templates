id: gcloud-org-sql-default-encryption

info:
  name: Default Google-Managed 加密 的Cloud SQL 未Restricted（云安全）
  author: princechaddha
  severity: medium
  description: Cloud SQL 未限制默认 Google-managed encryption 时，新实例可不使用客户管理密钥，削弱组织对数据库加密密钥生命周期的控制。本模板检查 sql.disableDefaultEncryptionCreation 组织策略 booleanPolicy，返回空对象 {} 时报告未禁止默认加密创建。
  impact: |
    - 组织无法对 Cloud SQL 数据库加密密钥执行自主管理、轮换、禁用和销毁流程。
    - 对需要 CMEK 的监管或客户要求场景，默认 Google-managed encryption 可能不满足合规基线。
  remediation: |
    - 启用 sql.disableDefaultEncryptionCreation 组织策略，要求新建 Cloud SQL 实例使用客户管理密钥。
    - 为数据库项目准备 KMS key、服务代理权限、轮换计划和密钥禁用影响评估流程。
  reference:
    - https://www.trendmicro.com/cloudoneconformity/knowledge-base/gcp/ResourceManager/restrict-default-encryption-for-sql-instances.html
    - https://cloud.google.com/sql/docs/mysql/customer-managed-encryption-keys
  metadata:
    vendor: google
    product: resource-manager
  tags: cloud,devops,gcp,gcloud,resourcemanager,security,sql,encryption,cmk,gcp-cloud-config

flow: |
  code(1)
  for(let orgId of iterate(template.orgIds)){
    set("orgId", orgId)
    code(2)
  }

self-contained: true

code:
  - engine:
      - sh
      - bash
    source: |
      gcloud organizations list --format="json(name)"

    extractors:
      - type: json
        name: orgIds
        internal: true
        json:
          - '.[].name'

  - engine:
      - sh
      - bash
    source: |
      gcloud alpha resource-manager org-policies describe sql.disableDefaultEncryptionCreation --organization=$orgId --effective --format="json(booleanPolicy)"

    matchers:
      - type: word
        words:
          - "{}"

    extractors:
      - type: dsl
        dsl:
          - '"Organization " + orgId + " has not disabled default Google-managed encryption for Cloud SQL instances"'
