id: ssh-service-running

info:
  name: macOS SSH 服务正在运行（本地基线扫描）
  author: geeknik
  severity: medium
  description: |
    macOS Remote Login/SSH 服务运行时会开放远程 shell 登录入口，若无远程管理需求，会增加密码猜测和远程攻击面。模板通过 `launchctl print system/com.openssh.sshd` 检查 `com.openssh.sshd` 是否处于 running 状态，命中时表示 SSH 服务正在运行。
  impact: |
    - 未授权来源可能尝试暴力破解、凭据填充或利用 SSH 配置弱点。
    - 暴露远程 shell 会增加终端被横向访问和持久化的风险。
  remediation: |
    - 如无需求，关闭 Remote Login/SSH 服务。
    - 如必须启用，限制来源地址，优先使用密钥认证，禁用弱认证并开启登录审计。
  tags: macos,audit,local,security,ssh

self-contained: true

code:
  - engine:
      - sh
      - bash
    source: |
      launchctl print system/com.openssh.sshd 2>&1
    matchers-condition: and
    matchers:
      - type: status
        status:
          - 0
      - type: word
        words:
          - "state = running"
          - "com.openssh.sshd"
