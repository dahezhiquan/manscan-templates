id: yonyou-grp-u8-xxe

info:
  name: Yonyou UFIDA GRP-u8 - XXE 漏洞
  author: SleepingBag945
  severity: critical
  description: Yonyou UFIDA GRP-u8 - XXE 存在XXE 漏洞。攻击者在无需授权或仅需较低权限的情况下，可能在目标主机上执行任意命令并完全控制系统。
  reference:
    - http://wiki.peiqi.tech/wiki/oa/%E7%94%A8%E5%8F%8BOA/%E7%94%A8%E5%8F%8B%20GRP-U8%20Proxy%20SQL%E6%B3%A8%E5%85%A5%20CNNVD-201610-923.html
  classification:
