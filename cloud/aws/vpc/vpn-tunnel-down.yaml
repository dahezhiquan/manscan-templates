id: vpn-tunnel-down
info:
  name: AWS Site-to-Site VPN Tunnel 处于 DOWN 状态（云安全）
  author: princechaddha
  severity: high
  description: AWS Site-to-Site VPN tunnel 处于 DOWN 状态表示 VPN 连接的冗余通道不可用或中断，可能影响混合云网络连通性。该模板枚举可用 VPN connection，并检查 VgwTelemetry.Status 是否包含 DOWN。
  impact: |
    - 单条或多条 tunnel 中断会降低 VPN 冗余能力，故障时可能导致本地数据中心与 VPC 通信中断。
    - 混合云链路不稳定可能影响应用访问、日志传输、备份复制和应急运维。
  remediation: |
    - 检查客户网关、公网链路、IKE/IPsec 参数和 BGP 路由状态，恢复 DOWN 状态的 VPN tunnel。
    - 为 VPN tunnel 状态配置 CloudWatch 告警，并验证双 tunnel 冗余和故障切换流程。
  reference:
    - https://docs.aws.amazon.com/vpn/latest/s2svpn/VPNConnections.html
  metadata:
    max-request: 2
    vendor: amazon
    product: vpc
  tags: cloud,devops,aws,amazon,vpn,aws-cloud-config
variables:
  region: "us-east-1"

flow: |
  code(1)
  for(let VpnConnectionIds of iterate(template.vpnconnactions)){
    set("vpnid", VpnConnectionIds)
    code(2)
  }

self-contained: true
code:
  - engine:
      - sh
      - bash
    source: |
      aws ec2 describe-vpn-connections --region $region --filters "Name=state,Values=available" --query 'VpnConnections[*].VpnConnectionId' --output json

    extractors:
      - type: json
        name: vpnconnactions
        internal: true
        json:
          - '.[]'

  - engine:
      - sh
      - bash
    source: |
         aws ec2 describe-vpn-connections --region $region --vpn-connection-ids $vpnid --query 'VpnConnections[*].VgwTelemetry[*].Status[]'

    matchers:
      - type: word
        words:
          - "DOWN"

    extractors:
      - type: dsl
        dsl:
          - 'vpnid + " VPN tunnel is down"'
