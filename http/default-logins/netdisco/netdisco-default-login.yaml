id: netdisco-default-login

info:
  name: Netdisco Admin 默认口令登录（弱口令）
  author: ritikchaddha
  severity: critical
  description: |
    该模板用于检测 Netdisco 是否仍可通过内置的硬编码凭据登录管理后台。若命中，攻击者可直接访问网络资产管理界面，查看设备信息并执行未授权的管理操作。
  impact: |
    - 攻击者可借助硬编码凭据未授权访问网络资产管理信息，进而查看敏感设备数据或执行管理操作。
  remediation: |
    - 更新应用版本，移除硬编码凭据并改用安全的凭据管理机制。
  metadata:
    verified: true
    max-request: 1
    shodan-query: title:"Netdisco"
    fofa-query: title="Netdisco"
  tags: netdisco,default-login,vuln

variables:
  username: "netdisco"
  password: "netdisco"

http:
  - raw:
      - |
        POST /login HTTP/1.1
        Host: {{Hostname}}
        Content-Type: application/x-www-form-urlencoded

        username={{username}}&password={{password}}&return_url=%2Finventory

    host-redirects: true
    max-redirects: 2
    matchers:
      - type: dsl
        dsl:
          - contains_all(body, "User Management", "/admin/discoverall", "Logged in as")
          - status_code == 200
        condition: and
