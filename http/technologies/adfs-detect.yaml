id: adfs-detect

info:
  name: ADFS 指纹识别（指纹识别）
  author: Adam Crosser,Mys7ic
  severity: info
  description: 用于识别目标是否部署 ADFS 并提取相关版本或构建信息，模板会结合页面正文、特定路径或已知端点和版本或标识提取结果进行指纹匹配。
  metadata:
    max-request: 1
  tags: tech,adfs,discovery

http:
  - method: GET
    path:
      - "{{BaseURL}}/adfs/ls/idpinitiatedsignon.aspx"

    matchers-condition: and
    matchers:
      - type: word
        part: body
        words:
          - '/adfs/portal/css/style.css'

    extractors:
      - type: regex
        part: body
        name: domain
        group: 1
        regex:
          - 'var\s+userNameValue\s*=\s*''([^\\]*)\\'
