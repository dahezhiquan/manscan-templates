id: api-proxykingdom

info:
  name: ProxyKingdom API Token 可用性校验（token喷洒）
  author: daffainfo
  severity: info
  description: 该模板通过调用 ProxyKingdom API 的已知接口验证提供的 token 是否有效，命中后通常表示可访问相关 API 能力。
  reference:
    - https://proxykingdom.com/documentation
    - https://github.com/daffainfo/all-about-apikey/tree/main/proxykingdom
  metadata:
    max-request: 1
  tags: token-spray,proxykingdom

self-contained: true

http:
  - method: GET
    path:
      - "https://api.proxykingdom.com/proxy?token={{token}}"

    matchers:
      - type: word
        part: body
        words:
          - '"address"'
          - '"port"'
          - '"protocol"'
        condition: and
