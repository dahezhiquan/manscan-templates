id: api-prexview

info:
  name: PrexView API Token 可用性校验（token喷洒）
  author: daffainfo
  severity: info
  description: 该模板通过调用 PrexView API 的已知接口验证提供的 token 是否有效，命中后通常表示可访问网页截图能力。
  reference:
    - https://prexview.com/docs/
    - https://github.com/daffainfo/all-about-apikey/tree/main/prexview
  metadata:
    max-request: 1
  tags: token-spray,prexview

self-contained: true

http:
  - raw:
      - |
        POST https://api.prexview.com/v1/transform HTTP/1.1
        Host: api.prexview.com
        Authorization: {{token}}

    matchers:
      - type: word
        part: body
        words:
          - '"output is a required argument"'
          - '"status":400'
        condition: and
