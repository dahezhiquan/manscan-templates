id: adobe-connect-central-login

info:
  name: Adobe Connect Central 登录面板（暴露面识别）
  author: dhiyaneshDk
  severity: info
  description: 该模板通过识别 Adobe Connect Central 登录入口的页面标题、特征文本或重定向行为，判断目标是否暴露了对应的认证界面。若命中，说明该登录面板对外可访问，可用于暴露面梳理与后续安全评估。
  reference:
    - https://www.adobe.com/products/adobeconnect.html
  classification:
    cwe-id: CWE-200
    cpe: cpe:2.3:a:adobe:connect:*:*:*:*:*:*:*:*
  metadata:
    max-request: 1
    vendor: adobe
    product: connect
    shodan-query: http.title:"openvpn connect"
    fofa-query: title="openvpn connect"
    google-query: intitle:"openvpn connect"
  tags: adobe,panel,connect-central,discovery

http:
  - method: GET
    path:
      - "{{BaseURL}}/system/login"

    matchers-condition: and
    matchers:
      - type: word
        words:
          - '<title>Adobe Connect Central Login</title>'
        part: body

      - type: status
        status:
          - 200
