id: atlassian-crowd-panel

info:
  name: Atlassian Crowd 登录面板（暴露面识别）
  author: organiccrap,AdamCrosser
  severity: info
  description: 该模板通过识别 Atlassian Crowd 登录入口的页面标题、特征文本或重定向行为，判断目标是否暴露了对应的认证界面。若命中，说明该登录面板对外可访问，可用于暴露面梳理与后续安全评估。
  reference:
    - https://www.atlassian.com/
  classification:
    cwe-id: CWE-200
    cpe: cpe:2.3:a:atlassian:crowd:*:*:*:*:*:*:*:*
  metadata:
    max-request: 1
    vendor: atlassian
    product: crowd
    category: sso
    shodan-query: http.component:"atlassian jira"
  tags: panel,atlassian,discovery

http:
  - method: GET
    path:
      - '{{BaseURL}}/crowd/console/login.action'

    matchers:
      - type: word
        words:
          - <title>Atlassian Crowd - Login</title>
        part: body

    extractors:
      - type: regex
        name: version
        group: 1
        regex:
          - 'value="Version:&nbsp;([\d.]+)'
        part: body
