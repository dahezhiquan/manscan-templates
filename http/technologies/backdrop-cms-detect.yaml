id: backdrop-cms-detect

info:
  name: Backdrop CMS 指纹识别（指纹识别）
  author: 5tr1x
  severity: info
  description: 用于识别目标是否部署 Backdrop CMS 并提取相关版本或构建信息，模板会结合页面正文、特定路径或已知端点和版本或标识提取结果进行指纹匹配。
    Backdrop CMS was discovered.
  metadata:
    max-request: 1
    verified: true
    shodan-query: html:"Backdrop CMS"
  tags: tech,backdrop,cms,detect,discovery

http:
  - method: GET
    path:
      - "{{BaseURL}}"
      - "{{BaseURL}}/core/profiles/testing/testing.info"

    host-redirects: true
    max-redirects: 2

    stop-at-first-match: true

    matchers:
      - type: word
        part: response
        words:
          - "Added by Backdrop CMS packaging script"
          - "X-Generator: Backdrop CMS"
        condition: or

    extractors:
      - type: regex
        part: body
        name: version
        regex:
          - "version = ([0-9.x-]+)"
