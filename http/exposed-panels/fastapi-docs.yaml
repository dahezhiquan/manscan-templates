id: fastapi-docs

info:
  name: FastAPI Docs 面板识别（指纹识别）
  author: github.com/its0x08
  severity: info
  description: |-
    检测到目标站点存在 FastAPI Docs 相关响应特征。FastAPI Docs 是 FastAPI 应用自动生成的交互式 API 文档界面，用于查看接口、参数、模型并进行调试请求。模板请求 `/docs`、`/redoc`、`/openapi.json` 路径，并通过页面标题或正文关键字确认该系统指纹，用于资产识别、系统盘点和暴露面梳理。
  classification:
    cvss-metrics: CVSS:3.0/AV:N/AC:L/PR:N/UI:N/S:U/C:N/I:N/A:N
    cwe-id: CWE-200
  metadata:
    max-request: 3
  tags: fastapi,tech,panel,discovery
http:
  - method: GET
    path:
      - "{{BaseURL}}/docs"
      - "{{BaseURL}}/redoc"
      - "{{BaseURL}}/openapi.json"

    matchers:
      - type: word
        words:
          - "<title>FastAPI - Swagger UI</title>"
          - "<title>FastAPI - ReDoc</title>"
          - '{"title":"FastAPI"'
        condition: or
