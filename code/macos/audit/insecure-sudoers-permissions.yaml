id: insecure-sudoers-permissions

info:
  name: macOS /etc/sudoers 权限不安全（本地基线扫描）
  author: geeknik
  severity: high
  description: |
    `/etc/sudoers` 控制 sudo 提权授权，权限不安全会让本地攻击者篡改特权规则，直接获得管理员能力。模板检查该文件是否不符合 root 管理且只读的基线权限，命中时表示 sudoers 权限异常。
  impact: |
    - 本地攻击者可能添加免密 sudo、扩大命令授权或隐藏恶意提权规则。
    - sudo 授权被篡改会导致特权边界失效，影响所有本机管理员操作审计。
  remediation: |
    - 使用 `visudo` 维护 `/etc/sudoers`，确保属主为 root 且权限为 `440` 或更严格。
    - 审计 sudoers 和 `/etc/sudoers.d/` 内容，移除异常授权和免密规则。
  tags: macos,audit,local,security,sudo

self-contained: true

code:
  - engine:
      - sh
      - bash
    source: |
      ls -l /etc/sudoers 2>&1
    matchers-condition: and
    matchers:
      - type: status
        status:
          - 0
      - type: regex
        regex:
          - "^-r--r-----\\s+\\d+\\s+root\\s+\\w+"
        negative: true
