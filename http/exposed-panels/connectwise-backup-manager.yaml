id: connectwise-backup-manager

info:
  name: ConnectWise Server Backup Manager SE 面板识别（暴露面识别）
  author: prajiteshsingh
  severity: info
  description: 该模板通过识别 ConnectWise Server Backup Manager SE 登录入口的页面标题、特征文本或重定向行为，判断目标是否暴露了对应的认证界面。若命中，说明该登录面板对外可访问，可用于暴露面梳理与后续安全评估。
  reference:
    - https://www.connectwise.com/company/trust/security-bulletins/r1soft-and-recover-security-bulletin
  classification:
    cvss-metrics: CVSS:3.0/AV:N/AC:L/PR:N/UI:N/S:U/C:N/I:N/A:N
    cwe-id: CWE-200
  metadata:
    verified: true
    max-request: 1
    shodan-query: http.component:zk http.title:"Server Backup Manager"
  tags: panel,connectwise,backup,discovery

http:
  - method: GET
    path:
      - "{{BaseURL}}/login.zul"

    matchers-condition: and
    matchers:
      - type: word
        part: body
        words:
          - "Server Backup Manager SE"

      - type: status
        status:
          - 200
