id: stirling-pdf-panel

info:
  name: Stirling PDF 登录面板识别（指纹识别）
  author: s4e-io
  severity: info
  description: |-
    Stirling PDF 是自托管 PDF 工具平台，用于合并、拆分、转换、压缩和处理 PDF 文件。该模板请求首页，并依据 DSL 条件识别目标是否部署了该系统或暴露了对应入口，适用于资产指纹确认；命中结果仅表示系统特征匹配，不代表已确认存在未授权访问或可利用漏洞。
  reference:
  - https://github.com/Stirling-Tools/Stirling-PDF
  metadata:
    verified: true
    max-request: 1
    fofa-query: title="StirlingPDF"
  tags: panel,login,stirling-pdf,detect,discovery

http:
  - method: GET
    path:
      - "{{BaseURL}}"

    host-redirects: true
    max-redirects: 2
    matchers:
      - type: dsl
        dsl:
          - 'contains_any(body, "<title>StirlingPDF - Sign in", "content=\"StirlingPDF", "window.stirlingPDF")'
          - 'status_code == 200'
        condition: and
