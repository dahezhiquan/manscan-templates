id: efs-encryption-disabled

info:
  name: EFS 文件系统未启用加密（云安全）
  author: DhiyaneshDK
  severity: medium
  description: EFS 文件系统未启用加密是一类共享文件存储静态数据保护不足风险，文件系统中的业务文件可能缺少 KMS 加密边界。EFS 常被多个工作负载挂载共享，未加密会扩大敏感文件在底层存储层面的暴露风险。模板枚举 EFS 文件系统 ID 后读取 `FileSystems[*].Encrypted`，当值为 `false` 时判定文件系统未启用加密。
  impact: |
    - 共享文件系统中的业务数据缺少静态加密保护，可能不满足内部或行业合规要求。
    - 无法通过 KMS key policy 和密钥审计对文件系统数据访问边界进行统一治理。
  remediation: |
    - 新建 EFS 文件系统时启用静态加密，并选择符合组织要求的 KMS 密钥。
    - 对既有未加密文件系统，规划迁移到启用加密的新文件系统并验证挂载和权限配置。
  reference:
    - https://www.trendmicro.com/cloudoneconformity-staging/knowledge-base/aws/ElastiCache/in-transit-and-at-rest-encryption.html
    - https://docs.aws.amazon.com/efs/latest/ug/encryption.html
  metadata:
    vendor: amazon
    product: efs
  tags: cloud,devops,aws,amazon,efs-encryption-disabled,aws-cloud-config

variables:
  region: "us-west-2"

flow: |
  code(1)
  for(let FileSystemId of iterate(template.filesystemids)){
    set("filesystemid", FileSystemId)
    code(2)
  }

self-contained: true

code:
  - engine:
      - sh
      - bash
    source: |
      aws efs describe-file-systems --region $region --output json --query 'FileSystems[*].FileSystemId'

    extractors:
      - type: json
        name: filesystemids
        internal: true
        json:
          - '.[]'

  - engine:
      - sh
      - bash

    source: |
        aws efs describe-file-systems --region $region --file-system-id $filesystemid --query 'FileSystems[*].Encrypted' --output json

    matchers:
      - type: word
        words:
          - "false"

    extractors:
      - type: dsl
        dsl:
          - 'filesystemid + " EFS Encryption is Disabled"'
