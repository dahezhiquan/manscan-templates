id: artica-web-proxy-detect

info:
  name: Artica Web Proxy 指纹识别（指纹识别）
  author: dwisiswant0
  severity: info
  description: Artica Web Proxy 是 Web 代理和网关管理平台，用于代理、缓存、过滤和网络访问控制。该模板请求 `/fw.login.php`，并依据 HTTP 200 状态码、页面标题、正文关键字或品牌资源特征识别目标是否使用或暴露了 Artica Web Proxy 相关组件，适用于资产盘点、技术栈识别和后续安全评估；命中结果仅表示指纹特征匹配，不代表已确认存在可利用漏洞。
  metadata:
    max-request: 1
  tags: tech,artica,proxy,discovery

http:
  - method: GET
    path:
      - "{{BaseURL}}/fw.login.php"

    matchers-condition: and
    matchers:
      - type: word
        words:
          - "Welcome to the Artica Web Administration Interface"

      - type: status
        status:
          - 200
