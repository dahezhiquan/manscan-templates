id: wp-wp-mail-smtp-fpd

info:
  name: WordPress WP Mail SMTP 完整路径泄露
  author: ritikchaddha
  severity: low
  description: |
    检测到 WordPress WP Mail SMTP 完整路径泄露。目标暴露了调试、错误或堆栈信息，可能泄露应用路径、框架版本、环境变量、源码位置或内部调用细节。
  reference:
    - https://wordpress.org/plugins/wp-mail-smtp/
  metadata:
    verified: true
    max-request: 3
    vendor: developer
    product: wp-mail-smtp
    framework: wordpress
    fofa-query: body="/wp-content/plugins/wp-mail-smtp/"
  tags: wp,wordpress,wp-plugin,fpd,wp-mail-smtp,exposure

http:
  - method: GET
    path:
      - "{{BaseURL}}/wp-content/plugins/wp-mail-smtp/src/WPMailSMTP.php"
      - "{{BaseURL}}/wp-content/plugins/wp-mail-smtp/vendor/autoload.php"
      - "{{BaseURL}}/wp-content/plugins/wp-mail-smtp/src/Core.php"

    stop-at-first-match: true

    matchers-condition: and
    matchers:
      - type: word
        part: body
        words:
          - "Fatal error"
          - "wp-mail-smtp"
          - "Uncaught Error:"
        condition: and

      - type: status
        status:
          - 200
