id: namedprocess-exporter-metrics

info:
  name: Named Process 导出器
  author: DhiyaneshDk
  severity: low
  description: |
    检测到 Named Process 导出器。目标暴露了调试、错误或堆栈信息，可能泄露应用路径、框架版本、环境变量、源码位置或内部调用细节。
  metadata:
    verified: true
    max-request: 1
    shodan-query: title:"Named Process Exporter"
  tags: namedprocess,exposure,debug,misconfig,vuln

http:
  - method: GET
    path:
      - "{{BaseURL}}/metrics"

    matchers-condition: and
    matchers:
      - type: word
        part: body
        words:
          - "namedprocess"
          - "# HELP"
        condition: and

      - type: status
        status:
          - 200
