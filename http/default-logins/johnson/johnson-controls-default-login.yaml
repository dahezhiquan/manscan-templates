id: johnson-controls-default-login

info:
  name: Johnson Controls Frick Quantum HD 压缩机默认登录（弱口令）
  author: mister-joe
  severity: high
  description: |
    该模板用于检测 Johnson Controls Frick Quantum HD 压缩机 是否仍可使用默认凭据或弱口令登录。模板主要向 `/login` 等认证入口发送请求，使用内置默认凭据组合进行认证尝试，并根据状态码、认证 Cookie、跳转位置或登录后的页面关键字判断登录是否成功；命中说明目标未及时修改出厂、示例或初始化账号口令。
  impact: |
    - 攻击者可接管 Johnson Controls Frick Quantum HD 压缩机 的 Web 管理界面，查看设备状态、网络配置、运行日志或敏感业务参数。
    - 被接管的网络、工控、打印、视频、存储或远程管理设备可能被用于中断业务、改变访问策略、窃取流量或作为内网横向移动入口。
  remediation: |
    - 立即修改所有默认账号口令，禁用不再使用的出厂账号，并为管理账户设置高强度唯一密码。
    - 将设备管理入口限制在 VPN、堡垒机或可信管理网段内，避免直接暴露到公网。
    - 升级设备固件或管理组件，审计近期登录记录、配置变更和异常会话。
  reference:
    - https://www.johnsoncontrols.com/industrial-refrigeration/frick-control-panels-and-control-systems/quantum-hd-industrial-refrigeration-control-panel
  classification:
    cwe-id: CWE-798
  metadata:
    verified: true
    max-request: 6
    vendor: johnson-controls
    product: frick-quantum-hd
    shodan-query: http.headers:"PrimeUnity"
    fofa-query: header="PrimeUnity" || body="Quantum HD"
  tags: default-login,iot,ics,scada,johnson-controls,frick

http:
  - raw:
      - |
        POST /login HTTP/1.1
        Host: {{Hostname}}
        Content-Type: application/x-www-form-urlencoded

        {"pin":"{{password}}"}

    attack: pitchfork
    payloads:
      password:
        - 1
        - 2
        - 3
        - 10
        - 20
        - 30

    matchers:
      - type: dsl
        dsl:
          - 'status_code == 200'
          - 'contains(body, "Authorized")'
          - 'contains_all(header, "PrimeUnity","Sessionid")'
        condition: and
