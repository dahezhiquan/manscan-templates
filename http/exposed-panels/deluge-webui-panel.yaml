id: deluge-webui-panel

info:
  name: Deluge WebUI 登录面板识别（暴露面识别）
  author: tess
  severity: info
  description: 该模板通过识别 Deluge WebUI 登录入口的页面标题、特征文本或重定向行为，判断目标是否暴露了对应的认证界面。若命中，说明该登录面板对外可访问，可用于暴露面梳理与后续安全评估。
  classification:
    cvss-metrics: CVSS:3.0/AV:N/AC:L/PR:N/UI:N/S:U/C:N/I:N/A:N
    cwe-id: CWE-200
    cpe: cpe:2.3:a:deluge-torrent:deluge:*:*:*:*:*:*:*:*
  metadata:
    verified: true
    max-request: 1
    vendor: deluge-torrent
    product: deluge
    shodan-query:
      - title:"Deluge WebUI"
      - http.title:"deluge webui"
    fofa-query: title="deluge webui"
    google-query: intitle:"deluge webui"
  tags: panel,deluge,deluge-torrent,discovery

http:
  - method: GET
    path:
      - "{{BaseURL}}"

    matchers-condition: and
    matchers:
      - type: word
        part: body
        words:
          - "Deluge WebUI"
          - "author: 'Deluge Team"
        condition: and

      - type: word
        part: header
        words:
          - text/html

      - type: status
        status:
          - 200

    extractors:
      - type: regex
        part: body
        group: 1
        regex:
          - "version: '([0-9.]+)',"
