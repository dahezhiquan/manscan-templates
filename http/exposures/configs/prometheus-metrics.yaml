id: prometheus-metrics

info:
  name: Prometheus Metrics 暴露（暴露面识别）
  author: dhiyaneshDK,philippedelteil
  severity: medium
  description: |
    检测到目标站点可直接访问 Prometheus Metrics。Prometheus metrics 端点用于输出应用和基础设施指标，可能暴露服务名称、内部地址和运行状态。该模板请求 `/metrics`、`/api/metrics`，并通过 HTTP 状态码、响应正文关键字、文件格式特征、正则匹配或响应头进行确认。此类资源公开后可能泄露部署细节、内部路径、依赖版本、环境变量、访问凭据或调试信息，增加被侦察和后续利用的风险。
  impact: |-
    - 状态、调试或指标页面可能泄露组件版本、模块清单、环境变量、内部路径、主机名和服务依赖关系。
    - 攻击者可利用这些信息筛选匹配漏洞、识别弱配置，并规划更精确的后续攻击路径。
    - 部分调试页面还可能暴露请求变量或运行参数，增加敏感信息泄露范围。
  remediation: |-
    - 关闭生产环境中的调试、状态、phpinfo、printenv、探针和未受保护的 metrics 页面。
    - 仅在内网、运维 VPN 或监控系统来源地址中开放必要的观测端点，并启用鉴权。
    - 清理页面中暴露的环境变量、内部路径、主机名、版本信息和调试参数。
    - 复核相关组件版本和配置，修复因暴露信息指向的弱配置或已知漏洞。
  reference:
    - https://github.com/prometheus/prometheus
    - https://hackerone.com/reports/1026196
  classification:
    cvss-metrics: CVSS:3.1/AV:N/AC:L/PR:N/UI:N/S:U/C:L/I:N/A:N
    cvss-score: 5.3
    cwe-id: CWE-200
  metadata:
    max-request: 2
  tags: exposure,prometheus,hackerone,config,vuln

http:
  - method: GET
    path:
      - "{{BaseURL}}/metrics"
      - "{{BaseURL}}/api/metrics"

    stop-at-first-match: true

    matchers-condition: and
    matchers:
      - type: word
        words:
          - 'cpu_seconds_total'
          - 'http_request_duration_seconds'
          - 'process_virtual_memory_bytes'
          - 'process_start_time_seconds'
        condition: or

      - type: word
        part: body
        words:
          - "lvm_"
          - "kube"
          - "namedprocess"
          - "mysqld"
          - "collectd_"
          - "libvirt_"
          - "mongodb"
          - "blackbox_"
          - "haproxy_"
          - "rabbitmq_"
        negative: true

      - type: status
        status:
          - 200
