id: auto-login-enabled

info:
  name: macOS 自动登录已启用（本地基线扫描）
  author: geeknik
  severity: high
  description: |
    该模板检查 macOS 是否启用自动登录。启用后设备启动时无需输入密码即可进入指定用户会话。
  impact: |
    不必要的登录入口会增加未授权访问、暴力破解或设备丢失后的数据暴露风险。
  remediation: |
    禁用自动登录或访客账户，确保访问设备需要强身份验证。
  tags: macos,audit,local,security

self-contained: true

code:
  - engine:
      - sh
      - bash
    source: |
      defaults read /Library/Preferences/com.apple.loginwindow autoLoginUser 2>&1

    matchers-condition: and
    matchers:
      - type: status
        status:
          - 0

      - type: word
        words:
          - "does not exist"
        negative: true
