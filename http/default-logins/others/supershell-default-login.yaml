id: supershell-default-login

info:
  name: Supershell 默认口令登录（弱口令）
  author: SleepingBag945
  severity: high
  description: |
    该模板通过尝试 Supershell 的默认账号口令，并依据认证成功后的响应特征判断目标是否仍在使用未修改的弱口令。若命中，攻击者可直接登录系统，进一步访问敏感信息、修改配置或执行未授权操作。
  reference:
    - https://github.com/tdragon6/Supershell
    - https://www.ctfiot.com/129689.html
  metadata:
    verified: true
    max-request: 1
    fofa-query: title="supershell"
  tags: supershell,default-login,vuln

http:
  - raw:
      - |
        POST /supershell/login/auth HTTP/1.1
        Host: {{Hostname}}
        Content-Type: application/json

        {"username":"{{username}}","password":"{{password}}"}

    attack: pitchfork
    payloads:
      username:
        - tdragon6
      password:
        - tdragon6
    host-redirects: true
    matchers:
      - type: dsl
        dsl:
          - 'status_code_1 == 200 && !contains(body_1,"result\":\"failed")'
          - 'contains(header_1,"token=ey") && contains(body_1,"{\"result\":\"success")'
        condition: and
