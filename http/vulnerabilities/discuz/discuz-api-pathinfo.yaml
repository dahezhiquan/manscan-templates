id: discuz-api-pathinfo

info:
  name: Discuz! X2.5 - Path Disclosure
  author: ritikchaddha
  severity: low
  description: |
    该模板用于检测 Discuz! X2.5 - Path Disclosure。该类漏洞通常源于敏感接口、配置文件、错误信息或调试数据被未授权暴露。模板主要向 `/api.php?mod[]=auto` 等路径发送探测请求，并根据响应中的 `.php</b> on line`、`function.array` 等特征确认漏洞是否存在。
  impact: |
    - 攻击者可获取路径、配置、账号、令牌、日志或其他敏感信息。
    - 泄露的信息可能被用于定位系统结构、复用凭据、绕过访问控制或辅助后续攻击。
  remediation: |
    - 移除或限制敏感接口、调试页面、配置文件和日志文件的外部访问。
    - 对错误信息和接口响应进行最小化处理，避免返回内部路径、账号、密钥或堆栈信息。
    - 轮换已暴露的凭据和令牌，并检查相关账号的访问记录。
  reference:
    - https://crx.xmspace.net/discuz_x25_api_php.html
    - http://www.1314study.com/t/87417.html
  classification:
    cpe: cpe:2.3:a:comsenz:discuz\\!:*:*:*:*:*:*:*:*
  metadata:
    verified: true
    max-request: 1
    vendor: comsenz
    product: discuz\\!
    shodan-query: title:"Discuz!"
    fofa-query: title="Discuz!"
  tags: discuz,info,disclosure,vuln

http:
  - method: GET
    path:
      - '{{BaseURL}}/api.php?mod[]=auto'

    matchers-condition: and
    matchers:
      - type: word
        part: body
        words:
          - '.php</b> on line'
          - 'function.array'
        condition: and

      - type: word
        part: header
        words:
          - 'text/html'

      - type: status
        status:
          - 200
