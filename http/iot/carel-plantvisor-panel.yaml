id: carel-plantvisor-panel

info:
  name: CAREL Pl@ntVisor 面板（IOT）
  author: Hardik-Solanki
  severity: medium
  description: |
    检测到 CAREL Pl@ntVisor 面板。该系统常用于暖通、制冷或楼宇设施监控，公网暴露可能泄露工业控制系统的管理入口。
  impact: |
    - 工业控制、楼宇自动化或能源设备面板暴露可能泄露设施运行状态和控制系统入口。
    - 若存在弱口令或历史漏洞，可能影响生产、楼控、供电或环境控制的安全边界。
  remediation: |
    - 将 OT/IoT 管理页面放置在隔离网络中，仅允许可信运维主机或 VPN 访问。
    - 启用强认证、最小权限和设备访问审计，及时更新厂商固件。
    - 避免将控制设备直接暴露到互联网，并监控异常登录和配置变更。
  metadata:
    max-request: 1
    shodan-query: title:"CAREL Pl@ntVisor"
  tags: panels,scada,iot,carel,discovery

http:
  - method: GET
    path:
      - '{{BaseURL}}'

    matchers-condition: and
    matchers:
      - type: word
        part: body
        words:
          - 'CAREL Pl@ntVisor'
          - 'alt="CAREL'
        condition: or

      - type: status
        status:
          - 200
