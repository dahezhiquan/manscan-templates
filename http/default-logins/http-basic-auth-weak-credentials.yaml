id: http-basic-auth-weak-credentials

info:
  name: HTTP Basic 认证弱口令检测（弱口令）
  author: dahezhiquan
  severity: high
  description: |
    该模板用于检测受 HTTP Basic 认证保护的资源是否仍接受常见弱口令。模板先确认目标返回 Basic 认证挑战，再使用少量常见用户名和密码组合发起认证请求；只有认证后返回成功状态且不再要求 Basic 认证时才确认命中。
  impact: |
    - 攻击者可使用常见弱口令直接访问受保护的页面、接口或管理入口。
    - 若受保护资源具备管理权限，可能导致敏感数据泄露、配置篡改、恶意文件投放或进一步接管服务器。
  remediation: |
    - 立即修改命中的 Basic Auth 凭据，避免使用默认、简单或在多个系统复用的口令。
    - 限制受保护资源的访问来源，启用登录失败限制、审计告警和多因素认证等纵深防御措施。
    - 排查认证成功后的访问记录，轮换可能已经暴露的相关凭据。
  reference:
    - https://datatracker.ietf.org/doc/html/rfc7617
    - https://cheatsheetseries.owasp.org/cheatsheets/Authentication_Cheat_Sheet.html
  tags: default-login,basic,weak-credentials,auth,misconfig,vuln

flow: http(1) && http(2)

http:
  - raw:
      - |
        GET / HTTP/1.1
        Host: {{Hostname}}

    matchers:
      - type: dsl
        dsl:
          - 'status_code == 401'
          - 'regex(tolower(header), "www-authenticate:\\s*basic")'
        condition: and
        internal: true

  - raw:
      - |
        GET / HTTP/1.1
        Host: {{Hostname}}
        Authorization: Basic {{base64(username + ':' + password)}}

    payloads:
      username:
        - admin
        - admin
        - root
        - root
        - guest
        - user
      password:
        - admin
        - 888888
        - root
        - 888888
        - guest
        - 123456
    attack: pitchfork
    stop-at-first-match: true

    matchers:
      - type: dsl
        dsl:
          - 'status_code >= 200 && status_code < 300'
          - '!contains(tolower(header), "www-authenticate: basic")'
        condition: and
