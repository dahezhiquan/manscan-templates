id: cassia-bluetooth-gateway-panel

info:
  name: Cassia Bluetooth Gateway 面板识别（暴露面识别）
  author: DhiyaneshDk
  severity: info
  description: |
    该模板通过识别 Cassia Bluetooth Gateway 登录入口的页面标题、特征文本或重定向行为，判断目标是否暴露了对应的认证界面。若命中，说明该登录面板对外可访问，可用于暴露面梳理与后续安全评估。
  reference:
    - https://www.cassianetworks.com/products/x1000-outdoor-bluetooth-router/
  metadata:
    verified: true
    max-request: 1
    shodan-query: html:"Cassia Bluetooth Gateway Management Platform"
  tags: cassia,gateway,login,panel,discovery

http:
  - method: GET
    path:
      - "{{BaseURL}}/cassia/login"

    matchers-condition: and
    matchers:
      - type: word
        part: body
        words:
          - "Cassia Bluetooth Gateway Management Platform"

      - type: status
        status:
          - 200
