id: steve-default-login

info:
  name: SteVe Login Panel - Detect（弱口令）
  author: clem9669
  severity: info
  description: |
    该模板通过尝试 SteVe Login Panel 的默认账号口令，并依据认证成功后的响应特征判断目标是否仍在使用未修改的弱口令。若命中，攻击者可直接登录系统，进一步访问敏感信息、修改配置或执行未授权操作。
  reference:
    - https://github.com/steve-community/steve
    - https://github.com/steve-community/steve/blob/e42ddcf1acf6c4ad2287bb466b2d3550663ce978/src/main/resources/config/test/main.properties
  classification:
    cvss-metrics: CVSS:3.0/AV:N/AC:L/PR:N/UI:N/S:U/C:N/I:N/A:N
    cvss-score: 0
    cwe-id: CWE-200
    cpe: cpe:2.3:a:steve-community:steve:*:*:*:*:*:*:*:*
  metadata:
    verified: true
    max-request: 2
    shodan-query: http.title:"SteVe - Steckdosenverwaltung"
    google-query: intitle:"SteVe - Steckdosenverwaltung"
    product: steve
    vendor: steve-community
  tags: panel,default-login,steve,vuln

http:
  - raw:
      - |
        GET /steve/manager/signin HTTP/1.1
        Host: {{Hostname}}
      - |
        POST /steve/manager/signin HTTP/1.1
        Host: {{Hostname}}
        Content-Type: application/x-www-form-urlencoded

        username={{username}}&password={{password}}&_csrf={{csrf}}

    attack: clusterbomb
    payloads:
      username:
        - admin
      password:
        - 1234
    redirects: true
    max-redirects: 2

    matchers-condition: and
    matchers:
      - type: word
        part: body_2
        words:
          - "<a>DATA MANAGEMENT"
          - "SIGN OUT</a>"
        condition: and

      - type: status
        status:
          - 200

    extractors:
      - type: regex
        part: body
        name: csrf
        group: 1
        regex:
          - '_csrf" value="(.*?)"/>'
        internal: true
