id: gcloud-org-sql-public-ip

info:
  name: Public IP 访问 的Cloud SQL Instances 未Restricted（云安全）
  author: princechaddha
  severity: medium
  description: 组织未限制 Cloud SQL public IP 时，数据库实例可直接暴露公网入口，即使授权网络受限也会增加攻击面。本模板检查 sql.restrictPublicIp 组织策略 booleanPolicy，返回空对象 {} 时报告未限制 Cloud SQL 公网 IP。
  impact: |
    - 数据库公网入口可能被扫描、爆破或利用弱配置攻击，增加数据泄露和服务中断风险。
    - 项目自行开启公网 IP 会绕过统一私网访问架构和数据库暴露面治理。
  remediation: |
    - 启用 sql.restrictPublicIp 组织策略，禁止或严格限制 Cloud SQL 实例使用公网 IP。
    - 对数据库访问优先使用私有 IP、Private Service Connect 或受控代理，并清理现有公网暴露实例。
  reference:
    - https://www.trendmicro.com/cloudoneconformity/knowledge-base/gcp/ResourceManager/restrict-public-ip-access-at-organization-level.html
    - https://cloud.google.com/sql/docs/mysql/configure-ip
  metadata:
    vendor: google
    product: resource-manager
  tags: cloud,devops,gcp,gcloud,resourcemanager,security,sql,networking,gcp-cloud-config

flow: |
  code(1)
  for(let orgId of iterate(template.orgIds)){
    set("orgId", orgId)
    code(2)
  }

self-contained: true

code:
  - engine:
      - sh
      - bash
    source: |
      gcloud organizations list --format="json(name)"

    extractors:
      - type: json
        name: orgIds
        internal: true
        json:
          - '.[].name'

  - engine:
      - sh
      - bash
    source: |
      gcloud alpha resource-manager org-policies describe sql.restrictPublicIp --organization=$orgId --effective --format="json(booleanPolicy)"

    matchers:
      - type: word
        words:
          - "{}"

    extractors:
      - type: dsl
        dsl:
          - '"Organization " + orgId + " has not restricted public IP access for Cloud SQL instances, allowing databases to be exposed to the internet"'
