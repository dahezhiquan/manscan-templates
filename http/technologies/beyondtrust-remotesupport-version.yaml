id: beyondtrust-remotesupport-version

info:
  name: BeyondTrust Remote Support 版本 指纹识别（指纹识别）
  author: missing0x00
  severity: info
  description: |-
    BeyondTrust Remote Support 版本 是远程支持平台，用于技术支持会话、远程访问和特权运维协作。该模板请求 `/get_rdf?comp=sdcust&locale_code=en-us`，并依据 HTTP 200 状态码、页面标题、正文关键字或品牌资源特征识别目标是否使用或暴露了 BeyondTrust Remote Support 版本 相关组件，适用于资产盘点、技术栈识别和后续安全评估；命中结果仅表示指纹特征匹配，不代表已确认存在可利用漏洞。
  classification:
    cpe: cpe:2.3:a:beyondtrust:remote_support:*:*:*:*:*:*:*:*
  metadata:
    verified: true
    max-request: 1
    vendor: beyondtrust
    product: remote_support
    shodan-query:
    - title:"Remote Support Portal"
    - http.favicon.hash:-694003434
    - http.html:"BeyondTrust Remote Support"
  tags: tech,beyondtrust,version,detect,discovery

http:
  - method: GET
    path:
      - '{{BaseURL}}/get_rdf?comp=sdcust&locale_code=en-us'

    matchers-condition: and
    matchers:
      - type: status
        status:
          - 200

      - type: word
        part: response
        words:
          - 'BeyondTrust'

    extractors:
      - type: regex
        name: extracted_unix_timestamp
        part: body
        group: 1
        regex:
          - 'en-us\n(.*)\n'
        internal: true

      - type: regex
        name: version
        part: body
        group: 1
        regex:
          - '\x07.([\.\d]+)\x00'
        internal: true

      - type: dsl
        dsl:
          - '"Version: " + version'
          - '"Timestamp: " + extracted_unix_timestamp'
          - '"Release Date: " + date_time("%Y-%M-%D", extracted_unix_timestamp)'
