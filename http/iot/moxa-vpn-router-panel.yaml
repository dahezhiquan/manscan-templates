id: moxa-vpn-router-panel

info:
  name: Moxa OnCell VPN 登录面板（IOT）
  author: biero-el-corridor
  severity: medium
  description: |
    检测到 Moxa OnCell VPN 登录面板。该入口用于工业蜂窝 VPN/路由设备管理，暴露后会增加边界网络设备被口令探测的风险。
  impact: |
    - 网关、路由器或 VPN 管理入口暴露会增加口令攻击、配置探测和设备接管风险。
    - 网络边界设备一旦被控制，可能导致流量劫持、访问策略篡改或内网横向移动。
  remediation: |
    - 将网络设备管理入口限制在可信管理网段或 VPN 内，禁止公网暴露。
    - 修改默认凭据，启用强认证和登录失败限制。
    - 定期升级固件并审计路由、DNS、端口转发和 VPN 配置变更。
  metadata:
    shodan-query: http.favicon.hash:-234487373
    verified: true
    max-request: 1
  tags: moxo,oncel,vpn,login,panel,discovery

http:
  - method: GET
    path:
      - "{{BaseURL}}/Login.asp"

    matchers-condition: and
    matchers:
      - type: word
        part: body
        words:
          - '<title>Moxa OnCell'
          - 'Login'
        condition: and

      - type: status
        status:
          - 200
