id: zzzcms-info-disclosure

info:
  name: Zzzcms 1.75 - 信息泄露漏洞
  author: ritikchaddha
  severity: low
  description: Zzzcms 1.75 - 信息泄露 存在信息泄露漏洞。未授权访问者可获取配置、凭证、用户数据或系统元信息，从而为后续攻击提供情报支持。
  reference:
    - https://xz.aliyun.com/t/7414
  classification:
    cpe: cpe:2.3:a:zzzcms:zzzcms:*:*:*:*:*:*:*:*
  metadata:
    verified: true
    max-request: 1
    vendor: zzzcms
    product: zzzcms
    shodan-query: html:"ZzzCMS"
    fofa-query: title="ZzzCMS"
  tags: zzzcms,info,disclosure,vuln

http:
  - raw:
      - |
        GET /plugins/webuploader/js/webconfig.php HTTP/1.1
        Host: {{Hostname}}

    matchers-condition: and
    matchers:
      - type: word
        part: body
        words:
          - 'var adminpath'
          - 'var imageMaxSize='
        condition: and

      - type: word
        part: header
        words:
          - text/html

      - type: status
        status:
          - 200
