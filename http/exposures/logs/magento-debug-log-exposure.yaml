id: magento-debug-log-exposure

info:
  name: Magento Debug Log 暴露（暴露面识别）
  author: 0x_Akoko
  severity: medium
  description: |
    检测到可直接访问的 Magento Debug Log。日志、异常页面或调试输出通常会泄露堆栈信息、内部路径、查询语句、账号标识、令牌片段或业务数据，不应向未授权用户开放。
  reference:
    - https://devdocs.magento.com/guides/v2.4/config-guide/log/log-intro.html
  classification:
    cvss-metrics: CVSS:3.1/AV:N/AC:L/PR:N/UI:N/S:U/C:H/I:N/A:N
    cvss-score: 7.5
    cwe-id: CWE-538
  metadata:
    max-request: 1
    verified: true
  tags: magento,exposure,logs,misconfig

http:
  - method: GET
    path:
      - "{{BaseURL}}/var/log/debug.log"

    max-size: 500000

    matchers:
      - type: dsl
        dsl:
          - 'contains_any(body, "main.DEBUG", "main.CRITICAL", "main.ERROR", "main.INFO")'
          - 'contains_any(body, "Magento\\", "/vendor/magento/", "cache_invalidate", "Cron Job")'
          - 'contains_any(content_type, "text/x-log")'
          - 'status_code == 200'
        condition: and
