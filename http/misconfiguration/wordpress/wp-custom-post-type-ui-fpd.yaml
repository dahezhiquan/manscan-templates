id: wp-custom-post-type-ui-fpd

info:
  name: WordPress Custom Post Type UI 插件完整路径泄露
  author: 0x_Akoko
  severity: low
  description: |-
    该模板用于核查 WordPress Custom Post Type UI 插件是否存在完整路径泄露。目标在直接访问插件或主题 PHP 文件时返回 Fatal error、Warning、Uncaught Error 或包含 wp-content 路径的错误页面，说明服务器错误显示或文件访问控制配置不当。模板访问 /wp-content/plugins/custom-post-type-ui/custom-post-type-ui.php，并根据错误关键字、组件目录名和状态码确认泄露。
  reference:
    - https://wordpress.org/plugins/custom-post-type-ui/
    - https://github.com/WebDevStudios/custom-post-type-ui
  classification:
    cvss-metrics: CVSS:3.1/AV:N/AC:L/PR:N/UI:N/S:U/C:L/I:N/A:N
    cvss-score: 5.3
    cwe-id: CWE-200
  metadata:
    max-request: 1
    verified: true
  tags: wordpress,fpd,wp-plugin,custom-post-type-ui,exposure
  impact: |-
    - 攻击者可获取站点物理路径、插件/主题目录结构和组件安装信息。
    - 路径信息可辅助后续文件包含、上传、调试信息利用或针对特定 WordPress 组件的攻击。
  remediation: |-
    - 关闭生产环境 PHP 错误显示，将错误记录到受保护的服务器日志。
    - 阻止外部直接访问不应单独执行的插件、主题内部 PHP 文件。
    - 及时更新 WordPress、插件和主题，并清理不再使用的组件。
http:
  - method: GET
    path:
      - "{{BaseURL}}/wp-content/plugins/custom-post-type-ui/custom-post-type-ui.php"

    matchers:
      - type: dsl
        dsl:
          - 'status_code == 200 || status_code == 500'
          - 'contains(body, "plugins/custom-post-type-ui/")'
          - 'contains_all(body, "Fatal error", "Call to undefined function") || contains_all(body, "Warning:", "failed to open stream")'
        condition: and
