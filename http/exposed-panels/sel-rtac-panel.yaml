id: sel-rtac-panel

info:
  name: SEL Real-Time Automation Controller - 登录面板（暴露面识别）
  author: rxerium
  severity: info
  description: |
    该模板通过识别 SEL Real-Time Automation Controller 登录入口的页面标题、特征文本或重定向行为，判断目标是否暴露了对应的认证界面。若命中，说明该登录面板对外可访问，可用于暴露面梳理与后续安全评估。
  reference:
    - https://selinc.com/products/3530/
    - https://selinc.com/products/3555/
  metadata:
    max-request: 2
    verified: true
    vendor: Schweitzer Engineering Laboratories
    product: sel-rtac
    shodan-query: http.title:"SEL-RTAC"
  tags: panel,scada,ics,sel,rtac,schweitzer,energy,utilities,discovery

http:
  - method: GET
    path:
      - "{{BaseURL}}"

    host-redirects: true
    max-redirects: 2

    matchers-condition: and
    matchers:
      - type: word
        part: body
        words:
          - '<title>SEL-RTAC</title>'
          - 'selinc.com'
          - 'SEL-RTAC'
        condition: or

      - type: status
        status:
          - 200
