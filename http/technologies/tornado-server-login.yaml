id: tornado-server-login

info:
  name: Tornado Server 登录面板 指纹识别（指纹识别）
  author: tess
  severity: info
  description: >-
    Tornado 是 Python 异步 Web 框架和服务器，登录面板可反映目标基于 Tornado 的管理或应用入口。该模板通过请求目标服务并检查预设路径或首页响应、页面正文关键字、状态码等指纹特征，判断目标是否使用或暴露了
    Tornado Server 登录面板 相关组件；命中结果仅表示指纹特征匹配，可用于资产盘点、技术栈识别和后续安全评估，不代表已确认存在可利用漏洞。
  classification:
    cvss-metrics: CVSS:3.0/AV:N/AC:L/PR:N/UI:N/S:U/C:N/I:N/A:N
    cvss-score: 0
    cwe-id: CWE-200
  metadata:
    verified: true
    max-request: 1
    shodan-query: title:"Tornado - Login"
  tags: panel,tornado,tech,discovery
http:
  - method: GET
    path:
      - '{{BaseURL}}'

    matchers-condition: and
    matchers:
      - type: word
        part: body
        words:
          - "Welcome to Docmosis Tornado"
          - "Please log in:"
        condition: and

      - type: status
        status:
          - 200
