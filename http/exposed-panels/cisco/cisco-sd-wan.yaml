id: cisco-sd-wan

info:
  name: Cisco SD-WAN 登录面板识别（暴露面识别）
  author: z3bd
  severity: info
  description: 该模板通过识别 Cisco SD-WAN 登录入口的页面标题、特征文本或重定向行为，判断目标是否暴露了对应的认证界面。若命中，说明该登录面板对外可访问，可用于暴露面梳理与后续安全评估。
  reference:
    - https://tools.cisco.com/security/center/content/CiscoSecurityAdvisory/cisco-sa-sdwan-bufovulns-B5NrSHbj
  classification:
    cvss-metrics: CVSS:3.0/AV:N/AC:L/PR:N/UI:N/S:U/C:N/I:N/A:N
    cwe-id: CWE-200
    cpe: cpe:2.3:a:cisco:sd-wan:*:*:*:*:*:*:*:*
  metadata:
    max-request: 1
    vendor: cisco
    product: sd-wan
    shodan-query: cpe:"cpe:2.3:a:cisco:sd-wan"
  tags: panel,cisco,discovery

http:
  - method: GET
    path:
      - "{{BaseURL}}/login"

    matchers-condition: and
    matchers:
      - type: status
        status:
          - 200

      - type: word
        words:
          - "SD-Wan Center"
        part: body
