id: jolokia-detect

info:
  name: Jolokia 指纹识别（指纹识别）
  author: mavericknerd,dwisiswant0
  severity: info
  description: >-
    Jolokia 是 JMX-over-HTTP 桥接组件，用于通过 HTTP/JSON 访问 Java 应用的 JMX 管理信息。该模板通过请求目标服务并检查预设路径或首页响应、页面正文关键字、状态码等指纹特征，判断目标是否使用或暴露了
    Jolokia 相关组件；命中结果仅表示指纹特征匹配，可用于资产盘点、技术栈识别和后续安全评估，不代表已确认存在可利用漏洞。
  metadata:
    max-request: 1
  tags: tech,jolokia,discovery
http:
  - method: GET
    path:
      - '{{BaseURL}}/jolokia/version'
      - '{{BaseURL}}/actuator/jolokia/version'

    stop-at-first-match: true
    matchers-condition: and
    matchers:
      - type: word
        words:
          - '"timestamp":'
          - '"protocol":'
          - '"agent":'
        condition: and

      - type: status
        status:
          - 200

    extractors:
      - type: json
        json:
          - '.value.agent'
