id: onion-website-supported

info:
  name: Onion-Location 头支持检测
  author: rxerium
  severity: low
  description: |
    检测网站是否通过 Onion-Location HTTP 响应头声明支持 Tor 网络访问。该响应头会指向对应的 .onion 服务，以提供更强的隐私和匿名访问能力。
  impact: |
    - 命中内容可用于资产画像、人员/社群关联、公开目录发现或业务线索收集。
    - 单独结果通常不等同于漏洞，但与其他信息组合后可能降低攻击者侦察成本。
  remediation: |
    - 确认公开信息是否符合预期，移除不必要的联系人、目录、社群或资源索引。
    - 对必须公开的文件和链接进行最小化披露，避免包含内部路径或敏感标识。
    - 定期巡检公开页面，确保内容仍然准确且未泄露额外信息。
  metadata:
    verified: true
    max-request: 1
  tags: misc,osint,tor,onion,discovery

http:
  - method: GET
    path:
      - "{{BaseURL}}"

    matchers:
      - type: regex
        part: header
        regex:
          - '(?i)onion-location:\s*https?://[a-z0-9]+\.onion'

    extractors:
      - type: regex
        part: header
        group: 1
        regex:
          - '(?i)onion-location:\s*(https?://[a-z0-9]+\.onion)'
