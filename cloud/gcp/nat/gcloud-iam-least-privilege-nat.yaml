id: gcloud-iam-least-privilege-nat

info:
  name: Least Privilege 访问 的Cloud NAT Management（云安全）
  author: princechaddha
  severity: medium
  description: 该规则用于检查 GCP nat 相关身份、权限或口令安全策略是否符合最小权限和强认证要求，避免因过度授权或弱认证导致资源被滥用。
  impact: |
    - 过度授权、弱口令策略或缺少 MFA 会显著提升账户被滥用的风险。
    - 一旦身份被攻破，攻击者可能借助合法权限直接访问或控制云资源。
  remediation: |
    - 落实最小权限原则，收敛高危权限、通配授权和不必要的管理员能力。
    - 对关键账户和控制台访问强制启用 MFA，并完善口令复杂度、轮换与重用限制策略。
  reference:
    - https://cloud.google.com/iam/docs/understanding-roles
    - https://cloud.google.com/nat/docs/overview
  tags: cloud,devops,gcp,gcloud,iam,cloud-nat,gcp-cloud-config

flow: |
  code(1)
  for(let projectId of iterate(template.projectIds)){
    set("projectId", projectId)
    code(2)
  }

self-contained: true

code:
  - engine:
      - sh
      - bash
    source: |
      gcloud projects list --format="json(projectId)"

    extractors:
      - type: json
        name: projectIds
        internal: true
        json:
          - '.[].projectId'

  - engine:
      - sh
      - bash
    source: |
      gcloud projects get-iam-policy $projectId --format="json(bindings)"

    matchers:
      - type: word
        words:
          - '"roles/owner"'
          - '"roles/editor"'
          - '"roles/compute.networkAdmin"'
        condition: or

    extractors:
      - type: dsl
        dsl:
          - '"Overprivileged role found in project: " + projectId'
