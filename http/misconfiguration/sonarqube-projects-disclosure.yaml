id: sonarqube-projects-disclosure

info:
  name: SonarQube 信息泄露
  author: DhiyaneshDk
  severity: medium
  description: |
    该模板用于核查 SonarQube 信息泄露。该类问题通常源于配置文件、备份文件、管理页面、服务状态或敏感资源被错误暴露到 Web 访问路径。模板会向目标发送探测请求，并依据请求 `/api/components/search_projects`、匹配 `"visibility":"public"`、匹配 `{"organization`、匹配 `application/json`等证据确认目标是否存在该配置问题。
  impact: |
    - 攻击者可获取版本、路径、账号、密钥、令牌、配置或业务数据等敏感信息。
    - 泄露的信息可能被用于凭据攻击、漏洞匹配、权限提升或横向移动。
  remediation: |
    - 移除 Web 根目录下不应公开的配置、备份、日志和临时文件。
    - 为敏感页面和资源增加访问控制，并按最小暴露原则收敛公开路径。
    - 轮换已暴露的密钥、令牌和凭据，并审计异常下载或枚举行为。
  reference:
    - https://github.com/PeiQi0/PeiQi-WIKI-Book/blob/main/docs/wiki/webapp/SonarQube/SonarQube%20search_projects%20%E9%A1%B9%E7%9B%AE%E4%BF%A1%E6%81%AF%E6%B3%84%E9%9C%B2%E6%BC%8F%E6%B4%9E.md
    - https://github.com/deletescape/sloot
  classification:
    cpe: cpe:2.3:a:sonarsource:sonarqube:*:*:*:*:*:*:*:*
  metadata:
    verified: true
    max-request: 1
    vendor: sonarsource
    product: sonarqube
    shodan-query: title:"Sonarqube"
    fofa-query: app="sonarQube-代码管理"
  tags: sonarqube,exposure,misconfig,vuln

http:
  - method: GET
    path:
      - "{{BaseURL}}/api/components/search_projects"

    matchers-condition: and
    matchers:
      - type: word
        part: body
        words:
          - '"visibility":"public"'
          - '{"organization'
        condition: and

      - type: word
        part: header
        words:
          - 'application/json'

      - type: status
        status:
          - 200
