id: jboss-jbpm-admin

info:
  name: JBoss jBPM Administration Console 登录面板识别（暴露面识别）
  author: DhiyaneshDK
  severity: info
  description: 该模板通过识别 JBoss jBPM Administration Console 登录入口的页面标题、特征文本或重定向行为，判断目标是否暴露了对应的认证界面。若命中，说明该登录面板对外可访问，可用于暴露面梳理与后续安全评估。
  reference:
    - https://github.com/PortSwigger/j2ee-scan/blob/master/src/main/java/burp/j2ee/issues/impl/JBossjBPMAdminConsole.java
  classification:
    cvss-metrics: CVSS:3.1/AV:N/AC:L/PR:N/UI:N/S:U/C:N/I:N/A:N
    cwe-id: CWE-200
    cpe: cpe:2.3:a:redhat:jbpm:*:*:*:*:*:*:*:*
  metadata:
    verified: true
    max-request: 1
    vendor: redhat
    product: jbpm
    shodan-query:
      - html:"JBossWS"
      - http.html:"jbossws"
    fofa-query: body="jbossws"
  tags: jboss,panel,login,redhat,discovery

http:
  - method: GET
    path:
      - '{{BaseURL}}/jbpm-console/app/tasks.jsf'

    matchers-condition: and
    matchers:
      - type: word
        part: body
        words:
          - 'JBoss jBPM Administration Console'

      - type: status
        status:
          - 200
