id: erlang-otp-ssh-detect

info:
  name: Erlang/OTP SSH 服务识别（指纹识别）
  author: darses
  severity: info
  description: |
    Erlang/OTP SSH Server 是 Erlang/OTP 提供的 SSH 服务实现，可用于远程 Shell、文件传输或嵌入式管理通道。该模板连接 22/TCP 并读取协议响应，通过匹配 `SSH-2.0-Erlang` 等响应特征识别目标服务。
  metadata:
    shodan-query: 'SSH-2.0-Erlang'
    max-request: 1
    verified: true
  tags: network,ssh,erlang,detect,tcp,discovery

tcp:
  - host:
      - "{{Hostname}}"

    port: 22
    read-size: 1024

    matchers:
      - type: word
        words:
          - "SSH-2.0-Erlang"

    extractors:
      - type: regex
        regex:
          - "SSH-2.0-Erlang/[0-9\\.]+"
