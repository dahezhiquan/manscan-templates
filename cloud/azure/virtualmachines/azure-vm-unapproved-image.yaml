id: azure-vm-unapproved-image
info:
  name: Azure VM 未Using Approved Image（云安全）
  author: princechaddha
  severity: medium
  description: Azure VM 使用经过批准的镜像有助于统一补丁、恶意软件防护、基线和软件供应链治理；storageProfile.imageReference.id 为空时，本模板无法确认实例来自组织登记的共享镜像或版本。本模板枚举虚拟机并查询该字段，在返回 ImageId 为 null 时报告。
  impact: |
    - 未经批准的自定义镜像可能包含过期组件、后门、残留凭据或不符合组织配置的安全设置。
    - 镜像来源不可追溯会削弱补丁响应、漏洞排查、取证和实例重建的一致性。
  remediation: |
    - 使用 Azure Compute Gallery 或经安全评审的 Marketplace 镜像部署，并记录镜像版本、来源和批准状态。
    - 对现有实例执行镜像内容和软件清单审查，完成迁移或重建前轮换残留凭据并纳入镜像发布流水线。
  reference:
    - https://docs.microsoft.com/en-us/azure/virtual-machines/windows/overview
  metadata:
    vendor: microsoft
    product: azure-virtual-machines
  tags: cloud,devops,azure,microsoft,virtual-machine,azure-cloud-config

flow: |
  code(1);
  for (let VMData of iterate(template.vmList)) {
    VMData = JSON.parse(VMData);
    set("name", VMData.Name);
    set("resourceGroup", VMData.ResourceGroup);
    code(2);
  }

self-contained: true
code:
  - engine:
      - sh
      - bash
    source: |
      az vm list --output json --query '[*].{"Name":name,"ResourceGroup":resourceGroup}'

    extractors:
      - type: json
        name: vmList
        internal: true
        json:
          - '.[]'

  - engine:
      - sh
      - bash
    source: |
      az vm show --name "$name" --resource-group "$resourceGroup" --query '{"ImageId": storageProfile.imageReference.id}'

    matchers-condition: and
    matchers:
      - type: word
        words:
          - '"ImageId": null'

    extractors:
      - type: dsl
        dsl:
          - 'name + " in " + resourceGroup + " is using an unapproved Azure machine image"'
