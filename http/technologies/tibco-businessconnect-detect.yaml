id: tibco-businessconnect-detect

info:
  name: TIBCO BusinessConnect 指纹识别（指纹识别）
  author: righettod
  severity: info
  description: >-
    TIBCO BusinessConnect 是企业 B2B 集成平台，用于管理交易伙伴、业务协议和跨企业消息交换。该模板通过请求目标服务并检查预设路径或首页响应、DSL
    条件等指纹特征，判断目标是否使用或暴露了 TIBCO BusinessConnect 相关组件；命中结果仅表示指纹特征匹配，可用于资产盘点、技术栈识别和后续安全评估，不代表已确认存在可利用漏洞。
  reference:
  - https://www.tibco.com/products/tibco-businessconnect
  classification:
    cpe: cpe:2.3:a:tibco:businessconnect:*:*:*:*:*:*:*:*
  metadata:
    verified: true
    max-request: 1
    vendor: tibco
    product: businessconnect
    shodan-query: http.html:"TIBCO BusinessConnect"
  tags: tibco,detect,tech,discovery
http:
  - method: GET
    path:
      - "{{BaseURL}}"

    matchers:
      - type: dsl
        dsl:
          - 'status_code == 200'
          - 'contains(header, "TIBCO BusinessConnect")'
        condition: and
