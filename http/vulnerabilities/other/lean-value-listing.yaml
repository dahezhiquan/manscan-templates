id: lean-value-listing

info:
  name: LVS Lean Value Management System Business - Directory Listing
  author: pussycat0x
  severity: low
  description: |
    该模板用于检测 LVS Lean Value Management System Business - Directory Listing。该类问题通常源于 Web 目录索引、插件资源目录或静态文件目录未关闭浏览功能，导致未授权访问者可枚举目录中的文件和子目录。模板会向 `/Business/` 等位置发送探测请求，并结合响应状态、目录索引关键字、文件链接或页面特征判断目标是否存在目录列表暴露。
  impact: |
    - 攻击者可枚举插件、主题、备份文件、源码片段或静态资源路径，获取版本与目录结构等敏感线索。
    - 暴露的文件列表可能帮助攻击者定位可下载文件、历史备份或后续可利用的组件漏洞。
  remediation: |
    - 关闭 Web 服务器或应用目录的自动索引功能，避免对外展示目录文件列表。
    - 为插件、上传、备份和静态资源目录增加访问控制，并移除不应公开的文件。
    - 检查访问日志中针对目录索引和敏感文件的枚举行为，必要时轮换已暴露的凭据或密钥。
  reference:
    - https://github.com/Threekiii/Awesome-POC/blob/master/Web%E5%BA%94%E7%94%A8%E6%BC%8F%E6%B4%9E/%E5%90%89%E6%8B%89%E7%A7%91%E6%8A%80%20LVS%E7%B2%BE%E7%9B%8A%E4%BB%B7%E5%80%BC%E7%AE%A1%E7%90%86%E7%B3%BB%E7%BB%9F%20Business%20%E7%9B%AE%E5%BD%95%E9%81%8D%E5%8E%86%E6%BC%8F%E6%B4%9E.md
  metadata:
    verified: true
    max-request: 1
    fofa-query: "Supperd By 吉拉科技"
  tags: lean-value,misconfig,listing,vuln

http:
  - method: GET
    path:
      - "{{BaseURL}}/Business/"

    matchers-condition: and
    matchers:
      - type: word
        part: body
        words:
          - '/Business/'
          - 'AgencytaskList.aspx'
        condition: and

      - type: status
        status:
          - 200
