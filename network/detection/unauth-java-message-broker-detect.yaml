id: unauth-java-message-broker-detect

info:
  name: Unauthenticated Java Message Broker 识别（服务漏洞）
  author: matejsmycka
  severity: low
  description: |
    该模板通过网络响应特征识别目标是否开放 Unauthenticated Java Message Broker 相关服务。
  metadata:
    verified: true
    shodan-query: product:"Java Message Service"
  tags: network,tcp,jms,openmq,unauth

tcp:
  - inputs:
      - data: "\n"

    host:
      - "{{Hostname}}"
    port: 7676

    matchers:
      - type: word
        words:
          - "101 imqbroker"
          - "cluster_discovery"
        condition: and

    extractors:
      - type: regex
        regex:
          - "imqbroker ([0-9.]+)"
