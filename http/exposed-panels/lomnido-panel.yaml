id: lomnido-panel

info:
  name: Lomnido 面板识别（指纹识别）
  author: righettod
  severity: info
  description: |
    该模板通过识别 Lomnido 面板、控制台或管理界面的页面特征，判断目标是否暴露了对应服务入口。若命中，说明该后台或运维界面对外可访问，可用于资产识别与暴露面排查。
  reference:
    - https://lomnido.com/
  metadata:
    verified: true
    max-request: 1
    shodan-query: http.title:"Lomnido Login"
  tags: lomnido,panel,login,detect,discovery

http:
  - method: GET
    path:
      - "{{BaseURL}}/"

    matchers-condition: and
    matchers:
      - type: word
        part: body
        words:
          - "<title>Lomnido Login</title>"
          - "/lomnido/saml"
        condition: and

      - type: status
        status:
          - 200
