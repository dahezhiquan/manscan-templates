id: amp-application-panel

info:
  name: Application Management 面板识别（暴露面识别）
  author: DhiyaneshDK
  severity: info
  description: 该模板通过识别 Application Management 面板、控制台或管理界面的页面特征，判断目标是否暴露了对应服务入口。若命中，说明该后台或运维界面对外可访问，可用于资产识别与暴露面排查。
  classification:
    cvss-metrics: CVSS:3.0/AV:N/AC:L/PR:N/UI:N/S:U/C:N/I:N/A:N
    cwe-id: CWE-200
    cpe: cpe:2.3:a:cubecoders:amp:*:*:*:*:*:*:*:*
  metadata:
    verified: true
    max-request: 1
    vendor: cubecoders
    product: amp
    shodan-query:
      - title:"AMP - Application Management Panel"
      - http.title:"amp - application management panel"
    fofa-query: title="amp - application management panel"
    google-query: intitle:"amp - application management panel"
  tags: panel,amp,cubecoders,discovery

http:
  - method: GET
    path:
      - "{{BaseURL}}"

    matchers-condition: and
    matchers:
      - type: word
        words:
          - "<title>AMP - Application Management Panel</title>"

      - type: word
        part: header
        words:
          - "text/html"
