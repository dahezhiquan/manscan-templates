id: api-clearbit

info:
  name: Clearbit API Token 可用性校验（token喷洒）
  author: daffainfo
  severity: info
  description: 该模板通过调用 Clearbit API 的已知接口验证提供的 token 是否有效，命中后通常表示可访问企业补全与公司信息查询能力。
  reference:
    - https://clearbit.com/docs
    - https://github.com/daffainfo/all-about-apikey/tree/main/clearbit
  metadata:
    max-request: 1
  tags: token-spray,clearbit

self-contained: true

http:
  - raw:
      - |
        GET https://person.clearbit.com/v2/combined/find?email=alex@clearbit.com HTTP/1.1
        Authorization: Basic {{base64(token + ':')}}
        Host: person.clearbit.com

    matchers:
      - type: word
        part: body
        words:
          - '"person":'
          - '"id":'
          - '"name":'
        condition: and
