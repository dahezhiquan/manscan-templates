id: dufs-detect

info:
  name: DUFS 指纹识别（指纹识别）
  author: righettod
  severity: info
  description: |-
    DUFS 是轻量级文件服务器，用于通过 Web 提供目录浏览、上传和下载能力。该模板请求首页，并依据 DSL 条件识别目标是否使用或暴露了 DUFS 相关组件，适用于资产盘点、技术栈识别和后续安全评估；命中结果仅表示指纹特征匹配，不代表已确认存在可利用漏洞。
  reference:
  - https://github.com/sigoden/dufs
  metadata:
    verified: true
    max-request: 1
    shodan-query: http.html:"Dufs"
  tags: tech,dufs,detect,discovery

http:
  - method: GET
    path:
      - "{{BaseURL}}"

    host-redirects: true
    matchers:
      - type: dsl
        dsl:
          - 'status_code == 200'
          - 'contains_all(to_lower(body), "__dufs_v", "allow_upload")'
        condition: and

    extractors:
      - type: regex
        part: body
        group: 1
        regex:
          - '(?i)__dufs_v([0-9.]+)_'
