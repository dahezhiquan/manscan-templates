id: 3xui-default-login

info:
  name: 3X-UI 默认登录（弱口令）
  author: mapioe
  severity: high
  description: |
    该模板用于检测 3X-UI 是否仍可使用默认凭据或弱口令登录。模板主要向 `/`、`/csrf-token` 等认证入口发送请求，使用内置默认凭据组合进行认证尝试，并根据状态码、认证 Cookie、跳转位置或登录后的页面关键字判断登录是否成功；命中说明目标未及时修改出厂、示例或初始化账号口令。
  impact: |
    - 攻击者可进入 3X-UI 管理后台，修改任务、服务、插件、路由、作业调度或部署配置。
    - 在 DevOps、网关、监控或运维场景中，后台失陷可能影响生产任务执行、泄露密钥配置，并扩大到下游主机或业务系统。
  remediation: |
    - 立即修改默认管理员口令并清理示例账号，按角色最小化后台管理权限。
    - 将控制台和管理 API 放入受控网络或 VPN 后方，并开启多因素认证、登录失败限制和操作审计。
    - 复核近期任务、插件、连接配置、访问令牌和部署记录，轮换可能暴露的密钥。
  reference:
    - https://github.com/MHSanaei/3x-ui
    - https://github.com/MHSanaei/3x-ui/wiki/Installation
  classification:
    cwe-id: CWE-798
    cpe: cpe:2.3:a:mhsanaei:3x-ui:*:*:*:*:*:*:*:*
  metadata:
    verified: true
    max-request: 3
    product: 3x-ui
    vendor: mhsanaei
    fofa-query: 'title="3x-ui"'
    shodan-query: '3x-ui http.title:"sign in"'
  tags: 3x-ui,default-login

variables:
  username: "admin"
  password: "admin"

flow: http(1) && http(2) && http(3)

http:
  - raw:
      - |
        GET / HTTP/1.1
        Host: {{Hostname}}

    host-redirects: true
    max-redirects: 3

    matchers:
      - type: dsl
        dsl:
          - 'status_code == 200'
          - 'contains_any(body, "X_UI_BASE_PATH", "<title>3x-ui")'
        condition: and
        internal: true

  - raw:
      - |
        GET /csrf-token HTTP/1.1
        Host: {{Hostname}}

    matchers:
      - type: dsl
        dsl:
          - 'status_code == 200'
          - 'contains(body, "success")'
        condition: and
        internal: true

    extractors:
      - type: json
        name: csrftoken
        json:
          - ".obj"
        internal: true

  - raw:
      - |
        POST /login HTTP/1.1
        Host: {{Hostname}}
        Content-Type: application/x-www-form-urlencoded
        X-Csrf-Token: {{csrftoken}}

        username={{username}}&password={{password}}

    matchers:
      - type: dsl
        dsl:
          - 'status_code == 200'
          - 'contains(content_type, "application/json")'
          - 'contains_all(body, "\"success\":true", "msg")'
        condition: and
