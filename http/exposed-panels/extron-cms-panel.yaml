id: ektron-cms-panel

info:
  name: Ektron CMS 登录面板识别（暴露面识别）
  author: pikpikcu
  severity: info
  description: 该模板通过识别 Ektron CMS 登录入口的页面标题、特征文本或重定向行为，判断目标是否暴露了对应的认证界面。若命中，说明该登录面板对外可访问，可用于暴露面梳理与后续安全评估。
  classification:
    cvss-metrics: CVSS:3.0/AV:N/AC:L/PR:N/UI:N/S:U/C:N/I:N/A:N
    cwe-id: CWE-200
    cpe: cpe:2.3:a:ektron:ektron_content_management_system:*:*:*:*:*:*:*:*
  metadata:
    verified: true
    max-request: 1
    vendor: ektron
    product: ektron_content_management_system
    shodan-query:
      - http.html:"Ektron"
      - http.html:"ektron"
      - cpe:"cpe:2.3:a:ektron:ektron_content_management_system"
    fofa-query:
      - app="Ektron-CMS"
      - app="ektron-cms"
      - body="ektron"
  tags: panel,ektron,cms,discovery

http:
  - method: GET
    path:
      - "{{BaseURL}}"

    matchers-condition: and
    matchers:
      - type: word
        part: body
        words:
          - "EktronClientManager"
          - "ektronTheme"
          - "Ektron.ready"
        condition: or

      - type: status
        status:
          - 200
