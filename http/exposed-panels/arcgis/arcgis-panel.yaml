id: arcgis-panel

info:
  name: ArcGIS Enterprise 面板（暴露面识别）
  author: Podalirius
  severity: low
  description: |-
    检测到目标站点暴露 ArcGIS Enterprise 相关面板或登录入口。ArcGIS Enterprise 是 Esri 的地理信息平台，Portal 与服务界面用于管理地图、应用、用户和空间数据服务。模板请求 `/portal/portalhelp/en/`，并通过页面标题或正文关键字、状态码确认入口可访问；此类面板若直接暴露在公网，会增加账号枚举、口令攻击、漏洞匹配和未授权访问尝试的机会。
  impact: |-
    - 攻击者可确认目标部署了 ArcGIS Enterprise 或相关组件，并据此开展账号枚举、口令喷洒、默认凭据尝试或针对性漏洞匹配。
    - 若面板存在弱口令、默认配置、访问控制缺陷或未修复漏洞，可能导致后台权限被获取、配置被篡改、敏感数据泄露或业务系统被接管。
    - 管理入口长期暴露在公网会扩大攻击面，增加自动化扫描、撞库、社会工程和后续横向移动的风险。
  remediation: |-
    - 将 ArcGIS Enterprise 面板限制在内网、VPN、堡垒机或可信源 IP 访问范围内，避免管理入口直接暴露在公网。
    - 启用强密码、多因素认证、登录失败限制和默认账户清理，定期审计登录日志与管理员账号权限。
    - 保持系统和相关组件更新到受支持版本，关闭不必要的管理路径，并在必须公网访问时增加反向代理访问控制、WAF 或零信任访问策略。
  reference:
    - https://enterprise.arcgis.com/en/
  classification:
    cwe-id: CWE-200
    cpe: cpe:2.3:a:esri:arcgis_enterprise:*:*:*:*:*:*:*:*
  metadata:
    max-request: 1
    vendor: esri
    product: arcgis_enterprise
  tags: docs,arcgis,cms,panel,esri,discovery
http:
  - method: GET
    path:
      - '{{BaseURL}}/portal/portalhelp/en/'

    matchers-condition: and
    matchers:
      - type: word
        words:
          - 'ArcGIS Enterprise'
          - 'Installation and Deployment'
        condition: or

      - type: status
        status:
          - 200

    extractors:
      - type: regex
        part: body
        group: 1
        regex:
          - '&nbsp;([0-9.]+)</span>'

      - type: regex
        part: body
        group: 2
        regex:
          - '(Released Version:</strong>[\n\t ]+(([0-9]+(.[0-9]+)?(.[0-9]+)?)([\n\t
            ]+\([A-Za-z]+[\t ]+20[0-9][0-9]\))?))'
