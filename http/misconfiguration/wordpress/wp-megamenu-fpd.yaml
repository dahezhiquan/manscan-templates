id: wp-megamenu-fpd

info:
  name: WordPress Plugin Max Mega Menu (megamenu) 完整路径泄露
  author: DhiyaneshDk
  severity: low
  description: |
    检测到 WordPress Plugin Max Mega Menu (megamenu) 完整路径泄露。目标暴露了调试、错误或堆栈信息，可能泄露应用路径、框架版本、环境变量、源码位置或内部调用细节。
  reference:
    - https://wordpress.org/plugins/megamenu/
  metadata:
    max-request: 1
    verified: true
    shodan-query: html:"/plugins/megamenu"
  tags: debug,wordpress,fpd,megamenu,wp-plugin

http:
  - method: GET
    path:
      - "{{BaseURL}}/wp-content/plugins/megamenu/integration/zerif/functions.php"

    matchers:
      - type: dsl
        dsl:
          - 'status_code == 200'
          - 'contains_all(body, "Fatal error", "Uncaught Error:", "/plugins/megamenu/")'
        condition: and
