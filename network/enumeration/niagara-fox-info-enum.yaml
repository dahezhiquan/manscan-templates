id: niagara-fox-info-enum

info:
  name: Niagara Fox 协议信息枚举（服务漏洞）
  author: pussycat0x
  severity: medium
  description: |
    Niagara Fox 是 Tridium Niagara 楼宇自动化平台使用的通信协议，常见于楼控、暖通和能源管理系统。该模板连接 1911/TCP 并请求 Fox 信息，通过 `fox.version` 等字段枚举主机名、应用版本、运行环境和系统标识。
  impact: |
    - 攻击者可能获取 Niagara 主机名、应用版本、Java/操作系统信息和品牌标识，辅助定位楼宇自动化系统。
    - 在工业与楼控场景中，公开的设备信息可被用于后续漏洞筛选、弱口令攻击或针对性入侵。
  remediation: |
    - 将 Niagara Fox 端口限制在楼控专用网络或受信任管理主机范围内。
    - 升级 Niagara 平台并启用认证、访问控制和网络分段，避免控制系统信息被外部枚举。
    - 审计 Fox 协议访问日志，排查来自非管理来源的探测行为。
  reference:
    - https://nmap.org/nsedoc/scripts/fox-info.html
  metadata:
    verified: true
    max-request: 1
    shodan-query: product:"Niagara Fox"
  tags: network,fox,niagara,enum,tcp,discovery
tcp:
  - inputs:
      - data: "fox a 1 -1 fox hello\n{\nfox.version=s:1.0\nid=i:1\n};;\n"
    host:
      - "{{Hostname}}"
    port: 1911

    matchers:
      - type: word
        words:
          - "fox.version"

    extractors:
      - type: regex
        regex:
          - "fox.version=s:([0-9.]+)"
          - "hostName=s:([0-9.]+)"
          - "hostAddress=s:([0-9.]+)"
          - "app.name=s:([A-Za-z0-9]+)"
          - "app.version=s:([0-9.]+)"
          - "vm.name=s:([A-Za-z ()0-9]+)"
          - "vm.version=s:([0-9._-a-z]+)"
          - "os.name=s:([A-Z]+)"
          - "os.version=s:([0-9.]+)"
