id: gcloud-vpc-unattached-static-ips

info:
  name: Unattached Static External IP Addresses（云安全）
  author: princechaddha
  severity: low
  description: 未绑定的静态外部 IP 地址仍会占用公网地址资源并产生管理成本，也可能被误认为可用资产而延误清理。Google 文档指出不再需要静态外部地址时应释放该地址资源。本模板检查指定区域的静态地址状态，命中 RESERVED 时报告存在未挂载静态外部 IP。
  impact: |
    - 闲置公网 IP 增加资产盘点噪音和成本支出，容易造成地址资源浪费。
    - 未清理的公网地址可能被后续误绑定到不合规资源，增加暴露面治理难度。
  remediation: |
    - 确认该静态外部 IP 无业务保留需求后释放地址资源。
    - 建立静态 IP 标签、归属人和生命周期审计，定期清理 RESERVED 但未绑定的地址。
  reference:
    - https://www.trendmicro.com/cloudoneconformity/knowledge-base/gcp/VPC/unattached-static-ip-address.html
    - https://cloud.google.com/compute/docs/ip-addresses/reserve-static-external-ip-address
  metadata:
    vendor: google
    product: cloud-vpc
  tags: cloud,devops,gcp,gcloud,vpc,networking,cost-optimization,gcp-cloud-config

flow: |
  code(1)
  for(let projectId of iterate(template.projectIds)){
    set("projectId", projectId)
    code(2)
  }

self-contained: true

code:
  - engine:
      - sh
      - bash
    source: |
      gcloud projects list --format="json(projectId)"

    extractors:
      - type: json
        name: projectIds
        internal: true
        json:
          - '.[].projectId'

  - engine:
      - sh
      - bash
    source: |
      gcloud compute addresses describe cc-production-instance-static-ip --region=us-central1 --project=$projectId --format="json(name,region,status)"

    matchers:
      - type: word
        words:
          - "RESERVED"

    extractors:
      - type: dsl
        dsl:
          - '"Project " + projectId + " has an unattached static IP address in region us-central1"'
