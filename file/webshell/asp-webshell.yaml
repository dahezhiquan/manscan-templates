id: asp-webshell

info:
  name: ASP/ASP.NET WebShell 检测（本地文件安全扫描）
  author: lu4nx
  severity: high
  description: |
    ASP、ASP.NET 文件中的动态执行、WScript.Shell、cmd.exe 和命令处理函数组合，可能构成服务器端 WebShell，使攻击者通过 HTTP 远程执行命令或读写主机文件。该模板扫描 ASP/ASP.NET 相关扩展名，并用正则匹配 eval、execute、WScript.Shell、ExecuteStatement、cmd.exe 等特征；命中是 WebShell 候选，需结合文件来源、访问日志和行为复核。
  impact: |
    - 成功部署的 WebShell 可使攻击者以 Web 进程权限执行命令、读取配置和数据库凭据、修改站点内容或建立持久化。
    - 攻击者还可能借助服务器访问内网、横向移动、窃取数据或继续投放恶意文件。
  remediation: |
    - 立即隔离并保留命中文件、哈希和时间线，禁止 Web 进程执行脚本外的系统命令并移除未经授权的脚本。
    - 修补导致文件上传或写入的入口，限制脚本目录权限和可执行扩展名，关闭不必要的 WScript、命令执行能力。
    - 检查进程、计划任务、启动项、网络连接和同目录文件；轮换服务器凭据并从可信版本恢复站点。
  reference:
    - https://github.com/tennc/webshell/tree/master/aspx
    - https://github.com/tennc/webshell/tree/master/asp
    - https://www.rapid7.com/blog/post/2016/12/14/webshells-101/
  metadata:
    verified: true
  tags: asp,aspx,file,webshell
file:
  - extensions:
      - asp
      - asa
      - aspx
      - ashx
      - asmx
      - asax

    extractors:
      - type: regex
        regex:
          - '(?i)(eval)'
          - '(?i)(eval|execute)\('
          - '(?i)wscript.shell'
          - '(?i)ExecuteStatement'
          - '(?i)cmd.exe'
          - '(?i)mmshell'
          - '(?i)GetCmd'
