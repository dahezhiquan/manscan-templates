id: espeasy-installer

info:
  name: ESPEasy 安装 暴露
  author: ritikchaddha
  severity: medium
  description: |
    检测到 ESPEasy 安装 暴露。该页面属于安装、初始化或配置向导流程，若对外暴露，攻击者可能完成初始化、创建管理员账户或重新配置目标系统。
  metadata:
    verified: true
    max-request: 1
  tags: misconfig,espeasy,install,exposure,vuln

http:
  - method: GET
    path:
      - "{{BaseURL}}/ESPEasy"

    host-redirects: true
    max-redirects: 2

    matchers-condition: and
    matchers:
      - type: word
        part: body
        words:
          - "Install ESPEasy"

      - type: status
        status:
          - 200
