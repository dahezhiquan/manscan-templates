id: ec2-unrestricted-ftp
info:
  name: EC2 安全组对公网开放 FTP 端口（云安全）
  author: princechaddha
  severity: critical
  description: EC2 安全组对公网开放 FTP 端口是一类明文文件传输服务暴露风险，端口 20/21 面向互联网会增加凭据泄露、爆破和未授权文件访问风险。FTP 缺少默认传输加密，通常应被 SFTP、FTPS 或受控传输通道替代。模板通过 `describe-security-groups` 筛选 20/21 端口且来源为 `0.0.0.0/0` 的入站规则，并输出命中的安全组 ID。
  impact: |
    - FTP 凭据和文件内容可能以明文传输，被中间网络窃听或篡改。
    - 暴露的 FTP 服务可能被爆破、匿名访问或利用服务端漏洞获取文件系统访问。
  remediation: |
    - 移除面向公网的 20/21 端口入站规则，停止直接暴露 FTP 服务。
    - 使用 SFTP、FTPS 或私有网络传输方案，并限制来源 IP 和账号权限。
  reference:
    - https://docs.aws.amazon.com/AWSEC2/latest/UserGuide/using-network-security.html#security-group-rules
  metadata:
    vendor: amazon
    product: ec2
  tags: cloud,devops,aws,amazon,ec2,aws-cloud-config

variables:
  region: "us-east-1"

self-contained: true
code:
  - engine:
      - sh
      - bash
    source: |
      aws ec2 describe-security-groups --region $region --filters Name=ip-permission.from-port,Values=20,21 Name=ip-permission.to-port,Values=20,21 Name=ip-permission.cidr,Values='0.0.0.0/0' --output json --query 'SecurityGroups[*].GroupId'

    extractors:
      - type: json
        name: securitygroup
        internal: true
        json:
          - '.[]'

      - type: dsl
        dsl:
          - 'securitygroup + " security group(s) alows unrestricted access (0.0.0.0/0 or ::/0) on TCP port 20 or 21"'
