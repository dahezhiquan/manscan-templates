id: aem-login-status

info:
  name: AEM 登录 状态
  author: DhiyaneshDk
  severity: low
  description: |
    该模板用于核查 AEM 登录 状态相关配置。该类问题通常源于生产环境暴露调试页面、诊断端点、状态接口或详细错误信息。模板会向目标发送探测请求，并依据请求 `/system/sling/loginstatus`、`/system/sling/loginstatus.css`、匹配 `CREDENTIAL_CHALLENGE`、状态码 200 等证据确认目标是否存在该配置问题。
  impact: |
    - 攻击者可获取服务版本、运行状态、内部路径、模块列表、环境变量或错误栈信息。
    - 这些信息可辅助识别组件版本、构造后续攻击路径，或暴露内部系统结构与敏感配置线索。
  remediation: |
    - 关闭生产环境中的调试、状态、示例和诊断接口，避免向未授权用户返回内部细节。
    - 对确需保留的运维端点增加认证授权、来源限制和访问审计。
    - 检查历史访问日志和错误日志，确认敏感信息是否已被枚举或泄露。
  reference:
    - https://www.slideshare.net/0ang3el/hunting-for-security-bugs-in-aem-webapps-129262212
    - https://github.com/thomashartm/burp-aem-scanner/blob/master/src/main/java/burp/actions/dispatcher/LoginStatusServletExposed.java
  classification:
    cpe: cpe:2.3:a:adobe:experience_manager:*:*:*:*:*:*:*:*
  metadata:
    max-request: 3
    vendor: adobe
    product: experience_manager
    shodan-query: http.component:"Adobe Experience Manager"
  tags: aem,adobe,misconfig,vuln

http:
  - method: GET
    path:
      - '{{BaseURL}}/system/sling/loginstatus'
      - '{{BaseURL}}/system/sling/loginstatus.css'
      - '{{BaseURL}}///system///sling///loginstatus'

    stop-at-first-match: true

    matchers-condition: and
    matchers:
      - type: status
        status:
          - 200

      - type: word
        words:
          - 'CREDENTIAL_CHALLENGE'
