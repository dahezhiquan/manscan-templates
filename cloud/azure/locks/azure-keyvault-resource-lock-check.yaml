id: azure-keyvault-resource-lock-check
info:
  name: Azure Key Vault 未配置必要资源锁（云安全）
  author: princechaddha
  severity: high
  description: Azure Resource Manager 资源锁可以阻止 Key Vault 被意外删除或修改，且锁的约束优先于普通用户权限。本模板遍历 Key Vault 资源并查询 az lock list，在返回空列表或匹配 CanNotDelete、ReadOnly 等锁级别关键字时按现有逻辑报告资源锁配置异常。
  impact: |
    - 没有合适的删除锁时，误操作或被盗用的管理权限可能直接删除 Key Vault，造成密钥、证书和机密不可用。
    - 过度宽松或错误的锁级别会削弱基础设施保护；ReadOnly 还可能阻断正常的密钥轮换、网络策略和权限更新。
  remediation: |
    - 对生产 Key Vault 至少配置 CanNotDelete 锁，并根据变更流程评估是否需要临时使用 ReadOnly。
    - 将锁的创建、删除和变更纳入受控审批与告警，定期确认锁作用域覆盖正确资源且不影响必要运维操作。
  reference:
    - https://docs.microsoft.com/en-us/azure/azure-resource-manager/management/lock-resources
  metadata:
    vendor: microsoft
    product: azure-resource-lock
  tags: cloud,devops,azure,microsoft,keyvault,azure-cloud-config

flow: |
  code(1);
  for (let keyVaultData of iterate(template.keyvaultdata)) {
    keyVaultData = JSON.parse(keyVaultData)
    set("resource", keyVaultData.id)
    code(2)
  }

self-contained: true
code:
  - engine:
      - sh
      - bash
    source: |
      az keyvault list --query '[*].id' --output json

    extractors:
      - type: json
        name: keyvaultdata
        internal: true
        json:
          - '.[]'

  - engine:
      - sh
      - bash
    source: |
      az lock list --resource $resource --query '[*].{"name":name,"level":level}'

    matchers:
      - type: word
        words:
          - '"CanNotDelete"'
          - '"ReadOnly"'

      - type: word
        words:
          - '[]'

    extractors:
      - type: dsl
        dsl:
          - 'resource + " does not have the required resource lock level"'
