id: elfinder-detect

info:
  name: elFinder - Install 指纹识别（指纹识别）
  author: pikpikcu
  severity: info
  description: 用于识别目标是否使用 elFinder - Install，模板会结合页面正文、状态码和特定路径或已知端点进行技术指纹匹配。
  classification:
    cvss-metrics: CVSS:3.0/AV:N/AC:L/PR:N/UI:N/S:U/C:N/I:N/A:N
    cvss-score: 0
    cwe-id: CWE-200
  metadata:
    max-request: 2
  tags: tech,elfinder,discovery

http:
  - method: GET
    path:
      - "{{BaseURL}}"
      - "{{BaseURL}}/elfinder.html"

    stop-at-first-match: true

    matchers-condition: and
    matchers:
      - type: word
        part: body
        words:
          - "<!-- Element where elFinder will be created (REQUIRED) -->"

      - type: status
        status:
          - 200
