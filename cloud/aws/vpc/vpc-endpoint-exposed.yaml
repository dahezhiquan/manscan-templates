id: vpc-endpoint-exposed
info:
  name: VPC Endpoint Policy 允许公共主体访问（云安全）
  author: princechaddha
  severity: medium
  description: VPC Endpoint policy 中 Principal 或 AWS 为 * 且缺少 Condition 约束时，可能允许过宽主体经 endpoint 访问后端 AWS 服务。该模板枚举 VPC endpoint，并检查 PolicyDocument 是否包含公共主体且不包含 Condition。
  impact: |
    - 不必要的主体可能通过 endpoint 访问 S3、DynamoDB 或其他服务资源，绕过预期网络边界。
    - Endpoint policy 过宽会削弱私有访问通道的最小权限控制。
  remediation: |
    - 将 VPC Endpoint policy 限制到明确的 principal、action 和 resource。
    - 对跨账号或组织访问添加 aws:PrincipalOrgID、aws:SourceVpce 等条件，并定期审计 endpoint policy。
  reference:
    - https://docs.aws.amazon.com/vpc/latest/userguide/vpc-endpoints-access.html
  metadata:
    max-request: 2
    vendor: amazon
    product: vpc
  tags: cloud,devops,aws,amazon,vpc,aws-cloud-config
variables:
  region: "us-east-1"

flow: |
  code(1)
  for(let VpcIds of iterate(template.VpcId)){
    set("vpc", VpcIds)
    code(2)
  }

self-contained: true
code:
  - engine:
      - sh
      - bash
    source: |
      aws ec2 describe-vpc-endpoints --region $region --output table --query 'VpcEndpoints[*].VpcEndpointId' --output json

    extractors:
      - type: json
        name: VpcId
        internal: true
        json:
          - '.[]'

  - engine:
      - sh
      - bash
    source: |
         aws ec2 describe-vpc-endpoints --region $region --vpc-endpoint-ids $vpc --query 'VpcEndpoints[*].PolicyDocument' --output json

    matchers-condition: and
    matchers:
      - type: word
        words:
          - '"AWS": "*"'
          - '"Principal": "*"'

      - type: word
        words:
          - "Condition"
        negative: true

    extractors:
      - type: dsl
        dsl:
          - '"VPC endpoints for " + vpc + "are exposed."'
