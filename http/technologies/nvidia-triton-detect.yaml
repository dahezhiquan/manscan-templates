id: nvidia-triton-detect

info:
  name: NVIDIA Triton Inference Server 指纹识别（指纹识别）
  author: mailler0xa
  severity: info
  description: >-
    NVIDIA Triton Inference Server 是模型推理服务平台，用于部署和服务深度学习、机器学习模型。该模板通过请求目标服务并检查预设路径或首页响应、页面正文关键字、状态码等指纹特征，判断目标是否使用或暴露了
    NVIDIA Triton Inference Server 相关组件；命中结果仅表示指纹特征匹配，可用于资产盘点、技术栈识别和后续安全评估，不代表已确认存在可利用漏洞。
  reference:
  - https://github.com/triton-inference-server/server
  metadata:
    verified: true
    max-request: 1
    vendor: nvidia
    product: triton
  tags: oss,nvidia,triton,tech,discovery
http:
  - method: GET
    path:
      - "{{BaseURL}}/v2"

    matchers-condition: and
    matchers:
      - type: word
        words:
          - "{\"name\":\"triton\","
          - "\"extensions\""
        condition: and

      - type: status
        status:
          - 200

    extractors:
      - type: json
        part: body
        json:
          - ".version"
