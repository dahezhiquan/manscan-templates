id: laravel-pulse-unauth

info:
  name: Laravel Pulse 未授权 仪表盘 访问
  author: moamenbasel
  severity: medium
  description: |
    检测到 Laravel Pulse 未授权 仪表盘 访问。目标功能在未认证状态下可访问，可能暴露管理入口、业务数据、系统状态或可执行操作，需确认是否存在访问控制缺失。
  remediation: |
    - 为相关管理界面和 API 启用强认证、授权校验和最小权限控制。
    - 将后台端点限制在可信网络或 VPN 内，并记录访问审计日志。
  reference:
    - https://laravel.com/docs/11.x/pulse#dashboard-authorization
    - https://owasp.org/Top10/A01_2021-Broken_Access_Control/
  classification:
    cvss-metrics: CVSS:3.1/AV:N/AC:L/PR:N/UI:N/S:U/C:L/I:N/A:N
    cvss-score: 5.3
    cwe-id: CWE-306
  metadata:
    verified: true
    max-request: 1
    shodan-query: html:"Laravel Pulse"
  tags: laravel,pulse,monitoring,misconfig,unauth

http:
  - method: GET
    path:
      - "{{BaseURL}}/pulse"

    host-redirects: true
    max-redirects: 2

    matchers-condition: and
    matchers:
      - type: word
        part: body
        words:
          - "Laravel Pulse"
          - "livewire"
        condition: and

      - type: status
        status:
          - 200
