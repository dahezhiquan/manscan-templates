id: microsoft-ftp-service

info:
  name: Microsoft FTP 服务 识别（指纹识别）
  author: pussycat0x
  severity: info
  description: |
    该模板通过网络响应特征识别目标是否开放 Microsoft FTP Service 相关服务。
  metadata:
    verified: true
    max-request: 1
    shodan-query: Microsoft FTP Service
  tags: network,ftp,microsoft,detect,detection,tcp,discovery
tcp:

  - inputs:
      - data: "\n"
    host:
      - "{{Hostname}}"
    port: 21

    matchers:
      - type: word
        words:
          - "Microsoft FTP Service"
