id: wp-easy-google-fonts-log-disclosure

info:
  name: WordPress Easy Google Fonts Error Log 泄露（暴露面识别）
  author: 0x_Akoko
  severity: low
  description: |
    检测到可直接访问的 WordPress Easy Google Fonts Error Log。日志、异常页面或调试输出通常会泄露堆栈信息、内部路径、查询语句、账号标识、令牌片段或业务数据，不应向未授权用户开放。
  reference:
    - https://wordpress.org/plugins/easy-google-fonts/
  metadata:
    verified: true
    max-request: 1
  tags: wordpress,wp-plugin,exposure,easy-google-fonts,logs

http:
  - method: GET
    path:
      - "{{BaseURL}}/wp-content/plugins/easy-google-fonts/error_log"

    matchers:
      - type: dsl
        dsl:
          - 'status_code == 200'
          - 'regex("\\[\\d{2}-[A-Za-z]{3}-\\d{4} \\d{2}:\\d{2}:\\d{2}", body)'
          - 'contains_any(body, "PHP Fatal error:", "PHP Warning:", "PHP Notice:", "PHP Parse error:")'
        condition: and
