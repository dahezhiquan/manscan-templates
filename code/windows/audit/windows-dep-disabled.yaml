id: windows-dep-disabled

info:
  name: 数据执行保护 DEP 未启用（本地基线扫描）
  author: princechaddha
  severity: high
  description: |
    该模板检查 Data Execution Prevention（DEP）是否未对所有程序启用。DEP 可缓解内存执行类攻击。
  impact: |
    禁用 DEP 会增加缓冲区溢出等内存漏洞被利用的成功率。
  remediation: |
    为所有程序启用 DEP，并结合 ASLR 等缓解机制。
  tags: windows,security,dep,code,windows-audit

self-contained: true

code:
  - pre-condition: |
      IsWindows();
    engine:
      - powershell.exe
    args:
      - -ExecutionPolicy
      - Bypass
    pattern: "*.ps1"
    source: |
      $EnableDEP = (Get-ItemProperty -Path 'HKLM:\SYSTEM\CurrentControlSet\Control\Session Manager\Memory Management' -Name 'EnableDEP' -ErrorAction SilentlyContinue).EnableDEP
      if ($EnableDEP -ne 2) {
        Write-Output 'DEP not fully enabled'
      }

    matchers:
      - type: word
        words:
          - "DEP not fully enabled"
