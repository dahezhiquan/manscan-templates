id: file-limit-ssh-group

info:
  name: SSH 登录组访问未限制（本地文件安全扫描）
  author: pussycat0x
  severity: medium
  description: |
    该模板检查 SSH 是否仅允许授权用户组登录。限制组访问可减少远程登录攻击面。
  remediation: |
    在 /etc/ssh/sshd_config 中配置 AllowGroups 或 AllowUsers，仅保留必要对象，并重启 SSH 服务。
  reference:
    - https://vishalraj82.medium.com/hardening-openssh-security-37f5d634015f
    - https://cloud.ibm.com/docs/ssh-keys?topic=ssh-keys-granting-ssh-access-to-a-user
  metadata:
    verified: true
  tags: audit,config,file,ssh

file:
  - extensions:
      - all

    matchers-condition: and
    matchers:
      - type: word
        words:
          - "# This is the sshd server system-wide configuration file"

      - type: word
        words:
          - "AllowGroups"
        negative: true
