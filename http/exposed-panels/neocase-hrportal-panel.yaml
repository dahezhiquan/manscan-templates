id: neocase-hrportal-panel

info:
  name: Neocase HR Portal 登录面板识别（指纹识别）
  author: righettod
  severity: info
  description: |-
    检测到目标站点存在 Neocase HR Portal 相关响应特征。Neocase HR Portal 是 AI、机器学习或 Notebook 相关平台，用于管理模型、数据集、工作区、实验、推理服务或训练任务。模板请求 `/`，并通过页面标题或正文关键字、状态码、DSL 条件确认该系统指纹，用于资产识别、系统盘点和暴露面梳理。
  reference:
    - https://www.neocasesoftware.com/neocase-hr-solution/
    - https://www.neocasesoftware.com/self-service-portal-module/
  metadata:
    verified: true
    max-request: 1
  tags: panel,neocase,login,detect,discovery
http:
  - method: GET
    path:
      - "{{BaseURL}}"

    matchers:
      - type: dsl
        dsl:
          - 'status_code == 200'
          - 'contains(to_lower(body), "neocase") && contains(to_lower(body), "hr portal") && contains(to_lower(body), "login")'
        condition: and

    extractors:
      - type: regex
        part: body
        group: 1
        regex:
          - 'name="version"\s+content="([0-9\.]+)"'
