id: liveview-axis-camera

info:
  name: AXIS 网络摄像机实时画面识别（IOT）
  author: dhiyaneshDK,f1she3
  severity: medium
  description: |
    检测到 AXIS 网络摄像机实时画面页面。该页面暴露可能导致摄像头画面或监控环境信息被未授权访问。
  impact: |
    - 攻击者无需认证即可访问设备页面或功能，可能读取状态、配置和网络信息。
    - 若接口允许写操作，可能进一步导致设备配置被篡改或服务被滥用。
  remediation: |
    - 启用设备 Web 管理认证并修改默认口令，关闭匿名访问。
    - 升级固件并检查是否存在已知未授权访问漏洞。
    - 将管理页面限制在内网、管理 VLAN 或 VPN 内，并开启访问审计。
  reference:
    - https://www.exploit-db.com/ghdb/6843
  classification:
    cvss-metrics: CVSS:3.1/AV:N/AC:L/PR:N/UI:N/S:U/C:N/I:N/A:N
    cvss-score: 0
    cwe-id: CWE-200
  metadata:
    max-request: 2
  tags: axis,edb,iot,discovery

http:
  - method: GET
    path:
      - '{{BaseURL}}/view/viewer_index.shtml'
      - '{{BaseURL}}/pics/logo_70x29px.gif'

    host-redirects: true
    max-redirects: 2
    stop-at-first-match: true

    matchers-condition: or
    matchers:
      - type: dsl
        name: stream-view
        dsl:
          - 'contains(tolower(body), "live view  - axis")'
          - 'contains(tolower(body), "live view - axis")'
        condition: or

      - type: dsl
        name: logo
        dsl:
          - 'status_code == 200'
          - '"1106649083" == mmh3(base64_py(body))'
        condition: and

    extractors:
      - type: regex
        part: body
        group: 1
        regex:
          - 'AXIS (.*) Network Camera</title>'
