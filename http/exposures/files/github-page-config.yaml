id: github-page-config

info:
  name: Github 页面 配置 文件泄露（暴露面识别）
  author: hahwul
  severity: info
  description: 检测到对外可访问的 Github 页面 配置 文件。相关文件可能泄露项目结构、依赖关系、部署细节、敏感参数或其他不应公开的内部信息。
  metadata:
    max-request: 1
  tags: github,exposure,config,files,vuln

http:
  - method: GET
    path:
      - "{{BaseURL}}/_config.yml"

    matchers-condition: and
    matchers:
      - type: status
        status:
          - 200

      - type: word
        words:
          - "jekyll"
          - "title"
          - "baseurl"
        condition: and
