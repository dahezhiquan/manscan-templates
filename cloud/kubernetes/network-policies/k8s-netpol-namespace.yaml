id: k8s-netpol-namespace

info:
  name: Network 策略 specify namespace（云安全）
  author: princechaddha
  severity: medium
  description: NetworkPolicy 应明确绑定到目标命名空间，避免策略归属不清或覆盖范围与预期不一致。本模板枚举所有 NetworkPolicy，并输出其 metadata.namespace 用于识别未按命名空间治理的策略。
  impact: |
    - 策略可能没有覆盖预期业务边界，导致命名空间间访问控制不一致。
    - 网络隔离审计时难以判断策略归属和业务责任人。
  remediation: |
    - 按业务和环境拆分命名空间，并在每个命名空间维护对应的 NetworkPolicy 基线。
    - 为策略添加命名空间、应用和责任人标签，持续审计策略覆盖范围。
  reference:
    - https://kubernetes.io/docs/concepts/services-networking/network-policies/
  metadata:
    vendor: kubernetes
    product: kubernetes
  tags: cloud,devops,kubernetes,devsecops,k8s-cluster-security
flow: |
  code(1);
  for (let policy of template.items) {
    set("policy", policy)
    javascript(1);
  }

self-contained: true
code:
  - engine:
      - sh
      - bash
    source: kubectl get netpol --all-namespaces --output=json
    extractors:
      - type: json
        name: items
        internal: true
        json:
          - '.items[] | {policy: .metadata.name, namespace: .metadata.namespace}'

javascript:
  - code: |
        let policyData = JSON.parse(template.policy);
        if (!policyData.namespace) {
          let result = (`Network Policy '${policyData.policy}' does not specify a namespace.`);
          Export(result);
        }

    extractors:
      - type: dsl
        dsl:
          - response
