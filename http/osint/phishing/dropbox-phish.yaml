id: dropbox-phish

info:
  name: Dropbox 仿冒钓鱼网站（钓鱼网站识别）
  author: rxerium
  severity: info
  description: |
    检测到疑似仿冒 Dropbox 的钓鱼网站。模板在目标页面返回 200、页面内容命中 Dropbox 的品牌页面特征，且当前主机不属于 dropbox.com 官方域名时触发，用于识别借用 Dropbox 品牌页面诱导用户信任的仿冒站点。
  reference:
    - https://dropbox.com
  metadata:
    max-request: 1
  tags: phishing,dropbox,osint,discovery
http:
  - method: GET
    path:
      - "{{BaseURL}}"

    host-redirects: true
    max-redirects: 2

    matchers-condition: and
    matchers:
      - type: word
        words:
          - 'Dropbox is a home for all of your work. You can store and share files, collaborate on projects and bring your best ideas to life, whether you’re working alone or as part of a team.'

      - type: status
        status:
          - 200

      - type: dsl
        dsl:
          - '!contains(host,"dropbox.com")'
