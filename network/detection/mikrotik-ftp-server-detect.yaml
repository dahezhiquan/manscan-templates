id: mikrotik-ftp-server-detect

info:
  name: MikroTik FTP server 识别（服务漏洞）
  author: pussycat0x
  severity: info
  description: |
    该模板通过网络响应特征识别目标是否开放 MikroTik FTP server 相关服务。
  metadata:
    verified: true
    max-request: 1
    shodan-query: product:"MikroTik router ftpd"
  tags: network,ftp,mikrotik,router,detect,detection,tcp,discovery
tcp:
  - inputs:
      - data: "\n"
    host:
      - "{{Hostname}}"
    port: 21

    matchers:
      - type: word
        part: body
        words:
          - "MikroTik FTP"

    extractors:
      - type: regex
        regex:
          - "MikroTik ([0-9.]+)"
