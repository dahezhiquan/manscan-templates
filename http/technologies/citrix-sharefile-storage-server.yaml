id: citrix-sharefile-storage-server

info:
  name: ShareFile Storage 服务器 指纹识别（指纹识别）
  author: DhiyaneshDK
  severity: info
  description: ShareFile Storage 服务器 是 Citrix ShareFile 存储服务器，用于企业文件同步、共享和安全存储。该模板请求首页，并依据 HTTP 200 状态码、页面标题、正文关键字或品牌资源特征识别目标是否使用或暴露了 ShareFile Storage 服务器 相关组件，适用于资产盘点、技术栈识别和后续安全评估；命中结果仅表示指纹特征匹配，不代表已确认存在可利用漏洞。
  classification:
    cpe: cpe:2.3:a:citrix:sharefile_storage_zones_controller:*:*:*:*:*:*:*:*
  metadata:
    verified: true
    max-request: 1
    vendor: citrix
    product: sharefile_storage_zones_controller
    shodan-query: title:"ShareFile Storage Server"
  tags: tech,citrix,sharefile,discovery

http:
  - method: GET
    path:
      - "{{BaseURL}}"

    host-redirects: true
    max-redirects: 2

    matchers-condition: and
    matchers:
      - type: word
        part: body
        words:
          - "ShareFile Storage Server"

      - type: status
        status:
          - 200
