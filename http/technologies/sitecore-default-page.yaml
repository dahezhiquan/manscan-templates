id: sitecore-default-page

info:
  name: Sitecore 默认页面 指纹识别（指纹识别）
  author: DhiyaneshDK,RandomDhiraj
  severity: info
  description: >-
    Sitecore 默认页面通常表示 Sitecore 内容管理平台已部署并保留默认站点入口。该模板通过请求目标服务并检查预设路径或首页响应、页面正文关键字、状态码等指纹特征，判断目标是否使用或暴露了
    Sitecore 默认页面 相关组件；命中结果仅表示指纹特征匹配，可用于资产盘点、技术栈识别和后续安全评估，不代表已确认存在可利用漏洞。
  reference:
  - https://www.sitecore.com/
  classification:
    cpe: cpe:2.3:a:sitecore:experience_platform:*:*:*:*:*:*:*:*
  metadata:
    verified: true
    max-request: 1
    vendor: sitecore
    product: experience_platform
    shodan-query: http.title:"Welcome to Sitecore"
  tags: tech,sitecore,cms,discovery
http:
  - method: GET
    path:
      - '{{BaseURL}}'

    matchers-condition: and
    matchers:
      - type: word
        words:
          - "Welcome to Sitecore"
          - 'alt="Sitecore"'
        condition: or

      - type: status
        status:
          - 200
