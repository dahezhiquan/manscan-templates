id: gcloud-vertexai-idle-shutdown

info:
  name: Idle Shutdown 未Enabled 的Vertex AI Notebooks（云安全）
  author: princechaddha
  severity: medium
  description: Vertex AI notebook 未配置 idle shutdown 时，空闲实例会持续运行并保留访问入口、凭据和运行中资源。本模板检查 gceSetup.metadata.idle-timeout-seconds，返回 null 时报告未启用空闲自动关闭。
  impact: |
    - 无人使用的 Notebook 仍可能被滥用进行数据访问、算力消耗或持久化操作。
    - 长期开机增加成本，并扩大未维护环境的暴露窗口。
  remediation: |
    - 配置 idle-timeout-seconds 或等效空闲关闭策略，自动停止长时间未使用的 notebook。
    - 对需要长时间运行的任务使用受控作业环境，并记录例外与负责人。
  reference:
    - https://www.trendmicro.com/cloudoneconformity/knowledge-base/gcp/VertexAI/enable-idle-shutdown.html
    - https://cloud.google.com/vertex-ai/docs/workbench/user-managed/manage-instance
  metadata:
    vendor: google
    product: vertex-ai
  tags: cloud,devops,gcp,gcloud,vertexai,cost-optimization,gcp-cloud-config,ai

flow: |
  code(1)
  for(let projectId of iterate(template.projectIds)){
    set("projectId", projectId)
    code(2)
  }

self-contained: true

code:
  - engine:
      - sh
      - bash
    source: |
      gcloud projects list --format="json(projectId)"

    extractors:
      - type: json
        name: projectIds
        internal: true
        json:
          - '.[].projectId'

  - engine:
      - sh
      - bash
    source: |
      gcloud workbench instances describe tm-vertex-ai-notebook-instance --location=us-central1-a --project=$projectId --format="yaml(gceSetup.metadata.idle-timeout-seconds)"

    matchers:
      - type: word
        words:
          - "null"

    extractors:
      - type: dsl
        dsl:
          - '"Project " + projectId + " has Vertex AI notebook instances without idle shutdown enabled"'
