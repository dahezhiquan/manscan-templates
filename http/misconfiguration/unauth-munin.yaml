id: unauth-munin

info:
  name: Munin Monitoring 仪表盘 暴露
  author: 0x_Akoko
  severity: medium
  description: |
    检测到 Munin Monitoring 仪表盘 暴露。目标功能在未认证状态下可访问，可能暴露管理入口、业务数据、系统状态或可执行操作，需确认是否存在访问控制缺失。
  reference:
    - https://munin-monitoring.org/
  metadata:
    verified: true
    max-request: 2
    shodan-query: http.title:"Munin"
    fofa-query: title="Munin"
  tags: exposure,munin,monitoring,misconfig,vuln

http:
  - method: GET
    path:
      - "{{BaseURL}}"
      - "{{BaseURL}}/munin/"

    stop-at-first-match: true

    matchers:
      - type: dsl
        dsl:
          - 'status_code == 200'
          - 'contains(tolower(body), "<title>Munin")'
          - 'contains_all(body, "Munin", "Overview", "munin-monitoring")'
        condition: and
