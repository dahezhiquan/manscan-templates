id: algonomia-panel

info:
  name: Algonomia Leaf Platform 面板识别（指纹识别）
  author: righettod
  severity: info
  description: |-
    检测到目标站点存在 Algonomia Leaf Platform 相关响应特征。Algonomia Leaf Platform 是一套通过 Web 提供访问的管理面板或业务系统，通常用于配置服务、查看状态、管理数据或执行日常运维操作。模板请求 `/assets/i18n/en.json`，并通过页面标题或正文关键字、状态码、DSL 条件确认该系统指纹，用于资产识别、系统盘点和暴露面梳理。
  reference:
    - https://algonomia.com/
  metadata:
    verified: true
    max-request: 1
  tags: tech,algonomia,detect,panel,discovery
http:
  - method: GET
    path:
      - "{{BaseURL}}/assets/i18n/en.json"

    matchers:
      - type: dsl
        dsl:
          - 'status_code == 200'
          - 'contains(to_lower(body), "logincomponent\":")'
          - 'contains_any(to_lower(body), "leafplatform", "leaf platform")'
          - 'contains(header, "application/json")'
        condition: and
