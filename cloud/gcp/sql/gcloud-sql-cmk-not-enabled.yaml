id: gcloud-sql-cmk-not-enabled

info:
  name: Cloud SQL Instance 加密 使用Customer-Managed Keys未启用（云安全）
  author: princechaddha
  severity: high
  description: Cloud SQL 未使用客户管理密钥时，实例磁盘由 Google 默认密钥加密，组织无法自行控制密钥生命周期。本模板检查 diskEncryptionConfiguration.kmsKeyName，返回 null 时报告实例未启用 CMK/CMEK。
  impact: |
    - 组织无法自主执行数据库加密密钥的轮换、禁用、销毁和访问审计。
    - 对需要客户托管密钥的监管、合同或敏感数据场景，默认加密可能不满足治理要求。
  remediation: |
    - 为新建 Cloud SQL 实例配置 CMEK，并授予 Cloud SQL 服务代理使用对应 KMS key 的权限。
    - 对既有实例评估迁移或重建方案，建立密钥轮换、禁用影响评估和访问审计流程。
  reference:
    - https://cloud.google.com/sql/docs/mysql/configure-cmek
  metadata:
    vendor: google
    product: cloud-sql
  tags: cloud,devops,gcp,gcloud,google-cloud-sql,gcp-cloud-config

flow: |
  code(1)
  for(let projectId of iterate(template.projectIds)){
    set("projectId", projectId)
    code(2)
    for(let sqlInstance of iterate(template.sqlInstances)){
      set("sqlInstance", sqlInstance)
      code(3)
    }
  }

self-contained: true

code:
  - engine:
      - sh
      - bash
    source: |
      gcloud projects list --format="json(projectId)"

    extractors:
      - type: json
        name: projectIds
        internal: true
        json:
          - '.[].projectId'

  - engine:
      - sh
      - bash
    source: |
      gcloud sql instances list --project $projectId --format="json(name)"

    extractors:
      - type: json
        name: sqlInstances
        internal: true
        json:
          - '.[].name'

  - engine:
      - sh
      - bash
    source: |
      gcloud sql instances describe $sqlInstance --format="json(diskEncryptionConfiguration.kmsKeyName)"

    matchers:
      - type: word
        words:
          - 'null'

    extractors:
      - type: dsl
        dsl:
          - '"Cloud SQL instance " + sqlInstance + " in project " + projectId + " is not encrypted with a Customer-Managed Key (CMK)"'
