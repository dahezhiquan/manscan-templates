id: gcloud-org-shared-vpc-subnets

info:
  name: Shared VPC Subnetworks 未Restricted（云安全）
  author: princechaddha
  severity: medium
  description: Shared VPC subnetworks 未受限制时，服务项目资源可能连接到任意共享子网，破坏预期网络分区。本模板检查 compute.restrictSharedVpcSubnetworks 组织策略 listPolicy.allValues，值为 ALLOW 时报告共享 VPC 子网未受限制。
  impact: |
    - 工作负载可能接入不匹配的安全域或路由环境，增加横向访问和数据流向失控风险。
    - 未限制共享子网会让网络团队难以执行集中分段、IP 管理和访问策略。
  remediation: |
    - 配置 compute.restrictSharedVpcSubnetworks，仅允许使用经批准的 Shared VPC subnetworks。
    - 按环境、业务和敏感级别划分共享子网，并定期复核服务项目关联关系。
  reference:
    - https://www.trendmicro.com/cloudoneconformity/knowledge-base/gcp/ResourceManager/restrict-shared-vps-subnetworks.html
    - https://cloud.google.com/vpc/docs/shared-vpc
  metadata:
    vendor: google
    product: resource-manager
  tags: cloud,devops,gcp,gcloud,resourcemanager,security,networking,vpc,gcp-cloud-config

flow: |
  code(1)
  for(let orgId of iterate(template.orgIds)){
    set("orgId", orgId)
    code(2)
  }

self-contained: true

code:
  - engine:
      - sh
      - bash
    source: |
      gcloud organizations list --format="json(name)"

    extractors:
      - type: json
        name: orgIds
        internal: true
        json:
          - '.[].name'

  - engine:
      - sh
      - bash
    source: |
      gcloud alpha resource-manager org-policies describe compute.restrictSharedVpcSubnetworks --organization=$orgId --effective --format="json(listPolicy.allValues)"

    matchers:
      - type: word
        words:
          - "ALLOW"

    extractors:
      - type: dsl
        dsl:
          - '"Organization " + orgId + " has not restricted shared VPC subnetworks, allowing resources to use any shared subnet"'
