id: lollms-webui-detect

info:
  name: LoLLMS WebUI 指纹识别（指纹识别）
  author: s4e-io
  severity: info
  description: >-
    LoLLMS WebUI 是本地大语言模型管理和交互界面，用于加载模型、运行提示和管理 AI 工作流。该模板通过请求目标服务并检查预设路径或首页响应、DSL
    条件等指纹特征，判断目标是否使用或暴露了 LoLLMS WebUI 相关组件；命中结果仅表示指纹特征匹配，可用于资产盘点、技术栈识别和后续安全评估，不代表已确认存在可利用漏洞。
  reference:
  - https://github.com/ParisNeo/lollms-webui
  - https://lollms.com
  metadata:
    verified: true
    max-request: 1
    fofa-query: "LoLLMS WebUI - Welcome"
  tags: lollms-webui,tech,detect,discovery,ai
http:
  - method: GET
    path:
      - "{{BaseURL}}"

    host-redirects: true
    matchers:
      - type: dsl
        dsl:
          - 'contains(body, "LoLLMS WebUI - Welcome")'
          - 'status_code == 200'
        condition: and
