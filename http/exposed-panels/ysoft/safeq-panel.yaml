id: safeq-panel

info:
  name: YSoft SafeQ 登录面板识别（指纹识别）
  author: matejsmycka
  severity: info
  description: |-
    YSoft SafeQ 是打印管理与文印安全平台，用于打印队列、身份认证、配额和审计管理。该模板请求首页、`/login`，并依据 HTTP 200 状态码、页面标题、正文关键字或品牌资源特征识别目标是否部署了该系统或暴露了对应入口，适用于资产指纹确认；命中结果仅表示系统特征匹配，不代表已确认存在未授权访问或可利用漏洞。
  reference:
  - https://www.ysoft.com/safeq
  - https://1617882505.rsc.cdn77.org/YSoft_SAFEQ_Cloud_documentation.pdf
  metadata:
    shodan-query:
    - title:"YSoft SafeQ"
    - title:"SafeQ&reg;"
    - http.favicon.hash:-608698287
    - http.favicon.hash:93381563
    fofa-query:
    - title="YSoft SafeQ"
    - title="SafeQ&reg;"
    - icon_hash="-608698287"
    - icon_hash="93381563"
  tags: panel,ysoft,login,safeq,detect,discovery

http:
  - method: GET
    path:
      - "{{BaseURL}}"
      - "{{BaseURL}}/login"

    stop-at-first-match: true
    host-redirects: true
    max-redirects: 2

    matchers-condition: and
    matchers:
      - type: word
        part: body
        words:
          - "YSoft SafeQ"
          - "Y Soft Corporation, a.s."
        condition: or

      - type: status
        status:
          - 200

    extractors:
      - type: regex
        part: body
        name: version
        group: 1
        regex:
          - 'YSoft (?:SafeQ|Framework) v?([0-9\.]+)'
