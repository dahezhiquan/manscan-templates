id: etc-services-permission-check

info:
  name: /etc/services 权限异常（本地基线扫描）
  author: songyaeji
  severity: high
  description: |
    该模板检查 /etc/services 的属主和权限。若该文件不归 root 所有或权限过宽，攻击者可能篡改端口与服务名称映射，干扰审计和运维判断。
  reference:
    - https://isms.kisa.or.kr
  tags: linux,code,audit,compliance,local

self-contained: true

code:
  - engine:
      - sh
      - bash
    source: |
      stat -c "%U %G %a" /etc/services 2>/dev/null || echo "not-found"

    matchers:
      - type: regex
        part: response
        regex:
          - '^root\s+root\s+(600|640|644)$'
