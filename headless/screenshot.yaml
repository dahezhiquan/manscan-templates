id: screenshot

info:
  name: 页面截图采集（headless）
  author: V0idC0de,righettod,tarunKoyalwar
  severity: info
  description: |
    本模板使用 headless 浏览器访问目标页面，等待页面加载完成后保存完整页面截图到 `screenshots` 目录，便于资产识别、页面取证、视觉回归或人工复核；截图采集本身不代表发现漏洞。
  impact: |
    - 截图可能包含用户名、订单、令牌、内部地址或其他页面可见的敏感信息。
    - 若扫描产物目录被非授权人员读取，截图文件可能造成二次信息泄露；模板命中仅表示已生成采集结果。
  remediation: |
    - 对截图目录实施最小权限访问控制、加密存储和合理保留期限，扫描结束后清理不再需要的文件。
    - 在生产环境采集前确认已获得授权，并避免在包含敏感数据的会话中进行无必要的整页截图。
  tags: headless,screenshot,discovery

variables:
  filename: '{{replace(BaseURL,"/","_")}}'
  dir: "screenshots"

headless:
  - steps:
      - action: setheader
        args:
          part: request
          key: "User-Agent"
          value: "Mozilla/5.0 (Windows NT 10.0; Win64; x64; rv:111.0) Gecko/20100101 Firefox/111.0"

      - action: navigate
        args:
          url: "{{BaseURL}}"

      - action: waitload

      - action: screenshot
        args:
          fullpage: "true"
          mkdir: "true"
          to: "{{dir}}/{{filename}}"
