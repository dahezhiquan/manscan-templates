id: nimplant-c2

info:
  name: NimPlant C2 服务器指纹识别（指纹识别）
  author: ja1sh
  severity: info
  description: |
    用于识别目标前端或应用中是否使用 NimPlant C2 服务器，模板会结合 HTTP 响应头和特定路径或已知端点进行技术栈指纹匹配。
  reference:
    - https://github.com/chvancooten/NimPlant
  metadata:
    verified: true
    max-request: 1
    shodan-query: "nimplant C2 server"
  tags: tech,nimplant,c2,discovery

http:
  - method: GET
    path:
      - "{{BaseURL}}"

    matchers:
      - type: word
        part: header
        words:
          - "NimPlant C2 Server"
