id: rails-secret-token-disclosure

info:
  name: Ruby on Rails 密钥 令牌泄露（暴露面识别）
  author: dhiyaneshDk
  severity: medium
  description: 检测到对外可访问的 Ruby on Rails 密钥 令牌。相关文件可能泄露项目结构、依赖关系、部署细节、敏感参数或其他不应公开的内部信息。
  reference:
    - https://github.com/detectify/ugly-duckling/blob/master/modules/crowdsourced/ruby-on-rails-secret-token-disclosure.json
  metadata:
    max-request: 1
  tags: exposure,files,rails,ruby,token,vuln

http:
  - method: GET
    path:
      - "{{BaseURL}}/config/initializers/secret_token.rb"

    matchers-condition: and
    matchers:
      - type: word
        words:
          - "secret_key_base ="
          - "config.secret_token ="
        part: body
        condition: and

      - type: status
        status:
          - 200
