id: identity-google-iap-detect

info:
  name: Google Identity-Aware Proxy 指纹识别（指纹识别）
  author: davidfegyver
  severity: info
  description: >-
    Google Identity-Aware Proxy 是 Google Cloud 的身份感知访问代理，用于按用户身份保护 Web 应用和云资源入口。该模板通过请求目标服务并检查预设路径或首页响应、页面正文关键字、HTTP
    响应头、正则特征、DSL 条件等指纹特征，判断目标是否使用或暴露了 Google Identity-Aware Proxy 相关组件；命中结果仅表示指纹特征匹配，可用于资产盘点、技术栈识别和后续安全评估，不代表已确认存在可利用漏洞。
  reference:
  - https://cloud.google.com/iap/docs/concepts-overview
  - https://cloud.google.com/iap/docs/query-parameters-and-headers-howto#detecting_responses
  classification:
    cvss-metrics: CVSS:3.0/AV:N/AC:L/PR:N/UI:N/S:U/C:N/I:N/A:N
    cwe-id: CWE-200
  metadata:
    verified: true
    max-request: 2
    vendor: google
    product: identity-aware-proxy
    shodan-query: "X-Goog-Iap-Generated-Response"
    fofa-query: header="X-Goog-Iap-Generated-Response"
  tags: tech,google,iap,cloud,identity,proxy,discovery
flow: http(1) && http(2)

http:
  - method: GET
    path:
      - "{{BaseURL}}"

    redirects: true
    max-redirects: 3

    extractors:
      - type: regex
        part: body
        name: email
        internal: true
        regex:
          - "key:\\s*'ds:1'[^;]*data:\\s*\\[[^,]+,[^,]+,[^,]+,\\s*\"([^\"]+)\""
        group: 1

  - method: GET
    path:
      - "{{BaseURL}}"

    matchers:
      - type: word
        part: header
        words:
          - "X-Goog-Iap-Generated-Response"
        case-insensitive: true

    extractors:
      - type: dsl
        name: contact_email
        dsl:
          - "email"
