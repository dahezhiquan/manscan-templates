id: advance-auto-phish

info:
  name: Advance Auto Parts 仿冒钓鱼网站（钓鱼网站识别）
  author: rxerium
  severity: info
  description: |
    检测到疑似仿冒 Advance Auto Parts 的钓鱼网站。模板在目标页面返回 200、页面内容命中 Advance Auto Parts 的品牌页面特征，且当前主机不属于 advanceautoparts.com 官方域名时触发，用于识别借用 Advance Auto Parts 品牌页面诱导用户信任的仿冒站点。
  reference:
    - https://advanceautoparts.com
  metadata:
    max-request: 1
  tags: phishing,advance-auto,ecommerce,osint,discovery
http:
  - method: GET
    path:
      - "{{BaseURL}}"

    host-redirects: true
    max-redirects: 2

    matchers-condition: and
    matchers:
      - type: word
        words:
          - 'Advance Auto Parts: Car, Engine, Batteries, Brakes, Replacement, Performance &amp; Accessories'
          - 'Advance Auto '
        condition: and

      - type: status
        status:
          - 200

      - type: dsl
        dsl:
          - '!contains(host,"advanceautoparts.com")'
