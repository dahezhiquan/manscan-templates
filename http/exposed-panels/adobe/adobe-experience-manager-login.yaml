id: adobe-experience-manager-login

info:
  name: Adobe Experience Manager 登录面板（暴露面识别）
  author: dhiyaneshDK
  severity: info
  description: 该模板通过识别 Adobe Experience Manager 登录入口的页面标题、特征文本或重定向行为，判断目标是否暴露了对应的认证界面。若命中，说明该登录面板对外可访问，可用于暴露面梳理与后续安全评估。
  reference:
    - https://business.adobe.com/products/experience-manager/adobe-experience-manager.html
  classification:
    cwe-id: CWE-200
    cpe: cpe:2.3:a:adobe:experience_manager:*:*:*:*:*:*:*:*
  metadata:
    max-request: 1
    vendor: adobe
    product: experience_manager
    shodan-query:
      - http.title:"AEM Sign In"
      - http.component:"adobe experience manager"
      - http.title:"aem sign in"
      - cpe:"cpe:2.3:a:adobe:experience_manager"
    fofa-query: title="aem sign in"
    google-query: intitle:"aem sign in"
  tags: panel,aem,adobe,discovery

http:
  - method: GET
    path:
      - '{{BaseURL}}/libs/granite/core/content/login.html'

    matchers-condition: and
    matchers:
      - type: word
        words:
          - '<title>AEM Sign In</title>'

      - type: status
        status:
          - 200
