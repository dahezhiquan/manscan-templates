id: rat-mystic-stealer

info:
  name: Mystic Stealer 面板识别（指纹识别）
  author: pussycat0x
  severity: info
  description: |-
    检测到目标站点存在 Mystic Stealer 相关响应特征。Mystic Stealer 是与 C2、远控、窃密或钓鱼基础设施相关的 Web 管理入口，通常用于会话管理、任务下发、受害主机或钓鱼流程的集中控制。模板请求 `/`，并通过页面标题或正文关键字、状态码、DSL 条件确认该基础设施指纹；命中结果主要用于威胁狩猎、恶意基础设施识别和外部暴露面梳理。
  metadata:
    verified: "true"
    max-request: 1
    shodan-query: http.title:"Mystic Stealer"
  tags: tech,rat,mystic-stealer,c2,panel,vuln
http:
  - method: GET
    path:
      - "{{BaseURL}}"

    host-redirects: true
    matchers:
      - type: dsl
        dsl:
          - "status_code == 200 && contains(body, 'Mystic Stealer')"
        condition: and
