id: sitecore-debug-page

info:
  name: SiteCore 调试 Page
  author: dhiyaneshDK
  severity: low
  description: |
    检测到 SiteCore 调试 Page。目标暴露了调试、错误或堆栈信息，可能泄露应用路径、框架版本、环境变量、源码位置或内部调用细节。
  metadata:
    max-request: 1
    shodan-query: http.title:"Welcome to Sitecore"
  tags: debug,sitecore,misconfig,vuln

http:
  - method: GET
    path:
      - "{{BaseURL}}/sitecore/'"

    matchers-condition: and
    matchers:
      - type: word
        words:
          - 'extranet\Anonymous'

      - type: status
        status:
          - 404
