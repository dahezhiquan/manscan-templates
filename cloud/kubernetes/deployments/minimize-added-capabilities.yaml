id: minimize-added-capabilities

info:
  name: Minimize container added capabilities（云安全）
  author: princechaddha
  severity: high
  description: Deployment 为容器添加额外 Linux capabilities 会扩大容器进程权限边界，可能突破默认隔离假设。本模板枚举 Deployment，发现 securityContext.capabilities.add 非空时报告。
  impact: |
    - 额外能力可能允许网络配置、挂载、原始套接字或其他高危操作，增加逃逸和横向移动风险。
    - 被攻陷容器可利用多余 capability 扩大对节点或网络的影响。
  remediation: |
    - 移除不必要的 capabilities.add，并优先显式 drop ALL 后按需添加最小能力。
    - 用策略引擎限制高危 capability，并对例外工作负载建立审批记录。
  reference:
    - https://kubernetes.io/docs/tasks/configure-pod-container/security-context/
  metadata:
    vendor: kubernetes
    product: kubernetes
  tags: cloud,devops,kubernetes,devsecops,deployments,k8s-cluster-security
flow: |
  code(1);
  for (let deployment of template.items) {
    set("deployment", deployment)
    javascript(1);
  }

self-contained: true
code:
  - engine:
      - sh
      - bash
    source: kubectl get deployments --all-namespaces --output=json
    extractors:
      - type: json
        name: items
        internal: true
        json:
          - '.items[]'

javascript:
  - code: |
        deployment = JSON.parse(template.deployment);
        for (const container of deployment.spec.template.spec.containers) {
          if (container.securityContext && container.securityContext.capabilities && container.securityContext.capabilities.add && container.securityContext.capabilities.add.length > 0) {
            let addedCaps = container.securityContext.capabilities.add.join(', ');
            let result = (`Deployment '${deployment.metadata.name}' in namespace '${deployment.metadata.namespace}' has added capabilities: ${addedCaps}.`);
            Export(result);
          }
        }

    extractors:
      - type: dsl
        dsl:
          - response
