id: media-komga-panel

info:
  name: Komga 面板 - 检测（指纹识别）
  author: ChrisJr404
  severity: info
  description: |-
    检测到目标站点存在 Komga 相关响应特征。Komga 是漫画、电子书和媒体库管理平台，用于索引、阅读和管理个人数字书库。模板请求 `/`，并通过页面标题或正文关键字、状态码、DSL 条件确认该系统指纹，用于资产识别、系统盘点和暴露面梳理。
  reference:
    - https://github.com/gotson/komga
    - https://komga.org/
  metadata:
    verified: true
    max-request: 1
    vendor: gotson
    product: komga
    shodan-query: http.title:"Komga"
    fofa-query: title="Komga"
  tags: panel,komga,media,manga,comics,selfhosted,detect,discovery,login
http:
  - method: GET
    path:
      - "{{BaseURL}}"

    host-redirects: true
    max-redirects: 2

    matchers:
      - type: dsl
        dsl:
          - 'status_code == 200'
          - 'contains(to_lower(body), "<title>komga</title>")'
        condition: and
