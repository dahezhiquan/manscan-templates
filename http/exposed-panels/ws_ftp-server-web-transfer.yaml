id: ws_ftp-server-web-transfer

info:
  name: WS_FTP Server Web Transfer 面板识别（暴露面识别）
  author: johnk3r
  severity: info
  description: 该模板通过识别 WS_FTP Server Web Transfer 面板、控制台或管理界面的页面特征，判断目标是否暴露了对应服务入口。若命中，说明该后台或运维界面对外可访问，可用于资产识别与暴露面排查。
  classification:
    cvss-metrics: CVSS:3.0/AV:N/AC:L/PR:N/UI:N/S:U/C:N/I:N/A:N
    cwe-id: CWE-200
  metadata:
    verified: true
    max-request: 1
    vendor: progress
    product: ws_ftp
    shodan-query:
      - http.title:"WS_FTP Server Web Transfer"
      - ws_ftp port:22
      - http.title:"ad hoc transfer"
      - http.title:"ws_ftp server web transfer"
    censys-query:
      - services.http.request.uri="*/ThinClient/WTM/public/index.html"
      - services.http.request.uri="*/thinclient/wtm/public/index.html"
    fofa-query:
      - title="ws_ftp server web transfer"
      - title="ad hoc transfer"
    google-query:
      - intitle:"ws_ftp server web transfer"
      - intitle:"ad hoc transfer"
  tags: panel,ws_ftp,progress,discovery

http:
  - method: GET
    path:
      - "{{BaseURL}}"

    redirects: true
    max-redirects: 3
    matchers:
      - type: dsl
        dsl:
          - contains(body, 'Web Transfer Client')
          - status_code == 200
        condition: and
