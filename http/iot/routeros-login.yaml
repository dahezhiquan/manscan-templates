id: routeros-login

info:
  name: RouterOS 路由器登录面板（IOT）
  author: dhiyaneshDK,idealphase
  severity: medium
  description: |
    检测到 RouterOS 路由器登录面板。该页面暴露可用于确认 MikroTik/RouterOS 设备入口，并增加远程口令探测或管理面攻击面。
  impact: |
    - 网关、路由器或 VPN 管理入口暴露会增加口令攻击、配置探测和设备接管风险。
    - 网络边界设备一旦被控制，可能导致流量劫持、访问策略篡改或内网横向移动。
  remediation: |
    - 将网络设备管理入口限制在可信管理网段或 VPN 内，禁止公网暴露。
    - 修改默认凭据，启用强认证和登录失败限制。
    - 定期升级固件并审计路由、DNS、端口转发和 VPN 配置变更。
  classification:
    cvss-metrics: CVSS:3.0/AV:N/AC:L/PR:N/UI:N/S:U/C:N/I:N/A:N
    cvss-score: 0
    cwe-id: CWE-200
  metadata:
    max-request: 1
    shodan-query: http.title:"RouterOS router configuration page"
  tags: panel,router,routeros,iot,discovery

http:
  - method: GET
    path:
      - "{{BaseURL}}"

    matchers-condition: and
    matchers:
      - type: word
        words:
          - '<title>RouterOS router configuration page</title>'

      - type: status
        status:
          - 200

    extractors:
      - type: regex
        group: 1
        regex:
          - '<h1>RouterOS v(.+)<\/h1>'
