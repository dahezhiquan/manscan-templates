id: vmware-aria-panel

info:
  name: VMware Aria Operations 登录识别（暴露面识别）
  author: rxerium
  severity: info
  description: |
    该模板通过识别 VMware Aria Operations 登录入口的页面标题、特征文本或重定向行为，判断目标是否暴露了对应的认证界面。若命中，说明该登录面板对外可访问，可用于暴露面梳理与后续安全评估。
  metadata:
    verified: true
    max-request: 1
    shodan-query: title:"VMware Aria Operations"
  tags: panel,aria,login,detect,discovery

http:
  - method: GET
    path:
      - "{{BaseURL}}/ui/login.action"

    matchers-condition: and
    matchers:
      - type: word
        part: body
        words:
          - "<title>VMware Aria Operations</title>"

      - type: status
        status:
          - 200
