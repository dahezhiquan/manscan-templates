id: beyondtrust-remotesupport-panel

info:
  name: BeyondTrust Remote Support 面板识别（指纹识别）
  author: darses
  severity: info
  description: |-
    检测到目标站点存在 BeyondTrust Remote Support 相关响应特征。BeyondTrust Remote Support 是远程支持平台，用于客服或运维人员发起远程协助、会话审计和设备支持。模板请求 `/`，并通过页面标题或正文关键字、状态码确认该系统指纹，用于资产识别、系统盘点和暴露面梳理。
  metadata:
    verified: true
    max-requests: 1
    shodan-query:
      - http.favicon.hash:-694003434
    fofa-query:
      - icon_hash="-694003434"
    vendor: beyondtrust
    product: remote_support
  tags: panel,detect,beyondtrust,discovery
http:
  - method: GET
    path:
      - "{{BaseURL}}"

    matchers-condition: and
    matchers:
      - type: status
        status:
          - 200

      - type: word
        part: body
        words:
          - "BeyondTrust Remote Support"
          - "powered_by_text"
        condition: and
