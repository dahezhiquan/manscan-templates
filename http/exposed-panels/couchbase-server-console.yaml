id: couchbase-server-console

info:
  name: Couchbase Server Console 识别（指纹识别）
  author: Th3l0newolf
  severity: info
  description: |-
    检测到目标站点存在 Couchbase Server Console 相关响应特征。Couchbase Server Console 是数据库或数据服务的 Web 管理入口，用于查看数据、执行查询、管理索引、集合、集群或连接配置。模板请求 `/ui/index.html`，并通过页面标题或正文关键字确认该系统指纹，用于资产识别、系统盘点和暴露面梳理。
  classification:
    cvss-metrics: CVSS:3.0/AV:N/AC:L/PR:N/UI:N/S:U/C:N/I:N/A:N
    cwe-id: CWE-200
  metadata:
    max-request: 1
    verified: true
    shodan-query: html:"Couchbase Console"
  tags: panel,login,couchbase,console,detect
http:
  - method: GET
    path:
      - "{{BaseURL}}/ui/index.html"

    matchers-condition: or
    matchers:
      - type: word
        part: body
        words:
          - "Couchbase Console</title>"
          - "/opt/couchbase/lib/"
          - "content=\"Couchbase Server"
        condition: or

      - type: word
        part: server
        words:
          - "Couchbase Server"
