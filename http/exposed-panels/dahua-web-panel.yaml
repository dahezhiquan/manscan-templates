id: dahua-web-panel

info:
  name: Dahua Web Service 面板识别（指纹识别）
  author: dhiyaneshDK,rxerium
  severity: info
  description: 该模板通过识别 Dahua Web Service 登录入口的页面标题、特征文本或重定向行为，判断目标是否暴露了对应的认证界面。若命中，说明该登录面板对外可访问，可用于暴露面梳理与后续安全评估。
  reference:
    - https://www.exploit-db.com/ghdb/7116
  classification:
    cvss-metrics: CVSS:3.0/AV:N/AC:L/PR:N/UI:N/S:U/C:N/I:N/A:N
    cwe-id: CWE-200
    cpe: cpe:2.3:h:dahuasecurity:sd22204db-gny-w:*:*:*:*:*:*:*:*
  metadata:
    verified: true
    max-request: 1
    shodan-query: http.favicon.hash:1653394551
    product: sd22204db-gny-w
    vendor: dahuasecurity
  tags: edb,panel,dahua,detect,discovery

http:
  - method: GET
    path:
      - '{{BaseURL}}'

    matchers-condition: and
    matchers:
      - type: word
        words:
          - '<title>WEB SERVICE</title>'

      - type: status
        status:
          - 200
