id: lean-value-listing

info:
  name: LVS Lean Value Management System Business - Directory Listing
  author: pussycat0x
  severity: low
  description: |
    该模板用于检测 LVS Lean Value Management System Business - Directory Listing。该类问题通常源于服务配置过宽、调试能力暴露或安全控制未按生产环境要求启用。模板会向 `/Business/` 等位置发送探测请求，并结合响应状态、关键字、错误信息、时间差或外带交互等证据判断目标是否受影响。
  impact: |
    - 攻击者可能借助错误配置访问内部功能、敏感数据或原本不应公开的管理能力。
    - 配置缺陷常与其他漏洞组合使用，扩大暴露面并增加被定向攻击的概率。
  remediation: |
    - 按最小暴露原则收敛相关服务配置，关闭调试、示例、未使用插件和不必要接口。
    - 为管理入口和敏感接口增加认证、授权、来源限制和审计记录。
    - 复核生产环境基线，确认安全头、访问控制、默认配置和网络边界符合要求。
  reference:
    - https://github.com/Threekiii/Awesome-POC/blob/master/Web%E5%BA%94%E7%94%A8%E6%BC%8F%E6%B4%9E/%E5%90%89%E6%8B%89%E7%A7%91%E6%8A%80%20LVS%E7%B2%BE%E7%9B%8A%E4%BB%B7%E5%80%BC%E7%AE%A1%E7%90%86%E7%B3%BB%E7%BB%9F%20Business%20%E7%9B%AE%E5%BD%95%E9%81%8D%E5%8E%86%E6%BC%8F%E6%B4%9E.md
  metadata:
    verified: true
    max-request: 1
    fofa-query: "Supperd By 吉拉科技"
  tags: lean-value,misconfig,listing,vuln

http:
  - method: GET
    path:
      - "{{BaseURL}}/Business/"

    matchers-condition: and
    matchers:
      - type: word
        part: body
        words:
          - '/Business/'
          - 'AgencytaskList.aspx'
        condition: and

      - type: status
        status:
          - 200
