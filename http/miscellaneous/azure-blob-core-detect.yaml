id: azure-blob-core-detect

info:
  name: Azure Blob Core 服务引用检测（指纹识别）
  author: ProjectDiscoveryAI
  severity: info
  description: |
    检测响应正文中是否出现 blob.core.windows.net 特征，用于识别页面或接口中潜在的 Azure Blob Storage 资源引用。
  metadata:
    max-request: 1
    verified: true
    shodan-query: html:"blob.core.windows.net"
  tags: azure,blob,detect,vuln

http:
  - method: GET
    path:
      - "{{BaseURL}}"

    matchers:
      - type: word
        part: response
        words:
          - "blob.core.windows.net"
