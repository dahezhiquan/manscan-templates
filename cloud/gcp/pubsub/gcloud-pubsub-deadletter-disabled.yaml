id: gcloud-pubsub-deadletter-disabled

info:
  name: Dead Letter Topic 未Enabled 的Google Pub/Sub Subscriptions（云安全）
  author: princechaddha
  severity: low
  description: Pub/Sub Dead Letter Topic 可隔离反复投递失败的消息，避免异常消息阻塞正常消费链路。本模板调用 pubsub subscriptions describe 检查 deadLetterPolicy.deadLetterTopic，返回 null 时报告订阅未配置死信主题。
  impact: |
    - 有问题的消息可能被反复投递，造成消费延迟、重复处理或订阅积压。
    - 缺少死信隔离会降低故障分析效率，异常消息也更容易在正常业务流中被忽略。
  remediation: |
    - 为关键 Pub/Sub subscription 配置 Dead Letter Topic，并设置合适的最大投递次数。
    - 对死信主题设置访问控制、告警和回放流程，确保异常消息可被及时分析和处理。
  reference:
    - https://cloud.google.com/pubsub/docs/dead-letter-topics
  metadata:
    vendor: google
    product: google-cloud-pubsub
  tags: cloud,devops,gcp,gcloud,google-cloud-pubsub,gcp-cloud-config

flow: |
  code(1)
  for(let projectId of iterate(template.projectIds)){
    set("projectId", projectId)
    code(2)
    for(let topicName of iterate(template.topics)){
      set("pubsubTopic", topicName)
      code(3)
    }
  }

self-contained: true

code:
  - engine:
      - sh
      - bash
    source: |
      gcloud projects list --format="json(projectId)"

    extractors:
      - type: json
        name: projectIds
        internal: true
        json:
          - '.[].projectId'

  - engine:
      - sh
      - bash
    source: |
      gcloud pubsub topics list --project $projectId --format="json(name)"

    extractors:
      - type: json
        name: topics
        internal: true
        json:
          - '.[].name'

  - engine:
      - sh
      - bash
    source: |
      gcloud pubsub subscriptions describe $pubsubTopic --format="json(deadLetterPolicy.deadLetterTopic)"

    matchers:
      - type: word
        words:
          - 'null'

    extractors:
      - type: dsl
        dsl:
          - '"Dead Letter Topic not enabled for Pub/Sub subscription: " + pubsubTopic + " in project: " + projectId'
