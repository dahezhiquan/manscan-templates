id: file-disable-sshp-protocol

info:
  name: SSH Protocol 1 未禁用（本地文件安全扫描）
  author: pussycat0x
  severity: high
  description: |
    该模板检查是否仍允许 SSH Protocol 1。该协议缺少现代加密和完整性保护，容易遭受中间人和会话劫持攻击。
  remediation: |
    在 /etc/ssh/sshd_config 中设置 Protocol 2，并重启 SSH 服务。
  reference:
    - https://vishalraj82.medium.com/hardening-openssh-security-37f5d634015f
    - https://www.ktchost.com/blog/enable-ssh-protocol-2/
  metadata:
    verified: true
  tags: audit,config,file,ssh

file:
  - extensions:
      - all

    matchers-condition: and
    matchers:
      - type: word
        words:
          - "# This is the sshd server system-wide configuration file"

      - type: word
        words:
          - "Protocol 2"
        negative: true
