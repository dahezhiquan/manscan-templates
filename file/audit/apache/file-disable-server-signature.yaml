id: file-disable-server-signature

info:
  name: Apache ServerSignature 未禁用（本地文件安全扫描）
  author: pussycat0x
  severity: medium
  description: |
    该模板检查 Apache ServerSignature 是否关闭。开启时错误页可能泄露 Apache 版本和主机信息。
  remediation: |
    在 Apache 配置中设置 ServerSignature Off，并重启服务。
  reference:
    - https://httpd.apache.org/docs/2.4/mod/core.html#serversignature
  metadata:
    verified: true
  tags: audit,config,file,apache,hardening

file:
  - extensions:
      - conf

    matchers-condition: and
    matchers:
      - type: word
        words:
          - "<Directory"
          - "<FilesMatch"
        condition: and

      - type: word
        words:
          - "ServerSignature Off"
        negative: true
