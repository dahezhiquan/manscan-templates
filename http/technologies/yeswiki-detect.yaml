id: yeswiki-detect

info:
  name: YesWiki 指纹识别（指纹识别）
  author: ritikchaddha
  severity: info
  description: >-
    YesWiki 是开源协作 Wiki 和内容管理平台，用于知识协作、表单、地图和社区内容发布。该模板通过请求目标服务并检查预设路径或首页响应、页面正文关键字、状态码等指纹特征，判断目标是否使用或暴露了
    YesWiki 相关组件；命中结果仅表示指纹特征匹配，可用于资产盘点、技术栈识别和后续安全评估，不代表已确认存在可利用漏洞。
  classification:
    cvss-metrics: CVSS:3.0/AV:N/AC:L/PR:N/UI:N/S:U/C:N/I:N/A:N
    cvss-score: 0
    cwe-id: CWE-200
    cpe: cpe:2.3:a:yeswiki:yeswiki:*:*:*:*:*:*:*:*
  metadata:
    verified: true
    max-request: 1
    shodan-query: http.html:"yeswiki"
    product: yeswiki
    vendor: yeswiki
  tags: yeswiki,panel,tech,discovery
http:
  - method: GET
    path:
      - '{{BaseURL}}'

    host-redirects: true
    max-redirects: 2

    matchers-condition: and
    matchers:
      - type: word
        part: body
        words:
          - 'yeswiki-search'
          - 'yeswiki-base'
        condition: or

      - type: status
        status:
          - 200
