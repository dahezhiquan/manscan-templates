id: wildcard-postmessage

info:
  name: postMessage Cross Site Scripting 检测
  author: pdteam
  severity: unknown
  description: |
    检测到 postMessage Cross Site Scripting 检测。目标响应或文件中可能暴露配置、凭据、密钥、令牌、环境变量或历史记录等敏感信息，可能被用于进一步入侵。
  reference:
    - https://jlajara.gitlab.io/web/2020/06/12/Dom_XSS_PostMessage.html
    - https://payatu.com/blog/anubhav.singh/postmessage-vulnerabilities
    - https://developer.mozilla.org/en-US/docs/Web/API/Window/postMessage
  classification:
    cvss-metrics: CVSS:3.0/AV:N/AC:L/PR:N/UI:N/S:C/C:L/I:L/A:N
    cvss-score: 7.2
    cwe-id: CWE-346
  metadata:
    max-request: 1
  tags: xss,postmessage,misconfig,vuln

http:
  - method: GET
    path:
      - '{{BaseURL}}'

    matchers:
      - type: regex
        regex:
          - postMessage\([a-zA-Z]+,["']\*["']\)
