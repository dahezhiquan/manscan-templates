id: gcloud-org-auto-iam-grants

info:
  name: Automatic IAM Role Grants 的Default Service Accounts Not未启用（云安全）
  author: princechaddha
  severity: medium
  description: 默认服务账号自动获得 IAM 角色会使新项目或服务账号继承过宽权限，偏离最小权限原则。本模板检查 iam.automaticIamGrantsForDefaultServiceAccounts 组织策略的 booleanPolicy，返回空对象 {} 时报告未禁用自动授权。
  impact: |
    - 默认服务账号可能获得 Editor 等高权限，工作负载被攻破后可直接滥用项目资源。
    - 自动授权降低了权限来源的可解释性，增加后续权限收敛和审计成本。
  remediation: |
    - 启用 iam.automaticIamGrantsForDefaultServiceAccounts 约束以禁用默认服务账号自动授权。
    - 复核已有默认服务账号权限，按工作负载实际需求改授最小权限角色。
  reference:
    - https://www.trendmicro.com/cloudoneconformity/knowledge-base/gcp/ResourceManager/disable-automatic-role-grants.html
    - https://cloud.google.com/resource-manager/docs/organization-policy/org-policy-constraints
  metadata:
    vendor: google
    product: resource-manager
  tags: cloud,devops,gcp,gcloud,resourcemanager,security,iam,organization,gcp-cloud-config

flow: |
  code(1)
  for(let orgId of iterate(template.orgIds)){
    set("orgId", orgId)
    code(2)
  }

self-contained: true

code:
  - engine:
      - sh
      - bash
    source: |
      gcloud organizations list --format="json(name)"

    extractors:
      - type: json
        name: orgIds
        internal: true
        json:
          - '.[].name'

  - engine:
      - sh
      - bash
    source: |
      gcloud alpha resource-manager org-policies describe iam.automaticIamGrantsForDefaultServiceAccounts --organization=$orgId --effective --format="json(booleanPolicy)"

    matchers:
      - type: word
        words:
          - "{}"

    extractors:
      - type: dsl
        dsl:
          - '"Organization " + orgId + " has not disabled automatic IAM role grants for default service accounts"'
