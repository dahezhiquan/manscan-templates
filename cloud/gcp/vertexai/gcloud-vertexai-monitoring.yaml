id: gcloud-vertexai-monitoring

info:
  name: Cloud 监控 未Enabled 的Vertex AI Notebooks（云安全）
  author: princechaddha
  severity: medium
  description: Vertex AI notebook 未安装或启用 Cloud Monitoring agent 时，实例资源、运行状态和异常行为的可见性不足。本模板检查 gceSetup.metadata.install-monitoring-agent，返回 null 时报告 Cloud Monitoring 未启用。
  impact: |
    - CPU、内存、磁盘、进程或运行状态异常可能无法及时发现，影响安全响应和成本治理。
    - Notebook 被滥用进行异常计算或数据处理时，缺少监控信号会延迟处置。
  remediation: |
    - 为 Vertex AI notebook 启用 Cloud Monitoring agent 或等效监控配置。
    - 配置资源异常、长时间运行、磁盘增长和访问异常告警，并纳入集中监控面板。
  reference:
    - https://www.trendmicro.com/cloudoneconformity/knowledge-base/gcp/VertexAI/enable-cloud-monitoring.html
    - https://cloud.google.com/vertex-ai/docs/workbench/user-managed/manage-instance
  metadata:
    vendor: google
    product: vertex-ai
  tags: cloud,devops,gcp,gcloud,vertexai,security,monitoring,gcp-cloud-config,ai

flow: |
  code(1)
  for(let projectId of iterate(template.projectIds)){
    set("projectId", projectId)
    code(2)
  }

self-contained: true

code:
  - engine:
      - sh
      - bash
    source: |
      gcloud projects list --format="json(projectId)"

    extractors:
      - type: json
        name: projectIds
        internal: true
        json:
          - '.[].projectId'

  - engine:
      - sh
      - bash
    source: |
      gcloud workbench instances describe tm-vertex-ai-notebook-instance --location=us-central1-a --project=$projectId --format="yaml(gceSetup.metadata.install-monitoring-agent)"

    matchers:
      - type: word
        words:
          - "null"

    extractors:
      - type: dsl
        dsl:
          - '"Project " + projectId + " has Vertex AI notebook instances without Cloud Monitoring enabled"'
