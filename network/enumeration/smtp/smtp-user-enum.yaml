id: smtp-user-enum

info:
  name: SMTP 用户枚举（服务漏洞）
  author: pussycat0x,userdehghani
  severity: medium
  description: |
    SMTP 服务器在 VRFY、EXPN 或 RCPT TO 等命令处理不一致时，可能泄露邮箱账号是否存在。该模板向常见 SMTP 端口发送用户枚举探测，并通过 `252` 或 `250` 响应判断目标是否暴露用户枚举能力。
  impact: |
    - 攻击者可确认邮箱账号是否存在，为垃圾邮件投递、撞库、钓鱼或口令喷洒提供目标列表。
    - 用户枚举还可能泄露组织邮箱命名规则和有效人员范围。
  remediation: |
    - 禁用或限制 VRFY、EXPN 等可枚举用户的 SMTP 命令。
    - 统一不存在用户与拒绝投递的错误响应，减少通过响应差异判断账号有效性的机会。
    - 对 SMTP 认证和投递接口启用访问控制、速率限制和异常告警。
  reference:
    - https://nmap.org/nsedoc/scripts/smtp-enum-users.html
  metadata:
    verified: true
    max-request: 1
    shodan-query: smtp
  tags: network,enum,smtp,mail,tcp,discovery

tcp:
  - inputs:
      - data: "VRFY {{useraccounts}}\n"
        read: 1024
      - data: "EXPN {{useraccounts}}\n"
        read: 1024

    host:
      - "{{Hostname}}"
    port: 25,2525,465,587

    attack: batteringram
    payloads:
      useraccounts:
        - msfadmin
        - admin
        - root

    matchers:
      - type: word
        words:
          - "252"
          - "250"
        condition: or
