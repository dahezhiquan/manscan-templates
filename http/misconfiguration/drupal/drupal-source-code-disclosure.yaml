id: drupal-source-code-disclosure

info:
  name: Drupal 源码泄露
  author: pussycat0x
  severity: medium
  description: |
    该模板用于核查 Drupal 源码泄露。该类问题通常源于高危管理接口未授权开放，攻击者可借助接口能力提交任务或触发命令执行。模板会向目标发送探测请求，并依据请求 `/sites/default/settings.php`、`/sites/default/settings.php~`、匹配 `status_code == 200`、匹配 `contains_all(body, 'Drupal database driver', 'drupal_initialize_variables()', 'allow_authorize_operations')`等证据确认目标是否存在该配置问题。
  impact: |
    - 攻击者可能在目标服务或集群节点上执行命令、提交任务或控制计算资源。
    - 成功利用后可导致主机沦陷、数据泄露、横向移动和业务中断。
  remediation: |
    - 立即为相关管理接口启用认证授权并限制可信来源访问。
    - 按厂商建议升级或加固受影响组件，关闭不需要的远程任务提交能力。
    - 检查集群任务、系统进程和访问日志，清理异常任务并轮换凭据。
  reference:
    - https://www.drupal.org/docs/security-in-drupal
    - https://www.drupal.org/project/drupal/issues/3457781
  metadata:
    max-request: 8
    verified: true
    product: drupal
    vendor: drupal
    shodan-query: http.component:"drupal"
  tags: drupal,exposure,disclosure,misconfig

http:
  - method: GET
    path:
      - "{{BaseURL}}/sites/default/settings.php"
      - "{{BaseURL}}/sites/default/settings.php~"
      - "{{BaseURL}}/sites/default/settings.php.bak"
      - "{{BaseURL}}/sites/default/settings.php.old"
      - "{{BaseURL}}/sites/default/settings.php.orig"
      - "{{BaseURL}}/sites/default/settings.php.save"
      - "{{BaseURL}}/sites/default/settings.php.swp"
      - "{{BaseURL}}/sites/default/settings.local.php"

    stop-at-first-match: true

    matchers:
      - type: dsl
        dsl:
          - "status_code == 200"
          - "contains_all(body, 'Drupal database driver', 'drupal_initialize_variables()', 'allow_authorize_operations')"
        condition: and
