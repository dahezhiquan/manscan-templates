id: gcloud-api-keys-inactive-services

info:
  name: API Keys Should Only Exist 的Active Services（云安全）
  author: princechaddha
  severity: low
  description: 长期保留未使用或用途不清的 Google Cloud API Key 会增加凭据暴露面。本模板遍历项目并通过 gcloud alpha services api-keys list 枚举 API Key，只要返回 uid 即报告项目中存在需要复核的 API Key。
  impact: |
    - 闲置或未归属的 API Key 容易被遗忘在代码、配置或旧客户端中，泄露后仍可能被用于访问已启用服务。
    - API Key 数量失控会增加轮换、归属确认和异常调用溯源成本。
  remediation: |
    - 定期审计 API Key 的用途、最后使用时间和负责人，删除不再被活动服务使用的密钥。
    - 为保留的 API Key 增加应用限制、API restrictions、标签和轮换流程。
  reference:
    - https://cloud.google.com/docs/authentication/api-keys
  metadata:
    vendor: google
    product: api-keys
  tags: cloud,devops,gcp,gcloud,apikey,gcp-cloud-config

flow: |
  code(1)
  for(let projectId of iterate(template.projectIds)){
    set("projectId", projectId)
    code(2)
  }

self-contained: true

code:
  - engine:
      - sh
      - bash
    source: |
      gcloud projects list --format="json(projectId)"

    extractors:
      - type: json
        name: projectIds
        internal: true
        json:
          - '.[].projectId'

  - engine:
      - sh
      - bash
    source: |
      gcloud alpha services api-keys list --project=$projectId --format="json(uid)"

    matchers:
      - type: word
        words:
          - 'uid'

    extractors:
      - type: json
        name: uid
        internal: true
        json:
          - '.[].uid'

      - type: dsl
        dsl:
          - '"Inactive API Key found: UID: " + uid + " in Project: " + projectId'
