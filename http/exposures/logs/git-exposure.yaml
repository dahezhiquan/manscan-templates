id: git-exposure

info:
  name: Git Metadata Directory 暴露（暴露面识别）
  author: tess
  severity: medium
  description: 检测到可直接访问的 Git Metadata Directory。日志、异常页面或调试输出通常会泄露堆栈信息、内部路径、查询语句、账号标识、令牌片段或业务数据，不应向未授权用户开放。
  metadata:
    verified: true
    max-request: 1
  tags: logs,git,exposure,vuln

http:
  - method: GET
    path:
      - "{{BaseURL}}/.git/"

    host-redirects: true
    max-redirects: 2

    matchers-condition: and
    matchers:
      - type: word
        part: body
        words:
          - "403 Forbidden"
          - "You do not have permission to access /.git/"
        condition: and

      - type: status
        status:
          - 403
