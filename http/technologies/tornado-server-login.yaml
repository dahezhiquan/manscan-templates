id: tornado-server-login

info:
  name: Tornado 服务器 面板指纹识别（指纹识别）
  author: tess
  severity: info
  description: 用于识别目标暴露的 Tornado 服务器 面板，模板会结合页面标题、页面正文、状态码和特定路径或已知端点判断是否存在对应技术或默认页面特征。
  classification:
    cvss-metrics: CVSS:3.0/AV:N/AC:L/PR:N/UI:N/S:U/C:N/I:N/A:N
    cvss-score: 0
    cwe-id: CWE-200
  metadata:
    verified: true
    max-request: 1
    shodan-query: title:"Tornado - Login"
  tags: panel,tornado,tech,discovery

http:
  - method: GET
    path:
      - '{{BaseURL}}'

    matchers-condition: and
    matchers:
      - type: word
        part: body
        words:
          - "Welcome to Docmosis Tornado"
          - "Please log in:"
        condition: and

      - type: status
        status:
          - 200
