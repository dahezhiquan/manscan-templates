id: sso-authentik-panel

info:
  name: Authentik 登录面板识别（指纹识别）
  author: rxerium
  severity: info
  description: |-
    Authentik 是开源身份提供商，用于单点登录、多因素认证、目录集成和应用访问控制。该模板请求首页、`/static/dist/assets/icons/icon.png`，并依据 favicon 哈希、页面标题、正文关键字或品牌资源特征、DSL 条件识别目标是否部署了该系统或暴露了对应入口，适用于资产指纹确认；命中结果仅表示系统特征匹配，不代表已确认存在未授权访问或可利用漏洞。
  reference:
  - https://github.com/goauthentik/authentik
  metadata:
    max-request: 1
    verified: true
    shodan-query: http.favicon.hash:-178113786
  tags: authentik,sso,mfa,panel,detect,discovery

http:
  - method: GET
    path:
      - "{{BaseURL}}"
      - "{{BaseURL}}/static/dist/assets/icons/icon.png"

    host-redirects: true
    max-redirects: 2
    stop-at-first-match: true

    matchers-condition: or
    matchers:
      - type: word
        part: body
        words:
          - "<title>authentik</title>"
          - "window.authentik"
          - "authentik.css"
        condition: or
        case-insensitive: true

      - type: dsl
        dsl:
          - "(\"-178113786\" == mmh3(base64_py(body)))"
