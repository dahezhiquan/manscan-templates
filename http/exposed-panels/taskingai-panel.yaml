id: taskingai-panel

info:
  name: TaskingAI 面板识别（指纹识别）
  author: rxerium
  severity: info
  description: |-
    TaskingAI 是 AI Agent 和大模型应用平台，用于模型接入、任务编排、知识库和应用管理。该模板请求首页，并依据 HTTP 200 状态码、页面标题、正文关键字或品牌资源特征识别目标是否部署了该系统或暴露了对应入口，适用于资产指纹确认；命中结果仅表示系统特征匹配，不代表已确认存在未授权访问或可利用漏洞。
  reference:
  - https://github.com/TaskingAI/TaskingAI
  - https://www.tasking.ai
  metadata:
    verified: true
    max-request: 1
    vendor: taskingai
    product: taskingai
    shodan-query: 'http.title:"TaskingAI | Console"'
  tags: panel,taskingai,llm,ai,agents,detect,discovery

http:
  - method: GET
    path:
      - "{{BaseURL}}"

    host-redirects: true
    max-redirects: 2

    matchers-condition: and
    matchers:
      - type: word
        part: body
        words:
          - "TaskingAI"

      - type: status
        status:
          - 200
