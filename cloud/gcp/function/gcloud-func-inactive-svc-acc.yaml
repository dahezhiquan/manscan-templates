id: gcloud-func-inactive-svc-acc

info:
  name: Inactive Service Accounts 中的Google Cloud Functions（云安全）
  author: princechaddha
  severity: high
  description: 该规则用于检查 GCP function 相关资源是否满足推荐的云安全与合规配置要求，命中通常表示当前配置仍存在可改进的风险项。
  impact: |
    - 当前配置偏离推荐的云安全基线，可能增加攻击面、审计缺口或运维失误带来的风险。
    - 具体影响取决于受影响资源的重要性、暴露范围以及周边安全控制是否到位。
  remediation: |
    - 参考云厂商安全基线和官方文档修正当前配置偏差。
    - 建议结合资源标签、自动化检测与周期性审计，持续跟踪该类风险项的整改状态。
  reference:
    - https://cloud.google.com/functions/docs/securing/managing-access-iam
  tags: cloud,devops,gcp,gcloud,google-cloud-functions,gcp-cloud-config

flow: |
  code(1)
  for(let projectId of iterate(template.projectIds)){
    set("projectId", projectId)
    code(2)
    for(let functionName of iterate(template.functions)){
      set("functionName", functionName)
      code(3)
        for(let serviceAccountEmail of iterate(template.serviceAccountEmail)){
        set("serviceAccountEmail", serviceAccountEmail)
        code(4)
      }
    }
  }

self-contained: true

code:
  - engine:
      - sh
      - bash
    source: |
      gcloud projects list --format="json(projectId)"

    extractors:
      - type: json
        name: projectIds
        internal: true
        json:
          - '.[].projectId'

  - engine:
      - sh
      - bash
    source: |
      gcloud functions list --project $projectId --format="json(name)"

    extractors:
      - type: json
        name: functions
        internal: true
        json:
          - '.[].name'

  - engine:
      - sh
      - bash
    source: |
      gcloud functions describe $functionName --format="json(serviceConfig.serviceAccountEmail)"

    extractors:
      - type: json
        name: serviceAccountEmail
        internal: true
        json:
          - '.[].serviceAccountEmail'

  - engine:
      - sh
      - bash
    source: |
      gcloud iam service-accounts describe $serviceAccountEmail --format="json(disabled)"

    matchers:
      - type: word
        words:
          - 'PERMISSION_DENIED:'
          - 'ERROR:'
          - 'disabled'
        condition: or

    extractors:
      - type: dsl
        dsl:
          - '"Inactive Service Account: " + serviceAccountEmail + ", Function: " + functionName + " in " + projectId + " project"'
