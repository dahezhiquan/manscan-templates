id: gaspot-honeypot-detect

info:
  name: GasPot 蜜罐识别（蜜罐识别）
  author: UnaPibaGeek
  severity: info
  description: |
    GasPot 是面向加油站和工业控制场景的蜜罐，常模拟 Veeder-Root 自动油罐计量系统服务。该模板连接 TCP 10001 并发送协议探测，通过 GasPot/Veeder-Root 仿真响应特征识别蜜罐。
  metadata:
    max-request: 1
    vendor: gaspot
    product: veeder-root
    shodan-query: port:10001
  tags: gaspot,veeder-root,ics,honeypot,ir,cti,network,tcp,discovery
tcp:
  - inputs:
      - data: "^AI21400"

    host:
      - "{{Hostname}}"
    port: 10001
    read-size: 1024

    matchers:
      - type: word
        words:
          - "9999FF1B"
