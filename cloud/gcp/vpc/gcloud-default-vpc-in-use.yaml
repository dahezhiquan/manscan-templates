id: gcloud-default-vpc-in-use

info:
  name: Default VPC Network已使用（云安全）
  author: princechaddha
  severity: medium
  description: default VPC 通常随项目自动创建，可能包含不符合组织基线的默认子网和防火墙规则。本模板检查项目网络列表，发现名称为 default 的 VPC 时报告默认网络仍在使用。
  impact: |
    - 工作负载可能部署在未按业务边界设计的网络中，增加横向访问和公网暴露风险。
    - 默认网络存在会削弱网络架构一致性，影响防火墙、路由和日志治理。
  remediation: |
    - 将资源迁移到按组织基线设计的自定义 VPC，并删除不再需要的 default VPC。
    - 在组织层限制默认网络创建，确保新项目使用受控网络模板。
  reference:
    - https://cloud.google.com/vpc/docs/vpc
  metadata:
    vendor: google
    product: cloud-vpc
  tags: cloud,devops,gcp,gcloud,google-cloud-vpc,networking,security,gcp-cloud-config

flow: |
  code(1)
  for(let projectId of iterate(template.projectIds)){
    set("projectId", projectId)
    code(2)
  }

self-contained: true

code:
  - engine:
      - sh
      - bash
    source: |
      gcloud projects list --format="json(projectId)"

    extractors:
      - type: json
        name: projectIds
        internal: true
        json:
          - ".[].projectId"

  - engine:
      - sh
      - bash
    source: |
      gcloud compute networks list --project $projectId --format="json(name)"

    matchers:
      - type: word
        part: body
        words:
          - '"name": "default"'

    extractors:
      - type: dsl
        dsl:
          - '"The default VPC network is in use in project " + projectId'
