id: route53-dns-query-disabled

info:
  name: Route 53 公有托管区域 DNS 查询日志未启用（云安全）
  author: DhiyaneshDK
  severity: medium
  description: Route 53 DNS query logging 可记录公有托管区域收到的 DNS 查询，帮助分析解析异常、滥用和流量来源；未启用时，域名解析层缺少关键审计数据。该模板筛选公有 hosted zone，并检查 QueryLoggingConfigs 是否为空数组。
  impact: |
    - DNS 枚举、异常解析流量或域名滥用行为难以及时追踪。
    - 发生可用性或安全事件时，缺少查询日志会增加溯源和影响范围评估难度。
  remediation: |
    - 为公有 Route 53 hosted zone 启用 query logging，并将日志发送到合适的 CloudWatch Logs log group。
    - 配置日志保留、访问控制和告警分析规则，持续监控异常 DNS 查询模式。
  reference:
    - https://www.trendmicro.com/cloudoneconformity-staging/knowledge-base/aws/Route53/enable-query-logging.html
    - https://docs.aws.amazon.com/Route53/latest/DeveloperGuide/monitoring-overview.html
  metadata:
    vendor: amazon
    product: route53
  tags: cloud,devops,aws,amazon,route53,aws-cloud-config
variables:
  region: "us-west-2"

flow: |
  code(1)
  for(let HostedZones of iterate(template.hostedzones)){
    set("hostedzone", HostedZones)
    code(2) && code(3)
  }

self-contained: true

code:
  - engine:
      - sh
      - bash
    source: |
      aws route53 list-hosted-zones --region $region --query "HostedZones[*].Id" --output json

    extractors:
      - type: json
        name: hostedzones
        internal: true
        json:
          - '.[]'

  - engine:
      - sh
      - bash

    source: |
        aws route53 get-hosted-zone --id $hostedzone --query "HostedZone.Config.PrivateZone" --region $region --output json

    matchers:
      - type: word
        words:
          - 'false'
        internal: true

  - engine:
      - sh
      - bash

    source: |
        aws route53 list-query-logging-configs --hosted-zone-id "$hostedzone" --query "QueryLoggingConfigs" --region $region --output json

    matchers:
      - type: word
        words:
          - '[]'

    extractors:
      - type: dsl
        dsl:
          - 'hostedzone + " DNSSEC Signing for Route 53 Hosted Zones is Disabled"'
