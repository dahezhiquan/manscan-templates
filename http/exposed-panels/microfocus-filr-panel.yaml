id: microfocus-filr-panel

info:
  name: Micro Focus Filr 登录面板识别（指纹识别）
  author: ritikchaddha,righettod
  severity: info
  description: |-
    检测到目标站点存在 Micro Focus Filr 相关响应特征。Micro Focus Filr 是 AI、机器学习或 Notebook 相关平台，用于管理模型、数据集、工作区、实验、推理服务或训练任务。模板请求 `/filr/login`、`/login` 路径，并通过页面标题或正文关键字、状态码确认该系统指纹，用于资产识别、系统盘点和暴露面梳理。
  classification:
    cvss-metrics: CVSS:3.0/AV:N/AC:L/PR:N/UI:N/S:U/C:N/I:N/A:N
    cwe-id: CWE-200
    cpe: cpe:2.3:a:microfocus:filr:*:*:*:*:*:*:*:*
  metadata:
    verified: true
    max-request: 2
    vendor: microfocus
    product: filr
    shodan-query:
      - "http.html:\"Micro Focus Filr\""
      - http.html:"micro focus filr"
    fofa-query: body="micro focus filr"
  tags: panel,microfocus,filr,detect,discovery
http:
  - method: GET
    path:
      - "{{BaseURL}}/filr/login"
      - "{{BaseURL}}/login"

    stop-at-first-match: true

    matchers-condition: and
    matchers:
      - type: word
        part: body
        words:
          - "Micro Focus Filr"
          - "Filr Appliance"
        condition: or

      - type: status
        status:
          - 404
          - 200
        condition: or

    extractors:
      - type: regex
        part: body
        group: 1
        regex:
          - '(?i)\s+([0-9-]+)\s+Micro\s+Focus'
