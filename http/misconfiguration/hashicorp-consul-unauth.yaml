id: hashicorp-consul-unauth
info:
  name: Hashicorp Consul API 未授权
  author: pussycat0x
  severity: medium
  description: |
    检测到 Hashicorp Consul API 未授权。目标功能在未认证状态下可访问，可能暴露管理入口、业务数据、系统状态或可执行操作，需确认是否存在访问控制缺失。
  reference:
    - https://www.acunetix.com/vulnerabilities/web/hashicorp-consul-api-is-accessible-without-authentication/
  metadata:
    verified: true
    max-request: 1
    shodan-query: product:"Consul"
  tags: hashicorp,consul,unauth,misconfig,vuln

http:
  - method: GET
    path:
      - "{{BaseURL}}/v1/health/service/consul"

    matchers-condition: and
    matchers:
      - type: word
        part: body
        words:
          - "Node"
          - "Service"
          - "consul-network-segment"
        condition: and

      - type: status
        status:
          - 200
