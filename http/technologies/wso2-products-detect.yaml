id: wso2-products-detect

info:
  name: WSO2 Products 指纹识别（指纹识别）
  author: righettod
  severity: info
  description: >-
    WSO2 是企业 API 管理、身份认证和集成中间件产品线，用于 API 网关、身份管理和服务集成。该模板通过请求目标服务并检查预设路径或首页响应、页面正文关键字、状态码等指纹特征，判断目标是否使用或暴露了
    WSO2 Products 相关组件；命中结果仅表示指纹特征匹配，可用于资产盘点、技术栈识别和后续安全评估，不代表已确认存在可利用漏洞。
  metadata:
    max-request: 1
  tags: tech,wso2,discovery
http:
  - method: GET
    path:
      - "{{BaseURL}}/services/Version"

    matchers-condition: and
    matchers:
      - type: word
        words:
          - "version.services.core.carbon.wso2.org"

      - type: status
        status:
          - 200
