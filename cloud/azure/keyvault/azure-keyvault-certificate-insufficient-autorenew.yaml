id: azure-keyvault-certificate-insufficient-autorenew
info:
  name: Azure Key Vault 证书自动续期提前期不足（云安全）
  author: princechaddha
  severity: medium
  description: Azure Key Vault 证书生命周期策略可以在到期前触发自动续期；提前期过短会压缩签发、部署和依赖服务切换的时间窗口。本模板读取启用证书的 policy.lifetimeActions[*].trigger.daysBeforeExpiry，并将小于 30 天的值报告为自动续期提前期不足。
  impact: |
    - 证书续期、发布和服务重载可能无法在到期前完成，导致 TLS 服务、双向认证或依赖证书的 API 调用失败。
    - 证书过期还可能引发紧急人工替换，增加配置错误、回滚失败和业务中断风险。
  remediation: |
    - 将证书生命周期动作的 daysBeforeExpiry 调整为不少于 30 天，并确认动作类型确实包含 AutoRenew。
    - 检查签发机构、Key Vault 权限、部署流水线和续期告警，提前验证新证书能够被所有依赖服务加载。
  reference:
    - https://docs.microsoft.com/en-us/azure/key-vault/certificates/about-certificates
  metadata:
    vendor: microsoft
    product: azure-key-vault
  tags: cloud,devops,azure,microsoft,keyvault,azure-cloud-config

flow: |
  code(1);
  for (let VaultData of iterate(template.vaultNames)) {
    set("vaultName", VaultData);
    code(2);
    for (let CertificateData of iterate(template.certificateIDs)) {
      set("certificateID", CertificateData);
      code(3);
    }
  }

self-contained: true
code:
  - engine:
      - sh
      - bash
    source: |
      az keyvault list --query '[*].name' --output json

    extractors:
      - type: json
        name: vaultNames
        internal: true
        json:
          - '.[]'

  - engine:
      - sh
      - bash
    source: |
      az keyvault certificate list --vault-name $vaultName --query '[?(attributes.enabled==`true`)].id' --output json

    extractors:
      - type: json
        name: certificateIDs
        internal: true
        json:
          - '.[]'

  - engine:
      - sh
      - bash
    source: |
      az keyvault certificate show --id $certificateID --query 'policy.lifetimeActions[*].trigger.daysBeforeExpiry' --output json

    matchers:
      - type: dsl
        dsl:
          - compare_versions(certificateIDnum, concat("< ", 30))

    extractors:
      - type: json
        name: certificateIDnum
        internal: true
        json:
          - '.[]'

      - type: dsl
        dsl:
          - 'vaultName + " certificate ID " + certificateID + " has insufficient auto-renewal period"'
