id: x-recruiting-header

info:
  name: X-Recruiting 响应头检测
  author: geeknik
  severity: low
  description: |
    检测网站是否通过 HTTP 响应头发布招聘信息。该类头通常用于面向安全研究员或开发者展示招聘线索。
  impact: |
    - 命中内容可用于资产画像、人员/社群关联、公开目录发现或业务线索收集。
    - 单独结果通常不等同于漏洞，但与其他信息组合后可能降低攻击者侦察成本。
  remediation: |
    - 确认公开信息是否符合预期，移除不必要的联系人、目录、社群或资源索引。
    - 对必须公开的文件和链接进行最小化披露，避免包含内部路径或敏感标识。
    - 定期巡检公开页面，确保内容仍然准确且未泄露额外信息。
  reference:
    - https://webtechsurvey.com/response-header/x-recruiting
  metadata:
    verified: true
    max-request: 1
    shodan-query: "X-Recruiting:"
  tags: miscellaneous,misc,hiring,jobs,employment,generic,vuln

http:
  - method: GET
    path:
      - "{{BaseURL}}"

    redirects: true
    max-redirects: 2
    matchers:
      - type: word
        part: header
        words:
          - 'X-Recruiting:'

    extractors:
      - type: dsl
        dsl:
          - 'x_recruiting'
