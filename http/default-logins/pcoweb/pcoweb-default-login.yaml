id: pcoweb-default-login

info:
  name: pCOWeb 默认口令登录（弱口令）
  author: ritikchaddha
  severity: high
  description: |
    该模板用于检测 pCOWeb 是否仍可使用默认凭据或弱口令登录。模板主要向 `/config/pw_left_bar.html` 等认证入口发送请求，使用内置默认凭据组合进行认证尝试，并根据响应中的系统状态提示和 `pCOWeb` 标识等登录成功特征判断登录是否成功；命中说明目标未及时修改出厂、示例或初始化账号口令。
  impact: |
    - 攻击者可接管 pCOWeb 的 Web 管理界面，查看设备状态、网络配置、运行日志或敏感业务参数。
    - 被接管的网络、工控、打印、视频、存储或远程管理设备可能被用于中断业务、改变访问策略、窃取流量或作为内网横向移动入口。
  remediation: |
    - 立即修改所有默认账号口令，禁用不再使用的出厂账号，并为管理账户设置高强度唯一密码。
    - 将设备管理入口限制在 VPN、堡垒机或可信管理网段内，避免直接暴露到公网。
    - 升级设备固件或管理组件，审计近期登录记录、配置变更和异常会话。
  reference:
    - https://docs.librenms.org/Support/Device-Notes/Carel-pCOweb-Devices/#:~:text=Accessing%20the%20pCOWeb%20card,-Log%20on%20to&text=The%20default%20username%20and%20password%20is%20admin%2Ffadmin%20.
  metadata:
    verified: true
    max-request: 1
    shodan-query: title:"pCOWeb"
  tags: pcoweb,default-login,misconfig,vuln

variables:
  username: "admin"
  password: "fadmin"

http:
  - raw:
      - |
        GET /config/pw_left_bar.html HTTP/1.1
        Host: {{Hostname}}
        Authorization: Basic {{base64(username + ':' + password)}}

    host-redirects: true
    max-redirects: 2
    matchers-condition: and
    matchers:
      - type: word
        part: response
        words:
          - "System is using"
          - "pCOWeb"
          - "Configuration"
        condition: and

      - type: status
        status:
          - 200
