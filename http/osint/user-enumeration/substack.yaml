id: substack

info:
  name: substack.com 用户名信息枚举（OSINT）
  author: cheesymoon
  severity: info
  description: |
    对 substack.com 的用户名进行 OSINT 枚举检查。模板请求公开路径 https://substack.com/@用户名，当响应满足预期条件且页面或响应内容命中 “No people found for”、“handle\":\"用户名\"” 等用户资料页特征时，判定目标用户名可能存在。
  classification:
    cvss-metrics: CVSS:3.1/AV:N/AC:L/PR:N/UI:N/S:U/C:N/I:N/A:N
    cvss-score: 0
    cwe-id: CWE-200
  metadata:
    max-request: 1
  tags: osint,substack,discovery

self-contained: true

http:
  - method: GET
    path:
      - "https://substack.com/@{{user}}"

    matchers-condition: and
    matchers:
      - type: word
        part: body
        words:
          - "No people found for"
        negative: true

      - type: word
        part: body
        words:
          - 'handle\":\"{{user}}\"'
