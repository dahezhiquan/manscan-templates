id: apache-php-xampp-default-page

info:
  name: XAMPP 默认页面 指纹识别（指纹识别）
  author: dhiyaneshDK
  severity: info
  description: XAMPP 默认页面 是集成 Apache、PHP、MariaDB 等组件的本地 Web 开发环境。该模板请求 `/dashboard/`，并依据 HTTP 200 状态码、页面标题、正文关键字或品牌资源特征识别目标是否使用或暴露了 XAMPP 默认页面 相关组件，适用于资产盘点、技术栈识别和后续安全评估；命中结果仅表示指纹特征匹配，不代表已确认存在可利用漏洞。
  classification:
    cpe: cpe:2.3:a:apachefriends:xampp:*:*:*:*:*:*:*:*
  metadata:
    max-request: 1
    vendor: apachefriends
    product: xampp
    shodan-query: http.title:"XAMPP"
  tags: tech,php,xampp,apache,discovery

http:
  - method: GET
    path:
      - '{{BaseURL}}/dashboard/'

    matchers-condition: and
    matchers:
      - type: word
        words:
          - '<title>Welcome to XAMPP</title>'

      - type: status
        status:
          - 200
