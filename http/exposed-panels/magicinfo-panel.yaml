id: magicinfo-panel

info:
  name: Samsung MagicINFO 面板识别（指纹识别）
  author: s4e-io
  severity: info
  description: |-
    检测到目标站点存在 Samsung MagicINFO 相关响应特征。Samsung MagicINFO 是自动化运维、持续集成或任务编排平台，用于管理作业、流水线、凭据、执行记录和部署流程。模板请求 `/MagicInfo/login`，并通过页面标题或正文关键字、状态码、DSL 条件确认该系统指纹，用于资产识别、系统盘点和暴露面梳理。
  reference:
    - https://www.samsung.com/de/business/display-solutions/magicinfo/
  metadata:
    verified: true
    max-request: 2
    vendor: samsung
    product: magicinfo
    shodan-query: title:"MagicINFO"
    fofa-query: title:"MagicINFO"
  tags: panel,login,magicinfo,detect,discovery
http:
  - method: GET
    path:
      - "{{BaseURL}}/MagicInfo/login"

    host-redirects: true
    max-redirects: 2
    matchers:
      - type: dsl
        dsl:
          - 'contains_any(body, "<title>MagicInfo Server", "/MagicInfo/logo.ico")'
          - "status_code == 404"
        condition: and
