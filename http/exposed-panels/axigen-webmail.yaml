id: axigen-webmail

info:
  name: Axigen WebMail Panel 识别（暴露面识别）
  author: dhiyaneshDk,idealphase
  severity: medium
  description: |-
    检测到目标站点暴露 Axigen WebMail Panel 相关面板或登录入口。Axigen WebMail Panel 是 Web 邮件或协作门户，用于用户通过浏览器收发邮件、管理联系人、日程或组织通信数据。模板请求 `/`，并通过状态码、正则特征确认入口可访问；此类面板若直接暴露在公网，会增加账号枚举、口令攻击、漏洞匹配和未授权访问尝试的机会。
  impact: |-
    - 攻击者可确认目标部署了 Axigen WebMail Panel 或相关组件，并据此开展账号枚举、口令喷洒、默认凭据尝试或针对性漏洞匹配。
    - 若面板存在弱口令、默认配置、访问控制缺陷或未修复漏洞，可能导致后台权限被获取、配置被篡改、敏感数据泄露或业务系统被接管。
    - 管理入口长期暴露在公网会扩大攻击面，增加自动化扫描、撞库、社会工程和后续横向移动的风险。
  remediation: |-
    - 将 Axigen WebMail Panel 面板限制在内网、VPN、堡垒机或可信源 IP 访问范围内，避免管理入口直接暴露在公网。
    - 启用强密码、多因素认证、登录失败限制和默认账户清理，定期审计登录日志与管理员账号权限。
    - 保持系统和相关组件更新到受支持版本，关闭不必要的管理路径，并在必须公网访问时增加反向代理访问控制、WAF 或零信任访问策略。
  reference:
    - https://www.axigen.com/
  classification:
    cwe-id: CWE-200
    cpe: cpe:2.3:a:axigen:axigen_mail_server:*:*:*:*:*:*:*:*
  metadata:
    max-request: 1
    shodan-query: http.title:"Axigen WebMail"
    product: axigen_mail_server
    vendor: axigen
  tags: axigen,panel,discovery
http:
  - method: GET
    path:
      - "{{BaseURL}}"

    matchers-condition: and
    matchers:
      - type: regex
        regex:
          - '(?i)(Axigen WebMail)'
          - '<title>Axigen Standard Webmail - (.*)</title>'
        condition: or

      - type: status
        status:
          - 200

    extractors:
      - type: regex
        group: 1
        part: body
        regex:
          - '<script type="text\/javascript" src="js\/lib_login\.js\?v=(.+)"><\/script>'
