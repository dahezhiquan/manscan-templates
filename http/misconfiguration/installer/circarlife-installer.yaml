id: circarlife-installer

info:
  name: CirCarLife 安装向导
  author: geeknik
  severity: critical
  description: |
    该模板用于核查 CirCarLife 安装向导。该类问题通常源于安装、初始化、升级或配置向导在部署完成后仍可从公网访问。模板会向目标发送探测请求，并依据请求 `/html/setup.html`、匹配 `CirCarLife Scada`、匹配 `<title>- setup</title>`、匹配 `Network setup`等证据确认目标是否存在该配置问题。
  impact: |
    - 攻击者可能完成初始化流程、创建管理员账户、覆盖配置或触发升级逻辑。
    - 在部分系统中，暴露安装入口还可能导致数据库连接信息泄露、站点被重新配置或业务被接管。
  remediation: |
    - 完成部署后立即删除、禁用或限制安装与升级入口。
    - 对初始化流程增加来源限制和一次性安装校验，避免公网直接访问。
    - 检查系统是否已被异常初始化或创建未知管理员账户，并轮换相关凭据。
  reference:
    - https://circontrol.com/
  classification:
    cvss-metrics: CVSS:3.1/AV:N/AC:L/PR:N/UI:N/S:U/C:L/I:H/A:H
    cvss-score: 9.4
    cwe-id: CWE-284
    cpe: cpe:2.3:h:circontrol:circarlife:*:*:*:*:*:*:*:*
  metadata:
    verified: true
    max-request: 1
    shodan-query: title:"- setup" html:"Modem setup"
    product: circarlife
    vendor: circontrol
  tags: scada,circontrol,circarlife,setup,exposure,panel,installer,misconfig,vuln

http:
  - method: GET
    path:
      - "{{BaseURL}}/html/setup.html"

    matchers-condition: and
    matchers:
      - type: word
        part: header
        words:
          - "CirCarLife Scada"

      - type: word
        words:
          - "<title>- setup</title>"
          - "Network setup"
          - "Modem setup"
          - "Security setup"
        condition: and

      - type: status
        status:
          - 200
