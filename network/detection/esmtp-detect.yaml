id: esmtp-detect

info:
  name: ESMTP 识别（指纹识别）
  author: dahezhiquan
  severity: info
  description: |
    ESMTP 是支持扩展能力协商的 SMTP 服务。该模板识别服务端 `220` 欢迎横幅中的 ESMTP 标识；25、2525、587/TCP 使用明文连接，465/TCP 使用隐式 TLS，不再仅限于 Postfix。
  reference:
    - https://nmap.org/nsedoc/scripts/smtp-open-relay.html
  classification:
    cvss-metrics: CVSS:3.1/AV:N/AC:L/PR:N/UI:N/S:U/C:N/I:N/A:N
    cwe-id: CWE-200
  metadata:
    verified: true
    max-request: 2
    shodan-query: ESMTP
  tags: network,detect,smtp,esmtp,mail,tcp,discovery

flow: tcp(1) || tcp(2)

tcp:
  - host:
      - "{{Hostname}}"
    port: 25,2525,587
    read-size: 2048

    matchers:
      - type: regex
        part: data
        regex:
          - '(?im)^220[ -][^\r\n]*\bESMTP\b'

  - host:
      - "tls://{{Hostname}}"
    port: 465
    read-size: 2048
    matchers:
      - type: regex
        part: data
        regex:
          - '(?im)^220[ -][^\r\n]*\bESMTP\b'
