id: azure-apim-user-assigned-id-not-used
info:
  name: Azure API Management 未使用用户分配托管身份（云安全）
  author: princechaddha
  severity: medium
  description: APIM 实例仅使用系统分配身份或未配置托管身份时，无法使用具有稳定标识和独立生命周期的用户分配托管身份访问 Key Vault 等 Azure 资源。该模板查询 identity.type，并在返回 SystemAssigned 或 none 时报告未使用用户分配身份。
  impact: |
    - APIM 重建或迁移后系统身份可能变化，依赖该身份的授权需要重新配置，造成服务调用失败或恢复延迟。
    - 无法预先授权和跨资源复用稳定身份时，复杂部署中的密钥访问、权限审批和生命周期管理更难控制。
  remediation: |
    - 为需要独立生命周期或稳定主体标识的 APIM 场景创建 UserAssigned 身份，并仅授予所需资源范围的最小权限。
    - 限制用户分配身份的复用范围，定期审计角色分配、Key Vault 访问和身份删除后的残留授权。
  reference:
    - https://docs.microsoft.com/en-us/azure/api-management/how-to-use-managed-service-identity
  metadata:
    vendor: microsoft
    product: azure-api-management
  tags: cloud,devops,azure,microsoft,apim,azure-cloud-config

flow: |
  code(1);
  for (let APIMData of iterate(template.apimList)) {
    APIMData = JSON.parse(APIMData);
    set("name", APIMData.name);
    set("resourceGroup", APIMData.resourceGroup);
    code(2);
  }

self-contained: true
code:
  - engine:
      - sh
      - bash
    source: |
      az apim list --output json --query '[*].{name:name, resourceGroup:resourceGroup}'

    extractors:
      - type: json
        name: apimList
        internal: true
        json:
          - '.[]'

  - engine:
      - sh
      - bash
    source: |
      az apim show --name "$name" --resource-group "$resourceGroup" --query 'identity.type'

    matchers-condition: and
    matchers:
      - type: word
        words:
          - 'SystemAssigned'
          - 'none'

    extractors:
      - type: dsl
        dsl:
          - 'name + " in " + resourceGroup + " does not use user-assigned managed identities"'
