id: nagios-panel

info:
  name: Nagios 登录面板识别（暴露面识别）
  author: ritikchaddha
  severity: info
  description: 该模板通过识别 Nagios 登录入口的页面标题、特征文本或重定向行为，判断目标是否暴露了对应的认证界面。若命中，说明该登录面板对外可访问，可用于暴露面梳理与后续安全评估。
  classification:
    cvss-metrics: CVSS:3.0/AV:N/AC:L/PR:N/UI:N/S:U/C:N/I:N/A:N
    cwe-id: CWE-200
    cpe: cpe:2.3:a:nagios:nagios:*:*:*:*:*:*:*:*
  metadata:
    verified: true
    max-request: 2
    vendor: nagios
    product: nagios
    shodan-query: http.title:"nagios"
    fofa-query: title="nagios"
    google-query: intitle:"nagios"
  tags: panel,nagios,discovery

http:
  - method: GET
    path:
      - "{{BaseURL}}/nagios"
      - "{{BaseURL}}/nagios3"

    stop-at-first-match: true

    matchers-condition: and
    matchers:
      - type: word
        part: header
        words:
          - 'Nagios Access'

      - type: status
        status:
          - 401
