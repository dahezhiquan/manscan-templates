id: azure-storage-byok-not-used
info:
  name: Azure Storage 未使用 BYOK（云安全）
  author: princechaddha
  severity: high
  description: Azure Storage 默认使用平台托管密钥进行服务端加密，客户管理密钥或 BYOK 可让组织控制密钥轮换、撤销和访问审批。本模板枚举存储账户，查询 encryption.keyVaultProperties.keyName，并在输出为空时报告未配置 BYOK 密钥。
  impact: |
    - 组织无法独立控制静态数据加密所依赖的密钥生命周期，可能无法满足客户持钥、密钥隔离或监管要求。
    - 在密钥吊销和租户退出等场景中，缺少客户密钥控制会降低数据访问边界的独立治理能力。
  remediation: |
    - 在 Key Vault 或 Managed HSM 中创建客户管理密钥，配置 Storage 受管身份和最小密钥权限。
    - 将存储账户切换到客户管理密钥前验证密钥可用性、轮换策略、网络访问和故障恢复流程。
  reference:
    - https://docs.microsoft.com/en-us/azure/storage/common/storage-encryption-keys-manage
  metadata:
    vendor: microsoft
    product: azure-storage
  tags: cloud,devops,azure,microsoft,storage,azure-cloud-config

flow: |
  code(1);
  for (let StorageData of iterate(template.storageList)) {
    StorageData = JSON.parse(StorageData);
    set("name", StorageData.Name);
    code(2);
  }

self-contained: true
code:
  - engine:
      - sh
      - bash
    source: |
      az storage account list --query '[*].{"Name":name}'

    extractors:
      - type: json
        name: storageList
        internal: true
        json:
          - '.[]'

  - engine:
      - sh
      - bash
    source: |
      az storage account show --name "$name" --query 'encryption.keyVaultProperties.keyName' --output json

    matchers:
      - type: word
        words:
          - ''

    extractors:
      - type: dsl
        dsl:
          - 'name + " Storage Account is not using BYOK"'
