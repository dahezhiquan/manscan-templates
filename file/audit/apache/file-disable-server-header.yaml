id: file-disable-server-header

info:
  name: Apache2 Server 头信息未收敛（本地文件安全扫描）
  author: pussycat0x
  severity: medium
  description: |
    Apache 的 `ServerTokens` 和 `ServerSignature` 会影响响应头、目录列表或错误页中暴露的服务器版本与模块信息。过于详细的指纹可帮助攻击者匹配公开漏洞和选择利用路径。本模板在配置文件中识别 Apache 段，并检查是否缺少 `ServerTokens Prod` 与 `ServerSignature Off` 的组合配置；命中后仍需确认最终生效配置和实际响应。
  impact: |
    - 版本、模块和主机信息泄露会降低攻击者的侦察成本，帮助其针对具体 Apache 组件测试已知漏洞。
    - 详细错误页还可能暴露路径、代理关系和部署结构，增加信息泄露范围。
  remediation: |
    - 设置 `ServerTokens Prod` 和 `ServerSignature Off`，并确认虚拟主机、目录级配置没有覆盖全局设置。
    - 通过统一错误页、关闭目录列表和移除调试信息减少其他响应中的版本与路径泄露。
    - 重载服务后检查响应头及错误页，确认实际输出已收敛。
  reference:
    - https://httpd.apache.org/docs/2.4/mod/core.html#servertokens
    - https://httpd.apache.org/docs/2.4/mod/core.html#serversignature
  metadata:
    verified: true
  tags: audit,config,file,apache,hardening

file:
  - extensions:
      - conf

    matchers-condition: and
    matchers:
      - type: word
        words:
          - "<Directory"
          - "<FilesMatch"
        condition: and

      - type: word
        words:
          - "ServerTokens Prod"
          - "ServerSignature Off"
        condition: and
        negative: true
