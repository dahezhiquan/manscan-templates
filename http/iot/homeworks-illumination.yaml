id: homeworks-illumination

info:
  name: HomeWorks Illumination Web 键盘面板（IOT）
  author: geeknik
  severity: low
  description: |
    检测到 HomeWorks Illumination Web Keypad 面板。该面板用于照明控制系统，公网暴露可能泄露智能照明或楼宇控制入口。
  impact: |
    - 工业控制、楼宇自动化或能源设备面板暴露可能泄露设施运行状态和控制系统入口。
    - 若存在弱口令或历史漏洞，可能影响生产、楼控、供电或环境控制的安全边界。
  remediation: |
    - 将 OT/IoT 管理页面放置在隔离网络中，仅允许可信运维主机或 VPN 访问。
    - 启用强认证、最小权限和设备访问审计，及时更新厂商固件。
    - 避免将控制设备直接暴露到互联网，并监控异常登录和配置变更。
  reference:
    - https://www.lutron.com
  metadata:
    verified: true
    max-request: 1
    shodan-query: html:"HomeWorks Illumination Web Keypad"
  tags: misconfig,iot,homeworks,discovery

http:
  - method: GET
    path:
      - "{{BaseURL}}"

    matchers-condition: and
    matchers:
      - type: word
        words:
          - "HomeWorks Illumination Web Keypad"
          - "Lutron HomeWorks"
        condition: and

      - type: status
        status:
          - 200
