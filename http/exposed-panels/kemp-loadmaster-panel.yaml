id: kemp-loadmaster-panel

info:
  name: Progress Kemp LoadMaster 面板识别（指纹识别）
  author: rxerium
  severity: info
  description: |-
    检测到目标站点存在 Progress Kemp LoadMaster 相关响应特征。Progress Kemp LoadMaster 是远程访问、VPN 或应用交付入口，用于向用户提供企业应用、内网资源或负载均衡服务。模板请求 `/`，并通过页面标题或正文关键字、状态码确认该系统指纹，用于资产识别、系统盘点和暴露面梳理。
  reference:
    - https://kemptechnologies.com/
  metadata:
    verified: true
    max-request: 1
    shodan-query: html:"Kemp Login Screen"
  tags: login,progress,kemp,loadmaster,panel,detect,discovery
http:
  - method: GET
    path:
      - "{{BaseURL}}"

    host-redirects: true
    max-redirects: 2

    matchers-condition: and
    matchers:
      - type: word
        part: body
        words:
          - "<title>Kemp Login Screen</title>"

      - type: status
        status:
          - 200
