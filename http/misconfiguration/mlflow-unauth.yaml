id: mlflow-unauth

info:
  name: Mlflow 未授权 访问
  author: pussycat0x
  severity: high
  description: |
    检测到 Mlflow 未授权 访问。目标功能在未认证状态下可访问，可能暴露管理入口、业务数据、系统状态或可执行操作，需确认是否存在访问控制缺失。
  remediation: |
    - 为相关管理界面和 API 启用强认证、授权校验和最小权限控制。
    - 将后台端点限制在可信网络或 VPN 内，并记录访问审计日志。
  metadata:
    verified: true
    max-request: 1
    shodan-query: http.title:"mlflow"
    product: mlflow
    vendor: lfprojects
    fofa-query:
      - app="mlflow"
      - title="mlflow"
    google-query: intitle:"mlflow"
  tags: unauth,mlflow,oss,misconfig,vuln

http:
  - method: GET
    path:
      - "{{BaseURL}}/ajax-api/2.0/preview/mlflow/experiments/get?experiment_id=0"

    matchers-condition: and
    matchers:
      - type: word
        part: body
        words:
          - "experiment_id"
          - "name"
          - "artifact_location"
        condition: and

      - type: status
        status:
          - 200
