id: unauthenticated-lansweeper

info:
  name: 未授权 Lansweeper Instance
  author: divya_mudgal
  severity: high
  description: |
    检测到 未授权 Lansweeper Instance。目标功能在未认证状态下可访问，可能暴露管理入口、业务数据、系统状态或可执行操作，需确认是否存在访问控制缺失。
  metadata:
    max-request: 1
  tags: lansweeper,unauth,misconfig,vuln

http:
  - method: GET
    path:
      - "{{BaseURL}}/Default.aspx"

    matchers:
      - type: word
        words:
          - "Main page - Lansweeper"
