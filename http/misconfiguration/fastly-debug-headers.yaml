id: fastly-debug-headers

info:
  name: Fastly CDN 调试 响应头 暴露
  author: pussycat0x
  severity: low
  description: |
    该模板用于核查 Fastly CDN 调试 响应头 暴露。该类问题通常源于 HTTP 安全响应头、重定向策略或浏览器安全策略配置不完整。模板会向目标发送探测请求，并依据请求 ``等证据确认目标是否存在该配置问题。
  impact: |
    - 缺失或错误的安全响应头会削弱浏览器侧防护，增加 XSS、点击劫持、降级访问或策略绕过风险。
    - 错误的 HTTPS 到 HTTP 重定向可能让敏感请求暴露在明文链路中。
  remediation: |
    - 按业务需要配置 HSTS、CSP、X-Frame-Options、X-Content-Type-Options、Referrer-Policy 等安全响应头。
    - 避免把 HTTPS 请求降级重定向到 HTTP，统一使用安全协议和正确的跳转规则。
    - 上线后通过自动化检查和网关策略持续验证响应头配置。
  reference:
    - https://www.fastly.com/documentation/reference/http/http-headers/Fastly-Debug/
  metadata:
    max-request: 1
    verified: true
    shodan-query: 'X-Served-By: cache'
  tags: fastly,cdn,exposure,misconfig

http:
  - method: GET
    path:
      - "{{BaseURL}}"

    headers:
      Fastly-Debug: "1"

    matchers-condition: or
    matchers:
      - type: regex
        name: fastly-debug-path
        part: header
        regex:
          - '(?i)fastly-debug-path:\s*.+'

      - type: regex
        name: fastly-debug-ttl
        part: header
        regex:
          - '(?i)fastly-debug-ttl:\s*.+'

      - type: regex
        name: fastly-debug-digest
        part: header
        regex:
          - '(?i)fastly-debug-digest:\s*.+'
