id: ics-aspect-control-panel

info:
  name: ASPECT Control 面板识别（指纹识别）
  author: JustaAcat,darses
  severity: info
  description: |-
    检测到目标站点存在 ASPECT Control 相关响应特征。ASPECT Control 是工业控制、能源、楼宇自动化或 HMI/SCADA 场景中的管理界面，用于监控设备状态、过程数据和现场控制相关配置。模板请求 `/`，并通过页面标题或正文关键字、状态码确认该系统指纹，用于资产识别、系统盘点和暴露面梳理。
  classification:
    cvss-metrics: CVSS:3.1/AV:N/AC:L/PR:N/UI:N/S:U/C:N/I:N/A:N
    cwe-id: CWE-200
    cpe: cpe:2.3:h:abb:aspect-ent-256:*:*:*:*:*:*:*:*
  metadata:
    verified: true
    max-request: 1
    shodan-query:
      - title:"ASPECT Control Panel"
      - http.favicon.hash:1011076161
      - http.favicon.hash:-1849398868
      - ssl.cert.subject.cn:"aspect.local"
      - http.html:'src="libjs/pngfix.js"'
    product: aspect-ent-256
    vendor: abb
  tags: detect,panel,aspect,login,abb,ics,discovery
http:
  - method: GET
    path:
      - "{{BaseURL}}"

    matchers-condition: and
    matchers:
      - type: word
        words:
          - "<title>ASPECT Control Panel"
          - 'src="libjs/pngfix.js"'
        condition: or

      - type: status
        status:
          - 200
