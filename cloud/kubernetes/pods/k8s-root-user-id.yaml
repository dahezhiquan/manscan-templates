id: k8s-root-user-id

info:
  name: Pods run 使用root user ID（云安全）
  author: princechaddha
  severity: low
  description: Pod 容器以 UID 0 运行会使应用在容器内拥有 root 权限，增加漏洞利用后的影响范围。本模板枚举 Pod 容器，发现 securityContext.runAsUser 等于 0 时报告。
  impact: |
    - 攻击者获取应用执行能力后可用 root 身份修改文件、读取敏感挂载或配合能力提升攻击。
    - 与 hostPath、额外 capabilities 或特权配置结合时，节点侧风险显著增加。
  remediation: |
    - 将容器配置为非 0 UID 运行，并设置 runAsNonRoot 为 true。
    - 在镜像中创建最小权限用户，避免应用依赖 root 权限启动。
  reference:
    - https://kubernetes.io/docs/tasks/configure-pod-container/security-context/
  metadata:
    vendor: kubernetes
    product: kubernetes
  tags: cloud,devops,kubernetes,devsecops,pods,k8s-cluster-security
flow: |
  code(1);
  for (let pod of template.items) {
    set("pod", pod)
    javascript(1);
  }

self-contained: true
code:
  - engine:
      - sh
      - bash
    source: kubectl get pods --all-namespaces --output=json
    extractors:
      - type: json
        name: items
        internal: true
        json:
          - '.items[] | {pod: .metadata.name, containers: .spec.containers}'

javascript:
  - code: |
        let podData = JSON.parse(template.pod);
        podData.containers.forEach(container => {
          if (container.securityContext && container.securityContext.runAsUser === 0) {
            let result = (`Container '${container.name}' in pod '${podData.pod}' is running with root user ID.`);
            Export(result);
          }
        });

    extractors:
      - type: dsl
        dsl:
          - response
