id: openscada-panel

info:
  name: OpenSCADA 面板（暴露面识别）
  author: rxerium
  severity: info
  description: |
    该模板用于识别 OpenSCADA 是否存在对外暴露的管理、服务或状态界面。若命中，说明目标公开了相关功能入口，可作为资产盘点与攻击面收敛的依据。
  reference:
    - https://oscada.org
    - https://sourceforge.net/projects/oscada/
  metadata:
    max-request: 1
    verified: true
    vendor: OpenSCADA
    product: openscada
    shodan-query: 'http.title:"OpenSCADA" port:10002'
  tags: panel,ics,scada,openscada,discovery

http:
  - method: GET
    path:
      - '{{BaseURL}}'

    host-redirects: true
    max-redirects: 2

    matchers-condition: and
    matchers:
      - type: word
        part: body
        words:
          - '<title>OpenSCADA'
          - 'OpenSCADA'
          - 'WorkStation'
        condition: or

      - type: status
        status:
          - 200
