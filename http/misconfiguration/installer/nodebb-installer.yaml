id: nodebb-installer

info:
  name: NodeBB Web 安装向导
  author: DhiyaneshDk
  severity: high
  description: |
    检测到 NodeBB Web 安装向导。该页面属于安装、初始化或配置向导流程，若对外暴露，攻击者可能完成初始化、创建管理员账户或重新配置目标系统。
  classification:
    cpe: cpe:2.3:a:nodebb:nodebb:*:*:*:*:*:*:*:*
  metadata:
    verified: true
    max-request: 1
    vendor: nodebb
    product: nodebb
    shodan-query: title:"NodeBB Web Installer"
  tags: misconfig,nodebb,install,exposure,vuln

http:
  - method: GET
    path:
      - '{{BaseURL}}'

    matchers-condition: and
    matchers:
      - type: word
        part: body
        words:
          - 'NodeBB Web Installer'
          - 'Create an Administrator account'
        condition: and

      - type: word
        part: header
        words:
          - 'text/html'

      - type: status
        status:
          - 200
