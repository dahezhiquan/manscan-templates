id: authelia-panel

info:
  name: Authelia 面板识别（暴露面识别）
  author: rxerium
  severity: info
  description: |
    该模板通过识别 Authelia 面板、控制台或管理界面的页面特征，判断目标是否暴露了对应服务入口。若命中，说明该后台或运维界面对外可访问，可用于资产识别与暴露面排查。
  reference:
    - https://github.com/authelia/authelia
    - https://www.authelia.com/
  classification:
    cpe: cpe:2.3:a:authelia:authelia:*:*:*:*:*:*:*:*
  metadata:
    verified: true
    max-request: 1
    vendor: authelia
    product: authelia
    shodan-query: title:"Login - Authelia"
  tags: login,panel,authelia,discovery

http:
  - method: GET
    path:
      - "{{BaseURL}}"

    matchers-condition: and
    matchers:
      - type: word
        words:
          - "<title>Login - Authelia</title>"

      - type: status
        status:
          - 200
