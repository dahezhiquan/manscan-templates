id: opensearch-dashboard-unauth

info:
  name: OpenSearch 仪表盘 未授权 访问
  author: ritikchaddha
  severity: high
  description: |
    检测到 OpenSearch 仪表盘 未授权 访问。目标功能在未认证状态下可访问，可能暴露管理入口、业务数据、系统状态或可执行操作，需确认是否存在访问控制缺失。
  reference:
    - https://opensearch.org/docs/latest/dashboards/index/
  metadata:
    verified: true
    max-request: 1
    shodan-query: title:"OpenSearch"
    fofa-query: title="OpenSearch"
  tags: opensearch,dashboard,misconfig,unauth,vuln

http:
  - raw:
      - |
        GET /app/home#/ HTTP/1.1
        Host: {{Hostname}}

    matchers-condition: and
    matchers:
      - type: word
        part: body
        words:
          - "/ui/fonts/source_sans_3/SourceSans3"
          - "font-family: 'Source Code Pro"
          - "OpenSearch"
        condition: and

      - type: status
        status:
          - 200
