id: unauthenticated-frp

info:
  name: FRPS Dashboard 识别（暴露面识别）
  author: pikpikcu
  severity: info
  description: 该模板通过识别 FRPS Dashboard 仪表盘或后台界面的页面特征，判断目标是否对外暴露了相关控制台。若命中，说明该服务面向外部可访问，可用于资产识别与访问控制核查。
  reference:
    - https://github.com/fatedier/frp/
  classification:
    cvss-metrics: CVSS:3.0/AV:N/AC:L/PR:N/UI:N/S:U/C:N/I:N/A:N
    cwe-id: CWE-200
  metadata:
    max-request: 1
  tags: frp,unauth,panel,discovery

http:
  - method: GET
    path:
      - "{{BaseURL}}/static/"

    matchers-condition: and
    matchers:
      - type: word
        words:
          - "<title>frps dashboard</title>"
        part: body

      - type: status
        status:
          - 200
