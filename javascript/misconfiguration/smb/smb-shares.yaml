id: smb-shares

info:
  name: SMB 共享枚举（服务漏洞）
  author: pussycat0x
  severity: low
  description: |
    目标 SMB 服务允许使用模板提供的凭据枚举共享列表及其访问属性，可能暴露内部目录结构。模板按内置账号组合发起 SMB 连接，并输出可见共享名称和权限信息。
  impact: |
    - 可枚举的 SMB 共享会暴露内部目录结构、共享命名和权限边界。
    - 若共享配置宽松，攻击者可能进一步读取敏感文件、写入恶意内容或发现凭据材料。
  remediation: |
    - 检查共享 ACL，移除不必要的读写权限和测试共享。
    - 对敏感共享启用访问审计，限制 SMB 端口来源，并避免普通账号枚举无关共享。
  reference:
    - https://nmap.org/nsedoc/scripts/smb-enum-shares.html
  metadata:
    verified: true
    max-request: 1
    shodan-query: port:445
  tags: js,network,smb,enum,auth

javascript:
  - pre-condition: |
      isPortOpen(Host, Port);

    code: |
      try {
          var smb = require("nuclei/smb");
          var client = smb.SMBClient();

          var shares = client.ListShares(Host, Port, User, Pass);

          if (shares && shares.length > 0) {
              Export(shares);
          } else {
              Export([]);
          }
      } catch (e) {
          Export([]);
      }

    args:
      Host: "{{Host}}"
      Port: "445"
      User: "{{username}}"
      Pass: "{{password}}"

    attack: clusterbomb
    threads: 1
    stop-at-first-match: true

    payloads:
      username:
        - ""
        - administrator
        - admin
        - guest

      password:
        - ""
        - administrator
        - admin
        - password
        - guest

    matchers:
      - type: dsl
        dsl:
          - success == true
          - response != "[]"
        condition: and

    extractors:
      - type: dsl
        dsl:
          - response
