id: signoz-panel

info:
  name: SigNoz 面板检测（暴露面识别）
  author: ChrisJr404,rxerium
  severity: info
  description: |-
    SigNoz 是一款开源的监控平台，用于指标、追踪和日志。它包含一个 React 前端和一个 Go 查询服务，后者在 /api/v1/version 暴露了一个无需认证的版本接口。
  reference:
    - https://github.com/SigNoz/signoz
    - https://signoz.io/
  metadata:
    verified: false
    max-request: 2
    vendor: signoz
    product: signoz
    shodan-query: http.title:"SigNoz"
    fofa-query: title="SigNoz"
  tags: panel,signoz,observability,oss,detect

flow: http(1) && http(2)

http:
  - method: GET
    path:
      - "{{BaseURL}}"

    host-redirects: true
    max-redirects: 2

    matchers:
      - type: dsl
        dsl:
          - 'status_code == 200'
          - 'contains(to_lower(body), "signoz")'
        internal: true
        condition: and

  - method: GET
    path:
      - "{{BaseURL}}/api/v1/version"

    matchers:
      - type: dsl
        dsl:
          - 'status_code == 200'
          - 'contains(content_type, "application/json")'
          - 'contains_all(body, "\"version\"", "\"ee\"", "\"setupCompleted\"")'
        condition: and

    extractors:
      - type: regex
        part: body
        group: 1
        regex:
          - '"version"\s*:\s*"([^"]+)"'
