id: editor-exposure

info:
  name: Editor 配置文件检测（暴露面识别）
  author: DhiyaneshDk,daffainfo
  severity: low
  description: 检测到对外可访问的 Editor 配置文件。这类配置资源可能包含部署细节、访问凭据、内部地址、组件版本或调试开关，公开暴露后会显著增加被侦察和后续利用的风险。
  metadata:
    verified: true
    max-request: 1
    shodan-query: html:"editorconfig"
  tags: config,exposure,vuln

http:
  - method: GET
    path:
      - "{{BaseURL}}/.editorconfig"

    matchers-condition: and
    matchers:
      - type: word
        part: body
        words:
          - "= true"
          - "indent_style"
        condition: and

      - type: word
        part: header
        words:
          - "application/json"
          - "text/html"
        negative: true
        condition: or

      - type: status
        status:
          - 200
