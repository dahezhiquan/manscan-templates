id: automatisch-panel

info:
  name: Automatisch 面板识别（指纹识别）
  author: rxerium
  severity: info
  description: |-
    检测到目标站点存在 Automatisch 相关响应特征。Automatisch 是自动化或工作流编排平台，用于连接应用、执行流程、管理任务和调度业务自动化。模板请求 `/`、`/login` 路径，并通过页面标题或正文关键字、状态码确认该系统指纹，用于资产识别、系统盘点和暴露面梳理。
  reference:
    - https://automatisch.io/
    - https://github.com/automatisch/automatisch
  metadata:
    verified: true
    max-request: 2
    shodan-query: title:"Automatisch"
  tags: panel,automatisch,detect,discovery
http:
  - method: GET
    path:
      - "{{BaseURL}}"
      - "{{BaseURL}}/login"

    stop-at-first-match: true

    matchers-condition: and
    matchers:
      - type: word
        words:
          - '<title>Automatisch'

      - type: status
        status:
          - 200
