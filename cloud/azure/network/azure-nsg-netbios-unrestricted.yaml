id: azure-nsg-netbios-unrestricted
info:
  name: Azure NSG 对互联网开放 NetBIOS 端口（云安全）
  author: princechaddha
  severity: high
  description: NetBIOS 使用 UDP 137、138 和 TCP 139 提供名称解析、数据报及会话服务，属于不应直接暴露在互联网的传统 Windows 网络协议。本模板查询入站允许的 TCP 139 或 UDP 137/138 NSG 规则，并在来源地址为 *、internet 或 any 时报告。
  impact: |
    - 公开 NetBIOS 可能泄露主机名、工作组和共享信息，并为口令攻击、SMB 攻击和横向移动提供入口。
    - 受影响主机的共享资源或凭据被利用后，可能造成敏感文件泄露和内部网络扩散。
  remediation: |
    - 删除面向互联网的 NetBIOS 入站规则，优先使用现代名称解析和私有网络通信。
    - 对遗留依赖限制到专用网段，关闭不需要的文件共享服务并审计共享权限和异常认证。
  reference:
    - https://docs.microsoft.com/en-us/azure/virtual-network/network-security-groups-overview
  metadata:
    vendor: microsoft
    product: azure-network-security-group
  tags: cloud,devops,azure,microsoft,nsg,azure-cloud-config

flow: |
  code(1);
  for (let NsgData of iterate(template.nsgdata)) {
    NsgData = JSON.parse(NsgData)
    set("nsg", NsgData.name)
    set("resourcegroup", NsgData.resourceGroup)
    code(2)
  }

self-contained: true
code:
  - engine:
      - sh
      - bash
    source: |
      az network nsg list --query '[*].{name:name, resourceGroup:resourceGroup}' --output json

    extractors:
      - type: json
        name: nsgdata
        internal: true
        json:
          - '.[]'

  - engine:
      - sh
      - bash
    source: |
      az network nsg rule list --nsg-name $nsg --resource-group $resourcegroup --query "[?direction=='Inbound' && access=='Allow' && (protocol=='TCP' && destinationPortRange=='139' || protocol=='UDP' && (destinationPortRange=='137' || destinationPortRange=='138'))]"

    matchers:
      - type: word
        words:
          - '"sourceAddressPrefix": "*"'
          - '"sourceAddressPrefix": "internet"'
          - '"sourceAddressPrefix": "any"'

    extractors:
      - type: dsl
        dsl:
          - 'nsg + " has unrestricted access on NetBIOS ports"'
