id: tidb-unauth

info:
  name: TiDB 未认证访问（服务漏洞）
  author: lu4nx
  severity: high
  description: |
    TiDB 是兼容 MySQL 协议的分布式数据库。若 root 或其他账号被配置为空密码、信任式访问或访问控制过宽，外部人员可能无需有效凭据完成登录。该模板读取 TiDB 握手后发送 MySQL 兼容认证包，并通过成功响应字节序列确认未认证访问风险。
  impact: |
    - 攻击者可能读取、修改或删除 TiDB 中的业务数据，影响数据机密性和完整性。
    - 高权限未认证访问还可能被用于创建账号、修改权限、导出数据或执行高负载查询造成业务中断。
  remediation: |
    - 为 root 和业务账号设置强密码，禁用空密码、默认账号和不必要的远程高权限登录。
    - 限制 4000 端口访问来源，并按最小权限拆分应用、运维和只读账号。
    - 审计 TiDB 登录、SQL 和权限变更日志，排查暴露期间的异常操作。
  metadata:
    max-request: 1
    zoomeye-query: '"tidb" && port=4000'
  tags: network,tidb,unauth,misconfig,tcp,vuln

tcp:
  - inputs:
      - read: 1024              # skip handshake packet
      - data:   # authentication
        type: hex

    host:
      - "{{Hostname}}"
    port: 4000

    read-size: 1024

    matchers:
      - type: binary
        binary:
          # resp format:
          # 07: length, 02: sequence number, 00: success
          - "0700000200000002000000"
# digest: 4b0a00483046022100b6b6f633a433c84c263d16b00851388e2ca2c1c01be1e6206b4217d9c950433602210083bd10d0a947a9f8683f5cf94aec950a2c68cf9c03d4d4a6e1f645427923c41d:922c64590222798bb761d5b6d8e72950