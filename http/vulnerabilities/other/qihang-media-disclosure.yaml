id: qihang-media-disclosure

info:
  name: QiHang Media Web Digital Signage 3.0.9 - Cleartext Credentials Disclosure
  author: gy741
  severity: high
  description: |
    该模板用于检测 QiHang Media Web Digital Signage 3.0.9 - Cleartext Credentials Disclosure。该类问题通常源于调试页面、配置文件、接口响应或目录资源被非预期暴露。模板会向 `/xml/User/User.xml` 等位置发送探测请求，并结合响应状态、关键字、错误信息、时间差或外带交互等证据判断目标是否受影响。
  impact: |
    - 攻击者可获取系统版本、路径、账号、密钥、配置或业务数据等敏感信息。
    - 泄露的信息可能被用于后续漏洞匹配、凭据攻击、权限提升或横向移动。
  remediation: |
    - 关闭不必要的调试、示例、备份和信息展示接口，避免向未授权用户返回敏感内容。
    - 对敏感文件和接口增加访问控制，并从 Web 根目录移除备份、日志和配置文件。
    - 排查已泄露的凭据、令牌和配置，必要时执行轮换并检查访问日志。
  reference:
    - https://www.zeroscience.mk/en/vulnerabilities/ZSL-2020-5579.php
  classification:
    cvss-metrics: CVSS:3.0/AV:N/AC:L/PR:N/UI:N/S:C/C:L/I:L/A:L
    cvss-score: 8.3
    cwe-id: CWE-522
  metadata:
    max-request: 1
  tags: qihang,exposure,vuln

http:
  - method: GET
    path:
      - "{{BaseURL}}/xml/User/User.xml"

    matchers:
      - type: word
        part: body
        words:
          - "<?xml version"
          - "<Users>"
          - "account="
          - "password="
        condition: and
