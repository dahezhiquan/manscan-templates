id: lazy-file-manager

info:
  name: Lazy 文件 Manager 泄露（暴露面识别）
  author: amsda
  severity: medium
  description: 检测到对外可访问的 Lazy 文件 Manager。相关文件可能泄露项目结构、依赖关系、部署细节、敏感参数或其他不应公开的内部信息。
  metadata:
    max-request: 1
  tags: exposure,vuln

http:
  - method: GET
    path:
      - "{{BaseURL}}/lfm.php"

    matchers-condition: and
    matchers:
      - type: status
        status:
          - 200

      - type: word
        words:
          - Lazy File Manager
