id: typo3-detect

info:
  name: TYPO3 CMS 指纹识别（指纹识别）
  author: dadevel
  severity: info
  description: >-
    TYPO3 是企业级开源内容管理系统，用于构建多语言站点、门户和复杂内容应用。该模板通过请求目标服务并检查预设路径或首页响应、HTTP 响应头、页面正文关键字等指纹特征，判断目标是否使用或暴露了
    TYPO3 CMS 相关组件；命中结果仅表示指纹特征匹配，可用于资产盘点、技术栈识别和后续安全评估，不代表已确认存在可利用漏洞。
  classification:
    cpe: cpe:2.3:a:typo3:typo3:*:*:*:*:*:*:*:*
  metadata:
    max-request: 1
    vendor: typo3
    product: typo3
    shodan-query: http.component:"TYPO3"
  tags: tech,typo3,discovery
http:
  - method: GET
    path:
      - "{{BaseURL}}"

    host-redirects: true
    max-redirects: 2

    matchers-condition: or
    matchers:
      - type: word
        part: header
        case-insensitive: true
        words:
          - 'X-TYPO3-Parsetime:'

      - type: word
        part: body
        words:
          - '<meta name="generator" content="TYPO3'
