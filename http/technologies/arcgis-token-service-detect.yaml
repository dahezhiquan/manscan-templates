id: arcgis-token-service-detect

info:
  name: ArcGIS 令牌服务 指纹识别（指纹识别）
  author: HeeresS
  severity: info
  description: ArcGIS 令牌服务 是 Esri 地理信息系统平台，用于地图服务、空间数据、分析和 GIS 应用发布。该模板请求 `/arcgis/tokens/`，并依据 HTTP 200 状态码、页面标题、正文关键字或品牌资源特征识别目标是否使用或暴露了 ArcGIS 令牌服务 相关组件，适用于资产盘点、技术栈识别和后续安全评估；命中结果仅表示指纹特征匹配，不代表已确认存在可利用漏洞。
  reference:
  - https://enterprise.arcgis.com/en/
  classification:
    cpe: cpe:2.3:a:esri:arcgis_server:*:*:*:*:*:*:*:*
  metadata:
    verified: true
    max-request: 1
    vendor: esri
    product: arcgis_server
    shodan-query:
    - title:"ArcGIS"
    - http.title:"arcgis"
    fofa-query: title="arcgis"
    google-query: intitle:"arcgis"
  tags: tech,arcgis,token,detect,esri,discovery

http:
  - method: GET
    path:
      - '{{BaseURL}}/arcgis/tokens/'

    matchers-condition: and
    matchers:
      - type: word
        part: body
        words:
          - 'alt="ArcGIS Token Service'

      - type: status
        status:
          - 200
