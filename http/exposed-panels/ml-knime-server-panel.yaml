id: ml-knime-server-panel

info:
  name: KNIME Server / Business Hub WebPortal - 检测（指纹识别）
  author: rxerium
  severity: info
  description: |-
    检测到目标站点存在 KNIME Server / Business Hub WebPortal 相关响应特征。KNIME Server / Business Hub WebPortal 是自动化运维、持续集成或任务编排平台，用于管理作业、流水线、凭据、执行记录和部署流程。模板请求 `/`，并通过页面标题或正文关键字、状态码、favicon 哈希确认该系统指纹，用于资产识别、系统盘点和暴露面梳理。
  reference:
    - https://www.knime.com/knime-software/knime-server
    - https://www.knime.com/knime-business-hub
    - https://docs.knime.com/latest/business_hub_admin_guide/index.html
  metadata:
    verified: true
    max-request: 1
    vendor: knime
    product: knime_server
    shodan-query: 'html:"_login/_nuxt"'
  tags: panel,knime,ml,ai,data-science,detect,discovery
http:
  - method: GET
    path:
      - "{{BaseURL}}"

    host-redirects: true
    max-redirects: 2

    matchers-condition: and
    matchers:
      - type: word
        part: body
        words:
          - "webportal/_nuxt/theme/favicon"
          - "_login/_nuxt"
        condition: and

      - type: status
        status:
          - 200
