id: big-agi-panel

info:
  name: big-AGI 面板识别（指纹识别）
  author: rxerium
  severity: info
  description: |-
    检测到目标站点存在 big-AGI 相关响应特征。big-AGI 是 AI、LLM 或机器学习相关平台，用于管理模型、数据集、工作区、代理任务或可观测性信息。模板请求 `/`，并通过页面标题或正文关键字、状态码确认该系统指纹，用于资产识别、系统盘点和暴露面梳理。
  reference:
    - https://github.com/enricoros/big-AGI
    - https://big-agi.com
  metadata:
    verified: true
    max-request: 1
    vendor: big-agi
    product: big-agi
    shodan-query: 'http.title:"big-AGI"'
  tags: panel,big-agi,llm,ai,chat,detect,discovery
http:
  - method: GET
    path:
      - "{{BaseURL}}"

    host-redirects: true
    max-redirects: 2

    matchers-condition: and
    matchers:
      - type: word
        part: body
        words:
          - "big-AGI"
        case-insensitive: true

      - type: status
        status:
          - 200
