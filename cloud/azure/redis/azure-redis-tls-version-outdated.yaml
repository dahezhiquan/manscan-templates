id: azure-redis-tls-version-outdated
info:
  name: Azure Cache for Redis TLS 最低版本配置检查（云安全）
  author: princechaddha
  severity: medium
  description: Azure Cache for Redis 的 minimumTlsVersion 用于限定客户端可协商的最低 TLS 版本，过低的协议版本会降低传输安全基线。本模板枚举 Redis 实例并查询 MinimumTLSVersion；当前匹配器要求返回值包含版本格式中的句点且不包含 1.0 或 1.1，因此命中结果仍应结合实际返回值和组织基线复核，模板本身不会直接证明版本低于 1.2。
  impact: |
    - 如果实际最低版本低于 1.2，客户端可能协商较弱的 TLS 协议，增加窃听、中间人攻击和协议降级风险。
    - 低于组织安全基线的协议配置可能导致合规检查失败，并与现代客户端的安全策略不一致。
  remediation: |
    - 将 minimumTlsVersion 设置为 1.2 或更高的受支持版本，并确认所有客户端已完成兼容性验证。
    - 结合实际命中输出复核该模板的匹配结果，逐步淘汰旧协议客户端并监控 TLS 协商失败。
  reference:
    - https://docs.microsoft.com/en-us/azure/redis-cache/
  metadata:
    vendor: microsoft
    product: azure-cache-for-redis
  tags: cloud,devops,azure,microsoft,redis,azure-cloud-config

flow: |
  code(1);
  for (let RedisData of iterate(template.redisIdList)) {
    set("name", RedisData);
    code(2);
  }

self-contained: true
code:
  - engine:
      - sh
      - bash
    source: |
      az redis list --query '[*].{"id":id}'

    extractors:
      - type: json
        name: redisIdList
        internal: true
        json:
          - '.[]'

  - engine:
      - sh
      - bash
    source: |
      az redis show --ids "$name" --query '{"MinimumTLSVersion":minimumTlsVersion}'

    matchers-condition: and
    matchers:
      - type: word
        part: body
        words:
          - '1.0'
          - '1.1'
        negative: true

      - type: word
        part: body
        words:
          - '.'

    extractors:
      - type: dsl
        dsl:
          - 'name + " is using outdated TLS version"'
