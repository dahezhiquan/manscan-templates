id: gcloud-gke-vpc-native-disabled

info:
  name: GKE Clusters 未启用VPC-Native Traffic Routing（云安全）
  author: princechaddha
  severity: medium
  description: GKE VPC-native 集群通过 Alias IP 将 Pod 和 Service 纳入 VPC 地址规划与网络控制。本模板检查 ipAllocationPolicy.useIpAliases，字段为空时报告集群未启用 VPC-native 流量路由。
  impact: |
    - Pod 和 Service 流量难以统一使用 VPC 防火墙、路由、日志和私有服务访问能力。
    - 网络隔离、地址规划和集群间互联治理会受到限制。
  remediation: |
    - 新建集群时启用 VPC-native 和 Alias IP，并规划 Pod、Service CIDR。
    - 对现有非 VPC-native 集群评估迁移路线，避免因地址和网络配置冲突影响业务。
  reference:
    - https://cloud.google.com/kubernetes-engine/docs/how-to/alias-ips
    - https://www.trendmicro.com/cloudoneconformity/knowledge-base/gcp/GKE/enable-vpc-native-traffic-routing.html
  metadata:
    vendor: google
    product: google-kubernetes-engine
  tags: cloud,devops,gcp,gcloud,gke,kubernetes,security,networking,vpc,gcp-cloud-config

flow: |
  code(1)
  for(let projectId of iterate(template.projectIds)){
    set("projectId", projectId)
    code(2)
    for(let cluster of iterate(template.clusters)){
      cluster = JSON.parse(cluster)
      set("clusterName", cluster.name)
      set("location", cluster.location)
      code(3)
    }
  }

self-contained: true

code:
  - engine:
      - sh
      - bash
    source: |
      gcloud projects list --format="json(projectId)"

    extractors:
      - type: json
        name: projectIds
        internal: true
        json:
          - '.[].projectId'

  - engine:
      - sh
      - bash
    source: |
      gcloud container clusters list --project $projectId --format="json(name,location)"

    extractors:
      - type: json
        name: clusters
        internal: true
        json:
          - '.[]'

  - engine:
      - sh
      - bash
    source: |
      gcloud container clusters describe $clusterName --location $location --project $projectId --format="json(ipAllocationPolicy.useIpAliases)"

    matchers:
      - type: word
        words:
          - "null"

    extractors:
      - type: dsl
        dsl:
          - '"GKE cluster " + clusterName + " in " + location + " of project " + projectId + " does not have VPC-native traffic routing enabled"'
