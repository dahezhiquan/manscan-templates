id: dotcms-admin-panel

info:
  name: dotAdmin Login Panel 识别（暴露面识别）
  author: impramodsargar
  severity: info
  description: 该模板通过识别 dotAdmin Login 登录入口的页面标题、特征文本或重定向行为，判断目标是否暴露了对应的认证界面。若命中，说明该登录面板对外可访问，可用于暴露面梳理与后续安全评估。
  classification:
    cvss-metrics: CVSS:3.0/AV:N/AC:L/PR:N/UI:N/S:U/C:N/I:N/A:N
    cwe-id: CWE-200
    cpe: cpe:2.3:a:dotcms:dotcms:*:*:*:*:*:*:*:*
  metadata:
    max-request: 1
    vendor: dotcms
    product: dotcms
    shodan-query: http.title:"dotcms"
    fofa-query: title="dotcms"
    google-query: intitle:"dotcms"
  tags: panel,dotcms,cms,discovery

http:
  - method: GET
    path:
      - "{{BaseURL}}/dotAdmin/"

    matchers-condition: and
    matchers:
      - type: word
        words:
          - '<title>dotCMS Content Management Platform</title>'
