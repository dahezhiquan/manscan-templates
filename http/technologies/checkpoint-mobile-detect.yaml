id: checkpoint-mobile-detect

info:
  name: Check Point Mobile SSL VPN 指纹识别（指纹识别）
  author: righettod
  severity: info
  description: |-
    Check Point Mobile SSL VPN 是 Check Point 远程访问 VPN 门户，用于移动用户认证和内部资源访问。该模板请求 `/sslvpn/Login`，并依据 HTTP 403 状态码、页面标题、正文关键字或品牌资源特征识别目标是否使用或暴露了 Check Point Mobile SSL VPN 相关组件，适用于资产盘点、技术栈识别和后续安全评估；命中结果仅表示指纹特征匹配，不代表已确认存在可利用漏洞。
  reference:
  - https://www.checkpoint.com/quantum/remote-access-vpn/
  classification:
    cpe: cpe:2.3:a:checkpoint:mobile_access_portal_agent:*:*:*:*:*:*:*:*
  metadata:
    verified: true
    max-request: 1
    vendor: checkpoint
    product: mobile_access_portal_agent
    shodan-query: http.html:"Check Point Mobile"
  tags: panel,checkpoint,detect,discovery

http:
  - method: GET
    path:
      - '{{BaseURL}}/sslvpn/Login'

    matchers-condition: and
    matchers:
      - type: word
        part: body
        words:
          - 'Check Point Mobile'
          - 'Check Point Software Technologies'
        condition: and
        case-insensitive: true

      - type: status
        status:
          - 403
