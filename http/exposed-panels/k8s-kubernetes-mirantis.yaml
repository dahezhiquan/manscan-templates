id: k8s-kubernetes-mirantis

info:
  name: Mirantis Kubernetes Engine 面板识别（指纹识别）
  author: pussycat0x
  severity: info
  description: |-
    检测到目标站点存在 Mirantis Kubernetes Engine 相关响应特征。Mirantis Kubernetes Engine 是云原生、中间件或集群管理平台，用于管理服务、工作负载、消息流、API 网关、配置和运行状态。模板请求 `/`，并通过页面标题或正文关键字、状态码确认该系统指纹，用于资产识别、系统盘点和暴露面梳理。
  classification:
    cvss-metrics: CVSS:3.1/AV:N/AC:L/PR:N/UI:N/S:U/C:N/I:N/A:N
    cwe-id: CWE-200
    cpe: cpe:2.3:a:mirantis:kubernetes_engine:*:*:*:*:*:*:*:*
  metadata:
    verified: true
    max-request: 1
    shodan-query: http.html:"Mirantis Kubernetes Engine"
    fofa-query: app="Mirantis-Kubernetes-Engine"
    product: kubernetes_engine
    vendor: mirantis
  tags: tech,kubernetes,devops,kube,panel,discovery
http:
  - method: GET
    path:
      - "{{BaseURL}}"

    matchers-condition: and
    matchers:
      - type: word
        part: body
        words:
          - "Mirantis Kubernetes Engine"

      - type: status
        status:
          - 200
