id: rds-public-access

info:
  name: RDS 实例公网可访问（云安全）
  author: DhiyaneshDK
  severity: high
  description: RDS 实例设置为 PubliclyAccessible 会为数据库分配可公网路由的入口，若安全组或凭据控制不严，数据库可能暴露给互联网扫描和攻击。该模板枚举实例并检查 PubliclyAccessible 是否为 true。
  impact: |
    - 数据库服务可能被公网枚举、暴力破解或利用弱口令/漏洞攻击。
    - 一旦凭据泄露或安全组开放过宽，敏感数据泄露和破坏性操作风险显著增加。
  remediation: |
    - 将数据库部署在私有子网并关闭 PubliclyAccessible，必要访问通过 VPN、堡垒机或私有连接进入。
    - 收敛安全组入站规则，仅允许明确可信来源访问数据库端口，并启用审计日志。
  reference:
    - https://www.trendmicro.com/cloudoneconformity-staging/knowledge-base/aws/RDS/rds-publicly-accessible.html
    - http://docs.aws.amazon.com/AmazonRDS/latest/UserGuide/UsingWithRDS.html
  metadata:
    vendor: amazon
    product: rds
  tags: cloud,devops,aws,amazon,rds,aws-cloud-config
variables:
  region: "us-west-2"

flow: |
  code(1)
  for(let DBClusterIdentifier of iterate(template.dbclusters)){
    set("dbcluster", DBClusterIdentifier)
    code(2)
  }

self-contained: true

code:
  - engine:
      - sh
      - bash
    source: |
      aws rds describe-db-instances --region $region --output json --query 'DBInstances[*].DBInstanceIdentifier'

    extractors:
      - type: json
        name: dbclusters
        internal: true
        json:
          - '.[]'

  - engine:
      - sh
      - bash

    source: |
        aws rds describe-db-instances --region $region --db-instance-identifier $dbcluster --query 'DBInstances[*].PubliclyAccessible' --output json

    matchers:
      - type: word
        words:
          - 'true'

    extractors:
      - type: dsl
        dsl:
          - 'dbcluster + " RDS Publicly Accessible Enabled"'
