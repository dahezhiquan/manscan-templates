id: mixpost-auth-panel

info:
  name: Mixpost 认证登录面板（暴露面识别）
  author: Th3l0newolf
  severity: low
  description: |-
    检测到目标站点暴露 Mixpost 认证登录面板。Mixpost 是社交媒体内容发布和运营管理平台，用于集中管理账号、内容日历、发布任务、团队协作和营销工作流。模板请求 `/mixpost/login`，并通过页面标题或正文关键字、状态码、DSL 条件确认入口可访问；此类面板若直接暴露在公网，会增加账号枚举、口令攻击、漏洞匹配和未授权访问尝试的机会。
  impact: |-
    - 攻击者可确认目标部署了 Mixpost 或相关社交媒体运营平台，并据此开展账号枚举、口令喷洒、默认凭据尝试或针对性漏洞匹配。
    - 若面板存在弱口令、默认配置、访问控制缺陷或未修复漏洞，可能导致社交媒体账号配置、发布计划、团队成员或营销数据泄露，并可能被滥用于发布未授权内容。
    - 管理入口长期暴露在公网会扩大攻击面，增加自动化扫描、撞库、社会工程和后续横向移动的风险。
  remediation: |-
    - 将 Mixpost 认证登录面板限制在内网、VPN、堡垒机或可信源 IP 访问范围内，避免管理入口直接暴露在公网。
    - 启用强密码、多因素认证、登录失败限制和默认账户清理，定期审计登录日志、团队成员和第三方社交账号授权。
    - 保持 Mixpost 和相关依赖更新到受支持版本，关闭不必要的管理路径，并在必须公网访问时增加反向代理访问控制、WAF 或零信任访问策略。
  classification:
    cvss-metrics: CVSS:3.0/AV:N/AC:L/PR:N/UI:N/S:U/C:N/I:N/A:N
    cwe-id: CWE-200
  metadata:
    max-request: 1
    verified: true
    shodan-query: html:"Mixpost Auth - Mixpost"
  tags: panel,login,mixpost,auth,discovery
http:
  - method: GET
    path:
      - "{{BaseURL}}/mixpost/login"

    matchers:
      - type: dsl
        dsl:
          - 'status_code == 200'
          - 'contains_any(body, "Mixpost Auth - Mixpost","/vendor/mixpost-auth/assets/")'
        condition: and
