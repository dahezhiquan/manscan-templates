id: gcloud-pubsub-cmek-disabled

info:
  name: Pub/Sub Topics 未Encrypted 使用Customer-Managed 加密 Keys（云安全）
  author: princechaddha
  severity: high
  description: Pub/Sub topic 未使用客户管理密钥时，消息数据由 Google 默认加密，组织无法自行控制密钥生命周期和访问审计。本模板枚举项目 topics，并检查 kmsKeyName，返回 null 时报告该 topic 未启用 CMEK。
  impact: |
    - 对敏感消息流，缺少 CMEK 会降低组织对密钥轮换、禁用、销毁和访问审计的控制力。
    - 需要客户托管密钥的合规场景可能无法满足加密治理要求。
  remediation: |
    - 为承载敏感数据的 Pub/Sub topic 配置 CMEK，并授予 Pub/Sub 服务代理使用对应 KMS key 的权限。
    - 建立密钥轮换和禁用影响评估流程，确保订阅者、发布者和日志监控在启用 CMEK 后运行正常。
  reference:
    - https://cloud.google.com/pubsub/docs/encryption
  metadata:
    vendor: google
    product: google-cloud-pubsub
  tags: cloud,devops,gcp,gcloud,google-cloud-pubsub,gcp-cloud-config

flow: |
  code(1)
  for(let projectId of iterate(template.projectIds)){
    set("projectId", projectId)
    code(2)
    for(let pubsubTopic of iterate(template.topics)){
      set("pubsubTopic", pubsubTopic)
      code(3)
    }
  }

self-contained: true

code:
  - engine:
      - sh
      - bash
    source: |
      gcloud projects list --format="json(projectId)"

    extractors:
      - type: json
        name: projectIds
        internal: true
        json:
          - '.[].projectId'

  - engine:
      - sh
      - bash
    source: |
      gcloud pubsub topics list --project $projectId --format="json(name)"

    extractors:
      - type: json
        name: topics
        internal: true
        json:
          - '.[].name'

  - engine:
      - sh
      - bash
    source: |
      gcloud pubsub topics describe $pubsubTopic --format="json(kmsKeyName)"

    matchers:
      - type: word
        words:
          - 'null'

    extractors:
      - type: dsl
        dsl:
          - '"Pub/Sub Topic " + pubsubTopic + " in project " + projectId + " is not encrypted with Customer-Managed Encryption Key (CMEK)"'
