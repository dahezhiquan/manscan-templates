id: bugzilla-config

info:
  name: Bugzilla 配置暴露（暴露面识别）
  author: icarot
  severity: low
  description: |
    检测到目标站点可直接访问 Bugzilla 配置。这类配置或资源文件通常服务于应用部署、依赖管理、调试、运行参数或内部集成。该模板请求 `/config.cgi`，并通过 HTTP 状态码、响应正文关键字、文件格式特征、正则匹配或响应头进行确认。此类资源公开后可能泄露部署细节、内部路径、依赖版本、环境变量、访问凭据或调试信息，增加被侦察和后续利用的风险。
  impact: |-
    - 公开配置可能泄露内部路径、组件版本、依赖清单、环境变量名称、服务地址或访问控制线索。
    - 攻击者可利用这些信息缩小目标范围，选择匹配漏洞、弱口令、凭据攻击或目录枚举策略。
    - 若文件中包含真实凭据、令牌或连接串，可能进一步导致数据、代码仓库、云资源或后台系统被未授权访问。
  remediation: |-
    - 确认该资源是否必须公网可访问；如非业务必需，应立即从 Web 根目录、静态资源目录、对象存储或反向代理公开路径中移除。
    - 在 Web 服务器、网关、CDN 或应用路由层增加拒绝规则、身份认证、IP allowlist 或内网访问限制。
    - 检查访问日志、下载记录和缓存记录，评估该资源是否已被外部访问或搜索引擎收录。
    - 若文件中包含凭据、令牌、连接串或私有地址，应执行密钥轮换、权限收敛和受影响系统访问审计。
  reference:
    - https://github.com/bugzilla/bugzilla/
  classification:
    cpe: cpe:2.3:a:mozilla:bugzilla:-:*:*:*:*:*:*:*
  metadata:
    max-request: 1
    vendor: mozilla
    product: bugzilla
    shodan-query: title:"Bugzilla"
  tags: bugzilla,mozilla,config,exposure,vuln

http:
  - method: GET
    path:
      - "{{BaseURL}}/config.cgi"

    matchers:
      - type: dsl
        dsl:
          - 'status_code == 200'
          - 'contains_all(body, "base_url", "maintainer")'
          - 'contains(content_type, "application/x-javascript")'
        condition: and

    extractors:
      - type: regex
        name: base_url
        group: 1
        part: body
        regex:
          - ".+base_url.+:.(?<base_url>\\'.+\\')"

      - type: regex
        name: maintainer
        group: 1
        part: body
        regex:
          - ".+maintainer.+:.(?<maintainer>\\'.+\\')"
