id: dahua-icc-default-login

info:
  name: 大华 ICC 默认登录（弱口令）
  author: DhiyaneshDk
  severity: high
  description: |
    该模板用于检测 大华 ICC 是否仍可使用默认凭据或弱口令登录。模板主要向 `/evo-apigw/evo-oauth/oauth/token` 等认证入口发送请求，使用内置默认凭据组合进行认证尝试，并根据响应中的 `"success":`、`"access_token":` 等登录成功特征判断登录是否成功；命中说明目标未及时修改出厂、示例或初始化账号口令。
  impact: |
    - 攻击者可使用默认凭据登录 大华 ICC，获得与该账号对应的管理或业务权限。
    - 成功登录后可能进一步查看敏感信息、修改配置、创建账号、调用管理接口，或以该系统为入口访问内网其他资源。
  remediation: |
    - 立即修改或禁用默认账号，要求所有账户使用高强度唯一密码。
    - 将登录入口限制在可信网络范围内，并启用多因素认证、登录失败限制和异常登录告警。
    - 审计近期登录、配置变更和账号新增记录，必要时轮换相关密钥、令牌和业务凭据。
  reference:
    - https://www.dahuasecurity.com/
  metadata:
    verified: true
    vendor: dahua
    product: icc
    fofa-query: icon_hash="-1935899595" && body="*客户端会小于800*"
  tags: dahua,icc,default-login

http:
  - raw:
      - |
        POST /evo-apigw/evo-oauth/oauth/token HTTP/1.1
        Host: {{Hostname}}
        Content-Type: application/x-www-form-urlencoded

        username={{username}}&password={{password}}&grant_type=password&client_id=web_client&client_secret=web_client&public_key=

    attack: clusterbomb

    payloads:
      username:
        - justForTest
        - system
        - admin

      password:
        - "123456"
        - admin
        - "12345"

    stop-at-first-match: true

    matchers-condition: and
    matchers:
      - type: word
        part: body
        words:
          - '"success":'
          - '"access_token":'
          - '"token_type":'
        condition: and

      - type: status
        status:
          - 200

    extractors:
      - type: dsl
        dsl:
          - username + ":" + password
