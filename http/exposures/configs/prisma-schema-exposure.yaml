id: prisma-schema-exposure

info:
  name: 暴露 Prisma 数据库 Schema 暴露（暴露面识别）
  author: Umut ÖZEN
  severity: medium
  description: |
    检测到对外可访问的 暴露 Prisma 数据库 Schema。这类配置资源可能包含部署细节、访问凭据、内部地址、组件版本或调试开关，公开暴露后会显著增加被侦察和后续利用的风险。
  metadata:
    max-requests: 5
    verified: true
  tags: exposure,prisma,database,config,custom

http:
  - method: GET
    path:
      - "{{BaseURL}}/schema.prisma"
      - "{{BaseURL}}/prisma/schema.prisma"
      - "{{BaseURL}}/src/prisma/schema.prisma"
      - "{{BaseURL}}/db/schema.prisma"
      - "{{BaseURL}}/.prisma/schema.prisma"

    stop-at-first-match: true
    matchers-condition: and
    matchers:
      - type: word
        part: body
        words:
          - 'generator'
          - 'datasource '
          - 'provider ='
          - 'model '
        condition: and

      - type: status
        status:
          - 200

    extractors:
      - type: regex
        part: body
        name: db_provider
        regex:
          - 'provider\s*=\s*"([^"]+)"'

      - type: regex
        part: body
        name: db_url
        regex:
          - 'url\s*=\s*(env\([^)]+\)|"[^"]+")'
          - '(?i)postgre(sql|s)?:\/\/[^"\n]+'
          - '(?i)mysql:\/\/[^"\n]+'
          - '(?i)mongodb:\/\/[^"\n]+'
