id: azure-aks-entra-id-unintegrated
info:
  name: Azure AKS 未配置 Microsoft Entra ID 集成（云安全）
  author: princechaddha
  severity: high
  description: AKS 控制平面未集成 Microsoft Entra ID 时，集群用户认证无法统一依托组织身份目录、条件访问和集中生命周期管理。该模板查询 aadProfile，并在返回为空时判定未配置 Microsoft Entra ID 集成。
  impact: |
    - 用户可能依赖长期有效的本地管理员凭据或共享 kubeconfig，增加凭据泄露、离职账号残留和权限回收不及时的风险。
    - 缺少统一身份审计和多因素认证后，管理员操作更难关联到个人，异常集群访问的追踪与响应会变慢。
  remediation: |
    - 为 AKS 启用 Microsoft Entra ID 控制平面认证，并使用组织用户或组管理集群访问权限。
    - 结合 Azure RBAC、Kubernetes RBAC、条件访问和最小权限原则限制高危操作，逐步淘汰共享管理员凭据。
  reference:
    - https://docs.microsoft.com/en-us/azure/aks/managed-aad
  metadata:
    vendor: microsoft
    product: azure-kubernetes-service
  tags: cloud,devops,azure,microsoft,aks,azure-cloud-config

flow: |
  code(1);
  for (let ClusterInfo of iterate(template.clusterList)) {
    ClusterInfo = JSON.parse(ClusterInfo);
    set("name", ClusterInfo.name);
    set("resourceGroup", ClusterInfo.resourceGroup);
    code(2);
  }

self-contained: true
code:
  - engine:
      - sh
      - bash
    source: |
      az aks list --output json --query '[*].{name:name, resourceGroup:resourceGroup}'

    extractors:
      - type: json
        name: clusterList
        internal: true
        json:
          - '.[]'

  - engine:
      - sh
      - bash
    source: |
      az aks show --name "$name" --resource-group "$resourceGroup" --query 'aadProfile'

    matchers:
      - type: word
        words:
          - ''

    extractors:
      - type: dsl
        dsl:
          - 'name + " in " + resourceGroup + " does not have Microsoft Entra ID integration configured"'
