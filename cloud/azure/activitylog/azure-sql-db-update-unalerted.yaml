id: azure-sql-db-update-unalerted
info:
  name: Azure SQL 数据库创建或更新告警未配置（云安全）
  author: princechaddha
  severity: high
  description: Azure SQL 数据库创建或更新可能改变网络、认证、审计、加密和备份配置；未配置 Activity Log 告警时，数据库控制面变更可能不被及时发现。该模板枚举已启用的 Activity Log Alert，并检查 condition 是否缺少 Microsoft.Sql/servers/databases/write 操作条件。
  impact: |
    - 未授权更新可能关闭审计或加密、放宽网络访问，并使敏感数据暴露风险上升。
    - 异常创建可能引入未纳入治理的数据库资源，造成数据、权限和成本管理盲区。
  remediation: |
    - 创建针对 SQL 数据库创建和更新操作的 Activity Log Alert，并接入数据库变更审批流程。
    - 限制数据库管理权限，持续校验防火墙、审计、TDE、备份和身份认证等关键配置。
  reference:
    - https://docs.microsoft.com/en-us/azure/azure-monitor/platform/alerts-activity-log
  metadata:
    vendor: microsoft
    product: azure-monitor
  tags: cloud,devops,azure,microsoft,sql-database,azure-cloud-config

flow: |
  code(1);
  for (let AlertData of iterate(template.alertList)) {
    set("id", AlertData);
    code(2);
  }

self-contained: true
code:
  - engine:
      - sh
      - bash
    source: |
      az monitor activity-log alert list --output json --query '[?(enabled==`true`)].id'
    extractors:
      - type: json
        name: alertList
        internal: true
        json:
          - '.[]'

  - engine:
      - sh
      - bash
    source: |
      az monitor activity-log alert show --ids "$id" --query 'condition'

    matchers-condition: and
    matchers:
      - type: word
        words:
          - '"field": "operationName"'

      - type: word
        words:
          - "Microsoft.Sql/servers/databases/write"
        negative: true

    extractors:
      - type: dsl
        dsl:
          - 'id + " does not have the correct alert configuration for Create/Update Azure SQL Database events"'
