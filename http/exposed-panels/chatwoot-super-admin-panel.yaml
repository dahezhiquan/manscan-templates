id: chatwoot-super-admin-panel

info:
  name: Chatwoot 超级管理员面板 - 识别（暴露面识别）
  author: RootKaito
  severity: info
  description: |-
    检测到 Chatwoot 超级管理员登录面板。
  reference:
    - https://www.chatwoot.com/
    - https://github.com/chatwoot/chatwoot
  classification:
    cpe: cpe:2.3:a:chatwoot:chatwoot:*:*:*:*:*:*:*:*
  metadata:
    verified: true
    max-request: 1
    vendor: chatwoot
    product: chatwoot
  tags: panel,chatwoot,login,detect,discovery

http:
  - method: GET
    path:
      - "{{BaseURL}}/super_admin/sign_in"

    matchers-condition: and
    matchers:
      - type: word
        part: body
        words:
          - "new_super_admin"
          - "Chatwoot"
        condition: and
        case-insensitive: true

      - type: status
        status:
          - 200
