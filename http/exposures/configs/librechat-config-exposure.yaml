id: librechat-config-exposure

info:
  name: librechat 配置暴露（暴露面识别）
  author: icarot
  severity: low
  description: |
    检测到对外可访问的 li。这类配置资源可能包含部署细节、访问凭据、内部地址、组件版本或调试开关，公开暴露后会显著增加被侦察和后续利用的风险。
  classification:
    cpe: cpe:2.3:a:librechat:librechat:-:*:*:*:*:*:*:*
  metadata:
    verified: true
    max-request: 1
    vendor: librechat
    product: librechat
    shodan-query: title:"librechat"
  tags: librechat,config,exposure

http:
  - method: GET
    path:
      - "{{BaseURL}}/api/config"

    matchers-condition: and
    matchers:
      - type: word
        words:
          - 'LibreChat'
          - 'serverDomain'
          - 'registrationEnabled'
          - 'passwordResetEnabled'
        condition: and

      - type: status
        status:
          - 200
