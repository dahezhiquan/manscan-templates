id: gcloud-nat-static-ip-unconfigured

info:
  name: Cloud NAT Gateways 未Configured 使用Reserved Static IPs（云安全）
  author: princechaddha
  severity: medium
  description: Cloud NAT 未配置保留静态外部 IP 时，出站源地址可能随自动分配地址变化，影响第三方 allowlist、审计和变更控制。本模板枚举网络、路由器和 NAT 网关，并检查 natIps 字段，返回 null 时报告未使用 reserved static IP。
  impact: |
    - 出站源 IP 不稳定会导致外部服务 allowlist 失效，或让异常流量归因和审计变得困难。
    - 地址变化可能引发业务连接中断、合规记录不一致或临时放宽外部访问控制。
  remediation: |
    - 为 Cloud NAT 分配并绑定 reserved static external IP，确保关键出站流量源地址稳定。
    - 将 NAT 出站 IP 纳入资产清单、第三方 allowlist 和变更流程，定期复核地址使用情况。
  reference:
    - https://cloud.google.com/nat/docs/using-nat
  metadata:
    vendor: google
    product: cloud-nat
  tags: cloud,devops,gcp,gcloud,google-cloud-nat,gcp-cloud-config

flow: |
  code(1)
  for(let projectId of iterate(template.projectIds)){
    set("projectId", projectId)
    code(2)
    for(let networkName of iterate(template.networks)){
      set("networkName", networkName)
      code(3)
      for(let routerName of iterate(template.routers)){
        set("routerName", routerName)
        code(4)
        for(let natName of iterate(template.nats)){
          set("natName", natName)
          code(5)
        }
      }
    }
  }

self-contained: true

code:
  - engine:
      - sh
      - bash
    source: |
      gcloud projects list --format="json(projectId)"

    extractors:
      - type: json
        name: projectIds
        internal: true
        json:
          - '.[].projectId'

  - engine:
      - sh
      - bash
    source: |
      gcloud compute networks list --project=$projectId --format="json(name)"

    extractors:
      - type: json
        name: networks
        internal: true
        json:
          - '.[].name'

  - engine:
      - sh
      - bash
    source: |
      gcloud compute routers list --project=$projectId --filter="network:($networkName)" --format="json(name)"

    extractors:
      - type: json
        name: routers
        internal: true
        json:
          - '.[].name'

  - engine:
      - sh
      - bash
    source: |
      gcloud compute routers nats list --region=$region --router=$routerName --format="json(name)"

    extractors:
      - type: json
        name: nats
        internal: true
        json:
          - '.[].name'

  - engine:
      - sh
      - bash
    source: |
      gcloud compute routers nats describe $natName --region=$region --router=$routerName --format="json(natIps)"

    matchers:
      - type: word
        words:
          - 'null'

    extractors:
      - type: dsl
        dsl:
          - '"Cloud NAT gateway " + natName + " under Router " + routerName + " in Network " + networkName + " of Project " + projectId + " does not have static reserved external IPs configured."'
