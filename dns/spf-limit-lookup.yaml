id: spf-limit-lookup

info:
  name: SPF DNS 查询次数超限检测（dns）
  author: theamanrawat
  severity: info
  description: |
    该模板检测 SPF 记录是否超过 10 次 DNS 查询限制。超限会触发 SPF permerror，可能导致邮件认证失败、投递异常或被冒用风险上升。
  reference:
    - https://dmarcly.com/blog/spf-permerror-too-many-dns-lookups-when-spf-record-exceeds-10-dns-lookup-limit
  tags: dns,spf,discovery

dns:
  - name: "{{FQDN}}"
    type: TXT

    extractors:
      - type: regex
        name: spf_record
        regex:
          - 'v=spf1[^\"]*'
        internal: true

      - type: regex
        name: spf_record_limit
        part: spf_record
        regex:
          - '(?i)(include|all):?[^ ]*?'
        internal: true

    matchers:
      - type: dsl
        dsl:
          - len(spf_record_limit)>10
