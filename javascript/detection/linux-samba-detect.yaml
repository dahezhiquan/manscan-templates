id: linux-samba-detect

info:
  name: Samba 服务识别（指纹识别）
  author: pussycat0x
  severity: info
  description: |
    Samba 是在类 Unix 系统上实现 SMB/CIFS 文件共享与域集成功能的软件，常用于 Linux 文件服务器、NAS 或混合 Windows 域环境。该模板通过 SMB 信息模式连接 TCP 445 端口，检查 SMBv1 协议支持情况与 NTLM/版本响应，并在响应为空或包含 Samba 标识时确认 Samba 服务指纹。
  metadata:
    max-request: 1
    shodan-query: "port:445"
    product: samba
    vendor: samba
  tags: js,network,samba,detect,linux,discovery
javascript:
  - pre-condition: |
      isPortOpen(Host,Port);
    code: |
      let m = require("nuclei/smb");
      let c = new m.SMBClient();
      let response = c.ConnectSMBInfoMode(Host, Port);

      const conditionsMet = (response.SupportV1 === true  && response.Version.VerString === "SMB 1.0");

      if (conditionsMet) {

      if (response.NTLM === "") {
      printedValue = "Samba detected";
      } else {
      printedValue = response.NTLM;
      }
      }
      else {
      process.exit(1);
      }

    args:
      Host: "{{Host}}"
      Port: 445

    extractors:
      - type: dsl
        dsl:
          - response
