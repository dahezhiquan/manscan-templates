id: avtech-dvr-exposure

info:
  name: AVTECH AVC798HA DVR - Information 暴露（暴露面识别）
  author: geeknik
  severity: low
  description: 该模板用于识别 AVTECH AVC798HA DVR - Information 相关暴露入口或页面特征。若命中，说明目标可能对外公开了可访问的管理或信息接口，存在进一步泄露系统信息、配置数据或服务细节的风险。
  reference:
    - http://www.avtech.com.tw/
  metadata:
    max-request: 1
  tags: dvr,exposure,avtech,panel,discovery

http:
  - method: GET
    path:
      - "{{BaseURL}}/cgi-bin/nobody/Machine.cgi?action=get_capability"

    matchers-condition: and
    matchers:
      - type: status
        status:
          - 200

      - type: word
        words:
          - "Firmware.Version="
          - "MACAddress="
          - "Product.Type="
        condition: and
