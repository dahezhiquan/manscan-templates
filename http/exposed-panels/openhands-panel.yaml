id: openhands-panel

info:
  name: OpenHands 面板识别（指纹识别）
  author: rxerium
  severity: info
  description: |
    该模板用于识别 OpenHands 是否存在对外暴露的管理、服务或状态界面。若命中，说明目标公开了相关功能入口，可作为资产盘点与攻击面收敛的依据。
  reference:
    - https://github.com/All-Hands-AI/OpenHands
    - https://www.all-hands.dev/
  metadata:
    verified: true
    max-request: 1
    vendor: All-Hands-AI
    product: openhands
    shodan-query: 'http.title:"OpenHands"'
  tags: panel,openhands,opendevin,agent,ai,detect,discovery

http:
  - method: GET
    path:
      - "{{BaseURL}}"

    host-redirects: true
    max-redirects: 2

    matchers-condition: and
    matchers:
      - type: word
        part: body
        words:
          - "<title>OpenHands</title>"

      - type: status
        status:
          - 200
