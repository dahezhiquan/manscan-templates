id: roxy-fileman

info:
  name: roxyfileman 面板识别（指纹识别）
  author: liquidsec,DhiyaneshDk,ritikchaddha
  severity: info
  description: roxyfileman 是 Web 文件管理组件，用于浏览、上传、重命名和维护服务器端文件。该模板请求首页、`/index.html`、`/fileman/index.html` 等路径，并依据 HTTP 200 状态码、页面标题、正文关键字或品牌资源特征识别目标是否部署了该系统或暴露了对应入口，适用于资产指纹确认；命中结果仅表示系统特征匹配，不代表已确认存在未授权访问或可利用漏洞。
  classification:
    cvss-metrics: CVSS:3.0/AV:N/AC:L/PR:N/UI:N/S:U/C:N/I:N/A:N
    cwe-id: CWE-200
    cpe: cpe:2.3:a:roxyfileman:roxy_fileman:*:*:*:*:*:*:*:*
  metadata:
    verified: true
    max-request: 5
    vendor: roxyfileman
    product: roxy_fileman
    google-query:
    - intitle:"Roxy file manager"
    - intitle:"roxy file manager"
    shodan-query: http.title:"roxy file manager"
    fofa-query: title="roxy file manager"
  tags: tech,roxy,fileman,panel,roxyfileman,discovery

http:
  - method: GET
    path:
      - "{{BaseURL}}"
      - "{{BaseURL}}/index.html"
      - "{{BaseURL}}/fileman/index.html"
      - "{{BaseURL}}/fileman/php/fileslist.php"
      - "{{BaseURL}}/fileman/asp_net/main.ashx"

    stop-at-first-match: true
    host-redirects: true
    max-redirects: 2

    matchers-condition: and
    matchers:
      - type: word
        part: body
        words:
          - 'Roxy file manager'
          - 'RoxyFileman'
          - '[{"p":"'
        condition: or
        case-insensitive: true

      - type: status
        status:
          - 200
