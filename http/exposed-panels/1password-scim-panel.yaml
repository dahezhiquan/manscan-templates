id: 1password-scim-panel

info:
  name: 1Password SCIM Bridge 面板（指纹识别）
  author: Splint3r7
  severity: info
  description: |-
    检测到目标站点存在 1Password SCIM Bridge 相关响应特征。1Password SCIM Bridge 是 1Password 用于与身份提供商同步用户与群组的桥接服务，常部署在企业内网或云主机上以支撑账号生命周期管理。模板请求 `/`，并通过页面标题或正文关键字、状态码、DSL 条件确认该系统指纹，用于资产识别、系统盘点和暴露面梳理。
  classification:
    cwe-id: CWE-200
  metadata:
    max-request: 1
    shodan-query: http.title:"1Password SCIM Bridge Login"
  tags: panel,1password,login,detect,discovery
http:
  - method: GET
    path:
      - "{{BaseURL}}"

    host-redirects: true
    max-redirects: 2

    matchers:
      - type: dsl
        dsl:
          - 'contains_any(body, "1Password SCIM Bridge Login", "scim-bridge-logo")'
          - 'status_code == 200'
        condition: and
