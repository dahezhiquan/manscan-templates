id: gotweb-detect

info:
  name: GotWeb 指纹识别（指纹识别）
  author: lu4nx
  severity: info
  description: >-
    GotWeb 是 Go 语言相关 Web 服务或示例应用，其固定页面特征可用于识别对应部署。该模板通过请求目标服务并检查预设路径或首页响应、页面正文关键字、状态码等指纹特征，判断目标是否使用或暴露了
    GotWeb 相关组件；命中结果仅表示指纹特征匹配，可用于资产盘点、技术栈识别和后续安全评估，不代表已确认存在可利用漏洞。
  metadata:
    verified: true
    max-request: 1
    zoomeye-query: app="GotWeb"
  tags: tech,got,gotweb,discovery
http:
  - method: GET
    path:
      - "{{BaseURL}}"

    matchers-condition: and
    matchers:
      - type: word
        part: body
        words:
          - <link rel="stylesheet" type="text/css" href="/gotweb.css" />

      - type: status
        status:
          - 200
