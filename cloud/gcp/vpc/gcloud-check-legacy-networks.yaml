id: gcloud-check-legacy-networks

info:
  name: 检查 的Legacy Networks（云安全）
  author: princechaddha
  severity: medium
  description: Legacy networks 是早期 GCP 网络模式，缺少现代 VPC 的子网级隔离和管理能力，继续使用会影响网络分段和治理。本模板列出项目网络并检查 subnetMode，命中 LEGACY 时报告存在旧版网络。
  impact: |
    - 网络边界和子网划分能力不足，增加横向访问和策略治理难度。
    - 旧网络模式不利于采用现代 VPC 功能、日志和自动化网络基线。
  remediation: |
    - 规划从 legacy network 迁移到自定义模式 VPC，并按业务域重新设计子网和防火墙规则。
    - 迁移前盘点依赖资源、路由和规则，完成后删除遗留网络。
  reference:
    - https://cloud.google.com/vpc/docs/vpc
  metadata:
    vendor: google
    product: cloud-vpc
  tags: cloud,devops,gcp,gcloud,vpc,networking,security,gcp-cloud-config

flow: |
  code(1)
  for(let projectId of iterate(template.projectIds)){
    set("projectId", projectId)
    code(2)
  }

self-contained: true

code:
  - engine:
      - sh
      - bash
    source: |
      gcloud projects list --format="json(projectId)"

    extractors:
      - type: json
        name: projectIds
        internal: true
        json:
          - '.[].projectId'

  - engine:
      - sh
      - bash
    source: |
      gcloud compute networks list --project $projectId --format="json(name,subnetMode)"

    matchers:
      - type: word
        words:
          - LEGACY

    extractors:
      - type: dsl
        dsl:
          - '"Legacy network found in project " + projectId + ": " + name'
