id: sailpoint-identityiq-panel

info:
  name: SailPoint IdentityIQ - 登录面板（暴露面识别）
  author: rxerium
  severity: info
  description: |-
    SailPoint IdentityIQ 是一个身份治理与管理平台。检测到其 Web 登录面板。
  reference:
    - https://documentation.sailpoint.com/identityiq/help/
  metadata:
    verified: true
    max-request: 1
    vendor: sailpoint
    product: identityiq
    shodan-query: http.title:"SailPoint IdentityIQ"
  tags: panel,sailpoint,identityiq,iga

http:
  - method: GET
    path:
      - "{{BaseURL}}"

    host-redirects: true
    max-redirects: 3

    matchers-condition: and
    matchers:
      - type: word
        part: body
        words:
          - '<TITLE>SailPoint IdentityIQ</TITLE>'
          - 'Copyright 2008 SailPoint Technologies'
        condition: and

      - type: status
        status:
          - 200
