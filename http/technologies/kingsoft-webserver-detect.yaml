id: kingsoft-webserver-detect

info:
  name: Kingsoft WebServer 指纹识别（指纹识别）
  author: princechaddha
  severity: info
  description: >-
    Kingsoft WebServer 是金山相关 Web 服务组件，响应头或页面标识可用于判断目标服务器类型和部署环境。该模板通过请求目标服务并检查预设路径或首页响应、页面正文关键字、状态码等指纹特征，判断目标是否使用
    Kingsoft WebServer；命中结果仅表示指纹特征匹配，可用于资产盘点、技术栈识别和后续安全评估，不代表已确认存在可利用漏洞。
  metadata:
    max-request: 1
  tags: tech,kingsoft,discovery
http:
  - method: GET
    path:
      - "{{BaseURL}}"

    matchers-condition: and
    matchers:
      - type: word
        part: body
        words:
          - "<title>Welcome to Kingsoft Web Server!</title>"

      - type: status
        status:
          - 200
