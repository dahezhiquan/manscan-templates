id: wp-app-log

info:
  name: Discover wp-app.log 文件泄露（暴露面识别）
  author: geeknik
  severity: info
  description: 检测到可直接访问的 Discover wp-app.log 文件。日志、异常页面或调试输出通常会泄露堆栈信息、内部路径、查询语句、账号标识、令牌片段或业务数据，不应向未授权用户开放。
  metadata:
    max-request: 1
  tags: exposure,logs,vuln

http:
  - method: GET
    path:
      - "{{BaseURL}}/wp-app.log"

    matchers-condition: and
    matchers:
      - type: word
        words:
          - "LANG"
          - "Array"
        condition: and

      - type: word
        part: header
        words:
          - "text/html"
          - "application/javascript"
        negative: true

      - type: status
        status:
          - 200
