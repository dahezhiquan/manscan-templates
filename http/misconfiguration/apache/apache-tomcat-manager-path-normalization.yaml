id: apache-tomcat-manager-path-normalization

info:
  name: Apache Tomcat Manager Path Normalization 面板 检测
  author: brenocss,organiccrap
  severity: medium
  description: |
    该模板用于核查 Apache Tomcat Manager Path Normalization 面板相关配置。该类问题通常源于管理面板、仪表盘或监控控制台暴露在公网或缺少足够访问控制。模板会向目标发送探测请求，并依据请求 `/..;/manager/html`、`/..;/..;/manager/html;/`、匹配 `username="tomcat" password="s3cret"`、`manager-gui`、状态码 403等证据确认目标是否存在该配置问题。
  impact: |
    - 攻击者可获取系统状态、业务指标、任务信息、拓扑结构或管理入口线索。
    - 若面板存在默认凭据、弱认证或操作接口，可能进一步导致未授权管理或服务接管。
  remediation: |
    - 将管理面板和仪表盘限制在内网、VPN 或可信访问网关后。
    - 启用强认证、多因素认证、细粒度授权和操作审计。
    - 隐藏或关闭不需要公开的默认面板，并监控异常访问与暴力探测。
  reference:
    - https://i.blackhat.com/us-18/Wed-August-8/us-18-Orange-Tsai-Breaking-Parser-Logic-Take-Your-Path-Normalization-Off-And-Pop-0days-Out-2.pdf
  classification:
    cvss-metrics: CVSS:3.0/AV:N/AC:L/PR:N/UI:N/S:U/C:N/I:N/A:N
    cvss-score: 0
    cwe-id: CWE-200
  metadata:
    max-request: 6
  tags: panel,tomcat,apache,misconfig,intrusive,vuln

http:
  - method: GET
    path:
      - '{{BaseURL}}/..;/manager/html'
      - '{{BaseURL}}/..;/..;/manager/html;/'
      - '{{BaseURL}}/..;/host-manager/html'
      - '{{BaseURL}}/..;/..;/host-manager/html;/'
      - '{{BaseURL}}/{{randstr}}/..;/manager/html'
      - '{{BaseURL}}/{{randstr}}/..;/host-manager/html'

    matchers-condition: and
    matchers:
      - type: word
        words:
          - 'username="tomcat" password="s3cret"'
          - 'manager-gui'
        condition: and

      - type: status
        negative: true
        status:
          - 403
