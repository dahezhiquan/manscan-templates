id: ssh-auth-methods

info:
  name: SSH 认证方式识别（指纹识别）
  author: Ice3man543
  severity: info
  description: |
    SSH 是常用的加密远程登录与管理协议，服务端会在认证协商阶段公布可接受的认证方式，如 `password`、`publickey` 或 `keyboard-interactive`。该模板建立 SSH 信息探测连接，并从认证协商结果中提取 `UserAuth` 字段，用于识别目标 SSH 服务支持的认证方式。
  reference:
    - https://nmap.org/nsedoc/scripts/ssh-auth-methods.html
  metadata:
    max-request: 1
    shodan-query: product:"OpenSSH"
  tags: js,detect,ssh,enum,network,discovery

javascript:
  - pre-condition: |
      isPortOpen(Host,Port);
    code: |
      var m = require("nuclei/ssh");
      var c = m.SSHClient();
      var response = c.ConnectSSHInfoMode(Host, Port);
      Export(response);
    args:
      Host: "{{Host}}"
      Port: "22"

    extractors:
      - type: json
        json:
          - '.UserAuth'
