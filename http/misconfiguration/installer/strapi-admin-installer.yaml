id: strapi-admin-installer

info:
  name: StrAPI Admin 安装向导
  author: dhiyaneshDk
  severity: critical
  description: |
    检测到 StrAPI Admin 安装向导。该页面属于安装、初始化或配置向导流程，若对外暴露，攻击者可能完成初始化、创建管理员账户或重新配置目标系统。
  metadata:
    verified: true
    max-request: 1
    shodan-query: html:"Welcome to your Strapi app" html:"create an administrator"
  tags: misconfig,exposure,strapi,install,vuln

http:
  - method: GET
    path:
      - '{{BaseURL}}'

    matchers-condition: and
    matchers:
      - type: word
        part: body
        words:
          - "Welcome to your Strapi app"
          - "Click to create the first administration"
        condition: and

      - type: status
        status:
          - 200
