id: tls-version

info:
  name: TLS 版本识别（证书安全）
  author: pdteam,pussycat0x
  severity: info
  description: 该模板分别以 TLS 1.0、1.1、1.2 和 1.3 进行限定版本握手，并提取成功协商的 `tls_version`，用于枚举目标实际支持的协议版本。它提供协议能力盘点；是否存在安全问题需要结合是否启用已弃用版本和可协商密码套件进一步判断。
  impact: |
    - 若结果包含 TLS 1.0 或 TLS 1.1，说明服务端仍接受已弃用协议，可能扩大降级攻击和弱密码套件风险。
    - 仅支持较旧协议的客户端可能无法使用现代加密能力，增加兼容性和合规管理压力。
    - TLS 1.2/1.3 的识别本身不是漏洞结论，仍需审查密码套件、证书和密钥交换配置。
  remediation: |
    - 以 TLS 1.2 和 TLS 1.3 作为生产环境最低协议基线，除非经过风险评估和兼容性审批保留旧版本。
    - 在服务端、负载均衡、CDN 和反向代理统一协议配置，避免不同节点返回不一致的安全能力。
    - 结合密码套件扫描复测，确认旧协议和弱套件均无法协商。
  metadata:
    max-request: 4
  tags: ssl,tls,discovery
ssl:
  - address: "{{Host}}:{{Port}}"
    min_version: tls10
    max_version: tls10

    extractors:
      - type: json
        json:
          - ".tls_version"

  - address: "{{Host}}:{{Port}}"
    min_version: tls11
    max_version: tls11

    extractors:
      - type: json
        json:
          - ".tls_version"

  - address: "{{Host}}:{{Port}}"
    min_version: tls12
    max_version: tls12

    extractors:
      - type: json
        json:
          - ".tls_version"

  - address: "{{Host}}:{{Port}}"
    min_version: tls13
    max_version: tls13

    extractors:
      - type: json
        json:
          - ".tls_version"
