id: google-floc-disabled

info:
  name: Google FLoC 禁用检测
  author: geeknik
  severity: low
  description: |
    检测网站是否明确选择退出 Google FLoC 跟踪。命中表示站点通过响应头或策略声明禁止参与 FLoC 行为分析。
  impact: |
    - well-known 策略或身份文件通常用于公开声明域名、应用、邮件、证书或身份关联。
    - 若内容过期、配置错误或非预期暴露，可能泄露组织关系、端点能力、用户标识或验证材料。
  remediation: |
    - 确认该 well-known 文件是否为业务或合规所需；非必要内容应删除或限制访问。
    - 定期检查文件内容是否准确、未过期且不包含敏感信息。
    - 对应用关联、邮件策略、证书验证和身份声明文件建立变更审计。
  reference:
    - https://www.bleepingcomputer.com/news/security/github-disables-google-floc-user-tracking-on-its-website/
  metadata:
    max-request: 1
  tags: miscellaneous,google,floc,misc,vuln

http:
  - method: GET
    path:
      - "{{BaseURL}}"

    matchers:
      - type: word
        part: header
        words:
          - "interest-cohort=()"
