id: reolink-panel

info:
  name: Reolink 登录面板识别（指纹识别）
  author: s4e-io
  severity: info
  description: |-
    Reolink 是网络摄像机或 NVR 的 Web 管理界面，用于视频预览、录像和设备配置。该模板请求首页，并依据 DSL 条件识别目标是否部署了该系统或暴露了对应入口，适用于资产指纹确认；命中结果仅表示系统特征匹配，不代表已确认存在未授权访问或可利用漏洞。
  metadata:
    verified: true
    max-request: 1
    fofa-query: "Reolink"
    shodan-query: title:"Reolink"
  tags: panel,login,reolink,detect,discovery

http:
  - method: GET
    path:
      - "{{BaseURL}}"

    host-redirects: true
    max-redirects: 2

    matchers:
      - type: dsl
        dsl:
          - 'contains(body, "Reolink</title>")'
          - 'status_code == 200'
        condition: and
