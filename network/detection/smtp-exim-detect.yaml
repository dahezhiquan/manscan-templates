id: smtp-exim-detect

info:
  name: Exim 识别（指纹识别）
  author: dahezhiquan
  severity: info
  description: |
    Exim 是用于接收、路由和投递电子邮件的邮件传输代理。该模板检查 25、2525、587/TCP 的明文响应及 465/TCP 的隐式 TLS 响应，通过 `ESMTP Exim` 横幅、精确的连接拒绝或同步错误、以及无参数 EHLO 的特征报错识别服务；仅从带产品名称的横幅中提取软件版本。
  reference:
    - https://www.exim.org/docs.html
  classification:
    cvss-metrics: CVSS:3.1/AV:N/AC:L/PR:N/UI:N/S:U/C:N/I:N/A:N
    cwe-id: CWE-200
  metadata:
    verified: true
    max-request: 4
    shodan-query: "product:\"Exim smtpd\""
  tags: network,detect,smtp,mail,exim,tcp,discovery

flow: tcp(1) || tcp(2) || tcp(3) || tcp(4)

tcp:
  - host:
      - "{{Hostname}}"
    port: 25,2525,587
    read-size: 2048

    matchers:
      - type: regex
        part: data
        regex:
          - '(?im)^220[ -][^\r\n]*\bESMTP Exim\b'
          - '(?m)^554 SMTP service not available\r?$'
          - '(?m)^554 SMTP synchronization error\r?$'

    extractors:
      - type: regex
        group: 1
        name: version
        part: data
        regex:
          - '(?im)^220[ -][^\r\n]*\bESMTP Exim[ \t]+(v?[0-9][A-Za-z0-9._+~-]*)'

  - host:
      - "tls://{{Hostname}}"
    port: 465
    read-size: 2048
    matchers:
      - type: regex
        part: data
        regex:
          - '(?im)^220[ -][^\r\n]*\bESMTP Exim\b'
          - '(?m)^554 SMTP service not available\r?$'
          - '(?m)^554 SMTP synchronization error\r?$'

    extractors:
      - type: regex
        group: 1
        name: version
        part: data
        regex:
          - '(?im)^220[ -][^\r\n]*\bESMTP Exim[ \t]+(v?[0-9][A-Za-z0-9._+~-]*)'

  - inputs:
      - data: ""
        name: greeting
        read: 2048
      - data: "EHLO\r\n"
        name: ehlo
        read: 2048
    host:
      - "{{Hostname}}"
    port: 25,2525,587
    matchers-condition: and
    matchers:
      - type: regex
        part: greeting
        regex:
          - '(?m)^220[ -][A-Za-z0-9_.-]+ ESMTP\r?$'
      - type: regex
        part: ehlo
        regex:
          - '(?m)^501 Syntactically invalid EHLO argument\(s\)\r?$'

  - inputs:
      - data: ""
        name: greeting
        read: 2048
      - data: "EHLO\r\n"
        name: ehlo
        read: 2048
    host:
      - "tls://{{Hostname}}"
    port: 465
    matchers-condition: and
    matchers:
      - type: regex
        part: greeting
        regex:
          - '(?m)^220[ -][A-Za-z0-9_.-]+ ESMTP\r?$'
      - type: regex
        part: ehlo
        regex:
          - '(?m)^501 Syntactically invalid EHLO argument\(s\)\r?$'
