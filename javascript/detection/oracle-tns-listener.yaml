id: oracle-tns-listener

info:
  name: Oracle TNS 监听器识别（指纹识别）
  author: pussycat0x
  severity: info
  description: |
    该模板通过 TNS 协议请求识别 Oracle TNS 监听器是否开放，以确认数据库入口暴露情况。
  reference:
    - https://www.tenable.com/plugins/nessus/110053
  metadata:
    verified: true
    max-request: 1
    shodan-query: product:"Oracle TNS Listener"
  tags: js,detect,oracle,tns,network,discovery

javascript:
  - pre-condition: |
      isPortOpen(Host,Port);
    code: |
      var m = require("nuclei/oracle");
      var response = m.IsOracle(Host, Port);
      Export(response);
    args:
      Host: "{{Host}}"
      Port: "1521"

    extractors:
      - type: regex
        name: Version
        regex:
          - 'Oracle TNS Listener Version:([0-9.]+)'
