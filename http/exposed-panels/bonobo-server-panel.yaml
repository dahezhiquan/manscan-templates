id: bonobo-server-panel

info:
  name: Bonobo Git Server 登录面板识别（指纹识别）
  author: bhutch
  severity: info
  description: |-
    检测到目标站点存在 Bonobo Git Server 相关响应特征。Bonobo Git Server 是代码托管或版本管理平台，用于管理仓库、分支、提交、权限和协作流程。模板请求 `/`、`/git` 路径，并通过页面标题或正文关键字、状态码确认该系统指纹，用于资产识别、系统盘点和暴露面梳理。
  classification:
    cpe: cpe:2.3:a:bonobogitserver:bonobo_git_server:*:*:*:*:*:*:*:*
  metadata:
    verified: true
    max-request: 2
    vendor: bonobogitserver
    product: bonobo_git_server
    shodan-query: http.favicon.hash:-219625874
  tags: panel,bonobo,git,login,detect,discovery
http:
  - method: GET
    path:
      - "{{BaseURL}}"
      - "{{BaseURL}}/git"

    host-redirects: true
    max-redirects: 2
    stop-at-first-match: true

    matchers-condition: and
    matchers:
      - type: word
        words:
          - '<a href="https://github.com/jakubgarfield/Bonobo-Git-Server">'

      - type: status
        status:
          - 200

    extractors:
      - type: regex
        part: body
        group: 1
        regex:
          - '(?i)bonobo git server \((.*)\)'
