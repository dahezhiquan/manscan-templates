id: openproject-detect

info:
  name: OpenProject 指纹识别（指纹识别）
  author: ricardomaia
  severity: info
  description: >-
    OpenProject 是开源项目管理平台，用于任务、路线图、工时、敏捷看板和团队协作。该模板通过请求目标服务并检查预设路径或首页响应、正则特征、页面正文关键字、HTTP
    响应头等指纹特征，判断目标是否使用或暴露了 OpenProject 相关组件；命中结果仅表示指纹特征匹配，可用于资产盘点、技术栈识别和后续安全评估，不代表已确认存在可利用漏洞。
  reference:
  - https://www.openproject.org/
  classification:
    cpe: cpe:2.3:a:openproject:openproject:*:*:*:*:*:*:*:*
  metadata:
    verified: "true"
    max-request: 3
    vendor: openproject
    product: openproject
    shodan-query: title:"openproject"
  tags: tech,openproject,api,detect,discovery
http:
  - method: GET
    path:
      - "{{BaseURL}}"
      - "{{BaseURL}}/api/v3"
      - "{{BaseURL}}/activity.atom"

    stop-at-first-match: true

    matchers-condition: or
    matchers:
      - type: regex
        regex:
          - '.*OpenProject.Foundation.\(OPF\)'
          - "<generator uri=.*openproject.org.*>"
        condition: or

      - type: word
        words:
          - "OpenProject"
          - "instanceName"
        condition: and

      - type: word
        part: header
        words:
          - "_open_project_session"
