id: k8s-tls-config-set

info:
  name: Ensure TLS config appropriately set（云安全）
  author: princechaddha
  severity: medium
  description: kube-apiserver 缺少 TLS 证书或私钥参数会影响 API Server 的传输加密和服务端身份认证。本模板读取 kube-apiserver 启动命令，发现缺少 tls-cert-file 或 tls-private-key-file 时报告。
  impact: |
    - 客户端到 API Server 的通信可能缺少可信服务端身份校验，增加中间人攻击风险。
    - 控制面访问链路不符合安全加固和合规要求。
  remediation: |
    - 为 kube-apiserver 配置 tls-cert-file 和 tls-private-key-file，并使用可信 CA 签发证书。
    - 定期轮换证书，监控证书过期时间，并限制私钥文件访问权限。
  reference:
    - https://kubernetes.io/docs/admin/kube-apiserver/
  metadata:
    vendor: kubernetes
    product: kubernetes
  tags: cloud,devops,kubernetes,security,devsecops,api-server,k8s-cluster-security
variables:
  argument: "tls-cert-file or tls-private-key-file"

self-contained: true
code:
  - engine:
      - sh
      - bash
    source: |
      kubectl get pods -n kube-system -l component=kube-apiserver -o jsonpath="{.items[*].spec.containers[*].command}"

    matchers-condition: and
    matchers:
      - type: word
        words:
          - 'kube-apiserver'

      - type: word
        words:
          - "tls-cert-file"
          - "tls-private-key-file"
        negative: true

    extractors:
      - type: dsl
        dsl:
          - '"API server configuration is missing the " + argument + " argument."'
