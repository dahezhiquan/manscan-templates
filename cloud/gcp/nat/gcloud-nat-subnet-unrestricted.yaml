id: gcloud-nat-subnet-unrestricted

info:
  name: NAT Gateway Subnets 未Restricted to Specific VPCs（云安全）
  author: princechaddha
  severity: medium
  description: Cloud NAT 配置为 ALL_IP_RANGES 会让 NAT 覆盖范围过宽，可能将不应出站的子网或地址段纳入转换范围。本模板枚举 VPC、router 和 NAT gateway，并在 subnetworks 配置中发现 ALL_IP_RANGES 时报告 NAT 子网范围未限制。
  impact: |
    - 不同安全域的工作负载可能共享同一 NAT 出站路径，增加出站访问放大和审计归因难度。
    - 受限子网被意外纳入 NAT 后，可能获得不符合策略的互联网出站能力。
  remediation: |
    - 将 Cloud NAT 配置为只覆盖确需出站访问的具体子网和 IP ranges，避免使用 ALL_IP_RANGES 作为默认配置。
    - 按环境或安全域拆分 NAT 网关，并结合防火墙和日志审计控制出站访问。
  reference:
    - https://cloud.google.com/nat/docs/using-nat
  metadata:
    vendor: google
    product: cloud-nat
  tags: cloud,devops,gcp,gcloud,google-cloud-nat,gcp-cloud-config

flow: |
  code(1)
  for(let projectId of iterate(template.projectIds)){
    set("projectId", projectId)
    code(2)
    for(let vpcNetwork of iterate(template.vpcNetworks)){
      set("vpcNetwork", vpcNetwork)
      code(3)
      for(let router of iterate(template.routers)){
        set("router", router)
        code(4)
        for(let natGateway of iterate(template.natGateways)){
          set("natGateway", natGateway)
          code(5)
        }
      }
    }
  }

self-contained: true

code:
  - engine:
      - sh
      - bash
    source: |
      gcloud projects list --format="json(projectId)"

    extractors:
      - type: json
        name: projectIds
        internal: true
        json:
          - '.[].projectId'

  - engine:
      - sh
      - bash
    source: |
      gcloud compute networks list --project $projectId --format="json(name)"

    extractors:
      - type: json
        name: vpcNetworks
        internal: true
        json:
          - '.[].name'

  - engine:
      - sh
      - bash
    source: |
      gcloud compute routers list --project $projectId --filter="network:($vpcNetwork)" --format="json(name)"

    extractors:
      - type: json
        name: routers
        internal: true
        json:
          - '.[].name'

  - engine:
      - sh
      - bash
    source: |
      gcloud compute routers nats list --router=$router --project=$projectId --format="json(name)"

    extractors:
      - type: json
        name: natGateways
        internal: true
        json:
          - '.[].name'

  - engine:
      - sh
      - bash
    source: |
      gcloud compute routers nats describe $natGateway --router=$router --project=$projectId --format="json(subnetworks)"

    matchers:
      - type: word
        words:
          - 'ALL_IP_RANGES'

    extractors:
      - type: dsl
        dsl:
          - '"NAT gateway " + natGateway + " under router " + router + " in project " + projectId + " is associated with unrestricted subnets."'
