id: ics-allen-bradley-guardplc-detect

info:
  name: Allen-Bradley GuardPLC Series PLC 识别（指纹识别）
  author: biero-el-corridor
  severity: info
  description: |
    Allen-Bradley GuardPLC Series PLC 是 Rockwell Automation/Allen-Bradley 工业控制器系列，常用于制造、过程控制和自动化现场控制场景。该模板连接 44818/TCP，通过匹配 `313735332d`、`313735342d`、`313735352d` 等二进制响应特征识别目标服务。
  metadata:
    shodan-query: 'port:44818 "Vendor ID: Rockwell Automation/Allen-Bradley"'
  tags: ics,allen-bradley,guardplc,detect,network,tcp

tcp:
  - inputs:
      - data: "630000000000000000000000000000000000000000000000"
        type: hex
        read: 200
        name: info

    host:
      - "{{Hostname}}"
    port: 44818
    read-size: 1024

    matchers-condition: or
    matchers:
      - type: binary
        part: info
        binary:
          - "313735332d" # 1753

      - type: binary
        part: info
        binary:
          - "313735342d" # 1754

      - type: binary
        part: info
        binary:
          - "313735352d" # 1755
