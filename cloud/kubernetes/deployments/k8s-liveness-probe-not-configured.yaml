id: k8s-liveness-probe-not-configured

info:
  name: Liveness Probe 未Configured 中的Deployments（云安全）
  author: princechaddha
  severity: medium
  description: Deployment 未配置 livenessProbe 时，Kubelet 难以及时识别并重启已死锁或不可恢复的容器。本模板枚举 Deployment，检查 Pod 模板中是否没有任何容器配置 livenessProbe。
  impact: |
    - 应用进程异常但容器仍存活时，服务可能长时间处于不可用或半可用状态。
    - 故障实例无法自动恢复，增加人工介入和业务中断时间。
  remediation: |
    - 为关键容器配置合适的 livenessProbe，避免探测过于激进导致误重启。
    - 结合 startupProbe 处理慢启动应用，并通过监控验证探测路径可靠。
  reference:
    - https://kubernetes.io/docs/tasks/configure-pod-container/configure-liveness-readiness-startup-probes/
  metadata:
    vendor: kubernetes
    product: kubernetes
  tags: cloud,devops,kubernetes,devsecops,deployments,k8s-cluster-security
flow: |
  code(1);
  for (let deployment of template.items) {
    set("deployment",deployment)
    javascript(1);
  }

self-contained: true
code:
  - engine:
      - sh
      - bash
    source: kubectl get deployments --all-namespaces --output=json
    extractors:
      - type: json
        name: items
        internal: true
        json:
          - '.items[]'

javascript:
  - code: |
        deployment = JSON.parse(template.deployment);
        if (!deployment.spec.template.spec.containers.some(container => container.livenessProbe)) {
          let result = (`Deployment '${deployment.metadata.name}' in namespace '${deployment.metadata.namespace}' lacks a configured liveness probe.`);
          Export(result);
        }

    extractors:
      - type: dsl
        dsl:
          - response
