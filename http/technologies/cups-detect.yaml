id: cups-detect

info:
  name: CUPS 指纹识别（指纹识别）
  author: rxerium
  severity: info
  description: |-
    CUPS 是通用 Unix 打印系统，用于打印队列、打印机共享和打印任务管理。该模板请求首页，并依据 HTTP 200/404/403 状态码、页面标题、正文关键字或品牌资源特征识别目标是否使用或暴露了 CUPS 相关组件，适用于资产盘点、技术栈识别和后续安全评估；命中结果仅表示指纹特征匹配，不代表已确认存在可利用漏洞。
  metadata:
    verified: true
    max-request: 1
    shodan-query: product:"CUPS (IPP)"
  tags: cups,tech,detect,discovery

http:
  - method: GET
    path:
      - "{{BaseURL}}"

    matchers-condition: and
    matchers:
      - type: word
        part: body
        words:
          - "Web Interface is Disabled - CUPS"
          - "Forbidden - CUPS"
          - "Server: CUPS"
        condition: or

      - type: status
        status:
          - 200
          - 404
          - 403
        condition: or

    extractors:
      - type: regex
        part: body
        name: version
        regex:
          - 'CUPS v([0-9.]+)>'
