id: kaseya-vsa-login-panel

info:
  name: Kaseya VSA - 登录面板（指纹识别）
  author: rxerium
  severity: info
  description: |-
    检测到 Kaseya 虚拟系统管理员（VSA）登录面板。
  reference:
    - https://www.kaseya.com/products/vsa/
  metadata:
    verified: true
    max-request: 1
    shodan-query: http.html:"/vsapres/web20/core/login.aspx"
  tags: panel,kaseya,vsa,login,detect

http:
  - method: GET
    path:
      - "{{BaseURL}}"

    matchers-condition: and
    matchers:
      - type: word
        part: body
        words:
          - '/vsapres/web20/core/login.aspx'

      - type: status
        status:
          - 200
