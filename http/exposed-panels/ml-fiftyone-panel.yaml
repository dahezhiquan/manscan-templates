id: ml-fiftyone-panel

info:
  name: 检测 FiftyOne 面板（指纹识别）
  author: rxerium
  severity: info
  description: |-
    检测到目标站点存在 检测 FiftyOne 相关响应特征。检测 FiftyOne 是 AI、机器学习或 Notebook 相关平台，用于管理模型、数据集、工作区、实验、推理服务或训练任务。模板请求 `/`，并通过页面标题或正文关键字、状态码确认该系统指纹，用于资产识别、系统盘点和暴露面梳理。
  reference:
    - https://github.com/voxel51/fiftyone
    - https://docs.voxel51.com
  metadata:
    verified: true
    max-request: 1
    vendor: voxel51
    product: fiftyone
    shodan-query: 'http.title:"FiftyOne"'
  tags: panel,fiftyone,ml,ai,computer-vision,detect,discovery
http:
  - method: GET
    path:
      - "{{BaseURL}}"

    host-redirects: true
    max-redirects: 2

    matchers-condition: and
    matchers:
      - type: word
        part: body
        words:
          - "<title>FiftyOne</title>"
          - "Explore, Analyze, Curate"
          - 'id="colorModal"'
        condition: and

      - type: status
        status:
          - 200
