id: ricoh-webimagemonitor-panel

info:
  name: Ricoh Web Image Monitor 识别（指纹识别）
  author: righettod
  severity: info
  description: |
    该模板通过识别 Ricoh Web Image Monitor 面板、控制台或管理界面的页面特征，判断目标是否暴露了对应服务入口。若命中，说明该后台或运维界面对外可访问，可用于资产识别与暴露面排查。
  reference:
    - https://support.ricoh.com/bb_v1oi/pub_e/oi_view/0001082/0001082137/view/intro/int/wim.htm
  metadata:
    verified: true
    max-request: 1
    shodan-query: http.html:"Web Image Monitor"
  tags: panel,ricoh,detect,discovery

http:
  - method: GET
    path:
      - "{{BaseURL}}/web/guest/en/websys/webArch/header.cgi"

    matchers:
      - type: dsl
        dsl:
          - 'status_code == 200'
          - 'contains_all(to_lower(body), "web image monitor</h3", "ricoh")'
        condition: and

    extractors:
      - type: regex
        part: body
        group: 1
        regex:
          - '(?i)<h2 id="modelName" style="z-index:1;">([A-Z0-9\s]+)</h2>'
