id: cache-redis-encryption-disabled

info:
  name: ElastiCache Redis In-Transit and At-Rest 加密 -未启用（云安全）
  author: DhiyaneshDK
  severity: high
  description: ElastiCache Redis/Valkey 复制组应启用传输中加密和静态加密，以保护客户端到缓存节点通信、备份、同步和磁盘数据。本模板枚举指定区域的 replication group，并查询 AtRestEncryptionEnabled 与 TransitEncryptionEnabled；任一返回 false 时报告加密未完整启用。
  impact: |
    - 未启用传输中加密时，缓存数据和认证信息在网络路径上更容易被窃听或篡改。
    - 未启用静态加密时，备份、同步过程和底层存储中的敏感缓存数据缺少额外保护。
  remediation: |
    - 新建或迁移 Redis/Valkey replication group 时启用 TransitEncryptionEnabled 和 AtRestEncryptionEnabled。
    - 对现有不支持在线启用的集群规划迁移，并同步更新客户端 TLS 连接配置和证书校验策略。
  reference:
    - https://www.trendmicro.com/cloudoneconformity-staging/knowledge-base/aws/ElastiCache/in-transit-and-at-rest-encryption.html
    - https://docs.aws.amazon.com/AmazonElastiCache/latest/red-ug/in-transit-encryption.html
    - https://docs.aws.amazon.com/AmazonElastiCache/latest/red-ug/at-rest-encryption.html
  metadata:
    vendor: amazon
    product: elasticache
  tags: cloud,devops,aws,amazon,elasticache,aws-cloud-config

variables:
  region: "us-west-2"

flow: |
  code(1)
  for(let ReplicationGroupId of iterate(template.replicationgroupids)){
    set("replicationgroup", ReplicationGroupId)
    code(2)
  }

self-contained: true

code:
  - engine:
      - sh
      - bash
    source: |
      aws elasticache describe-replication-groups --region $region --output json --query 'ReplicationGroups[*].ReplicationGroupId'

    extractors:
      - type: json
        name: replicationgroupids
        internal: true
        json:
          - '.[]'

  - engine:
      - sh
      - bash

    source: |
        aws elasticache describe-replication-groups --region $region --replication-group-id $replicationgroup --query 'ReplicationGroups[*].[AtRestEncryptionEnabled,TransitEncryptionEnabled] | []' --output json

    matchers:
      - type: word
        words:
          - "false"

    extractors:
      - type: dsl
        dsl:
          - 'replicationgroup + " ElastiCache Redis In-Transit and At-Rest Encryption is Disabled"'
