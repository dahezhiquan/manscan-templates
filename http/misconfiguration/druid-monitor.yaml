id: druid-monitor

info:
  name: Alibaba Druid Monitor 未授权 访问
  author: ohlinge
  severity: high
  description: |
    检测到 Alibaba Druid Monitor 未授权 访问。目标功能在未认证状态下可访问，可能暴露管理入口、业务数据、系统状态或可执行操作，需确认是否存在访问控制缺失。
  metadata:
    max-request: 1
  tags: druid,alibaba,unauth,misconfig,vuln

http:
  - method: GET
    path:
      - "{{BaseURL}}/druid/index.html"

    matchers-condition: and
    matchers:
      - type: word
        words:
          - 'Druid Stat Index</title>'

      - type: status
        status:
          - 200
