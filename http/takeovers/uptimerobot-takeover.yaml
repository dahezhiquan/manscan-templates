id: uptimerobot-takeover

info:
  name: UptimeRobot 自定义域名接管检测（子域名接管）
  author: pdteam
  severity: low
  description: 检测 UptimeRobot 自定义域名返回 Caddy 服务端特征的情况，结合参考资料可用于识别未绑定或可重新绑定的公开状态页域名接管风险。
  reference:
    - https://exploit.linuxsec.org/uptimerobot-com-custom-domain-subdomain-takeover/
    - https://github.com/EdOverflow/can-i-take-over-xyz/issues/45
  metadata:
    max-request: 1
  tags: takeover,vuln

http:
  - method: GET
    path:
      - "{{BaseURL}}"

    matchers-condition: and
    matchers:
      - type: dsl
        dsl:
          - Host != ip

      - type: regex
        regex:
          - "^page not found$"

      - type: word
        part: header
        words:
          - "Server: Caddy"
        case-insensitive: true

      - type: status
        status:
          - 404

    extractors:
      - type: dsl
        dsl:
          - cname
