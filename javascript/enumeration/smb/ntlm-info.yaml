id: ntlm-info

info:
  name: NTLM 信息枚举（服务漏洞）
  author: pussycat0x
  severity: info
  description: |
    该模板通过 NTLM 协议响应枚举主机域、主机名与身份验证相关信息。
  reference:
    - https://www.crowdstrike.com/cybersecurity-101/ntlm-windows-new-technology-lan-manager/
  metadata:
    shodan-query: "port:445"
    verified: true
  tags: js,network,smb,enum,discovery

javascript:
  - code: |
      var m = require("nuclei/smb");
      var c = m.SMBClient();
      var response = c.ConnectSMBInfoMode(Host, Port);
      to_json(response);

    args:
      Host: "{{Host}}"
      Port: "445"

    matchers:
      - type: dsl
        dsl:
          - "len(ntlm) != 0"

    extractors:
      - type: json
        internal: true
        part: response
        name: ntlm
        json:
          - '.NTLM'

      - type: json
        json:
          - '"NTLM: "+ .NTLM'
