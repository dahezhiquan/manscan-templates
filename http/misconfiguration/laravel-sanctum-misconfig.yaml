id: laravel-sanctum-misconfig

info:
  name: Laravel Sanctum Stateful Domain CSRF 配置不当
  author: moamenbasel
  severity: medium
  description: |
    检测到 Laravel Sanctum Stateful Domain CSRF 配置不当。目标响应或文件中可能暴露配置、凭据、密钥、令牌、环境变量或历史记录等敏感信息，可能被用于进一步入侵。
  impact: |
    - 凭据、密钥、配置或环境变量泄露后，攻击者可能访问内部系统或第三方服务。
    - 泄露信息可被用于横向移动、权限提升或供应链攻击。
  remediation: |
    - 立即移除公开文件中的敏感信息并轮换已暴露的凭据、密钥和令牌。
    - 使用安全的密钥管理方案，并阻止配置、日志和历史文件被 Web 直接访问。
  reference:
    - https://laravel.com/docs/11.x/sanctum#spa-authentication
    - https://laravel.com/docs/11.x/sanctum#cors-and-cookies
  metadata:
    verified: true
    max-request: 1
    shodan-query: html:"sanctum.csrf-cookie"
  tags: laravel,sanctum,csrf,misconfig,cors

http:
  - raw:
      - |
        GET /sanctum/csrf-cookie HTTP/1.1
        Host: {{Hostname}}
        Origin: https://evil.oast.pro
        Referer: https://evil.oast.pro

    matchers-condition: and
    matchers:
      - type: word
        part: header
        words:
          - "XSRF-TOKEN"

      - type: regex
        part: header
        regex:
          - "(?i)access-control-allow-origin:\\s*https?://evil\\.oast\\.pro"
          - "(?i)access-control-allow-credentials:\\s*true"
        condition: and

      - type: status
        status:
          - 200
          - 204
