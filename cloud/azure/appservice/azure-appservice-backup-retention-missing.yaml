id: azure-appservice-backup-retention-missing
info:
  name: Azure App Service 备份保留期限未配置（云安全）
  author: princechaddha
  severity: medium
  description: Azure App Service 备份未配置 retentionPeriodInDays 时，即使存在备份计划，也无法明确保留窗口。该模板枚举 Web App，查询 backupSchedule.retentionPeriodInDays，并在返回 Backup configuration not found 时报告缺少备份保留配置。
  impact: |
    - 备份可能无法覆盖组织要求的恢复点目标，导致误操作、攻击或合规调查期间缺少可用历史版本。
    - 保留策略不明确会增加过早删除备份、恢复窗口不足和恢复成本不可控的风险。
  remediation: |
    - 为 App Service 备份计划设置符合业务恢复点目标和合规要求的 retentionPeriodInDays。
    - 定期检查备份任务成功率和实际保留时间，结合恢复演练、存储生命周期和访问控制验证策略有效性。
  reference:
    - https://docs.microsoft.com/en-us/azure/app-service/manage-backup
  metadata:
    vendor: microsoft
    product: azure-app-service
  tags: cloud,devops,azure,microsoft,appservice,azure-cloud-config

flow: |
  code(1);
  for (let AppServiceData of iterate(template.appServiceList)) {
    AppServiceData = JSON.parse(AppServiceData);
    set("name", AppServiceData.name);
    set("resourceGroup", AppServiceData.resourceGroup);
    code(2);
  }

self-contained: true
code:
  - engine:
      - sh
      - bash
    source: |
      az webapp list --output json --query '[*].{name:name, resourceGroup:resourceGroup}'

    extractors:
      - type: json
        name: appServiceList
        internal: true
        json:
          - '.[]'

  - engine:
      - sh
      - bash
    source: |
      az webapp config backup show --webapp-name $name --resource-group $resourceGroup --query 'backupSchedule.retentionPeriodInDays' --output json

    matchers:
      - type: word
        part: stderr
        words:
          - "Backup configuration not found"

    extractors:
      - type: dsl
        dsl:
          - 'name + " in " + resourceGroup + " does not have a backup retention period configured"'
