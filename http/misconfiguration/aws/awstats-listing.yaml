id: awstats-listing

info:
  name: AWStats Listing 检测
  author: tess
  severity: low
  description: |
    检测到 AWStats Listing 检测。Web 服务器或应用目录允许列出文件内容，可能泄露备份文件、配置文件、日志、源码或其他未公开资源。
  metadata:
    max-request: 1
  tags: misconfig,aws,exposure,amazon,awstats,oss,vuln

http:
  - method: GET
    path:
      - "{{BaseURL}}/awstats/data"

    matchers-condition: and
    matchers:
      - type: word
        part: body
        words:
          - 'Index of /awstats/data/'
          - '">awstats'
        condition: and

      - type: status
        status:
          - 200
