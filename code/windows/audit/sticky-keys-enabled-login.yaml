id: sticky-keys-enabled-login

info:
  name: 登录界面粘滞键已启用（本地基线扫描）
  author: princechaddha
  severity: high
  description: |
    该模板检查登录前 Sticky Keys 是否可用。该机制曾被滥用于替换系统二进制并绕过登录。
  impact: |
    具备本地访问的攻击者可能利用辅助功能入口获取未授权命令执行。
  remediation: |
    禁用登录界面不必要的辅助功能热键，并保护系统文件完整性。
  tags: windows,sticky-keys,login,code,windows-audit

self-contained: true

code:
  - pre-condition: |
      IsWindows();
    engine:
      - powershell
      - powershell.exe
    args:
      - -ExecutionPolicy
      - Bypass
    pattern: "*.ps1"
    source: |
      Test-Path -Path "C:\Windows\System32\sethc.exe"

    matchers:
      - type: word
        words:
          - "True"
