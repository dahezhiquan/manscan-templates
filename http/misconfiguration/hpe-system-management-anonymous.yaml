id: hpe-system-management-anonymous-access

info:
  name: HPE System 管理 匿名 访问
  author: divya_mudgal
  severity: low
  description: |
    检测到 HPE System 管理 匿名 访问。目标功能在未认证状态下可访问，可能暴露管理入口、业务数据、系统状态或可执行操作，需确认是否存在访问控制缺失。
  metadata:
    max-request: 1
  tags: hp,unauth,misconfig,vuln

http:
  - method: GET
    path:
      - "{{BaseURL}}/chpstrt.php?chppath=Home"

    matchers-condition: and
    matchers:
      - type: word
        condition: and
        words:
          - "username = \"hpsmh_anonymous\";"
          - "var host_addr = '"
          - "var ip_addr   = '"
