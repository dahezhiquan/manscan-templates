id: mercari-phish

info:
  name: Mercari 仿冒钓鱼网站（钓鱼网站识别）
  author: rxerium
  severity: info
  description: |
    检测到疑似仿冒 Mercari 的钓鱼网站。模板在目标页面返回 200、页面内容命中 Mercari 的品牌页面特征，且当前主机不属于 mercari.com 官方域名时触发，用于识别借用 Mercari 品牌页面诱导用户信任的仿冒站点。
  reference:
    - https://mercari.com
  metadata:
    max-request: 1
  tags: phishing,mercari,ecommerce,osint,discovery
http:
  - method: GET
    path:
      - "{{BaseURL}}"

    host-redirects: true
    max-redirects: 2

    matchers-condition: and
    matchers:
      - type: word
        words:
          - 'Mercari'
          - 'Your Go-to Marketplace for Deals on Used &amp; Secondhand Items | Mercari'
        condition: and

      - type: status
        status:
          - 200

      - type: dsl
        dsl:
          - '!contains(host,"mercari.com")'
