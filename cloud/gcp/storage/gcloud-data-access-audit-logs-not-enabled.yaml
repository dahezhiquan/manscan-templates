id: gcloud-data-access-audit-logs-not-enabled

info:
  name: Enable Data 访问 审计 Logs 的Cloud Storage（云安全）
  author: princechaddha
  severity: medium
  description: Cloud Storage Data Access audit logs 可记录对象读取、写入和管理访问，未启用会造成数据访问审计缺口。本模板检查项目 IAM policy 的 auditConfigs，验证 ADMIN_READ、DATA_READ、DATA_WRITE 与 allServices 配置是否满足审计要求。
  impact: |
    - 对象读取、下载、写入或删除行为可能缺少完整审计记录，影响数据泄露调查。
    - 安全团队无法基于访问日志及时发现异常批量访问或跨地域访问模式。
  remediation: |
    - 为 storage.googleapis.com 或 allServices 启用 Data Access audit logs，覆盖 ADMIN_READ、DATA_READ 和 DATA_WRITE。
    - 将审计日志集中保存并配置异常对象访问、批量下载和权限变更告警。
  reference:
    - https://cloud.google.com/logging/docs/audit
  metadata:
    vendor: google
    product: cloud-storage
  tags: cloud,devops,gcp,gcloud,google-cloud-storage,audit-logs,security,gcp-cloud-config

flow: |
  code(1)
  for(let projectId of iterate(template.projectIds)){
    set("projectId", projectId)
    code(2)
  }

self-contained: true

code:
  - engine:
      - sh
      - bash
    source: |
      gcloud projects list --format="json(projectId)"

    extractors:
      - type: json
        name: projectIds
        internal: true
        json:
          - '.[].projectId'

  - engine:
      - sh
      - bash
    source: |
      gcloud projects get-iam-policy $projectId --format="json(auditConfigs)" | jq -r '.auditConfigs[]?.auditLogConfigs[]?.logType // "null"'

    matchers:
      - type: word
        words:
          - 'ADMIN_READ'
          - 'DATA_READ'
          - 'DATA_WRITE'
        condition: and

      - type: word
        words:
          - '"service": "allServices"'
        negative: true

    extractors:
      - type: dsl
        dsl:
          - '"Data Access audit logs are not enabled for the \"storage.googleapis.com\" service in project " + projectId'
