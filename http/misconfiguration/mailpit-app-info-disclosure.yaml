id: mailpit-app-info-disclosure

info:
  name: Mailpit App 信息泄露
  author: DhiyaneshDK
  severity: medium
  description: |
    检测到 Mailpit App 信息泄露。目标可能暴露云实例、容器或运行环境元数据，攻击者可据此获取实例身份、网络配置、凭据线索或部署信息。
  reference:
    - https://github.com/axllent/mailpit
    - https://mailpit.axllent.org/docs/api/
  metadata:
    verified: true
    max-request: 1
    shodan-query: title:"Mailpit"
  tags: mailpit,exposure,disclosure,misconfig,vuln

http:
  - method: GET
    path:
      - "{{BaseURL}}/api/v1/messages"

    matchers-condition: and
    matchers:
      - type: word
        part: body
        words:
          - '"messages":'
          - '"ID":'
        condition: and

      - type: word
        part: content_type
        words:
          - 'application/json'

      - type: status
        status:
          - 200
