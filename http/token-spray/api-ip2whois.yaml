id: api-ip2whois

info:
  name: IP2WHOIS API Token 可用性校验（token喷洒）
  author: daffainfo
  severity: info
  description: 该模板通过调用 IP2WHOIS API 的已知接口验证提供的 token 是否有效，命中后通常表示可访问IP、网络或归属信息查询能力。
  reference:
    - https://www.ip2whois.com/developers-api
    - https://github.com/daffainfo/all-about-apikey/tree/main/ip2whois
  metadata:
    max-request: 1
  tags: token-spray,ip2whois

self-contained: true

http:
  - method: GET
    path:
      - "https://api.ip2whois.com/v2?key={{token}}&domain=daffa.tech&format=json"

    matchers:
      - type: word
        part: body
        words:
          - '"domain"'
          - '"domain_id"'
          - '"whois_server"'
        condition: and
