id: api-abstract-website-scraping

info:
  name: Abstract API Web Scraping Token 可用性校验（token喷洒）
  author: daffainfo
  severity: info
  description: 该模板通过调用 Abstract Website Scraping API 验证提供的 token 是否有效，命中后通常表示可访问网页抓取与内容提取能力。
  reference:
    - https://www.abstractapi.com/api/web-scraping-api
    - https://github.com/daffainfo/all-about-apikey/tree/main/abstract-website-scraping
  metadata:
    max-request: 1
  tags: token-spray,abstractapi

self-contained: true

http:
  - method: GET
    path:
      - "https://scrape.abstractapi.com/v1/?api_key={{token}}&url=https://test.test"

    matchers:
      - type: word
        part: body
        words:
          - '"code":"validation_error"'
          - 'Reached error page'
        condition: and
