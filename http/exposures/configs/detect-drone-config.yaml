id: detect-drone-config

info:
  name: Drone 配置检测（暴露面识别）
  author: geeknik
  severity: high
  description: 检测到对外可访问的 Drone 配置。这类配置资源可能包含部署细节、访问凭据、内部地址、组件版本或调试开关，公开暴露后会显著增加被侦察和后续利用的风险。
  reference:
    - https://github.com/drone/drone
  metadata:
    max-request: 1
  tags: config,exposure,drone,discovery

http:
  - method: GET
    path:
      - "{{BaseURL}}/.drone.yml"

    matchers-condition: and
    matchers:
      - type: word
        words:
          - "kind:"
          - "name:"
          - "steps:"
        condition: and

      - type: status
        status:
          - 200
