id: web-suite-detect

info:
  name: Web Suite 指纹识别（指纹识别）
  author: pikpikcu
  severity: info
  description: >-
    Web Suite 是 Web 应用或管理套件类系统，用于集中提供站点、业务或设备管理入口。该模板通过请求目标服务并检查预设路径或首页响应、页面正文关键字、状态码、正则特征等指纹特征，判断目标是否使用或暴露了
    Web Suite 相关组件；命中结果仅表示指纹特征匹配，可用于资产盘点、技术栈识别和后续安全评估，不代表已确认存在可利用漏洞。
  metadata:
    max-request: 3
    fofa-query: Web Suite 2021 Login
  tags: tech,web-suite,discovery
http:
  - method: GET
    path:
      - "{{BaseURL}}"
      - "{{BaseURL}}/ws2020/"
      - "{{BaseURL}}/ws2021/"

    matchers-condition: and
    matchers:
      - type: word
        part: body
        words:
          - 'www.bqe.com">BQE Software Inc.</a>'
          - 'Web Suite'
        condition: and

      - type: status
        status:
          - 200

    extractors:
      - type: regex
        part: body
        group: 1
        regex:
          - "Version: (.*)</span>"
