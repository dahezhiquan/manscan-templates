id: jaeger-eol

info:
  name: Jaeger EOL 指纹识别（指纹识别）
  author: Shivam Kamboj
  severity: info
  description: >-
    Jaeger 是用于分布式链路追踪的可观测性系统，EOL 版本表示目标部署的 Jaeger 分支已结束维护。该模板通过请求目标服务并检查预设路径或首页响应、页面正文关键字、正则特征、DSL
    条件等指纹特征，判断目标是否使用或暴露了 Jaeger EOL 相关组件；命中结果仅表示指纹特征匹配，可用于资产盘点、技术栈识别和后续安全评估，不代表已确认存在可利用漏洞。
  reference:
  - https://endoflife.date/jaeger
  - https://github.com/jaegertracing/jaeger/issues/6321
  metadata:
    verified: true
    max-request: 1
    shodan-query: "title:\"Jaeger UI\""
  tags: tech,jaeger,eol
http:
  - method: GET
    path:
      - "{{BaseURL}}"

    extractors:
      - type: regex
        part: body
        name: version
        group: 1
        regex:
          - '"gitVersion":"v?([0-9]+\.[0-9.]+)"'

    matchers:
      - type: dsl
        dsl:
          - 'len(version) > 0 && compare_versions(version, "<2.0")'
