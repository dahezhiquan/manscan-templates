id: gcloud-pg-log-executor-stats-enabled

info:
  name: PostgreSQL 数据库实例启用了 log_executor_stats（云安全）
  author: princechaddha
  severity: medium
  description: PostgreSQL log_executor_stats 会输出执行器性能统计，通常用于临时调试，长期启用会增加日志噪声和性能开销。本模板枚举 Cloud SQL PostgreSQL 实例并检查 databaseFlags 中 log_executor_stats 的值，匹配 on 时报告该统计日志已启用。
  impact: |
    - 大量执行器统计日志可能掩盖真正的安全事件和数据库错误，增加日志存储与分析成本。
    - 额外统计开销可能影响高负载实例性能，并暴露查询执行细节。
  remediation: |
    - 关闭 Cloud SQL PostgreSQL 实例的 log_executor_stats，仅在临时诊断窗口中按需启用。
    - 如需性能分析，优先使用受控的监控指标、Query Insights 或短期采样，并在完成后恢复基线配置。
  reference:
    - https://cloud.google.com/sql/docs/postgres/flags
  metadata:
    vendor: google
    product: cloud-sql
  tags: cloud,devops,gcp,gcloud,google-cloud-sql,postgresql,gcp-cloud-config

flow: |
  code(1)
  for(let projectId of iterate(template.projectIds)){
    set("projectId", projectId)
    code(2)
    for(let sqlInstance of iterate(template.sqlInstances)){
      set("sqlInstance", sqlInstance)
      code(3)
    }
  }

self-contained: true

code:
  - engine:
      - sh
      - bash
    source: |
      gcloud projects list --format="json(projectId)"

    extractors:
      - type: json
        name: projectIds
        internal: true
        json:
          - '.[].projectId'

  - engine:
      - sh
      - bash
    source: |
      gcloud sql instances list --project $projectId --filter='DATABASE_VERSION:POSTGRES*' --format="json(name)"

    extractors:
      - type: json
        name: sqlInstances
        internal: true
        json:
          - '.[].name'

  - engine:
      - sh
      - bash
    source: |
      gcloud sql instances describe $sqlInstance --project $projectId --format=json | jq '.settings.databaseFlags // [] | map(select(.name == "log_executor_stats")) | .[].value'

    matchers:
      - type: word
        words:
          - 'on'

    extractors:
      - type: dsl
        dsl:
          - '"The log_executor_stats flag is enabled for PostgreSQL instance " + sqlInstance + " in project " + projectId'
