id: litellm-unauth-model-exposure

info:
  name: LiteLLM Proxy Model 暴露
  author: DevamShah
  severity: medium
  description: |
    检测到 LiteLLM Proxy Model 暴露。目标功能在未认证状态下可访问，可能暴露管理入口、业务数据、系统状态或可执行操作，需确认是否存在访问控制缺失。
  impact: |
    - 未授权用户可能访问管理功能、业务数据或系统状态。
    - 暴露接口可能被用于进一步枚举、修改配置或执行敏感操作。
  remediation: |
    - 为相关管理界面和 API 启用强认证、授权校验和最小权限控制。
    - 将后台端点限制在可信网络或 VPN 内，并记录访问审计日志。
  reference:
    - https://docs.litellm.ai/docs/proxy/virtual_keys
    - https://docs.litellm.ai/docs/proxy/configs
    - https://github.com/BerriAI/litellm
  classification:
    cvss-metrics: CVSS:3.1/AV:N/AC:L/PR:N/UI:N/S:U/C:L/I:N/A:L
    cvss-score: 6.5
    cwe-id: CWE-862
  metadata:
    verified: true
    max-request: 1
    vendor: berriai
    product: litellm
    shodan-query:
      - 'http.title:"LiteLLM API - Swagger UI"'
      - 'http.html:"LiteLLM"'
    fofa-query: title="LiteLLM API"
  tags: litellm,llm,ai,misconfig,exposure

http:
  - method: GET
    path:
      - "{{BaseURL}}/model/info"

    matchers-condition: and
    matchers:
      - type: dsl
        dsl:
          - 'status_code == 200'
          - 'contains(content_type, "application/json")'
          - 'contains_all(body, "\"data\":", "\"litellm_params\":", "\"model_info\":")'
        condition: and

    extractors:
      - type: json
        name: models
        part: body
        json:
          - '.data[].model_name'
