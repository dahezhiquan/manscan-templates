id: homebridge-unfinished-install

info:
  name: Homebridge 未完成安装暴露
  author: theamanrawat
  severity: high
  description: |
    该模板用于核查 Homebridge 未完成安装暴露。该类问题通常源于安装、初始化、升级或配置向导在部署完成后仍可从公网访问。模板会向目标发送探测请求，并依据请求 `/`、`/api/auth/settings`、匹配 `status_code == 200`、匹配 `contains(body, "<title>Homebridge")`、匹配 `"setupWizardComplete":false`等证据确认目标是否存在该配置问题。
  impact: |
    - 攻击者可能完成初始化流程、创建管理员账户、覆盖配置或触发升级逻辑。
    - 在部分系统中，暴露安装入口还可能导致数据库连接信息泄露、站点被重新配置或业务被接管。
  remediation: |
    - 完成部署后立即删除、禁用或限制安装与升级入口。
    - 对初始化流程增加来源限制和一次性安装校验，避免公网直接访问。
    - 检查系统是否已被异常初始化或创建未知管理员账户，并轮换相关凭据。
  reference:
    - https://homebridge.io/
    - https://github.com/homebridge/homebridge-config-ui-x
  classification:
    cvss-metrics: CVSS:3.1/AV:N/AC:L/PR:N/UI:N/S:U/C:H/I:H/A:H
    cvss-score: 9.8
    cwe-id: CWE-284
  metadata:
    verified: true
    max-request: 2
    shodan-query: title:"Homebridge"
    fofa-query: title="Homebridge"
  tags: homebridge,misconfig,exposure,iot,smart-home,unauth

flow: http(1) && http(2)

http:
  - method: GET
    path:
      - "{{BaseURL}}/"

    matchers:
      - type: dsl
        dsl:
          - 'status_code == 200'
          - 'contains(body, "<title>Homebridge")'
        condition: and
        internal: true

  - method: GET
    path:
      - "{{BaseURL}}/api/auth/settings"

    matchers-condition: and
    matchers:
      - type: word
        part: body
        words:
          - '"setupWizardComplete":false'

      - type: word
        part: header
        words:
          - "application/json"

      - type: status
        status:
          - 200
