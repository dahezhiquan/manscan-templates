id: dom-xss

info:
  name: DOM 型跨站脚本 XSS（DAST）
  author: theamanrawat,AmirHossein Raeisi,dwisiswant0
  severity: medium
  description: |
    DOM 型 XSS 发生在前端 JavaScript 从 URL、片段、存储或消息中读取不可信数据并写入危险 DOM sink。模板在 headless 浏览器中向参数注入脚本载荷，若页面执行并触发弹窗事件，则确认客户端 DOM 处理链路可被利用。
  impact: |
    - 攻击者可在用户浏览器中执行任意脚本，读取页面敏感数据、劫持操作或调用同源 API。
    - DOM XSS 常不经过服务端日志和传统后端过滤，排查与溯源难度更高。
  remediation: |
    - 避免使用 `innerHTML`、`document.write`、字符串拼接事件处理器等危险 sink 处理不可信输入。
    - 使用安全 DOM API、可信类型（Trusted Types）、前端 Sanitizer 和严格 CSP 降低脚本执行面。
  tags: xss,dom,dast,headless,vuln

variables:
  num: "{{rand_int(10000, 99999)}}"

headless:
  - steps:
      - action: navigate
        args:
          url: "{{BaseURL}}"

      - action: waitdialog
        name: reflected

    payloads:
      reflection:
        - "'\"><script>alert({{num}})</script>"

    fuzzing:
      - part: query
        type: postfix
        mode: single
        fuzz:
          - "{{url_encode(reflection)}}"

      - part: path
        type: postfix
        mode: single
        fuzz:
          - "{{reflection}}"

    stop-at-first-match: true
    matchers:
      - type: dsl
        dsl:
          - reflected == true
          - reflected_message == num
        condition: and
