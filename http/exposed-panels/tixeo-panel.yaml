id: tixeo-panel

info:
  name: Tixeo 登录面板识别（指纹识别）
  author: righettod
  severity: info
  description: |-
    Tixeo 是视频会议与协作平台，用于会议、用户认证和通信服务管理。该模板请求 `/meet/services/json/v1/settings`、`/meet/login.html`、`/meet/`，并依据 DSL 条件识别目标是否部署了该系统或暴露了对应入口，适用于资产指纹确认；命中结果仅表示系统特征匹配，不代表已确认存在未授权访问或可利用漏洞。
  reference:
  - https://www.tixeo.com/en/
  metadata:
    verified: true
    max-request: 3
    shodan-query: "http.title:\"tixeo\""
  tags: panel,tixeo,login,detect,discovery
http:
  - method: GET
    path:
      - "{{BaseURL}}/meet/services/json/v1/settings"
      - "{{BaseURL}}/meet/login.html"
      - "{{BaseURL}}/meet/"

    stop-at-first-match: true

    matchers:
      - type: dsl
        dsl:
          - 'contains(header, "Tixeo")'
          - 'contains_any(to_lower(body), "tixeo-button", "tixeoclient")'
        condition: or

    extractors:
      - type: regex
        part: body
        group: 1
        regex:
          - '"applicationVersion"\s*:\s*"([0-9.]+)"'
