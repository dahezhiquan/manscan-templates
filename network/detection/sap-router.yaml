id: sap-router

info:
  name: SAPRouter 识别（指纹识别）
  author: randomstr1ng
  severity: info
  description: |
    SAProuter 是 SAP 网络通信代理组件，用于在客户网络、SAP 网络和外部连接之间转发流量。该模板连接 3299/TCP 并读取协议响应，通过匹配 `SAProuter` 等响应特征识别目标服务。
  metadata:
    max-request: 1
  tags: network,sap,detect,saprouter,tcp,discovery

tcp:
  - inputs:
      - data: 57484f415245594f553f0a
        type: hex

    host:
      - "{{Hostname}}"
    port: 3299
    read-size: 1024

    matchers:
      - type: word
        words:
          - "SAProuter"
