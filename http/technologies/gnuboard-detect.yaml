id: gnuboard-detect

info:
  name: Gnuboard CMS 指纹识别（指纹识别）
  author: gy741
  severity: info
  description: >-
    Gnuboard 是韩国常用的 PHP 论坛和内容管理系统，用于构建社区、公告和会员站点。该模板通过请求目标服务并检查预设路径或首页响应、页面正文关键字、HTTP
    响应头、正则特征等指纹特征，判断目标是否使用或暴露了 Gnuboard CMS 相关组件；命中结果仅表示指纹特征匹配，可用于资产盘点、技术栈识别和后续安全评估，不代表已确认存在可利用漏洞。
  reference:
  - https://sir.kr/
  classification:
    cvss-metrics: CVSS:3.1/AV:N/AC:L/PR:N/UI:N/S:U/C:N/I:N/A:N
    cvss-score: 0
    cwe-id: CWE-200
  metadata:
    max-request: 1
  tags: tech,gnuboard,discovery
http:
  - method: GET
    path:
      - "{{BaseURL}}/LICENSE.txt"

    matchers-condition: and
    matchers:
      - type: word
        part: body
        words:
          - 'GNU Board'
          - 'http://sir.kr'
        condition: and

      - type: word
        part: header
        words:
          - 'text/plain'

    extractors:
      - type: regex
        part: body
        group: 1
        regex:
          - '\( GNU Board (.*) \)'
