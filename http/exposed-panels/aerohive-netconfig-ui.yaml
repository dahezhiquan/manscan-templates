id: aerohive-netconfig-ui

info:
  name: Aerohive NetConfig UI 面板识别（指纹识别）
  author: pussycat0x
  severity: info
  description: |-
    检测到目标站点存在 Aerohive NetConfig UI 相关响应特征。Aerohive NetConfig UI 是网络设备配置界面，用于维护无线接入、交换、路由和设备管理参数。模板请求 `/index.php5`，并通过页面标题或正文关键字、状态码确认该系统指纹，用于资产识别、系统盘点和暴露面梳理。
  reference:
    - https://docs.aerohive.com/330000/docs/help/english/ng/Content/reference/docs/online-help-systems.htm
  classification:
    cwe-id: CWE-200
    cpe: cpe:2.3:h:extremenetworks:aerohive_netconfig:*:*:*:*:*:*:*:*
  metadata:
    max-request: 1
    shodan-query: http.title:"Aerohive NetConfig UI"
    product: aerohive_netconfig
    vendor: extremenetworks
  tags: panel,tech,hiveos,aerohive,discovery
http:
  - method: GET
    path:
      - "{{BaseURL}}/index.php5"

    matchers-condition: and
    matchers:
      - type: word
        part: body
        words:
          - '<title>Aerohive NetConfig UI</title>'

      - type: status
        status:
          - 200

    extractors:
      - type: regex
        part: body
        group: 1
        regex:
          - 'version" align="right" valign="bottom">([0-9.a-z]+)<\/td>'
