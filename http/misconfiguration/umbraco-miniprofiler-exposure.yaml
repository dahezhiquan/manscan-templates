id: umbraco-miniprofiler-exposure

info:
  name: Umbraco MiniProfiler 暴露
  author: theamanrawat
  severity: low
  description: |-
    该模板用于核查 Umbraco MiniProfiler 暴露。调试模式、错误页面或诊断组件在生产环境暴露时，会返回堆栈、路径、配置项、请求上下文或运行参数。模板访问 /mini-profiler-resources/results、/umbraco/mini-profiler-resources/results，并根据调试标识、异常类名、phpinfo/Xdebug 配置或错误关键字确认暴露。
  reference:
    - https://miniprofiler.com/
    - https://umbraco.com/
  metadata:
    shodan-query: http.title:"Umbraco"
    fofa-query: title="Umbraco"
  tags: umbraco,miniprofiler,exposure,debug,misconfig
  impact: |-
    - 攻击者可获取应用路径、框架版本、环境变量、内部调用栈、请求参数和依赖信息。
    - 这些信息可帮助定位组件缺陷、构造后续漏洞利用或绕过安全控制。
  remediation: |-
    - 关闭生产环境调试模式、错误详情展示、Profiler 和 phpinfo 页面。
    - 将错误写入受保护日志，统一返回通用错误页面。
    - 限制诊断入口访问来源，升级框架并复核生产配置。
http:
  - method: GET
    path:
      - "{{BaseURL}}/mini-profiler-resources/results"
      - "{{BaseURL}}/umbraco/mini-profiler-resources/results"

    stop-at-first-match: true

    matchers-condition: and
    matchers:
      - type: word
        part: body
        words:
          - "StartupProfiler"
          - "var profiler ="
          - '"DurationMilliseconds"'
        condition: and

      - type: status
        status:
          - 200
