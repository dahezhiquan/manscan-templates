id: apache-jspwiki-detect

info:
  name: Apache JSPWiki 指纹识别（指纹识别）
  author: icarot
  severity: info
  description: |
    用于识别目标是否部署 Apache JSPWiki 并提取相关版本或构建信息，模板会结合页面标题、页面正文、特定路径或已知端点和版本或标识提取结果进行指纹匹配。
  classification:
    cpe: cpe:2.3:a:apache:jspwiki:*:*:*:*:*:*:*:*
  metadata:
    max-request: 1
    vendor: apache
    product: jspwiki
    shodan-query: title:"JSPWiki"
  tags: tech,jspwiki,apache,detect,discovery

http:
  - method: GET
    path:
      - "{{BaseURL}}"

    matchers:
      - type: dsl
        dsl:
          - 'contains_any(body, "JSPWiki: Main", "JSPWiki: Login")'
          - 'contains(body, "/jspwiki")'
          - 'status_code == 200'
        condition: and

    extractors:
      - type: regex
        name: version
        part: body
        regex:
          - "JSPWiki v[0-9]+\\.[0-9]+\\.[0-9]+"
