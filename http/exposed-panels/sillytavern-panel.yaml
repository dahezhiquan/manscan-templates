id: sillytavern-panel

info:
  name: SillyTavern 面板识别（指纹识别）
  author: rxerium
  severity: info
  description: |-
    SillyTavern 是面向大语言模型的聊天前端，用于管理角色、会话、提示词和模型连接。该模板请求首页，并依据 HTTP 200 状态码、页面标题、正文关键字或品牌资源特征识别目标是否部署了该系统或暴露了对应入口，适用于资产指纹确认；命中结果仅表示系统特征匹配，不代表已确认存在未授权访问或可利用漏洞。
  reference:
  - https://github.com/SillyTavern/SillyTavern
  - https://docs.sillytavern.app/
  metadata:
    verified: true
    max-request: 1
    vendor: SillyTavern
    product: sillytavern
    shodan-query: 'http.title:"SillyTavern"'
  tags: panel,sillytavern,llm,ai,detect,discovery

http:
  - method: GET
    path:
      - "{{BaseURL}}"

    host-redirects: true
    max-redirects: 2

    matchers-condition: and
    matchers:
      - type: word
        part: body
        words:
          - "<title>SillyTavern</title>"

      - type: status
        status:
          - 200
