id: fastcgi-config

info:
  name: FastCGI 配置文件泄露（暴露面识别）
  author: DhiyaneshDk
  severity: medium
  description: |
    检测到对外可访问的 FastCGI 配置文件。这类配置资源可能包含部署细节、访问凭据、内部地址、组件版本或调试开关，公开暴露后会显著增加被侦察和后续利用的风险。
  metadata:
    verified: true
    max-request: 2
  tags: fastcgi,config,exposure,vuln

http:
  - method: GET
    path:
      - "{{BaseURL}}/fastcgi.conf"
      - "{{BaseURL}}/config/fastcgi.conf"

    stop-at-first-match: true

    matchers:
      - type: dsl
        dsl:
          - contains_all(body, 'fastcgi_param','fastcgi_script')
          - contains(content_type, 'application/octet-stream')
        condition: and
