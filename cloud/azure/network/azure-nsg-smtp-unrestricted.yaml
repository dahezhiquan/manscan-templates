id: azure-nsg-smtp-unrestricted
info:
  name: Azure NSG 对互联网开放 SMTP 端口 25（云安全）
  author: princechaddha
  severity: high
  description: SMTP 通常使用 TCP 25 传输邮件；将该端口对互联网开放可能使邮件服务遭受枚举、认证攻击和垃圾邮件滥用。本模板查询入站允许的 TCP 25 NSG 规则，并在来源地址为 *、internet 或 any 时报告。
  impact: |
    - 攻击者可能探测账户和邮件域名，利用弱认证发送垃圾邮件，或通过服务漏洞取得主机访问权限。
    - 邮件服务被滥用会损害域名信誉、影响正常投递，并增加钓鱼和恶意附件传播风险。
  remediation: |
    - 仅向已知邮件网关或必要的对等服务器开放 TCP 25，关闭面向任意互联网来源的入站规则。
    - 禁止开放中继，启用强认证、反垃圾策略和连接速率限制，并监控异常投递行为。
  reference:
    - https://docs.microsoft.com/en-us/azure/virtual-network/network-security-groups-overview
  metadata:
    vendor: microsoft
    product: azure-network-security-group
  tags: cloud,devops,azure,microsoft,nsg,azure-cloud-config

flow: |
  code(1);
  for (let NsgData of iterate(template.nsgdata)) {
    NsgData = JSON.parse(NsgData)
    set("nsg", NsgData.name)
    set("resourcegroup", NsgData.resourceGroup)
    code(2)
  }

self-contained: true
code:
  - engine:
      - sh
      - bash
    source: |
      az network nsg list --query '[*].{name:name, resourceGroup:resourceGroup}' --output json

    extractors:
      - type: json
        name: nsgdata
        internal: true
        json:
          - '.[]'

  - engine:
      - sh
      - bash
    source: |
      az network nsg rule list --nsg-name $nsg --resource-group $resourcegroup --query "[?direction=='Inbound' && access=='Allow' && protocol=='TCP' && (destinationPortRange=='25')]"

    matchers:
      - type: word
        words:
          - '"sourceAddressPrefix": "*"'
          - '"sourceAddressPrefix": "internet"'
          - '"sourceAddressPrefix": "any"'

    extractors:
      - type: dsl
        dsl:
          - 'nsg + " has unrestricted access on TCP port 25"'
