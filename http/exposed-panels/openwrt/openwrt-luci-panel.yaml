id: openwrt-luci-panel

info:
  name: Opentwrt luCI - Admin Login Page 面板识别（暴露面识别）
  author: For3stCo1d
  severity: info
  description: 该模板通过识别 Opentwrt luCI - Admin Login Page 登录入口的页面标题、特征文本或重定向行为，判断目标是否暴露了对应的认证界面。若命中，说明该登录面板对外可访问，可用于暴露面梳理与后续安全评估。
  reference:
    - https://forum.archive.openwrt.org/viewtopic.php?id=16611
  classification:
    cpe: cpe:2.3:a:x-wrt:luci:*:*:*:*:*:*:*:*
  metadata:
    max-request: 1
    vendor: x-wrt
    product: luci
    shodan-query:
      - http.title:"OpenWrt - LuCI"
      - http.title:"openwrt - luci"
    fofa-query: title="openwrt - luci"
    google-query: intitle:"openwrt - luci"
  tags: panel,default-login,openwrt,x-wrt,discovery

http:
  - method: GET
    path:
      - "{{BaseURL}}/cgi-bin/luci"

    matchers:
      - type: word
        words:
          - 'OpenWrt'
          - 'LuCI'
          - 'login'
        condition: and
