id: ispconfig-admin-default-login

info:
  name: ISPConfig Admin 默认口令（弱口令）
  author: pussycat0x
  severity: high
  description: |
    该模板用于检测 ISPConfig Admin 是否仍可使用默认凭据或弱口令登录。模板主要向 `/login`、`/login/index.php` 等认证入口发送请求，使用内置默认凭据组合进行认证尝试，并根据响应中的 `Tools`、`Websites` 等登录成功特征判断登录是否成功；命中说明目标未及时修改出厂、示例或初始化账号口令。
  impact: |
    - 攻击者可登录 ISPConfig Admin 后台，管理内容、用户、插件、主题、文件或站点配置。
    - 后台权限被滥用后，可能导致页面篡改、恶意文件上传、敏感资料泄露，或进一步取得服务器执行能力。
  remediation: |
    - 立即修改默认管理员凭据，删除安装向导、演示账号和不必要的后台用户。
    - 限制后台登录入口访问来源，启用多因素认证、登录失败锁定和验证码等防护。
    - 检查近期内容、插件、主题、文件上传和管理员操作记录，确认没有持久化后门。
  metadata:
    verified: true
    max-request: 9
    shodan-query: "http.title:\"ispconfig\""
  tags: default-login,ispconfig,vuln

http:
  - raw:
      - |
        GET /login HTTP/1.1
        Host: {{Hostname}}

      - |
        POST /login/index.php HTTP/1.1
        Host: {{Hostname}}
        Content-Type: application/x-www-form-urlencoded
        Origin: {{BaseURL}}
        Connection: close
        Referer: {{RootURL}}/login/

        username={{username}}&password={{password}}&s_mod=login&s_pg=index

      - |
        GET /sites/web_vhost_domain_list.php HTTP/1.1
        Host: {{Hostname}}
        X-Requested-With: XMLHttpRequest
        Referer: {{RootURL}}/index.php

    attack: pitchfork
    payloads:
      username:
        - 'admin'
        - 'guest'
        - 'root'
      password:
        - 'admin'
        - 'password'
        - 'toor'

    stop-at-first-match: true
    host-redirects: true

    matchers-condition: and
    matchers:
      - type: word
        part: body_3
        words:
          - Tools
          - Websites
        condition: and

      - type: status
        status:
          - 200
