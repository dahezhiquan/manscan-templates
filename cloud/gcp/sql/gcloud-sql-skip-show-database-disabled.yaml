id: gcloud-sql-skip-show-database-disabled

info:
  name: Skip Show Database Flag 未Enabled 的MySQL Instances（云安全）
  author: princechaddha
  severity: medium
  description: MySQL skip_show_database 可限制普通用户通过 SHOW DATABASES 枚举无权限数据库，未启用会增加数据库名称泄露。本模板检查 Cloud SQL MySQL 实例 databaseFlags，发现相关配置为 off 时报告该标志未启用。
  impact: |
    - 低权限账号可能枚举数据库名称，获取业务结构、环境命名和攻击目标线索。
    - 数据库元信息暴露会提升凭据泄露或 SQL 注入后的侦察价值。
  remediation: |
    - 为 Cloud SQL MySQL 实例启用 skip_show_database，并确保应用账号仅拥有必要数据库权限。
    - 定期复核数据库用户权限，避免共享账号或过宽授权导致数据库枚举。
  reference:
    - https://cloud.google.com/sql/docs/mysql/configure-database-flags
  metadata:
    vendor: google
    product: cloud-sql
  tags: cloud,devops,gcp,gcloud,google-cloud-sql,mysql-database,gcp-cloud-config

flow: |
  code(1)
  for(let projectId of iterate(template.projectIds)){
    set("projectId", projectId)
    code(2)
    for(let sqlInstance of iterate(template.sqlInstances)){
      set("sqlInstance", sqlInstance)
      code(3)
    }
  }

self-contained: true

code:
  - engine:
      - sh
      - bash
    source: |
      gcloud projects list --format="json(projectId)"

    extractors:
      - type: json
        name: projectIds
        internal: true
        json:
          - '.[].projectId'

  - engine:
      - sh
      - bash
    source: |
      gcloud sql instances list --project $projectId --filter='DATABASE_VERSION:MYSQL*' --format="json(name)"

    extractors:
      - type: json
        name: sqlInstances
        internal: true
        json:
          - '.[].name'

  - engine:
      - sh
      - bash
    source: |
      gcloud sql instances describe $sqlInstance --format="json(settings.databaseFlags)"

    matchers:
      - type: word
        words:
          - 'off'

    extractors:
      - type: dsl
        dsl:
          - '"Skip Show Database Flag is not enabled for MySQL instance " + sqlInstance + " in project " + projectId'
