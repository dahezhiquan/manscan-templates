id: rails-debug-mode

info:
  name: Rails Debug Mode 泄露（暴露面识别）
  author: pdteam
  severity: medium
  description: 检测到可直接访问的 Rails Debug Mode。日志、异常页面或调试输出通常会泄露堆栈信息、内部路径、查询语句、账号标识、令牌片段或业务数据，不应向未授权用户开放。
  metadata:
    max-request: 1
  tags: debug,rails,exposure,intrusive,vuln

http:
  - method: GET
    path:
      - "{{BaseURL}}/{{randstr}}"

    matchers:
      - type: word
        part: body
        words:
          - "Rails.root:"
          - "Action Controller: Exception caught"
        condition: and
