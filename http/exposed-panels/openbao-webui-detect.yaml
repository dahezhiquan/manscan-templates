id: openbao-webui-detect

info:
  name: OpenBao Web UI 面板识别（指纹识别）
  author: ritikchaddha
  severity: info
  description: |
    该模板通过识别 OpenBao Web UI 面板、控制台或管理界面的页面特征，判断目标是否暴露了对应服务入口。若命中，说明该后台或运维界面对外可访问，可用于资产识别与暴露面排查。
  reference:
    - https://github.com/openbao/openbao
  metadata:
    verified: true
    max-request: 1
    shodan-query: http.title:"OpenBao"
    fofa-query: title="OpenBao"
  tags: panel,openbao,detect,ui

http:
  - method: GET
    path:
      - "{{BaseURL}}/ui"

    host-redirects: true
    max-redirects: 2

    matchers-condition: and
    matchers:
      - type: word
        part: body
        words:
          - "<title>OpenBao"
          - "Welcome to OpenBao"
        condition: or

      - type: status
        status:
          - 200
