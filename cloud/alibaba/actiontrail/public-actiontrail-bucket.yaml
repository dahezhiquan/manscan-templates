id: public-actiontrail-bucket

info:
  name: 阿里云 ActionTrail 日志 OSS Bucket 公开可写（云安全）
  author: ritikchaddha
  severity: high
  description: 阿里云 ActionTrail 投递日志的 OSS Bucket 如果配置为 public-read-write，匿名用户可能读取或写入审计日志对象，导致操作审计数据泄露或被篡改。模板先通过 DescribeTrails 提取 TrailList[].OssBucketName，再使用 ossutil stat 检查 Bucket ACL，当命中 public-read-write 时判定该 ActionTrail 日志桶公开可写。
  impact: |
    - 攻击者可能读取 ActionTrail 审计日志，获取云资源操作轨迹、账号活动和敏感运维线索。
    - 公开写入权限可能导致审计日志被覆盖、污染或删除，削弱安全事件调查和合规取证可信度。
  remediation: |
    - 将 ActionTrail 关联的 OSS Bucket ACL 调整为 private，并移除允许 Principal 为 * 且缺少限制条件的 Bucket Policy。
    - 定期复核 ActionTrail 日志桶的 ACL、Bucket Policy 和 RAM 授权，只允许日志投递角色和必要审计人员访问。
  reference:
    - https://www.trendmicro.com/cloudoneconformity/knowledge-base/alibaba-cloud/AlibabaCloud-ActionTrail/trail-bucket-publicly-accessible.html
  metadata:
    max-request: 2
    verified: true
    vendor: alibaba
    product: actiontrail
  tags: cloud,devops,aliyun,alibaba,aliyun-cloud-config,actiontrail

variables:
  region: "cn-hangzhou"

flow: |
  code(1)
  for (let BucketName of iterate(template.bucketname)) {
    set("bucket", BucketName)
    code(2)
  }

self-contained: true

code:
  - engine:
      - sh
      - bash
    source: |
      aliyun actiontrail DescribeTrails --region $region

    extractors:
      - type: json
        name: bucketname
        internal: true
        json:
          - '.TrailList[].OssBucketName'

  - engine:
      - sh
      - bash
    source: |
      ossutil stat oss://$bucket

    matchers:
      - type: regex
        regex:
          - 'ACL.*:.*public-read-write'

    extractors:
      - type: dsl
        dsl:
          - 'bucket + " Bucket associated with ActionTrail trail is publicly accessible"'
