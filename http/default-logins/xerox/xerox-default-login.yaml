id: xerox-default-login

info:
  name: Xerox Fuji/VersaLink 默认口令登录（弱口令）
  author: DhiyaneshDk
  severity: high
  description: |
    该模板通过尝试 Xerox Fuji/VersaLink 的已知默认口令，并依据认证成功后的响应特征判断目标是否仍在使用出厂弱口令。若命中，攻击者可直接进入管理界面并进一步修改配置或查看敏感信息。
  reference:
    - https://www.support.xerox.com/en-us/article/KB0136271
  metadata:
    verified: true
    max-request: 1
  tags: xerox,versalink,fuji,default-login

variables:
  username: admin
  password: 1111

http:
  - raw:
      - |
        POST /LOGIN.cmd HTTP/1.1
        Host: {{Hostname}}
        Origin: {{RootURL}}
        Referer: {{RootURL}}/home/index.html

        NAME={{base64(username)}}&PSW={{base64(password)}}

    matchers-condition: and
    matchers:
      - type: word
        part: body
        words:
          - '"result":"0"'
          - '"errorCode":"0"'
        condition: and

      - type: word
        part: header
        words:
          - "ssid="

      - type: status
        status:
          - 200
