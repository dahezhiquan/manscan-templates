id: atlantis-detect

info:
  name: Atlantis 面板识别（暴露面识别）
  author: jonathanwalker
  severity: info
  description: 该模板通过识别 Atlantis 面板、控制台或管理界面的页面特征，判断目标是否暴露了对应服务入口。若命中，说明该后台或运维界面对外可访问，可用于资产识别与暴露面排查。
  reference:
    - https://github.com/runatlantis/atlantis
  classification:
    cvss-metrics: CVSS:3.0/AV:N/AC:L/PR:N/UI:N/S:U/C:N/I:N/A:N
    cwe-id: CWE-200
    cpe: cpe:2.3:a:runatlantis:atlantis:*:*:*:*:*:*:*:*
  metadata:
    verified: true
    max-request: 1
    vendor: runatlantis
    product: atlantis
    shodan-query: http.favicon.hash:-1706783005
    fofa-query: icon_hash=-1706783005
  tags: panel,atlantis,runatlantis,discovery

http:
  - method: GET
    path:
      - "{{BaseURL}}"

    matchers-condition: and
    matchers:
      - type: word
        part: body
        words:
          - 'title="atlantis'
          - 'Lock'
        condition: and

      - type: status
        status:
          - 200
