id: apache-shenyu-detect

info:
  name: Apache Shenyu 网关 管理系统 指纹识别（指纹识别）
  author: icarot
  severity: info
  description: |-
    Apache Shenyu 网关 管理系统 是 API 网关，用于服务代理、插件治理、鉴权和流量管理。该模板请求首页，并依据 HTTP 200 状态码、页面标题、正文关键字或品牌资源特征识别目标是否使用或暴露了 Apache Shenyu 网关 管理系统 相关组件，适用于资产盘点、技术栈识别和后续安全评估；命中结果仅表示指纹特征匹配，不代表已确认存在可利用漏洞。
  metadata:
    max-request: 1
    vendor: apache
    product: shenyu
    shodan-query: title:"shenyu"
  tags: tech,shenyu,apache,detect,discovery

http:
  - method: GET
    path:
      - "{{BaseURL}}"

    matchers-condition: and
    matchers:
      - type: word
        part: body
        words:
          - '<title>Apache ShenYu Gateway</title>'

      - type: status
        status:
          - 200
