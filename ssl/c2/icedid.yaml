id: icedid

info:
  name: IcedID 基础设施证书识别（证书安全）
  author: pussycat0x
  severity: info
  description: 该模板通过证书主题字段识别目标是否可能与 IcedID（BokBot）相关基础设施匹配。命中说明远端证书与该家族常见部署特征一致。
  metadata:
    verified: "true"
    max-request: 1
    censys-query: CN=localhost, C=AU, ST=Some-State, O=Internet Widgits Pty Ltd
  tags: c2,ssl,tls,ir,osint,malware,bokbot,icedid,discovery
ssl:
  - address: "{{Host}}:{{Port}}"
    matchers:
      - type: word
        part: subject_dn
        words:
          - "O=Internet Widgits Pty Ltd, ST=Some-State, C=AU, CN=localhost"

    extractors:
      - type: json
        json:
          - ".subject_dn"
