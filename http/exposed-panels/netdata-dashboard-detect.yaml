id: netdata-dashboard-detect

info:
  name: Netdata Dashboard 面板识别（指纹识别）
  author: pussycat0x
  severity: info
  description: |-
    检测到目标站点存在 Netdata Dashboard 相关响应特征。Netdata 是实时可观测性和性能监控平台，用于展示系统、容器、应用指标和告警状态。模板请求 `/`，并通过页面标题或正文关键字、状态码确认该系统指纹，用于资产识别、系统盘点和暴露面梳理。
  classification:
    cvss-metrics: CVSS:3.0/AV:N/AC:L/PR:N/UI:N/S:U/C:N/I:N/A:N
    cwe-id: CWE-200
    cpe: cpe:2.3:a:netdata:netdata:*:*:*:*:*:*:*:*
  metadata:
    max-request: 1
    vendor: netdata
    product: netdata
    shodan-query:
      - 'Server: NetData Embedded HTTP Server'
      - http.title:"netdata dashboard"
      - "server: netdata embedded http server"
    fofa-query: title="netdata dashboard"
    google-query: intitle:"netdata dashboard"
  tags: netdata,panel,tech,discovery
http:
  - method: GET
    path:
      - "{{BaseURL}}"

    matchers-condition: and
    matchers:
      - type: word
        part: body
        words:
          - '<title>netdata dashboard</title>'

      - type: status
        status:
          - 200
