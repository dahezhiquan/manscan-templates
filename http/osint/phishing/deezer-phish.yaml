id: deezer-phish

info:
  name: Deezer 仿冒钓鱼网站（钓鱼网站识别）
  author: rxerium
  severity: info
  description: |
    检测到疑似仿冒 Deezer 的钓鱼网站。模板在目标页面返回 200、页面内容命中 Deezer 的官方服务页面特征，且当前主机不属于 deezer.com 官方域名时触发，用于识别借用 Deezer 品牌页面诱导用户信任的仿冒站点。
  reference:
    - https://deezer.com
  metadata:
    max-request: 1
  tags: phishing,deezer,osint,discovery
http:
  - method: GET
    path:
      - "{{BaseURL}}"

    host-redirects: true
    max-redirects: 2

    matchers-condition: and
    matchers:
      - type: word
        words:
          - 'Deezer | Listen to music | Online music streaming platform'

      - type: status
        status:
          - 200

      - type: dsl
        dsl:
          - '!contains(host,"deezer.com")'
