id: covenant-c2-ssl

info:
  name: Covenant C2 证书识别（证书安全）
  author: pussycat0x
  severity: info
  description: 该模板通过证书主题字段识别目标是否可能与 Covenant 命令控制平台相关。命中说明远端证书与该框架默认或常见部署特征相匹配。
  reference:
    - https://twitter.com/MichalKoczwara/status/1548685058403360770
  metadata:
    verified: "true"
    max-request: 1
    shodan-query: ssl:”Covenant” http.component:”Blazor”
  tags: ssl,tls,c2,ir,osint,malware,covenant,discovery
ssl:
  - address: "{{Host}}:{{Port}}"
    matchers:
      - type: word
        part: subject_dn
        words:
          - "CN=Covenant"

    extractors:
      - type: json
        json:
          - ".subject_dn"
