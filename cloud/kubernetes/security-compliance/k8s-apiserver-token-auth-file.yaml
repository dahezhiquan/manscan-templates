id: k8s-apiserver-token-auth-file

info:
  name: Detect kube-apiserver --token-auth-file usage（云安全）
  author: songyaeji
  severity: high
  description: kube-apiserver 使用 --token-auth-file 表示启用了静态令牌文件认证，这类长期凭据难以轮换和审计，不推荐在生产环境使用。本模板读取 kube-apiserver 启动命令，发现 --token-auth-file 参数时报告。
  impact: |
    - 静态令牌泄露后可能长期有效，攻击者可绕过更强身份机制访问 API Server。
    - 令牌文件管理、轮换和撤销困难，增加凭据遗留风险。
  remediation: |
    - 移除 --token-auth-file，改用受支持的 OIDC、客户端证书、Webhook 或云厂商身份集成。
    - 排查并吊销已分发的静态令牌，审计相关访问日志。
  reference:
    - https://kubernetes.io/docs/reference/command-line-tools-reference/kube-apiserver/
  metadata:
    vendor: kubernetes
    product: kubernetes
  tags: cloud,devops,kubernetes,security,devsecops,api-server,k8s-cluster-security
variables:
  argument: "--token-auth-file"

self-contained: true
code:
  - engine:
      - sh
      - bash
    source: |
      kubectl get pods -n kube-system -l component=kube-apiserver -o jsonpath="{.items[*].spec.containers[*].command}"

    matchers-condition: and
    matchers:
      - type: word
        words:
          - 'kube-apiserver'

      - type: word
        words:
          - "{{argument}}"

    extractors:
      - type: dsl
        dsl:
          - '"kube-apiserver is configured with " + argument + ". Review and remove if unnecessary."'
