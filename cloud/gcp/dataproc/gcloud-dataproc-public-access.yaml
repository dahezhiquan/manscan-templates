id: gcloud-dataproc-public-access

info:
  name: Dataproc Cluster 公开可访问（云安全）
  author: princechaddha
  severity: high
  description: Dataproc 集群配置外部 IP 时，集群节点可能通过公网暴露管理或数据处理服务。本模板枚举集群并读取集群配置，匹配外部访问相关布尔值为 false 的配置时报告集群可能使用外部 IP 公开可达。
  impact: |
    - Dataproc 节点、作业接口或依赖服务可能被公网扫描，增加未授权访问和漏洞利用风险。
    - 数据处理环境通常接触原始数据、临时结果和服务账号权限，公网暴露会扩大数据泄露影响面。
  remediation: |
    - 为 Dataproc 集群启用内部 IP 或私有网络访问，避免为节点分配不必要的外部 IP。
    - 使用 VPC 防火墙、专用子网、Private Google Access 和最小权限服务账号限制集群访问路径。
  reference:
    - https://www.trendmicro.com/cloudoneconformity/knowledge-base/gcp/Dataproc/publicly-accessible-dataproc-clusters.html
    - https://cloud.google.com/dataproc/docs/concepts/configuring-clusters/network
  metadata:
    vendor: google
    product: dataproc
  tags: cloud,devops,gcp,gcloud,dataproc,security,networking,public-access,gcp-cloud-config

flow: |
  code(1)
  for(let projectId of iterate(template.projectIds)){
    set("projectId", projectId)
    code(2)
    for(let cluster of iterate(template.clusters)){
      cluster = JSON.parse(cluster)
      set("clusterName", cluster.clusterName)
      set("region", cluster.region)
      code(3)
    }
  }

self-contained: true

code:
  - engine:
      - sh
      - bash
    source: |
      gcloud projects list --format="json(projectId)"

    extractors:
      - type: json
        name: projectIds
        internal: true
        json:
          - '.[].projectId'

  - engine:
      - sh
      - bash
    source: |
      gcloud dataproc clusters list --project $projectId --format="json"

    extractors:
      - type: json
        name: clusters
        internal: true
        json:
          - '.[]'

  - engine:
      - sh
      - bash
    source: |
      gcloud dataproc clusters describe $clusterName --region $region --project $projectId --format=json

    matchers:
      - type: word
        words:
          - "false"

    extractors:
      - type: dsl
        dsl:
          - '"Dataproc cluster " + clusterName + " in region " + region + " of project " + projectId + " is configured with external IP addresses and is publicly accessible"'
