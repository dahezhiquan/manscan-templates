id: solar-log-panel

info:
  name: Solar-Log - Monitoring 面板（暴露面识别）
  author: rxerium
  severity: info
  description: |
    该模板用于识别 Solar-Log - Monitoring 是否存在对外暴露的管理、服务或状态界面。若命中，说明目标公开了相关功能入口，可作为资产盘点与攻击面收敛的依据。
  reference:
    - https://www.solar-log.com/
  metadata:
    max-request: 1
    verified: true
    vendor: Solar-Log
    product: solar-log
    shodan-query: 'http.title:"Solar-Log"'
  tags: panel,solar-log,solar,energy,ics,monitoring,ot,discovery

http:
  - method: GET
    path:
      - "{{BaseURL}}"

    host-redirects: true
    max-redirects: 2

    matchers-condition: and
    matchers:
      - type: word
        part: body
        words:
          - 'Solar-Log'
          - 'solar-log.com'
          - 'Solar-Log™'
        condition: or

      - type: status
        status:
          - 200
