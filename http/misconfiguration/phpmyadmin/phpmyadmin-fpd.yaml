id: phpmyadmin-fpd

info:
  name: phpMyAdmin 完整路径泄露
  author: DhiyaneshDk
  severity: low
  description: |
    该模板用于核查 phpMyAdmin 完整路径泄露。该类问题通常源于管理面板、仪表盘或监控控制台暴露在公网或缺少足够访问控制。模板会向目标发送探测请求，并依据请求 `{{paths}}`、`/phpmyadmin/libraries/advisory_rules_generic.php`、匹配 `contains_any(tolower(body), "alt=\"phpMyAdmin", "name=\"pma_username", "/pmahomme/")`等证据确认目标是否存在该配置问题。
  impact: |
    - 攻击者可获取系统状态、业务指标、任务信息、拓扑结构或管理入口线索。
    - 若面板存在默认凭据、弱认证或操作接口，可能进一步导致未授权管理或服务接管。
  remediation: |
    - 将管理面板和仪表盘限制在内网、VPN 或可信访问网关后。
    - 启用强认证、多因素认证、细粒度授权和操作审计。
    - 隐藏或关闭不需要公开的默认面板，并监控异常访问与暴力探测。
  metadata:
    verified: true
    max-request: 1
    shodan-query: html:"phpmyadmin"
  tags: exposure,fpd,phpmyadmin,php

flow: http(1) && http(2)

http:
  - method: GET
    path:
      - "{{BaseURL}}{{paths}}"

    payloads:
      paths:
        - ""
        - "/phpmyadmin/"
        - "/admin/phpmyadmin/"
        - "/_phpmyadmin/"
        - "/administrator/components/com_joommyadmin/phpmyadmin/"
        - "/apache-default/phpmyadmin/"
        - "/blog/phpmyadmin/"
        - "/forum/phpmyadmin/"
        - "/php/phpmyadmin/"
        - "/typo3/phpmyadmin/"
        - "/web/phpmyadmin/"
        - "/xampp/phpmyadmin/"
        - "/phpMyAdmin/"
        - "/phpma/"
        - "/phpMyAdmin/index.php"

    stop-at-first-match: true
    matchers:
      - type: dsl
        dsl:
          - 'contains_any(tolower(body), "alt=\"phpMyAdmin", "name=\"pma_username", "/pmahomme/")'
        internal: true

  - method: GET
    path:
      - "{{BaseURL}}/phpmyadmin/libraries/advisory_rules_generic.php"
      - "{{BaseURL}}/phpmyadmin/libraries/phpseclib/Crypt/AES.php"
      - "{{BaseURL}}/phpmyadmin/libraries/phpseclib/Crypt/Rijndael.php"

    stop-at-first-match: true

    matchers:
      - type: dsl
        dsl:
          - 'status_code == 200 || status_code == 500'
          - 'contains(body, "phpmyadmin")'
          - 'contains_any(body, "Fatal error", "require_once", "Error")'
        condition: and
