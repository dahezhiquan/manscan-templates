id: i-mscp-panel

info:
  name: Internet Multi Server Control 面板识别（指纹识别）
  author: JustaAcat
  severity: info
  description: |-
    检测到目标站点存在 Internet Multi Server Control 相关响应特征。Internet Multi Server Control 是服务器或系统管理控制台，用于监控硬件状态、远程控制、电源管理、系统配置和维护任务。模板请求 `/index.php`，并通过页面标题或正文关键字、状态码确认该系统指纹，用于资产识别、系统盘点和暴露面梳理。
  reference:
    - https://i-mscp.net/
  classification:
    cvss-metrics: CVSS:3.1/AV:N/AC:L/PR:N/UI:N/S:U/C:N/I:N/A:N
    cwe-id: CWE-200
  metadata:
    verified: true
    max-request: 1
    shodan-query: title:"i-MSCP - Multi Server Control Panel"
  tags: panel,i-mscp,detect,discovery
http:
  - method: GET
    path:
      - '{{BaseURL}}/index.php'

    matchers-condition: and
    matchers:
      - type: word
        words:
          - "<title>i-MSCP - Multi Server Control Panel"

      - type: status
        status:
          - 200
