id: api-clickup

info:
  name: ClickUp API Token 可用性校验（token喷洒）
  author: daffainfo
  severity: info
  description: 该模板通过调用 ClickUp API 的已知接口验证提供的 token 是否有效，命中后通常表示可访问协作、任务或项目管理能力。
  reference:
    - https://clickup.com/api
    - https://github.com/daffainfo/all-about-apikey/tree/main/clickup
  metadata:
    max-request: 1
  tags: token-spray,clickup

self-contained: true

http:
  - raw:
      - |
        GET https://api.clickup.com/api/v2/user HTTP/1.1
        Host: api.clickup.com
        Authorization: {{token}}

    matchers:
      - type: word
        part: body
        words:
          - '"id":'
          - '"username":'
          - '"email":'
        condition: and
