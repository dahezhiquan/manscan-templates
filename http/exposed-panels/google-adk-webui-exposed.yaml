id: google-adk-webui-exposed

info:
  name: Google ADK Development UI 暴露（暴露面识别）
  author: princechaddha
  severity: medium
  description: |
    该模板用于识别 Google ADK Development UI 相关暴露入口或页面特征。若命中，说明目标可能对外公开了可访问的管理或信息接口，存在进一步泄露系统信息、配置数据或服务细节的风险。
  reference:
    - https://google.github.io/adk-docs/
    - https://github.com/google/adk-samples
  metadata:
    max-request: 1
    verified: true
    shodan-query: http.html:"Agent Development Kit Dev UI"
  tags: adk,exposure,google,ai,agent,devops,discovery

http:
  - method: GET
    path:
      - "{{BaseURL}}/dev-ui/"

    matchers:
      - type: word
        part: body
        words:
          - "<title>Agent Development Kit Dev UI</title>"
