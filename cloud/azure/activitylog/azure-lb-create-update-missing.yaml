id: azure-lb-create-update-missing
info:
  name: Azure 负载均衡器创建或更新告警未配置（云安全）
  author: princechaddha
  severity: high
  description: 负载均衡器创建或更新可能改变公网入口、监听规则和后端流量分发；未配置 Activity Log 告警时，网络暴露面变化可能不被及时发现。该模板枚举已启用的 Activity Log Alert，并检查告警条件集合是否缺少 Microsoft.Network/loadBalancers/write 操作。
  impact: |
    - 未授权更新可能将流量导向恶意或错误后端，或扩大服务的公网暴露范围。
    - 缺少创建和更新告警会延迟对入口变更、配置漂移和异常资源部署的响应。
  remediation: |
    - 创建针对负载均衡器创建和更新操作的 Activity Log Alert，并配置安全团队 Action Group。
    - 对监听器、后端池和公网前端变更实施审批、最小权限和配置基线校验。
  reference:
    - https://docs.microsoft.com/en-us/azure/azure-monitor/platform/alerts-activity-log
  metadata:
    vendor: microsoft
    product: azure-monitor
  tags: cloud,devops,azure,microsoft,load-balancer,azure-cloud-config

flow: |
  code(1);
  for (let AlertData of iterate(template.alertIds)) {
    set("ids", AlertData);
    code(2);
  }

self-contained: true
code:
  - engine:
      - sh
      - bash
    source: |
      az monitor activity-log alert list --output json --query '[?(enabled==`true`)].id'

    extractors:
      - type: json
        name: alertIds
        internal: true
        json:
          - '.[]'

  - engine:
      - sh
      - bash
    source: |
      az monitor activity-log alert show --ids $ids --query 'condition'

    matchers-condition: and
    matchers:
      - type: word
        words:
          - "allOf"

      - type: word
        words:
          - "Microsoft.Network/loadBalancers/write"
        negative: true

    extractors:
      - type: dsl
        dsl:
          - 'ids + " does not have correct Create or Update Load Balancer alert configured"'
