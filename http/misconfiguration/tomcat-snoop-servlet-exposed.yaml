id: tomcat-snoop-servlet-exposed

info:
  name: Apache Tomcat Snoop Servlet 信息泄露
  author: Thabisocn
  severity: medium
  description: |-
    该模板用于核查 Apache Tomcat Snoop Servlet 信息泄露。目标公开了配置、日志、源码、数据库文件或示例信息页面，可能泄露本应仅限服务器内部访问的数据。模板访问 /examples/jsp/snp/snoop.jsp，并根据文件特征、配置字段、日志内容、源码目录或响应状态确认泄露。
  reference:
    - https://vulners.com/nessus/TOMCAT_SNOOP.NASL
    - https://nvd.nist.gov/vuln/detail/CVE-2000-0760
  classification:
    epss-score: 0.68493
    epss-percentile: 0.98547
  metadata:
    max-request: 1
    verified: true
    google-query: site:*/examples/jsp/snp/snoop.jsp
    vendor: apache
    product: tomcat
  tags: apache,jakarta,tomcat,exposure,info-leak,vuln
  impact: |-
    - 攻击者可获取密钥、令牌、数据库连接信息、源码结构、内部路径、历史日志或业务配置。
    - 泄露内容可能被用于凭据复用、供应链漏洞匹配、权限提升或进一步攻击。
  remediation: |-
    - 将配置、日志、源码仓库和数据库文件移出 Web 可访问目录。
    - 在 Web 服务器和对象存储层添加拒绝规则，阻断敏感扩展名和内部目录访问。
    - 轮换可能泄露的密钥、令牌和账号凭据，并排查访问日志。
http:
  - method: GET
    path:
      - "{{BaseURL}}/examples/jsp/snp/snoop.jsp"

    matchers-condition: and
    matchers:
      - type: word
        words:
          - "Request Information"
          - "Path info"
          - "Server name"
          - "Remote address"
        condition: and

      - type: status
        status:
          - 200
