id: rds-deletion-protection
info:
  name: RDS 实例删除保护未启用（云安全）
  author: princechaddha
  severity: high
  description: RDS 实例删除保护用于阻止数据库被直接删除，降低误操作和权限滥用造成的可用性风险。该模板枚举 RDS 实例，并检查 DeletionProtection 是否为 false。
  impact: |
    - 数据库实例可能被误删或被攻击者删除，导致应用不可用。
    - 删除事件在备份不足或恢复流程未验证时可能造成较长停机和数据损失。
  remediation: |
    - 为生产和关键 RDS 实例启用 DeletionProtection。
    - 限制 rds:DeleteDBInstance 等高危权限，并对删除保护变更配置审计和告警。
  reference:
    - https://docs.aws.amazon.com/AmazonRDS/latest/UserGuide/USER_DeleteInstance.html
  metadata:
    max-request: 2
    vendor: amazon
    product: rds
  tags: cloud,devops,aws,amazon,rds,aws-cloud-config
variables:
  region: "ap-northeast-1"

flow: |
  code(1)
  for(let DBInstances of iterate(template.instances)){
    set("db", DBInstances)
    code(2)
  }

self-contained: true
code:
  - engine:
      - sh
      - bash
    source: |
      aws rds describe-db-instances --region $region --output json --query 'DBInstances[*].DBInstanceIdentifier'

    extractors:
      - type: json
        name: instances
        internal: true
        json:
          - '.[]'

  - engine:
      - sh
      - bash
    source: |
         aws rds describe-db-instances --region $region --db-instance-identifier $db --query 'DBInstances[*].DeletionProtection' --output json

    matchers:
      - type: word
        words:
          - 'false'

    extractors:
      - type: dsl
        dsl:
          - '"RDS Deletion protection feature is not enabled for RDS database instance " + db'
