id: email-extractor

info:
  name: 电子邮件地址提取
  author: panch0r3d
  severity: low
  description: |
    检测并提取页面响应中公开暴露的电子邮件地址。该模板通过邮箱格式正则匹配联系邮箱、账号地址或其他可被 OSINT 使用的邮箱标识。
  impact: |
    - 命中内容可用于资产画像、人员/社群关联、公开目录发现或业务线索收集。
    - 单独结果通常不等同于漏洞，但与其他信息组合后可能降低攻击者侦察成本。
  remediation: |
    - 确认公开信息是否符合预期，移除不必要的联系人、目录、社群或资源索引。
    - 对必须公开的文件和链接进行最小化披露，避免包含内部路径或敏感标识。
    - 定期巡检公开页面，确保内容仍然准确且未泄露额外信息。
  metadata:
    max-request: 1
  tags: miscellaneous,misc,email,generic,discovery

http:
  - method: GET
    path:
      - "{{BaseURL}}"

    extractors:
      - type: regex
        part: body
        regex:
          - "[a-zA-Z0-9-_.]{4,}@[A-Za-z0-9_-]+[.](com|org|net|io|gov|co|co.uk|com.mx|com.br|com.sv|co.cr|com.gt|com.hn|com.ni|com.au|com.cn)"
