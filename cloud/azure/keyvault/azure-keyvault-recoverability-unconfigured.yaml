id: azure-keyvault-recoverability-unconfigured
info:
  name: Azure Key Vault 未配置软删除与清除保护（云安全）
  author: princechaddha
  severity: high
  description: Key Vault 的软删除可在删除后保留保管库及其对象，清除保护则可阻止保留期内被永久清除。本模板查询 enableSoftDelete 和 enablePurgeProtection，并在两项均返回 null 时报告恢复保护状态未配置或未被当前接口确认。
  impact: |
    - 删除密钥、证书或机密后可能无法恢复，误操作或恶意删除会直接造成数据和业务凭据丢失。
    - 缺少清除保护时，拥有相应权限的攻击者可在保留期内永久清除已删除对象，破坏灾备和事件恢复能力。
  remediation: |
    - 在受支持的 Key Vault API 和 SKU 下启用软删除与清除保护，并验证删除保留期满足业务恢复要求。
    - 通过 Azure Policy 强制新建或更新保管库启用恢复保护，同时限制删除和清除操作的高权限角色。
  reference:
    - https://docs.microsoft.com/en-us/azure/key-vault/general/soft-delete-overview
  metadata:
    vendor: microsoft
    product: azure-key-vault
  tags: cloud,devops,azure,microsoft,keyvault,azure-cloud-config

flow: |
  code(1);
  for (let VaultName of iterate(template.vaultNames)) {
    set("name", VaultName)
    code(2)
  }

self-contained: true
code:
  - engine:
      - sh
      - bash
    source: |
      az keyvault list --query '[*].name' --output json

    extractors:
      - type: json
        name: vaultNames
        internal: true
        json:
          - '.[]'

  - engine:
      - sh
      - bash
    source: |
      az keyvault show --name $name --query 'properties.{"enableSoftDelete":enableSoftDelete,"enablePurgeProtection":enablePurgeProtection}' --output json

    matchers:
      - type: word
        words:
          - 'enablePurgeProtection": null'
          - 'enableSoftDelete": null'
        condition: and

    extractors:
      - type: dsl
        dsl:
          - 'name + " is not configured for recoverability with both Soft Delete and Do Not Purge enabled"'
