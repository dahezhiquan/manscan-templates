id: apache-hertzbeat-detect

info:
  name: Apache Hertzbeat 指纹识别（指纹识别）
  author: icarot
  severity: info
  description: |-
    Apache Hertzbeat 是开源监控告警平台，用于采集主机、应用、数据库和网络设备指标。该模板请求 `/assets/app-data.json`，并依据 HTTP 200 状态码、页面标题、正文关键字或品牌资源特征识别目标是否使用或暴露了 Apache Hertzbeat 相关组件，适用于资产盘点、技术栈识别和后续安全评估；命中结果仅表示指纹特征匹配，不代表已确认存在可利用漏洞。
  classification:
    cpe: cpe:2.3:a:apache:hertzbeat:-:*:*:*:*:*:*:*
  metadata:
    max-request: 1
    vendor: apache
    product: hertzbeat
    shodan-query: title:"HertzBeat"
  tags: tech,hertzbeat,apache,detect,discovery

http:
  - method: GET
    path:
      - "{{BaseURL}}/assets/app-data.json"

    matchers-condition: and
    matchers:
      - type: word
        words:
          - '"name": "HertzBeat"'
          - 'hertzbeat.apache.org'
        condition: or

      - type: status
        status:
          - 200
