id: superagi-panel

info:
  name: SuperAGI 面板识别（指纹识别）
  author: rxerium
  severity: info
  description: |
    该模板通过识别 SuperAGI 面板、控制台或管理界面的页面特征，判断目标是否暴露了对应服务入口。若命中，说明该后台或运维界面对外可访问，可用于资产识别与暴露面排查。
  reference:
    - https://github.com/TransformerOptimus/SuperAGI
    - https://superagi.com/
  metadata:
    verified: true
    max-request: 1
    vendor: TransformerOptimus
    product: superagi
    shodan-query: 'http.favicon.hash:-2056571568'
    fofa-query: 'icon_hash="-2056571568"'
  tags: panel,superagi,ai,agent,detect,discovery

http:
  - raw:
      - |
        GET / HTTP/1.1
        Host: {{Hostname}}

    host-redirects: true
    max-redirects: 2

    matchers:
      - type: dsl
        dsl:
          - contains(body, "<title>SuperAGI</title>")
          - status_code == 200 || status_code == 404
        condition: and
