id: apache-syncope-detect

info:
  name: Apache Syncope 指纹识别（指纹识别）
  author: icarot
  severity: info
  description: |-
    Apache Syncope 是身份管理平台，用于用户生命周期、账号同步、权限和审计管理。该模板请求 `/syncope-enduser/`、`/syncope-wa/`、`/syncope-console/`，并依据 HTTP 200 状态码、页面标题、正文关键字或品牌资源特征识别目标是否使用或暴露了 Apache Syncope 相关组件，适用于资产盘点、技术栈识别和后续安全评估；命中结果仅表示指纹特征匹配，不代表已确认存在可利用漏洞。
  reference:
  - https://github.com/apache/syncope
  metadata:
    verified: true
    max-request: 3
    vendor: apache
    product: syncope
  tags: tech,apache,syncope,detect

http:
  - method: GET
    path:
      - "{{BaseURL}}/syncope-enduser/"
      - "{{BaseURL}}/syncope-wa/"
      - "{{BaseURL}}/syncope-console/"

    host-redirects: true
    max-redirects: 2

    stop-at-first-match: true

    matchers-condition: and
    matchers:
      - type: word
        words:
          - '<title>Apache Syncope'
          - 'org.apache.syncope'
        condition: or

      - type: status
        status:
          - 200
