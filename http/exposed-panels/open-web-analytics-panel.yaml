id: open-web-analytics-panel

info:
  name: Open Web Analytics 登录识别（暴露面识别）
  author: DhiyaneshDK
  severity: info
  description: |
    该模板通过识别 Open Web Analytics 登录入口的页面标题、特征文本或重定向行为，判断目标是否暴露了对应的认证界面。若命中，说明该登录面板对外可访问，可用于暴露面梳理与后续安全评估。
  metadata:
    verified: true
    max-request: 1
    shodan-query: html:"OWA CONFIG SETTINGS"
  tags: open-web-analytics,login,panel,discovery

http:
  - method: GET
    path:
      - "{{BaseURL}}/index.php?owa_do=base.loginForm"

    host-redirects: true
    max-redirects: 2

    matchers-condition: and
    matchers:
      - type: word
        words:
          - "OWA.config.main_url"

      - type: status
        status:
          - 200
