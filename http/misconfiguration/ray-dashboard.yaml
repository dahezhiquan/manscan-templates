id: ray-dashboard

info:
  name: Ray 仪表盘 暴露
  author: DhiyaneshDk
  severity: critical
  description: |
    检测到 Ray 仪表盘 暴露。目标响应或文件中可能暴露配置、凭据、密钥、令牌、环境变量或历史记录等敏感信息，可能被用于进一步入侵。
  classification:
    cpe: cpe:2.3:a:ray_project:ray:*:*:*:*:*:*:*:*
  metadata:
    verified: true
    max-request: 1
    vendor: ray_project
    product: ray
    shodan-query:
      - http.favicon.hash:463802404
      - http.html:"ray dashboard"
    fofa-query:
      - icon_hash=463802404
      - body="ray dashboard"
  tags: misconfig,exposure,ray,discovery

http:
  - method: GET
    path:
      - "{{BaseURL}}"

    matchers-condition: and
    matchers:
      - type: word
        part: body
        words:
          - "Ray Dashboard"

      - type: status
        status:
          - 200
