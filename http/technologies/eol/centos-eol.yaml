id: centos-eol

info:
  name: CentOS EOL 指纹识别（指纹识别）
  author: staticnoise
  severity: info
  description: >-
    CentOS 是企业级 Linux 发行版，EOL 版本表示目标系统所用发行版已停止维护或不再获得官方安全更新。该模板通过请求目标服务并检查预设路径或首页响应、HTTP
    响应头、正则特征等指纹特征，判断目标是否使用或暴露了 CentOS EOL 相关组件；命中结果仅表示指纹特征匹配，可用于资产盘点、技术栈识别和后续安全评估，不代表已确认存在可利用漏洞。
  reference:
  - https://endoflife.date/centos
  - https://blog.centos.org/2023/04/end-dates-are-coming-for-centos-stream-8-and-centos-linux-7/
  metadata:
    max-request: 1
    shodan-query: '"Server: Apache/" "centos"'
    fofa-query: 'header="Server: Apache/" && "centos"'
  tags: centos,eol,tech
http:
  - method: GET
    path:
      - "{{BaseURL}}"

    host-redirects: true
    max-redirects: 2

    matchers:
      - type: regex
        part: header
        regex:
          - 'Apache/(\d+\.\d+\.\d+) \((centos|CentOS)\)'
