id: pocketbase-panel

info:
  name: PocketBase 面板识别（指纹识别）
  author: userdehghani
  severity: info
  description: |
    该模板通过识别 PocketBase 登录入口的页面标题、特征文本或重定向行为，判断目标是否暴露了对应的认证界面。若命中，说明该登录面板对外可访问，可用于暴露面梳理与后续安全评估。
  reference:
    - https://pocketbase.io/
    - https://pocketbase.io/docs/
  metadata:
    verified: true
    max-request: 1
    shodan-query: http.favicon.hash:981081715
  tags: panel,pocketbase,login,detect,discovery

http:
  - method: GET
    path:
      - "{{BaseURL}}/_/#/login"

    matchers-condition: and
    matchers:
      - type: word
        part: body
        words:
          - '<title>PocketBase'
        case-insensitive: true

      - type: status
        status:
          - 200
