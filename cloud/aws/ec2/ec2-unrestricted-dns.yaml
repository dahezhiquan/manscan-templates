id: ec2-unrestricted-dns
info:
  name: EC2 安全组对公网开放 DNS 端口（云安全）
  author: princechaddha
  severity: critical
  description: EC2 安全组对公网开放 DNS 端口是一类名称解析服务暴露风险，端口 53 面向任意来源可能被用于开放递归解析、反射放大或域名枚举。除权威 DNS 或明确设计的解析入口外，EC2 上的 DNS 服务通常不应无差别暴露。模板通过 `describe-security-groups` 筛选 53 端口且来源为 `0.0.0.0/0` 的入站规则，并输出命中的安全组 ID。
  impact: |
    - 开放 DNS 服务可能被滥用于反射放大攻击，产生异常流量和声誉风险。
    - 内部域名或解析行为可能被外部枚举，暴露网络结构和服务信息。
  remediation: |
    - 移除面向公网的 53 端口入站规则，或仅保留明确需要的权威 DNS 服务入口。
    - 禁用开放递归解析，并限制解析服务只接受受信任网段请求。
  reference:
    - https://docs.aws.amazon.com/vpc/latest/userguide/VPC_SecurityGroups.html#SecurityGroupRules
  metadata:
    vendor: amazon
    product: ec2
  tags: cloud,devops,aws,amazon,ec2,aws-cloud-config

variables:
  region: "us-east-1"

self-contained: true
code:
  - engine:
      - sh
      - bash
    source: |
      aws ec2 describe-security-groups --region $region --filters Name=ip-permission.from-port,Values=53 Name=ip-permission.to-port,Values=53 Name=ip-permission.cidr,Values='0.0.0.0/0' --output json --query 'SecurityGroups[*].GroupId'

    extractors:
      - type: json
        name: securitygroup
        internal: true
        json:
          - '.[]'

      - type: dsl
        dsl:
          - 'securitygroup + " security group(s) alows unrestricted access (0.0.0.0/0 or ::/0) on TCP port 53"'
