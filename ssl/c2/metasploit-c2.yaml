id: metasploit-c2

info:
  name: Metasploit C2 证书识别（证书安全）
  author: pussycat0x
  severity: info
  description: 该模板通过证书颁发者字段识别目标是否可能与 Metasploit 命令控制基础设施相关。命中说明对端使用了该框架常见的自签名 CA 特征。
  reference:
    - https://www.socinvestigation.com/shodan-filters-to-hunt-adversaries-infrastructure-and-c2/
  metadata:
    verified: "true"
    max-request: 1
    shodan-query: ssl:"MetasploitSelfSignedCA"
  tags: c2,ssl,tls,ir,osint,malware,metasploit,discovery
ssl:
  - address: "{{Host}}:{{Port}}"
    matchers:
      - type: word
        part: issuer_cn
        words:
          - "MetasploitSelfSignedCA"

    extractors:
      - type: json
        json:
          - " .issuer_cn"
