id: influxdb-panel

info:
  name: InfluxDB Admin Interface 面板识别（暴露面识别）
  author: pikpikcu,idealphase
  severity: info
  description: 该模板通过识别 InfluxDB Admin Interface 面板、控制台或管理界面的页面特征，判断目标是否暴露了对应服务入口。若命中，说明该后台或运维界面对外可访问，可用于资产识别与暴露面排查。
  reference:
    - https://www.influxdata.com/
  classification:
    cvss-metrics: CVSS:3.0/AV:N/AC:L/PR:N/UI:N/S:U/C:N/I:N/A:N
    cwe-id: CWE-200
    cpe: cpe:2.3:a:influxdata:influxdb:*:*:*:*:*:*:*:*
  metadata:
    max-request: 1
    vendor: influxdata
    product: influxdb
    shodan-query:
      - http.title:"InfluxDB - Admin Interface"
      - http.title:"influxdb - admin interface"
      - influxdb
    fofa-query: title="influxdb - admin interface"
    google-query: intitle:"influxdb - admin interface"
  tags: panel,influxdb,influxdata,discovery

http:
  - method: GET
    path:
      - "{{BaseURL}}"

    matchers-condition: and
    matchers:
      - type: word
        part: body
        words:
          - "<title>InfluxDB - Admin Interface</title>"

      - type: status
        status:
          - 200

    extractors:
      - type: regex
        group: 1
        regex:
          - '<b>InfluxDB<\/b> v([\d.]+)<\/p>'
