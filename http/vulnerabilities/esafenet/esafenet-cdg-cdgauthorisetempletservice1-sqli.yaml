id: esafenet-cdg-cdgauthorisetempletservice1-sqli
info:
  name: 亿赛通 CDG cdgauthorisetempletservice1 接口 - SQL 注入漏洞
  author: Chaitin
  severity: high
  description: |
    该模板用于检测 亿赛通 CDG cdgauthorisetempletservice1 接口 - SQL 注入漏洞。该类漏洞通常源于接口将用户输入拼接到 SQL 语句中，导致攻击者可改变查询语义。模板主要向 `/CDGServer3/CDGAuthoriseTempletService1` 等路径发送探测请求，并根据状态码、响应头、页面关键字或时间差等证据确认漏洞是否存在。
  impact: |
    - 攻击者可通过注入参数读取、篡改或删除数据库中的敏感数据。
    - 在数据库权限过高或支持危险函数的场景下，SQL 注入还可能导致认证绕过、文件读写或进一步执行系统命令。
  remediation: |
    - 对所有数据库访问使用参数化查询或安全 ORM，避免拼接用户可控输入。
    - 对受影响接口的参数进行类型、长度和取值范围校验，并关闭详细数据库错误回显。
    - 使用最小权限数据库账号，排查异常查询、数据导出和新增账号记录。
  metadata:
    verified: true
    max-request: 2
    vuln-id: CT-1404715
    vendor: esafenet
    product: cdg
  tags: sqli,vuln,esafenet
flow: http(1) || http(2)
http:
- method: POST
  path:
  - '{{BaseURL}}/CDGServer3/CDGAuthoriseTempletService1'
  headers:
    Accept-Encoding: gzip, deflate
    Content-Type: application/xml
  body: 
  matchers:
  - type: dsl
    dsl:
    - 'status_code == 200 && contains(body, "FEPCCCLCENHIPOAFPAPDDFCGEAPNMDBM")'
- method: POST
  path:
  - '{{BaseURL}}/CDGServer3/CDGAuthoriseTempletService1'
  headers:
    Accept-Encoding: gzip, deflate
    Content-Type: application/xml
  body: 
  matchers:
  - type: dsl
    dsl:
    - 'status_code == 200 && contains(body, "FEPCCCLCENHIPOAFPAPDDFCGEAPNMDBM")'
