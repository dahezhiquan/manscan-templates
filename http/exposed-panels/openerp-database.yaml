id: openerp-database

info:
  name: Odoo OpenERP Database Selector 面板识别（暴露面识别）
  author: impramodsargar
  severity: info
  description: 该模板通过识别 Odoo OpenERP Database Selector 面板、控制台或管理界面的页面特征，判断目标是否暴露了对应服务入口。若命中，说明该后台或运维界面对外可访问，可用于资产识别与暴露面排查。
  classification:
    cvss-metrics: CVSS:3.0/AV:N/AC:L/PR:N/UI:N/S:U/C:N/I:N/A:N
    cwe-id: CWE-200
    cpe: cpe:2.3:a:odoo:odoo:*:*:*:*:*:*:*:*
  metadata:
    max-request: 1
    vendor: odoo
    product: odoo
    shodan-query:
      - http.title:"odoo"
      - cpe:"cpe:2.3:a:odoo:odoo"
    fofa-query: title="odoo"
    google-query: intitle:"odoo"
  tags: openerp,panel,odoo,discovery

http:
  - method: GET
    path:
      - "{{BaseURL}}/web/database/selector/"

    matchers-condition: and
    matchers:
      - type: word
        words:
          - '<title>Odoo</title>'

      - type: status
        status:
          - 200
