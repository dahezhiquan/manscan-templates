id: azure-postgres-log-disconnections-disabled
info:
  name: Azure PostgreSQL 断开连接日志未启用（云安全）
  author: princechaddha
  severity: medium
  description: Azure PostgreSQL 的 log_disconnections 参数用于记录客户端断开连接事件，关闭后难以将连接建立、会话结束和异常中断串联成完整审计链。本模板枚举 PostgreSQL 服务器并查询 log_disconnections，在返回值为 off 时报告。
  impact: |
    - 异常会话中断、连接反复建立或资源未及时释放等迹象可能无法被及时识别，影响故障排查。
    - 入侵调查时缺少会话结束时间和断开行为，可能削弱对异常数据库活动的溯源能力。
  remediation: |
    - 将 log_disconnections 设置为 on，并将日志接入集中式审计平台进行留存和检索。
    - 根据连接规模评估日志采集量，同时配置异常断开、短连接和连接峰值的监控规则。
  reference:
    - https://docs.microsoft.com/en-us/azure/postgresql/concepts-server-logs
  metadata:
    vendor: microsoft
    product: azure-postgresql
  tags: cloud,devops,azure,microsoft,postgresql,azure-cloud-config

flow: |
  code(1);
  for (let ServerData of iterate(template.serverList)) {
    ServerData = JSON.parse(ServerData);
    set("name", ServerData.name);
    set("resourceGroup", ServerData.resourceGroup);
    code(2);
  }

self-contained: true
code:
  - engine:
      - sh
      - bash
    source: |
      az postgres server list --output json --query '[*].{"name":name, "resourceGroup":resourceGroup}'

    extractors:
      - type: json
        name: serverList
        internal: true
        json:
          - '.[]'

  - engine:
      - sh
      - bash
    source: |
      az postgres server configuration show --server-name "$name" --resource-group "$resourceGroup" --name log_disconnections --query 'value'

    matchers:
      - type: word
        words:
          - 'off'

    extractors:
      - type: dsl
        dsl:
          - 'name + " in " + resourceGroup + " has log_disconnections disabled"'
