id: nostromo-detect

info:
  name: Nostromo Web Server 指纹识别（指纹识别）
  author: Shivam Kamboj
  severity: info
  description: >-
    Nostromo 是轻量级 Web 服务器，用于提供静态内容和基础 HTTP 服务。该模板通过请求目标服务并检查预设路径或首页响应、DSL 条件、HTTP
    响应头、正则特征等指纹特征，判断目标是否使用或暴露了 Nostromo Web Server 相关组件；命中结果仅表示指纹特征匹配，可用于资产盘点、技术栈识别和后续安全评估，不代表已确认存在可利用漏洞。
  metadata:
    max-request: 1
    verified: true
    vendor: nostromo
    product: nostromo
  tags: tech,nostromo,server,discovery
http:
  - method: GET
    path:
      - "{{BaseURL}}"

    matchers:
      - type: dsl
        dsl:
          - 'contains(header, "nostromo")'

    extractors:
      - type: regex
        name: nostromo_version
        part: header
        group: 1
        regex:
          - 'nostromo\s*([0-9.]+)'
