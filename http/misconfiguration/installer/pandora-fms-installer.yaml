id: pandora-fms-installer

info:
  name: Pandora FMS 安装 Page 暴露
  author: DhiyaneshDK
  severity: high
  description: |
    检测到 Pandora FMS 安装 Page 暴露。该页面属于安装、初始化或配置向导流程，若对外暴露，攻击者可能完成初始化、创建管理员账户或重新配置目标系统。
  reference:
    - https://pandorafms.com/en/
  classification:
    cpe: cpe:2.3:a:pandorafms:pandora_fms:*:*:*:*:*:*:*:*
  metadata:
    verified: true
    max-request: 1
    vendor: pandorafms
    product: pandora_fms
    fofa-query: body="Pandora FMS - Installation Wizard"
  tags: misconfig,install,exposure,pandora-fms,vuln

http:
  - method: GET
    path:
      - "{{BaseURL}}/install.php"

    matchers-condition: and
    matchers:
      - type: word
        part: body
        words:
          - "Pandora FMS - Installation Wizard"

      - type: status
        status:
          - 200
