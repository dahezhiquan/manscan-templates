id: miniupnpd-detect

info:
  name: MiniUPnPd 指纹识别（指纹识别）
  author: Shivam Kamboj
  severity: info
  description: |
    用于识别目标是否部署 MiniUPnPd 并提取相关版本或构建信息，模板会结合 HTTP 响应头、特定路径或已知端点和版本或标识提取结果进行指纹匹配。
  metadata:
    max-request: 1
    shodan-query: "MiniUPnPd"
  tags: tech,miniupnpd

http:
  - method: GET
    path:
      - "{{BaseURL}}"

    matchers:
      - type: regex
        part: header
        regex:
          - 'MiniUPnPd'

    extractors:
      - type: regex
        part: header
        group: 1
        regex:
          - 'MiniUPnPd/([0-9.]+)'
