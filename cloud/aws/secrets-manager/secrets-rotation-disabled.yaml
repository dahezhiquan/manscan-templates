id: secrets-rotation-disabled

info:
  name: Secret 自动轮换未启用（云安全）
  author: DhiyaneshDK
  severity: medium
  description: Secrets Manager 的自动轮换可定期替换敏感凭据并降低长期凭据暴露风险；未启用时，secret 需要依赖人工轮换。该模板枚举 secrets，并检查 describe-secret 返回的 RotationEnabled 是否为 false。
  impact: |
    - 凭据泄露后可能长期可用，攻击者可持续访问数据库、API 或外部系统。
    - 人工轮换容易遗漏或延迟，增加凭据生命周期不可控和合规违规风险。
  remediation: |
    - 为适用 secret 启用 automatic rotation，并配置轮换函数、目标服务权限和测试流程。
    - 对暂不能自动轮换的 secret 建立人工轮换周期、负责人和到期告警。
  reference:
    - https://www.trendmicro.com/cloudoneconformity-staging/knowledge-base/aws/SecretsManager/rotation-enabled.html
    - https://docs.aws.amazon.com/cli/latest/reference/secretsmanager/rotate-secret.html
  metadata:
    vendor: amazon
    product: secrets-manager
  tags: cloud,devops,aws,amazon,secrets-manager,aws-cloud-config

variables:
  region: "us-west-2"

flow: |
  code(1)
  for(let SecretListName of iterate(template.secrets)){
    set("secretlist", SecretListName)
    code(2)
  }

self-contained: true

code:
  - engine:
      - sh
      - bash
    source: |
      aws secretsmanager list-secrets --region $region --query 'SecretList[*].Name' --output json

    extractors:
      - type: json
        name: secrets
        internal: true
        json:
          - '.[]'

  - engine:
      - sh
      - bash
    source: |
        aws secretsmanager describe-secret --region $region --secret-id $secretlist --query 'RotationEnabled'

    matchers:
      - type: word
        words:
          - "false"

    extractors:
      - type: dsl
        dsl:
          - '"Secrets Rotation  " + secretlist + " is disabled"'
