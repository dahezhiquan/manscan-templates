id: barco-clickshare-default-login

info:
  name: Barco ClickShare 默认口令登录（弱口令）
  author: ritikchaddha
  severity: high
  description: |
    该模板用于检测 Barco ClickShare 是否仍可使用默认凭据或弱口令登录。模板主要向 `/login`、`/login/log_me_in` 等认证入口发送请求，使用内置默认凭据组合进行认证尝试，并根据响应中的 `status_code_2 == 303 || status_code_2 == 302`、`contains(body_3, "ClickShare Configuration Wizard")` 等登录成功特征判断登录是否成功；命中说明目标未及时修改出厂、示例或初始化账号口令。
  impact: |
    - 攻击者可接管 Barco ClickShare 的 Web 管理界面，查看设备状态、网络配置、运行日志或敏感业务参数。
    - 被接管的网络、工控、打印、语音、存储或远程管理设备可能被用于中断业务、改变路由/访问策略、窃取流量或作为内网横向移动入口。
  remediation: |
    - 立即修改所有默认账号口令，禁用不再使用的出厂账号，并为管理账户设置高强度唯一密码。
    - 将设备管理入口限制在 VPN、堡垒机或可信管理网段内，避免直接暴露到公网。
    - 升级设备固件或管理组件，审计近期登录记录、配置变更和异常会话。
  classification:
    cpe: cpe:2.3:o:barco:clickshare_cs-100_huddle_firmware:*:*:*:*:*:*:*:*
  metadata:
    max-request: 3
    vendor: barco
    product: clickshare_cs-100_huddle_firmware
    shodan-query: "ClickShareSession"
  tags: default-login,barco,clickshare,vuln

http:
  - raw:
      - |
        GET /login HTTP/1.1
        Host: {{Hostname}}
      - |
        POST /login/log_me_in HTTP/1.1
        Host: {{Hostname}}
        Content-Type: application/x-www-form-urlencoded

        csrf_protection_token={{token}}&username={{username}}&password={{password}}&eula_accepted=true
      - |
        GET /configuration_wizard HTTP/1.1
        Host: {{Hostname}}

    attack: pitchfork
    payloads:
      username:
        - admin
      password:
        - admin
    matchers:
      - type: dsl
        dsl:
          - 'status_code_2 == 303 || status_code_2 == 302'
          - 'contains(body_3, "ClickShare Configuration Wizard")'
          - 'contains(location_2, "/dashboard")'
        condition: and

    extractors:
      - type: regex
        part: body
        name: token
        group: 1
        regex:
          - '="csrf_protection_token" value="([0-9a-z]+)" \/>'
        internal: true
