id: pinata-api-key

info:
  name: Pinata API 密钥暴露（暴露面识别）
  author: 0xpugal
  severity: high
  description: |
    检测到目标站点响应中暴露 Pinata API 密钥。Pinata API Key 用于 IPFS 文件上传、固定和网关资源管理。该模板检查目标响应正文，并在目标响应正文中通过正则表达式匹配对应格式的密钥、令牌、Webhook、连接串或客户端凭据。公开后可能导致对应平台资源、数据、流水线、消息发送、支付能力或第三方集成被未授权访问。
  impact: |-
    - 泄露的 API Key、访问令牌、客户端密钥、Webhook、连接串或服务账号凭据可能被用于直接调用对应平台 API 或访问受保护资源。
    - 攻击者可能借助有效凭据读取、修改或删除数据，触发构建/部署任务，发送消息，管理云资源，或冒用集成应用身份。
    - 即使令牌权限有限，也会暴露账号、项目、组织或环境边界，辅助横向移动、供应链攻击和定向社工。
  remediation: |-
    - 立即撤销并轮换暴露的 API Key、访问令牌、客户端密钥、Webhook Secret、连接串或服务账号凭据。
    - 在对应平台检查令牌权限、作用域、有效期和最近调用记录，移除不必要的高权限或长期凭据。
    - 将密钥迁移到密钥管理系统、受保护的 CI/CD 变量或运行时注入机制，避免写入前端页面、日志、源码和公开配置。
    - 启用最小权限、IP/来源限制、MFA、告警和审计日志，并排查是否存在未授权资源访问或数据变更。
  classification:
    cwe-id: CWE-540
  tags: pinata,exposure,apikey,token,vuln

http:
  - method: GET
    path:
      - "{{BaseURL}}"

    redirects: false
    matchers:
      - type: word
        words:
          - "pinata_api_key"
          - "pinata_api_secret"
          - "pinataKey"
          - "pinataSecret"
          - "pinata-key"
          - "pinata_secret"
        case-insensitive: true
        condition: or

    extractors:
      - type: regex
        part: body
        regex:
          - (?i)pinata[_\-.]?(?:api[_\-.]?)?key\s*[:=]\s*['"]?([A-Za-z0-9_\-]+)['"]?
          - (?i)pinata[_\-.]?(?:api[_\-.]?)?secret\s*[:=]\s*['"]?([A-Za-z0-9_\-]+)['"]?
          - (?i)PINATA[_\-.]?(?:API[_\-.]?)?KEY\s*=\s*['"]?([A-Za-z0-9_\-]+)['"]?
          - (?i)PINATA[_\-.]?(?:API[_\-.]?)?SECRET\s*=\s*['"]?([A-Za-z0-9_\-]+)['"]?
          - (?i)pinata(?:[_\-. ]|)(?:api|Api|API|)?(?:[_\-. ]|)(?:key|Key)\s*[:=]\s*['"]?([A-Za-z0-9_\-]+)['"]?
          - (?i)pinata(?:[_\-. ]|)(?:api|Api|API|)?(?:[_\-. ]|)(?:secret|Secret)\s*[:=]\s*['"]?([A-Za-z0-9_\-]+)['"]?
          - (?i)"?pinata[_\-.]?(?:api[_\-.]?)?key\"?\s*[:]\s*\"([A-Za-z0-9_\-]+)\"
          - (?i)"?pinata[_\-.]?(?:api[_\-.]?)?secret\"?\s*[:]\s*\"([A-Za-z0-9_\-]+)\"
          - (?i)(?:const|let|var)?\s*pinata[_\-.]?(?:api[_\-.]?)?key\s*=\s*['"]([A-Za-z0-9_\-]+)['"]
          - (?i)(?:const|let|var)?\s*pinata[_\-.]?(?:api[_\-.]?)?secret\s*=\s*['"]([A-Za-z0-9_\-]+)['"]
          - (?i)pinata[^A-Za-z0-9]{0,8}([A-Za-z0-9_\-]{16,128})
