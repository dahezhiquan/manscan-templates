id: blinko-login-panel

info:
  name: Blinko 登录面板识别（指纹识别）
  author: 0x_Akoko
  severity: info
  description: |-
    检测到目标站点存在 Blinko 相关响应特征。Blinko 是监控、日志、分析或仪表盘系统，用于展示运行指标、访问统计、日志事件和服务状态。模板请求 `/signin`，并通过页面标题或正文关键字、状态码、DSL 条件确认该系统指纹，用于资产识别、系统盘点和暴露面梳理。
  reference:
    - https://github.com/blinko-space/blinko
  metadata:
    verified: true
    max-request: 1
    shodan-query: title:"Blinko"
    fofa-query: title="Blinko"
  tags: panel,blinko,login,detect
http:
  - method: GET
    path:
      - "{{BaseURL}}/signin"

    host-redirects: true
    max-redirects: 2

    matchers:
      - type: dsl
        dsl:
          - 'status_code == 200'
          - 'contains_all(body, "<title>Blinko</title>", "Blinko self-hosted personal note")'
        condition: and
