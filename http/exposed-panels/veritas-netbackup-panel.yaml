id: veritas-netbackup-panel

info:
  name: Veritas NetBackup OpsCenter Analytics 登录面板识别（指纹识别）
  author: rxerium
  severity: info
  description: |-
    Veritas NetBackup OpsCenter Analytics 是企业备份与恢复平台，用于作业、策略、存储、恢复和备份分析管理。该模板请求 `/opscenter/`，并依据 HTTP 200 状态码、页面标题、正文关键字或品牌资源特征识别目标是否部署了该系统或暴露了对应入口，适用于资产指纹确认；命中结果仅表示系统特征匹配，不代表已确认存在未授权访问或可利用漏洞。
  reference:
  - https://www.veritas.com/
  metadata:
    verified: true
    max-request: 1
    shodan-query: html:"Veritas NetBackup OpsCenter Analytics"
  tags: panel,veritas,netbackup,opscenter,login,detect,discovery

http:
  - method: GET
    path:
      - "{{BaseURL}}/opscenter/"

    matchers-condition: and
    matchers:
      - type: word
        part: body
        words:
          - '<title>Veritas NetBackup OpsCenter Analytics'

      - type: status
        status:
          - 200
