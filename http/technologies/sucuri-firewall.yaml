id: sucuri-firewall

info:
  name: Sucuri Website Firewall 指纹识别（指纹识别）
  author: pussycat0x
  severity: info
  description: >-
    Sucuri Website Firewall 是网站防火墙和 CDN 安全服务，用于过滤恶意流量并保护网站入口。该模板通过请求目标服务并检查预设路径或首页响应、页面正文关键字、状态码等指纹特征，判断目标是否使用或暴露了
    Sucuri Website Firewall 相关组件；命中结果仅表示指纹特征匹配，可用于资产盘点、技术栈识别和后续安全评估，不代表已确认存在可利用漏洞。
  metadata:
    max-request: 1
    shodan-query: http.html:"sucuri firewall"
    fofa-query: "sucuri firewall"
  tags: tech,sucuri,firewall,discovery
http:
  - method: GET
    path:
      - "{{BaseURL}}"

    matchers-condition: and
    matchers:
      - type: word
        words:
          - '<title>Sucuri WebSite Firewall - Not Configured</title>'

      - type: status
        status:
          - 404
