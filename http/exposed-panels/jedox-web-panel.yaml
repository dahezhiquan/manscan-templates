id: jedox-web-panel

info:
  name: Jedox Web 登录面板识别（暴露面识别）
  author: Team Syslifters / Christoph MAHRL,Aron MOLNAR,Patrick PIRKER,Michael WEDL
  severity: info
  description: |
    该模板通过识别 Jedox Web 登录入口的页面标题、特征文本或重定向行为，判断目标是否暴露了对应的认证界面。若命中，说明该登录面板对外可访问，可用于暴露面梳理与后续安全评估。
  reference:
    - https://www.jedox.com
  classification:
    cpe: cpe:2.3:a:jedox:jedox:*:*:*:*:*:*:*:*
  metadata:
    verified: true
    max-request: 2
    vendor: jedox
    product: jedox
    shodan-query:
      - title:"Jedox Web - Login"
      - http.title:"jedox web - login"
      - http.title:"jedox web login"
    google-query:
      - intitle:"Jedox Web Login"
      - intitle:"jedox web login"
      - intitle:"jedox web - login"
    fofa-query:
      - title="jedox web login"
      - title="jedox web - login"
  tags: panel,jedox,detect,discovery

http:
  - method: GET
    path:
      - "{{BaseURL}}"
      - "{{BaseURL}}/ui/login/"

    stop-at-first-match: true
    host-redirects: true
    max-redirects: 2

    matchers-condition: and
    matchers:
      - type: word
        part: body
        words:
          - "Jedox Web - Login"
          - "guide-jedox-software"
        condition: or

      - type: status
        status:
          - 200
