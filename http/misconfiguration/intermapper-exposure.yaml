id: intermapper-exposure

info:
  name: InterMapper 暴露
  author: pussycat0x
  severity: high
  description: |
    检测到 InterMapper 暴露。目标功能在未认证状态下可访问，可能暴露管理入口、业务数据、系统状态或可执行操作，需确认是否存在访问控制缺失。
  metadata:
    max-request: 1
    verified: true
    shodan-query: html:"InterMapper"
  tags: exposure,intermapper,unauth

http:
  - method: GET
    path:
      - "{{BaseURL}}"

    redirects: true
    max-redirects: 2
    matchers:
      - type: dsl
        dsl:
          - "status_code == 200"
          - "contains_all(body, 'Device List','Outages','Full','Statistics','InterMapper Server')"
        condition: and
