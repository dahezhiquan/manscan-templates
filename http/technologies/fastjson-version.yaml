id: fastjson-version

info:
  name: Fastjson 版本指纹识别（指纹识别）
  author: yuansec
  severity: info
  description: 用于识别目标是否部署 Fastjson 版本 并提取相关版本或构建信息，模板会结合页面正文和版本或标识提取结果进行指纹匹配。
  reference:
    - https://blog.csdn.net/caiqiiqi/article/details/107907489
  metadata:
    max-request: 1
  tags: fastjson,tech,discovery

http:
  - raw:
      - |
        POST / HTTP/1.1
        Host: {{Hostname}}
        Content-Type: application/json

        {"@type":"java.lang.AutoCloseable"

    matchers:
      - type: word
        words:
          - 'fastjson-version'

    extractors:
      - type: regex
        part: body
        group: 1
        regex:
          - 'fastjson-version.*([0-9]\.[0-9]+\.[0-9]+)'
