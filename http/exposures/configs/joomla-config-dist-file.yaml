id: joomla-config-dist-file

info:
  name: Joomla! 配置文件检测（暴露面识别）
  author: oppsec
  severity: low
  description: 检测到对外可访问的 Joomla! 配置文件。这类配置资源可能包含部署细节、访问凭据、内部地址、组件版本或调试开关，公开暴露后会显著增加被侦察和后续利用的风险。
  metadata:
    max-request: 1
  tags: config,exposure,joomla,vuln

http:
  - method: GET
    path:
      - "{{BaseURL}}/configuration.php-dist"

    matchers-condition: and
    matchers:
      - type: word
        words:
          - "Joomla"
          - "JConfig"
          - "@package"
        condition: and

      - type: word
        words:
          - "text/plain"
        part: header

      - type: status
        status:
          - 200
