id: insecure-tty-permissions

info:
  name: macOS TTY 设备全局可读（本地基线扫描）
  author: geeknik
  severity: medium
  description: |
    TTY 设备全局可读或可写会让其他本地用户窥探终端会话内容，甚至在部分场景下注入交互数据。模板列出 `/dev/tty*` 并匹配 `crw-rw-rw-` 权限，命中时表示 TTY 设备权限过宽。
  impact: |
    - 本地用户可能读取终端交互内容，暴露命令、路径、令牌或敏感输出。
    - 设备权限过宽会破坏用户会话隔离，增加会话劫持和数据泄露风险。
  remediation: |
    - 收紧 TTY 设备权限，避免对其他用户开放读写访问。
    - 检查终端、远程登录和设备管理策略，确保会话设备按用户隔离。
  tags: macos,audit,local,security,tty

self-contained: true

code:
  - engine:
      - sh
      - bash
    source: |
      ls -l /dev/tty*
    matchers:
      - type: regex
        regex:
          - "crw-rw-rw-.*"
