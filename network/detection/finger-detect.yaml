id: finger-detect

info:
  name: Finger Daemon 识别（指纹识别）
  author: DhiyaneshDK
  severity: info
  description: |
    Finger Daemon 是传统的用户信息查询服务，可返回登录用户、会话或系统公告等信息。该模板连接 79/TCP 并读取协议响应，通过匹配 `User`、`Action`、`Node` 等响应特征识别目标服务。
  metadata:
    verified: true
    max-request: 1
    shodan-query: port:"79" action
  tags: network,finger,detect,tcp,discovery
tcp:
  - inputs:
      - data: "\n"

    host:
      - "{{Hostname}}"
    port: 79

    matchers:
      - type: word
        part: body
        words:
          - "User"
          - "Action"
          - "Node"
        condition: and
