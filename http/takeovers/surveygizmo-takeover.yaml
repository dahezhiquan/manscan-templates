id: surveygizmo-takeover

info:
  name: SurveyGizmo 表单页面接管检测（子域名接管）
  author: pdteam
  severity: high
  description: 检测 SurveyGizmo 页面中出现默认表单属性特征的情况，表明目标域名可能指向未正确归属的 SurveyGizmo 资源，存在被重新配置后接管的风险。
  reference:
    - https://github.com/EdOverflow/can-i-take-over-xyz
  metadata:
    max-request: 1
  tags: takeover,vuln

http:
  - method: GET
    path:
      - "{{BaseURL}}"

    matchers-condition: and
    matchers:
      - type: dsl
        dsl:
          - Host != ip

      - type: word
        words:
          - data-html-name

    extractors:
      - type: dsl
        dsl:
          - cname
