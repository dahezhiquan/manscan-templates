id: tenemos-t24-panel

info:
  name: Tenemos T24 登录面板识别（暴露面识别）
  author: righettod
  severity: info
  description: |
    该模板通过识别 Tenemos T24 登录入口的页面标题、特征文本或重定向行为，判断目标是否暴露了对应的认证界面。若命中，说明该登录面板对外可访问，可用于暴露面梳理与后续安全评估。
  reference:
    - https://www.temenos.com/products/core-banking
  metadata:
    max-request: 1
    verified: true
    shodan-query: http.title:"T24 Sign in"
  tags: panel,tenemos,login,discovery

http:
  - method: GET
    path:
      - "{{BaseURL}}/servlet/BrowserServlet"

    matchers:
      - type: dsl
        dsl:
          - 'status_code == 200'
          - 'contains_all(to_lower(body), "t24 sign in", "about temenos")'
        condition: and
