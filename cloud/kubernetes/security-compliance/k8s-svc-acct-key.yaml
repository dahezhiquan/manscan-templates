id: k8s-svc-acct-key

info:
  name: Ensure service-account-key-file set（云安全）
  author: princechaddha
  severity: medium
  description: kube-apiserver 缺少 service-account-key-file 会影响服务账号令牌签名验证，削弱令牌认证链路的可靠性。本模板读取 kube-apiserver 启动命令，发现缺少 service-account-key-file 参数时报告。
  impact: |
    - API Server 可能无法按预期验证服务账号令牌签名，导致工作负载身份认证异常或安全边界不清。
    - 密钥管理不规范会增加令牌伪造、误信任或轮换困难风险。
  remediation: |
    - 配置 service-account-key-file，并妥善保护和轮换服务账号签名密钥。
    - 在高可用 API Server 节点间保持密钥配置一致。
  reference:
    - https://kubernetes.io/docs/admin/kube-apiserver/
  metadata:
    vendor: kubernetes
    product: kubernetes
  tags: cloud,devops,kubernetes,security,devsecops,api-server,k8s-cluster-security
variables:
  argument: "service-account-key-file"

self-contained: true
code:
  - engine:
      - sh
      - bash
    source: |
      kubectl get pods -n kube-system -l component=kube-apiserver -o jsonpath="{.items[*].spec.containers[*].command}"

    matchers-condition: and
    matchers:
      - type: word
        words:
          - 'kube-apiserver'

      - type: word
        words:
          - "service-account-key-file"
        negative: true

    extractors:
      - type: dsl
        dsl:
          - '"API server configuration is missing the " + argument + " argument."'
