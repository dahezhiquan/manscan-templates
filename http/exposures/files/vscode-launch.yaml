id: vscode-launch

info:
  name: Visual Studio Code launch.json 暴露（暴露面识别）
  author: DhiyaneshDK
  severity: low
  description: |
    检测到目标站点可直接访问 Visual Studio Code launch.json。Visual Studio Code 配置保存调试、任务、扩展和 MCP 服务等项目级开发设置。该模板请求 `/.vscode/launch.json`，并通过 HTTP 状态码、响应正文关键字、文件格式特征、正则匹配或响应头进行确认。此类文件公开后可能泄露源码结构、依赖版本、内部路径、业务配置、访问凭据或调试数据，扩大暴露面并降低攻击者的后续利用成本。
  impact: |-
    - 调试、状态、历史或转储文件可能泄露环境变量、内存片段、命令历史、内部路径、组件版本和运行参数。
    - 攻击者可利用这些细节筛选已知漏洞、还原业务流程、定位敏感文件或制定更精确的后续攻击路径。
    - 部分历史或转储内容可能直接包含凭据、请求数据、SQL 语句或用户信息，扩大敏感数据泄露范围。
  remediation: |-
    - 关闭生产环境中的调试、状态、历史、转储、phpinfo、探针和未受保护的运行信息页面。
    - 将历史记录、崩溃转储和调试产物从 Web 可访问目录移除，并清理 CDN、对象存储和搜索引擎缓存。
    - 检查文件中是否包含凭据、请求数据、SQL 语句或用户信息，必要时执行密钥轮换和受影响账号处置。
    - 复核相关组件版本和配置，修复因暴露信息指向的弱配置或已知漏洞。
  reference:
    - https://code.visualstudio.com/docs/editor/debugging
  metadata:
    verified: true
    max-request: 1
    shodan-query: title:"index" html:".vscode"
  tags: vscode,files,debug,exposure,vuln

http:
  - method: GET
    path:
      - "{{BaseURL}}/.vscode/launch.json"

    matchers-condition: and
    matchers:
      - type: word
        part: body
        words:
          - '"version":'
          - '"configurations":'
        condition: and

      - type: word
        part: content_type
        words:
          - 'application/json'

      - type: status
        status:
          - 200
