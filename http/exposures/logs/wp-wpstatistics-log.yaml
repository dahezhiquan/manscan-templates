id: wp-wpstatistics-log

info:
  name: WordPress Plugin WP Statistics Error Log 泄露（暴露面识别）
  author: DhiyaneshDk
  severity: medium
  description: |
    检测到可直接访问的 WordPress Plugin WP Statistics Error Log。日志、异常页面或调试输出通常会泄露堆栈信息、内部路径、查询语句、账号标识、令牌片段或业务数据，不应向未授权用户开放。
  reference:
    - https://wordpress.org/plugins/wp-statistics/
  metadata:
    verified: true
    max-request: 1
  tags: wordpress,wp,wp-plugin,wp-statistics,log,exposure

http:
  - method: GET
    path:
      - "{{BaseURL}}/wp-content/uploads/wp-statistics/debug.log"

    matchers:
      - type: dsl
        dsl:
          - 'status_code == 200'
          - 'contains_all(body, "WordPress database error","address")'
        condition: and
