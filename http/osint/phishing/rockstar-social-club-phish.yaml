id: rockstar-social-club-phish

info:
  name: Rockstar Social Club 仿冒钓鱼网站（钓鱼网站识别）
  author: rxerium
  severity: info
  description: |
    检测到疑似仿冒 Rockstar Social Club 的钓鱼网站。模板在目标页面返回 200、页面内容命中 Rockstar Social Club 的品牌页面特征，且当前主机不属于 socialclub.rockstargames.com、rockstargames.com 官方域名时触发，用于识别借用 Rockstar Social Club 品牌页面诱导用户信任的仿冒站点。
  reference:
    - https://socialclub.rockstargames.com
  metadata:
    max-request: 1
  tags: phishing,rockstar-social-club,osint,discovery
http:
  - method: GET
    path:
      - "{{BaseURL}}"

    host-redirects: true
    max-redirects: 2

    matchers-condition: and
    matchers:
      - type: word
        words:
          - "The official home of Rockstar Games"

      - type: status
        status:
          - 200

      - type: dsl
        dsl:
          - '!contains(host,"socialclub.rockstargames.com")'
          - '!contains(host,"rockstargames.com")'
