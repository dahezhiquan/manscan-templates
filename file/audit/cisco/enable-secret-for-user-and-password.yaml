id: enable-secret-for-user-and-password

info:
  name: Cisco enable secret 与用户密码配置检测（本地文件安全扫描）
  author: pussycat0x
  severity: info
  description: |
    该模板检测 Cisco 设备特权访问密码和用户密码配置，用于评估是否通过 enable secret 等机制保护特权级别访问。
  reference:
    - https://www.cisco.com/E-Learning/bulk/public/tac/cim/cib/using_cisco_ios_software/cmdrefs/service_timestamps.htm
  tags: file,audit,cisco,config-audit,cisco-switch,router

file:
  - extensions:
      - conf

    matchers-condition: and
    matchers:
      - type: word
        words:
          - "enable secret"
        negative: true

      - type: word
        words:
          - "configure terminal"
