id: posthog-rum-detect

info:
  name: PostHog Browser RUM 指纹识别（指纹识别）
  author: Shivam Kamboj
  severity: info
  description: >-
    PostHog 是产品分析和用户行为平台，Browser RUM 用于采集前端性能、事件和会话数据。该模板通过请求目标服务并检查预设路径或首页响应、正则特征等指纹特征，判断目标是否使用或暴露了
    PostHog Browser RUM 相关组件；命中结果仅表示指纹特征匹配，可用于资产盘点、技术栈识别和后续安全评估，不代表已确认存在可利用漏洞。
  reference:
  - https://posthog.com/docs/integrate/client/js
  - https://github.com/PostHog/posthog-js
  - https://www.npmjs.com/package/posthog-js
  metadata:
    max-request: 1
    verified: true
    shodan-query: html:"posthog.init"
  tags: tech,discovery,rum,posthog
http:
  - method: GET
    path:
      - "{{BaseURL}}"

    redirects: true

    matchers:
      - type: regex
        part: body
        regex:
          - "window\\.posthog"
          - "api_host[\"']?\\s*:\\s*[\"'][^\"']*posthog"
          - "posthog\\.init\\s*\\("
        condition: or
