id: mDNS-enum

info:
  name: mDNS 枚举（服务漏洞）
  author: matejsmycka
  severity: low
  description: |
    该模板通过 mDNS 枚举局域网服务广播内容，识别主机名、服务类型和地址等过度暴露信息。模板发送 mDNS 查询并从响应中提取服务记录。
  impact: |
    - mDNS 枚举可能泄露主机名、服务类型、设备角色和局域网地址信息。
    - 攻击者可据此识别打印机、摄像头、开发服务或管理接口，扩大内网攻击面。
  remediation: |
    - 在不需要跨网段发现时关闭 mDNS，或通过防火墙限制 UDP 5353 暴露范围。
    - 减少广播中的主机名和服务细节，对 IoT 与办公设备分区隔离。
  metadata:
    verified: true
    shodan-query: port:5353
  tags: dns,udp,mdns,enum,js

javascript:
  - pre-condition: |
      isUDPPortOpen(Host,Port);

    code: |
      let c = require("nuclei/net");
      let conn = c.Open('udp', `${Host}:${Port}`);
      // same as dig @<HOST> -p 5353 _services._dns-sd._udp.local PTR
      let packet = "e3bc01200001000000000001095f7365727669636573075f646e732d7364045f756470056c6f63616c00000c000100002904d000000000000c000a00083e6e072b14fd0be3"
      conn.SendHex(packet);
      let resp = conn.Recv(512);
      resp;

    args:
      Host: "{{Host}}"
      Port: 5353

    matchers:
      - type: dsl
        dsl:
          - "success == true"

    extractors:
      - type: regex
        regex:
          - "workstation"
          - "http"
          - "smb"
          - "qmobile"
          - "qdiscover"
          - "ftp"
          - "nut"
          - "dacp"
          - "airplay"
          - "device-info"
          - "home-assistant"
          - "spotify-connect"
          - "sftp-ssh"
          - "ssh"
          - "afpovertcp"
          - "googlecast"
          - "printer"
          - "occam"
