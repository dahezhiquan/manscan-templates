id: azure-postgres-log-duration-disabled
info:
  name: Azure PostgreSQL 语句执行时长日志未启用（云安全）
  author: princechaddha
  severity: medium
  description: Azure PostgreSQL 的 log_duration 参数用于记录已完成语句的执行时长，关闭后会减少识别慢查询、异常批量操作和资源消耗突增的运行线索。本模板枚举 PostgreSQL 服务器并查询 log_duration，在返回值为 off 时报告。
  impact: |
    - 恶意或异常查询造成的性能下降可能无法及时与具体语句关联，延长业务中断和故障恢复时间。
    - 对数据库滥用、数据批量读取或资源消耗型攻击的检测和事后取证能力会下降。
  remediation: |
    - 将 log_duration 设置为 on，并将日志接入集中式日志平台进行检索、告警和留存。
    - 结合业务负载设置合理的日志过滤和保留策略，避免高频短语句产生过量日志。
  reference:
    - https://docs.microsoft.com/en-us/azure/postgresql/concepts-server-logs
  metadata:
    vendor: microsoft
    product: azure-postgresql
  tags: cloud,devops,azure,microsoft,postgresql,azure-cloud-config

flow: |
  code(1);
  for (let ServerData of iterate(template.serverList)) {
    ServerData = JSON.parse(ServerData);
    set("name", ServerData.name);
    set("resourceGroup", ServerData.resourceGroup);
    code(2);
  }

self-contained: true
code:
  - engine:
      - sh
      - bash
    source: |
      az postgres server list --output json --query '[*].{"name":name,"resourceGroup":resourceGroup}'

    extractors:
      - type: json
        name: serverList
        internal: true
        json:
          - '.[]'

  - engine:
      - sh
      - bash
    source: |
      az postgres server configuration show --server-name "$name" --resource-group "$resourceGroup" --name log_duration --query 'value'

    matchers:
      - type: word
        words:
          - 'off'

    extractors:
      - type: dsl
        dsl:
          - 'name + " in " + resourceGroup + " has log_duration disabled"'
