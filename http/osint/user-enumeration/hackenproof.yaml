id: hackenproof

info:
  name: Hackenproof 用户名信息枚举（OSINT）
  author: philippedelteil
  severity: info
  description: |
    Hackenproof 是面向技术产品、厂商社区或数字服务用户的在线平台，用户资料页通常会公开展示账号资料、社区互动或技术支持活动记录。该模板用于在公开互联网侧枚举 Hackenproof 用户名，不需要认证；模板请求公开路径 https://hackenproof.com/hackers/用户名，并结合响应状态为 200、页面或响应内容命中 “Check out 用户名 on HackenProof”、“Member since” 等资料页特征判断目标用户名是否存在。该检查属于 OSINT 用户枚举，结果仅表示公开资料页或公开搜索结果可被访问，不代表目标平台存在可直接修复的漏洞。
  classification:
    cvss-metrics: CVSS:3.1/AV:N/AC:L/PR:N/UI:N/S:U/C:N/I:N/A:N
    cvss-score: 0
    cwe-id: CWE-200
  metadata:
    max-request: 1
  tags: osint,osint-tech,hackenproof,discovery

self-contained: true

http:
  - method: GET
    path:
      - "https://hackenproof.com/hackers/{{user}}"

    matchers-condition: and
    matchers:
      - type: word
        part: body
        words:
          - 'Check out {{user}} on HackenProof'
          - 'Member since'
        condition: and
        case-insensitive: true

      - type: status
        status:
          - 200
