id: joomla-detect

info:
  name: Joomla! 指纹识别（指纹识别）
  author: ricardomaia
  severity: info
  description: >-
    Joomla! 是内容管理系统，用于构建、发布和维护网站内容、栏目和用户管理功能。该模板通过请求目标服务并检查预设路径或首页响应、页面正文关键字、正则特征等指纹特征，判断目标是否使用或暴露了
    Joomla! 相关组件；命中结果仅表示指纹特征匹配，可用于资产盘点、技术栈识别和后续安全评估，不代表已确认存在可利用漏洞。
  reference:
  - https://www.joomla.org/
  - https://github.com/joomla/joomla-cms
  - https://www.itoctopus.com/how-to-quickly-know-the-version-of-any-joomla-website
  - https://hackertarget.com/attacking-enumerating-joomla/
  classification:
    cpe: cpe:2.3:a:joomla:joomla\\!:*:*:*:*:*:*:*:*
  metadata:
    verified: true
    max-request: 5
    vendor: joomla
    product: joomla\\!
    google-query: Joomla! Administration Login inurl:"/index.php" ||
      intitle:"Joomla Web Installer"
  tags: tech,joomla,cms,oss,discovery
http:
  - method: GET
    path:
      - "{{BaseURL}}/administrator/manifests/files/joomla.xml" # >= 1.6.0
      - "{{BaseURL}}/language/en-GB/en-GB.xml" # >= 1.5.0 and <= 1.5.26
      - "{{BaseURL}}/README.txt"
      - "{{BaseURL}}/modules/custom.xml" # < 1.5.0
      - "{{BaseURL}}" # >= 1.5.0 and <= 1.5.26

    stop-at-first-match: true
    host-redirects: true
    max-redirects: 2

    matchers-condition: or
    matchers:
      - type: word
        part: body
        words:
          - "<version>"
          - "<creationDate>"
          - "</metafile>"
        condition: and

      - type: regex
        part: body
        regex:
          - "(?:<div[^>]+id=\"wrapper_r\"|<(?:link|script)[^>]+(?:feed|components)/com_|<table[^>]+class=\"pill)"
          - "(?i)<meta\\s+name=[\"']generator[\"']\\s+content=[\"']\\s*joomla[^\"']*"
          - "(?i)Joomla_([\\d.|\\d]+)_version_history"
          - "FILES_JOOMLA_XML_DESCRIPTION"
        condition: or

    extractors:
      - type: regex
        name: version
        group: 1
        regex:
          - '<version>(.*?)</version>'
          - '(?i)Joomla_([\d.|\d]+)_version_history'
        part: body
