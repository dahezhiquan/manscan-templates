id: eks-endpoint-access

info:
  name: EKS 集群 API 端点公网开放（云安全）
  author: princechaddha
  severity: high
  description: EKS 集群 API 端点公网开放是一类 Kubernetes 控制面暴露风险，集群管理 API 可从互联网访问。若公网访问 CIDR 过宽，攻击者可直接探测 API server 并尝试凭据喷洒、令牌滥用或漏洞利用。模板枚举 EKS 集群并读取 `cluster.resourcesVpcConfig`，当 `endpointPublicAccess` 为 `true` 或公网 CIDR 包含 `0.0.0.0/0` 时判定命中。
  impact: |
    - Kubernetes API server 暴露到公网后，集群身份认证入口更容易被扫描和攻击。
    - 若访问凭据泄露或 RBAC 过宽，攻击者可直接管理集群资源并影响工作负载。
  remediation: |
    - 优先关闭 EKS API 端点公网访问，或仅允许可信办公网、VPN、堡垒机出口 CIDR。
    - 强化集群身份认证、RBAC 最小权限和控制面访问日志监控。
  reference:
    - https://www.trendmicro.com/cloudoneconformity/knowledge-base/aws/EKS/endpoint-access.html
    - https://docs.aws.amazon.com/eks/latest/userguide/cluster-endpoint.html
  metadata:
    vendor: amazon
    product: eks
  tags: cloud,devops,aws,amazon,eks,aws-cloud-config

variables:
  region: "us-east-1"

flow: |
  code(1)
  for(let clusterName of iterate(template.clusters)){
    set("cluster", clusterName)
    code(2)
  }

self-contained: true

code:
  - engine:
      - sh
      - bash
    source: |
      aws eks list-clusters --region $region --query 'clusters[]' --output json

    extractors:
      - type: json
        name: clusters
        internal: true
        json:
          - '.[]'

  - engine:
      - sh
      - bash
    source: |
      aws eks describe-cluster --name $cluster --region $region --query 'cluster.resourcesVpcConfig' --output json

    matchers-condition: and
    matchers:
      - type: word
        words:
          - '"endpointPublicAccess": true'

      - type: word
        words:
          - '"0.0.0.0/0"'

    extractors:
      - type: dsl
        dsl:
          - '"EKS cluster " + cluster + " has public endpoint access enabled with unrestricted CIDR (0.0.0.0/0)"'
