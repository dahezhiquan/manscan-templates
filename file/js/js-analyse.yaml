id: js-analyse

info:
  name: JavaScript 文件安全分析（本地文件安全扫描）
  author: ayadim
  severity: medium
  description: |
    前端 JavaScript 会随网页或应用分发，写入其中的访问令牌、云密钥、私钥、Authorization 头、内部接口和对象存储地址通常可被任何获取代码的用户读取。将敏感凭据或过度详细的后端端点打包到 JS 中，可能造成未授权调用、数据泄露或攻击面暴露。本模板扫描 `.js` 文件，使用正则提取疑似凭据、AWS/GitHub token、私钥、S3 地址、URI、接口路径和 Ajax 调用，命中结果必须人工复核以排除示例值和误报。
  impact: |
    - 有效的 API 密钥、云访问密钥、GitHub Token 或 Bearer 凭据可能被直接用于访问云资源、代码仓库、内部 API 和用户数据。
    - 暴露的接口路径、对象存储桶和内部 URI 可帮助攻击者枚举服务、绕过前端限制并组织后续攻击。
    - 仅凭正则命中不能证明字符串仍有效，也不能确认权限范围；应结合密钥状态和服务端审计判断实际影响。
  remediation: |
    - 不要把长期凭据、私钥或高权限令牌写入前端资源；将敏感操作迁移到服务端，并为客户端使用短时、最小权限令牌。
    - 对确认泄露的凭据立即吊销、轮换并审计使用记录，同时检查相关 S3、GitHub、API 和 CI/CD 权限。
    - 通过构建扫描、Source Map 管理、代码审查和发布前 secret scanning 阻止敏感信息进入静态资源；对公开接口实施服务端鉴权和限流。
  metadata:
    verified: true
  tags: file,js-analyse,js

file:
  - extensions:
      - js

    extractors:
      - type: regex
        name: extracted-token
        regex:
          - "(?i)(([a-z0-9]+)[-|_])?(key|password|passwd|pass|pwd|private|credential|auth|cred|creds|secret|access|token|secretaccesskey)([-|_][a-z]+)?(\\s)*(:|=)+"

      - type: regex
        name: extracted-endpoints
        regex:
          - "(?i)('|\")((\\.{0,2})|([a-z0-9-_]*))/([a-z0-9-_/=:&?\\.]+)('|\")"
          - "(?i)}\\s*/[a-z0-9-_?=&/]+"
          - "(?i)path\\s*(:|=)\\s*('|\")[a-z0-9-_?=&:\\./]+('|\")"

      - type: regex
        name: extracted-uri
        regex:
          - "(?i)([a-z]{2,10}):(//|/)[a-z0-9\\./?&-_=:]+"

      - type: regex
        name: amazon-access-key
        regex:
          - "(?i)(A3T[A-Z0-9]|AKIA|AGPA|AROA|AIPA|ANPA|ANVA|ASIA)[A-Z0-9]{16}"

      - type: regex
        name: amazon-s3-url
        regex:
          - "(?i)([a-z0-9_\\-\\.]+\\.s3\\.amazonaws\\.com)"
          - "(?i)([a-z0-9\\.-]+\\.s3-[a-z0-9-\\.]+\\.amazonaws\\.com)"
          - "(?i)[a-z0-9\\.-]+\\.s3-website[\\.-](eu|ap|us|ca|sa|cn)"
          - "(?i)(s3://[a-z0-9_\\-\\./]+)"
          - "(?i)(s3\\.amazonaws\\.com/[a-z0-9/_\\-\\.]+)"
          - "(?i)(s3\\.console\\.aws\\.com/s3/buckets/[a-z0-9/_\\-\\.]+)"
          - "(?i)(s3-[a-z0-9-\\.]\\.amazonaws\\.com/[a-z0-9/_\\-\\.]+)"

      - type: regex
        name: github-personal-access-token
        regex:
          - "(?i)(ghp_[a-z0-9]{36}|github_pat_[a-z0-9]{82})"

      - type: regex
        name: github-oauth-access-token
        regex:
          - "(?i)(gho_[a-zA-Z0-9]{36})"

      - type: regex
        name: github-app-token
        regex:
          - "\b((?:ghu|ghs)_[a-zA-Z0-9]{36})\b"

      - type: regex
        name: authorization-basic
        regex:
          - "(?i)(Authorization:\\sbasic\\s+[a-z0-9=:_\\-+/]{5,100})"

      - type: regex
        name: authorization-bearer
        regex:
          - "(?i)(Authorization:\\sbearer\\s+[a-z0-9=:_\\-\\.+/]{5,100})"

      - type: regex
        name: rsa-private-key
        regex:
          - "(?i)(-----BEGIN RSA PRIVATE KEY-----)"

      - type: regex
        name: ssh-dsa-private-key
        regex:
          - "(?i)(-----BEGIN DSA PRIVATE KEY-----)"

      - type: regex
        name: ssh-ec-private-key
        regex:
          - "(?i)(-----BEGIN EC PRIVATE KEY-----)"

      - type: regex
        name: potential-ajax-request
        regex:
          - "(?i)(new\\s+xmlhttprequest\\(\\)|\\$\\.ajax\\(\\{)"
