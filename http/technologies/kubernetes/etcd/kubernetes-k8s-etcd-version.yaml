id: kubernetes-k8s-etcd-version

info:
  name: etcd Kubernetes 组件 指纹识别（指纹识别）
  author: pussycat0x
  severity: info
  description: >-
    etcd 是 Kubernetes 的一致性键值存储组件，用于保存集群状态、配置和控制平面数据。该模板通过请求目标服务并检查预设路径或首页响应、页面正文关键字、HTTP
    响应头、DSL 条件、状态码等指纹特征，判断目标是否使用或暴露了 etcd Kubernetes 组件 相关组件；命中结果仅表示指纹特征匹配，可用于资产盘点、技术栈识别和后续安全评估，不代表已确认存在可利用漏洞。
  reference:
  - https://etcd.io/
  metadata:
    verified: true
    max-request: 1
    shodan-query: product:"etcd"
  tags: tech,kubernetes,devops,etcd,discovery
http:
  - method: GET
    path:
      - "{{BaseURL}}/version"

    matchers-condition: and
    matchers:
      - type: word
        part: body
        words:
          - '"etcdserver"'
          - '"etcdcluster"'
        condition: and

      - type: word
        part: header
        words:
          - "application/json"

      - type: status
        status:
          - 200

    extractors:
      - type: dsl
        dsl:
          - 'trim(body,"{}")'
