id: apache-polaris-metrics-exposure

info:
  name: Apache Polaris 信息泄露（暴露面识别）
  author: icarot
  severity: medium
  description: |
    检测到对外可访问的 Apache Polaris 相关信息资源。这类配置资源可能包含部署细节、访问凭据、内部地址、组件版本或调试开关，公开暴露后会显著增加被侦察和后续利用的风险。
  reference:
    - https://github.com/apache/polaris
  classification:
    cpe: cpe:2.3:a:apache:polaris:*:*:*:*:*:*:*:*
  metadata:
    vendor: apache
    product: polaris
    shodan-query: http.html:"org.apache.polaris"
  tags: apache,polaris,exposure,metrics,misconfig

http:
  - method: GET
    path:
      - "{{BaseURL}}/q/metrics"

    matchers-condition: and
    matchers:
      - type: word
        words:
          - 'application="Polaris"'
          - 'org.apache.polaris'
        condition: and

      - type: status
        status:
          - 200
