id: winrm-allows-unencrypted-traffic

info:
  name: WinRM 允许未加密流量（本地基线扫描）
  author: princechaddha
  severity: high
  description: |
    该模板检查 Windows Remote Management（WinRM）是否允许未加密通信。未加密 WinRM 会暴露管理数据。
  impact: |
    攻击者可截获敏感管理流量或凭据材料。
  remediation: |
    将 AllowUnencrypted 设置为 False，并使用 HTTPS 或受保护通道。
  tags: winrm,unencrypted,traffic,code,windows-audit

self-contained: true

code:
  - pre-condition: |
      IsWindows();
    engine:
      - powershell
      - powershell.exe
    args:
      - -ExecutionPolicy
      - Bypass
    pattern: "*.ps1"
    source: |
      (Get-Item WSMan:\localhost\Service).AllowUnencrypted

    matchers:
      - type: word
        words:
          - "True"
