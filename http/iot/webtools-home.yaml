id: webtools-home

info:
  name: Webtools 面板识别（IOT）
  author: dhiyaneshDK
  severity: low
  description: |
    检测到 Webtools 面板。该模板用于识别暴露的 Webtools 管理或服务页面，可能泄露相关设备或应用入口。
  impact: |
    - 暴露的设备面板会泄露资产类型、产品型号、部署位置或管理入口，为后续弱口令和漏洞利用提供线索。
    - 若设备本身存在默认凭据或旧固件问题，攻击者可能进一步访问或控制设备。
  remediation: |
    - 确认该面板是否需要对当前网络开放；如无必要，应限制到内网、管理 VLAN 或 VPN。
    - 启用强认证，修改默认口令，并保持设备固件为受支持版本。
    - 对管理入口访问、登录失败和配置变更启用审计。
  metadata:
    max-request: 1
    shodan-query: http.title:"Webtools"
  tags: iot,discovery

http:
  - method: GET
    path:
      - "{{BaseURL}}/wt2parser.cgi?home_en"

    matchers-condition: and
    matchers:
      - type: word
        words:
          - '<title>WebTools | Home</title>'

      - type: status
        status:
          - 200
