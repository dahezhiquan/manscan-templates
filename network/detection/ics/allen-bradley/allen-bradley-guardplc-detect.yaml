id: allen-bradley-guardplc-detect

info:
  name: Allen-Bradley GuardPLC Series PLC 识别（指纹识别）
  author: biero-el-corridor
  severity: info
  description: |
    该模板通过工业协议指纹识别目标是否运行 Allen-Bradley GuardPLC Series PLC 相关设备或控制系统。
  metadata:
    shodan-query: 'port:44818 "Vendor ID: Rockwell Automation/Allen-Bradley"'
  tags: ics,allen-bradley,guardplc,detect,network,tcp

tcp:
  - inputs:
      - data: "630000000000000000000000000000000000000000000000"
        type: hex
        read: 200
        name: info

    host:
      - "{{Hostname}}"
    port: 44818
    read-size: 1024

    matchers-condition: or
    matchers:
      - type: binary
        part: info
        binary:
          - "313735332d" # 1753

      - type: binary
        part: info
        binary:
          - "313735342d" # 1754

      - type: binary
        part: info
        binary:
          - "313735352d" # 1755
