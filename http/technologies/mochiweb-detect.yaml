id: mochiweb-detect

info:
  name: MochiWeb 指纹识别（指纹识别）
  author: Shivam Kamboj
  severity: info
  description: |
    用于识别目标是否部署 MochiWeb 并提取相关版本或构建信息，模板会结合 HTTP 响应头、特定路径或已知端点和版本或标识提取结果进行指纹匹配。
  metadata:
    verified: true
    shodan-query: http.component:"mochiweb" country:"US"
  tags: tech,mochiweb

http:
  - method: GET
    path:
      - "{{BaseURL}}"

    matchers:
      - type: regex
        part: header
        regex:
          - 'MochiWeb'

    extractors:
      - type: regex
        part: header
        group: 1
        regex:
          - 'MochiWeb/([0-9.]+)'
