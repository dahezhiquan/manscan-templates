id: amazon-sns-token

info:
  name: Amazon SNS 令牌 泄露检测（本地文件安全扫描）
  author: TheBinitGhimire
  severity: high
  description: |
    Amazon SNS 令牌是服务资源的地址或唯一标识，不一定是秘密；但公开后会暴露区域、账户、项目或资源命名信息。若资源访问策略配置不当，攻击者可能进一步读取、写入或枚举数据。本模板匹配 `arn:aws:sns:` 开头的 SNS 主题 ARN，识别消息主题、区域和账户标识，不把 ARN 本身当作访问令牌。
  impact: |
    - 资源地址或 ARN 暴露会帮助攻击者定位目标账户、区域、项目和数据入口。
    - 若资源策略、匿名访问或网络边界配置错误，攻击者可能进一步读取、写入或删除数据。
    - 资源标识本身通常不等于访问凭据，实际影响需结合权限和访问测试确认。
  remediation: |
    - 核对资源是否应公开；对 S3、Firebase 等资源关闭匿名读写，启用鉴权、最小权限和网络访问控制。
    - 删除日志、源码和构建产物中不必要的资源标识，避免把资源地址与访问密钥同时发布。
    - 检查访问日志、策略变更和异常数据操作，确认是否存在被滥用的迹象。
  classification:
    cvss-metrics: CVSS:3.1/AV:N/AC:L/PR:N/UI:N/S:U/C:N/I:N/A:N
    cvss-score: 0
    cwe-id: CWE-200
  tags: file,keys,token,amazon,aws,sns

file:
  - extensions:
      - all

    extractors:
      - type: regex
        name: amazon-sns-topic
        regex:
          - 'arn:aws:sns:[a-z0-9\-]+:[0-9]+:[A-Za-z0-9\-_]+'

