id: device-guard-not-configured

info:
  name: Device Guard 未配置（本地基线扫描）
  author: princechaddha
  severity: high
  description: |
    该模板检查 Device Guard 是否未配置。缺少代码完整性和应用控制策略会降低对未授权代码执行的防护。
  impact: |
    攻击者更容易运行未经批准的脚本、驱动或可执行文件。
  remediation: |
    根据业务需要配置 Device Guard/Windows Defender Application Control 策略。
  tags: device-guard,code,windows-audit

self-contained: true

code:
  - pre-condition: |
      IsWindows();
    engine:
      - powershell
      - powershell.exe
    args:
      - -ExecutionPolicy
      - Bypass
    pattern: "*.ps1"
    source: |
      Get-CimInstance -ClassName Win32_DeviceGuard -Namespace root\Microsoft\Windows\DeviceGuard

    matchers:
      - type: regex
        regex:
          - 'SecurityServicesConfigured\s+:\s+\{0\}'
          - 'SecurityServicesRunning\s+:\s+\{0\}'
          - 'VirtualizationBasedSecurityStatus\s+:\s+0'
        condition: or
