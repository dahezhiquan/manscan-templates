id: yunohost-admin-panel

info:
  name: YunoHost 登录面板识别（指纹识别）
  author: s4e-io
  severity: info
  description: |-
    YunoHost 是自托管服务器管理平台，用于用户、域名、应用安装和系统服务维护。该模板请求 `/yunohost/admin`，并依据 favicon 哈希、DSL 条件识别目标是否部署了该系统或暴露了对应入口，适用于资产指纹确认；命中结果仅表示系统特征匹配，不代表已确认存在未授权访问或可利用漏洞。
  reference:
  - https://yunohost.org/
  - https://github.com/YunoHost/yunohost
  metadata:
    verified: true
    max-request: 1
    fofa-query: title="YunoHost Admin"
  tags: panel,login,yunohost,detect,discovery

http:
  - method: GET
    path:
      - "{{BaseURL}}/yunohost/admin"

    host-redirects: true
    max-redirects: 2
    matchers:
      - type: dsl
        dsl:
          - 'contains_any(body, "<title>YunoHost Admin", "href=\"/yunohost/admin/favicon")'
          - 'status_code == 200'
        condition: and
