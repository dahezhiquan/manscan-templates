id: winrm-detect

info:
  name: Windows Remote Management 指纹识别（指纹识别）
  author: pussycat0x
  severity: info
  description: >-
    Windows Remote Management 是 Microsoft 的远程管理协议和服务，用于通过 WS-Management 管理 Windows
    主机。该模板通过请求目标服务并检查预设路径或首页响应、状态码、HTTP 响应头、正则特征、页面正文关键字等指纹特征，判断目标是否使用或暴露了 Windows
    Remote Management 相关组件；命中结果仅表示指纹特征匹配，可用于资产盘点、技术栈识别和后续安全评估，不代表已确认存在可利用漏洞。
  metadata:
    max-request: 1
    verified: true
    shodan-query: product:"WinRM"
  tags: network,winrm,windows,discovery,detect
http:
  - method: POST
    path:
      - "{{BaseURL}}/wsman"

    matchers-condition: and
    matchers:
      - type: status
        status:
          - 401

      - type: regex
        part: header
        regex:
          - 'Microsoft-HTTPAPI\/[0-9\.]+'

      - type: word
        part: header
        words:
          - "Www-Authenticate: NTLM"
          - "Www-Authenticate: Negotiate"
        condition: or
