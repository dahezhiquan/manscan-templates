id: elasticsearch-sql-client-detect

info:
  name: Elasticsearch - SQL Client 指纹识别（指纹识别）
  author: pussycat0x
  severity: info
  description: Elasticsearch - SQL Client 是分布式搜索和分析引擎，用于全文检索、日志分析和结构化查询。该模板请求首页，并依据 HTTP 200 状态码、页面标题、正文关键字或品牌资源特征识别目标是否使用或暴露了 Elasticsearch - SQL Client 相关组件，适用于资产盘点、技术栈识别和后续安全评估；命中结果仅表示指纹特征匹配，不代表已确认存在可利用漏洞。
  classification:
    cpe: cpe:2.3:a:elastic:elasticsearch:*:*:*:*:*:*:*:*
  metadata:
    max-request: 1
    vendor: elastic
    product: elasticsearch
    shodan-query: http.title:"Elasticsearch-sql client"
  tags: elasticsearch,tech,sql,discovery

http:
  - method: GET
    path:
      - '{{BaseURL}}'

    matchers-condition: and
    matchers:
      - type: word
        words:
          - '<title>Elasticsearch-sql client</title>'
        part: body

      - type: status
        status:
          - 200
