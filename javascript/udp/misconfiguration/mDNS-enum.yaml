id: mDNS-enum

info:
  name: mDNS 服务枚举信息暴露（服务漏洞）
  author: matejsmycka
  severity: low
  description: |
    mDNS 用于在本地链路内通过 UDP 5353 广播主机和服务发现信息，常见于工作站、打印机、媒体设备、文件共享和 IoT 设备。若该服务可被非预期来源查询，攻击者可枚举主机名、服务类型和局域网角色；该模板发送 _services._dns-sd._udp.local 查询，并从响应中提取常见服务记录以确认信息暴露。
  impact: |
    - 泄露主机名、服务类型、设备角色和局域网地址等资产画像信息。
    - 帮助攻击者快速定位打印机、摄像头、文件共享、开发服务或管理接口，扩大后续探测范围。
    - 在跨网段或公网误暴露场景下，可能暴露原本只应在本地链路内可见的服务发现数据。
  remediation: |
    - 在不需要本地自动发现时关闭 mDNS，或通过防火墙限制 UDP 5353 仅在可信本地网段可达。
    - 禁止将 mDNS 跨网段转发到不可信网络，清理广播记录中的敏感主机名和服务细节。
    - 对 IoT、办公终端和管理设备进行网络分区，降低服务枚举结果对后续攻击的帮助。
  metadata:
    verified: true
    shodan-query: port:5353
  tags: dns,udp,mdns,enum,js

javascript:
  - pre-condition: |
      isUDPPortOpen(Host,Port);

    code: |
      let c = require("nuclei/net");
      let conn = c.Open('udp', `${Host}:${Port}`);
      // same as dig @<HOST> -p 5353 _services._dns-sd._udp.local PTR
      let packet = "e3bc01200001000000000001095f7365727669636573075f646e732d7364045f756470056c6f63616c00000c000100002904d000000000000c000a00083e6e072b14fd0be3"
      conn.SendHex(packet);
      let resp = conn.Recv(512);
      resp;

    args:
      Host: "{{Host}}"
      Port: 5353

    matchers:
      - type: dsl
        dsl:
          - "success == true"

    extractors:
      - type: regex
        regex:
          - "workstation"
          - "http"
          - "smb"
          - "qmobile"
          - "qdiscover"
          - "ftp"
          - "nut"
          - "dacp"
          - "airplay"
          - "device-info"
          - "home-assistant"
          - "spotify-connect"
          - "sftp-ssh"
          - "ssh"
          - "afpovertcp"
          - "googlecast"
          - "printer"
          - "occam"
