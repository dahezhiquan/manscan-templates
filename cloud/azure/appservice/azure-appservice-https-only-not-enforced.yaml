id: azure-appservice-https-only-not-enforced
info:
  name: Azure App Service 未强制仅使用 HTTPS（云安全）
  author: princechaddha
  severity: medium
  description: Azure App Service 未启用 HTTPS-only 时，应用可能继续接受 HTTP 明文请求，令牌、Cookie、请求参数和响应内容缺少传输加密保护。该模板枚举 Web App，查询 httpsOnly，并在返回 false 时报告未强制 HTTPS。
  impact: |
    - 网络攻击者可窃听或篡改明文流量，窃取会话 Cookie、访问令牌和敏感业务数据。
    - HTTP 入口可能被用于降级访问、钓鱼重定向或绕过仅在 HTTPS 上生效的安全策略。
  remediation: |
    - 将 App Service 的 httpsOnly 设置为 true，并为所有自定义域名配置有效证书绑定。
    - 检查应用、反向代理和客户端中的绝对 HTTP 链接及重定向逻辑，确认不存在未加密旁路。
  reference:
    - https://docs.microsoft.com/en-us/azure/app-service/configure-ssl-bindings#enforce-https
  metadata:
    vendor: microsoft
    product: azure-app-service
  tags: cloud,devops,azure,microsoft,appservice,azure-cloud-config

flow: |
  code(1);
  for (let AppServiceData of iterate(template.appServiceList)) {
    AppServiceData = JSON.parse(AppServiceData);
    set("id", AppServiceData.id);
    code(2);
  }

self-contained: true
code:
  - engine:
      - sh
      - bash
    source: |
      az webapp list --output json --query '[*].{id:id}'

    extractors:
      - type: json
        name: appServiceList
        internal: true
        json:
          - '.[]'

  - engine:
      - sh
      - bash
    source: |
      az webapp show --ids $id --query 'httpsOnly' --output json

    matchers:
      - type: word
        words:
          - "false"

    extractors:
      - type: dsl
        dsl:
          - 'id + " does not enforce HTTPS-only traffic"'
