id: riello-netman204-panel

info:
  name: Riello UPS NetMan 204 登录面板识别（指纹识别）
  author: s4e-io
  severity: info
  description: |-
    Riello UPS NetMan 204 是 Riello UPS 网络管理卡界面，用于电源状态、告警、SNMP 和远程维护。该模板请求首页，并依据 DSL 条件识别目标是否部署了该系统或暴露了对应入口，适用于资产指纹确认；命中结果仅表示系统特征匹配，不代表已确认存在未授权访问或可利用漏洞。
  reference:
  - https://www.riello-ups.com
  metadata:
    vendor: riello-ups
    product: netman_204_firmware
    shodan-query: title:"netman 204"
    fofa-query: title="netman 204"
    censys-query: services.http.response.body:"netman204"
    google-query: intitle:"netman 204"
  tags: netman,panel,detect,login,discovery

http:
  - method: GET
    path:
      - "{{BaseURL}}"

    host-redirects: true
    max-redirects: 2
    matchers:
      - type: dsl
        dsl:
          - 'contains(body,"Netman 204")'
          - 'status_code == 200'
        condition: and
