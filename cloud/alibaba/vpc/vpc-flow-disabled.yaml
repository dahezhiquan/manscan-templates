id: vpc-flow-disabled

info:
  name: 阿里云 VPC Flow Log 未启用（云安全）
  author: DhiyaneshDK
  severity: medium
  description: VPC 未启用 Flow Log 时，弹性网卡、交换机或 VPC 级别的入出方向流量缺少集中记录，网络故障排查和安全分析会受到影响。模板枚举 VPC 后调用 DescribeFlowLogs，当指定 VPC 返回 FlowLog 为空数组时判定 Flow Log 未启用。
  impact: |
    - 无法审计 VPC 内关键网络流量，横向移动、异常连接或安全组误配置可能难以及时发现。
    - 网络排障缺少五元组、流量方向和接受/拒绝等证据，影响故障定位和攻击溯源。
  remediation: |
    - 为生产 VPC、关键 vSwitch 或 ENI 启用 Flow Log，并将日志投递到 Simple Log Service。
    - 配置索引、保留周期和告警规则，定期分析拒绝流量、异常端口和跨网段访问行为。
  reference:
    - https://www.alibabacloud.com/help/en/vpc/user-guide/create-and-manage-flow-log
    - https://www.trendmicro.com/cloudoneconformity/knowledge-base/alibaba-cloud/AlibabaCloud-VPC/enable-flow-logs.html
  metadata:
    max-request: 1
    verified: true
    vendor: alibaba
    product: vpc
  tags: cloud,devops,aliyun,alibaba,alibaba-cloud-config,alibaba-vpc

variables:
  region: "cn-hangzhou"

self-contained: true

flow: |
  code(1)
  for(let VpcId of iterate(template.vpcid)){
    set("vpc", VpcId)
    code(2)
  }

code:
  - engine:
      - sh
      - bash
    source: |
      aliyun vpc DescribeVpcs --region $region

    extractors:
      - type: json
        name: vpcid
        internal: true
        json:
          - '.Vpcs.Vpc[].VpcId'

  - engine:
      - sh
      - bash

    source: |
      aliyun vpc DescribeFlowLogs --RegionId $region --VpcId $vpcid

    matchers:
      - type: word
        words:
          - '"FlowLog": []'

    extractors:
      - type: dsl
        dsl:
          - 'vpcid + " VPC Flow Log is Disabled "'
