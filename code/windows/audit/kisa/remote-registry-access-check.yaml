id: remote-registry-access-check

info:
  name: Remote Registry 服务未禁用（本地基线扫描）
  author: nukunga[SungHyunJeon]
  severity: medium
  description: |
    该模板检查 Remote Registry 服务是否禁用。启用后远程用户可能访问或修改 Windows 注册表。
  impact: |
    攻击者可远程枚举配置、修改安全设置或植入持久化项。
  remediation: |
    禁用 Remote Registry 服务，或仅在受控维护窗口和可信来源下临时启用。
  reference:
    - https://isms.kisa.or.kr/main/csap/notice/?boardId=bbs_0000000000000004&mode=view&cntId=85
  tags: code,windows-audit,kisa,registry,remote-access

self-contained: true

code:
  - pre-condition: |
      IsWindows();
    engine:
      - powershell
      - powershell.exe
    args:
      - -ExecutionPolicy
      - Bypass
    pattern: "*.ps1"
    source: |
      $remoteRegistry = Get-Service -Name RemoteRegistry -ErrorAction SilentlyContinue
      if ($remoteRegistry -and $remoteRegistry.Status -eq "Running") {
          "REMOTE_REGISTRY_ENABLED"
      } else {
          "REMOTE_REGISTRY_DISABLED"
      }

    matchers:
      - type: word
        words:
          - "REMOTE_REGISTRY_ENABLED"
