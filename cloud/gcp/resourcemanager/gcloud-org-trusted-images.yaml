id: gcloud-org-trusted-images

info:
  name: Trusted Image Projects 未Defined（云安全）
  author: princechaddha
  severity: medium
  description: 未限制可信镜像项目时，用户可从任意可访问镜像创建 Compute Engine 实例，可能引入未加固或来源不可信的系统镜像。本模板检查 compute.trustedImageProjects 组织策略 listPolicy.allValues，值为 ALLOW 时报告未定义可信镜像项目限制。
  impact: |
    - 工作负载可能使用包含漏洞、恶意软件、弱配置或未批准代理的镜像启动。
    - 镜像来源不统一会削弱补丁管理、基线加固和软件供应链审计。
  remediation: |
    - 配置 compute.trustedImageProjects，仅允许从受信任镜像项目创建实例。
    - 建立黄金镜像发布、漏洞扫描、签名校验和弃用流程，定期清理未批准镜像使用。
  reference:
    - https://www.trendmicro.com/cloudoneconformity/knowledge-base/gcp/ResourceManager/disk-image-restriction.html
    - https://cloud.google.com/compute/docs/images/restricting-image-access
  metadata:
    vendor: google
    product: resource-manager
  tags: cloud,devops,gcp,gcloud,resourcemanager,security,compute,images,gcp-cloud-config

flow: |
  code(1)
  for(let orgId of iterate(template.orgIds)){
    set("orgId", orgId)
    code(2)
  }

self-contained: true

code:
  - engine:
      - sh
      - bash
    source: |
      gcloud organizations list --format="json(name)"

    extractors:
      - type: json
        name: orgIds
        internal: true
        json:
          - '.[].name'

  - engine:
      - sh
      - bash
    source: |
      gcloud alpha resource-manager org-policies describe compute.trustedImageProjects --organization=$orgId --effective --format="json(listPolicy.allValues)"

    matchers:
      - type: word
        words:
          - "ALLOW"

    extractors:
      - type: dsl
        dsl:
          - '"Organization " + orgId + " has not restricted disk image usage to trusted projects, allowing use of any accessible image"'
