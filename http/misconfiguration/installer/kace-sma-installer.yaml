id: kace-sma-installer

info:
  name: KACE Systems Management Appliance 安装向导暴露
  author: ritikchaddha
  severity: high
  description: |
    该模板用于核查 KACE Systems Management Appliance 安装向导暴露。该类问题通常源于安装、初始化、升级或配置向导在部署完成后仍可从公网访问。模板会向目标发送探测请求，并依据请求 `/common/setup.php`、匹配 `Initial Setup`、匹配 `setup_wizard`、匹配 `KACE`等证据确认目标是否存在该配置问题。
  impact: |
    - 攻击者可能完成初始化流程、创建管理员账户、覆盖配置或触发升级逻辑。
    - 在部分系统中，暴露安装入口还可能导致数据库连接信息泄露、站点被重新配置或业务被接管。
  remediation: |
    - 完成部署后立即删除、禁用或限制安装与升级入口。
    - 对初始化流程增加来源限制和一次性安装校验，避免公网直接访问。
    - 检查系统是否已被异常初始化或创建未知管理员账户，并轮换相关凭据。
  metadata:
    verified: true
    max-request: 1
    vendor: quest
    product: kace_systems_management_appliance
    fofa-query: icon_hash="-463230636" && body="setup"
  tags: kace,sma,installer,exposure,quest,vuln

http:
  - method: GET
    path:
      - "{{BaseURL}}/common/setup.php"

    matchers-condition: and
    matchers:
      - type: word
        part: body
        words:
          - "Initial Setup"
          - "setup_wizard"
          - "KACE"
        condition: and
        case-insensitive: true

      - type: status
        status:
          - 200
