id: dxplanning-panel

info:
  name: DXPlanning 面板识别（指纹识别）
  author: righettod
  severity: info
  description: |-
    检测到目标站点存在 DXPlanning 相关响应特征。DXPlanning 是监控、日志、分析或可观测性系统，用于展示运行指标、告警事件、日志数据和服务状态。模板请求 `/DxPlanning/WebBooking/Version`，并通过页面标题或正文关键字、状态码、DSL 条件确认该系统指纹，用于资产识别、系统盘点和暴露面梳理。
  reference:
    - https://www.dedalus.com/fr/wp-content/uploads/sites/13/2022/05/Catalogue-formations-DxCare-2022.pdf
  metadata:
    verified: true
    max-request: 1
  tags: panel,dxplanning,login,detect,discovery
http:
  - method: GET
    path:
      - '{{BaseURL}}/DxPlanning/WebBooking/Version'

    matchers-condition: and
    matchers:
      - type: dsl
        dsl:
          - "contains(tolower(body), 'dxplanning/webbooking/')"
          - "contains(body, 'Webbooking</title>')"
          - "status_code==200"
        condition: and

    extractors:
      - type: regex
        part: body
        group: 1
        regex:
          - '<td>([0-9.]+)</td>'
