id: readme-takeover

info:
  name: ReadMe 项目缺失接管检测（子域名接管）
  author: pdteam
  severity: high
  description: 检测 ReadMe 返回项目尚不存在的提示，说明目标自定义域名可能仍指向 ReadMe 但未关联有效文档项目，存在被重新创建后接管的风险。
  reference:
    - https://github.com/EdOverflow/can-i-take-over-xyz/issues/41
  metadata:
    max-request: 1
  tags: takeover,readme,vuln

http:
  - method: GET
    path:
      - "{{BaseURL}}"

    matchers-condition: and
    matchers:
      - type: dsl
        dsl:
          - Host != ip

      - type: word
        words:
          - 'Project doesnt exist... yet!'

    extractors:
      - type: dsl
        dsl:
          - cname
