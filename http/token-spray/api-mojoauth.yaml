id: api-mojoauth

info:
  name: MojoAuth API Token 可用性校验（token喷洒）
  author: daffainfo
  severity: high
  description: |-
    平台介绍：MojoAuth API 是面向身份认证、访问管理或多因素认证的服务平台，常用于管理用户、应用、令牌、认证流程或安全策略。该模板用于校验提交的 MojoAuth API Token 是否仍然有效。检测逻辑会向 `api.mojoauth.com/token/jwks` 发起低影响 API 请求，通过模板配置的认证字段传递 `{{token}}`，并依据响应中的 `"keys"`、`"kty"`、`"kid"` 判断凭据是否可用；命中通常表示该 Token 可被继续调用对应平台能力。
  reference:
    - https://mojoauth.com/docs/
    - https://github.com/daffainfo/all-about-apikey/tree/main/mojoauth
  metadata:
    max-request: 1
  tags: token-spray,mojoauth
  impact: |-
    - 攻击者可枚举用户、应用、认证配置或多因素认证相关信息。
    - 高权限 Token 可能被用于修改身份策略、创建访问凭据或扩大账号接管范围。
  remediation: |-
    - 立即撤销或轮换已暴露的 API Token，并确认旧 Token 不再可用。
    - 按最小权限原则重新签发凭据，限制作用域、来源地址、项目范围和有效期。
    - 在代码仓库、CI/CD、日志和配置文件中排查泄露来源，避免 Token 再次提交或外传。
    - 检查近期 API 调用、资源变更、账单和权限配置，确认是否存在异常操作。
self-contained: true

http:
  - raw:
      - |
        POST https://api.mojoauth.com/token/jwks HTTP/1.1
        Host: api.mojoauth.com
        X-API-Key: {{token}}

    matchers:
      - type: word
        part: body
        words:
          - '"keys"'
          - '"kty"'
          - '"kid"'
        condition: and
