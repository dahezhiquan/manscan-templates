id: bentoml-detect

info:
  name: BentoML Prediction 服务 指纹识别（指纹识别）
  author: rxerium
  severity: info
  description: |-
    BentoML Prediction 服务 是机器学习模型服务框架，用于打包、部署和暴露模型推理 API。该模板请求首页，并依据 HTTP 200 状态码、页面标题、正文关键字或品牌资源特征识别目标是否使用或暴露了 BentoML Prediction 服务 相关组件，适用于资产盘点、技术栈识别和后续安全评估；命中结果仅表示指纹特征匹配，不代表已确认存在可利用漏洞。
  reference:
  - https://www.bentoml.com/
  - https://github.com/bentoml/BentoML
  metadata:
    verified: true
    max-request: 1
    shodan-query: html:"BentoML"
  tags: tech,bentoml,ai,ml,prediction,mlops

http:
  - method: GET
    path:
      - "{{BaseURL}}"

    host-redirects: true
    max-redirects: 2

    matchers-condition: and
    matchers:
      - type: word
        part: body
        words:
          - "<title>BentoML Prediction Service"

      - type: status
        status:
          - 200
