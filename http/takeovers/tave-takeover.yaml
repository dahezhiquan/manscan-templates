id: tave-takeover

info:
  name: Tave 页面缺失接管检测（子域名接管）
  author: pdteam
  severity: high
  description: 检测 Tave 返回 Error 404 Page Not Found 的情况，表明目标自定义域名可能仍指向 Tave 但未关联有效工作室页面，存在被重新绑定后接管的风险。
  reference:
    - https://github.com/EdOverflow/can-i-take-over-xyz
  metadata:
    max-request: 1
  tags: takeover,vuln

http:
  - method: GET
    path:
      - "{{BaseURL}}"

    matchers-condition: and
    matchers:
      - type: dsl
        dsl:
          - Host != ip

      - type: word
        words:
          - "<h1>Error 404: Page Not Found</h1>"

    extractors:
      - type: dsl
        dsl:
          - cname
