id: icecast-server-detect

info:
  name: Icecast Streaming Media 指纹识别（指纹识别）
  author: theamanrawat
  severity: info
  description: >-
    Icecast 是开源流媒体服务器，用于发布网络电台、音频流和视频流。该模板通过请求目标服务并检查预设路径或首页响应、页面正文关键字、HTTP 响应头、状态码等指纹特征，判断目标是否使用或暴露了
    Icecast Streaming Media 相关组件；命中结果仅表示指纹特征匹配，可用于资产盘点、技术栈识别和后续安全评估，不代表已确认存在可利用漏洞。
  classification:
    cpe: cpe:2.3:a:xiph:icecast:*:*:*:*:*:*:*:*
  metadata:
    verified: true
    max-request: 1
    vendor: xiph
    product: icecast
    shodan-query: http.title:"Icecast Streaming Media Server"
  tags: tech,icecast,discovery
http:
  - method: GET
    path:
      - '{{BaseURL}}'

    matchers-condition: and
    matchers:
      - type: word
        part: header
        words:
          - "Icecast"

      - type: status
        status:
          - 200
