id: atlona-default-login

info:
  name: Atlona AT-OME-MS42 默认口令登录（弱口令）
  author: matejsmycka
  severity: high
  description: |
    该模板通过尝试 Atlona AT-OME-MS42 的默认账号口令（如 admin:Atlona.），并依据认证成功后的响应特征判断目标是否仍在使用未修改的弱口令。若命中，攻击者可直接登录系统，进一步访问敏感信息、修改配置或执行未授权操作。
  reference:
    - https://atlona.com/pdf/manuals/AT-OME-MS42_G.pdf
  tags: atlona,default-login,vuln

http:
  - raw:
      - |
        POST /cgi-bin/login.cgi?ssid={{base64('admin:Atlona')}} HTTP/1.1
        Host: {{Hostname}}
        Authorization: Basic undefined
        X-Requested-With: XMLHttpRequest
        Accept: application/json, text/javascript, */*; q=0.01
        Content-Type: application/json
        Cookie: SSID=

    matchers:
      - type: dsl
        dsl:
          - 'contains(body, "Login Success!")'
          - 'contains(content_type, "application/json")'
          - 'status_code == 200'
        condition: and
