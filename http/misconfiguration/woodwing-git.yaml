id: woodwing-git

info:
  name: WoodWing Studio Server Git 配置暴露
  author: pdteam
  severity: medium
  description: |-
    该模板用于核查 WoodWing Studio Server Git 配置暴露。目标公开了配置、日志、源码、数据库文件或示例信息页面，可能泄露本应仅限服务器内部访问的数据。模板访问 /Server/.git/config、/StudioServer/.git/config，并根据文件特征、配置字段、日志内容、源码目录或响应状态确认泄露。
  reference:
    - https://twitter.com/ynsmroztas/status/1680961398011047936
  metadata:
    max-request: 2
    shodan-query: http.title:"WoodWing Studio Server"
    fofa-query: title=="WoodWing Studio Server"
  tags: misconfig,woodwing,git,config,vuln
  impact: |-
    - 攻击者可获取密钥、令牌、数据库连接信息、源码结构、内部路径、历史日志或业务配置。
    - 泄露内容可能被用于凭据复用、供应链漏洞匹配、权限提升或进一步攻击。
  remediation: |-
    - 将配置、日志、源码仓库和数据库文件移出 Web 可访问目录。
    - 在 Web 服务器和对象存储层添加拒绝规则，阻断敏感扩展名和内部目录访问。
    - 轮换可能泄露的密钥、令牌和账号凭据，并排查访问日志。
http:
  - method: GET
    path:
      - "{{BaseURL}}/Server/.git/config"
      - "{{BaseURL}}/StudioServer/.git/config"

    stop-at-first-match: true
    matchers:
      - type: dsl
        dsl:
          - "!contains_all(tolower(body), '<html', '<body')"
          - "contains_all(tolower(body), '[credentials]', '[core]')"
          - "status_code == 200"
        condition: and

    extractors:
      - type: regex
        group: 1
        regex:
          - "url ?= ?https?://(.*:.*)@"
          - "AUTHORIZATION: basic (.*)"
          - "pass = (.*)"
