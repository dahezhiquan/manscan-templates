id: xui-default-login

info:
  name: X-UI 默认口令登录（弱口令）
  author: dali
  severity: high
  description: |
    该模板用于检测 X-UI 是否仍可使用默认凭据或弱口令登录。模板先访问 `/login`，再向同一路径提交内置默认凭据组合，并根据 JSON 响应中的登录成功标记和 `msg` 字段判断认证是否成功；命中说明目标未及时修改出厂或初始化账号口令。
  impact: |
    - 攻击者可进入 X-UI 管理后台，查看或修改代理节点、入站配置、用户流量和面板运行参数。
    - 面板被接管后，可能导致代理服务被滥用、业务流量暴露、配置被篡改，或成为进一步访问内网资源的入口。
  remediation: |
    - 立即修改默认管理员账号和密码，删除不再使用的面板账号。
    - 将 X-UI 管理入口限制在可信管理网段或 VPN 后方，避免直接暴露到公网。
    - 审计近期登录记录、节点配置和用户变更，必要时轮换相关连接密钥和证书。
  reference:
    - https://github.com/vaxilu/x-ui
    - https://seakfind.github.io/2021/10/10/X-UI/#:~:text=By%20default%2C%20the%20login%20user,the%20password%20is%20also%20admin%20.
  classification:
    cwe-id: CWE-798
    cpe: cpe:2.3:a:vaxilu:x-ui:*:*:*:*:*:*:*:*
  metadata:
    verified: true
    max-request: 2
    fofa-query: title="X-UI Login"
    shodan-query: title:"X-UI Login"
    product: x-ui
    vendor: vaxilu
  tags: x-ui,default-login,vuln

http:
  - method: GET
    path:
      - "{{BaseURL}}/login"

  - method: POST
    path:
      - "{{BaseURL}}/login"

    headers:
      content-type: application/x-www-form-urlencoded

    body: "username={{username}}&password={{password}}"

    attack: pitchfork
    payloads:
      username:
        - "admin"
      password:
        - "admin"

    matchers-condition: and
    matchers:
      - type: dsl
        dsl:
          - '!contains(http_1_body, "\"success\":true")'
          - 'contains_all(http_2_body, "\"success\":true", "msg\":")'
          - "contains(http_2_header, 'application/json')"
          - "http_2_status_code == 200"
        condition: and
