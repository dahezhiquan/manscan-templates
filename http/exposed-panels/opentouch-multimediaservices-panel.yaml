id: opentouch-multimediaservices-panel

info:
  name: OpenTouch Multimedia Services 识别（指纹识别）
  author: righettod
  severity: info
  description: |-
    检测到目标站点存在 OpenTouch Multimedia Services 相关响应特征。OpenTouch Multimedia Services 是 AI、机器学习或 Notebook 相关平台，用于管理模型、数据集、工作区、实验、推理服务或训练任务。模板请求 `/authenticationform/login`、`/authenticationform/jsp/logonWeb.jsp` 路径，并通过页面标题或正文关键字、状态码确认该系统指纹，用于资产识别、系统盘点和暴露面梳理。
  reference:
    - https://www.al-enterprise.com/-/media/assets/internet/documents/opentouch-multimedia-services-datasheet-en.pdf
  metadata:
    verified: true
    max-request: 2
  tags: panel,opentouch,login,detect,discovery
http:
  - method: GET
    path:
      - "{{BaseURL}}/authenticationform/login"
      - "{{BaseURL}}/authenticationform/jsp/logonWeb.jsp"

    stop-at-first-match: true

    matchers-condition: and
    matchers:
      - type: word
        part: body
        words:
          - 'OpenTouch'
          - 'Multimedia Services'
          - 'Alcatel-Lucent'
        condition: and
        case-insensitive: true

      - type: status
        status:
          - 200

    extractors:
      - type: regex
        part: body
        group: 1
        regex:
          - '(?i)Version\s+([0-9.-]+)'
