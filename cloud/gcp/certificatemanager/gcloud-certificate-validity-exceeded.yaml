id: gcloud-certificate-validity-exceeded

info:
  name: Exceeded SSL 证书 Validity Period（云安全）
  author: princechaddha
  severity: medium
  description: 公共 TLS 证书有效期过长会增加密钥泄露后的暴露窗口，也可能不符合当前证书生态的有效期要求。本模板枚举 Certificate Manager 证书，比较 createTime 与 expireTime，超过约 398 天时报告证书有效期不合规。
  impact: |
    - 长有效期证书在私钥泄露或域名控制变更后会延长攻击窗口，增加中间人攻击和冒用风险。
    - 浏览器、客户端或合规基线可能拒绝或标记过长有效期证书，影响业务访问可信度。
  remediation: |
    - 将公共 TLS 证书有效期控制在当前行业要求范围内，优先使用 Google 管理证书或自动化签发续期流程。
    - 轮换有效期过长的证书，检查私钥保护、证书映射和负载均衡绑定是否同步更新。
  reference:
    - https://cloud.google.com/certificate-manager/docs
  metadata:
    vendor: google
    product: certificate-manager
  tags: cloud,devops,gcp,gcloud,certificate-manager,gcp-cloud-config

flow: |
  code(1)
  for(let projectId of iterate(template.projectIds)){
    set("projectId", projectId)
    code(2)
    for(let certificate of iterate(template.certificates)){
      set("certificateName", certificate)
      code(3)
    }
  }

self-contained: true

code:
  - engine:
      - sh
      - bash
    source: |
      gcloud projects list --format="json(projectId)"

    extractors:
      - type: json
        name: projectIds
        internal: true
        json:
          - '.[].projectId'

  - engine:
      - sh
      - bash
    source: |
      gcloud certificate-manager certificates list --project $projectId --format="json(name)"

    extractors:
      - type: json
        name: certificates
        internal: true
        json:
          - '.[].name'

  - engine:
      - sh
      - bash
    source: |
      gcloud certificate-manager certificates describe $certificateName --project $projectId --format="json(createTime,expireTime)" | jq '[(.expireTime | fromdateiso8601) - (.createTime | fromdateiso8601) < 34444800] | any'

    matchers:
      - type: word
        words:
          - 'false'

    extractors:
      - type: dsl
        dsl:
          - '"Non-compliant SSL Certificate: " + certificateName + " in Project: " + projectId + " with Expiry beyond 398 days"'
