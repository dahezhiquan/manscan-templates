id: ulanzi-clock

info:
  name: Ulanzi 时钟面板识别（IOT）
  author: fabaff
  severity: info
  description: |
    检测到 Ulanzi Clock 面板。该页面用于识别智能时钟设备的 Web 入口，暴露后可能泄露设备状态或配置入口。
  metadata:
    max-request: 1
  tags: panel,ulanzi,iot,discovery

http:
  - method: GET
    path:
      - '{{BaseURL}}'

    matchers-condition: and
    matchers:
      - type: word
        part: body
        words:
          - '<title>Ulanzi Clock</title>'

      - type: status
        status:
          - 200
