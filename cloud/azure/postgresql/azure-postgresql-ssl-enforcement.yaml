id: azure-postgresql-ssl-enforcement
info:
  name: Azure PostgreSQL 未强制使用 SSL 加密（云安全）
  author: princechaddha
  severity: high
  description: Azure PostgreSQL 未启用 sslEnforcement 时，客户端可能建立非 SSL 连接，数据库凭据和业务数据在传输过程中缺少机密性与完整性保护。本模板枚举 PostgreSQL 服务器并查询 sslEnforcement，仅当返回值为 Disabled 时报告。
  impact: |
    - 同一网络中的攻击者可能窃听数据库凭据、查询内容和返回数据，或通过中间人方式篡改通信。
    - 凭据被截获后，攻击者可能进一步读取、修改或删除数据库中的业务数据。
  remediation: |
    - 将 sslEnforcement 设置为 Enabled，并确认所有客户端使用 SSL/TLS 连接和有效的服务器证书校验。
    - 变更前检查旧客户端兼容性，逐步淘汰明文连接，并通过网络控制限制数据库的非必要访问来源。
  reference:
    - https://docs.microsoft.com/en-us/azure/postgresql/concepts-ssl-connection-security
  metadata:
    vendor: microsoft
    product: azure-postgresql
  tags: cloud,devops,azure,microsoft,postgresql,azure-cloud-config

flow: |
  code(1);
  for (let ServerData of iterate(template.serverList)) {
    ServerData = JSON.parse(ServerData);
    set("name", ServerData.Name);
    set("resourceGroup", ServerData.ResourceGroup);
    code(2);
  }

self-contained: true
code:
  - engine:
      - sh
      - bash
    source: |
      az postgres server list --output json --query '[*].{"Name":name,"ResourceGroup":resourceGroup}'

    extractors:
      - type: json
        name: serverList
        internal: true
        json:
          - '.[]'

  - engine:
      - sh
      - bash
    source: |
      az postgres server show --name "$name" --resource-group "$resourceGroup" --query sslEnforcement

    matchers:
      - type: word
        words:
          - '"Disabled"'

    extractors:
      - type: dsl
        dsl:
          - 'name + " in " + resourceGroup + " has SSL disabled"'
