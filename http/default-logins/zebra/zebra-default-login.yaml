id: zebra-default-login

info:
  name: Zebra 默认口令登录（弱口令）
  author: y0no
  severity: high
  description: |
    该模板用于检测 Zebra 设备是否仍可使用默认凭据或弱口令登录。模板向 `/authorize` 提交内置默认凭据组合，并根据页面返回的访问授权成功提示判断认证是否通过；命中说明设备管理口令仍保持出厂或弱口令状态。
  impact: |
    - 攻击者可接管 Zebra 设备的 Web 管理界面，查看设备状态、网络配置、打印任务或运行参数。
    - 打印或终端设备被未授权控制后，可能导致业务中断、配置被篡改、敏感打印信息泄露，或作为内网立足点继续探测。
  remediation: |
    - 立即修改所有默认账号口令，禁用不再使用的出厂账号。
    - 将设备管理入口限制在可信管理网段内，避免暴露到公网或普通办公网段。
    - 升级设备固件，审计近期登录、配置变更和异常打印/管理操作。
  metadata:
    verified: true
    max-request: 4
    shodan-query: title:"Zebra"
  tags: zebra,default-login,misconfig,printer,intrusive,vuln

http:
  - raw:
      - |
        POST /authorize HTTP/1.1
        Host: {{Hostname}}
        Content-Type: application/x-www-form-urlencoded

        0={{username}}&1={{password}}

    attack: pitchfork
    payloads:
      username:
        - 1234
        - admin
      password:
        - ''
        - 1234

    matchers-condition: and
    matchers:
      - type: word
        part: body
        words:
          - ">Access Granted. This IP Address now"

      - type: status
        status:
          - 200
