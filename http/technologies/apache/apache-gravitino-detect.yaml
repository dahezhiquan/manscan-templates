id: apache-gravitino-detect

info:
  name: Apache Gravitino 指纹识别（指纹识别）
  author: icarot
  severity: info
  description: |-
    Apache Gravitino 是数据目录和元数据管理平台，用于统一管理多源数据资产、表和权限。该模板请求 `/ui/metalakes`，并依据 HTTP 200 状态码、页面标题、正文关键字或品牌资源特征识别目标是否使用或暴露了 Apache Gravitino 相关组件，适用于资产盘点、技术栈识别和后续安全评估；命中结果仅表示指纹特征匹配，不代表已确认存在可利用漏洞。
  metadata:
    max-request: 1
    vendor: apache
    product: gravitino
    shodan-query: title:"Gravitino"
  tags: tech,gravitino,apache,detect,discovery

http:
  - method: GET
    path:
      - "{{BaseURL}}/ui/metalakes"

    matchers-condition: and
    matchers:
      - type: word
        words:
          - '<title>Gravitino'

      - type: status
        status:
          - 200
