id: wix-takeover

info:
  name: Wix 已删除账号域名接管检测（子域名接管）
  author: harshinsecurity,philippedelteil,zy9ard3
  severity: high
  description: 检测 Wix 返回 ConnectYourDomain 错误页的边界场景，通常仅在原账号已删除且域名仍指向 Wix 时可能触发接管，实际验证可能需要付费高级账号完成重新绑定。
  reference:
    - https://github.com/EdOverflow/can-i-take-over-xyz/issues/231
  metadata:
    max-request: 1
  tags: takeover,wix,vuln

http:
  - method: GET
    path:
      - "{{BaseURL}}"

    matchers-condition: and
    matchers:
      - type: dsl
        dsl:
          - Host != ip

      - type: word
        words:
          - 'ConnectYourDomain Error | Wix.com'

      - type: status
        status:
          - 404

      - type: dsl
        dsl:
          - '!contains(host,".wix.com")'
          - '!contains(host,".wixdns.net")'
        condition: or

    extractors:
      - type: dsl
        dsl:
          - cname
