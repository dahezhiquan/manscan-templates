id: azure-postgres-connection-throttling-disabled
info:
  name: Azure PostgreSQL 连接限流未启用（云安全）
  author: princechaddha
  severity: medium
  description: Azure PostgreSQL 的 connection_throttling 参数用于在连接尝试过于频繁时限制连接建立，关闭该控制会削弱数据库对连接洪泛和异常认证尝试的抑制能力。本模板枚举 PostgreSQL 服务器并查询 connection_throttling 配置，在返回值为 off 时报告。
  impact: |
    - 攻击者可以更高频率地发起连接和认证尝试，增加口令猜测、凭据验证和连接资源耗尽的风险。
    - 在连接数或计算资源紧张时，异常连接流量可能影响正常业务连接，造成数据库性能下降或服务不可用。
  remediation: |
    - 将 connection_throttling 设置为 on，并在变更后验证应用连接池和业务峰值下的兼容性。
    - 同时通过网络访问控制、强密码或身份认证策略和监控告警限制异常来源，避免仅依赖参数限流。
  reference:
    - https://docs.microsoft.com/en-us/azure/postgresql/concepts-server-parameters
  metadata:
    vendor: microsoft
    product: azure-postgresql
  tags: cloud,devops,azure,microsoft,postgresql,azure-cloud-config

flow: |
  code(1);
  for (let ServerData of iterate(template.serverList)) {
    ServerData = JSON.parse(ServerData);
    set("name", ServerData.name);
    set("resourceGroup", ServerData.resourceGroup);
    code(2);
  }

self-contained: true
code:
  - engine:
      - sh
      - bash
    source: |
      az postgres server list --output json --query '[*].{"name":name,"resourceGroup":resourceGroup}'

    extractors:
      - type: json
        name: serverList
        internal: true
        json:
          - '.[]'

  - engine:
      - sh
      - bash
    source: |
      az postgres server configuration show --server-name "$name" --resource-group "$resourceGroup" --name connection_throttling --query 'value'

    matchers-condition: and
    matchers:
      - type: word
        words:
          - 'off'

    extractors:
      - type: dsl
        dsl:
          - 'name + " in " + resourceGroup + " has connection throttling disabled"'
