id: gcloud-publicly-accessible-storage-buckets

info:
  name: 检查 的公开可访问 Cloud Storage Buckets（云安全）
  author: princechaddha
  severity: high
  description: Cloud Storage bucket IAM policy 中包含 allUsers 或 allAuthenticatedUsers 会让匿名用户或任意已认证用户访问桶资源。本模板执行 gsutil iam get，并检查 bindings.members 是否包含公开主体。
  impact: |
    - 敏感对象可能被外部用户枚举、下载或滥用，造成数据泄露和合规事件。
    - 公开写入或管理权限还可能导致恶意内容上传、对象篡改或服务成本增加。
  remediation: |
    - 从 bucket IAM policy 中移除 allUsers 和 allAuthenticatedUsers，仅向明确主体授予最小权限。
    - 启用 Public Access Prevention，并使用统一桶级访问减少 ACL 与 IAM 混用风险。
  reference:
    - https://cloud.google.com/storage/docs/access-control/iam
  metadata:
    vendor: google
    product: cloud-storage
  tags: cloud,devops,gcp,gcloud,google-cloud-storage,iam,security,public-access,gcp-cloud-config

flow: |
  code(1)
  for(let projectId of iterate(template.projectIds)){
    set("projectId", projectId)
    code(2)
    for(let bucketName of iterate(template.buckets)){
      set("bucketName", bucketName)
      code(3)
    }
  }

self-contained: true

code:
  - engine:
      - sh
      - bash
    source: |
      gcloud projects list --format="json(projectId)"

    extractors:
      - type: json
        name: projectIds
        internal: true
        json:
          - '.[].projectId'

  - engine:
      - sh
      - bash
    source: |
      gsutil ls -p $projectId | jq -R . | jq -s .

    extractors:
      - type: json
        name: buckets
        internal: true
        json:
          - '.[]'

  - engine:
      - sh
      - bash
    source: |
      gsutil iam get $bucketName --format=json | jq -r '.bindings[].members[]? // "null"'

    matchers:
      - type: word
        words:
          - 'allUsers'
          - 'allAuthenticatedUsers'
        condition: or

    extractors:
      - type: dsl
        dsl:
          - '"The bucket " + bucketName + " in project " + projectId + " is publicly accessible because it includes \"allUsers\" or \"allAuthenticatedUsers\" in its IAM policy."'
