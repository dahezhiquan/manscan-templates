id: x-backend-server-header-detect

info:
  name: X-Backend-Server 响应头暴露
  author: pussycat0x
  severity: low
  description: |-
    该模板用于核查 X-Backend-Server 响应头暴露。目标响应中返回 `X-Backend-Server` 等后端标识头，可能暴露内部主机名、后端节点或代理链路信息。模板访问 /en，并根据响应头中的 `X-Backend-Server` 字段确认暴露。
  remediation: |-
    - 在反向代理、网关或应用层移除不必要的后端标识响应头。
    - 避免在响应头中暴露内部主机名、环境名称和节点编号。
    - 对公网响应头进行基线检查，统一收敛调试和诊断字段。
  reference:
    - https://docs.gitlab.com/user/application_security/dast/browser/checks/16.4/
    - https://www.zaproxy.org/docs/alerts/10039/
  metadata:
    verified: true
    max-request: 1
    shodan-query: X-Backend-Server
  tags: headers,misconfig,exposure
  impact: |-
    - 攻击者可据此推断后端服务命名、负载均衡结构或内部节点信息。
    - 后端标识可能辅助定向探测、社工攻击或绕过代理层的后续攻击。
http:
  - method: GET
    path:
      - "{{BaseURL}}/en"

    matchers:
      - type: word
        part: header
        words:
          - "X-Backend-Server"

    extractors:
      - type: regex
        part: header
        name: hostname
        group: 1
        regex:
          - 'X-Backend-Server: ([A-Za-z0-9.-]+)'
