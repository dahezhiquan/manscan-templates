id: dell-idrac9-detect

info:
  name: Dell iDRAC9 指纹识别（指纹识别）
  author: kophjager007
  severity: info
  description: Dell iDRAC9 是 Dell 服务器带外管理控制器，用于硬件状态、远程控制台和电源管理。该模板请求 `/sysmgmt/2015/bmc/info`，并依据 HTTP 200 状态码、页面标题、正文关键字或品牌资源特征识别目标是否使用或暴露了 Dell iDRAC9 相关组件，适用于资产盘点、技术栈识别和后续安全评估；命中结果仅表示指纹特征匹配，不代表已确认存在可利用漏洞。
  metadata:
    max-request: 1
  tags: tech,dell,discovery

http:
  - method: GET
    path:
      - "{{BaseURL}}/sysmgmt/2015/bmc/info" # Firmware Version and other info (iDRAC9)

    matchers-condition: and
    matchers:
      - type: status
        status:
          - 200

      - type: word
        words:
          - "BuildVersion"
          - "SystemModelName"

    extractors:
      - type: regex
        part: body
        regex:
          - '[0-9]{2}G'

      - type: regex
        part: body
        group: 1
        regex:
          - '"FwVer" *: *"([^"]+)"'
