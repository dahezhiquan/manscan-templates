id: ibm-advanced-system-management

info:
  name: IBM Advanced System Management 面板识别（暴露面识别）
  author: dhiyaneshDK,righettod
  severity: info
  description: 该模板通过识别 IBM Advanced System Management 面板、控制台或管理界面的页面特征，判断目标是否暴露了对应服务入口。若命中，说明该后台或运维界面对外可访问，可用于资产识别与暴露面排查。
  reference:
    - https://www.ibm.com/docs/en/power8/9080-MME?topic=operations-advanced-system-management
  classification:
    cvss-metrics: CVSS:3.0/AV:N/AC:L/PR:N/UI:N/S:U/C:N/I:N/A:N
    cwe-id: CWE-200
  metadata:
    max-request: 2
    verified: true
    shodan-query: title:"Advanced System Management"
    fofa-query: title="Advanced System Management"
  tags: panel,ibm,login,detect,discovery

http:
  - method: GET
    path:
      - '{{BaseURL}}/cgi-bin/cgi?form=1'
      - '{{BaseURL}}/cgi-bin/cgi'

    stop-at-first-match: true
    matchers-condition: and
    matchers:
      - type: word
        part: body
        words:
          - 'Advanced System Management'

      - type: status
        status:
          - 200

    extractors:
      - type: regex
        part: body
        group: 1
        regex:
          - '(?i)Update\s+Access\s+Key\s+Exp\s+Date\s+\(YYYY-MM-DD\):\s+([0-9\-]+)'
