id: windows-system-restore-not-configured

info:
  name: 系统还原未配置（本地基线扫描）
  author: princechaddha
  severity: medium
  description: |
    该模板检查 System Restore 是否未配置。缺少还原点会降低错误变更或感染后的恢复能力。
  impact: |
    系统故障或恶意修改后可能需要更高成本恢复，影响业务连续性。
  remediation: |
    按基线启用并配置系统还原，确保关键变更前生成还原点。
  tags: windows,code,windows-audit

self-contained: true

code:
  - pre-condition: |
      IsWindows();
    engine:
      - powershell
      - powershell.exe
    args:
      - -ExecutionPolicy
      - Bypass
    pattern: "*.ps1"
    source: |
      $restorePoints = Get-ComputerRestorePoint -ErrorAction SilentlyContinue; if ($null -eq $restorePoints) { Write-Output "SystemRestoreUnavailable" }

    matchers:
      - type: word
        words:
          - "SystemRestoreUnavailable"
