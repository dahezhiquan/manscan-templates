id: gcloud-object-encryption-cmk-not-enabled

info:
  name: Enable Object 加密 使用Customer-Managed Keys 的Cloud Storage Buckets（云安全）
  author: princechaddha
  severity: high
  description: Cloud Storage bucket 未配置默认客户管理密钥时，新对象会使用 Google 默认加密，组织无法自行控制密钥生命周期。本模板执行 gsutil kms encryption，返回 no default encryption key 时报告 bucket 未使用 CMK/CMEK。
  impact: |
    - 组织无法对对象加密密钥执行自主轮换、禁用、销毁和访问审计。
    - 对敏感数据或强监管场景，缺少 CMEK 可能不满足密钥托管和合规要求。
  remediation: |
    - 为 bucket 配置默认 Cloud KMS key，并授予 Cloud Storage 服务代理使用该密钥的权限。
    - 建立密钥轮换、禁用影响评估和对象写入验证流程。
  reference:
    - https://cloud.google.com/storage/docs/encryption/customer-managed-keys
  metadata:
    vendor: google
    product: cloud-storage
  tags: cloud,devops,gcp,gcloud,google-cloud-storage,encryption,cmk,security,gcp-cloud-config

flow: |
  code(1)
  for(let projectId of iterate(template.projectIds)){
    set("projectId", projectId)
    code(2)
    for(let bucketName of iterate(template.buckets)){
      set("bucketName", bucketName)
      code(3)
    }
  }

self-contained: true

code:
  - engine:
      - sh
      - bash
    source: |
      gcloud projects list --format="json(projectId)"

    extractors:
      - type: json
        name: projectIds
        internal: true
        json:
          - '.[].projectId'

  - engine:
      - sh
      - bash
    source: |
      gsutil ls -p $projectId | jq -R . | jq -s .

    extractors:
      - type: json
        name: buckets
        internal: true
        json:
          - '.[]'

  - engine:
      - sh
      - bash
    source: |
      gsutil kms encryption $bucketName

    matchers:
      - type: word
        part: body
        words:
          - "no default encryption key"

    extractors:
      - type: dsl
        dsl:
          - '"The bucket " + bucketName + " in project " + projectId + " is not encrypted using a Customer-Managed Key (CMK)."'
