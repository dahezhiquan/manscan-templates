id: travis-ci-disclosure

info:
  name: Travis CI 泄露（暴露面识别）
  author: DhiyaneshDK,AmirHossein Raeisi
  severity: high
  description: |
    检测到对外可访问的 Travis CI。相关文件可能泄露项目结构、依赖关系、部署细节、敏感参数或其他不应公开的内部信息。
  remediation: |
    - 将相关文件或接口移出 Web 根目录，或通过鉴权与访问控制限制访问。
    - 清理已暴露内容中的敏感信息，并评估是否需要轮换关联凭据。
    - 检查部署、备份与静态资源发布流程，防止同类资源再次被公开访问。
  reference:
    - https://github.com/maurosoria/dirsearch/blob/master/db/dicc.txt
    - https://arstechnica.com/information-technology/2021/09/travis-ci-flaw-exposed-secrets-for-thousands-of-open-source-projects/
    - https://www.tenable.com/plugins/was/113156
  metadata:
    verified: true
    max-request: 2
    shodan-query: html:"travis.yml"
  tags: exposure,file,config,tenable,vuln

http:
  - method: GET
    path:
      - '{{BaseURL}}/.travis.yml'
      - '{{BaseURL}}/matomo/.travis.yml'
      - '{{BaseURL}}/ckeditor/.travis.yml'

    stop-at-first-match: true

    matchers-condition: and
    matchers:
      - type: word
        part: body
        words:
          - 'before_script:'
          - 'jobs:'
          - 'language:'
        condition: and

      - type: word
        part: header
        words:
          - "application/octet-stream"

      - type: status
        status:
          - 200
