id: nodejs-framework-exceptions

info:
  name: Node.js 框架异常日志检测（本地文件安全扫描）
  author: Aayush Dhakal
  severity: low
  description: |
    Node.js 应用异常日志可能记录类型错误、认证失败、数据库错误或未处理请求，也可能反映攻击者正在探测接口、参数和后端组件。该模板扫描任意扩展名文件，并用正则匹配常见 Node.js、Express、MongoDB 和 Sequelize 异常名称；命中表示需要结合请求上下文复核的日志线索，不代表异常本身就是可利用漏洞。
  impact: |
    - 错误堆栈、数据库异常和内部组件名称可能泄露源码路径、数据模型、依赖版本或认证实现细节。
    - 持续异常可能伴随注入、越权、认证绕过或拒绝服务尝试，并掩盖真实的业务故障。
  remediation: |
    - 生产环境向客户端返回统一错误信息，禁止输出堆栈和数据库细节，并严格限制日志文件访问。
    - 按异常时间关联访问日志、认证日志和数据库审计记录，确认是否存在成功请求或数据读取。
    - 修复异常对应的输入校验、认证和数据库调用问题，对已暴露的令牌、连接串和凭据进行轮换。
  reference:
    - https://expressjs.com/en/guide/error-handling.html
    - https://nodejs.org/en/docs/guides
  tags: file,logs,nodejs

file:
  - extensions:
      - all

    extractors:
      - type: regex
        name: exception
        part: body
        regex:
          - 'TypeError'
          - 'ReferenceError'
          - 'SyntaxError'
          - 'ValidationError'
          - 'UnauthorizedError'
          - 'ForbiddenError'
          - 'NotFoundError'
          - 'InternalServerError'
          - 'BadRequestError'
          - 'MongoError'
          - 'SequelizeDatabaseError'
