id: snapdrop-detect

info:
  name: Snapdrop 面板识别（IOT）
  author: tess
  severity: medium
  description: |
    检测到 Snapdrop 面板。该服务用于局域网文件传输或共享，公开暴露可能暴露文件交换入口和相关服务信息。
  impact: |
    - 暴露的设备面板会泄露资产类型、产品型号、部署位置或管理入口，为后续弱口令和漏洞利用提供线索。
    - 若设备本身存在默认凭据或旧固件问题，攻击者可能进一步访问或控制设备。
  remediation: |
    - 确认该面板是否需要对当前网络开放；如无必要，应限制到内网、管理 VLAN 或 VPN。
    - 启用强认证，修改默认口令，并保持设备固件为受支持版本。
    - 对管理入口访问、登录失败和配置变更启用审计。
  metadata:
    verified: true
    max-request: 1
    shodan-query: http.title:"Snapdrop"
  tags: iot,snapdrop,discovery

http:
  - method: GET
    path:
      - '{{BaseURL}}'

    matchers-condition: and
    matchers:
      - type: word
        part: body
        words:
          - 'content="Snapdrop"'

      - type: status
        status:
          - 200
