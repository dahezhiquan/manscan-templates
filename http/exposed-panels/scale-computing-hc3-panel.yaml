id: scale-computing-hc3-panel

info:
  name: Scale Computing HC3 - 登录面板（暴露面识别）
  author: rxerium
  severity: info
  description: |-
    检测到 Scale Computing HC3 Web 管理登录面板。HC3 现已并入 SC//HyperCore 虚拟化套件，提供超融合计算、存储和虚拟化管理。
  reference:
    - https://www.scalecomputing.com/sc-platform
  metadata:
    max-request: 1
    shodan-query: http.title:"Scale System"
  tags: panel,scale-computing,hc3,hci,virtualization,login

http:
  - method: GET
    path:
      - "{{BaseURL}}"

    matchers-condition: and
    matchers:
      - type: word
        part: body
        words:
          - "<title>Scale System</title>"
          - "branding/favicons/"
        condition: and

      - type: status
        status:
          - 200
