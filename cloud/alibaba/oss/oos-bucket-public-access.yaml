id: oos-bucket-public-access

info:
  name: 阿里云 OSS Bucket 公开可访问（云安全）
  author: DhiyaneshDK
  severity: high
  description: OSS Bucket 配置 public-read 或 public-read-write 时，匿名用户可能直接读取对象，甚至在 public-read-write 情况下写入对象。模板枚举 Bucket 后执行 aliyun oss stat，当 ACL 不是 private 且包含 public-read 或 public-read-write 时判定 Bucket 公开可访问。
  impact: |
    - Bucket 中的文件、备份、配置或业务数据可能被匿名访问，造成敏感信息泄露。
    - 公开写入权限可能被用于上传恶意文件、污染业务内容或产生额外存储与流量成本。
  remediation: |
    - 将 Bucket ACL 调整为 private，并启用 OSS Block Public Access 阻止新增公共授权。
    - 复核 Bucket Policy、对象 ACL 和 RAM 授权，移除不必要的匿名访问规则。
  reference:
    - https://www.trendmicro.com/cloudoneconformity/knowledge-base/alibaba-cloud/AlibabaCloud-OSS/publicly-accessible-oss-bucket.html
    - https://www.alibabacloud.com/help/en/oss/user-guide/block-public-access
  metadata:
    max-request: 2
    verified: true
    vendor: alibaba
    product: oss
  tags: cloud,devops,aliyun,alibaba,aliyun-cloud-config,alibaba-oss

variables:
  region: "cn-hangzhou"

flow: |
  code(1)
  for (let BucketName of iterate(template.bucketname)) {
    set("bucket", BucketName)
    code(2)
  }

self-contained: true

code:
  - engine:
      - sh
      - bash

    source: |
      aliyun oss ls --region $region

    extractors:
      - type: regex
        name: bucketname
        internal: true
        regex:
          - 'oss://([a-zA-Z0-9-]+)'

  - engine:
      - sh
      - bash

    source: |
      aliyun oss stat $bucket --region $region

    matchers-condition: and
    matchers:
      - type: word
        words:
          - 'private'
        negative: true

      - type: word
        words:
          - 'public-read'
          - 'public-read-write'
        condition: or

    extractors:
      - type: dsl
        dsl:
          - 'bucket + " OSS Bucket is Public Accessible "'
