id: ntop-detect

info:
  name: ntop 指纹识别（指纹识别）
  author: pussycat0x
  severity: info
  description: >-
    ntop 是网络流量监控和可视化平台，用于分析主机、协议、连接和带宽使用情况。该模板通过请求目标服务并检查预设路径或首页响应、页面正文关键字、状态码等指纹特征，判断目标是否使用或暴露了
    ntop 相关组件；命中结果仅表示指纹特征匹配，可用于资产盘点、技术栈识别和后续安全评估，不代表已确认存在可利用漏洞。
  classification:
    cvss-metrics: CVSS:3.0/AV:N/AC:L/PR:N/UI:N/S:U/C:N/I:N/A:N
    cvss-score: 0
    cwe-id: CWE-200
    cpe: cpe:2.3:a:ntop:ntopng:*:*:*:*:*:*:*:*
  metadata:
    verified: true
    max-request: 1
    shodan-query: http.title:"welcome to ntop"
    product: ntopng
    vendor: ntop
  tags: tech,ntop,panel,discovery
http:
  - method: GET
    path:
      - '{{BaseURL}}'

    matchers-condition: and
    matchers:
      - type: word
        part: body
        words:
          - 'Welcome to ntop'

      - type: status
        status:
          - 200
