id: caimore-default-login

info:
  name: CAIMORE Gateway 默认口令登录检测（弱口令）
  author: pussycat0x
  severity: high
  description: |
    该模板通过尝试 CAIMORE Gateway Default Login 的默认账号口令，并依据认证成功后的响应特征判断目标是否仍在使用未修改的弱口令。若命中，攻击者可直接登录系统，进一步访问敏感信息、修改配置或执行未授权操作。
  metadata:
    verified: true
    max-request: 1
    fofa-query: app="CAIMORE-Gateway"
  tags: ciamore-gateway,default-login,vuln

http:
  - raw:
      - |
        GET /index.asp HTTP/1.1
        Host: {{Hostname}}
        Accept-Encoding: gzip, deflate
        Authorization: Basic {{base64(username + ':' + password)}}

    attack: pitchfork
    payloads:
      username:
        - admin
      password:
        - admin

    matchers-condition: and
    matchers:
      - type: word
        part: body
        words:
          - "AR9344_GATEWAY"

      - type: status
        status:
          - 200
