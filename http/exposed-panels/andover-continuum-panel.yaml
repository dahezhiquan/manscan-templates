id: andover-continuum-panel

info:
  name: Andover Continuum BMS - 登录面板（暴露面识别）
  author: rxerium
  severity: info
  description: |
    该模板通过识别 Andover Continuum BMS 登录入口的页面标题、特征文本或重定向行为，判断目标是否暴露了对应的认证界面。若命中，说明该登录面板对外可访问，可用于暴露面梳理与后续安全评估。
  reference:
    - https://www.carrier.com/
  metadata:
    max-request: 1
    verified: true
    vendor: Andover
    product: andover-continuum
    shodan-query: 'http.html:"Andover Continuum"'
  tags: panel,andover,continuum,ics,bms,discovery

http:
  - method: GET
    path:
      - "{{BaseURL}}"

    host-redirects: true
    max-redirects: 2

    matchers-condition: and
    matchers:
      - type: word
        part: body
        words:
          - 'Andover Continuum'
          - 'Andover Continuum Embedded WebServer'
        condition: and

      - type: status
        status:
          - 200
