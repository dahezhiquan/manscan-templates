id: winrm-basic-auth-enabled

info:
  name: WinRM Basic 认证已启用（本地基线扫描）
  author: princechaddha
  severity: high
  description: |
    Basic 认证在未加密通道上会暴露凭据。对应基线项为“WinRM 是否允许 Basic 认证”；模板读取 `WSMan:\localhost\Service\Auth` 配置，结合命中值判断 WinRM 策略是否过宽。
  impact: |
    - 攻击者可截获或重放凭据，获得远程管理访问。
    - 远程入口暴露或协议保护不足会增加暴力破解、中间人攻击和远程控制风险。
  remediation: |
    - 禁用 Basic 认证，改用 Kerberos、证书认证或其他安全机制。
    - 限制访问来源，优先使用加密和强认证，并关闭无业务需求的远程服务。
  tags: windows,winrm,code,windows-audit

self-contained: true

code:
  - pre-condition: |
      IsWindows();
    engine:
      - powershell
      - powershell.exe
    args:
      - -ExecutionPolicy
      - Bypass
    pattern: "*.ps1"
    source: |
      (Get-Item WSMan:\localhost\Service\Auth).Basic

    matchers:
      - type: word
        words:
          - "True"
