id: peplink-incontrol-panel

info:
  name: Peplink InControl - 登录面板（暴露面识别）
  author: rxerium
  severity: info
  description: |-
    Peplink InControl 是一款面向 Peplink 路由器和接入点的集中式云端 SD-WAN 与设备管理平台，支持对分散站点进行远程配置、监控以及 SpeedFusion VPN 管理。
  reference:
    - https://www.peplink.com/products/incontrol2/
  metadata:
    max-request: 1
    shodan-query: 'http.title:"Peplink InControl"'
  tags: panel,peplink,incontrol,sd-wan,vpn

http:
  - method: GET
    path:
      - "{{BaseURL}}"

    redirects: true
    max-redirects: 2
    matchers-condition: and
    matchers:
      - type: word
        words:
          - 'Peplink InControl'
        part: body

      - type: status
        status:
          - 200
