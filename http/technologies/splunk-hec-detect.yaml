id: splunk-hec-detect

info:
  name: Splunk HTTP Event Collector 指纹识别（指纹识别）
  author: idealphase
  severity: info
  description: >-
    Splunk HTTP Event Collector 是 Splunk 的 HTTP 数据接收接口，用于应用和服务直接发送事件数据。该模板通过请求目标服务并检查预设路径或首页响应、DSL
    条件等指纹特征，判断目标是否使用或暴露了 Splunk HTTP Event Collector 相关组件；命中结果仅表示指纹特征匹配，可用于资产盘点、技术栈识别和后续安全评估，不代表已确认存在可利用漏洞。
  reference:
  - https://dev.splunk.com/enterprise/docs/devtools/httpeventcollector/
  - https://community.splunk.com/t5/Getting-Data-In/How-to-check-if-an-HEC-is-up-or-not-before-posting-any-data-to/td-p/417404
  metadata:
    verified: true
    max-request: 1
  tags: tech,splunk,hec,detect,discovery
http:
  - method: GET
    path:
      - "{{BaseURL}}/services/collector/health"

    matchers:
      - type: dsl
        dsl:
          - 'status_code == 200'
          - 'contains_any(body, "text\":\"HEC is healthy\",\"code")'
          - 'contains(header, "application/json")'
        condition: and
