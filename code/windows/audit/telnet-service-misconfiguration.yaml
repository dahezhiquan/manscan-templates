id: telnet-service-misconfiguration

info:
  name: Telnet 服务配置不当（本地基线扫描）
  author: princechaddha
  severity: high
  description: |
    该模板检查 Telnet 服务是否存在不安全运行或配置。Telnet 明文传输且不适合作为远程管理入口。
  impact: |
    攻击者可窃听凭据或利用弱口令访问系统。
  remediation: |
    禁用 Telnet 服务，改用 SSH 或受控远程管理通道。
  tags: windows,telnet,service,misconfigured,code,windows-audit

self-contained: true

code:
  - pre-condition: |
      IsWindows();
    engine:
      - powershell.exe
    args:
      - -ExecutionPolicy
      - Bypass
    pattern: "*.ps1"
    source: |
      $service = Get-Service Telnet -ErrorAction SilentlyContinue;
      if ($service -and $service.Status -ne 'Running') { Write-Output 'Misconfigured' }

    matchers:
      - type: word
        words:
          - "Misconfigured"
