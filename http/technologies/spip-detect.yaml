id: spip-detect

info:
  name: SPIP 指纹识别（指纹识别）
  author: s4e-io
  severity: info
  description: |
    用于识别目标是否部署 SPIP 并提取相关版本或构建信息，模板会结合 HTTP 响应头、状态码、特定路径或已知端点和版本或标识提取结果进行指纹匹配。
  reference:
    - https://www.spip.net/
  metadata:
    max-request: 1
    vendor: spip
    product: spip
    fofa-query: app="SPIP"
  tags: spip,tech,detect,discovery

http:
  - method: GET
    path:
      - "{{BaseURL}}"

    matchers-condition: and
    matchers:
      - type: regex
        part: header
        regex:
          - 'Composed-By: SPIP'
          - 'X-Spip-Cache:'
        condition: or

      - type: status
        status:
          - 200

    extractors:
      - type: regex
        name: spip_version
        group: 1
        part: header
        regex:
          - 'Composed-By: SPIP ([0-9]{1,2}.[0-9]{1,2}.[0-9]{1,2}) @ www.spip.net'
