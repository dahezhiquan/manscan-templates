id: rasa-detect

info:
  name: Rasa Open Source - 检测（指纹识别）
  author: rxerium
  severity: info
  description: |-
    检测到 Rasa Open Source，一个用于构建聊天机器人和语音助手的开源对话式 AI 框架，它暴露了一个用于意图解析和 Webhook 驱动对话的 REST 服务器（默认端口 5005）。暴露的未认证实例可能允许与助手的对话端点交互，并泄露内部版本和配置信息。
  reference:
    - https://github.com/RasaHQ/rasa
    - https://rasa.com/docs/rasa/
  metadata:
    verified: true
    max-request: 1
    vendor: rasa
    product: rasa
    shodan-query: 'html:"Hello from Rasa"'
  tags: tech,rasa,ai,chatbot,detect,discovery

http:
  - method: GET
    path:
      - "{{BaseURL}}/version"

    matchers-condition: and
    matchers:
      - type: word
        part: body
        words:
          - '"minimum_compatible_version"'

      - type: status
        status:
          - 200

    extractors:
      - type: regex
        part: body
        group: 1
        regex:
          - '"version"\s*:\s*"([0-9a-zA-Z\.\-]+)"'
