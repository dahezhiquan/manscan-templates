id: stirling-pdf-detect

info:
  name: Stirling PDF 指纹识别（指纹识别）
  author: s4e-io
  severity: info
  description: >-
    Stirling PDF 是自托管 PDF 工具平台，用于合并、拆分、转换、压缩和处理 PDF 文件。该模板通过请求目标服务并检查预设路径或首页响应、页面正文关键字、状态码等指纹特征，判断目标是否使用或暴露了
    Stirling PDF 相关组件；命中结果仅表示指纹特征匹配，可用于资产盘点、技术栈识别和后续安全评估，不代表已确认存在可利用漏洞。
  reference:
  - https://github.com/Stirling-Tools/Stirling-PDF
  metadata:
    verified: true
    max-request: 1
    fofa-query: icon_hash="245183385"
  tags: tech,stirling-pdf,discovery
http:
  - method: GET
    path:
      - "{{BaseURL}}"

    matchers-condition: and
    matchers:
      - type: word
        part: body
        words:
          - '<title>Stirling PDF'
          - '<title>Stirling-PDF'
          - 'content="Stirling PDF'
          - 'window.stirlingPDF'
        condition: or

      - type: status
        status:
          - 200
