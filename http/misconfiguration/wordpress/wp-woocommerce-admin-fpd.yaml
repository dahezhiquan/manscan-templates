id: wp-woocommerce-admin-fpd

info:
  name: WordPress Plugin WooCommerce Admin (woocommerce admin) 完整路径泄露
  author: DhiyaneshDk
  severity: low
  description: |
    检测到 WordPress Plugin WooCommerce Admin (woocommerce admin) 完整路径泄露。目标暴露了调试、错误或堆栈信息，可能泄露应用路径、框架版本、环境变量、源码位置或内部调用细节。
  reference:
    - https://wordpress.org/plugins/woocommerce-admin/
  metadata:
    max-request: 1
    verified: false
    shodan-query: html:"/plugins/woocommerce-admin"
  tags: debug,wordpress,fpd,woocommerce-admin,wp-plugin

http:
  - method: GET
    path:
      - "{{BaseURL}}/wp-content/plugins/woocommerce-admin/src/Loader.php"

    matchers:
      - type: dsl
        dsl:
          - 'status_code == 200'
          - 'contains(body, "/woocommerce-admin/src/")'
          - 'contains_all(body, "Fatal error", "Uncaught Error:")'
        condition: and
