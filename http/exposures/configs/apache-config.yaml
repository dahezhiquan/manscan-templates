id: apache-config

info:
  name: Apache 配置文件检测（暴露面识别）
  author: sheikhrishad
  severity: medium
  description: 检测到对外可访问的 Apache 配置文件。这类配置资源可能包含部署细节、访问凭据、内部地址、组件版本或调试开关，公开暴露后会显著增加被侦察和后续利用的风险。
  remediation: |
    - 将相关文件或接口移出 Web 根目录，或通过鉴权与访问控制限制访问。
    - 清理已暴露内容中的敏感信息，并评估是否需要轮换关联凭据。
    - 检查部署、备份与静态资源发布流程，防止同类资源再次被公开访问。
  reference:
    - https://httpd.apache.org/docs/2.4/configuring.html
  classification:
    cvss-metrics: CVSS:3.1/AV:N/AC:L/PR:N/UI:N/S:U/C:L/I:N/A:N
    cvss-score: 5.3
    cwe-id: CWE-200
  metadata:
    max-request: 1
  tags: config,exposure,apache,vuln

http:
  - method: GET
    path:
      - "{{BaseURL}}/apache.conf"

    matchers:
      - type: dsl
        dsl:
          - "contains(body, '<Directory') && contains(body, '</Directory>') && status_code == 200"
          - "contains(body, '<VirtualHost') && contains(body, '</VirtualHost>') && status_code == 200"
        condition: or
