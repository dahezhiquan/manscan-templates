id: ultimatemember-open-redirect

info:
  name: WordPress Ultimate Member <2.1.7 - 开放重定向漏洞
  author: 0x_Akoko
  severity: medium
  description: WordPress Ultimate Member <2.1.7 - 开放重定向 存在开放重定向漏洞。攻击者可构造恶意跳转链接诱导用户访问钓鱼站点，或配合其他业务流程绕过安全校验。
  remediation: |
    - 按厂商公告升级到已修复版本；原始说明中提到的版本信息为：Fixed in 2。
    - 对跳转目标实施白名单校验，避免直接信任用户可控的 URL 参数。
    - 对登录、回调和重定向相关流程增加来源校验与业务约束。
  reference:
    - https://wpscan.com/vulnerability/97823f41-7614-420e-81b8-9e735e4c203f
  classification:
    cvss-metrics: CVSS:3.1/AV:N/AC:L/PR:N/UI:R/S:C/C:L/I:L/A:N
    cvss-score: 6.1
    cwe-id: CWE-601
  metadata:
    max-request: 1
  tags: wp-plugin,redirect,wordpress,wpscan,vuln

http:
  - method: GET
    path:
      - "{{BaseURL}}/register/?redirect_to=https://interact.sh/"

    matchers:
      - type: regex
        regex:
          - '(?m)^(?:Location\s*?:\s*?)(?:https?://|//)(?:[a-zA-Z0-9\-_\.@]*)interact\.sh.*$'
        part: header
