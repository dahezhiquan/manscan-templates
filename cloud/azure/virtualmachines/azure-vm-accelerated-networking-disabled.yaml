id: azure-vm-accelerated-networking-disabled
info:
  name: Azure VM 加速网络未启用（云安全）
  author: princechaddha
  severity: medium
  description: 该规则用于检查 Azure virtualmachines 相关安全控制、保护能力或合规配置是否处于未启用、缺失或未正确配置状态，以降低持续暴露风险并提升整体云安全基线。
  impact: |
    - 关键安全控制缺失会降低防护深度，使风险长期处于不可见或不可控状态。
    - 这类配置问题通常不会立即触发故障，但会显著增加后续入侵、横向移动或合规违规的概率。
  remediation: |
    - 按厂商最佳实践启用缺失的安全控制、保护功能或基线配置。
    - 将该类配置纳入持续巡检与自动化合规检查，避免后续资源再次以不安全默认值部署。
  reference:
    - https://docs.microsoft.com/en-us/azure/virtual-network/virtual-network-accelerated-networking-cli
  tags: cloud,devops,azure,microsoft,virtual-machines,azure-cloud-config

flow: |
  code(1);
  for(let InstanceDetails of iterate(template.vmIDs)) {
    set("vmId", InstanceDetails);
    code(2);
    for(let NicId of iterate(template.nicIDs)) {
      set("nicId", NicId);
      code(3);
    }
  }

self-contained: true
code:
  - engine:
      - sh
      - bash
    source: |
      az vm list --query '[*].id'

    extractors:
      - type: json
        name: vmIDs
        internal: true
        json:
          - '.[]'

  - engine:
      - sh
      - bash
    source: |
      az vm show --ids "$vmId" --query 'networkProfile.networkInterfaces[*].id'

    extractors:
      - type: json
        name: nicIDs
        internal: true
        json:
          - '.[]'

  - engine:
      - sh
      - bash
    source: |
      az network nic show --ids "$nicId" --query 'enableAcceleratedNetworking'

    matchers:
      - type: word
        words:
          - 'false'

    extractors:
      - type: dsl
        dsl:
          - 'vmId + " with NIC " + nicId + " has Accelerated Networking disabled"'
