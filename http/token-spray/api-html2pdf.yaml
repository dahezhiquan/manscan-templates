id: api-html2pdf

info:
  name: Html2PDF API Token 可用性校验（token喷洒）
  author: daffainfo
  severity: info
  description: 该模板通过调用 Html2PDF API 的已知接口验证提供的 token 是否有效，命中后通常表示可访问文档转换或 PDF 处理能力。
  reference:
    - https://html2pdf.app/documentation/
    - https://github.com/daffainfo/all-about-apikey/tree/main/html2pdf
  metadata:
    max-request: 1
  tags: token-spray,html2pdf

self-contained: true

http:
  - method: GET
    path:
      - "https://api.html2pdf.app/v1/generate?url=https://test.test&apiKey={{token}}"

    matchers:
      - type: word
        part: body
        words:
          - '"Provided url is not accessible"'
