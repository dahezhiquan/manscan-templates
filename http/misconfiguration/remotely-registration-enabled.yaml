id: remotely-registration-enabled

info:
  name: Remotely 注册已启用
  author: ritikchaddha
  severity: high
  description: |
    该模板用于核查 Remotely 注册已启用。该类问题通常源于公开注册、自助开户或默认初始化策略未按业务预期关闭。模板会向目标发送探测请求，并依据请求 `/Identity/Account/Register`、`/Account/Register`、匹配 `Create a new account.`、匹配 `Remotely`、状态码 200 等证据确认目标是否存在该配置问题。
  impact: |
    - 攻击者可自行创建账号进入系统，枚举内部功能、数据或协作空间。
    - 若新账号默认权限过高，可能进一步导致数据泄露、配置变更或平台滥用。
  remediation: |
    - 关闭不需要的公开注册和自助开户入口。
    - 对必须开放的注册流程增加审批、邮箱域限制、验证码和速率限制。
    - 审计近期新建账号、权限分配和异常登录行为。
  reference:
    - https://github.com/lucent-sea/Remotely
    - https://github.com/lucent-sea/Remotely/blob/master/README.md
  metadata:
    verified: true
    max-request: 2
    vendor: lucent-sea
    product: remotely
    framework: aspnetcore
    shodan-query: title:"Remotely"
  tags: remotely,registration,exposure,misconfig

http:
  - method: GET
    path:
      - '{{BaseURL}}/Identity/Account/Register'
      - '{{BaseURL}}/Account/Register'

    stop-at-first-match: true

    matchers-condition: and
    matchers:
      - type: word
        part: body
        words:
          - 'Create a new account.'
          - 'Remotely'
        condition: and

      - type: word
        part: body
        words:
          - 'Registration is disabled.'
        negative: true

      - type: status
        status:
          - 200
