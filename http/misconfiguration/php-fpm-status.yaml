id: php-fpm-status

info:
  name: PHP FPM 状态
  author: geeknik
  severity: low
  metadata:
    max-request: 1
  tags: config,misconfig,vuln

http:
  - method: GET
    path:
      - "{{BaseURL}}/status?full"

    matchers-condition: and
    matchers:
      - type: word
        words:
          - 'pool:'
          - 'process manager:'
          - 'start time:'
          - 'pid:'
        condition: and

      - type: status
        status:
          - 200
