id: spa-cart-installer

info:
  name: SPA Cart 安装向导
  author: pussycat0x
  severity: high
  description: |
    检测到 SPA Cart 安装向导。该页面属于安装、初始化或配置向导流程，若对外暴露，攻击者可能完成初始化、创建管理员账户或重新配置目标系统。
  reference:
    - https://spa-cart.com/
  classification:
    cpe: cpe:2.3:a:spa-cart:spa-cart:*:*:*:*:*:*:*:*
  metadata:
    max-request: 1
    vendor: spa-cart
    product: spa-cart
    fofa-query: title="SPA Cart Installation"
  tags: spa-cart,exposure,installer,misconfig,vuln

http:
  - method: GET
    path:
      - "{{BaseURL}}/install/"

    matchers-condition: and
    matchers:
      - type: word
        words:
          - "<title>SPA Cart Installation</title>"
          - "PHP Version"
        condition: and

      - type: status
        status:
          - 200
