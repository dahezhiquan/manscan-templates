id: dbgate-panel

info:
  name: DbGate Web Client Management 面板识别（暴露面识别）
  author: h0j3n
  severity: info
  description: |
    该模板通过识别 DbGate Web Client Management 面板、控制台或管理界面的页面特征，判断目标是否暴露了对应服务入口。若命中，说明该后台或运维界面对外可访问，可用于资产识别与暴露面排查。
  reference:
    - https://github.com/dbgate/dbgate
  classification:
    cwe-id: CWE-200
  metadata:
    max-request: 1
    shodan-query: http.favicon.hash:1198579728
  tags: panel,dbgate,oss,discovery

http:
  - method: GET
    path:
      - "{{BaseURL}}"

    matchers:
      - type: word
        part: body
        words:
          - "<title>DbGate</title>"
          - "starting_dbgate_zero"
          - "Loading DbGate App"
          - "DbGate - web based opensource database administration tool for MS SQL, MySQL, Postgre SQL"
        condition: or
