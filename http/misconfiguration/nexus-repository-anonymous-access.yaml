id: nexus-repository-anonymous-access

info:
  name: Nexus 仓库 Manager 匿名 访问 启用
  author: 0x_Akoko
  severity: medium
  description: |
    该模板用于核查 Nexus 仓库 Manager 匿名 访问 启用。该类问题通常源于管理端、API、控制台或服务接口缺少认证授权，导致未登录用户可直接访问敏感功能。模板会向目标发送探测请求，并依据请求 `/service/rest/v1/repositories`、匹配 `status_code == 200`、匹配 `contains_all(body, "\"name\"", "\"format\"", "\"type\"")`等证据确认目标是否存在该配置问题。
  impact: |
    - 攻击者可在未授权状态下查看系统状态、业务数据、任务信息或管理接口。
    - 若接口支持写操作，可能进一步导致配置篡改、服务接管、数据删除或横向移动。
  remediation: |
    - 为相关管理端和 API 启用认证授权，并按最小权限限制可访问功能。
    - 将管理接口限制在内网、VPN 或可信来源范围内，并开启访问审计。
    - 检查历史访问日志，确认是否存在未授权访问、批量枚举或异常操作。
  reference:
    - https://help.sonatype.com/en/anonymous-access.html
    - https://help.sonatype.com/en/access-control.html
  classification:
    cvss-metrics: CVSS:3.1/AV:N/AC:L/PR:N/UI:N/S:U/C:H/I:N/A:N
    cvss-score: 6.5
    cwe-id: CWE-276
  metadata:
    max-request: 1
    verified: true
    shodan-query: title:"Nexus Repository Manager"
    fofa-query: title="Nexus Repository Manager"
  tags: misconfig,nexus,sonatype,exposure,unauth

http:
  - method: GET
    path:
      - "{{BaseURL}}/service/rest/v1/repositories"

    matchers:
      - type: dsl
        dsl:
          - 'status_code == 200'
          - 'contains_all(body, "\"name\"", "\"format\"", "\"type\"")'
          - 'contains_any(body, "maven", "npm", "docker", "nuget", "pypi", "raw", "apt", "yum")'
        condition: and

    extractors:
      - type: json
        part: body
        json:
          - '.[].name'
