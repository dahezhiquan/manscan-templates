id: stirling-pdf-panel

info:
  name: Stirling PDF 面板识别（指纹识别）
  author: s4e-io
  severity: info
  description: |
    该模板通过识别 Stirling PDF 面板、控制台或管理界面的页面特征，判断目标是否暴露了对应服务入口。若命中，说明该后台或运维界面对外可访问，可用于资产识别与暴露面排查。
  reference:
    - https://github.com/Stirling-Tools/Stirling-PDF
  metadata:
    verified: true
    max-request: 1
    fofa-query: title="StirlingPDF"
  tags: panel,login,stirling-pdf,detect,discovery

http:
  - method: GET
    path:
      - "{{BaseURL}}"

    host-redirects: true
    max-redirects: 2
    matchers:
      - type: dsl
        dsl:
          - 'contains_any(body, "<title>StirlingPDF - Sign in", "content=\"StirlingPDF", "window.stirlingPDF")'
          - 'status_code == 200'
        condition: and
