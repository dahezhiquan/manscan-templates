id: ec2-unrestricted-telnet
info:
  name: EC2 安全组对公网开放 Telnet 端口（云安全）
  author: princechaddha
  severity: critical
  description: EC2 安全组对公网开放 Telnet 端口是一类高风险远程管理服务暴露问题，TCP 23 面向任意来源会允许明文登录尝试。Telnet 缺少传输加密，凭据和会话内容可能被窃听，不适合作为云主机管理入口。模板通过 `describe-security-groups` 筛选 23 端口且来源为 `0.0.0.0/0` 的入站规则，并输出命中的安全组 ID。
  impact: |
    - Telnet 凭据和命令内容可能被中间网络窃听，导致主机登录权限泄露。
    - 暴露 Telnet 服务容易遭受爆破和自动化攻击，成为主机接管入口。
  remediation: |
    - 移除面向公网的 23 端口入站规则，并禁用 Telnet 服务。
    - 使用 SSH、SSM Session Manager 或 VPN 等加密且可审计的远程管理方式。
  reference:
    - https://docs.aws.amazon.com/AWSEC2/latest/UserGuide/authorizing-access-to-an-instance.html
  metadata:
    vendor: amazon
    product: ec2
  tags: cloud,devops,aws,amazon,ec2,aws-cloud-config

variables:
  region: "us-east-1"

self-contained: true
code:
  - engine:
      - sh
      - bash
    source: |
      aws ec2 describe-security-groups --region $region --filters Name=ip-permission.from-port,Values=23 Name=ip-permission.to-port,Values=23 Name=ip-permission.cidr,Values='0.0.0.0/0' --output json --query 'SecurityGroups[*].GroupId'

    extractors:
      - type: json
        name: securitygroup
        internal: true
        json:
          - '.[]'

      - type: dsl
        dsl:
          - 'securitygroup + " security group(s) alows unrestricted access (0.0.0.0/0 or ::/0) on TCP port 23"'
