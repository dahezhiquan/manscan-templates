id: sap-dispatcher-detect

info:
  name: SAP Dispatcher 识别（指纹识别）
  author: pussycat0x
  severity: info
  description: |
    SAP Dispatcher 是 SAP NetWeaver 应用服务器的请求分发组件，用于协调客户端请求和工作进程。该模板连接 3200/TCP 并读取协议响应，通过匹配 `DPTMMSG` 等响应特征识别目标服务。
  metadata:
    verified: true
    shodan-query: "DPTMMSG"
  tags: network,tcp,sap,tech,discovery

tcp:
  - inputs:
      - data: "00000000"
        type: hex

    host:
      - "{{Hostname}}"

    port: 3200
    read-size: 1024

    matchers:
      - type: word
        part: raw
        words:
          - "DPTMMSG"
