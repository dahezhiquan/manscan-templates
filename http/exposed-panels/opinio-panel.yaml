id: opinio-panel

info:
  name: Opinio 登录面板识别（指纹识别）
  author: righettod
  severity: info
  description: 该模板通过识别 Opinio 登录入口的页面标题、特征文本或重定向行为，判断目标是否暴露了对应的认证界面。若命中，说明该登录面板对外可访问，可用于暴露面梳理与后续安全评估。
  reference:
    - https://www.objectplanet.com/opinio/
  metadata:
    verified: true
    max-request: 2
    shodan-query: http.title:"Opinio"
  tags: panel,opinio,login,detect,discovery

http:
  - method: GET
    path:
      - "{{BaseURL}}/admin/folder.do"
      - "{{BaseURL}}"

    host-redirects: true
    max-redirects: 2

    matchers:
      - type: dsl
        dsl:
          - 'status_code_2 == 200'
          - 'contains_any(body_2, "<title>Opinio", ">Opinio ")'
        condition: and

    extractors:
      - type: regex
        part: body_1
        group: 1
        regex:
          - 'Opinio\s+([0-9.]+)'
