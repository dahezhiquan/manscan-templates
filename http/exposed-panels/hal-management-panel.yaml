id: hal-management-panel

info:
  name: HAL Management Console 面板（暴露面识别）
  author: DhiyaneshDK
  severity: info
  description: |
    该模板通过识别 HAL Management Console 登录入口的页面标题、特征文本或重定向行为，判断目标是否暴露了对应的认证界面。若命中，说明该登录面板对外可访问，可用于暴露面梳理与后续安全评估。
  metadata:
    verified: true
    max-request: 1
    shodan-query: html:"HAL Management Console"
  tags: panel,login,hal,discovery

http:
  - method: GET
    path:
      - "{{BaseURL}}/console/index.html"

    matchers-condition: and
    matchers:
      - type: word
        part: body
        words:
          - "<title>HAL Management Console</title>"

      - type: status
        status:
          - 200
