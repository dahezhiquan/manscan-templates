id: merlin-c2-jarm

info:
  name: Merlin C2 JARM 识别（服务漏洞）
  author: pussycat0x
  severity: info
  description: |
    该模板通过 JARM TLS 指纹识别目标是否可能为 Merlin C2 相关命令控制基础设施。
  reference:
    - https://github.com/cedowens/C2-JARM
    - https://merlin-c2.readthedocs.io/en/latest/
  metadata:
    max-request: 1
  tags: jarm,network,c2,ir,osint,cti,merlin,tcp,vuln
tcp:
  - inputs:
      - data: 2E
        type: hex
    host:
      - "{{Hostname}}"
    matchers:
      - type: dsl
        dsl:
          - "jarm(Hostname) == '29d21b20d29d29d21c41d21b21b41d494e0df9532e75299f15ba73156cee38'"
