id: echo-detect

info:
  name: Echo 协议识别（指纹识别）
  author: pussycat0x
  severity: info
  description: |
    Echo 是早期 Internet 调试协议，服务端会将客户端发送的数据原样返回，通常用于连通性测试，现代生产环境中较少需要对外开放。该模板向 UDP 7 端口发送随机字符串，并要求响应中包含同一随机值，从而确认目标是否开放 Echo 回显协议。
  reference:
    - https://en.wikipedia.org/wiki/Echo_Protocol
  metadata:
    verified: true
    max-request: 1
    shodan-query: "port:7"
  tags: echo,network,js,udp,discovery,detect

javascript:
  - pre-condition: |
      isUDPPortOpen(Host,Port);
    code: |
      let packet = bytes.NewBuffer();
      const c = require("nuclei/net");
      const cmd = Payload
      packet.WriteString(cmd)
      let conn = c.Open('udp', `${Host}:${Port}`);
      conn.SendHex(packet.Hex());
      const result = conn.RecvString()
      result

    args:
      Host: "{{Host}}"
      Port: 7
      Payload: "{{randstr}}"

    matchers:
      - type: dsl
        dsl:
          - "success == true"
          - contains(response, "{{randstr}}")
        condition: and
