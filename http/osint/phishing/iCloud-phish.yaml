id: iCloud-phish

info:
  name: iCloud 仿冒钓鱼网站（钓鱼网站识别）
  author: rxerium
  severity: info
  description: |
    检测到疑似仿冒 iCloud 的钓鱼网站。模板在目标页面返回 200、页面内容命中 iCloud 的登录或账号页面特征，且当前主机不属于 icloud.com、apple.com 官方域名时触发，用于识别借用 iCloud 品牌页面诱导用户信任的仿冒站点。
  reference:
    - https://icloud.com
  metadata:
    max-request: 1
  tags: phishing,icloud,osint,discovery
http:
  - method: GET
    path:
      - "{{BaseURL}}"

    host-redirects: true
    max-redirects: 2

    matchers-condition: and
    matchers:
      - type: word
        words:
          - 'Log in to iCloud to access your photos, mail, notes, documents and more. Sign in with your Apple&nbsp;ID or create a new account to start using Apple services.'

      - type: status
        status:
          - 200

      - type: dsl
        dsl:
          - '!contains(host,"icloud.com")'
          - '!contains(host,"apple.com")'
        condition: and
