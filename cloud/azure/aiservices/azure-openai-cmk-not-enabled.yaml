id: azure-openai-cmk-not-enabled
info:
  name: Azure OpenAI 客户管理密钥加密未启用（云安全）
  author: princechaddha
  severity: high
  description: Azure OpenAI 资源未使用客户管理密钥（CMK）时，静态数据加密依赖平台管理密钥，组织无法完全控制密钥的生命周期、轮换和撤销策略。该模板先枚举 kind 为 OpenAI 的 Azure AI 服务账户，再查询 properties.encryption.keyVaultProperties.keyName；当返回 null 时判定未配置 CMK。
  impact: |
    - 未使用组织控制的密钥可能无法满足数据主权、密钥托管或行业合规要求。
    - 当密钥需要轮换、暂停或撤销时，缺少 CMK 控制会降低对数据访问边界和加密生命周期的管理能力。
  remediation: |
    - 为 Azure OpenAI 资源配置受控于组织 Key Vault 的客户管理密钥，并授予资源托管身份所需的最小密钥权限。
    - 为密钥启用软删除、清除保护和轮换监控，完成配置后重新检查加密属性及业务可用性。
  reference:
    - https://docs.microsoft.com/en-us/azure/cognitive-services/encryption-key-management
  metadata:
    vendor: microsoft
    product: azure-openai
  tags: cloud,devops,azure,microsoft,openai,azure-cloud-config,ai

flow: |
  code(1);
  for (let ServiceData of iterate(template.serviceList)) {
    ServiceData = JSON.parse(ServiceData);
    set("name", ServiceData.Name);
    set("resourceGroup", ServiceData.ResourceGroup);
    code(2);
  }

self-contained: true
code:
  - engine:
      - sh
      - bash
    source: |
      az cognitiveservices account list --output json --query '[?(kind=="OpenAI")].{"Name":name,"ResourceGroup":resourceGroup}'

    extractors:
      - type: json
        name: serviceList
        internal: true
        json:
          - '.[]'

  - engine:
      - sh
      - bash
    source: |
      az cognitiveservices account show --name "$name" --resource-group "$resourceGroup" --query '{"encryptionKey":properties.encryption.keyVaultProperties.keyName}'

    matchers-condition: and
    matchers:
      - type: word
        words:
          - 'encryptionKey'
          - 'null'
        condition: and

    extractors:
      - type: dsl
        dsl:
          - '"$name in $resourceGroup does not use CMK"'
