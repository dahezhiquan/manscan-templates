id: coinbase-phish

info:
  name: Coinbase 仿冒钓鱼网站（钓鱼网站识别）
  author: rxerium
  severity: info
  description: |
    检测到疑似仿冒 Coinbase 的钓鱼网站。模板在目标页面返回 200、页面内容命中 Coinbase 的登录或账号页面特征，且当前主机不属于 coinbase.com、coinbase.co 官方域名时触发，用于识别借用 Coinbase 品牌页面诱导用户信任的仿冒站点。
  reference:
    - https://coinbase.com
  metadata:
    max-request: 1
  tags: phishing,coinbase,crypto,osint,discovery
http:
  - method: GET
    path:
      - "{{BaseURL}}"

    host-redirects: true
    max-redirects: 2

    matchers-condition: and
    matchers:
      - type: word
        part: body
        words:
          - 'Coinbase - Buy and Sell Bitcoin, Ethereum, and more with trust'
          - '<title>Coinbase</title>'
          - 'Sign in to Coinbase'
          - 'Log in to Coinbase'
        condition: or

      - type: word
        part: body
        words:
          - 'password'
          - 'signin'
          - 'sign-in'
          - 'login'
          - 'log-in'
        condition: or

      - type: status
        status:
          - 200

      - type: dsl
        dsl:
          - '!contains(host,"coinbase.com")'
          - '!contains(host,"coinbase.co")'
