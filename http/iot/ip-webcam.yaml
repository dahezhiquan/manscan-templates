id: ip-webcam

info:
  name: IP Webcam 查看页面暴露（IOT）
  author: gy741
  severity: low
  description: |
    检测到暴露的 IP Webcam 查看页面。该模板通过页面内容特征识别可访问的摄像头界面，可能导致实时画面或设备信息被未授权查看。
  metadata:
    verified: true
    max-request: 1
    shodan-query: http.favicon.hash:-601917817
  tags: webcam,iot,detect,discovery

http:
  - method: GET
    path:
      - "{{BaseURL}}"

    matchers:
      - type: word
        part: body
        words:
          - '<title>IP Webcam</title>'
          - 'Pavel Khlebovich'
        condition: and
