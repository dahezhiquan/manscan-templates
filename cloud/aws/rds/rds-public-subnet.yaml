id: rds-public-subnet
info:
  name: RDS 实例位于公网路由子网（云安全）
  author: princechaddha
  severity: high
  description: RDS 实例所在子网若通过 0.0.0.0/0 路由到 Internet Gateway，数据库网络位置具备公网出入口暴露条件。该模板枚举实例子网，并检查关联路由表是否同时包含 igw- 和 0.0.0.0/0。
  impact: |
    - 即使数据库当前未公开访问，后续安全组或 PubliclyAccessible 配置变化也可能迅速造成公网暴露。
    - 数据库与公网路由共处会增加网络边界误配置和攻击面扩大风险。
  remediation: |
    - 将 RDS 实例迁移到没有 Internet Gateway 默认路由的私有子网。
    - 通过私有子网路由、NAT、VPN、Direct Connect 或堡垒机满足必要管理访问，并持续审计路由表变化。
  reference:
    - https://docs.aws.amazon.com/AmazonRDS/latest/UserGuide/USER_VPC.WorkingWithRDSInstanceinaVPC.html#USER_VPC.Subnets
  metadata:
    max-request: 3
    vendor: amazon
    product: rds
  tags: cloud,devops,aws,amazon,rds,aws-cloud-config
variables:
  region: "ap-northeast-1"

flow: |
  code(1)
  for(let DBInstances of iterate(template.instances)){
    set("db", DBInstances)
    code(2)
    for(let SubnetNames of iterate(template.subnets)){
      set("subnet", SubnetNames)
      code(3)
    }
  }

self-contained: true
code:
  - engine:
      - sh
      - bash
    source: |
      aws rds describe-db-instances --region $region --output json --query 'DBInstances[*].DBInstanceIdentifier'

    extractors:
      - type: json
        name: instances
        internal: true
        json:
          - '.[]'

  - engine:
      - sh
      - bash
    source: |
      aws rds describe-db-instances --region $region --db-instance-identifier $db --query 'DBInstances[*].DBSubnetGroup.Subnets[*].SubnetIdentifier[]'

    extractors:
      - type: json
        name: subnets
        internal: true
        json:
          - '.[]'

  - engine:
      - sh
      - bash
    source: |
      aws ec2 describe-route-tables --region $region --filters "Name=association.subnet-id,Values=$subnet" --query 'RouteTables[*].Routes[]'

    matchers:
      - type: word
        words:
          - 'igw-'
          - '0.0.0.0/0'

    extractors:
      - type: dsl
        dsl:
          - 'db + " RDS instance is setup within a public subnet"'
