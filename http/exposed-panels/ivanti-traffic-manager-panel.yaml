id: ivanti-traffic-manager-panel

info:
  name: Ivanti Traffic Manager 面板识别（指纹识别）
  author: rxerium
  severity: info
  description: |-
    检测到目标站点存在 Ivanti Traffic Manager 相关响应特征。Ivanti Traffic Manager 是应用交付与负载均衡平台，用于管理虚拟服务器、流量策略、TLS 和服务可用性。模板请求 `/apps/zxtm/login.cgi`，并通过页面标题或正文关键字、状态码确认该系统指纹，用于资产识别、系统盘点和暴露面梳理。
  reference:
    - https://www.ivanti.com/resources/v/doc/ivi/2528/2ef03e8ed03d
  metadata:
    verified: true
    max-request: 1
    shodan-query: http.html:"Login (Virtual Traffic Manager"
  tags: detect,traffic-manager,panel,login,discovery
http:
  - method: GET
    path:
      - "{{BaseURL}}/apps/zxtm/login.cgi"

    matchers-condition: and
    matchers:
      - type: word
        part: body
        words:
          - "Login (Virtual Traffic Manager"

      - type: status
        status:
          - 200
