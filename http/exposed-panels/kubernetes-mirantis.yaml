id: kubernetes-mirantis

info:
  name: Mirantis Kubernetes Engine 面板识别（暴露面识别）
  author: pussycat0x
  severity: info
  description: 该模板通过识别 Mirantis Kubernetes Engine 面板、控制台或管理界面的页面特征，判断目标是否暴露了对应服务入口。若命中，说明该后台或运维界面对外可访问，可用于资产识别与暴露面排查。
  classification:
    cvss-metrics: CVSS:3.1/AV:N/AC:L/PR:N/UI:N/S:U/C:N/I:N/A:N
    cwe-id: CWE-200
    cpe: cpe:2.3:a:mirantis:kubernetes_engine:*:*:*:*:*:*:*:*
  metadata:
    verified: true
    max-request: 1
    shodan-query: http.html:"Mirantis Kubernetes Engine"
    fofa-query: app="Mirantis-Kubernetes-Engine"
    product: kubernetes_engine
    vendor: mirantis
  tags: tech,kubernetes,devops,kube,k8s,panel,discovery

http:
  - method: GET
    path:
      - "{{BaseURL}}"

    matchers-condition: and
    matchers:
      - type: word
        part: body
        words:
          - "Mirantis Kubernetes Engine"

      - type: status
        status:
          - 200
