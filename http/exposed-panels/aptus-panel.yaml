id: aptus-panel

info:
  name: Aptus Login 面板识别（暴露面识别）
  author: princechaddha
  severity: info
  description: 该模板通过识别 Aptus Login 登录入口的页面标题、特征文本或重定向行为，判断目标是否暴露了对应的认证界面。若命中，说明该登录面板对外可访问，可用于暴露面梳理与后续安全评估。
  classification:
    cvss-metrics: CVSS:3.0/AV:N/AC:L/PR:N/UI:N/S:U/C:N/I:N/A:N
    cwe-id: CWE-200
    cpe: cpe:2.3:a:intelliantech:aptus:*:*:*:*:android:*:*:*
  metadata:
    max-request: 1
    shodan-query: http.title:"Aptus Login"
    product: aptus
    vendor: intelliantech
  tags: panel,aptus,discovery

http:
  - method: GET
    path:
      - "{{BaseURL}}"

    matchers-condition: and
    matchers:
      - type: word
        part: body
        words:
          - "<title>Aptus Login</title>"

      - type: status
        status:
          - 200
