id: xerver-ftp-detect
info:
  name: Xerver Free FTP 服务 识别（服务漏洞）
  author: pussycat0x
  severity: info
  description: |
    该模板通过 FTP Banner、响应特征或协商行为识别目标是否运行 Xerver Free 相关 FTP 服务实现。
  metadata:
    verified: true
    shodan-query: "Xerver Free FTP Server"
    max-request: 1
  tags: network,ftp,xerver,detect,tcp,discovery

tcp:
  - inputs:
      - data: 00000000
        type: hex

    host:
      - "{{Hostname}}"
    port: 21
    read-size: 1024

    matchers:
      - type: word
        words:
          - "Welcome to Xerver Free FTP Server"

    extractors:
      - type: regex
        group: 1
        name: version
        regex:
          - "Server ([0-9]+)"
