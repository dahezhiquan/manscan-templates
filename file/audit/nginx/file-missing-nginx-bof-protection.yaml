id: file-missing-nginx-bof-protection

info:
  name: Nginx 缓冲区保护配置缺失（本地文件安全扫描）
  author: pussycat0x
  severity: medium
  description: |
    该模板检查 Nginx 是否配置请求缓冲区限制。缺少限制可能增加超大请求、缓冲区滥用或资源消耗风险。
  reference:
    - https://wiki.devsecopsguides.com/docs/checklists/nginx/
    - https://nginx.org/en/docs/http/ngx_http_proxy_module.html
  metadata:
    verified: true
  tags: nginx,file,audit,hardening

file:
  - extensions:
      - conf

    matchers-condition: and
    matchers:
      - type: word
        words:
          - "http"
          - "events"
        condition: and

      - type: word
        words:
          - "proxy_buffer_size"
          - "proxy_buffers"
          - "proxy_busy_buffers_size"
        condition: and
        negative: true
