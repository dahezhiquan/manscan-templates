id: bluemind-panel

info:
  name: Bluemind 面板识别（暴露面识别）
  author: Tigibus
  severity: info
  description: |
    该模板通过识别 Bluemind 面板、控制台或管理界面的页面特征，判断目标是否暴露了对应服务入口。若命中，说明该后台或运维界面对外可访问，可用于资产识别与暴露面排查。
  reference:
    - https://bluemind.net/
  metadata:
    verified: true
    max-request: 1
    shodan-query: http.title:"Welcome to BlueMind"
  tags: bluemind,login,panel,detect,discovery

http:
  - method: GET
    path:
      - "{{BaseURL}}/login/native"

    matchers-condition: and
    matchers:
      - type: word
        part: body
        words:
          - 'alt="BlueMind"'
          - 'window.bmExtensions'
        condition: and

      - type: status
        status:
          - 200

    extractors:
      - type: regex
        group: 1
        part: body
        regex:
          - 'window\.applicationVersion = "([0-9.]+)";'
