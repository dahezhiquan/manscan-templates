id: ms-exchange-user-enum

info:
  name: Microsoft Exchange Autodiscover 用户枚举
  author: righettod
  severity: low
  description: |
    该模板用于核查 Microsoft Exchange Autodiscover 用户枚举。该类问题通常源于配置文件、备份文件、管理页面、服务状态或敏感资源被错误暴露到 Web 访问路径。模板会向目标发送探测请求，并依据请求 `/autodiscover/autodiscover.json?Email=`、状态码 302、匹配 `(?i)Email=([A-Za-z0-9@%.-_]+)`等证据确认目标是否存在该配置问题。
  impact: |
    - 攻击者可获取版本、路径、账号、密钥、令牌、配置或业务数据等敏感信息。
    - 泄露的信息可能被用于凭据攻击、漏洞匹配、权限提升或横向移动。
  remediation: |
    - 移除 Web 根目录下不应公开的配置、备份、日志和临时文件。
    - 为敏感页面和资源增加访问控制，并按最小暴露原则收敛公开路径。
    - 轮换已暴露的密钥、令牌和凭据，并审计异常下载或枚举行为。
  reference:
    - https://www.msxfaq.de/exchange/autodiscover/autodiscover_v2.htm
    - https://github.com/righettod/toolbox-pentest-web/blob/master/docs/4-HINTS_ARCHIVED.md#user-enumeration-techniques-for-microsoft-exchange
  classification:
    cpe: cpe:2.3:a:microsoft:exchange_server:*:*:*:*:*:*:*:*
  metadata:
    verified: true
    max-request: 1
    vendor: microsoft
    product: exchange_server
    shodan-query: http.title:outlook exchange
  tags: ms-exchange,microsoft,misconfig,enum,vuln

http:
  - method: GET
    path:
      - "{{BaseURL}}/autodiscover/autodiscover.json?Protocol=ActiveSync&Email={{rand_text_alpha(6)}}%40oast.pro&RedirectCount=1"

    matchers-condition: and
    matchers:
      - type: word
        part: header
        words:
          - "/autodiscover/autodiscover.json?Email="

      - type: status
        status:
          - 302

    extractors:
      - type: regex
        part: header
        group: 1
        regex:
          - '(?i)Email=([A-Za-z0-9@%.-_]+)'
