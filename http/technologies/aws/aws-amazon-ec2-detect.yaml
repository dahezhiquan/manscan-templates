id: aws-amazon-ec2-detect

info:
  name: Amazon EC2 服务器 指纹识别（指纹识别）
  author: ritikchaddha
  severity: info
  description: Amazon EC2 服务器 是 AWS 弹性计算服务，用于运行虚拟服务器实例和云上应用。该模板请求首页，并依据页面标题、正文关键字或品牌资源特征、响应头特征识别目标是否使用或暴露了 Amazon EC2 服务器 相关组件，适用于资产盘点、技术栈识别和后续安全评估；命中结果仅表示指纹特征匹配，不代表已确认存在可利用漏洞。
  metadata:
    verified: true
    max-request: 1
    shodan-query: "Server: EC2ws"
  tags: tech,aws,ec2,amazon,discovery

http:
  - method: GET
    path:
      - "{{BaseURL}}"

    matchers:
      - type: word
        part: header
        words:
          - "Server: EC2ws"
