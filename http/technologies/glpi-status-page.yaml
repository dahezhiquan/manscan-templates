id: glpi-status-page

info:
  name: GLPI 指纹识别（指纹识别）
  author: canberbamber
  severity: info
  description: >-
    GLPI 是 IT 资产管理和工单服务平台，状态页可反映其 Web 应用部署情况。该模板通过请求目标服务并检查预设路径或首页响应、页面正文关键字、状态码等指纹特征，判断目标是否使用或暴露了
    GLPI 相关组件；命中结果仅表示指纹特征匹配，可用于资产盘点、技术栈识别和后续安全评估，不代表已确认存在可利用漏洞。
  reference:
  - https://buildmedia.readthedocs.org/media/pdf/glpi-user-documentation/latest/glpi-user-documentation.pdf
  classification:
    cpe: cpe:2.3:a:glpi-project:glpi:*:*:*:*:*:*:*:*
  metadata:
    verified: true
    max-request: 1
    vendor: glpi-project
    product: glpi
    shodan-query: http.html:"glpi"
  tags: tech,status,glpi,discovery
http:
  - method: GET
    path:
      - "{{BaseURL}}/status.php"

    matchers-condition: and
    matchers:
      - type: word
        words:
          - "GLPI_DB_OK"
          - "GLPI_SESSION_DIR_OK"
          - "GLPI_OK"
        condition: or

      - type: status
        status:
          - 200
