id: cisco-ucm-detect

info:
  name: Cisco Unified Communications Manager 指纹识别（指纹识别）
  author: Morgan Robertson
  severity: info
  description: |-
    Cisco Unified Communications Manager 是 Cisco 统一通信管理平台，用于 IP 电话、语音、视频和协作服务配置。该模板请求 `/cucm-uds/version`，并依据 HTTP 200 状态码、页面标题、正文关键字或品牌资源特征识别目标是否使用或暴露了 Cisco Unified Communications Manager 相关组件，适用于资产盘点、技术栈识别和后续安全评估；命中结果仅表示指纹特征匹配，不代表已确认存在可利用漏洞。
  reference:
  - https://developer.cisco.com/site/user-data-services/develop-and-test/api-reference/#version
  metadata:
    verified: true
    product: unified_communications_manager
    vendor: cisco
    shodan-query: http.title:"Unified Communications Self Care Portal"
    fofa-query: title="Unified Communications Self Care Portal"
  tags: tech,detect,cisco,ucm

http:
  - method: GET
    path:
      - "{{BaseURL}}/cucm-uds/version"

    headers:
      Accept: application/xml

    matchers-condition: and
    matchers:
      - type: status
        status:
          - 200

      - type: word
        part: body
        words:
          - '<versionInformation'
          - '<version>'
        condition: and

    extractors:
      - type: xpath
        name: version
        xpath:
          - "/versionInformation/version"
