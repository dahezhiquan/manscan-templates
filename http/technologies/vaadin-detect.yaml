id: vaadin-detect

info:
  name: Vaadin 框架指纹识别（指纹识别）
  author: Shivam Kamboj
  severity: info
  description: 用于识别目标是否部署 Vaadin 框架 并提取相关版本或构建信息，模板会结合页面正文、特定路径或已知端点和版本或标识提取结果进行指纹匹配。
  reference:
    - https://vaadin.com/
  metadata:
    verified: true
    max-request: 1
    vendor: vaadin
    product: vaadin
    shodan-query: http.html:"/VAADIN/"
  tags: tech,discovery,vaadin,framework

http:
  - method: GET
    path:
      - "{{BaseURL}}"

    redirects: true

    matchers:
      - type: dsl
        dsl:
          - 'contains_any(tolower(body), "/vaadin/", "v-generated-body", "v-app-loading", "vaadinbootstrap", "vaadin.", "vaadindirect")'

    extractors:
      - type: regex
        part: body
        group: 1
        regex:
          - 'vaadinBootstrap\.js\?v=([0-9.]+)'
          - '"vaadinVersion":"([0-9.]+)"'
