id: pgsql-detect

info:
  name: PostgreSQL 服务指纹识别（指纹识别）
  author: dahezhiquan
  severity: info
  description: |
    默认连接 5432/TCP，通过完整错误消息中的异常协议号、源文件和处理函数识别 PostgreSQL；未命中时发送不包含用户名、数据库名或密码的启动包，校验错误响应的消息类型、长度和字段结构。不回应认证挑战、不尝试登录、不执行 SQL。当前探针不能可靠取得精确软件版本，版本保持为空，不将协议版本或错误行号推断出的范围作为软件版本。
  reference:
    - https://www.postgresql.org/docs/current/errcodes-appendix.html
    - https://www.postgresql.org/docs/current/client-authentication-problems.html
    - https://www.postgresql.org/docs/current/protocol-message-formats.html
    - https://github.com/nmap/nmap/blob/master/nmap-service-probes
  classification:
    cvss-metrics: CVSS:3.1/AV:N/AC:L/PR:N/UI:N/S:U/C:N/I:N/A:N
    cwe-id: CWE-200
  metadata:
    verified: true
    max-request: 2
    shodan-query: port:5432 product:"PostgreSQL"
    vendor: postgresql
    product: postgresql
  tags: network,postgresql,db,detect,tcp,discovery

flow: |
  tcp(1) || tcp(2);

tcp:
  - inputs:
      - data: ""
        type: hex

    host:
      - "{{Hostname}}"
    port: 5432
    read-all: true

    matchers:
      - type: dsl
        dsl:
          - "len(data) >= 9 && starts_with(hex_encode(data), '450000') && to_number(unpack('>I', substr(data, 1, 5))) == len(data) - 1"
          - 'regex("^S[^\\x00]+\\x00(?:VFATAL\\x00)?C0A000\\x00M[^\\x00]*65363\\.19778[^\\x00]*\\x00F(?:postmaster\\.c|backend_startup\\.c|\\.\\\\src\\\\backend\\\\(?:postmaster\\\\postmaster|tcop\\\\backend_startup)\\.c)\\x00L[0-9]+\\x00RProcessStartupPacket\\x00\\x00$", substr(data, 5))'
        condition: and

  - inputs:
      - data: "000000090003000000"
        type: hex

    host:
      - "{{Hostname}}"
    port: 5432
    read-all: true

    matchers:
      - type: dsl
        dsl:
          - "len(data) >= 9 && starts_with(hex_encode(data), '450000') && to_number(unpack('>I', substr(data, 1, 5))) == len(data) - 1"
          - 'regex("^S[^\\x00]+\\x00(?:V(?:FATAL|ERROR)\\x00)?C(?:28000|28P01|3D000|08P01|0A000|53300|57P03)\\x00M[^\\x00]+\\x00(?:[A-Z][^\\x00]*\\x00)*\\x00$", substr(data, 5))'
        condition: and
