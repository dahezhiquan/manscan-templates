id: ccm-detect

info:
  name: Clear-Com Core Configuration Manager 面板识别（暴露面识别）
  author: failOpen
  severity: low
  description: 该模板通过识别 Clear-Com Core Configuration Manager 面板、控制台或管理界面的页面特征，判断目标是否暴露了对应服务入口。若命中，说明该后台或运维界面对外可访问，可用于资产识别与暴露面排查。
  reference:
    - https://www.clearcom.com/DownloadCenter/manuals/FreeSpeakII_Online_Manual/UserGuide/Content/Base/CCM/CCM.htm
  classification:
    cvss-metrics: CVSS:3.0/AV:N/AC:L/PR:N/UI:N/S:U/C:L/I:N/A:N
    cvss-score: 3.7
    cwe-id: CWE-200
  metadata:
    verified: true
    max-request: 1
    shodan-query: http.html:"CCM - Authentication Failure"
  tags: panel,clearcom,ccm,discovery

http:
  - method: GET
    path:
      - "{{BaseURL}}"

    matchers-condition: and
    matchers:
      - type: word
        part: body
        words:
          - "CCM - Authentication Failure"

      - type: status
        status:
          - 401
