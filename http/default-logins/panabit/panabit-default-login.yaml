id: panabit-default-login

info:
  name: Panabit Gateway 默认口令登录（弱口令）
  author: pikpikcu,ritikchaddha
  severity: critical
  description: |
    该模板用于检测 Panabit Gateway 是否仍可使用默认凭据或弱口令登录。模板主要向 `/login/userverify.cgi` 等认证入口发送请求，使用内置默认凭据组合进行认证尝试，并根据响应中的 `<META HTTP-EQUIV=REFRESH CONTENT="0;URL=/index.htm">`、`urn:schemas-microsoft-com:vml` 等登录成功特征判断登录是否成功；命中说明目标未及时修改出厂、示例或初始化账号口令。
  impact: |
    - 攻击者可接管 Panabit Gateway 的 Web 管理界面，查看设备状态、网络配置、运行日志或敏感业务参数。
    - 被接管的网络、工控、打印、视频、存储或远程管理设备可能被用于中断业务、改变访问策略、窃取流量或作为内网横向移动入口。
  remediation: |
    - 立即修改所有默认账号口令，禁用不再使用的出厂账号，并为管理账户设置高强度唯一密码。
    - 将设备管理入口限制在 VPN、堡垒机或可信管理网段内，避免直接暴露到公网。
    - 升级设备固件或管理组件，审计近期登录记录、配置变更和异常会话。
  reference:
    - https://max.book118.com/html/2017/0623/117514590.shtm
    - https://en.panabit.com/wp-content/uploads/Panabit-Intelligent-Application-Gateway-04072020.pdf
    - https://topic.alibabacloud.com/a/panabit-monitoring-installation-tutorial_8_8_20054193.html
  classification:
    cvss-metrics: CVSS:3.1/AV:N/AC:L/PR:N/UI:N/S:U/C:H/I:H/A:H
    cvss-score: 9.8
    cwe-id: CWE-1391
  metadata:
    verified: true
    max-request: 1
    fofa-query: app="Panabit-智能网关"
  tags: panabit,default-login,intrusive,vuln

http:
  - raw:
      - |
        POST /login/userverify.cgi HTTP/1.1
        Host: {{Hostname}}
        Origin: {{BaseURL}}
        Content-Type: multipart/form-data; boundary=----WebKitFormBoundaryAjZMsILtbrBp8VbC
        Referer: {{BaseURL}}/login/login.htm
        Accept-Encoding: gzip, deflate
        Accept-Language: en-GB,en-US;q=0.9,en;q=0.8

        ------WebKitFormBoundaryAjZMsILtbrBp8VbC
        Content-Disposition: form-data; name="username"

        {{username}}
        ------WebKitFormBoundaryAjZMsILtbrBp8VbC
        Content-Disposition: form-data; name="password"

        {{password}}
        ------WebKitFormBoundaryAjZMsILtbrBp8VbC--

    payloads:
      username:
        - admin
      password:
        - panabit
    attack: pitchfork

    matchers-condition: and
    matchers:
      - type: word
        part: body
        words:
          - '<META HTTP-EQUIV=REFRESH CONTENT="0;URL=/index.htm">'
          - 'urn:schemas-microsoft-com:vml'
        condition: and

      - type: word
        part: header
        words:
          - "paonline_admin"

      - type: status
        status:
          - 200
