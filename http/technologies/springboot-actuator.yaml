id: springboot-actuator

info:
  name: Spring Boot Actuator 指纹识别（指纹识别）
  author: that_juan_,dwisiswant0,wdahlenb,dr0pd34d,TheZakMan
  severity: info
  description: >-
    Spring Boot Actuator 是 Spring Boot 的运维端点模块，用于暴露健康检查、指标、环境和应用状态。该模板通过请求目标服务并检查预设路径或首页响应、页面正文关键字、favicon
    哈希、DSL 条件等指纹特征，判断目标是否使用或暴露了 Spring Boot Actuator 相关组件；命中结果仅表示指纹特征匹配，可用于资产盘点、技术栈识别和后续安全评估，不代表已确认存在可利用漏洞。
  metadata:
    max-request: 4
    shodan-query: http.favicon.hash:116323821
  tags: tech,springboot,actuator,discovery
http:
  - method: GET
    path:
      - "{{BaseURL}}"
      - "{{BaseURL}}/actuator"
      - "{{BaseURL}}/actuator%72"
      - "{{BaseURL}}/favicon.ico"
      - "{{BaseURL}}/actuator/favicon.ico"

    stop-at-first-match: true

    matchers-condition: or
    matchers:
      - type: word
        part: body
        words:
          - '"_links":'
          - '"self":'
          - '"health"'
        condition: and

      - type: dsl
        name: "favicon"
        dsl:
          - "status_code==200 && (\"116323821\" == mmh3(base64_py(body)))"

    extractors:
      - type: json
        name: available-endpoints
        json:
          - .[] | to_entries | .[].key
