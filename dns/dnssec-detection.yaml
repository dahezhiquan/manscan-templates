id: dnssec-detection

info:
  name: DNSSEC 配置识别（dns）
  author: pdteam
  severity: info
  description: |
    该模板检测 DNSSEC 相关配置是否启用，重点关注 DS 等记录。DNSSEC 用于为 DNS 数据提供来源认证和完整性校验。
  reference:
    - https://www.icann.org/resources/pages/dnssec-what-is-it-why-important-2019-03-05-en
    - https://www.cyberciti.biz/faq/unix-linux-test-and-validate-dnssec-using-dig-command-line/
  classification:
    cwe-id: CWE-200
  metadata:
    max-request: 1
  tags: dns,dnssec,discovery

dns:
  - name: "{{FQDN}}"
    type: DS
    matchers:
      - type: regex
        part: answer
        regex:
          - "IN\tDS\\t(.+)$"
