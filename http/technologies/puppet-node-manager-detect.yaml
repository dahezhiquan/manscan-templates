id: puppet-node-manager-detect

info:
  name: Puppet Node Manager 指纹识别（指纹识别）
  author: pussycat0x
  severity: info
  description: >-
    Puppet Node Manager 是 Puppet 自动化体系中的节点管理入口，用于组织、分类和管理受控节点。该模板通过请求目标服务并检查预设路径或首页响应、页面正文关键字、状态码等指纹特征，判断目标是否使用或暴露了
    Puppet Node Manager 相关组件；命中结果仅表示指纹特征匹配，可用于资产盘点、技术栈识别和后续安全评估，不代表已确认存在可利用漏洞。
  metadata:
    max-request: 1
    fofa-query: 'app="puppet-Node-Manager"'
  tags: node,tech,discovery
http:
  - method: GET
    path:
      - "{{BaseURL}}"

    matchers-condition: and
    matchers:
      - type: word
        words:
          - '<title>Puppet Node Manager</title>'

      - type: status
        status:
          - 200
