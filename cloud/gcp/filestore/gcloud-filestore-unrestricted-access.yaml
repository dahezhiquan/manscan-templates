id: gcloud-filestore-unrestricted-access

info:
  name: Filestore Instance Client 访问 未Restricted by IP（云安全）
  author: princechaddha
  severity: medium
  description: Filestore 的 NFS export 未配置客户端 IP 限制时，允许访问所在网络的更多客户端挂载文件共享。本模板枚举 Filestore 实例并检查 fileShares[].nfsExportOptions，字段为 null 时报告客户端访问未按 IP 限制。
  impact: |
    - 同一网络内非预期主机可能访问共享文件，造成敏感文件读取、篡改或删除风险。
    - 缺少客户端范围限制会扩大被入侵主机横向访问 Filestore 数据的机会。
  remediation: |
    - 为 Filestore 文件共享配置 nfsExportOptions，仅允许明确的客户端 IP 或网段访问。
    - 结合 VPC 防火墙、专用子网和最小权限主机策略限制 NFS 访问来源。
  reference:
    - https://www.trendmicro.com/cloudoneconformity/knowledge-base/gcp/Filestore/restrict-client-access.html
    - https://cloud.google.com/filestore/docs/access-control
  metadata:
    vendor: google
    product: filestore
  tags: cloud,devops,gcp,gcloud,filestore,security,networking,access-control,gcp-cloud-config

flow: |
  code(1)
  for(let projectId of iterate(template.projectIds)){
    set("projectId", projectId)
    code(2)
    for(let instance of iterate(template.instances)){
      instance = JSON.parse(instance)
      set("instanceName", instance.name)
      code(3)
    }
  }

self-contained: true

code:
  - engine:
      - sh
      - bash
    source: |
      gcloud projects list --format="json(projectId)"

    extractors:
      - type: json
        name: projectIds
        internal: true
        json:
          - '.[].projectId'

  - engine:
      - sh
      - bash
    source: |
      gcloud filestore instances list --project $projectId --format="json"

    extractors:
      - type: json
        name: instances
        internal: true
        json:
          - '.[]'

  - engine:
      - sh
      - bash
    source: |
      gcloud filestore instances describe $instanceName --format="json(fileShares[].nfsExportOptions)"

    matchers:
      - type: word
        words:
          - "null"

    extractors:
      - type: dsl
        dsl:
          - '"Filestore instance " + instanceName + " in project " + projectId + " has unrestricted client access and is not limited to specific IP addresses"'
