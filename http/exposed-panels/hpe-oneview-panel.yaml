id: hpe-oneview-panel

info:
  name: HPE OneView 面板识别（暴露面识别）
  author: rxerium
  severity: info
  description: |
    该模板通过识别 HPE OneView 面板、控制台或管理界面的页面特征，判断目标是否暴露了对应服务入口。若命中，说明该后台或运维界面对外可访问，可用于资产识别与暴露面排查。
  reference:
    - https://www.hpe.com/us/en/integrated-systems/software.html
  metadata:
    verified: true
    max-request: 1
    vendor: hp
    product: oneview
    shodan-query: http.favicon.hash:-1569311459
  tags: panel,hpe,hp,oneview,login

http:
  - method: GET
    path:
      - "{{BaseURL}}"

    matchers-condition: and
    matchers:
      - type: word
        words:
          - "<title>OneView"

      - type: status
        status:
          - 200

    extractors:
      - type: regex
        name: version
        part: body
        group: 1
        regex:
          - 'var artifactVersion = "([0-9]+\.[0-9]+\.[0-9]+)"'
        internal: true

      - type: kval
        kval:
          - version
