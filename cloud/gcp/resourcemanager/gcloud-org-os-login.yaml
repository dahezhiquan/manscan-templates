id: gcloud-org-os-login

info:
  name: OS Login 未Required（云安全）
  author: princechaddha
  severity: medium
  description: OS Login 可将 Compute Engine SSH 访问统一到 IAM 和审计体系，组织未强制启用时项目仍可能依赖分散的 SSH key 元数据。本模板检查 compute.requireOsLogin 组织策略 booleanPolicy，返回空对象 {} 时报告未强制要求 OS Login。
  impact: |
    - 实例或项目元数据中的 SSH key 可能长期残留，离职、权限变更或密钥泄露后难以及时收敛。
    - SSH 登录行为无法充分依赖 IAM 条件、组织账号生命周期和集中审计。
  remediation: |
    - 启用 compute.requireOsLogin 组织策略，统一通过 OS Login 管理 Compute Engine SSH 访问。
    - 清理项目和实例元数据中的旧 SSH key，并结合 IAM、MFA 和审计日志管理登录权限。
  reference:
    - https://www.trendmicro.com/cloudoneconformity/knowledge-base/gcp/ResourceManager/enquire-os-login.html
    - https://cloud.google.com/compute/docs/oslogin
  metadata:
    vendor: google
    product: resource-manager
  tags: cloud,devops,gcp,gcloud,resourcemanager,security,compute,ssh,gcp-cloud-config

flow: |
  code(1)
  for(let orgId of iterate(template.orgIds)){
    set("orgId", orgId)
    code(2)
  }

self-contained: true

code:
  - engine:
      - sh
      - bash
    source: |
      gcloud organizations list --format="json(name)"

    extractors:
      - type: json
        name: orgIds
        internal: true
        json:
          - '.[].name'

  - engine:
      - sh
      - bash
    source: |
      gcloud alpha resource-manager org-policies describe compute.requireOsLogin --organization=$orgId --effective --format="json(booleanPolicy)"

    matchers:
      - type: word
        words:
          - "{}"

    extractors:
      - type: dsl
        dsl:
          - '"Organization " + orgId + " has not enforced OS Login requirement for centralized SSH key management"'
