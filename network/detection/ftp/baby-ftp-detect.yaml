id: baby-ftp-detect
info:
  name: Baby FTP 服务 识别（服务漏洞）
  author: pussycat0x
  severity: info
  description: |
    该模板通过 FTP Banner、响应特征或协商行为识别目标是否运行 Baby 相关 FTP 服务实现。
  metadata:
    verified: true
    shodan-query: "Welcome to Baby FTP Server"
    max-request: 1
  tags: network,ftp,baby,detect,tcp,discovery

tcp:
  - inputs:
      - data: 00000000
        type: hex

    host:
      - "{{Hostname}}"
    port: 21
    read-size: 1024

    matchers:
      - type: word
        words:
          - "Welcome to Baby FTP Server"
