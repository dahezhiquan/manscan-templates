id: configure-service-timestamps-logmessages

info:
  name: Cisco 日志消息时间戳未配置（本地文件安全扫描）
  author: pussycat0x
  severity: info
  description: |
    该模板检测 Cisco 日志消息是否配置 service timestamps。缺少日志时间戳会影响审计、告警关联和事件响应。
  reference:
    - https://www.cisco.com/E-Learning/bulk/public/tac/cim/cib/using_cisco_ios_software/cmdrefs/service_timestamps.htm
  classification:
    cvss-metrics: CVSS:3.1/AV:N/AC:L/PR:N/UI:N/S:U/C:N/I:N/A:N
    cvss-score: 0
    cwe-id: CWE-200
  tags: file,audit,cisco,config-audit,cisco-switch,router

file:
  - extensions:
      - conf

    matchers-condition: and
    matchers:
      - type: word
        words:
          - "service timestamps log datetime msec show-timezone localtime"
        negative: true

      - type: word
        words:
          - "configure terminal"

