id: api-coinmarketcap

info:
  name: CoinMarketCap API Token 可用性校验（token喷洒）
  author: daffainfo
  severity: info
  description: 该模板通过调用 CoinMarketCap API 的已知接口验证提供的 token 是否有效，命中后通常表示可访问区块链与加密资产数据能力。
  reference:
    - https://coinmarketcap.com/api/documentation/v1
    - https://github.com/daffainfo/all-about-apikey/tree/main/coinmarketcap
  metadata:
    max-request: 1
  tags: token-spray,coinmarketcap

self-contained: true

http:
  - raw:
      - |
        GET https://pro-api.coinmarketcap.com/v1/cryptocurrency/listings/latest HTTP/1.1
        Host: pro-api.coinmarketcap.com
        X-CMC_PRO_API_KEY: {{token}}

    matchers:
      - type: word
        part: body
        words:
          - '"name"'
          - '"symbol"'
          - '"cmc_rank"'
        condition: and
