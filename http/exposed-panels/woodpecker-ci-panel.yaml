id: woodpecker-ci-panel

info:
  name: Woodpecker CI 面板识别（暴露面识别）
  author: Shivam Kamboj
  severity: info
  description: |
    该模板通过识别 Woodpecker CI 面板、控制台或管理界面的页面特征，判断目标是否暴露了对应服务入口。若命中，说明该后台或运维界面对外可访问，可用于资产识别与暴露面排查。
  reference:
    - https://woodpecker-ci.org/
    - https://github.com/woodpecker-ci/woodpecker
  metadata:
    verified: true
    max-request: 1
    vendor: woodpecker-ci
    product: woodpecker
    fofa-query:
      - title="Woodpecker"
      - body="/web-config.js"
    google-query: intitle:"Woodpecker CI"
  tags: panel,woodpecker,login,discovery

http:
  - method: GET
    path:
      - "{{BaseURL}}"

    host-redirects: true
    max-redirects: 2
    matchers:
      - type: dsl
        dsl:
          - 'contains_all(body, "<title>Woodpecker</title>", "/web-config.js")'
          - 'status_code == 200'
        condition: and
