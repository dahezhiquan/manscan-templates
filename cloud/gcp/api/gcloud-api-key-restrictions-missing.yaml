id: gcloud-api-key-restrictions-missing

info:
  name: 缺失 API Key API Restrictions（云安全）
  author: princechaddha
  severity: medium
  description: Google Cloud API Key 如果没有配置 API restrictions，泄露后可被用于调用任何支持 API Key 的已启用服务。本模板枚举项目中的 API Key，并通过 gcloud alpha services api-keys describe 检查 restrictions 字段，命中 null 时报告该密钥缺少 API 调用范围限制。
  impact: |
    - API Key 一旦出现在客户端、日志或仓库中，攻击者可在未限制的服务范围内滥用密钥，造成配额消耗、费用增加或数据访问风险。
    - 缺少 API 级别限制会削弱密钥泄露后的隔离边界，增加跨服务误用和排查难度。
  remediation: |
    - 为每个 API Key 配置明确的 API restrictions，仅允许业务实际需要的 Google Cloud API。
    - 按应用或环境拆分 API Key，轮换已经暴露或用途不清的密钥，并持续审计未受限密钥。
  reference:
    - https://cloud.google.com/api-keys/docs/restricting-api-keys
  metadata:
    vendor: google
    product: api-keys
  tags: cloud,devops,gcp,gcloud,apikey,gcp-cloud-config

flow: |
  code(1)
  for(let projectId of iterate(template.projectIds)){
    set("projectId", projectId)
    code(2)
    for(let apiKey of iterate(template.apiKeys)){
      set("apiKeyUid", apiKey)
      code(3)
    }
  }

self-contained: true

code:
  - engine:
      - sh
      - bash
    source: |
      gcloud projects list --format="json(projectId)"

    extractors:
      - type: json
        name: projectIds
        internal: true
        json:
          - '.[].projectId'

  - engine:
      - sh
      - bash
    source: |
      gcloud alpha services api-keys list --project=$projectId --format="json(uid)"

    extractors:
      - type: json
        name: apiKeys
        internal: true
        json:
          - '.[].uid'

  - engine:
      - sh
      - bash
    source: |
      gcloud alpha services api-keys describe $apiKeyUid --format="json(restrictions)"

    matchers:
      - type: word
        part: body
        words:
          - 'null'

    extractors:
      - type: dsl
        dsl:
          - '"Unrestricted API Key: " + apiKeyUid + " in Project: " + projectId'
