id: deep-sea-electronics-dse855-detect

info:
  name: Deep Sea Electronics DSE 855 Generator Controller 识别（指纹识别）
  author: rxerium
  severity: info
  description: |
    该模板用于识别 Deep Sea Electronics DSE 855 Generator Controller 是否存在对外暴露的管理、服务或状态界面。若命中，说明目标公开了相关功能入口，可作为资产盘点与攻击面收敛的依据。
  reference:
    - https://www.deepseaelectronics.com/products/auto-mains-failure-modules/855.html
  metadata:
    max-request: 1
    verified: true
    shodan-query: http.title:"DSE 855"
    vendor: deep-sea-electronics
    product: dse855
  tags: tech,panel,dse,ics,generator,energy,scada,detect

http:
  - method: GET
    path:
      - "{{BaseURL}}"

    host-redirects: true
    max-redirects: 2

    matchers-condition: and
    matchers:
      - type: word
        part: body
        words:
          - '<title>DSE 855</title>'
          - 'tab-view.css'
          - 'gui.css'
        condition: or

      - type: status
        status:
          - 200
