id: gcloud-vertexai-default-vpc

info:
  name: Default VPC Network In Use 的Vertex AI Notebooks（云安全）
  author: princechaddha
  severity: medium
  description: Vertex AI notebook 使用 default VPC 时，可能继承默认网络和防火墙规则，偏离组织自定义网络分段要求。本模板检查 gceSetup.networkInterfaces[].network，命中 networks/default 时报告 notebook 使用默认 VPC。
  impact: |
    - Notebook 可能接入未按业务和数据敏感度划分的网络，增加横向访问风险。
    - 默认网络规则和路由不一定符合组织对 AI 数据处理环境的隔离要求。
  remediation: |
    - 将 Vertex AI notebook 部署到经过审批的自定义 VPC 和子网。
    - 配置最小必要防火墙规则、私有访问和网络日志，避免使用 default VPC 承载敏感工作负载。
  reference:
    - https://www.trendmicro.com/cloudoneconformity/knowledge-base/gcp/VertexAI/default-vpc-in-use.html
    - https://cloud.google.com/vertex-ai/docs/workbench/user-managed/create-instance
  metadata:
    vendor: google
    product: vertex-ai
  tags: cloud,devops,gcp,gcloud,vertexai,networking,security,vpc,gcp-cloud-config,ai

flow: |
  code(1)
  for(let projectId of iterate(template.projectIds)){
    set("projectId", projectId)
    code(2)
  }

self-contained: true

code:
  - engine:
      - sh
      - bash
    source: |
      gcloud projects list --format="json(projectId)"

    extractors:
      - type: json
        name: projectIds
        internal: true
        json:
          - '.[].projectId'

  - engine:
      - sh
      - bash
    source: |
      gcloud workbench instances describe tm-vertex-ai-notebook-instance --location=us-central1-a --project=$projectId --format="value(gceSetup.networkInterfaces[].network)"

    matchers:
      - type: word
        words:
          - "networks/default"

    extractors:
      - type: dsl
        dsl:
          - '"Project " + projectId + " has Vertex AI notebook instances using the default VPC network"'
