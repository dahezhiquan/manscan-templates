id: kubernetes-enterprise-manager

info:
  name: Kubernetes Enterprise Manager 面板识别（暴露面识别）
  author: pussycat0x
  severity: info
  description: 该模板通过识别 Kubernetes Enterprise Manager 面板、控制台或管理界面的页面特征，判断目标是否暴露了对应服务入口。若命中，说明该后台或运维界面对外可访问，可用于资产识别与暴露面排查。
  classification:
    cvss-metrics: CVSS:3.1/AV:N/AC:L/PR:N/UI:N/S:U/C:N/I:N/A:N
    cwe-id: CWE-200
    cpe: cpe:2.3:a:kubernetes:kubernetes:*:*:*:*:*:*:*:*
  metadata:
    max-request: 1
    vendor: kubernetes
    product: kubernetes
    fofa-query:
      - app="Kubernetes-Enterprise-Manager"
      - title="kubernetes web view"
      - app="kubernetes-enterprise-manager"
    shodan-query: http.title:"kubernetes web view"
    google-query: intitle:"kubernetes web view"
  tags: tech,kubernetes,panel,discovery

http:
  - method: GET
    path:
      - "{{BaseURL}}"

    matchers-condition: and
    matchers:
      - type: word
        part: body
        words:
          - "Kubernetes Enterprise Manager"

      - type: status
        status:
          - 200
