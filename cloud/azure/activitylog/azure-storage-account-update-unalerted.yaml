id: azure-storage-account-update-unalerted
info:
  name: Azure Storage Account 创建或更新告警未配置（云安全）
  author: princechaddha
  severity: high
  description: Storage Account 创建或更新可能改变网络访问、加密、复制、TLS 和公共访问配置；未配置 Activity Log 告警时，存储安全边界变化可能不被及时发现。该模板枚举已启用的 Activity Log Alert，并检查 condition 是否缺少 Microsoft.Storage/storageAccounts/write 操作条件。
  impact: |
    - 未授权更新可能开启公共访问、降低传输安全或改变加密和密钥配置。
    - 异常创建的存储账户可能成为数据外传、恶意内容托管或持久化资源。
  remediation: |
    - 创建针对 Storage Account 创建和更新操作的 Activity Log Alert，并接入存储安全审计流程。
    - 对公共访问、Secure Transfer、TLS、加密、网络规则和密钥配置执行基线校验。
  reference:
    - https://docs.microsoft.com/en-us/azure/azure-monitor/platform/alerts-activity-log
  metadata:
    vendor: microsoft
    product: azure-monitor
  tags: cloud,devops,azure,microsoft,storage-account,azure-cloud-config

flow: |
  code(1);
  for (let AlertData of iterate(template.alertList)) {
    set("id", AlertData);
    code(2);
  }

self-contained: true
code:
  - engine:
      - sh
      - bash
    source: |
      az monitor activity-log alert list --output json --query '[?(enabled==`true`)].id'

    extractors:
      - type: json
        name: alertList
        internal: true
        json:
          - '.[]'

  - engine:
      - sh
      - bash
    source: |
      az monitor activity-log alert show --ids "$id" --query 'condition'

    matchers-condition: and
    matchers:
      - type: word
        words:
          - '"field": "operationName"'

      - type: word
        words:
          - "Microsoft.Storage/storageAccounts/write"
        negative: true

    extractors:
      - type: dsl
        dsl:
          - 'id + " does not have the correct alert configuration for Create/Update Storage Account events"'
