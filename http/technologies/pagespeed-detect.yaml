id: pagespeed-detect

info:
  name: PageSpeed 指纹识别（指纹识别）
  author: geeknik
  severity: info
  description: >-
    PageSpeed 是 Web 性能优化相关组件或服务，用于分析、优化和展示页面加载性能特征。该模板通过请求目标服务并检查预设路径或首页响应、HTTP 响应头、页面正文关键字等指纹特征，判断目标是否使用或暴露了
    PageSpeed 相关组件；命中结果仅表示指纹特征匹配，可用于资产盘点、技术栈识别和后续安全评估，不代表已确认存在可利用漏洞。
  metadata:
    verified: true
    max-request: 1
    shodan-query: "X-Mod-Pagespeed:"
  tags: tech,pagespeed,discovery
http:
  - method: GET
    path:
      - "{{BaseURL}}"

    matchers:
      - type: word
        part: header
        words:
          - "X-Mod-Pagespeed:"
