id: lidarr-dashboard-unauth

info:
  name: Lidarr 仪表盘 未授权
  author: ProjectDiscoveryAI
  severity: medium
  description: |
    检测到 Lidarr 仪表盘 未授权。目标功能在未认证状态下可访问，可能暴露管理入口、业务数据、系统状态或可执行操作，需确认是否存在访问控制缺失。
  metadata:
    verified: true
    max-request: 1
    shodan-query: title:"Lidarr"
  tags: lidarr,dashboard,exposure,vuln

http:
  - method: GET
    path:
      - "{{BaseURL}}"

    host-redirects: true
    max-redirects: 2

    matchers-condition: and
    matchers:
      - type: word
        part: body
        words:
          - "<title>Lidarr</title>"

      - type: word
        part: body
        words:
          - "Login - Lidarr"
        negative: true

      - type: status
        status:
          - 200
