id: mylittlebackup-panel

info:
  name: myLittleBackup 面板识别（暴露面识别）
  author: nullfuzz
  severity: info
  description: |
    该模板通过识别 myLittleBackup 面板、控制台或管理界面的页面特征，判断目标是否暴露了对应服务入口。若命中，说明该后台或运维界面对外可访问，可用于资产识别与暴露面排查。
  reference:
    - http://www.mylittlebackup.com/mlb/en/overview.aspx
  classification:
    cvss-metrics: CVSS:3.0/AV:N/AC:L/PR:N/UI:N/S:U/C:N/I:N/A:N
    cwe-id: CWE-200
    cpe: cpe:2.3:a:mylittletools:mylittlebackup:*:*:*:*:*:*:*:*
  metadata:
    verified: true
    max-request: 3
    shodan-query: http.html:"myLittleBackup"
    product: mylittlebackup
    vendor: mylittletools
  tags: panel,mylittlebackup,discovery

http:
  - method: GET
    path:
      - "{{BaseURL}}"
      - "{{BaseURL}}/mlb/"
      - "{{BaseURL}}/mylittlebackup/"

    stop-at-first-match: true
    host-redirects: true
    max-redirects: 2

    matchers-condition: and
    matchers:
      - type: regex
        part: body
        regex:
          - 'content=".*(myLittleBackup).*'
          - '<title>myLittleBackup for SQL Server'
        condition: or

      - type: status
        status:
          - 200
