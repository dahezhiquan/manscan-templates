id: starz-phish

info:
  name: Starz 仿冒钓鱼网站（钓鱼网站识别）
  author: rxerium
  severity: info
  description: |
    检测到疑似仿冒 Starz 的钓鱼网站。模板在目标页面返回 200、页面内容命中 Starz 的品牌页面特征，且当前主机不属于 starz.com 官方域名时触发，用于识别借用 Starz 品牌页面诱导用户信任的仿冒站点。
  reference:
    - https://starz.com
  metadata:
    max-request: 1
  tags: phishing,starz,streaming,osint,discovery
http:
  - method: GET
    path:
      - "{{BaseURL}}"

    host-redirects: true
    max-redirects: 2

    matchers-condition: and
    matchers:
      - type: word
        words:
          - 'Starz'
          - 'STARZ brings diverse perspectives to life through bold storytelling. Sign-up to stream original series, movies, extras, and more—on-demand and ad-free.'
        condition: and

      - type: status
        status:
          - 200

      - type: dsl
        dsl:
          - '!contains(host,"starz.com")'
