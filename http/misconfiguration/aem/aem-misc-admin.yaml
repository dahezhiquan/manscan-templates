id: aem-misc-admin

info:
  name: Adobe AEM Misc Admin 仪表盘 暴露
  author: dhiyaneshDk
  severity: high
  description: |
    该模板用于核查 Adobe AEM Misc Admin 仪表盘暴露状态。该类问题通常源于管理面板、仪表盘或监控控制台暴露在公网或缺少足够访问控制。模板会向目标发送探测请求，并依据请求 `{{paths}}`、匹配 `<title>AEM Tools</title>`、`<title>AEM MCM</title>`、状态码 200 等证据确认目标是否存在该配置问题。
  impact: |
    - 攻击者可获取系统状态、业务指标、任务信息、拓扑结构或管理入口线索。
    - 若面板存在默认凭据、弱认证或操作接口，可能进一步导致未授权管理或服务接管。
  remediation: |
    - 将管理面板和仪表盘限制在内网、VPN 或可信访问网关后。
    - 启用强认证、多因素认证、细粒度授权和操作审计。
    - 隐藏或关闭不需要公开的默认面板，并监控异常访问与暴力探测。
  reference:
    - https://raw.githubusercontent.com/danielmiessler/SecLists/master/Discovery/Web-Content/aem2.txt
  metadata:
    verified: true
    max-request: 9
    shodan-query:
      - http.title:"AEM Sign In"
      - http.component:"Adobe Experience Manager"
  tags: misconfig,aem,adobe,exposure,vuln

http:
  - method: GET
    path:
      - "{{BaseURL}}{{paths}}"
    payloads:
      paths:
        - "/miscadmin"
        - "/mcmadmin#/content/dashboard"
        - "/miscadmin#/etc/mobile"
        - "/miscadmin#/etc/segmentation"
        - "/miscadmin#/etc/blueprints"
        - "/miscadmin#/etc/designs"
        - "/miscadmin#/etc/importers"
        - "/miscadmin#/etc/reports"
        - "/miscadmin#/etc/msm/rolloutconfigs"

    stop-at-first-match: true

    matchers-condition: and
    matchers:
      - type: word
        part: body
        words:
          - '<title>AEM Tools</title>'
          - '<title>AEM MCM</title>'
        condition: or

      - type: word
        part: header
        words:
          - text/html

      - type: status
        status:
          - 200
