id: uptime-kuma-installer

info:
  name: Uptime Kuma 安装向导
  author: 0x_Akoko
  severity: high
  description: |
    检测到 Uptime Kuma 安装向导。该页面属于安装、初始化或配置向导流程，若对外暴露，攻击者可能完成初始化、创建管理员账户或重新配置目标系统。
  reference:
    - https://github.com/louislam/uptime-kuma
  metadata:
    verified: true
    max-request: 1
    vendor: louislam
    product: uptime-kuma
    fofa-query: app="Uptime-Kuma"
    shodan-query: http.title:"Uptime Kuma"
  tags: exposure,setup,installer,uptime-kuma

http:
  - method: GET
    path:
      - "{{BaseURL}}/setup-database-info"

    matchers:
      - type: dsl
        dsl:
          - 'contains_all(body, "\"needSetup\":true", "runningSetup", "isEnabledEmbeddedMariaDB")'
          - 'contains(content_type, "application/json")'
          - 'status_code == 200'
        condition: and
