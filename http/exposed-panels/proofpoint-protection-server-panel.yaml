id: proofpoint-protection-server-panel

info:
  name: Proofpoint Protection Server 面板识别（指纹识别）
  author: johnk3r
  severity: info
  description: 该模板通过识别 Proofpoint Protection Server 面板、控制台或管理界面的页面特征，判断目标是否暴露了对应服务入口。若命中，说明该后台或运维界面对外可访问，可用于资产识别与暴露面排查。
  classification:
    cvss-metrics: CVSS:3.0/AV:N/AC:L/PR:N/UI:N/S:U/C:N/I:N/A:N
    cwe-id: CWE-200
  metadata:
    verified: true
    max-request: 2
    vendor: proofpoint
    product: proofpoint protection server
    shodan-query: http.favicon.hash:942678640
    fofa-query: icon_hash=942678640
  tags: panel,proofpoint,login,detect,discovery

http:
  - method: GET
    path:
      - "{{BaseURL}}"
      - "{{BaseURL}}/euweb/login"

    stop-at-first-match: true
    host-redirects: true
    max-redirects: 2

    matchers-condition: or
    matchers:
      - type: word
        part: body
        words:
          - '<TITLE>Proofpoint Protection Server'
          - 'Proofpoint End User Application.'
          - 'Powered by Proofpoint'
        condition: or

      - type: word
        part: header
        words:
          - 'PPSAUTH='
