id: filecatalyst-panel

info:
  name: FileCatalyst File Transfer Solution 识别（指纹识别）
  author: DhiyaneshDK
  severity: info
  description: |-
    检测到目标站点存在 FileCatalyst File Transfer Solution 相关响应特征。FileCatalyst File Transfer Solution 是监控、日志、分析或可观测性系统，用于展示运行指标、告警事件、日志数据和服务状态。模板请求 `/workflow/jsp/logon.jsp`，并通过页面标题或正文关键字、状态码确认该系统指纹，用于资产识别、系统盘点和暴露面梳理。
  metadata:
    verified: true
    max-request: 1
    shodan-query: html:"FileCatalyst file transfer solution"
  tags: panel,login,filecatalyst,detect,discovery
http:
  - method: GET
    path:
      - "{{BaseURL}}/workflow/jsp/logon.jsp"

    matchers-condition: and
    matchers:
      - type: word
        part: body
        words:
          - "FileCatalyst file transfer solution"

      - type: status
        status:
          - 200
