id: octobercms-detect

info:
  name: OctoberCMS 指纹识别（指纹识别）
  author: cyllective
  severity: info
  description: >-
    OctoberCMS 是基于 Laravel 的内容管理系统，用于构建网站、插件和后台管理功能。该模板通过请求目标服务并检查预设路径或首页响应、HTTP 响应头、页面正文关键字等指纹特征，判断目标是否使用或暴露了
    OctoberCMS 相关组件；命中结果仅表示指纹特征匹配，可用于资产盘点、技术栈识别和后续安全评估，不代表已确认存在可利用漏洞。
  reference:
  - https://github.com/octobercms/october
  metadata:
    max-request: 2
  tags: tech,octobercms,discovery
http:
  - method: GET
    path:
      - "{{BaseURL}}"
      - "{{BaseURL}}/modules/system/assets/js/framework.combined-min.js"

    stop-at-first-match: true
    host-redirects: true
    max-redirects: 1
    matchers:
      - type: word
        part: header
        words:
          - 'october_session'

      - type: word
        part: body
        words:
          - 'OctoberCMS'
