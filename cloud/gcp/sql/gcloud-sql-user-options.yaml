id: gcloud-sql-user-options

info:
  name: Google Cloud SQL Server 实例启用了 User Options 标志（云安全）
  author: princechaddha
  severity: medium
  description: 该规则用于检查 GCP SQL 相关资源是否满足推荐的云安全与合规配置要求，命中通常表示当前配置仍存在可改进的风险项。
  impact: |
    - 当前配置偏离推荐的云安全基线，可能增加攻击面、审计缺口或运维失误带来的风险。
    - 具体影响取决于受影响资源的重要性、暴露范围以及周边安全控制是否到位。
  remediation: |
    - 参考云厂商安全基线和官方文档修正当前配置偏差。
    - 建议结合资源标签、自动化检测与周期性审计，持续跟踪该类风险项的整改状态。
  reference:
    - https://cloud.google.com/sql/docs/sqlserver/configure-database-flags
  tags: cloud,devops,gcp,gcloud,google-cloud-sql,sql-database-flags,gcp-cloud-config

flow: |
  code(1)
  for(let projectId of iterate(template.projectIds)){
    set("projectId", projectId)
    code(2)
    for(let sqlInstance of iterate(template.sqlInstances)){
      set("sqlInstance", sqlInstance)
      code(3)
    }}

self-contained: true

code:
  - engine:
      - sh
      - bash
    source: |
      gcloud projects list --format="json(projectId)"

    extractors:
      - type: json
        name: projectIds
        internal: true
        json:
          - '.[].projectId'

  - engine:
      - sh
      - bash
    source: |
      gcloud sql instances list --project $projectId --filter='DATABASE_VERSION:SQLSERVER*' --format="json(name)"

    extractors:
      - type: json
        name: sqlInstances
        internal: true
        json:
          - '.[]'

  - engine:
      - sh
      - bash
    source: |
      gcloud sql instances describe $sqlInstance --format=json | jq '.settings.databaseFlags // [] | map(select(.name == "user options")) | .[].value'

    matchers:
      - type: regex
        regex:
          - '^(?:100|[1-9][0-9]?)$'

    extractors:
      - type: dsl
        dsl:
          - '"The user options database flag is enabled for the SQL Server instance " + sqlInstance + " in project " + projectId + "."'
