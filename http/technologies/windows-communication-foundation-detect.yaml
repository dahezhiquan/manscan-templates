id: windows-communication-foundation-detect

info:
  name: Windows Communication Foundation 指纹识别（指纹识别）
  author: r3naissance
  severity: info
  description: >-
    Windows Communication Foundation 是 Microsoft .NET 的服务通信框架，用于构建 SOAP、REST 和企业集成服务。该模板通过请求目标服务并检查预设路径或首页响应、页面正文关键字、状态码等指纹特征，判断目标是否使用或暴露了
    Windows Communication Foundation 相关组件；命中结果仅表示指纹特征匹配，可用于资产盘点、技术栈识别和后续安全评估，不代表已确认存在可利用漏洞。
  metadata:
    max-request: 1
    vendor: windows
    product: wcf
    shodan-query: http.title:"Service"
  tags: tech,wcf,windows,discovery
http:
  - method: GET
    path:
      - '{{BaseURL}}'

    matchers-condition: and
    matchers:
      - type: word
        part: body
        words:
          - 'Endpoint not found.'
          - 'class="heading1">Service'
          - 'This is a Windows&#169; Communication Foundation service.'
        condition: or
        case-insensitive: true

      - type: word
        part: body
        case-insensitive: true
        words:
          - '<title>Service</title>'

      - type: status
        status:
          - 200
