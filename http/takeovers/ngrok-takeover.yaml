id: ngrok-takeover

info:
  name: ngrok 隧道缺失接管检测（子域名接管）
  author: pdteam
  severity: high
  description: 检测 ngrok 返回隧道未找到提示的情况，表明目标子域名可能指向不存在或已释放的 ngrok 隧道，存在被重新申请后接管访问流量的风险。
  reference:
    - https://github.com/EdOverflow/can-i-take-over-xyz/issues/92
  metadata:
    max-request: 1
  tags: takeover,ngrok,vuln

http:
  - method: GET
    path:
      - "{{BaseURL}}"

    matchers-condition: and
    matchers:
      - type: dsl
        dsl:
          - Host != ip

      - type: word
        words:
          - ngrok.io not found
          - Tunnel *.ngrok.io not found

    extractors:
      - type: dsl
        dsl:
          - cname
