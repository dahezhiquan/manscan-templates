id: pahtool-panel

info:
  name: PAHTool 登录面板识别（指纹识别）
  author: righettod
  severity: info
  description: |-
    PAHTool 是对应产品的 Web 管理或登录入口，用于管理员、运维人员或业务用户访问后台功能。该模板请求首页，并依据 DSL 条件识别目标是否部署了该系统或暴露了对应入口，适用于资产指纹确认；命中结果仅表示系统特征匹配，不代表已确认存在未授权访问或可利用漏洞。
  reference:
  - http://www.inovultus.com/index.html
  metadata:
    verified: true
    max-request: 1
    shodan-query: http.title:"PAHTool"
  tags: panel,pahtool,login,detect,discovery

http:
  - method: GET
    path:
      - "{{BaseURL}}"

    matchers:
      - type: dsl
        dsl:
          - 'status_code == 200'
          - 'contains(body, ">PAHTool")'
        condition: and

    extractors:
      - type: regex
        part: body
        group: 1
        regex:
          - 'id="appVersion"\s+value="([0-9\.]+)"'
