id: homebridge-panel

info:
  name: Homebridge 面板识别（指纹识别）
  author: rxerium
  severity: info
  description: |
    该模板通过识别 Homebridge 面板、控制台或管理界面的页面特征，判断目标是否暴露了对应服务入口。若命中，说明该后台或运维界面对外可访问，可用于资产识别与暴露面排查。
  reference:
    - https://homebridge.io/
    - https://github.com/homebridge
  metadata:
    verified: true
    max-request: 1
    shodan-query: title:"Homebridge"
  tags: panel,homebridge,detect,discovery

http:
  - method: GET
    path:
      - "{{BaseURL}}/login"

    matchers-condition: and
    matchers:
      - type: word
        part: body
        words:
          - '<title>Homebridge</title>'

      - type: status
        status:
          - 200
