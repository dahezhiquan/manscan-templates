id: fortios-fortinet-fortimanager-panel

info:
  name: Fortinet FortiManager 面板识别（指纹识别）
  author: johnk3r
  severity: info
  description: |-
    检测到目标站点存在 Fortinet FortiManager 相关响应特征。Fortinet FortiManager 是集中网络安全管理平台，用于统一管理 Fortinet 设备、策略、对象和配置发布。模板请求 `/p/login/`，并通过页面标题或正文关键字、状态码确认该系统指纹，用于资产识别、系统盘点和暴露面梳理。
  reference:
    - https://www.fortinet.com/br/products/management/fortimanager
  classification:
    cvss-metrics: CVSS:3.0/AV:N/AC:L/PR:N/UI:N/S:U/C:N/I:N/A:N
    cwe-id: CWE-200
    cpe: cpe:2.3:a:fortinet:fortimanager:*:*:*:*:*:*:*:*
  metadata:
    max-request: 1
    vendor: fortinet
    product: fortimanager
    shodan-query: 'http.html_hash:-1527157728 "Model: FMG-VM"'
    fofa-query: title="FortiManager-"
  tags: panel,fortinet,fortios,fortimanager,detect,discovery
http:
  - method: GET
    path:
      - "{{BaseURL}}/p/login/"

    matchers-condition: and
    matchers:
      - type: word
        part: body
        words:
          - "FortiManager"

      - type: status
        status:
          - 200

    extractors:
      - type: regex
        part: body
        group: 1
        regex:
          - '<span class="platform">(.*?)</span>'
