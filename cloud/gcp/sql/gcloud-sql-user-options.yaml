id: gcloud-sql-user-options

info:
  name: Google Cloud SQL Server 实例启用了 User Options 标志（云安全）
  author: princechaddha
  severity: medium
  description: SQL Server user options 会为所有连接设置默认会话选项，非零或非基线值可能改变应用会话行为并造成难以追踪的权限、事务或兼容性问题。本模板检查 Cloud SQL SQL Server 实例 databaseFlags 中 user options 的值，匹配 1 到 100 的数值时报告该标志已启用。
  impact: |
    - 全局会话选项可能改变事务隔离、ANSI 行为或查询执行结果，导致应用异常或安全审计误判。
    - 非标准数据库 flag 会增加故障排查、变更回滚和跨环境一致性维护成本。
  remediation: |
    - 将 user options 恢复为组织批准的基线值，避免在实例层设置不必要的全局会话选项。
    - 如业务必须使用特定选项，应在应用连接或会话级控制，并记录例外与测试结果。
  reference:
    - https://cloud.google.com/sql/docs/sqlserver/configure-database-flags
  metadata:
    vendor: google
    product: cloud-sql
  tags: cloud,devops,gcp,gcloud,google-cloud-sql,sql-database-flags,gcp-cloud-config

flow: |
  code(1)
  for(let projectId of iterate(template.projectIds)){
    set("projectId", projectId)
    code(2)
    for(let sqlInstance of iterate(template.sqlInstances)){
      set("sqlInstance", sqlInstance)
      code(3)
    }}

self-contained: true

code:
  - engine:
      - sh
      - bash
    source: |
      gcloud projects list --format="json(projectId)"

    extractors:
      - type: json
        name: projectIds
        internal: true
        json:
          - '.[].projectId'

  - engine:
      - sh
      - bash
    source: |
      gcloud sql instances list --project $projectId --filter='DATABASE_VERSION:SQLSERVER*' --format="json(name)"

    extractors:
      - type: json
        name: sqlInstances
        internal: true
        json:
          - '.[]'

  - engine:
      - sh
      - bash
    source: |
      gcloud sql instances describe $sqlInstance --format=json | jq '.settings.databaseFlags // [] | map(select(.name == "user options")) | .[].value'

    matchers:
      - type: regex
        regex:
          - '^(?:100|[1-9][0-9]?)$'

    extractors:
      - type: dsl
        dsl:
          - '"The user options database flag is enabled for the SQL Server instance " + sqlInstance + " in project " + projectId + "."'
