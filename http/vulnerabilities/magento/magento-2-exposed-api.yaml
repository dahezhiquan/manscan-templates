id: magento-2-exposed-api

info:
  name: Exposed Magento 2 API
  author: TechbrunchFR
  severity: medium
  description: |
    该模板用于检测 Exposed Magento 2 API。该问题通常源于受影响接口或组件缺少必要的输入校验、访问控制或安全边界限制。模板会向 `/rest/V1/products`、`/rest/V1/store/storeConfigs` 等位置发送探测请求，并结合响应状态、关键字、错误信息、时间差或外带交互等证据判断目标是否受影响。
  impact: |
    - 攻击者可能利用该缺陷访问敏感功能、读取或篡改数据，或扩大对目标系统的控制范围。
    - 在公网暴露、权限配置过宽或与其他缺陷组合时，可能造成更严重的业务中断和数据泄露。
  remediation: |
    - 升级受影响产品或组件到厂商修复版本，并移除不再维护的高风险功能。
    - 对相关接口增加认证、授权、输入校验和访问来源限制。
    - 复核访问日志和异常操作记录，确认是否存在已被利用的迹象。
  reference:
    - https://support.hypernode.com/en/ecommerce/magento-2/how-to-protect-the-magento-2-api
  classification:
    cpe: cpe:2.3:a:magento:magento:*:*:*:*:*:*:*:*
  metadata:
    max-request: 3
    vendor: magento
    product: magento
    shodan-query: http.component:"Magento"
  tags: magento,vuln

http:
  - method: GET
    path:
      - '{{BaseURL}}/rest/V1/products'
      - '{{BaseURL}}/rest/V1/store/storeConfigs'
      - '{{BaseURL}}/rest/V1/store/storeViews'

    matchers-condition: or
    matchers:
      - type: dsl
        dsl:
          - 'contains(body, "searchCriteria")'
          - 'contains(body, "parameters")'
          - 'contains(body, "message")'
          - 'contains(tolower(header), "application/json")'
        condition: and

      - type: dsl
        dsl:
          - 'contains(body, "secure_base_link_url")'
          - 'contains(body, "timezone")'
          - 'contains(tolower(header), "application/json")'
          - 'status_code == 200'
        condition: and

      - type: dsl
        dsl:
          - 'contains(body, "name")'
          - 'contains(body, "website_id")'
          - 'contains(tolower(header), "application/json")'
          - 'status_code == 200'
        condition: and
