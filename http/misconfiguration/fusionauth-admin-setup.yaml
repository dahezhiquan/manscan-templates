id: fusionauth-admin-setup

info:
  name: FusionAuth 暴露 Admin 安装配置
  author: ritikchaddha
  severity: high
  description: |
    检测到 FusionAuth 暴露 Admin 安装配置。目标响应或文件中可能暴露配置、凭据、密钥、令牌、环境变量或历史记录等敏感信息，可能被用于进一步入侵。
  classification:
    cpe: cpe:2.3:a:fusionauth:fusionauth:*:*:*:*:*:*:*:*
  metadata:
    verified: true
    max-request: 1
    vendor: fusionauth
    product: fusionauth
    shodan-query: title:"FusionAuth Setup Wizard"
    fofa-query: title="FusionAuth Setup Wizard"
  tags: misconfig,fusionauth,admin,setup,vuln

http:
  - method: GET
    path:
      - "{{BaseURL}}/admin/setup-wizard"

    matchers-condition: and
    matchers:
      - type: word
        words:
          - '<title>FusionAuth Setup Wizard'
          - 'FusionAuth is now installed and running'
        condition: or

      - type: status
        status:
          - 200
