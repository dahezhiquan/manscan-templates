id: pritunl-panel

info:
  name: Pritunl 面板（暴露面识别）
  author: irshad ahamed
  severity: info
  description: |
    该模板通过识别 Pritunl 面板、控制台或管理界面的页面特征，判断目标是否暴露了对应服务入口。若命中，说明该后台或运维界面对外可访问，可用于资产识别与暴露面排查。
  reference:
    - https://github.com/louislam/uptime-kuma
    - https://uptime.kuma.pet/docs/
  classification:
    cpe: cpe:2.3:a:pritunl:pritunl:*:*:*:*:*:*:*:*
  metadata:
    max-request: 1
    product: pritunl
    shodan-query: title:"Pritunl"
    vendor: pritunl
    verified: true
  tags: pritunl,panel,login,discovery

http:
  - method: GET
    path:
      - "{{BaseURL}}/login"

    matchers-condition: and
    matchers:
      - type: word
        words:
          - '<title>Pritunl</title>'

      - type: status
        status:
          - 200
