id: schneider-electric-ics-modicon-info

info:
  name: Schneider Electric Modicon PLC 信息枚举（指纹识别）
  author: biero-el-corridor
  severity: info
  description: |
    Schneider Electric Modicon PLC 是工业自动化控制器系列，常用于生产线、能源和基础设施控制场景。该模板通过 Modbus/TCP 与 502/TCP 交互，匹配 `Schneider Electric` 等设备标识，用于识别并枚举 Modicon PLC 基本信息。
  metadata:
    verified: true
    shodan-query: "Device Identification: Schneider Electric"
  tags: ics,modicon,schneider-electric,detect,network,tcp

tcp:
  - inputs:
      - data: "000000000005002b0e0200"
        type: hex
        read: 200
        name: info
      - data: "000f0000000d005a002000140064000000f600"
        type: hex
        read: 200
        name: note
      - data: "000400000005005a000300"
        type: hex
        read: 200
        name: info

    host:
      - "{{Hostname}}"
    port: 502
    read-size: 1024

    matchers:
      - type: word
        part: raw
        words:
          - "Schneider Electric"

    extractors:
      - type: regex
        group: 1
        regex:
          - "Schneider Electric    ([A-Z 0-9a-z.]+)"
