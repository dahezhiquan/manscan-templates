id: telnet-client

info:
  name: Telnet 客户端不应安装（本地基线扫描）
  author: Th3l0newolf
  severity: low
  description: |
    Telnet 客户端使用明文协议进行远程登录，凭据和会话内容容易被网络侧窃听，生产主机不应在无需求时保留。CIS Ubuntu 基线建议移除 Telnet 客户端；模板通过 `dpkg-query` 检查 `telnet` 或 `inetutils-telnet` 是否安装，命中 Policy-Fail 表示不符合基线。
  impact: |
    - 增加主机误用高风险协议或旧式信任机制的机会，可能暴露凭据、会话内容或内部连接信息。
    - 攻击者在获得低权限落点后，可能利用已安装客户端辅助横向连接、数据传输或绕过组织基线管控。
  remediation: |
    - 如无明确业务需求，卸载 `telnet/inetutils-telnet` 或对应软件包，并清理残留服务配置。
    - 如必须保留，限制访问来源和可用范围，启用加密认证，并纳入补丁、日志和基线审计。
  reference:
    - https://www.cisecurity.org/benchmark/ubuntu_linux
  metadata:
    verified: true
  tags: cis,local,cisecurity,audit,linux,ubuntu,telnet

self-contained: true

code:
  - engine:
      - sh
      - bash

    args:
      - "-c"
      - |
        # Check if telnet or inetutils-telnet package is installed
        if dpkg-query -W -f='${Package} ${Status}\n' telnet inetutils-telnet 2>/dev/null | grep -q "install ok installed"; then
          echo "[cis-telnet-client-check:Policy-Fail] [Telnet client is installed] [CIS_FAIL]"
        else
          echo "[cis-telnet-client-check:Policy-Pass] [Telnet client is not installed] [CIS_PASS]"
        fi

    matchers:
      - type: word
        name: policy-pass
        words:
          - "Policy-Pass"

      - type: word
        name: policy-fail
        words:
          - "Policy-Fail"
