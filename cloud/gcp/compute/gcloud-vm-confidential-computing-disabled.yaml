id: gcloud-vm-confidential-computing-disabled

info:
  name: VM Instance Confidential Computing未启用（云安全）
  author: princechaddha
  severity: medium
  description: Confidential VM 可通过硬件支持的内存加密降低运行中数据被宿主环境窥探的风险；未启用时敏感工作负载缺少该保护层。本模板枚举虚拟机并检查 confidentialInstanceConfig.enableConfidentialCompute，值为 false 或缺失时报告未启用 Confidential Computing。
  impact: |
    - 高敏感工作负载在运行态缺少额外内存加密隔离，无法满足部分数据保护或合规要求。
    - 对受监管数据、密钥处理或隐私计算场景，实例安全保证低于组织期望基线。
  remediation: |
    - 对处理敏感数据的 VM 使用支持的机型创建 Confidential VM，并验证镜像、区域和性能影响。
    - 将 Confidential Computing 要求纳入实例模板和部署策略，对不适用实例保留明确例外。
  reference:
    - https://www.trendmicro.com/cloudoneconformity/knowledge-base/gcp/ComputeEngine/confidential-computing.html
    - https://cloud.google.com/compute/confidential-vm/docs/about-cvm
  metadata:
    vendor: google
    product: compute-engine
  tags: cloud,devops,gcp,gcloud,compute,security,confidential-computing,gcp-cloud-config

flow: |
  code(1)
  for(let projectId of iterate(template.projectIds)){
    set("projectId", projectId)
    code(2)
    for(let instance of iterate(template.instances)){
      instance = JSON.parse(instance)
      set("instanceName", instance.name)
      set("zone", instance.zone)
      code(3)
    }
  }

self-contained: true

code:
  - engine:
      - sh
      - bash
    source: |
      gcloud projects list --format="json(projectId)"

    extractors:
      - type: json
        name: projectIds
        internal: true
        json:
          - '.[].projectId'

  - engine:
      - sh
      - bash
    source: |
      gcloud compute instances list --project $projectId --format="json(name,zone.basename())"

    extractors:
      - type: json
        name: instances
        internal: true
        json:
          - '.[]'

  - engine:
      - sh
      - bash
    source: |
      gcloud compute instances describe $instanceName --zone $zone --project $projectId --format="json(confidentialInstanceConfig.enableConfidentialCompute)" | jq '. // "false"'

    matchers:
      - type: word
        words:
          - "false"

    extractors:
      - type: dsl
        dsl:
          - '"VM instance " + instanceName + " in zone " + zone + " of project " + projectId + " does not have Confidential Computing enabled"'
