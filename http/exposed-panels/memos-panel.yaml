id: memos-panel

info:
  name: Memos 面板识别（指纹识别）
  author: rxerium
  severity: info
  description: |-
    检测到目标站点存在 Memos 相关响应特征。Memos 是轻量级自托管笔记和时间线记录平台，用于保存备忘、标签、附件和个人知识片段。模板请求 `/`、`/explore` 路径，并通过页面标题或正文关键字、状态码确认该系统指纹，用于资产识别、系统盘点和暴露面梳理。
  reference:
    - https://github.com/usememos/memos
    - https://www.usememos.com/
  classification:
    cpe: cpe:2.3:a:usememos:memos:*:*:*:*:*:*:*:*
  metadata:
    verified: true
    max-request: 2
    vendor: usememos
    product: memos
    shodan-query:
      - title:"Memos"
      - http.title:"memos"
    fofa-query: title="memos"
    google-query: intitle:"memos"
  tags: panel,memos,detect,usememos,discovery
http:
  - method: GET
    path:
      - "{{BaseURL}}"
      - "{{BaseURL}}/explore"

    stop-at-first-match: true

    matchers-condition: and
    matchers:
      - type: word
        words:
          - '<title>Memos'

      - type: status
        status:
          - 200
