id: kasm-login-panel

info:
  name: Kasm 登录面板识别（指纹识别）
  author: lum8rjack
  severity: info
  description: |-
    检测到目标站点存在 Kasm 相关响应特征。Kasm 是监控、日志、分析或可观测性系统，用于展示运行指标、告警事件、日志数据和服务状态。模板使用模板内配置的路径集合发起请求，并通过页面标题或正文关键字、状态码确认该系统指纹，用于资产识别、系统盘点和暴露面梳理。
  reference:
    - https://kasmweb.com/
  classification:
    cvss-metrics: CVSS:3.0/AV:N/AC:L/PR:N/UI:N/S:U/C:N/I:N/A:N
    cwe-id: CWE-200
  metadata:
    verified: true
    max-request: 2
    shodan-query: http.favicon.hash:-2144699833
  tags: panel,kasm,login,detect,discovery
http:
  - raw:
      - |
        GET /#/login HTTP/1.1
        Host: {{Hostname}}
      - |
        POST /api/login_settings HTTP/1.1
        Host: {{Hostname}}
        Content-Type: application/json

        {"token":null,"username":null}

    stop-at-first-match: true

    matchers-condition: and
    matchers:
      - type: word
        part: body
        words:
          - '<title>Kasm</title>'
          - 'content="Kasm Server'
          - 'content="Kasm Technologies'
          - '"html_title": "Kasm'
        condition: or

      - type: status
        status:
          - 200
