id: syncthing-dashboard

info:
  name: Syncthing 仪表盘 暴露
  author: fabaff
  severity: medium
  description: |
    检测到 Syncthing 仪表盘 暴露。目标响应或文件中可能暴露配置、凭据、密钥、令牌、环境变量或历史记录等敏感信息，可能被用于进一步入侵。
  reference:
    - https://syncthing.net/
  classification:
    cpe: cpe:2.3:a:syncthing:syncthing:*:*:*:*:*:*:*:*
  metadata:
    verified: true
    max-request: 1
    vendor: syncthing
    product: syncthing
    shodan-query: http.html:'ng-app="syncthing"'
  tags: misconfig,syncthing,exposure,discovery

http:
  - method: GET
    path:
      - '{{BaseURL}}'

    host-redirects: true
    max-redirects: 2

    matchers-condition: and
    matchers:
      - type: word
        part: body
        words:
          - 'The Syncthing Authors.'
          - 'Actions'
        condition: and

      - type: status
        status:
          - 200
