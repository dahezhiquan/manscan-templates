id: azure-apim-secretkey

info:
  name: Azure APIM 密钥泄露（暴露面识别）
  author: israel comazzetto dos reis
  severity: info
  description: 检测到页面中疑似暴露了 Azure APIM 密钥。如果相关密钥、令牌或凭据仍然有效，攻击者可能借此访问关联服务、调用接口、读取数据，或进一步对目标环境发起横向利用。
  classification:
    cwe-id: CWE-522,CWE-540
  metadata:
    verified: true
    max-request: 1
    shodan-query: html:"Ocp-Apim-Subscription-Key"
  tags: azure,apim,microsoft,exposure,vuln

http:
  - method: GET
    path:
      - "{{BaseURL}}"

    matchers-condition: and
    matchers:
      - type: word
        part: body
        words:
          - '"Ocp-Apim-Subscription-Key":'

      - type: status
        status:
          - 200
