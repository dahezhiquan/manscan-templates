id: sonicwall-sslvpn-panel

info:
  name: SonicWall Virtual Office SSL VPN 登录面板暴露（暴露面识别）
  author: PR3R00T,johnk3r
  severity: medium
  description: SonicWall Virtual Office SSL VPN 是 SonicWall SSL VPN 门户，用于远程用户认证和内部资源访问。该模板请求 `/cgi-bin/welcome`，并依据页面标题、正文关键字或品牌资源特征、响应头特征判断目标是否对外暴露了 SonicWall Virtual Office SSL VPN 的登录面板，用于发现互联网可访问的后台、控制台或业务入口。
  impact: "- 暴露的 SonicWall Virtual Office SSL VPN 登录面板会泄露目标正在使用的产品、部署路径、页面特征或组织业务入口，便于攻击者进行指纹确认和漏洞匹配。\n- 如果认证、访问控制或默认凭据策略薄弱，攻击者可能进一步尝试进入后台，影响后台配置、业务数据、用户账号或设备运行状态。\n- 对互联网开放的管理入口会增加暴力破解、凭据填充、已知漏洞利用和钓鱼仿冒的攻击面。"
  remediation: "- 将 SonicWall Virtual Office SSL VPN 的登录面板限制在内网、VPN、零信任代理或专用管理网段访问，避免直接暴露在互联网。\n- 启用强密码、多因素认证、登录失败限制和审计告警，排查默认账号、弱口令及长期未使用账号。\n- 保持 SonicWall Virtual Office SSL VPN 及其依赖组件更新到受支持版本，并通过反向代理、ACL 或防火墙限制敏感路径访问。"
  classification:
    cvss-metrics: CVSS:3.0/AV:N/AC:L/PR:N/UI:N/S:U/C:N/I:N/A:N
    cwe-id: CWE-200
    cpe: cpe:2.3:o:sonicwall:sonicos:*:*:*:*:*:*:*:*
  metadata:
    max-request: 1
    vendor: sonicwall
    product: sonicos
    google-query: inurl:"auth.html" intitle:"sonicwall"
  tags: panel,sonicwall,discovery

http:
  - method: GET
    path:
      - "{{BaseURL}}/cgi-bin/welcome"

    matchers-condition: or
    matchers:
      - type: word
        words:
          - "<title>Virtual Office</title>"

      - type: word
        part: header
        words:
          - "SonicWALL SSLVPN Web Server"
          - "SonicWALL SSL-VPN Web Server"
        condition: or
