id: phpmyadmin-misconfiguration

info:
  name: phpMyAdmin 数据暴露
  author: pussycat0x
  severity: medium
  description: |
    该模板用于核查 phpMyAdmin 数据暴露。该类问题通常源于管理面板、仪表盘或监控控制台暴露在公网或缺少足够访问控制。模板会向目标发送探测请求，并依据请求 `/phpmyadmin/index.php?db=information_schema`、匹配 `status_code == 200`、匹配 `regex("var\\s+db\\s*=\\s*\'information_schema\'",body)`、匹配 `regex("var\\s+opendb_url\\s*=\\s*\'db_structure\\.php\'",body)`等证据确认目标是否存在该配置问题。
  impact: |
    - 攻击者可获取系统状态、业务指标、任务信息、拓扑结构或管理入口线索。
    - 若面板存在默认凭据、弱认证或操作接口，可能进一步导致未授权管理或服务接管。
  remediation: |
    - 将管理面板和仪表盘限制在内网、VPN 或可信访问网关后。
    - 启用强认证、多因素认证、细粒度授权和操作审计。
    - 隐藏或关闭不需要公开的默认面板，并监控异常访问与暴力探测。
  reference:
    - https://www.exploit-db.com/ghdb/6997
  classification:
    cvss-metrics: CVSS:3.0/AV:N/AC:L/PR:N/UI:N/S:U/C:L/I:N/A:N
    cvss-score: 5.3
    cwe-id: CWE-200
  metadata:
    max-request: 2
    vendor: phpmyadmin
    product: phpmyadmin
    shodan-query:
      - "http.title:phpMyAdmin"
      - http.title:"phpmyadmin"
      - http.component:"phpmyadmin"
      - cpe:"cpe:2.3:a:phpmyadmin:phpmyadmin"
    fofa-query:
      - body="pma_servername" && body="4.8.4"
      - title="phpmyadmin"
  tags: phpmyadmin,misconfig,edb,vuln


flow: http(1) || http(2)

http:
  - method: GET
    path:
      - "{{BaseURL}}/phpmyadmin/index.php?db=information_schema"

    matchers-condition: and
    matchers:
      - type: dsl
        dsl:
          - status_code == 200
          - regex("var\\s+db\\s*=\\s*\'information_schema\'",body)
          - regex("var\\s+opendb_url\\s*=\\s*\'db_structure\\.php\'",body)
        condition: and

      - type: dsl
        dsl:
          - 'contains(body, "name=\\\"login_form\\\"")'
          - 'contains(body, "id=\\\"input_username\\\"")'
        condition: and
        negative: true

  - method: GET
    path:
      - "{{BaseURL}}/phpMyAdmin/index.php?db=information_schema"

    matchers-condition: and
    matchers:
      - type: dsl
        dsl:
          - status_code == 200
          - regex("var\\s+db\\s*=\\s*\'information_schema\'",body)
          - regex("var\\s+opendb_url\\s*=\\s*\'db_structure\\.php\'",body)
        condition: and

      - type: dsl
        dsl:
          - 'contains(body, "name=\\\"login_form\\\"")'
          - 'contains(body, "id=\\\"input_username\\\"")'
        condition: and
        negative: true
