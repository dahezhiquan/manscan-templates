id: sendmail-postfix-execution-restrictions

info:
  name: Sendmail/Postfix 执行限制配置不当（本地基线扫描）
  author: songyaeji
  severity: medium
  description: |
    Sendmail/Postfix 执行限制配置不当会让邮件队列或邮件程序被非授权用户滥用，甚至在权限设置异常时形成命令执行或本地提权入口。模板检查 sendmail 是否缺少 `restrictqrun`，检查 `/usr/sbin/postfix` 权限是否符合预期，并检查相关二进制是否带有异常 SUID/SGID 位。
  impact: |
    - 本地用户可能滥用邮件队列执行能力或投递机制，绕过访问控制。
    - 邮件程序权限过宽或带特权位时，可能扩大到本地提权、垃圾邮件投递或持久化风险。
  remediation: |
    - 在 sendmail 配置中启用队列运行限制，例如 `restrictqrun`，并重新加载服务。
    - 收紧 Postfix/Sendmail 二进制权限，移除非必要 SUID/SGID 位，并确认仅授权用户可执行管理操作。
  reference:
    - https://isms.kisa.or.kr
  tags: local,linux,audit,sendmail,postfix,compliance

self-contained: true

code:
  - engine:
      - bash
    source: |
      if ! grep -qi 'restrictqrun' /etc/mail/sendmail.cf 2>/dev/null; then
        echo "[VULNERABLE] sendmail.cf missing 'restrictqrun'"
      else
        echo "[SAFE] restrictqrun option is set in sendmail.cf"
      fi

  - engine:
      - bash
    source: |
      if [ -x /usr/sbin/postfix ]; then
        PERM="$(stat -c '%A' /usr/sbin/postfix 2>/dev/null || echo '')"
        if [ "$PERM" != "-rwxr-x---" ]; then
          echo "[VULNERABLE] /usr/sbin/postfix permission is '$PERM' (expected -rwxr-x---)"
        else
          echo "[SAFE] postfix binary permission is correct"
        fi
      fi

  - engine:
      - bash
    source: |
      if getent group postfix >/dev/null 2>&1; then
        MEMBERS="$(getent group postfix | awk -F ':' '{print $4}')"
        echo "$MEMBERS" | grep -qw root || echo "[VULNERABLE] 'root' not in 'postfix' group"
      fi

    matchers:
      - type: word
        name: restrictqrun
        part: code_1_response
        words:
          - "[VULNERABLE]"

      - type: word
        name: postfix-permission
        part: code_2_response
        words:
          - "[VULNERABLE]"

      - type: word
        name: postfix-group
        part: code_3_response
        words:
          - "[VULNERABLE]"
