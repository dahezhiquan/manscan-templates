id: safenet-authentication-panel

info:
  name: SafeNet Authentication 登录面板识别（指纹识别）
  author: righettod
  severity: info
  description: |-
    SafeNet Authentication 是 Thales/SafeNet 身份认证平台，用于多因素认证、令牌和访问控制管理。该模板请求 `/selfenrollment/Enrollment.aspx` 路径，并依据 DSL 条件识别目标是否部署了该系统或暴露了对应入口，适用于资产指纹确认；命中结果仅表示系统特征匹配，不代表已确认存在未授权访问或可利用漏洞。
  reference:
  - https://cpl.thalesgroup.com/access-management/safenet-trusted-access
  metadata:
    verified: true
    max-request: 1
    shodan-query: http.title:"Self Enrollment"
  tags: panel,safenet,thales,login,detect,discovery

http:
  - method: GET
    path:
      - "{{BaseURL}}/selfenrollment/Enrollment.aspx"

    matchers:
      - type: dsl
        dsl:
          - 'status_code == 200'
          - 'contains(to_lower(body), "self enrollment") && contains_any(to_lower(body), "safenet", "thales")'
        condition: and

    extractors:
      - type: regex
        part: body
        group: 1
        regex:
          - 'V=([0-9.]+)'
