id: lansweeper-login

info:
  name: Lansweeper 登录面板识别（指纹识别）
  author: divya_mudgal
  severity: info
  description: |-
    检测到目标站点存在 Lansweeper 相关响应特征。Lansweeper 是监控、日志、分析或可观测性系统，用于展示运行指标、告警事件、日志数据和服务状态。模板请求 `/login.aspx`，并通过页面标题或正文关键字、状态码确认该系统指纹，用于资产识别、系统盘点和暴露面梳理。
  classification:
    cvss-metrics: CVSS:3.0/AV:N/AC:L/PR:N/UI:N/S:U/C:N/I:N/A:N
    cwe-id: CWE-200
    cpe: cpe:2.3:a:lansweeper:lansweeper:*:*:*:*:*:*:*:*
  metadata:
    verified: true
    max-request: 1
    vendor: lansweeper
    product: lansweeper
    shodan-query:
      - title:"Lansweeper - Login"
      - http.title:"lansweeper - login"
    fofa-query: title="lansweeper - login"
    google-query: intitle:"lansweeper - login"
  tags: lansweeper,tech,panel,discovery
http:
  - method: GET
    path:
      - "{{BaseURL}}/login.aspx"

    matchers-condition: and
    matchers:
      - type: word
        name: login
        words:
          - "Lansweeper - Login"

      - type: status
        status:
          - 200

    extractors:
      - type: regex
        part: body
        group: 1
        regex:
          - '"\/js\/CustomControls\.js\?([0-9.]+)" type="text\/javascript"'
