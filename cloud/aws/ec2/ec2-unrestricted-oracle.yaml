id: ec2-unrestricted-oracle
info:
  name: EC2 安全组对公网开放 Oracle 数据库端口（云安全）
  author: princechaddha
  severity: critical
  description: EC2 安全组对公网开放 Oracle 数据库端口是一类数据库服务暴露风险，TCP 1521 面向任意来源会增加数据库探测、凭据爆破和漏洞利用风险。Oracle 数据库通常应仅允许应用私有网段或受控运维入口访问。模板通过 `describe-security-groups` 筛选 1521 端口且来源为 `0.0.0.0/0` 的入站规则，并输出命中的安全组 ID。
  impact: |
    - 暴露的 Oracle 服务可能被互联网扫描、爆破或利用，导致数据库访问权限被滥用。
    - 数据库中敏感业务数据可能被读取、篡改或删除，影响业务连续性和合规。
  remediation: |
    - 移除面向公网的 1521 端口入站规则，仅允许必要应用或运维网络访问。
    - 强化数据库账号、补丁、审计和传输加密，避免数据库端口直接暴露。
  reference:
    - https://docs.aws.amazon.com/AWSEC2/latest/UserGuide/security-group-rules-reference.html
  metadata:
    vendor: amazon
    product: ec2
  tags: cloud,devops,aws,amazon,ec2,aws-cloud-config

variables:
  region: "us-east-1"

self-contained: true
code:
  - engine:
      - sh
      - bash
    source: |
      aws ec2 describe-security-groups --region $region --filters Name=ip-permission.from-port,Values=1521 Name=ip-permission.to-port,Values=1521 Name=ip-permission.cidr,Values='0.0.0.0/0' --query 'SecurityGroups[*].GroupId' --output json

    extractors:
      - type: json
        name: securitygroup
        internal: true
        json:
          - '.[]'

      - type: dsl
        dsl:
          - 'securitygroup + " security group(s) alows unrestricted access (0.0.0.0/0 or ::/0) on TCP port 1521"'
