id: fubo-phish

info:
  name: FuboTV 仿冒钓鱼网站（钓鱼网站识别）
  author: rxerium
  severity: info
  description: |
    检测到疑似仿冒 FuboTV 的钓鱼网站。模板在目标页面返回 200、页面内容命中 FuboTV 的品牌页面特征，且当前主机不属于 fubo.tv 官方域名时触发，用于识别借用 FuboTV 品牌页面诱导用户信任的仿冒站点。
  reference:
    - https://fubo.tv
  metadata:
    max-request: 1
  tags: phishing,fubo,streaming,osint,discovery
http:
  - method: GET
    path:
      - "{{BaseURL}}"

    host-redirects: true
    max-redirects: 2

    matchers-condition: and
    matchers:
      - type: word
        words:
          - "Watch ABC, CBS, FOX, ESPN and other top channels live - without cable TV. On your phone, TV and more. No contract. DVR included."

      - type: status
        status:
          - 200

      - type: dsl
        dsl:
          - '!contains(host,"fubo.tv")'
