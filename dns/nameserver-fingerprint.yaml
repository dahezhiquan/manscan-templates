id: nameserver-fingerprint

info:
  name: NS 记录识别（dns）
  author: pdteam
  severity: info
  description: |
    该模板检测域名的 NS 记录。NS 记录用于指定负责该域名或子域名解析的权威名称服务器。
  classification:
    cwe-id: CWE-200
  metadata:
    max-request: 1
  tags: dns,ns,discovery

dns:
  - name: "{{FQDN}}"
    type: NS
    matchers:
      - type: regex
        part: answer
        regex:
          - "IN\tNS\\t(.+)$"

    extractors:
      - type: regex
        group: 1
        regex:
          - "IN\tNS\t(.+)"
