id: gcloud-secure-cors-configuration

info:
  name: Secure CORS Configuration 的Cloud Storage Buckets（云安全）
  author: princechaddha
  severity: medium
  description: Cloud Storage CORS 配置决定哪些浏览器源可跨域访问 bucket，对外提供 Web 资源时应明确限制允许来源。本模板检查 cors_config[].origin，返回 null 时报告 CORS 未设置或来源配置不符合预期。
  impact: |
    - CORS 配置缺失可能导致合法 Web 客户端无法安全访问资源，或因后续临时放宽配置引入风险。
    - 来源控制不清晰会增加跨域访问误配、数据暴露和前端集成问题。
  remediation: |
    - 为需要跨域访问的 bucket 配置明确的 CORS origins、methods 和 headers，避免使用过宽来源。
    - 对不需要浏览器跨域访问的 bucket 保持无 CORS 配置，并通过应用层或受控代理访问。
  reference:
    - https://cloud.google.com/storage/docs/configuring-cors
  metadata:
    vendor: google
    product: cloud-storage
  tags: cloud,devops,gcp,gcloud,google-cloud-storage,cors,security,gcp-cloud-config

flow: |
  code(1)
  for(let projectId of iterate(template.projectIds)){
    set("projectId", projectId)
    code(2)
    for(let bucketName of iterate(template.buckets)){
      set("bucketName", bucketName)
      code(3)
    }
  }

self-contained: true

code:
  - engine:
      - sh
      - bash
    source: |
      gcloud projects list --format="json(projectId)"

    extractors:
      - type: json
        name: projectIds
        internal: true
        json:
          - '.[].projectId'

  - engine:
      - sh
      - bash
    source: |
      gcloud storage buckets list --project $projectId --format="json(name)"

    extractors:
      - type: json
        name: buckets
        internal: true
        json:
          - '.[].name'

  - engine:
      - sh
      - bash
    source: |
      gcloud storage buckets describe gs://$bucketName --format="json(cors_config[].origin)" | jq -r '.[]? // "null"'

    matchers:
      - type: word
        words:
          - 'null'

    extractors:
      - type: dsl
        dsl:
          - '"The CORS configuration for the bucket " + bucketName + " in project " + projectId + " is either not set or includes unauthorized origins."'
