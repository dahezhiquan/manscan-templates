id: allegro-rompager-panel

info:
  name: Allegro RomPager 面板（指纹识别）
  author: matejsmycka
  severity: info
  description: |-
    检测到目标站点存在 Allegro RomPager 相关响应特征。Allegro RomPager 是网络设备或网关的 Web 管理界面，用于配置路由、无线、蜂窝接入、端口转发和设备运维参数。模板请求 `/`，并通过页面标题或正文关键字、状态码确认该系统指纹，用于资产识别、系统盘点和暴露面梳理。
  reference:
    - http://rompager.com
  metadata:
    verified: true
    shodan-query: product:"Allegro RomPager"
  tags: tech,allegro,rompager,panel,login,discovery
http:
  - method: GET
    path:
      - "{{BaseURL}}"

    host-redirects: true
    max-redirects: 2

    matchers-condition: and
    matchers:
      - type: word
        part: server
        words:
          - "Allegro-Software-RomPager/"

      - type: status
        status:
          - 200

    extractors:
      - type: regex
        name: version
        part: header
        group: 1
        regex:
          - "RomPager/([\\d\\.]+)"
