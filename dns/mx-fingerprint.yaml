id: mx-fingerprint

info:
  name: MX 记录识别（dns）
  author: pdteam
  severity: info
  description: |
    MX 记录指定负责接收域名邮件的邮件交换服务器，是识别邮件基础设施、投递路径和第三方邮件托管关系的重要 DNS 信息。公开 MX 记录是邮件系统正常工作所需的配置，不代表存在漏洞。本模板查询 MX 记录，匹配 `IN MX` 响应并提取优先级和目标服务器。
  impact: |
    - MX 主机名会暴露邮件服务商、区域和网关入口，帮助攻击者规划邮件钓鱼、口令攻击和服务枚举。
    - 过期或错误的 MX 记录可能导致邮件投递失败、邮件流向非预期服务，甚至使组织无法接收安全告警和账户恢复邮件。
  remediation: |
    - 仅保留当前使用的 MX 服务器，按邮件服务商建议设置优先级，并在迁移后及时删除旧记录。
    - 对邮件网关启用强认证、反滥用策略和来源限制，并结合 SPF、DKIM、DMARC 验证发件身份。
    - 定期从外部视角核对 MX、邮件路由和业务资产台账的一致性。
  reference:
    - https://www.cloudflare.com/learning/dns/dns-records/dns-mx-record/
    - https://mxtoolbox.com/
  classification:
    cwe-id: CWE-200
  metadata:
    max-request: 1
  tags: dns,mx,discovery

dns:
  - name: "{{FQDN}}"
    type: MX
    matchers:
      - type: regex
        part: answer
        regex:
          - "IN\tMX\\t(.+)$"

    extractors:
      - type: regex
        group: 1
        regex:
          - "IN\tMX\t(.+)"
