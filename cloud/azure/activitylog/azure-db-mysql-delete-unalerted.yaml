id: azure-db-mysql-delete-unalerted
info:
  name: Azure MySQL 数据库删除告警未配置（云安全）
  author: princechaddha
  severity: high
  description: MySQL 数据库删除操作未配置 Activity Log 告警时，数据库被误删或被滥用权限删除可能无法及时发现。该模板枚举已启用的 Activity Log Alert，并检查 condition 是否缺少 Microsoft.DBforMySQL/servers/databases/delete 操作条件。
  impact: |
    - 攻击者或误操作删除数据库后，安全团队可能无法及时触发阻断和恢复流程。
    - 缺少删除审计告警会延长数据不可用时间，并增加数据恢复和责任追踪难度。
  remediation: |
    - 创建针对 MySQL 数据库删除操作的 Azure Monitor Activity Log Alert，并绑定安全团队的 Action Group。
    - 同步配置数据库备份、删除保护和告警升级流程，确保删除事件可被及时遏制和恢复。
  reference:
    - https://docs.microsoft.com/en-us/azure/azure-monitor/platform/alerts-activity-log
  metadata:
    vendor: microsoft
    product: azure-monitor
  tags: cloud,devops,azure,microsoft,mysql,azure-cloud-config

flow: |
  code(1);
  for (let AlertData of iterate(template.alertList)) {
    set("id", AlertData);
    code(2);
  }

self-contained: true
code:
  - engine:
      - sh
      - bash
    source: |
      az monitor activity-log alert list --output json --query '[?(enabled==`true`)].id'

    extractors:
      - type: json
        name: alertList
        internal: true
        json:
          - '.[]'

  - engine:
      - sh
      - bash
    source: |
      az monitor activity-log alert show --ids "$id" --query 'condition'

    matchers-condition: and
    matchers:
      - type: word
        words:
          - '"field": "operationName"'

      - type: word
        words:
          - "Microsoft.DBforMySQL/servers/databases/delete"
        negative: true

    extractors:
      - type: dsl
        dsl:
          - 'id + " does not have the correct alert configuration for Delete MySQL Database events"'
