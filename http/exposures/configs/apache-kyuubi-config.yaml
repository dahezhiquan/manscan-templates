id: apache-kyuubi-config

info:
  name: Apache Kyuubi 配置暴露（暴露面识别）
  author: icarot
  severity: medium
  description: |
    检测到对外可访问的 Ap。这类配置资源可能包含部署细节、访问凭据、内部地址、组件版本或调试开关，公开暴露后会显著增加被侦察和后续利用的风险。
  classification:
    cpe: cpe:2.3:a:apache:kyuubi:*:*:*:*:*:*:*:*
  metadata:
    max-request: 1
    vendor: apache
    product: kyuubi
  tags: config,exposure,kyuubi,apache,vuln

http:
  - method: GET
    path:
      - "{{BaseURL}}/engine-ui/0.0.0.0:4040/environment/"

    matchers-condition: and
    matchers:
      - type: word
        words:
          - 'Environment</title>'
          - 'kyuubi'
        condition: and

      - type: status
        status:
          - 200
