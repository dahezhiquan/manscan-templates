id: azure-vm-web-tier-disk-unencrypted
info:
  name: Azure VM Web-Tier Disk Volumes 未Encrypted（云安全）
  author: princechaddha
  severity: high
  description: Web Tier VM 的磁盘可能保存网站代码、配置、访问日志和本地凭据；未启用磁盘加密时，获得磁盘介质、快照或备份访问权的主体可能离线读取数据。本模板筛选 web_tier_tag 为约定值的虚拟机，执行磁盘加密查询，并在标准错误中匹配 Azure Disk Encryption is not enabled 时报告。
  impact: |
    - 网站源码、连接字符串、会话材料和日志泄露后，攻击者可能获取应用凭据并进一步进入后端或云资源。
    - 未加密磁盘还会增加快照共享、备份复制和主机退役过程中的数据泄露风险。
  remediation: |
    - 为 Web Tier VM 的操作系统和数据磁盘启用 Azure Disk Encryption 或适用的服务器端加密。
    - 审计快照、备份、镜像和 Storage 访问权限，完成加密后轮换可能已暴露的应用密钥并持续验证状态。
  reference:
    - https://docs.microsoft.com/en-us/azure/virtual-machines/linux/encrypt-disks
  metadata:
    vendor: microsoft
    product: azure-virtual-machines
  tags: cloud,devops,azure,microsoft,azure-vm,azure-cloud-config

flow: |
  code(1);
  for (let VmData of iterate(template.vmList)) {
    VmData = JSON.parse(VmData);
    set("ids", VmData.Id);
    code(2);
  }

self-contained: true
code:
  - engine:
      - sh
      - bash
    source: |
      az vm list --query '[?(tags.web_tier_tag == "web_tier_tag_value")].{"Id":id}'

    extractors:
      - type: json
        name: vmList
        internal: true
        json:
          - '.[]'

  - engine:
      - sh
      - bash
    source: |
      az vm encryption show --ids "$ids" --query 'disks'

    matchers-condition: and
    matchers:
      - type: word
        part: stderr
        words:
          - 'Azure Disk Encryption is not enabled'

    extractors:
      - type: dsl
        dsl:
          - 'ids + " in " + " is not encrypted"'
