id: eks-aws-managed-iam-policy

info:
  name: EKS 集群角色未使用推荐 AWS 托管策略（云安全）
  author: princechaddha
  severity: high
  description: EKS 集群角色未使用推荐 AWS 托管策略是一类集群控制面 IAM 权限配置风险，集群可能缺少 AWS 维护的必要权限边界和服务集成权限。错误或自定义不完整的角色策略可能导致集群管理 AWS 资源失败，也可能引入过宽授权。模板枚举 EKS 集群并读取 `cluster.roleArn`，再检查该角色附加策略中是否缺少 `arn:aws:iam::aws:policy/AmazonEKSClusterPolicy`。
  impact: |
    - 集群控制面可能无法正常管理所需 AWS 资源，影响集群创建、升级或运行稳定性。
    - 自定义策略若过宽或长期未维护，可能增加 EKS 控制面角色被滥用的影响范围。
  remediation: |
    - 为 EKS 集群 IAM 角色附加 AWS 推荐的 `AmazonEKSClusterPolicy`，并移除不必要的过宽权限。
    - 定期审计集群角色的附加策略和信任策略，确保权限满足服务需求且不过度授权。
  reference:
    - https://www.trendmicro.com/cloudoneconformity/knowledge-base/aws/EKS/eks-aws-managed-iam-policy.html
    - https://docs.aws.amazon.com/eks/latest/userguide/service_IAM_role.html
  metadata:
    vendor: amazon
    product: eks
  tags: cloud,devops,aws,amazon,eks,aws-cloud-config

variables:
  region: "us-east-1"

flow: |
  code(1)
  for(let cluster of iterate(template.clusters)){
    set("cluster", cluster)
    code(2)
    code(3)
  }

self-contained: true

code:
  - engine:
      - sh
      - bash
    source: |
      aws eks list-clusters --region $region --query 'clusters' --output json

    extractors:
      - type: json
        name: clusters
        internal: true
        json:
          - '.[]'

  - engine:
      - sh
      - bash
    source: |
      aws eks describe-cluster --region $region --name $cluster --query 'cluster.roleArn' --output json

    extractors:
      - type: json
        name: rolearn
        internal: true
        json:
          - '.'

  - engine:
      - sh
      - bash
    source: |
      aws iam list-attached-role-policies --role-name $(echo $rolearn | cut -d'/' -f2) --query 'AttachedPolicies[*].PolicyArn' --output json

    matchers-condition: and
    matchers:
      - type: word
        words:
          - "arn:aws:iam::aws:policy/AmazonEKSClusterPolicy"
        negative: true

      - type: word
        words:
          - "["

    extractors:
      - type: dsl
        dsl:
          - '"EKS cluster " + cluster + " does not have AmazonEKSClusterPolicy attached to its IAM role"'
