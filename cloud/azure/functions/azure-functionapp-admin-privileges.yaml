id: azure-functionapp-admin-privileges
info:
  name: Azure Functions 托管身份被授予高危管理角色（云安全）
  author: princechaddha
  severity: medium
  description: Azure Functions 可使用用户分配的托管身份访问 Microsoft Entra ID 保护的 Azure 资源，无需在代码中保存长期凭据。本模板枚举函数应用的用户分配身份及其角色分配，并在发现 Owner、Contributor、User Access Administrator 或 Role Based Access Control Administrator 角色时报告，表示应用身份超出常规运行所需的最小权限范围。
  impact: |
    - 函数代码、依赖包或运行环境被利用后，攻击者可能取得托管身份令牌并继承高危角色权限。
    - 受影响身份可能被用于修改资源、读取敏感数据、创建持久化权限或进一步控制订阅中的其他服务。
  remediation: |
    - 删除函数应用不需要的 Owner、Contributor、User Access Administrator 和 Role Based Access Control Administrator 角色。
    - 将必要权限收敛到具体资源和操作范围，按应用或环境拆分托管身份，并通过 PIM 或定期权限审计管理临时高权。
  reference:
    - https://docs.microsoft.com/en-us/azure/azure-functions/functions-reference
  metadata:
    vendor: microsoft
    product: azure-functions
  tags: cloud,devops,azure,microsoft,functionapp,azure-cloud-config

flow: |
  code(1);
  for (let functionName of iterate(template.functionNames)) {
    AppData = JSON.parse(functionName);
    set("functionName", AppData.name)
    set("resourceGroup", AppData.resourceGroup)
    code(2);
    for (let assignee of iterate(template.assignees)) {
      set("assignee", assignee)
      code(3)
    }
  }

self-contained: true
code:
  - engine:
      - sh
      - bash
    source: |
      az functionapp list --query '[*].{name:name, resourceGroup:resourceGroup}' --output json

    extractors:
      - type: json
        name: functionNames
        internal: true
        json:
          - '.[]'

  - engine:
      - sh
      - bash
    source: |
      az functionapp show --name $functionName --resource-group $resourceGroup --query 'identity.userAssignedIdentities' --output json

    extractors:
      - type: json
        name: assignees
        internal: true
        json:
          - '.[].principalId'

  - engine:
      - sh
      - bash
    source: |
      az role assignment list --assignee $assignee --all --output json

    matchers:
      - type: word
        words:
          - 'Owner'
          - 'Contributor'
          - 'User Access Administrator'
          - 'Role Based Access Control Administrator'

    extractors:
      - type: json
        name: roleAssignments
        internal: true
        json:
          - '.[].roleDefinitionName'

      - type: dsl
        dsl:
          - 'functionName + " has admin privileges with role " + roleAssignment + " in resource group " + resourceGroup'
