id: jdwp-detect

info:
  name: Java Debug Wire 协议识别（指纹识别）
  author: johnk3r
  severity: info
  description: |
    Java Debug Wire Protocol（JDWP）是 JVM 远程调试协议，通常只应在受控排障环境中短期开启。该模板通过精确的 `JDWP-Handshake` 应答确认调试服务，并请求 `VirtualMachine.Version`；仅在回复报文及字段长度有效时提取 JVM 版本，不依赖固定的描述文案。
  impact: |
    - JDWP 调试端口通常不应暴露在生产或不可信网络中；若未配置额外访问控制，攻击者可能读取运行时信息并进一步操控 JVM。
    - 公开 JDWP 接口可被用于执行调试命令、加载类或触发应用级代码执行，进而影响主机和业务系统安全。
  remediation: |
    - 关闭生产环境中的 JDWP 调试参数，或仅在临时排障期间启用。
    - 如确需远程调试，应绑定到本地或专用管理网段，并通过防火墙、VPN 或堡垒机限制访问来源。
    - 排查是否存在异常调试连接，并在关闭暴露端口后重启相关 Java 进程使配置生效。
  reference:
    - https://www.wiz.io/blog/exposed-jdwp-exploited-in-the-wild
  metadata:
    verified: true
    shodan-query: product:"Java Debug Wire Protocol"
  tags: network,jdwp,tcp,detect,discovery

javascript:
  - code: |
      const net = require("nuclei/net");
      const conn = net.Open("tcp", `${Host}:${Port}`);
      conn.SetTimeout(3);

      function readHex(size) {
        if (size === 0) return "";
        const buffer = bytes.NewBuffer();
        buffer.Write(conn.RecvFull(size));
        const value = buffer.Hex();
        if (value.length !== size * 2) throw new Error("incomplete JDWP packet");
        return value;
      }

      function uint32(hex, offset) {
        return parseInt(hex.substring(offset * 2, offset * 2 + 8), 16);
      }

      function vmVersion(body) {
        let offset = 0;
        function readString() {
          if (offset + 4 > body.length / 2) return null;
          const length = uint32(body, offset);
          offset += 4;
          if (offset + length > body.length / 2) return null;
          let value = "";
          for (let i = 0; i < length; i++) {
            value += String.fromCharCode(parseInt(body.substring((offset + i) * 2, (offset + i) * 2 + 2), 16));
          }
          offset += length;
          return value;
        }

        if (readString() === null || offset + 8 > body.length / 2) return null;
        offset += 8; // JDWP major/minor fields precede the JVM version.
        const version = readString();
        if (version === null || readString() === null || offset !== body.length / 2) return null;
        return /^[\x20-\x7e]{1,256}$/.test(version) ? version : null;
      }

      let evidence = "";
      try {
        conn.Send("JDWP-Handshake");
        if (conn.RecvFullString(14) === "JDWP-Handshake") {
          evidence = "JDWP-Handshake";
          try {
            conn.SendHex("0000000b00000001000101");
            for (let i = 0; i < 4; i++) {
              const header = readHex(11);
              const length = uint32(header, 0);
              if (length < 11 || length > 65536) break;
              const body = readHex(length - 11);
              const id = uint32(header, 4);
              const flags = parseInt(header.substring(16, 18), 16);
              if (flags === 0x80 && id === 1) {
                if (header.substring(18, 22) === "0000") {
                  const version = vmVersion(body);
                  if (version !== null) evidence += "\nJVM version: " + version;
                }
                break;
              }
              if (flags !== 0x00 && flags !== 0x80) break;
            }
          } catch (error) {
            // A failed version query does not invalidate the completed handshake.
          }
        }
      } finally {
        conn.Close();
      }
      Export(evidence);

    args:
      Host: "{{Host}}"
      Port: 5005

    matchers:
      - type: regex
        part: response
        regex:
          - '^JDWP-Handshake(?:\nJVM version: [^\r\n]+)?$'

    extractors:
      - type: regex
        name: jdwp-version
        part: response
        group: 1
        regex:
          - '(?m)^JVM version: ([^\r\n]+)$'
