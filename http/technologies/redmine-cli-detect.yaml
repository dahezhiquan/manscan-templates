id: redmine-cli-detect

info:
  name: Redmine CLI Configuration File 指纹识别（指纹识别）
  author: geeknik
  severity: info
  description: 用于识别目标是否使用 Redmine CLI Configuration File，模板会结合页面正文、状态码和特定路径或已知端点进行技术指纹匹配。
  metadata:
    max-request: 1
  tags: tech,redmine,discovery

http:
  - method: GET
    path:
      - "{{BaseURL}}/.redmine-cli"

    matchers-condition: and
    matchers:
      - type: word
        part: body
        words:
          - "default"
          - "my_id"
          - "root_url"
        condition: and

      - type: status
        status:
          - 200
