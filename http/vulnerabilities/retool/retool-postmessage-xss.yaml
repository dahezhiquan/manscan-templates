id: retool-postmessage-xss

info:
  name: Retool Self-Hosted - postMessage 跨站脚本 via Custom Component Collections
  author: DhiyaneshDk
  severity: high
  description: |
    该模板用于检测 Retool Self-Hosted - postMessage 跨站脚本 via Custom Component Collections。该类漏洞通常源于页面将用户可控输入未经过滤或编码后写入响应，导致浏览器执行非预期脚本。模板会向 `/custom-component-collections.html`、`/{{js-bundle}}` 等位置发送探测请求，并结合响应状态、关键字、错误信息、时间差或外带交互等证据判断目标是否受影响。
  impact: |
    - 攻击者可诱导用户访问恶意链接，在受害者浏览器中执行脚本。
    - 成功利用后可能窃取会话信息、篡改页面内容、发起越权操作，或作为进一步钓鱼与权限提升的攻击链环节。
  remediation: |
    - 对输出到 HTML、属性、JavaScript、URL 等不同上下文的数据分别进行安全编码。
    - 对输入参数进行白名单校验，并避免直接回显未经处理的用户输入。
    - 启用合适的 Content-Security-Policy，降低脚本注入后的利用效果。
  reference:
    - https://docs.retool.com/releases
    - https://docs.retool.com/changelog/disclosures/custom-component-xss
  metadata:
    max-request: 2
    vendor: retool
    product: retool
    shodan-query: title:"Retool"
    fofa-query: title="Retool"
  tags: retool,xss,postmessage,vuln

http:
  - method: GET
    path:
      - "{{BaseURL}}/custom-component-collections.html"

    matchers:
      - type: dsl
        dsl:
          - 'status_code == 200'
          - 'contains_all(body, "Custom Component", "custom-component-collections")'
        condition: and
        internal: true

    extractors:
      - type: regex
        name: js-bundle
        part: body
        group: 1
        regex:
          - '["'']/?(libs/custom-component-collections[^"'']+\.js)["'']'
        internal: true

  - method: GET
    path:
      - "{{BaseURL}}/{{js-bundle}}"

    matchers:
      - type: dsl
        dsl:
          - 'status_code == 200'
          - 'contains_all(body, "customComponentCode", "data:text/javascript", "addEventListener(\"message\"")'
        condition: and
