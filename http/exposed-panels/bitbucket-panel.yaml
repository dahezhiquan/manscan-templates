id: bitbucket-panel

info:
  name: Bitbucket 面板识别（暴露面识别）
  author: Shivam Kamboj
  severity: info
  description: |
    该模板通过识别 Bitbucket 面板、控制台或管理界面的页面特征，判断目标是否暴露了对应服务入口。若命中，说明该后台或运维界面对外可访问，可用于资产识别与暴露面排查。
  reference:
    - https://bitbucket.org/
    - https://www.atlassian.com/software/bitbucket
  metadata:
    verified: true
    max-request: 2
    vendor: atlassian
    product: bitbucket
    shodan-query:
      - http.title:"Bitbucket"
      - http.component:"Atlassian Bitbucket"
    fofa-query:
      - title="Bitbucket"
      - body="atlassian-token"
    google-query: intitle:"Bitbucket" inurl:"/login"
  tags: panel,bitbucket,login,detect,discovery

http:
  - method: GET
    path:
      - "{{BaseURL}}/login"
      - "{{BaseURL}}"

    stop-at-first-match: true
    host-redirects: true
    max-redirects: 2
    matchers:
      - type: dsl
        dsl:
          - 'contains_any(body, "com.atlassian.bitbucket.server", "/download/contextbatch/css/bitbucket.page", "/download/contextbatch/js/bitbucket", "bitbucket-webpack-INTERNAL", "bitbucket-header-logo", "bitbucket-theme")'
          - 'status_code == 200 || status_code == 302'
        condition: and
