id: fuelcms-panel

info:
  name: Fuel CMS 登录面板识别（暴露面识别）
  author: Adam Crosser
  severity: info
  description: 该模板通过识别 Fuel CMS 登录入口的页面标题、特征文本或重定向行为，判断目标是否暴露了对应的认证界面。若命中，说明该登录面板对外可访问，可用于暴露面梳理与后续安全评估。
  classification:
    cvss-metrics: CVSS:3.0/AV:N/AC:L/PR:N/UI:N/S:U/C:N/I:N/A:N
    cwe-id: CWE-200
    cpe: cpe:2.3:a:daylightstudio:fuel_cms:*:*:*:*:*:*:*:*
  metadata:
    max-request: 1
    vendor: daylightstudio
    product: fuel_cms
    shodan-query: http.title:"fuel cms"
    fofa-query: title="fuel cms"
    google-query: intitle:"fuel cms"
  tags: panel,fuelcms,oss,daylightstudio,discovery

http:
  - method: GET
    path:
      - "{{BaseURL}}/fuel/login"

    matchers-condition: and
    matchers:
      - type: word
        part: body
        words:
          - "<title>FUEL CMS</title>"

      - type: status
        status:
          - 200
