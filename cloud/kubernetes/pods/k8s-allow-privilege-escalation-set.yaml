id: k8s-allow-privilege-escalation-set

info:
  name: Containers run 使用allowPrivilegeEscalation enabled（云安全）
  author: princechaddha
  severity: critical
  description: allowPrivilegeEscalation 为 true 会允许容器进程通过 setuid、文件能力等方式提升权限，不符合受限 Pod 安全基线。本模板枚举 Pod 容器 securityContext，发现 allowPrivilegeEscalation 为 true 时报告。
  impact: |
    - 应用漏洞被利用后，攻击者可能在容器内提升权限并扩大对挂载卷或进程的控制。
    - 与额外 capabilities 或 root 用户结合时，容器逃逸和节点侧影响风险更高。
  remediation: |
    - 将 allowPrivilegeEscalation 设置为 false，并移除不必要的 setuid 文件和 Linux capabilities。
    - 通过 Pod Security Admission restricted 配置或策略引擎强制该设置。
  reference:
    - https://kubernetes.io/docs/tasks/configure-pod-container/security-context/
  metadata:
    vendor: kubernetes
    product: kubernetes
  tags: cloud,devops,kubernetes,security,devsecops,containers,k8s-cluster-security
flow: |
  code(1);
  for (let container of template.items) {
    set("container", container)
    javascript(1);
  }

self-contained: true
code:
  - engine:
      - sh
      - bash
    source: kubectl get pods --all-namespaces --output=json
    extractors:
      - type: json
        name: items
        internal: true
        json:
          - '.items[] | {pod: .metadata.name, containers: .spec.containers}'

javascript:
  - code: |
        let podData = JSON.parse(template.container);
        podData.containers.forEach(container => {
          if (container.securityContext && container.securityContext.allowPrivilegeEscalation === true) {
            let result = (`Container '${container.name}' in pod '${podData.pod}' running with allowPrivilegeEscalation enabled.`);
            Export(result);
          }
        });


    extractors:
      - type: dsl
        dsl:
          - response
