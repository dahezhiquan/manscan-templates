id: gcloud-gke-intranode-visibility-disabled

info:
  name: GKE Clusters 未启用Intranode Visibility已启用（云安全）
  author: princechaddha
  severity: medium
  description: GKE Intranode Visibility 可让同一节点上 Pod 之间的流量进入 VPC 网络可观测路径，便于审计和检测。本模板枚举集群并检查 networkConfig.enableIntraNodeVisibility，字段为空时报告未启用节点内流量可见性。
  impact: |
    - 同节点 Pod 间通信可能缺少统一的流量日志和安全分析视角，影响横向移动检测。
    - 网络排障和微隔离策略验证会出现可见性盲区。
  remediation: |
    - 为需要网络审计的 GKE 集群启用 Intranode Visibility，并评估对性能和日志成本的影响。
    - 结合 VPC Flow Logs、Network Policy 和监控告警完善集群内部流量治理。
  reference:
    - https://cloud.google.com/kubernetes-engine/docs/how-to/intranode-visibility
    - https://www.trendmicro.com/cloudoneconformity/knowledge-base/gcp/GKE/enable-intranode-visibility.html
  metadata:
    vendor: google
    product: google-kubernetes-engine
  tags: cloud,devops,gcp,gcloud,gke,kubernetes,security,networking,visibility,gcp-cloud-config

flow: |
  code(1)
  for(let projectId of iterate(template.projectIds)){
    set("projectId", projectId)
    code(2)
    for(let cluster of iterate(template.clusters)){
      cluster = JSON.parse(cluster)
      set("clusterName", cluster.name)
      set("location", cluster.location)
      code(3)
    }
  }

self-contained: true

code:
  - engine:
      - sh
      - bash
    source: |
      gcloud projects list --format="json(projectId)"

    extractors:
      - type: json
        name: projectIds
        internal: true
        json:
          - '.[].projectId'

  - engine:
      - sh
      - bash
    source: |
      gcloud container clusters list --project $projectId --format="json(name,location)"

    extractors:
      - type: json
        name: clusters
        internal: true
        json:
          - '.[]'

  - engine:
      - sh
      - bash
    source: |
      gcloud container clusters describe $clusterName --location $location --project $projectId --format="json(networkConfig.enableIntraNodeVisibility)"

    matchers:
      - type: word
        words:
          - "null"

    extractors:
      - type: dsl
        dsl:
          - '"GKE cluster " + clusterName + " in " + location + " of project " + projectId + " does not have intranode visibility enabled"'
