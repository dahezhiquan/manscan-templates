id: production-log

info:
  name: Production 日志文件泄露（暴露面识别）
  author: geeknik
  severity: low
  description: 检测到可直接访问的 Production 日志文件。日志、异常页面或调试输出通常会泄露堆栈信息、内部路径、查询语句、账号标识、令牌片段或业务数据，不应向未授权用户开放。
  metadata:
    verified: true
    max-request: 3
    github-query: filename:production.log Connecting to database specified by database.yml
  tags: exposure,files,logs,vuln

http:
  - method: GET
    path:
      - '{{BaseURL}}/log/production.log'
      - '{{BaseURL}}/logs/production.log'
      - '{{BaseURL}}/production.log'

    stop-at-first-match: true

    matchers-condition: and
    matchers:
      - type: word
        words:
          - 'Connecting to database specified by database.yml'

      - type: word
        part: header
        words:
          - 'text/html'
        negative: true

      - type: status
        status:
          - 200
