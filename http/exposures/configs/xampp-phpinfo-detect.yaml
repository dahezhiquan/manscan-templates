id: xampp-phpinfo-detect

info:
  name: XAMPP PHP info 页面 检测（暴露面识别）
  author: pussycat0x
  severity: low
  description: |
    检测到对外可访问的 XAMPP PHP info 页面。这类配置资源可能包含部署细节、访问凭据、内部地址、组件版本或调试开关，公开暴露后会显著增加被侦察和后续利用的风险。
  remediation: |
    - 禁止在公网暴露诊断页面、环境信息页或默认调试入口。
    - 通过 Web 服务器访问控制限制相关页面，仅对受信任管理员开放。
    - 清理页面中泄露的路径、扩展、环境变量与凭据，并评估后续风险。
  metadata:
    verified: true
    shodan-query: http.title:"XAMPP"
  tags: config,exposure,phpinfo,vuln,xampp

http:
  - method: GET
    path:
      - "{{BaseURL}}{{paths}}"
    payloads:
      paths:
        - "/phpinfo.php"
        - "/dashboard/phpinfo.php"

    host-redirects: true
    max-redirects: 2

    stop-at-first-match: true
    matchers-condition: and
    matchers:
      - type: word
        part: body
        words:
          - "PHP Extension"
          - "PHP Version"
          - "xampp"
        condition: and

      - type: status
        status:
          - 200

    extractors:
      - type: regex
        part: body
        group: 1
        regex:
          - '>PHP Version <\/td><td class="v">([0-9.]+)'
