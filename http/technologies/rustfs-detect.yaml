id: rustfs-detect

info:
  name: RustFS 指纹识别（指纹识别）
  author: icarot
  severity: info
  description: >-
    RustFS 是基于 Rust 的对象存储服务，用于提供兼容对象存储的文件管理和访问能力。该模板通过请求目标服务并检查预设路径或首页响应、页面正文关键字、状态码等指纹特征，判断目标是否使用或暴露了
    RustFS 相关组件；命中结果仅表示指纹特征匹配，可用于资产盘点、技术栈识别和后续安全评估，不代表已确认存在可利用漏洞。
  reference:
  - https://github.com/rustfs/rustfs
  classification:
    cpe: cpe:2.3:a:rustfs:rustfs:*:*:*:*:*:rust:*:*
  metadata:
    vendor: rustfs
    product: rustfs
    shodan-query: title:"RustFS"
  tags: tech,rustfs,detect
http:
  - method: GET
    path:
      - "{{BaseURL}}/rustfs/console/auth/login"

    matchers-condition: and
    matchers:
      - type: word
        words:
          - '<title>RustFS</title>'
          - 'title":"RustFS'
          - '/rustfs/console/_nuxt'
        condition: or

      - type: status
        status:
          - 200
