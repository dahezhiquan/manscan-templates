id: security-txt

info:
  name: security.txt 文件检测
  author: bad5ect0r,noraj
  severity: low
  description: |
    检测类似 robots.txt 的 security.txt 文件。该文件面向希望报告安全问题的人员，通常定义漏洞披露联系渠道、安全策略和报告要求。
  impact: |
    - well-known 策略或身份文件通常用于公开声明域名、应用、邮件、证书或身份关联。
    - 若内容过期、配置错误或非预期暴露，可能泄露组织关系、端点能力、用户标识或验证材料。
  remediation: |
    - 确认该 well-known 文件是否为业务或合规所需；非必要内容应删除或限制访问。
    - 定期检查文件内容是否准确、未过期且不包含敏感信息。
    - 对应用关联、邮件策略、证书验证和身份声明文件建立变更审计。
  reference:
    - https://securitytxt.org/
    - https://community.turgensec.com/security-txt-progress-in-ethical-security-research/
  metadata:
    verified: true
    max-request: 2
    shodan-query: http.securitytxt:contact http.status:200
  tags: miscellaneous,misc,generic,vuln

http:
  - method: GET
    path:
      - "{{RootURL}}/.well-known/security.txt"
      - "{{RootURL}}/security.txt"

    stop-at-first-match: true
    redirects: true
    max-redirects: 2
    matchers-condition: and
    matchers:
      - type: word
        words:
          - "Contact:"
          - "Expires:"
        condition: or

      - type: dsl
        dsl:
          - "len(body) <= 4096 && len(body) > 0"

      - type: status
        status:
          - 200

    extractors:
      - type: regex
        group: 1
        regex:
          - '(?mi)Contact:(.*)'
