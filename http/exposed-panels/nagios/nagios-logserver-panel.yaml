id: nagios-logserver-panel

info:
  name: Nagios Log Server 识别（暴露面识别）
  author: ritikchaddha
  severity: info
  description: |
    该模板通过识别 Nagios Log Server 面板、控制台或管理界面的页面特征，判断目标是否暴露了对应服务入口。若命中，说明该后台或运维界面对外可访问，可用于资产识别与暴露面排查。
  metadata:
    verified: true
    max-request: 1
    fofa-query: icon_hash="1460499495"
    shodan-query: http.favicon.hash:1460499495
  tags: panel,nagios,nagios-logserver,login,detect,discovery

http:
  - method: GET
    path:
      - "{{BaseURL}}"

    matchers:
      - type: word
        part: response
        words:
          - "Nagios Log Server"
          - "/nagioslogserver/"
        condition: or
