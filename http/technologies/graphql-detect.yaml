id: graphql-detect

info:
  name: GraphQL 指纹识别（指纹识别）
  author: nkxxkn,elsfa7110,ofjaaah,exceed
  severity: info
  description: >-
    GraphQL 是 GraphQL 生态中的接口或组件，用于以结构化查询方式向客户端提供后端数据访问能力。该模板通过请求目标服务并检查预设路径或首页响应、页面正文关键字、HTTP
    响应头、正则特征、状态码等指纹特征，判断目标是否使用或暴露了 GraphQL 相关组件；命中结果仅表示指纹特征匹配，可用于资产盘点、技术栈识别和后续安全评估，不代表已确认存在可利用漏洞。
  metadata:
    max-request: 124
  tags: tech,graphql,discovery
http:
  - method: POST
    path:
      - "{{BaseURL}}{{paths}}"
    body: '{"query":"query IntrospectionQuery{__schema {queryType { name }}}"}'
    headers:
      Content-Type: application/json

    payloads:
      paths:
        - "/HyperGraphQL"
        - "/___graphql"
        - "/altair"
        - "/api/cask/graphql-playground"
        - "/api/graphql"
        - "/api/graphql/v1"
        - "/explorer"
        - "/express-graphql"
        - "/gql"
        - "/graph"
        - "/graph_cms"
        - "/graphiql"
        - "/graphiql.css"
        - "/graphiql.js"
        - "/graphiql.min.css"
        - "/graphiql.min.js"
        - "/graphiql.php"
        - "/graphiql/finland"
        - "/graphql"
        - "/graphql-console"
        - "/graphql-devtools"
        - "/graphql-explorer"
        - "/graphql-playground"
        - "/graphql-playground-html"
        - "/graphql.php"
        - "/graphql/console"
        - "/graphql/graphql-playground"
        - "/graphql/schema.json"
        - "/graphql/schema.xml"
        - "/graphql/schema.yaml"
        - "/graphql/v1"
        - "/je/graphql"
        - "/laravel-graphql-playground"
        - "/playground"
        - "/portal-graphql"
        - "/query"
        - "/query-api"
        - "/query-explorer"
        - "/query-laravel"
        - "/sphinx-graphiql"
        - "/subscriptions"
        - "/v1"
        - "/v1/altair"
        - "/v1/api/graphql"
        - "/v1/explorer"
        - "/v1/graph"
        - "/v1/graphiql"
        - "/v1/graphiql.css"
        - "/v1/graphiql.js"
        - "/v1/graphiql.min.css"
        - "/v1/graphiql.min.js"
        - "/v1/graphiql.php"
        - "/v1/graphiql/finland"
        - "/v1/graphql"
        - "/v1/graphql-explorer"
        - "/v1/graphql.php"
        - "/v1/graphql/console"
        - "/v1/graphql/schema.json"
        - "/v1/graphql/schema.xml"
        - "/v1/graphql/schema.yaml"
        - "/v1/playground"
        - "/v1/subscriptions"
        - "/v2"
        - "/v2/altair"
        - "/v2/api/graphql"
        - "/v2/explorer"
        - "/v2/graph"
        - "/v2/graphiql"
        - "/v2/graphiql.css"
        - "/v2/graphiql.js"
        - "/v2/graphiql.min.css"
        - "/v2/graphiql.min.js"
        - "/v2/graphiql.php"
        - "/v2/graphiql/finland"
        - "/v2/graphql"
        - "/v2/graphql-explorer"
        - "/v2/graphql.php"
        - "/v2/graphql/console"
        - "/v2/graphql/schema.json"
        - "/v2/graphql/schema.xml"
        - "/v2/graphql/schema.yaml"
        - "/v2/playground"
        - "/v2/subscriptions"
        - "/v3"
        - "/v3/altair"
        - "/v3/api/graphql"
        - "/v3/explorer"
        - "/v3/graph"
        - "/v3/graphiql"
        - "/v3/graphiql.css"
        - "/v3/graphiql.js"
        - "/v3/graphiql.min.css"
        - "/v3/graphiql.min.js"
        - "/v3/graphiql.php"
        - "/v3/graphiql/finland"
        - "/v3/graphql"
        - "/v3/graphql-explorer"
        - "/v3/graphql.php"
        - "/v3/graphql/console"
        - "/v3/graphql/schema.json"
        - "/v3/graphql/schema.xml"
        - "/v3/graphql/schema.yaml"
        - "/v3/playground"
        - "/v3/subscriptions"
        - "/v4/altair"
        - "/v4/api/graphql"
        - "/v4/explorer"
        - "/v4/graph"
        - "/v4/graphiql"
        - "/v4/graphiql.css"
        - "/v4/graphiql.js"
        - "/v4/graphiql.min.css"
        - "/v4/graphiql.min.js"
        - "/v4/graphiql.php"
        - "/v4/graphiql/finland"
        - "/v4/graphql"
        - "/v4/graphql-explorer"
        - "/v4/graphql.php"
        - "/v4/graphql/console"
        - "/v4/graphql/schema.json"
        - "/v4/graphql/schema.xml"
        - "/v4/graphql/schema.yaml"
        - "/v4/playground"
        - "/v4/subscriptions"

    stop-at-first-match: true
    matchers-condition: and
    matchers:
      - type: status
        status:
          - 200

      - type: word
        part: header
        words:
          - "application/json"

      - type: regex
        regex:
          - "__schema"
          - "(Introspection|INTROSPECTION|introspection).*?"
          - ".*?operation not found.*?"
        condition: or
