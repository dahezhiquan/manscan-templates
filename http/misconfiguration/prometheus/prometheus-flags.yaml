id: prometheus-flags

info:
  name: Prometheus Flags API 暴露
  author: geeknik
  severity: medium
  description: |
    该模板用于核查 Prometheus Flags API 暴露。该类问题通常源于 Prometheus、Exporter、监控端点或服务指标接口未加访问控制而暴露。模板会向目标发送探测请求，并依据请求 `/api/v1/status/flags`、状态码 200、匹配 `"data":`、匹配 `"config.file":`等证据确认目标是否存在该配置问题。
  impact: |
    - 攻击者可获取主机、容器、服务版本、资源使用、网络接口、文件系统或集群状态等运行信息。
    - 指标信息可辅助攻击者绘制内部架构、识别高价值节点并制定后续攻击路径。
  remediation: |
    - 为指标端点增加认证授权、来源限制或仅绑定内网监听地址。
    - 通过反向代理、服务网格或监控采集器收敛访问路径，避免公网直接访问。
    - 审计已暴露的指标内容，确认是否包含主机名、版本、标签或业务敏感标识。
  reference:
    - https://jfrog.com/blog/dont-let-prometheus-steal-your-fire/
  metadata:
    max-request: 1
  tags: prometheus,leak,misconfig,vuln

http:
  - method: GET
    path:
      - "{{BaseURL}}/api/v1/status/flags"

    matchers-condition: and
    matchers:
      - type: status
        status:
          - 200

      - type: word
        words:
          - '"data":'
          - '"config.file":'
        condition: and

      - type: word
        part: header
        words:
          - 'application/json'

    extractors:
      - type: regex
        name: web_admin_enabled
        regex:
          - '\"web\.enable\-admin\-api\"\: \"true\"'
