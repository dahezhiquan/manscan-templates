id: rtsp-detect

info:
  name: RTSP 识别（指纹识别）
  author: pussycat0x
  severity: info
  description: |
    RTSP 是实时流媒体控制协议，常用于摄像头、视频服务器和流媒体播放控制。该模板连接 554/TCP 并读取协议响应，通过匹配 `RTSP/1.0` 等响应特征识别目标服务。
  reference:
    - https://nmap.org/nsedoc/scripts/rtsp-methods.html
  classification:
    cvss-metrics: CVSS:3.1/AV:N/AC:L/PR:N/UI:N/S:U/C:N/I:N/A:N
    cwe-id: CWE-200
  metadata:
    verified: true
    max-request: 1
    shodan-query: RTSP/1.0
  tags: network,rtsp,detect,tcp,discovery
tcp:
  - inputs:
      - data: "OPTIONS * RTSP/1.0\r\nCSeq: 1\r\n\r\n"
    host:
      - '{{Hostname}}'
    port: 554
    read-size: 4096
    matchers:
      - type: word
        words:
          - RTSP/1.0
    extractors:
      - type: regex
        name: product_version_0
        part: raw
        group: 1
        regex:
          - (?mi)^Server:[ \t]*DSS/([0-9]+(?:[.][0-9]+)+(?:[-+._][0-9A-Za-z]+)*)(?:[ \t\r]|$)
        internal: true
      - type: dsl
        dsl:
          - 'regex("^[0-9]+(?:[.][0-9]+)*(?:[-+._][0-9A-Za-z]+)*$", product_version_0) ? "darwin-streaming-server:" + product_version_0 : ""'
      - type: regex
        name: product_version_1
        part: raw
        group: 1
        regex:
          - (?mi)^Server:[ \t]*LIVE555 Streaming Media v([0-9]+(?:[.][0-9]+)+(?:[-+._][0-9A-Za-z]+)*)(?:[ \t\r]|$)
        internal: true
      - type: dsl
        dsl:
          - 'regex("^[0-9]+(?:[.][0-9]+)*(?:[-+._][0-9A-Za-z]+)*$", product_version_1) ? "live555:" + product_version_1 : ""'
