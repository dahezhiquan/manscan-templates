id: bmc-discovery-panel

info:
  name: BMC Discovery 登录面板识别（暴露面识别）
  author: daffainfo
  severity: info
  description: 该模板通过识别 BMC Discovery 登录入口的页面标题、特征文本或重定向行为，判断目标是否暴露了对应的认证界面。若命中，说明该登录面板对外可访问，可用于暴露面梳理与后续安全评估。
  reference:
    - https://docs.bmc.com/docs/discovery/documentation-home-1098837931.html
  classification:
    cvss-metrics: CVSS:3.0/AV:N/AC:L/PR:N/UI:N/S:U/C:N/I:N/A:N
    cwe-id: CWE-200
  metadata:
    verified: true
    max-request: 1
    shodan-query: http.title:"BMC Software"
  tags: panel,bmc,discovery

http:
  - method: GET
    path:
      - "{{BaseURL}}/ui/"

    matchers-condition: and
    matchers:
      - type: word
        part: body
        words:
          - "BMC Discovery:"
          - '<span class="logo-product">Discovery</span>'
        condition: and

      - type: status
        status:
          - 200

    extractors:
      - type: regex
        part: body
        group: 1
        regex:
          - '<span class="logo-version">Version ([0-9.]+)'
