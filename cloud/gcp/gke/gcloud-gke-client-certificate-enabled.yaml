id: gcloud-gke-client-certificate-enabled

info:
  name: GKE Clusters With Client 证书 Authentication已启用（云安全）
  author: princechaddha
  severity: medium
  description: GKE 控制面启用客户端证书认证会保留较难统一治理的凭据入口，官方更推荐使用 IAM 与现代认证方式。本模板检查 masterAuth.clientCertificateConfig.issueClientCertificate，值为 True 时报告集群启用了客户端证书认证。
  impact: |
    - 客户端证书泄露后可能被用于访问 Kubernetes API，轮换和吊销管理复杂度较高。
    - 认证入口不统一会增加审计、权限治理和应急处置难度。
  remediation: |
    - 禁用新集群的客户端证书签发，使用 IAM、RBAC 和受控 kubeconfig 访问集群。
    - 对已启用的集群评估迁移方案，轮换并清理不再需要的客户端证书。
  reference:
    - https://cloud.google.com/kubernetes-engine/docs/how-to/hardening-your-cluster
    - https://www.trendmicro.com/cloudoneconformity/knowledge-base/gcp/GKE/disable-client-certificate.html
  metadata:
    vendor: google
    product: google-kubernetes-engine
  tags: cloud,devops,gcp,gcloud,gke,kubernetes,security,authentication,gcp-cloud-config

flow: |
  code(1)
  for(let projectId of iterate(template.projectIds)){
    set("projectId", projectId)
    code(2)
    for(let cluster of iterate(template.clusters)){
      cluster = JSON.parse(cluster)
      set("clusterName", cluster.name)
      set("location", cluster.location)
      code(3)
    }
  }

self-contained: true

code:
  - engine:
      - sh
      - bash
    source: |
      gcloud projects list --format="json(projectId)"

    extractors:
      - type: json
        name: projectIds
        internal: true
        json:
          - '.[].projectId'

  - engine:
      - sh
      - bash
    source: |
      gcloud container clusters list --project $projectId --format="json(name,location)"

    extractors:
      - type: json
        name: clusters
        internal: true
        json:
          - '.[]'

  - engine:
      - sh
      - bash
    source: |
      gcloud container clusters describe $clusterName --location $location --project $projectId --format="value(masterAuth.clientCertificateConfig.issueClientCertificate)"

    matchers:
      - type: word
        words:
          - "True"

    extractors:
      - type: dsl
        dsl:
          - '"GKE cluster " + clusterName + " in " + location + " of project " + projectId + " has client certificate authentication enabled"'
