id: unauthenticated-varnish-cache-purge

info:
  name: Varnish 未授权 Cache Purge
  author: 0xelkomy
  severity: low
  description: |
    检测到 Varnish 未授权 Cache Purge。目标功能在未认证状态下可访问，可能暴露管理入口、业务数据、系统状态或可执行操作，需确认是否存在访问控制缺失。
  reference:
    - https://book.varnish-software.com/4.0/chapters/Cache_Invalidation.html
    - https://hackerone.com/reports/154278
  metadata:
    max-request: 1
  tags: misconfig,cache,hackerone,varnish,vuln

http:
  - method: PURGE
    path:
      - "{{BaseURL}}"

    matchers-condition: and
    matchers:
      - type: word
        part: body
        words:
          - '<title>200 Purged</title>'
          - '"status": "ok"'
        condition: or

      - type: status
        status:
          - 200
