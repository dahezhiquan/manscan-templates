id: cql-native-transport

info:
  name: CQL Native 传输 识别（服务漏洞）
  author: pussycat0x
  severity: info
  description: |
    该模板通过网络响应特征识别目标是否开放 CQL Native Transport 相关服务。
  metadata:
    verified: true
    max-request: 1
    shodan-query: cassandra
  tags: network,cassandra,cql,detect,detection,tcp,discovery
tcp:
  - inputs:
      - data: "/n"
      - data: "/n"
      - data: "/n"
      - data: "/n"
      - data: "/n"
      - data: "/n"
      - data: "/n"
      - data: "/n"

    host:
      - "{{Hostname}}"
    port: 9042

    matchers:
      - type: word
        words:
          - "valid or unsupported protocol"

    extractors:
      - type: regex
        regex:
          - "protocol version: ([0-9]+)"
