id: network-camera-detect

info:
  name: 网络摄像机面板识别（IOT）
  author: iamthefrogy
  severity: medium
  description: |
    检测到网络摄像机管理或查看面板。该模板用于识别在线摄像设备，公开访问可能暴露设备入口和监控资产信息。
  impact: |
    - 摄像头或录像设备暴露可能导致实时画面、截图、设备位置和监控范围被未授权查看。
    - 监控入口泄露还会增加弱口令、默认凭据和已知固件漏洞被利用的概率。
  remediation: |
    - 禁止公网直接访问摄像头、NVR/DVR 或视频流页面，统一放置在隔离网络或 VPN 后。
    - 启用强认证并修改默认口令，定期升级设备固件。
    - 对视频访问、配置变更和异常登录启用日志审计。
  metadata:
    max-request: 1
  tags: iot,discovery

http:
  - method: GET
    path:
      - "{{BaseURL}}/CgiStart?page=Single"

    host-redirects: true
    max-redirects: 2
    matchers:
      - type: word
        words:
          - <TITLE>Network Camera</TITLE>
