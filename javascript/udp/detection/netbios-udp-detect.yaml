id: netbios-udp-detect

info:
  name: NetBIOS 名称服务识别（指纹识别）
  author: pussycat0x
  severity: info
  description: |
    NetBIOS Name Service 是 Windows/SMB 网络中的名称注册和解析机制，通常运行在 UDP 137，用于维护主机名、工作组和相关 NetBIOS 名称记录。该模板发送 NBSTAT 通配查询，并根据返回的名称服务响应确认 NetBIOS 服务指纹及主机名称表信息。
  reference:
    - https://github.com/CiscoCXSecurity/udp-proto-scanner
    - https://www.rfc-editor.org/rfc/rfc1002
    - https://nmap.org/nsedoc/scripts/nbstat.html
  classification:
    cwe-id: CWE-200
  metadata:
    verified: true
    max-request: 1
    shodan-query: port:137
  tags: netbios,nbt,nbstat,windows,smb,network,js,udp,detect

javascript:
  - pre-condition: |
      isUDPPortOpen(Host, Port);
    code: |
      const c = require("nuclei/net");
      // NBTStat query - NBSTAT wildcard name query (*<00>)
      const payload = "80f00010000100000000000020434b4141414141414141414141414141414141414141414141414141414141410000210001";
      const conn = c.Open('udp', `${Host}:${Port}`);
      conn.SendHex(payload);
      let resp = conn.RecvString(2048);
      resp;

    args:
      Host: "{{Host}}"
      Port: 137

    matchers-condition: and
    matchers:
      - type: dsl
        dsl:
          - "success == true"
          - "len(response) > 0"
        condition: and

    extractors:
      - type: dsl
        dsl:
          - '"NetBIOS Name Service Detected"'
