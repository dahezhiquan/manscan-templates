id: unauthenticated-netdata

info:
  name: 未授权 Netdata
  author: dhiyaneshDk
  severity: medium
  description: |
    检测到 未授权 Netdata。目标功能在未认证状态下可访问，可能暴露管理入口、业务数据、系统状态或可执行操作，需确认是否存在访问控制缺失。
  reference:
    - https://github.com/netdata/netdata
  metadata:
    max-request: 1
  tags: netdata,unauth,misconfig,vuln

http:
  - method: GET
    path:
      - "{{BaseURL}}/api/v1/data?chart=system.cpu&format=json&points=125&group=average&gtime=0&options=ms%7Cflip%7Cjsonwrap%7Cnonzero&after=-120&dimensions=iowait"

    matchers-condition: and
    matchers:
      - type: status
        status:
          - 200

      - type: word
        words:
          - "view_update_every"
          - "dimensions"
        condition: and

      - type: word
        words:
          - "application/json"
        part: header
