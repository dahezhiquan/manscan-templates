id: set-and-secure-passwords

info:
  name: Cisco 密码安全配置检测（本地文件安全扫描）
  author: pussycat0x
  severity: high
  description: |
    Cisco `service password-encryption` 可避免部分本地密码以明文形式出现在配置中，但其保护强度有限，不能替代 `enable secret`、AAA 和强口令策略。配置缺失会增加配置备份、排障输出或未授权读取时的凭据暴露风险。本模板检查是否缺少 `service password-encryption`，不验证密码强度或哈希算法。
  impact: |
    - 可读取配置或备份的攻击者可能直接获得本地账户密码或其可逆保护形式，进一步登录网络设备。
    - 设备口令被复用时，配置泄露可能扩散到其他交换机、路由器和管理系统。
  reference:
    - https://www.cisco.com/c/en/us/td/docs/ios-xml/ios/security/d1/sec-d1-cr-book/sec-cr-e1.html#wp3884449514
  classification:
    cvss-metrics: CVSS:3.1/AV:N/AC:L/PR:N/UI:N/S:U/C:N/I:N/A:N
    cvss-score: 0
    cwe-id: CWE-200
  remediation: |
    - 配置 `service password-encryption` 作为最低限度的配置保护，并使用支持的 `enable secret`/AAA 安全机制和强随机凭据。
    - 限制配置文件、备份和日志的读取权限，避免把口令提交到代码仓库或不受控工单。
    - 定期轮换设备凭据，发现配置泄露时立即吊销并审计相关账户使用情况。
  tags: audit,file,cisco,config-audit,cisco-switch

file:
  - extensions:
      - conf

    matchers-condition: and
    matchers:
      - type: word
        words:
          - "service password-encryption"
        negative: true

      - type: word
        words:
          - "configure terminal"

