id: kong-detect

info:
  name: Kong 指纹识别（指纹识别）
  author: geeknik,joshlarsen
  severity: info
  description: 用于识别目标是否部署 Kong 并提取相关版本或构建信息，模板会结合 HTTP 响应头、特定路径或已知端点和版本或标识提取结果进行指纹匹配。
  reference:
    - https://github.com/Kong/kong
  metadata:
    max-request: 1
  tags: tech,kong,discovery

http:
  - method: GET
    path:
      - "{{BaseURL}}"

    matchers:
      - type: word
        part: header
        words:
          - "server: kong"
          - "x-kong-response-latency"
          - "x-kong-upstream-latency"
          - "x-kong-proxy-latency"
          - "x-kong-admin-request-id"
        condition: or
        case-insensitive: true

    extractors:
      - type: kval
        kval:
          - server
