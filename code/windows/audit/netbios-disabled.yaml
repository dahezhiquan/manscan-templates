id: netbios-disabled

info:
  name: NetBIOS 未在所有网卡禁用（本地基线扫描）
  author: princechaddha
  severity: medium
  description: |
    该模板检查所有网络适配器是否禁用 NetBIOS over TCP/IP。NetBIOS 会暴露名称解析和枚举面。
  impact: |
    攻击者可利用 NetBIOS 进行主机枚举、名称投毒或凭据捕获。
  remediation: |
    在不需要的环境中禁用 NetBIOS over TCP/IP，并使用 DNS 替代旧式解析。
  tags: windows,netbios,network,security,code,windows-audit

self-contained: true

code:
  - pre-condition: |
      IsWindows();
    engine:
      - powershell
      - powershell.exe
    args:
      - -ExecutionPolicy
      - Bypass
    pattern: "*.ps1"
    source: |
      $netbiosStatus = Get-WmiObject Win32_NetworkAdapterConfiguration | Where-Object { $_."TCP/IPNetBIOSOptions" -ne 2 }
      if ($netbiosStatus) {"NetBIOS is misconfigured or enabled"} else {"NetBIOS is correctly disabled"}

    matchers:
      - type: word
        words:
          - "NetBIOS is misconfigured or enabled"
