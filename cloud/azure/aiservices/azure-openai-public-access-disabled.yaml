id: azure-openai-public-access-disabled
info:
  name: Azure OpenAI 公共网络访问未禁用（云安全）
  author: princechaddha
  severity: high
  description: Azure OpenAI 服务实例启用公共网络访问且默认网络 ACL 为 Allow 或未设置时，服务可能从不受限制的网络位置接收请求。该模板枚举 kind 为 OpenAI 的服务实例，查询 properties.networkAcls.defaultAction 和 properties.publicNetworkAccess；当默认动作允许或为空且公共网络访问为 Enabled 时命中。
  impact: |
    - 公共网络上的攻击者可能持续探测服务并利用泄露的密钥或令牌调用模型，造成提示词、响应数据泄露和配额消耗。
    - 过宽的网络入口会削弱纵深防御，使身份凭据泄露后的越权调用和异常流量更难被阻断。
  remediation: |
    - 按业务需要关闭 Azure OpenAI 的公共网络访问，优先通过 Private Endpoint 和私有 DNS 提供服务访问。
    - 如暂时必须保留公共入口，将默认网络 ACL 设置为 Deny，仅允许受信任 IP 范围，并结合 Entra ID、RBAC 和密钥轮换控制调用权限。
  reference:
    - https://docs.microsoft.com/en-us/azure/cognitive-services/cognitive-services-apis-create-account-cli?tabs=windows
  metadata:
    vendor: microsoft
    product: azure-openai
  tags: cloud,devops,azure,microsoft,openai,azure-cloud-config,ai

flow: |
  code(1);
  for (let ServiceData of iterate(template.serviceList)) {
    ServiceData = JSON.parse(ServiceData);
    set("name", ServiceData.name);
    set("resourceGroup", ServiceData.resourceGroup);
    code(2);
  }

self-contained: true
code:
  - engine:
      - sh
      - bash
    source: |
      az cognitiveservices account list --output json --query '[?(kind==`OpenAI`)].{"name":name,"resourceGroup":resourceGroup}'

    extractors:
      - type: json
        name: serviceList
        internal: true
        json:
          - '.[]'

  - engine:
      - sh
      - bash
    source: |
      az cognitiveservices account show --name "$name" --resource-group "$resourceGroup" --query '{networkAcls:properties.networkAcls.defaultAction,publicNetworkAccess:properties.publicNetworkAccess}'

    matchers-condition: and
    matchers:
      - type: word
        words:
          - '"networkAcls": "Allow"'
          - '"networkAcls": "null"'

      - type: word
        words:
          - '"publicNetworkAccess": "Enabled"'

    extractors:
      - type: dsl
        dsl:
          - '"$name in $resourceGroup has public network access enabled"'
