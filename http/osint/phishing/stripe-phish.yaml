id: stripe-phish

info:
  name: Stripe 仿冒钓鱼网站（钓鱼网站识别）
  author: rxerium
  severity: info
  description: |
    检测到疑似仿冒 Stripe 的钓鱼网站。模板在目标页面返回 200、页面内容命中 Stripe 的金融或支付页面特征，且当前主机不属于 stripe.com 官方域名时触发，用于识别借用 Stripe 品牌页面诱导用户信任的仿冒站点。
  reference:
    - https://stripe.com
  metadata:
    max-request: 1
  tags: phishing,stripe,payment,osint,discovery
http:
  - method: GET
    path:
      - "{{BaseURL}}"

    host-redirects: true
    max-redirects: 2

    matchers-condition: and
    matchers:
      - type: word
        words:
          - "Stripe is a suite of APIs powering online payment processing and commerce solutions for internet businesses of all sizes. Accept payments and scale faster with AI."
          - 'Stripe Dashboard'
        condition: or

      - type: status
        status:
          - 200

      - type: dsl
        dsl:
          - '!contains(host,"stripe.com")'
