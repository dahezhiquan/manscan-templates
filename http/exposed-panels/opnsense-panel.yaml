id: opnsense-panel

info:
  name: OPNsense 面板识别（指纹识别）
  author: Splint3r7,johnk3r
  severity: info
  description: |-
    检测到目标站点存在 OPNsense 相关响应特征。OPNsense 是安全扫描、安全网关或安全管理平台，用于维护访问控制、漏洞评估、威胁防护、策略配置和告警事件。模板请求 `/`，并通过页面标题或正文关键字、状态码、DSL 条件确认该系统指纹，用于资产识别、系统盘点和暴露面梳理。
  classification:
    cwe-id: CWE-200
  metadata:
    max-request: 1
    verified: true
    vendor: opnsense
    product: opnsense
    shodan-query:
      - http.favicon.hash:-1148190371
      - http.favicon.hash:-1068289244
      - title:"| OPNsense"
      - "Server: OPNsense"
    fofa-query:
      - icon_hash="-1148190371"
      - icon_hash="-1068289244"
      - title="| OPNsense"
      - server=="OPNsense"
  tags: panel,login,detect,opnsense,discovery
http:
  - method: GET
    path:
      - "{{BaseURL}}"

    matchers:
      - type: dsl
        dsl:
          - 'contains(body, "| OPNsense</title>")'
          - 'status_code == 200'
        condition: and
