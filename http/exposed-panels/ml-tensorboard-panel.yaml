id: ml-tensorboard-panel

info:
  name: TensorBoard 面板识别（指纹识别）
  author: rxerium
  severity: info
  description: |-
    检测到目标站点存在 TensorBoard 相关响应特征。TensorBoard 是 AI、机器学习或 Notebook 相关平台，用于管理模型、数据集、工作区、实验、推理服务或训练任务。模板请求 `/`，并通过状态码、正则特征确认该系统指纹，用于资产识别、系统盘点和暴露面梳理。
  reference:
    - https://github.com/tensorflow/tensorboard
    - https://www.tensorflow.org/tensorboard
  metadata:
    verified: true
    max-request: 1
    vendor: tensorflow
    product: tensorboard
    shodan-query: 'http.title:"TensorBoard"'
  tags: panel,tensorboard,tensorflow,ml,ai,detect,discovery
http:
  - method: GET
    path:
      - "{{BaseURL}}"

    host-redirects: true
    max-redirects: 2

    matchers-condition: and
    matchers:
      - type: regex
        part: body
        regex:
          - '(?i)<title>[^<]*TensorBoard[^<]*</title>'

      - type: status
        status:
          - 200
