id: franklin-fueling-default-login

info:
  name: Franklin Fueling System 默认口令登录（弱口令）
  author: r3Y3r53
  severity: high
  description: |
    该模板用于检测 Franklin Fueling System 是否仍可使用默认凭据或弱口令登录。模板主要向 `/21408623/cgi-bin/tsaws.cgi` 等认证入口发送请求，使用内置默认凭据组合进行认证尝试，并根据响应中的 `status_code == 200`、`contains(content_type, "text/xml")` 等登录成功特征判断登录是否成功；命中说明目标未及时修改出厂、示例或初始化账号口令。
  impact: |
    - 攻击者可接管 Franklin Fueling System 的 Web 管理界面，查看设备状态、网络配置、运行日志或敏感业务参数。
    - 被接管的网络、工控、打印、语音、存储或远程管理设备可能被用于中断业务、改变路由/访问策略、窃取流量或作为内网横向移动入口。
  remediation: |
    - 立即修改所有默认账号口令，禁用不再使用的出厂账号，并为管理账户设置高强度唯一密码。
    - 将设备管理入口限制在 VPN、堡垒机或可信管理网段内，避免直接暴露到公网。
    - 升级设备固件或管理组件，审计近期登录记录、配置变更和异常会话。
  reference:
    - https://www.exploitalert.com/view-details.html?id=39466
  classification:
    cpe: cpe:2.3:o:franklinfueling:ts-550_evo_firmware:*:*:*:*:*:*:*:*
  metadata:
    verified: true
    max-request: 1
    vendor: franklinfueling
    product: ts-550_evo_firmware
    google-query: inurl:"relay_status.html"
  tags: default-login,franklin,vuln

http:
  - raw:
      - |
        POST /21408623/cgi-bin/tsaws.cgi HTTP/1.1
        Host: {{Hostname}}
        Content-Type: text/xml

        <TSA_REQUEST_LIST PASSWORD="{{password}}"><TSA_REQUEST COMMAND="cmdWebCheckRole" ROLE="{{username}}"/></TSA_REQUEST_LIST>

    attack: pitchfork
    payloads:
      username:
        - roleAdmin
        - roleUser
        - roleGuest
      password:
        - admin
    matchers:
      - type: dsl
        dsl:
          - 'status_code == 200'
          - 'contains(content_type, "text/xml")'
          - 'contains(body, "</TSA_RESPONSE_LIST>")'
          - 'contains(body, "roleAdmin") || contains(body, "roleUser") || contains(body, "roleGuest")'
        condition: and
