id: hue-personal-wireless-panel

info:
  name: Philips HUE 个人无线照明面板（IOT）
  author: Hardik-Solanki
  severity: medium
  description: |
    检测到 Philips HUE 个人无线照明面板。该面板用于智能照明系统管理，暴露后可能泄露物联网照明设备的控制入口。
  impact: |
    - 暴露的设备面板会泄露资产类型、产品型号、部署位置或管理入口，为后续弱口令和漏洞利用提供线索。
    - 若设备本身存在默认凭据或旧固件问题，攻击者可能进一步访问或控制设备。
  remediation: |
    - 确认该面板是否需要对当前网络开放；如无必要，应限制到内网、管理 VLAN 或 VPN。
    - 启用强认证，修改默认口令，并保持设备固件为受支持版本。
    - 对管理入口访问、登录失败和配置变更启用审计。
  classification:
    cpe: cpe:2.3:h:philips:hue:*:*:*:*:*:*:*:*
  metadata:
    max-request: 1
    vendor: philips
    product: hue
    shodan-query: title:"hue personal wireless lighting"
  tags: hue,iot,wireless,discovery

http:
  - method: GET
    path:
      - '{{BaseURL}}'

    matchers-condition: and
    matchers:
      - type: word
        part: body
        words:
          - 'hue personal wireless lighting'
          - 'Open Source'
        condition: and

      - type: status
        status:
          - 200
