id: gcloud-pg-log-min-error-statement-flag-not-configured

info:
  name: Log Min Error Statement Flag 未Configured Properly 的PostgreSQL Instances（云安全）
  author: princechaddha
  severity: medium
  description: PostgreSQL log_min_error_statement 决定哪些级别的错误语句会被记录，未显式配置会导致实例日志基线不一致。本模板枚举 Cloud SQL PostgreSQL 实例，并从 databaseFlags 中提取 log_min_error_statement，返回 null 时报告该标志未正确配置。
  impact: |
    - 错误语句记录级别不明确时，认证异常、语法攻击或应用错误可能缺少足够上下文。
    - 多实例日志粒度不一致会影响集中审计、异常检测和事件取证。
  remediation: |
    - 为 Cloud SQL PostgreSQL 实例显式配置符合组织基线的 log_min_error_statement 值。
    - 调整后复核日志量和敏感语句暴露风险，并将配置纳入数据库参数基线检查。
  reference:
    - https://cloud.google.com/sql/docs/postgres/flags
  metadata:
    vendor: google
    product: cloud-sql
  tags: cloud,devops,gcp,gcloud,google-cloud-sql,postgresql,logging,gcp-cloud-config

flow: |
  code(1)
  for(let projectId of iterate(template.projectIds)){
    set("projectId", projectId)
    code(2)
    for(let sqlInstance of iterate(template.sqlInstances)){
      set("sqlInstance", sqlInstance)
      code(3)
    }
  }

self-contained: true

code:
  - engine:
      - sh
      - bash
    source: |
      gcloud projects list --format="json(projectId)"

    extractors:
      - type: json
        name: projectIds
        internal: true
        json:
          - '.[].projectId'

  - engine:
      - sh
      - bash
    source: |
      gcloud sql instances list --project $projectId --filter=DATABASE_VERSION:POSTGRES* --format="json(name)"

    extractors:
      - type: json
        name: sqlInstances
        internal: true
        json:
          - '.[].name'

  - engine:
      - sh
      - bash
    source: |
      gcloud sql instances describe $sqlInstance --project $projectId --format=json | jq -r '.settings.databaseFlags[]? | select(.name=="log_min_error_statement") | .value // "null"'

    matchers:
      - type: word
        words:
          - 'null'

    extractors:
      - type: dsl
        dsl:
          - '"The log_min_error_statement flag is not configured properly or is set to an inappropriate value for PostgreSQL instance " + sqlInstance + " in project " + projectId'
