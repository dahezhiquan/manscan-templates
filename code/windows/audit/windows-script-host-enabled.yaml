id: windows-script-host-enabled

info:
  name: Windows Script Host 已启用（本地基线扫描）
  author: princechaddha
  severity: medium
  description: |
    WSH 可执行 VBScript/JScript，常被恶意脚本滥用。对应基线项为“Windows Script Host 是否启用”；模板读取注册表 `HKLM:\Software\Microsoft\Windows Script Host\Settings` 的 `Enabled` 值，结合命中值判断策略是否不符合基线。
  impact: |
    - 攻击者可通过脚本投递恶意载荷、持久化或执行系统命令。
  remediation: |
    - 如无业务需要，禁用 Windows Script Host 或限制脚本执行来源。
  tags: windows,code,windows-audit

self-contained: true

code:
  - pre-condition: |
      IsWindows();
    engine:
      - powershell
      - powershell.exe
    args:
      - -ExecutionPolicy
      - Bypass
    pattern: "*.ps1"
    source: |
      $(Get-ItemProperty -Path 'HKLM:\Software\Microsoft\Windows Script Host\Settings' -Name 'Enabled' -ErrorAction SilentlyContinue).Enabled -eq 0

    matchers:
      - type: word
        words:
          - "True"
