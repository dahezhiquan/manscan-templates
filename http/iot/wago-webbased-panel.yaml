id: wago-webbased-panel

info:
  name: WAGO Web-Based Management 面板（IOT）
  author: biero-el-corridor
  severity: medium
  description: |
    检测到 WAGO Web-Based Management 面板。该入口用于 WAGO 工业网络或控制设备管理，公网暴露可能泄露工业设备管理面。
  impact: |
    - 工业控制、楼宇自动化或能源设备面板暴露可能泄露设施运行状态和控制系统入口。
    - 若存在弱口令或历史漏洞，可能影响生产、楼控、供电或环境控制的安全边界。
  remediation: |
    - 将 OT/IoT 管理页面放置在隔离网络中，仅允许可信运维主机或 VPN 访问。
    - 启用强认证、最小权限和设备访问审计，及时更新厂商固件。
    - 避免将控制设备直接暴露到互联网，并监控异常登录和配置变更。
  metadata:
    shodan-query: title:"WAGO Ethernet Web-based Management"
    verified: true
    max-request: 1
  tags: panel,login,wago,iot,discovery

http:
  - method: GET
    path:
      - "{{BaseURL}}/wbm/index.php"

    matchers-condition: and
    matchers:
      - type: word
        part: body
        words:
          - "Web-based Management"
          - "login"
        condition: and

      - type: status
        status:
          - 200
