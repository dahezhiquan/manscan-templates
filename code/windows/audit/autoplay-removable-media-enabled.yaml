id: autoplay-removable-media-enabled

info:
  name: 可移动介质自动播放已启用（本地基线扫描）
  author: princechaddha
  severity: medium
  description: |
    该模板检查可移动介质 AutoPlay 是否启用。插入 U 盘等设备时自动触发内容会增加恶意程序执行风险。
  impact: |
    攻击者可借助可移动介质诱导执行恶意文件并植入恶意软件。
  remediation: |
    禁用所有驱动器的 AutoPlay/AutoRun，尤其是可移动介质。
  tags: windows,autoplay,removable-media,code,windows-audit

self-contained: true

code:
  - pre-condition: |
      IsWindows();
    engine:
      - powershell
      - powershell.exe
    args:
      - -ExecutionPolicy
      - Bypass
    pattern: "*.ps1"
    source: |
      Get-ItemProperty -Path 'HKCU:\Software\Microsoft\Windows\CurrentVersion\Explorer\AutoplayHandlers' -Name 'DisableAutoplay'

    matchers:
      - type: word
        words:
          - "DisableAutoplay : 0"
