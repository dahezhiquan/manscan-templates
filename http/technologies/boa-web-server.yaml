id: boa-web-server

info:
  name: Boa Web 服务器指纹识别（指纹识别）
  author: johnk3r
  severity: info
  description: |
    用于识别目标是否部署 Boa Web 服务器 并提取相关版本或构建信息，模板会结合 HTTP 响应头、特定路径或已知端点和版本或标识提取结果进行指纹匹配。
  reference:
    - https://www.microsoft.com/en-us/security/blog/2022/11/22/vulnerable-sdk-components-lead-to-supply-chain-risks-in-iot-and-ot-environments/
    - http://www.boa.org/
  classification:
    cvss-metrics: CVSS:3.0/AV:N/AC:L/PR:N/UI:N/S:U/C:N/I:N/A:N
    cwe-id: CWE-200
    cpe: cpe:2.3:a:boa:boa:*:*:*:*:*:*:*:*
  metadata:
    verified: true
    max-request: 1
    shodan-query: "Server: Boa/"
    product: boa
    vendor: boa
  tags: boa,tech,discovery

http:
  - method: GET
    path:
      - "{{BaseURL}}"

    matchers-condition: and
    matchers:
      - type: regex
        part: header
        regex:
          - "Server: Boa/"

    extractors:
      - type: kval
        part: header
        kval:
          - Server
