id: php-user-ini-disclosure

info:
  name: Php User.INI 泄露（暴露面识别）
  author: dhiyaneshDk
  severity: medium
  description: 检测到对外可访问的 Php User.INI。相关文件可能泄露项目结构、依赖关系、部署细节、敏感参数或其他不应公开的内部信息。
  reference:
    - https://github.com/detectify/ugly-duckling/blob/master/modules/crowdsourced/php-user-ini-disclosure.json
  metadata:
    max-request: 2
  tags: exposure,config,files,vuln

http:
  - method: GET
    path:
      - "{{BaseURL}}/user.ini"
      - "{{BaseURL}}/.user.ini"

    matchers-condition: and
    matchers:
      - type: word
        words:
          - "assert"
          - "highlight"
          - "opcache"
          - "mssql"
          - "oci8"
          - "agent"
        part: body
        condition: and

      - type: status
        status:
          - 200
