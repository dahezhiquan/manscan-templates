id: fortinet-forticlientems-panel

info:
  name: FortiClient Endpoint Management Server 面板识别（指纹识别）
  author: h4sh5
  severity: info
  description: |-
    检测到目标站点存在 FortiClient Endpoint Management Server 相关响应特征。FortiClient Endpoint Management Server 是远程访问或 VPN 登录入口，用于为用户提供企业内网、应用系统或安全网关的访问能力。模板请求 `/signin`，并通过页面标题或正文关键字、状态码确认该系统指纹，用于资产识别、系统盘点和暴露面梳理。
  classification:
    cpe: cpe:2.3:a:fortinet:forticlient_endpoint_management_server:*:*:*:*:*:*:*:*
  metadata:
    verified: true
    max-request: 1
    vendor: fortinet
    product: forticlient_endpoint_management_server
    shodan-query: http.favicon.hash:-800551065
  tags: panel,fortinet,forticlient,ems,login,detect,discovery
http:
  - method: GET
    path:
      - "{{BaseURL}}/signin"

    matchers-condition: and
    matchers:
      - type: word
        part: body
        words:
          - "FortiClient Endpoint Management Server"

      - type: status
        status:
          - 200

    extractors:
      - type: regex
        part: body
        name: version
        group: 1
        regex:
          - 'VERSION_FULL\\u0022: \\u0022(.*?)\\u0022'
