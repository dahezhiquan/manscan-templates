id: pega-web-panel

info:
  name: Pega Infinity 登录面板识别（暴露面识别）
  author: powerexploit,righettod
  severity: info
  description: |
    该模板通过识别 Pega Infinity 登录入口的页面标题、特征文本或重定向行为，判断目标是否暴露了对应的认证界面。若命中，说明该登录面板对外可访问，可用于暴露面梳理与后续安全评估。
  reference:
    - https://www.pega.com/infinity
  classification:
    cvss-metrics: CVSS:3.0/AV:N/AC:L/PR:N/UI:N/S:U/C:N/I:N/A:N
    cwe-id: CWE-200
    cpe: cpe:2.3:a:pega:platform:*:*:*:*:*:*:*:*
  metadata:
    verified: true
    max-request: 2
    vendor: pega
    product: platform
    shodan-query:
      - title:"Pega Platform"
      - http.title:"pega platform"
    google-query:
      - inurl:"/prweb/PRAuth/app/default"
      - intitle:"pega platform"
      - inurl:"/prweb/prauth/app/default"
    fofa-query: title="pega platform"
  tags: panel,pega,discovery

http:
  - method: GET
    path:
      - "{{BaseURL}}"
      - "{{BaseURL}}/prweb/PRAuth/app/default/"

    stop-at-first-match: true
    host-redirects: true
    max-redirects: 2

    matchers-condition: and
    matchers:
      - type: word
        part: body
        words:
          - 'alt="Pega Infinity'
          - 'alt="Pega Logo'
          - 'id = "pegaLogin'
          - 'Pega Platform'
        condition: or

      - type: status
        status:
          - 200
