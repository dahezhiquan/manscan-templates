id: cpanel-config

info:
  name: cPanel 配置文件泄露（暴露面识别）
  author: DhiyaneshDk
  severity: medium
  description: |
    检测到对外可访问的 cPanel 配置文件。这类配置资源可能包含部署细节、访问凭据、内部地址、组件版本或调试开关，公开暴露后会显著增加被侦察和后续利用的风险。
  metadata:
    verified: true
    max-request: 1
  tags: cpanel,config,exposure,discovery

http:
  - method: GET
    path:
      - "{{BaseURL}}/cpanel.config"

    matchers:
      - type: dsl
        dsl:
          - "contains_all(body, 'configuration','user','access_log=')"
          - "status_code == 200"
        condition: and
