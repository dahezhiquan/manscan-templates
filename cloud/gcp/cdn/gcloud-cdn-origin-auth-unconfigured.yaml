id: gcloud-cdn-origin-auth-unconfigured

info:
  name: Unconfigured Cloud CDN Origin Authentication（云安全）
  author: princechaddha
  severity: medium
  description: Cloud CDN 未配置签名 URL 密钥时，依赖 CDN 分发的私有内容缺少边缘访问校验。本模板枚举全局 backend service，并检查 cdnPolicy.signedUrlKeyNames 是否为 null，命中时报告源站访问认证未配置。
  impact: |
    - 私有下载、媒体或付费内容可能被绕过授权直接访问，导致内容泄露或盗链。
    - 未使用签名 URL 会让访问控制更多依赖源站或应用层，增加配置遗漏后的暴露风险。
  remediation: |
    - 对需要保护的 Cloud CDN backend service 配置 signed URL key，并在应用侧签发有过期时间的访问 URL。
    - 定期轮换签名密钥，确保公开内容与私有内容使用不同的 CDN 路径和策略。
  reference:
    - https://cloud.google.com/cdn/docs/using-signed-urls
  metadata:
    vendor: google
    product: cloud-cdn
  tags: cloud,devops,gcp,gcloud,cloud-cdn,gcp-cloud-config

flow: |
  code(1)
  for(let projectId of iterate(template.projectIds)){
    set("projectId", projectId)
    code(2)
    for(let backendService of iterate(template.backendServices)){
      set("backendServiceName", backendService)
      code(3)
    }
  }

self-contained: true

code:
  - engine:
      - sh
      - bash
    source: |
      gcloud projects list --format="json(projectId)"

    extractors:
      - type: json
        name: projectIds
        internal: true
        json:
          - '.[].projectId'

  - engine:
      - sh
      - bash
    source: |
      gcloud compute backend-services list --global --project $projectId --format="json(name,enableCDN)"

    extractors:
      - type: json
        name: backendServices
        internal: true
        json:
          - '.[].name'

  - engine:
      - sh
      - bash
    source: |
      gcloud compute backend-services describe $backendServiceName --global --format="json(cdnPolicy.signedUrlKeyNames)"

    matchers:
      - type: word
        words:
          - 'null'

    extractors:
      - type: dsl
        dsl:
          - '"Unconfigured Cloud CDN Origin Authentication: " + backendServiceName + " in Project: " + projectId'
