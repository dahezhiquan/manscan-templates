id: silverback-detect

info:
  name: Silverback MDM 指纹识别（指纹识别）
  author: nodauf
  severity: info
  description: >-
    Silverback MDM 是移动设备管理平台，用于管理企业移动设备、策略和应用分发。该模板通过请求目标服务并检查预设路径或首页响应、favicon 哈希、DSL
    条件等指纹特征，判断目标是否使用或暴露了 Silverback MDM 相关组件；命中结果仅表示指纹特征匹配，可用于资产盘点、技术栈识别和后续安全评估，不代表已确认存在可利用漏洞。
  reference:
  - https://help.matrix42.com/010_SUEM/020_UEM/30Enterprise_Mobility_Management/010Installation_and_Update/10_Silverback
  metadata:
    verified: true
    max-request: 1
    shodan-query: http.favicon.hash:635899646
  tags: favicon,tech,silverback,mdm,discovery
http:
  - method: GET
    path:
      - "{{BaseURL}}/sts/Content/Images/favicon.ico"

    matchers:
      - type: dsl
        dsl:
          - "status_code==200 && (\"635899646\" == mmh3(base64_py(body)))"
