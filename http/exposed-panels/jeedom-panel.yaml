id: jeedom-panel

info:
  name: Jeedom 登录面板识别（暴露面识别）
  author: pikpikcu,daffainfo
  severity: info
  description: 该模板通过识别 Jeedom 登录入口的页面标题、特征文本或重定向行为，判断目标是否暴露了对应的认证界面。若命中，说明该登录面板对外可访问，可用于暴露面梳理与后续安全评估。
  classification:
    cvss-metrics: CVSS:3.0/AV:N/AC:L/PR:N/UI:N/S:U/C:N/I:N/A:N
    cwe-id: CWE-200
    cpe: cpe:2.3:a:jeedom:jeedom:*:*:*:*:*:*:*:*
  metadata:
    max-request: 1
    vendor: jeedom
    product: jeedom
    shodan-query:
      - http.title:"Jeedom"
      - http.title:"jeedom"
    fofa-query: title="jeedom"
    google-query: intitle:"jeedom"
  tags: panel,jeedom,login,discovery

http:
  - method: GET
    path:
      - "{{BaseURL}}/index.php?v=d"

    matchers-condition: and
    matchers:
      - type: word
        part: body
        words:
          - "<title>Jeedom</title>"
          - "JEEDOM_PRODUCT_NAME"
        condition: and

      - type: status
        status:
          - 200
