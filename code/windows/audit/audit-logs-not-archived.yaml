id: audit-logs-not-archived

info:
  name: 审计日志满时未归档（本地基线扫描）
  author: princechaddha
  severity: high
  description: |
    日志未归档可能导致新事件覆盖旧事件或审计中断。对应基线项为“审计日志达到容量上限时是否未启用归档”；模板使用 `wevtutil get-log security` 检查安全日志保留策略，命中 `retention: false` 时判定日志未按基线保留或归档。
  impact: |
    - 安全事件记录可能丢失，影响告警关联、合规留存和事件响应。
    - 日志缺失会降低入侵发现、事件溯源和合规取证能力。
  remediation: |
    - 配置日志自动归档或集中转发，并设置合理的日志大小和保留策略。
    - 确认日志容量、归档和集中转发链路可用，并监控审计策略被关闭的情况。
  tags: windows,audit,code,windows-audit

self-contained: true

code:
  - pre-condition: |
      IsWindows();
    engine:
      - powershell
      - powershell.exe
    pattern: "*.ps1"
    source: |
      wevtutil get-log security

    matchers:
      - type: word
        words:
          - "retention: false"
