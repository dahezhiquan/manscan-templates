id: fiori-launchpad

info:
  name: Fiori Launchpad 登录面板识别（暴露面识别）
  author: DhiyaneshDk
  severity: info
  description: 该模板通过识别 Fiori Launchpad 登录入口的页面标题、特征文本或重定向行为，判断目标是否暴露了对应的认证界面。若命中，说明该登录面板对外可访问，可用于暴露面梳理与后续安全评估。
  reference:
    - https://www.exploit-db.com/ghdb/7941
  classification:
    cvss-metrics: CVSS:3.0/AV:N/AC:L/PR:N/UI:N/S:U/C:N/I:N/A:N
    cwe-id: CWE-200
    cpe: cpe:2.3:a:sap:fiori_launchpad:*:*:*:*:*:*:*:*
  metadata:
    verified: true
    max-request: 1
    vendor: sap
    product: fiori_launchpad
    google-query:
      - sap/bc/ui5_ui5/ui2/ushell/shells/abap/FioriLaunchpad.html -site:sap.com
      - sap/bc/ui5_ui5/ui2/ushell/shells/abap/fiorilaunchpad.html -site:sap.com
  tags: sap,fiori,edb,panel,discovery

http:
  - method: GET
    path:
      - "{{BaseURL}}/sap/bc/ui5_ui5/ui2/ushell/shells/abap/FioriLaunchpad.html"

    matchers-condition: and
    matchers:
      - type: word
        part: body
        words:
          - "<title>Logon</title>"
          - "SAP SE"
        condition: and

      - type: word
        part: header
        words:
          - "text/html"

      - type: status
        status:
          - 200
