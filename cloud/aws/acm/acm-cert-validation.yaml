id: acm-cert-validation
info:
  name: ACM 证书验证未完成（云安全）
  author: princechaddha
  severity: medium
  description: ACM 证书验证未完成是一类证书签发与续期阻塞风险，通常表示域名所有权证明尚未被 ACM 确认。证书长期处于 PENDING_VALIDATION 状态时，相关证书无法正常签发或完成续期，可能影响后续 HTTPS 入口上线或轮换。模板枚举证书 ARN 后调用 `describe-certificate` 读取 `Certificate.Status`，当状态包含 `PENDING_VALIDATION` 时判定命中。
  impact: |
    - 新证书无法签发，可能阻塞 HTTPS 入口上线、域名切换或证书轮换。
    - 续期验证失败时，现有证书可能在到期后失效，导致业务访问中断。
  remediation: |
    - 根据 ACM 提供的 DNS CNAME 记录或邮箱验证要求完成域名所有权验证。
    - 对不再需要的待验证证书请求进行清理，避免无效证书长期占用管理视图。
  reference:
    - https://docs.aws.amazon.com/acm/latest/userguide/gs-acm-validate.html
  metadata:
    max-request: 2
    vendor: amazon
    product: acm
  tags: cloud,devops,aws,amazon,acm,aws-cloud-config
variables:
  region: "us-east-1"

flow: |
  code(1)
  for(let arns of iterate(template.certificatearns)){
    set("certificatearn", arns)
    code(2)
  }

self-contained: true
code:
  - engine:
      - sh
      - bash
    source: |
      aws acm list-certificates --region $region --output json

    extractors:
      - type: json
        name: certificatearns
        internal: true
        json:
          - '.CertificateSummaryList[] | .CertificateArn'

  - engine:
      - sh
      - bash
    source: |
         aws acm describe-certificate --region $region --certificate-arn $certificatearn --query 'Certificate.Status'

    matchers:
      - type: word
        words:
          - "PENDING_VALIDATION"

    extractors:
      - type: dsl
        dsl:
          - '"The issue/renewal request for " + certificatearn + " SSL/TLS certificate was not validated"'
