id: flexnet-operations-panel

info:
  name: FlexNet Operations 面板识别（指纹识别）
  author: righettod
  severity: info
  description: |-
    检测到目标站点存在 FlexNet Operations 相关响应特征。FlexNet Operations 是监控、日志、分析或可观测性系统，用于展示运行指标、告警事件、日志数据和服务状态。模板请求 `/flexnet/logon.do`，并通过页面标题或正文关键字、状态码、DSL 条件确认该基础设施指纹；命中结果主要用于威胁狩猎、恶意基础设施识别和外部暴露面梳理。
  reference:
    - https://resources.flexera.com/web/media/documents/Datasheet-FNO-Overview.pdf
    - https://www.flexera.com
  metadata:
    verified: true
    max-request: 1
    shodan-query: http.title:"FlexNet Login"
  tags: panel,flexnet,login,detect
http:
  - method: GET
    path:
      - "{{BaseURL}}/flexnet/logon.do"

    matchers:
      - type: dsl
        dsl:
          - 'status_code == 200'
          - 'contains_all(to_lower(body), "flexnet", "login", "forgotpassword.do")'
        condition: and

    extractors:
      - type: regex
        part: body
        group: 1
        regex:
          - 'ver=([0-9_.]+)'
