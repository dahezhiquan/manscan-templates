id: api-mailgun

info:
  name: Mailgun API Token 可用性校验（token喷洒）
  author: zzeitlin
  severity: high
  description: |-
    平台介绍：Mailgun API 是面向消息通知、邮件投递、协同沟通或本地化集成的平台，常用于发送消息、访问团队空间、管理收件域或调用通信接口。该模板用于校验提交的 Mailgun API Token 是否仍然有效。检测逻辑会向 `api.mailgun.net/v3/domains` 发起低影响 API 请求，通过 Basic 认证头传递 `{{token}}`，并依据响应中的 `"total_count":`、`"items":`、`"created_at":` 判断凭据是否可用；命中通常表示该 Token 可被继续调用对应平台能力。
  reference:
    - https://documentation.mailgun.com/en/latest/api-intro.html
    - https://github.com/daffainfo/all-about-apikey/tree/main/mailgun
  metadata:
    max-request: 1
  tags: token-spray,mailgun
  impact: |-
    - 攻击者可读取或发送消息、邮件、团队空间、联系人或通知配置。
    - 泄露 Token 可能被用于钓鱼投递、垃圾消息、数据外传或冒充可信业务系统。
  remediation: |-
    - 立即撤销或轮换已暴露的 API Token，并确认旧 Token 不再可用。
    - 按最小权限原则重新签发凭据，限制作用域、来源地址、项目范围和有效期。
    - 在代码仓库、CI/CD、日志和配置文件中排查泄露来源，避免 Token 再次提交或外传。
self-contained: true

http:
  - method: GET
    path:
      - "https://api.mailgun.net/v3/domains"

    headers:
      Authorization: Basic {{base64('api:' + token)}}
    matchers:
      - type: word
        part: body
        words:
          - '"total_count":'
          - '"items":'
          - '"created_at":'
        condition: and
