id: azure-security-solution-delete-unalerted
info:
  name: Azure 安全解决方案删除告警未配置（云安全）
  author: princechaddha
  severity: high
  description: Microsoft.Security 安全解决方案删除可能移除资源上的安全保护或 Defender 集成；未配置 Activity Log 告警时，保护能力下降可能不被及时发现。该模板枚举已启用的 Activity Log Alert，并检查 condition 是否缺少 Microsoft.Security/securitySolutions/delete 操作条件。
  impact: |
    - 删除安全解决方案可能使恶意软件、漏洞或配置风险失去持续检测。
    - 保护组件被移除后，攻击者可能获得更长的活动窗口，事件响应也会缺少关键线索。
  remediation: |
    - 创建针对安全解决方案删除操作的 Activity Log Alert，并接入 Defender 和 SOC 响应流程。
    - 限制安全解决方案删除权限，定期验证 Defender 保护状态和相关安全连接是否仍然存在。
  reference:
    - https://docs.microsoft.com/en-us/azure/azure-monitor/platform/alerts-activity-log
  metadata:
    vendor: microsoft
    product: azure-monitor
  tags: cloud,devops,azure,microsoft,security-solution,azure-cloud-config

flow: |
  code(1);
  for (let AlertData of iterate(template.alertList)) {
    set("id", AlertData);
    code(2);
  }

self-contained: true
code:
  - engine:
      - sh
      - bash
    source: |
      az monitor activity-log alert list --output json --query '[?(enabled==`true`)].id'

    extractors:
      - type: json
        name: alertList
        internal: true
        json:
          - '.[]'

  - engine:
      - sh
      - bash
    source: |
      az monitor activity-log alert show --ids "$id" --query 'condition'

    matchers-condition: and
    matchers:
      - type: word
        words:
          - '"field": "operationName"'

      - type: word
        words:
          - "Microsoft.Security/securitySolutions/delete"
        negative: true

    extractors:
      - type: dsl
        dsl:
          - 'id + " does not have the correct alert configuration for Delete Security Solution events"'
