id: azure-nsg-oracle-db-unrestricted
info:
  name: Azure NSG 对互联网开放 Oracle 数据库端口（云安全）
  author: princechaddha
  severity: high
  description: Oracle Database Listener 通常使用 TCP 1521；将该端口对互联网开放会把数据库连接入口暴露给扫描、认证攻击和监听器漏洞利用。本模板查询入站允许的 TCP 1521 NSG 规则，并在来源地址为 *、internet 或 any 时报告。
  impact: |
    - 攻击者可能枚举服务、尝试窃取数据库凭据，或利用配置和软件缺陷读取、篡改业务数据。
    - 数据库被控制后可能影响依赖应用，并成为访问其他云资源或内部主机的跳板。
  remediation: |
    - 删除面向互联网的 TCP 1521 入站规则，使用专用子网、VPN 或 Private Endpoint 访问 Oracle。
    - 限制 Listener 来源和数据库账户权限，启用加密连接、补丁管理及异常登录监控。
  reference:
    - https://docs.microsoft.com/en-us/azure/virtual-network/network-security-groups-overview
  metadata:
    vendor: microsoft
    product: azure-network-security-group
  tags: cloud,devops,azure,microsoft,nsg,azure-cloud-config

flow: |
  code(1);
  for (let NsgData of iterate(template.nsgdata)) {
    NsgData = JSON.parse(NsgData)
    set("nsg", NsgData.name)
    set("resourcegroup", NsgData.resourceGroup)
    code(2)
  }

self-contained: true
code:
  - engine:
      - sh
      - bash
    source: |
      az network nsg list --query '[*].{name:name, resourceGroup:resourceGroup}' --output json

    extractors:
      - type: json
        name: nsgdata
        internal: true
        json:
          - '.[]'

  - engine:
      - sh
      - bash
    source: |
      az network nsg rule list --nsg-name $nsg --resource-group $resourcegroup --query "[?direction=='Inbound' && access=='Allow' && protocol=='TCP' && (destinationPortRange=='1521')]"

    matchers:
      - type: word
        words:
          - '"sourceAddressPrefix": "*"'
          - '"sourceAddressPrefix": "internet"'
          - '"sourceAddressPrefix": "any"'

    extractors:
      - type: dsl
        dsl:
          - 'nsg + " has unrestricted access on TCP port 1521"'
