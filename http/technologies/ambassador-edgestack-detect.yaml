id: ambassador-edgestack-detect

info:
  name: Ambassador Edge Stack 指纹识别（指纹识别）
  author: ja1sh
  severity: info
  description: |-
    Ambassador Edge Stack 是 Kubernetes API 网关和入口控制平台，用于服务路由、认证、限流和流量治理。该模板请求首页，并依据 HTTP 200/404 状态码、页面标题、正文关键字或品牌资源特征识别目标是否使用或暴露了 Ambassador Edge Stack 相关组件，适用于资产盘点、技术栈识别和后续安全评估；命中结果仅表示指纹特征匹配，不代表已确认存在可利用漏洞。
  metadata:
    verified: true
    max-request: 1
    shodan-query: title:"Ambassador Edge Stack"
  tags: tech,ambassador,gateway,discovery

http:
  - method: GET
    path:
      - "{{BaseURL}}"

    matchers-condition: and
    matchers:
      - type: word
        part: body
        words:
          - "Ambassador Edge Stack</p>"

      - type: status
        status:
          - 200
          - 404
        condition: or
