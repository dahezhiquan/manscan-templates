id: smb-signing-not-required

info:
  name: SMB 签名未强制要求（本地基线扫描）
  author: princechaddha
  severity: high
  description: |
    未签名 SMB 流量可能被篡改或中继。对应基线项为“SMB 通信是否未强制签名”；模板读取注册表 `HKLM:\SYSTEM\CurrentControlSet\Services\LanmanServer\Parameters` 的 `RequireSecuritySignature` 值，结合命中值判断策略是否不符合基线。
  impact: |
    - 攻击者可实施中间人攻击、会话中继或数据篡改。
    - 远程入口暴露或协议保护不足会增加暴力破解、中间人攻击和远程控制风险。
  remediation: |
    - 配置 SMB 客户端和服务器要求安全签名。
    - 限制访问来源，优先使用加密和强认证，并关闭无业务需求的远程服务。
  tags: windows,smb,signing,code,windows-audit

self-contained: true

code:
  - pre-condition: |
      IsWindows();
    engine:
      - powershell
      - powershell.exe
    args:
      - -ExecutionPolicy
      - Bypass
    pattern: "*.ps1"
    source: |
      Get-ItemProperty -Path 'HKLM:\SYSTEM\CurrentControlSet\Services\LanmanServer\Parameters' -Name 'RequireSecuritySignature'

    matchers:
      - type: word
        words:
          - "requiresecuritysignature : 0"
