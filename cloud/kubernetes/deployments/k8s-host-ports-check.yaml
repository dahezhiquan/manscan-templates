id: k8s-host-ports-check

info:
  name: Host ports should not be used（云安全）
  author: princechaddha
  severity: medium
  description: Deployment 使用 hostPort 会把容器端口直接绑定到节点网络命名空间，绕过部分 Kubernetes Service 抽象和端口调度隔离。本模板枚举 Deployment 容器端口配置，发现任意 container.ports.hostPort 即报告。
  impact: |
    - 同一节点端口可能被固定占用，影响调度弹性并增加端口冲突。
    - 服务直接暴露在节点网络上，可能绕过预期的 Service、Ingress 或 NetworkPolicy 控制。
  remediation: |
    - 优先使用 Service、Ingress、Gateway 或 NodePort/LoadBalancer 等受控暴露方式替代 hostPort。
    - 确需 hostPort 时限制调度节点、端口范围和来源访问，并记录业务例外。
  reference:
    - https://kubernetes.io/docs/concepts/services-networking/service/
  metadata:
    vendor: kubernetes
    product: kubernetes
  tags: cloud,devops,kubernetes,devsecops,deployments,k8s-cluster-security
flow: |
  code(1);
  for (let deployment of template.items) {
    set("deployment", deployment)
    javascript(1);
  }

self-contained: true
code:
  - engine:
      - sh
      - bash
    source: kubectl get deployments --all-namespaces --output=json
    extractors:
      - type: json
        name: items
        internal: true
        json:
          - '.items[] | {name: .metadata.name, namespace: .metadata.namespace, containers: .spec.template.spec.containers}'

javascript:
  - code: |
        let deploymentData = JSON.parse(template.deployment);
        deploymentData.containers.forEach(container => {
          if (container.ports && container.ports.some(port => port.hostPort)) {
            let result = (`Deployment '${deploymentData.name}' in namespace '${deploymentData.namespace}' uses host ports.`);
            Export(result);
          }
        });

    extractors:
      - type: dsl
        dsl:
          - response
