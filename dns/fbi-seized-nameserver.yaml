id: fbi-seized-nameserver

info:
  name: FBI 扣押域名服务器识别（dns）
  author: rxerium
  severity: low
  description: |
    部分执法机构或域名扣押行动会将目标域名委派到专用的扣押名称服务器或相关 Cloudflare 名称服务器。命中这类 NS 记录通常表示域名的解析控制权已被接管、暂停或处于执法处置状态，但仅凭 DNS 记录不能判断具体法律原因。本模板查询 NS，并匹配预置的 FBI、USSS 及扣押行动相关名称服务器。
  impact: |
    - 域名可能无法继续提供正常网站、API 或邮件服务，业务链接和用户访问会被导向不可用或官方处置页面。
    - 名称服务器异常会暴露域名控制状态和资产处置情况，并可能造成品牌声誉、邮件接收和业务连续性影响。
  remediation: |
    - 核实域名注册商、权威 DNS 和相关法律处置状态，区分真实扣押、误配置和历史遗留记录。
    - 对已不再使用的域名从资产、邮件和应用配置中下线；如需恢复服务，只在获得授权后恢复正确的注册商和 NS 委派。
    - 保留 DNS 变更和处置证据，并监控注册商、名称服务器和证书状态的后续变化。
  classification:
    cwe-id: CWE-200
  metadata:
    max-request: 1
    shodan-query: title:"THIS WEBSITE HAS BEEN SEIZED"
    fofa-query: title="THIS WEBSITE HAS BEEN SEIZED"
  tags: dns,ns,darkweb,fbi,seized,discovery

dns:
  - name: "{{FQDN}}"
    type: NS

    matchers:
      - type: word
        words:
          - "ns1.fbi.seized.gov"
          - "ns2.fbi.seized.gov"
          - "ns3.fbi.seized.gov"
          - "jocelyn.ns.cloudflare.com"
          - "plato.ns.cloudflare.com"
          - "ns1.usssdomainseizure.com"
          - "ns2.usssdomainseizure.com"
        condition: or

    extractors:
      - type: regex
        group: 1
        regex:
          - "IN\\tNS\\t(.+)"
