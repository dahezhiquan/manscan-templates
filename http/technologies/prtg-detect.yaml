id: prtg-detect

info:
  name: PRTG Network Monitor 指纹识别（指纹识别）
  author: geeknik
  severity: info
  description: >-
    PRTG Network Monitor 是网络与基础设施监控平台，用于监控设备、带宽、服务和告警。该模板通过请求目标服务并检查预设路径或首页响应、状态码、页面正文关键字、HTTP
    响应头、正则特征等指纹特征，判断目标是否使用或暴露了 PRTG Network Monitor 相关组件；命中结果仅表示指纹特征匹配，可用于资产盘点、技术栈识别和后续安全评估，不代表已确认存在可利用漏洞。
  metadata:
    max-request: 3
  tags: tech,prtg,discovery
http:
  - method: GET
    path:
      - "{{BaseURL}}/index.htm"
      - "{{BaseURL}}/prtg/index.htm"
      - "{{BaseURL}}/PRTG/index.htm"

    stop-at-first-match: true

    matchers-condition: and
    matchers:
      - type: status
        status:
          - 200

      - type: word
        part: body
        words:
          - "PRTG Network Monitor"

      - type: regex
        part: header
        regex:
          - PRTG

    extractors:
      - type: kval
        part: header
        kval:
          - Server
