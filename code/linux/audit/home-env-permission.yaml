id: home-env-permission

info:
  name: 用户家目录环境文件权限异常（本地基线扫描）
  author: songyaeji
  severity: medium
  description: |
    用户家目录中的 shell 启动文件会在登录或打开 shell 时执行，若属主错误或可被其他用户写入，攻击者可植入命令实现持久化或窃取会话信息。模板遍历 `/home` 下用户的 `.bashrc`、`.bash_profile`、`.bash_logout`，检查属主是否为 root 或用户本人，并匹配组/其他用户可写权限。
  impact: |
    - 本地攻击者可篡改其他用户的 shell 初始化流程，等待目标登录后执行恶意命令。
    - 可导致凭据窃取、环境变量污染、持久化或权限提升链条扩大。
  remediation: |
    - 将相关 shell 启动文件属主恢复为用户本人或 root，并移除组/其他用户写权限。
    - 排查异常内容和最近修改记录，必要时重置用户环境文件并审计本地账号权限。
  reference:
    - https://isms.kisa.or.kr
  tags: linux,local,audit,compliance,kisa

self-contained: true

code:
  - engine:
      - sh
      - bash
    source: |
      for user in $(awk -F: '$6 ~ /^\/home/ {print $1}' /etc/passwd); do
        HOME_DIR=$(eval echo ~$user)
        find "$HOME_DIR" -maxdepth 1 -type f \
          \( -name ".bashrc" -o -name ".bash_profile" -o -name ".bash_logout" \) \
          -exec ls -l {} \; | awk -v usr="$user" '{
            if ($3 != "root" && $3 != usr) print "INVALID_OWNER", $0
            else print $0
          }'
      done

    matchers:
      - type: regex
        name: insecure-perms
        part: response
        regex:
          - "^-.{5}w"   # group writable
          - "^-.{8}w"   # other/world writable

      - type: regex
        name: invalid-owner
        part: response
        regex:
          - "^INVALID_OWNER"
