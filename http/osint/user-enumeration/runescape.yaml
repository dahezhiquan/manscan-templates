id: runescape

info:
  name: RuneScape 用户名信息枚举（OSINT）
  author: princechaddha,rxerium
  severity: info
  description: |
    RuneScape 是面向游戏玩家、电竞社区或游戏资料管理的在线平台，用户资料页通常会公开展示玩家昵称、战绩、收藏或社区活动记录。该模板用于在公开互联网侧枚举 RuneScape 用户名，不需要认证；模板请求公开路径 https://apps.runescape.com/runemetrics/app/overview/player/用户名，并结合响应状态为 200、页面或响应内容命中 “RuneMetrics - RuneScape player pro...” 等资料页特征判断目标用户名是否存在。该检查属于 OSINT 用户枚举，结果仅表示公开资料页或公开搜索结果可被访问，不代表目标平台存在可直接修复的漏洞。
  classification:
    cvss-metrics: CVSS:3.1/AV:N/AC:L/PR:N/UI:N/S:U/C:N/I:N/A:N
    cvss-score: 0
    cwe-id: CWE-200
  metadata:
    max-request: 1
    verified: true
  tags: osint,osint-gaming,runescape,discovery

self-contained: true

http:
  - method: GET
    path:
      - "https://apps.runescape.com/runemetrics/app/overview/player/{{user}}"

    matchers-condition: and
    matchers:
      - type: status
        status:
          - 200

      - type: word
        part: body
        words:
          - "RuneMetrics - RuneScape player profiles and stat tracking"
