id: nimsoft-wasp

info:
  name: Nimsoft WASP 指纹识别（指纹识别）
  author: Nullfuzz
  severity: info
  description: >-
    Nimsoft WASP 是 CA/UIM 监控平台中的 Web 应用服务探针组件，用于承载监控控制台和相关 Web 服务。该模板通过请求目标服务并检查预设路径或首页响应、页面正文关键字、状态码等指纹特征，判断目标是否使用或暴露了
    Nimsoft WASP 相关组件；命中结果仅表示指纹特征匹配，可用于资产盘点、技术栈识别和后续安全评估，不代表已确认存在可利用漏洞。
  metadata:
    max-request: 1
  tags: nimsoft,exposure,tech,discovery
http:
  - method: GET
    path:
      - "{{BaseURL}}"

    matchers-condition: and
    matchers:
      - type: word
        words:
          - "Powered by <b>Nimsoft WASP "
          - "<title>WASP</title>"
        condition: or

      - type: status
        status:
          - 200
