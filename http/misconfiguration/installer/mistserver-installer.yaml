id: mistserver-installer

info:
  name: Mist服务器 安装 Wizard 暴露
  author: DhiyaneshDk
  severity: high
  description: |
    检测到 Mist服务器 安装 Wizard 暴露。该页面属于安装、初始化或配置向导流程，若对外暴露，攻击者可能完成初始化、创建管理员账户或重新配置目标系统。
  reference:
    - https://docs.mistserver.org/mistserver/configuration
    - https://mistserver.org/
  impact: |
    - 攻击者可能接管初始化流程、创建管理员账户或覆盖现有配置。
    - 暴露的安装页面可能导致系统被重新部署或植入恶意配置。
  metadata:
    verified: true
    max-request: 1
    shodan-query: http.title:"MistServer"
    fofa-query: title="MistServer"
    product: mistserver
    vendor: ddvtech
  tags: misconfig,mistserver,install,exposure

http:
  - method: GET
    path:
      - "{{BaseURL}}"

    matchers-condition: and
    matchers:
      - type: word
        part: body
        words:
          - "MistServer"
          - "Management Interface"
        condition: and

      - type: word
        part: body
        words:
          - "Create new account"
          - "No account has been created yet"
          - "Select other host"
        condition: or

      - type: status
        status:
          - 200
