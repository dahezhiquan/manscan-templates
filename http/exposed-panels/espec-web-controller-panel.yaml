id: espec-web-controller-panel

info:
  name: Espec Web Controller 面板（暴露面识别）
  severity: info
  author: darses
  description: |
    该模板通过识别 Espec Web Controller 面板、控制台或管理界面的页面特征，判断目标是否暴露了对应服务入口。若命中，说明该后台或运维界面对外可访问，可用于资产识别与暴露面排查。
  reference:
    - https://espec.com/na/products/option_detail/web_controller/
  metadata:
    max-request: 2
    vendor: espec
    product: web_controller
    shodan-query:
      - title:"Espec Web Controller"
      - http.favicon.hash:529766441
    fofa-query:
      - title="Espec Web Controller"
      - icon_hash="1190353375"
  tags: panel,espec,ics,login,discovery

http:
  - method: GET
    path:
      - "{{BaseURL}}/version"

    matchers-condition: and
    matchers:
      - type: word
        part: body
        words:
          - "Espec Web Controller"

      - type: status
        status:
          - 200

    extractors:
      - type: regex
        group: 1
        regex:
          - "Version: ([\\d\\.]+)"
