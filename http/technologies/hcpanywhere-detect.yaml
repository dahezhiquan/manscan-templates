id: hcpanywhere-detect

info:
  name: HCP Anywhere 指纹识别（指纹识别）
  author: righettod
  severity: info
  description: >-
    HCP Anywhere 是 Hitachi Vantara 的企业文件同步与共享平台，用于跨设备访问和共享企业文件。该模板通过请求目标服务并检查预设路径或首页响应、DSL
    条件等指纹特征，判断目标是否使用或暴露了 HCP Anywhere 相关组件；命中结果仅表示指纹特征匹配，可用于资产盘点、技术栈识别和后续安全评估，不代表已确认存在可利用漏洞。
  reference:
  - https://hcpanywhere.hds.com/portal/public/help-complete/en/cp_hcpaw_what_is.html
  metadata:
    verified: true
    max-request: 1
    shodan-query: icon_hash="915499123"
  tags: tech,hcpanywhere,discovery
http:
  - method: GET
    path:
      - "{{BaseURL}}/userportal/documentation/mapping.json"

    matchers:
      - type: dsl
        dsl:
          - 'status_code == 200'
          - 'contains_any(body, "brandedUrl", "helpId", "url") && contains(body, "hcpaw")'
        condition: and
