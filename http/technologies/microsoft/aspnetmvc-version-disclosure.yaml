id: aspnetmvc-version-disclosure

info:
  name: ASP.NET MVC 指纹识别（指纹识别）
  author: lucky0x0d,PulseSecurity.co.nz
  severity: info
  description: >-
    ASP.NET MVC 是 Microsoft .NET 的 MVC Web 框架，用于构建分层的服务端 Web 应用。该模板通过请求目标服务并检查预设路径或首页响应、DSL
    条件等指纹特征，判断目标是否使用或暴露了 ASP.NET MVC 相关组件；命中结果仅表示指纹特征匹配，可用于资产盘点、技术栈识别和后续安全评估，不代表已确认存在可利用漏洞。
  classification:
    cvss-metrics: CVSS:3.1/AV:N/AC:L/PR:N/UI:N/S:U/C:N/I:N/A:N
    cvss-score: 0
    cwe-id: CWE-200
  metadata:
    verified: true
    max-request: 1
    shodan-query: "X-AspNetMvc-Version"
  tags: aspnetmvc,tech,detect,discovery
http:
  - method: GET
    path:
      - "{{BaseURL}}"
      - "{{BaseURL}}/%3f"

    stop-at-first-match: true
    redirects: true
    max-redirects: 4
    matchers:
      - type: dsl
        dsl:
          - 'contains(tolower(header), "x-aspnetmvc-version")'

    extractors:
      - type: kval
        kval:
          - X_AspNetMvc_Version
