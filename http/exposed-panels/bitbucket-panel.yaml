id: bitbucket-panel

info:
  name: Bitbucket 面板识别（指纹识别）
  author: Shivam Kamboj
  severity: info
  description: |-
    检测到目标站点存在 Bitbucket 相关响应特征。Bitbucket 是 Atlassian 的 Git 代码托管与协作平台，用于管理仓库、分支、代码评审和 CI/CD 集成。模板请求 `/login`、`/` 路径，并通过页面标题或正文关键字、状态码、DSL 条件确认该系统指纹，用于资产识别、系统盘点和暴露面梳理。
  reference:
    - https://bitbucket.org/
    - https://www.atlassian.com/software/bitbucket
  metadata:
    verified: true
    max-request: 2
    vendor: atlassian
    product: bitbucket
    shodan-query:
      - http.title:"Bitbucket"
      - http.component:"Atlassian Bitbucket"
    fofa-query:
      - title="Bitbucket"
      - body="atlassian-token"
    google-query: intitle:"Bitbucket" inurl:"/login"
  tags: panel,bitbucket,login,detect,discovery
http:
  - method: GET
    path:
      - "{{BaseURL}}/login"
      - "{{BaseURL}}"

    stop-at-first-match: true
    host-redirects: true
    max-redirects: 2
    matchers:
      - type: dsl
        dsl:
          - 'contains_any(body, "com.atlassian.bitbucket.server", "/download/contextbatch/css/bitbucket.page", "/download/contextbatch/js/bitbucket", "bitbucket-webpack-INTERNAL", "bitbucket-header-logo", "bitbucket-theme")'
          - 'status_code == 200 || status_code == 302'
        condition: and
