id: esafenet-cdg-cdgauthorisetempletservice1-sqli
info:
  name: 亿赛通 CDG cdgauthorisetempletservice1 接口 - SQL 注入漏洞
  author: Chaitin
  severity: high
  metadata:
    verified: true
    max-request: 2
    vuln-id: CT-1404715
    vendor: esafenet
    product: cdg
  tags: sqli,vuln,esafenet
flow: http(1) || http(2)
http:
- method: POST
  path:
  - '{{BaseURL}}/CDGServer3/CDGAuthoriseTempletService1'
  headers:
    Accept-Encoding: gzip, deflate
    Content-Type: application/xml
  body: 
  matchers:
  - type: dsl
    dsl:
    - 'status_code == 200 && contains(body, "FEPCCCLCENHIPOAFPAPDDFCGEAPNMDBM")'
