id: wp-bricks-builder-theme

info:
  name: WordPress Bricks Builder Theme 版本指纹识别（指纹识别）
  author: Anonymous
  severity: info
  description: |
    用于识别目标是否部署 WordPress Bricks Builder Theme 版本 并提取相关版本或构建信息，模板会结合页面正文、状态码、特定路径或已知端点和版本或标识提取结果进行指纹匹配。
  reference:
    - https://0day.today/exploit/description/39489
  classification:
    cpe: cpe:2.3:a:bricksbuilder:bricks:*:*:*:*:wordpress:*:*:*
  metadata:
    verified: true
    max-request: 1
    vendor: bricksbuilder
    product: bricks
    publicwww-query: "/wp-content/themes/bricks/"
  tags: wordpress,theme,wp-theme,wp,bricks,discovery

http:
  - method: GET
    path:
      - "{{BaseURL}}/wp-content/themes/bricks/readme.txt"

    matchers-condition: and
    matchers:
      - type: word
        part: body
        words:
          - "Bricks - Visual Website Builder"

      - type: regex
        part: body
        regex:
          - "Stable tag:([ 0-9.]+)"

      - type: status
        status:
          - 200
