id: pexip-detect

info:
  name: Pexip 指纹识别（指纹识别）
  author: righettod
  severity: info
  description: >-
    Pexip 是视频会议和协作平台，用于会议桥接、互通网关和企业音视频通信。该模板通过请求目标服务并检查预设路径或首页响应、DSL 条件等指纹特征，判断目标是否使用或暴露了
    Pexip 相关组件；命中结果仅表示指纹特征匹配，可用于资产盘点、技术栈识别和后续安全评估，不代表已确认存在可利用漏洞。
  reference:
  - https://www.pexip.com/
  classification:
    cpe: cpe:2.3:a:pexip:pexip_infinity:*:*:*:*:*:*:*:*
  metadata:
    verified: true
    max-request: 1
    vendor: pexip
    product: pexip_infinity
    shodan-query: http.title:"Pexip Connect for Web"
  tags: tech,pexip,detect,discovery
http:
  - method: GET
    path:
      - "{{BaseURL}}"

    host-redirects: true
    max-redirects: 2
    matchers:
      - type: dsl
        dsl:
          - 'status_code == 200'
          - 'contains(body, "<title>Pexip Connect for Web")'
        condition: and
