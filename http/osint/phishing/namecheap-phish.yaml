id: namecheap-phish

info:
  name: Namecheap 仿冒钓鱼网站（钓鱼网站识别）
  author: rxerium
  severity: info
  description: |
    检测到疑似仿冒 Namecheap 的钓鱼网站。模板在目标页面返回 200、页面内容命中 Namecheap 的品牌页面特征，且当前主机不属于 namecheap.com 官方域名时触发，用于识别借用 Namecheap 品牌页面诱导用户信任的仿冒站点。
  reference:
    - https://namecheap.com
  metadata:
    max-request: 1
  tags: phishing,namecheap,domain,osint,discovery
http:
  - method: GET
    path:
      - "{{BaseURL}}"

    host-redirects: true
    max-redirects: 2

    matchers-condition: and
    matchers:
      - type: word
        words:
          - 'Register domain names at Namecheap. Buy cheap domain names and enjoy 24/7 support. With over 18 million domains under management, you know you’re in good hands.'

      - type: status
        status:
          - 200

      - type: dsl
        dsl:
          - '!contains(host,"namecheap.com")'
