id: clever-takeover

info:
  name: Clever Cloud 应用缺失接管检测（子域名接管）
  author: supr4s
  severity: high
  description: 检测 Clever Cloud 返回应用不存在提示的情况，说明目标子域名可能仍解析到 Clever Cloud 但没有关联有效应用，可被重新部署应用后接管。
  reference:
    - https://supras.io/new-subdomain-takeover-case-clever-cloud/
  metadata:
    max-request: 1
  tags: takeover,vuln

http:
  - method: GET
    path:
      - "{{BaseURL}}"

    matchers-condition: and
    matchers:
      - type: dsl
        dsl:
          - Host != ip

      - type: word
        part: body
        words:
          - "The application you're trying to access doesn't seem to exist"
          - "support@clever-cloud.com"
        condition: and

    extractors:
      - type: dsl
        dsl:
          - cname
