id: webserver-sap-netweaver-webgui

info:
  name: SAP NetWeaver WebGUI 指纹识别（指纹识别）
  author: randomstr1ng
  severity: info
  description: >-
    SAP NetWeaver WebGUI 是 SAP GUI 的浏览器访问入口，用于通过 Web 方式访问 SAP 业务系统。该模板通过请求目标服务并检查预设路径或首页响应、页面正文关键字等指纹特征，判断目标是否使用或暴露了
    SAP NetWeaver WebGUI 相关组件；命中结果仅表示指纹特征匹配，可用于资产盘点、技术栈识别和后续安全评估，不代表已确认存在可利用漏洞。
  metadata:
    max-request: 1
  tags: sap,webserver,tech,discovery
http:
  - method: GET
    path:
      - "{{BaseURL}}/sap/bc/gui/sap/its/webgui"

    host-redirects: true
    max-redirects: 2
    matchers:
      - type: word
        part: body
        words:
          - "sap-system-login"
          - "<title>Logon</title>"
        condition: or
