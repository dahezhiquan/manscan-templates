id: qualcomm-voip-router

info:
  name: Qualcomm 4G LTE WiFi VoIP Router 面板识别（暴露面识别）
  author: pussycat0x
  severity: info
  description: 该模板通过识别 Qualcomm 4G LTE WiFi VoIP Router 面板、控制台或管理界面的页面特征，判断目标是否暴露了对应服务入口。若命中，说明该后台或运维界面对外可访问，可用于资产识别与暴露面排查。
  classification:
    cvss-metrics: CVSS:3.0/AV:N/AC:L/PR:N/UI:N/S:U/C:N/I:N/A:N
    cwe-id: CWE-200
    cpe: cpe:2.3:o:qualcomm:qca4531_firmware:*:*:*:*:*:*:*:*
  metadata:
    max-request: 1
    fofa-query: app="Qualcomm-4G-LTE-WiFi-VoIP-Router"
    product: qca4531_firmware
    vendor: qualcomm
  tags: panel,qualcomm,iot,router,voip,discovery

http:
  - method: GET
    path:
      - "{{BaseURL}}"

    matchers-condition: and
    matchers:
      - type: word
        part: body
        words:
          - '<title>4G LTE WiFi VoIP Router</title>'

      - type: status
        status:
          - 200
