id: apache-pinot-detect

info:
  name: Apache Pinot 指纹识别（指纹识别）
  author: icarot
  severity: info
  description: |
    用于识别目标是否使用 Apache Pinot，模板会结合页面标题、状态码和特定路径或已知端点进行技术指纹匹配。
  classification:
    cpe: cpe:2.3:a:apache:pinot:*:*:*:*:*:*:*:*
  metadata:
    max-request: 1
    verified: true
    vendor: apache
    product: pinot
    shodan-query: title:"Apache Pinot"
  tags: tech,pinot,apache,detect,discovery

http:
  - method: GET
    path:
      - "{{BaseURL}}/"

    matchers-condition: and
    matchers:
      - type: word
        words:
          - '<title>Apache Pinot</title>'

      - type: status
        status:
          - 200
