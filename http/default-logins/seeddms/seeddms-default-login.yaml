id: seeddms-default-login

info:
  name: SeedDMS 默认口令登录（弱口令）
  author: alifathi-h1
  severity: high
  description: |
    该模板用于检测 SeedDMS 是否仍可使用默认凭据或弱口令登录。模板主要向 `/op/op.Login.php` 等认证入口发送请求，使用内置默认凭据组合进行认证尝试，并根据响应中的 `Location: /out/out.ViewFolder.php` 等登录成功特征判断登录是否成功；命中说明目标未及时修改出厂、示例或初始化账号口令。
  impact: |
    - 攻击者可登录 SeedDMS 后台，管理内容、用户、插件、主题、文件、表单或业务流程配置。
    - 后台权限被滥用后，可能导致页面篡改、恶意文件上传、敏感资料泄露，或进一步取得服务器执行能力。
  remediation: |
    - 立即修改默认管理员凭据，删除安装向导、演示账号和不必要的后台用户。
    - 限制后台登录入口访问来源，启用多因素认证、登录失败锁定和验证码等防护。
    - 检查近期内容、插件、主题、文件上传和管理员操作记录，确认没有持久化后门。
  reference:
    - https://www.seeddms.org/index.php?id=2
    - https://www.redhat.com/sysadmin/install-seeddms
  classification:
    cvss-metrics: CVSS:3.0/AV:N/AC:L/PR:N/UI:N/S:C/C:L/I:L/A:L
    cvss-score: 8.3
    cwe-id: CWE-522
    cpe: cpe:2.3:a:seeddms:seeddms:*:*:*:*:*:*:*:*
  metadata:
    max-request: 1
    shodan-query: http.title:"SeedDMS"
    product: seeddms
    vendor: seeddms
  tags: default-login,seeddms,vuln

http:
  - raw:
      - |
        POST /op/op.Login.php HTTP/1.1
        Host: {{Hostname}}
        Content-Type: application/x-www-form-urlencoded; charset=UTF-8

        login={{username}}&pwd={{password}}&lang=

    payloads:
      username:
        - admin
      password:
        - admin
    attack: pitchfork

    matchers-condition: and
    matchers:
      - type: word
        part: header
        words:
          - 'Location: /out/out.ViewFolder.php'

      - type: status
        status:
          - 302
