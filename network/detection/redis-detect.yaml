id: redis-detect

info:
  name: Redis 服务识别（指纹识别）
  author: pussycat0x
  severity: info
  description: |
    Redis 是内存键值数据库和缓存服务，常用于缓存、会话、队列和实时数据处理。该模板连接目标 Redis 端口并发送 INFO 命令，通过正常版本信息、认证或 ACL 拒绝、保护模式、加载或忙状态，以及 INFO 命令被禁用时的 Redis 协议错误识别目标服务。若响应包含 redis_version，则只提取服务端声明的数字点分版本号。
  classification:
    cvss-metrics: CVSS:3.1/AV:N/AC:L/PR:N/UI:N/S:U/C:N/I:N/A:N
    cwe-id: CWE-200
  metadata:
    verified: true
    max-request: 2
    shodan-query: product:"redis"
    product: redis
    vendor: redis
  tags: network,redis,detect,tcp,discovery
tcp:
  - inputs:
      - data: "*1\r\n$4\r\ninfo\r\n"

    host:
      - "{{Hostname}}"
      - "tls://{{Hostname}}"
    port: 6379,6380
    read-size: 1024

    matchers-condition: or
    matchers:
      - type: word
        part: data
        words:
          - "redis_version:"
          - "DENIED Redis"
          - "CONFIG REWRITE"
          - "NOAUTH Authentication"
          - "NOPERM this user has no permissions"
          - "LOADING Redis is loading"
          - "BUSY Redis is busy"
        condition: or

      - type: regex
        part: data
        regex:
          - "(?im)^-ERR unknown command [`']?info[`']?"

    extractors:
      - type: regex
        name: redis-version
        part: data
        regex:
          - '(?m)^redis_version:([0-9]+(?:\.[0-9]+)+)(?:[^0-9.]|$)'
        group: 1
