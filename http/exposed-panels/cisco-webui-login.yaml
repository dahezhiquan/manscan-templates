id: cisco-webui-login

info:
  name: Cisco Web UI 登录识别（指纹识别）
  author: drewvravick
  severity: info
  description: |
    该模板通过识别 Cisco Web UI 登录入口的页面标题、特征文本或重定向行为，判断目标是否暴露了对应的认证界面。若命中，说明该登录面板对外可访问，可用于暴露面梳理与后续安全评估。
  metadata:
    verified: true
    max-request: 1
    shodan-query: html:"webui-centerpanel"
    fofa-query: body="webui-centerpanel"
  tags: webui,cisco,login,panel,detect,discovery

http:
  - method: GET
    path:
      - "{{BaseURL}}"
      - "{{BaseURL}}/webui/"

    redirects: true
    stop-at-first-match: true
    matchers-condition: and
    matchers:
      - type: word
        part: body
        words:
          - "Cisco Systems"
          - "webui-centerpanel"
        condition: and

      - type: status
        status:
          - 200
