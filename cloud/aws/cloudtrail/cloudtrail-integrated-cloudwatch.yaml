id: cloudtrail-integrated-cloudwatch
info:
  name: CloudTrail 未集成 CloudWatch Logs（云安全）
  author: princechaddha
  severity: medium
  description: CloudTrail 未集成 CloudWatch Logs 是一类实时监控与告警能力缺失风险，审计事件可能只能事后从日志存储中分析。缺少日志流集成会影响指标过滤器、告警和自动化响应对高风险 API 活动的及时发现。模板读取 `trailList[*].CloudWatchLogsLogGroupArn`，当返回为空数组时判定未配置 CloudWatch Logs 集成。
  impact: |
    - 高风险 API 活动可能只能事后在 S3 日志中分析，无法及时触发 CloudWatch 告警。
    - 安全运营团队对异常权限变更、登录失败或敏感操作的响应延迟会增加。
  remediation: |
    - 为关键 CloudTrail trail 配置 CloudWatch Logs 日志组和具备写入权限的 IAM 角色。
    - 基于关键 CloudTrail 事件创建指标过滤器和告警，覆盖身份变更、审计配置变更等高风险行为。
  reference:
    - https://docs.aws.amazon.com/awscloudtrail/latest/userguide/send-cloudtrail-events-to-cloudwatch-logs.html
  metadata:
    max-request: 2
    vendor: amazon
    product: cloudtrail
  tags: cloud,devops,aws,amazon,cloudtrail,cloudwatch,aws-cloud-config
variables:
  region: "ap-south-1"

flow: |
  code(1)
  for(let CloudTrail of iterate(template.cloudtrailname)){
    set("trail", CloudTrail)
    code(2)
  }

self-contained: true
code:
  - engine:
      - sh
      - bash
    source: |
      aws cloudtrail list-trails --region $region --query 'Trails[*].Name' --output json

    extractors:
      - type: json
        name: cloudtrailname
        internal: true
        json:
          - '.[]'

  - engine:
      - sh
      - bash
    source: |
        aws cloudtrail describe-trails --region $region --trail-name-list $trail --query 'trailList[*].CloudWatchLogsLogGroupArn'

    matchers:
      - type: word
        words:
          - "[]"

    extractors:
      - type: dsl
        dsl:
          - '"CloudTrail trail" + trail + " is not configured to send events to CloudWatch Logs for monitoring purposes"'
