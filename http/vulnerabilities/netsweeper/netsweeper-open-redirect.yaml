id: netsweeper-open-redirect

info:
  name: Netsweeper 4.0.9 - 开放重定向漏洞
  author: daffainfo
  severity: medium
  description: |
    该模板用于检测 Netsweeper 4.0.9 - 开放重定向漏洞。该类漏洞通常源于跳转参数缺少可信域名校验，导致服务端或前端跳转到攻击者控制的地址。模板会向 `/webadmin/authportal/bounce.php?url=https://interact.sh/` 等位置发送探测请求，并结合响应状态、关键字、错误信息、时间差或外带交互等证据判断目标是否受影响。
  impact: |
    - 攻击者可构造可信域名下的跳转链接诱导用户访问恶意站点。
    - 该问题常被用于钓鱼、OAuth 授权码劫持、会话令牌泄露或绕过安全网关校验。
  remediation: |
    - 对跳转目标使用固定白名单或相对路径，禁止直接跳转到任意外部 URL。
    - 在执行跳转前校验协议、主机名和编码后的最终地址，避免双重编码和协议绕过。
    - 对登录、授权和支付等敏感流程中的重定向参数进行额外审计。
  reference:
    - https://packetstormsecurity.com/files/download/133034/netsweeper-issues.tgz
  classification:
    cvss-metrics: CVSS:3.1/AV:N/AC:L/PR:N/UI:R/S:C/C:L/I:L/A:N
    cvss-score: 6.1
    cwe-id: CWE-601
  metadata:
    max-request: 1
  tags: netsweeper,redirect,packetstorm,vuln

http:
  - method: GET
    path:
      - "{{BaseURL}}/webadmin/authportal/bounce.php?url=https://interact.sh/"

    matchers:
      - type: regex
        part: header
        regex:
          - '(?m)^(?:Location\s*?:\s*?)(?:https?://|//)(?:[a-zA-Z0-9\-_\.@]*)interact\.sh.*$'
