id: unrestricted-ssh-access

info:
  name: 阿里云 ECS 安全组 SSH 端口对公网开放（云安全）
  author: DhiyaneshDK
  severity: high
  description: ECS 安全组入方向规则如果允许 0.0.0.0/0 访问 TCP 22，会使 SSH 管理入口暴露给整个互联网，容易遭受扫描、口令爆破和未授权登录尝试。模板枚举安全组后查询入方向规则，当 IpProtocol 为 TCP、PortRange 为 22/22 且 SourceCidrIp 为 0.0.0.0/0 时判定 SSH 访问未受限制。
  impact: |
    - 暴露的 SSH 服务会持续受到自动化扫描、凭据填充和暴力破解攻击，增加主机被接管概率。
    - 一旦登录凭据或密钥被攻破，攻击者可进入 ECS 实例并进一步访问内网服务、数据和云上凭据。
  remediation: |
    - 将 SSH 入方向规则的 SourceCidrIp 收敛为可信运维出口 IP、VPN 网段或堡垒机安全组。
    - 删除不再需要的 22/22 公网放通规则，并配合密钥登录、MFA、最小权限和登录审计降低管理入口风险。
  reference:
    - https://www.trendmicro.com/cloudoneconformity/knowledge-base/alibaba-cloud/AlibabaCloud-ECS/unrestricted-ssh-access.html
    - https://www.alibabacloud.com/help/en/ecs/use-cases/best-practices-of-the-security-group
  metadata:
    max-request: 1
    verified: true
    vendor: alibaba
    product: ecs
  tags: cloud,devops,aliyun,alibaba,alibaba-cloud-config,ecs

variables:
  region: "cn-hangzhou"

flow: |
  code(1)
  for(let SecurityGroupId of iterate(template.securitygroup)){
    set("securitygroup", SecurityGroupId)
    code(2)
  }

self-contained: true

code:
  - engine:
      - sh
      - bash
    source: |
      aliyun ecs DescribeSecurityGroups --RegionId $region

    extractors:
      - type: json
        name: securitygroup
        internal: true
        json:
          - '.SecurityGroups.SecurityGroup[].SecurityGroupId'

  - engine:
      - sh
      - bash
    source: |
      aliyun ecs DescribeSecurityGroupAttribute --SecurityGroupId "$securitygroup" --Direction ingress --RegionId $region

    matchers-condition: and
    matchers:
      - type: word
        words:
          - '"IpProtocol": "TCP"'
          - '"PortRange": "22/22"'
          - '"SourceCidrIp": "0.0.0.0/0"'
        condition: and

    extractors:
      - type: dsl
        dsl:
          - 'securitygroup + " contains Unrestricted SSH Access"'
