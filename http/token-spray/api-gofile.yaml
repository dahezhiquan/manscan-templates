id: api-gofile

info:
  name: GoFile API Token 可用性校验（token喷洒）
  author: daffainfo
  severity: high
  description: |-
    平台介绍：GoFile API 是面向开发者和运维团队的云服务、边缘网络或文件存储平台，常用于管理站点、对象、部署、账户资源或云端能力。该模板用于校验提交的 GoFile API Token 是否仍然有效。检测逻辑会向 `api.gofile.io/getAccountDetails` 发起低影响 API 请求，通过查询参数中的 API Key/Token 传递 `{{token}}`，并依据响应中的 `"token"`、`"email"`、`"rootFolder"` 判断凭据是否可用；命中通常表示该 Token 可被继续调用对应平台能力。
  reference:
    - https://gofile.io/api
    - https://github.com/daffainfo/all-about-apikey/tree/main/gofile
  metadata:
    max-request: 1
  tags: token-spray,gofile
  impact: |-
    - 攻击者可访问云端资源、部署信息、文件对象、站点配置或账户资料。
    - 高权限 Token 可能导致资源篡改、数据泄露、服务中断、账单消耗或供应链风险。
  remediation: |-
    - 立即撤销或轮换已暴露的 API Token，并确认旧 Token 不再可用。
    - 按最小权限原则重新签发凭据，限制作用域、来源地址、项目范围和有效期。
    - 在代码仓库、CI/CD、日志和配置文件中排查泄露来源，避免 Token 再次提交或外传。
    - 检查近期 API 调用、资源变更、账单和权限配置，确认是否存在异常操作。
self-contained: true

http:
  - method: GET
    path:
      - "https://api.gofile.io/getAccountDetails?token={{token}}&allDetails=true"

    matchers:
      - type: word
        part: body
        words:
          - '"token"'
          - '"email"'
          - '"rootFolder"'
        condition: and
