id: recoverpoint-panel

info:
  name: Dell EMC RecoverPoint 面板识别（暴露面识别）
  author: rxerium
  severity: info
  description: |
    该模板通过识别 Dell EMC RecoverPoint 面板、控制台或管理界面的页面特征，判断目标是否暴露了对应服务入口。若命中，说明该后台或运维界面对外可访问，可用于资产识别与暴露面排查。
  reference:
    - https://www.delltechnologies.com/en-us/data-protection/recoverpoint-for-virtual-machines.htm
  metadata:
    verified: true
    max-request: 1
    vendor: dell
    product: emc_recoverpoint
    shodan-query: http.favicon.hash:-742276344
  tags: panel,recoverpoint,dell,emc,login,discovery

http:
  - method: GET
    path:
      - "{{BaseURL}}/#!/welcome"

    host-redirects: true
    max-redirects: 2

    matchers-condition: and
    matchers:
      - type: word
        part: body
        words:
          - "RecoverPoint Wizard"

      - type: status
        status:
          - 200
