id: raspberry-shake-config

info:
  name: Raspberry Shake 配置页面暴露（IOT）
  author: pussycat0x
  severity: medium
  description: |
    检测到 Raspberry Shake 配置页面。该设备用于实时接收、处理和导出震动/地震传感数据，配置页面暴露可能泄露传感器部署与数据输出参数。
  impact: |
    - 攻击者无需认证即可访问设备页面或功能，可能读取状态、配置和网络信息。
    - 若接口允许写操作，可能进一步导致设备配置被篡改或服务被滥用。
  remediation: |
    - 启用设备 Web 管理认证并修改默认口令，关闭匿名访问。
    - 升级固件并检查是否存在已知未授权访问漏洞。
    - 将管理页面限制在内网、管理 VLAN 或 VPN 内，并开启访问审计。
  metadata:
    verified: true
    max-request: 1
    shodan-query: title:"Raspberry Shake Config"
  tags: misconfig,unauth,iot,raspberry,discovery

http:
  - method: GET
    path:
      - "{{BaseURL}}"

    matchers-condition: and
    matchers:
      - type: word
        part: body
        words:
          - "Raspberry Shake Config"

      - type: status
        status:
          - 200
