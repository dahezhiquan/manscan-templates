id: kubernetes-k8s-kubelet-scan

info:
  name: Kubelet Running Pods 指纹识别（指纹识别）
  author: sharath
  severity: info
  description: >-
    Kubelet 是每个 Kubernetes 节点上的节点代理，运行中 Pod 页面可反映节点工作负载状态。该模板通过请求目标服务并检查预设路径或首页响应、页面正文关键字、状态码等指纹特征，判断目标是否使用或暴露了
    Kubelet Running Pods 相关组件；命中结果仅表示指纹特征匹配，可用于资产盘点、技术栈识别和后续安全评估，不代表已确认存在可利用漏洞。
  metadata:
    max-request: 1
  tags: tech,kubernetes,devops,kubelet,discovery
http:
  - method: GET
    path:
      - "{{BaseURL}}/runningpods/"

    matchers-condition: and
    matchers:
      - type: status
        status:
          - 200

      - type: word
        part: body
        words:
          - '"PodList":'
          - '"items":'
        condition: and
