id: weblate-public-project-exposure

info:
  name: Weblate Public Project 暴露
  author: ritikchaddha
  severity: info
  description: |
    检测到 Weblate Public Project 暴露。目标功能在未认证状态下可访问，可能暴露管理入口、业务数据、系统状态或可执行操作，需确认是否存在访问控制缺失。
  reference:
    - https://docs.weblate.org/en/latest/admin/security.html
    - https://github.com/WeblateOrg/weblate
  metadata:
    max-request: 1
    verified: true
    fofa-query: 'title="Weblate"'
    shodan-query: 'http.title:"Weblate"'
  tags: misconfig,exposure,weblate,public

http:
  - method: GET
    path:
      - "{{BaseURL}}/projects/"

    matchers-condition: and
    matchers:
      - type: word
        part: body
        words:
          - "Weblate"
          - "Untranslated"
          - "Browse all projects"
        condition: and

      - type: word
        part: content_type
        words:
          - "text/html"

      - type: status
        status:
          - 200
