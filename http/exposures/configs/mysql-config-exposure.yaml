id: mysql-config-exposure

info:
  name: MySQL Config 暴露（暴露面识别）
  author: theamanrawat
  severity: high
  description: |
    检测到目标站点可直接访问 MySQL Config。MySQL 配置或转储文件可能包含数据库连接、账号、表结构和业务数据。该模板请求 `/.my.cnf`，并通过 HTTP 状态码、响应正文关键字、文件格式特征、正则匹配或响应头进行确认。此类资源公开后可能泄露部署细节、内部路径、依赖版本、环境变量、访问凭据或调试信息，增加被侦察和后续利用的风险。
  impact: |-
    - 备份或转储文件可能包含源码、数据库记录、用户资料、配置和历史凭据，导致敏感数据直接外泄。
    - 攻击者可利用泄露的表结构、账号信息或业务数据复现系统逻辑，进一步发起凭据填充、权限提升或定向攻击。
    - 暴露文件通常可被搜索引擎或扫描器长期缓存，增加数据扩散和合规处置难度。
  remediation: |-
    - 确认该资源是否必须公网可访问；如非业务必需，应立即从 Web 根目录、静态资源目录、对象存储或反向代理公开路径中移除。
    - 在 Web 服务器、网关、CDN 或应用路由层增加拒绝规则、身份认证、IP allowlist 或内网访问限制。
    - 检查访问日志、下载记录和缓存记录，评估该资源是否已被外部访问或搜索引擎收录。
    - 若文件中包含凭据、令牌、连接串或私有地址，应执行密钥轮换、权限收敛和受影响系统访问审计。
  reference:
    - https://dev.mysql.com/doc/refman/8.0/en/option-files.html
  metadata:
    verified: true
    max-request: 1
  tags: exposure,config,mysql,database

http:
  - method: GET
    path:
      - "{{BaseURL}}/.my.cnf"

    matchers-condition: and
    matchers:
      - type: regex
        name: my-cnf-creds
        regex:
          - "password\\s*=\\s*[\"']?[^\"'\\s]+[\"']?"

      - type: word
        words:
          - "[client]"

      - type: status
        status:
          - 200
