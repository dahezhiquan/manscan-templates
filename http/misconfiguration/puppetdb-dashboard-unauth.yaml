id: puppetdb-dashboard-unauth

info:
  name: PuppetDB 仪表盘未授权访问
  author: DhiyaneshDk,pussycat0x
  severity: high
  description: |
    该模板用于核查 PuppetDB 仪表盘未授权访问。该类问题通常源于管理端、API、控制台或服务接口缺少认证授权，导致未登录用户可直接访问敏感功能。模板会向目标发送探测请求，并依据请求 `/pdb/dashboard/index.html`、`/dashboard/index.html`、匹配 `contains(body, "PuppetDB: Dashboard")`、匹配 `contains_any(body, "metrics","population","puppetdb")`、匹配 `status_code == 200`等证据确认目标是否存在该配置问题。
  impact: |
    - 攻击者可在未授权状态下查看系统状态、业务数据、任务信息或管理接口。
    - 若接口支持写操作，可能进一步导致配置篡改、服务接管、数据删除或横向移动。
  remediation: |
    - 为相关管理端和 API 启用认证授权，并按最小权限限制可访问功能。
    - 将管理接口限制在内网、VPN 或可信来源范围内，并开启访问审计。
    - 检查历史访问日志，确认是否存在未授权访问、批量枚举或异常操作。
  reference:
    - https://puppet.com/docs/puppetdb/latest/configure.html
    - https://puppet.com/docs/puppetdb/latest/api/index.html
    - https://puppet.com/security/cve/CVE-2020-7943
  classification:
    cvss-metrics: CVSS:3.1/AV:N/AC:L/PR:N/UI:N/S:U/C:H/I:N/A:N
    cvss-score: 7.5
    cwe-id: CWE-306
    cpe: cpe:2.3:a:puppet:puppetdb:*:*:*:*:*:*:*:*
  metadata:
    verified: true
    max-request: 5
    shodan-query: 'title:"PuppetDB: Dashboard"'
    fofa-query: 'title="PuppetDB: Dashboard"'
    product: puppetdb
    vendor: puppet
  tags: puppetdb,misconfig,exposure,unauth,dashboard

flow: http(1) && http(2)
http:
  - method: GET
    path:
      - "{{BaseURL}}/pdb/dashboard/index.html"
      - "{{BaseURL}}/dashboard/index.html"

    stop-at-first-match:

    matchers:
      - type: dsl
        dsl:
          - 'contains(body, "PuppetDB: Dashboard")'
          - 'contains_any(body, "metrics","population","puppetdb")'
          - 'status_code == 200'
        condition: and
        internal: true

  - method: GET
    path:
      - "{{BaseURL}}/pdb/query/v4/facts"

    matchers:
      - type: dsl
        dsl:
          - 'contains(header, "application/json")'
          - 'contains_all(body, "certname","environment","value")'
          - 'status_code == 200'
        condition: and
