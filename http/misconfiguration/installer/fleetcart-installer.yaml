id: fleetcart-installer

info:
  name: FleetCart 安装 Page 暴露
  author: DhiyaneshDK
  severity: high
  description: |
    检测到 FleetCart 安装 Page 暴露。该页面属于安装、初始化或配置向导流程，若对外暴露，攻击者可能完成初始化、创建管理员账户或重新配置目标系统。
  reference:
    - https://codecanyon.net/item/fleetcart-laravel-ecommerce-system/23014826
  metadata:
    verified: true
    max-request: 1
    shodan-query: html:"FleetCart - Installation"
  tags: misconfig,install,exposure,fleetcart,vuln

http:
  - method: GET
    path:
      - "{{BaseURL}}/install"

    matchers-condition: and
    matchers:
      - type: word
        part: body
        words:
          - "FleetCart - Installation"

      - type: status
        status:
          - 200
