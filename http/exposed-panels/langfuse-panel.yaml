id: langfuse-panel

info:
  name: Langfuse 面板识别（指纹识别）
  author: ChrisJr404
  severity: info
  description: |-
    检测到目标站点存在 Langfuse 相关响应特征。Langfuse 是 LLM 应用可观测性平台，用于跟踪提示词、调用链路、评估、成本、用户反馈和模型行为。模板请求 `/`、`/api/public/health` 路径，并通过页面标题或正文关键字、状态码、DSL 条件确认该系统指纹，用于资产识别、系统盘点和暴露面梳理。
  reference:
    - https://github.com/langfuse/langfuse
    - https://langfuse.com/
  metadata:
    verified: true
    max-request: 2
    vendor: langfuse
    product: langfuse
    shodan-query: http.title:"Langfuse"
    fofa-query: title="Langfuse"
  tags: panel,langfuse,llm,ai,detect,login
http:
  - method: GET
    path:
      - "{{BaseURL}}"
      - "{{BaseURL}}/api/public/health"

    host-redirects: true
    max-redirects: 2
    stop-at-first-match: true

    matchers:
      - type: dsl
        dsl:
          - 'status_code == 200 && contains(to_lower(body), "<title>langfuse")'
          - 'status_code == 200 && contains(to_lower(header), "x-langfuse-")'
          - 'status_code == 200 && contains_all(body, "\"status\":\"OK\"", "\"version\"") && contains(to_lower(header), "application/json")'
        condition: or
