id: sekolahku-cms-detect

info:
  name: Sekolahku CMS 指纹识别（指纹识别）
  author: nblirwn
  severity: info
  description: >-
    Sekolahku CMS 是面向学校网站的内容管理系统，用于发布校园新闻、课程、师生和招生信息。该模板通过请求目标服务并检查预设路径或首页响应、页面正文关键字等指纹特征，判断目标是否使用或暴露了
    Sekolahku CMS 相关组件；命中结果仅表示指纹特征匹配，可用于资产盘点、技术栈识别和后续安全评估，不代表已确认存在可利用漏洞。
  reference:
  - https://sekolahku.web.id/
  metadata:
    max-request: 1
    shodan-query: html:"sekolahku.web"
  tags: tech,sekolahku,cms,discovery
http:
  - method: GET
    path:
      - "{{BaseURL}}"

    matchers:
      - type: word
        part: body
        words:
          - 'sekolahku.web.id'
          - 'CMS Sekolahku'
        condition: or
