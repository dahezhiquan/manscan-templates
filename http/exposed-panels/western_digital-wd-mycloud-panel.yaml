id: western_digital-wd-mycloud-panel

info:
  name: WD My Cloud 登录面板识别（指纹识别）
  author: DhiyaneshDk
  severity: info
  description: WD My Cloud 是 Western Digital NAS 管理界面，用于文件共享、用户、存储和远程访问管理。该模板请求首页，并依据 HTTP 200 状态码、页面标题、正文关键字或品牌资源特征识别目标是否部署了该系统或暴露了对应入口，适用于资产指纹确认；命中结果仅表示系统特征匹配，不代表已确认存在未授权访问或可利用漏洞。
  reference:
  - https://www.zerodayinitiative.com/blog/2023/4/19/cve-2022-29844-a-classic-buffer-overflow-on-the-western-digital-my-cloud-pro-series-pr4100
  classification:
    cpe: cpe:2.3:a:western_digital:mycloud_nas:*:*:*:*:*:*:*:*
  metadata:
    verified: true
    max-request: 1
    vendor: western_digital
    product: mycloud_nas
    shodan-query: http.favicon.hash:-1074357885
    fofa-query: icon_hash=-1074357885
  tags: panel,login,mycloud,wd,detect,western_digital,discovery

http:
  - method: GET
    path:
      - "{{BaseURL}}"

    matchers-condition: and
    matchers:
      - type: word
        part: body
        words:
          - 'WDMyCloud'
          - 'Cloud_Connection_StatusID'
          - 'my_cloud_os'
          - 'WD Privacy Statement'
        condition: or

      - type: status
        status:
          - 200
