id: pingdom-takeover

info:
  name: Pingdom 公共报表未启用接管检测（子域名接管）
  author: pdteam
  severity: high
  description: 检测 Pingdom 返回公共报表未激活的提示，说明目标域名可能指向未启用或未绑定的 Pingdom 报表页面，存在被重新配置后接管的风险。
  reference:
    - https://github.com/EdOverflow/can-i-take-over-xyz/issues/144
  metadata:
    max-request: 1
  tags: takeover,pingdom,vuln

http:
  - method: GET
    path:
      - "{{BaseURL}}"

    matchers-condition: and
    matchers:
      - type: dsl
        dsl:
          - Host != ip

      - type: word
        words:
          - Public Report Not Activated
          - This public report page has not been activated by the user

    extractors:
      - type: dsl
        dsl:
          - cname
