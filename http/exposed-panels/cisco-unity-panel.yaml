id: cisco-unity-panel

info:
  name: Cisco Unity Connection 面板识别（指纹识别）
  author: HeeresS
  severity: info
  description: |-
    检测到目标站点存在 Cisco Unity Connection 相关响应特征。Cisco Unity Connection 是自动化运维、持续集成或任务编排平台，用于管理作业、流水线、凭据、执行记录和部署流程。模板请求 `/cuadmin/home.do`、`/` 路径，并通过页面标题或正文关键字、状态码确认该系统指纹，用于资产识别、系统盘点和暴露面梳理。
  classification:
    cpe: cpe:2.3:a:cisco:unity_connection:*:*:*:*:*:*:*:*
  metadata:
    verified: true
    max-request: 2
    vendor: cisco
    product: unity_connection
    shodan-query: html:"Cisco Unity Connection"
  tags: panel,cisco,unity,login,detect,discovery
http:
  - method: GET
    path:
      - "{{BaseURL}}/cuadmin/home.do"
      - "{{BaseURL}}"

    stop-at-first-match: true
    host-redirects: true
    max-redirects: 2

    matchers-condition: and
    matchers:
      - type: word
        part: body
        words:
          - "Cisco Unity Connection Administration"
          - ">Cisco Unity Connection</a>"
        condition: or

      - type: status
        status:
          - 200
