id: cloudtrail-dup-logs
info:
  name: CloudTrail 全局服务事件重复记录检查（云安全）
  author: princechaddha
  severity: medium
  description: CloudTrail 全局服务事件重复记录是一类审计噪声与成本控制风险，常见于多个 trail 同时记录 IAM、STS 等全局服务事件的环境。重复投递会增加存储和分析成本，并干扰告警去重和取证时间线整理。模板读取 `trailList[*].IncludeGlobalServiceEvents`，当值为 `true` 时命中，用于排查可能产生重复全局事件日志的 trail。
  impact: |
    - 多个 trail 同时记录全局服务事件时，IAM、STS 等全局服务操作可能被重复投递。
    - 重复日志会增加存储、分析和告警成本，并可能干扰事件去重与取证时间线整理。
  remediation: |
    - 在多 trail 环境中明确只由一个合适的 trail 记录全局服务事件。
    - 调整其他 trail 的全局服务事件配置，并验证审计覆盖不会因此产生空白。
  reference:
    - https://docs.aws.amazon.com/awscloudtrail/latest/userguide/cloudtrail-find-log-files.html
  metadata:
    max-request: 2
    vendor: amazon
    product: cloudtrail
  tags: cloud,devops,aws,amazon,cloudtrail,aws-cloud-config
variables:
  region: "ap-south-1"

flow: |
  code(1)
  for(let CloudTrail of iterate(template.cloudtrailname)){
    set("trail", CloudTrail)
    code(2)
  }

self-contained: true
code:
  - engine:
      - sh
      - bash
    source: |
      aws cloudtrail list-trails --region $region --query 'Trails[*].Name' --output json

    extractors:
      - type: json
        name: cloudtrailname
        internal: true
        json:
          - '.[]'

  - engine:
      - sh
      - bash
    source: |
         aws cloudtrail describe-trails --region $region --trail-name-list $trail --query 'trailList[*].IncludeGlobalServiceEvents' --output json

    matchers:
      - type: word
        words:
          - "true"

    extractors:
      - type: dsl
        dsl:
          - '"Ensure only one trail in Amazon CloudTrail is configured for global service events to avoid duplicates: " + trail'
