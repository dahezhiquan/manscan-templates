id: rds-backtrack-disabled

info:
  name: Aurora MySQL Backtrack 未启用（云安全）
  author: DhiyaneshDK
  severity: low
  description: Aurora MySQL Backtrack 可在不还原快照的情况下将集群回退到指定时间点，适合快速恢复误操作造成的数据变更。该模板枚举 Aurora MySQL 集群，并检查 BacktrackWindow 是否为空数组。
  impact: |
    - 误删、误更新或应用缺陷造成的数据破坏需要依赖快照恢复，恢复时间更长。
    - 在恢复窗口要求较短的业务中，缺少 Backtrack 会降低数据库韧性。
  remediation: |
    - 对适用的 Aurora MySQL 集群启用 Backtrack，并设置符合业务恢复目标的 BacktrackWindow。
    - 同时保留自动备份和快照策略，定期演练不同场景下的恢复流程。
  reference:
    - https://www.trendmicro.com/cloudoneconformity-staging/knowledge-base/aws/RDS/backtrack.html
    - https://docs.aws.amazon.com/AmazonRDS/latest/AuroraUserGuide/AuroraMySQL.Managing.Backtrack.html
  metadata:
    vendor: amazon
    product: rds
  tags: cloud,devops,aws,amazon,rds,aws-cloud-config
variables:
  region: "us-west-2"

flow: |
  code(1)
  for(let DBClusterIdentifier of iterate(template.dbclusters)){
    set("dbcluster", DBClusterIdentifier)
    code(2)
  }

self-contained: true

code:
  - engine:
      - sh
      - bash
    source: |
      aws rds describe-db-clusters --region $region --output json --query 'DBClusters[?Engine==`aurora-mysql`].DBClusterIdentifier | []'

    extractors:
      - type: json
        name: dbclusters
        internal: true
        json:
          - '.[]'

  - engine:
      - sh
      - bash

    source: |
        aws rds describe-db-clusters --region $region --db-cluster-identifier $dbcluster --query 'DBClusters[*].BacktrackWindow' --output json

    matchers:
      - type: word
        words:
          - '[]'

    extractors:
      - type: dsl
        dsl:
          - 'dbcluster + " AWS RDS Backtrack is Disabled"'
