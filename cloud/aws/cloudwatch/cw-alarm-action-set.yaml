id: cw-alarm-action-set
info:
  name: CloudWatch 告警未配置 ALARM 动作（云安全）
  author: princechaddha
  severity: medium
  description: CloudWatch 告警缺少 ALARM 动作是一类监控响应链路缺失风险，指标异常只能改变告警状态而不会触发通知或自动化处置。关键资源告警没有动作时，故障或安全异常可能长时间无人响应。模板枚举告警名称后读取 `MetricAlarms[*].AlarmActions[]`，当返回为空数组时判定该告警没有配置触发动作。
  impact: |
    - 关键指标异常可能无法通知运维或安全团队，导致故障和攻击迹象发现延迟。
    - 自动扩缩容、事件响应或工单联动等流程可能不会按预期触发。
  remediation: |
    - 为关键 CloudWatch 告警配置合适的 ALARM 动作，例如 SNS 通知、Auto Scaling 或自动化响应。
    - 定期测试告警触发链路，确认订阅、权限和下游处理流程可用。
  reference:
    - https://docs.aws.amazon.com/AmazonCloudWatch/latest/monitoring/AlarmThatSendsEmail.html
  metadata:
    max-request: 2
    vendor: amazon
    product: cloudwatch
  tags: cloud,devops,aws,amazon,cloudwatch,aws-cloud-config
variables:
  region: "us-east-1"

flow: |
  code(1)
  for(let AlarmName of iterate(template.alarms)){
    set("alarm", AlarmName)
    code(2)
  }

self-contained: true
code:
  - engine:
      - sh
      - bash
    source: |
      aws cloudwatch describe-alarms --region $region --query 'MetricAlarms[].AlarmName' --output json

    extractors:
      - type: json
        name: alarms
        internal: true
        json:
          - '.[]'

  - engine:
      - sh
      - bash
    source: |
         aws cloudwatch describe-alarms --region $region --alarm-names "$alarm" --query 'MetricAlarms[*].AlarmActions[]' --output json

    matchers:
      - type: word
        words:
          - "[]"

    extractors:
      - type: dsl
        dsl:
          - '"The Amazon CloudWatch " + alarm +" is not configured with any actions for the ALARM state."'
