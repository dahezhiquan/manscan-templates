id: azure-vm-trusted-launch-disabled
info:
  name: Azure VM Trusted Launch未启用（云安全）
  author: princechaddha
  severity: medium
  description: Azure Trusted Launch 通过安全启动、虚拟 TPM 和来宾证明增强 VM 启动链保护；securityProfile 为空或 secureBootEnabled 为 false 时，模板无法确认这些防护已启用。本模板枚举虚拟机并查询 securityProfile，在匹配相应 JSON 特征时报告。
  impact: |
    - 启动盘或引导组件被篡改时，攻击者可能在操作系统安全控制之前加载持久化代码，窃取凭据并隐藏恶意行为。
    - 缺少启动完整性证明会削弱对高敏感主机、密钥服务和合规环境的信任验证能力。
  remediation: |
    - 对支持的 VM 大小、镜像和区域启用 Trusted Launch、Secure Boot 和 vTPM，并在变更前确认驱动兼容性。
    - 将启动完整性、来宾证明和密钥访问纳入监控；不支持迁移的旧实例应记录例外并加强磁盘、端点和登录防护。
  reference:
    - https://docs.microsoft.com/en-us/azure/virtual-machines/trusted-launch
  metadata:
    vendor: microsoft
    product: azure-virtual-machines
  tags: cloud,devops,azure,microsoft,virtual-machine,azure-cloud-config

flow: |
  code(1);
  for (let VmData of iterate(template.vmList)) {
    set("ids", VmData);
    code(2);
  }

self-contained: true
code:
  - engine:
      - sh
      - bash
    source: |
      az vm list --query '[*].id'

    extractors:
      - type: json
        name: vmList
        internal: true
        json:
          - '.[]'

  - engine:
      - sh
      - bash
    source: |
      az vm show --ids "$ids" --query '{"securityProfile": securityProfile}'

    matchers-condition: and
    matchers:
      - type: word
        words:
          - '"securityProfile": null'
          - '"secureBootEnabled": false'

    extractors:
      - type: dsl
        dsl:
          - 'ids + " does not have Trusted Launch enabled"'
