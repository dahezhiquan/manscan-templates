id: apache-server-status

info:
  name: Apache 服务器 状态 泄露
  author: thabisocn
  severity: low
  description: |
    该模板用于核查 Apache 服务器 状态泄露状态。该类问题通常源于生产环境暴露调试页面、诊断端点、状态接口或详细错误信息。模板会向目标发送探测请求，并依据请求 `/server-info`、`/server-status`等证据确认目标是否存在该配置问题。
  impact: |
    - 攻击者可获取服务版本、运行状态、内部路径、模块列表、环境变量或错误栈信息。
    - 这些信息可辅助识别组件版本、构造后续攻击路径，或暴露内部系统结构与敏感配置线索。
  remediation: |
    - 关闭生产环境中的调试、状态、示例和诊断接口，避免向未授权用户返回内部细节。
    - 对确需保留的运维端点增加认证授权、来源限制和访问审计。
    - 检查历史访问日志和错误日志，确认敏感信息是否已被枚举或泄露。
  reference:
    - https://www.exploit-db.com/ghdb/5548
    - https://www.invicti.com/web-vulnerability-scanner/vulnerabilities/apache-server-status-detected/
    - https://www.acunetix.com/vulnerabilities/web/apache-server-status-detected/
  metadata:
    verified: true
    max-request: 2
    google-query:
      - site:*/server-status intext:"Apache server status for"
      - site:*/server-info intext:"Apache server Information"
  tags: misconfig,exposure,apache,debug,vuln

http:
  - method: GET
    path:
      - "{{BaseURL}}/server-info"
      - "{{BaseURL}}/server-status"

    matchers:
      - type: dsl
        dsl:
          - 'contains_any(body, "Apache Server Status", "Apache Server Information")'
          - 'contains(body, "Server Version")'
          - 'status_code == 200'
        condition: and
