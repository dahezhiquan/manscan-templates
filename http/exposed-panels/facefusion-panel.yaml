id: facefusion-panel

info:
  name: FaceFusion 面板识别（指纹识别）
  author: rxerium
  severity: info
  description: |-
    检测到目标站点存在 FaceFusion 相关响应特征。FaceFusion 是 AI、LLM 或机器学习相关平台，用于管理模型、数据集、工作区、推理服务或生成任务。模板请求 `/`，并通过页面标题或正文关键字、状态码确认该系统指纹，用于资产识别、系统盘点和暴露面梳理。
  reference:
    - https://github.com/facefusion/facefusion
    - https://facefusion.io
  metadata:
    verified: true
    max-request: 1
    vendor: facefusion
    product: facefusion
    shodan-query: 'http.title:"FaceFusion"'
  tags: panel,facefusion,ai,face-swap,deepfake,detect,discovery
http:
  - method: GET
    path:
      - "{{BaseURL}}"

    host-redirects: true
    max-redirects: 2

    matchers-condition: and
    matchers:
      - type: word
        part: body
        words:
          - "FaceFusion"
          - "_app.config.js"
        condition: and

      - type: status
        status:
          - 200
