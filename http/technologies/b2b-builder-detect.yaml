id: b2b-builder-detect

info:
  name: B2BBuilder 指纹识别（指纹识别）
  author: ffffffff0x
  severity: info
  description: B2BBuilder 是 B2B 电商或企业建站系统，用于商品、订单、客户和业务门户管理。该模板请求首页，并依据 HTTP 200 状态码、页面标题、正文关键字或品牌资源特征识别目标是否使用或暴露了 B2BBuilder 相关组件，适用于资产盘点、技术栈识别和后续安全评估；命中结果仅表示指纹特征匹配，不代表已确认存在可利用漏洞。
  classification:
    cpe: cpe:2.3:a:itechscripts:b2b_script:*:*:*:*:*:*:*:*
  metadata:
    max-request: 1
    vendor: itechscripts
    product: b2b_script
    fofa-query: app="B2BBuilder"
  tags: b2bbuilder,tech,discovery

http:
  - method: GET
    path:
      - "{{BaseURL}}"

    host-redirects: true
    max-redirects: 2

    matchers-condition: and
    matchers:
      - type: word
        part: body
        words:
          - 'content="B2Bbuilder"'
          - 'translateButtonId = "B2Bbuilder"'
        condition: or

      - type: status
        status:
          - 200
