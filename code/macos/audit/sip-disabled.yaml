id: sip-disabled

info:
  name: macOS 系统完整性保护 SIP 已禁用（本地基线扫描）
  author: geeknik
  severity: high
  description: |
    System Integrity Protection（SIP）用于限制对系统关键路径、内核扩展和受保护进程的修改，长期关闭会削弱 macOS 的核心完整性防护。模板执行 `csrutil status`，匹配 `System Integrity Protection status: disabled.` 时表示 SIP 已禁用。
  impact: |
    - 恶意软件或本地攻击者更容易修改系统受保护位置和关键进程行为。
    - 关闭 SIP 会降低系统完整性、恶意软件防护和取证可信度。
  remediation: |
    - 在恢复环境中重新启用 SIP，并避免在生产终端长期关闭。
    - 如因调试短期关闭，完成维护后立即恢复，并审计关闭期间的系统变更。
  tags: macos,audit,local,security

self-contained: true

code:
  - engine:
      - sh
      - bash
    source: |
      csrutil status
    matchers:
      - type: word
        words:
          - "System Integrity Protection status: disabled."
