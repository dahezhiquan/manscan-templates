id: labtech-panel

info:
  name: LabTech Web Portal 登录面板识别（暴露面识别）
  author: deFr0ggy
  severity: info
  description: 该模板通过识别 LabTech Web Portal 登录入口的页面标题、特征文本或重定向行为，判断目标是否暴露了对应的认证界面。若命中，说明该登录面板对外可访问，可用于暴露面梳理与后续安全评估。
  classification:
    cvss-metrics: CVSS:3.0/AV:N/AC:L/PR:N/UI:N/S:U/C:N/I:N/A:N
    cwe-id: CWE-200
    cpe: cpe:2.3:a:labtech_software:labtech:*:*:*:*:*:*:*:*
  metadata:
    max-request: 1
    vendor: labtech_software
    product: labtech
  tags: panel,labtech,labtech_software,discovery

http:
  - method: GET
    path:
      - "{{BaseURL}}/WCC2/"

    host-redirects: true
    max-redirects: 2

    matchers-condition: and
    matchers:
      - type: word
        words:
          - "<li>LabTech</li>"
          - '<form action="/WCC2/Search/search" id="searchForm method="post">'
          - "<h1> Welcome to the LabTech Web Portal</h1>"
          - "Universal Agent Uninstaller"
          - "Technician Login"
          - '<form action="/WCC2/Home/Login" autocomplete="off" method="post">'
        part: body
        condition: or

      - type: status
        status:
          - 200
