id: imgproxy-unauth

info:
  name: Imgproxy 未授权访问
  author: userdehghani
  severity: low
  description: |
    该模板用于核查 Imgproxy 未授权访问。该类问题通常源于管理端、API、控制台或服务接口缺少认证授权，导致未登录用户可直接访问敏感功能。模板会向目标发送探测请求，并依据请求 `/_/resize:fill:10:10:0/gravity:sm/plain/{{img_url}}`、匹配 `status_code==200`、匹配 `contains(content_type, "image/png")`、匹配 `("386116288" == mmh3(base64_py(body)))`等证据确认目标是否存在该配置问题。
  impact: |
    - 攻击者可在未授权状态下查看系统状态、业务数据、任务信息或管理接口。
    - 若接口支持写操作，可能进一步导致配置篡改、服务接管、数据删除或横向移动。
  remediation: |
    - 为相关管理端和 API 启用认证授权，并按最小权限限制可访问功能。
    - 将管理接口限制在内网、VPN 或可信来源范围内，并开启访问审计。
    - 检查历史访问日志，确认是否存在未授权访问、批量枚举或异常操作。
  reference:
    - https://docs.imgproxy.net/configuration/options
  classification:
    cvss-metrics: CVSS:3.1/AV:N/AC:L/PR:N/UI:N/S:U/C:N/I:N/A:H
    cvss-score: 7.5
    cpe: cpe:2.3:a:evilmartians:imgproxy:*:*:*:*:*:*:*:*
  metadata:
    verified: true
    max-request: 1
    shodan-query: html:"imgproxy"
    product: imgproxy
    vendor: evilmartians
  tags: imgproxy,unauth,misconfig,vuln
variables:
  img_url: 'https://upload.wikimedia.org/wikipedia/commons/thumb/2/2f/Google_2015_logo.svg/375px-Google_2015_logo.svg.png'

http:
  - method: GET
    path:
      - "{{BaseURL}}/_/resize:fill:10:10:0/gravity:sm/plain/{{img_url}}"

    matchers:
      - type: dsl
        dsl:
          - 'status_code==200'
          - 'contains(content_type, "image/png")'
          - '("386116288" == mmh3(base64_py(body)))'
        condition: and
