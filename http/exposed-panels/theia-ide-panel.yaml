id: theia-ide-panel

info:
  name: Eclipse Theia IDE 面板识别（暴露面识别）
  author: 0x_Akoko
  severity: info
  description: |
    该模板用于识别 Eclipse Theia IDE 是否存在对外暴露的管理、服务或状态界面。若命中，说明目标公开了相关功能入口，可作为资产盘点与攻击面收敛的依据。
  reference:
    - https://github.com/eclipse-theia/theia
    - https://theia-ide.org/
  metadata:
    verified: true
    max-request: 1
    shodan-query: title:"Theia IDE"
    fofa-query: title="Theia IDE"
  tags: theia,ide,panel,detect,tech,discovery

http:
  - method: GET
    path:
      - "{{BaseURL}}/"

    matchers:
      - type: dsl
        dsl:
          - 'status_code == 200'
          - 'contains_any(body, "<title>Theia IDE</title>", "<title>Eclipse Theia</title>")'
          - 'contains(body, "theia-preload")'
        condition: and
