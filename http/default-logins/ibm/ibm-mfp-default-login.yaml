id: ibm-mfp-default-login

info:
  name: IBM MobileFirst Foundation 默认凭据（弱口令）
  author: Vishal Vishwakarma
  severity: critical
  description: |
    该模板用于检测 IBM MobileFirst Foundation 是否仍可使用默认凭据或弱口令登录。模板主要向 `/mfpadmin/management-apis/2.0/runtimes` 等认证入口发送请求，使用内置默认凭据组合进行认证尝试，并根据响应中的 `productVersion`、`synchronizationStatus` 等登录成功特征判断登录是否成功；命中说明目标未及时修改出厂、示例或初始化账号口令。
  impact: |
    - 攻击者可进入 IBM MobileFirst Foundation 管理界面，查看或修改用户、权限、认证策略、流程或资产配置。
    - 身份、流程或资产管理系统被弱口令接管后，可能造成越权访问、策略绕过、敏感资产信息泄露和更大范围的权限扩散。
  remediation: |
    - 立即修改默认管理员口令，禁用初始化账号，并为高权限账户启用多因素认证。
    - 限制管理入口来源，按最小权限拆分管理员角色，并开启认证、授权和配置变更审计。
    - 复核用户、角色、认证策略、访问令牌和近期登录记录，必要时强制重置相关账号凭据。
  reference:
    - https://www.ibm.com/docs/en/mfp/8.0?topic=console-mobilefirst-operations
    - https://mobilefirstplatform.ibmcloud.com/tutorials/en/foundation/8.0/installation-configuration/production/server-configuration/
  classification:
    cvss-metrics: CVSS:3.1/AV:N/AC:L/PR:N/UI:N/S:U/C:H/I:H/A:H
    cvss-score: 9.8
    cwe-id: CWE-798
  metadata:
    max-request: 4
    verified: true
    vendor: ibm
    product: mobilefirst-foundation
    shodan-query: http.title:"MobileFirst Operations Console"
    fofa-query: title="MobileFirst Operations Console"
  tags: ibm,mobilefirst,default-login

http:
  - raw:
      - |
        GET /mfpadmin/management-apis/2.0/runtimes HTTP/1.1
        Host: {{Hostname}}
        Authorization: Basic {{base64(username + ':' + password)}}
        Accept: application/json

    payloads:
      username:
        - admin
        - demo
        - appcenteradmin
        - root
      password:
        - admin
        - demo
        - admin
        - passw0rd
    attack: pitchfork
    stop-at-first-match: true

    matchers-condition: and
    matchers:
      - type: status
        status:
          - 200

      - type: word
        part: body
        words:
          - "productVersion"
          - "synchronizationStatus"
          - "management-apis"
        condition: and

      - type: word
        part: header
        words:
          - "application/json"

    extractors:
      - type: regex
        part: body
        group: 1
        regex:
          - '"productVersion"\s*:\s*"([^"]+)"'
