id: aem-cached-pages

info:
  name: Invalidate Flush Cached Pages AEM 检测
  author: hetroublemakr
  severity: low
  description: |
    检测到 Invalidate Flush Cached Pages AEM 检测。目标响应或文件中可能暴露配置、凭据、密钥、令牌、环境变量或历史记录等敏感信息，可能被用于进一步入侵。
  reference:
    - https://twitter.com/AEMSecurity/status/1244965623689609217
  classification:
    cpe: cpe:2.3:a:adobe:experience_manager:*:*:*:*:*:*:*:*
  metadata:
    max-request: 1
    vendor: adobe
    product: experience_manager
    shodan-query: http.component:"Adobe Experience Manager"
  tags: aem,misconfig,vuln

http:
  - method: GET
    path:
      - "{{BaseURL}}/dispatcher/invalidate.cache"

    headers:
      CQ-Handle: /content
      CQ-Path: /content

    matchers-condition: and
    matchers:
      - type: word
        part: body
        words:
          - "<H1>OK</H1>"

      - type: status
        status:
          - 200
