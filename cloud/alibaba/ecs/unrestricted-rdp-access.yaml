id: unrestricted-rdp-access

info:
  name: 阿里云 ECS 安全组 RDP 端口对公网开放（云安全）
  author: DhiyaneshDK
  severity: high
  description: ECS 安全组入方向规则如果允许 0.0.0.0/0 访问 TCP 3389，会使 Windows RDP 管理入口暴露给整个互联网，容易遭受扫描、口令爆破和远程桌面相关攻击。模板枚举安全组后查询入方向规则，当 IpProtocol 为 TCP、PortRange 为 3389/3389 且 SourceCidrIp 为 0.0.0.0/0 时判定 RDP 访问未受限制。
  impact: |
    - 暴露的 RDP 服务容易成为暴力破解、凭据填充、勒索软件投递和远程桌面漏洞利用的目标。
    - 一旦 Windows 实例被攻陷，攻击者可能获取业务数据、部署持久化组件，并向同一 VPC 内其他资源横向移动。
  remediation: |
    - 将 RDP 入方向规则的 SourceCidrIp 收敛为可信运维出口 IP、VPN 网段或堡垒机安全组。
    - 删除不必要的 3389/3389 公网放通规则，并配合强口令、MFA、登录审计和最小权限管理降低远程桌面暴露风险。
  reference:
    - https://www.trendmicro.com/cloudoneconformity/knowledge-base/alibaba-cloud/AlibabaCloud-ECS/unrestricted-rdp-access.html
    - https://www.alibabacloud.com/help/en/ecs/use-cases/best-practices-of-the-security-group
  metadata:
    max-request: 1
    verified: true
    vendor: alibaba
    product: ecs
  tags: cloud,devops,aliyun,alibaba,alibaba-cloud-config,ecs

variables:
  region: "cn-hangzhou"

flow: |
  code(1)
  for(let SecurityGroupId of iterate(template.securitygroup)){
    set("securitygroup", SecurityGroupId)
    code(2)
  }

self-contained: true

code:
  - engine:
      - sh
      - bash
    source: |
      aliyun ecs DescribeSecurityGroups --RegionId $region

    extractors:
      - type: json
        name: securitygroup
        internal: true
        json:
          - '.SecurityGroups.SecurityGroup[].SecurityGroupId'

  - engine:
      - sh
      - bash
    source: |
      aliyun ecs DescribeSecurityGroupAttribute --SecurityGroupId "$securitygroup" --Direction ingress --RegionId $region

    matchers-condition: and
    matchers:
      - type: word
        words:
          - '"IpProtocol": "TCP"'
          - '"PortRange": "3389/3389"'
          - '"SourceCidrIp": "0.0.0.0/0"'
        condition: and

    extractors:
      - type: dsl
        dsl:
          - 'securitygroup + " contains Unrestricted RDP Access"'
