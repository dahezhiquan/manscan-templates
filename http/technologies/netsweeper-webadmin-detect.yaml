id: netsweeper-webadmin-detect

info:
  name: Netsweeper WebAdmin 指纹识别（指纹识别）
  author: dwisiswant0
  severity: info
  description: >-
    Netsweeper WebAdmin 是 Web 内容过滤与安全网关管理界面，用于策略、用户和过滤规则管理。该模板通过请求目标服务并检查预设路径或首页响应、HTTP
    响应头、正则特征、状态码等指纹特征，判断目标是否使用或暴露了 Netsweeper WebAdmin 相关组件；命中结果仅表示指纹特征匹配，可用于资产盘点、技术栈识别和后续安全评估，不代表已确认存在可利用漏洞。
  classification:
    cvss-metrics: CVSS:3.1/AV:N/AC:L/PR:N/UI:N/S:U/C:N/I:N/A:N
    cvss-score: 0
    cwe-id: CWE-200
  metadata:
    max-request: 2
  tags: tech,netsweeper,webadmin,discovery
http:
  - method: GET
    path:
      - "{{BaseURL}}/webadmin/start/"
      - "{{BaseURL}}/webadmin/tools/systemstatus_remote.php"

    headers:
      Referer: "http://{{Hostname}}/webadmin/admin/systemstatus_inc_data.php"

    matchers-condition: and
    matchers:
      - type: regex
        regex:
          - "Powered by netsweeper"
          - "Netsweeper Inc"
        condition: or
        part: body

      - type: status
        status:
          - 200
