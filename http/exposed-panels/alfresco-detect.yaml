id: alfresco-detect

info:
  name: Alfresco CMS 识别（指纹识别）
  author: pathtaga
  severity: info
  description: |-
    检测到目标站点存在 Alfresco CMS 相关响应特征。Alfresco 是企业内容管理平台，用于文档管理、内容协作、流程集成和文件服务。模板请求 `/alfresco/api/-default-/public/cmis/versions/1.1/atom`，并通过页面标题或正文关键字、响应头关键字确认该系统指纹，用于资产识别、系统盘点和暴露面梳理。
  reference:
    - https://www.alfresco.com/
  classification:
    cwe-id: CWE-200
    cpe: cpe:2.3:a:alfresco:alfresco:*:*:*:*:android:*:*:*
  metadata:
    max-request: 1
    vendor: alfresco
    product: alfresco
  tags: alfresco,tech,panel,discovery
http:
  - method: GET
    path:
      - "{{BaseURL}}/alfresco/api/-default-/public/cmis/versions/1.1/atom"

    matchers-condition: and
    matchers:
      - type: word
        part: body
        words:
          - 'org\/alfresco\/api\/opencmis\/OpenCMIS.get'

      - type: word
        part: header
        words:
          - "application/json"

    extractors:
      - type: regex
        part: body
        group: 1
        regex:
          - 'Enterprise v.*([0-9]\.[0-9]+\.[0-9]+)'
          - 'Community v.*([0-9]\.[0-9]+\.[0-9]+)'
          - 'Community Early Access v.*([0-9]\.[0-9]+\.[0-9]+)'
