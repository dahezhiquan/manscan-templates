id: api-craftmypdf

info:
  name: CraftMyPDF API Token 可用性校验（token喷洒）
  author: daffainfo
  severity: info
  description: 该模板通过调用 CraftMyPDF API 的已知接口验证提供的 token 是否有效，命中后通常表示可访问文档转换或 PDF 处理能力。
  reference:
    - https://pdflayer.com/documentation
    - https://github.com/daffainfo/all-about-apikey/tree/main/craftmypdf
  metadata:
    max-request: 1
  tags: token-spray,craftmypdf

self-contained: true

http:
  - raw:
      - |
        GET https://api.craftmypdf.com/v1/list-templates?limit=300&offset=0 HTTP/1.1
        Host: api.craftmypdf.com
        Content-Type: application/json
        X-API-KEY: {{token}}

    matchers:
      - type: word
        part: body
        words:
          - '"template_id":'
          - '"name":'
        condition: and
