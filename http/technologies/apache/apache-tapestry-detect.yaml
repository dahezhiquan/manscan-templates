id: apache-tapestry-detect

info:
  name: Apache Tapestry 框架 指纹识别（指纹识别）
  author: pikpikcu
  severity: info
  description: Apache Tapestry 框架 是 Java Web 应用框架，用于组件化页面和企业 Web 应用开发。该模板请求首页，并依据页面标题、正文关键字或品牌资源特征识别目标是否使用或暴露了 Apache Tapestry 框架 相关组件，适用于资产盘点、技术栈识别和后续安全评估；命中结果仅表示指纹特征匹配，不代表已确认存在可利用漏洞。
  classification:
    cpe: cpe:2.3:a:apache:tapestry:*:*:*:*:*:*:*:*
  metadata:
    max-request: 1
    vendor: apache
    product: tapestry
    fofa-query: app="APACHE-Tapestry"
  tags: apache,tapestry,tech,discovery

http:
  - method: GET
    path:
      - "{{BaseURL}}"

    host-redirects: true
    max-redirects: 2
    matchers:
      - type: word
        part: body
        words:
          - 'content="Apache Tapestry Framework'
          - 'content="Tapestry Application Framework'
        condition: or

    extractors:
      - type: regex
        part: body
        group: 1
        regex:
          - 'Tapestry Framework \(version ([0-9.]+)\)'

      - type: regex
        part: body
        group: 1
        regex:
          - 'Tapestry Application Framework, version ([0-9.-A-Z]+)T" \/>'
