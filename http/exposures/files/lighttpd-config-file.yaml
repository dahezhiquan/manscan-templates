id: lighttpd-config-file

info:
  name: Lighttpd 配置 文件 文件泄露（暴露面识别）
  author: DhiyaneshDk
  severity: low
  description: |
    检测到对外可访问的 Lighttpd 配置 文件 文件。相关文件可能泄露项目结构、依赖关系、部署细节、敏感参数或其他不应公开的内部信息。
  metadata:
    verified: true
    max-request: 1
    shodan-query: html:"lighttpd.conf"
  tags: exposure,files,lighttpd,vuln

http:
  - method: GET
    path:
      - '{{BaseURL}}/lighttpd.conf'

    matchers-condition: and
    matchers:
      - type: word
        part: body
        words:
          - 'server.document-root ='
          - 'server.port ='
        condition: and
        case-insensitive: true

      - type: word
        part: content_type
        words:
          - 'application/octet-stream'
