id: winrm-basic-auth-enabled

info:
  name: WinRM Basic 认证已启用（本地基线扫描）
  author: princechaddha
  severity: high
  description: |
    该模板检查 WinRM 是否允许 Basic 认证。Basic 认证在未加密通道上会暴露凭据。
  impact: |
    攻击者可截获或重放凭据，获得远程管理访问。
  remediation: |
    禁用 Basic 认证，改用 Kerberos、证书认证或其他安全机制。
  tags: windows,winrm,code,windows-audit

self-contained: true

code:
  - pre-condition: |
      IsWindows();
    engine:
      - powershell
      - powershell.exe
    args:
      - -ExecutionPolicy
      - Bypass
    pattern: "*.ps1"
    source: |
      (Get-Item WSMan:\localhost\Service\Auth).Basic

    matchers:
      - type: word
        words:
          - "True"
