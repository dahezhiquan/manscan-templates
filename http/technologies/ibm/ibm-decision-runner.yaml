id: ibm-decision-runner

info:
  name: IBM Decision Runner 指纹识别（指纹识别）
  author: DhiyaneshDK
  severity: info
  description: >-
    IBM Decision Runner 是 IBM 决策管理相关运行/测试入口，用于执行或验证业务规则决策服务。该模板通过请求目标服务并检查预设路径或首页响应、页面正文关键字、正则特征、状态码等指纹特征，判断目标是否使用或暴露了
    IBM Decision Runner 相关组件；命中结果仅表示指纹特征匹配，可用于资产盘点、技术栈识别和后续安全评估，不代表已确认存在可利用漏洞。
  reference:
  - https://www.ibm.com/docs/en/odm/8.8.1?topic=simulation-tuning-decision-runner-web-application
  metadata:
    verified: true
    max-request: 1
  tags: ibm,detect,tech,ibm-decision-runner,discovery
http:
  - method: GET
    path:
      - "{{BaseURL}}/DecisionRunner/"

    matchers-condition: and
    matchers:
      - type: word
        part: body
        words:
          - "<title>Decision Runner</title>"

      - type: status
        status:
          - 200

    extractors:
      - type: regex
        part: body
        group: 1
        regex:
          - 'Decision Server ([0-9.]+)'
