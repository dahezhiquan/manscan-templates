id: decision-center-ibm-odm-detect

info:
  name: IBM Operational Decision Manager 指纹识别（指纹识别）
  author: DhiyaneshDK
  severity: info
  description: >-
    IBM Operational Decision Manager 是业务规则和决策自动化平台，用于集中管理、测试和执行企业决策规则。该模板通过请求目标服务并检查预设路径或首页响应、页面正文关键字、状态码等指纹特征，判断目标是否使用或暴露了
    IBM Operational Decision Manager 相关组件；命中结果仅表示指纹特征匹配，可用于资产盘点、技术栈识别和后续安全评估，不代表已确认存在可利用漏洞。
  reference:
  - https://www.ibm.com/products/operational-decision-manager
  classification:
    cpe: cpe:2.3:a:ibm:operational_decision_manager:*:*:*:*:*:*:*:*
  metadata:
    verified: true
    max-request: 1
    vendor: ibm
    product: operational_decision_manager
    fofa-query: "icon_hash=\"707491698\""
  tags: ibm,decision-center,tech,detect,discovery
http:
  - method: GET
    path:
      - "{{BaseURL}}"

    matchers-condition: and
    matchers:
      - type: word
        part: body
        words:
          - "<title>IBM ODM</title>"

      - type: status
        status:
          - 200
