id: under-armour-phish

info:
  name: Under Armour 仿冒钓鱼网站（钓鱼网站识别）
  author: rxerium
  severity: info
  description: |
    检测到疑似仿冒 Under Armour 的钓鱼网站。模板在目标页面返回 200、页面内容命中 Under Armour 的品牌页面特征，且当前主机不属于 underarmour.com 官方域名时触发，用于识别借用 Under Armour 品牌页面诱导用户信任的仿冒站点。
  reference:
    - https://underarmour.com
  metadata:
    max-request: 1
  tags: phishing,under-armour,ecommerce,osint,discovery
http:
  - method: GET
    path:
      - "{{BaseURL}}"

    host-redirects: true
    max-redirects: 2

    matchers-condition: and
    matchers:
      - type: word
        words:
          - "Under Armour builds game-changing sportswear, athletic shirts, shoes and more. FREE SHIPPING available and FREE returns on workout clothes, shoes, and gear."

      - type: status
        status:
          - 200

      - type: dsl
        dsl:
          - '!contains(host,"underarmour.com")'
