id: ge-proficy-webspace-panel

info:
  name: GE Proficy WebSpace - 登录面板（暴露面识别）
  author: rxerium
  severity: info
  description: |
    该模板通过识别 GE Proficy WebSpace 登录入口的页面标题、特征文本或重定向行为，判断目标是否暴露了对应的认证界面。若命中，说明该登录面板对外可访问，可用于暴露面梳理与后续安全评估。
  reference:
    - https://www.ge.com/digital/applications/hmi-scada/proficy-webspace
  metadata:
    max-request: 1
    verified: true
    vendor: GE
    product: proficy-webspace
    shodan-query: 'http.title:"Proficy WebSpace"'
  tags: panel,scada,hmi,ics,ge,proficy,webspace,ifix,cimplicity,discovery

http:
  - method: GET
    path:
      - "{{BaseURL}}"

    host-redirects: true
    max-redirects: 2

    matchers-condition: and
    matchers:
      - type: word
        part: body
        words:
          - 'Proficy WebSpace'
          - 'BRAND_NAME_PRODUCT'
          - 'brand.js'
        condition: or

      - type: status
        status:
          - 200
