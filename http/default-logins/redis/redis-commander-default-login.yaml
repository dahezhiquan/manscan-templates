id: redis-commander-default-login

info:
  name: Redis Commander 默认口令登录（弱口令）
  author: DhiyaneshDK
  severity: high
  description: |
    该模板通过尝试 Redis Commander 的默认账号口令，并依据认证成功后的响应特征判断目标是否仍在使用未修改的弱口令。若命中，攻击者可直接登录系统，进一步访问敏感信息、修改配置或执行未授权操作。
  metadata:
    verified: true
    max-request: 1
    shodan-query: title:"Redis Commander"
  tags: default-login,redis

variables:
  username: admin
  password: admin

http:
  - raw:
      - |
        POST /signin HTTP/1.1
        Host: {{Hostname}}
        Content-Type: application/x-www-form-urlencoded

        username={{username}}&password={{password}}

    matchers-condition: and
    matchers:
      - type: word
        part: body
        words:
          - '"bearerToken":'
          - '"queryToken":'
          - '"ok":true'
        condition: and

      - type: status
        status:
          - 200
