id: kafka-manager-unauth

info:
  name: Kafka Manager 面板 未授权 访问
  author: Paper-Pen
  severity: low
  description: |
    检测到 Kafka Manager 面板 未授权 访问。目标功能在未认证状态下可访问，可能暴露管理入口、业务数据、系统状态或可执行操作，需确认是否存在访问控制缺失。
  reference:
    - https://github.com/yahoo/CMAK
  metadata:
    max-request: 1
    fofa-query: app="Kafka-Manager"
  tags: misconfig,apache,kafka,unauth,exposure,vuln

http:
  - method: GET
    path:
      - "{{BaseURL}}"

    matchers-condition: and
    matchers:
      - type: word
        part: body
        words:
          - "<title>Kafka Manager</title>"

      - type: status
        status:
          - 200
