id: enigma-nms-detect

info:
  name: Enigma NMS 指纹识别（指纹识别）
  author: 0x_Akoko
  severity: info
  description: Enigma NMS 是网络管理系统，用于设备监控、告警、性能和网络状态管理。该模板请求 `/cgi-bin/protected/main.cgi`，并依据 DSL 条件识别目标是否使用或暴露了 Enigma NMS 相关组件，适用于资产盘点、技术栈识别和后续安全评估；命中结果仅表示指纹特征匹配，不代表已确认存在可利用漏洞。
  reference:
  - https://www.netsas.com.au/enigma-nms-introduction
  metadata:
    verified: true
    max-request: 1
    shodan-query: 'http.title:"ENIGMA NMS"'
  tags: tech,enigma,nms,detect,discovery

http:
  - method: GET
    path:
      - "{{BaseURL}}/cgi-bin/protected/main.cgi"

    matchers-condition: and
    matchers:
      - type: dsl
        dsl:
          - 'contains(tolower(header), "enigma")'
          - 'status_code == 401'
          - 'contains(tolower(header), "www-authenticate")'
        condition: and

    extractors:
      - type: regex
        part: header
        group: 1
        regex:
          - 'WWW-Authenticate:\s*Basic\s+realm="([^"]+)"'
