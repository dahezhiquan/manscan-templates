id: gcloud-gke-transparent-encryption-disabled

info:
  name: GKE Clusters 未启用Inter-Node Transparent 加密（云安全）
  author: princechaddha
  severity: high
  description: GKE 节点间透明加密可保护节点间传输的数据，降低集群内部流量被窃听的风险。本模板检查 networkConfig.inTransitEncryptionConfig，值为 IN_TRANSIT_ENCRYPTION_DISABLED 时报告未启用节点间透明加密。
  impact: |
    - 节点间的 Pod、服务或控制流量可能缺少传输中保护，存在被窃听或篡改的风险。
    - 对跨节点传输敏感数据的工作负载，未加密会降低集群内部通信安全性。
  remediation: |
    - 对支持的 GKE 集群启用 inter-node transparent encryption，并验证网络和性能影响。
    - 对敏感服务同时使用应用层 TLS、Network Policy 和最小权限控制。
  reference:
    - https://cloud.google.com/kubernetes-engine/docs/how-to/encrypt-in-transit
    - https://www.trendmicro.com/cloudoneconformity/knowledge-base/gcp/GKE/enable-inter-node-transparent-encryption.html
  metadata:
    vendor: google
    product: google-kubernetes-engine
  tags: cloud,devops,gcp,gcloud,gke,kubernetes,security,encryption,gcp-cloud-config

flow: |
  code(1)
  for(let projectId of iterate(template.projectIds)){
    set("projectId", projectId)
    code(2)
    for(let cluster of iterate(template.clusters)){
      cluster = JSON.parse(cluster)
      set("clusterName", cluster.name)
      set("location", cluster.location)
      code(3)
    }
  }

self-contained: true

code:
  - engine:
      - sh
      - bash
    source: |
      gcloud projects list --format="json(projectId)"

    extractors:
      - type: json
        name: projectIds
        internal: true
        json:
          - '.[].projectId'

  - engine:
      - sh
      - bash
    source: |
      gcloud container clusters list --project $projectId --format="json(name,location)"

    extractors:
      - type: json
        name: clusters
        internal: true
        json:
          - '.[]'

  - engine:
      - sh
      - bash
    source: |
      gcloud container clusters describe $clusterName --location $location --project $projectId --format="value(networkConfig.inTransitEncryptionConfig)"

    matchers:
      - type: word
        words:
          - "IN_TRANSIT_ENCRYPTION_DISABLED"

    extractors:
      - type: dsl
        dsl:
          - '"GKE cluster " + clusterName + " in " + location + " of project " + projectId + " does not have inter-node transparent encryption enabled"'
