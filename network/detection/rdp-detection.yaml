id: rdp-detection

info:
  name: RDP 协议识别（指纹识别）
  author: princechaddha
  severity: info
  description: |
    Remote Desktop Protocol（RDP）用于图形化远程登录和管理。该模板连接 3389/TCP，发送 X.224 连接请求，并根据 X.224 确认帧或 RDP 协商响应的结构识别服务。协商标志和安全协议选项不能用于确定远程系统版本。
  classification:
    cvss-metrics: CVSS:3.1/AV:N/AC:L/PR:N/UI:N/S:U/C:N/I:N/A:N
    cwe-id: CWE-200
  metadata:
    verified: true
    max-request: 1
  tags: network,windows,rdp,detect,tcp,discovery
tcp:
  - inputs:
      - data: "{{hex_decode('0300002a25e00000000000436f6f6b69653a206d737473686173683d746573740d0a010008000b000000')}}"
    read-size: 2048

    host:
      - "{{Hostname}}"
    port: 3389

    matchers:
      - type: dsl
        name: rdp
        dsl:
          - "regex('^0300000b06d00000123400$', hex_encode(raw))"
          - "regex('^030000130ed0000012340002[0-9a-f]{2}0800(00000000|01000000|02000000|04000000|08000000)$', hex_encode(raw))"
          - "regex('^030000130ed00000123400030008000[1-6]000000$', hex_encode(raw))"
        condition: or
