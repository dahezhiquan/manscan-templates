id: untangle-admin-setup

info:
  name: Untangle 管理员初始化向导暴露
  author: ritikchaddha
  severity: medium
  description: |-
    该模板用于核查 Untangle 管理员初始化向导暴露。安装、初始化、注册或 Onboarding 流程对外暴露时，攻击者可能完成系统初始化、创建账户或修改关键配置。模板访问 /setup/setup.do，并根据向导页面、注册表单、接口返回或状态码确认入口是否可用。
  classification:
    cpe: cpe:2.3:a:untangle:ng_firewall:*:*:*:*:*:*:*:*
  metadata:
    verified: true
    max-request: 1
    vendor: untangle
    product: ng_firewall
    shodan-query: title:"Setup Wizard" html:"untangle"
    fofa-query: title="Setup Wizard" && "untangle"
  tags: misconfig,untangle,admin,setup,vuln
  impact: |-
    - 攻击者可能创建管理员账户、重置配置、接管尚未初始化的服务或绕过既有部署边界。
    - 初始化接口暴露还可能泄露系统状态、安装路径、数据库配置需求和版本信息。
  remediation: |-
    - 完成安装后删除或禁用初始化入口，禁止公网访问安装、注册和 Onboarding 接口。
    - 对首次部署流程增加一次性令牌、来源限制和强认证。
    - 排查是否已被异常初始化或创建未知账户，必要时重新部署并轮换凭据。
http:
  - method: GET
    path:
      - "{{BaseURL}}/setup/setup.do"

    matchers-condition: and
    matchers:
      - type: word
        part: body
        words:
          - '<title>Setup Wizard</title>'
          - 'java.untangle.com'
        condition: and

      - type: status
        status:
          - 200
