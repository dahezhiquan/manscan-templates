id: cloudfront-viewer-policy

info:
  name: CloudFront Viewer 协议允许 HTTP（云安全）
  author: DhiyaneshDK
  severity: medium
  description: CloudFront Viewer 协议允许 HTTP 是一类客户端到边缘节点的明文传输风险，访问者可通过未加密 HTTP 请求分发内容。该配置可能暴露 Cookie、令牌、查询参数或页面内容，并增加会话劫持和内容篡改风险。模板读取 `DistributionConfig.CacheBehaviors.Items[*].ViewerProtocolPolicy`，当值为 `allow-all` 时判定未强制 HTTPS。
  impact: |
    - 访问者请求可能通过明文 HTTP 传输，暴露 Cookie、令牌、查询参数或页面内容。
    - 未强制 HTTPS 会增加会话劫持、内容篡改和合规审计失败的风险。
  remediation: |
    - 将 viewer 协议策略调整为 `redirect-to-https` 或 `https-only`。
    - 确认自定义域名证书、缓存行为和应用跳转逻辑一致，避免迁移后出现访问循环或资源混合内容。
  reference:
    - https://www.trendmicro.com/cloudoneconformity-staging/knowledge-base/aws/CloudFront/viewer-protocol-policy.html
    - https://docs.aws.amazon.com/AmazonCloudFront/latest/DeveloperGuide/distribution-web-values-specify.html
  metadata:
    vendor: amazon
    product: cloudfront
  tags: cloud,devops,aws,amazon,cloudfront,aws-cloud-config

variables:
  region: "us-west-2"

flow: |
  code(1)
  for(let DistributionListItemsId of iterate(template.distributions)){
    set("distribution", DistributionListItemsId)
    code(2)
  }

self-contained: true

code:
  - engine:
      - sh
      - bash

    source: |
      aws cloudfront list-distributions --output table --query 'DistributionList.Items[*].Id' --region $region --output json

    extractors:
      - type: json
        name: distributions
        internal: true
        json:
          - '.[]'

  - engine:
      - sh
      - bash

    source: |
        aws cloudfront get-distribution-config --id $distribution --query 'DistributionConfig.CacheBehaviors.Items[*].ViewerProtocolPolicy' --output json --region $region

    matchers:
      - type: word
        words:
          - '"allow-all"'

    extractors:
      - type: dsl
        dsl:
          - '"CloudFront Viewer Policy " + distribution + " allows all"'
