id: windows-auto-update-disabled

info:
  name: Windows 自动更新已关闭（本地基线扫描）
  author: boonchuan
  severity: high
  description: |
    系统将无法自动获取关键安全补丁。对应基线项为“Windows 自动更新被禁用”；模板读取注册表 `HKLM:\SOFTWARE\Policies\Microsoft\Windows\WindowsUpdate\AU`，结合命中值判断策略是否不符合基线。
  impact: |
    - 缺少补丁会使主机持续暴露于已知漏洞和恶意软件攻击。
    - 缺少安全更新会让主机持续暴露于已公开漏洞和恶意软件攻击。
  remediation: |
    - 通过组策略启用自动更新，配置自动下载和计划安装。
    - 建立补丁窗口和失败告警机制，确保安全更新可下载、安装并完成重启。
  reference:
    - https://www.cyber.gov.au/acsc/view-all-content/publications/essential-eight-maturity-model
    - https://learn.microsoft.com/en-us/windows/deployment/update/waas-wu-settings
  metadata:
    verified: false
  tags: windows,updates,patching,compliance,essential-eight,code,windows-audit

code:
  - pre-condition: |
      IsWindows();
    engine:
      - powershell
      - powershell.exe
    args:
      - -ExecutionPolicy
      - Bypass
    pattern: "*.ps1"
    source: |
      $au = Get-ItemProperty -Path 'HKLM:\SOFTWARE\Policies\Microsoft\Windows\WindowsUpdate\AU' -ErrorAction SilentlyContinue; if ($au -and $au.NoAutoUpdate -eq 1) { 'True' } else { 'False' }
    matchers:
      - type: word
        words:
          - "True"
