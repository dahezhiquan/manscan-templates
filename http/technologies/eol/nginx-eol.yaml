id: nginx-eol

info:
  name: Nginx EOL 指纹识别（指纹识别）
  author: Shivam Kamboj
  severity: info
  description: >-
    Nginx 是常用的 Web 服务器和反向代理，EOL 版本表示目标服务运行的 Nginx 分支已停止维护。该模板通过请求目标服务并检查预设路径或首页响应、HTTP
    响应头、正则特征、DSL 条件等指纹特征，判断目标是否使用或暴露了 Nginx EOL 相关组件；命中结果仅表示指纹特征匹配，可用于资产盘点、技术栈识别和后续安全评估，不代表已确认存在可利用漏洞。
  reference:
  - https://endoflife.date/nginx
  - https://nginx.org/en/download.html
  metadata:
    verified: true
    max-request: 1
    shodan-query: "Server: nginx/"
    product: nginx
    vendor: nginx
  tags: tech,nginx,eol
http:
  - method: GET
    path:
      - "{{BaseURL}}"

    host-redirects: true
    max-redirects: 3

    stop-at-first-match: true

    matchers:
      - type: dsl
        dsl:
          - compare_versions(version, '<1.28.0')
          - contains(server, 'nginx')
        condition: and

    extractors:
      - type: regex
        part: header
        name: version
        group: 1
        regex:
          - 'Server: nginx/([0-9.]+)'
