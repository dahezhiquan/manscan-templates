id: wp-plugin-wordpress-official-facebook-pixel

info:
  name: WordPress Meta Pixel 插件指纹识别（指纹识别）
  author: ricardomaia
  severity: info
  description: >-
    Meta Pixel for WordPress 是 WordPress 插件，主要用于站点统计、搜索引擎优化、跟踪代码集成或营销数据分析。该模板通过请求目标服务并检查预设路径或首页响应、正则特征、DSL
    条件等指纹特征，判断目标是否使用或暴露了 WordPress Meta Pixel for WordPress 插件 相关组件；命中结果仅表示指纹特征匹配，可用于资产盘点、技术栈识别和后续安全评估，不代表已确认存在可利用漏洞。
  reference:
  - https://wordpress.org/plugins/official-facebook-pixel/
  metadata:
    plugin_namespace: official-facebook-pixel
    wpscan: https://wpscan.com/plugin/official-facebook-pixel
  tags: tech,wordpress,wp-plugin,top-200,discovery
http:
  - method: GET
    path:
      - "{{BaseURL}}/wp-content/plugins/official-facebook-pixel/readme.txt"

    payloads:
      last_version: helpers/wordpress/plugins/official-facebook-pixel.txt

    extractors:
      - type: regex
        part: body
        internal: true
        name: internal_detected_version
        group: 1
        regex:
          - '(?i)Stable.tag:\s?([\w.]+)'

      - type: regex
        part: body
        name: detected_version
        group: 1
        regex:
          - '(?i)Stable.tag:\s?([\w.]+)'

    matchers-condition: or
    matchers:
      - type: dsl
        name: "outdated_version"
        dsl:
          - compare_versions(internal_detected_version, concat("< ", last_version))

      - type: regex
        part: body
        regex:
          - '(?i)Stable.tag:\s?([\w.]+)'
