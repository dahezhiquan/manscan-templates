id: azure-sql-auditing-disabled
info:
  name: Azure SQL Server 审计未启用（云安全）
  author: princechaddha
  severity: medium
  description: Azure SQL 审计用于记录数据库访问、查询和控制面相关活动，审计策略被禁用时，异常读取、权限滥用和数据变更缺少可靠的审计证据。本模板枚举逻辑服务器并执行 az sql server audit-policy show，在 AuditState 返回 Disabled 时报告。
  impact: |
    - 数据库被未授权访问或敏感数据被批量读取时，安全团队可能无法及时发现和定位行为来源。
    - 缺少审计记录会削弱事件溯源、数据访问责任认定和监管合规证明能力。
  remediation: |
    - 为 Azure SQL 服务器启用审计策略，并将审计日志发送到 Log Analytics、事件中心或受控存储。
    - 配置日志保留、访问控制和告警策略，确认审计目标可用且不会因目标权限或网络限制丢失事件。
  reference:
    - https://docs.microsoft.com/en-us/azure/azure-sql/database/auditing-overview
  metadata:
    vendor: microsoft
    product: azure-sql-database
  tags: cloud,devops,azure,microsoft,sql,azure-cloud-config

flow: |
  code(1);
  for (let ServerData of iterate(template.serverList)) {
    ServerData = JSON.parse(ServerData);
    set("name", ServerData.ServerName);
    set("resourceGroup", ServerData.ResourceGroupName);
    code(2);
  }

self-contained: true
code:
  - engine:
      - sh
      - bash
    source: |
      az sql server list --query '[*].{"ServerName":name,"ResourceGroupName":resourceGroup}' --output json

    extractors:
      - type: json
        name: serverList
        internal: true
        json:
          - '.[]'

  - engine:
      - sh
      - bash
    source: |
      az sql server audit-policy show --name "$name" --resource-group "$resourceGroup" --query '{"AuditState":state}' --output json

    matchers-condition: and
    matchers:
      - type: word
        words:
          - '"Disabled"'

    extractors:
      - type: dsl
        dsl:
          - 'name + " in " + resourceGroup + " does not have auditing enabled"'
