id: sql-server-reportviewer

info:
  name: SQL Server Reporting Services 报表页面暴露
  author: kazet
  severity: high
  description: |-
    该模板用于核查 SQL Server Reporting Services 报表页面暴露。目标因访问控制、默认配置或文件发布策略不当，暴露了不应公开的页面、接口或文件。模板访问 /Reports/Pages/Folder.aspx、/ReportServer/Pages/Folder.aspx，并根据响应状态、页面关键字或组件特征确认该配置问题。
  reference:
    - https://learn.microsoft.com/en-us/sql/reporting-services/create-deploy-and-manage-mobile-and-paginated-reports?view=sql-server-ver16
  classification:
    cpe: cpe:2.3:a:microsoft:sql_server:*:*:*:*:*:*:*:*
  metadata:
    verified: true
    max-request: 2
    vendor: microsoft
    product: sql_server
    google-query: inurl:"/Reports/Pages/Folder.aspx"
  tags: misconfig,sql,report,exposure,vuln
  impact: |-
    - 攻击者可获取内部信息、组件版本、配置细节或可操作的管理入口。
    - 暴露信息可能辅助后续漏洞利用、权限提升、横向移动或业务数据访问。
  remediation: |-
    - 收敛公开访问面，只暴露业务必需的页面和接口。
    - 对敏感入口增加认证授权、来源限制和访问审计。
    - 定期检查部署目录、反向代理规则和默认配置，清理示例与调试资源。
http:
  - raw:
      - |
        GET /Reports/Pages/Folder.aspx HTTP/1.1
        Host: {{Hostname}}
      - |
        GET /ReportServer/Pages/Folder.aspx HTTP/1.1
        Host: {{Hostname}}

    matchers:
      - type: dsl
        dsl:
          - "status_code_1 == 200 && status_code_2 != 401"
          - "contains(body, 'Data Source') && contains(body, 'SQL Server Reporting Services')"
        condition: and
