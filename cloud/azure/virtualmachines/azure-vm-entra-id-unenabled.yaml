id: azure-vm-entra-id-unenabled
info:
  name: Azure VM Microsoft Entra ID Authentication未启用（云安全）
  author: princechaddha
  severity: medium
  description: Azure VM 安装 Microsoft Entra ID 登录扩展后，可使用 Entra 身份、条件访问和集中审计替代本地长期凭据。本模板枚举虚拟机并查询扩展名称，在匹配 AADLoginForWindows 或 AADLoginForLinux 时报告已启用该扩展；命中结果应结合模板语义复核登录配置和实际平台支持情况。
  impact: |
    - 若未使用 Entra 登录，管理员可能依赖本地账号和 SSH 密钥，离职、轮换和集中撤销更难管理。
    - 本地凭据泄露后，攻击者可直接登录主机并利用主机身份访问其他 Azure 资源。
  remediation: |
    - 在支持的 Windows 或 Linux VM 上安装正确的 Entra 登录扩展，并为登录主体授予最小的 VM 登录角色。
    - 配置条件访问、MFA、PIM 和登录审计，禁用不必要的本地管理员、密码登录和长期共享凭据。
  reference:
    - https://docs.microsoft.com/en-us/azure/active-directory/develop/
  metadata:
    vendor: microsoft
    product: azure-virtual-machines
  tags: cloud,devops,azure,microsoft,entra-id,azure-cloud-config

flow: |
  code(1);
  for (let VmData of iterate(template.vmList)) {
    VmData = JSON.parse(VmData);
    set("name", VmData.name);
    set("resourceGroup", VmData.resourceGroup);
    code(2);
  }

self-contained: true
code:
  - engine:
      - sh
      - bash
    source: |
      az vm list --output json --query '[*].{"name":name,"resourceGroup":resourceGroup}'

    extractors:
      - type: json
        name: vmList
        internal: true
        json:
          - '.[]'

  - engine:
      - sh
      - bash
    source: |
      az vm extension list --vm-name "$name" --resource-group "$resourceGroup" --query '[*].name'

    matchers-condition: and
    matchers:
      - type: word
        words:
          - 'AADLoginForWindows'
          - 'AADLoginForLinux'

    extractors:
      - type: dsl
        dsl:
          - 'name + " in " + resourceGroup + " does not have Microsoft Entra ID authentication enabled"'
