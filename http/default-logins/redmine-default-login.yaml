id: redmine-default-login

info:
  name: Redmine 默认管理员凭据（弱口令）
  author: 0x_Akoko
  severity: high
  description: |
    该模板用于检测 Redmine 是否仍可使用默认凭据或弱口令登录。模板主要向 `/login` 等认证入口发送请求，使用内置默认凭据组合进行认证尝试，并根据状态码、认证 Cookie、跳转位置或登录后的页面关键字判断登录是否成功；命中说明目标未及时修改出厂、示例或初始化账号口令。
  impact: |
    - 攻击者可登录 Redmine 后台，管理内容、用户、插件、主题、文件、表单或业务流程配置。
    - 后台权限被滥用后，可能导致页面篡改、恶意文件上传、敏感资料泄露，或进一步取得服务器执行能力。
  remediation: |
    - 立即修改默认管理员凭据，删除安装向导、演示账号和不必要的后台用户。
    - 限制后台登录入口访问来源，启用多因素认证、登录失败锁定和验证码等防护。
    - 检查近期内容、插件、主题、文件上传和管理员操作记录，确认没有持久化后门。
  reference:
    - https://www.redmine.org/projects/redmine/wiki/RedmineInstall
    - https://www.simplified.guide/redmine/default-password
  metadata:
    verified: true
    max-request: 2
    vendor: redmine
    product: redmine
    shodan-query: 'http.title:"Redmine"'
    fofa-query: 'title="Redmine"'
  tags: redmine,default-login,aut,vuln

variables:
  username: "admin"
  password: "admin"

flow: http(1) && http(2)

http:
  - raw:
      - |
        GET /login HTTP/1.1
        Host: {{Hostname}}

    matchers:
      - type: dsl
        internal: true
        dsl:
          - 'status_code == 200'
          - 'contains_all(body, "Redmine", "authenticity_token")'
        condition: and

    extractors:
      - type: regex
        name: csrf_token
        part: body
        group: 1
        internal: true
        regex:
          - 'name="authenticity_token"[^>]+value="([^"]+)"'

      - type: regex
        name: session
        part: header
        group: 1
        internal: true
        regex:
          - 'Set-Cookie: (_redmine_session=[^;]+)'

  - raw:
      - |
        POST /login HTTP/1.1
        Host: {{Hostname}}
        Cookie: {{session}}

        authenticity_token={{url_encode(csrf_token)}}&username={{username}}&password={{password}}&login=Login

    matchers:
      - type: dsl
        dsl:
          - 'status_code == 302'
          - '!contains(to_lower(header), "/login")'
          - 'contains_any(to_lower(header), "/my/page", "/my/account", "redmine")'
          - 'contains(header, "_redmine_session")'
        condition: and
