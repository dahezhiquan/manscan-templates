id: k8s-role-pod-create

info:
  name: Roles that have pod create permissions（云安全）
  author: domwhewell-sage
  severity: medium
  description: Role 授予 pods create 或通配创建权限时，主体可创建新 Pod 并借助镜像、挂载、服务账号等配置扩大权限。本模板枚举所有命名空间 Role，匹配 resources/verbs 中包含 pods create 或通配组合的规则。
  impact: |
    - 攻击者获得该 Role 后可创建恶意 Pod 读取 Secret、挂载服务账号令牌或访问内部网络。
    - 若命名空间存在高权限 ServiceAccount，pod create 权限可能被用于权限提升。
  remediation: |
    - 按最小权限原则移除不必要的 pods create 和通配规则。
    - 结合 RBAC 审计、Pod Security Admission 和服务账号最小权限限制可创建 Pod 的能力。
  reference:
    - https://kubernetes.io/docs/concepts/security/rbac-good-practices/#least-privilege
    - https://cloud.hacktricks.wiki/en/pentesting-cloud/kubernetes-security/abusing-roles-clusterroles-in-kubernetes/index.html
  metadata:
    vendor: kubernetes
    product: kubernetes
  tags: cloud,devops,kubernetes,devsecops,roles,k8s-cluster-security
flow: |
  code(1);
  for (let role of template.items) {
    set("role", role)
    javascript(1);
  }

self-contained: true
code:
  - engine:
      - sh
      - bash
    source: kubectl get role --all-namespaces --output=json
    extractors:
      - type: json
        name: items
        internal: true
        json:
          - '.items[]'

javascript:
  - code: |
        let role = JSON.parse(template.role);
        let riskyRules = 0;
        role.rules.forEach(rule => {
          if ((rule.resources.includes("pods") && rule.verbs.includes("create")) ||
              (rule.resources.includes("pods") && rule.verbs.includes("*")) ||
              (rule.resources.includes("*") && rule.verbs.includes("create")) ||
              (rule.resources.includes("*") && rule.verbs.includes("*"))) {
            riskyRules++;
          }
        });
        if (riskyRules > 0) {
          let result = (`Role '${role.metadata.name}' in namespace '${role.metadata.namespace}' has ${riskyRules} rule(s) with 'pods' resource and 'create' verb.`);
          Export(result);
        }

    extractors:
      - type: dsl
        dsl:
          - response
