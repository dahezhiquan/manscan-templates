id: azure-public-ip-delete-unalerted
info:
  name: Azure 公共 IP 删除告警未配置（云安全）
  author: princechaddha
  severity: high
  description: 公共 IP 删除操作未配置 Activity Log 告警时，公网入口、管理地址或服务依赖的地址资源可能被删除而不被及时发现。该模板枚举已启用的 Activity Log Alert，并检查告警条件是否缺少 Microsoft.Network/publicIPAddresses/delete 操作。
  impact: |
    - 删除公共 IP 可能导致服务不可达、管理通道中断或依赖固定地址的访问策略失效。
    - 恶意删除还可能掩盖攻击痕迹，增加恢复、DNS 切换和网络排障成本。
  remediation: |
    - 创建针对公共 IP 删除操作的 Activity Log Alert，并接入网络和安全运维告警渠道。
    - 限制公共 IP 删除权限，使用资源锁、变更审批和依赖关系盘点保护关键地址资源。
  reference:
    - https://docs.microsoft.com/en-us/azure/azure-monitor/platform/alerts-activity-log
  metadata:
    vendor: microsoft
    product: azure-monitor
  tags: cloud,devops,azure,microsoft,public-ip,azure-cloud-config

flow: |
  code(1);
  for (let AlertData of iterate(template.alertList)) {
    set("id", AlertData);
    code(2);
  }

self-contained: true
code:
  - engine:
      - sh
      - bash
    source: |
      az monitor activity-log alert list --output json --query '[?(enabled==`true`)].id'

    extractors:
      - type: json
        name: alertList
        internal: true
        json:
          - '.[]'

  - engine:
      - sh
      - bash
    source: |
      az monitor activity-log alert show --ids "$id"

    matchers-condition: and
    matchers:
      - type: word
        words:
          - '"field": "operationName"'

      - type: word
        words:
          - '"equals": "Microsoft.Network/publicIPAddresses/delete"'
        negative: true

    extractors:
      - type: dsl
        dsl:
          - 'id + " does not have the correct alert configuration for Delete Public IP Address events"'
