id: craftercms-panel

info:
  name: CrafterCMS 登录面板识别（指纹识别）
  author: righettod
  severity: info
  description: |-
    检测到目标站点存在 CrafterCMS 相关响应特征。CrafterCMS 是内容管理或知识协作系统，用于维护站点内容、文档、素材、权限和发布流程。模板请求 `/studio/login`，并通过页面标题或正文关键字、状态码、DSL 条件确认该系统指纹，用于资产识别、系统盘点和暴露面梳理。
  reference:
    - https://craftercms.org/
  classification:
    cpe: cpe:2.3:a:craftercms:craftercms:*:*:*:*:*:*:*:*
  metadata:
    verified: true
    max-request: 1
    vendor: craftercms
    product: craftercms
    shodan-query: http.title:"craftercms"
  tags: panel,craftercms,login,detect,discovery
http:
  - method: GET
    path:
      - "{{BaseURL}}/studio/login"

    matchers:
      - type: dsl
        dsl:
          - 'status_code == 200'
          - 'contains_any(to_lower(body), "craftercmsnext", "login - craftercms", "crafter software corporation")'
        condition: and

    extractors:
      - type: regex
        part: body
        group: 1
        regex:
          - 'Copyright\s+\(C\)\s+([0-9-]+)\s+Crafter'
