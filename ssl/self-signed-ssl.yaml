id: self-signed-ssl

info:
  name: 自签名 SSL 证书（证书安全）
  author: righettod,pdteam
  severity: low
  description: 该模板读取 TLS 握手结果，并在 `self_signed == true` 时报告目标使用自签名 SSL/TLS 证书。自签名证书没有由公共或受控信任链验证的签发关系，正式环境客户端通常会产生信任告警；内网和测试环境的命中需要结合组织信任根策略判断。
  impact: |
    - 公网客户端可能拒绝连接或提示证书告警，造成业务中断并诱导用户绕过安全提示。
    - 如果终端通过关闭证书校验来访问服务，攻击者可能更容易实施仿冒或中间人攻击。
    - 内网自签名证书若已通过受控方式分发根证书，风险可能低于公网部署，但仍需管理密钥和生命周期。
  remediation: |
    - 在正式环境中使用由受信任 CA 签发的证书替换自签名证书。
    - 若必须在内网使用自签名证书，应通过受控方式将根证书分发到所有受信终端，并做好证书生命周期管理。
    - 禁止通过关闭客户端证书校验来绕过告警，并定期审计自建 CA 私钥和信任根分发范围。
  reference:
    - https://www.rapid7.com/db/vulnerabilities/ssl-self-signed-certificate/
  metadata:
    max-request: 1
  tags: ssl,tls,self-signed,vuln
ssl:
  - address: "{{Host}}:{{Port}}"
    matchers:
      - type: dsl
        dsl:
          - "self_signed == true"
