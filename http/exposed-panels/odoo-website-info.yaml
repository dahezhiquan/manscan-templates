id: odoo-website-info-exposure

info:
  name: Odoo Website - 信息泄露（暴露面识别）
  author: aushack
  severity: info
  description: |
    该模板用于识别 Odoo Website 相关暴露入口或页面特征。若命中，说明目标可能对外公开了可访问的管理或信息接口，存在进一步泄露系统信息、配置数据或服务细节的风险。
  metadata:
    verified: true
    max-request: 1
    vendor: odoo
    product: odoo
    shodan-query:
      - title:"Odoo"
      - http.title:"odoo"
      - cpe:"cpe:2.3:a:odoo:odoo"
    fofa-query: title="odoo"
    google-query: intitle:"odoo"
  tags: info,odoo,discovery

http:
  - method: GET
    path:
      - "{{BaseURL}}/website/info"

    matchers-condition: and
    matchers:
      - type: word
        part: body
        words:
          - 'instance of Odoo, the <a target="_blank" href="https://www.odoo.com">Open Source ERP</a>'
          - 'Installed Applications'

      - type: status
        status:
          - 200
