id: iam-expired-ssl
info:
  name: IAM 存在已过期 SSL/TLS 证书（云安全）
  author: princechaddha
  severity: high
  description: IAM server certificate 过期后，依赖该证书的旧式负载均衡、CloudFront 或其他集成可能出现 TLS 握手失败和身份校验异常。该模板列出 IAM server certificates，并筛选 Expiration 早于当前时间的证书。
  impact: |
    - 客户端可能无法建立可信 TLS 连接，造成业务访问失败或降级到不符合要求的证书配置。
    - 过期证书继续留存会增加资产管理噪声，并可能掩盖真正仍在使用的证书风险。
  remediation: |
    - 替换或续期仍在使用的 IAM server certificate，并优先迁移到 ACM 托管证书。
    - 删除不再使用的过期证书，建立证书到期监控和提前续期流程。
  reference:
    - https://docs.aws.amazon.com/cli/latest/reference/iam/list-server-certificates.html
  metadata:
    vendor: amazon
    product: iam
  tags: cloud,devops,aws,amazon,iam,ssl,aws-cloud-config
self-contained: true
code:
  - engine:
      - sh
      - bash
    source: |
      aws iam list-server-certificates | jq -r '.ServerCertificateMetadataList[] | select(.Expiration | fromdateiso8601 < now) | .ServerCertificateName'

    extractors:
      - type: regex
        name: certificate
        internal: true
        regex:
          - '\b[a-zA-Z0-9]+\b'

      - type: dsl
        dsl:
          - 'certificate + " Certificate is expired in your AWS account"'
