id: arcgis-panel

info:
  name: ArcGIS Enterprise 面板（暴露面识别）
  author: Podalirius
  severity: info
  description: 该模板通过识别 ArcGIS Enterprise 面板、控制台或管理界面的页面特征，判断目标是否暴露了对应服务入口。若命中，说明该后台或运维界面对外可访问，可用于资产识别与暴露面排查。
  reference:
    - https://enterprise.arcgis.com/en/
  classification:
    cwe-id: CWE-200
    cpe: cpe:2.3:a:esri:arcgis_enterprise:*:*:*:*:*:*:*:*
  metadata:
    max-request: 1
    vendor: esri
    product: arcgis_enterprise
  tags: docs,arcgis,cms,panel,esri,discovery

http:
  - method: GET
    path:
      - '{{BaseURL}}/portal/portalhelp/en/'

    matchers-condition: and
    matchers:
      - type: word
        words:
          - 'ArcGIS Enterprise'
          - 'Installation and Deployment'
        condition: or

      - type: status
        status:
          - 200

    extractors:
      - type: regex
        part: body
        group: 1
        regex:
          - '&nbsp;([0-9.]+)</span>'

      - type: regex
        part: body
        group: 2
        regex:
          - '(Released Version:</strong>[\n\t ]+(([0-9]+(.[0-9]+)?(.[0-9]+)?)([\n\t
            ]+\([A-Za-z]+[\t ]+20[0-9][0-9]\))?))'
