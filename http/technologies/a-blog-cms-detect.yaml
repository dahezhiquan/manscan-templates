id: a-blog-cms-detect

info:
  name: a-blog cms 指纹识别（指纹识别）
  author: Shivam Kamboj
  severity: info
  description: |-
    a-blog cms 是面向网站和企业内容运营的 CMS，用于页面、文章、模板和站点内容管理。该模板请求首页，并依据页面标题、正文关键字或品牌资源特征识别目标是否使用或暴露了 a-blog cms 相关组件，适用于资产盘点、技术栈识别和后续安全评估；命中结果仅表示指纹特征匹配，不代表已确认存在可利用漏洞。
  reference:
  - https://www.a-blogcms.jp/
  metadata:
    verified: true
    max-request: 1
    shodan-query: html:"a-blog cms"
  tags: tech,discovery,cms,a-blog-cms

http:
  - method: GET
    path:
      - "{{BaseURL}}"

    redirects: true

    matchers:
      - type: word
        part: body
        words:
          - "a-blog cms"
          - "acms-js"
        condition: and

    extractors:
      - type: regex
        part: body
        group: 1
        regex:
          - '(?i)content="a-blog cms (?:Ver\.|v)?([0-9.]+)'
