id: ptr-fingerprint

info:
  name: PTR 记录识别（dns）
  author: pdteam
  severity: info
  description: |
    该模板检测 PTR 反向解析记录。PTR 记录用于将 IP 地址映射回域名，常用于邮件服务、资产归属和网络指纹识别。
  classification:
    cwe-id: CWE-200
  metadata:
    max-request: 1
  tags: dns,ptr,discovery

dns:
  - name: "{{FQDN}}"
    type: PTR
    matchers:
      - type: regex
        part: answer
        regex:
          - "IN\tPTR\\t(.+)$"

    extractors:
      - type: regex
        group: 1
        regex:
          - "IN\tPTR\t(.+)"
