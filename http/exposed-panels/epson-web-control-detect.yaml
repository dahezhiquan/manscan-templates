id: epson-web-control-detect

info:
  name: Epson Printer 面板识别（暴露面识别）
  author: pussycat0x
  severity: info
  description: 该模板通过识别 Epson Printer 面板、控制台或管理界面的页面特征，判断目标是否暴露了对应服务入口。若命中，说明该后台或运维界面对外可访问，可用于资产识别与暴露面排查。
  reference:
    - https://www.exploit-db.com/ghdb/6873
  classification:
    cwe-id: CWE-200
  metadata:
    max-request: 1
  tags: panel,unauth,epson,edb,iot,printer,discovery

http:
  - method: GET
    path:
      - "{{BaseURL}}/cgi-bin/home"

    matchers-condition: and
    matchers:
      - type: word
        words:
          - "Epson Web Control"
          - "Basic Control"
          - "Advanced"
        condition: and

      - type: status
        status:
          - 200
