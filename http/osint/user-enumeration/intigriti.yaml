id: intigriti

info:
  name: Intigriti 用户名信息枚举（OSINT）
  author: philippedelteil
  severity: info
  description: |
    对 Intigriti 的用户名进行 OSINT 枚举检查。模板请求公开路径 https://app.intigriti.com/profile/用户名，当响应状态为 200 且页面或响应内容命中 “Rep. all time</h5>”、“<title>用户名 - Intigriti</titl...” 等用户资料页特征时，判定目标用户名可能存在。
  classification:
    cvss-metrics: CVSS:3.1/AV:N/AC:L/PR:N/UI:N/S:U/C:N/I:N/A:N
    cvss-score: 0
    cwe-id: CWE-200
  metadata:
    max-request: 1
  tags: osint,osint-tech,intigriti,discovery

self-contained: true

http:
  - method: GET
    path:
      - "https://app.intigriti.com/profile/{{user}}"

    matchers-condition: and
    matchers:
      - type: word
        part: body
        words:
          - 'Rep. all time</h5>'
          - '<title>{{user}} - Intigriti</title>'
        condition: and

      - type: word
        part: body
        words:
          - "We didn't find what you're looking for"
        negative: true

      - type: status
        status:
          - 200
