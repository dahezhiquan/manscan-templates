id: exposed-filezilla-config

info:
  name: 暴露 FileZilla 配置文件暴露（暴露面识别）
  author: pussycat0x
  severity: medium
  description: |
    检测到对外可访问的 暴露 FileZilla 配置文件。这类配置资源可能包含部署细节、访问凭据、内部地址、组件版本或调试开关，公开暴露后会显著增加被侦察和后续利用的风险。
  reference:
    - https://wiki.filezilla-project.org/Xml_files
  metadata:
    verified: true
    max-request: 4
  tags: exposure,config,filezilla,ftp

http:
  - method: GET
    path:
      - "{{BaseURL}}/files/FileZilla.xml"
      - "{{BaseURL}}/recentservers.xml"
      - "{{BaseURL}}/filezilla.xml"

    stop-at-first-match: true

    matchers:
      - type: dsl
        dsl:
          - "status_code == 200"
          - "contains_all(body, '<filezilla','<User>','<Pass>','<Logontype>')"
        condition: and
