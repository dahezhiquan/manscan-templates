id: ezservermonitor-exposure

info:
  name: eZ Server Monitor 暴露
  author: pussycat0x
  severity: low
  description: |
    该模板用于核查 eZ Server Monitor 暴露。该类问题通常源于生产环境暴露调试页面、错误回溯、诊断端点、指标接口或详细错误信息。模板会向目标发送探测请求，并依据请求 `/`、`/esm/`、匹配 `<title>eZ Server Monitor`、匹配 `eZ Server Monitor - v`等证据确认目标是否存在该配置问题。
  impact: |
    - 攻击者可获取应用路径、框架版本、环境变量、内部调用栈、运行参数或依赖信息。
    - 这些信息可帮助攻击者定位组件版本、构造后续漏洞利用或发现内部系统结构。
  remediation: |
    - 关闭生产环境调试模式、错误回溯、示例页面和诊断接口。
    - 对确需保留的运维端点增加认证授权、来源限制和访问审计。
    - 统一错误处理策略，避免向外部用户返回堆栈、环境变量和内部路径。
  reference:
    - https://github.com/shevabam/ezservermonitor-web
    - https://www.ezservermonitor.com/esm-web/features
  metadata:
    verified: true
    max-request: 4
    shodan-query: title:"eZ Server Monitor"
    fofa-query: title="eZ Server Monitor"
  tags: misconfig,exposure,ezservermonitor,monitoring

http:
  - method: GET
    path:
      - "{{BaseURL}}/"
      - "{{BaseURL}}/esm/"
      - "{{BaseURL}}/monitoring/"
      - "{{BaseURL}}/ezservermonitor/"

    stop-at-first-match: true

    matchers-condition: and
    matchers:
      - type: word
        part: body
        words:
          - "<title>eZ Server Monitor"
          - "eZ Server Monitor - v"
        condition: and

      - type: word
        part: body
        words:
          - "web/css/frontend.css"
          - '<span class="icon-gauge"></span>eSM'
        condition: or

      - type: status
        status:
          - 200

    extractors:
      - type: regex
        name: version
        part: body
        group: 1
        regex:
          - 'eZ Server Monitor - v([0-9.]+)'
