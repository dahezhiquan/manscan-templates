id: cascade-cms-panel

info:
  name: Cascade CMS 面板识别（指纹识别）
  author: righettod
  severity: info
  description: |-
    检测到目标站点存在 Cascade CMS 相关响应特征。CAS 是 Central Authentication Service 单点登录系统，登录入口用于为多个应用提供统一认证能力。模板请求 `/login.act`，并通过页面标题或正文关键字、状态码、DSL 条件确认该系统指纹，用于资产识别、系统盘点和暴露面梳理。
  reference:
    - https://www.hannonhill.com/products/cascade-cms-web-content-management/index.html
  metadata:
    verified: true
    max-request: 1
    shodan-query: http.title:"Cascade CMS"
  tags: panel,cascade,detect
http:
  - method: GET
    path:
      - "{{BaseURL}}/login.act"

    matchers:
      - type: dsl
        dsl:
          - 'status_code == 200'
          - 'contains_any(to_lower(body), "cascade cms</title>", "window.cascade_")'
        condition: and

    extractors:
      - type: regex
        part: body
        group: 1
        regex:
          - '(?i)\-\s*v([0-9\.]+)'
