id: k8s-missing-network-policies

info:
  name: 检查 的缺失 Network 策略 中的Kubernetes（云安全）
  author: princechaddha
  severity: medium
  description: Kubernetes 默认允许 Pod 间通信，未配置 NetworkPolicy 时命名空间内外流量通常缺少显式隔离边界。本模板执行 kubectl get networkpolicies -A，并在返回 No resources found 时报告集群未发现 NetworkPolicy。
  impact: |
    - 任一被攻陷 Pod 可能直接探测和访问其他服务，增加横向移动和数据泄露风险。
    - 多租户或多环境集群缺少网络隔离，难以满足最小访问和合规要求。
  remediation: |
    - 为关键命名空间创建默认拒绝 ingress/egress 的 NetworkPolicy，再按业务依赖逐项放行。
    - 确认集群 CNI 支持并实际执行 NetworkPolicy，定期审计策略覆盖率。
  reference:
    - https://kubernetes.io/docs/concepts/services-networking/network-policies/
  metadata:
    vendor: kubernetes
    product: kubernetes
  tags: cloud,devops,kubernetes,devsecops,k8s-cluster-security
self-contained: true

code:
  - engine:
      - sh
      - bash
    source: kubectl get networkpolicies -A

    matchers:
      - type: word
        part: stderr
        words:
          - 'No resources found'

    extractors:
      - type: dsl
        dsl:
          - "No Network Policies found"
