id: nacl-open-inbound
info:
  name: NACL 入站流量过度开放（云安全）
  author: princechaddha
  severity: medium
  description: VPC Network ACL 允许入站流量且未限制端口范围时，会削弱子网层网络边界控制。该模板枚举 network ACL，并检查入站 Egress=false、RuleAction=allow 的规则中是否缺少 PortRange。
  impact: |
    - 子网内资源可能暴露更多协议或端口，增加被扫描和利用的机会。
    - 即使安全组较严格，过宽 NACL 也会降低分层防御效果并增加误配置影响范围。
  remediation: |
    - 将 NACL 入站 allow 规则限制到业务必需的端口、协议和来源 CIDR。
    - 定期审计默认 NACL 和自定义 NACL，避免使用缺少端口边界的宽泛入站规则。
  reference:
    - https://docs.aws.amazon.com/vpc/latest/userguide/vpc-network-acls.html
  metadata:
    max-request: 2
    vendor: amazon
    product: vpc
  tags: cloud,devops,aws,amazon,vpc,aws-cloud-config
variables:
  region: "us-east-1"

flow: |
  code(1)
  for(let NACLIDs of iterate(template.nacls)){
    set("naclid", NACLIDs)
    code(2)
  }

self-contained: true
code:
  - engine:
      - sh
      - bash
    source: |
      aws ec2 describe-network-acls --region $region --query 'NetworkAcls[*].NetworkAclId' --output json

    extractors:
      - type: json
        name: nacls
        internal: true
        json:
          - '.[]'

  - engine:
      - sh
      - bash
    source: |
         aws ec2 describe-network-acls --region $region --network-acl-ids $naclid --query 'NetworkAcls[*].Entries[?(RuleAction==`allow`) && (Egress==`false`)] | []'

    matchers-condition: and
    matchers:
      - type: word
        words:
          - "allow"
        condition: and

      - type: word
        words:
          - "PortRange"
        negative: true

    extractors:
      - type: dsl
        dsl:
          - '"Access to the VPC subnets associated with your NACL " + naclid + " is not restricted."'
