id: jwk-json-leak

info:
  name: JSON Web Key 文件暴露（暴露面识别）
  author: Mohsen Yaghoubi
  severity: high
  description: |
    检测到目标站点响应中暴露 JSON Web Key 文件。通用凭据或令牌可能来自应用配置、源码、日志或响应正文，用于认证数据库、API、服务账号或第三方平台。该模板请求 `/.well-known/jwks.json`、`/.well-known/jwks`、`/.well-known/openid-configuration/jwks.json` 等路径，并在目标响应正文中通过正则表达式匹配对应格式的密钥、令牌、连接串或客户端凭据。公开后可能导致对应平台资源、数据、流水线、消息发送或第三方集成被未授权访问。
  impact: |-
    - 泄露的 API Key、访问令牌、客户端密钥、连接串或服务账号凭据可能被用于直接调用对应平台 API 或访问受保护资源。
    - 攻击者可能借助有效凭据读取、修改或删除数据，触发构建/部署任务，发送消息，管理云资源，或冒用集成应用身份。
    - 即使令牌权限有限，也会暴露账号、项目、组织或环境边界，辅助横向移动、供应链攻击和定向社工。
  remediation: |-
    - 立即撤销并轮换暴露的 API Key、访问令牌、客户端密钥、连接串、Webhook Secret 或服务账号凭据。
    - 在对应平台检查令牌权限、作用域、有效期和最近调用记录，移除不必要的高权限或长期凭据。
    - 将密钥迁移到密钥管理系统、受保护的 CI/CD 变量或运行时注入机制，避免写入前端页面、日志、源码和公开配置。
    - 启用最小权限、IP/来源限制、MFA、告警和审计日志，并排查是否存在未授权资源访问或数据变更。
  reference:
    - https://portswigger.net/web-security/jwt/algorithm-confusion
  classification:
    cpe: cpe:2.3:a:jwt_project:jwt:*:*:*:*:*:*:*:*
    cwe-id: CWE-540
  metadata:
    verified: true
    max-request: 1
    vendor: jwt_project
    product: jwt
    shodan-query: html:"jwks.json"
  tags: exposure,token,generic,vuln

http:
  - method: GET
    path:
      - "{{BaseURL}}/.well-known/jwks.json"
      - "{{BaseURL}}/.well-known/jwks"
      - "{{BaseURL}}/.well-known/openid-configuration/jwks.json"
      - "{{BaseURL}}/.well-known/openid-configuration/jwks"
      - "{{BaseURL}}/jwks.json"
      - "{{BaseURL}}/jwks"

    stop-at-first-match: true

    matchers-condition: and
    matchers:
      - type: word
        part: body
        words:
          - '"kty":'

      - type: word
        part: content_type
        words:
          - 'application/json'

      - type: status
        status:
          - 200
