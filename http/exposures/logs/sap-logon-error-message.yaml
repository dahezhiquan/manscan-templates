id: sap-logon-error-message

info:
  name: SAP Logon Error Message 泄露（暴露面识别）
  author: DhiyaneshDK
  severity: info
  description: |
    检测到可直接访问的 SAP Logon Error Message。日志、异常页面或调试输出通常会泄露堆栈信息、内部路径、查询语句、账号标识、令牌片段或业务数据，不应向未授权用户开放。
  metadata:
    verified: true
    max-request: 1
    shodan-query: html:"Logon Error Message"
  tags: sap,logon,error,log,vuln

http:
  - method: GET
    path:
      - "{{BaseURL}}/"

    matchers-condition: and
    matchers:
      - type: word
        words:
          - "Logon Error Message"
          - "SAP Internet Communication Framework Team"
        condition: and

      - type: status
        status:
          - 404
