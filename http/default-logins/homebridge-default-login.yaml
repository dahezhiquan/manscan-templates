id: homebridge-default-login

info:
  name: Homebridge 默认管理员凭据（弱口令）
  author: 0x_Akoko
  severity: high
  description: |
    该模板用于检测 Homebridge 是否仍可使用默认凭据或弱口令登录。模板主要向 `/`、`/api/auth/login` 等认证入口发送请求，使用内置默认凭据组合进行认证尝试，并根据响应中的 `status_code == 200`、`contains_any(to_lower(body), "homebridge", "homebridge-config-ui")` 等登录成功特征判断登录是否成功；命中说明目标未及时修改出厂、示例或初始化账号口令。
  impact: |
    - 攻击者可登录 Homebridge 后台，管理内容、用户、插件、主题、文件或站点配置。
    - 后台权限被滥用后，可能导致页面篡改、恶意文件上传、敏感资料泄露，或进一步取得服务器执行能力。
  remediation: |
    - 立即修改默认管理员凭据，删除安装向导、演示账号和不必要的后台用户。
    - 限制后台登录入口访问来源，启用多因素认证、登录失败锁定和验证码等防护。
    - 检查近期内容、插件、主题、文件上传和管理员操作记录，确认没有持久化后门。
  reference:
    - https://github.com/homebridge/homebridge
    - https://github.com/homebridge/homebridge-config-ui-x
  classification:
    cvss-metrics: CVSS:3.1/AV:N/AC:L/PR:N/UI:N/S:U/C:H/I:H/A:H
    cvss-score: 9.8
    cwe-id: CWE-798
  metadata:
    verified: true
    max-request: 1
    vendor: homebridge
    product: homebridge-config-ui-x
    shodan-query: 'http.title:"Homebridge"'
    fofa-query: 'title="Homebridge"'
  tags: default-login,homebridge,iot,vuln

variables:
  username: "admin"
  password: "admin"

flow: http(1) && http(2)

http:
  - raw:
      - |
        GET / HTTP/1.1
        Host: {{Hostname}}

    matchers:
      - type: dsl
        internal: true
        dsl:
          - 'status_code == 200'
          - 'contains_any(to_lower(body), "homebridge", "homebridge-config-ui")'
        condition: and

  - raw:
      - |
        POST /api/auth/login HTTP/1.1
        Host: {{Hostname}}
        Content-Type: application/json

        {"username":"{{username}}","password":"{{password}}"}

    matchers:
      - type: dsl
        dsl:
          - 'status_code == 200 || status_code == 201'
          - 'contains(content_type, "application/json")'
          - 'contains_all(body, "access_token", "token_type")'
        condition: and
