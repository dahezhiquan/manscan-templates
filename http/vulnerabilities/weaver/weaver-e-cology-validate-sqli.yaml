id: weaver-e-cology-validate-sqli

info:
  name: Weaver e-cology Validate.JSP - SQL 注入漏洞
  author: SleepingBag945
  severity: high
  description: Weaver e-cology Validate.JSP - SQL 注入 存在SQL 注入漏洞。攻击者可借助可控参数干预后端 SQL 查询，从而读取敏感数据、绕过鉴权或进一步影响数据库完整性。
  classification:
    cwe-id: CWE-89
  metadata:
    max-request: 1
  tags: ecology,weaver,sqli,vuln
variables:
  num1: "{{rand_int(40000, 44800)}}"
  num2: "{{rand_int(40000, 44800)}}"
  result: "{{to_number(num1)*to_number(num2)}}"

