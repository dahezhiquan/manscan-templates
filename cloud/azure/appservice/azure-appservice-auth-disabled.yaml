id: azure-appservice-auth-disabled
info:
  name: Azure App Service 身份认证未启用（云安全）
  author: princechaddha
  severity: medium
  description: Azure App Service 未启用内置身份认证时，应用需要自行实现登录、令牌校验和未授权访问控制，容易出现认证逻辑遗漏或实现不一致。该模板枚举 Web App，查询 auth.enabled，并在返回 false 时报告未启用应用服务认证。
  impact: |
    - 未认证或认证绕过的请求可能直接访问业务接口、管理功能和敏感数据。
    - 多个应用自行维护认证逻辑会增加会话、令牌、重定向和权限校验缺陷的累积风险。
  remediation: |
    - 根据应用身份模型启用 App Service Authentication，并接入 Microsoft Entra ID 或其他受信任身份提供方。
    - 配置未认证请求处理、令牌受众和回调地址，完成端到端授权测试后再限制应用自定义的重复认证逻辑。
  reference:
    - https://docs.microsoft.com/en-us/azure/app-service/overview-authentication-authorization
  metadata:
    vendor: microsoft
    product: azure-app-service
  tags: cloud,devops,azure,microsoft,appservice,azure-cloud-config

flow: |
  code(1);
  for (let WebAppData of iterate(template.webAppList)) {
    WebAppData = JSON.parse(WebAppData);
    set("id", WebAppData.id);
    code(2);
  }

self-contained: true
code:
  - engine:
      - sh
      - bash
    source: |
      az webapp list --output json --query '[*].{id:id}'

    extractors:
      - type: json
        name: webAppList
        internal: true
        json:
          - '.[]'

  - engine:
      - sh
      - bash
    source: |
      az webapp auth show --ids "$id" --query 'enabled' --output json

    matchers:
      - type: word
        words:
          - "false"

    extractors:
      - type: dsl
        dsl:
          - 'id + " does not have App Service Authentication enabled"'
