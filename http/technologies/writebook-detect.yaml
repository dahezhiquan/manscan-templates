id: writebook-detect

info:
  name: Writebook 指纹识别（指纹识别）
  author: hahwul
  severity: info
  description: >-
    Writebook 是用于发布和阅读长篇内容或图书式文档的 Web 应用，常用于个人或团队知识内容发布。该模板通过请求目标服务并检查预设路径或首页响应、HTTP
    响应头、页面正文关键字等指纹特征，判断目标是否使用或暴露了 Writebook 相关组件；命中结果仅表示指纹特征匹配，可用于资产盘点、技术栈识别和后续安全评估，不代表已确认存在可利用漏洞。
  reference:
  - https://once.com/writebook
  - https://books.37signals.com/2/the-writebook-manual
  metadata:
    max-request: 1
    verified: true
    shodan-query: html:"Writebook"
  tags: writebook,tech,discovery
http:
  - method: GET
    path:
      - "{{BaseURL}}"
      - "{{BaseURL}}/session/new"

    stop-at-first-match: true
    matchers-condition: or
    matchers:
      - type: word
        part: header
        words:
          - "Set-Cookie: _writebook_session"

      - type: word
        part: body
        words:
          - "Made with Writebook"
          - "Writebook</h1>"
        condition: or
