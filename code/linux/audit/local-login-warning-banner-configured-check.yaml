id: local-login-warning-banner-configured-check

info:
  name: 确保本地登录警告横幅配置正确（本地基线扫描）
  author: Th3l0newolf
  severity: low
  description: |-
    此模板检查本地登录警告横幅是否已正确配置，且不会泄露系统信息。
  remediation: |-
    编辑 `/etc/issue`，删除任何可能泄露系统详情的操作系统、内核、架构或版本信息。根据组织安全策略配置横幅内容。
  reference:
    - https://www.cisecurity.org/benchmark/ubuntu_linux
  tags: cis,linux,ubuntu,issue,banner,audit
  metadata:
    verified: true

self-contained: true

code:
  - engine:
      - bash
    args:
      - "-c"
      - |
        os_id=$(grep '^ID=' /etc/os-release | cut -d= -f2 | sed 's/"//g')

        if grep -E -i "(\\\v|\\\r|\\\m|\\\s|$os_id)" /etc/issue >/dev/null 2>&1; then
          echo "[local-login-warning-banner-configured-check:Policy-Fail] [/etc/issue contains system information] [CIS_FAIL] [low]"
        else
          echo "[local-login-warning-banner-configured-check:Policy-Pass] [/etc/issue is properly configured] [CIS_PASS] [low]"
        fi

    matchers:
      - type: word
        name: policy-pass
        words:
          - "Policy-Pass"

      - type: word
        name: policy-fail
        words:
          - "Policy-Fail"
