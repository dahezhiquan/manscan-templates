id: harbor-detect

info:
  name: Harbor 指纹识别（指纹识别）
  author: pikpikcu,daffainfo
  severity: info
  description: 用于识别目标是否部署 Harbor 并提取相关版本或构建信息，模板会结合 favicon 哈希、页面正文、状态码、特定路径或已知端点和版本或标识提取结果进行指纹匹配。
  reference:
    - https://github.com/goharbor/harbor
  metadata:
    verified: true
    max-request: 1
    shodan-query: http.favicon.hash:657337228
    product: harbor
    vendor: linuxfoundation
    fofa-query: icon_hash=657337228
  tags: tech,harbor,discovery

http:
  - method: GET
    path:
      - '{{BaseURL}}/api/v2.0/systeminfo'

    matchers-condition: and
    matchers:
      - type: word
        part: body
        words:
          - '"auth_mode"'
          - '"harbor_version"'
        condition: and

      - type: status
        status:
          - 200

    extractors:
      - type: regex
        group: 1
        regex:
          - '(?m)"harbor_version":"([0-9.]+)",'
