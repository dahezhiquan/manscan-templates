id: gstorage-detect

info:
  name: Google Cloud Storage Bucket 指纹识别（指纹识别）
  author: 0xTeles
  severity: info
  description: >-
    Google Cloud Storage Bucket 是 Google Cloud 对象存储容器，用于托管静态资源、备份和应用数据。该模板通过请求目标服务并检查预设路径或首页响应、页面正文关键字、HTTP
    响应头等指纹特征，判断目标是否使用或暴露了 Google Cloud Storage Bucket 相关组件；命中结果仅表示指纹特征匹配，可用于资产盘点、技术栈识别和后续安全评估，不代表已确认存在可利用漏洞。
  metadata:
    max-request: 1
  tags: tech,gstorage,google,bucket,discovery
http:
  - method: GET
    path:
      - "{{BaseURL}}"

    matchers:
      - type: word
        part: header
        words:
          - "x-goog-metageneration"
          - "x-goog-generation"
        case-insensitive: true
