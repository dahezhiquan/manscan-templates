id: mysql-history

info:
  name: Mysql 历史记录 文件 泄露
  author: kazet
  severity: low
  description: |
    该模板用于核查 Mysql 历史记录 文件 泄露。该类问题通常源于配置文件、备份文件、管理页面、服务状态或敏感资源被错误暴露到 Web 访问路径。模板会向目标发送探测请求，并依据请求 `/.mysql_history`、匹配 `_HiStOrY_V2_`、匹配 `show databases;`、匹配 `application/octet-stream`等证据确认目标是否存在该配置问题。
  impact: |
    - 攻击者可获取版本、路径、账号、密钥、令牌、配置或业务数据等敏感信息。
    - 泄露的信息可能被用于凭据攻击、漏洞匹配、权限提升或横向移动。
  remediation: |
    - 移除 Web 根目录下不应公开的配置、备份、日志和临时文件。
    - 为敏感页面和资源增加访问控制，并按最小暴露原则收敛公开路径。
    - 轮换已暴露的密钥、令牌和凭据，并审计异常下载或枚举行为。
  reference:
    - http://doc.docs.sk/mysql-refman-5.5/mysql-history-file.html
  classification:
    cpe: cpe:2.3:a:oracle:mysql:*:*:*:*:*:*:*:*
  metadata:
    verified: true
    max-request: 1
    vendor: oracle
    product: mysql
    shodan-query: html:"mysql_history"
  tags: misconfig,disclosure,config,vuln

http:
  - method: GET
    path:
      - "{{BaseURL}}/.mysql_history"

    matchers-condition: and
    matchers:
      - type: word
        words:
          - "_HiStOrY_V2_"
          - "show databases;"
        condition: or

      - type: word
        part: header
        words:
          - "application/octet-stream"
          - "text/plain"
          - "filename=\".mysql_"

      - type: word
        part: response
        words:
          - "<?xml"
          - "<env"
          - "application/javascript"
          - "application/json"
          - "application/xml"
          - "html>"
          - "text/html"
          - "image/"
        negative: true

      - type: status
        status:
          - 200
