id: f-secure-policy-manager

info:
  name: F-Secure Policy Manager Server 登录面板识别（暴露面识别）
  author: dhiyaneshDK
  severity: info
  description: 该模板通过识别 F-Secure Policy Manager Server 登录入口的页面标题、特征文本或重定向行为，判断目标是否暴露了对应的认证界面。若命中，说明该登录面板对外可访问，可用于暴露面梳理与后续安全评估。
  classification:
    cvss-metrics: CVSS:3.0/AV:N/AC:L/PR:N/UI:N/S:U/C:N/I:N/A:N
    cwe-id: CWE-200
    cpe: cpe:2.3:a:withsecure:f-secure_policy_manager:*:*:*:*:windows:*:*:*
  metadata:
    max-request: 1
    vendor: withsecure
    product: f-secure_policy_manager
    shodan-query:
      - http.title:"F-Secure Policy Manager Server"
      - http.title:"f-secure policy manager server"
    fofa-query: title="f-secure policy manager server"
    google-query: intitle:"f-secure policy manager server"
  tags: login,panel,withsecure,discovery

http:
  - method: GET
    path:
      - '{{BaseURL}}'

    matchers-condition: and
    matchers:
      - type: word
        words:
          - '<title>F-Secure Policy Manager Server</title>'

      - type: status
        status:
          - 200
