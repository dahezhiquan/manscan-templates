id: dionaea-mqtt-honeypot-detect

info:
  name: Dionaea MQTT 蜜罐识别（蜜罐识别）
  author: UnaPibaGeek
  severity: info
  description: |
    Dionaea 可模拟 MQTT 服务以捕获针对物联网消息协议的扫描和攻击行为。该模板发送 MQTT CONNECT 探测，并通过固定的 CONNACK `20020000` 响应识别 Dionaea MQTT 蜜罐。
  metadata:
    verified: true
    max-request: 1
    vendor: dionaea
    product: mqtt
    shodan-query:
      - product:"MQTT"
      - product:"mqtt"
  tags: dionaea,mqtt,honeypot,ir,cti,network,tcp,discovery
tcp:
  - inputs:
      - data: "101000044d5154540502003c032100140000"
        type: hex

    host:
      - "{{Hostname}}"
    port: 1883
    read-size: 1024

    matchers:
      - type: binary
        binary:
          - "20020000"
