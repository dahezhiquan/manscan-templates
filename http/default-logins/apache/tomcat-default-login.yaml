id: tomcat-default-login

info:
  name: Apache Tomcat Manager 默认口令登录（弱口令）
  author: pdteam,sinKettu,nybble04
  severity: high
  description: |
    该模板用于检测 Apache Tomcat Manager 是否仍可使用默认凭据或弱口令登录。模板主要向 `/manager/html` 等认证入口发送请求，使用内置默认凭据组合进行认证尝试，并根据响应中的 `status_code == 200`、`contains_all(body, "Apache Tomcat", "Server Information")` 等登录成功特征判断登录是否成功；命中说明目标未及时修改出厂、示例或初始化账号口令。
  impact: |
    - 攻击者可进入 Apache Tomcat Manager 管理后台，修改任务、服务、插件、路由、作业调度或部署配置。
    - 在 DevOps、网关、监控或调度场景中，后台失陷可能影响生产任务执行、泄露密钥配置，并扩大到下游主机或业务系统。
  remediation: |
    - 立即修改默认管理员口令并清理示例账号，按角色最小化后台管理权限。
    - 将控制台和管理 API 放入受控网络或 VPN 后方，并开启多因素认证、登录失败限制和操作审计。
    - 复核近期任务、插件、连接配置、访问令牌和部署记录，轮换可能暴露的密钥。
  reference:
    - https://www.rapid7.com/db/vulnerabilities/apache-tomcat-default-ovwebusr-password/
    - https://github.com/danielmiessler/SecLists/blob/master/Passwords/Default-Credentials/tomcat-betterdefaultpasslist.txt
  classification:
    cpe: cpe:2.3:a:apache:tomcat:*:*:*:*:*:*:*:*
  metadata:
    max-request: 25
    vendor: apache
    product: tomcat
    shodan-query: title:"Apache Tomcat"
  tags: tomcat,apache,default-login,vuln

http:
  - raw:
      - |
        GET /manager/html HTTP/1.1
        Host: {{Hostname}}
        Authorization: Basic {{base64(username + ':' + password)}}

    payloads:
      username:
        - tomcat
        - admin
        - admin
        - admin
        - admin
        - admin
        - manager
        - role1
        - role1
        - root
        - root
        - both
        - ADMIN
        - ovwebusr
        - j2deployer
        - cxsdk
        - QCC
        - xampp
        - demo
        - server_admin
        - role
        - tomcat
        - tomcat
        - tomcat
        - vagrant
        - admin
        - admin
        - admin
      password:
        - tomcat
        - admin
        - manager
        - s3cret
        - changethis
        - tomcat
        - manager
        - role1
        - tomcat
        - root
        - r00t
        - tomcat
        - ADMIN
        - OvW*busr1
        - j2deployer
        - kdsxc
        - QLogic66
        - xampp
        - demo
        - owaspbwa
        - changethis
        - s3cret
        - changethis
        - Password1
        - vagrant
        - password
        - Password1
        - admin123
    attack: pitchfork
    stop-at-first-match: true
    threads: 30

    matchers:
      - type: dsl
        dsl:
          - status_code == 200
          - contains_all(body, "Apache Tomcat", "Server Information")
          - contains_any(body, "Tomcat Version", "JVM Version", "JVM Vendor", "OS Name", "OS Version", "OS Architecture", "Hostname", "IP Address")
        condition: and
