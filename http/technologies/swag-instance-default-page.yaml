id: swag-instance-default-page

info:
  name: Swag 实例 默认页面 面板指纹识别（指纹识别）
  author: DhiyaneshDK
  severity: info
  description: 用于识别目标暴露的 Swag 实例 默认页面 面板，模板会结合 HTTP 响应头、页面标题、状态码和特定路径或已知端点判断是否存在对应技术或默认页面特征。
  classification:
    cvss-metrics: CVSS:3.0/AV:N/AC:L/PR:N/UI:N/S:U/C:N/I:N/A:N
    cvss-score: 0
    cwe-id: CWE-200
  metadata:
    verified: true
    max-request: 1
    shodan-query: title:"Welcome to your SWAG instance"
  tags: panel,tech,discovery

http:
  - method: GET
    path:
      - "{{BaseURL}}"

    matchers-condition: and
    matchers:
      - type: word
        words:
          - "<title>Welcome to your SWAG instance</title>"

      - type: word
        part: header
        words:
          - "text/html"

      - type: status
        status:
          - 200
