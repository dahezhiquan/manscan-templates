id: zqnb-educationcloud-exposure

info:
  name: ZhongQing Education Cloud Platform - 信息泄露漏洞
  author: ritikchaddha
  severity: high
  description: |
    该模板用于检测 ZhongQing Education Cloud Platform - 信息泄露漏洞。该类问题通常源于调试页面、配置文件、接口响应或目录资源被非预期暴露。模板会向 `/api/TeacherQuery/SearchTeacherInSiteWithPagerRecords` 等位置发送探测请求，并结合响应状态、关键字、错误信息、时间差或外带交互等证据判断目标是否受影响。
  impact: |
    - 攻击者可获取系统版本、路径、账号、密钥、配置或业务数据等敏感信息。
    - 泄露的信息可能被用于后续漏洞匹配、凭据攻击、权限提升或横向移动。
  remediation: |
    - 关闭不必要的调试、示例、备份和信息展示接口，避免向未授权用户返回敏感内容。
    - 对敏感文件和接口增加访问控制，并从 Web 根目录移除备份、日志和配置文件。
    - 排查已泄露的凭据、令牌和配置，必要时执行轮换并检查访问日志。
  reference:
    - https://www.pwnwiki.org/index.php?title=%E4%B8%AD%E6%85%B6%E7%B4%8D%E5%8D%9A%E6%95%99%E8%82%B2%E9%9B%B2%E5%B9%B3%E8%87%BA%E6%95%8F%E6%84%9F%E4%BF%A1%E6%81%AF%E6%B3%84%E9%9C%B2%26%E6%9C%AA%E6%8E%88%E6%AC%8A%E8%A8%AA%E5%95%8F%E6%BC%8F%E6%B4%9E
  classification:
    cwe-id: CWE-284
  metadata:
    verified: true
    max-request: 1
    shodan-query: http.favicon.hash:-1474228802
    fofa-query: icon_hash="-1474228802"
  tags: exposure,zqnb,education,cloud

http:
  - method: GET
    path:
      - "{{BaseURL}}/api/TeacherQuery/SearchTeacherInSiteWithPagerRecords"

    matchers-condition: and
    matchers:
      - type: word
        part: body
        words:
          - 'LoginName'
          - 'UserAvatar'
        condition: and

      - type: word
        part: content_type
        words:
          - 'application/json'

      - type: status
        status:
          - 200
