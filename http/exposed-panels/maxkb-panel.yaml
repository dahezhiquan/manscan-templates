id: maxkb-panel

info:
  name: MaxKB 面板 - 检测（暴露面识别）
  author: rxerium
  severity: info
  description: |-
    检测到 MaxKB，一款基于 RAG 的开源知识库与 LLM 聊天机器人平台。
  reference:
    - https://github.com/1Panel-dev/MaxKB
  metadata:
    verified: true
    max-request: 1
    vendor: 1panel
    product: maxkb
    shodan-query: http.title:"MaxKB"
  tags: panel,maxkb,ai,llm,rag,detect,discovery

http:
  - method: GET
    path:
      - "{{BaseURL}}"

    host-redirects: true
    matchers-condition: and
    matchers:
      - type: word
        part: body
        words:
          - "<title>MaxKB</title>"

      - type: status
        status:
          - 200
