id: firewall-disabled

info:
  name: macOS 应用防火墙已禁用（本地基线扫描）
  author: geeknik
  severity: medium
  description: |
    macOS 应用防火墙关闭后，系统对入站连接和应用监听行为的限制会减少，未知或不必要服务更容易被网络侧访问。模板执行 `socketfilterfw --getglobalstate`，匹配 `Firewall is disabled. (State = 0)` 时表示防火墙未启用。
  impact: |
    - 同网段攻击者可能直接探测或连接本机开放服务。
    - 终端离开可信网络后，缺少主机侧入站访问控制会扩大暴露面。
  remediation: |
    - 启用 macOS 应用防火墙，并按业务需要维护允许的入站应用。
    - 对高风险终端启用隐身模式和集中策略，定期审计本机监听服务。
  tags: macos,audit,local,security

self-contained: true

code:
  - engine:
      - sh
      - bash
    source: |
      /usr/libexec/ApplicationFirewall/socketfilterfw --getglobalstate
    matchers:
      - type: word
        words:
          - "Firewall is disabled. (State = 0)"
