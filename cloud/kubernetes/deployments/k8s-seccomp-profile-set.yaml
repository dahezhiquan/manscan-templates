id: k8s-seccomp-profile-set

info:
  name: Set appropriate seccomp profile（云安全）
  author: princechaddha
  severity: medium
  description: seccomp 可限制容器可调用的 Linux 系统调用，降低内核攻击面。本模板枚举 Deployment 容器安全上下文，命中未使用 RuntimeDefault 或 DockerDefault seccompProfile 的容器。
  impact: |
    - 容器可访问更宽的系统调用集合，增加内核漏洞利用和逃逸风险。
    - 缺少统一 seccomp 基线会导致不同工作负载隔离强度不一致。
  remediation: |
    - 为 Pod 或容器设置 seccompProfile.type 为 RuntimeDefault，必要时使用经过验证的 Localhost 配置。
    - 通过 Pod Security Admission 或策略引擎强制默认 seccomp 配置。
  reference:
    - https://kubernetes.io/docs/tutorials/clusters/seccomp/
  metadata:
    vendor: kubernetes
    product: kubernetes
  tags: cloud,devops,kubernetes,devsecops,containers,k8s-cluster-security
flow: |
  code(1);
  for (let deployment of template.items) {
    set("deployment", deployment)
    javascript(1);
  }

self-contained: true
code:
  - engine:
      - sh
      - bash
    source: kubectl get deployments --all-namespaces --output=json
    extractors:
      - type: json
        name: items
        internal: true
        json:
          - '.items[]'

javascript:
  - code: |
        deployment = JSON.parse(template.deployment);
        deployment.spec.template.spec.containers.forEach(container => {
          if (container.securityContext && container.securityContext.seccompProfile &&
              (container.securityContext.seccompProfile.type === 'RuntimeDefault' || container.securityContext.seccompProfile.type === 'DockerDefault')) {
            // No action needed, configured properly
          } else {
            let result = (`Deployment '${deployment.metadata.name}' in namespace '${deployment.metadata.namespace}' does not have an appropriate seccomp profile set.`);
            Export(result);
          }
        });

    extractors:
      - type: dsl
        dsl:
          - response
