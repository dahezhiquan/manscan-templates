id: overseerr-panel

info:
  name: Overseerr 面板识别（指纹识别）
  author: rxerium
  severity: info
  description: |
    该模板通过识别 Overseerr 面板、控制台或管理界面的页面特征，判断目标是否暴露了对应服务入口。若命中，说明该后台或运维界面对外可访问，可用于资产识别与暴露面排查。
  reference:
    - https://overseerr.dev/
    - https://github.com/sct/overseerr
  metadata:
    verified: true
    max-request: 1
    fofa-query: Overseerr account
  tags: panel,overseerr,detect,discovery

http:
  - method: GET
    path:
      - "{{BaseURL}}/login"

    matchers-condition: and
    matchers:
      - type: word
        part: body
        words:
          - "Sign In - Overseerr"

      - type: status
        status:
          - 200
