id: expressionengine-detect

info:
  name: ExpressionEngine 指纹识别（指纹识别）
  author: Chirag Mistry
  severity: info
  description: >-
    ExpressionEngine 是商业内容管理系统，用于构建内容站点、会员门户和定制化 Web 应用。该模板通过请求目标服务并检查预设路径或首页响应、页面正文关键字、正则特征、状态码等指纹特征，判断目标是否使用或暴露了
    ExpressionEngine 相关组件；命中结果仅表示指纹特征匹配，可用于资产盘点、技术栈识别和后续安全评估，不代表已确认存在可利用漏洞。
  metadata:
    max-request: 9
  tags: expressionengine,detect,tech
http:
  - method: GET
    path:
      - "{{BaseURL}}"
      - "{{BaseURL}}/robots.txt"
      - "{{BaseURL}}/sitemap.xml"
      - "{{BaseURL}}/favicon.ico"
      - "{{BaseURL}}/system/"
      - "{{BaseURL}}/themes/"
      - "{{BaseURL}}/index.php"
      - "{{BaseURL}}/admin.php"
      - "{{BaseURL}}/cp/"

    stop-at-first-match: true
    matchers-condition: and
    matchers:
      - type: word
        part: response
        words:
          - "ExpressionEngine"
          - "Powered by ExpressionEngine"
          - "expressionengine.com"
          - "X-Powered-By-ExpressionEngine"
        condition: or
        case-insensitive: true

      - type: status
        status:
          - 200

    extractors:
      - type: regex
        part: body
        name: version
        regex:
          - 'ExpressionEngine ([0-9.]+)'
          - 'Powered by ExpressionEngine ([0-9.]+)'

      - type: regex
        part: body
        name: expressionengine_id
        regex:
          - 'expressionengine-site-id=([a-z0-9]+)'
          - 'expressionengine\.com/([^/]+)'
