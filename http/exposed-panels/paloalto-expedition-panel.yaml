id: paloalto-expedition-panel

info:
  name: Palo Alto Expedition Project 登录识别（暴露面识别）
  author: johnk3r
  severity: info
  description: |
    该模板通过识别 Palo Alto Expedition Project 登录入口的页面标题、特征文本或重定向行为，判断目标是否暴露了对应的认证界面。若命中，说明该登录面板对外可访问，可用于暴露面梳理与后续安全评估。
  metadata:
    verified: true
    max-request: 1
    vendor: paloaltonetworks
    product: expedition
    shodan-query: http.favicon.hash:1499876150
  tags: panel,expedition,palo-alto,login,detect,discovery

http:
  - method: GET
    path:
      - "{{BaseURL}}"

    host-redirects: true
    max-redirects: 2

    matchers-condition: and
    matchers:
      - type: word
        part: body
        words:
          - "<title>Expedition Project</title>"

      - type: status
        status:
          - 200
