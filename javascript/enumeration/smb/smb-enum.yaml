id: smb-enum

info:
  name: SMB 信息枚举（服务漏洞）
  author: pussycat0x
  severity: medium
  description: |
    SMB 服务可能在协商或会话建立阶段返回主机名、域名、操作系统版本、DNS 名称和森林名称等基础信息。该模板调用 SMBv2 元数据枚举能力，并从 JSON 响应中提取多个主机与域字段。
  impact: |
    - SMB 基础枚举会暴露操作系统、主机名、域名和安全模式等内部信息。
    - 这些信息可辅助攻击者识别关键主机、匹配系统漏洞并规划域内攻击路径。
  remediation: |
    - 禁止匿名 SMB 枚举，限制共享和主机信息仅对授权用户可见。
    - 将 SMB 服务限制在可信网段，启用日志审计并禁用旧协议。
  reference:
    - https://nmap.org/nsedoc/scripts/smb-security-mode.html
  metadata:
    verified: true
    max-request: 1
    shodan-query: port:445
  tags: js,network,smb,enum,discovery

javascript:
  - pre-condition: |
      isPortOpen(Host,Port);
    code: |
      var m = require("nuclei/smb");
      var c = m.SMBClient();
      var response = c.ListSMBv2Metadata(Host, Port);
      Export(response);
    args:
      Host: "{{Host}}"
      Port: "445"
    matchers:
      - type: dsl
        dsl:
          - "len(OSVersion) != 0"
          - "len(NetBIOSComputerName) != 0"
          - "len(NetBIOSDomainName) != 0"
          - "len(DNSComputerName) != 0"
          - "len(DNSDomainName) != 0"
          - "len(ForestName) != 0"

    extractors:
      - type: json
        internal: true
        name: OSVersion
        json:
          - '.OSVersion'

      - type: json
        internal: true
        name: NetBIOSComputerName
        json:
          - '.NetBIOSComputerName'

      - type: json
        internal: true
        name: NetBIOSDomainName
        json:
          - '.NetBIOSDomainName'

      - type: json
        internal: true
        name: DNSComputerName
        json:
          - '.DNSComputerName'

      - type: json
        internal: true
        name: DNSDomainName
        json:
          - '.DNSDomainName'

      - type: json
        internal: true
        name: ForestName
        json:
          - '.ForestName'

      - type: json
        json:
          - '"OSVersion: "+ .OSVersion '
          - '"NetBIOSComputerName: "+ .NetBIOSComputerName '
          - '"NetBIOSDomainName: "+ .NetBIOSDomainName '
          - '"DNSComputerNamen: "+ .DNSComputerName '
          - '"DNSComputerName: "+ .DNSComputerName '
          - '"ForestName: "+ .ForestName'
