id: oracle-webcenter-sites

info:
  name: Oracle WebCenter Sites 指纹识别（指纹识别）
  author: leovalcante
  severity: info
  description: >-
    Oracle WebCenter Sites 是企业 Web 内容管理平台，用于营销站点、门户内容和数字体验管理。该模板通过请求目标服务并检查预设路径或首页响应、页面正文关键字、状态码等指纹特征，判断目标是否使用或暴露了
    Oracle WebCenter Sites 相关组件；命中结果仅表示指纹特征匹配，可用于资产盘点、技术栈识别和后续安全评估，不代表已确认存在可利用漏洞。
  classification:
    cpe: cpe:2.3:a:oracle:webcenter_sites:*:*:*:*:*:*:*:*
  metadata:
    verified: true
    max-request: 1
    vendor: oracle
    product: webcenter_sites
    shodan-query: http.html:"WebCenter"
  tags: tech,oracle,webcenter,discovery
http:
  - method: GET
    path:
      - '{{BaseURL}}/welcome_webcenter.html'

    matchers-condition: and
    matchers:
      - type: word
        words:
          - 'FOR ORACLE'
          - 'WebCenter Framework'
        condition: and

      - type: status
        status:
          - 200
