id: rds-backup-enable
info:
  name: RDS 自动备份保留期为 0（云安全）
  author: princechaddha
  severity: high
  description: RDS BackupRetentionPeriod 为 0 表示实例未保留自动备份，无法使用按时间点恢复能力。该模板枚举 RDS 实例，并在备份保留期返回 0 时报告风险。
  impact: |
    - 数据库发生误操作、数据损坏或安全事件后，恢复选项会明显受限。
    - 缺少自动备份会增加业务中断时间，并可能造成不可逆的数据丢失。
  remediation: |
    - 为关键 RDS 实例配置大于 0 的自动备份保留期，并结合业务 RPO/RTO 确定天数。
    - 定期执行恢复验证，确认备份链路、权限和加密设置均可用。
  reference:
    - https://docs.aws.amazon.com/AmazonRDS/latest/UserGuide/USER_WorkingWithAutomatedBackups.html
  metadata:
    max-request: 2
    vendor: amazon
    product: rds
  tags: cloud,devops,aws,amazon,rds,aws-cloud-config
variables:
  region: "ap-northeast-1"

flow: |
  code(1)
  for(let DBInstances of iterate(template.instances)){
    set("db", DBInstances)
    code(2)
  }

self-contained: true
code:
  - engine:
      - sh
      - bash
    source: |
      aws rds describe-db-instances --region $region --output json --query 'DBInstances[*].DBInstanceIdentifier'

    extractors:
      - type: json
        name: instances
        internal: true
        json:
          - '.[]'

  - engine:
      - sh
      - bash
    source: |
         aws rds describe-db-instances --region $region --db-instance-identifier $db --query 'DBInstances[*].BackupRetentionPeriod'

    matchers:
      - type: word
        words:
          - '0'

    extractors:
      - type: dsl
        dsl:
          - '"Automated backups are not enabled for " + db + " RDS database instance"'
