id: auto-usb-install

info:
  name: FortiGate Auto USB 安装已启用（本地文件安全扫描）
  author: pussycat0x
  severity: info
  description: |
    该模板检测 FortiGate Auto USB 安装功能。攻击者若具备物理访问权限，可能通过 USB 加载配置或固件并影响设备安全。
  reference:
    - https://docs.fortinet.com/document/fortigate/6.2.0/hardening-your-fortigate/582009/system-administrator-best-practices
  classification:
    cvss-metrics: CVSS:3.1/AV:N/AC:L/PR:N/UI:N/S:U/C:N/I:N/A:N
    cvss-score: 0
    cwe-id: CWE-200
  tags: audit,config,file,firewall,fortigate

file:
  - extensions:
      - conf

    matchers-condition: and
    matchers:
      - type: word
        words:
          - "set auto-install-config disable"
          - "set auto-install-image disable"
        negative: true

      - type: word
        words:
          - "config system"
          - "config router"
          - "config firewall"
        condition: or
