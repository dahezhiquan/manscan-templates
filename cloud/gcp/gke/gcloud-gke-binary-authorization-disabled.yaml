id: gcloud-gke-binary-authorization-disabled

info:
  name: GKE Clusters 未启用Binary Authorization已启用（云安全）
  author: princechaddha
  severity: medium
  description: Binary Authorization 可在 GKE 部署前验证镜像是否符合签名和准入策略，未启用会削弱供应链准入控制。本模板枚举集群并检查 binaryAuthorization.evaluationMode，值为 DISABLED 或为空时报告未启用 Binary Authorization。
  impact: |
    - 未签名、未经验证或来自非可信构建流程的镜像更容易进入集群运行。
    - 镜像供应链被污染时，缺少准入阻断会增加恶意容器落地风险。
  remediation: |
    - 为 GKE 集群启用 Binary Authorization，并配置 attestor、策略和例外审批流程。
    - 将镜像签名、漏洞扫描和部署准入纳入 CI/CD 流水线。
  reference:
    - https://cloud.google.com/binary-authorization/docs/overview
    - https://www.trendmicro.com/cloudoneconformity/knowledge-base/gcp/GKE/enable-binary-authorization.html
  metadata:
    vendor: google
    product: google-kubernetes-engine
  tags: cloud,devops,gcp,gcloud,gke,kubernetes,security,container,authorization,gcp-cloud-config

flow: |
  code(1)
  for(let projectId of iterate(template.projectIds)){
    set("projectId", projectId)
    code(2)
    for(let cluster of iterate(template.clusters)){
      cluster = JSON.parse(cluster)
      set("clusterName", cluster.name)
      set("location", cluster.location)
      code(3)
    }
  }

self-contained: true

code:
  - engine:
      - sh
      - bash
    source: |
      gcloud projects list --format="json(projectId)"

    extractors:
      - type: json
        name: projectIds
        internal: true
        json:
          - '.[].projectId'

  - engine:
      - sh
      - bash
    source: |
      gcloud container clusters list --project $projectId --format="json(name,location)"

    extractors:
      - type: json
        name: clusters
        internal: true
        json:
          - '.[]'

  - engine:
      - sh
      - bash
    source: |
      gcloud container clusters describe $clusterName --location $location --project $projectId --format="json(binaryAuthorization.evaluationMode)"

    matchers:
      - type: word
        words:
          - '"evaluationMode": "DISABLED"'
          - "null"
        condition: or

    extractors:
      - type: dsl
        dsl:
          - '"GKE cluster " + clusterName + " in " + location + " of project " + projectId + " does not have Binary Authorization enabled"'
