id: trading212-phish

info:
  name: Trading 212 仿冒钓鱼网站（钓鱼网站识别）
  author: rxerium
  severity: info
  description: |
    检测到疑似仿冒 Trading 212 的钓鱼网站。模板在目标页面返回 200、页面内容命中 Trading 212 的金融或支付页面特征，且当前主机不属于 Trading 212.com 官方域名时触发，用于识别借用 Trading 212 品牌页面诱导用户信任的仿冒站点。
  reference:
    - https://trading212.com
  metadata:
    max-request: 1
  tags: phishing,trading212,osint,discovery
http:
  - method: GET
    path:
      - "{{BaseURL}}"

    host-redirects: true
    max-redirects: 2

    matchers-condition: and
    matchers:
      - type: word
        words:
          - 'Commission-free investing for everyone | Trading 212'

      - type: status
        status:
          - 200

      - type: dsl
        dsl:
          - '!contains(host,"trading212.com")'
