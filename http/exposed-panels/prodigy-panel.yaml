id: prodigy-panel

info:
  name: Prodigy 标注工具 - 未授权暴露（暴露面识别）
  author: rxerium
  severity: medium
  description: |-
    检测到 Explosion AI 开发的商业可脚本化标注工具 Prodigy，该工具用于为机器学习及 NLP 模型标注训练数据。其本地 Web 服务器（默认端口 8080，基于 uvicorn/FastAPI 构建）默认不内置任何身份认证或用户账户，设计初衷为仅在 localhost 或可信网络内运行。检测发现其标注 UI 可被未授权访客直接访问。
  reference:
    - https://prodi.gy
    - https://prodi.gy/docs
  metadata:
    verified: true
    max-request: 1
    vendor: explosion
    product: prodigy
    shodan-query: 'http.title:"Prodigy" http.favicon.hash:-953245195'
  tags: panel,prodigy,ai,data-annotation,misconfig,exposure,detect,discovery

http:
  - method: GET
    path:
      - "{{BaseURL}}/"

    host-redirects: true
    max-redirects: 2

    matchers-condition: and
    matchers:
      - type: word
        part: body
        words:
          - "<title>Prodigy</title>"
          - 'id="root"'
          - 'src="bundle.js"'
        condition: and

      - type: word
        part: header
        words:
          - "uvicorn"

      - type: status
        status:
          - 200
