id: azure-appservice-ftps-only-not-enabled
info:
  name: Azure App Service 未强制仅使用 FTPS（云安全）
  author: princechaddha
  severity: medium
  description: Azure App Service 未强制 FTPS-only 时，FTP 部署端点可能同时接受明文 FTP 和加密 FTPS。该模板枚举 Web App，查询 ftpsState，并在返回 AllAllowed 时报告未强制仅使用 FTPS。
  impact: |
    - 明文 FTP 可能暴露发布用户名、密码、文件内容和应用配置，导致应用被未授权读取或篡改。
    - 发布通道被利用后，攻击者可绕过应用层防护直接写入恶意代码或持久化文件。
  remediation: |
    - 将 App Service 的 ftpsState 设置为 FTPSOnly，禁用普通 FTP 访问。
    - 轮换发布凭据并限制其权限，确认 CI/CD 工具、运维客户端和防火墙规则均使用加密部署通道。
  reference:
    - https://docs.microsoft.com/en-us/azure/app-service/configure-ftp
  metadata:
    vendor: microsoft
    product: azure-app-service
  tags: cloud,devops,azure,microsoft,appservice,azure-cloud-config

flow: |
  code(1);
  for (let WebAppId of iterate(template.webAppIdList)) {
    set("id", WebAppId);
    code(2);
  }

self-contained: true
code:
  - engine:
      - sh
      - bash
    source: |
      az webapp list --output json --query '[*].id'

    extractors:
      - type: json
        name: webAppIdList
        internal: true
        json:
          - '.[]'

  - engine:
      - sh
      - bash
    source: |
      az webapp config show --ids $id --query 'ftpsState' --output json

    matchers:
      - type: word
        words:
          - "AllAllowed"

    extractors:
      - type: dsl
        dsl:
          - 'id + " does not enforce FTPS-only access"'
