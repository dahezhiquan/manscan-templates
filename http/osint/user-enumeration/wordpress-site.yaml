id: wordpress-site

info:
  name: WordPress 站点 用户名信息枚举（OSINT）
  author: gl0bal01
  severity: info
  description: |
    对 WordPress 站点 的用户名进行 OSINT 枚举检查。模板请求公开路径 https://用户名.wordpress.com，当响应状态为 200 且页面或响应内容命中 “https://用户名.wordpress.com”、“siteID” 等用户资料页特征时，判定目标用户名可能存在。
  classification:
    cvss-metrics: CVSS:3.1/AV:N/AC:L/PR:N/UI:N/S:U/C:N/I:N/A:N
    cvss-score: 0
    cwe-id: CWE-200
  metadata:
    verified: true
    max-request: 1
  tags: osint,osint-blog,wordpress,discovery

self-contained: true

http:
  - method: GET
    path:
      - "https://{{user}}.wordpress.com"

    matchers-condition: and
    matchers:
      - type: word
        part: body
        words:
          - "https://{{user}}.wordpress.com"
          - "siteID"
          - "user_id"
        condition: and

      - type: status
        status:
          - 200
