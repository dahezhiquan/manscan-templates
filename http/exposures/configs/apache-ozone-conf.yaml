id: apache-ozone-conf

info:
  name: Apache Ozone 识别（指纹识别）
  author: icarot
  severity: info
  description: |
    Apache Ozone 是 Hadoop 生态中的对象存储系统，用于大规模数据湖、对象桶和分布式存储场景。该模板用于识别目标是否部署了相关系统或接口，检测时请求 `/conf`，并依据 HTTP 状态码、页面标题、响应正文关键字、接口返回字段或其他指纹特征进行判断。该模板仅用于资产识别和暴露面梳理，不代表目标一定存在可利用漏洞。
  classification:
    cpe: cpe:2.3:a:apache:ozone:-:*:*:*:*:*:*:*
  metadata:
    max-request: 1
    vendor: apache
    product: ozone
    shodan-query: title:"Apache Ozone"
  tags: tech,ozone,apache,detect,vuln

http:
  - method: GET
    path:
      - "{{BaseURL}}/conf"

    matchers-condition: and
    matchers:
      - type: word
        part: body
        words:
          - '<source>ozone-default.xml</source>'
          - 'ozone'
        condition: and

      - type: word
        part: content_type
        words:
          - 'text/xml'

      - type: status
        status:
          - 200
