id: portkey-ai-detect

info:
  name: Portkey AI 指纹识别（指纹识别）
  author: rxerium
  severity: info
  description: >-
    Portkey AI 是大模型网关和可观测性平台，用于统一代理、监控和治理 LLM API 调用。该模板通过请求目标服务并检查预设路径或首页响应、页面正文关键字、状态码等指纹特征，判断目标是否使用或暴露了
    Portkey AI 相关组件；命中结果仅表示指纹特征匹配，可用于资产盘点、技术栈识别和后续安全评估，不代表已确认存在可利用漏洞。
  reference:
  - https://portkey.ai/
  - https://github.com/Portkey-AI/gateway
  metadata:
    verified: true
    max-request: 1
    shodan-query: html:"Portkey AI"
  tags: tech,portkey,ai,llm,gateway
http:
  - method: GET
    path:
      - "{{BaseURL}}/login"

    host-redirects: true
    max-redirects: 2

    matchers-condition: and
    matchers:
      - type: word
        words:
          - "<title>Portkey AI"
        part: body

      - type: status
        status:
          - 200
