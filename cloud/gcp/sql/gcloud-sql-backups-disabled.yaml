id: gcloud-sql-backups-disabled

info:
  name: Automated Backups 未Enabled 的Cloud SQL Instances（云安全）
  author: princechaddha
  severity: medium
  description: Cloud SQL 自动备份是数据库误删、损坏或安全事件后的基础恢复手段，未启用会显著降低恢复能力。本模板检查 settings.backupConfiguration.enabled，值为 False 时报告实例未启用自动备份。
  impact: |
    - 数据被误删、勒索加密、批量覆盖或实例故障后，可能无法恢复到可用状态。
    - 缺少自动备份会拉长恢复时间，影响业务连续性和合规留存要求。
  remediation: |
    - 为生产和关键 Cloud SQL 实例启用 automated backups，并设置符合 RPO/RTO 的备份窗口和保留策略。
    - 定期演练备份恢复，确认备份可用性、权限和恢复流程满足业务要求。
  reference:
    - https://cloud.google.com/sql/docs/mysql/backup-recovery/backups
  metadata:
    vendor: google
    product: cloud-sql
  tags: cloud,devops,gcp,gcloud,google-cloud-sql,gcp-cloud-config

flow: |
  code(1)
  for(let projectId of iterate(template.projectIds)){
    set("projectId", projectId)
    code(2)
    for(let sqlInstance of iterate(template.sqlInstances)){
      set("sqlInstance", sqlInstance)
      code(3)
    }
  }

self-contained: true

code:
  - engine:
      - sh
      - bash
    source: |
      gcloud projects list --format="json(projectId)"

    extractors:
      - type: json
        name: projectIds
        internal: true
        json:
          - '.[].projectId'

  - engine:
      - sh
      - bash
    source: |
      gcloud sql instances list --project $projectId --format="json(name)"

    extractors:
      - type: json
        name: sqlInstances
        internal: true
        json:
          - '.[].name'

  - engine:
      - sh
      - bash
    source: |
      gcloud sql instances describe $sqlInstance --format="value(settings.backupConfiguration.enabled)"

    matchers:
      - type: word
        words:
          - 'False'

    extractors:
      - type: dsl
        dsl:
          - '"Automated backups are not enabled for SQL Instance: " + sqlInstance + " in project: " + projectId'
