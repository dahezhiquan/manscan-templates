id: endpoint-protector-panel

info:
  name: Endpoint Protector 登录面板识别（指纹识别）
  author: pussycat0x
  severity: info
  description: |-
    检测到目标站点存在 Endpoint Protector 相关响应特征。Endpoint Protector 是安全网关、防火墙、终端安全或安全管理平台，用于维护访问控制、威胁防护、策略配置、告警和设备状态。模板请求 `/`，并通过页面标题或正文关键字、状态码确认该系统指纹，用于资产识别、系统盘点和暴露面梳理。
  classification:
    cpe: cpe:2.3:a:cososys:endpoint_protector:*:*:*:*:*:*:*:*
  metadata:
    verified: true
    max-request: 1
    vendor: cososys
    product: endpoint_protector
    shodan-query: http.title:"Endpoint Protector"
  tags: panel,endpoint,login,detect,endpoint-protector,discovery
http:
  - method: GET
    path:
      - "{{BaseURL}}"

    matchers-condition: and
    matchers:
      - type: word
        words:
          - "Endpoint Protector - Reporting and Administration Tool"

      - type: status
        status:
          - 200
