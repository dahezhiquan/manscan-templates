id: iam-key-rotation-90days
info:
  name: IAM 访问密钥超过 90 天未轮换（云安全）
  author: princechaddha
  severity: high
  description: 长期有效的 IAM access key 会增加泄露后被持续滥用的窗口，尤其是嵌入脚本、CI 或第三方系统的静态凭据。该模板枚举用户 access key，并筛选 CreateDate 早于 90 天的密钥。
  impact: |
    - 泄露的静态密钥可能在较长时间内保持有效，用于调用 AWS API、读取数据或创建持久化访问。
    - 密钥生命周期不可控会降低凭据审计和异常响应效率。
  remediation: |
    - 轮换超过组织期限的 access key，并删除未使用或无明确归属的密钥。
    - 优先使用 IAM role、临时凭据或工作负载身份联合，减少长期静态密钥使用。
  reference:
    - https://docs.aws.amazon.com/cli/latest/reference/iam/list-access-keys.html
  metadata:
    max-request: 2
    vendor: amazon
    product: iam
  tags: cloud,devops,aws,amazon,iam,aws-cloud-config
flow: |
  code(1)
  for(let UserName of iterate(template.users)){
    set("user", UserName)
    code(2)
  }

self-contained: true
code:
  - engine:
      - sh
      - bash
    source: |
      aws iam list-users --query 'Users[*].UserName'

    extractors:
      - type: json # type of the extractor
        internal: true
        name: users
        json:
          - '.[]'

  - engine:
      - sh
      - bash
    source: |
         aws iam list-access-keys --user-name $user | jq -r '.AccessKeyMetadata[] | select((.CreateDate[:-6] | strptime("%Y-%m-%dT%H:%M:%S") | mktime) < (now - (90 * 86400))) | .AccessKeyId'

    extractors:
      - type: regex # type of the extractor
        name: accesskey
        internal: true
        regex:
          - '^AK.*'

      - type: dsl
        dsl:
          - '"The IAM Key " + accesskey +" is older than 90 days"'
