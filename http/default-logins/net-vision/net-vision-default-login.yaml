id: net-vision-default-login

info:
  name: Net Vision UPS 监控器默认登录（弱口令）
  author: Th3l0newolf
  severity: high
  description: |
    该模板用于检测 Net Vision UPS 监控器 是否仍可使用默认凭据或弱口令登录。模板主要向 `/PageAEventlog.asp` 等认证入口发送请求，使用内置默认凭据组合进行认证尝试，并根据状态码、认证 Cookie、跳转位置或登录后的页面关键字判断登录是否成功；命中说明目标未及时修改出厂、示例或初始化账号口令。
  impact: |
    - 攻击者可接管 Net Vision UPS 监控器 的 Web 管理界面，查看设备状态、网络配置、运行日志或敏感业务参数。
    - 被接管的网络、工控、打印、视频、存储或远程管理设备可能被用于中断业务、改变访问策略、窃取流量或作为内网横向移动入口。
  remediation: |
    - 立即修改所有默认账号口令，禁用不再使用的出厂账号，并为管理账户设置高强度唯一密码。
    - 将设备管理入口限制在 VPN、堡垒机或可信管理网段内，避免直接暴露到公网。
    - 升级设备固件或管理组件，审计近期登录记录、配置变更和异常会话。
  classification:
    cvss-metrics: CVSS:3.1/AV:N/AC:L/PR:N/UI:N/S:U/C:H/I:H/A:H
    cwe-id: CWE-798
  metadata:
    max-request: 2
    verified: true
    shodan-query: title:"Net Vision UPS"
    product: net-vision
    vendor: socomec
  tags: socomec,net-vision,ups,default-login

flow: http(1) && http(2)

http:
  - method: GET
    path:
      - "{{BaseURL}}"

    matchers:
      - type: dsl
        dsl:
          - 'contains(body, "Net Vision UPS Monitor")'
          - 'contains_any(body, ".input_username", "Login</span>")'
        condition: and
        internal: true

  - method: GET
    path:
      - "{{BaseURL}}/PageAEventlog.asp"

    headers:
      Authorization: "Basic YWRtaW46cHVibGlj"

    redirects: true
    max-redirects: 2

    matchers-condition: and
    matchers:
      - type: dsl
        dsl:
          - 'contains_all(body, "USHA Events Log", "Events Log", "Event Level")'
        condition: and

      - type: status
        status:
          - 200
