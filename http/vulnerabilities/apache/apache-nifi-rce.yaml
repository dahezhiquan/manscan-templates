id: apache-nifi-rce

info:
  name: Apache NiFi - 远程代码执行漏洞
  author: arliya
  severity: critical
  description: |
    该模板用于检测 Apache NiFi - 远程代码执行漏洞。该类漏洞通常允许攻击者通过可控参数、接口调用或危险功能在目标服务端执行命令或代码。模板主要向 `/nifi-api/process-groups/root` 等路径发送探测请求，并根据响应中的 `revision`、`canRead` 等特征确认漏洞是否存在。
  impact: |
    - 攻击者可在目标服务权限下执行系统命令或应用代码，读取、修改业务数据并部署持久化后门。
    - 若服务运行在高权限账户或可访问内网资源，漏洞可能进一步导致主机失陷和横向移动。
  remediation: |
    - 升级受影响产品到厂商修复版本，或应用官方补丁/安全配置基线。
    - 限制相关管理接口、调试接口或危险功能的访问来源，避免直接暴露到公网。
    - 排查异常进程、计划任务、WebShell、新增账号和外联记录，并轮换可能泄露的密钥与凭据。
  reference:
    - https://github.com/imjdl/Apache-NiFi-Api-RCE
    - https://labs.withsecure.com/tools/metasploit-modules-for-rce-in-apache-nifi-and-kong-api-gateway
    - https://packetstormsecurity.com/files/160260/apache_nifi_processor_rce.rb.txt
  classification:
    cpe: cpe:2.3:a:apache:nifi:*:*:*:*:*:*:*:*
  metadata:
    verified: true
    max-request: 1
    shodan-query: "title:\"NiFi\""
    product: nifi
    vendor: apache
  tags: packetstorm,apache,nifi,rce,vuln

http:
  - method: GET
    path:
      - "{{BaseURL}}/nifi-api/process-groups/root"

    matchers-condition: and
    matchers:
      - type: word
        part: body
        words:
          - "revision"
          - "canRead"
          - "permissions"
        condition: and

      - type: word
        part: header
        words:
          - "application/json"

      - type: status
        status:
          - 200

    extractors:
      - type: json
        json:
          - .id
