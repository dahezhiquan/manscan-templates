id: xampp-phpinfo-detect

info:
  name: XAMPP PHP info 页面暴露（暴露面识别）
  author: pussycat0x
  severity: low
  description: |
    检测到目标站点可直接访问 XAMPP PHP info 页面。XAMPP 是集成式 Web 开发环境，phpinfo 页面会展示 PHP、Apache 和系统运行配置。该模板请求 `/phpinfo.php`、`/dashboard/phpinfo.php`，并通过 HTTP 状态码、响应正文关键字、文件格式特征、正则匹配或响应头进行确认。配置文件公开后可能泄露部署细节、内部路径、依赖版本、环境变量、访问凭据或调试信息，增加被侦察和后续利用的风险。
  impact: |-
    - 调试、状态、历史或转储文件可能泄露环境变量、内存片段、命令历史、内部路径、组件版本和运行参数。
    - 攻击者可利用这些细节筛选已知漏洞、还原业务流程、定位敏感文件或制定更精确的后续攻击路径。
    - 部分历史或转储内容可能直接包含凭据、请求数据、SQL 语句或用户信息，扩大敏感数据泄露范围。
  remediation: |-
    - 关闭生产环境中的调试、状态、历史、转储、phpinfo、探针和未受保护的运行信息页面。
    - 将历史记录、崩溃转储和调试产物从 Web 可访问目录移除，并清理 CDN、对象存储和搜索引擎缓存。
    - 检查文件中是否包含凭据、请求数据、SQL 语句或用户信息，必要时执行密钥轮换和受影响账号处置。
    - 复核相关组件版本和配置，修复因暴露信息指向的弱配置或已知漏洞。
  metadata:
    verified: true
    shodan-query: http.title:"XAMPP"
  tags: config,exposure,phpinfo,vuln,xampp

http:
  - method: GET
    path:
      - "{{BaseURL}}{{paths}}"
    payloads:
      paths:
        - "/phpinfo.php"
        - "/dashboard/phpinfo.php"

    host-redirects: true
    max-redirects: 2

    stop-at-first-match: true
    matchers-condition: and
    matchers:
      - type: word
        part: body
        words:
          - "PHP Extension"
          - "PHP Version"
          - "xampp"
        condition: and

      - type: status
        status:
          - 200

    extractors:
      - type: regex
        part: body
        group: 1
        regex:
          - '>PHP Version <\/td><td class="v">([0-9.]+)'
