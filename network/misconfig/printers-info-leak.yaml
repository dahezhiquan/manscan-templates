id: printers-info-leak

info:
  name: 打印机 PJL 未授权信息泄露（服务漏洞）
  author: pussycat0x,matejsmycka
  severity: medium
  description: |
    Printer Job Language（PJL）常用于通过 9100 端口控制和查询网络打印机状态。若 JetDirect/raw printing 端口暴露且缺少访问控制，外部人员可能读取设备标识、配置或进一步发送打印控制命令。该模板发送 `@PJL INFO ID`，并通过 PJL 返回的设备 ID 确认信息泄露。
  impact: |
    - 攻击者可能识别打印机型号、固件和部署位置，并据此寻找特定设备漏洞或默认配置。
    - 在访问控制宽松的环境中，攻击者可能继续提交恶意打印任务、读取队列相关信息或干扰办公打印服务。
  remediation: |
    - 对打印设备实施网络分区，限制 9100/PJL 等端口仅允许打印服务器或受信任终端访问。
    - 关闭不需要的 raw printing、PJL 查询或远程管理功能，并为管理接口启用认证。
    - 更新打印机固件，清理默认配置并审计异常打印任务。
  reference:
    - https://book.hacktricks.wiki/en/network-services-pentesting/9100-pjl.html
    - https://en.wikipedia.org/wiki/Printer_Job_Language
  metadata:
    max-request: 1
    vendor: generic
    product: printer
    shodan-query: port:9100
  tags: network,iot,printer,misconfig,tcp,pjl,intrusive,vuln

tcp:
  - inputs:
      - data: "@PJL INFO ID\n"
    host:
      - "{{Hostname}}"
    port: 9100

    matchers:
      - type: binary
        binary:
          - "40504a4c20494e464f2049440d0a22"

    extractors:
      - type: regex
        group: 1
        regex:
          - '"([^"]+)"'
