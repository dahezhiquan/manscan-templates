id: wp-user-enum

info:
  name: WordPress REST API - 用户名枚举漏洞
  author: Manas_Harsh,daffainfo,geeknik,dr0pd34d
  severity: low
  description: WordPress REST API 曾向未授权访问者暴露公开文章作者的用户信息。该模板通过访问相关接口验证目标是否存在用户名枚举问题，从而识别可被用于后续爆破或社工的账户情报泄露面。
  impact: |
    - 攻击者可轻易枚举出有效用户名，显著降低口令爆破与撞库攻击门槛。
    - 结合收集到的账户信息，还可能进一步发起社工、钓鱼或定向攻击。
  remediation: |
    - 关闭或限制未授权用户枚举接口访问。
    - 可部署 Stop User Enumeration 等安全插件，阻止通过 REST API 枚举用户名。
  reference:
    - https://www.acunetix.com/vulnerabilities/web/wordpress-rest-api-user-enumeration/
    - https://wordpress.org/plugins/stop-user-enumeration/
    - https://www.afteractive.com/wordpress-user-enumeration-vulnerability/
  classification:
    cpe: cpe:2.3:a:wordpress:wordpress:*:*:*:*:*:*:*:*
  metadata:
    verified: true
    max-request: 2
    vendor: wordpress
    product: wordpress
    shodan-query:
      - http.component:"WordPress"
      - http.component:"wordpress"
      - cpe:"cpe:2.3:a:wordpress:wordpress"
  tags: cve2017,cve,wordpress,wp,edb,vuln

http:
  - method: GET
    path:
      - "{{BaseURL}}/wp-json/wp/v2/users/"
      - "{{BaseURL}}/?rest_route=/wp/v2/users/"

    stop-at-first-match: true

    matchers-condition: and
    matchers:
      - type: word
        part: body
        words:
          - '"id":'
          - '"name":'
          - '"slug":'
        condition: and

      - type: word
        part: header
        words:
          - "application/json"

      - type: status
        status:
          - 200

    extractors:
      - type: json
        name: "usernames"
        json:
          - '.[] | .slug'
          - '.[].name'
        part: body
