id: telegram-phish

info:
  name: Telegram 仿冒钓鱼网站（钓鱼网站识别）
  author: rxerium
  severity: info
  description: |
    检测到疑似仿冒 Telegram 的钓鱼网站。模板在目标页面返回 200、页面内容命中 Telegram 的官方服务页面特征，且当前主机不属于 telegram.org 官方域名时触发，用于识别借用 Telegram 品牌页面诱导用户信任的仿冒站点。
  reference:
    - https://telegram.org
  metadata:
    max-request: 1
  tags: phishing,telegram,osint,discovery
http:
  - method: GET
    path:
      - "{{BaseURL}}"

    host-redirects: true
    max-redirects: 2

    matchers-condition: and
    matchers:
      - type: word
        words:
          - 'Telegram is a cloud-based mobile and desktop messaging app with a focus on security and speed.'

      - type: status
        status:
          - 200

      - type: dsl
        dsl:
          - '!contains(host,"telegram.org")'
