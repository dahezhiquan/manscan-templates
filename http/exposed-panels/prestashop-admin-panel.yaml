id: prestashop-admin-panel

info:
  name: Prestashop Admin 登录面板暴露（暴露面识别）
  author: mastercho
  severity: low
  description: |-
    Prestashop Admin 是开源电商平台，用于商品、订单、客户和支付流程管理。该模板请求 `/{{paths}}/` 路径，并依据页面标题、正文关键字或品牌资源特征判断目标是否对外暴露了 Prestashop Admin 的登录面板，用于发现互联网可访问的后台、控制台或业务入口。
  impact: "- 暴露的 Prestashop Admin 登录面板会泄露目标正在使用的产品、部署路径、页面特征或组织业务入口，便于攻击者进行指纹确认和漏洞匹配。\n- 如果认证、访问控制或默认凭据策略薄弱，攻击者可能进一步尝试进入后台，影响后台配置、业务数据、用户账号或设备运行状态。\n- 对互联网开放的管理入口会增加暴力破解、凭据填充、已知漏洞利用和钓鱼仿冒的攻击面。"
  remediation: "- 将 Prestashop Admin 的登录面板限制在内网、VPN、零信任代理或专用管理网段访问，避免直接暴露在互联网。\n- 启用强密码、多因素认证、登录失败限制和审计告警，排查默认账号、弱口令及长期未使用账号。\n- 保持 Prestashop Admin 及其依赖组件更新到受支持版本，并通过反向代理、ACL 或防火墙限制敏感路径访问。"
  reference:
  - https://www.prestasoo.com/blog/prestashop-admin-login-url
  classification:
    cvss-metrics: CVSS:3.0/AV:N/AC:L/PR:N/UI:N/S:U/C:N/I:N/A:N
    cwe-id: CWE-200
    cpe: cpe:2.3:a:prestashop:prestashop:*:*:*:*:*:*:*:*
  metadata:
    verified: true
    vendor: prestashop
    product: prestashop
    shodan-query:
    - http.component:"Prestashop"
    - cpe:"cpe:2.3:a:prestashop:prestashop"
  tags: prestashop,panel,login,discovery

http:
  - method: GET
    path:
      - '{{BaseURL}}/{{paths}}/'

    payloads:
      paths:
        - 'backoffice'
        - 'back-office'
        - 'Backoffice'
        - 'back-office'
        - 'admin-dev'
        - 'backend'
        - 'admin_'
        - 'mikromanage'
        - 'manage'
        - 'manager'
        - 'adminshop'
        - 'administrator'
        - 'administracja'
        - 'adm'
        - 'webadmin'
        - 'admin-web'
        - 'kontrollpanel'
        - 'amministra'
        - 'adminas'
        - 'admin123'
        - 'admin0'
        - 'adminxx'
        - 'admin'
        - 'ps-admin'
        - 'admins'
        - 'p-office'
        - 'admin333'
        - 'admin4444'
        - 'admin66'
        - 'backadmin'
        - 'admin1'
        - 'BackofficeNEW'
        - '4dm1n'
        - 'administrazione'
        - 'accesadministrateur'
        - '_admin123'
        - 'iadmin'
        - 'panel'

    host-redirects: true
    max-redirects: 3
    stop-at-first-match: true

    extractors:
      - type: regex
        name: version
        part: body
        group: 1
        regex:
          - '<script type="text\/javascript" src="..\/js\/admin\/login.js\?v=([\d.]+)"><\/script>'

    matchers-condition: or
    matchers:
      - type: word
        part: body
        words:
          - 'PrestaShop' # For normal presta admin panel
          - 'class="show-forgot-password'
        condition: and

      - type: word
        part: body
        words:
          - 'themes/default/css/admin-theme.css' # For modified admin panels
          - 'class="show-forgot-password'
        condition: and
