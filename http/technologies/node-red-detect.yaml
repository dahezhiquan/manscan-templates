id: node-red-detect

info:
  name: Node-RED 控制台指纹识别（指纹识别）
  author: pikpikcu
  severity: info
  description: 用于识别目标暴露的 Node-RED 控制台，模板会结合页面标题、页面正文、状态码和特定路径或已知端点判断是否存在对应技术或默认页面特征。
  classification:
    cvss-metrics: CVSS:3.1/AV:N/AC:L/PR:N/UI:N/S:U/C:N/I:N/A:N
    cvss-score: 0
    cwe-id: CWE-200
  metadata:
    max-request: 1
  tags: tech,apache,node-red-dashboard,discovery

http:
  - method: GET
    path:
      - "{{BaseURL}}"

    matchers-condition: and
    matchers:
      - type: word
        part: body
        words:
          - "<title>Node-RED</title>"

      - type: status
        status:
          - 200
