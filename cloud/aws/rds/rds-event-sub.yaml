id: rds-event-sub
info:
  name: RDS 安全组事件订阅未启用（云安全）
  author: princechaddha
  severity: high
  description: RDS db-security-group 事件订阅可帮助发现数据库安全组相关变更；未启用时，网络访问控制变化缺少及时通知。该模板检查 SourceType 为 db-security-group 的事件订阅是否为空。
  impact: |
    - 数据库访问控制变化可能未被及时感知，增加错误开放或未授权访问窗口。
    - 安全组相关事件缺少审计通知，影响事后调查和变更追踪。
  remediation: |
    - 为 db-security-group SourceType 创建 RDS event subscription，并订阅配置变更等关键事件。
    - 将安全组变更通知接入集中告警和变更审计流程，及时复核异常开放规则。
  reference:
    - https://docs.aws.amazon.com/AmazonRDS/latest/UserGuide/USER_Events.html
  metadata:
    vendor: amazon
    product: rds
  tags: cloud,devops,aws,amazon,rds,aws-cloud-config
variables:
  region: "ap-northeast-1"

self-contained: true
code:
  - engine:
      - sh
      - bash
    source: |
      aws rds describe-event-subscriptions --region $region --query "EventSubscriptionsList[?SourceType == 'db-security-group'].CustSubscriptionId"

    matchers:
      - type: word
        words:
          - '[]'

    extractors:
      - type: dsl
        dsl:
          - '"There are no Amazon RDS event subscriptions created for database security groups available in " + region + " AWS region."'
