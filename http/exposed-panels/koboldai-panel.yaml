id: koboldai-panel

info:
  name: KoboldAI 面板识别（指纹识别）
  author: rxerium
  severity: info
  description: |-
    检测到目标站点存在 KoboldAI 相关响应特征。KoboldAI 是 AI、LLM 或机器学习相关平台，用于管理模型、数据集、工作区、推理服务、评估或调用追踪。模板请求 `/`，并通过页面标题或正文关键字、状态码确认该系统指纹，用于资产识别、系统盘点和暴露面梳理。
  reference:
    - https://github.com/LostRuins/koboldcpp
    - https://github.com/KoboldAI/KoboldAI-Client
  metadata:
    verified: true
    max-request: 1
    vendor: KoboldAI
    product: koboldai
    shodan-query: 'http.title:"KoboldAI Lite"'
  tags: panel,koboldai,llm,ai,detect,discovery
http:
  - method: GET
    path:
      - "{{BaseURL}}"

    host-redirects: true
    max-redirects: 2

    matchers-condition: and
    matchers:
      - type: word
        part: body
        words:
          - "<title>KoboldAI Lite</title>"

      - type: status
        status:
          - 200
