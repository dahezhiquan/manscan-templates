id: wingftp-panel

info:
  name: Wing FTP Server 登录面板暴露（暴露面识别）
  author: pdteam
  severity: low
  description: |-
    Wing FTP Server 是 FTP/SFTP 文件传输服务器管理界面，用于用户、域、权限和传输策略配置。该模板请求 `/login.html`，并依据页面标题、正文关键字或品牌资源特征判断目标是否对外暴露了 Wing FTP Server 的登录面板，用于发现互联网可访问的后台、控制台或业务入口。
  impact: "- 暴露的 Wing FTP Server 登录面板会泄露目标正在使用的产品、部署路径、页面特征或组织业务入口，便于攻击者进行指纹确认和漏洞匹配。\n- 如果认证、访问控制或默认凭据策略薄弱，攻击者可能进一步尝试进入后台，影响后台配置、业务数据、用户账号或设备运行状态。\n- 对互联网开放的管理入口会增加暴力破解、凭据填充、已知漏洞利用和钓鱼仿冒的攻击面。"
  remediation: "- 将 Wing FTP Server 的登录面板限制在内网、VPN、零信任代理或专用管理网段访问，避免直接暴露在互联网。\n- 启用强密码、多因素认证、登录失败限制和审计告警，排查默认账号、弱口令及长期未使用账号。\n- 保持 Wing FTP Server 及其依赖组件更新到受支持版本，并通过反向代理、ACL 或防火墙限制敏感路径访问。"
  reference:
  - https://www.wftpserver.com/
  metadata:
    product: wingftp
    vendor: wingftp
    shodan-query:
    - http.html_hash:2121146066
    - http.favicon.hash:963565804
    - title:"Wing FTP Server"
    - "Server: Wing FTP Server"
    fofa-query:
    - icon_hash="963565804"
    - title="Wing FTP Server"
    - "Server: Wing FTP Server"
    zoomeye-query:
    - app="Wing FTP Server"
    verified: true
  tags: panel,login,wingftp,discovery

http:
  - method: GET
    path:
      - "{{BaseURL}}/login.html"

    matchers:
      - type: word
        part: response
        words:
          - "Wing FTP Server"

    extractors:
      - type: regex
        part: body
        group: 1
        regex:
          - 'Wing FTP Server\s+v?([0-9]+\.[0-9]+\.[0-9]+)'
