id: gcloud-cdn-backend-bucket

info:
  name: 检查 Cloud CDN Backend Bucket Configuration（云安全）
  author: princechaddha
  severity: medium
  description: 以静态内容为主的 Cloud CDN 场景通常应使用 backend bucket 作为 Cloud Storage 源站；URL map 指向 backend service 可能表示 CDN 源站类型与基线不一致。本模板枚举 URL map，并在 defaultService 中出现 backendServices 时报告使用 backend service 作为 CDN 源站。
  impact: |
    - 源站类型不符合静态内容基线时，可能绕过针对 Cloud Storage 源站的访问控制、缓存和审计策略。
    - 配置偏差会增加排障和治理复杂度，尤其是在期望统一使用 backend bucket 的环境中。
  remediation: |
    - 根据业务形态确认 CDN 源站类型，静态资源场景优先改用 backend bucket 并绑定正确的 Cloud Storage bucket。
    - 如确需使用 backend service，记录例外理由并确保源站访问控制、TLS 和日志配置满足同等基线。
  reference:
    - https://cloud.google.com/cdn/docs/using-cdn
  metadata:
    vendor: google
    product: cloud-cdn
  tags: cloud,devops,gcp,gcloud,cloud-cdn,gcp-cloud-config

flow: |
  code(1)
  for(let projectId of iterate(template.projectIds)){
    set("projectId", projectId)
    code(2)
  }

self-contained: true

code:
  - engine:
      - sh
      - bash
    source: |
      gcloud projects list --format="json(projectId)"
    extractors:
      - type: json
        name: projectIds
        internal: true
        json:
          - '.[].projectId'

  - engine:
      - sh
      - bash
    source: |
      gcloud compute url-maps list --project $projectId --format="json(name,defaultService)"

    matchers:
      - type: word
        words:
          - 'backendServices'

    extractors:
      - type: dsl
        dsl:
          - '"Load Balancers in Project: " + projectId + " uses a backend service as CDN origin instead of a backend bucket."'
