id: openwrt-login

info:
  name: Opentwrt Login / Configuration Interface 面板识别（暴露面识别）
  author: For3stCo1d,TechbrunchFR
  severity: medium
  description: |-
    检测到目标站点暴露 Opentwrt Login / Configuration Interface 相关 Web 面板或登录入口。OpenWrt LuCI 是 OpenWrt 路由系统的 Web 管理界面，用于配置网络、无线、防火墙、软件包和设备服务。模板请求 `/`、`/cgi-bin/luci/` 路径，并通过页面标题或正文关键字确认入口可访问；该结果可作为威胁情报排查、攻击基础设施清理和暴露面收敛依据。
  impact: |-
    - 可帮助攻击者或防守方确认目标存在 Opentwrt Login / Configuration Interface 相关 C2、远控、窃密、钓鱼或恶意基础设施，暴露组织资产、演练环境或恶意运营节点。
    - 若该面板未限制来源或存在弱口令、默认凭据、已知漏洞，攻击者可能接管控制端、获取会话数据、篡改任务配置或扩大攻击链影响。
    - 对外暴露的恶意基础设施面板还可能导致溯源线索、受害数据或行动配置被第三方发现和滥用。
  remediation: |-
    - 核实 Opentwrt Login / Configuration Interface 面板是否属于授权资产、演练环境或应急分析环境；若为未知或恶意基础设施，应立即隔离主机并保全日志证据。
    - 对确需保留的控制台限制访问来源，仅允许 VPN、堡垒机或可信管理网段访问，并启用强认证、最小权限和完整审计。
    - 轮换相关凭据、令牌和证书，检查是否存在异常任务、回连会话或数据外传痕迹，并持续监控同类指纹再次暴露。
  reference:
    - https://openwrt.org
    - https://github.com/openwrt/luci
  classification:
    cpe: cpe:2.3:o:openwrt:openwrt:*:*:*:*:*:*:*:*
  metadata:
    max-request: 2
    vendor: openwrt
    product: openwrt
    shodan-query:
      - http.title:"OpenWrt - LuCI"
      - http.title:"openwrt - luci"
    fofa-query: title="openwrt - luci"
    google-query: intitle:"openwrt - luci"
  tags: openwrt,router,panel,discovery
http:
  - method: GET
    path:
      - "{{BaseURL}}"
      - "{{BaseURL}}/cgi-bin/luci/"

    stop-at-first-match: true
    host-redirects: true
    max-redirects: 2
    matchers:
      - type: word
        part: body
        words:
          - '<title>OpenWrt'
          - "Powered by LuCI"
        condition: or

    extractors:
      - type: regex
        part: body
        group: 1
        regex:
          - '(?i)OpenWrt  ([A-Z0-9.]+)'
