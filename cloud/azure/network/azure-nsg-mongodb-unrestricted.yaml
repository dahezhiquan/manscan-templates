id: azure-nsg-mongodb-unrestricted
info:
  name: Azure NSG 对互联网开放 MongoDB 端口（云安全）
  author: princechaddha
  severity: high
  description: MongoDB 常用 TCP 27017 至 27019 提供数据库和分片相关服务；将这些端口对互联网开放会把数据平面直接暴露给外部扫描和认证攻击。本模板查询入站允许的 TCP 27017、27018 或 27019 NSG 规则，并在来源地址为 *、internet 或 any 时报告。
  impact: |
    - 弱认证、匿名访问或数据库漏洞可能导致集合数据被读取、篡改、删除，甚至取得主机执行能力。
    - 数据库被破坏或资源耗尽会造成应用故障，并可能暴露连接凭据和业务敏感数据。
  remediation: |
    - 删除面向互联网的 MongoDB 端口规则，优先使用 Private Endpoint、专用子网或 VPN 访问数据库。
    - 启用强认证和传输加密，限制数据库账户权限，并仅允许应用所在网段访问必要端口。
  reference:
    - https://docs.microsoft.com/en-us/azure/virtual-network/network-security-groups-overview
  metadata:
    vendor: microsoft
    product: azure-network-security-group
  tags: cloud,devops,azure,microsoft,nsg,azure-cloud-config

flow: |
  code(1);
  for (let NsgData of iterate(template.nsgdata)) {
    NsgData = JSON.parse(NsgData)
    set("nsg", NsgData.name)
    set("resourcegroup", NsgData.resourceGroup)
    code(2)
  }

self-contained: true
code:
  - engine:
      - sh
      - bash
    source: |
      az network nsg list --query '[*].{name:name, resourceGroup:resourceGroup}' --output json

    extractors:
      - type: json
        name: nsgdata
        internal: true
        json:
          - '.[]'

  - engine:
      - sh
      - bash
    source: |
      az network nsg rule list --nsg-name $nsg --resource-group $resourcegroup --query "[?direction=='Inbound' && access=='Allow' && protocol=='TCP' && (destinationPortRange=='27017' || destinationPortRange=='27018' || destinationPortRange=='27019')]"

    matchers:
      - type: word
        words:
          - '"sourceAddressPrefix": "*"'
          - '"sourceAddressPrefix": "internet"'
          - '"sourceAddressPrefix": "any"'

    extractors:
      - type: dsl
        dsl:
          - 'nsg + " has unrestricted access on TCP ports 27017, 27018, and 27019"'
