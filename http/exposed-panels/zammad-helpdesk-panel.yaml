id: zammad-helpdesk-panel

info:
  name: Zammad Helpdesk 面板识别（指纹识别）
  author: righettod
  severity: info
  description: |-
    Zammad Helpdesk 是客户支持和工单系统，用于邮件、工单、客户和服务流程管理。该模板请求首页，并依据 DSL 条件识别目标是否部署了该系统或暴露了对应入口，适用于资产指纹确认；命中结果仅表示系统特征匹配，不代表已确认存在未授权访问或可利用漏洞。
  reference:
  - https://github.com/zammad/zammad
  - https://zammad.org/
  metadata:
    verified: true
    max-request: 1
    vendor: zammad
    product: zammad
    shodan-query: http.title:"Zammad Helpdesk"
    fofa-query: title="Zammad Helpdesk"
  tags: panel,zammad,detect,helpdesk,ticketing,discovery

http:
  - method: GET
    path:
      - "{{BaseURL}}"

    matchers:
      - type: dsl
        dsl:
          - 'status_code == 200'
          - 'contains_any(to_lower(body), "<title>zammad helpdesk</title>", "zammad_form_script")'
        condition: and
