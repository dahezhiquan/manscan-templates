id: supabase-studio-panel

info:
  name: Supabase Studio 面板识别（暴露面识别）
  author: ChrisJr404
  severity: info
  description: |
    该模板通过识别 Supabase Studio 仪表盘或后台界面的页面特征，判断目标是否对外暴露了相关控制台。若命中，说明该服务面向外部可访问，可用于资产识别与访问控制核查。
  reference:
    - https://github.com/supabase/supabase
    - https://supabase.com/docs/guides/self-hosting
  metadata:
    verified: true
    max-request: 2
    vendor: supabase
    product: supabase
    shodan-query: http.title:"Supabase Studio"
    fofa-query: title="Supabase Studio"
  tags: panel,supabase,studio,detect,discovery,login

http:
  - method: GET
    path:
      - "{{BaseURL}}"
      - "{{BaseURL}}/_login"

    stop-at-first-match: true
    matchers:
      - type: dsl
        dsl:
          - 'status_code == 200'
          - 'contains(to_lower(body), "<title>supabase studio")'
        condition: and
