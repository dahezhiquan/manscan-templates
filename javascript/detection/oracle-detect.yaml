id: oracle-detect

info:
  name: Oracle 数据库服务识别（指纹识别）
  author: pussycat0x
  severity: info
  description: |
    该模板识别目标是否开放 Oracle 数据库监听入口。模板向 TCP 1521 发起 Oracle 协议连接探测，并以协议握手成功作为数据库服务存在的证据。
  metadata:
    verified: true
    max-request: 1
    shodan-query: oracle port:1521
    vendor: oracle
    product: database_server
  tags: js,network,oracle,info,enum,discovery,detect

javascript:
  - code: |
      let m = require('nuclei/oracle');
      let response = m.IsOracle(Host,Port);
      Export(response);

    args:
      Host: "{{Host}}"
      Port: "1521"

    matchers:
      - type: dsl
        dsl:
          - 'success == true'
          - 'contains(response, "\"IsOracle\": true")'
        condition: and
