id: rw-hosts-file

info:
  name: /etc/hosts 可被非 root 写入（本地基线扫描）
  author: songyaeji
  severity: high
  description: |
    `/etc/hosts` 可被非 root 写入时，本地域名解析可被篡改，攻击者能够将内部服务、更新源或认证端点重定向到恶意地址。模板通过 `stat` 检查 `/etc/hosts` 是否为 `root:root` 且权限为 `600`、`640` 或 `644`，不满足时表示本地域名映射文件权限异常。
  impact: |
    - 本地攻击者可劫持域名解析，诱导访问恶意服务或拦截敏感流量。
    - 被篡改的 hosts 文件会影响补丁下载、认证、日志上报和业务连接。
  remediation: |
    - 将 `/etc/hosts` 属主和属组设置为 `root:root`，权限设置为 `644` 或更严格。
    - 审计文件内容和修改时间，清除未授权解析项并追踪变更来源。
  reference:
    - https://isms.kisa.or.kr/main/csap/notice/
  metadata:
    verified: true
  tags: local,linux,hosts,file,audit,kisa

self-contained: true

code:
  - engine:
      - sh
      - bash
    source: |
      stat -c "%U %G %a" /etc/hosts 2>/dev/null || echo "not-found"

    matchers:
      - type: regex
        part: response
        regex:
          - '^root\s+root\s+(600|644)$'
