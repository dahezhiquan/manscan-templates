id: wondercms-detect

info:
  name: WonderCMS 指纹识别（指纹识别）
  author: pikpikcu
  severity: info
  description: >-
    WonderCMS 是轻量级无数据库内容管理系统，用于构建小型网站和静态化内容页面。该模板通过请求目标服务并检查预设路径或首页响应、HTTP 响应头、页面正文关键字等指纹特征，判断目标是否使用或暴露了
    WonderCMS 相关组件；命中结果仅表示指纹特征匹配，可用于资产盘点、技术栈识别和后续安全评估，不代表已确认存在可利用漏洞。
  metadata:
    max-request: 1
  tags: tech,wondercms,discovery
http:
  - method: GET
    path:
      - "{{BaseURL}}"

    matchers:
      - type: word
        part: header
        words:
          - "Set-Cookie: wondercms_"

      - type: word
        part: body
        words:
          - "Powered by WonderCMS"
          - "https://www.wondercms.com"
        condition: and
