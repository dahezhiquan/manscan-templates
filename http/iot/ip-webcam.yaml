id: ip-webcam

info:
  name: IP Webcam 查看页面暴露（指纹识别）
  author: gy741
  severity: info
  description: |
    IP Webcam 查看页面用于通过浏览器访问移动端或嵌入式摄像头的视频画面与设备功能。该模板通过页面内容特征识别公开可访问的 IP Webcam 界面。
  metadata:
    verified: true
    max-request: 1
    shodan-query: http.favicon.hash:-601917817
  tags: webcam,iot,detect,discovery

http:
  - method: GET
    path:
      - "{{BaseURL}}"

    matchers:
      - type: word
        part: body
        words:
          - '<title>IP Webcam</title>'
          - 'Pavel Khlebovich'
        condition: and
