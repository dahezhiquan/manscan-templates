id: vscode-slnx-sqlite-disclosure

info:
  name: Visual Studio Code Slnx.SQLite 文件 泄露
  author: ritikchaddha
  severity: high
  description: |
    检测到 Visual Studio Code Slnx.SQLite 文件 泄露。目标可能暴露云实例、容器或运行环境元数据，攻击者可据此获取实例身份、网络配置、凭据线索或部署信息。
  metadata:
    max-request: 2
    verified: true
    fofa-query: title="Visual Studio Code"
  tags: vscode,visual-studio,sqlite,disclosure,exposure,file

http:
  - method: GET
    path:
      - "{{BaseURL}}/slnx.sqlite"
      - "{{BaseURL}}/.vs/slnx.sqlite"

    redirects: true
    stop-at-first-match: false

    matchers:
      - type: dsl
        dsl:
          - 'contains_all(body, "SQLite format", "TABLE", "UPDATE")'
          - 'status_code == 200'
        condition: and
