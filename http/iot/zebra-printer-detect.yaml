id: zebra-printer-detect

info:
  name: Zebra 打印机面板识别（IOT）
  author: gy741
  severity: info
  description: |
    检测到 Zebra 打印机面板。该模板通过 Zebra Technologies 页面特征识别条码、标签或工业打印设备的 Web 管理入口。
  reference:
    - https://www.zebra.com/kr/ko/products/printers.html
  classification:
    cpe: cpe:2.3:o:zebra:zt220_firmware:*:*:*:*:*:*:*:*
  metadata:
    verified: true
    max-request: 1
    vendor: zebra
    product: zt220_firmware
    shodan-query: html:"Zebra Technologies"
  tags: iot,zebra,printer,discovery

http:
  - method: GET
    path:
      - "{{BaseURL}}"

    matchers-condition: and
    matchers:
      - type: word
        part: body
        words:
          - 'Zebra Technologies'
          - 'PrintServer'
        condition: and

      - type: status
        status:
          - 200
