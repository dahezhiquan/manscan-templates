id: apache-inlong-detect

info:
  name: Apache InLong 指纹识别（指纹识别）
  author: icarot
  severity: info
  description: |-
    Apache InLong 是数据集成和流式数据平台，用于海量数据采集、同步和传输管理。该模板请求首页，并依据 HTTP 200 状态码、页面标题、正文关键字或品牌资源特征识别目标是否使用或暴露了 Apache InLong 相关组件，适用于资产盘点、技术栈识别和后续安全评估；命中结果仅表示指纹特征匹配，不代表已确认存在可利用漏洞。
  reference:
  - https://github.com/apache/inlong/
  classification:
    cpe: cpe:2.3:a:apache:inlong:1.13.0:*:*:*:*:*:*:*
  metadata:
    max-request: 1
    vendor: apache
    product: inlong
    fofa-query: icon_hash="1155196680"
  tags: tech,apache,inlong,detect,discovery

http:
  - method: GET
    path:
      - "{{BaseURL}}"

    matchers-condition: and
    matchers:
      - type: word
        words:
          - 'InLong</title>'
          - 'webpackJsonpinlong'
        condition: or
        case-insensitive: true

      - type: status
        status:
          - 200
