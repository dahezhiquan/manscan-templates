id: azure-key-vault-delete-unalerted
info:
  name: Azure Key Vault 删除告警未配置（云安全）
  author: princechaddha
  severity: high
  description: Key Vault 删除操作未配置 Activity Log 告警时，密钥、机密和证书的集中存储可能被破坏而不被及时发现。该模板枚举已启用的 Activity Log Alert，并检查 condition 是否缺少 Microsoft.KeyVault/vaults/delete 操作条件。
  impact: |
    - Key Vault 被删除可能导致依赖应用无法读取凭据、密钥或证书，造成大范围业务中断。
    - 未及时发现删除行为会增加密钥泄露、恢复延迟和合规取证难度。
  remediation: |
    - 创建针对 Key Vault 删除操作的 Activity Log Alert，并绑定即时通知和事件响应流程。
    - 为关键 Key Vault 启用软删除、清除保护、资源锁和最小删除权限，降低删除后的恢复风险。
  reference:
    - https://docs.microsoft.com/en-us/azure/azure-monitor/platform/alerts-activity-log
  metadata:
    vendor: microsoft
    product: azure-monitor
  tags: cloud,devops,azure,microsoft,keyvault,azure-cloud-config

flow: |
  code(1);
  for (let AlertData of iterate(template.alertList)) {
    set("id", AlertData);
    code(2);
  }

self-contained: true
code:
  - engine:
      - sh
      - bash
    source: |
      az monitor activity-log alert list --output json --query '[?(enabled==`true`)].id'

    extractors:
      - type: json
        name: alertList
        internal: true
        json:
          - '.[]'

  - engine:
      - sh
      - bash
    source: |
      az monitor activity-log alert show --ids "$id" --query 'condition'

    matchers-condition: and
    matchers:
      - type: word
        words:
          - '"field": "operationName"'

      - type: word
        words:
          - "Microsoft.KeyVault/vaults/delete"
        negative: true

    extractors:
      - type: dsl
        dsl:
          - 'id + " does not have the correct alert configuration for Delete Key Vault events"'
