id: api-amdoren

info:
  name: Amdoren API Token 可用性校验（token喷洒）
  author: daffainfo
  severity: info
  description: 该模板通过调用 Amdoren API 的已知接口验证提供的 token 是否有效，命中后通常表示可访问汇率、货币或金融校验能力。
  reference:
    - https://www.amdoren.com/currency-api/
    - https://github.com/daffainfo/all-about-apikey/tree/main/amdoren
  metadata:
    max-request: 1
  tags: token-spray,amdoren

self-contained: true

http:
  - method: GET
    path:
      - "https://www.amdoren.com/api/currency.php?api_key={{token}}&from=USD&to=EUR"

    matchers:
      - type: word
        part: body
        words:
          - '"error" : 0'
          - '"error_message" : "-"'
        condition: and
