id: seldon-core-detect

info:
  name: Seldon Core - 检测（指纹识别）
  author: rxerium
  severity: info
  description: |-
    检测到 Seldon Core，一个用于在 Kubernetes 上部署、监控和扩展机器学习模型的开源 MLOps/LLMOps 框架。其 Pipeline Gateway 组件（负责在链式模型流水线之间路由推理请求）暴露了一个未认证的状态端点，返回固定的 JSON 横幅和匹配的 Server 响应头。暴露的实例可能泄露内部 ML 流水线配置，并为进一步探测推理 API 提供立足点。
  reference:
    - https://github.com/SeldonIO/seldon-core
    - https://docs.seldon.ai/seldon-core-2
  metadata:
    verified: true
    max-request: 1
    vendor: seldonio
    product: seldon-core
    shodan-query: '"seldon-pipelinegateway"'
  tags: tech,seldon-core,ml,ai,mlops,detect,discovery

http:
  - method: GET
    path:
      - "{{BaseURL}}/"

    matchers-condition: and
    matchers:
      - type: regex
        part: body
        regex:
          - '"name":\s*"seldon-pipelinegateway"'

      - type: word
        part: header
        words:
          - "seldon-pipelinegateway"
