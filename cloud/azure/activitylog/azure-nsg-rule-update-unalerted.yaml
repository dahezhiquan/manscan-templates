id: azure-nsg-rule-update-unalerted
info:
  name: Azure NSG 规则创建或更新告警未配置（云安全）
  author: princechaddha
  severity: high
  description: NSG 安全规则创建或更新会直接改变网络访问边界；未配置 Activity Log 告警时，公网开放、端口放行和出站策略变更可能不被及时发现。该模板枚举已启用的 Activity Log Alert，并检查 condition 是否缺少 Microsoft.Network/networkSecurityGroups/securityRules/write 操作条件。
  impact: |
    - 过宽规则可能暴露 SSH、RDP、数据库或管理服务，增加入侵和横向移动风险。
    - 恶意出站规则可能允许命令控制通信或敏感数据外传。
  remediation: |
    - 创建针对 NSG 安全规则写入和更新操作的 Activity Log Alert，并配置即时通知。
    - 对来源、目标、端口和优先级变化执行基线校验，禁止未经审批的宽泛 CIDR 和高危端口放行。
  reference:
    - https://docs.microsoft.com/en-us/azure/azure-monitor/platform/alerts-activity-log
  metadata:
    vendor: microsoft
    product: azure-monitor
  tags: cloud,devops,azure,microsoft,network-security-group,azure-cloud-config

flow: |
  code(1);
  for (let AlertData of iterate(template.alertList)) {
    set("nsg", AlertData);
    code(2);
  }

self-contained: true
code:
  - engine:
      - sh
      - bash
    source: |
      az monitor activity-log alert list --output json --query '[?(enabled==`true`)].id'

    extractors:
      - type: json
        name: alertList
        internal: true
        json:
          - '.[]'

  - engine:
      - sh
      - bash
    source: |
      az monitor activity-log alert show --ids "$nsg" --query 'condition'

    matchers-condition: and
    matchers:
      - type: word
        words:
          - '"field": "operationName"'

      - type: word
        words:
          - "Microsoft.Network/networkSecurityGroups/securityRules/write"
        negative: true

    extractors:
      - type: dsl
        dsl:
          - 'nsg + " does not have the correct alert configuration for Create/Update Network Security Group Rule events"'
