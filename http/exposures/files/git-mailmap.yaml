id: git-mailmap

info:
  name: Git Mailmap文件暴露（暴露面识别）
  author: geeknik,DhiyaneshDK
  severity: low
  description: |
    检测到目标站点可直接访问 Git Mailmap文件。配置文件通常服务于应用部署、运行参数、依赖管理、调试开关或内部集成。该模板请求 `/.mailmap`，并通过 HTTP 状态码、响应正文关键字、文件格式特征、正则匹配或响应头进行确认。此类文件公开后可能泄露源码结构、依赖版本、内部路径、业务配置、访问凭据或调试数据，扩大暴露面并降低攻击者的后续利用成本。
  impact: |-
    - 公开文件可能泄露内部路径、组件版本、依赖清单、资源命名、环境变量名称或业务配置线索。
    - 攻击者可利用这些信息缩小目标范围，选择匹配漏洞、弱口令、凭据攻击或目录枚举策略。
    - 若文件中包含真实凭据、令牌、连接串或敏感数据，可能进一步导致数据、代码仓库、云资源或后台系统被未授权访问。
  remediation: |-
    - 确认该文件是否必须公网可访问；如非业务必需，应立即从 Web 根目录、静态资源目录、对象存储或反向代理公开路径中移除。
    - 在 Web 服务器、网关、CDN 或应用路由层增加拒绝规则、身份认证、IP allowlist 或内网访问限制。
    - 检查访问日志、下载记录和缓存记录，评估该资源是否已被外部访问或搜索引擎收录。
    - 若文件中包含凭据、令牌、连接串或私有地址，应执行密钥轮换、权限收敛和受影响系统访问审计。
  reference:
    - https://man7.org/linux/man-pages/man5/gitmailmap.5.html
  classification:
    cpe: cpe:2.3:a:git-scm:git:*:*:*:*:*:*:*:*
  metadata:
    verified: true
    max-request: 1
    vendor: git-scm
    product: git
    shodan-query: html:mailmap
  tags: config,exposure,git,mailmap,files,vuln

http:
  - method: GET
    path:
      - "{{BaseURL}}/.mailmap"

    matchers-condition: and
    matchers:
      - type: regex
        regex:
          - "(?:[a-z0-9!#$%&'*+/=?^_`{|}~-]+(?:\\.[a-z0-9!#$%&'*+/=?^_`{|}~-]+)*|\"(?:[\\x01-\\x08\\x0b\\x0c\\x0e-\\x1f\\x21\\x23-\\x5b\\x5d-\\x7f]|\\\\[\\x01-\\x09\\x0b\\x0c\\x0e-\\x7f])*\")@(?:(?:[a-z0-9](?:[a-z0-9-]*[a-z0-9])?\\.)+[a-z0-9](?:[a-z0-9-]*[a-z0-9])?|\\[(?:(?:25[0-5]|2[0-4][0-9]|[01]?[0-9][0-9]?)\\.){3}(?:25[0-5]|2[0-4][0-9]|[01]?[0-9][0-9]?|[a-z0-9-]*[a-z0-9]:(?:[\\x01-\\x08\\x0b\\x0c\\x0e-\\x1f\\x21-\\x5a\\x53-\\x7f]|\\\\[\\x01-\\x09\\x0b\\x0c\\x0e-\\x7f])+)\\])"

      - type: word
        part: header
        words:
          - "application/octet-stream"

      - type: word
        part: body
        words:
          - "# Theresa O'Connor:"
        negative: true

      - type: status
        status:
          - 200
