id: wp-acf-fpd

info:
  name: Advanced Custom Fields (ACF) 完整路径泄露
  author: theamanrawat
  severity: low
  description: |
    检测到 Advanced Custom Fields (ACF) 完整路径泄露。目标功能在未认证状态下可访问，可能暴露管理入口、业务数据、系统状态或可执行操作，需确认是否存在访问控制缺失。
  impact: |
    - 未授权用户可能访问管理功能、业务数据或系统状态。
    - 暴露接口可能被用于进一步枚举、修改配置或执行敏感操作。
  reference:
    - https://www.advancedcustomfields.com
  metadata:
    verified: true
    max-requests: 1
    public-www: "/wp-content/plugins/advanced-custom-fields/"
  tags: debug,wordpress,wp,wp-plugin,acf,fpd

http:
  - method: GET
    path:
      - '{{BaseURL}}/wp-content/plugins/advanced-custom-fields/includes/fields/class-acf-field-accordion.php'

    matchers-condition: and
    matchers:
      - type: regex
        part: body
        regex:
          - '/[a-zA-Z0-9_\-/]+/wp-content/plugins/advanced-custom-fields/includes/fields/class-acf-field-accordion\.php'

      - type: word
        part: content_type
        words:
          - 'text/html'

      - type: status
        status:
          - 200
