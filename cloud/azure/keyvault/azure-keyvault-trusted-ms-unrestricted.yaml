id: azure-keyvault-trusted-ms-unrestricted
info:
  name: Azure Key Vault 未配置受信任 Microsoft 服务访问例外（云安全）
  author: princechaddha
  severity: medium
  description: Azure Key Vault 的 networkAcls.bypass 用于决定受信任的 Microsoft 服务是否可以绕过保管库防火墙；值为 None 表示未允许该类服务绕过。本模板查询该字段，并在匹配到 "None" 时报告未配置受信任服务访问例外。是否应启用取决于实际依赖服务和组织网络基线。
  impact: |
    - 需要受信任 Azure 服务访问保管库时，过于严格的 bypass 配置可能导致备份、部署、监控或集成任务失败。
    - 团队为绕过访问失败而直接放开公网网络或扩大防火墙范围，可能反而增加密钥、证书和机密暴露面。
  remediation: |
    - 先盘点确需访问 Key Vault 的 Azure 服务；有明确依赖时将 bypass 设置为 AzureServices，并保留公网访问限制、RBAC 和审计。
    - 若没有受信任服务依赖，应保留 None 并记录基线例外，避免为通过检查而扩大网络访问范围。
  reference:
    - https://docs.microsoft.com/en-us/azure/key-vault/general/network-security
  metadata:
    vendor: microsoft
    product: azure-key-vault
  tags: cloud,devops,azure,microsoft,keyvault,azure-cloud-config

flow: |
  code(1);
  for (let VaultData of iterate(template.vaultNames)) {
    set("vaultName", VaultData)
    code(2)
  }

self-contained: true
code:
  - engine:
      - sh
      - bash
    source: |
      az keyvault list --query '[*].name' --output json

    extractors:
      - type: json
        name: vaultNames
        internal: true
        json:
          - '.[]'

  - engine:
      - sh
      - bash
    source: |
      az keyvault show --name $vaultName --query 'properties.networkAcls.bypass' --output json

    matchers:
      - type: word
        words:
          - '"None"'

    extractors:
      - type: dsl
        dsl:
          - 'vaultName + " does not allow trusted Microsoft services to bypass the firewall"'
