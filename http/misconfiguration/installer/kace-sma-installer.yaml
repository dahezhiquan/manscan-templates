id: kace-sma-installer

info:
  name: KACE Systems 管理 Appliance 安装向导
  author: ritikchaddha
  severity: high
  description: |
    检测到 KACE Systems 管理 Appliance 安装向导。该页面属于安装、初始化或配置向导流程，若对外暴露，攻击者可能完成初始化、创建管理员账户或重新配置目标系统。
  metadata:
    verified: true
    max-request: 1
    vendor: quest
    product: kace_systems_management_appliance
    fofa-query: icon_hash="-463230636" && body="setup"
  tags: kace,sma,installer,exposure,quest,vuln

http:
  - method: GET
    path:
      - "{{BaseURL}}/common/setup.php"

    matchers-condition: and
    matchers:
      - type: word
        part: body
        words:
          - "Initial Setup"
          - "setup_wizard"
          - "KACE"
        condition: and
        case-insensitive: true

      - type: status
        status:
          - 200
