id: springboot-auditevents

info:
  name: Spring Boot AuditEvents Actuator 面板暴露
  author: DhiyaneshDK
  severity: medium
  description: |
    该模板用于核查 Spring Boot AuditEvents Actuator 面板暴露。该类问题通常源于 Spring Boot Actuator 端点在生产环境中暴露，导致运行状态、配置、环境变量或管理能力可被未授权访问。模板会向目标发送探测请求，并依据请求 `/auditevents`、`/actuator/auditevents`、匹配 `{"events":`、匹配 `application/json`、匹配 `application/vnd.spring-boot.actuator`等证据确认目标是否存在该配置问题。
  impact: |
    - 攻击者可读取应用配置、Bean、环境变量、路由、缓存、审计事件或依赖状态。
    - 部分 Actuator 端点可能泄露凭据线索、内部拓扑或提供可被进一步利用的管理能力。
  remediation: |
    - 仅暴露必要的 Actuator 端点，并为所有管理端点启用认证授权。
    - 将 Actuator 绑定到内网管理地址，避免公网直接访问。
    - 清理环境变量和配置中的敏感信息，并审计异常访问记录。
  reference:
    - https://raw.githubusercontent.com/maurosoria/dirsearch/master/db/dicc.txt
  classification:
    cvss-metrics: CVSS:3.1/AV:N/AC:L/PR:N/UI:N/S:U/C:N/I:N/A:N
    cvss-score: 0
    cwe-id: CWE-200
    cpe: cpe:2.3:a:vmware:spring_boot:*:*:*:*:*:*:*:*
  metadata:
    verified: true
    max-request: 2
    shodan-query: title:"Eureka"
    product: spring_boot
    vendor: vmware
  tags: misconfig,springboot,exposure,vuln

http:
  - method: GET
    path:
      - "{{BaseURL}}/auditevents"
      - "{{BaseURL}}/actuator/auditevents"

    stop-at-first-match: true

    matchers-condition: and
    matchers:
      - type: word
        part: body
        words:
          - '{"events":'

      - type: word
        part: header
        words:
          - "application/json"
          - "application/vnd.spring-boot.actuator"
          - "application/vnd.spring-boot.actuator.v1+json"
        condition: or

      - type: status
        status:
          - 200
