id: mantisbt-installer

info:
  name: MantisBT 安装 暴露
  author: DhiyaneshDK
  severity: high
  description: |
    检测到 MantisBT 安装 暴露。该页面属于安装、初始化或配置向导流程，若对外暴露，攻击者可能完成初始化、创建管理员账户或重新配置目标系统。
  classification:
    cpe: cpe:2.3:a:mantisbt:mantisbt:*:*:*:*:*:*:*:*
  metadata:
    verified: true
    max-request: 1
    vendor: mantisbt
    product: mantisbt
    shodan-query: html:"Administration - Installation - MantisBT"
  tags: misconfig,mantisbt,install,exposure,vuln

http:
  - method: GET
    path:
      - '{{BaseURL}}/admin/install.php'

    matchers-condition: and
    matchers:
      - type: word
        part: body
        words:
          - "Administration - Installation - MantisBT"

      - type: word
        part: header
        words:
          - "text/html"

      - type: status
        status:
          - 200
