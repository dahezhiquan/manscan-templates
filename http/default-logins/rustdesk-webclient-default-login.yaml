id: rustdesk-webclient-default-login

info:
  name: RustDesk Web Client 默认口令登录（弱口令）
  author: 0x_Akoko
  severity: high
  description: |
    该模板用于检测 RustDesk Web Client 是否仍可使用默认凭据或弱口令登录。模板主要向 `/api/admin/login` 等认证入口发送请求，使用内置默认凭据组合进行认证尝试，并根据状态码、认证 Cookie、跳转位置或登录后的页面关键字判断登录是否成功；命中说明目标未及时修改出厂、示例或初始化账号口令。
  impact: |
    - 攻击者可进入 RustDesk Web Client 管理后台，修改任务、服务、插件、路由、作业调度或部署配置。
    - 在 DevOps、网关、监控或运维场景中，后台失陷可能影响生产任务执行、泄露密钥配置，并扩大到下游主机或业务系统。
  remediation: |
    - 立即修改默认管理员口令并清理示例账号，按角色最小化后台管理权限。
    - 将控制台和管理 API 放入受控网络或 VPN 后方，并开启多因素认证、登录失败限制和操作审计。
    - 复核近期任务、插件、连接配置、访问令牌和部署记录，轮换可能暴露的密钥。
  reference:
    - https://rustdesk.com/docs/en/self-host/rustdesk-server-pro/console/
    - https://github.com/rustdesk/rustdesk-server-pro
  metadata:
    verified: true
    max-request: 2
    shodan-query: title:"RustDesk API Admin"
    fofa-query: title="RustDesk API Admin"
  tags: default-login,rustdesk,remote-access

http:
  - raw:
      - |
        POST /api/admin/login HTTP/1.1
        Host: {{Hostname}}
        Content-Type: application/json

        {"username":"{{username}}","password":"{{password}}","platform":"windows","captcha":"","captcha_id":""}

    attack: pitchfork
    payloads:
      username:
        - admin
      password:
        - test1234

    matchers:
      - type: dsl
        dsl:
          - 'status_code == 200'
          - 'contains(content_type, "application/json")'
          - 'contains_all(body, "\"code\":0", "\"message\":\"success\"", "\"token\":", "\"username\":\"admin\"")'
        condition: and
