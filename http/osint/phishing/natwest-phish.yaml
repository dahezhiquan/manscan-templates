id: natwest-phish

info:
  name: NatWest 仿冒钓鱼网站（钓鱼网站识别）
  author: rxerium
  severity: info
  description: |
    检测到疑似仿冒 NatWest 的钓鱼网站。模板在目标页面返回 200、页面内容命中 NatWest 的登录或账号页面特征，且当前主机不属于 natwest.com 官方域名时触发，用于识别借用 NatWest 品牌页面诱导用户信任的仿冒站点。
  reference:
    - https://natwest.com
  metadata:
    max-request: 1
  tags: phishing,natwest,bank,osint,discovery
http:
  - method: GET
    path:
      - "{{BaseURL}}"

    host-redirects: true
    max-redirects: 2

    matchers-condition: and
    matchers:
      - type: word
        words:
          - "Welcome to NatWest. Our extensive personal banking products include bank accounts, mortgages, credit cards, loans and more. Visit today to see how we can serve you."

      - type: status
        status:
          - 200

      - type: dsl
        dsl:
          - '!contains(host,"natwest.com")'
