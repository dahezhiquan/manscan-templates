id: azure-appservice-insights-not-enabled
info:
  name: Azure App Service 未接入 Application Insights（云安全）
  author: princechaddha
  severity: medium
  description: Azure App Service 未配置 Application Insights 连接字符串或旧版检测键时，应用请求、异常、依赖和性能遥测无法接入 Azure Monitor。该模板枚举 Web App，读取应用设置，并在同时缺少 APPLICATIONINSIGHTS_CONNECTION_STRING 和 APPINSIGHTS_INSTRUMENTATIONKEY 时报告未接入 Application Insights。
  impact: |
    - 应用异常、异常访问、性能退化和依赖故障可能无法及时发现，安全事件响应和根因分析会延迟。
    - 缺少集中遥测会削弱可用性告警、异常行为关联和攻击影响范围评估能力。
  remediation: |
    - 创建或选择受控的 Application Insights 资源，将连接字符串安全注入 App Service 应用设置。
    - 为遥测配置访问控制、采样、保留期限和告警规则，避免将连接字符串或敏感请求数据写入日志和代码。
  reference:
    - https://docs.microsoft.com/en-us/azure/azure-monitor/app/app-insights-overview
  metadata:
    vendor: microsoft
    product: azure-monitor
  tags: cloud,devops,azure,microsoft,application-insights,azure-cloud-config

flow: |
  code(1);
  for (let AppServiceData of iterate(template.appServiceList)) {
    AppServiceData = JSON.parse(AppServiceData);
    set("name", AppServiceData.name);
    set("resourceGroup", AppServiceData.resourceGroup);
    code(2);
  }

self-contained: true
code:
  - engine:
      - sh
      - bash
    source: |
      az webapp list --output json --query '[*].{name:name, resourceGroup:resourceGroup}'

    extractors:
      - type: json
        name: appServiceList
        internal: true
        json:
          - '.[]'

  - engine:
      - sh
      - bash
    source: |
      az webapp config appsettings list --name $name --resource-group $resourceGroup --output json

    matchers:
      - type: word
        words:
          - "APPLICATIONINSIGHTS_CONNECTION_STRING"
          - "APPINSIGHTS_INSTRUMENTATIONKEY"
        condition: and
        negative: true

    extractors:
      - type: dsl
        dsl:
          - 'name + " in " + resourceGroup + " does not have Application Insights enabled"'
