id: arcade-php-sqli

info:
  name: Arcade.php - SQL 注入漏洞
  author: MaStErChO
  severity: high
  description: Arcade.php - SQL 注入 存在SQL 注入漏洞。攻击者可借助可控参数干预后端 SQL 查询，从而读取敏感数据、绕过鉴权或进一步影响数据库完整性。
  reference:
    - https://www.exploit-db.com/exploits/29604
    - https://github.com/OWASP/vbscan/
  classification:
    cwe-id: CWE-89
  metadata:
    verified: true
    max-request: 1
  tags: arcade,php,vbulletin,sqli,vuln

http:
  - method: GET
    path:
      - "{{BaseURL}}/arcade.php?act=Arcade&do=stats&comment=a&s_id=1'"

    host-redirects: true
    max-redirects: 3
    matchers-condition: and
    matchers:
      - type: word
        part: body
        words:
          - "mySQL query error"

      - type: status
        status:
          - 200
