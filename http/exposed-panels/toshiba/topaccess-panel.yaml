id: topaccess-panel

info:
  name: Toshiba TopAccess 登录面板识别（指纹识别）
  author: ritikchaddha
  severity: info
  description: Toshiba TopAccess 是 Toshiba 打印机和复合机 Web 管理界面，用于设备状态、地址簿、网络和打印配置。该模板请求首页，并依据 HTTP 200 状态码、页面标题、正文关键字或品牌资源特征、响应头特征识别目标是否部署了该系统或暴露了对应入口，适用于资产指纹确认；命中结果仅表示系统特征匹配，不代表已确认存在未授权访问或可利用漏洞。
  reference:
  - https://business.toshiba.com/downloads/KB/f1Ulds/11646/KH-1020_TAG_EN_0002.pdf
  metadata:
    verified: true
    max-request: 1
    shodan-query: title:"topaccess"
  tags: topaccess,panel,login,detect,discovery

http:
  - method: GET
    path:
      - "{{BaseURL}}"

    host-redirects: true
    max-redirects: 2
    matchers-condition: and
    matchers:
      - type: word
        part: body
        words:
          - 'content="TopAccess'
          - 'locale_TopAccess_Messages'
          - '<title>TopAccess'
        condition: or

      - type: status
        part: header
        status:
          - 200
