id: webtrees-install

info:
  name: WebTrees 暴露 安装
  author: ritikchaddha
  severity: high
  description: |
    检测到 WebTrees 暴露 安装。该页面属于安装、初始化或配置向导流程，若对外暴露，攻击者可能完成初始化、创建管理员账户或重新配置目标系统。
  classification:
    cpe: cpe:2.3:a:webtrees:webtrees:*:*:*:*:*:*:*:*
  metadata:
    verified: true
    max-request: 1
    vendor: webtrees
    product: webtrees
    shodan-query: title:"Setup wizard for webtrees"
  tags: misconfig,webtrees,install,vuln

http:
  - method: GET
    path:
      - "{{BaseURL}}"

    matchers-condition: and
    matchers:
      - type: word
        words:
          - '<title>Setup wizard for webtrees'

      - type: status
        status:
          - 200
