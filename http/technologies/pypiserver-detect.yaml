id: pypiserver-detect

info:
  name: pypiserver 指纹识别（指纹识别）
  author: ritikchaddha
  severity: info
  description: >-
    pypiserver 是轻量级 Python 包索引服务，用于托管私有 PyPI 包仓库。该模板通过请求目标服务并检查预设路径或首页响应、页面正文关键字、状态码等指纹特征，判断目标是否使用或暴露了
    pypiserver 相关组件；命中结果仅表示指纹特征匹配，可用于资产盘点、技术栈识别和后续安全评估，不代表已确认存在可利用漏洞。
  classification:
    cpe: cpe:2.3:a:python:pypiserver:*:*:*:*:*:*:*:*
  metadata:
    verified: true
    max-request: 1
    vendor: python
    product: pypiserver
    shodan-query: html:"pypiserver"
  tags: tech,pypiserver,discovery
http:
  - method: GET
    path:
      - "{{BaseURL}}"

    matchers-condition: and
    matchers:
      - type: word
        part: body
        words:
          - 'Welcome to pypiserver'

      - type: status
        status:
          - 200
