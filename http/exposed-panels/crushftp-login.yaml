id: crushftp-login

info:
  name: CrushFTP WebInterface 面板识别（指纹识别）
  author: dhiyaneshDK
  severity: info
  description: |-
    检测到目标站点存在 CrushFTP WebInterface 相关响应特征。CrushFTP WebInterface 是数据库或数据服务的 Web 管理入口，用于查看数据、执行查询、管理索引、集合、集群或连接配置。模板请求 `/WebInterface/login.html`，并通过页面标题或正文关键字、响应头关键字确认该系统指纹，用于资产识别、系统盘点和暴露面梳理。
  reference:
    - https://www.exploit-db.com/ghdb/6591
  classification:
    cvss-metrics: CVSS:3.0/AV:N/AC:L/PR:N/UI:N/S:U/C:N/I:N/A:N
    cwe-id: CWE-200
    cpe: cpe:2.3:a:crushftp:crushftp:*:*:*:*:*:*:*:*
  metadata:
    verified: true
    max-request: 1
    vendor: crushftp
    product: crushftp
    shodan-query: http.html:"crushftp"
    fofa-query: body="crushftp"
  tags: panel,edb,crushftp,detect,discovery
http:
  - method: GET
    path:
      - '{{BaseURL}}/WebInterface/login.html'

    matchers-condition: or
    matchers:
      - type: word
        part: body
        words:
          - '<title>CrushFTP WebInterface</title>'
          - '<title>CrushFTP - Login</title>'
          - 'src="/WebInterface/Resources/js/crushftp.customize.js"'
        condition: or

      - type: word
        part: header
        words:
          - 'Server: CrushFTP HTTP Server'
