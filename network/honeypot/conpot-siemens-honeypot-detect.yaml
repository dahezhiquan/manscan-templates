id: conpot-siemens-honeypot-detect

info:
  name: Conpot Siemens 蜜罐识别（蜜罐识别）
  author: UnaPibaGeek
  severity: info
  description: |
    Conpot 是面向工控协议的低交互蜜罐，可模拟 Siemens SIMATIC 等 ICS/SCADA 设备服务。该模板向 TCP 102 发送 S7 连接探测，并通过固定的 Siemens/S7 协议响应字节识别 Conpot Siemens 仿真蜜罐。
  metadata:
    verified: true
    max-request: 1
    vendor: conpot
    product: siemens
    shodan-query:
      - html:"Overview - Siemens, SIMATIC"
      - http.html:"overview - siemens, simatic"
    fofa-query: body="overview - siemens, simatic"
  tags: conpot,siemens,honeypot,ir,cti,network,tcp,discovery
tcp:
  - inputs:
      - data: "0300001611e00000000400c1020100c2020102c0010a"
        type: hex

    host:
      - "{{Hostname}}"
    port: 102
    read-size: 1024

    matchers:
      - type: binary
        binary:
          - "030000130ed00000000000c1020000c2020000"
