id: netsus-default-login

info:
  name: NetSUS Server 默认口令登录（弱口令）
  author: princechaddha
  severity: high
  description: 该模板通过尝试 NetSUS Server 的默认管理员账号口令，并依据认证成功后的响应特征判断目标是否仍在使用未修改的弱口令。若命中，攻击者通常可直接获得后台管理权限，进一步访问敏感信息、修改配置或执行未授权操作。
  classification:
    cvss-metrics: CVSS:3.0/AV:N/AC:L/PR:N/UI:N/S:C/C:L/I:L/A:L
    cvss-score: 8.3
    cwe-id: CWE-522
  metadata:
    max-request: 1
    shodan-query: http.title:"NetSUS Server Login"
  tags: netsus,default-login,vuln

http:
  - raw:
      - |
        POST /webadmin/index.php HTTP/1.1
        Host: {{Hostname}}
        Content-Type: application/x-www-form-urlencoded

        loginwith=suslogin&username={{username}}&password={{password}}&submit=

    attack: pitchfork
    payloads:
      username:
        - webadmin
      password:
        - webadmin

    matchers-condition: and
    matchers:
      - type: word
        part: header
        words:
          - 'Location: dashboard.php'
          - 'PHPSESSID='
        condition: and

      - type: status
        status:
          - 302
