id: gcloud-bucket-policies-admin-permissions

info:
  name: 检查 Bucket 策略 使用Administrative Permissions（云安全）
  author: princechaddha
  severity: high
  description: Cloud Storage bucket IAM policy 中包含 Owner、Editor、Storage Admin 或其他 admin 类角色时，授权范围通常超过对象读写所需权限。本模板枚举 bucket 并读取 IAM bindings，命中 roles/owner、roles/editor、roles/storage.admin 或 roles/admin 时报告存在管理员级授权。
  impact: |
    - 被授权主体可修改对象、IAM policy、生命周期或加密配置，导致数据泄露、删除或持久化访问。
    - 管理员权限过宽会增加误操作和越权变更风险，削弱桶级最小权限治理。
  remediation: |
    - 移除 bucket policy 中不必要的管理员角色，改用 Storage Object Viewer/Creator/Admin 等最小必要角色。
    - 使用受控组或服务账号管理访问，并定期审计 bucket IAM bindings。
  reference:
    - https://cloud.google.com/storage/docs/access-control/iam
  metadata:
    vendor: google
    product: cloud-storage
  tags: cloud,devops,gcp,gcloud,google-cloud-storage,iam,security,polp,gcp-cloud-config

flow: |
  code(1)
  for(let projectId of iterate(template.projectIds)){
    set("projectId", projectId)
    code(2)
    for(let bucketName of iterate(template.buckets)){
      set("bucketName", bucketName)
      code(3)
    }
  }

self-contained: true

code:
  - engine:
      - sh
      - bash
    source: |
      gcloud projects list --format="json(projectId)"

    extractors:
      - type: json
        name: projectIds
        internal: true
        json:
          - '.[].projectId'

  - engine:
      - sh
      - bash
    source: |
      gcloud storage buckets list --project $projectId --format="json(name)"

    extractors:
      - type: json
        name: buckets
        internal: true
        json:
          - '.[].name'

  - engine:
      - sh
      - bash
    source: |
      gcloud storage buckets get-iam-policy gs://$bucketName --format="json(bindings)" | jq -r '.bindings[]?.role // "null"'

    matchers:
      - type: word
        words:
          - 'roles/owner'
          - 'roles/editor'
          - 'roles/storage.admin'
          - 'roles/admin'
        condition: or

    extractors:
      - type: dsl
        dsl:
          - '"The bucket " + bucketName + " in project " + projectId + " has IAM policies with administrative permissions (e.g., roles/owner, roles/editor, roles/*admin)."'
