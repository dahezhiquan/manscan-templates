id: renovate-config-exposure

info:
  name: Renovate 配置 暴露
  author: ritikchaddha
  severity: medium
  description: |
    该模板用于核查 Renovate 配置 暴露。该类问题通常源于配置文件、备份文件、管理页面、服务状态或敏感资源被错误暴露到 Web 访问路径。模板会向目标发送探测请求，并依据请求 `/renovate.json`、`/renovate.json5`、匹配 `extends":`、匹配 `packageRules":`等证据确认目标是否存在该配置问题。
  impact: |
    - 攻击者可获取版本、路径、账号、密钥、令牌、配置或业务数据等敏感信息。
    - 泄露的信息可能被用于凭据攻击、漏洞匹配、权限提升或横向移动。
  remediation: |
    - 移除 Web 根目录下不应公开的配置、备份、日志和临时文件。
    - 为敏感页面和资源增加访问控制，并按最小暴露原则收敛公开路径。
    - 轮换已暴露的密钥、令牌和凭据，并审计异常下载或枚举行为。
  reference:
    - https://github.com/renovatebot/renovate
    - https://docs.renovatebot.com/configuration-options/
  metadata:
    verified: true
    max-request: 5
  tags: exposure,config,renovate

http:
  - method: GET
    path:
      - "{{BaseURL}}/renovate.json"
      - "{{BaseURL}}/renovate.json5"
      - "{{BaseURL}}/.github/renovate.json"
      - "{{BaseURL}}/.github/renovate.json5"
      - "{{BaseURL}}/.gitlab/renovate.json"
      - "{{BaseURL}}/.gitlab/renovate.json5"
      - "{{BaseURL}}/.renovaterc"
      - "{{BaseURL}}/.renovaterc.json"
      - "{{BaseURL}}/.renovaterc.json5"

    stop-at-first-match: true
    matchers-condition: and
    matchers:
      - type: word
        words:
          - 'extends":'
          - 'packageRules":'
          - 'hostRules":'
          - 'registryAliases":'
        condition: or

      - type: word
        part: header
        words:
          - "application/json"
          - "text/plain"

      - type: status
        status:
          - 200
