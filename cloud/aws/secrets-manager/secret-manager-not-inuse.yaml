id: secret-manager-not-inuse

info:
  name: Secrets Manager Not已使用（云安全）
  author: DhiyaneshDK
  severity: info
  description: 该规则用于检查 AWS Secrets Manager 相关安全控制、保护能力或合规配置是否处于未启用、缺失或未正确配置状态，以降低持续暴露风险并提升整体云安全基线。
  impact: |
    - 关键安全控制缺失会降低防护深度，使风险长期处于不可见或不可控状态。
    - 这类配置问题通常不会立即触发故障，但会显著增加后续入侵、横向移动或合规违规的概率。
  remediation: |
    - 按厂商最佳实践启用缺失的安全控制、保护功能或基线配置。
    - 将该类配置纳入持续巡检与自动化合规检查，避免后续资源再次以不安全默认值部署。
  reference:
    - https://www.trendmicro.com/cloudoneconformity-staging/knowledge-base/aws/SecretsManager/secrets-manager-in-use.html
    - https://docs.aws.amazon.com/secretsmanager/latest/userguide/intro.html
  tags: cloud,devops,aws,amazon,secret-manager,aws-cloud-config

variables:
  region: "us-west-2"

self-contained: true
code:
  - engine:
      - sh
      - bash
    source: |
      aws secretsmanager list-secrets --region $region --query 'SecretList[*].Name' --output json

    matchers:
      - type: word
        words:
          - '[]'

    extractors:
      - type: dsl
        dsl:
          - '"Secrets Manager Not In Use" + region + " AWS region"'
