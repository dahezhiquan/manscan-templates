id: erlang-daemon

info:
  name: Erlang EPMD 节点信息枚举（服务漏洞）
  author: pussycat0x,daffainfo
  severity: low
  description: |
    Erlang Port Mapper Daemon（EPMD）用于登记并发现 Erlang 节点名称和监听端口，常见于 RabbitMQ、CouchDB、ejabberd 等基于 Erlang/OTP 的服务。EPMD 暴露到不受信任网络时，攻击者可枚举节点名和分布式 Erlang 端口。该模板向 4369 端口发送 EPMD `names` 请求，并从 `name ... at port ...` 响应中提取节点信息。
  impact: |
    - 攻击者可获得 Erlang 节点名称、分布式通信端口和服务部署线索，降低后续攻击的侦察成本。
    - 如果 Erlang cookie 使用默认值、弱值或被泄露，暴露的节点信息可能被用于进一步连接节点并执行高危操作。
  remediation: |
    - 不要将 EPMD 4369 端口暴露到公网，仅允许可信主机访问 Erlang 集群通信端口。
    - 为 Erlang cookie 使用高强度随机值并妥善保护，避免默认配置或跨环境复用。
    - 对依赖 Erlang 的服务启用网络隔离，并审计来自非集群节点的连接尝试。
  reference:
    - https://nmap.org/nsedoc/scripts/epmd-info.html
    - https://book.hacktricks.xyz/network-services-pentesting/4369-pentesting-erlang-port-mapper-daemon-epmd
    - https://medium.com/@_sadshade/couchdb-erlang-and-cookies-rce-on-default-settings-b1e9173a4bcd
  metadata:
    verified: true
    max-request: 1
    shodan-query: product:"Erlang Port Mapper Daemon"
  tags: daemon,enum,erlang,epmd,network,misconfig,tcp,discovery
tcp:
  - inputs:
      - data: "\x00\x01\x6e"

    host:
      - "{{Hostname}}"
    port: 4369

    matchers-condition: and
    matchers:
      - type: word
        words:
          - "HTTP/1.1"
        negative: true

      - type: word
        words:
          - "name"
          - "at port"
        condition: and

    extractors:
      - type: regex
        regex:
          - 'name (.*?) at port ([0-9]+)'
