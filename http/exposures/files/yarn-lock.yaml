id: yarn-lock

info:
  name: Yarn Lock 文件泄露（暴露面识别）
  author: oppsec,noraj
  severity: info
  description: |
    检测到对外可访问的 Yarn Lock 文件。相关文件可能泄露项目结构、依赖关系、部署细节、敏感参数或其他不应公开的内部信息。
  reference:
    - https://classic.yarnpkg.com/lang/en/docs/yarn-lock/
  metadata:
    max-request: 1
  tags: exposure,files,yarn,vuln

http:
  - method: GET
    path:
      - "{{BaseURL}}/yarn.lock"

    matchers-condition: and
    matchers:
      - type: word
        part: body
        words:
          - "# THIS IS AN AUTOGENERATED FILE. DO NOT EDIT THIS FILE DIRECTLY."
          - "# yarn lockfile v1"
        condition: and

      - type: word
        part: header
        words:
          - "text/html"

      - type: status
        status:
          - 200
