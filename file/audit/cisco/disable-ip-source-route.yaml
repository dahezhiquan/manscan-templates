id: disable-ip-source-route

info:
  name: Cisco IP Source-Route 未禁用（本地文件安全扫描）
  author: pussycat0x
  severity: info
  description: |
    该模板检测 Cisco IP source-route 配置。源路由曾被用于绕过正常路由路径、探测网络或辅助未授权操作。
  remediation: |
    在适用设备上禁用 IP source-route。
  reference:
    - https://www.cisco.com/c/en/us/td/docs/ios-xml/ios/ipaddr/command/ipaddr-cr-book/ipaddr-i4.html#GUID-C7F971DD-358F-4B43-9F3E-244F5D4A3A93
  classification:
    cvss-metrics: CVSS:3.1/AV:N/AC:L/PR:N/UI:N/S:U/C:N/I:N/A:N
    cvss-score: 0
    cwe-id: CWE-200
  tags: audit,file,cisco,config-audit,cisco-switch,router

file:
  - extensions:
      - conf

    matchers-condition: and
    matchers:
      - type: word
        words:
          - "no ip source-route"
        negative: true

      - type: word
        words:
          - "configure terminal"
