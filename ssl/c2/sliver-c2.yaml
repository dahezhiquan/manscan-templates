id: sliver-c2

info:
  name: Sliver C2 证书识别（证书安全）
  author: johnk3r
  severity: info
  description: 该模板通过证书主题与颁发者特征识别目标是否可能与 Sliver 命令控制基础设施相关。命中可用于辅助发现红队框架或恶意 C2 部署。
  reference:
    - https://malpedia.caad.fkie.fraunhofer.de/details/win.sliver
  metadata:
    verified: "true"
    max-request: 1
    shodan-query: product:"Sliver C2"
  tags: c2,ssl,ir,osint,malware,sliver,tls,discovery
ssl:
  - address: "{{Host}}:{{Port}}"
    matchers-condition: and
    matchers:
      - type: word
        part: issuer_cn
        words:
          - "operators"

      - type: word
        part: subject_dn
        words:
          - "CN=multiplayer"

    extractors:
      - type: json
        json:
          - " .issuer_cn"
