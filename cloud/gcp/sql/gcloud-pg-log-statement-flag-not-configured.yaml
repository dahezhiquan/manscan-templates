id: gcloud-pg-log-statement-flag-not-configured

info:
  name: Log Statement Flag 未Configured Properly 的PostgreSQL Database Instances（云安全）
  author: princechaddha
  severity: medium
  description: PostgreSQL log_statement 控制语句日志记录范围，未显式配置会使数据库审计粒度不明确。本模板检查 Cloud SQL PostgreSQL 实例 databaseFlags 中的 log_statement，返回 null 时报告该标志未正确配置。
  impact: |
    - 关键 DDL 或数据变更语句可能缺少审计记录，影响误操作和恶意操作追踪。
    - 如果实际配置过宽，也可能把大量 SQL 和参数写入日志，带来敏感信息暴露风险。
  remediation: |
    - 为 PostgreSQL 实例显式设置符合组织审计要求的 log_statement 值。
    - 平衡审计覆盖和敏感信息暴露风险，并将日志发送到集中、受控的存储位置。
  reference:
    - https://cloud.google.com/sql/docs/postgres/flags
  metadata:
    vendor: google
    product: cloud-sql
  tags: cloud,devops,gcp,gcloud,google-cloud-sql,postgresql,logging,gcp-cloud-config

flow: |
  code(1)
  for(let projectId of iterate(template.projectIds)){
    set("projectId", projectId)
    code(2)
    for(let sqlInstance of iterate(template.sqlInstances)){
      set("sqlInstance", sqlInstance)
      code(3)
    }
  }

self-contained: true

code:
  - engine:
      - sh
      - bash
    source: |
      gcloud projects list --format="json(projectId)"

    extractors:
      - type: json
        name: projectIds
        internal: true
        json:
          - '.[].projectId'

  - engine:
      - sh
      - bash
    source: |
      gcloud sql instances list --project $projectId --filter=DATABASE_VERSION:POSTGRES* --format="json(name)"

    extractors:
      - type: json
        name: sqlInstances
        internal: true
        json:
          - '.[].name'

  - engine:
      - sh
      - bash
    source: |
      gcloud sql instances describe $sqlInstance --project $projectId --format=json | jq -r '.settings.databaseFlags[]? | select(.name=="log_statement") | .value // "null"'

    matchers:
      - type: word
        words:
          - 'null'

    extractors:
      - type: dsl
        dsl:
          - '"The log_statement flag is not configured or is set to an inappropriate value for PostgreSQL instance " + sqlInstance + " in project " + projectId'
