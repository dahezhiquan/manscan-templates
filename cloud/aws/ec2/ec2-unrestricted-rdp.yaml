id: ec2-unrestricted-rdp
info:
  name: EC2 安全组对公网开放 RDP 端口（云安全）
  author: princechaddha
  severity: high
  description: EC2 安全组对公网开放 RDP 端口是一类远程管理入口暴露风险，TCP 3389 面向任意来源会显著增加密码爆破、凭据喷洒和远程桌面漏洞利用风险。RDP 应通过堡垒机、VPN 或 SSM 等受控路径访问。模板通过 `describe-security-groups` 筛选 3389 端口且来源为 `0.0.0.0/0` 的入站规则，并输出命中的安全组 ID。
  impact: |
    - Windows 实例可能遭受互联网级爆破和漏洞利用，导致主机被接管。
    - 攻击者获得远程桌面访问后，可窃取凭据、植入持久化并横向移动。
  remediation: |
    - 移除面向公网的 3389 端口入站规则，仅允许堡垒机、VPN 或可信运维网段访问。
    - 优先使用 SSM Session Manager，启用 MFA、强口令和主机登录审计。
  reference:
    - https://docs.aws.amazon.com/AWSEC2/latest/UserGuide/authorizing-access-to-an-instance.html
  metadata:
    vendor: amazon
    product: ec2
  tags: cloud,devops,aws,amazon,ec2,aws-cloud-config

variables:
  region: "us-east-1"

self-contained: true
code:
  - engine:
      - sh
      - bash
    source: |
      aws ec2 describe-security-groups --region $region --filters Name=ip-permission.from-port,Values=3389 Name=ip-permission.to-port,Values=3389 Name=ip-permission.cidr,Values='0.0.0.0/0' --output json --query 'SecurityGroups[*].GroupId'

    extractors:
      - type: json
        name: securitygroup
        internal: true
        json:
          - '.[]'

      - type: dsl
        dsl:
          - 'securitygroup + " security group(s) alows unrestricted access (0.0.0.0/0 or ::/0) on TCP port 3389"'
