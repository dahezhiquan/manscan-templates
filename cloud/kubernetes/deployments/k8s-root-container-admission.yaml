id: k8s-root-container-admission

info:
  name: Minimize the admission of root containers（云安全）
  author: princechaddha
  severity: critical
  description: Deployment 未显式禁止 root 用户运行会让容器默认以镜像内用户身份启动，很多镜像默认为 root。本模板枚举 Deployment，当容器 securityContext.runAsUser 为空值时报告未明确约束运行用户。
  impact: |
    - 应用漏洞被利用后，攻击者在容器内获得更高权限，扩大文件修改和横向移动能力。
    - 与挂载卷、Linux capabilities 或宿主机路径结合时，root 容器会提高节点侧风险。
  remediation: |
    - 显式设置 runAsNonRoot 为 true，并为容器配置非 0 的 runAsUser。
    - 在准入策略中阻止未声明运行用户或以 root 运行的 Deployment。
  reference:
    - https://kubernetes.io/docs/concepts/policy/pod-security-policy/#users-and-groups
  metadata:
    vendor: kubernetes
    product: kubernetes
  tags: cloud,devops,kubernetes,devsecops,deployments,k8s-cluster-security
flow: |
  code(1);
  for (let deployment of template.items) {
    set("deployment", deployment)
    javascript(1);
  }

self-contained: true
code:
  - engine:
      - sh
      - bash
    source: kubectl get deployments --all-namespaces --output=json
    extractors:
      - type: json
        name: items
        internal: true
        json:
          - '.items[]'

javascript:
  - code: |
        deployment = JSON.parse(template.deployment);
        if (deployment.spec.template.spec.containers.some(container => container.securityContext && container.securityContext.runAsUser === null)) {
          let result = (`Deployment '${deployment.metadata.name}' in namespace '${deployment.metadata.namespace}' permits containers to run as root.`);
          Export(result);
        }

    extractors:
      - type: dsl
        dsl:
          - response
