id: api-calendarific

info:
  name: Calendarific API Token 可用性校验（token喷洒）
  author: daffainfo
  severity: info
  description: 该模板通过调用 Calendarific API 的已知接口验证提供的 token 是否有效，命中后通常表示可访问节假日数据能力。
  reference:
    - https://calendarific.com/api-documentation
    - https://github.com/daffainfo/all-about-apikey/tree/main/calendarific
  metadata:
    max-request: 1
  tags: token-spray,calendarific

self-contained: true

http:
  - method: GET
    path:
      - "https://calendarific.com/api/v2/holidays?api_key={{token}}&country=US&year=2021"

    matchers:
      - type: word
        part: body
        words:
          - '"holidays"'
          - '"name"'
          - '"description"'
        condition: and
