id: plone-cms-detect

info:
  name: Plone CMS 指纹识别（指纹识别）
  author: cyllective
  severity: info
  description: >-
    Plone 是基于 Python/Zope 的企业内容管理系统，用于门户、文档管理和内容协作。该模板通过请求目标服务并检查预设路径或首页响应、页面正文关键字等指纹特征，判断目标是否使用或暴露了
    Plone CMS 相关组件；命中结果仅表示指纹特征匹配，可用于资产盘点、技术栈识别和后续安全评估，不代表已确认存在可利用漏洞。
  reference:
  - https://github.com/plone/Products.CMFPlone
  metadata:
    max-request: 1
  tags: tech,plone,cms,discovery
http:
  - method: GET
    path:
      - "{{BaseURL}}"

    matchers:
      - type: word
        part: body
        condition: or
        words:
          - '<meta name="generator" content="Plone - '
          - '<div xmlns:css="http://namespaces.plone.org/diazo/css"'
          - '/++plone++static/plone-compiled.css'
          - '/++plone++static/tinymce-styles.css'
          - '>Powered by Plone &amp; Python</a>'
