id: apache-tomcat-ajp-protocol-detect

info:
  name: Apache Tomcat Java AJP 协议识别（指纹识别）
  author: dahezhiquan
  severity: info
  description: |
    向目标发送 AJP CPing 报文 123400010a，完整读取五字节响应并校验服务端魔数 4142、报文体长度 0001 和 CPong 类型 09，参考 Nmap 的 ajp13 规则识别 AJP 1.3 协议。支持分段响应、持久连接、显式目标端口和 IPv6，未提供端口时使用 8009；建议输入主机:端口以确保结果端口归属正确。
    版本提取仅输出 1.3 并归属 ajp，表示由 CPing/CPong 特征确认的协议版本，不是响应中的软件版本字段；该响应不能单独确认 Tomcat 产品及其版本，也不证明存在漏洞，不覆盖旧版 AJP12。
  reference:
    - https://tomcat.apache.org/connectors-doc/ajp/ajpv13a.html
    - https://github.com/nmap/nmap/blob/master/nmap-service-probes
  metadata:
    verified: true
    shodan-query: 'port:8009 product:"Apache Tomcat"'
    max-request: 1
    vendor: apache
    product: ajp
  tags: js,network,detect,tomcat,apache,java,tcp,discovery,ajp

javascript:
  - code: |
      const net = require('nuclei/net');
      const bytes = require('nuclei/bytes');

      function detect(address) {
        let conn;
        try {
          conn = net.Open('tcp', address);
          conn.SetTimeout(3);
          // AJP 1.3 CPing: client magic, one-byte body, type 10.
          conn.SendHex('123400010a');
          const response = new bytes.Buffer();
          response.Write(conn.RecvFull(5));
          // CPong: server magic, one-byte body, type 9.
          return response.Hex() === '4142000109';
        } catch (e) {
          return false;
        } finally {
          if (conn) conn.Close();
        }
      }

      let host = String(Host);
      if (host.indexOf(':') !== -1 && host.charAt(0) !== '[') host = '[' + host + ']';
      const suppliedPort = Number(TargetPort);
      const port = suppliedPort >= 1 && suppliedPort <= 65535 && Math.floor(suppliedPort) === suppliedPort ? suppliedPort : 8009;
      // Protocol revision inferred from CPong, not a Tomcat software version.
      Export(detect(host + ':' + port) ? '1.3' : '');

    args:
      Host: "{{Host}}"
      TargetPort: "{{Port}}"

    matchers:
      - type: dsl
        name: ajp
        condition: and
        dsl:
          - 'success == true'
          - 'response == "1.3"'

    extractors:
      - type: regex
        name: protocol-version
        part: response
        group: 1
        regex:
          - '^(1\.3)$'
