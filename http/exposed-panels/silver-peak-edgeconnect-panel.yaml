id: silver-peak-edgeconnect-panel

info:
  name: Silver Peak / HPE Aruba EdgeConnect - Orchestrator 管理面板（暴露面识别）
  author: rxerium
  severity: info
  description: |-
    Silver Peak（现为 HPE Aruba Networking）EdgeConnect SD-WAN Orchestrator 是用于管理 EdgeConnect SD-WAN 设备的中央管理平台。其 Web 门户通常暴露在包括 8443 在内的 HTTPS 端口上。
  reference:
    - https://www.arubanetworks.com/products/sd-wan/
  metadata:
    max-request: 1
    shodan-query: 'http.title:"Welcome to EdgeConnect"'
  tags: panel,silver-peak,edgeconnect,aruba,sdwan,vpn,network

http:
  - method: GET
    path:
      - "{{BaseURL}}"


    matchers-condition: and
    matchers:
      - type: word
        words:
          - "EdgeConnect"
          - "Silver Peak"
          - "silverpeak"
        condition: or
        part: body

      - type: status
        status:
          - 200
