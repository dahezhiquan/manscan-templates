id: emerson-power-panel

info:
  name: Emerson Network Power IntelliSlot Web Card 面板识别（暴露面识别）
  author: princechaddha
  severity: info
  description: 该模板通过识别 Emerson Network Power IntelliSlot Web Card 面板、控制台或管理界面的页面特征，判断目标是否暴露了对应服务入口。若命中，说明该后台或运维界面对外可访问，可用于资产识别与暴露面排查。
  classification:
    cvss-metrics: CVSS:3.0/AV:N/AC:L/PR:N/UI:N/S:U/C:N/I:N/A:N
    cwe-id: CWE-200
  metadata:
    max-request: 1
    shodan-query: http.title:"Emerson Network Power IntelliSlot Web Card"
  tags: panel,intellislot,emerson,discovery

http:
  - method: GET
    path:
      - "{{BaseURL}}"

    matchers-condition: and
    matchers:
      - type: word
        part: body
        words:
          - "<title>Emerson Network Power IntelliSlot Web Card</title>"

      - type: status
        status:
          - 200
