id: event-debug-server-status

info:
  name: Event Debug Server 状态信息泄露（暴露面识别）
  author: pussycat0x
  severity: low
  description: 检测到可直接访问的 Event Debug Server 状态相关信息资源。日志、异常页面或调试输出通常会泄露堆栈信息、内部路径、查询语句、账号标识、令牌片段或业务数据，不应向未授权用户开放。
  metadata:
    verified: true
    max-request: 1
    shodan-query: title:"Event Debug Server"
  tags: event,exposure,debug,vuln

http:
  - method: GET
    path:
      - '{{BaseURL}}'

    matchers-condition: and
    matchers:
      - type: word
        part: body
        words:
          - '<h1>Event Debug Server Status</h1>'

      - type: status
        status:
          - 200

    extractors:
      - type: regex
        part: body
        group: 1
        regex:
          - 'Version: <tt>([0-9.]+)'
