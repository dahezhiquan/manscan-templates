id: glimpse-data-exposure

info:
  name: Glimpse Diagnostics 敏感数据暴露（暴露面识别）
  author: 0x_Akoko
  severity: high
  description: |
    检测到目标站点可直接访问 Glimpse Diagnostics 敏感数据。状态页和指标端点用于观察服务运行情况，往往包含组件名称、内部地址、版本和性能指标。该模板请求 `/glimpse.axd`、`/Glimpse.axd`，并通过 HTTP 状态码、响应正文关键字、文件格式特征、正则匹配或响应头进行确认。此类资源公开后可能泄露部署细节、内部路径、依赖版本、环境变量、访问凭据或调试信息，增加被侦察和后续利用的风险。
  impact: |-
    - 状态、调试或指标页面可能泄露组件版本、模块清单、环境变量、内部路径、主机名和服务依赖关系。
    - 攻击者可利用这些信息筛选匹配漏洞、识别弱配置，并规划更精确的后续攻击路径。
    - 部分调试页面还可能暴露请求变量或运行参数，增加敏感信息泄露范围。
  remediation: |-
    - 关闭生产环境中的调试、状态、phpinfo、printenv、探针和未受保护的 metrics 页面。
    - 仅在内网、运维 VPN 或监控系统来源地址中开放必要的观测端点，并启用鉴权。
    - 清理页面中暴露的环境变量、内部路径、主机名、版本信息和调试参数。
    - 复核相关组件版本和配置，修复因暴露信息指向的弱配置或已知漏洞。
  reference:
    - https://getglimpse.com/
    - https://github.com/Glimpse/Glimpse
  classification:
    cwe-id: CWE-200
  metadata:
    verified: true
    max-request: 2
    shodan-query: html:"Glimpse.axd"
    fofa-query: body="Glimpse.axd"
  tags: exposure,misconfig,dotnet,glimpse,debug

http:
  - method: GET
    path:
      - "{{BaseURL}}/glimpse.axd"
      - "{{BaseURL}}/Glimpse.axd"

    stop-at-first-match: true
    matchers:
      - type: dsl
        dsl:
          - 'status_code == 200'
          - 'contains_all(body, "Glimpse - Configuration Page", "Turn Glimpse On", "getglimpse.com")'
        condition: and
