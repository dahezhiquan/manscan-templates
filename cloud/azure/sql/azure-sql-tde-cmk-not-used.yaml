id: azure-sql-tde-cmk-not-used
info:
  name: Azure SQL TDE 未使用客户管理密钥（云安全）
  author: princechaddha
  severity: medium
  description: Azure SQL 数据库的透明数据加密默认可以使用服务托管密钥，也可以切换为客户管理密钥以满足组织的密钥治理和合规要求。本模板枚举逻辑服务器并查询 TDE 的 serverKeyType，在返回 ServiceManaged 时报告未使用客户管理密钥。
  impact: |
    - 组织无法独立控制 TDE 根密钥的轮换、吊销和访问审批，可能无法满足客户持钥或密钥隔离要求。
    - 发生密钥治理、租户隔离或监管审查时，服务托管密钥可能造成控制证据不足和整改压力。
  remediation: |
    - 在 Azure Key Vault 或 Managed HSM 中创建客户管理密钥，并授予 Azure SQL 所需的最小权限。
    - 将服务器 TDE 保护器切换为客户管理密钥，建立密钥轮换、备份、吊销和故障恢复流程。
  reference:
    - https://docs.microsoft.com/en-us/azure/azure-sql/database/transparent-data-encryption-byok-azure-sql-configure
  metadata:
    vendor: microsoft
    product: azure-sql-database
  tags: cloud,devops,azure,microsoft,sql,azure-cloud-config

flow: |
  code(1);
  for (let ServerData of iterate(template.serverList)) {
    ServerData = JSON.parse(ServerData);
    set("id", ServerData.id);
    code(2);
  }

self-contained: true
code:
  - engine:
      - sh
      - bash
    source: |
      az sql server list --query '[*].{"id":id}'

    extractors:
      - type: json
        name: serverList
        internal: true
        json:
          - '.[]'

  - engine:
      - sh
      - bash
    source: |
      az sql server tde-key show --ids "$id" --query 'serverKeyType'

    matchers-condition: and
    matchers:
      - type: word
        words:
          - '"ServiceManaged"'

    extractors:
      - type: dsl
        dsl:
          - 'id + " is not using a Customer-Managed Key (CMK)"'
