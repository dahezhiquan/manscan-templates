id: supershell-default-login

info:
  name: Supershell 默认口令登录（弱口令）
  author: SleepingBag945
  severity: high
  description: |
    该模板用于检测 Supershell 是否仍可使用默认凭据或弱口令登录。模板主要向 `/supershell/login/auth` 等认证入口发送请求，使用内置默认凭据组合进行认证尝试，并根据状态码、认证 Cookie、跳转位置或登录后的页面关键字判断登录是否成功；命中说明目标未及时修改出厂、示例或初始化账号口令。
  impact: |
    - 攻击者可接管 Supershell 控制台，获取或操纵远控、演练任务或攻击基础设施配置。
    - 此类系统一旦被未授权登录，可能被用于投递恶意活动、泄露测试数据，或反向暴露防守方/演练方基础设施。
  remediation: |
    - 立即修改默认凭据并禁用公开可达的管理入口，只允许可信运维来源访问。
    - 启用强认证、登录告警和完整操作审计，删除无用账号和历史测试凭据。
    - 检查近期任务、令牌、载荷、回连地址和导出数据，确认没有被未授权使用。
  reference:
    - https://github.com/tdragon6/Supershell
    - https://www.ctfiot.com/129689.html
  metadata:
    verified: true
    max-request: 1
    fofa-query: title="supershell"
  tags: supershell,default-login,vuln

http:
  - raw:
      - |
        POST /supershell/login/auth HTTP/1.1
        Host: {{Hostname}}
        Content-Type: application/json

        {"username":"{{username}}","password":"{{password}}"}

    attack: pitchfork
    payloads:
      username:
        - tdragon6
      password:
        - tdragon6
    host-redirects: true
    matchers:
      - type: dsl
        dsl:
          - 'status_code_1 == 200 && !contains(body_1,"result\":\"failed")'
          - 'contains(header_1,"token=ey") && contains(body_1,"{\"result\":\"success")'
        condition: and
