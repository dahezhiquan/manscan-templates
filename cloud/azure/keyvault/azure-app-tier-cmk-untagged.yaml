id: azure-app-tier-cmk-untagged
info:
  name: Azure Key Vault 应用层密钥缺少必要标签（云安全）
  author: princechaddha
  severity: high
  description: Azure Key Vault 密钥支持使用标签记录用途、所属应用、环境和责任人等管理元数据。启用的应用层密钥没有标签时，自动化识别、轮换和审计流程难以确认其归属。本模板列出启用的密钥并查询 tags，在返回空对象 {} 时报告缺少应用层密钥标签。
  impact: |
    - 无法可靠区分应用层客户管理密钥的用途和责任边界，可能导致错误授权、误删、误轮换或停用生产密钥。
    - 标签缺失会削弱密钥资产盘点、合规审计和生命周期告警能力，使高价值密钥长期处于不可见状态。
  remediation: |
    - 为每个应用层密钥补充统一的应用、环境、用途、责任人和数据分级标签，避免把机密内容直接写入标签。
    - 使用 Azure Policy 或自动化巡检强制新建密钥带有必需标签，并定期复核已有密钥及其版本的归属和生命周期。
  reference:
    - https://docs.microsoft.com/en-us/azure/key-vault/keys/about-keys-details
  metadata:
    vendor: microsoft
    product: azure-key-vault
  tags: cloud,devops,azure,microsoft,keyvault,azure-cloud-config

flow: |
  code(1);
  for (let vaultName of iterate(template.vaultNames)) {
    set("vaultName", vaultName)
    code(2);
    for (let keyId of iterate(template.keyIds)) {
      set("keyId", keyId)
      code(3)
    }
  }

self-contained: true
code:
  - engine:
      - sh
      - bash
    source: |
      az keyvault list --query '[*].name' --output json

    extractors:
      - type: json
        name: vaultNames
        internal: true
        json:
          - '.[]'

  - engine:
      - sh
      - bash
    source: |
      az keyvault key list --vault-name $vaultName --query '[?(attributes.enabled==`true`)].kid' --output json

    extractors:
      - type: json
        name: keyIds
        internal: true
        json:
          - '.[]'

  - engine:
      - sh
      - bash
    source: |
      az keyvault key show --id $keyId --query 'tags' --output json

    matchers:
      - type: word
        words:
          - '{}'

    extractors:
      - type: dsl
        dsl:
          - 'vaultName + " CMK " + keyId + " is not properly tagged as part of the app-tier resource"'
