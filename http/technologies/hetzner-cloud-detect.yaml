id: hetzner-cloud-detect

info:
  name: Hetzner Cloud 指纹识别（指纹识别）
  author: DhiyaneshDk
  severity: info
  description: >-
    Hetzner Cloud 是云服务器和基础设施服务平台，用于提供虚拟机、网络和存储资源。该模板通过请求目标服务并检查预设路径或首页响应、页面正文关键字、状态码等指纹特征，判断目标是否使用或暴露了
    Hetzner Cloud 相关组件；命中结果仅表示指纹特征匹配，可用于资产盘点、技术栈识别和后续安全评估，不代表已确认存在可利用漏洞。
  metadata:
    verified: true
    max-request: 1
    shodan-query: title:"Hetzner Cloud"
  tags: tech,hetzner,discovery
http:
  - method: GET
    path:
      - '{{BaseURL}}'

    matchers-condition: and
    matchers:
      - type: word
        part: body
        words:
          - 'Hetzner Cloud'
          - 'Hetzner Logo'
        condition: and

      - type: status
        status:
          - 200
