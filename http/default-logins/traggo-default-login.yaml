id: traggo-default-login

info:
  name: Traggo 默认口令登录（弱口令）
  author: 0x_Akoko
  severity: high
  description: |
    该模板用于检测 Traggo 是否仍可使用默认凭据或弱口令登录。模板主要向 `/graphql` 等认证入口发送请求，使用内置默认凭据组合进行认证尝试，并根据状态码、认证 Cookie、跳转位置或登录后的页面关键字判断登录是否成功；命中说明目标未及时修改出厂、示例或初始化账号口令。
  impact: |
    - 攻击者可登录 Traggo 后台，管理内容、用户、插件、主题、文件、表单或业务流程配置。
    - 后台权限被滥用后，可能导致页面篡改、恶意文件上传、敏感资料泄露，或进一步取得服务器执行能力。
  remediation: |
    - 立即修改默认管理员凭据，删除安装向导、演示账号和不必要的后台用户。
    - 限制后台登录入口访问来源，启用多因素认证、登录失败锁定和验证码等防护。
    - 检查近期内容、插件、主题、文件上传和管理员操作记录，确认没有持久化后门。
  reference:
    - https://traggo.net/first-login/
  metadata:
    max-request: 1
    verified: true
  tags: traggo,default-login,time-tracking

variables:
  username: "admin"
  password: "admin"

http:
  - raw:
      - |
        POST /graphql HTTP/1.1
        Host: {{Hostname}}
        Content-Type: application/json

        {"operationName":"Login","variables":{"name":"{{username}}","pass":"{{password}}","deviceType":"ShortExpiry"},"query":"mutation Login($name: String!, $pass: String!, $deviceType: DeviceType!) {\n  login(username: $name, pass: $pass, deviceName: \"web ui\", type: $deviceType, cookie: true) {\n    user {\n      id\n      name\n      admin\n      __typename\n    }\n    __typename\n  }\n}\n"}

    matchers:
      - type: dsl
        dsl:
          - 'status_code == 200'
          - 'contains(set_cookie, "traggo=")'
          - 'contains_all(body, "name\":\"admin", "admin\":true")'
        condition: and
