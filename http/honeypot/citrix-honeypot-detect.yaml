id: citrix-honeypot-detect

info:
  name: Citrix蜜罐识别（蜜罐识别）
  author: UnaPibaGeek
  severity: info
  description: |
    该模板用于识别模拟 Citrix 登录页的蜜罐环境。它请求目标首页，并结合较短响应体、`Citrix Login` 标题以及缺少真实 Citrix 服务条款文本等特征，判断目标是否更像诱捕系统而非真实 Citrix 门户。
  impact: |
    - 命中说明目标可能是用于诱捕扫描器或攻击者的蜜罐，继续交互可能被记录来源、载荷和行为。
    - 在防守侧，该结果可帮助区分真实资产与威胁情报/诱捕节点，避免误判攻击面。
  remediation: |
    - 若该蜜罐为授权部署，应在资产台账中明确标记并限制管理后台访问。
    - 若非预期暴露，应核查是否存在第三方诱捕、伪装页面或资产归属异常。
    - 对蜜罐交互日志进行安全分析，避免在测试中提交真实凭据或敏感载荷。
  metadata:
    verified: true
    max-request: 1
    vendor: citrix
    product: citrix
    shodan-query:
      - http.title:“Citrix Login”
      - http.title:“citrix login”
    fofa-query: title=“citrix login”
    google-query: intitle:“citrix login”
  tags: citrix,honeypot,ir,cti,discovery

http:
  - method: GET
    path:
      - "{{BaseURL}}"

    matchers-condition: and
    matchers:
      - type: dsl
        dsl:
          - 'len(body)<2000'

      - type: word
        part: body
        words:
          - "<title>Citrix Login</title>"

      - type: word
        part: body
        words:
          - "In order to use our services, you must agree to Citrix's Terms of Service."
        negative: true
