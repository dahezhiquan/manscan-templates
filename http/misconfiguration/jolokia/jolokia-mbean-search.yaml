id: jolokia-mbean-search

info:
  name: Jolokia Searching MBeans 检测
  author: pussycat0x
  severity: low
  description: |
    检测到 Jolokia Searching MBeans 检测。目标功能在未认证状态下可访问，可能暴露管理入口、业务数据、系统状态或可执行操作，需确认是否存在访问控制缺失。
  reference:
    - https://thinkloveshare.com/hacking/ssrf_to_rce_with_jolokia_and_mbeans/
    - https://github.com/laluka/jolokia-exploitation-toolkit
  metadata:
    max-request: 2
  tags: jolokia,springboot,mbean,tomcat,misconfig,vuln

http:
  - method: GET
    path:
      - "{{BaseURL}}/jolokia/search/*:test=test"
      - "{{BaseURL}}/actuator/jolokia/search/*:test=test"

    stop-at-first-match: true

    matchers-condition: and
    matchers:
      - type: status
        status:
          - 200

      - type: word
        part: body
        words:
          - '"type":"search"'
          - '"value":'
        condition: and
