id: gcloud-func-public-access

info:
  name: 公开可访问 Google Cloud Functions（云安全）
  author: princechaddha
  severity: high
  description: Cloud Functions IAM policy 若包含 allUsers 或 allAuthenticatedUsers，函数可能被匿名用户或所有 Google 账号调用。本模板枚举函数并读取 IAM policy，匹配公共成员时报告函数公开可访问。
  impact: |
    - 未授权用户可能直接触发函数逻辑，造成数据泄露、业务操作滥用、费用增加或下游系统被调用。
    - 如果函数包含管理动作或信任调用来源，公开访问会显著扩大攻击面。
  remediation: |
    - 从函数 IAM policy 中移除 allUsers 和 allAuthenticatedUsers，仅向明确身份授予调用权限。
    - 对确需公开的函数增加应用层鉴权、速率限制、日志监控和输入校验。
  reference:
    - https://cloud.google.com/functions/docs/securing/managing-access-iam
  metadata:
    vendor: google
    product: cloud-functions
  tags: cloud,devops,gcp,gcloud,google-cloud-functions,gcp-cloud-config

flow: |
  code(1)
  for(let projectId of iterate(template.projectIds)){
    set("projectId", projectId)
    code(2)
    for(let functionDetail of iterate(template.functions)){
      set("functionName", functionDetail)
      code(3)
    }
  }

self-contained: true

code:
  - engine:
      - sh
      - bash
    source: |
      gcloud projects list --format="json(projectId)"

    extractors:
      - type: json
        name: projectIds
        internal: true
        json:
          - '.[].projectId'

  - engine:
      - sh
      - bash
    source: |
      gcloud functions list --project $projectId --format="json(name)"

    extractors:
      - type: json
        name: functions
        internal: true
        json:
          - '.[].name'

  - engine:
      - sh
      - bash
    source: |
      gcloud functions get-iam-policy $functionName --project $projectId --format=json

    matchers:
      - type: word
        words:
          - 'allUsers'
          - 'allAuthenticatedUsers'
        condition: or

    extractors:
      - type: dsl
        dsl:
          - '"Publicly Accessible Function: " + functionName + " in " + projectId + " project"'
