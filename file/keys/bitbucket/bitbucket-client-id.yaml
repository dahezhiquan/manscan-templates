id: bitbucket-client-id

info:
  name: BitBucket 客户端 ID 泄露检测（本地文件安全扫描）
  author: DhiyaneshDK
  severity: low
  description: |
    BitBucket 客户端 ID主要是公开客户端配置、账户标识或项目标识，单独暴露通常不能直接完成认证，但会帮助攻击者识别租户、应用和接口，并可能与其他泄露凭据组合形成攻击链。本模板在全部文件中使用服务名、凭据前缀或字段上下文，并结合令牌长度和字符集约束提取候选值；正则命中只表示格式相似，不能单独证明凭据仍有效或拥有相应权限。
  impact: |
    - 单独泄露通常不会直接授予管理权限，但会帮助攻击者枚举应用、租户、账户、项目或 API 入口。
    - 当接口限制、OAuth 重定向、API 密钥约束或资源 ACL 配置不当时，公开标识可能被用于滥用接口或配合其他凭据攻击。
    - 客户端 ID、公开密钥和用户名不应被误当作密码，但仍需避免与私密配置一同暴露。
  remediation: |
    - 先确认命中的值是否确实属于公开客户端标识；对 API 密钥、OAuth 应用和项目配置启用来源、域名、包名、IP、API 或配额限制。
    - 不要把对应的客户端密钥、私钥或高权限令牌与公开配置一起发布；如已与秘密凭据组合泄露，应立即轮换秘密部分。
    - 复核相关 OAuth 回调地址、资源 ACL 和匿名接口，避免公开标识被用于未授权调用或资产枚举。
  reference:
    - https://github.com/returntocorp/semgrep-rules/blob/develop/generic/secrets/gitleaks/bitbucket-client-id.yaml
    - https://github.com/returntocorp/semgrep-rules/blob/develop/generic/secrets/gitleaks/bitbucket-client-id.go
  metadata:
    verified: true
  tags: file,keys,bitbucket,token

file:
  - extensions:
      - all

    extractors:
      - type: regex
        part: body
        regex:
          - (?i)(?:bitbucket)(?:[0-9a-z\-_\t .]{0,20})(?:[\s|']|[\s|"]){0,3}(?:=|>|:=|\|\|:|<=|=>|:)(?:'|\"|\s|=|\x60){0,5}([a-z0-9]{32})(?:['|\"|\n|\r|\s|\x60|;]|$)
