id: deutsche-bank-phish

info:
  name: Deutsche Bank 仿冒钓鱼网站（钓鱼网站识别）
  author: rxerium
  severity: info
  description: |
    检测到疑似仿冒 Deutsche Bank 的钓鱼网站。模板在目标页面返回 200、页面内容命中 Deutsche Bank 的金融或支付页面特征，且当前主机不属于 db.com 官方域名时触发，用于识别借用 Deutsche Bank 品牌页面诱导用户信任的仿冒站点。
  reference:
    - https://db.com
  metadata:
    max-request: 1
  tags: phishing,deutsche-bank,bank,osint,discovery
http:
  - method: GET
    path:
      - "{{BaseURL}}"

    host-redirects: true
    max-redirects: 2

    matchers-condition: and
    matchers:
      - type: word
        words:
          - 'Deutsche Bank'
          - "Discover Deutsche Bank, one of the world’s leading financial services providers. News and Information about the bank and its products"
        condition: and

      - type: status
        status:
          - 200

      - type: dsl
        dsl:
          - '!contains(host,"db.com")'
