id: grafana-unauth-access

info:
  name: Grafana 未授权访问
  author: ritikchaddha
  severity: high
  description: |
    该模板用于核查 Grafana 未授权访问。该类问题通常源于管理端、API、控制台或服务接口缺少认证授权，导致未登录用户可直接访问敏感功能。模板会向目标发送探测请求，并依据请求 `/api/search?type=dash-db`、`/api/dashboards/home`、匹配 `status_code == 200`、匹配 `contains_all(body, "dashboards:read", "name\":\"Dashboard list")`等证据确认目标是否存在该配置问题。
  impact: |
    - 攻击者可在未授权状态下查看系统状态、业务数据、任务信息或管理接口。
    - 若接口支持写操作，可能进一步导致配置篡改、服务接管、数据删除或横向移动。
  remediation: |
    - 为相关管理端和 API 启用认证授权，并按最小权限限制可访问功能。
    - 将管理接口限制在内网、VPN 或可信来源范围内，并开启访问审计。
    - 检查历史访问日志，确认是否存在未授权访问、批量枚举或异常操作。
  classification:
    cvss-metrics: CVSS:3.1/AV:N/AC:L/PR:N/UI:N/S:U/C:H/I:N/A:N
    cvss-score: 7.5
    cwe-id: CWE-306
  metadata:
    verified: true
    max-request: 7
    shodan-query: title:"Grafana"
    fofa-query: title="Grafana"
  tags: grafana,misconfig,unauth,exposure,dashboard

http:
  - method: GET
    path:
      - "{{BaseURL}}/api/search?type=dash-db"
      - "{{BaseURL}}/api/dashboards/home"
      - "{{BaseURL}}/dashboard"
      - "{{BaseURL}}/api/org"
      - "{{BaseURL}}/api/users"
      - "{{BaseURL}}/api/datasources"
      - "{{BaseURL}}/api/frontend/settings"

    stop-at-first-match: true
    matchers-condition: or
    matchers:
      - type: dsl
        name: dashboards-exposed
        dsl:
          - 'status_code == 200'
          - 'contains_all(body, "dashboards:read", "name\":\"Dashboard list")'
        condition: and

      - type: dsl
        name: dashboard-search-exposed
        dsl:
          - 'status_code == 200'
          - 'contains(content_type, "application/json")'
          - 'contains_all(body, "\"uid\"", "\"title\"")'
          - 'contains_any(body, "\"type\":\"dash-db\"", "\"folderTitle\"")'
        condition: and

      - type: dsl
        name: home-dashboard-exposed
        dsl:
          - 'status_code == 200'
          - 'contains(content_type, "application/json")'
          - 'contains_all(body, "\"dashboard\"", "\"meta\"")'
        condition: and

      - type: dsl
        name: organization-info-exposed
        dsl:
          - 'status_code == 200'
          - 'contains(content_type, "application/json")'
          - 'contains_all(body, "\"id\"", "\"name\"")'
          - 'contains_any(body, "\"address\"", "\"orgId\"")'
        condition: and

      - type: dsl
        name: users-list-exposed
        dsl:
          - 'status_code == 200'
          - 'contains(content_type, "application/json")'
          - 'contains_any(body, "\"login\"", "\"email\"")'
          - 'contains_any(body, "\"isAdmin\"", "\"authLabels\"")'
        condition: and

      - type: dsl
        name: datasources-exposed
        dsl:
          - 'status_code == 200'
          - 'contains(content_type, "application/json")'
          - 'contains_all(body, "\"type\"", "\"url\"")'
          - 'contains_any(body, "\"database\"", "\"access\"")'
        condition: and

      - type: dsl
        name: frontend-settings-exposed
        dsl:
          - 'status_code == 200'
          - 'contains(content_type, "application/json")'
          - 'contains_any(body, "\"allowOrgCreate\"", "\"authProxyEnabled\"")'
          - 'contains_any(body, "\"buildInfo\"", "\"datasources\"")'
        condition: and
