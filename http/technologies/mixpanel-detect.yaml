id: mixpanel-detect

info:
  name: Mixpanel Analytics 指纹识别（指纹识别）
  author: Shivam Kamboj
  severity: info
  description: >-
    Mixpanel 是产品分析平台，用于采集用户行为事件、漏斗、留存和增长分析数据。该模板通过请求目标服务并检查预设路径或首页响应、页面正文关键字、状态码等指纹特征，判断目标是否使用或暴露了
    Mixpanel Analytics 相关组件；命中结果仅表示指纹特征匹配，可用于资产盘点、技术栈识别和后续安全评估，不代表已确认存在可利用漏洞。
  reference:
  - https://mixpanel.com/
  - https://developer.mixpanel.com/docs/javascript-quickstart
  metadata:
    verified: true
    max-request: 1
    shodan-query: html:"cdn.mxpnl.com"
  tags: tech,discovery,mixpanel
http:
  - method: GET
    path:
      - "{{BaseURL}}"

    redirects: true

    matchers-condition: and
    matchers:
      - type: word
        part: body
        words:
          - "cdn.mxpnl.com"
          - "window.mixpanel"
          - "mixpanel-2-latest.min.js"
        condition: and

      - type: status
        status:
          - 200
