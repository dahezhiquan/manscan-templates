id: unauth-psql

info:
  name: PostgreSQL 未认证访问（服务漏洞）
  author: pussycat0x
  severity: high
  description: |
    PostgreSQL 支持多种客户端认证方式，其中 `trust` 配置会允许符合来源规则的连接无需密码通过身份认证。若 `pg_hba.conf` 规则配置过宽并暴露到不受信任网络，攻击者可能直接以 `postgres` 等用户连接数据库。该模板向 5432 端口发送 PostgreSQL 启动包并查询 `pg_database`，通过返回的 `Access privileges`、`Locale Provider` 和 `Owner` 字段确认未认证访问。
  impact: |
    - 攻击者可能枚举数据库、角色和权限，并进一步读取或篡改业务数据。
    - 以高权限数据库用户连接时，攻击者可能创建账号、修改权限、导出数据或破坏数据库可用性。
  remediation: |
    - 检查 `pg_hba.conf`，避免对不受信任网段使用 `trust`，改用 `scram-sha-256`、证书或其他强认证方式。
    - 将 PostgreSQL 端口限制在应用服务器和运维网络范围内，禁止公网直接访问。
    - 审计连接日志和数据库操作记录，排查暴露期间的异常查询与权限变更。
  reference:
    - https://www.postgresql.org/docs/9.6/auth-methods.html
  metadata:
    verified: "true"
    max-request: 1
    shodan-query: port:5432 product:"PostgreSQL"
  tags: network,postgresql,db,unauth,misconfig,tcp,vuln
tcp:
  - inputs:
      - data: "00000054000300007573657200706f73746772657300646174616261736500706f737467726573006170706c69636174696f6e5f6e616d65007073716c00636c69656e745f656e636f64696e6700555446380000" # default database postgres
        type: hex
        read: 1024
      - data: ""
        type: hex
        read: 1024
    host:
      - "{{Hostname}}"
    port: 5432

    matchers-condition: and
    matchers:
      - type: word
        part: raw
        words:
          - "Access privileges"
          - "Locale Provider"
          - "Owner"
        condition: and

      - type: word
        part: raw
        words:
          - "FTP"
          - "HTTP"
          - "500"
        condition: or
        negative: true
