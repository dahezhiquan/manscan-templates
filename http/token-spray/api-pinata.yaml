id: api-pinata

info:
  name: Pinata API Token 可用性校验（token喷洒）
  author: daffainfo
  severity: info
  description: 该模板通过调用 Pinata API 的已知接口验证提供的 token 是否有效，命中后通常表示可访问文件存储与分发能力。
  reference:
    - https://docs.pinata.cloud/
    - https://github.com/daffainfo/all-about-apikey/tree/main/pinata
  metadata:
    max-request: 1
  tags: token-spray,pinata

self-contained: true

http:
  - raw:
      - |
        GET https://api.pinata.cloud/data/pinList?status=pinned HTTP/1.1
        Host: api.pinata.cloud
        pinata_api_key: {{token}}
        pinata_secret_api_key: {{secret}}

    matchers:
      - type: word
        part: body
        words:
          - '"id"'
          - '"ipfs_pin_hash"'
        condition: and
