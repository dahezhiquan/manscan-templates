id: fbi-seized-nameserver

info:
  name: FBI 扣押域名服务器识别（dns）
  author: rxerium
  severity: info
  description: |
    该模板检测域名是否使用执法机构扣押相关的 nameserver。命中通常表示域名可能因恶意活动、犯罪调查或封禁处置被接管。
  classification:
    cwe-id: CWE-200
  metadata:
    max-request: 1
    shodan-query: title:"THIS WEBSITE HAS BEEN SEIZED"
    fofa-query: title="THIS WEBSITE HAS BEEN SEIZED"
  tags: dns,ns,darkweb,fbi,seized,discovery

dns:
  - name: "{{FQDN}}"
    type: NS

    matchers:
      - type: word
        words:
          - "ns1.fbi.seized.gov"
          - "ns2.fbi.seized.gov"
          - "ns3.fbi.seized.gov"
          - "jocelyn.ns.cloudflare.com"
          - "plato.ns.cloudflare.com"
          - "ns1.usssdomainseizure.com"
          - "ns2.usssdomainseizure.com"
        condition: or

    extractors:
      - type: regex
        group: 1
        regex:
          - "IN\\tNS\\t(.+)"
