id: ldap-server

info:
  name: LDAP Server 服务不应安装（本地基线扫描）
  author: Th3l0newolf
  severity: low
  description: |
    LDAP Server 会集中存储身份和目录信息，非授权主机上安装 `slapd` 可能暴露账号目录、认证入口和目录枚举面。CIS Ubuntu 基线建议移除不必要的 LDAP 服务端；模板通过 `dpkg-query -s slapd` 检查软件包是否安装，命中 Policy-Fail 表示不符合基线。
  impact: |
    - 增加系统攻击面，可能引入不必要的监听端口、服务发现能力或旧式协议入口。
    - 在访问控制、补丁或日志监控不足时，攻击者可能借此进行枚举、横向移动、数据暴露或服务滥用。
  remediation: |
    - 如无明确业务需求，卸载 `slapd` 或对应软件包，并清理残留服务配置。
    - 如必须保留，限制访问来源和可用范围，启用加密认证，并纳入补丁、日志和基线审计。
  reference:
    - https://www.cisecurity.org/benchmark/ubuntu_linux
  metadata:
    verified: true
  tags: cis,local,cisecurity,audit,linux,ubuntu

self-contained: true

code:
  - engine:
      - bash
    args:
      - "-c"
      - |
        if dpkg-query -s slapd &>/dev/null; then
          echo "[ldap-server-check:Policy-Fail] [slapd is installed] [CIS_FAIL]"
        else
          echo "[ldap-server-check:Policy-Pass] [slapd is not installed] [CIS_PASS]"
        fi

    matchers:
      - type: word
        name: policy-pass
        words:
          - "Policy-Pass"

      - type: word
        name: policy-fail
        words:
          - "Policy-Fail"
