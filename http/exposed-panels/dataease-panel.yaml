id: dataease-panel

info:
  name: Dataease - 登录面板（暴露面识别）
  author: DhiyaneshDK
  severity: info
  description: |
    该模板通过识别 Dataease 登录入口的页面标题、特征文本或重定向行为，判断目标是否暴露了对应的认证界面。若命中，说明该登录面板对外可访问，可用于暴露面梳理与后续安全评估。
  reference:
    - https://github.com/dataease/dataease
  classification:
    cpe: cpe:2.3:a:dataease:dataease:*:*:*:*:*:*:*:*
  metadata:
    verified: true
    max-request: 1
    vendor: dataease
    product: dataease
    shodan-query:
      - html:"Dataease"
      - http.html:"dataease"
    fofa-query: body="dataease"
  tags: login,panel,dataease,discovery

http:
  - method: GET
    path:
      - "{{BaseURL}}/#/login?redirect=%2F"

    matchers-condition: and
    matchers:
      - type: word
        part: body
        words:
          - "DataEase doesn't work"

      - type: status
        status:
          - 200
