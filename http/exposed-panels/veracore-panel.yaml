id: veracore-panel

info:
  name: Veracore 登录识别（指纹识别）
  author: rxerium
  severity: info
  description: |
    该模板通过识别 Veracore 登录入口的页面标题、特征文本或重定向行为，判断目标是否暴露了对应的认证界面。若命中，说明该登录面板对外可访问，可用于暴露面梳理与后续安全评估。
  reference:
    - https://www.advantive.com/brands/veracore/
  metadata:
    verified: true
    max-request: 1
    shodan-query: html:"veraCoreScreenHeight"
    fofa-query: body="veraCoreScreenHeight"
  tags: panel,veracore,login,detect,discovery

http:
  - method: GET
    path:
      - "{{BaseURL}}/veracore/Home/#systems"

    matchers-condition: and
    matchers:
      - type: word
        part: body
        words:
          - 'VeraCore'
          - '/veracore/img/LoginLogo.png'
        condition: and

      - type: status
        status:
          - 200
