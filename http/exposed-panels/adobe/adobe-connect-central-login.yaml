id: adobe-connect-central-login

info:
  name: Adobe Connect Central 登录面板（暴露面识别）
  author: dhiyaneshDk
  severity: low
  description: |-
    检测到目标站点暴露 Adobe Connect Central 相关面板或登录入口。Adobe Connect Central 是 Adobe Connect 的会议与培训管理门户，用于管理虚拟会议、课程、用户和内容资源。模板请求 `/system/login`，并通过页面标题或正文关键字、状态码确认入口可访问；此类面板若直接暴露在公网，会增加账号枚举、口令攻击、漏洞匹配和未授权访问尝试的机会。
  impact: |-
    - 攻击者可确认目标部署了 Adobe Connect Central 或相关组件，并据此开展账号枚举、口令喷洒、默认凭据尝试或针对性漏洞匹配。
    - 若面板存在弱口令、默认配置、访问控制缺陷或未修复漏洞，可能导致后台权限被获取、配置被篡改、敏感数据泄露或业务系统被接管。
    - 管理入口长期暴露在公网会扩大攻击面，增加自动化扫描、撞库、社会工程和后续横向移动的风险。
  remediation: |-
    - 将 Adobe Connect Central 面板限制在内网、VPN、堡垒机或可信源 IP 访问范围内，避免管理入口直接暴露在公网。
    - 启用强密码、多因素认证、登录失败限制和默认账户清理，定期审计登录日志与管理员账号权限。
    - 保持系统和相关组件更新到受支持版本，关闭不必要的管理路径，并在必须公网访问时增加反向代理访问控制、WAF 或零信任访问策略。
  reference:
    - https://www.adobe.com/products/adobeconnect.html
  classification:
    cwe-id: CWE-200
    cpe: cpe:2.3:a:adobe:connect:*:*:*:*:*:*:*:*
  metadata:
    max-request: 1
    vendor: adobe
    product: connect
    shodan-query: http.title:"openvpn connect"
    fofa-query: title="openvpn connect"
    google-query: intitle:"openvpn connect"
  tags: adobe,panel,connect-central,discovery
http:
  - method: GET
    path:
      - "{{BaseURL}}/system/login"

    matchers-condition: and
    matchers:
      - type: word
        words:
          - '<title>Adobe Connect Central Login</title>'
        part: body

      - type: status
        status:
          - 200
