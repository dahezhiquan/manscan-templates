id: semantic-ui-detect

info:
  name: Semantic UI 指纹识别（指纹识别）
  author: Shivam Kamboj
  severity: info
  description: >-
    Semantic UI 是前端 UI 框架，用于通过语义化类名构建响应式网页组件。该模板通过请求目标服务并检查预设路径或首页响应、正则特征等指纹特征，判断目标是否使用或暴露了
    Semantic UI 相关组件；命中结果仅表示指纹特征匹配，可用于资产盘点、技术栈识别和后续安全评估，不代表已确认存在可利用漏洞。
  reference:
  - https://semantic-ui.com/
  metadata:
    product: semantic-ui
    verified: true
    max-request: 1
    shodan-query: html:"semantic.min.css"
  tags: tech,semantic-ui,discovery
http:
  - method: GET
    path:
      - "{{BaseURL}}"

    redirects: true

    matchers:
      - type: regex
        part: body
        regex:
          - '(?i)href=["''][^"'']*semantic(?:-[0-9]+(?:[.][0-9]+)+)?(?:[\.-]min)?\.css'
          - '(?i)src=["''][^"'']*semantic(?:-[0-9]+(?:[.][0-9]+)+)?(?:[\.-]min)?\.js'
        condition: or

    extractors:
      - type: regex
        name: detected_version
        part: body
        group: 1
        regex:
          - (?i)(?:semantic-ui/|semantic-ui@)([0-9]+(?:[.][0-9]+)+(?:[-+._][0-9A-Za-z]+)*)/(?:[^"\x27<> ]*/)?semantic(?:[.-]min)?\.(?:css|js)
          - (?i)/semantic-([0-9]+(?:[.][0-9]+)+)(?:[.]min)?\.(?:css|js)
        internal: true
      - type: dsl
        dsl:
          - 'regex("^[0-9]+(?:[.][0-9]+)*(?:[-+._][0-9A-Za-z]+)*$", detected_version) ? detected_version : ""'
