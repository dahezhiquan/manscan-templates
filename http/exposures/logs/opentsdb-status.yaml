id: opentsdb-status

info:
  name: OpenTSDB 检测（暴露面识别）
  author: pussycat0x
  severity: low
  description: |
    检测到可直接访问的 OpenTSDB。日志、异常页面或调试输出通常会泄露堆栈信息、内部路径、查询语句、账号标识、令牌片段或业务数据，不应向未授权用户开放。
  reference:
    - http://opentsdb.net/
  classification:
    cpe: cpe:2.3:a:opentsdb:opentsdb:*:*:*:*:*:*:*:*
  metadata:
    verified: true
    max-request: 1
    vendor: opentsdb
    product: opentsdb
    shodan-query: http.favicon.hash:407286339
  tags: opentsdb,exposure,logs,vuln

http:
  - method: GET
    path:
      - "{{BaseURL}}/stats?json"

    matchers-condition: and
    matchers:
      - type: word
        part: body
        words:
          - "tsd.connectionmgr.connections"
          - "tsd.http"
          - "host"
        condition: and

      - type: word
        part: header
        words:
          - "application/json"

      - type: status
        status:
          - 200
