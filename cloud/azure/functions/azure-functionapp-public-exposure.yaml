id: azure-functionapp-public-exposure
info:
  name: Azure Functions 允许公网访问（云安全）
  author: princechaddha
  severity: high
  description: Azure Functions 的入站网络配置决定客户端是否可以从公共网络连接函数应用。公网访问开启时，HTTP 触发器和管理入口的暴露面扩大，若身份认证或应用代码存在缺陷，可能被外部攻击者直接利用。本模板查询 publicNetworkAccess，并在值为 Enabled 时报告。
  impact: |
    - 函数端点可被互联网持续探测和调用，增加未授权访问、漏洞利用、接口刷写和资源耗尽风险。
    - 如果函数能够访问存储、数据库或密钥服务，端点被攻破后可能形成敏感数据泄露和云内横向移动路径。
  remediation: |
    - 不需要公网入站时关闭 publicNetworkAccess，并使用 Private Endpoint、访问限制或受控网络接入。
    - 必须提供公网服务时，强制使用 Microsoft Entra ID 或函数密钥认证，限制来源范围，并为异常调用配置告警。
  reference:
    - https://docs.microsoft.com/en-us/azure/azure-functions/functions-networking-options
  metadata:
    vendor: microsoft
    product: azure-functions
  tags: cloud,devops,azure,microsoft,functionapp,azure-cloud-config

flow: |
  code(1);
  for (let AppData of iterate(template.functionApps)) {
    AppData = JSON.parse(AppData);
    set("name", AppData.name);
    set("resourceGroup", AppData.resourceGroup);
    code(2);
  }

self-contained: true
code:
  - engine:
      - sh
      - bash
    source: |
      az functionapp list --output json --query '[*].{name:name, resourceGroup:resourceGroup}'

    extractors:
      - type: json
        name: functionApps
        internal: true
        json:
          - '.[]'

  - engine:
      - sh
      - bash
    source: |
      az functionapp show --name $name --resource-group $resourceGroup --query 'publicNetworkAccess' --output json

    matchers:
      - type: word
        words:
          - "Enabled"

    extractors:
      - type: dsl
        dsl:
          - 'name + " is publicly accessible and should restrict network access"'
