id: api-trello

info:
  name: Trello API Token 可用性校验（token喷洒）
  author: daffainfo
  severity: info
  description: 该模板通过调用 Trello API 的已知接口验证提供的 token 是否有效，命中后通常表示可访问协作、任务或项目管理能力。
  reference:
    - https://developers.trello.com/
    - https://github.com/daffainfo/all-about-apikey/tree/main/trello
  metadata:
    max-request: 1
  tags: token-spray,trello

self-contained: true

http:
  - method: GET
    path:
      - "https://api.trello.com/1/members/me?key={{key}}&token={{token}}"

    matchers:
      - type: word
        part: body
        negative: true
        words:
          - 'invalid key'
