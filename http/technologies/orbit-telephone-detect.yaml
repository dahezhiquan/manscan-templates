id: orbit-telephone-detect

info:
  name: Orbit Telephone System 指纹识别（指纹识别）
  author: HeeresS
  severity: info
  description: >-
    Orbit Telephone System 是电话或通信系统相关 Web 管理界面，用于配置呼叫、分机或通信服务。该模板通过请求目标服务并检查预设路径或首页响应、页面正文关键字、状态码等指纹特征，判断目标是否使用或暴露了
    Orbit Telephone System 相关组件；命中结果仅表示指纹特征匹配，可用于资产盘点、技术栈识别和后续安全评估，不代表已确认存在可利用漏洞。
  reference:
  - https://kb.orbitgt.com/214/technology/platforms/index
  metadata:
    verified: true
    max-request: 1
    shodan-query: html:"Orbit Telephone System"
    fofa-query: body="Orbit Telephone System"
  tags: tech,detect,discovery
http:
  - method: GET
    path:
      - '{{BaseURL}}/index.html'

    matchers-condition: and
    matchers:
      - type: word
        part: body
        words:
          - '<title>Orbit Telephone System: Administration</title>'

      - type: status
        status:
          - 200
