id: artifactory-anonymous-deploy

info:
  name: Artifactory 匿名 deploy
  author: panch0r3d
  severity: high
  description: |
    检测到 Artifactory 匿名 deploy。目标功能在未认证状态下可访问，可能暴露管理入口、业务数据、系统状态或可执行操作，需确认是否存在访问控制缺失。
  reference:
    - https://www.errno.fr/artifactory/Attacking_Artifactory.html
  metadata:
    max-request: 1
  tags: artifactory,misconfig,vuln

http:
  - method: GET
    path:
      - "{{BaseURL}}/artifactory/ui/repodata?deploy=true"

    matchers-condition: and
    matchers:
      - type: word
        words:
          - '"repoKey"'
        part: body

      - type: status
        status:
          - 200

      - type: word
        words:
          - "application/json"
        part: header
