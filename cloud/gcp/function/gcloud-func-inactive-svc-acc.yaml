id: gcloud-func-inactive-svc-acc

info:
  name: Inactive Service Accounts 中的Google Cloud Functions（云安全）
  author: princechaddha
  severity: high
  description: Cloud Functions 绑定已禁用、不可访问或异常的服务账号时，函数调用 Google Cloud 资源可能失败，也可能暴露身份治理缺口。本模板读取函数 serviceConfig.serviceAccountEmail，并通过 gcloud iam service-accounts describe 检查服务账号状态或错误响应。
  impact: |
    - 函数可能因服务账号不可用而执行失败，影响依赖该函数的事件处理、API 或自动化流程。
    - 异常服务账号绑定会增加权限归属不清、部署漂移和故障排查难度。
  remediation: |
    - 将函数切换到活动且用途明确的专用服务账号，并按最小权限授予 IAM 角色。
    - 清理或恢复异常服务账号，复核函数部署流程中服务账号选择和权限审批。
  reference:
    - https://cloud.google.com/functions/docs/securing/managing-access-iam
  metadata:
    vendor: google
    product: cloud-functions
  tags: cloud,devops,gcp,gcloud,google-cloud-functions,gcp-cloud-config

flow: |
  code(1)
  for(let projectId of iterate(template.projectIds)){
    set("projectId", projectId)
    code(2)
    for(let functionName of iterate(template.functions)){
      set("functionName", functionName)
      code(3)
        for(let serviceAccountEmail of iterate(template.serviceAccountEmail)){
        set("serviceAccountEmail", serviceAccountEmail)
        code(4)
      }
    }
  }

self-contained: true

code:
  - engine:
      - sh
      - bash
    source: |
      gcloud projects list --format="json(projectId)"

    extractors:
      - type: json
        name: projectIds
        internal: true
        json:
          - '.[].projectId'

  - engine:
      - sh
      - bash
    source: |
      gcloud functions list --project $projectId --format="json(name)"

    extractors:
      - type: json
        name: functions
        internal: true
        json:
          - '.[].name'

  - engine:
      - sh
      - bash
    source: |
      gcloud functions describe $functionName --format="json(serviceConfig.serviceAccountEmail)"

    extractors:
      - type: json
        name: serviceAccountEmail
        internal: true
        json:
          - '.[].serviceAccountEmail'

  - engine:
      - sh
      - bash
    source: |
      gcloud iam service-accounts describe $serviceAccountEmail --format="json(disabled)"

    matchers:
      - type: word
        words:
          - 'PERMISSION_DENIED:'
          - 'ERROR:'
          - 'disabled'
        condition: or

    extractors:
      - type: dsl
        dsl:
          - '"Inactive Service Account: " + serviceAccountEmail + ", Function: " + functionName + " in " + projectId + " project"'
