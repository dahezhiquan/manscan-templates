id: chromadb-installer

info:
  name: Chroma数据库 安装向导 检测ed
  author: pussycat0x
  severity: info
  description: |
    检测到 Chroma数据库 安装向导 检测ed。该页面属于安装、初始化或配置向导流程，若对外暴露，攻击者可能完成初始化、创建管理员账户或重新配置目标系统。
  metadata:
    verified: true
    shodan-query: "ChromaDB"
    product: chromadb
    vendor: chroma-core
  tags: admin,chromadb,ai,ml

http:
  - method: GET
    path:
      - "{{BaseURL}}/setup"

    matchers:
      - type: dsl
        dsl:
          - 'status_code == 200'
          - 'contains_all(body, "<title>Chromadb Admin","Chroma connection string</label>","Authentication Type</div>")'
        condition: and
