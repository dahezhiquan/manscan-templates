id: azure-vm-ssh-auth-type
info:
  name: Azure VM SSH Authentication Type 未Using Keys（云安全）
  author: princechaddha
  severity: high
  description: 该规则用于检查 Azure virtualmachines 相关身份、权限或口令安全策略是否符合最小权限和强认证要求，避免因过度授权或弱认证导致资源被滥用。
  impact: |
    - 过度授权、弱口令策略或缺少 MFA 会显著提升账户被滥用的风险。
    - 一旦身份被攻破，攻击者可能借助合法权限直接访问或控制云资源。
  remediation: |
    - 落实最小权限原则，收敛高危权限、通配授权和不必要的管理员能力。
    - 对关键账户和控制台访问强制启用 MFA，并完善口令复杂度、轮换与重用限制策略。
  reference:
    - https://docs.microsoft.com/en-us/azure/virtual-machines/linux/ssh-from-windows
  tags: cloud,devops,azure,microsoft,vm,azure-cloud-config

flow: |
  code(1);
  for (let vmData of iterate(template.vmList)) {
    set("ids", vmData);
    code(2);
  }

self-contained: true
code:
  - engine:
      - sh
      - bash
    source: |
      az vm list --query '[*].id'

    extractors:
      - type: json
        name: vmList
        internal: true
        json:
          - '.[]'

  - engine:
      - sh
      - bash
    source: |
      az vm show --ids "$ids" --query 'osProfile.linuxConfiguration.disablePasswordAuthentication'

    matchers:
      - type: word
        words:
          - 'false'

    extractors:
      - type: dsl
        dsl:
          - 'ids + " is configured with password-based SSH authentication, which is insecure"'
