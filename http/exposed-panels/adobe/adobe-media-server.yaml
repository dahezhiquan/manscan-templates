id: adobe-media-server

info:
  name: Adobe Media Server 登录面板（暴露面识别）
  author: dhiyaneshDK
  severity: info
  description: 该模板通过识别 Adobe Media Server 登录入口的页面标题、特征文本或重定向行为，判断目标是否暴露了对应的认证界面。若命中，说明该登录面板对外可访问，可用于暴露面梳理与后续安全评估。
  reference:
    - https://helpx.adobe.com/support/adobe-media-server.html
  classification:
    cwe-id: CWE-200
  metadata:
    max-request: 1
    shodan-query: http.title:"Adobe Media Server"
  tags: panel,adobe,discovery

http:
  - method: GET
    path:
      - '{{BaseURL}}'

    matchers-condition: and
    matchers:
      - type: word
        words:
          - '<title>Adobe Media Server</title>'

      - type: status
        status:
          - 200
