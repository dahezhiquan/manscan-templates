id: csgo-phish

info:
  name: CS:GO 仿冒钓鱼网站（钓鱼网站识别）
  author: rxerium
  severity: info
  description: |
    检测到疑似仿冒 CS:GO 的钓鱼网站。模板在目标页面返回 200、页面内容命中 CS:GO 的品牌页面特征，且当前主机不属于 counter-strike.net、steampowered.com 官方域名时触发，用于识别借用 CS:GO 品牌页面诱导用户信任的仿冒站点。
  reference:
    - https://counter-strike.net
  metadata:
    max-request: 1
  tags: phishing,csgo,steam,osint,discovery
http:
  - method: GET
    path:
      - "{{BaseURL}}"

    host-redirects: true
    max-redirects: 2

    matchers-condition: and
    matchers:
      - type: word
        words:
          - 'VALVE_PUBLIC_PATH = "https:\/\/www.counter-strike.net\/\/public\/"'
          - 'https://www.counter-strike.net/public/'
        condition: and

      - type: status
        status:
          - 200

      - type: dsl
        dsl:
          - '!contains(host,"counter-strike.net")'
          - '!contains(host,"steampowered.com")'
