id: rockstar-phish

info:
  name: Rockstar Games 仿冒钓鱼网站（钓鱼网站识别）
  author: rxerium
  severity: info
  description: |
    检测到疑似仿冒 Rockstar Games 的钓鱼网站。模板在目标页面返回 200、页面内容命中 Rockstar Games 的品牌页面特征，且当前主机不属于 rockstargames.com 官方域名时触发，用于识别借用 Rockstar Games 品牌页面诱导用户信任的仿冒站点。
  reference:
    - https://rockstargames.com
  metadata:
    max-request: 1
  tags: phishing,rockstar,osint,discovery
http:
  - method: GET
    path:
      - "{{BaseURL}}"

    host-redirects: true
    max-redirects: 2

    matchers-condition: and
    matchers:
      - type: word
        words:
          - "The official home of Rockstar Games"

      - type: status
        status:
          - 200

      - type: dsl
        dsl:
          - '!contains(host,"rockstargames.com")'
