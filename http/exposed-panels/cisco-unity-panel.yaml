id: cisco-unity-panel

info:
  name: Cisco Unity Connection 面板识别（暴露面识别）
  author: HeeresS
  severity: info
  description: |
    该模板通过识别 Cisco Unity Connection 面板、控制台或管理界面的页面特征，判断目标是否暴露了对应服务入口。若命中，说明该后台或运维界面对外可访问，可用于资产识别与暴露面排查。
  classification:
    cpe: cpe:2.3:a:cisco:unity_connection:*:*:*:*:*:*:*:*
  metadata:
    verified: true
    max-request: 2
    vendor: cisco
    product: unity_connection
    shodan-query: html:"Cisco Unity Connection"
  tags: panel,cisco,unity,login,detect,discovery

http:
  - method: GET
    path:
      - "{{BaseURL}}/cuadmin/home.do"
      - "{{BaseURL}}"

    stop-at-first-match: true
    host-redirects: true
    max-redirects: 2

    matchers-condition: and
    matchers:
      - type: word
        part: body
        words:
          - "Cisco Unity Connection Administration"
          - ">Cisco Unity Connection</a>"
        condition: or

      - type: status
        status:
          - 200
