id: wp-plugin-wp-user-registration

info:
  name: WordPress User Registration 插件指纹识别（指纹识别）
  author: omarkurt
  severity: info
  description: >-
    User Registration 是 WordPress 插件，主要用于表单构建、验证码、用户注册、调查反馈或提交记录管理。该模板通过请求目标服务并检查预设路径或首页响应、页面正文关键字、正则特征、状态码、DSL
    条件等指纹特征，判断目标是否使用或暴露了 WordPress User Registration 插件 相关组件；命中结果仅表示指纹特征匹配，可用于资产盘点、技术栈识别和后续安全评估，不代表已确认存在可利用漏洞。
  reference:
  - https://wordpress.org/plugins/user-registration/
  metadata:
    max-request: 1
    verified: true
    shodan-query: "/wp-content/plugins/user-registration/"
  tags: wordpress,wp-plugin,user-registration,tech
http:
  - method: GET
    path:
      - "{{BaseURL}}/wp-content/plugins/user-registration/readme.txt"

    matchers-condition: and
    matchers:
      - type: word
        words:
          - "User Registration"
        part: body

      - type: regex
        part: body
        regex:
          - '(?i)Stable tag:\s*[\d.]+'

      - type: status
        status:
          - 200

    extractors:
      - type: regex
        name: version
        group: 1
        regex:
          - '(?i)Stable tag:\s*([\d.]+)'

      - type: dsl
        dsl:
          - '"[User Registration] detected on " + host + " (version: " + version + ")"'
