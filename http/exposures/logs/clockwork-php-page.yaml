id: clockwork-php-page

info:
  name: Clockwork PHP 页面暴露（暴露面识别）
  author: organiccrap
  severity: high
  description: |
    检测到可直接访问的 Clockwork PHP 页面。日志、异常页面或调试输出通常会泄露堆栈信息、内部路径、查询语句、账号标识、令牌片段或业务数据，不应向未授权用户开放。
  reference:
    - https://twitter.com/damian_89_/status/1250721398747791360
  metadata:
    max-request: 1
  tags: tech,clockwork,exposure,vuln

http:
  - method: GET
    path:
      - '{{BaseURL}}/__clockwork/app'

    matchers-condition: and
    matchers:
      - type: status
        status:
          - 200

      - type: word
        words:
          - <title>Clockwork</title>
          - <html ng-app="Clockwork" ng-csp="">
        part: body
        condition: or
