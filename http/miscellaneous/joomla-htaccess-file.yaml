id: joomla-htaccess-file

info:
  name: Joomla! htaccess 文件泄露
  author: oppsec
  severity: info
  description: |
    检测 Joomla! 站点是否暴露 htaccess 文件。该文件通常包含 HTTP 配置、目录列出控制和重写规则等信息，泄露后可能帮助攻击者理解站点配置。
  metadata:
    max-request: 1
  tags: miscellaneous,misc,joomla,vuln

http:
  - method: GET
    path:
      - "{{BaseURL}}/htaccess.txt"

    matchers-condition: and
    matchers:
      - type: word
        words:
          - "Joomla"
          - "Open Source Matters. All rights reserved"
        condition: and

      - type: word
        part: header
        words:
          - "text/plain"

      - type: status
        status:
          - 200
