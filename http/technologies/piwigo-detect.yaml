id: piwigo-detect

info:
  name: Piwigo 指纹识别（指纹识别）
  author: pikpikcu
  severity: info
  description: >-
    Piwigo 是开源照片图库系统，用于管理、分类和发布图片相册。该模板通过请求目标服务并检查预设路径或首页响应、页面正文关键字、状态码等指纹特征，判断目标是否使用或暴露了
    Piwigo 相关组件；命中结果仅表示指纹特征匹配，可用于资产盘点、技术栈识别和后续安全评估，不代表已确认存在可利用漏洞。
  metadata:
    max-request: 1
    fofa-query:
    - title="piwigo"
    - icon_hash=540706145
    product: piwigo
    vendor: piwigo
    google-query: powered by piwigo
    shodan-query: http.favicon.hash:540706145
  tags: piwigo,tech,discovery
http:
  - method: GET
    path:
      - "{{BaseURL}}"

    matchers-condition: and
    matchers:
      - type: word
        part: body
        words:
          - 'piwigo.org">Piwigo</a>'
          - 'Piwigo (aka PWG), see piwigo.org'
        condition: or

      - type: status
        status:
          - 200
