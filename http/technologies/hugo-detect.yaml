id: hugo-detect

info:
  name: Hugo 指纹识别（指纹识别）
  author: daffainfo
  severity: info
  description: 用于识别目标是否部署 Hugo 并提取相关版本或构建信息，模板会结合页面正文、状态码、特定路径或已知端点和版本或标识提取结果进行指纹匹配。
  classification:
    cpe: cpe:2.3:a:gohugo:hugo:*:*:*:*:*:*:*:*
  metadata:
    verified: true
    max-request: 1
    vendor: gohugo
    product: hugo
    shodan-query: http.html:'Hugo'
  tags: tech,hugo,discovery

http:
  - method: GET
    path:
      - "{{BaseURL}}"

    redirects: true
    max-redirects: 2

    matchers-condition: and
    matchers:
      - type: word
        part: body
        words:
          - '<meta name=generator content="Hugo'

      - type: status
        status:
          - 200

    extractors:
      - type: regex
        group: 1
        regex:
          - '(?m)<meta name=generator content="Hugo ([0-9.]+)">'
