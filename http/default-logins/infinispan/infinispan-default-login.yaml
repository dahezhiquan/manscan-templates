id: infinispan-default-login

info:
  name: Infinispan 默认管理员登录（弱口令）
  author: DhiyanesDk
  severity: high
  description: |
    该模板用于检测 Infinispan 是否仍可使用默认凭据或弱口令登录。模板主要向 `/rest/v2/cache-managers/default` 等认证入口发送请求，使用内置默认凭据组合进行认证尝试，并根据响应中的 `status_code_1 == 401`、`contains(tolower(header_1), "digest realm=")` 等登录成功特征判断登录是否成功；命中说明目标未及时修改出厂、示例或初始化账号口令。
  impact: |
    - 攻击者可登录 Infinispan 管理接口，读取、导出或篡改数据、索引、队列、仓库、报表或服务配置。
    - 若系统保存连接串、访问令牌或集成凭据，弱口令登录可能进一步造成业务数据泄露、权限扩大或服务中断。
  remediation: |
    - 立即修改默认账号口令，删除测试账号，并为管理员、服务账号和集成账号使用唯一强密码。
    - 启用细粒度权限控制、访问来源限制和审计日志，避免管理 API 或控制台直接对公网开放。
    - 检查数据导出、配置变更、令牌使用和异常查询记录，必要时轮换相关凭据。
  reference:
    - https://infinispan.org/docs/stable/titles/security/security.html
    - https://infinispan.org/
  metadata:
    max-request: 2
    verified: true
    vendor: redhat
    product: infinispan
    shodan-query: http.favicon.hash:647951307
  tags: default-login,infinispan,redhat,config

flow: http(1) && http(2)

variables:
  username: "admin"
  password: "password"

http:
  - raw:
      - |
        GET /rest/v2/cache-managers/default HTTP/1.1
        Host: {{Hostname}}
        Accept: application/json

    matchers:
      - type: dsl
        dsl:
          - 'status_code_1 == 401'
          - 'contains(tolower(header_1), "digest realm=")'
        condition: and
        internal: true

    extractors:
      - type: regex
        name: realm
        part: header
        group: 1
        regex:
          - 'realm="([^"]+)"'
        internal: true

      - type: regex
        name: nonce
        part: header
        group: 1
        regex:
          - 'nonce="([^"]+)"'
        internal: true

  - raw:
      - |
        GET /rest/v2/cache-managers/default HTTP/1.1
        Host: {{Hostname}}
        Accept: application/json
        Authorization: Digest username="{{username}}", realm="{{realm}}", nonce="{{nonce}}", uri="/rest/v2/cache-managers/default", qop=auth, nc=00000001, cnonce="0a4f113b", response="{{md5(concat(md5(concat(username,":",realm,":",password)),":",nonce,":00000001:0a4f113b:auth:",md5("GET:/rest/v2/cache-managers/default")))}}", algorithm=MD5

    matchers:
      - type: dsl
        dsl:
          - 'status_code == 200'
          - 'contains_all(body, "\"name\"", "\"cache_manager_status\"")'
        condition: and
