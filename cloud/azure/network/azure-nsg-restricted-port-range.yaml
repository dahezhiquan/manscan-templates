id: azure-nsg-restricted-port-range
info:
  name: Azure NSG 允许过宽入站端口范围（云安全）
  author: princechaddha
  severity: medium
  description: NSG 入站规则应只开放业务确需使用的端口；过宽的连续端口范围会让大量潜在服务同时可达，增加未知服务和临时管理端口暴露的机会。本模板查询入站允许规则，并在端口范围为 0-65535、80-8080 或 111-32800 时报告。
  impact: |
    - 攻击者可扫描并利用范围内未被资产清单覆盖的服务、调试端口和管理接口。
    - 单条宽范围规则还可能掩盖更具体的拒绝规则缺失，扩大入站攻击面和横向移动路径。
  remediation: |
    - 将端口范围拆分为业务实际需要的最小端口集合，并删除 0-65535 等过宽规则。
    - 对管理端口使用专用源地址和跳板网络，定期审计 NSG 优先级、关联资源和未使用规则。
  reference:
    - https://docs.microsoft.com/en-us/azure/virtual-network/network-security-groups-overview
  metadata:
    vendor: microsoft
    product: azure-network-security-group
  tags: cloud,devops,azure,microsoft,nsg,azure-cloud-config

flow: |
  code(1);
  for (let NsgData of iterate(template.nsgdata)) {
    NsgData = JSON.parse(NsgData);
    set("nsg", NsgData.name);
    set("resourcegroup", NsgData.resourceGroup);
    code(2);
  }

self-contained: true
code:
  - engine:
      - sh
      - bash
    source: |
      az network nsg list --output json --query '[*].{name:name, resourceGroup:resourceGroup}'

    extractors:
      - type: json
        name: nsgdata
        internal: true
        json:
          - '.[]'

  - engine:
      - sh
      - bash
    source: |
      az network nsg rule list --nsg-name $nsg --resource-group $resourcegroup --query "[?direction=='Inbound' && access=='Allow'].{PortRange:destinationPortRanges, Rule: name, Priority: priority}"

    matchers:
      - type: word
        words:
          - "0-65535"
          - "80-8080"
          - "111-32800"

    extractors:
      - type: json
        name: destinationPortRange
        internal: true
        json:
          - '.[].destinationPortRange'

      - type: dsl
        dsl:
          - 'nsg + " allows a range of ports " + destinationPortRange + " which may be vulnerable to attacks"'
