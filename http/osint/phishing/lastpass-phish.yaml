id: lastpass-phish

info:
  name: LastPass 仿冒钓鱼网站（钓鱼网站识别）
  author: rxerium
  severity: info
  description: |
    检测到疑似仿冒 LastPass 的钓鱼网站。模板在目标页面返回 200、页面内容命中 LastPass 的登录或账号页面特征，且当前主机不属于 lastpass.com 官方域名时触发，用于识别借用 LastPass 品牌页面诱导用户信任的仿冒站点。
  reference:
    - https://lastpass.com
  metadata:
    max-request: 1
  tags: phishing,lastpass,osint,discovery
http:
  - method: GET
    path:
      - "{{BaseURL}}"

    host-redirects: true
    max-redirects: 2

    matchers-condition: and
    matchers:
      - type: word
        words:
          - '#1 Password Manager &amp; Vault App with Single-Sign On &amp; MFA Solutions - LastPass'

      - type: status
        status:
          - 200

      - type: dsl
        dsl:
          - '!contains(host,"lastpass.com")'
