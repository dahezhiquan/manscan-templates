id: blue-iris-login

info:
  name: Blue Iris 登录面板识别（暴露面识别）
  author: dhiyaneshDK,idealphase
  severity: info
  description: 该模板通过识别 Blue Iris 登录入口的页面标题、特征文本或重定向行为，判断目标是否暴露了对应的认证界面。若命中，说明该登录面板对外可访问，可用于暴露面梳理与后续安全评估。
  reference:
    - https://www.exploit-db.com/ghdb/6814
    - https://blueirissoftware.com/
  classification:
    cvss-metrics: CVSS:3.0/AV:N/AC:L/PR:N/UI:N/S:U/C:N/I:N/A:N
    cwe-id: CWE-200
  metadata:
    max-request: 1
    shodan-query: http.title:"Blue Iris Login"
  tags: panel,blueiris,edb,discovery

http:
  - method: GET
    path:
      - '{{BaseURL}}/login.htm'

    matchers-condition: and
    matchers:
      - type: word
        words:
          - '<title>Blue Iris Login</title>'

      - type: status
        status:
          - 200

    extractors:
      - type: regex
        group: 1
        regex:
          - 'var bi_version = "(.*)";'
