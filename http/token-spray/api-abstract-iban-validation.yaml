id: api-abstract-iban-validation

info:
  name: Abstract API IBAN Validation Token 可用性校验（token喷洒）
  author: daffainfo
  severity: info
  description: 该模板通过调用 Abstract IBAN Validation API 验证提供的 token 是否有效，命中后通常表示可访问 IBAN 校验能力。
  reference:
    - https://www.abstractapi.com/api/iban-validation
    - https://github.com/daffainfo/all-about-apikey/tree/main/abstract-iban-validation
  metadata:
    max-request: 1
  tags: token-spray,abstractapi

self-contained: true

http:
  - method: GET
    path:
      - "https://ibanvalidation.abstractapi.com/v1/?api_key={{token}}&iban=BE71096123456769"

    matchers:
      - type: word
        part: body
        words:
          - '"iban":'
          - '"is_valid":'
        condition: and
