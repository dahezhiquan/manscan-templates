id: nginx-linux-page

info:
  name: Nginx Amazon Linux 页面 指纹识别（指纹识别）
  author: dhiyaneshDk
  severity: info
  description: >-
    Nginx Amazon Linux 页面通常表示 Amazon Linux 环境中的 Nginx 默认站点或测试页面。该模板通过请求目标服务并检查预设路径或首页响应、页面正文关键字等指纹特征，判断目标是否使用或暴露了
    Nginx Amazon Linux 页面 相关组件；命中结果仅表示指纹特征匹配，可用于资产盘点、技术栈识别和后续安全评估，不代表已确认存在可利用漏洞。
  metadata:
    max-request: 1
    shodan-query: http.title:"Test Page for the Nginx HTTP Server on Amazon
      Linux"
  tags: tech,nginx,amazon,discovery
http:
  - method: GET
    path:
      - '{{BaseURL}}'

    matchers:
      - type: word
        words:
          - '<title>Test Page for the Nginx HTTP Server on Amazon Linux</title>'
        condition: and
