id: eyesofnetwork-detect

info:
  name: EyesOfNetwork 指纹识别（指纹识别）
  author: praetorian-thendrickson
  severity: info
  description: >-
    EyesOfNetwork 是开源网络与系统监控平台，用于集中展示告警、可用性和运维监控状态。该模板通过请求目标服务并检查预设路径或首页响应、页面正文关键字、状态码等指纹特征，判断目标是否使用或暴露了
    EyesOfNetwork 相关组件；命中结果仅表示指纹特征匹配，可用于资产盘点、技术栈识别和后续安全评估，不代表已确认存在可利用漏洞。
  reference:
  - https://www.eyesofnetwork.com/en
  metadata:
    max-request: 1
  tags: tech,cisa,eyesofnetwork,discovery
http:
  - method: GET
    path:
      - "{{BaseURL}}/login.php"

    matchers-condition: and
    matchers:
      - type: word
        part: body
        words:
          - "<title>EyesOfNetwork</title>"

      - type: status
        status:
          - 200
