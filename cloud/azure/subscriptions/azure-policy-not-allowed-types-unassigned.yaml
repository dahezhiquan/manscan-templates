id: azure-policy-not-allowed-types-unassigned
info:
  name: Azure 策略 - 未Allowed Resource Types 策略 Assignment 未中的Use（云安全）
  author: princechaddha
  severity: medium
  description: Azure Policy 可通过策略定义和分配约束允许创建的资源类型；缺少针对不允许资源类型的策略分配时，订阅中的主体可能部署未经批准的计算、网络或数据服务。本模板枚举策略分配，解析对应策略定义，并在命令错误输出命中 Audit virtual machines without disaster recovery configured 时报告未落实相关策略约束。
  impact: |
    - 未受治理的资源类型可能绕过组织的备份、网络隔离、加密和审计基线，扩大配置漂移和攻击面。
    - 恶意或误操作主体可部署高成本、公开暴露或不受支持的资源，增加数据泄露、业务中断和合规违规风险。
  remediation: |
    - 创建并分配适用范围明确的 Azure Policy，使用 Deny、Audit 或 Modify 效果限制未经批准的资源类型。
    - 将策略分配到管理组或订阅的正确范围，配置合规修复任务，并定期检查豁免和策略版本变更。
  reference:
    - https://docs.microsoft.com/en-us/azure/governance/policy/concepts/definition-structure
  metadata:
    vendor: microsoft
    product: azure-policy
  tags: cloud,devops,azure,microsoft,azure-policy,azure-cloud-config

flow: |
  code(1);
  for (let AssignmentData of iterate(template.policyAssignmentList)) {
    AssignmentData = JSON.parse(AssignmentData);
    set("name", AssignmentData.name);
    set("policyDefinitionId", AssignmentData.policyDefinitionId);
    code(2);
  }

self-contained: true
code:
  - engine:
      - sh
      - bash
    source: |
      az policy assignment list --output json --query '[*].{"name":displayName,"policyDefinitionId":policyDefinitionId}'

    extractors:
      - type: json
        name: policyAssignmentList
        internal: true
        json:
          - '.[]'

  - engine:
      - sh
      - bash
    source: |
      az policy definition show --name "$name" --query 'displayName' --output json

    matchers-condition: and
    matchers:
      - type: word
        part: stderr
        words:
          - 'Audit virtual machines without disaster recovery configured'

    extractors:
      - type: dsl
        dsl:
          - '"Policy " + name + " not enforcing allowed resource types"'
