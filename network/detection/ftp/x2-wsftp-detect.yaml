id: x2-wsftp-detect
info:
  name: X2 WS_FTP 服务 识别（指纹识别）
  author: pussycat0x
  severity: info
  description: |
    该模板通过 FTP Banner、响应特征或协商行为识别目标是否运行 X2 WS_ 相关 FTP 服务实现。
  metadata:
    verified: true
    shodan-query: "X2 WS_FTP Server"
    max-request: 1
  tags: network,ftp,wsftp,detect,tcp,discovery

tcp:
  - inputs:
      - data: 00000000
        type: hex

    host:
      - "{{Hostname}}"
    port: 21
    read-size: 1024

    matchers:
      - type: word
        words:
          - "X2 WS_FTP Server"

    extractors:
      - type: regex
        group: 1
        name: version
        regex:
          - "X2 WS_FTP Server ([0-9.]+)"
