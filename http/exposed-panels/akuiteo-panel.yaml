id: akuiteo-panel

info:
  name: Akuiteo 登录面板识别（指纹识别）
  author: righettod
  severity: info
  description: |
    该模板通过识别 Akuiteo 登录入口的页面标题、特征文本或重定向行为，判断目标是否暴露了对应的认证界面。若命中，说明该登录面板对外可访问，可用于暴露面梳理与后续安全评估。
  reference:
    - https://www.akuiteo.com/en/
  metadata:
    verified: true
    max-request: 1
    shodan-query: title:"Akuiteo"
  tags: panel,akuiteo,login,detect,discovery

http:
  - method: GET
    path:
      - "{{BaseURL}}"
      - "{{BaseURL}}/akuiteo.collabs/login/login.html"
      - "{{BaseURL}}/akuiteo/login.html/"

    redirects: true
    max-redirects: 2

    stop-at-first-match: true
    matchers:
      - type: dsl
        dsl:
          - 'contains_any(to_lower(body), "akuiteo collabs</title>", "akuiteo mobile</title>", "akuiteo</title>", "<title>[akuiteo]")'
        condition: and

    extractors:
      - type: regex
        part: header
        group: 1
        regex:
          - '(?i)x-akuiteo-masterhash:\s+([0-9a-f]+)'
