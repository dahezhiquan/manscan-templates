id: phpmyadmin-unauth-access

info:
  name: PhpMyAdmin - 未授权访问漏洞
  author: pwnhxl
  severity: high
  description: |
    该模板用于检测 PhpMyAdmin - 未授权访问漏洞。该类问题通常源于服务配置过宽、调试能力暴露或安全控制未按生产环境要求启用。模板会向 `{{path}}` 等位置发送探测请求，并结合响应状态、关键字、错误信息、时间差或外带交互等证据判断目标是否受影响。
  impact: |
    - 攻击者可能借助错误配置访问内部功能、敏感数据或原本不应公开的管理能力。
    - 配置缺陷常与其他漏洞组合使用，扩大暴露面并增加被定向攻击的概率。
  remediation: |
    - 按最小暴露原则收敛相关服务配置，关闭调试、示例、未使用插件和不必要接口。
    - 为管理入口和敏感接口增加认证、授权、来源限制和审计记录。
    - 复核生产环境基线，确认安全头、访问控制、默认配置和网络边界符合要求。
  reference:
    - https://www.phpmyadmin.net
  classification:
    cpe: cpe:2.3:a:phpmyadmin:phpmyadmin:*:*:*:*:*:*:*:*
  metadata:
    verified: true
    max-request: 6
    vendor: phpmyadmin
    product: phpmyadmin
    shodan-query: html:"server_databases.php"
    fofa-query: body="server_databases.php"
  tags: misconfig,phpmyadmin,unauth,vuln

http:
  - raw:
      - |
        GET {{path}} HTTP/1.1
        Host: {{Hostname}}

    payloads:
      path:
        - "/index.php"
        - "/pma/index.php"
        - "/pmd/index.php"
        - "/phpMyAdmin/index.php"
        - "/phpmyadmin/index.php"
        - "/_phpmyadmin/index.php"

    attack: batteringram
    stop-at-first-match: true

    matchers-condition: and
    matchers:
      - type: word
        part: body
        words:
          - 'server_sql.php'
          - 'server_status.php'
          - 'server_variables.php'
          - 'server_databases.php'
        condition: and

      - type: word
        part: header
        words:
          - 'Set-Cookie: phpMyAdmin='

      - type: word
        part: header
        words:
          - 'text/html'

      - type: status
        status:
          - 200
