id: gcloud-gke-logging-disabled

info:
  name: GKE Clusters 未启用Cloud 日志记录已启用（云安全）
  author: princechaddha
  severity: medium
  description: GKE 集群未启用 Cloud Logging 时，控制面和工作负载日志无法集中进入 Google Cloud 日志体系。本模板枚举集群并检查 loggingService，值为 none 时报告集群未启用 Cloud Logging。
  impact: |
    - 安全事件、Pod 异常和控制面操作缺少集中日志，影响入侵排查和故障定位。
    - 审计、告警和合规留存依赖的日志数据可能不完整。
  remediation: |
    - 为 GKE 集群启用 Cloud Logging，并按组件和命名空间需求配置日志采集范围。
    - 设置日志保留、导出和告警策略，确保关键集群事件可追踪。
  reference:
    - https://cloud.google.com/kubernetes-engine/docs/how-to/logging
    - https://www.trendmicro.com/cloudoneconformity/knowledge-base/gcp/GKE/enable-and-configure-logging.html
  metadata:
    vendor: google
    product: google-kubernetes-engine
  tags: cloud,devops,gcp,gcloud,gke,kubernetes,logging,security,gcp-cloud-config

flow: |
  code(1)
  for(let projectId of iterate(template.projectIds)){
    set("projectId", projectId)
    code(2)
    for(let cluster of iterate(template.clusters)){
      cluster = JSON.parse(cluster)
      set("clusterName", cluster.name)
      set("location", cluster.location)
      code(3)
    }
  }

self-contained: true

code:
  - engine:
      - sh
      - bash
    source: |
      gcloud projects list --format="json(projectId)"

    extractors:
      - type: json
        name: projectIds
        internal: true
        json:
          - '.[].projectId'

  - engine:
      - sh
      - bash
    source: |
      gcloud container clusters list --project $projectId --format="json(name,location)"

    extractors:
      - type: json
        name: clusters
        internal: true
        json:
          - '.[]'

  - engine:
      - sh
      - bash
    source: |
      gcloud container clusters describe $clusterName --location $location --project $projectId --format="json(loggingService)"

    matchers:
      - type: word
        words:
          - '"loggingService": "none"'

    extractors:
      - type: dsl
        dsl:
          - '"GKE cluster " + clusterName + " in " + location + " of project " + projectId + " does not have Cloud Logging enabled"'
