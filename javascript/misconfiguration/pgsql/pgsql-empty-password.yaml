id: pgsql-empty-password

info:
  name: PostgreSQL 空密码检测（服务漏洞）
  author: pussycat0x
  severity: critical
  description: |
    目标 PostgreSQL 服务允许使用空密码完成认证，攻击者可能无需有效凭据访问数据库。模板发起空密码连接尝试，并以 PostgreSQL 客户端认证成功作为命中依据。
  impact: |
    - 空密码 PostgreSQL 账号可被远程攻击者直接使用，导致数据库未授权访问。
    - 若高权限角色允许空密码，攻击者可能读取敏感数据、修改业务表或执行高危数据库操作。
  remediation: |
    - 为 PostgreSQL 账号设置强口令，禁止 trust/空密码认证暴露到不可信网络。
    - 收紧 pg_hba.conf，限制远程来源，并审计高权限角色的认证方式。
  reference:
    - https://www.tenable.com/plugins/nessus/104031
  classification:
    cwe-id: CWE-287
  metadata:
    verified: true
    max-request: 1
    shodan-query: "product:\"PostgreSQL\""
    vendor: postgresql
    product: postgresql
  tags: js,network,postgresql,authenticated,vuln

javascript:
  - pre-condition: |
      isPortOpen(Host,Port);
    code: |
      const postgres = require('nuclei/postgres');
      const client = new postgres.PGClient;
      const connected = client.Connect(Host, Port, User, Pass);
      connected;

    args:
      Host: "{{Host}}"
      Port: 5432
      User: "postgres"
      Pass: ""

    matchers:
      - type: dsl
        dsl:
          - "success == true"
          - "response == true"
        condition: and
