id: apache-druid-unauth

info:
  name: Apache Druid 未授权
  author: DhiyaneshDk
  severity: low
  description: |
    检测到 Apache Druid 未授权。目标功能在未认证状态下可访问，可能暴露管理入口、业务数据、系统状态或可执行操作，需确认是否存在访问控制缺失。
  classification:
    cpe: cpe:2.3:a:apache:druid:*:*:*:*:*:*:*:*
  metadata:
    verified: true
    max-request: 1
    vendor: apache
    product: druid
    shodan-query: title:"Apache Druid"
  tags: misconfig,druid,unauth,apache,vuln

http:
  - method: GET
    path:
      - '{{BaseURL}}/unified-console.html'

    matchers-condition: and
    matchers:
      - type: word
        words:
          - '<title>Apache Druid</title>'

      - type: status
        status:
          - 200
