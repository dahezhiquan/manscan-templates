id: azure-sql-delete-db-unalerted
info:
  name: Azure SQL Delete Database Alert 未Configured（云安全）
  author: princechaddha
  severity: high
  description: 该规则用于检查 Azure 活动日志 是否启用了日志记录、审计、监控或告警能力，以确保能够及时发现异常行为并满足审计与取证要求。
  impact: |
    - 缺少日志、审计或告警能力会削弱对异常活动的发现、响应与取证能力。
    - 安全事件可能因此长时间不被察觉，扩大影响范围并增加溯源难度。
  remediation: |
    - 启用必要的日志、审计、监控和告警能力，并确保日志输出到集中化、可审计的位置。
    - 为高风险事件设置实时通知与响应流程，避免关键安全事件长期无感知。
  reference:
    - https://docs.microsoft.com/en-us/azure/azure-monitor/platform/alerts-activity-log
  tags: cloud,devops,azure,microsoft,sql-database,azure-cloud-config

flow: |
  code(1);
  for (let AlertData of iterate(template.alertList)) {
    set("id", AlertData);
    code(2);
  }

self-contained: true
code:
  - engine:
      - sh
      - bash
    source: |
      az monitor activity-log alert list --output json --query '[?(enabled==`true`)].id'

    extractors:
      - type: json
        name: alertList
        internal: true
        json:
          - '.[]'

  - engine:
      - sh
      - bash
    source: |
      az monitor activity-log alert show --ids "$id" --query 'condition'

    matchers-condition: and
    matchers:
      - type: word
        words:
          - '"field": "operationName"'

      - type: word
        words:
          - "Microsoft.Sql/servers/databases/delete"
        negative: true

    extractors:
      - type: dsl
        dsl:
          - 'id + " does not have the correct alert configuration for Delete Azure SQL Database events"'
