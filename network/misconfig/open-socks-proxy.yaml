id: open-socks-proxy

info:
  name: 开放的 SOCKS4/SOCKS5 代理（服务漏洞）
  author: snicket2100
  severity: medium
  description: |-
    该主机接受未经认证的 SOCKS4/SOCKS5 连接，并可为外部目标代理 TCP 流量。此漏洞可能被滥用，用于匿名化、发送垃圾邮件、扫描或网络渗透。验证方式为通过该代理成功连接至 1.1.1.1:80。
  impact: |
    - 攻击者可借助开放代理隐藏真实来源，发起扫描、撞库、垃圾邮件投递或对第三方的攻击流量转发。
    - 代理主机可能被第三方封禁、列入黑名单，或因异常转发流量导致网络带宽和业务可用性受影响。
  remediation: |
    - 关闭不需要的 SOCKS 代理服务，或启用强认证并限制允许代理的目标与来源。
    - 使用防火墙、安全组或监听地址限制 1080 等代理端口仅对可信网络开放。
    - 审计代理日志和出口流量，排查是否已经被滥用转发异常连接。
  reference:
    - https://www.rfc-editor.org/rfc/rfc1928
    - https://en.wikipedia.org/wiki/Open_proxy
    - https://owasp.org/www-community/vulnerabilities/Unrestricted_Proxy
  classification:
    cvss-metrics: CVSS:3.1/AV:N/AC:L/PR:N/UI:N/S:C/C:L/I:N/A:N
    cvss-score: 5.8
    cwe-id: CWE-441
  metadata:
    max-request: 2
    verified: true
    shodan-query: port:1080
  tags: network,socks,socks4,socks5,proxy,exposure,misconfig

tcp:
  - inputs:
      - data: "040100500101010100"
        type: hex

    host:
      - "{{Hostname}}"

    port: 1080
    exclude-ports: 80,443,8443,53
    read-size: 2

    matchers:
      - type: binary
        name: open-socks4-proxy
        part: body
        binary:
          - "005a"              # VN=0, CD=0x5A (90, request granted)

  - inputs:
      - data: "050100"
        # 05        VER=5
        # 01        NMETHODS=1
        # 00        METHOD=0x00 (no auth)
        type: hex
        read: 2
      - data: "05010001010101010050"
        type: hex
        read: 4

    host:
      - "{{Hostname}}"
    port: 1080
    exclude-ports: 80,443,8443,53

    matchers:
      - type: binary
        name: open-socks5-proxy
        part: raw
        binary:
          - "050005000001"
