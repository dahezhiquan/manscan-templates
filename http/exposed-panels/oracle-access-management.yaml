id: oracle-access-management

info:
  name: Oracle Access Management 登录面板识别（指纹识别）
  author: righettod
  severity: info
  description: |-
    检测到目标站点存在 Oracle Access Management 相关响应特征。Oracle Access Management 是数据库、ERP 或数据服务的 Web 管理入口，用于查看数据、执行查询、管理业务对象、集群或连接配置。模板请求 `/oam/pages/login.jsp`、`/` 路径，并通过页面标题或正文关键字确认该系统指纹，用于资产识别、系统盘点和暴露面梳理。
  reference:
    - https://www.oracle.com/security/identity-management/access-management/
  classification:
    cpe: cpe:2.3:a:oracle:access_manager:*:*:*:*:*:*:*:*
  metadata:
    verified: true
    max-request: 2
    vendor: oracle
    product: access_manager
    shodan-query:
      - "http.title:\"Oracle Access Management\""
      - http.title:"oracle access management"
      - http.html:"/oam/pages/css/login_page.css"
    fofa-query:
      - "title=\"Oracle Access Management\""
      - title="oracle access management"
      - body="/oam/pages/css/login_page.css"
    google-query: intitle:"oracle access management"
  tags: panel,oracle,login,detect,discovery
http:
  - method: GET
    path:
      - "{{BaseURL}}/oam/pages/login.jsp"
      - "{{BaseURL}}"

    stop-at-first-match: true
    host-redirects: true
    max-redirects: 2

    matchers-condition: and
    matchers:
      - type: word
        part: body
        words:
          - "<title>Login - Oracle Access Management"
          - "/oam/pages/images"
          - "/oam/server/"
        condition: or

    extractors:
      - type: regex
        part: body
        group: 1
        regex:
          - '(?i)Login\s+-\s+Oracle\s+Access\s+Management\s+([a-z0-9]+)</title>'
