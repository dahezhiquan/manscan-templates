id: onlyoffice-login-panel

info:
  name: ONLYOFFICE 登录面板识别（指纹识别）
  author: eremit4
  severity: info
  description: |-
    检测到目标站点存在 ONLYOFFICE 相关响应特征。ONLYOFFICE 是 AI、机器学习或 Notebook 相关平台，用于管理模型、数据集、工作区、实验、推理服务或训练任务。模板请求 `/`、`/auth.aspx` 路径，并通过页面标题或正文关键字、状态码确认该系统指纹，用于资产识别、系统盘点和暴露面梳理。
  classification:
    cpe: cpe:2.3:a:onlyoffice:onlyoffice:*:*:*:*:*:*:*:*
  metadata:
    verified: true
    max-request: 2
    vendor: onlyoffice
    product: onlyoffice
    fofa-query:
      - app="ONLYOFFICE" && (icon_hash="1928933157" || icon_hash="826083956" || icon_hash="-1380930248" || icon_hash="-285544629" || icon_hash="812741391")
      - app="onlyoffice" && (icon_hash="1928933157" || icon_hash="826083956" || icon_hash="-1380930248" || icon_hash="-285544629" || icon_hash="812741391")
  tags: panel,onlyoffice,detect,discovery
http:
  - method: GET
    path:
      - "{{BaseURL}}"
      - "{{BaseURL}}/auth.aspx"

    stop-at-first-match: true
    host-redirects: true
    max-redirects: 2
    matchers-condition: and
    matchers:
      - type: word
        part: body
        words:
          - 'ONLYOFFICE'
          - 'title="ONLYOFFICE'
          - 'content="ONLYOFFICE'
          - '/images/onlyoffice_logo/'
          - 'alt="ONLYOFFICE'
        condition: or

      - type: status
        status:
          - 200
