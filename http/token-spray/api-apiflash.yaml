id: api-apiflash

info:
  name: ApiFlash API Token 可用性校验（token喷洒）
  author: daffainfo
  severity: high
  description: |-
    平台介绍：ApiFlash API 是面向网页抓取、截图、文件转换、图像处理或内容生成的开发者 API 平台，常用于自动化采集、转换和生成外部内容。该模板用于校验提交的 ApiFlash API Token 是否仍然有效。检测逻辑会向 `api.apiflash.com/v1/urltoimage` 发起低影响 API 请求，通过查询参数中的 API Key/Token 传递 `{{token}}`，并依据响应中的 `net::ERR_NAME_NOT_RESOLVED at https://selfcontained.test` 判断凭据是否可用；命中通常表示该 Token 可被继续调用对应平台能力。
  reference:
    - https://apiflash.com/
    - https://github.com/daffainfo/all-about-apikey/tree/main/apiflash
  metadata:
    max-request: 1
  tags: token-spray,apiflash
  impact: |-
    - 攻击者可确认 Token 有效并调用平台 API，读取账户、资源、配额或业务数据。
    - 有效 Token 可能被持续滥用，造成数据泄露、配额消耗、费用增加、服务滥用或进一步横向访问。
  remediation: |-
    - 立即撤销或轮换已暴露的 API Token，并确认旧 Token 不再可用。
    - 按最小权限原则重新签发凭据，限制作用域、来源地址、项目范围和有效期。
    - 在代码仓库、CI/CD、日志和配置文件中排查泄露来源，避免 Token 再次提交或外传。
self-contained: true

http:
  - method: GET
    path:
      - "https://api.apiflash.com/v1/urltoimage?access_key={{token}}&url=https://selfcontained.test"

    matchers:
      - type: word
        part: body
        words:
          - 'net::ERR_NAME_NOT_RESOLVED at https://selfcontained.test'
