id: redis-detect

info:
  name: Redis 服务识别（指纹识别）
  author: pussycat0x
  severity: info
  description: |
    Redis 是内存键值数据库和缓存服务，常用于缓存、会话、队列和实时数据处理。该模板连接 6379,6380/TCP 并读取协议响应，通过匹配 `DENIED Redis`、`CONFIG REWRITE`、`NOAUTH Authentication` 等响应特征识别目标服务。
  classification:
    cvss-metrics: CVSS:3.1/AV:N/AC:L/PR:N/UI:N/S:U/C:N/I:N/A:N
    cwe-id: CWE-200
  metadata:
    verified: true
    max-request: 2
    shodan-query: product:"redis"
    product: redis
    vendor: redis
  tags: network,redis,detect,tcp,discovery
tcp:
  - inputs:
      - data: "*1\r\n$4\r\ninfo\r\n"

    host:
      - "{{Hostname}}"
      - "tls://{{Hostname}}"
    port: 6379,6380
    read-size: 1024

    matchers:
      - type: word
        words:
          - "DENIED Redis"
          - "CONFIG REWRITE"
          - "NOAUTH Authentication"
        condition: or
