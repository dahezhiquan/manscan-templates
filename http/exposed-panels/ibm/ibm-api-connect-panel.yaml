id: ibm-api-connect-panel

info:
  name: IBM API Connect 面板识别（指纹识别）
  author: righettod
  severity: info
  description: |-
    检测到目标站点存在 IBM API Connect 相关响应特征。IBM API Connect 是 API 管理平台，用于设计、发布、保护、分析和运营 API 服务。模板请求 `/auth/manager/sign-in/`、`/` 路径，并通过页面标题或正文关键字、状态码、DSL 条件确认该系统指纹，用于资产识别、系统盘点和暴露面梳理。
  reference:
    - https://www.ibm.com/products/api-connect/developer-portal
  metadata:
    max-request: 1
  tags: panel,ibm,api,detect,login,discovery
http:
  - method: GET
    path:
      - '{{BaseURL}}/auth/manager/sign-in/'
      - '{{BaseURL}}'

    stop-at-first-match: true
    host-redirects: true
    max-redirects: 2
    matchers-condition: and
    matchers:
      - type: dsl
        dsl:
          - 'status_code == 200 || status_code == 404'

      - type: dsl
        dsl:
          - 'contains_any(to_lower(body), "content=\"ibm api connect", "ibm api connect</title>")'
          - 'contains_all(to_lower(body), "window.apiConnectCfg", "ibm-cloud", "<title>api connect")'
        condition: or
