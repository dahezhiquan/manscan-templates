id: prowlarr-dashboard-unauth

info:
  name: Prowlarr 仪表盘 未授权
  author: ProjectDiscoveryAI
  severity: medium
  description: |
    检测到 Prowlarr 仪表盘 未授权。目标功能在未认证状态下可访问，可能暴露管理入口、业务数据、系统状态或可执行操作，需确认是否存在访问控制缺失。
  metadata:
    verified: true
    max-request: 1
    shodan-query: html:"<title>prowlarr</title>"
  tags: prowlarr,dashboard,unauth,misconfig,vuln

http:
  - method: GET
    path:
      - "{{BaseURL}}"

    host-redirects: true
    max-redirects: 2

    matchers-condition: and
    matchers:
      - type: word
        part: body
        words:
          - "<title>Prowlarr</title>"

      - type: word
        part: body
        words:
          - "Login - Prowlarr"
        negative: true

      - type: status
        status:
          - 200
