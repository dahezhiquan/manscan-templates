id: bentoml-open-redirect

info:
  name: BentoML v1.3.9 - 开放重定向漏洞（CVE-2024-12760）
  author: DhiyaneshDK
  severity: medium
  description: |-
    BentoML v1.3.9 存在安全漏洞。攻击者可通过 /ui/gradio_api/file=https://oast.me 控制跳转目标，将用户重定向到恶意站点并发起钓鱼或令牌窃取攻击。该模板通过请求 /ui/gradio_api/file=https://oast.me，并结合响应中的 (?m)^(?:Location\s*?:\s*?)(?:https?://|//)?(?:[a-zA-Z0-9\-_\ 等特征进行验证。
  impact: |-
    - 攻击者可借助可信域名发起恶意跳转，提升钓鱼、诱导登录或令牌窃取攻击的成功率。
    - 若与其他漏洞联动，开放重定向还可能被用于绕过安全校验或辅助恶意投递。
  remediation: |-
    - 尽快将 BentoML v1.3.9 升级到厂商已发布的修复版本，并结合官方公告核对受影响版本范围。
    - 对重定向目标实施域名或路径白名单校验，禁止将用户可控 URL 直接用于跳转。
  reference:
    - https://huntr.com/bounties/2a284ff6-cc6c-4a10-b72e-1bb31c842bca
  metadata:
    verified: true
    max-request: 1
    shodan-query: html:"BentoML"
  tags: gradio,redirect,oss,bentoml,vuln

http:
  - method: GET
    path:
      - "{{BaseURL}}/ui/gradio_api/file=https://oast.me"

    matchers:
      - type: regex
        part: header
        regex:
          - '(?m)^(?:Location\s*?:\s*?)(?:https?://|//)?(?:[a-zA-Z0-9\-_\.@]*)oast\.me.*$'
