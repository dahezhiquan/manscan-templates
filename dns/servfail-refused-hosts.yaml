id: servfail-refused-hosts

info:
  name: DNS SERVFAIL/REFUSED 主机发现（dns）
  author: pdteam
  severity: info
  description: |
    该模板检测 DNS 查询返回 SERVFAIL 或 REFUSED 的主机。此类响应可能表示权威服务器配置异常、解析链故障、访问受限或临时网络问题。
  classification:
    cwe-id: CWE-200
  metadata:
    max-request: 1
  tags: dns,takeover,discovery

dns:
  - name: "{{FQDN}}"
    type: A
    matchers:
      - type: word
        words:
          - "SERVFAIL"
          - "REFUSED"
