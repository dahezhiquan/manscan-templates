id: karakeep-panel

info:
  name: Karakeep 面板 - 检测（指纹识别）
  author: ChrisJr404
  severity: info
  description: |-
    检测到目标站点存在 Karakeep 相关响应特征。Karakeep 是监控、日志、分析或可观测性系统，用于展示运行指标、告警事件、日志数据和服务状态。模板请求 `/`、`/api/health`、`/api/version` 路径，并通过页面标题或正文关键字、状态码、DSL 条件确认该系统指纹，用于资产识别、系统盘点和暴露面梳理。
  reference:
    - https://github.com/karakeep-app/karakeep
    - https://docs.karakeep.app/api/karakeep-api/
  metadata:
    verified: true
    max-request: 3
    vendor: karakeep-app
    product: karakeep
    shodan-query: http.title:"Karakeep"
    fofa-query: title="Karakeep"
  tags: panel,login,karakeep,hoarder,bookmark,selfhosted,detect,discovery
flow: http(1) && http(2) && http(3)

http:
  - method: GET
    path:
      - "{{BaseURL}}"

    host-redirects: true
    max-redirects: 2

    matchers:
      - type: dsl
        dsl:
          - 'status_code == 200'
          - 'contains(to_lower(body), "<title>karakeep</title>")'
        internal: true
        condition: and

  - method: GET
    path:
      - "{{BaseURL}}/api/health"

    matchers:
      - type: dsl
        dsl:
          - 'status_code == 200'
          - 'contains(body, "\"status\":\"ok\"")'
          - 'contains(body, "\"message\":\"Web app is working\"")'
          - 'contains(content_type, "application/json")'
        condition: and

  - method: GET
    path:
      - "{{BaseURL}}/api/version"

    matchers:
      - type: dsl
        dsl:
          - 'status_code == 200'
          - 'contains(content_type, "application/json")'
          - 'contains(body, "\"version\"")'
        condition: and

    extractors:
      - type: regex
        part: body
        group: 1
        regex:
          - '"version"\s*:\s*"([^"]+)"'
