id: k8s-svc-acct-lookup-set

info:
  name: Ensure service-account-lookup set（云安全）
  author: princechaddha
  severity: medium
  description: kube-apiserver 未设置 service-account-lookup=true 时，服务账号令牌验证可能不检查对应 ServiceAccount 是否仍存在。本模板读取 kube-apiserver 启动命令，发现缺少 service-account-lookup=true 时报告。
  impact: |
    - 已删除服务账号关联的令牌可能仍被接受，增加遗留凭据被滥用风险。
    - 服务账号生命周期与令牌有效性脱节，影响访问撤销能力。
  remediation: |
    - 在 kube-apiserver 中启用 service-account-lookup=true。
    - 清理长期存在的旧版服务账号令牌，并推动使用短期 Bound ServiceAccount Token。
  reference:
    - https://kubernetes.io/docs/admin/kube-apiserver/
  metadata:
    vendor: kubernetes
    product: kubernetes
  tags: cloud,devops,kubernetes,security,devsecops,api-server,k8s-cluster-security
variables:
  argument: "service-account-lookup=true"

self-contained: true
code:
  - engine:
      - sh
      - bash
    source: |
      kubectl get pods -n kube-system -l component=kube-apiserver -o jsonpath="{.items[*].spec.containers[*].command}"

    matchers-condition: and
    matchers:
      - type: word
        words:
          - 'kube-apiserver'

      - type: word
        words:
          - "service-account-lookup=true"
        negative: true

    extractors:
      - type: dsl
        dsl:
          - '"API server configuration is missing the \"" + argument + "\" argument."'
