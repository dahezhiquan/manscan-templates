id: elfinder-version

info:
  name: elFinder 2.1.58 远程代码执行特征指纹识别（指纹识别）
  author: idealphase
  severity: critical
  description: 用于识别目标是否部署 elFinder 2.1.58 远程代码执行特征 并提取相关版本或构建信息，模板会结合页面正文、状态码、特定路径或已知端点和版本或标识提取结果进行指纹匹配。
  remediation: 建议升级到 elFinder 2.1.59 或更高版本；如暂无法升级，应确保 connector 不对未认证用户暴露。
  reference:
    - https://github.com/Studio-42/elFinder/
  classification:
    cvss-metrics: CVSS:3.0/AV:N/AC:L/PR:N/UI:N/S:C/C:H/I:H/A:H
    cvss-score: 10
    cwe-id: CWE-78
  metadata:
    max-request: 2
  tags: tech,elfinder,oss,discovery

http:
  - method: GET
    path:
      - "{{BaseURL}}/js/elfinder.min.js"
      - "{{BaseURL}}/js/elFinder.version.js"

    matchers-condition: and
    matchers:
      - type: word
        part: body
        words:
          - "elFinder - file manager for web"
          - "elFinder.prototype.version ="
        condition: or

      - type: status
        status:
          - 200

    extractors:
      - type: regex
        group: 1
        regex:
          - '\* Version (.+) \('
          - "elFinder.prototype.version = '([0-9.]+)';"
