id: messenger-phish

info:
  name: Messenger 仿冒钓鱼网站（钓鱼网站识别）
  author: rxerium
  severity: info
  description: |
    检测到疑似仿冒 Messenger 的钓鱼网站。模板在目标页面返回 200、页面内容命中 Messenger 的品牌页面特征，且当前主机不属于 messenger.com 官方域名时触发，用于识别借用 Messenger 品牌页面诱导用户信任的仿冒站点。
  reference:
    - https://messenger.com
  metadata:
    max-request: 1
  tags: phishing,messenger,osint,discovery
http:
  - method: GET
    path:
      - "{{BaseURL}}"

    host-redirects: true
    max-redirects: 2

    matchers-condition: and
    matchers:
      - type: word
        words:
          - 'Hang out anytime, anywhere&#x2014;Messenger makes it easy and fun to stay close to your favorite people'

      - type: status
        status:
          - 200

      - type: dsl
        dsl:
          - '!contains(host,"messenger.com")'
