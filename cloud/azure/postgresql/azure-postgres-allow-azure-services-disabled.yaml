id: azure-postgres-allow-azure-services-disabled
info:
  name: Azure PostgreSQL 允许 Azure 服务访问（云安全）
  author: princechaddha
  severity: high
  description: Azure Database for PostgreSQL 防火墙中的 AllowAllWindowsAzureIps 规则会允许 Azure 数据中心内的 Azure 服务访问数据库，范围可能覆盖其他租户的服务，超出最小网络信任边界。本模板枚举 PostgreSQL 服务器并查询防火墙规则，仅当规则名为 AllowAllWindowsAzureIps 且起止地址均为 0.0.0.0 时报告。
  impact: |
    - 其他租户中的受侵 Azure 服务也可能获得网络层面的连接机会，增加数据库探测、口令攻击和未授权访问风险。
    - 一旦数据库凭据泄露，过宽的 Azure 服务范围会扩大数据读取、篡改和云内横向移动的攻击面。
  remediation: |
    - 删除 AllowAllWindowsAzureIps 规则，改用明确的受信任 IP、私有网络或 Private Endpoint 控制访问来源。
    - 如业务确需 Azure 服务访问，应逐项确认服务身份和网络范围，并持续审计防火墙规则变更。
  reference:
    - https://docs.microsoft.com/en-us/azure/postgresql/concepts-firewall-rules
  metadata:
    vendor: microsoft
    product: azure-postgresql
  tags: cloud,devops,azure,microsoft,postgresql,azure-cloud-config

flow: |
  code(1);
  for (let ServerData of iterate(template.serverList)) {
    ServerData = JSON.parse(ServerData);
    set("name", ServerData.name);
    set("resourceGroup", ServerData.resourceGroup);
    code(2);
  }

self-contained: true
code:
  - engine:
      - sh
      - bash
    source: |
      az postgres server list --output json --query '[*].{"name":name,"resourceGroup":resourceGroup}'

    extractors:
      - type: json
        name: serverList
        internal: true
        json:
          - '.[]'

  - engine:
      - sh
      - bash
    source: |
      az postgres server firewall-rule list --server "$name" --resource-group "$resourceGroup" --query '[*].{"ruleName":name,"startIpAddress":startIpAddress,"endIpAddress":endIpAddress}'

    matchers:
      - type: word
        words:
          - '"ruleName": "AllowAllWindowsAzureIps"'
          - 'startIpAddress": "0.0.0.0"'
          - '"endIpAddress": "0.0.0.0"'
        condition: and

    extractors:
      - type: dsl
        dsl:
          - 'name + " in " + resourceGroup + " allows access to Azure services"'
