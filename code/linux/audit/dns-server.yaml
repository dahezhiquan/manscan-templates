id: dns-server

info:
  name: DNS Server 服务不应安装（本地基线扫描）
  author: Th3l0newolf
  severity: info
  description: |
    该模板检查本机是否安装了不必要的 DNS 解析 组件。若系统没有明确业务需求，保留该组件会增加本地基线暴露面和后续被误用的风险。
  remediation: |
    如无明确业务需求，卸载对应软件包；如必须保留，应限制访问来源并纳入补丁和审计管理。
  reference:
    - https://www.cisecurity.org/benchmark/ubuntu_linux
  metadata:
    verified: true
  tags: cis,local,cisecurity,audit,linux,ubuntu

self-contained: true

code:
  - engine:
      - bash
    args:
      - "-c"
      - |
        if dpkg-query -s bind9 &>/dev/null; then
          echo "[dns-server-check:Policy-Fail] [bind9 is installed] [CIS_FAIL]"
        else
          echo "[dns-server-check:Policy-Pass] [bind9 is not installed] [CIS_PASS]"
        fi

    matchers:
      - type: word
        name: policy-pass
        words:
          - "Policy-Pass"

      - type: word
        name: policy-fail
        words:
          - "Policy-Fail"
