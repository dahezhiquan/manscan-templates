id: spoofable-spf-records-ptr

info:
  name: 含 PTR 机制的可伪造 SPF 记录检测（dns）
  author: binaryfigments
  severity: info
  description: |
    该模板检测 SPF 记录中是否使用 PTR 机制。PTR 机制已不推荐使用，解析结果容易被滥用或伪造，可能削弱 SPF 防伪效果。
  reference:
    - https://www.digitalocean.com/community/tutorials/how-to-use-an-spf-record-to-prevent-spoofing-improve-e-mail-reliability
  classification:
    cwe-id: CWE-200
  metadata:
    max-request: 1
  tags: dns,spf,discovery

dns:
  - name: "{{FQDN}}"
    type: TXT
    matchers:
      - type: word
        words:
          - "v=spf1"
          - " ptr "
        condition: and
