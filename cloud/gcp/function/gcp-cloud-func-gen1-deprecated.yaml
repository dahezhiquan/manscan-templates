id: gcp-cloud-func-gen1-deprecated

info:
  name: Deprecated 1st Generation Google Cloud Functions（云安全）
  author: princechaddha
  severity: high
  description: Cloud Functions 第 1 代运行环境相较第 2 代在运行时能力、扩展性和安全治理能力上更受限，长期保留会增加维护成本。本模板枚举函数并检查 environment 字段，字段为空时按模板逻辑报告疑似第 1 代函数需要迁移复核。
  impact: |
    - 旧一代函数可能无法使用较新的运行时、安全配置和运维能力，增加后续升级与治理难度。
    - 长期保留旧架构函数会造成平台能力不一致，影响监控、网络和身份控制统一落地。
  remediation: |
    - 评估命中函数的触发器、运行时、权限和网络配置，按官方迁移指南迁移到 Cloud Functions 第 2 代。
    - 迁移前后验证事件触发、环境变量、密钥、服务账号和监控告警配置。
  reference:
    - https://cloud.google.com/functions/docs/migrating
  metadata:
    vendor: google
    product: cloud-functions
  tags: cloud,devops,gcp,gcloud,google-cloud-functions,gcp-cloud-config

flow: |
  code(1)
  for(let projectId of iterate(template.projectIds)){
    set("projectId", projectId)
    code(2)
    for(let functionDetail of iterate(template.functions)){
      set("functionName", functionDetail)
      code(3)
    }
  }

self-contained: true

code:
  - engine:
      - sh
      - bash
    source: |
      gcloud projects list --format="json(projectId)"

    extractors:
      - type: json
        name: projectIds
        internal: true
        json:
          - '.[].projectId'

  - engine:
      - sh
      - bash
    source: |
      gcloud functions list --project $projectId --format="json(name)"

    extractors:
      - type: json
        name: functions
        internal: true
        json:
          - '.[].name'

  - engine:
      - sh
      - bash
    source: |
      gcloud functions describe $functionName --format="json(environment)"

    matchers:
      - type: word
        words:
          - 'null'

    extractors:
      - type: dsl
        dsl:
          - '"Deprecated 1st Generation function: " + functionName + " in Project: " + projectId'
