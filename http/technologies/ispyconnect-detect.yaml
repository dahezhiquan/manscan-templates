id: ispyconnect-detect

info:
  name: iSpyConnect 指纹识别（指纹识别）
  author: arafatansari
  severity: info
  description: >-
    iSpyConnect 是视频监控和摄像头管理平台，用于接入、查看和录制网络摄像头视频。该模板通过请求目标服务并检查预设路径或首页响应、页面正文关键字、HTTP
    响应头等指纹特征，判断目标是否使用或暴露了 iSpyConnect 相关组件；命中结果仅表示指纹特征匹配，可用于资产盘点、技术栈识别和后续安全评估，不代表已确认存在可利用漏洞。
  classification:
    cpe: cpe:2.3:a:ispyconnect:ispy:*:*:*:*:*:*:*:*
  metadata:
    verified: true
    max-request: 1
    vendor: ispyconnect
    product: ispy
    shodan-query: http.html:"iSpy"
  tags: tech,ispy,discovery
http:
  - method: GET
    path:
      - '{{BaseURL}}'

    matchers-condition: or
    matchers:
      - type: word
        part: body
        words:
          - 'iSpy is running'

      - type: word
        part: header
        words:
          - 'Server: iSpy'
