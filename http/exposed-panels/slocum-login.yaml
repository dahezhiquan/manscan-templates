id: slocum-login

info:
  name: Slocum Fleet Mission Control 登录面板识别（指纹识别）
  author: pussycat0x
  severity: info
  description: Slocum Fleet Mission Control 是水下滑翔机或海洋观测设备任务控制平台，用于船队任务、遥测和设备管理。该模板请求 `/sfmc/login`，并依据 HTTP 200 状态码、页面标题、正文关键字或品牌资源特征识别目标是否部署了该系统或暴露了对应入口，适用于资产指纹确认；命中结果仅表示系统特征匹配，不代表已确认存在未授权访问或可利用漏洞。
  classification:
    cvss-metrics: CVSS:3.0/AV:N/AC:L/PR:N/UI:N/S:U/C:N/I:N/A:N
    cwe-id: CWE-200
  metadata:
    max-request: 1
  tags: panel,tech,slocum,discovery

http:
  - method: GET
    path:
      - "{{BaseURL}}/sfmc/login"

    matchers-condition: and
    matchers:
      - type: word
        words:
          - "<title>Slocum Fleet Mission Control - Login</title>"

      - type: status
        status:
          - 200
