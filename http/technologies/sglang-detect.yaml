id: sglang-detect

info:
  name: SGLang 指纹识别（指纹识别）
  author: insidetrust,hdm
  severity: info
  description: >-
    SGLang 是大语言模型服务和推理框架，用于构建高吞吐的 LLM 应用、代理和推理接口。该模板通过请求目标服务并检查预设路径或首页响应、DSL 条件等指纹特征，判断目标是否使用或暴露了
    SGLang 相关组件；命中结果仅表示指纹特征匹配，可用于资产盘点、技术栈识别和后续安全评估，不代表已确认存在可利用漏洞。
  reference:
  - https://github.com/sgl-project/sglang
  - https://docs.sglang.ai/backend/openai_api_completions.html
  metadata:
    verified: true
    max-request: 2
    vendor: sgl-project
    product: sglang
    shodan-query: http.html:"is_generation"
  tags: tech,detect,sglang,llm
http:
  - method: GET
    path:
      - "{{BaseURL}}/get_model_info"
      - "{{BaseURL}}/metrics"

    stop-at-first-match: true
    matchers-condition: or
    matchers:
      - type: dsl
        dsl:
          - 'status_code == 200'
          - 'contains_all(body, "\"model_path\"", "\"is_generation\"") || contains(body, "sglang")'
        condition: and
