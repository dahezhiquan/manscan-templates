id: langflow-detect

info:
  name: Langflow 指纹识别（指纹识别）
  author: rxerium
  severity: info
  description: >-
    Langflow 是用于构建和编排 LLM 应用工作流的可视化平台，常用于连接模型、工具、向量库和提示链。该模板通过请求目标服务并检查预设路径或首页响应、页面正文关键字、正则特征等指纹特征，判断目标是否使用或暴露了
    Langflow 相关组件；命中结果仅表示指纹特征匹配，可用于资产盘点、技术栈识别和后续安全评估，不代表已确认存在可利用漏洞。
  reference:
  - https://github.com/langflow-ai/langflow
  - https://docs.langflow.org/
  metadata:
    verified: true
    max-request: 2
    vendor: langflow-ai
    product: langflow
    shodan-query: 'http.title:"Langflow"'
  tags: tech,langflow,llm,ai,detect,discovery
http:
  - method: GET
    path:
      - "{{BaseURL}}/api/v1/version"
      - "{{BaseURL}}"

    stop-at-first-match: true

    matchers-condition: or
    matchers:
      - type: word
        part: body
        words:
          - '"package":"Langflow"'

      - type: word
        part: body
        words:
          - "<title>Langflow</title>"

    extractors:
      - type: regex
        part: body
        group: 1
        regex:
          - '"version"\s*:\s*"([0-9\.]+)"'
