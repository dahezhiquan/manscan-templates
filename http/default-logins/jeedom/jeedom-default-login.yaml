id: jeedom-default-login

info:
  name: Jeedom 默认口令登录（弱口令）
  author: ritikchaddha
  severity: high
  description: |
    该模板通过尝试 Jeedom 的默认账号口令，并依据认证成功后的响应特征判断目标是否仍在使用未修改的弱口令。若命中，攻击者可直接登录系统，进一步访问敏感信息、修改配置或执行未授权操作。
  classification:
    cpe: cpe:2.3:a:jeedom:jeedom:*:*:*:*:*:*:*:*
  metadata:
    verified: true
    max-request: 2
    vendor: jeedom
    product: jeedom
    shodan-query: title:"Jeedom"
  tags: jeedom,default-login,misconfig,vuln
variables:
  username: admin
  password: admin

http:
  - raw:
      - |
        POST /core/ajax/user.ajax.php HTTP/1.1
        Host: {{Hostname}}
        Content-Type: application/x-www-form-urlencoded; charset=UTF-8

        action=login&username={{username}}&password={{password}}&twoFactorCode=&storeConnection=0
      - |
        GET /index.php?v=d&p=dashboard HTTP/1.1
        Host: {{Hostname}}

    matchers-condition: and
    matchers:
      - type: word
        part: body_1
        words:
          - 'state":"ok'
          - 'result":'
        condition: and

      - type: word
        part: body_2
        words:
          - "logout=1"
          - "Plugins</span>"
        condition: and
