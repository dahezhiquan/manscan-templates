id: inspector2-disabled

info:
  name: Amazon Inspector v2 未启用（云安全）
  author: DhiyaneshDK
  severity: medium
  description: Amazon Inspector v2 提供 EC2、ECR 和 Lambda 等工作负载的持续漏洞与暴露面评估；未启用时，账号缺少托管漏洞扫描和优先级评估能力。该模板调用 batch-get-account-status，并在账号状态包含 DISABLED 时命中。
  impact: |
    - 系统漏洞、容器镜像漏洞或函数依赖风险可能长期未被发现和修复。
    - 安全团队缺少统一的漏洞发现、严重性排序和修复跟踪入口。
  remediation: |
    - 在目标区域启用 Amazon Inspector v2，并按组织结构配置委派管理员和成员账号。
    - 将 Inspector findings 接入 Security Hub、工单或漏洞管理流程，并对高危发现设置修复 SLA。
  reference:
    - https://www.trendmicro.com/cloudoneconformity-staging/knowledge-base/aws/Inspector2/enable-amazon-inspector2.html
    - https://aws.amazon.com/about-aws/whats-new/2021/11/amazon-inspector-continual-vulnerability-management/
  metadata:
    vendor: amazon
    product: inspector2
  tags: cloud,devops,aws,amazon,inspector2,aws-cloud-config
variables:
  region: "us-west-2"

self-contained: true

code:
  - engine:
      - sh
      - bash

    source: |
      aws inspector2 batch-get-account-status --region $region --query 'accounts[*].[accountId,state.status]' --output json

    matchers:
      - type: word
        words:
          - '"DISABLED"'

    extractors:
      - type: dsl
        dsl:
          - '"Amazon Inspector 2 " + region + " is Disabled"'
