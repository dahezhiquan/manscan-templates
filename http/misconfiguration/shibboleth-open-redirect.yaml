id: shibboleth-open-redirect

info:
  name: Shibboleth SSO 开放重定向
  author: aushack
  severity: medium
  description: |
    该模板用于核查 Shibboleth SSO 开放重定向。该类问题通常源于跳转参数、回调地址或代理转发逻辑未限制目标域名，导致用户可被重定向到非预期站点。模板会向目标发送探测请求，并依据请求 `/Shibboleth.sso/Logout?return=https://{{randstr}}.interact.sh`、状态码 302 等证据确认目标是否存在该配置问题。
  impact: |
    - 攻击者可构造可信域名下的跳转链接，用于钓鱼、凭据诱导或绕过部分安全校验。
    - 在单点登录、邮件通知或自动发现流程中，开放重定向可能扩大社工和会话劫持风险。
  remediation: |
    - 对重定向目标使用严格的同源或白名单校验，禁止直接信任用户输入的 URL。
    - 避免在认证、回调和自动发现流程中返回任意外部跳转。
    - 记录异常跳转参数并监控被滥用的重定向链接。
  reference:
    - https://shibboleth.atlassian.net/wiki/spaces/SP3/pages/2065334342/Sessions
  classification:
    cvss-metrics: CVSS:3.1/AV:N/AC:L/PR:N/UI:R/S:C/C:L/I:L/A:N
    cvss-score: 6.1
    cwe-id: CWE-601
  metadata:
    max-request: 1
    verified: true
    shodan-query: html:"Shibboleth"
  tags: redirect,shibboleth,misconfig,vuln

http:
  - method: GET
    path:
      - "{{BaseURL}}/Shibboleth.sso/Logout?return=https://{{randstr}}.interact.sh"

    matchers-condition: and
    matchers:
      - type: regex
        part: header
        regex:
          - '(?m)^(?:Location\s*?:\s*?)(?:https?:\/\/|\/\/|\/\\\\|\/\\)(?:[a-zA-Z0-9\-_\.@]*)interact\.sh\/?(\/|[^.].*)?$' # https://regex101.com/r/L403F0/1

      - type: status
        status:
          - 302
