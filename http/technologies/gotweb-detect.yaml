id: gotweb-detect

info:
  name: GotWeb 指纹识别（指纹识别）
  author: lu4nx
  severity: info
  description: |
    用于识别目标是否部署 GotWeb 并提取相关版本或构建信息，模板会结合页面正文、状态码、特定路径或已知端点和版本或标识提取结果进行指纹匹配。
  metadata:
    verified: true
    max-request: 1
    zoomeye-query: app="GotWeb"
  tags: tech,got,gotweb,discovery

http:
  - method: GET
    path:
      - "{{BaseURL}}"

    matchers-condition: and
    matchers:
      - type: word
        part: body
        words:
          - <link rel="stylesheet" type="text/css" href="/gotweb.css" />

      - type: status
        status:
          - 200
