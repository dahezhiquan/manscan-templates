id: ec2-unrestricted-redis
info:
  name: EC2 安全组对公网开放 Redis 端口（云安全）
  author: princechaddha
  severity: critical
  description: EC2 安全组对公网开放 Redis 端口是一类缓存和键值存储服务暴露风险，TCP 6379 面向任意来源可能导致未授权读取、写入或命令执行类滥用。Redis 通常应仅在私有网络中被应用访问，并启用认证和加密。模板通过 `describe-security-groups` 筛选 6379 端口且来源为 `0.0.0.0/0` 的入站规则，并输出命中的安全组 ID。
  impact: |
    - Redis 中的会话、队列、缓存数据或配置可能被未授权读取和篡改。
    - 暴露 Redis 服务可能被用于写入恶意数据、破坏业务状态或进一步控制主机。
  remediation: |
    - 移除面向公网的 6379 端口入站规则，仅允许应用私有网段访问。
    - 启用 Redis 认证、TLS、命令访问控制和最小权限网络隔离。
  reference:
    - https://docs.aws.amazon.com/AWSEC2/latest/UserGuide/ec2-security-groups.html
  metadata:
    vendor: amazon
    product: ec2
  tags: cloud,devops,aws,amazon,ec2,aws-cloud-config

variables:
  region: "us-east-1"

self-contained: true
code:
  - engine:
      - sh
      - bash
    source: |
      aws ec2 describe-security-groups --region $region --filters Name=ip-permission.from-port,Values=6379 Name=ip-permission.to-port,Values=6379 Name=ip-permission.cidr,Values='0.0.0.0/0' --output json --query 'SecurityGroups[*].GroupId'

    extractors:
      - type: json
        name: securitygroup
        internal: true
        json:
          - '.[]'

      - type: dsl
        dsl:
          - 'securitygroup + " security group(s) alows unrestricted access (0.0.0.0/0 or ::/0) on TCP port 6379"'
