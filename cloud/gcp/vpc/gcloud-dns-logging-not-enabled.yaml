id: gcloud-dns-logging-not-enabled

info:
  name: Enable Cloud DNS 日志记录 的VPC Networks（云安全）
  author: princechaddha
  severity: medium
  description: Cloud DNS logging 可记录 VPC 内 DNS 查询，帮助发现恶意域名访问、数据外传和异常服务发现行为。本模板枚举网络关联的 DNS policy，并检查 enableLogging，值为 False 时报告 DNS 日志未启用。
  impact: |
    - 恶意域名解析、命令控制通信或异常服务发现请求可能缺少检测证据。
    - 网络事件调查时无法基于 DNS 查询还原工作负载访问意图和时间线。
  remediation: |
    - 为关键 VPC 的 DNS policy 启用 DNS logging，并将日志接入集中分析平台。
    - 配置可疑域名、异常查询量和非常规解析来源告警。
  reference:
    - https://cloud.google.com/dns/docs/policies
  metadata:
    vendor: google
    product: cloud-dns
  tags: cloud,devops,gcp,gcloud,google-cloud-dns,logging,security,gcp-cloud-config

flow: |
  code(1)
  for(let projectId of iterate(template.projectIds)){
    set("projectId", projectId)
    code(2)
    for(let network of iterate(template.networks)){
      set("networkName", network)
      code(3)
      for(let dnsPolicy of iterate(template.dnsPolicies)){
        set("dnsPolicy", dnsPolicy.name)
        code(4)
      }
    }
  }

self-contained: true

code:
  - engine:
      - sh
      - bash
    source: |
      gcloud projects list --format="json(projectId)"

    extractors:
      - type: json
        name: projectIds
        internal: true
        json:
          - '.[].projectId'

  - engine:
      - sh
      - bash
    source: |
      gcloud compute networks list --project $projectId --format="json(name)"

    extractors:
      - type: json
        name: networks
        internal: true
        json:
          - '.[].name'

  - engine:
      - sh
      - bash
    source: |
      gcloud dns policies list --project $projectId --format="json(name)" --filter="networks[].networkUrl:$networkName"

    extractors:
      - type: json
        name: dnsPolicies
        internal: true
        json:
          - '.[]'

  - engine:
      - sh
      - bash
    source: |
      gcloud dns policies describe $dnsPolicy --project $projectId --format="json(enableLogging)" | jq -r '.enableLogging // "null"'

    matchers:
      - type: word
        words:
          - 'False'

    extractors:
      - type: dsl
        dsl:
          - '"Cloud DNS logging is not enabled for the DNS policy " + dnsPolicy + " in network " + networkName + " in project " + projectId'
