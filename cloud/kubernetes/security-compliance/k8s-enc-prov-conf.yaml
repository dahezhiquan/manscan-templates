id: k8s-enc-prov-conf

info:
  name: Ensure that encryption providers are configured（云安全）
  author: princechaddha
  severity: medium
  description: kube-apiserver 未配置 encryption-provider-config 时，Secret 等敏感资源可能以默认方式存储在 etcd 中，缺少静态加密保护。本模板读取 kube-apiserver 启动命令，发现缺少 encryption-provider-config 参数时报告。
  impact: |
    - etcd 备份或磁盘被访问时，攻击者可能直接读取 Kubernetes Secret 等敏感数据。
    - 缺少静态加密会影响敏感数据保护和合规要求。
  remediation: |
    - 配置 encryption-provider-config，并选择 Kubernetes 官方推荐的加密提供者和密钥管理方式。
    - 完成配置后轮换或重写已有 Secret，确保历史数据也被加密。
  reference:
    - https://kubernetes.io/docs/tasks/administer-cluster/encrypt-data/
  metadata:
    vendor: kubernetes
    product: kubernetes
  tags: cloud,devops,kubernetes,devsecops,encryption,k8s-cluster-security
variables:
  argument: "encryption-provider-config"

self-contained: true
code:
  - engine:
      - sh
      - bash
    source: |
      kubectl get pods -n kube-system -l component=kube-apiserver -o jsonpath="{.items[*].spec.containers[*].command}"

    matchers-condition: and
    matchers:
      - type: word
        words:
          - 'kube-apiserver'

      - type: word
        words:
          - "encryption-provider-config"
        negative: true

    extractors:
      - type: dsl
        dsl:
          - '"API server configuration is missing the " + argument + " argument"'
