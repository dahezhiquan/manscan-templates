id: netstat-service-expose

info:
  name: Netstat 服务暴露（服务漏洞）
  author: pussycat0x
  severity: low
  description: |
    该模板检测 Netstat 服务是否对外暴露。该类历史服务可能泄露网络状态与系统信息。
  impact: |
    - 远程用户可能直接获取网络连接、服务状态或系统运行细节。
    - 这些信息可被用于资产画像、攻击面分析或后续定向利用。
  metadata:
    verified: true
    max-request: 1
    zoomeye-query: port="15" && "netstat"
  tags: netsat,network,js,tcp,vuln

javascript:
  - pre-condition: |
      isPortOpen(Host,Port);
    code: |
      let packet = bytes.NewBuffer();
      const c = require("nuclei/net");
      const cmd = "00000000"
      packet.WriteString(cmd)
      let conn = c.Open('tcp', `${Host}:${Port}`);
      conn.SendHex(packet.Hex());
      const result = conn.RecvString();
      result;

    args:
      Host: "{{Host}}"
      Port: 15

    matchers:
      - type: dsl
        dsl:
          - "success == true"
          - contains(response, "Active Internet connections")
        condition: and

    extractors:
      - type: dsl
        dsl:
          - response
