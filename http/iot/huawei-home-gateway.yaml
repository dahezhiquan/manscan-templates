id: huawei-home-gateway

info:
  name: HUAWEI HG658d 家庭网关面板（IOT）
  author: dhiyaneshDK
  severity: medium
  description: |
    检测到 HUAWEI Home Gateway HG658d 管理面板。该入口暴露可能泄露家庭网关或小型网络路由设备的远程管理界面。
  impact: |
    - 网关、路由器或 VPN 管理入口暴露会增加口令攻击、配置探测和设备接管风险。
    - 网络边界设备一旦被控制，可能导致流量劫持、访问策略篡改或内网横向移动。
  remediation: |
    - 将网络设备管理入口限制在可信管理网段或 VPN 内，禁止公网暴露。
    - 修改默认凭据，启用强认证和登录失败限制。
    - 定期升级固件并审计路由、DNS、端口转发和 VPN 配置变更。
  metadata:
    max-request: 1
    shodan-query: http.title:"HUAWEI Home Gateway HG658d"
  tags: iot,huawei,discovery

http:
  - method: GET
    path:
      - "{{BaseURL}}"

    matchers-condition: and
    matchers:
      - type: word
        words:
          - '<title>HUAWEI Home Gateway HG658d</title>'

      - type: status
        status:
          - 200
