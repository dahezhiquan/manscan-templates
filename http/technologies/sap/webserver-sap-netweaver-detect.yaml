id: webserver-sap-netweaver-detect

info:
  name: SAP NetWeaver ICM 指纹识别（指纹识别）
  author: randomstr1ng,righettod
  severity: info
  description: >-
    SAP NetWeaver Internet Communication Manager 是 SAP 应用服务器的 HTTP/HTTPS 通信组件。该模板通过请求目标服务并检查预设路径或首页响应、HTTP
    响应头、页面正文关键字等指纹特征，判断目标是否使用或暴露了 SAP NetWeaver ICM 相关组件；命中结果仅表示指纹特征匹配，可用于资产盘点、技术栈识别和后续安全评估，不代表已确认存在可利用漏洞。
  metadata:
    verified: true
    max-request: 1
    shodan-query: http.favicon.hash:-266008933
    fofa-query:
    - "sap-server:"
    - icon_hash=-266008933
    product: content_server
    vendor: sap
  tags: sap,webserver,tech,detect,discovery
http:
  - method: GET
    path:
      - "{{BaseURL}}"

    redirects: true
    max-redirects: 2
    matchers-condition: or
    matchers:
      - type: word
        part: header
        words:
          - "sap-server:"
          - "SAP NetWeaver Application Server"
        condition: or
        case-insensitive: true

      - type: word
        part: body
        words:
          - "SAP NetWeaver Application Server"
          - "SAP NetWeaver Developer Studio"
          - "SAP Management Console"
        condition: or

    extractors:
      - type: kval
        part: header
        kval:
          - "server"
