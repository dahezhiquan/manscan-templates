id: freescout-panel

info:
  name: FreeScout 面板识别（暴露面识别）
  author: s4e-io
  severity: info
  description: |
    该模板通过识别 FreeScout 面板、控制台或管理界面的页面特征，判断目标是否暴露了对应服务入口。若命中，说明该后台或运维界面对外可访问，可用于资产识别与暴露面排查。
  reference:
    - https://github.com/freescout-help-desk/freescout
  metadata:
    verified: true
    max-request: 1
    fofa-query: app="FreeScout"
  tags: panel,login,freescout,detect,discovery

http:
  - method: GET
    path:
      - "{{BaseURL}}/login"

    matchers:
      - type: dsl
        dsl:
          - 'contains(body, "<title>FreeScout</title>")'
          - 'status_code == 200'
        condition: and
