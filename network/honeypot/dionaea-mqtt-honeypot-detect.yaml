id: dionaea-mqtt-honeypot-detect

info:
  name: Dionaea MQTT 蜜罐识别（服务漏洞）
  author: UnaPibaGeek
  severity: info
  description: |
    该模板通过异常协议响应或默认特征识别目标是否为 Dionaea MQTT Honeypot 蜜罐。
  metadata:
    verified: true
    max-request: 1
    vendor: dionaea
    product: mqtt
    shodan-query:
      - product:"MQTT"
      - product:"mqtt"
  tags: dionaea,mqtt,honeypot,ir,cti,network,tcp,discovery
tcp:
  - inputs:
      - data: "101000044d5154540502003c032100140000"
        type: hex

    host:
      - "{{Hostname}}"
    port: 1883
    read-size: 1024

    matchers:
      - type: binary
        binary:
          - "20020000"
