id: sonicwall-sslvpn-panel

info:
  name: SonicWall Virtual Office SSL VPN 登录面板识别（暴露面识别）
  author: PR3R00T,johnk3r
  severity: info
  description: 该模板通过识别 SonicWall Virtual Office SSL VPN 登录入口的页面标题、特征文本或重定向行为，判断目标是否暴露了对应的认证界面。若命中，说明该登录面板对外可访问，可用于暴露面梳理与后续安全评估。
  classification:
    cvss-metrics: CVSS:3.0/AV:N/AC:L/PR:N/UI:N/S:U/C:N/I:N/A:N
    cwe-id: CWE-200
    cpe: cpe:2.3:o:sonicwall:sonicos:*:*:*:*:*:*:*:*
  metadata:
    max-request: 1
    vendor: sonicwall
    product: sonicos
    google-query: inurl:"auth.html" intitle:"sonicwall"
  tags: panel,sonicwall,discovery

http:
  - method: GET
    path:
      - "{{BaseURL}}/cgi-bin/welcome"

    matchers-condition: or
    matchers:
      - type: word
        words:
          - "<title>Virtual Office</title>"

      - type: word
        part: header
        words:
          - "SonicWALL SSLVPN Web Server"
          - "SonicWALL SSL-VPN Web Server"
        condition: or
