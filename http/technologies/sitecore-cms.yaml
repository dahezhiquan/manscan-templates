id: sitecore-cms

info:
  name: Sitecore CMS 指纹识别（指纹识别）
  author: RandomDhiraj
  severity: info
  description: |
    用于识别目标是否使用 Sitecore CMS，模板会结合 HTTP 响应头、页面标题、状态码和特定路径或已知端点匹配内容管理系统相关指纹。
  reference:
    - https://www.sitecore.com
  classification:
    cpe: cpe:2.3:a:sitecore:cms:*:*:*:*:*:*:*:*
  metadata:
    verified: true
    max-request: 1
    vendor: sitecore
    product: cms
    shodan-query: title:"sitecore"
  tags: cms,sitecore,tech,discovery

http:
  - method: GET
    path:
      - "{{BaseURL}}/-/media/doo-doo.ashx"

    host-redirects: true

    matchers-condition: and
    matchers:
      - type: regex
        part: header
        regex:
          - "Location: /sitecore/service/notfound.aspx"

      - type: status
        status:
          - 302
