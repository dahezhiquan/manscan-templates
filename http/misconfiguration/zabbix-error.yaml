id: zabbix-error

info:
  name: Zabbix 错误页面暴露
  author: dhiyaneshDK
  severity: low
  description: |-
    该模板用于核查 Zabbix 错误页面暴露。Zabbix 错误页面对外暴露时，可能泄露系统状态、页面路径、刷新行为或部署痕迹。模板访问 目标入口，并根据 Zabbix 错误页标题和状态码确认暴露。
  classification:
    cvss-metrics: CVSS:3.1/AV:N/AC:L/PR:N/UI:N/S:U/C:N/I:N/A:N
    cvss-score: 0
    cwe-id: CWE-200
    cpe: cpe:2.3:a:zabbix:zabbix_server:*:*:*:*:*:*:*:*
  metadata:
    max-request: 1
    shodan-query: http.title:"Warning [refreshed every 30 sec.]"
    product: zabbix_server
    vendor: zabbix
  tags: zabbix,misconfig,vuln
  impact: |-
    - 攻击者可确认监控系统存在并收集产品部署线索。
    - 错误页信息可辅助后续登录入口探测、版本识别或弱口令攻击。
  remediation: |-
    - 将 Zabbix Web 前端限制在内网或可信来源。
    - 统一错误页面展示，避免向外部暴露产品和运行细节。
    - 更新 Zabbix 并启用强认证、多因素认证和访问审计。
http:
  - method: GET
    path:
      - '{{BaseURL}}'

    matchers-condition: and
    matchers:
      - type: word
        words:
          - '<title>Warning [refreshed every 30 sec.]</title>'

      - type: status
        status:
          - 200
