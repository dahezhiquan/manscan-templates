id: gcloud-vm-disk-csek-disabled

info:
  name: VM Disk 加密 使用Customer-Supplied Keys未启用（云安全）
  author: princechaddha
  severity: high
  description: Compute Engine 磁盘未使用 Customer-Supplied Encryption Key 时，磁盘加密密钥不由客户自行提供和保管。本模板枚举实例及其磁盘，并检查 diskEncryptionKey.sha256 是否为 null，命中时报告磁盘未启用 CSEK 加密。
  impact: |
    - 对要求客户自行掌握密钥材料的工作负载，未使用 CSEK 会降低密钥自主控制和隔离能力。
    - 磁盘数据无法通过客户保管密钥实现独立的密钥停用、销毁和访问控制。
  remediation: |
    - 对需要客户自带密钥的磁盘使用 CSEK 创建或迁移，并建立密钥生成、保存、轮换和恢复流程。
    - 若组织优先使用 Cloud KMS 管理密钥，可改用 CMEK 并记录 CSEK 不适用的例外依据。
  reference:
    - https://cloud.google.com/compute/docs/disks/customer-supplied-encryption
  metadata:
    vendor: google
    product: compute-engine
  tags: cloud,devops,gcp,gcloud,compute,encryption,csek,security,gcp-cloud-config

flow: |
  code(1)
  for(let projectId of iterate(template.projectIds)){
    set("projectId", projectId)
    code(2)
    for(let instance of iterate(template.instances)){
      instance = JSON.parse(instance)
      set("instanceName", instance.name)
      set("zone", instance.zone)
      code(3)
      for(let disk of iterate(template.disks)){
        set("diskName", disk)
        code(4)
      }
    }
  }

self-contained: true

code:
  - engine:
      - sh
      - bash
    source: |
      gcloud projects list --format="json(projectId)"

    extractors:
      - type: json
        name: projectIds
        internal: true
        json:
          - '.[].projectId'

  - engine:
      - sh
      - bash
    source: |
      gcloud compute instances list --project $projectId --format="json[](name,zone.basename())"

    extractors:
      - type: json
        name: instances
        internal: true
        json:
          - '.[]'

  - engine:
      - sh
      - bash
    source: |
      gcloud compute instances describe $instanceName --zone $zone --project $projectId --format="json(disks[].deviceName)"

    extractors:
      - type: json
        name: disks
        internal: true
        json:
          - '.disks[].deviceName'

  - engine:
      - sh
      - bash
    source: |
      gcloud compute disks describe $diskName --zone $zone --project $projectId --format="json(diskEncryptionKey)" | jq '.sha256 // "null"'

    matchers:
      - type: word
        words:
          - "null"

    extractors:
      - type: dsl
        dsl:
          - '"Disk " + diskName + " attached to instance " + instanceName + " in zone " + zone + " of project " + projectId + " has Customer-Supplied Encryption Keys (CSEKs) disabled"'
