id: appsmith-info-disclosure

info:
  name: Appsmith <= v1.97 - 信息泄露漏洞
  author: ritikchaddha
  severity: medium
  description: Appsmith <= v1.97 的实例管理 API 端点可在未认证情况下访问，攻击者可借此获取许可证计划、实例 ID、认证提供方、功能开关及配置元数据等敏感信息。
  impact: |
    - 攻击者可获取系统配置、用户信息、节点信息或其他敏感元数据。
    - 这些信息可显著降低后续定向攻击、撞库或暴力破解的门槛。
  remediation: |
    - 为敏感接口补充鉴权与最小化返回策略，避免未授权用户获取配置、账户或节点信息。
    - 审核日志、错误页和调试接口的输出内容，关闭不必要的调试或管理入口。
  reference:
    - https://github.com/appsmithorg/appsmith/security/advisories/GHSA-qvvc-prjx-f85j
  classification:
    cvss-metrics: CVSS:3.1/AV:N/AC:L/PR:N/UI:N/S:U/C:L/I:N/A:N
    cvss-score: 4.3
    cve-id: CVE-2026-34847
    cwe-id: CWE-200
  metadata:
    verified: true
    max-request: 1
    vendor: appsmith
    product: appsmith
    shodan-query: http.title:"Appsmith"
    fofa-query: title="Appsmith"
  tags: appsmith,disclosure,exposure

http:
  - method: GET
    path:
      - "{{BaseURL}}/api/v1/consolidated-api/view"
      - "{{BaseURL}}/api/v1/users/features"
      - "{{BaseURL}}/api/v1/tenants/current"

    matchers-condition: and
    matchers:
      - type: word
        part: body
        words:
          - '{"responseMeta":{'
          - 'status":200,"success":true'
        condition: and

      - type: word
        part: content_type
        words:
          - 'application/json'
