id: cloudtrail-data-events
info:
  name: CloudTrail S3 数据事件日志未启用（云安全）
  author: princechaddha
  severity: low
  description: CloudTrail 未记录 S3 数据事件是一类对象级审计缺失风险，S3 对象读取、写入和删除等数据面操作可能不会被纳入审计。对于存放敏感数据的桶，缺少数据事件会削弱泄露排查和对象变更追踪能力。模板枚举 trail 名称后调用 `get-event-selectors`，读取 `EventSelectors[*].DataResources[]`，当返回为空数组时判定未配置数据事件记录。
  impact: |
    - S3 对象级读取、写入或删除等操作可能不会进入 CloudTrail 审计视图。
    - 发生数据泄露或异常对象操作时，取证人员可能缺少关键访问链路和调用主体证据。
  remediation: |
    - 为包含敏感数据或关键业务数据的 S3 存储桶启用 CloudTrail 数据事件记录。
    - 将数据事件日志集中投递到受控日志账户或安全湖，并结合告警规则监控高风险对象操作。
  reference:
    - https://docs.aws.amazon.com/awscloudtrail/latest/userguide/logging-data-events-with-cloudtrail.html
  metadata:
    max-request: 2
    vendor: amazon
    product: cloudtrail
  tags: cloud,devops,aws,amazon,s3,cloudtrail,aws-cloud-config
variables:
  region: "ap-south-1"

flow: |
  code(1)
  for(let CloudTrail of iterate(template.cloudtrailname)){
    set("trail", CloudTrail)
    code(2)
  }

self-contained: true
code:
  - engine:
      - sh
      - bash
    source: |
      aws cloudtrail list-trails --region $region --query 'Trails[*].Name' --output json

    extractors:
      - type: json
        name: cloudtrailname
        internal: true
        json:
          - '.[]'

  - engine:
      - sh
      - bash
    source: |
         aws cloudtrail get-event-selectors --region $region --trail-name $trail --query 'EventSelectors[*].DataResources[]'

    matchers:
      - type: word
        words:
          - "[]"

    extractors:
      - type: dsl
        dsl:
          - '"CloudTrail trail" + trail + " is not configured to capture resource operations performed on or within an AWS cloud resource"'
