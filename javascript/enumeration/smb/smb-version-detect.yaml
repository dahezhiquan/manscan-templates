id: smb-version-detect

info:
  name: SMB 版本识别（服务漏洞）
  author: pussycat0x
  severity: info
  description: |
    该模板识别目标 SMB 协议版本，用于判断兼容性与潜在历史漏洞面。
  metadata:
    max-request: 1
    shodan-query: "port:445"
    product: dionaea
    vendor: dionaea
  tags: js,network,smb,enum,discovery

javascript:
  - pre-condition: |
      isPortOpen(Host,Port);
    code: |
      let m = require("nuclei/smb");
      let c = new m.SMBClient();
      let response = c.ConnectSMBInfoMode(Host, Port);
      Export(response);

    args:
      Host: "{{Host}}"
      Port: "445"

    extractors:
      - type: json
        name: smb-version
        json:
          - '.Version.VerString'
