id: papercut-ng-panel

info:
  name: PaperCut NG 面板识别（指纹识别）
  author: ritikchaddha
  severity: info
  description: |-
    PaperCut NG 是打印管理平台，用于打印配额、审计、队列和设备策略管理。该模板请求 `/user` 路径，并依据 HTTP 200 状态码、页面标题、正文关键字或品牌资源特征识别目标是否部署了该系统或暴露了对应入口，适用于资产指纹确认；命中结果仅表示系统特征匹配，不代表已确认存在未授权访问或可利用漏洞。
  classification:
    cvss-metrics: CVSS:3.0/AV:N/AC:L/PR:N/UI:N/S:U/C:N/I:N/A:N
    cwe-id: CWE-200
    cpe: cpe:2.3:a:papercut:papercut_ng:*:*:*:*:*:*:*:*
  metadata:
    verified: true
    max-request: 1
    vendor: papercut
    product: papercut_ng
    google-query:
    - html:'content="PaperCut'
    - html:'content="papercut'
    shodan-query:
    - product:"PaperCut MF"
    - title:"PaperCut Login"
    - http.favicon.hash:-1142586156
    - http.html:'content="papercut'
    - cpe:"cpe:2.3:a:papercut:papercut_ng"
    - http.html:"content=\"papercut\""
    fofa-query:
    - icon_hash="-1142586156"
    - title="PaperCut Login"
    - body='content="papercut'
    - body="content=\"papercut\""
    zoomeye-query: app:"PaperCut"
  tags: panel,papercut,detect,papercut-ng,discovery

http:
  - method: GET
    path:
      - "{{BaseURL}}/user"

    host-redirects: true
    max-redirects: 2

    matchers-condition: and
    matchers:
      - type: word
        part: body
        words:
          - 'content="PaperCut'
          - "<title>PaperCut Login"
        condition: or

      - type: status
        status:
          - 200

    extractors:
      - type: regex
        name: build
        group: 1
        regex:
          - "\\/css\\/style\\.css\\?(\\d+)papercut-mf"
