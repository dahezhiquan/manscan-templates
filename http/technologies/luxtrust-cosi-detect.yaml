id: luxtrust-cosi-detect

info:
  name: LuxTrust COSI 指纹识别（指纹识别）
  author: righettod
  severity: info
  description: >-
    LuxTrust COSI 是电子签名和身份信任相关平台，用于在线签署、认证和可信服务流程。该模板通过请求目标服务并检查预设路径或首页响应、DSL 条件等指纹特征，判断目标是否使用或暴露了
    LuxTrust COSI 相关组件；命中结果仅表示指纹特征匹配，可用于资产盘点、技术栈识别和后续安全评估，不代表已确认存在可利用漏洞。
  reference:
  - https://luxtrust.com/en/professionals/our-digital-solutions/sign-electronically
  metadata:
    max-request: 1
    verified: true
  tags: panel,luxtrust,detect,discovery
http:
  - method: GET
    path:
      - "{{BaseURL}}/web/thanks"

    matchers:
      - type: dsl
        dsl:
          - 'status_code == 200'
          - 'contains_all(to_lower(body), "plateforme de signature", "esign-web")'
        condition: and
