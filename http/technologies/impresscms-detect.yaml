id: impresscms-detect

info:
  name: ImpressCMS 指纹识别（指纹识别）
  author: princechaddha
  severity: info
  description: >-
    ImpressCMS 是 PHP 内容管理系统，用于构建社区、门户和内容网站。该模板通过请求目标服务并检查预设路径或首页响应、正则特征、状态码等指纹特征，判断目标是否使用或暴露了
    ImpressCMS 相关组件；命中结果仅表示指纹特征匹配，可用于资产盘点、技术栈识别和后续安全评估，不代表已确认存在可利用漏洞。
  reference:
  - https://github.com/ImpressCMS
  metadata:
    max-request: 1
  tags: tech,impresscms,discovery
http:
  - method: GET
    path:
      - "{{BaseURL}}"

    matchers-condition: and
    matchers:
      - type: regex
        regex:
          - '(?i)(ImpressCMS)'

      - type: status
        status:
          - 200
