id: linshare-panel

info:
  name: LinShare 登录面板识别（指纹识别）
  author: righettod
  severity: info
  description: 该模板通过识别 LinShare 登录入口的页面标题、特征文本或重定向行为，判断目标是否暴露了对应的认证界面。若命中，说明该登录面板对外可访问，可用于暴露面梳理与后续安全评估。
  reference:
    - https://www.linshare.org/
    - https://github.com/linagora/linshare
  metadata:
    verified: true
    max-request: 3
    shodan-query: http.title:"LinShare"
  tags: panel,linshare,login,detect,discovery

http:
  - method: GET
    path:
      - "{{BaseURL}}"
      - "{{BaseURL}}/login"
      - "{{BaseURL}}/new/login"

    stop-at-first-match: true
    host-redirects: true
    max-redirects: 2

    matchers:
      - type: dsl
        dsl:
          - 'status_code == 200'
          - 'contains_any(body, "<title>LinShare", "x-ng-app=\"linshareAdminApp")'
        condition: and
