id: jeecg-boot-detect

info:
  name: Jeecg-Boot 指纹识别（指纹识别）
  author: pikpikcu
  severity: info
  description: >-
    Jeecg-Boot 是基于 Spring Boot 和 Vue 的低代码开发平台，用于快速构建企业后台和管理系统。该模板通过请求目标服务并检查预设路径或首页响应、页面正文关键字等指纹特征，判断目标是否使用
    Jeecg-Boot；命中结果仅表示指纹特征匹配，可用于资产盘点、技术栈识别和后续安全评估，不代表已确认存在可利用漏洞。
  reference:
  - http://www.jeecg.com/
  classification:
    cpe: cpe:2.3:a:jeecg:jeecg_boot:*:*:*:*:*:*:*:*
  metadata:
    max-request: 2
    vendor: jeecg
    product: jeecg_boot
    fofa-query: title="Jeecg-Boot"
  tags: jeecg-boot,tech,discovery
http:
  - method: GET
    path:
      - "{{BaseURL}}"
      - "{{BaseURL}}/jeecg-boot/"

    stop-at-first-match: true

    matchers-condition: and
    matchers:
      - type: word
        part: body
        words:
          - "Jeecg-Boot"
