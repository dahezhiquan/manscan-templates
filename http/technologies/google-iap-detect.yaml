id: google-iap-detect

info:
  name: Google 身份感知代理（IAP）检测（指纹识别）
  author: davidfegyver
  severity: info
  description: |-
    检测目标是否受到 Google 身份感知代理（IAP）保护。IAP 为运行在 Google Cloud 上的服务提供应用层访问控制。当 IAP 拦截到未认证请求时，会设置 X-Goog-Iap-Generated-Response 请求头并将请求重定向至 Google OAuth。随后发出的第二次请求跟随重定向进入同意页面，并从中提取 OAuth client_id、应用所有者、联系邮箱及显示名称。
  reference:
    - https://cloud.google.com/iap/docs/concepts-overview
    - https://cloud.google.com/iap/docs/query-parameters-and-headers-howto#detecting_responses
  classification:
    cvss-metrics: CVSS:3.0/AV:N/AC:L/PR:N/UI:N/S:U/C:N/I:N/A:N
    cwe-id: CWE-200
  metadata:
    verified: true
    max-request: 2
    vendor: google
    product: identity-aware-proxy
    shodan-query: "X-Goog-Iap-Generated-Response"
    fofa-query: header="X-Goog-Iap-Generated-Response"
  tags: tech,google,iap,cloud,identity,proxy,discovery

flow: http(1) && http(2)

http:
  - method: GET
    path:
      - "{{BaseURL}}"

    redirects: true
    max-redirects: 3

    extractors:
      - type: regex
        part: body
        name: email
        internal: true
        regex:
          - "key:\\s*'ds:1'[^;]*data:\\s*\\[[^,]+,[^,]+,[^,]+,\\s*\"([^\"]+)\""
        group: 1

  - method: GET
    path:
      - "{{BaseURL}}"

    matchers:
      - type: word
        part: header
        words:
          - "X-Goog-Iap-Generated-Response"
        case-insensitive: true

    extractors:
      - type: dsl
        name: contact_email
        dsl:
          - "email"
