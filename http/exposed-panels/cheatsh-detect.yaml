id: cheatsh-detect

info:
  name: cheat.sh Instance - 识别（指纹识别）
  author: ritikchaddha
  severity: info
  description: |-
    检测到目标站点存在 cheat.sh Instance 相关响应特征。cheat.sh Instance 是一套通过 Web 提供访问的管理面板或业务系统，通常用于配置服务、查看状态、管理数据或执行日常运维操作。模板请求 `/`，并通过页面标题或正文关键字、状态码确认该系统指纹，用于资产识别、系统盘点和暴露面梳理。
  reference:
    - https://github.com/chubin/cheat.sh
    - https://cheat.sh/
  metadata:
    verified: true
    max-request: 1
    product: cheat.sh
    vendor: chubin
    fofa-query: title="cheat.sh"
    shodan-query: title:"cheat.sh"
  tags: tech,cheatsh,detect,devtools
http:
  - method: GET
    path:
      - "{{BaseURL}}/"

    matchers-condition: and
    matchers:
      - type: word
        part: body
        words:
          - "cheat.sh"
          - "curl cheat.sh"
        condition: or

      - type: word
        part: body
        words:
          - ":firstpage"
          - "cht.sh"
          - "/files/style.css"
        condition: or

      - type: status
        status:
          - 200
