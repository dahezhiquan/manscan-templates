id: audiocodes-default-login

info:
  name: AudioCodes 310HD, 320HD, 420HD, 430HD & 440HD 默认口令登录（弱口令）
  author: d4vy
  severity: high
  description: |
    该模板用于检测 AudioCodes 310HD, 320HD, 420HD, 430HD & 440HD 是否仍可使用默认凭据或弱口令登录。模板主要向 `/login.cgi` 等认证入口发送请求，使用内置默认凭据组合进行认证尝试，并根据响应中的 `redirect('/mainform.cgi?go=mainframe.htm')`、`Login failed. Check username and password` 等登录成功特征判断登录是否成功；命中说明目标未及时修改出厂、示例或初始化账号口令。
  impact: |
    - 攻击者可接管 AudioCodes 310HD, 320HD, 420HD, 430HD & 440HD 的 Web 管理界面，查看设备状态、网络配置、运行日志或敏感业务参数。
    - 被接管的网络、工控、打印、语音、存储或远程管理设备可能被用于中断业务、改变路由/访问策略、窃取流量或作为内网横向移动入口。
  remediation: |
    - 立即修改所有默认账号口令，禁用不再使用的出厂账号，并为管理账户设置高强度唯一密码。
    - 将设备管理入口限制在 VPN、堡垒机或可信管理网段内，避免直接暴露到公网。
    - 升级设备固件或管理组件，审计近期登录记录、配置变更和异常会话。
  reference:
    - https://wiki.freepbx.org/display/FPG/Supported+Devices-Audio+Codes#:~:text=Reset%20to%20Factory%20Defaults,-Press%20the%20Menu&text=Then%2C%20enter%20the%20Admin%20password,is%20%221234%22%20by%20default
  classification:
    cwe-id: CWE-798
  metadata:
    max-request: 1
  tags: iot,audiocodes,default-login,vuln

http:
  - raw:
      - |
        POST /login.cgi HTTP/1.1
        Host: {{Hostname}}
        Content-Type: application/x-www-form-urlencoded

        user={{username}}&psw={{url_encode(base64("{{password}}"))}}

    attack: pitchfork
    payloads:
      username:
        - admin
      password:
        - "1234"
    unsafe: true

    matchers-condition: and
    matchers:
      - type: word
        words:
          - "redirect('/mainform.cgi?go=mainframe.htm')"

      - type: word
        part: body
        negative: true
        words:
          - "Login failed. Check username and password"

      - type: status
        status:
          - 200
