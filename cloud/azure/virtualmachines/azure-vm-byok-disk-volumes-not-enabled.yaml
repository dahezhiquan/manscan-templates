id: azure-vm-byok-disk-volumes-not-enabled
info:
  name: Azure VM Disk Volumes BYOK 加密未启用（云安全）
  author: princechaddha
  severity: high
  description: Azure VM 磁盘使用客户管理密钥时，组织可以控制密钥的轮换、撤销和访问审批；缺少 keyEncryptionKey.keyUrl 时，模板无法确认磁盘采用 BYOK。本模板枚举虚拟机，查询磁盘加密设置中的 keyUrl，并在命令错误输出包含 Azure Disk Encryption is not enabled 时报告。
  impact: |
    - 对受监管或高敏感数据，组织可能无法独立控制静态加密所依赖的密钥生命周期，导致治理和审计证据不足。
    - 密钥撤销、租户隔离和离职交接受平台托管策略约束，增加数据访问边界失控的风险。
  remediation: |
    - 在 Key Vault 或 Managed HSM 中准备客户管理密钥，配置虚拟机加密所需的受管身份和最小权限。
    - 先在非生产实例验证密钥轮换、不可用恢复、备份和扩容流程，再为目标磁盘启用 BYOK 并持续审计密钥访问。
  reference:
    - https://docs.microsoft.com/en-us/azure/virtual-machines/disks-enable-customer-managed-keys
  metadata:
    vendor: microsoft
    product: azure-virtual-machines
  tags: cloud,devops,azure,microsoft,virtual-machine,azure-cloud-config

flow: |
  code(1);
  for (let VmData of iterate(template.vmList)) {
    VmData = JSON.parse(VmData);
    set("ids", VmData.id);
    code(2);
  }

self-contained: true
code:
  - engine:
      - sh
      - bash
    source: |
      az vm list --query '[*].{"id":id}'

    extractors:
      - type: json
        name: vmList
        internal: true
        json:
          - '.[]'

  - engine:
      - sh
      - bash
    source: |
      az vm encryption show --ids "$ids" --query 'disks[*].encryptionSettings[*].keyEncryptionKey.keyUrl'

    matchers:
      - type: word
        part: stderr
        words:
          - "Azure Disk Encryption is not enabled"

    extractors:
      - type: dsl
        dsl:
          - 'ids + " is not using BYOK for disk encryption"'
