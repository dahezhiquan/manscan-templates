id: hivemanager-login-panel

info:
  name: HiveManager 登录面板识别（暴露面识别）
  author: binaryfigments,daffainfo
  severity: info
  description: 该模板通过识别 HiveManager 登录入口的页面标题、特征文本或重定向行为，判断目标是否暴露了对应的认证界面。若命中，说明该登录面板对外可访问，可用于暴露面梳理与后续安全评估。
  classification:
    cvss-metrics: CVSS:3.0/AV:N/AC:L/PR:N/UI:N/S:U/C:N/I:N/A:N
    cwe-id: CWE-200
    cpe: cpe:2.3:a:aerohive:hivemanager_classic:*:*:*:*:*:*:*:*
  metadata:
    verified: true
    max-request: 1
    shodan-query: http.favicon.hash:1604363273
    product: hivemanager_classic
    vendor: aerohive
  tags: panel,hivemanager,aerohive,discovery

http:
  - method: GET
    path:
      - '{{BaseURL}}/hm/login.action'

    matchers-condition: or
    matchers:
      - type: word
        part: header
        words:
          - "HiveManager"

      - type: word
        part: body
        words:
          - "HiveManager"
          - 'alt="Aerohive'
        condition: and
