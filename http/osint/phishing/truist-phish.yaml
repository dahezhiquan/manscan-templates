id: truist-phish

info:
  name: Truist 仿冒钓鱼网站（钓鱼网站识别）
  author: rxerium
  severity: info
  description: |
    检测到疑似仿冒 Truist 的钓鱼网站。模板在目标页面返回 200、页面内容命中 Truist 的登录或账号页面特征，且当前主机不属于 truist.com 官方域名时触发，用于识别借用 Truist 品牌页面诱导用户信任的仿冒站点。
  reference:
    - https://www.truist.com/
  metadata:
    max-request: 1
  tags: phishing,bbt,bank,osint,discovery
http:
  - method: GET
    path:
      - "{{BaseURL}}"

    host-redirects: true
    max-redirects: 2

    matchers-condition: and
    matchers:
      - type: word
        words:
          - "Your journey to better banking starts with Truist. Checking and savings accounts, credit cards, mortgages, small business, commercial banking, and more."

      - type: status
        status:
          - 200

      - type: dsl
        dsl:
          - '!contains(host,"truist.com")'
