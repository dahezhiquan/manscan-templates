id: openarchives-detect

info:
  name: OpenArchives 指纹识别（指纹识别）
  author: ZeroChill
  severity: info
  description: >-
    OpenArchives 是文献、档案或开放资料发布相关系统，用于公开检索和访问归档内容。该模板通过请求目标服务并检查预设路径或首页响应、页面正文关键字、状态码等指纹特征，判断目标是否使用或暴露了
    OpenArchives 相关组件；命中结果仅表示指纹特征匹配，可用于资产盘点、技术栈识别和后续安全评估，不代表已确认存在可利用漏洞。
  reference:
  - https://www.openarchives.org/
  metadata:
    verified: true
    shodan-query: http.html:"</OAI-PMH"
  tags: tech,openarchive,discovery
http:
  - method: GET
    path:
      - "{{BaseURL}}"

    matchers-condition: and
    matchers:
      - type: word
        part: body
        words:
          - 'OAI-PMH'
          - 'www.openarchives.org'
          - '</OAI-PMH'
        condition: and

      - type: status
        status:
          - 200
