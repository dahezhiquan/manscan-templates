id: gcloud-mysql-local-infile-enabled

info:
  name: MySQL 数据库实例启用了 Local Infile（云安全）
  author: princechaddha
  severity: medium
  description: MySQL local_infile 允许客户端通过 LOAD DATA LOCAL INFILE 读取本地文件并导入数据，启用后会增加客户端文件泄露和误用风险。本模板检查 Cloud SQL MySQL 实例 databaseFlags 中 local_infile 的值，并在匹配 on 时报告该标志已启用。
  impact: |
    - 恶意或被劫持的数据库连接可能诱导客户端读取本地文件，造成敏感文件内容泄露。
    - 不必要的数据导入能力会扩大 SQL 客户端和应用连接链路的攻击面。
  remediation: |
    - 在 Cloud SQL MySQL 实例上关闭 local_infile，除非业务确实需要该导入能力。
    - 对必须启用的场景限制数据库账号权限、客户端来源和导入流程，并监控异常 LOAD DATA 使用。
  reference:
    - https://cloud.google.com/sql/docs/mysql/flags
  metadata:
    vendor: google
    product: cloud-sql
  tags: cloud,devops,gcp,gcloud,google-cloud-sql,mysql,gcp-cloud-config

flow: |
  code(1)
  for(let projectId of iterate(template.projectIds)){
    set("projectId", projectId)
    code(2)
    for(let sqlInstance of iterate(template.sqlInstances)){
      set("sqlInstance", sqlInstance)
      code(3)
    }
  }

self-contained: true

code:
  - engine:
      - sh
      - bash
    source: |
      gcloud projects list --format="json(projectId)"

    extractors:
      - type: json
        name: projectIds
        internal: true
        json:
          - '.[].projectId'

  - engine:
      - sh
      - bash
    source: |
      gcloud sql instances list --project $projectId --filter='DATABASE_VERSION:MYSQL*' --format="json(name)"

    extractors:
      - type: json
        name: sqlInstances
        internal: true
        json:
          - '.[].name'

  - engine:
      - sh
      - bash
    source: |
      gcloud sql instances describe asass --project gcp-templates-442409 --format=json | jq '.settings.databaseFlags // [] | map(select(.name=="local_infile")) | .[].value'

    matchers:
      - type: word
        words:
          - 'on'

    extractors:
      - type: dsl
        dsl:
          - '"The local_infile flag is enabled for MySQL instance " + sqlInstance + " in project " + projectId'
