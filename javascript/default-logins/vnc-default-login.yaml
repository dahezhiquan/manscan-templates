id: vnc-default-login

info:
  name: VNC 默认凭据检测（服务漏洞）
  author: pussycat0x
  severity: high
  description: |
    该模板尝试通过常见默认凭据访问 VNC 服务，识别远程桌面是否存在出厂口令或弱认证问题。
  metadata:
    verified: true
    shodan-query: product:"vnc"
  tags: js,network,vnc,default-login

javascript:
  - pre-condition: |
      isPortOpen(Host,Port);
    code: |
      var vnc = require('nuclei/vnc');
      var client = new vnc.VNCClient();
      var resp = client.Connect(Host, Port, Password);
      resp;

    args:
      Host: "{{Host}}"
      Port: 5900
      Password: "{{passwords}}"

    payloads:
      passwords:
        - password123
        - mysecret
        - password
        - admin
        - iamadmin

    stop-at-first-match: true

    matchers:
      - type: dsl
        dsl:
          - "success == true"
          - "response == true"
        condition: and
