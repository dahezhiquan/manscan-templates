id: node-exporter-metrics

info:
  name: Node Exporter 指标暴露
  author: pussycat0x,matejsmycka
  severity: low
  description: |
    该模板用于核查 Node Exporter 指标暴露。该类问题通常源于 Prometheus、Exporter、监控端点或服务指标接口未加访问控制而暴露。模板会向目标发送探测请求，并依据请求 `/metrics`、匹配 `node_cooling_device_cur_state{name=`、匹配 `node_network_carrier{device=`、匹配 `node_network_flags{device=`等证据确认目标是否存在该配置问题。
  impact: |
    - 攻击者可获取主机、容器、服务版本、资源使用、网络接口、文件系统或集群状态等运行信息。
    - 指标信息可辅助攻击者绘制内部架构、识别高价值节点并制定后续攻击路径。
  remediation: |
    - 为指标端点增加认证授权、来源限制或仅绑定内网监听地址。
    - 通过反向代理、服务网格或监控采集器收敛访问路径，避免公网直接访问。
    - 审计已暴露的指标内容，确认是否包含主机名、版本、标签或业务敏感标识。
  metadata:
    max-request: 1
  tags: node,exposure,debug,misconfig,vuln

http:
  - method: GET
    path:
      - "{{BaseURL}}/metrics"

    matchers-condition: and
    matchers:
      - type: word
        part: body
        words:
          - "node_cooling_device_cur_state{name="
          - "node_network_carrier{device="
          - "node_network_flags{device="
          - "node_cpu_seconds_total{cpu="
          - "node_filesystem_files{device="
        condition: or

      - type: status
        status:
          - 200
    extractors:
      - type: regex
        part: body
        regex:
          - 'node_os_info\{([^}]*)\}\s+1'
        internal: true
        name: os_info

      - type: regex
        part: body
        regex:
          - 'node_exporter_build_info\{([^}]*)\}\s+1'
        internal: true
        name: build_info

      - type: regex
        part: body
        regex:
          - 'node_dmi_info\{([^}]*)\}\s+1'
        internal: true
        name: bios_info

      - type: regex
        part: os_info
        group: 1
        regex:
          - 'pretty_name="([^"]+)"'

      - type: regex
        part: build_info
        group: 1
        regex:
          - 'goversion="([^"]+)"'
          - 'version="([^"]+)"'

      - type: regex
        part: bios_info
        group: 1
        regex:
          - 'bios_version="([^"]+)"'
          - 'bios_vendor="([^"]+)"'
          - 'chassis_vendor="([^"]+)"'
          - 'chassis_version="([^"]+)"'
          - 'product_name="([^"]+)"'
          - 'product_version="([^"]+)"'
