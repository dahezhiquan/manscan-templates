id: gcloud-enable-data-access-audit-logging

info:
  name: Enable Data 访问 审计 日志记录 的All Critical Service APIs（云安全）
  author: princechaddha
  severity: medium
  description: Data Access audit logs 记录对数据的读取、写入和管理访问，关键服务未启用会造成数据访问审计缺口。本模板检查项目 IAM policy，若缺少 auditConfigs 且存在 bindings，则报告项目未为服务启用数据访问审计日志。
  impact: |
    - 对敏感数据的读取、导出或权限使用可能无法被完整记录，影响入侵调查和合规证明。
    - 数据访问异常缺少日志信号时，告警规则和威胁检测难以及时发现滥用行为。
  remediation: |
    - 为关键 Google Cloud 服务启用 Data Access audit logs，并明确 ADMIN_READ、DATA_READ、DATA_WRITE 的记录范围。
    - 将审计日志集中保存并配置访问异常告警，同时评估日志量和保留成本。
  reference:
    - https://cloud.google.com/logging/docs/audit/configure-data-access
  metadata:
    vendor: google
    product: cloud-logging
  tags: cloud,devops,gcp,gcloud,google-cloud-iam,gcp-cloud-config

flow: |
  code(1)
  for(let projectId of iterate(template.projectIds)){
    set("projectId", projectId)
    code(2)
  }

self-contained: true

code:
  - engine:
      - sh
      - bash
    source: |
      gcloud projects list --format="json(projectId)"

    extractors:
      - type: json
        name: projectIds
        internal: true
        json:
          - '.[].projectId'

  - engine:
      - sh
      - bash
    source: |
      gcloud projects get-iam-policy $projectId --format=json

    matchers-condition: and
    matchers:
      - type: word
        words:
          - '"auditConfigs"'
        negative: true

      - type: word
        words:
          - '"bindings":'

    extractors:
      - type: dsl
        dsl:
          - '"Audit logging not enabled for all services in project: " + projectId'
