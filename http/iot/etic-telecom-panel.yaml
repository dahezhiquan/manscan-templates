id: etic-telecom-panel

info:
  name: ETIC Telecom 设备登录面板（IOT）
  author: biero-el-corridor
  severity: medium
  description: |
    检测到 ETIC Telecom 设备登录面板。该入口常用于工业通信或远程接入设备管理，公网暴露可能泄露网络边界设备入口。
  impact: |
    - 网关、路由器或 VPN 管理入口暴露会增加口令攻击、配置探测和设备接管风险。
    - 网络边界设备一旦被控制，可能导致流量劫持、访问策略篡改或内网横向移动。
  remediation: |
    - 将网络设备管理入口限制在可信管理网段或 VPN 内，禁止公网暴露。
    - 修改默认凭据，启用强认证和登录失败限制。
    - 定期升级固件并审计路由、DNS、端口转发和 VPN 配置变更。
  metadata:
    verified: true
    max-request: 1
    shodan-query: html:"ETIC Telecom"
  tags: etic,panel,login,discovery

http:
  - method: GET
    path:
      - "{{BaseURL}}/login.htm"
      - "{{BaseURL}}/common.etic_cgi_portal/login.html"

    matchers-condition: and
    matchers:
      - type: word
        part: body
        words:
          - "Please identify yourself"
          - "ETIC Telecom device login"
        condition: and

      - type: status
        status:
          - 200
