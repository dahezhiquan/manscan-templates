id: bmc-remedy-sso-panel

info:
  name: BMC Remedy SSO 登录面板识别（指纹识别）
  author: righettod
  severity: info
  description: |-
    检测到目标站点存在 BMC Remedy SSO 相关响应特征。BMC Remedy SSO 是身份认证、密码管理或特权访问管理系统，用于集中管理账号、凭据、登录策略和高权限访问。模板请求 `/arsys/`、`/webUI/userHome.do` 路径，并通过页面标题或正文关键字、状态码、DSL 条件确认该系统指纹，用于资产识别、系统盘点和暴露面梳理。
  reference:
    - https://www.bmc.com/it-solutions/remedy-itsm.html
  metadata:
    verified: true
    max-request: 2
    shodan-query: http.title:"BMC Remedy Single Sign-On domain data entry"
  tags: panel,bmc,login,detect,discovery
http:
  - method: GET
    path:
      - "{{BaseURL}}/arsys/"
      - "{{BaseURL}}/webUI/userHome.do"

    stop-at-first-match: true

    matchers:
      - type: dsl
        dsl:
          - 'status_code == 200'
          - 'contains(to_lower(body), "<title>bmc remedy single sign-on domain data entry")'
        condition: and
