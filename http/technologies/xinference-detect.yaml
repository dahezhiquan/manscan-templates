id: xinference-detect

info:
  name: Xinference 指纹识别（指纹识别）
  author: rxerium
  severity: info
  description: |
    用于识别目标前端或应用中是否使用 Xinference，模板会结合页面正文和特定路径或已知端点进行技术栈指纹匹配。
  reference:
    - https://github.com/xorbitsai/inference
    - https://inference.readthedocs.io/
  metadata:
    verified: true
    max-request: 1
    vendor: xorbitsai
    product: xinference
    shodan-query: 'port:9997 http.html:"xinference"'
  tags: tech,xinference,llm,inference,ai,detect,discovery

http:
  - raw:
      - |
        GET /v1/models HTTP/1.1
        Host: {{Hostname}}

    matchers-condition: and
    matchers:
      - type: word
        words:
          - '"object":"list"'
          - '"data":'
        part: body
        condition: and

      - type: dsl
        dsl:
          - status_code == 200
          - contains(content_type, "application/json")
          - contains(header, "uvicorn")
        condition: and
