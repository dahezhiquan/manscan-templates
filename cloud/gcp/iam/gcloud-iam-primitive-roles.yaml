id: gcloud-iam-primitive-roles

info:
  name: Minimize the Use of Primitive Roles（云安全）
  author: princechaddha
  severity: medium
  description: Primitive roles（Owner、Editor、Viewer）权限范围过宽，难以满足按资源和职责精确授权的要求。本模板遍历项目 IAM bindings，发现 roles/owner、roles/editor 或 roles/viewer 被使用时输出对应成员和项目。
  impact: |
    - Owner 或 Editor 被滥用时可能导致资源接管、权限扩散和安全配置被篡改。
    - Viewer 也可能暴露项目结构、资源清单和部分元数据，增加后续攻击侦察价值。
  remediation: |
    - 用服务级预定义角色或自定义角色替代 primitive roles，仅授予完成任务所需的最小权限。
    - 对仍需保留的 primitive roles 建立例外审批和定期复核，优先通过组而不是个人账号管理授权。
  reference:
    - https://cloud.google.com/iam/docs/understanding-roles
  metadata:
    vendor: google
    product: cloud-iam
  tags: cloud,devops,gcp,gcloud,google-cloud-iam,gcp-cloud-config

flow: |
  code(1)
  for(let projectId of iterate(template.projectIds)){
    set("projectId", projectId)
    code(2)
    for(let binding of iterate(template.bindings)){
      set("binding", binding)
      javascript(1)
    }
  }

self-contained: true

code:
  - engine:
      - sh
      - bash
    source: |
      gcloud projects list --format="json(projectId)"

    extractors:
      - type: json
        name: projectIds
        internal: true
        json:
          - '.[].projectId'

  - engine:
      - sh
      - bash
    source: |
      gcloud projects get-iam-policy $projectId --format=json

    extractors:
      - type: json
        name: bindings
        internal: true
        json:
          - '.bindings[]'

javascript:
  - code: |
      let binding = JSON.parse(template.binding);
      let role = binding.role;
      let members = binding.members.join(", ");
      let projectId = template.projectId;
      let primitiveRoles = ["roles/owner", "roles/editor", "roles/viewer"];
      if (primitiveRoles.includes(role)) {
        Export("Primitive role " + role + " used by members " + members + " in Project " + projectId);
      }

    extractors:
      - type: dsl
        dsl:
          - response
