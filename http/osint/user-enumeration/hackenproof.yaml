id: hackenproof

info:
  name: Hackenproof 用户名信息枚举（OSINT）
  author: philippedelteil
  severity: info
  description: |
    对 Hackenproof 的用户名进行 OSINT 枚举检查。模板请求公开路径 https://hackenproof.com/hackers/用户名，当响应状态为 200 且页面或响应内容命中 “Check out 用户名 on HackenProof”、“Member since” 等用户资料页特征时，判定目标用户名可能存在。
  classification:
    cvss-metrics: CVSS:3.1/AV:N/AC:L/PR:N/UI:N/S:U/C:N/I:N/A:N
    cvss-score: 0
    cwe-id: CWE-200
  metadata:
    max-request: 1
  tags: osint,osint-tech,hackenproof,discovery

self-contained: true

http:
  - method: GET
    path:
      - "https://hackenproof.com/hackers/{{user}}"

    matchers-condition: and
    matchers:
      - type: word
        part: body
        words:
          - 'Check out {{user}} on HackenProof'
          - 'Member since'
        condition: and
        case-insensitive: true

      - type: status
        status:
          - 200
