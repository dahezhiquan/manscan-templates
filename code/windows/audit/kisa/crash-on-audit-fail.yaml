id: crash-on-audit-fail

info:
  name: 审计失败时关机策略配置不当（本地基线扫描）
  author: nukunga[SungHyunJeon]
  severity: medium
  description: |
    该模板检查“审计失败时关闭系统”策略。错误启用可能在日志写入失败时导致系统不可用。
  impact: |
    攻击者或异常状态可能通过触发审计失败造成拒绝服务。
  remediation: |
    按基线要求禁用该策略，并保障日志存储与转发可用。
  reference:
    - https://isms.kisa.or.kr/main/csap/notice/?boardId=bbs_0000000000000004&mode=view&cntId=85
  tags: account-management,code,windows-audit,kisa,policy

self-contained: true

code:
  - pre-condition: |
      IsWindows();
    engine:
      - powershell
      - powershell.exe
    args:
      - -ExecutionPolicy
      - Bypass
    pattern: "*.ps1"
    source: |
      $cfgPath = "C:\cfg.txt"
      secedit /export /cfg $cfgPath | Out-Null
      $cfg = Get-Content $cfgPath | Out-String
      if ($cfg -match "CrashOnAuditFail\s*=\s*(\S+)") {
          $value = $Matches[1].Trim()
          if ($value -eq "4,1") {
              "CRASH_ON_AUDIT_FAIL_ENABLED"
          } else {
              "CRASH_ON_AUDIT_FAIL_DISABLED"
          }
      } else {
          "CRASH_ON_AUDIT_FAIL_NOT_FOUND"
      }

    matchers:
      - type: word
        words:
          - "CRASH_ON_AUDIT_FAIL_ENABLED"
