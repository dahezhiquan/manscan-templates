id: overseerr-panel

info:
  name: Overseerr 登录面板识别（指纹识别）
  author: rxerium
  severity: info
  description: |-
    Overseerr 是媒体请求管理平台，常与 Plex、Sonarr、Radarr 等家庭媒体服务配合使用。该模板请求 `/login` 路径，并依据 HTTP 200 状态码、页面标题、正文关键字或品牌资源特征识别目标是否部署了该系统或暴露了对应入口，适用于资产指纹确认；命中结果仅表示系统特征匹配，不代表已确认存在未授权访问或可利用漏洞。
  reference:
  - https://overseerr.dev/
  - https://github.com/sct/overseerr
  metadata:
    verified: true
    max-request: 1
    fofa-query: Overseerr account
  tags: panel,overseerr,detect,discovery

http:
  - method: GET
    path:
      - "{{BaseURL}}/login"

    matchers-condition: and
    matchers:
      - type: word
        part: body
        words:
          - "Sign In - Overseerr"

      - type: status
        status:
          - 200
