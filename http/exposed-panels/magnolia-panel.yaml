id: magnolia-panel

info:
  name: Magnolia CMS 登录面板识别（暴露面识别）
  author: pussycat0x
  severity: info
  description: |
    该模板通过识别 Magnolia CMS 登录入口的页面标题、特征文本或重定向行为，判断目标是否暴露了对应的认证界面。若命中，说明该登录面板对外可访问，可用于暴露面梳理与后续安全评估。
  reference:
    - https://www.magnolia-cms.com/
  classification:
    cvss-metrics: CVSS:3.1/AV:N/AC:L/PR:N/UI:N/S:U/C:N/I:N/A:N
    cwe-id: CWE-200
    cpe: cpe:2.3:a:magnolia-cms:magnolia_cms:*:*:*:*:*:*:*:*
  metadata:
    verified: true
    max-request: 2
    shodan-query: html:"Magnolia is a registered trademark"
    product: magnolia_cms
    vendor: magnolia-cms
  tags: magnolia,panel,login,discovery

http:
  - method: GET
    path:
      - "{{BaseURL}}"
      - "{{BaseURL}}/.magnolia/admincentral"

    stop-at-first-match: true

    matchers-condition: and
    matchers:
      - type: word
        part: body
        words:
          - 'Magnolia is a registered trademark'

      - type: word
        part: header
        words:
          - "text/html"
