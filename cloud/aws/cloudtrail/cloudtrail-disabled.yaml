id: cloudtrail-disabled
info:
  name: CloudTrail 多区域跟踪未启用（云安全）
  author: princechaddha
  severity: high
  description: CloudTrail 多区域跟踪未启用是一类账户级审计覆盖不足风险，单区域 trail 只能覆盖有限区域内的事件。攻击者或误操作可能发生在其他区域，导致管理活动未被当前 trail 捕获。模板枚举 trail 名称后读取 `trailList[*].IsMultiRegionTrail`，当值为 `false` 时判定该 trail 仅覆盖单一区域。
  impact: |
    - 其他区域的 API 活动可能无法被该 trail 捕获，攻击者可利用未覆盖区域规避审计。
    - 安全运营团队难以获得账户级完整操作记录，影响异常调查和合规证明。
  remediation: |
    - 将关键账户的 CloudTrail trail 更新为多区域跟踪，确保管理事件覆盖所有支持区域。
    - 定期核对新启用区域和组织级 trail 配置，避免审计范围出现空白。
  reference:
    - https://docs.aws.amazon.com/awscloudtrail/latest/userguide/cloudtrail-getting-started.html
  metadata:
    max-request: 2
    vendor: amazon
    product: cloudtrail
  tags: cloud,devops,aws,amazon,cloudtrail,aws-cloud-config
variables:
  region: "ap-south-1"

flow: |
  code(1)
  for(let CloudTrail of iterate(template.cloudtrailname)){
    set("trail", CloudTrail)
    code(2)
  }

self-contained: true
code:
  - engine:
      - sh
      - bash
    source: |
      aws cloudtrail list-trails --region $region --query 'Trails[*].Name' --output json

    extractors:
      - type: json
        name: cloudtrailname
        internal: true
        json:
          - '.[]'

  - engine:
      - sh
      - bash
    source: |
         aws cloudtrail describe-trails --region $region --trail-name-list $trail --query 'trailList[*].IsMultiRegionTrail'

    matchers:
      - type: word
        words:
          - "false"

    extractors:
      - type: dsl
        dsl:
          - '"CloudTrail trail" + trail + " is not configured to receive log files from all the AWS cloud regions"'
