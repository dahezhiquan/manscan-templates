id: caobox-cms-detect

info:
  name: Caobox CMS 指纹识别（指纹识别）
  author: Chirag Mistry
  severity: info
  description: |-
    Caobox CMS 是内容管理系统，用于网站内容、栏目和后台管理。该模板请求首页，并依据页面标题、正文关键字或品牌资源特征识别目标是否使用或暴露了 Caobox CMS 相关组件，适用于资产盘点、技术栈识别和后续安全评估；命中结果仅表示指纹特征匹配，不代表已确认存在可利用漏洞。
  metadata:
    verified: true
    shodan-query:
    - http.component:"Caobox"
    - http.component:"caobox"
    - cpe:"cpe:2.3:a:caobox:caobox"
  tags: detect,caobox,cms,tech,discovery

http:
  - method: GET
    path:
      - "{{BaseURL}}"

    payloads:
      paths:
        - "/"
        - "/admin/"
        - "/index.php"
        - "/admin/login.php"

    matchers-condition: or
    matchers:
      - type: word
        words:
          - "Caobox CMS"
          - "powered by Caobox"
          - "Welcome to Caobox"
          - "Caobox version"
        condition: or

      - type: regex
        regex:
          - "(?i)caobox"
          - "(?i)caobox\\s+(v[0-9.]+)"
          - "(?i)<title>Caobox CMS"
