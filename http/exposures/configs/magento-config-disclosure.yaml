id: magento-config-disclosure

info:
  name: Magento 配置 Panel暴露（暴露面识别）
  author: ptonewreckin,danigoland,geeknik
  severity: high
  description: |
    检测到目标站点可直接访问 Magento 配置 Panel。凭据类配置通常用于连接云服务、数据库、代码仓库、CI/CD 或第三方 API。该模板请求 `/app/etc/local.xml`、`/app/etc/local.xml.additional`、`/store/app/etc/local.xml`，并通过 HTTP 状态码、响应正文关键字、文件格式特征、正则匹配或响应头进行确认。此类资源公开后可能泄露部署细节、内部路径、依赖版本、环境变量、访问凭据或调试信息，增加被侦察和后续利用的风险。
  impact: |-
    - 泄露的凭据、令牌或密钥可能被用于访问云资源、数据库、代码仓库、CI/CD、邮件或第三方 API。
    - 攻击者可能借助有效凭据读取或篡改业务数据、部署恶意版本、创建持久化访问或产生额外云资源费用。
    - 即使凭据权限有限，也可能暴露账号命名、环境划分和内部系统关系，辅助后续横向移动。
  remediation: |-
    - 立即撤销并轮换暴露文件中可能出现的密码、API Key、访问令牌、SSH Key、数据库连接串和云访问密钥。
    - 将敏感配置迁移到密钥管理系统、环境变量注入或受控配置中心，避免随静态文件对外发布。
    - 限制相关账号权限并启用最小权限、MFA、访问审计和异常调用告警。
    - 排查近期登录、API 调用、代码仓库、云资源和制品库操作记录，确认是否存在未授权使用。
  reference:
    - https://github.com/ptonewreckin/cmsDetector/blob/master/signatures/magento.py
  classification:
    cvss-metrics: CVSS:3.1/AV:N/AC:L/PR:N/UI:N/S:U/C:H/I:N/A:N
    cvss-score: 7.5
    cwe-id: CWE-200
    cpe: cpe:2.3:a:magento:magento:*:*:*:*:*:*:*:*
  metadata:
    verified: true
    max-request: 3
    shodan-query: http.component:"Magento"
    product: magento
    vendor: magento
  tags: magento,exposure,credentials,config,vuln

http:
  - method: GET
    path:
      - "{{BaseURL}}/app/etc/local.xml"
      - "{{BaseURL}}/app/etc/local.xml.additional"
      - "{{BaseURL}}/store/app/etc/local.xml"

    stop-at-first-match: true

    matchers-condition: and
    matchers:
      - type: word
        part: body
        words:
          - "* Magento"
          - "<dbname>"
        condition: and

      - type: word
        part: header
        words:
          - "application/xml"

      - type: status
        status:
          - 200

    extractors:
      - type: xpath
        part: body
        xpath:
          - "/config/global/resources/default_setup/connection/host"
          - "/config/global/resources/default_setup/connection/username"
          - "/config/global/resources/default_setup/connection/password"
          - "/config/global/resources/default_setup/connection/dbname"
