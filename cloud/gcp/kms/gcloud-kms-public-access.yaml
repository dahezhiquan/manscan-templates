id: gcloud-kms-public-access

info:
  name: 公开可访问 Google Cloud KMS Keys（云安全）
  author: princechaddha
  severity: high
  description: Cloud KMS 密钥 IAM policy 中出现 allUsers 或 allAuthenticatedUsers 会使密钥权限面向匿名或任意已认证用户开放。本模板枚举 global 位置的 key ring 和 key，并检查每个密钥 IAM policy 是否包含公开成员。
  impact: |
    - 未授权主体可能使用或管理密钥，导致受保护数据被解密、签名能力被滥用或密钥策略被破坏。
    - KMS 公开授权会削弱加密边界，影响依赖该密钥的存储、日志或应用数据保护效果。
  remediation: |
    - 从 KMS 密钥 IAM policy 中移除 allUsers 和 allAuthenticatedUsers，仅授予明确的服务账号、组或受控身份。
    - 复核受影响密钥的使用记录和绑定资源，必要时轮换密钥版本并加强 IAM Conditions 与审计告警。
  reference:
    - https://cloud.google.com/kms/docs/restricting-access
  metadata:
    vendor: google
    product: cloud-kms
  tags: cloud,devops,gcp,gcloud,google-kms,gcp-cloud-config

flow: |
  code(1)
  for(let keyRing of iterate(template.keyRings)){
    set("keyRing", keyRing)
    code(2)
    for(let key of iterate(template.keys)){
      set("keyName", key)
      code(3)
    }
  }

self-contained: true

code:
  - engine:
      - sh
      - bash
    source: |
      gcloud kms keyrings list --location=global --format="json(name)"

    extractors:
      - type: json
        name: keyRings
        internal: true
        json:
          - '.[].name'

  - engine:
      - sh
      - bash
    source: |
      gcloud kms keys list --keyring=$keyRing --location=global --format="json(name)"

    extractors:
      - type: json
        name: keys
        internal: true
        json:
          - '.[].name'

  - engine:
      - sh
      - bash
    source: |
      gcloud kms keys get-iam-policy $keyName --keyring=$keyRing --location=global --format="json"

    matchers:
      - type: word
        words:
          - "allUsers"
          - "allAuthenticatedUsers"
        condition: or

    extractors:
      - type: dsl
        dsl:
          - '"Public Access found in KMS Key: " + keyName + ", KeyRing: " + keyRing + ", Location: Global"'
