id: gcloud-filestore-deletion-protection-disabled

info:
  name: Filestore Instance Deletion 保护未启用（云安全）
  author: princechaddha
  severity: medium
  description: Filestore deletion protection 可降低实例被误删或恶意删除导致共享文件数据不可用的风险。本模板枚举 Filestore 实例并检查 deletionProtectionEnabled，字段为空时报告未启用删除保护。
  impact: |
    - 关键文件共享可能因误操作、脚本错误或被盗权限被删除，造成数据恢复和业务中断风险。
    - 缺少删除保护会削弱高价值存储资源的变更控制和防误删能力。
  remediation: |
    - 对生产和关键 Filestore 实例启用 deletion protection，并将关闭保护纳入审批流程。
    - 配合备份、标签和变更审计，确保实例删除前完成业务确认和数据恢复准备。
  reference:
    - https://www.trendmicro.com/cloudoneconformity/knowledge-base/gcp/Filestore/enable-deletion-protection.html
    - https://cloud.google.com/filestore/docs/prevent-deletion
  metadata:
    vendor: google
    product: filestore
  tags: cloud,devops,gcp,gcloud,filestore,security,deletion-protection,gcp-cloud-config

flow: |
  code(1)
  for(let projectId of iterate(template.projectIds)){
    set("projectId", projectId)
    code(2)
    for(let instance of iterate(template.instances)){
      set("instanceName", instance.name)
      code(3)
    }
  }

self-contained: true

code:
  - engine:
      - sh
      - bash
    source: |
      gcloud projects list --format="json(projectId)"

    extractors:
      - type: json
        name: projectIds
        internal: true
        json:
          - '.[].projectId'

  - engine:
      - sh
      - bash
    source: |
      gcloud filestore instances list --project $projectId --format="json"

    extractors:
      - type: json
        name: instances
        internal: true
        json:
          - '.[]'

  - engine:
      - sh
      - bash
    source: |
      gcloud filestore instances describe $instanceName --format="json(deletionProtectionEnabled)"

    matchers:
      - type: word
        words:
          - "null"

    extractors:
      - type: dsl
        dsl:
          - '"Filestore instance " + instanceName + " in project " + projectId + " does not have deletion protection enabled"'
