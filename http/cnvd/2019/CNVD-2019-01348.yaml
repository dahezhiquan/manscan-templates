id: CNVD-2019-01348

info:
  name: Xiuno BBS 系统重装漏洞（CNVD-2019-01348）
  author: princechaddha
  severity: high
  description: |
    Xiuno BBS 安装目录未被删除或访问控制不足时，攻击者可访问 `/install/` 重新进入安装流程。模板请求安装入口并匹配 Xiuno 安装页面特征，用于确认重装入口暴露。
  impact: |
    - 暴露的安装程序可能被用于覆盖配置、重置站点状态或破坏论坛可用性。
    - 若安装流程可连接数据库，攻击者可能进一步篡改数据库配置或造成业务数据丢失。
  remediation: |
    - 完成部署后立即删除或禁用 `/install/` 目录，并确认安装锁文件生效。
    - 对管理和安装相关路径增加访问控制，仅允许可信运维来源访问。
    - 检查站点配置与数据库完整性，确认未发生异常重装或配置变更。
  reference:
    - https://www.cnvd.org.cn/flaw/show/CNVD-2019-01348
  classification:
    cvss-metrics: CVSS:3.0/AV:N/AC:L/PR:N/UI:N/S:U/C:N/I:N/A:H
    cvss-score: 7.5
    cwe-id: CWE-284
  metadata:
    max-request: 1
  tags: cnvd2019,cnvd,xiuno,vuln

http:
  - method: GET
    path:
      - "{{BaseURL}}/install/"

    headers:
      Accept-Encoding: deflate

    matchers-condition: and
    matchers:
      - type: status
        status:
          - 200

      - type: word
        part: body
        words:
          - "/view/js/xiuno.js"
          - "Choose Language (选择语言)"
        condition: and
