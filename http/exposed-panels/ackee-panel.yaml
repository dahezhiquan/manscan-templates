id: ackee-panel

info:
  name: Ackee 面板识别（指纹识别）
  author: userdehghani
  severity: info
  description: |-
    检测到目标站点存在 Ackee 相关响应特征。Ackee 是自托管网站访问统计平台，用于收集、展示和分析站点访问数据。模板请求 `/`、`/favicon.ico` 路径，并通过页面标题或正文关键字、状态码、favicon 哈希、DSL 条件确认该系统指纹，用于资产识别、系统盘点和暴露面梳理。
  reference:
    - https://ackee.electerious.com/
    - https://docs.ackee.electerious.com/
  metadata:
    verified: true
    max-request: 2
    shodan-query: http.favicon.hash:-1495233116
  tags: panel,ackee,login,detect,discovery
http:
  - method: GET
    path:
      - "{{BaseURL}}"
      - "{{BaseURL}}/favicon.ico"

    stop-at-first-match: true
    matchers:
      - type: dsl
        dsl:
          - 'status_code==200 && contains(tolower(body), "<title>ackee")'
          - "status_code==200 && (\"-1495233116\" == mmh3(base64_py(body)))"
        condition: or
