id: argocd-login

info:
  name: Argo CD 登录面板（暴露面识别）
  author: Adam Crosser,daffainfo,aringo
  severity: medium
  description: |-
    检测到目标站点暴露 Argo CD 相关面板或登录入口。Argo CD 是 Kubernetes 或云原生应用管理平台，用于查看应用状态、同步部署、管理集群资源和发布流程。模板请求 `/`、`/swagger.json`、`/api/v1/settings` 等路径，并通过页面标题或正文关键字、状态码、DSL 条件确认入口可访问；此类面板若直接暴露在公网，会增加账号枚举、口令攻击、漏洞匹配和未授权访问尝试的机会。
  impact: |-
    - 攻击者可确认目标部署了 Argo CD 或相关组件，并据此开展账号枚举、口令喷洒、默认凭据尝试或针对性漏洞匹配。
    - 若面板存在弱口令、默认配置、访问控制缺陷或未修复漏洞，可能导致后台权限被获取、配置被篡改、敏感数据泄露或业务系统被接管。
    - 管理入口长期暴露在公网会扩大攻击面，增加自动化扫描、撞库、社会工程和后续横向移动的风险。
  remediation: |-
    - 将 Argo CD 面板限制在内网、VPN、堡垒机或可信源 IP 访问范围内，避免管理入口直接暴露在公网。
    - 启用强密码、多因素认证、登录失败限制和默认账户清理，定期审计登录日志与管理员账号权限。
    - 保持系统和相关组件更新到受支持版本，关闭不必要的管理路径，并在必须公网访问时增加反向代理访问控制、WAF 或零信任访问策略。
  reference:
    - https://argoproj.github.io/cd/
  classification:
    cwe-id: CWE-200
    cpe: cpe:2.3:a:argoproj:argo_cd:*:*:*:*:*:*:*:*
  metadata:
    max-request: 2
    shodan-query: http.title:"Argo CD"
    product: argo_cd
    vendor: argoproj
  tags: panel,argocd,login,kubernetes,discovery
http:
  - method: GET
    path:
      - "{{BaseURL}}"
      - "{{BaseURL}}/swagger.json"
      - "{{BaseURL}}/api/v1/settings"
      - "{{BaseURL}}/api/version"

    stop-at-first-match: true

    matchers-condition: or
    matchers:
      - type: dsl
        dsl:
          - contains(to_lower(body_1), '<title>argo cd</title>')
          - status_code_1 == 200
        condition: and

      - type: dsl
        dsl:
          - contains(to_lower(body_2), 'argocd control plane')
          - status_code_2 == 200
        condition: and

      - type: dsl
        dsl:
          - contains(to_lower(body_3), 'argocd.argoproj.io')
          - status_code_3 == 200
        condition: and

      - type: dsl
        dsl:
          - contains(to_lower(header_4), 'grpc-metadata-content-type')
          - status_code_4 == 200
        condition: and

    extractors:
      - type: json
        json:
          - .Version
