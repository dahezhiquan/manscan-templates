id: cisco-ucm-cluster-enum

info:
  name: Cisco Unified Communications Manager - 集群枚举漏洞
  author: Morgan Robertson
  severity: low
  description: |
    该模板用于检测 Cisco Unified Communications Manager - 集群枚举漏洞。模板根据目标接口的可控输入、响应特征和匹配条件判断漏洞是否存在。模板主要向 `/cucm-uds/servers` 等路径发送探测请求，并根据响应中的 `text/xml`、`application/xml` 等特征确认漏洞是否存在。
  impact: |
    - 攻击者可利用该漏洞访问或篡改目标系统中的敏感数据和业务功能。
    - 在真实部署中，该问题可能进一步引发权限提升、服务中断或与其他漏洞组合形成攻击链。
  remediation: |
    - 升级受影响产品到厂商修复版本，或应用官方补丁与安全配置建议。
    - 限制受影响接口的访问来源，并对关键操作增加认证、授权和审计。
    - 复核近期异常访问、配置变更和敏感数据访问记录，必要时轮换相关凭据。
  reference:
    - https://developer.cisco.com/site/user-data-services/develop-and-test/api-reference/#servers
  metadata:
    verified: true
    product: unified_communications_manager
    vendor: cisco
    shodan-query: http.title:"Unified Communications Self Care Portal"
    fofa-query: title="Unified Communications Self Care Portal"
  tags: cisco,ucm,misconfig

http:
  - method: GET
    path:
      - "{{BaseURL}}/cucm-uds/servers"

    headers:
      Accept: application/xml

    matchers-condition: and
    matchers:
      - type: status
        status:
          - 200

      - type: word
        part: header
        words:
          - "text/xml"
          - "application/xml"
        condition: or

      - type: word
        part: body
        words:
          - '<servers uri'
          - '<server>'
        condition: and

    extractors:
      - type: xpath
        name: cluster_nodes
        xpath:
          - "/servers/server"
