id: gocd-login

info:
  name: GoCD 登录面板识别（暴露面识别）
  author: dhiyaneshDK
  severity: info
  description: 该模板通过识别 GoCD 登录入口的页面标题、特征文本或重定向行为，判断目标是否暴露了对应的认证界面。若命中，说明该登录面板对外可访问，可用于暴露面梳理与后续安全评估。
  classification:
    cvss-metrics: CVSS:3.0/AV:N/AC:L/PR:N/UI:N/S:U/C:N/I:N/A:N
    cwe-id: CWE-200
    cpe: cpe:2.3:a:thoughtworks:gocd:*:*:*:*:*:*:*:*
  metadata:
    max-request: 1
    vendor: thoughtworks
    product: gocd
    shodan-query:
      - html:"GoCD Version"
      - http.html:"gocd version"
      - http.title:"create a pipeline - go" html:"gocd version"
    fofa-query:
      - title="create a pipeline - go" html:"gocd version"
      - body="gocd version"
    google-query: intitle:"create a pipeline - go" html:"gocd version"
  tags: go,panel,gocd,thoughtworks,discovery

http:
  - method: GET
    path:
      - '{{BaseURL}}/go/auth/login'

    matchers-condition: and
    matchers:
      - type: word
        words:
          - '<title>Login - Go</title>'
          - 'gocd-params'

      - type: status
        status:
          - 200
