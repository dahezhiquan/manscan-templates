id: intellian-aptus-panel

info:
  name: Intellian Aptus Web 登录面板识别（暴露面识别）
  author: princechaddha
  severity: info
  description: 该模板通过识别 Intellian Aptus Web 登录入口的页面标题、特征文本或重定向行为，判断目标是否暴露了对应的认证界面。若命中，说明该登录面板对外可访问，可用于暴露面梳理与后续安全评估。
  classification:
    cvss-metrics: CVSS:3.0/AV:N/AC:L/PR:N/UI:N/S:U/C:N/I:N/A:N
    cwe-id: CWE-200
    cpe: cpe:2.3:a:intelliantech:aptus_web:*:*:*:*:*:*:*:*
  metadata:
    max-request: 1
    vendor: intelliantech
    product: aptus_web
    shodan-query:
      - http.title:"Intellian Aptus Web"
      - http.title:"intellian aptus web"
    fofa-query: title="intellian aptus web"
    google-query: intitle:"intellian aptus web"
  tags: panel,intellian,aptus,intelliantech,discovery

http:
  - method: GET
    path:
      - "{{BaseURL}}/cgi-bin/getagent.cgi?type=s&xxxx"

    host-redirects: true
    max-redirects: 2

    matchers-condition: and
    matchers:
      - type: regex
        regex:
          - '<title>Intellian Aptus Web (.*)</title>'

      - type: status
        status:
          - 200

    extractors:
      - type: regex
        part: body
        group: 1
        regex:
          - '<title>Intellian Aptus Web (.*)</title>'
