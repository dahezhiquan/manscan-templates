id: ictbroadcast-panel

info:
  name: ICTBroadcast 登录面板识别（暴露面识别）
  author: rxerium
  severity: info
  description: |
    该模板通过识别 ICTBroadcast 登录入口的页面标题、特征文本或重定向行为，判断目标是否暴露了对应的认证界面。若命中，说明该登录面板对外可访问，可用于暴露面梳理与后续安全评估。
  reference:
    - https://www.ictbroadcast.com/
  metadata:
    verified: true
    max-request: 1
    shodan-query: http.favicon.hash:-60395993
  tags: panel,ictbroadcast,login,discovery

http:
  - method: GET
    path:
      - "{{BaseURL}}"
      - "{{BaseURL}}/login.php"

    matchers:
      - type: dsl
        dsl:
          - "status_code == 200"
          - "contains(body, '<title>ICT Broadcast')"
        condition: and
