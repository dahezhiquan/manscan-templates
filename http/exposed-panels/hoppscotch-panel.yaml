id: hoppscotch-panel

info:
  name: Hoppscotch 面板识别（指纹识别）
  author: s4e-io
  severity: info
  description: |-
    检测到目标站点存在 Hoppscotch 相关响应特征。Hoppscotch 是 API 调试与协作工具，用于构造 HTTP、GraphQL、WebSocket 请求并管理集合和环境。模板请求 `/`，并通过页面标题或正文关键字、状态码、DSL 条件确认该系统指纹，用于资产识别、系统盘点和暴露面梳理。
  reference:
    - https://hoppscotch.io
  metadata:
    verified: true
    max-request: 1
    fofa-query: icon_hash="1531008637"
  tags: panel,login,hoppscotch,detect,discovery
http:
  - method: GET
    path:
      - "{{BaseURL}}"

    host-redirects: true
    max-redirects: 2

    matchers:
      - type: dsl
        dsl:
          - 'contains(body, "<title>Hoppscotch")'
          - 'status_code == 200'
        condition: and
