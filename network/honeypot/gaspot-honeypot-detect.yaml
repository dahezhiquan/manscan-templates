id: gaspot-honeypot-detect

info:
  name: GasPot 蜜罐识别（服务漏洞）
  author: UnaPibaGeek
  severity: info
  description: |
    该模板通过异常协议响应或默认特征识别目标是否为 GasPot Honeypot 蜜罐。
  metadata:
    max-request: 1
    vendor: gaspot
    product: veeder-root
    shodan-query: port:10001
  tags: gaspot,veeder-root,ics,honeypot,ir,cti,network,tcp,discovery
tcp:
  - inputs:
      - data: "^AI21400"

    host:
      - "{{Hostname}}"
    port: 10001
    read-size: 1024

    matchers:
      - type: word
        words:
          - "9999FF1B"
