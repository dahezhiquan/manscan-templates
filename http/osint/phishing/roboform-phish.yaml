id: roboform-phish

info:
  name: RoboForm 仿冒钓鱼网站（钓鱼网站识别）
  author: rxerium
  severity: info
  description: |
    检测到疑似仿冒 RoboForm 的钓鱼网站。模板在目标页面返回 200、页面内容命中 RoboForm 的登录或账号页面特征，且当前主机不属于 roboform.com 官方域名时触发，用于识别借用 RoboForm 品牌页面诱导用户信任的仿冒站点。
  reference:
    - https://roboform.com
  metadata:
    max-request: 1
  tags: phishing,roboform,osint,discovery
http:
  - method: GET
    path:
      - "{{BaseURL}}"

    host-redirects: true
    max-redirects: 2

    matchers-condition: and
    matchers:
      - type: word
        words:
          - 'Best Password Manager: No more writing down passwords'
          - 'Multi-platform secure solution to simplify your online experience. One click login on Chrome, Firefox, Safari, IE, Opera, Edge, Windows, Mac, iOS, Android.'
          - 'roboform'
        condition: and

      - type: status
        status:
          - 200

      - type: dsl
        dsl:
          - '!contains(host,"roboform.com")'
