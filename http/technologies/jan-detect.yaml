id: jan-detect

info:
  name: Jan AI 检测（指纹识别）
  author: insidetrust,hdm
  severity: info
  description: |-
    检测 Jan AI 本地服务器。Jan AI 是一款开源 ChatGPT 替代方案，在本地运行模型，并暴露一个由 Cortex 驱动、兼容 OpenAI 的 API（默认端口 1337）。
  reference:
    - https://github.com/janhq/jan
    - https://jan.ai/docs/server
  metadata:
    verified: false
    max-request: 2
    vendor: janhq
    product: jan
    shodan-query: 'port:1337 http.title:"Jan"'
    fofa-query: 'body="cortex"'
  tags: tech,detect,jan,llm

http:
  - method: GET
    path:
      - "{{BaseURL}}/v1/models"
      - "{{BaseURL}}/healthz"

    stop-at-first-match: true
    matchers:
      - type: dsl
        dsl:
          - 'contains_all(body, "\"object\":\"list\"", "\"object\":\"model\"") || contains(tolower(body), "ok")'
          - 'contains(content_type, "application/json")'
          - 'status_code == 200'
        condition: and
