id: rustdesk-server-pro-panel

info:
  name: RustDesk Server Pro 登录面板识别（指纹识别）
  author: rxerium
  severity: info
  description: |-
    RustDesk Server Pro 是远程桌面服务端管理平台，用于设备接入、用户、权限和中继服务管理。该模板请求 `/_admin/` 路径，并依据 HTTP 200 状态码、页面标题、正文关键字或品牌资源特征识别目标是否部署了该系统或暴露了对应入口，适用于资产指纹确认；命中结果仅表示系统特征匹配，不代表已确认存在未授权访问或可利用漏洞。
  reference:
  - https://rustdesk.com/docs/en/self-host/rustdesk-server-pro/console/
  - https://github.com/rustdesk/rustdesk-server-pro
  metadata:
    verified: true
    max-request: 1
    shodan-query: http.title:"RustDesk API Admin"
  tags: panel,rustdesk,server-pro,login,detect

http:
  - method: GET
    path:
      - "{{BaseURL}}/_admin/"

    matchers-condition: and
    matchers:
      - type: word
        part: body
        words:
          - '<title>Rustdesk API Admin</title>'

      - type: status
        status:
          - 200
