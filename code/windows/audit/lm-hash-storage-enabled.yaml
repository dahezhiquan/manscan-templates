id: lm-hash-storage-enabled

info:
  name: LM 哈希存储已启用（本地基线扫描）
  author: princechaddha
  severity: high
  description: |
    该模板检查系统是否允许存储 LM 哈希。LM 哈希算法过弱，容易被快速破解。
  impact: |
    攻击者获取哈希后可更容易还原明文密码。
  remediation: |
    禁用 LM 哈希存储，并在策略生效后强制用户更改密码。
  tags: windows,hashing,security,code,windows-audit

self-contained: true

code:
  - pre-condition: |
      IsWindows();
    engine:
      - powershell
      - powershell.exe
    args:
      - -ExecutionPolicy
      - Bypass
    pattern: "*.ps1"
    source: |
      Get-ItemProperty -Path 'HKLM:\SYSTEM\CurrentControlSet\Control\Lsa' -Name 'NoLMHash'

    matchers:
      - type: word
        words:
          - "NoLmHash     : 0"
