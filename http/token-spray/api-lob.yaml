id: api-lob

info:
  name: Lob API Token 可用性校验（token喷洒）
  author: daffainfo
  severity: info
  description: 该模板通过调用 Lob API 的已知接口验证提供的 token 是否有效，命中后通常表示可访问相关 API 能力。
  reference:
    - https://docs.lob.com/
    - https://github.com/daffainfo/all-about-apikey/tree/main/lob
  metadata:
    max-request: 1
  tags: token-spray,lob

self-contained: true

http:
  - raw:
      - |
        GET https://api.lob.com/v1/addresses HTTP/1.1
        Authorization: Basic {{base64(token + ':')}}
        Host: api.lob.com

    matchers:
      - type: word
        part: body
        words:
          - '"id"'
          - '"description"'
          - '"name"'
        condition: and
