id: api-square

info:
  name: Square API Token 可用性校验（token喷洒）
  author: zzeitlin
  severity: info
  description: 该模板通过调用 Square API 的已知接口验证提供的 token 是否有效，命中后通常表示可访问支付或身份验证能力。
  reference:
    - https://developer.squareup.com/explorer/square/locations-api/list-locations
    - https://github.com/daffainfo/all-about-apikey/tree/main/square
  metadata:
    max-request: 2
  tags: token-spray,square

self-contained: true

http:
  - method: GET
    path:
      - "https://connect.squareup.com/v2/locations"
      - "https://connect.squareupsandbox.com/v2/locations"

    headers:
      Content-Type: application/json
      Authorization: Bearer {{token}}
    matchers:
      - type: word
        part: body
        words:
          - 'errors'
        negative: true
