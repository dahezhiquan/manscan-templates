id: api-abstract-public-holidays

info:
  name: Abstract API Public Holidays Token 可用性校验（token喷洒）
  author: daffainfo
  severity: info
  description: 该模板通过调用 Abstract Public Holidays API 验证提供的 token 是否有效，命中后通常表示可访问节假日数据能力。
  reference:
    - https://www.abstractapi.com/api/holidays-api
    - https://github.com/daffainfo/all-about-apikey/tree/main/abstract-public-holidays
  metadata:
    max-request: 1
  tags: token-spray,abstractapi

self-contained: true

http:
  - method: GET
    path:
      - "https://holidays.abstractapi.com/v1/?api_key={{token}}&country=GB&year=2021&month=1&day=25"

    matchers:
      - type: word
        part: body
        words:
          - '"name_local":'
          - '"location":'
          - '"date_year":'
        condition: and
