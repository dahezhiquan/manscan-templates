id: array-networks-ssl-vpn-panel

info:
  name: Array Networks SSL VPN - 登录面板（暴露面识别）
  author: rxerium
  severity: info
  description: |-
    Array Networks AG 系列 SSL VPN 设备为企业提供远程访问。其 Web 登录门户（Pilot）通常位于端口 8889 或通过 /prx/ 路径访问。
  reference:
    - https://www.arraynetworks.com/products/ag-series.html
  metadata:
    max-request: 1
    shodan-query: 'http.title:"Array Networks Pilot Login"'
  tags: panel,array-networks,ssl-vpn,vpn,network

http:
  - method: GET
    path:
      - "{{BaseURL}}"


    matchers-condition: and
    matchers:
      - type: word
        words:
          - "Array Networks Pilot Login"
          - "Array Networks"
          - "ArrayOS"
        condition: or
        part: body

      - type: status
        status:
          - 200
