id: jsf-detect

info:
  name: JavaServer Faces 指纹识别（指纹识别）
  author: brenocss,Moritz Nentwig
  severity: info
  description: 用于识别目标前端或应用中是否使用 JavaServer Faces，模板会结合特定路径或已知端点进行技术栈指纹匹配。
  metadata:
    max-request: 1
  tags: jsf,tech,primefaces,richfaces,discovery

http:
  - method: GET
    path:
      - "{{BaseURL}}"

    host-redirects: true
    max-redirects: 3

    matchers-condition: or
    matchers:
      - type: dsl
        name: javafaces
        dsl:
          - "(contains(body, 'javax.faces.resource') || contains(body, 'javax.faces.ViewState'))"

      - type: dsl
        name: primefaces
        dsl:
          - "contains(body, 'primefaces')"
          - "contains(body, 'javax.faces.resource') || contains(body, 'javax.faces.ViewState')"
        condition: and

      - type: dsl
        name: richfaces
        dsl:
          - "contains(body, 'richfaces')"
          - "contains(body, 'javax.faces.resource') || contains(body, 'javax.faces.ViewState')"
        condition: and
