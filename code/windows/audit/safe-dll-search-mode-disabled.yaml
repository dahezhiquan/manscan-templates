id: safe-dll-search-mode-disabled

info:
  name: 安全 DLL 搜索模式已禁用（本地基线扫描）
  author: princechaddha
  severity: high
  description: |
    该模板检查 Safe DLL Search Mode 是否禁用。禁用后应用更可能从不可信路径加载 DLL。
  impact: |
    攻击者可放置恶意 DLL 实现 DLL 劫持并执行代码。
  remediation: |
    启用 SafeDllSearchMode，并减少可写目录中的应用加载风险。
  tags: windows,dll,code,windows-audit

self-contained: true

code:
  - pre-condition: |
      IsWindows();
    engine:
      - powershell
      - powershell.exe
    args:
      - -ExecutionPolicy
      - Bypass
    pattern: "*.ps1"
    source: |
      $dllSearchMode = Get-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Session Manager' -Name 'SafeDllSearchMode'
      Write-Host "SafeDllSearchMode: $($dllSearchMode.SafeDllSearchMode)"

    matchers:
      - type: word
        words:
          - "SafeDllSearchMode: 0"
