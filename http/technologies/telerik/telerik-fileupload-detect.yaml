id: telerik-fileupload-detect

info:
  name: Telerik UI FileUpload Handler 指纹识别（指纹识别）
  author: organiccrap
  severity: info
  description: >-
    Telerik UI FileUpload Handler 是 Telerik ASP.NET Web UI 组件中的上传处理入口，用于支持文件上传控件。该模板通过请求目标服务并检查预设路径或首页响应、页面正文关键字等指纹特征，判断目标是否使用或暴露了
    Telerik UI FileUpload Handler 相关组件；命中结果仅表示指纹特征匹配，可用于资产盘点、技术栈识别和后续安全评估，不代表已确认存在可利用漏洞。
  metadata:
    max-request: 1
  tags: tech,telerik,fileupload,intrusive,discovery
http:
  - method: GET
    path:
      - "{{BaseURL}}/Telerik.Web.UI.WebResource.axd?type=rau"

    matchers:
      - type: word
        words:
          - "RadAsyncUpload handler is registered succesfully"
