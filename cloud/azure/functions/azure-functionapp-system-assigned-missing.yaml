id: azure-functionapp-system-assigned-missing
info:
  name: Azure Functions 未启用系统分配托管身份（云安全）
  author: princechaddha
  severity: medium
  description: Azure Functions 的系统分配托管身份由 Azure 与函数应用生命周期绑定，可在不保存长期密钥的情况下访问受 Microsoft Entra ID 保护的资源。本模板查询 identity.type，并在返回空值或 UserAssigned 时报告未按该基线使用系统分配托管身份。
  impact: |
    - 未配置任何托管身份时，应用往往需要在配置或代码中保存服务凭据，增加泄露、滥用和轮换失误风险。
    - 使用用户分配身份虽可满足部分场景，但若生命周期和授权范围未单独管理，可能造成跨应用复用和权限边界扩大。
  remediation: |
    - 在不需要跨应用共享身份的情况下，为函数应用启用系统分配托管身份，并仅授予访问目标资源所需的最小角色。
    - 若业务必须使用用户分配身份，应明确记录例外原因、限制授权范围并定期审计其关联应用。
  reference:
    - https://docs.microsoft.com/en-us/azure/app-service/overview-managed-identity
  metadata:
    vendor: microsoft
    product: azure-functions
  tags: cloud,devops,azure,microsoft,functionapp,azure-cloud-config

flow: |
  code(1);
  for (let AppData of iterate(template.functionApps)) {
    AppData = JSON.parse(AppData);
    set("name", AppData.name);
    set("resourceGroup", AppData.resourceGroup);
    code(2);
  }

self-contained: true
code:
  - engine:
      - sh
      - bash
    source: |
      az functionapp list --query '[*].{name:name, resourceGroup:resourceGroup}' --output json

    extractors:
      - type: json
        name: functionApps
        internal: true
        json:
          - '.[]'

  - engine:
      - sh
      - bash
    source: |
      az functionapp show --name $name --resource-group $resourceGroup --query 'identity.type' --output json

    matchers:
      - type: word
        words:
          - ""
          - "UserAssigned"

    extractors:
      - type: dsl
        dsl:
          - 'name + " does not use system-assigned managed identity"'
