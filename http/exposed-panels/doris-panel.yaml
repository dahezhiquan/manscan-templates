id: doris-panel

info:
  name: Doris 面板识别（指纹识别）
  author: ritikchaddha
  severity: info
  description: |-
    检测到目标站点存在 Doris 相关响应特征。Doris 是数据库或数据服务的 Web 管理入口，用于查看数据、执行查询、管理索引、集合、集群或连接配置。模板请求 `/login`，并通过页面标题或正文关键字、状态码、重定向特征确认该系统指纹，用于资产识别、系统盘点和暴露面梳理。
  classification:
    cpe: cpe:2.3:a:apache:doris:*:*:*:*:*:*:*:*
  metadata:
    verified: true
    max-request: 1
    vendor: apache
    product: doris
    shodan-query: http.favicon.hash:24048806
  tags: doris,panel,login,detect,discovery
http:
  - method: GET
    path:
      - "{{BaseURL}}/login"

    matchers-condition: and
    matchers:
      - type: word
        part: body
        words:
          - 'Doris</title>'
          - 'location.pathname.split'
        condition: and

      - type: status
        status:
          - 200
