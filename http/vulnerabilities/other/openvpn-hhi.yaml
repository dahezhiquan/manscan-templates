id: openvpn-hhi

info:
  name: OpenVPN Host Header Injection
  author: twitter.com/Dheerajmadhukar
  severity: info
  description: OpenVPN Host Header Injection 存在安全漏洞。该模板依据实际请求路径、返回特征与命中证据验证目标是否暴露相应漏洞。
  metadata:
    max-request: 1
  tags: openvpn,hostheader-injection,vuln

http:
  - method: GET
    path:
      - "{{BaseURL}}/"
    headers:
      Host: "{{randstr}}.tld"

    matchers-condition: and
    matchers:
      - type: word
        words:
          - "https://{{randstr}}.tld/__session_start__/"
          - "openvpn_sess"
        part: header
        condition: and

      - type: status
        status:
          - 302
