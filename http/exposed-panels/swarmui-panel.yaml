id: swarmui-panel

info:
  name: SwarmUI 登录面板识别（指纹识别）
  author: rxerium
  severity: info
  description: |-
    SwarmUI 是 Stable Diffusion 图像生成 Web UI，用于管理模型、提示词和生成任务。该模板请求首页、`/Login`，并依据 HTTP 200 状态码、页面标题、正文关键字或品牌资源特征识别目标是否部署了该系统或暴露了对应入口，适用于资产指纹确认；命中结果仅表示系统特征匹配，不代表已确认存在未授权访问或可利用漏洞。
  reference:
  - https://github.com/mcmonkeyprojects/SwarmUI
  metadata:
    verified: true
    max-request: 1
    vendor: mcmonkeyprojects
    product: SwarmUI
    shodan-query: 'http.title:"SwarmUI"'
  tags: panel,swarmui,stable-diffusion,ai,image-generation,detect,discovery

http:
  - method: GET
    path:
      - "{{BaseURL}}"
      - "{{BaseURL}}/Login"

    stop-at-first-match: true
    host-redirects: true
    max-redirects: 2

    matchers-condition: and
    matchers:
      - type: word
        part: body
        words:
          - 'version-display'
          - 'SwarmUI'
        condition: and

      - type: status
        status:
          - 200
