id: secui-waf-detect

info:
  name: SECUI WAF 指纹识别（指纹识别）
  author: gy741
  severity: info
  description: >-
    SECUI WAF 是 Web 应用防火墙产品，用于检测、过滤和防护 Web 攻击流量。该模板通过请求目标服务并检查预设路径或首页响应、favicon 哈希、DSL
    条件等指纹特征，判断目标是否使用或暴露了 SECUI WAF 相关组件；命中结果仅表示指纹特征匹配，可用于资产盘点、技术栈识别和后续安全评估，不代表已确认存在可利用漏洞。
  reference:
  - https://www.secui.com/en/network/bluemaxng
  classification:
    cvss-metrics: CVSS:3.0/AV:N/AC:L/PR:N/UI:N/S:U/C:N/I:N/A:N
    cvss-score: 0
    cwe-id: CWE-200
  metadata:
    verified: true
    max-request: 1
    shodan-query: http.favicon.hash:-1101206929
  tags: tech,panel,secui,discovery
http:
  - method: GET
    path:
      - "{{BaseURL}}/static/login/favicon.ico"

    matchers:
      - type: dsl
        dsl:
          - "status_code==200 && (\"-1101206929\" == mmh3(base64_py(body)))"
