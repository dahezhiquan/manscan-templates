id: sphinxsearch-config

info:
  name: Sphinx Search 配置暴露（暴露面识别）
  author: gtrrnr
  severity: high
  description: 检测到对外可访问的 Sp。这类配置资源可能包含部署细节、访问凭据、内部地址、组件版本或调试开关，公开暴露后会显著增加被侦察和后续利用的风险。
  impact: |
    - 暴露的资源可能泄露敏感配置、内部实现细节或历史数据。
    - 攻击者可结合这些信息开展进一步侦察、未授权访问或定向利用。
  reference:
    - https://github.com/manticorp/SphinxSearch/blob/master/sphinx.conf.example
  metadata:
    verified: true
    max-request: 7
  tags: sphinx,sphinxsearch,exposure,config,vuln

http:
  - method: GET
    path:
      - "{{BaseURL}}/config/development.sphinx.conf"
      - "{{BaseURL}}/config/production.sphinx.conf"
      - "{{BaseURL}}/configs/sphinx.conf"
      - "{{BaseURL}}/search/configs/sphinx.conf"
      - "{{BaseURL}}/sphinx.conf"
      - "{{BaseURL}}/sphinx/sphinx.conf"
      - "{{BaseURL}}/sphinxsearch/sphinx.conf"

    stop-at-first-match: true
    matchers-condition: and
    matchers:
      - type: word
        part: body
        words:
          - "sql_user"
          - "sql_pass"
          - "indexer"
        condition: and

      - type: status
        status:
          - 200
