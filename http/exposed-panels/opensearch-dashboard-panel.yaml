id: opensearch-dashboard-panel

info:
  name: OpenSearch Dashboard 面板识别（指纹识别）
  author: ritikchaddha
  severity: info
  description: |-
    检测到目标站点存在 OpenSearch Dashboard 相关响应特征。OpenSearch Dashboard 是云原生、中间件或集群管理平台，用于管理服务、工作负载、消息流、API 网关、配置和运行状态。模板请求 `/app/login?`，并通过页面标题或正文关键字确认该系统指纹，用于资产识别、系统盘点和暴露面梳理。
  reference:
    - https://opensearch.org/docs/latest/dashboards/index/
  metadata:
    verified: true
    max-request: 1
    shodan-query: title:"OpenSearch"
    fofa-query: title="OpenSearch"
  tags: opensearch,dashboard,login,panel,detect,discovery
http:
  - method: GET
    path:
      - "{{BaseURL}}/app/login?"

    matchers:
      - type: word
        part: body
        words:
          - "OpenSearch Dashboard"
          - "login"
        condition: and
