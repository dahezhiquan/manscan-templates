id: infoblox-nios-panel

info:
  name: Infoblox NIOS 登录面板识别（指纹识别）
  author: EgemenKochisarli
  severity: info
  description: |-
    检测到目标站点存在 Infoblox NIOS 相关响应特征。Infoblox NIOS 是 DNS、DHCP 与 IPAM 网络服务平台，Web 面板用于管理地址、域名、租约和网络自动化配置。模板请求 `/ui/`，并通过页面标题或正文关键字、状态码确认该系统指纹，用于资产识别、系统盘点和暴露面梳理。
  reference:
    - https://www.infoblox.com/glossary/network-identity-operating-system-nios/
  classification:
    cvss-metrics: CVSS:3.0/AV:N/AC:L/PR:N/UI:N/S:U/C:N/I:N/A:N
    cwe-id: CWE-200
    cpe: cpe:2.3:o:infoblox:nios:*:*:*:*:*:*:*:*
  metadata:
    max-request: 1
    vendor: infoblox
    product: nios
    shodan-query: http.title:"Infoblox"
  tags: panel,infoblox,nios,login,detect,discovery
http:
  - method: GET
    path:
      - "{{BaseURL}}/ui/"

    matchers-condition: and
    matchers:
      - type: word
        part: body
        words:
          - "<title>Infoblox Grid"
          - "<title>Infoblox System"
        condition: or

      - type: status
        status:
          - 200
