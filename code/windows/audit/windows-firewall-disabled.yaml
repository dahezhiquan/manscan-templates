id: windows-firewall-disabled

info:
  name: Windows 防火墙已禁用（本地基线扫描）
  author: princechaddha
  severity: high
  description: |
    该模板检查任一网络配置文件下 Windows 防火墙是否关闭。防火墙关闭会暴露本机服务。
  impact: |
    攻击者可更容易访问本机开放端口并尝试利用漏洞。
  remediation: |
    为域、专用和公用网络配置文件启用 Windows 防火墙并配置最小允许规则。
  tags: windows,firewall,code,windows-audit

self-contained: true

code:
  - pre-condition: |
      IsWindows();
    engine:
      - powershell
      - powershell.exe
    args:
      - -ExecutionPolicy
      - Bypass
    pattern: "*.ps1"
    source: |
      Get-NetFirewallProfile | Where-Object { $_.Enabled -eq "False" }

    matchers:
      - type: word
        words:
          - "False"
