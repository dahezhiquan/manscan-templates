id: rsync-version

info:
  name: Rsync 版本识别（指纹识别）
  author: DhiyaneshDK
  severity: low
  description: |
    该模板识别目标 Rsync 协议版本。模板建立 Rsync 连接并读取服务端横幅，从返回的版本字段中提取协议版本，用于判断兼容性与历史风险面。
  impact: |
    - Rsync 版本信息可帮助攻击者判断服务补丁水平和协议兼容性。
    - 暴露的版本指纹可用于匹配历史漏洞或识别需要加固的旧服务。
  remediation: |
    - 限制 Rsync 服务访问来源，关闭不再需要的公开同步入口。
    - 将 Rsync 更新到受支持版本，并审计模块认证和权限配置。
  metadata:
    verified: true
    max-request: 1
    shodan-query: port:"873"
  tags: js,network,rsync,enum,discovery,detect

javascript:
  - pre-condition: |
      isPortOpen(Host,Port);
    code: |
      let m = require('nuclei/rsync');
      let response = m.IsRsync(Host,Port);
      Export(response);

    args:
      Host: "{{Host}}"
      Port: 873

    matchers:
      - type: dsl
        dsl:
          - "len(version) != 0"

    extractors:
      - type: json
        name: version
        json:
          - .Banner
