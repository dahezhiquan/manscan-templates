id: localgpt-panel

info:
  name: LocalGPT 面板识别（指纹识别）
  author: rxerium
  severity: info
  description: |-
    检测到目标站点存在 LocalGPT 相关响应特征。LocalGPT 是 AI、LLM 或机器学习相关平台，用于管理模型、数据集、工作区、推理服务、评估或调用追踪。模板请求 `/`，并通过页面标题或正文关键字、状态码确认该系统指纹，用于资产识别、系统盘点和暴露面梳理。
  reference:
    - https://github.com/PromtEngineer/localGPT
  metadata:
    verified: true
    max-request: 1
    vendor: promptengineer
    product: localgpt
    shodan-query: 'http.title:"LocalGPT"'
  tags: panel,localgpt,llm,ai,rag,detect,discovery
http:
  - method: GET
    path:
      - "{{BaseURL}}"

    host-redirects: true
    max-redirects: 2

    matchers-condition: and
    matchers:
      - type: word
        part: body
        words:
          - "LocalGPT"

      - type: status
        status:
          - 200
