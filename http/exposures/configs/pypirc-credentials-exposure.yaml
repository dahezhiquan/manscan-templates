id: pypirc-credentials-exposure

info:
  name: Python .pypirc 凭据泄露（暴露面识别）
  author: ChrisJr404
  severity: high
  description: |
    检测到目标站点可直接访问 Python .pypirc 凭据。.pypirc 是 Python 打包上传配置文件，可能保存 PyPI 或私有包仓库的用户名、密码或 API Token。该模板请求 `/.pypirc`、`/.config/.pypirc`、`/.pypirc.bak`，并通过 HTTP 状态码、响应正文关键字、文件格式特征、正则匹配或响应头进行确认。配置文件公开后可能泄露部署细节、内部路径、依赖版本、环境变量、访问凭据或调试信息，增加被侦察和后续利用的风险。
  impact: |-
    - 泄露的密码、API Key、访问令牌、私钥或服务账号凭据可能被用于直接访问云资源、代码仓库、数据库、邮件服务或内部系统。
    - 攻击者可能借助有效凭据读取或篡改业务数据、发布恶意制品、创建持久化访问、冒用服务身份或产生额外资源费用。
    - 即使凭据权限有限，也会暴露账号命名、环境划分和内部系统关系，辅助后续横向移动。
  remediation: |-
    - 立即撤销并轮换暴露文件中可能出现的密码、API Key、访问令牌、SSH/SSL 私钥、数据库连接串和云访问密钥。
    - 将敏感配置迁移到密钥管理系统、环境变量注入或受控配置中心，避免随静态文件对外发布。
    - 限制相关账号权限并启用最小权限、MFA、访问审计和异常调用告警。
    - 排查近期登录、API 调用、代码仓库、云资源和制品库操作记录，确认是否存在未授权使用。
  reference:
    - https://packaging.python.org/en/latest/specifications/pypirc/
    - https://twine.readthedocs.io/en/stable/
  classification:
    cvss-metrics: CVSS:3.1/AV:N/AC:L/PR:N/UI:N/S:U/C:H/I:N/A:N
    cvss-score: 7.5
    cwe-id: CWE-522
  metadata:
    verified: false
    max-request: 2
    google-query: intitle:"index of" ".pypirc"
  tags: exposure,config,pypi,python,credentials,files

http:
  - raw:
      - |
        GET /.pypirc HTTP/1.1
        Host: {{Hostname}}
      - |
        GET /.config/.pypirc HTTP/1.1
        Host: {{Hostname}}
      - |
        GET /.pypirc.bak HTTP/1.1
        Host: {{Hostname}}

    stop-at-first-match: true
    matchers-condition: and
    matchers:
      - type: word
        part: body
        words:
          - "[distutils]"
          - "[pypi]"
          - "[testpypi]"
        condition: or

      - type: word
        part: body
        words:
          - "password"
          - "username"
        condition: or

      - type: word
        part: body
        words:
          - "MongoDB over HTTP on the native"
          - "application/javascript"
          - "application/x-javascript"
          - "application/json"
          - "application/xml"
          - "text/xml"
          - "<html"
          - "<!doctype"
          - "<script"
          - "<meta"
          - "image/"
          - "Response xmlns"
        condition: or
        negative: true
