id: perplexica-panel

info:
  name: Perplexica 面板识别（指纹识别）
  author: rxerium
  severity: info
  description: |-
    Perplexica 是开源 AI 搜索应用，用于基于大语言模型的检索、问答和知识聚合。该模板请求首页，并依据 HTTP 200 状态码、页面标题、正文关键字或品牌资源特征识别目标是否部署了该系统或暴露了对应入口，适用于资产指纹确认；命中结果仅表示系统特征匹配，不代表已确认存在未授权访问或可利用漏洞。
  reference:
  - https://github.com/ItzCrazyKns/Perplexica
  metadata:
    verified: true
    max-request: 1
    vendor: perplexica
    product: perplexica
    shodan-query: 'http.title:"Perplexica"'
  tags: panel,perplexica,ai,search,llm,detect,discovery

http:
  - method: GET
    path:
      - "{{BaseURL}}"

    host-redirects: true
    max-redirects: 2

    matchers-condition: and
    matchers:
      - type: word
        part: body
        words:
          - "Perplexica"

      - type: status
        status:
          - 200
