id: ec2-unrestricted-mssql
info:
  name: EC2 安全组对公网开放 Microsoft SQL Server 端口（云安全）
  author: princechaddha
  severity: high
  description: EC2 安全组对公网开放 Microsoft SQL Server 端口是一类数据库服务暴露风险，TCP 1433 面向任意来源会增加账号爆破、数据库探测和漏洞利用风险。数据库端口通常应仅对应用私有子网或受控管理网络开放。模板通过 `describe-security-groups` 筛选 1433 端口且来源为 `0.0.0.0/0` 的入站规则，并输出命中的安全组 ID。
  impact: |
    - SQL Server 可被互联网扫描和爆破，弱口令或漏洞可能导致数据库被接管。
    - 数据库暴露会增加敏感数据泄露、篡改和勒索攻击风险。
  remediation: |
    - 移除面向公网的 1433 端口入站规则，仅允许应用层或受控运维网络访问。
    - 强化数据库认证、补丁、审计和传输加密，避免数据库服务直接暴露。
  reference:
    - https://docs.aws.amazon.com/AWSEC2/latest/UserGuide/ec2-security-groups.html
  metadata:
    vendor: amazon
    product: ec2
  tags: cloud,devops,aws,amazon,ec2,aws-cloud-config

variables:
  region: "us-east-1"

self-contained: true
code:
  - engine:
      - sh
      - bash
    source: |
      aws ec2 describe-security-groups --region $region --filters Name=ip-permission.from-port,Values=1433 Name=ip-permission.to-port,Values=1433 Name=ip-permission.cidr,Values='0.0.0.0/0' --output json --query 'SecurityGroups[*].GroupId'

    extractors:
      - type: json
        name: securitygroup
        internal: true
        json:
          - '.[]'

      - type: dsl
        dsl:
          - 'securitygroup + " security group(s) alows unrestricted access (0.0.0.0/0 or ::/0) on TCP port 1433"'
