id: kubernetes-enterprise-manager

info:
  name: Kubernetes Enterprise Manager 面板识别（指纹识别）
  author: pussycat0x
  severity: info
  description: |-
    检测到目标站点存在 Kubernetes Enterprise Manager 相关响应特征。Kubernetes Enterprise Manager 是云原生、中间件或集群管理平台，用于管理服务、工作负载、消息流、API 网关、配置和运行状态。模板请求 `/`，并通过页面标题或正文关键字、状态码确认该系统指纹，用于资产识别、系统盘点和暴露面梳理。
  classification:
    cvss-metrics: CVSS:3.1/AV:N/AC:L/PR:N/UI:N/S:U/C:N/I:N/A:N
    cwe-id: CWE-200
    cpe: cpe:2.3:a:kubernetes:kubernetes:*:*:*:*:*:*:*:*
  metadata:
    max-request: 1
    vendor: kubernetes
    product: kubernetes
    fofa-query:
      - app="Kubernetes-Enterprise-Manager"
      - title="kubernetes web view"
      - app="kubernetes-enterprise-manager"
    shodan-query: http.title:"kubernetes web view"
    google-query: intitle:"kubernetes web view"
  tags: tech,kubernetes,panel,discovery
http:
  - method: GET
    path:
      - "{{BaseURL}}"

    matchers-condition: and
    matchers:
      - type: word
        part: body
        words:
          - "Kubernetes Enterprise Manager"

      - type: status
        status:
          - 200
