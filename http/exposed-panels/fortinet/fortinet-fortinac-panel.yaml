id: fortinet-fortinac-panel

info:
  name: Fortinet FortiNAC 登录面板识别（暴露面识别）
  author: johnk3r
  severity: info
  description: 该模板通过识别 Fortinet FortiNAC 登录入口的页面标题、特征文本或重定向行为，判断目标是否暴露了对应的认证界面。若命中，说明该登录面板对外可访问，可用于暴露面梳理与后续安全评估。
  classification:
    cvss-metrics: CVSS:3.1/AV:N/AC:L/PR:N/UI:N/S:U/C:N/I:N/A:N
    cwe-id: CWE-200
    cpe: cpe:2.3:a:fortinet:fortinac:*:*:*:*:*:*:*:*
  metadata:
    verified: true
    max-request: 1
    vendor: fortinet
    product: fortinac
    shodan-query:
      - http.title:"Fortinac"
      - http.title:"fortinac"
    fofa-query: title="fortinac"
    google-query: intitle:"fortinac"
  tags: panel,fortinet,fortinac,login,discovery

http:
  - method: GET
    path:
      - '{{BaseURL}}/WelcomeActions.jsp?action=ajaxGetWelcomeViewInfo'

    matchers-condition: and
    matchers:
      - type: word
        part: body
        words:
          - 'FortiNAC'
          - '"product":'
        condition: and

      - type: status
        status:
          - 200

    extractors:
      - type: regex
        part: body
        regex:
          - '"version":"([0-9.]+)"'
