id: posteio-admin-panel

info:
  name: Poste.io Admin 登录面板识别（指纹识别）
  author: ritikchaddha
  severity: info
  description: Poste.io Admin 是邮件服务器管理平台，用于域、邮箱、证书和邮件服务配置。该模板请求 `/admin/login` 路径，并依据 HTTP 200 状态码、页面标题、正文关键字或品牌资源特征识别目标是否部署了该系统或暴露了对应入口，适用于资产指纹确认；命中结果仅表示系统特征匹配，不代表已确认存在未授权访问或可利用漏洞。
  classification:
    cpe: cpe:2.3:a:analogic:poste.io:*:*:*:*:*:*:*:*
  metadata:
    verified: true
    max-request: 1
    vendor: analogic
    product: poste.io
    shodan-query: title:"Administration login" html:"poste<span"
  tags: panel,poste,login,detect,discovery

http:
  - method: GET
    path:
      - "{{BaseURL}}/admin/login"

    matchers-condition: and
    matchers:
      - type: word
        part: body
        words:
          - "poste<span"
          - "Administration login"
        condition: and

      - type: status
        status:
          - 200
