id: springboot-loggers

info:
  name: Springboot 日志gers 暴露
  author: that_juan_,dwisiswant0,wdahlenb,TheZakMan
  severity: low
  description: |
    检测到 Springboot 日志gers 暴露。目标响应或文件中可能暴露配置、凭据、密钥、令牌、环境变量或历史记录等敏感信息，可能被用于进一步入侵。
  metadata:
    max-request: 2
    verified: true
  tags: springboot,exposure,misconfig,vuln

http:
  - method: GET
    path:
      - "{{BaseURL}}/loggers"
      - "{{BaseURL}}/actuator/loggers"

    stop-at-first-match: true

    matchers-condition: and
    matchers:
      - type: dsl
        dsl:
          - 'status_code == 200'
          - 'contains(body, "\"loggers\"")'
          - 'contains_any(tolower(content_type), "application/json", "application/vnd.spring-boot")'
        condition: and

      - type: word
        part: body
        words:
          - '"levels"'
          - '"configuredLevel"'
          - '"effectiveLevel"'
        condition: or
