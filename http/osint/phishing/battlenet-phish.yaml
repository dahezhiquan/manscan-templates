id: battlenet-phish

info:
  name: Battle.net 仿冒钓鱼网站（钓鱼网站识别）
  author: rxerium
  severity: info
  description: |
    检测到疑似仿冒 Battle.net 的钓鱼网站。模板在目标页面返回 200、页面内容命中 Battle.net 的登录或账号页面特征，且当前主机不属于 battle.net、blizzard.com 官方域名时触发，用于识别借用 Battle.net 品牌页面诱导用户信任的仿冒站点。
  reference:
    - https://eu.account.battle.net/login
  metadata:
    max-request: 1
  tags: phishing,battlenet,osint,discovery
http:
  - method: GET
    path:
      - "{{BaseURL}}"

    host-redirects: true
    max-redirects: 2

    matchers-condition: and
    matchers:
      - type: word
        words:
          - 'Battle.net Login'

      - type: status
        status:
          - 200

      - type: dsl
        dsl:
          - '!contains(host,"battle.net")'
          - '!contains(host,"blizzard.com")'
