id: ansible-awx-detect

info:
  name: Ansible AWX 指纹识别（指纹识别）
  author: Adam Crosser
  severity: info
  description: Ansible AWX 是 Ansible 自动化平台的 Web 管理界面，用于作业模板、凭据、清单和自动化任务管理。该模板请求 `/api/`，并依据 HTTP 200 状态码、页面标题、正文关键字或品牌资源特征识别目标是否使用或暴露了 Ansible AWX 相关组件，适用于资产盘点、技术栈识别和后续安全评估；命中结果仅表示指纹特征匹配，不代表已确认存在可利用漏洞。
  reference:
  - https://github.com/ansible/awx
  metadata:
    verified: true
    max-request: 1
    shodan-query: html:'Select a frequency for snapshot retention'
  tags: tech,ansible,awx,discovery

http:
  - method: GET
    path:
      - "{{BaseURL}}/api/"

    matchers-condition: and
    matchers:
      - type: word
        part: body
        words:
          - '"description":"AWX REST API"'

      - type: status
        status:
          - 200
