id: azure-nsg-icmp-unrestricted
info:
  name: Azure NSG 对互联网开放 ICMP（云安全）
  author: princechaddha
  severity: high
  description: ICMP 常用于连通性探测、错误通知和网络诊断，但允许互联网任意来源访问会暴露主机和网络边界的响应特征。本模板查询入站允许的 ICMP NSG 规则，并在来源地址为 *、internet 或 any 时报告。
  impact: |
    - 攻击者可据此识别活动主机、网络拓扑和可达资源，为后续端口扫描、漏洞利用和横向移动提供信息。
    - 大量 ICMP 请求还可能消耗网络和主机资源，干扰正常诊断并造成可用性下降。
  remediation: |
    - 关闭面向互联网的任意来源 ICMP 入站规则，仅向监控网段或运维网络开放必要类型。
    - 对必须保留的探测流量配置速率限制和监控，避免将 ICMP 作为唯一的可用性判断依据。
  reference:
    - https://docs.microsoft.com/en-us/azure/virtual-network/network-security-groups-overview
  metadata:
    vendor: microsoft
    product: azure-network-security-group
  tags: cloud,devops,azure,microsoft,nsg,azure-cloud-config

flow: |
  code(1);
  for (let NsgData of iterate(template.nsgdata)) {
    NsgData = JSON.parse(NsgData)
    set("nsg", NsgData.name)
    set("resourcegroup", NsgData.resourceGroup)
    code(2)
  }

self-contained: true
code:
  - engine:
      - sh
      - bash
    source: |
      az network nsg list --query '[*].{name:name, resourceGroup:resourceGroup}' --output json

    extractors:
      - type: json
        name: nsgdata
        internal: true
        json:
          - '.[]'

  - engine:
      - sh
      - bash
    source: |
      az network nsg rule list --nsg-name $nsg --resource-group $resourcegroup --query "[?direction=='Inbound' && access=='Allow' && protocol=='ICMP']"

    matchers:
      - type: word
        words:
          - '"sourceAddressPrefix": "*"'
          - '"sourceAddressPrefix": "internet"'
          - '"sourceAddressPrefix": "any"'

    extractors:
      - type: dsl
        dsl:
          - 'nsg + " has unrestricted access using ICMP"'
