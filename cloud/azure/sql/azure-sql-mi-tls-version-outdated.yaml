id: azure-sql-mi-tls-version-outdated
info:
  name: Azure SQL Managed Instance TLS 版本低于 1.2（云安全）
  author: princechaddha
  severity: medium
  description: Azure SQL Managed Instance 的 minimalTlsVersion 用于限制客户端连接可协商的最低 TLS 版本，低于组织基线时会削弱数据库通信保护。本模板枚举托管实例并查询 minimalTlsVersion，在结果包含 1. 且不包含 1.2 时报告。
  impact: |
    - 旧版 TLS 可能允许较弱的协议协商，增加数据库凭据、查询内容和返回数据被窃听或篡改的风险。
    - 低于 TLS 1.2 的配置可能不符合组织安全基线，并增加与现代客户端和合规系统的兼容性问题。
  remediation: |
    - 将 minimalTlsVersion 设置为 1.2 或更高的受支持版本，并提前验证应用、驱动和集成服务兼容性。
    - 切换后监控连接失败和协议协商异常，逐步淘汰仍使用旧 TLS 版本的客户端。
  reference:
    - https://docs.microsoft.com/en-us/azure/azure-sql/managed-instance/transact-sql-tls-configuration
  metadata:
    vendor: microsoft
    product: azure-sql-managed-instance
  tags: cloud,devops,azure,microsoft,azure-sql,azure-cloud-config

flow: |
  code(1);
  for (let InstanceData of iterate(template.instanceList)) {
    set("ids", InstanceData);
    code(2);
  }

self-contained: true
code:
  - engine:
      - sh
      - bash
    source: |
      az sql mi list --query '[*].{"id":id}'

    extractors:
      - type: json
        name: instanceList
        internal: true
        json:
          - '.[]'

  - engine:
      - sh
      - bash
    source: |
      az sql mi show --ids "$ids" --query 'minimalTlsVersion'

    matchers-condition: and
    matchers:
      - type: word
        part: body
        words:
          - "1."

      - type: word
        words:
          - '"1.2"'
        negative: true

    extractors:
      - type: dsl
        dsl:
          - 'ids + " does not use TLS 1.2"'
