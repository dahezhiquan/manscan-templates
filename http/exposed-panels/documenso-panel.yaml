id: documenso-panel

info:
  name: Documenso 面板 - 检测（暴露面识别）
  author: ChrisJr404
  severity: info
  description: |-
    检测到 Documenso——一个开源文档签署平台，作为 DocuSign 的自托管替代方案，基于 React Router 构建，后端使用 Prisma。
  reference:
    - https://github.com/documenso/documenso
    - https://documenso.com/
  metadata:
    verified: true
    max-request: 1
    vendor: documenso
    product: documenso
    shodan-query: http.title:"Documenso"
    fofa-query: title="Documenso"
  tags: panel,documenso,docusign,signing,selfhosted,detect

http:
  - method: GET
    path:
      - "{{BaseURL}}"

    host-redirects: true
    max-redirects: 2

    matchers:
      - type: dsl
        dsl:
          - "status_code == 200"
          - "contains_all(body, \"Documenso - The Open Source DocuSign Alternative\", \"@documenso\")"
        condition: and
