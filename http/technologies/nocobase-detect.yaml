id: nocobase-detect

info:
  name: NocoBase 指纹识别（指纹识别）
  author: Fur1na
  severity: info
  description: >-
    NocoBase 是开源无代码/低代码平台，用于构建内部管理系统、数据应用和业务工作流。该模板通过请求目标服务并检查预设路径或首页响应、页面正文关键字、状态码等指纹特征，判断目标是否使用或暴露了
    NocoBase 相关组件；命中结果仅表示指纹特征匹配，可用于资产盘点、技术栈识别和后续安全评估，不代表已确认存在可利用漏洞。
  metadata:
    verified: true
    max-request: 1
    fofa-query: body="__nocobase_public_path__"
    zoomeye-query: app="NocoBase"
  tags: tech,nocobase,detect,discovery
http:
  - method: GET
    path:
      - "{{BaseURL}}"

    matchers-condition: and
    matchers:
      - type: word
        part: body
        words:
          - "__nocobase_public"
          - "__nocobase_api"
          - "__nocobase_ws"
        condition: or

      - type: status
        status:
          - 200
