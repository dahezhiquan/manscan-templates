id: arize-phoenix-panel

info:
  name: Arize Phoenix 识别（指纹识别）
  author: rxerium
  severity: info
  description: |-
    检测到目标站点存在 Arize Phoenix 相关响应特征。Arize Phoenix 是面向 LLM 和机器学习应用的可观测性平台，用于分析追踪、评估、检索增强和模型行为。模板请求 `/`，并通过页面标题或正文关键字、状态码确认该系统指纹，用于资产识别、系统盘点和暴露面梳理。
  reference:
    - https://github.com/Arize-ai/phoenix
    - https://phoenix.arize.com
  metadata:
    verified: true
    max-request: 1
    vendor: Arize-ai
    product: phoenix
    shodan-query: 'http.title:"Phoenix" port:6006 http.html:"arize"'
  tags: panel,arize,phoenix,llm,ai,observability,detect,discovery
http:
  - method: GET
    path:
      - "{{BaseURL}}"

    host-redirects: true
    max-redirects: 2

    matchers-condition: and
    matchers:
      - type: word
        part: body
        words:
          - "Arize Phoenix"
          - "<title>Phoenix"
        condition: and

      - type: status
        status:
          - 200
