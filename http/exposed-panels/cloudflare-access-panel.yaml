id: cloudflare-access-panel

info:
  name: Cloudflare Access 登录面板识别（暴露面识别）
  author: rxerium
  severity: info
  description: |
    该模板通过识别 Cloudflare Access 登录入口的页面标题、特征文本或重定向行为，判断目标是否暴露了对应的认证界面。若命中，说明该登录面板对外可访问，可用于暴露面梳理与后续安全评估。
  remediation: |
    - 确保 Cloudflare Access 策略配置正确，仅允许授权用户访问。
    - 审查并落实合适的认证规则与多因素认证要求。
    - 仅在确有必要的端点上暴露 Access 登录页，避免无关入口对外可见。
  reference:
    - https://developers.cloudflare.com/cloudflare-one/applications/configure-apps/
    - https://developers.cloudflare.com/cloudflare-one/
    - https://developers.cloudflare.com/cloudflare-one/identity/idp-integration/
  tags: cloudflare,panel,discovery

http:
  - method: GET
    path:
      - "{{BaseURL}}"

    host-redirects: true
    max-redirects: 2

    matchers-condition: and
    matchers:
      - type: word
        part: body
        words:
          - "<title>Sign in ・ Cloudflare Access"

      - type: status
        status:
          - 200
