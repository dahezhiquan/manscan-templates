id: gcloud-vm-serial-console-enabled

info:
  name: Interactive Serial Console Support Not未启用（云安全）
  author: princechaddha
  severity: medium
  description: Interactive serial console 可用于低层级实例访问和故障排查，非必要启用会增加管理入口。本模板检查实例元数据中 serial-port-enable 是否为 true，命中时报告交互式串行控制台已启用。
  impact: |
    - 攻击者若获得相应 IAM 权限，可能通过串行控制台绕过常规网络访问路径操作实例。
    - 额外管理入口会增加审计和权限治理复杂度，尤其对生产实例不易持续监控。
  remediation: |
    - 在非排障场景关闭 serial-port-enable，仅在受控变更窗口临时启用。
    - 限制具备串行端口访问能力的 IAM 角色，并审计历史串行控制台使用记录。
  reference:
    - https://www.trendmicro.com/cloudoneconformity/knowledge-base/gcp/ComputeEngine/disable-interactive-serial-console-support.html
    - https://cloud.google.com/compute/docs/instances/interacting-with-serial-console
  metadata:
    vendor: google
    product: compute-engine
  tags: cloud,devops,gcp,gcloud,compute,security,serial-console,gcp-cloud-config

flow: |
  code(1)
  for(let projectId of iterate(template.projectIds)){
    set("projectId", projectId)
    code(2)
    for(let instance of iterate(template.instances)){
      instance = JSON.parse(instance)
      set("instanceName", instance.name)
      set("zone", instance.zone)
      code(3)
    }
  }

self-contained: true

code:
  - engine:
      - sh
      - bash
    source: |
      gcloud projects list --format="json(projectId)"

    extractors:
      - type: json
        name: projectIds
        internal: true
        json:
          - '.[].projectId'

  - engine:
      - sh
      - bash
    source: |
      gcloud compute instances list --project $projectId --format="json(name,zone.basename())"

    extractors:
      - type: json
        name: instances
        internal: true
        json:
          - '.[]'

  - engine:
      - sh
      - bash
    source: |
      gcloud compute instances describe $instanceName --zone $zone --project $projectId --format="json(metadata.items)"

    matchers:
      - type: word
        words:
          - '"key": "serial-port-enable"'
          - '"value": "true"'
        condition: and

    extractors:
      - type: dsl
        dsl:
          - '"VM instance " + instanceName + " in zone " + zone + " of project " + projectId + " has interactive serial console support enabled"'
