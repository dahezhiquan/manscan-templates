id: deprecated-tls

info:
  name: 弃用 TLS/SSL 协议检测（证书安全）
  author: righettod,forgedhallpass
  severity: info
  description: 该模板检测目标是否仍支持已弃用的 SSLv3、TLS 1.0 或 TLS 1.1 协议版本。命中说明服务端仍允许使用过时的加密协商方式建立连接。
  remediation: |
    - 在服务端 TLS 配置中禁用 SSLv3、TLS 1.0 和 TLS 1.1，仅保留更安全的 TLS 1.2 或 TLS 1.3。
    - 同步检查负载均衡、CDN、反向代理和中间件配置，避免旧协议在链路中被重新启用。
  reference:
    - https://ssl-config.mozilla.org/#config=intermediate
  metadata:
    max-request: 3
    shodan-query: ssl.version:sslv2 ssl.version:sslv3 ssl.version:tlsv1 ssl.version:tlsv1.1
  tags: ssl,tls,vuln
ssl:
  - address: "{{Host}}:{{Port}}"
    min_version: tls11
    max_version: tls11

    extractors:
      - type: json
        name: tls_1.1
        json:
          - " .tls_version"

  - address: "{{Host}}:{{Port}}"
    min_version: tls10
    max_version: tls10

    extractors:
      - type: json
        name: tls_1.0
        json:
          - " .tls_version"

  - address: "{{Host}}:{{Port}}"
    min_version: ssl30
    max_version: ssl30

    extractors:
      - type: json
        name: ssl_3.0
        json:
          - " .tls_version"
