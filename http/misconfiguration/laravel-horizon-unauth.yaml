id: laravel-horizon-unauth

info:
  name: Laravel Horizon 仪表盘 未授权
  author: vagnerd
  severity: medium
  description: |
    检测到 Laravel Horizon 仪表盘 未授权。目标功能在未认证状态下可访问，可能暴露管理入口、业务数据、系统状态或可执行操作，需确认是否存在访问控制缺失。
  remediation: |
    - 为相关管理界面和 API 启用强认证、授权校验和最小权限控制。
    - 将后台端点限制在可信网络或 VPN 内，并记录访问审计日志。
  reference:
    - https://github.com/laravel/horizon
    - https://laravel.com/docs/10.x/horizon#dashboard-authorization
  classification:
    cvss-metrics: CVSS:3.0/AV:N/AC:L/PR:N/UI:N/S:U/C:N/I:N/A:N
    cvss-score: 5.3
    cwe-id: CWE-200
  metadata:
    verified: true
    max-request: 2
    shodan-query: http.favicon.hash:450899026
  tags: laravel,unauth,dashboard,misconfig,vuln

http:
  - method: GET
    path:
      - "{{BaseURL}}/api/stats"
      - "{{BaseURL}}/horizon/api/stats"

    matchers-condition: and
    matchers:
      - type: word
        part: body
        words:
          - "queueWithMaxRuntime"
          - "recentJobs"
          - "status"
        condition: and

      - type: word
        part: header
        words:
          - "application/json"

      - type: status
        status:
          - 200
