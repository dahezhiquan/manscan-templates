id: ibm-note-login

info:
  name: IBM iNotes 登录面板识别（指纹识别）
  author: dhiyaneshDK,righettod
  severity: info
  description: |-
    检测到目标站点存在 IBM iNotes 相关响应特征。IBM iNotes 是监控、日志、分析或可观测性系统，用于展示运行指标、告警事件、日志数据和服务状态。模板请求 `/`、`/names.nsf`、`/webredir.nsf` 路径，并通过页面标题或正文关键字、状态码确认该系统指纹，用于资产识别、系统盘点和暴露面梳理。
  reference:
    - https://www.exploit-db.com/ghdb/7122
  classification:
    cvss-metrics: CVSS:3.0/AV:N/AC:L/PR:N/UI:N/S:U/C:N/I:N/A:N
    cwe-id: CWE-200
    cpe: cpe:2.3:a:ibm:inotes:*:*:*:*:*:*:*:*
  metadata:
    max-request: 2
    vendor: ibm
    shodan-query: http.title:"IBM iNotes Login"
    product: inotes
  tags: ibm,edb,panel,login,detect,discovery
http:
  - method: GET
    path:
      - '{{BaseURL}}'
      - '{{BaseURL}}/names.nsf'
      - '{{BaseURL}}/webredir.nsf'

    stop-at-first-match: true

    matchers-condition: and
    matchers:
      - type: word
        words:
          - '<title>IBM iNotes Login</title>'
          - 'Lotus iNotes Login Screen'
        condition: or

      - type: status
        status:
          - 200
