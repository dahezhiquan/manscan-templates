id: accellion-detect

info:
  name: Accellion 指纹识别（指纹识别）
  author: rxerium
  severity: info
  description: |-
    Accellion 是企业文件共享与安全传输平台，用于大文件交换、协作和受控访问。该模板请求 `/cfadmin/`，并依据 HTTP 200 状态码、页面标题、正文关键字或品牌资源特征识别目标是否使用或暴露了 Accellion 相关组件，适用于资产盘点、技术栈识别和后续安全评估；命中结果仅表示指纹特征匹配，不代表已确认存在可利用漏洞。
  metadata:
    verified: true
    max-request: 1
    shodan-query: html:"/cfadmin/img/"
  tags: accellion,tech,detect,discovery

http:
  - method: GET
    path:
      - "{{BaseURL}}/cfadmin/"

    matchers-condition: and
    matchers:
      - type: word
        part: body
        words:
          - '/cfadmin/img/accellion-logo.png'
          - 'secured by accellion'
        condition: or

      - type: status
        status:
          - 200
