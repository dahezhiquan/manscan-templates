id: efak-login-panel

info:
  name: Eagle For Apache Kafka 登录识别（指纹识别）
  author: irshad ahamed
  severity: info
  description: |-
    检测到目标站点存在 Eagle For Apache Kafka 相关响应特征。Eagle For Apache Kafka 是监控、日志、分析或可观测性系统，用于展示运行指标、告警事件、日志数据和服务状态。模板请求 `/`、`/account/signin?/` 路径，并通过页面标题或正文关键字、状态码确认该系统指纹，用于资产识别、系统盘点和暴露面梳理。
  reference:
    - https://github.com/smartloli/efak
    - https://www.kafka-eagle.org/
  metadata:
    verified: true
    max-request: 2
    shodan-query: http.favicon.hash:1693580324
  tags: panel,efak,login,detect,discovery
http:
  - method: GET
    path:
      - "{{BaseURL}}"
      - "{{BaseURL}}/account/signin?/"

    stop-at-first-match: true
    host-redirects: true
    max-redirects: 2

    matchers-condition: and
    matchers:
      - type: word
        words:
          - '<title>Login - EFAK</title>'
          - 'Eagle For Apache Kafka'
          - '<h1>EFAK</h1>'
        condition: or

      - type: status
        status:
          - 200
