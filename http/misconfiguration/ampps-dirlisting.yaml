id: ampps-dirlisting

info:
  name: AMPPS Softaculous 面板 目录列出 检测
  author: deFr0ggy
  severity: medium
  description: |
    该模板用于核查 AMPPS Softaculous 面板 目录列出相关配置。该类问题通常源于 Web 目录索引、静态资源目录或对象列表功能未关闭，导致未授权用户可枚举文件和目录。模板会向目标发送探测请求，并依据请求 `/client/`、`/files/`、匹配 `<title>[AMPPS] - Web Local</title>`、`Powered by AMPPS`、状态码 200 等证据确认目标是否存在该配置问题。
  impact: |
    - 攻击者可枚举源码、备份、日志、上传文件、对象 Key 或目录结构，获取后续攻击所需线索。
    - 若列表中包含敏感文件，可能直接导致数据泄露、凭据泄露或业务资料外泄。
  remediation: |
    - 关闭 Web 服务器目录索引和对象存储列表权限，避免对外展示文件清单。
    - 为静态资源、上传目录和对象存储桶配置最小权限访问策略。
    - 清理不应公开的备份、日志、源码包和临时文件，并复核访问日志。
  classification:
    cvss-metrics: CVSS:3.0/AV:N/AC:L/PR:N/UI:N/S:U/C:N/I:N/A:N
    cvss-score: 0
    cwe-id: CWE-200
  metadata:
    max-request: 3
  tags: panel,ampps,softaculous,misconfig,vuln

http:
  - method: GET
    path:
      - "{{BaseURL}}/client/"
      - "{{BaseURL}}/files/"
      - "{{BaseURL}}/icons/"

    host-redirects: true
    max-redirects: 2

    matchers-condition: and
    matchers:
      - type: word
        part: body
        words:
          - "<title>[AMPPS] - Web Local</title>"
          - "Powered by AMPPS"
        condition: and

      - type: status
        status:
          - 200
