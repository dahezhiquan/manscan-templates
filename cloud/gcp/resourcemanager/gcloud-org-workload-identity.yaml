id: gcloud-org-workload-identity

info:
  name: Workload Identity Cluster Creation Not未启用（云安全）
  author: princechaddha
  severity: medium
  description: 组织未限制 Workload Identity cluster creation 时，项目可创建启用 Workload Identity 的 GKE 集群，可能在缺少治理的情况下建立 Kubernetes 与 IAM 的身份映射。本模板检查 iam.disableWorkloadIdentityClusterCreation 组织策略 booleanPolicy，返回空对象 {} 时报告未禁用该类集群创建。
  impact: |
    - 未经治理的集群可能将 Kubernetes ServiceAccount 映射到高权限 IAM 身份，扩大工作负载被攻破后的云资源访问面。
    - 身份映射分散在项目和集群中会增加权限审计、职责归属和异常访问排查难度。
  remediation: |
    - 按组织策略要求配置 iam.disableWorkloadIdentityClusterCreation，限制未批准的 Workload Identity 集群创建。
    - 对允许使用 Workload Identity 的集群建立服务账号映射规范、最小权限角色和定期审计。
  reference:
    - https://www.trendmicro.com/cloudoneconformity/knowledge-base/gcp/ResourceManager/disable-workload-identity-cluster-creation.html
    - https://cloud.google.com/resource-manager/docs/organization-policy/org-policy-constraints
  metadata:
    vendor: google
    product: resource-manager
  tags: cloud,devops,gcp,gcloud,resourcemanager,security,gke,kubernetes,workload-identity,gcp-cloud-config

flow: |
  code(1)
  for(let orgId of iterate(template.orgIds)){
    set("orgId", orgId)
    code(2)
  }

self-contained: true

code:
  - engine:
      - sh
      - bash
    source: |
      gcloud organizations list --format="json(name)"

    extractors:
      - type: json
        name: orgIds
        internal: true
        json:
          - '.[].name'

  - engine:
      - sh
      - bash
    source: |
      gcloud alpha resource-manager org-policies describe iam.disableWorkloadIdentityClusterCreation --organization=$orgId --effective --format="json(booleanPolicy)"

    matchers:
      - type: word
        words:
          - "{}"

    extractors:
      - type: dsl
        dsl:
          - '"Organization " + orgId + " has not disabled Workload Identity for GKE cluster creation, potentially allowing uncontrolled service account access"'
