id: arangodb-web-interface

info:
  name: ArangoDB Web Interface 识别（暴露面识别）
  author: pussycat0x
  severity: info
  description: |
    该模板用于识别 ArangoDB Web Interface 相关页面或服务入口是否对外暴露。若命中，说明目标可被识别为对应产品或组件，可用于资产发现与攻击面管理。
  reference:
    - https://www.arangodb.com/docs/stable/
  classification:
    cpe: cpe:2.3:a:arangodb:arangodb:*:*:*:*:*:*:*:*
  metadata:
    verified: "true"
    max-request: 1
    vendor: arangodb
    product: arangodb
    shodan-query:
      - http.title:"ArangoDB Web Interface"
      - http.title:"arangodb web interface"
    fofa-query: title="arangodb web interface"
    google-query: intitle:"arangodb web interface"
  tags: panel,arangodb,login,discovery

http:
  - method: GET
    path:
      - "{{BaseURL}}/_db/_system/_admin/aardvark/index.html"

    matchers-condition: and
    matchers:
      - type: word
        words:
          - "<title>ArangoDB Web Interface</title>"

      - type: status
        status:
          - 200
