id: apiman-panel

info:
  name: Apiman 登录面板（暴露面识别）
  author: righettod
  severity: info
  description: 该模板通过识别 Apiman 登录入口的页面标题、特征文本或重定向行为，判断目标是否暴露了对应的认证界面。若命中，说明该登录面板对外可访问，可用于暴露面梳理与后续安全评估。
  reference:
    - https://www.apiman.io/latest/
  classification:
    cwe-id: CWE-200
  metadata:
    max-request: 1
  tags: panel,apiman,discovery

http:
  - method: GET
    path:
      - "{{BaseURL}}/apimanui/api-manager"

    matchers-condition: and
    matchers:
      - type: word
        words:
          - "/auth/realms/apiman"
        part: header

      - type: status
        status:
          - 302
