id: k8s-azure-kubernetes-service

info:
  name: Azure Kubernetes Service 指纹识别（指纹识别）
  author: dhiyaneshDk
  severity: info
  description: >-
    Azure Kubernetes Service 是 Microsoft Azure 托管 Kubernetes 服务，用于运行、扩缩容和管理容器化应用。该模板通过请求目标服务并检查预设路径或首页响应、页面正文关键字、状态码等指纹特征，判断目标是否使用或暴露了
    Azure Kubernetes Service 相关组件；命中结果仅表示指纹特征匹配，可用于资产盘点、技术栈识别和后续安全评估，不代表已确认存在可利用漏洞。
  metadata:
    max-request: 1
  tags: tech,azure,kubernetes,discovery
http:
  - method: GET
    path:
      - "{{BaseURL}}"

    matchers-condition: and
    matchers:
      - type: word
        part: body
        words:
          - "<title>Welcome to Azure Kubernetes Service (AKS)</title>"

      - type: status
        status:
          - 200
