id: mealie-panel

info:
  name: Mealie 面板识别（暴露面识别）
  author: ChrisJr404
  severity: info
  description: |
    该模板通过识别 Mealie 面板、控制台或管理界面的页面特征，判断目标是否暴露了对应服务入口。若命中，说明该后台或运维界面对外可访问，可用于资产识别与暴露面排查。
  reference:
    - https://github.com/mealie-recipes/mealie
    - https://mealie.io/
  metadata:
    verified: true
    max-request: 2
    vendor: mealie-recipes
    product: mealie
    shodan-query: http.title:"Mealie"
    fofa-query: title="Mealie"
  tags: panel,mealie,recipe,selfhosted,detect,discovery

flow: http(1) && http(2)

http:
  - method: GET
    path:
      - "{{BaseURL}}"

    host-redirects: true
    max-redirects: 2

    matchers:
      - type: dsl
        dsl:
          - 'status_code == 200'
          - 'contains(to_lower(body), "<title>mealie</title>")'
        internal: true
        condition: and

  - method: GET
    path:
      - "{{BaseURL}}/api/app/about"

    matchers:
      - type: dsl
        dsl:
          - 'status_code == 200'
          - 'contains_all(body, "\"production\"", "\"version\"", "\"demoStatus\"", "\"allowSignup\"")'
          - 'contains(content_type, "application/json")'
        condition: and

    extractors:
      - type: regex
        part: body
        group: 1
        regex:
          - '"version"\s*:\s*"([^"]+)"'
