id: umbraco-login

info:
  name: Umbraco 登录面板识别（指纹识别）
  author: ola456,stvnhrlnd
  severity: info
  description: Umbraco 是开源 .NET 内容管理系统，用于网站内容、媒体、用户和后台发布管理。该模板请求 `/umbraco`、`/umbraco/login`，并依据 HTTP 200 状态码、页面标题、正文关键字或品牌资源特征识别目标是否部署了该系统或暴露了对应入口，适用于资产指纹确认；命中结果仅表示系统特征匹配，不代表已确认存在未授权访问或可利用漏洞。
  reference:
  - https://our.umbraco.com/documentation/Fundamentals/Backoffice/Login/
  classification:
    cvss-metrics: CVSS:3.0/AV:N/AC:L/PR:N/UI:N/S:U/C:N/I:N/A:N
    cwe-id: CWE-200
    cpe: cpe:2.3:a:umbraco:umbraco_cms:*:*:*:*:*:*:*:*
  metadata:
    verified: true
    max-request: 1
    vendor: umbraco
    product: umbraco_cms
    shodan-query:
    - http.title:"Umbraco"
    - http.title:"umbraco"
    fofa-query: title="umbraco"
    google-query: intitle:"umbraco"
  tags: panel,umbraco,detect,discovery

http:
  - method: GET
    path:
      - "{{BaseURL}}/umbraco"
      - "{{BaseURL}}/umbraco/login"

    host-redirects: true
    max-redirects: 3

    matchers-condition: and
    matchers:
      - type: word
        part: body
        words:
          - 'Umbraco.Sys'
          - '<umb-auth'
        condition: or

      - type: status
        status:
          - 200
