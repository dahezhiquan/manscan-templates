id: playstation-phish

info:
  name: PlayStation 仿冒钓鱼网站（钓鱼网站识别）
  author: rxerium
  severity: info
  description: |
    检测到疑似仿冒 PlayStation 的钓鱼网站。模板在目标页面返回 200、页面内容命中 PlayStation 的品牌页面特征，且当前主机不属于 playstation.com 官方域名时触发，用于识别借用 PlayStation 品牌页面诱导用户信任的仿冒站点。
  reference:
    - https://playstation.com
  metadata:
    max-request: 1
  tags: phishing,playstation,sony,osint,discovery
http:
  - method: GET
    path:
      - "{{BaseURL}}"

    host-redirects: true
    max-redirects: 2

    matchers-condition: and
    matchers:
      - type: word
        words:
          - "Explore the new generation PlayStation 4 and PS5 consoles - experience immersive gaming with thousands of hit games in every genre to rewrite the rules for what a PlayStation console can do."

      - type: status
        status:
          - 200

      - type: dsl
        dsl:
          - '!contains(host,"playstation.com")'
