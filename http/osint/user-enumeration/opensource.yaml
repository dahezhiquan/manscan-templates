id: opensource

info:
  name: Opensource 用户名信息枚举（OSINT）
  author: dwisiswant0
  severity: info
  description: |
    Opensource 是面向技术产品、厂商社区或数字服务用户的在线平台，用户资料页通常会公开展示账号资料、社区互动或技术支持活动记录。该模板用于在公开互联网侧枚举 Opensource 用户名，不需要认证；模板请求公开路径 https://opensource.com/users/用户名，并结合响应状态为 200、页面或响应内容命中 “| Opensource.com” 等资料页特征判断目标用户名是否存在。该检查属于 OSINT 用户枚举，结果仅表示公开资料页或公开搜索结果可被访问，不代表目标平台存在可直接修复的漏洞。
  classification:
    cvss-metrics: CVSS:3.1/AV:N/AC:L/PR:N/UI:N/S:U/C:N/I:N/A:N
    cvss-score: 0
    cwe-id: CWE-200
  metadata:
    max-request: 1
  tags: osint,osint-tech,open-source,discovery

self-contained: true

http:
  - method: GET
    path:
      - "https://opensource.com/users/{{user}}"

    matchers-condition: and
    matchers:
      - type: status
        status:
          - 200

      - type: word
        part: body
        words:
          - "| Opensource.com"
