id: hp-color-laserjet-detect

info:
  name: HP Color LaserJet 打印机识别（IOT）
  author: idealphase,gy741
  severity: low
  description: |
    检测到 HP Color LaserJet 打印机面板。该模板通过标题和页面特征识别 HP 彩色激光打印设备的 Web 管理入口。
  impact: |
    - 打印机 Web 面板暴露可能泄露设备型号、网络配置、耗材状态和打印服务入口。
    - 在配置不当时，攻击者可能滥用打印服务、修改设备设置或获取作业信息。
  remediation: |
    - 限制打印机 Web 管理页面仅办公内网或管理网段访问。
    - 启用管理员认证，修改默认口令并升级打印机固件。
    - 关闭不必要的远程管理、匿名访问和未使用的打印协议。
  reference:
    - http://www.hp.com/
    - https://www.hp.com/us-en/shop/cv/printers
  classification:
    cpe: cpe:2.3:h:hp:color_laserjet_pro_mfp_m183_7kw56a:*:*:*:*:*:*:*:*
  metadata:
    verified: true
    max-request: 2
    vendor: hp
    product: color_laserjet_pro_mfp_m183_7kw56a
    shodan-query: http.title:"HP Color LaserJet"
    google-query: intitle:"HP Color LaserJet"
  tags: iot,hp,discovery

http:
  - method: GET
    path:
      - "{{BaseURL}}"
      - "{{BaseURL}}/hp/device/this.LCDispatcher"

    stop-at-first-match: true
    redirects: true
    max-redirects: 2

    matchers-condition: and
    matchers:
      - type: word
        part: body
        words:
          - "HP Color LaserJet"
          - '<td class="mastheadTitle"><h1>HP Color LaserJet'
          - '<strong class="product">HP Color LaserJet'
          - '<a href="info_deviceStatus.html?'
        condition: or

      - type: status
        status:
          - 200

    extractors:
      - type: regex
        group: 1
        regex:
          - '<td class="mastheadTitle"><h1>HP Color LaserJet (.+)<\/h1><\/td>'
