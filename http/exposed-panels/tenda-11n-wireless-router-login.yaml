id: tenda-11n-wireless-router-panel

info:
  name: Tenda 11n Wireless Router - Admin 面板（暴露面识别）
  author: idealphase
  severity: info
  description: |
    该模板通过识别 Tenda 11n Wireless Router - Admin 登录入口的页面标题、特征文本或重定向行为，判断目标是否暴露了对应的认证界面。若命中，说明该登录面板对外可访问，可用于暴露面梳理与后续安全评估。
  reference:
    - https://www.tendacn.com/products/11n-routers.html
  classification:
    cvss-metrics: CVSS:3.0/AV:N/AC:L/PR:N/UI:N/S:U/C:N/I:N/A:N
    cwe-id: CWE-668
    cpe: cpe:2.3:h:tenda:11n:*:*:*:*:*:*:*:*
  metadata:
    max-request: 1
    shodan-query: http.title:"Tenda 11N Wireless Router Login Screen"
    google-query: intitle:"Tenda 11N Wireless Router Login Screen"
    product: 11n
    vendor: tenda
  tags: panel,tenda,discovery

http:
  - method: GET
    path:
      - "{{BaseURL}}/login.asp"

    matchers-condition: and
    matchers:
      - type: word
        part: body
        words:
          - "<title>Tenda 11N Wireless Router Login Screen</title>"

      - type: status
        status:
          - 200
