id: zen-cart-log-exposure

info:
  name: Zen Cart 日志文件暴露（暴露面识别）
  author: 0x_Akoko
  severity: medium
  description: |
    检测到可直接访问的 Zen Cart 日志文件。日志、异常页面或调试输出通常会泄露堆栈信息、内部路径、查询语句、账号标识、令牌片段或业务数据，不应向未授权用户开放。
  reference:
    - https://www.zen-cart.com/
    - https://docs.zen-cart.com/user/troubleshooting/debug_logs/
  classification:
    cvss-metrics: CVSS:3.1/AV:N/AC:L/PR:N/UI:N/S:U/C:L/I:N/A:N
    cvss-score: 5.3
    cwe-id: CWE-200
  metadata:
    max-request: 5
    shodan-query: http.html:"zen-cart" || http.html:"Zen Cart"
    fofa-query: body="zen-cart" || body="Zen Cart"
  tags: zencart,exposure,logs,ecommerce

http:
  - method: GET
    path:
      - "{{BaseURL}}/logs/"
      - "{{BaseURL}}/cache/"
      - "{{BaseURL}}/includes/logs/"
      - "{{BaseURL}}/admin/logs/"

    stop-at-first-match: true

    matchers-condition: and
    matchers:
      - type: word
        part: body
        words:
          - "Index of"
          - "myDEBUG"
        condition: and

      - type: status
        status:
          - 200

    extractors:
      - type: regex
        name: log-files
        part: body
        regex:
          - 'myDEBUG[a-zA-Z0-9_-]+\.log'
