id: remote-assistance-enabled

info:
  name: 远程协助已启用（本地基线扫描）
  author: princechaddha
  severity: medium
  description: |
    该模板检查 Remote Assistance 是否违反安全策略启用。该功能允许他人远程协助控制会话。
  impact: |
    配置不当可能导致未授权远程访问或社工诱导控制。
  remediation: |
    如无业务需要，禁用 Remote Assistance 并审计远程支持工具。
  tags: remote-assistance, misconfiguration, windows-audit

self-contained: true

code:
  - pre-condition: |
      IsWindows();
    engine:
      - powershell
      - powershell.exe
    args:
      - -ExecutionPolicy
      - Bypass
    pattern: "*.ps1"
    source: |
      Get-ItemProperty 'HKLM:\SYSTEM\CurrentControlSet\Control\Remote Assistance' -Name 'fAllowToGetHelp' -ErrorAction SilentlyContinue | Where-Object { $_.fAllowToGetHelp -eq 1 } | Select-Object -ExpandProperty fAllowToGetHelp

    matchers:
      - type: word
        words:
          - "1"
