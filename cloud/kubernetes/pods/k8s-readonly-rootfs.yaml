id: k8s-readonly-rootfs

info:
  name: Pods 使用read-only root filesystem（云安全）
  author: princechaddha
  severity: medium
  description: Pod 容器根文件系统未设置为只读会放宽运行时防篡改边界。本模板枚举 Pod 容器，发现存在 securityContext 但 readOnlyRootFilesystem 不为 true 时报告。
  impact: |
    - 被攻陷进程可能写入恶意文件、修改启动脚本或隐藏临时工具。
    - 缺少只读根文件系统会降低容器运行时完整性和取证可信度。
  remediation: |
    - 为容器设置 readOnlyRootFilesystem 为 true，并显式挂载必要的可写目录。
    - 对无法只读运行的应用做改造或记录例外，避免默认放宽。
  reference:
    - https://kubernetes.io/docs/concepts/policy/pod-security-policy/#volumes-and-file-systems
  metadata:
    vendor: kubernetes
    product: kubernetes
  tags: cloud,devops,kubernetes,devsecops,pods,k8s-cluster-security
flow: |
  code(1);
  for (let pod of template.items) {
    set("pod", pod)
    javascript(1);
  }

self-contained: true
code:
  - engine:
      - sh
      - bash
    source: kubectl get pods --all-namespaces --output=json
    extractors:
      - type: json
        name: items
        internal: true
        json:
          - '.items[] | {pod: .metadata.name, containers: .spec.containers}'

javascript:
  - code: |
        let podData = JSON.parse(template.pod);
        podData.containers.forEach(container => {
          if (container.securityContext && container.securityContext.readOnlyRootFilesystem !== true) {
            let result = (`Container '${container.name}' in pod '${podData.pod}' is not running with a read-only root filesystem.`);
            Export(result);
          }
        });

    extractors:
      - type: dsl
        dsl:
          - response
