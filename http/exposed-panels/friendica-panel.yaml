id: friendica-panel

info:
  name: Friendica 面板识别（暴露面识别）
  author: righettod
  severity: info
  description: |
    该模板通过识别 Friendica 登录入口的页面标题、特征文本或重定向行为，判断目标是否暴露了对应的认证界面。若命中，说明该登录面板对外可访问，可用于暴露面梳理与后续安全评估。
  reference:
    - https://friendi.ca
  classification:
    cpe: cpe:2.3:a:friendica:friendica:*:*:*:*:*:*:*:*
  metadata:
    verified: true
    max-request: 1
    vendor: friendica
    product: friendica
    shodan-query:
      - http.title:"Friendica"
      - http.title:"friendica"
    fofa-query: title="friendica"
    google-query: intitle:"friendica"
  tags: friendica,panel,login,detect,discovery

http:
  - method: GET
    path:
      - "{{BaseURL}}"

    matchers-condition: and
    matchers:
      - type: word
        part: body
        words:
          - 'title="Search in Friendica'
          - 'Welcome to Friendica Social Network'
          - 'content="Friendica'
        condition: or

      - type: status
        status:
          - 200

    extractors:
      - type: regex
        part: body
        group: 1
        regex:
          - '(?i)v=([a-z0-9.-]+)'
