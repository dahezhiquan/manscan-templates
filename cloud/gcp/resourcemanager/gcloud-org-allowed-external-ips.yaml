id: gcloud-org-allowed-external-ips

info:
  name: Organization 策略 的Allowed External IPs 未Configured（云安全）
  author: princechaddha
  severity: medium
  description: 组织未限制 VM 外部 IP 使用时，任意实例可能被分配公网地址并扩大互联网暴露面。本模板检查 compute.vmExternalIpAccess 组织策略的有效 listPolicy.allValues，值为 ALLOW 时报告外部 IP 未受限制。
  impact: |
    - 新建或变更实例可能绕过既定网络入口，通过公网直接暴露 SSH、RDP 或业务服务。
    - 公网地址分配缺少统一治理时，资产盘点、攻击面收敛和防火墙策略复核都会更困难。
  remediation: |
    - 配置 compute.vmExternalIpAccess 组织策略，仅允许批准的实例或项目使用外部 IP。
    - 对必须公网访问的实例补充防火墙来源限制、访问审计和例外审批记录。
  reference:
    - https://www.trendmicro.com/cloudoneconformity/knowledge-base/gcp/ResourceManager/allowed-external-ips.html
    - https://cloud.google.com/resource-manager/docs/organization-policy/org-policy-constraints
  metadata:
    vendor: google
    product: resource-manager
  tags: cloud,devops,gcp,gcloud,resourcemanager,security,networking,organization,gcp-cloud-config

flow: |
  code(1)
  for(let orgId of iterate(template.orgIds)){
    set("orgId", orgId)
    code(2)
  }

self-contained: true

code:
  - engine:
      - sh
      - bash
    source: |
      gcloud organizations list --format="json(name)"

    extractors:
      - type: json
        name: orgIds
        internal: true
        json:
          - '.[].name'

  - engine:
      - sh
      - bash
    source: |
      gcloud alpha resource-manager org-policies describe compute.vmExternalIpAccess --organization=$orgId --effective --format="json(listPolicy.allValues)"

    matchers:
      - type: word
        words:
          - "ALLOW"

    extractors:
      - type: dsl
        dsl:
          - '"Organization " + orgId + " allows all VM instances to use external IP addresses, increasing exposure to the internet"'
