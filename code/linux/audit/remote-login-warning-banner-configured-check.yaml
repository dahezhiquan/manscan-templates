id: remote-login-warning-banner-configured-check

info:
  name: 确保远程登录警告横幅配置正确（本地基线扫描）
  author: Th3l0newolf
  severity: low
  description: |
    远程登录横幅若泄露系统版本、内核或发行版标识，会在认证前向网络访问者暴露主机指纹。CIS Ubuntu 基线建议 `/etc/issue.net` 仅提供授权警告；模板检查该文件是否包含 `\v`、`\r`、`\m`、`\s` 或发行版 ID，命中 Policy-Fail 表示远程横幅配置不当。
  impact: |
    - 未认证远程访问者可获取系统指纹，用于漏洞匹配和定向攻击。
    - 登录前缺少合规警告或混入系统信息，会削弱授权边界提示。
  remediation: |
    - 清理 `/etc/issue.net` 中的系统信息变量和发行版标识。
    - 配置授权使用警告，并在 SSH、telnet 等远程服务中引用受控横幅文件。
  reference:
    - https://www.cisecurity.org/benchmark/ubuntu_linux
  tags: cis,linux,ubuntu,issue.net,banner,audit
  metadata:
    verified: true

self-contained: true

code:
  - engine:
      - bash
    args:
      - "-c"
      - |
        os_id=$(grep '^ID=' /etc/os-release | cut -d= -f2 | sed 's/"//g')

        if grep -E -i "(\\\v|\\\r|\\\m|\\\s|$os_id)" /etc/issue.net >/dev/null 2>&1; then
          echo "[remote-login-warning-banner-configured-check:Policy-Fail] [/etc/issue.net contains system information] [CIS_FAIL] [low]"
        else
          echo "[remote-login-warning-banner-configured-check:Policy-Pass] [/etc/issue.net is properly configured] [CIS_PASS] [low]"
        fi

    matchers:
      - type: word
        name: policy-pass
        words:
          - "Policy-Pass"

      - type: word
        name: policy-fail
        words:
          - "Policy-Fail"
