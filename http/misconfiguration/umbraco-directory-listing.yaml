id: umbraco-directory-listing

info:
  name: Umbraco CMS 目录列出暴露
  author: DhiyaneshDk
  severity: medium
  description: |-
    该模板用于核查 Umbraco CMS 目录列出暴露。Web 服务器或应用目录开启目录列出后，未授权用户可浏览目录中的文件名和资源结构。模板访问 /App_Data/、/App_Plugins/，并根据目录索引标题、链接列表或组件目录特征确认目录列出是否启用。
  reference:
    - https://docs.umbraco.com/umbraco-cms/reference/security/security-hardening
  classification:
    cvss-metrics: CVSS:3.1/AV:N/AC:L/PR:N/UI:N/S:U/C:L/I:N/A:N
    cvss-score: 5.3
    cwe-id: CWE-548
  metadata:
    max-request: 2
    verified: true
    shodan-query: http.html:"umbraco"
  tags: umbraco,misconfig,exposure,cms,vuln
  impact: |-
    - 攻击者可枚举备份文件、配置文件、日志、源码包和未公开资源。
    - 暴露的目录结构可辅助识别组件版本、文件路径和后续下载目标。
  remediation: |-
    - 关闭 Web 服务器目录索引功能，例如 Apache `Options -Indexes` 或 Nginx 禁用 `autoindex`。
    - 将敏感文件移出 Web 根目录，并为必要目录配置认证和访问控制。
    - 清理历史备份、临时文件和调试文件，避免可下载资源长期暴露。
http:
  - method: GET
    path:
      - "{{BaseURL}}/App_Data/"
      - "{{BaseURL}}/App_Plugins/"

    stop-at-first-match: true

    matchers:
      - type: dsl
        dsl:
          - 'status_code == 200'
          - 'contains_all(body, "/App_Plugins/", "[To Parent Directory]")'
        condition: and
