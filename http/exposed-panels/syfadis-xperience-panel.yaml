id: syfadis-xperience-panel

info:
  name: Syfadis Xperience 登录面板识别（指纹识别）
  author: righettod
  severity: info
  description: |-
    Syfadis Xperience 是在线学习与培训管理平台，用于课程、学员、考核和学习门户管理。该模板请求 `/Directory/Login/Login.aspx`，并依据 DSL 条件识别目标是否部署了该系统或暴露了对应入口，适用于资产指纹确认；命中结果仅表示系统特征匹配，不代表已确认存在未授权访问或可利用漏洞。
  reference:
  - https://syfadis.fr/xperience
  metadata:
    verified: true
    max-request: 1
    fofa-query: title="Syfadis Xperience"
  tags: panel,syfadis,login,detect,discovery

http:
  - method: GET
    path:
      - "{{BaseURL}}/Directory/Login/Login.aspx"

    matchers:
      - type: dsl
        dsl:
          - 'status_code == 200'
          - 'contains_any(to_lower(body), "syfadis xperience", "syfadis.supervision.browsersupport") && contains(to_lower(body), "loginpage")'
        condition: and

    extractors:
      - type: regex
        part: body
        group: 1
        regex:
          - 'ajaxz/([0-9.]+)/Common'
