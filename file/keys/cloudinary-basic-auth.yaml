id: cloudinary-basic-auth

info:
  name: Cloudinary Basic 认证凭据 泄露检测（本地文件安全扫描）
  author: gaurang
  severity: high
  description: |
    该模板检测文件中暴露的认证凭据、账号口令或授权头信息。命中后应视为敏感信息泄露并立即复核来源。
  classification:
    cvss-metrics: CVSS:3.1/AV:N/AC:L/PR:N/UI:N/S:U/C:H/I:N/A:N
    cvss-score: 7.5
    cwe-id: CWE-200
  tags: keys,file,token,cloudinary
file:
  - extensions:
      - all

    extractors:
      - type: regex
        regex:
          - "cloudinary://[0-9]{15}:[0-9A-Za-z\\-_]+@[0-9A-Za-z\\-_]+"

