id: apache-karaf-panel

info:
  name: Apache Karaf 指纹识别（指纹识别）
  author: s0obi
  severity: info
  description: Apache Karaf 是 OSGi 应用运行容器，用于部署和管理 Java 模块化服务。该模板请求 `/system/console`，并依据页面标题、正文关键字或品牌资源特征、响应头特征识别目标是否使用或暴露了 Apache Karaf 相关组件，适用于资产盘点、技术栈识别和后续安全评估；命中结果仅表示指纹特征匹配，不代表已确认存在可利用漏洞。
  classification:
    cpe: cpe:2.3:a:apache:karaf:*:*:*:*:*:*:*:*
  metadata:
    verified: true
    max-request: 1
    vendor: apache
    product: karaf
    shodan-query: realm="karaf"
  tags: tech,apache,karaf,discovery

http:
  - method: GET
    path:
      - "{{BaseURL}}/system/console"

    matchers:
      - type: word
        part: header
        words:
          - 'realm="karaf'
