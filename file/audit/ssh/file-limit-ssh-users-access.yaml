id: file-limit-ssh-users-access

info:
  name: SSH 用户访问未限制（本地文件安全扫描）
  author: pussycat0x
  severity: unknown
  description: |
    该模板检查 SSH 是否限制可登录用户。未限制时，所有本地账户都可能成为远程登录攻击面。
  remediation: |
    在 /etc/ssh/sshd_config 中配置 AllowUsers 或 AllowGroups，并重启 SSH 服务。
  reference:
    - https://vishalraj82.medium.com/hardening-openssh-security-37f5d634015f
    - https://cloud.ibm.com/docs/ssh-keys?topic=ssh-keys-granting-ssh-access-to-a-user
  metadata:
    verified: true
  tags: audit,config,file,ssh

file:
  - extensions:
      - all

    matchers-condition: and
    matchers:
      - type: word
        words:
          - "# This is the sshd server system-wide configuration file"

      - type: word
        words:
          - "AllowUsers"
        negative: true
