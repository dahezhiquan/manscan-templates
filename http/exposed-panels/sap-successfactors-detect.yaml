id: sap-successfactors-detect

info:
  name: SAP SuccessFactors 登录面板识别（指纹识别）
  author: tess
  severity: info
  description: SAP SuccessFactors 是 SAP 云端人力资本管理平台，用于招聘、绩效、薪酬和员工数据管理。该模板请求首页、`/sf/start` 路径，并依据 HTTP 200 状态码、页面标题、正文关键字或品牌资源特征识别目标是否部署了该系统或暴露了对应入口，适用于资产指纹确认；命中结果仅表示系统特征匹配，不代表已确认存在未授权访问或可利用漏洞。
  classification:
    cvss-metrics: CVSS:3.1/AV:N/AC:L/PR:N/UI:N/S:U/C:N/I:N/A:N
    cwe-id: CWE-200
    cpe: cpe:2.3:a:sap:successfactors:*:*:*:*:*:*:*:*
  metadata:
    verified: true
    max-request: 2
    vendor: sap
    product: successfactors
    shodan-query:
    - title:"Login - SAP SuccessFactors"
    - http.title:"login - sap successfactors"
    fofa-query: title="login - sap successfactors"
    google-query: intitle:"login - sap successfactors"
  tags: panel,sap,detect,discovery

http:
  - method: GET
    path:
      - '{{BaseURL}}'
      - '{{BaseURL}}/sf/start'

    stop-at-first-match: true
    host-redirects: true
    max-redirects: 2

    matchers-condition: and
    matchers:
      - type: word
        part: body
        words:
          - 'SAP SuccessFactors'
          - 'sap-ui-core'
        condition: and

      - type: status
        status:
          - 200
