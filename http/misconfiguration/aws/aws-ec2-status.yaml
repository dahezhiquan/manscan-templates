id: aws-ec2-status

info:
  name: Amazon EC2 状态
  author: DhiyaneshDk
  severity: low
  description: |
    该模板用于核查 Amazon EC2 状态相关配置。该类问题通常源于生产环境暴露调试页面、诊断端点、状态接口或详细错误信息。模板会向目标发送探测请求，并依据匹配 `<title>Amazon EC2 Status</title>`、`text/html`、状态码 200 等证据确认目标是否存在该配置问题。
  impact: |
    - 攻击者可获取服务版本、运行状态、内部路径、模块列表、环境变量或错误栈信息。
    - 这些信息可辅助识别组件版本、构造后续攻击路径，或暴露内部系统结构与敏感配置线索。
  remediation: |
    - 关闭生产环境中的调试、状态、示例和诊断接口，避免向未授权用户返回内部细节。
    - 对确需保留的运维端点增加认证授权、来源限制和访问审计。
    - 检查历史访问日志和错误日志，确认敏感信息是否已被枚举或泄露。
  reference:
    - https://www.facebook.com/photo/?fbid=644887334348456&set=a.467014098802448
  metadata:
    verified: true
    max-request: 1
    shodan-query: html:"Amazon EC2 Status"
  tags: misconfig,ec2,aws,amazon,vuln

http:
  - method: GET
    path:
      - "{{BaseURL}}"

    matchers-condition: and
    matchers:
      - type: word
        part: body
        words:
          - '<title>Amazon EC2 Status</title>'

      - type: word
        part: header
        words:
          - text/html

      - type: status
        status:
          - 200
