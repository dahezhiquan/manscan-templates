id: k8s-scheduler-bind-address

info:
  name: Ensure kube-scheduler --bind-address is set to localhost（云安全）
  author: songyaeji
  severity: high
  description: kube-scheduler 未绑定到 localhost 可能使调度器接口暴露到非本机网络，增加控制面信息泄露面。本模板读取 kube-scheduler 启动命令，发现未设置 --bind-address=127.0.0.1 或 --bind-address=::1 时报告。
  impact: |
    - 调度器健康检查或指标接口可能被非授权来源访问，泄露控制面运行状态。
    - 控制面组件暴露范围扩大，增加被探测和滥用的机会。
  remediation: |
    - 将 kube-scheduler 的 --bind-address 设置为 127.0.0.1 或 ::1。
    - 通过受控监控代理采集指标，避免直接对外暴露组件接口。
  reference:
    - https://kubernetes.io/docs/reference/command-line-tools-reference/kube-scheduler/
    - Cloud Vulnerability Assessment Guide(2024) by KISA
  metadata:
    vendor: kubernetes
    product: kubernetes
  tags: cloud,devops,kubernetes,devsecops,kube-scheduler,bind-address,hardening,k8s-cluster-security
variables:
  component: "kube-scheduler"

self-contained: true
code:
  - engine:
      - sh
      - bash
    source: |
      kubectl get pods -n kube-system -l component=kube-scheduler -o jsonpath="{.items[*].spec.containers[*].command}"

    matchers-condition: and
    matchers:
      - type: word
        words:
          - 'kube-scheduler'

      - type: word
        words:
          - "--bind-address=127.0.0.1"
          - "--bind-address=::1"
        negative: true

    extractors:
      - type: dsl
        dsl:
          - '"kube-scheduler configuration is missing --bind-address or set to unsafe value (expected: 127.0.0.1 or ::1)"'
