id: ics-schneider-electric-modicon-340-detect

info:
  name: Schneider Electric Modicon 340 Series PLC 识别（指纹识别）
  author: biero-el-corridor
  severity: info
  description: |
    Schneider Electric Modicon 340 Series PLC 是 Schneider Electric Modicon 工业控制器系列，常用于 PLC 控制、生产线自动化和基础设施控制场景。该模板连接 502/TCP 并读取协议响应，通过匹配 `BMX P34`、`Schneider Electric` 等响应特征识别目标服务；按 Modbus Read Device Identification 对象 ID 0x02 提取设备修订号，缺失时只识别设备，不把型号赋为版本。
  metadata:
    product: modicon
    verified: true
    shodan-query: port:502 "P34"
  tags: ics,schneider-electric,modicon,detect,network

# 按对象 ID 0x02 提取设备修订号，按边界解析对象；不把型号或整个响应当作版本。
javascript:
  - code: |-
      const net = require('nuclei/net');
      const bytes = require('nuclei/bytes');
      function receive(conn, size) {
        if (size < 1 || size > 4096) throw 'invalid response size';
        const buffer = new bytes.Buffer();
        buffer.Write(conn.RecvFull(size));
        const hex = buffer.Hex();
        if (hex.length !== size * 2) throw 'truncated response';
        return hex;
      }
      function u8(hex, offset) { return parseInt(hex.substr(offset * 2, 2), 16); }
      function le16(hex, offset) { return u8(hex, offset) + u8(hex, offset + 1) * 256; }
      function be16(hex, offset) { return u8(hex, offset) * 256 + u8(hex, offset + 1); }
      function text(hex) {
        let result = '';
        for (let i = 0; i < hex.length / 2; i++) result += String.fromCharCode(u8(hex, i));
        return result;
      }
      let host = String(Host);
      if (host.indexOf(':') !== -1 && host.charAt(0) !== '[') host = '[' + host + ']';
      let conn;
      let result = {detected: false};
      function exchange(request, transaction) {
        conn.SendHex(request);
        const header = receive(conn, 7);
        if (be16(header, 0) !== transaction || be16(header, 2) !== 0 || u8(header, 6) !== 0) throw 'invalid MBAP header';
        const length = be16(header, 4);
        if (length < 2 || length > 254) throw 'invalid Modbus length';
        return receive(conn, length - 1);
      }
      try {
        conn = net.Open('tcp', host + ':' + Port);
        conn.SetTimeout(3);
        const payload = exchange('000000000005002b0e0200', 0);
        if (payload.length < 14 || payload.substr(0, 6) !== '2b0e02') throw 'not Read Device Identification';
        const count = u8(payload, 6);
        if (count < 1 || count > 32) throw 'invalid object count';
        const objects = {};
        let offset = 7;
        for (let i = 0; i < count; i++) {
          if (offset + 2 > payload.length / 2) throw 'truncated object header';
          const id = u8(payload, offset), length = u8(payload, offset + 1);
          offset += 2;
          if (offset + length > payload.length / 2 || objects[id] !== undefined) throw 'invalid object';
          objects[id] = text(payload.substr(offset * 2, length * 2));
          offset += length;
        }
        if (offset !== payload.length / 2) throw 'unexpected object trailer';
        if (/^Schneider Electric\s*$/.test(objects[0] || '')) {
          const note = exchange('000100000004005a0002', 1);
          result.detected = note.substr(0, 2) === '5a' && text(note).indexOf('BMX P34') !== -1;
          if (result.detected && /^[0-9]+(?:\.[0-9]+)+$/.test(objects[2] || '')) result.version = objects[2];
        }
      } catch (e) {
        result = {detected: false};
      } finally {
        if (conn) conn.Close();
      }
      Export(JSON.stringify(result));
    args:
      Host: '{{Host}}'
      Port: 502
    matchers:
      - type: dsl
        dsl:
          - success == true && contains(response, '"detected":true')
    extractors:
      - type: json
        name: firmware_version
        part: response
        json:
          - .version | select(type == "string") | select(test("^[0-9]+([.][0-9]+)+$"))
