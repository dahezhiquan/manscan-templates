id: honeypot-cti-detect

info:
  name: Honeypot CTI 指纹识别（指纹识别）
  author: j4vaovo
  severity: info
  description: >-
    Honeypot CTI 是面向威胁情报或诱捕分析的蜜罐相关系统，用于观察扫描、攻击尝试和恶意行为特征。该模板通过请求目标服务并检查预设路径或首页响应、页面正文关键字、正则特征等指纹特征，判断目标是否使用或暴露了
    Honeypot CTI 相关组件；命中结果仅表示指纹特征匹配，可用于资产盘点、技术栈识别和后续安全评估，不代表已确认存在可利用漏洞。
  reference:
  - https://github.com/zema1/yarx
  metadata:
    max-request: 1
  tags: honeypot,tech,cti,discovery
variables:
  rand1: "{{randstr}}"
  rand2: "{{rand_int(11111, 99999)}}"
  rand3: "{{randstr}}"

http:
  - method: GET
    path:
      - "{{BaseURL}}/?{{rand1}}=../../../../../../../../etc/passwd&{{rand3}}=1%20and%20updatexml(1,concat(0x7e,(select%20md5({{rand2}}))),1)"

    matchers-condition: or
    matchers:
      - type: regex
        regex:
          - "root:[x*]:0:0"

      - type: word
        part: body
        words:
          - '{{md5({{rand2}})}}'
