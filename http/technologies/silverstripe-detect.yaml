id: silverstripe-detect

info:
  name: SilverStripe 指纹识别（指纹识别）
  author: Chirag Mistry
  severity: info
  description: |
    用于识别目标是否部署 SilverStripe 并提取相关版本或构建信息，模板会结合 favicon 哈希、HTTP 响应头、页面正文、状态码、特定路径或已知端点和版本或标识提取结果进行指纹匹配。
  metadata:
    max-request: 9
    shodan-query: http.component:"SilverStripe"
  tags: silverstripe,detect,tech

http:
  - method: GET
    path:
      - "{{BaseURL}}"
      - "{{BaseURL}}/robots.txt"
      - "{{BaseURL}}/sitemap.xml"
      - "{{BaseURL}}/favicon.ico"
      - "{{BaseURL}}/index.php"
      - "{{BaseURL}}/assets/"
      - "{{BaseURL}}/cms/"
      - "{{BaseURL}}/admin/"
      - "{{BaseURL}}/themes/"

    stop-at-first-match: true
    matchers-condition: and
    matchers:
      - type: word
        part: response
        words:
          - "Powered by SilverStripe"
          - "X-Powered-By-SilverStripe"
        condition: or
        case-insensitive: true

      - type: status
        status:
          - 200
          - 403

    extractors:
      - type: regex
        part: body
        name: version
        regex:
          - 'SilverStripe ([0-9.]+)'
          - 'Powered by SilverStripe ([0-9.]+)'

      - type: regex
        part: body
        name: silverstripe_id
        regex:
          - 'silverstripe-site-id=([a-z0-9]+)'
          - 'silverstripe\.org/([^/]+)'
