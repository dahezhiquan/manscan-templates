id: argo-workflows-unauth

info:
  name: Argo Workflows 未授权 仪表盘
  author: 0xBassia
  severity: high
  description: |
    检测到 Argo Workflows 未授权 仪表盘。目标功能在未认证状态下可访问，可能暴露管理入口、业务数据、系统状态或可执行操作，需确认是否存在访问控制缺失。
  impact: |
    - 未授权用户可能访问管理功能、业务数据或系统状态。
    - 暴露接口可能被用于进一步枚举、修改配置或执行敏感操作。
  remediation: |
    - 为相关管理界面和 API 启用强认证、授权校验和最小权限控制。
    - 将后台端点限制在可信网络或 VPN 内，并记录访问审计日志。
  reference:
    - https://argo-workflows.readthedocs.io/en/latest/argo-server-auth-mode/
    - https://argo-workflows.readthedocs.io/en/latest/argo-server-sso/
  classification:
    cvss-metrics: CVSS:3.1/AV:N/AC:L/PR:N/UI:N/S:U/C:H/I:H/A:L
    cvss-score: 9.4
    cwe-id: CWE-306
  metadata:
    verified: true
    max-request: 1
    shodan-query: title:"Argo Workflows"
  tags: misconfig,argo,kubernetes,unauth,workflow

http:
  - method: GET
    path:
      - '{{BaseURL}}/api/v1/workflows/argo'

    matchers-condition: and
    matchers:
      - type: word
        part: body
        words:
          - '"metadata"'
          - '"items"'
        condition: and

      - type: word
        part: header
        words:
          - "application/json"

      - type: status
        status:
          - 200
