id: mofi4500-default-login

info:
  name: MOFI4500-4GXeLTE-V2 默认口令登录（弱口令）
  author: pikpikcu
  severity: high
  description: |
    该模板用于检测 MOFI4500-4GXeLTE-V2 是否仍可使用默认凭据或弱口令登录。模板主要向 `/cgi-bin/luci/` 等认证入口发送请求，使用内置默认凭据组合进行认证尝试，并根据响应中的 `MOFI4500 - General - LuCI` 等登录成功特征判断登录是否成功；命中说明目标未及时修改出厂、示例或初始化账号口令。
  impact: |
    - 攻击者可接管 MOFI4500-4GXeLTE-V2 的 Web 管理界面，查看设备状态、网络配置、运行日志或敏感业务参数。
    - 被接管的网络、工控、打印、视频、存储或远程管理设备可能被用于中断业务、改变访问策略、窃取流量或作为内网横向移动入口。
  remediation: |
    - 立即修改所有默认账号口令，禁用不再使用的出厂账号，并为管理账户设置高强度唯一密码。
    - 将设备管理入口限制在 VPN、堡垒机或可信管理网段内，避免直接暴露到公网。
    - 升级设备固件或管理组件，审计近期登录记录、配置变更和异常会话。
  reference:
    - https://www.cleancss.com/router-default/Mofi_Network/MOFI4500-4GXELTE
  classification:
    cvss-metrics: CVSS:3.0/AV:N/AC:L/PR:N/UI:N/S:C/C:L/I:L/A:L
    cvss-score: 8.3
    cwe-id: CWE-522
  metadata:
    max-request: 1
  tags: mofi,default-login,vuln

http:
  - raw:
      - |
        POST /cgi-bin/luci/ HTTP/1.1
        Host: {{Hostname}}
        Content-Type: application/x-www-form-urlencoded

        username=root&password=admin

    attack: pitchfork
    payloads:
      username:
        - root
      password:
        - admin

    matchers-condition: and
    matchers:
      - type: word
        words:
          - "MOFI4500 - General - LuCI"

      - type: status
        status:
          - 200
