id: password-policy-reuse-enabled

info:
  name: 阿里云 RAM 密码复用未限制（云安全）
  author: DhiyaneshDK
  severity: medium
  description: RAM 密码策略允许用户重复使用旧密码时，密码轮换的安全收益会明显降低。模板调用 GetPasswordPolicy，当 PasswordReusePrevention 为 0 时判定未启用历史密码复用限制。
  impact: |
    - 用户可能在多次轮换后继续使用已泄露或弱口令，延长凭据风险暴露时间。
    - 密码轮换制度难以有效降低账号被撞库或复用攻击的概率。
  remediation: |
    - 在 RAM 密码策略中配置 PasswordReusePrevention，禁止重复使用最近若干次历史密码。
    - 结合密码有效期、复杂度和 MFA 要求，建立完整的控制台账号保护策略。
  reference:
    - https://www.alibabacloud.com/help/en/ram/user-guide/configure-a-password-policy-for-ram-users
    - https://www.trendmicro.com/cloudoneconformity/knowledge-base/alibaba-cloud/AlibabaCloud-RAM/prevent-password-reuse-password-policy.html
  metadata:
    max-request: 1
    verified: true
    vendor: alibaba
    product: ram
  tags: cloud,devops,aliyun,alibaba,alibaba-cloud-config,alibaba-ram

variables:
  region: "cn-hangzhou"

self-contained: true

code:
  - engine:
      - sh
      - bash
    source: |
      aliyun ram GetPasswordPolicy --region $region

    matchers:
      - type: word
        name: policy
        words:
          - '"PasswordReusePrevention": 0'

    extractors:
      - type: dsl
        dsl:
          - '"RAM Password Policy Allows Users Re-Use Old Password "'
