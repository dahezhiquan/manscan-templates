id: bonita-default-login

info:
  name: Bonita 默认口令登录（弱口令）
  author: DhiyaneshDk
  severity: high
  description: |
    该模板通过尝试 Bonita 的默认凭据，并依据认证成功后的响应特征判断目标是否仍在使用未修改的弱口令。若命中，攻击者可直接登录系统并访问相应管理功能或业务数据。
  metadata:
    verified: true
    max-request: 1
    shodan-query: http.favicon.hash:-1197926023
  tags: bonita,default-login,misconfig,vuln

variables:
  username: install
  password: install

http:
  - raw:
      - |
        POST /bonita/loginservice?redirect=true&redirectUrl=%2Fbonita%2Fapps%2FappDirectoryBonita HTTP/1.1
        Host: {{Hostname}}
        Content-Type: application/x-www-form-urlencoded

        username={{username}}&password={{password}}&_l=en

    host-redirects: true
    max-redirects: 4
    matchers-condition: and
    matchers:
      - type: word
        part: body
        words:
          - "Layout Without Menu"
          - "bonitasoft.ui.services"
        condition: and

      - type: status
        status:
          - 200
