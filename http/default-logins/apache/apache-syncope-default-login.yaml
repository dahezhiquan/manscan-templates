id: apache-syncope-default-login

info:
  name: Apache Syncope 默认口令登录（弱口令）
  author: icarot
  severity: high
  description: |
    该模板用于检测 Apache Syncope 是否仍可使用默认凭据或弱口令登录。模板主要向 `/syncope-console/login`、`/syncope-console{变量}` 等认证入口发送请求，使用内置默认凭据组合进行认证尝试，并根据响应中的 `<ajax-response><redirect><![CDATA[.]]></redirect></ajax-response>`、`<ajax-response><redirect><![CDATA[../]]></redirect></ajax-response>` 等登录成功特征判断登录是否成功；命中说明目标未及时修改出厂、示例或初始化账号口令。
  impact: |
    - 攻击者可进入 Apache Syncope 管理后台，修改任务、服务、插件、路由、作业调度或部署配置。
    - 在 DevOps、网关、监控或调度场景中，后台失陷可能影响生产任务执行、泄露密钥配置，并扩大到下游主机或业务系统。
  remediation: |
    - 立即修改默认管理员口令并清理示例账号，按角色最小化后台管理权限。
    - 将控制台和管理 API 放入受控网络或 VPN 后方，并开启多因素认证、登录失败限制和操作审计。
    - 复核近期任务、插件、连接配置、访问令牌和部署记录，轮换可能暴露的密钥。
  reference:
    - https://github.com/apache/syncope
  metadata:
    verified: true
    vendor: apache
    product: syncope
  tags: apache,syncope,default-login

flow: http(1) && http(2)

http:
  - raw:
      - |
        GET /syncope-console/login HTTP/1.1
        Host: {{Hostname}}
        Cookie: JSESSIONID=333333444444AAAA555555556666;

      - |
        GET /syncope-console{{location}} HTTP/1.1
        Host: {{Hostname}}

    extractors:
      - type: regex
        name: jsessionid
        group: 1
        part: header_1
        regex:
          - 'Set-Cookie: (?<jsessionid>JSESSIONID=\w+);'
        internal: true

      - type: regex
        name: location
        group: 1
        part: header_1
        regex:
          - 'Location: .(?<location>\/login\?\d+)'
        internal: true

      - type: regex
        name: loginsubmit
        group: 1
        part: body_2
        regex:
          - '.(?<loginsubmit>\/login\?[0-9]-[0-9].[0-9]-login-submit)'
        internal: true

  - raw:
      - |
        POST /syncope-console{{loginsubmit}} HTTP/1.1
        Host: {{Hostname}}
        Wicket-Ajax: true
        Wicket-Ajax-BaseURL: {{location}}
        X-Requested-With: XMLHttpRequest
        Content-Type: application/x-www-form-urlencoded; charset=UTF-8
        Origin: {{RootURL}}

        username={{username}}&password={{password}}&language=0&domain=0&p%3A%3Asubmit=1

    attack: pitchfork
    payloads:
      username:
        - admin
      password:
        - password

    matchers-condition: and
    matchers:
      - type: word
        part: body
        words:
          - '<ajax-response><redirect><![CDATA[.]]></redirect></ajax-response>'
          - '<ajax-response><redirect><![CDATA[../]]></redirect></ajax-response>'
        condition: or

      - type: status
        status:
          - 200
