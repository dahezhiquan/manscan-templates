id: azure-keyvault-cert-keytype-unapproved
info:
  name: Azure Key Vault 证书使用未批准的密钥类型（云安全）
  author: princechaddha
  severity: medium
  description: Azure Key Vault 证书策略中的 keyType 决定证书私钥使用的非对称算法类型；不同应用和密码基线对 RSA、EC 等类型的支持要求不同。本模板读取启用证书的 policy.keyProperties.keyType，并在值为 EC 时按当前组织基线报告为未批准类型。
  impact: |
    - EC 密钥若不符合组织密码策略或下游系统兼容性要求，可能导致证书签发、部署、续期或 TLS 握手失败。
    - 统一密码基线未落实会造成算法使用不一致，增加审计整改和证书生命周期管理成本。
  remediation: |
    - 根据组织密码策略和依赖系统兼容性选择批准的 keyType；若基线要求 RSA，应重新签发使用 RSA 私钥的新证书。
    - 在替换证书前验证客户端支持、密钥保护级别、签发机构和自动续期流程，避免直接切换造成服务中断。
  reference:
    - https://docs.microsoft.com/en-us/azure/key-vault/certificates/about-certificates
  metadata:
    vendor: microsoft
    product: azure-key-vault
  tags: cloud,devops,azure,microsoft,keyvault,azure-cloud-config

flow: |
  code(1);
  for (let KeyVaultName of iterate(template.keyVaultNames)) {
    set("vaultName", KeyVaultName)
    code(2);
    for (let CertificateId of iterate(template.certificateIds)) {
      set("certificateId", CertificateId)
      code(3)
    }
  }

self-contained: true
code:
  - engine:
      - sh
      - bash
    source: |
      az keyvault list --query '[*].name' --output json

    extractors:
      - type: json
        name: keyVaultNames
        internal: true
        json:
          - '.[]'

  - engine:
      - sh
      - bash
    source: |
      az keyvault certificate list --vault-name $vaultName --query '[?(attributes.enabled==`true`)].id' --output json

    extractors:
      - type: json
        name: certificateIds
        internal: true
        json:
          - '.[]'

  - engine:
      - sh
      - bash
    source: |
      az keyvault certificate show --id $certificateId --query 'policy.keyProperties.keyType' --output json

    matchers:
      - type: word
        words:
          - 'EC'

    extractors:
      - type: dsl
        dsl:
          - 'vaultName + " SSL/TLS certificate " + certificateId + " uses an unapproved key type"'
