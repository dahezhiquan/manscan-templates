id: supabase-studio-panel

info:
  name: Supabase Studio 登录面板识别（指纹识别）
  author: ChrisJr404
  severity: info
  description: |-
    Supabase Studio 是 Supabase 项目的 Web 管理台，用于数据库、认证、存储、函数和 API 配置。该模板请求首页、`/_login`，并依据 DSL 条件识别目标是否部署了该系统或暴露了对应入口，适用于资产指纹确认；命中结果仅表示系统特征匹配，不代表已确认存在未授权访问或可利用漏洞。
  reference:
  - https://github.com/supabase/supabase
  - https://supabase.com/docs/guides/self-hosting
  metadata:
    verified: true
    max-request: 2
    vendor: supabase
    product: supabase
    shodan-query: http.title:"Supabase Studio"
    fofa-query: title="Supabase Studio"
  tags: panel,supabase,studio,detect,discovery,login

http:
  - method: GET
    path:
      - "{{BaseURL}}"
      - "{{BaseURL}}/_login"

    stop-at-first-match: true
    matchers:
      - type: dsl
        dsl:
          - 'status_code == 200'
          - 'contains(to_lower(body), "<title>supabase studio")'
        condition: and
