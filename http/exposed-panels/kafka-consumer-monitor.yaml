id: kafka-consumer-monitor

info:
  name: Apache Kafka Consumer Offset Monitor 面板识别（暴露面识别）
  author: dhiyaneshDK
  severity: info
  description: 该模板通过识别 Apache Kafka Consumer Offset Monitor 面板、控制台或管理界面的页面特征，判断目标是否暴露了对应服务入口。若命中，说明该后台或运维界面对外可访问，可用于资产识别与暴露面排查。
  classification:
    cvss-metrics: CVSS:3.0/AV:N/AC:L/PR:N/UI:N/S:U/C:N/I:N/A:N
    cwe-id: CWE-200
    cpe: cpe:2.3:a:apache:kafka:*:*:*:*:*:*:*:*
  metadata:
    max-request: 1
    vendor: apache
    product: kafka
    shodan-query:
      - http.title:"Kafka Consumer Offset Monitor"
      - http.title:"kafka center"
      - http.title:"kafka consumer offset monitor"
    fofa-query:
      - title="kafka center"
      - title="kafka consumer offset monitor"
    google-query:
      - intitle:"kafka center"
      - intitle:"kafka consumer offset monitor"
  tags: panel,kafka,apache,discovery

http:
  - method: GET
    path:
      - '{{BaseURL}}'

    host-redirects: true
    max-redirects: 2
    matchers:
      - type: word
        words:
          - '<title>Kafka Consumer Offset Monitor</title>'
