id: kubernetes-k8s-kubelet-healthz

info:
  name: Kubelet Healthz 指纹识别（指纹识别）
  author: sharath
  severity: info
  description: >-
    Kubelet 是每个 Kubernetes 节点上的节点代理，healthz 接口用于反映节点组件健康状态。该模板通过请求目标服务并检查预设路径或首页响应、页面正文关键字、HTTP
    响应头、正则特征、状态码等指纹特征，判断目标是否使用或暴露了 Kubelet Healthz 相关组件；命中结果仅表示指纹特征匹配，可用于资产盘点、技术栈识别和后续安全评估，不代表已确认存在可利用漏洞。
  metadata:
    max-request: 1
  tags: tech,kubernetes,devops,kubelet,discovery
http:
  - method: GET
    path:
      - "{{BaseURL}}/healthz"

    matchers-condition: and
    matchers:
      - type: status
        status:
          - 200

      - type: regex
        part: header
        regex:
          - "text/plain"

      - type: word
        part: body
        words:
          - "ok"

      - type: word
        part: header
        words:
          - "Kubernetes"
