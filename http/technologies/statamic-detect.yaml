id: statamic-detect

info:
  name: Statamic 指纹识别（指纹识别）
  author: geeknik
  severity: info
  description: >-
    Statamic 是基于 Laravel 的平面文件 CMS，用于内容建模、站点构建和编辑工作流。该模板通过请求目标服务并检查预设路径或首页响应、HTTP
    响应头、正则特征等指纹特征，判断目标是否使用或暴露了 Statamic 相关组件；命中结果仅表示指纹特征匹配，可用于资产盘点、技术栈识别和后续安全评估，不代表已确认存在可利用漏洞。
  reference:
  - https://github.com/statamic/cms
  classification:
    cpe: cpe:2.3:a:statamic:statamic:*:*:*:*:*:*:*:*
  metadata:
    verified: true
    max-request: 1
    vendor: statamic
    product: statamic
    shodan-query: "Statamic"
  tags: tech,statamic,detect,discovery
http:
  - method: GET
    path:
      - "{{BaseURL}}"

    host-redirects: true
    max-redirects: 2
    matchers:
      - type: regex
        part: header
        regex:
          - 'X-Powered-By:(.*)Statamic'
