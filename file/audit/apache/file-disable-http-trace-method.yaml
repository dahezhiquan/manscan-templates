id: file-disable-http-trace-method

info:
  name: Apache2 HTTP TRACE 方法未禁用（本地文件安全扫描）
  author: pussycat0x
  severity: high
  description: |
    HTTP TRACE 会让服务器回显请求内容，通常不参与业务处理。若 Apache 未明确关闭 TRACE，攻击者可能结合跨站脚本、代理或受害者浏览器环境探测和回显敏感请求头。本模板在配置中识别 `<Directory>` 或 `<FilesMatch>` 段，并检查是否缺少禁用 TRACE 的明确配置；它不直接向服务发送 TRACE 请求。
  impact: |
    - 在特定客户端和代理条件下，TRACE 回显可能暴露 Cookie、Authorization 或其他请求头，辅助会话窃取。
    - 开放不必要的 HTTP 方法会扩大管理面和协议攻击面，并增加中间设备处理异常请求的风险。
  remediation: |
    - 在全局或适用虚拟主机配置中设置 `TraceEnable Off`，重载 Apache 后用实际请求验证返回状态。
    - 在反向代理、WAF 和应用层同步限制 TRACE、TRACK 等不需要的方法，并持续监控方法异常使用。
  reference:
    - https://httpd.apache.org/docs/2.4/mod/core.html#traceenable
  metadata:
    verified: true
  tags: audit,config,file,apache,hardening

file:
  - extensions:
      - conf

    matchers-condition: and
    matchers:
      - type: word
        words:
          - "<Directory"
          - "<FilesMatch"
        condition: and

      - type: word
        words:
          - "TraceEnable On"
          - "<IfModule mod_core.c>"
        condition: and
        negative: true
