id: secret-token-rb

info:
  name: 密钥 令牌 Ruby文件暴露（暴露面识别）
  author: DhiyaneshDK
  severity: medium
  description: |
    检测到目标站点可直接访问 密钥 令牌 Ruby文件。Redmine 配置、问题和设置文件可能暴露项目管理数据、数据库连接和内部协作信息。该模板请求 `/secret_token.rb`、`/config/initializers/secret_token.rb`、`/redmine/config/initializers/secret_token.rb`，并通过 HTTP 状态码、响应正文关键字、文件格式特征、正则匹配或响应头进行确认。此类文件公开后可能泄露源码结构、依赖版本、内部路径、业务配置、访问凭据或调试数据，扩大暴露面并降低攻击者的后续利用成本。
  impact: |-
    - 泄露的密码、API Key、访问令牌、私钥或服务账号凭据可能被用于直接访问云资源、代码仓库、数据库、邮件服务或内部系统。
    - 攻击者可能借助有效凭据读取或篡改业务数据、发布恶意制品、创建持久化访问、冒用服务身份或产生额外资源费用。
    - 即使凭据权限有限，也会暴露账号命名、环境划分和内部系统关系，辅助后续横向移动。
  remediation: |-
    - 立即撤销并轮换暴露文件中可能出现的密码、API Key、访问令牌、SSH/SSL 私钥、数据库连接串和云访问密钥。
    - 将敏感配置迁移到密钥管理系统、环境变量注入或受控配置中心，避免随静态文件对外发布。
    - 限制相关账号权限并启用最小权限、MFA、访问审计和异常调用告警。
    - 排查近期登录、API 调用、代码仓库、云资源和制品库操作记录，确认是否存在未授权使用。
  classification:
    cpe: cpe:2.3:a:rubyonrails:rails:*:*:*:*:*:*:*:*
  metadata:
    verified: true
    max-request: 3
    vendor: rubyonrails
    product: rails
    google-query: intitle:"index of" "secret_token.rb"
  tags: redmine,devops,exposure,ruby,files,vuln

http:
  - method: GET
    path:
      - "{{BaseURL}}/secret_token.rb"
      - "{{BaseURL}}/config/initializers/secret_token.rb"
      - "{{BaseURL}}/redmine/config/initializers/secret_token.rb"

    stop-at-first-match: true

    matchers-condition: and
    matchers:
      - type: word
        words:
          - '::Application.config.secret'

      - type: status
        status:
          - 200
