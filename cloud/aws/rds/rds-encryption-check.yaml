id: rds-encryption-check
info:
  name: RDS 实例存储加密未启用（云安全）
  author: princechaddha
  severity: high
  description: RDS 存储加密用于保护数据库实例、自动备份、只读副本和快照中的静态数据；未启用时，底层存储缺少 KMS 加密保护。该模板枚举 RDS 实例并检查 StorageEncrypted 是否为 false。
  impact: |
    - 数据库静态数据、备份和快照在存储层缺少加密保护，扩大介质或快照泄露后的影响。
    - 缺少 KMS 管控会削弱密钥审计、访问控制和合规证明能力。
  remediation: |
    - 新建或迁移 RDS 实例时启用存储加密，并选择符合组织要求的 KMS key。
    - 对未加密实例通过加密快照复制和还原方式迁移，迁移后验证备份与副本也保持加密。
  reference:
    - https://docs.aws.amazon.com/AmazonRDS/latest/UserGuide/Overview.Encryption.html
  metadata:
    max-request: 2
    vendor: amazon
    product: rds
  tags: cloud,devops,aws,amazon,rds,aws-cloud-config
variables:
  region: "ap-northeast-1"

flow: |
  code(1)
  for(let DBInstances of iterate(template.instances)){
    set("db", DBInstances)
    code(2)
  }

self-contained: true
code:
  - engine:
      - sh
      - bash
    source: |
      aws rds describe-db-instances --region $region --output json --query 'DBInstances[*].DBInstanceIdentifier'

    extractors:
      - type: json
        name: instances
        internal: true
        json:
          - '.[]'

  - engine:
      - sh
      - bash
    source: |
         aws rds describe-db-instances --region $region --db-instance-identifier $db --query 'DBInstances[*].{"StorageEncrypted":StorageEncrypted,"KmsKeyId":KmsKeyId}'

    matchers:
      - type: word
        words:
          - 'false'

    extractors:
      - type: dsl
        dsl:
          - '"The encryption of data at rest is not enabled for " + db + " RDS database instance"'
