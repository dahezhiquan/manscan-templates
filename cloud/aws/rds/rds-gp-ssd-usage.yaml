id: rds-gp-ssd-usage
info:
  name: RDS 使用 Provisioned IOPS SSD 存储（云安全）
  author: princechaddha
  severity: high
  description: RDS 实例使用 io1 Provisioned IOPS SSD 时通常意味着更高成本和更严格的容量/性能规划要求；若业务不需要专用 IOPS，可能偏离成本与运维基线。该模板枚举 RDS 实例并检查 StorageType 是否为 io1。
  impact: |
    - 不必要的 io1 存储会增加数据库运行成本，并可能掩盖容量规划或性能基线异常。
    - 存储类型与业务需求不匹配时，后续扩容、预算和资源治理都会更难统一管理。
  remediation: |
    - 评估命中的 RDS 实例是否确实需要 Provisioned IOPS，必要时迁移到 gp3/gp2 等更合适的通用型 SSD。
    - 为高性能存储建立审批和标签说明，持续跟踪成本、IOPS 利用率和容量趋势。
  reference:
    - https://aws.amazon.com/rds/features/storage/
  metadata:
    max-request: 2
    vendor: amazon
    product: rds
  tags: cloud,devops,aws,amazon,rds,aws-cloud-config
variables:
  region: "ap-northeast-1"

flow: |
  code(1)
  for(let DBInstances of iterate(template.instances)){
    set("db", DBInstances)
    code(2)
  }

self-contained: true
code:
  - engine:
      - sh
      - bash
    source: |
      aws rds describe-db-instances --region $region --output json --query 'DBInstances[*].DBInstanceIdentifier'

    extractors:
      - type: json
        name: instances
        internal: true
        json:
          - '.[]'

  - engine:
      - sh
      - bash
    source: |
         aws rds describe-db-instances --region $region --db-instance-identifier $db --query 'DBInstances[*].StorageType'

    matchers:
      - type: word
        words:
          - 'io1'

    extractors:
      - type: dsl
        dsl:
          - 'db + " RDS instance uses Provisioned IOPS SSD, not the most cost-effective storage"'
