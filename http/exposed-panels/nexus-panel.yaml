id: nexus-panel

info:
  name: Nexus 登录面板识别（指纹识别）
  author: righettod
  severity: info
  description: |-
    检测到目标站点存在 Nexus 相关响应特征。Nexus 是研发运维、制品或代码管理平台，用于管理构建、代码、制品、任务、插件、凭据和执行记录。模板请求 `/`，并通过页面标题或正文关键字、状态码、DSL 条件确认该系统指纹，用于资产识别、系统盘点和暴露面梳理。
  reference:
    - https://www.sonatype.com/products/sonatype-nexus-repository
  metadata:
    verified: true
    max-request: 1
    shodan-query: http.title:"Sonatype Nexus Repository"
  tags: panel,nexus,login,detect,discovery
http:
  - method: GET
    path:
      - "{{BaseURL}}"

    matchers:
      - type: dsl
        dsl:
          - 'status_code == 200'
          - 'contains_any(to_lower(body), "<title>sonatype nexus repository", "content=\"sonatype nexus repository", "nexus-coreui-bundle")'
        condition: and

    extractors:
      - type: regex
        part: body
        group: 1
        regex:
          - '_v=([0-9\.\-]+)'
