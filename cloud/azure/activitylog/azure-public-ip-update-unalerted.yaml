id: azure-public-ip-update-unalerted
info:
  name: Azure 公共 IP 创建或更新告警未配置（云安全）
  author: princechaddha
  severity: high
  description: 公共 IP 创建或更新可能改变公网入口、地址分配和访问路径；未配置 Activity Log 告警时，网络暴露面变化可能不被及时发现。该模板枚举已启用的 Activity Log Alert，并检查告警条件是否缺少 Microsoft.Network/publicIPAddresses/write 操作。
  impact: |
    - 未授权主体可能创建新的公网入口，或修改 SKU、DNS、空闲超时等影响暴露面的属性。
    - 异常公共 IP 变更可能使管理服务和应用端点暴露给互联网扫描与攻击。
  remediation: |
    - 创建针对公共 IP 创建和更新操作的 Activity Log Alert，并将通知纳入网络变更审批。
    - 限制公共 IP 管理权限，结合 NSG、负载均衡器和私有端点策略复核新增公网暴露。
  reference:
    - https://docs.microsoft.com/en-us/azure/azure-monitor/platform/alerts-activity-log
  metadata:
    vendor: microsoft
    product: azure-monitor
  tags: cloud,devops,azure,microsoft,public-ip,azure-cloud-config

flow: |
  code(1);
  for (let AlertData of iterate(template.alertList)) {
    set("id", AlertData);
    code(2);
  }

self-contained: true
code:
  - engine:
      - sh
      - bash
    source: |
      az monitor activity-log alert list --output json --query '[?(enabled==`true`)].id'

    extractors:
      - type: json
        name: alertList
        internal: true
        json:
          - '.[]'

  - engine:
      - sh
      - bash
    source: |
      az monitor activity-log alert show --ids "$id"

    matchers-condition: and
    matchers:
      - type: word
        words:
          - '"field": "operationName"'

      - type: word
        words:
          - "Microsoft.Network/publicIPAddresses/write"
        negative: true

    extractors:
      - type: dsl
        dsl:
          - 'id + " does not have the correct alert configuration for Create/Update Public IP Address events"'
