id: apache-sling-detect

info:
  name: Apache Sling 指纹识别（指纹识别）
  author: icarot
  severity: info
  description: |-
    Apache Sling 是基于 OSGi 的 Web 框架，用于内容驱动的 Java Web 应用。该模板请求 `/starter.html`，并依据 HTTP 200 状态码、页面标题、正文关键字或品牌资源特征识别目标是否使用或暴露了 Apache Sling 相关组件，适用于资产盘点、技术栈识别和后续安全评估；命中结果仅表示指纹特征匹配，不代表已确认存在可利用漏洞。
  reference:
  - https://github.com/apache/sling
  metadata:
    max-request: 1
    vendor: apache
    product: sling
    shodan-query: title:"Apache Sling"
  tags: apache,sling,detect

http:
  - method: GET
    path:
      - "{{BaseURL}}/starter.html"

    matchers-condition: and
    matchers:
      - type: word
        words:
          - 'Apache Sling'
          - 'sling.apache'
        condition: and

      - type: status
        status:
          - 200
