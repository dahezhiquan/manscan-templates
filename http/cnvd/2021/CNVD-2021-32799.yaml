id: CNVD-2021-32799

info:
  name: 360 天擎终端安全管理系统 SQL 注入漏洞（CNVD-2021-32799）
  author: SleepingBag945
  severity: high
  description: |
    公开资料将 360 天擎终端安全管理系统的 `rptsvcsyncpoint` 接口归类为 SQL 注入风险点。当前模板通过访问 `/api/dp/rptsvcsyncpoint?ccid=1` 并匹配特定 JSON 字段识别疑似受影响接口，适合用于资产侧快速发现。
  reference:
    - https://blog.51cto.com/u_9691128/4295047
    - https://www.cnvd.org.cn/patchInfo/show/270651
    - https://github.com/zan8in/afrog/blob/main/v2/pocs/afrog-pocs/CNVD/2021/CNVD-2021-32799.yaml
  metadata:
    verified: true
    max-request: 1
    fofa-query: app="360新天擎"
  tags: cnvd2021,cnvd,360,xintianqing,sqli,vuln

http:
  - method: GET
    path:
      - '{{BaseURL}}/api/dp/rptsvcsyncpoint?ccid=1'

    matchers-condition: and
    matchers:
      - type: word
        part: body
        words:
          - '"reason":'
          - '"success"'
          - '"antiadwa":'
          - '"clientupgrade":'
        condition: and

      - type: word
        part: header
        words:
          - 'application/json'

      - type: status
        status:
          - 200
