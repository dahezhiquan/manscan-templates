id: CNVD-2023-96945

info:
  name: 迈威安全生产数字化管理平台任意文件上传漏洞（CNVD-2023-96945）
  author: DhiyaneshDk
  severity: high
  description: |
    迈威安全生产数字化管理平台存在任意文件上传风险。该模板依据公开资料中的上传组件位置，检测 `FileChoose.html` 上传页面是否可被直接访问，用于识别疑似受影响资产。
  reference:
    - https://blog.csdn.net/weixin_42628854/article/details/136036109
  metadata:
    verified: true
    max-request: 1
    fofa-query: "安全生产数字化管理平台"
  tags: cnvd,cnvd2023,file-upload,mcvie,vuln

http:
  - method: GET
    path:
      - "{{BaseURL}}/Content/Plugins/uploader/FileChoose.html"

    matchers-condition: and
    matchers:
      - type: word
        words:
          - "选择文件"
          - "提交"
        condition: and

      - type: status
        status:
          - 200
