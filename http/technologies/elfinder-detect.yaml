id: elfinder-detect

info:
  name: elFinder - Install 指纹识别（指纹识别）
  author: pikpikcu
  severity: info
  description: elFinder - Install 是 Web 文件管理器，用于浏览、上传、编辑和维护服务器端文件。该模板请求首页、`/elfinder.html`，并依据 HTTP 200 状态码、页面标题、正文关键字或品牌资源特征识别目标是否使用或暴露了 elFinder - Install 相关组件，适用于资产盘点、技术栈识别和后续安全评估；命中结果仅表示指纹特征匹配，不代表已确认存在可利用漏洞。
  classification:
    cvss-metrics: CVSS:3.0/AV:N/AC:L/PR:N/UI:N/S:U/C:N/I:N/A:N
    cvss-score: 0
    cwe-id: CWE-200
  metadata:
    max-request: 2
  tags: tech,elfinder,discovery

http:
  - method: GET
    path:
      - "{{BaseURL}}"
      - "{{BaseURL}}/elfinder.html"

    stop-at-first-match: true

    matchers-condition: and
    matchers:
      - type: word
        part: body
        words:
          - "<!-- Element where elFinder will be created (REQUIRED) -->"

      - type: status
        status:
          - 200
