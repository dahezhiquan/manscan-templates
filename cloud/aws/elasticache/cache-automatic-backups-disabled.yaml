id: cache-automatic-backups-disabled

info:
  name: ElastiCache Automatic Backups -未启用（云安全）
  author: DhiyaneshDK
  severity: medium
  description: Amazon ElastiCache 自动备份可按日创建缓存备份，在故障或误操作后用于恢复到新的缓存实例。未启用自动备份时，Redis/Valkey 复制组缺少可用恢复点。本模板枚举指定区域的 ElastiCache replication group，并在 SnapshotRetentionLimit 为 0 时报告自动备份未启用。
  impact: |
    - 缓存节点故障、误删除或数据损坏时，无法从近期快照快速恢复业务数据。
    - 需要保留会话、令牌、队列或业务缓存状态的场景中，恢复时间和数据丢失范围会扩大。
  remediation: |
    - 为关键 ElastiCache replication group 启用自动备份，并设置符合业务 RPO 的 SnapshotRetentionLimit。
    - 定期验证备份可恢复性，并将备份保留策略纳入变更和合规审计。
  reference:
    - https://www.trendmicro.com/cloudoneconformity-staging/knowledge-base/aws/ElastiCache/enable-automatic-backups.html
    - https://docs.aws.amazon.com/AmazonElastiCache/latest/red-ug/backups-automatic.html
  metadata:
    vendor: amazon
    product: elasticache
  tags: cloud,devops,aws,amazon,elasticache,aws-cloud-config

variables:
  region: "us-west-2"

flow: |
  code(1)
  for(let ReplicationGroupId of iterate(template.replicationgroupids)){
    set("replicationgroup", ReplicationGroupId)
    code(2)
  }

self-contained: true

code:
  - engine:
      - sh
      - bash
    source: |
      aws elasticache describe-replication-groups --region $region --output json --query 'ReplicationGroups[*].ReplicationGroupId'

    extractors:
      - type: json
        name: replicationgroupids
        internal: true
        json:
          - '.[]'

  - engine:
      - sh
      - bash

    source: |
        aws elasticache describe-replication-groups --replication-group-id $replicationgroup --query 'ReplicationGroups[*].SnapshotRetentionLimit' --region $region --output json

    matchers:
      - type: word
        words:
          - '0'

    extractors:
      - type: dsl
        dsl:
          - 'replicationgroup + " ElastiCache Automatic Backups is Disabled"'
