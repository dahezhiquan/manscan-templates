id: commonwealth-bank-phish

info:
  name: Commonwealth Bank 仿冒钓鱼网站（钓鱼网站识别）
  author: rxerium
  severity: info
  description: |
    检测到疑似仿冒 Commonwealth Bank 的钓鱼网站。模板在目标页面返回 200、页面内容命中 Commonwealth Bank 的金融或支付页面特征，且当前主机不属于 commbank.com.au 官方域名时触发，用于识别借用 Commonwealth Bank 品牌页面诱导用户信任的仿冒站点。
  reference:
    - https://commbank.com.au
  metadata:
    max-request: 1
  tags: phishing,commonwealth-bank,bank,osint,discovery
http:
  - method: GET
    path:
      - "{{BaseURL}}"

    host-redirects: true
    max-redirects: 2

    matchers-condition: and
    matchers:
      - type: word
        words:
          - 'Commonwealth Bank'
          - 'CommBank offers personal banking, business solutions, institutional banking, company information, and more'
        condition: and

      - type: status
        status:
          - 200

      - type: dsl
        dsl:
          - '!contains(host,"commbank.com.au")'
