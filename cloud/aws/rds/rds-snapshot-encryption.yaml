id: rds-snapshot-encryption
info:
  name: RDS Snapshot 加密（云安全）
  author: princechaddha
  severity: medium
  description: 该规则用于检查 AWS RDS 是否正确启用传输中或静态数据加密、证书校验及安全协议配置，防止敏感数据在存储或通信过程中被窃听、篡改或滥用。
  impact: |
    - 未正确启用加密或安全协议时，敏感数据可能在传输或存储过程中被窃听、窃取或篡改。
    - 这还可能导致不满足行业合规要求，增加数据泄露与法律责任风险。
  remediation: |
    - 启用厂商推荐的加密方案，并优先使用更安全的协议、算法或客户管理密钥。
    - 同时检查相关证书、密钥与依赖服务的生命周期管理，确保配置持续有效。
  reference:
    - https://docs.aws.amazon.com/AmazonRDS/latest/UserGuide/USER_EncryptSnapshot.html
  metadata:
    max-request: 2
  tags: cloud,devops,aws,amazon,rds,aws-cloud-config
variables:
  region: "ap-northeast-1"

flow: |
  code(1)
  for(let RDPsnaps of iterate(template.snapshots)){
    set("snapshot", RDPsnaps)
    code(2)
  }

self-contained: true
code:
  - engine:
      - sh
      - bash
    source: |
      aws rds describe-db-snapshots --region $region --snapshot-type manual --output json --query 'DBSnapshots[*].DBSnapshotIdentifier'

    extractors:
      - type: json
        name: snapshots
        internal: true
        json:
          - '.[]'

  - engine:
      - sh
      - bash
    source: |
         aws rds describe-db-snapshots --region $region --db-snapshot-identifier $snapshot --query 'DBSnapshots[*].Encrypted'

    matchers:
      - type: word
        words:
          - 'false'

    extractors:
      - type: dsl
        dsl:
          - '"Amazon RDS database snapshot " + snapshot + " is not encrypted"'
