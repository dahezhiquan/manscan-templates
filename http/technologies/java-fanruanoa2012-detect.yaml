id: java-fanruanoa2012-detect

info:
  name: 帆软 OA 2012 指纹识别（指纹识别）
  author: YanYun
  severity: info
  description: >-
    帆软 OA 2012 是面向企业办公自动化的 Web 系统，用于流程审批、协同办公和内部管理。该模板通过请求目标服务并检查预设路径或首页响应、页面正文关键字、状态码等指纹特征，判断目标是否使用或暴露了
    帆软 OA 2012 相关组件；命中结果仅表示指纹特征匹配，可用于资产盘点、技术栈识别和后续安全评估，不代表已确认存在可利用漏洞。
  metadata:
    max-request: 1
  tags: oa,java,fanruan,tech,discovery
http:
  - method: GET
    path:
      - "{{BaseURL}}"

    matchers-condition: and
    matchers:
      - type: status
        status:
          - 200

      - type: word
        words:
          - 'down.download?FM_SYS_ID'
