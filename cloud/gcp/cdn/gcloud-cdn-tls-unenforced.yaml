id: gcloud-cdn-tls-unenforced

info:
  name: Unenforced SSL/TLS on Cloud CDN Backend Service Origins（云安全）
  author: princechaddha
  severity: medium
  description: Cloud CDN backend service 源站如果允许 HTTP 明文入口，客户端到边缘或负载均衡入口的访问可能未被 TLS 保护。本模板枚举 URL map 和 forwarding rule，并在转发规则端口范围为 80-80 时报告服务未强制 SSL/TLS。
  impact: |
    - 登录态、请求参数和业务数据可能经由明文 HTTP 暴露给中间人，存在窃听、重放或篡改风险。
    - 未强制 TLS 会削弱统一安全访问策略，并可能不满足敏感业务或合规场景的加密要求。
  remediation: |
    - 为 Cloud CDN 和负载均衡前端启用 HTTPS，并将 HTTP 入口重定向到 HTTPS 或删除不必要的 80 端口规则。
    - 配置有效证书和安全的 SSL policy，持续巡检新增 forwarding rule 是否重新开放明文访问。
  reference:
    - https://cloud.google.com/cdn/docs/using-https
  metadata:
    vendor: google
    product: cloud-cdn
  tags: cloud,devops,gcp,gcloud,cloud-cdn,gcp-cloud-config

flow: |
  code(1)
  for(let projectId of iterate(template.projectIds)){
    set("projectId", projectId)
    code(2)
    for(let service of iterate(template.services)){
      set("serviceName", service)
      code(3)
      code(4)
    }
  }

self-contained: true

code:
  - engine:
      - sh
      - bash
    source: |
      gcloud projects list --format="json(projectId)"

    extractors:
      - type: json
        name: projectIds
        internal: true
        json:
          - '.[].projectId'

  - engine:
      - sh
      - bash
    source: |
      gcloud compute url-maps list --project $projectId --format="json(name,defaultService)"

    extractors:
      - type: json
        name: services
        internal: true
        json:
          - '.[].name'

  - engine:
      - sh
      - bash
    source: |
      gcloud compute forwarding-rules list --project $projectId

    extractors:
      - type: json
        name: forwardingRules
        internal: true
        json:
          - '.[].name'

  - engine:
      - sh
      - bash
    source: |
      gcloud compute forwarding-rules describe $forwardingRules --global --format="value(portRange)"

    matchers:
      - type: word
        words:
          - '80-80'

    extractors:
      - type: dsl
        dsl:
          - '"HTTP traffic allowed without SSL/TLS on service: " + serviceName + " in Project: " + projectId'
