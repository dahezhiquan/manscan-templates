id: api-sendgrid

info:
  name: Sendgrid API Token 可用性校验（token喷洒）
  author: zzeitlin,0xpugal
  severity: info
  description: |
    该模板通过调用 Sendgrid API 的已知接口验证提供的 token 是否有效，命中后通常表示可访问邮件发送、投递或邮箱服务能力。
  reference:
    - https://www.twilio.com/docs/sendgrid/api-reference/how-to-use-the-sendgrid-v3-api
  metadata:
    verified: true
    max-request: 1
  tags: token-spray,sendgrid

self-contained: true

http:
  - method: GET
    path:
      - "https://api.sendgrid.com/v3/scopes"

    headers:
      Authorization: Bearer {{token}}
      Content-Type: application/json

    matchers-condition: and
    matchers:
      - type: word
        part: body
        words:
          - '"scopes":['

      - type: word
        part: header
        words:
          - 'application/json'

      - type: status
        status:
          - 200
