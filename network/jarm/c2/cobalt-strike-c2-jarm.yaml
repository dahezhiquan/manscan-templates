id: cobalt-strike-c2-jarm

info:
  name: Cobalt Strike C2 JARM 识别（C2 识别）
  author: pussycat0x
  severity: high
  description: |
    Cobalt Strike 是常被红队和攻击者用于 Beacon 控制、横向移动和后渗透操作的 C2 框架。该模板计算目标 TLS 服务的 JARM 指纹，并与已知 Cobalt Strike C2 指纹 `07d14d16d21d21d07c42d41d00041d24a458a375eef0c576d23a7bab9a9fb1` 匹配，用于发现疑似命令控制基础设施。
  reference:
    - https://blog.sekoia.io/hunting-and-detecting-cobalt-strike/
  metadata:
    verified: true
    max-request: 1
    shodan-query: ssl.jarm:07d14d16d21d21d07c42d41d00041d24a458a375eef0c576d23a7bab9a9fb1+port:443
  tags: jarm,network,c2,ir,osint,cti,cobalt-strike,tcp,vuln
tcp:
  - inputs:
      - data: 2E
        type: hex
    host:
      - "{{Hostname}}"
    matchers:
      - type: dsl
        dsl:
          - "jarm(Hostname) == '07d14d16d21d21d07c42d41d00041d24a458a375eef0c576d23a7bab9a9fb1'"
