id: xphoneconnect-admin-panel

info:
  name: XPhone Connect Admin Interface 登录面板识别（指纹识别）
  author: FLX
  severity: info
  description: |-
    XPhone Connect Admin Interface 是通信与 UC 管理后台，用于用户、电话、客户端和通信服务配置。该模板请求首页、`/xphoneconnect/admin/Login.aspx`，并依据 HTTP 200 状态码、页面标题、正文关键字或品牌资源特征识别目标是否部署了该系统或暴露了对应入口，适用于资产指纹确认；命中结果仅表示系统特征匹配，不代表已确认存在未授权访问或可利用漏洞。
  reference:
  - https://www.c4b.com/en/xphone-connect/
  classification:
    cvss-metrics: CVSS:3.0/AV:N/AC:L/PR:N/UI:N/S:U/C:N/I:N/A:N
    cwe-id: CWE-200
    cpe: cpe:2.3:a:3cx:3cx:*:*:*:*:*:*:*:*
  metadata:
    verified: true
    max-request: 1
    vendor: c4b
    product: xphone
    fofa-query: icon_hash="516202656"
  tags: panel,xphone,login,detect,discovery

http:
  - method: GET
    path:
      - '{{BaseURL}}'
      - '{{BaseURL}}/xphoneconnect/admin/Login.aspx'

    host-redirects: true
    stop-at-first-match: true
    matchers-condition: and
    matchers:
      - type: word
        part: body
        words:
          - "XPhone Connect server - Logon"
          - "XPhone Web-Meeting"
        condition: or

      - type: status
        status:
          - 200
