id: trend-micro-phish

info:
  name: Trend Micro 仿冒钓鱼网站（钓鱼网站识别）
  author: rxerium
  severity: info
  description: |
    检测到疑似仿冒 Trend Micro 的钓鱼网站。模板在目标页面返回 200、页面内容命中 Trend Micro 的官方服务页面特征，且当前主机不属于 trendmicro.com 官方域名时触发，用于识别借用 Trend Micro 品牌页面诱导用户信任的仿冒站点。
  reference:
    - https://trendmicro.com
  metadata:
    max-request: 1
  tags: phishing,trend-micro,osint,discovery
http:
  - method: GET
    path:
      - "{{BaseURL}}"

    host-redirects: true
    max-redirects: 2

    matchers-condition: and
    matchers:
      - type: word
        words:
          - 'Trend Micro (UK) | Internet Security Antivirus - PC &amp; Mac'

      - type: status
        status:
          - 200

      - type: dsl
        dsl:
          - '!contains(host,"trendmicro.com")'
