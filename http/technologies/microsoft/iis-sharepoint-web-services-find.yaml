id: iis-sharepoint-web-services-find

info:
  name: Microsoft SharePoint Web Services 指纹识别（指纹识别）
  author: 0x_Akoko
  severity: info
  description: >-
    Microsoft SharePoint Web Services 是 SharePoint 的服务接口层，用于站点、列表和文档库等功能集成。该模板通过请求目标服务并检查预设路径或首页响应、页面正文关键字、状态码等指纹特征，判断目标是否使用或暴露了
    Microsoft SharePoint Web Services 相关组件；命中结果仅表示指纹特征匹配，可用于资产盘点、技术栈识别和后续安全评估，不代表已确认存在可利用漏洞。
  metadata:
    max-request: 1
  tags: sharepoint,iis,microsoft,tech,discovery
http:
  - method: GET
    path:
      - "{{BaseURL}}/_vti_bin/spdisco.aspx"

    matchers-condition: and
    matchers:
      - type: word
        part: body
        words:
          - "<discovery"
          - "<contractRef"
        condition: and
        case-insensitive: true

      - type: word
        part: content_type
        words:
          - text/xml

      - type: status
        status:
          - 200
