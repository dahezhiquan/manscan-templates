id: intel-amt-detect

info:
  name: Intel Active Management Technology 指纹识别（指纹识别）
  author: Shivam Kamboj
  severity: info
  description: >-
    Intel Active Management Technology 是 Intel vPro 平台的远程带外管理技术，用于硬件级资产管理和远程维护。该模板通过请求目标服务并检查预设路径或首页响应、HTTP
    响应头、正则特征、DSL 条件等指纹特征，判断目标是否使用或暴露了 Intel Active Management Technology 相关组件；命中结果仅表示指纹特征匹配，可用于资产盘点、技术栈识别和后续安全评估，不代表已确认存在可利用漏洞。
  metadata:
    verified: true
    max-request: 1
    vendor: intel
    product: active-management-technology
  tags: tech,intel,amt,detect,server,discovery
http:
  - method: GET
    path:
      - "{{BaseURL}}/"

    matchers:
      - type: dsl
        dsl:
          - 'status_code == 200'
          - 'contains_any(tolower(header), "intel", "active management technology")'
        condition: and

    extractors:
      - type: regex
        part: header
        group: 1
        regex:
          - '(?i)Intel\(R\)\s*Active\s*Management\s*Technology\s*([0-9.]+)'
