id: nacl-outbound-restrict
info:
  name: NACL 出站流量未限制（云安全）
  author: princechaddha
  severity: medium
  description: VPC Network ACL 出站 allow 规则未限制端口范围时，子网资源可向外建立更宽泛的连接，削弱出站访问控制。该模板枚举 network ACL，并检查 Egress=true、RuleAction=allow 的规则是否缺少 PortRange。
  impact: |
    - 被入侵实例可能更容易向外连接命令控制、下载载荷或外传数据。
    - 出站边界过宽会降低网络分段和数据泄露防护能力。
  remediation: |
    - 按业务需要限制 NACL 出站协议、端口和目标 CIDR。
    - 对敏感子网配合安全组、路由表、代理或 egress firewall 进行出站访问治理。
  reference:
    - https://docs.aws.amazon.com/vpc/latest/userguide/vpc-network-acls.html
  metadata:
    max-request: 2
    vendor: amazon
    product: vpc
  tags: cloud,devops,aws,amazon,vpc,aws-cloud-config
variables:
  region: "us-east-1"

flow: |
  code(1)
  for(let NACLIDs of iterate(template.nacls)){
    set("naclid", NACLIDs)
    code(2)
  }

self-contained: true
code:
  - engine:
      - sh
      - bash
    source: |
      aws ec2 describe-network-acls --region $region --query 'NetworkAcls[*].NetworkAclId' --output json

    extractors:
      - type: json
        name: nacls
        internal: true
        json:
          - '.[]'

  - engine:
      - sh
      - bash
    source: |
         aws ec2 describe-network-acls --region $region --network-acl-ids $naclid --query 'NetworkAcls[*].Entries[?(RuleAction==`allow`) && (Egress==`true`)] | []'

    matchers-condition: and
    matchers:
      - type: word
        words:
          - "allow"
        condition: and

      - type: word
        words:
          - "PortRange"
        negative: true

    extractors:
      - type: dsl
        dsl:
          - '"Access to the VPC subnets associated with your NACL " + naclid + " is not restricted."'
