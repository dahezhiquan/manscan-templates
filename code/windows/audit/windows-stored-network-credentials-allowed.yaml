id: windows-stored-network-credentials-allowed

info:
  name: 允许存储网络认证凭据（本地基线扫描）
  author: princechaddha
  severity: medium
  description: |
    保存的凭据可能被本地攻击者提取。对应基线项为“系统是否允许保存网络认证凭据”；模板读取注册表 `HKLM:\SYSTEM\CurrentControlSet\Control\Lsa`，结合命中值判断策略是否不符合基线。
  impact: |
    - 攻击者可复用已保存凭据访问远程共享、服务或域资源。
    - 凭据保护不足会增加横向移动、远程登录和离线破解风险。
  remediation: |
    - 禁用不必要的网络凭据保存，并清理已存储凭据。
    - 变更策略后清理历史凭据，并轮换可能受影响的账户密码。
  tags: windows,credentials,code,windows-audit

self-contained: true

code:
  - pre-condition: |
      IsWindows();
    engine:
      - powershell
      - powershell.exe
    args:
      - -ExecutionPolicy
      - Bypass
    pattern: "*.ps1"
    source: |
      (Get-ItemProperty -Path 'HKLM:\SYSTEM\CurrentControlSet\Control\Lsa').DisableDomainCreds

    matchers:
      - type: word
        words:
          - "0"
