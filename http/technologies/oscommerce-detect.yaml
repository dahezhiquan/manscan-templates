id: oscommerce-detect

info:
  name: osCommerce 指纹识别（指纹识别）
  author: Chirag Mistry
  severity: info
  description: >-
    osCommerce 是开源电商系统，用于构建在线商店、商品目录、订单和支付流程。该模板通过请求目标服务并检查预设路径或首页响应、页面正文关键字、状态码、正则特征等指纹特征，判断目标是否使用或暴露了
    osCommerce 相关组件；命中结果仅表示指纹特征匹配，可用于资产盘点、技术栈识别和后续安全评估，不代表已确认存在可利用漏洞。
  metadata:
    max-request: 8
    shodan-query: http.component:"osCommerce"
  tags: oscommerce,detect,tech
http:
  - method: GET
    path:
      - "{{BaseURL}}"
      - "{{BaseURL}}/robots.txt"
      - "{{BaseURL}}/sitemap.xml"
      - "{{BaseURL}}/favicon.ico"
      - "{{BaseURL}}/admin"
      - "{{BaseURL}}/includes/modules/"
      - "{{BaseURL}}/catalog/includes/javascript/oscommerce.js"
      - "{{BaseURL}}/checkout_payment.php"

    stop-at-first-match: true
    matchers-condition: and
    matchers:
      - type: word
        part: response
        words:
          - "Powered by osCommerce"
          - "oscommerce.com"
          - "X-Powered-By-osCommerce"
        condition: or
        case-insensitive: true

      - type: status
        status:
          - 200

    extractors:
      - type: regex
        part: body
        name: version
        regex:
          - 'osCommerce ([0-9.]+)'
          - 'Powered by osCommerce ([0-9.]+)'

      - type: regex
        part: body
        name: oscommerce_id
        regex:
          - 'oscommerce-site-id=([a-z0-9]+)'
          - 'oscommerce\.com/([^/]+)'
