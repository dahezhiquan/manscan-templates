id: scribd-phish

info:
  name: Scribd 仿冒钓鱼网站（钓鱼网站识别）
  author: rxerium
  severity: info
  description: |
    检测到疑似仿冒 Scribd 的钓鱼网站。模板在目标页面返回 200、页面内容命中 Scribd 的品牌页面特征，且当前主机不属于 scribd.com 官方域名时触发，用于识别借用 Scribd 品牌页面诱导用户信任的仿冒站点。
  reference:
    - https://scribd.com
  metadata:
    max-request: 1
  tags: phishing,scribd,osint,discovery
http:
  - method: GET
    path:
      - "{{BaseURL}}"

    host-redirects: true
    max-redirects: 2

    matchers-condition: and
    matchers:
      - type: word
        words:
          - 'Scribd'
          - 'Get to the source. Specialized knowledge on any topic, and answers you won’t find anywhere else. Home to the world’s documents, 300M+ and counting.'
        condition: and

      - type: status
        status:
          - 200

      - type: dsl
        dsl:
          - '!contains(host,"scribd.com")'
