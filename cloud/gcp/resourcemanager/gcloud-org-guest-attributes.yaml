id: gcloud-org-guest-attributes

info:
  name: Guest Attributes of Compute Engine Metadata Not未启用（云安全）
  author: princechaddha
  severity: medium
  description: Compute Engine guest attributes 可让虚拟机向 metadata server 写入客体属性，组织未禁用时可能增加元数据暴露和非预期信息写入风险。本模板检查 compute.disableGuestAttributesAccess 组织策略 booleanPolicy，返回空对象 {} 时报告未禁用 guest attributes。
  impact: |
    - 工作负载或被攻破实例可能写入不受控元数据，造成敏感运行信息泄露或误导运维自动化。
    - 组织缺少统一约束时，不同项目的 metadata 行为难以审计和标准化。
  remediation: |
    - 启用 compute.disableGuestAttributesAccess 组织策略，禁止未批准的 guest attributes 使用。
    - 对确需使用 guest attributes 的场景建立例外范围，并审计写入内容和访问权限。
  reference:
    - https://www.trendmicro.com/cloudoneconformity/knowledge-base/gcp/ResourceManager/disable-using-guest-attributes.html
    - https://cloud.google.com/compute/docs/metadata/guest-attributes
  metadata:
    vendor: google
    product: resource-manager
  tags: cloud,devops,gcp,gcloud,resourcemanager,security,compute,metadata,gcp-cloud-config

flow: |
  code(1)
  for(let orgId of iterate(template.orgIds)){
    set("orgId", orgId)
    code(2)
  }

self-contained: true

code:
  - engine:
      - sh
      - bash
    source: |
      gcloud organizations list --format="json(name)"

    extractors:
      - type: json
        name: orgIds
        internal: true
        json:
          - '.[].name'

  - engine:
      - sh
      - bash
    source: |
      gcloud alpha resource-manager org-policies describe compute.disableGuestAttributesAccess --organization=$orgId --effective --format="json(booleanPolicy)"

    matchers:
      - type: word
        words:
          - "{}"

    extractors:
      - type: dsl
        dsl:
          - '"Organization " + orgId + " has not disabled guest attributes for Compute Engine metadata"'
