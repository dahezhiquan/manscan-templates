id: azure-security-solutions-update-unalerted
info:
  name: Azure 安全解决方案创建或更新告警未配置（云安全）
  author: princechaddha
  severity: high
  description: Microsoft.Security 安全解决方案创建或更新可能改变 Defender、反恶意软件或安全集成的工作方式；未配置 Activity Log 告警时，保护配置变化可能不被及时发现。该模板枚举已启用的 Activity Log Alert，并检查 condition 是否缺少 Microsoft.Security/securitySolutions/write 操作条件。
  impact: |
    - 未授权更新可能降低安全检测覆盖、改变安全代理配置或造成保护能力异常。
    - 安全集成配置漂移会增加漏洞、恶意软件和入侵活动漏检风险。
  remediation: |
    - 创建针对安全解决方案创建和更新操作的 Activity Log Alert，并绑定安全运营通知。
    - 限制 Microsoft.Security 资源写入权限，定期核对 Defender 保护配置和安全连接状态。
  reference:
    - https://docs.microsoft.com/en-us/azure/azure-monitor/platform/alerts-activity-log
  metadata:
    vendor: microsoft
    product: azure-monitor
  tags: cloud,devops,azure,microsoft,security-solutions,azure-cloud-config

flow: |
  code(1);
  for (let AlertData of iterate(template.alertList)) {
    set("id", AlertData);
    code(2);
  }

self-contained: true
code:
  - engine:
      - sh
      - bash
    source: |
      az monitor activity-log alert list --output json --query '[?(enabled==`true`)].id'

    extractors:
      - type: json
        name: alertList
        internal: true
        json:
          - '.[]'

  - engine:
      - sh
      - bash
    source: |
      az monitor activity-log alert show --ids "$id" --query 'condition'

    matchers-condition: and
    matchers:
      - type: word
        words:
          - '"field": "operationName"'

      - type: word
        words:
          - "Microsoft.Security/securitySolutions/write"
        negative: true

    extractors:
      - type: dsl
        dsl:
          - 'id + " does not have the correct alert configuration for Create/Update Security Solution events"'
