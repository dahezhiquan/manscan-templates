id: cowrie-ssh-honeypot-detect

info:
  name: Cowrie SSH 蜜罐识别（服务漏洞）
  author: UnaPibaGeek
  severity: info
  description: |
    该模板通过异常协议响应或默认特征识别目标是否为 Cowrie SSH Honeypot 蜜罐。
  metadata:
    max-request: 1
    vendor: cowrie
    product: ssh
  tags: cowrie,twisted,ssh,honeypot,ir,cti,network,tcp,discovery
tcp:
  - inputs:
      - data: "SSH-1337-OpenSSH_9.0\r\n"

    host:
      - '{{Hostname}}'
    port: 22

    matchers-condition: and
    matchers:
      - type: regex
        part: body
        regex:
          - 'SSH\-([0-9.-A-Za-z_ ]+)'

      - type: word
        words:
          - Protocol major versions differ.
          - bad version 1337
        condition: or
