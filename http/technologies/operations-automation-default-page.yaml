id: operations-automation-default-page

info:
  name: Operations Automation 默认页面 指纹识别（指纹识别）
  author: dhiyaneshDK
  severity: info
  description: >-
    Operations Automation 默认页面通常表示运维自动化平台或相关 Web 服务已部署并保留默认入口。该模板通过请求目标服务并检查预设路径或首页响应、页面正文关键字、状态码等指纹特征，判断目标是否使用或暴露了
    Operations Automation 默认页面 相关组件；命中结果仅表示指纹特征匹配，可用于资产盘点、技术栈识别和后续安全评估，不代表已确认存在可利用漏洞。
  metadata:
    max-request: 1
    shodan-query: http.title:"Operations Automation Default Page"
  tags: tech,default,discovery
http:
  - method: GET
    path:
      - '{{BaseURL}}'

    matchers-condition: and
    matchers:
      - type: word
        words:
          - '<title>Operations Automation Default Page</title>'

      - type: status
        status:
          - 200
