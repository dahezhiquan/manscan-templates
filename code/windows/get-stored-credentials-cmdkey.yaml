id: get-stored-credentials-cmdkey

info:
  name: 通过 cmdkey 获取已保存凭据（本地基线扫描）
  author: pussycat0x
  severity: high
  description: |
    该模板使用 cmdkey /list 枚举 Windows 系统中保存的凭据，包括网络资源、网站或远程计算机相关凭据。
  metadata:
    verified: true
  tags: code,windows,privesc,ps,enum

self-contained: true

code:
  - engine:
      - powershell
      - powershell.exe

    args:
      - -ExecutionPolicy
      - Bypass
      - -File

    pattern: "*.ps1"

    source: |
      cmdkey /list

    extractors:
      - type: dsl
        dsl:
          - response
