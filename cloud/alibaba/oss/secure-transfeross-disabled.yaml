id: secure-transfeross-disabled

info:
  name: 阿里云 OSS Bucket 未强制安全传输（云安全）
  author: DhiyaneshDK
  severity: medium
  description: OSS Bucket Policy 未强制 acs:SecureTransport 时，客户端可能通过非 HTTPS 方式访问对象，传输链路存在被窃听或篡改的风险。模板枚举 Bucket 后读取 bucket-policy，当策略包含 Resource 和 Principal 但缺少 acs:SecureTransport 条件时判定未强制安全传输。
  impact: |
    - 对象数据、签名 URL 或访问凭据可能在非加密链路中暴露，增加中间人攻击风险。
    - 业务难以证明对象访问全程使用加密传输，影响敏感数据和合规场景要求。
  remediation: |
    - 在 Bucket Policy 中添加拒绝非 HTTPS 请求的规则，使用 acs:SecureTransport 条件强制安全传输。
    - 检查业务 SDK、工具和第三方集成，确保全部使用 HTTPS Endpoint 访问 OSS。
  reference:
    - https://www.trendmicro.com/cloudoneconformity/knowledge-base/alibaba-cloud/AlibabaCloud-OSS/enable-secure-transfer.html
    - https://www.alibabacloud.com/help/en/oss/user-guide/use-bucket-policy-to-grant-permission-to-access-oss/
  metadata:
    max-request: 2
    verified: true
    vendor: alibaba
    product: oss
  tags: cloud,devops,aliyun,alibaba,aliyun-cloud-config,alibaba-oss

variables:
  region: "cn-hangzhou"

flow: |
  code(1)
  for (let BucketName of iterate(template.bucketname)) {
    set("bucket", BucketName)
    code(2)
  }

self-contained: true

code:
  - engine:
      - sh
      - bash

    source: |
      aliyun oss ls --region $region

    extractors:
      - type: regex
        name: bucketname
        internal: true
        regex:
          - 'oss://([a-zA-Z0-9-]+)'

  - engine:
      - sh
      - bash

    source: |
      aliyun oss bucket-policy --method get $bucket --region $region

    matchers-condition: and
    matchers:
      - type: word
        words:
          - '"acs:SecureTransport":'
        negative: true

      - type: word
        words:
          - '"Resource":'
          - '"Principal":'
        condition: and

    extractors:
      - type: dsl
        dsl:
          - 'bucket + " Secure Transfer for OSS Buckets "'
