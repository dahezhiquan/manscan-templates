id: jenkins-openuser-register

info:
  name: Jenkins Open 用户 registration
  author: DhiyaneshDk
  severity: medium
  description: |
    检测到 Jenkins Open 用户 registration。目标功能在未认证状态下可访问，可能暴露管理入口、业务数据、系统状态或可执行操作，需确认是否存在访问控制缺失。
  remediation: |
    - 为相关管理界面和 API 启用强认证、授权校验和最小权限控制。
    - 将后台端点限制在可信网络或 VPN 内，并记录访问审计日志。
  reference:
    - https://www.acunetix.com/vulnerabilities/web/jenkins-open-user-registration/
  classification:
    cpe: cpe:2.3:a:jenkins:jenkins:*:*:*:*:*:*:*:*
  metadata:
    verified: true
    max-request: 1
    vendor: jenkins
    product: jenkins
    shodan-query: "X-Jenkins"
  tags: misconfig,jenkins,apache,tomcat,vuln

http:
  - method: GET
    path:
      - "{{BaseURL}}/signup"

    matchers-condition: and
    matchers:
      - type: word
        part: body
        words:
          - "Create an account! [Jenkins]"
          - "Register [Jenkins]"
          - "Register - Jenkins"

      - type: word
        part: header
        words:
          - "text/html"

      - type: status
        status:
          - 200
