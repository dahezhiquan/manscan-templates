id: confluence-dashboard

info:
  name: Confluence 仪表盘 暴露
  author: tess
  severity: low
  description: |
    检测到 Confluence 仪表盘 暴露。目标响应或文件中可能暴露配置、凭据、密钥、令牌、环境变量或历史记录等敏感信息，可能被用于进一步入侵。
  metadata:
    verified: true
    max-request: 1
    shodan-query: title:"Dashboard - Confluence"
  tags: misconfig,exposure,confluence,atlassian,discovery

http:
  - method: GET
    path:
      - '{{BaseURL}}'

    host-redirects: true
    max-redirects: 2

    matchers-condition: and
    matchers:
      - type: word
        part: body
        words:
          - 'Dashboard - Confluence'
          - 'title="Spaces">'
          - 'Atlassian Confluence'
        condition: and

      - type: word
        part: header
        words:
          - 'text/html'

      - type: status
        status:
          - 200
