id: apache-httpd-eol

info:
  name: Apache HTTP Server EOL 指纹识别（指纹识别）
  author: Shivam Kamboj
  severity: info
  description: >-
    Apache HTTP Server 是常用的开源 Web 服务器，EOL 版本表示该实例运行的分支已结束官方维护。该模板通过请求目标服务并检查预设路径或首页响应、HTTP
    响应头、正则特征、DSL 条件等指纹特征，判断目标是否使用或暴露了 Apache HTTP Server EOL 相关组件；命中结果仅表示指纹特征匹配，可用于资产盘点、技术栈识别和后续安全评估，不代表已确认存在可利用漏洞。
  reference:
  - https://httpd.apache.org/
  - https://endoflife.date/apache
  metadata:
    verified: true
    max-request: 1
    shodan-query: "Server: Apache/"
    product: http_server
    vendor: apache
  tags: tech,apache,eol
http:
  - method: GET
    path:
      - "{{BaseURL}}"

    matchers:
      - type: dsl
        dsl:
          - compare_versions(version, '<=2.2.34')
          - contains(server, 'Apache')
        condition: and

    extractors:
      - type: regex
        part: header
        name: version
        group: 1
        regex:
          - 'Server: Apache/([0-9.]+)'
