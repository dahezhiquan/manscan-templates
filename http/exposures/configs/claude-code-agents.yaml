id: claude-code-agents

info:
  name: Claude Code 子代理配置暴露（暴露面识别）
  author: shadowhunter-92
  severity: low
  description: |
    检测到目标站点可直接访问 Claude Code 子代理配置。Claude Code 配置用于定义项目级代理、工具和执行偏好，可能包含内部工作流信息。该模板请求 `/.claude/agents/`、`/.claude/agents/index.md`、`/.claude/agents/README.md` 等路径，并通过 HTTP 状态码、响应正文关键字、文件格式特征、正则匹配或响应头进行确认。此类资源公开后可能泄露部署细节、内部路径、依赖版本、环境变量、访问凭据或调试信息，增加被侦察和后续利用的风险。
  impact: |-
    - 公开配置可能泄露内部路径、组件版本、依赖清单、环境变量名称、服务地址或访问控制线索。
    - 攻击者可利用这些信息缩小目标范围，选择匹配漏洞、弱口令、凭据攻击或目录枚举策略。
    - 若文件中包含真实凭据、令牌或连接串，可能进一步导致数据、代码仓库、云资源或后台系统被未授权访问。
  remediation: |-
    - 确认该资源是否必须公网可访问；如非业务必需，应立即从 Web 根目录、静态资源目录、对象存储或反向代理公开路径中移除。
    - 在 Web 服务器、网关、CDN 或应用路由层增加拒绝规则、身份认证、IP allowlist 或内网访问限制。
    - 检查访问日志、下载记录和缓存记录，评估该资源是否已被外部访问或搜索引擎收录。
    - 若文件中包含凭据、令牌、连接串或私有地址，应执行密钥轮换、权限收敛和受影响系统访问审计。
  reference:
    - https://docs.claude.com/en/docs/claude-code/sub-agents
    - https://docs.claude.com/en/docs/claude-code/settings
  classification:
    cvss-metrics: CVSS:3.1/AV:N/AC:L/PR:N/UI:N/S:U/C:H/I:N/A:N
    cvss-score: 7.5
    cwe-id: CWE-200,CWE-538
  metadata:
    verified: true
    max-request: 4
    shodan-query: http.html:"claude"
  tags: config,exposure,claude,claude-code,anthropic,ai,subagent

http:
  - method: GET
    path:
      - "{{BaseURL}}/.claude/agents/"
      - "{{BaseURL}}/.claude/agents/index.md"
      - "{{BaseURL}}/.claude/agents/README.md"
      - "{{BaseURL}}/.claude/agents/code-reviewer.md"

    stop-at-first-match: false

    host-redirects: true
    max-redirects: 2

    matchers-condition: and
    matchers:
      - type: regex
        part: body
        condition: or
        regex:
          - '(?s)^---\s*\n.*?\bname:\s*[A-Za-z0-9_-]+.*?\bdescription:\s*.*?\n---'
          - '(?i)Index of /\.claude/agents'
          - '(?i)Directory listing for /\.claude/agents'
          - '>[a-zA-Z0-9_.-]+\.md<'

      - type: status
        status:
          - 200

    extractors:
      - type: regex
        name: agent_name
        part: body
        regex:
          - 'name:\s*["'']?([a-zA-Z0-9_-]+)'

      - type: regex
        name: allowed_tools
        part: body
        regex:
          - 'tools:\s*\[?([^\]\n]+)'

      - type: regex
        name: agent_files
        part: body
        regex:
          - '>([a-zA-Z0-9_.-]+\.md)<'
