id: nab-phish

info:
  name: NAB 仿冒钓鱼网站（钓鱼网站识别）
  author: rxerium
  severity: info
  description: |
    检测到疑似仿冒 NAB 的钓鱼网站。模板在目标页面返回 200、页面内容命中 NAB 的登录或账号页面特征，且当前主机不属于 nab.com.au 官方域名时触发，用于识别借用 NAB 品牌页面诱导用户信任的仿冒站点。
  reference:
    - https://nab.com.au
  metadata:
    max-request: 1
  tags: phishing,nab,bank,osint,discovery
http:
  - method: GET
    path:
      - "{{BaseURL}}"

    host-redirects: true
    max-redirects: 2

    matchers-condition: and
    matchers:
      - type: word
        words:
          - "NAB personal banking services include online banking, bank accounts, credit cards, home loans and personal loans. We’re here to help you with more than money."

      - type: status
        status:
          - 200

      - type: dsl
        dsl:
          - '!contains(host,"nab.com.au")'
