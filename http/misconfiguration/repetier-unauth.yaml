id: repetier-unauth

info:
  name: Repetier 服务器 仪表盘 未授权
  author: ritikchaddha
  severity: high
  description: |
    检测到 Repetier 服务器 仪表盘 未授权。目标功能在未认证状态下可访问，可能暴露管理入口、业务数据、系统状态或可执行操作，需确认是否存在访问控制缺失。
  classification:
    cpe: cpe:2.3:a:repetier-server:repetier-server:*:*:*:*:*:*:*:*
  metadata:
    verified: true
    max-request: 1
    vendor: repetier-server
    product: repetier-server
    shodan-query: title:"Repetier-Server"
    fofa-query: title="repetier-server"
  tags: repetier,dashboard,unauth,misconfig,intrusive,vuln

http:
  - method: GET
    path:
      - "{{BaseURL}}/#!/printer/Prusa_I3/print"

    matchers-condition: and
    matchers:
      - type: word
        part: body
        words:
          - 'Global Settings'
          - 'Edit Profile'
          - 'Logout'
          - 'Clear all Messages'
        condition: and

      - type: status
        status:
          - 200
