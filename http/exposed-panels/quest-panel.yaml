id: quest-panel

info:
  name: Quest Modem Configuration 登录面板识别（指纹识别）
  author: Splint3r7
  severity: info
  description: |-
    Quest Modem Configuration 是调制解调器或网关配置入口，用于宽带接入、无线和设备网络参数管理。该模板请求 `/cgi-bin/webcm?getpage=../html/login.html` 路径，并依据 DSL 条件识别目标是否部署了该系统或暴露了对应入口，适用于资产指纹确认；命中结果仅表示系统特征匹配，不代表已确认存在未授权访问或可利用漏洞。
  classification:
    cwe-id: CWE-200
  metadata:
    max-request: 1
    shodan-query: http.title:"Advanced Setup - Security - Admin User Name &amp; Password"
  tags: panel,quest,login,detect,discovery

http:
  - method: GET
    path:
      - "{{BaseURL}}/cgi-bin/webcm?getpage=../html/login.html"

    matchers:
      - type: dsl
        dsl:
          - 'contains(body, "<title>Advanced Setup - Security - Admin User Name &amp; Password</title>")'
          - 'status_code == 200'
        condition: and
