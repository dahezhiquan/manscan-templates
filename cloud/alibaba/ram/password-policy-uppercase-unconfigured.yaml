id: password-policy-uppercase-unconfigured

info:
  name: 阿里云 RAM 密码未要求包含大写字母（云安全）
  author: DhiyaneshDK
  severity: medium
  description: RAM 密码策略未要求大写字母会降低密码复杂度，不利于抵御控制台密码猜测和撞库攻击。模板调用 GetPasswordPolicy，当 RequireUppercaseCharacters 为 false 时判定密码策略未要求包含大写字母。
  impact: |
    - 密码组合空间变小，弱口令和常见变体更容易被破解。
    - 身份认证基线不完整会增加高权限账号被接管的风险。
  remediation: |
    - 在 RAM 密码策略中启用 RequireUppercaseCharacters。
    - 同时启用 MFA、密码长度、数字、特殊字符和复用限制，提升 RAM 用户登录安全性。
  reference:
    - https://www.alibabacloud.com/help/en/ram/user-guide/configure-a-password-policy-for-ram-users
    - https://www.trendmicro.com/cloudoneconformity/knowledge-base/alibaba-cloud/AlibabaCloud-RAM/uppercase-letter-password-policy.html
  metadata:
    max-request: 1
    verified: true
    vendor: alibaba
    product: ram
  tags: cloud,devops,aliyun,alibaba,alibaba-cloud-config,alibaba-ram

variables:
  region: "cn-hangzhou"

self-contained: true

code:
  - engine:
      - sh
      - bash
    source: |
      aliyun ram GetPasswordPolicy --region $region

    matchers:
      - type: word
        name: policy
        words:
          - '"RequireUppercaseCharacters": false'

    extractors:
      - type: dsl
        dsl:
          - '"RAM Password Policy Does not contain One Uppercase "'
