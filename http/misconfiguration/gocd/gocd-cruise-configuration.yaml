id: gocd-cruise-configuration

info:
  name: GoCD Cruise 配置泄露
  author: dhiyaneshDk
  severity: high
  description: |
    该模板用于核查 GoCD Cruise 配置泄露。该类问题通常源于容器、CI/CD、注册表、服务发现或运维 API 暴露在公网且缺少访问控制。模板会向目标发送探测请求，并依据请求 `/go/add-on/business-continuity/api/cruise_config`、状态码 200、匹配 `server agentAutoRegisterKey`、匹配 `webhookSecret`等证据确认目标是否存在该配置问题。
  impact: |
    - 攻击者可查看镜像、容器、任务、节点、配置、构建流水线或运行状态。
    - 若接口允许操作，可能导致容器创建、任务执行、镜像篡改、配置泄露或集群接管。
  remediation: |
    - 禁止将运维 API、容器接口和注册表直接暴露到公网。
    - 启用 TLS、认证授权、来源限制和最小权限访问策略。
    - 审计镜像、容器、任务和访问日志，清理未知资源并轮换相关令牌。
  reference:
    - https://attackerkb.com/assessments/9101a539-4c6e-4638-a2ec-12080b7e3b50
    - https://blog.sonarsource.com/gocd-pre-auth-pipeline-takeover
    - https://twitter.com/wvuuuuuuuuuuuuu/status/1456316586831323140
  classification:
    cpe: cpe:2.3:a:thoughtworks:gocd:*:*:*:*:*:*:*:*
  metadata:
    max-request: 1
    vendor: thoughtworks
    product: gocd
    shodan-query: http.title:"Create a pipeline - Go" html:"GoCD Version"
  tags: go,gocd,config,exposure,misconfig,vuln

http:
  - method: GET
    path:
      - "{{BaseURL}}/go/add-on/business-continuity/api/cruise_config"

    matchers-condition: and
    matchers:
      - type: status
        status:
          - 200

      - type: word
        words:
          - "server agentAutoRegisterKey"
          - "webhookSecret"
          - "tokenGenerationKey"
        condition: and
