id: moodle-installer

info:
  name: Moodle 安装 暴露
  author: tess
  severity: high
  description: |
    检测到 Moodle 安装 暴露。该页面属于安装、初始化或配置向导流程，若对外暴露，攻击者可能完成初始化、创建管理员账户或重新配置目标系统。
  classification:
    cpe: cpe:2.3:a:moodle:moodle:*:*:*:*:*:*:*:*
  metadata:
    verified: true
    max-request: 1
    vendor: moodle
    product: moodle
    shodan-query: title:"Installation Moodle"
  tags: misconfig,moodle,install,exposure,vuln

http:
  - method: GET
    path:
      - '{{BaseURL}}/install.php'

    matchers-condition: and
    matchers:
      - type: word
        part: body
        words:
          - "Installation - Moodle"

      - type: word
        part: header
        words:
          - "text/html"

      - type: status
        status:
          - 200
