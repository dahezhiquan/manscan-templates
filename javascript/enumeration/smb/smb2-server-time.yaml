id: smb2-server-time

info:
  name: SMB2 服务器时间枚举（服务漏洞）
  author: DhiyaneshDK
  severity: low
  description: |
    SMB2 协商信息可能包含服务器当前时间和启动时间，可用于判断时钟偏差、系统运行时长和资产状态。该模板发起 SMB2 信息查询，并从 NegotiationLog 中提取 SystemTime 与 ServerStartTime 作为枚举结果。
  impact: |
    - SMB2 服务器时间和启动时间会暴露主机时钟偏差与运行时长。
    - 这些信息可辅助 Kerberos 时间窗口判断、重启周期分析和资产状态识别。
  remediation: |
    - 限制 SMB 端口访问来源，减少未认证时间和运行状态信息泄露。
    - 确保服务器时间同步安全可控，并监控异常 SMB 探测。
  reference:
    - https://nmap.org/nsedoc/scripts/smb2-time.html
  metadata:
    verified: true
    max-request: 1
    shodan-query: "port:445"
  tags: js,network,smb,enum,discovery

javascript:
  - pre-condition: |
      isPortOpen(Host,Port);
    code: |
      var m = require("nuclei/smb");
      var c = m.SMBClient();
      var response = c.ConnectSMBInfoMode(Host,Port);
      var systemTime = new Date(response.NegotiationLog.SystemTime * 1000).toISOString();
      var serverstartTime = new Date(response.NegotiationLog.ServerStartTime * 1000).toISOString();
      var result = "SystemTime: " + systemTime + " ServerStartTime: " + serverstartTime;
      result

    args:
      Host: "{{Host}}"
      Port: "445"

    matchers:
      - type: dsl
        dsl:
          - success

    extractors:
      - type: dsl
        dsl:
          - response
