id: default-payara-server-page

info:
  name: Payara 服务器 默认页面 指纹识别（指纹识别）
  author: dhiyaneshDk
  severity: info
  description: Payara 服务器 默认页面 是 Jakarta EE 应用服务器，用于部署和运行企业 Java 应用。该模板请求首页，并依据页面标题、正文关键字或品牌资源特征识别目标是否使用或暴露了 Payara 服务器 默认页面 相关组件，适用于资产盘点、技术栈识别和后续安全评估；命中结果仅表示指纹特征匹配，不代表已确认存在可利用漏洞。
  classification:
    cpe: cpe:2.3:a:payara:payara:*:*:*:*:*:*:*:*
  metadata:
    max-request: 1
    vendor: payara
    product: payara
    shodan-query: http.title:"Payara Server - Server Running"
  tags: tech,payara,discovery

http:
  - method: GET
    path:
      - '{{BaseURL}}'

    matchers:
      - type: word
        words:
          - "<title>Payara Server - Server Running</title>"
        part: body
