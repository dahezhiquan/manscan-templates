id: azure-nsg-rule-delete-unalerted
info:
  name: Azure NSG 规则删除告警未配置（云安全）
  author: princechaddha
  severity: high
  description: NSG 安全规则删除可能改变子网或网卡的精细访问控制；未配置 Activity Log 告警时，关键放行或拒绝规则变化可能不被及时发现。该模板枚举已启用的 Activity Log Alert，并检查 condition 是否缺少 Microsoft.Network/networkSecurityGroups/securityRules/delete 操作条件。
  impact: |
    - 删除拒绝规则可能直接开放管理端口、数据库端口或横向移动路径。
    - 删除允许规则也可能导致业务中断，且无告警时难以区分误操作和攻击行为。
  remediation: |
    - 创建针对 NSG 安全规则删除操作的 Activity Log Alert，并绑定网络安全响应渠道。
    - 对 NSG 规则变更实施审批、基线比对和最小权限控制，保留变更审计记录。
  reference:
    - https://docs.microsoft.com/en-us/azure/azure-monitor/platform/alerts-activity-log
  metadata:
    vendor: microsoft
    product: azure-monitor
  tags: cloud,devops,azure,microsoft,network-security,azure-cloud-config

flow: |
  code(1);
  for (let AlertData of iterate(template.alertList)) {
    set("id", AlertData);
    code(2);
  }

self-contained: true
code:
  - engine:
      - sh
      - bash
    source: |
      az monitor activity-log alert list --output json --query '[?(enabled==`true`)].id'

    extractors:
      - type: json
        name: alertList
        internal: true
        json:
          - '.[]'

  - engine:
      - sh
      - bash
    source: |
      az monitor activity-log alert show --ids "$id" --query 'condition'

    matchers-condition: and
    matchers:
      - type: word
        words:
          - '"field": "operationName"'

      - type: word
        words:
          - "Microsoft.Network/networkSecurityGroups/securityRules/delete"
        negative: true

    extractors:
      - type: dsl
        dsl:
          - 'id + " does not have the correct alert configuration for Delete Network Security Group Rule events"'
