id: wallos-panel

info:
  name: Wallos 面板识别（指纹识别）
  author: ChrisJr404
  severity: info
  description: |-
    Wallos 是订阅管理应用，用于记录周期性费用、提醒和个人财务订阅。该模板请求首页，并依据 DSL 条件识别目标是否部署了该系统或暴露了对应入口，适用于资产指纹确认；命中结果仅表示系统特征匹配，不代表已确认存在未授权访问或可利用漏洞。
  reference:
  - https://github.com/ellite/Wallos
  - https://wallosapp.com/
  metadata:
    verified: true
    max-request: 1
    vendor: ellite
    product: wallos
    shodan-query: http.title:"Wallos - Subscription Tracker"
    fofa-query: title="Wallos - Subscription Tracker"
  tags: panel,wallos,subscription,selfhosted,detect,discovery

http:
  - method: GET
    path:
      - "{{BaseURL}}"

    host-redirects: true
    max-redirects: 2

    matchers:
      - type: dsl
        dsl:
          - 'contains_any(body, "<title>Wallos - Subscription", "content=\"Wallos", "title=\"Wallos")'
          - 'contains(body, "styles/login.css")'
          - 'status_code == 200'
        condition: and

    extractors:
      - type: regex
        part: body
        group: 1
        regex:
          - 'styles/theme\.css\?v([0-9.]+)'
