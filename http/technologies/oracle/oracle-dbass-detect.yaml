id: oracle-dbass-detect

info:
  name: Oracle DBaaS Monitor 指纹识别（指纹识别）
  author: pussycat0x
  severity: info
  description: >-
    Oracle DBaaS Monitor 是 Oracle 数据库云服务的监控入口，用于查看数据库实例状态和运维指标。该模板通过请求目标服务并检查预设路径或首页响应、页面正文关键字、状态码等指纹特征，判断目标是否使用或暴露了
    Oracle DBaaS Monitor 相关组件；命中结果仅表示指纹特征匹配，可用于资产盘点、技术栈识别和后续安全评估，不代表已确认存在可利用漏洞。
  metadata:
    max-request: 1
  tags: oracle,tech,discovery
http:
  - method: GET
    path:
      - '{{BaseURL}}/dbaas_monitor/login'

    matchers-condition: and
    matchers:
      - type: word
        words:
          - '<title>DBaaS Monitor</title>'

      - type: status
        status:
          - 200
