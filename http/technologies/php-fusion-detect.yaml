id: php-fusion-detect

info:
  name: PHP-Fusion 指纹识别（指纹识别）
  author: pikpikcu
  severity: info
  description: >-
    PHP-Fusion 是 PHP 内容管理系统，用于构建门户、社区、新闻和内容站点。该模板通过请求目标服务并检查预设路径或首页响应、页面正文关键字、状态码等指纹特征，判断目标是否使用或暴露了
    PHP-Fusion 相关组件；命中结果仅表示指纹特征匹配，可用于资产盘点、技术栈识别和后续安全评估，不代表已确认存在可利用漏洞。
  classification:
    cpe: cpe:2.3:a:php-fusion:php-fusion:*:*:*:*:*:*:*:*
  metadata:
    max-request: 1
    vendor: php-fusion
    product: php-fusion
    fofa-query: title="PHP-Fusion"
  tags: php,tech,php-fusion,discovery
http:
  - method: GET
    path:
      - "{{BaseURL}}"

    host-redirects: true
    max-redirects: 2

    matchers-condition: and
    matchers:
      - type: word
        part: body
        words:
          - "PHP-Fusion"

      - type: status
        status:
          - 200
