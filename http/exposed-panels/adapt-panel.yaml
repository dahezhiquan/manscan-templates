id: adapt-panel

info:
  name: Adapt Authoring Tool 面板（指纹识别）
  author: Splint3r7
  severity: info
  description: |-
    检测到目标站点存在 Adapt Authoring Tool 相关响应特征。Adapt Authoring Tool 是身份认证、密码管理或特权访问管理系统，用于集中管理账号、凭据、登录策略和高权限访问。模板请求 `/`，并通过页面标题或正文关键字、状态码、DSL 条件确认该系统指纹，用于资产识别、系统盘点和暴露面梳理。
  classification:
    cwe-id: CWE-200
  metadata:
    max-request: 1
    shodan-query: http.title:"Adapt authoring tool"
    verified: true
  tags: panel,adapt,login,detect,discovery
http:
  - method: GET
    path:
      - "{{BaseURL}}"

    host-redirects: true
    max-redirects: 2

    matchers:
      - type: dsl
        dsl:
          - 'contains(body, "<title>Adapt authoring tool</title>")'
          - 'status_code == 200'
        condition: and
