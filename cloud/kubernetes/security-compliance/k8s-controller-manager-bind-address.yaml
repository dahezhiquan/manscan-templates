id: k8s-controller-manager-bind-address

info:
  name: Ensure kube-controller-manager --bind-address is set to localhost（云安全）
  author: songyaeji
  severity: high
  description: kube-controller-manager 未绑定到 localhost 可能使其健康检查或指标接口暴露到非本机网络。本模板读取 kube-controller-manager 启动命令，发现未设置 --bind-address=127.0.0.1 或 --bind-address=::1 时报告。
  impact: |
    - 控制面组件接口可能被非预期来源访问，泄露指标、版本或运行状态信息。
    - 暴露的组件接口增加控制面攻击面和横向探测风险。
  remediation: |
    - 将 kube-controller-manager 的 --bind-address 设置为 127.0.0.1 或 ::1。
    - 如果需要远程监控，通过受控代理、认证和网络策略暴露指标。
  reference:
    - https://kubernetes.io/docs/reference/command-line-tools-reference/kube-controller-manager/
    - Cloud Vulnerability Assessment Guide(2024) by KISA
  metadata:
    vendor: kubernetes
    product: kubernetes
  tags: cloud,devops,kubernetes,devsecops,kube-controller-manager,bind-address,hardening,k8s-cluster-security
variables:
  component: "kube-controller-manager"

self-contained: true
code:
  - engine:
      - sh
      - bash
    source: |
      kubectl get pods -n kube-system -l component=kube-controller-manager -o jsonpath="{.items[*].spec.containers[*].command}"

    matchers-condition: and
    matchers:
      - type: word
        words:
          - 'kube-controller-manager'

      - type: word
        words:
          - "--bind-address=127.0.0.1"
          - "--bind-address=::1"
        negative: true

    extractors:
      - type: dsl
        dsl:
          - '"kube-controller-manager configuration is missing --bind-address or set to unsafe value (expected: 127.0.0.1 or ::1)"'
