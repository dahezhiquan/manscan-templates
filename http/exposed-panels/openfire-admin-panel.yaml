id: openfire-admin-panel

info:
  name: Openfire Admin Console 登录面板识别（暴露面识别）
  author: theamanrawat
  severity: info
  description: 该模板通过识别 Openfire Admin Console 登录入口的页面标题、特征文本或重定向行为，判断目标是否暴露了对应的认证界面。若命中，说明该登录面板对外可访问，可用于暴露面梳理与后续安全评估。
  classification:
    cvss-metrics: CVSS:3.0/AV:N/AC:L/PR:N/UI:N/S:U/C:N/I:N/A:N
    cwe-id: CWE-200
    cpe: cpe:2.3:a:igniterealtime:openfire:*:*:*:*:*:*:*:*
  metadata:
    verified: true
    max-request: 2
    vendor: igniterealtime
    product: openfire
    shodan-query:
      - http.title:"Openfire Admin Console"
      - http.title:"openfire"
      - http.title:"openfire admin console"
    fofa-query:
      - title="openfire"
      - title="openfire admin console"
    google-query:
      - intitle:"openfire admin console"
      - intitle:"openfire"
  tags: panel,openfire,admin,console,igniterealtime,discovery

http:
  - method: GET
    path:
      - '{{BaseURL}}'
      - '{{BaseURL}}/login.jsp'

    stop-at-first-match: true

    matchers-condition: and
    matchers:
      - type: word
        part: body
        words:
          - '<title>Openfire Admin Console'
          - 'Openfire, Version:'
        condition: or

      - type: status
        status:
          - 200
