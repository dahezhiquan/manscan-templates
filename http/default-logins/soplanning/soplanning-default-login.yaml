id: soplanning-default-login

info:
  name: SOPlanning 默认口令登录（弱口令）
  author: s4e-io
  severity: high
  description: |
    该模板用于检测 SOPlanning 是否仍可使用默认凭据或弱口令登录。模板主要向 `/process/login.php` 等认证入口发送请求，使用内置默认凭据组合进行认证尝试，并根据响应中的 `title="Logout"`、`title="Modify my profile"` 等登录成功特征判断登录是否成功；命中说明目标未及时修改出厂、示例或初始化账号口令。
  impact: |
    - 攻击者可登录 SOPlanning 后台，管理内容、用户、插件、主题、文件、表单或业务流程配置。
    - 后台权限被滥用后，可能导致页面篡改、恶意文件上传、敏感资料泄露，或进一步取得服务器执行能力。
  remediation: |
    - 立即修改默认管理员凭据，删除安装向导、演示账号和不必要的后台用户。
    - 限制后台登录入口访问来源，启用多因素认证、登录失败锁定和验证码等防护。
    - 检查近期内容、插件、主题、文件上传和管理员操作记录，确认没有持久化后门。
  reference:
    - https://www.soplanning.org/en/
  metadata:
    verified: true
    max-request: 1
    vendor: soplanning
    product: soplanning
    shodan-query:
      - html:"soplanning"
      - http.html:"soplanning"
    fofa-query: body="soplanning"
  tags: soplanning,default-login,vuln

http:
  - raw:
      - |
        POST /process/login.php HTTP/1.1
        Host: {{Hostname}}
        Content-Type: application/x-www-form-urlencoded

        login={{username}}&password={{password}}

    attack: pitchfork
    payloads:
      username:
        - admin
      password:
        - admin

    host-redirects: true
    max-redirects: 2
    matchers-condition: and
    matchers:
      - type: word
        words:
          - 'title="Logout"'
          - 'title="Modify my profile"'
          - "Settings"
        condition: and

      - type: status
        status:
          - 200
