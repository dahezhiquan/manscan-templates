id: clearml-panel

info:
  name: ClearML 面板识别（指纹识别）
  author: rxerium
  severity: info
  description: |
    该模板用于识别 ClearML 是否存在对外暴露的管理、服务或状态界面。若命中，说明目标公开了相关功能入口，可作为资产盘点与攻击面收敛的依据。
  reference:
    - https://github.com/allegroai/clearml
    - https://clear.ml/
  metadata:
    verified: true
    max-request: 1
    vendor: allegro
    product: clearml
    shodan-query: 'http.title:"ClearML"'
  tags: panel,clearml,mlops,ai,detect,discovery

http:
  - raw:
      - |
        GET / HTTP/1.1
        Host: {{Hostname}}

    redirects: true
    max-redirects: 2

    matchers:
      - type: dsl
        dsl:
          - status_code == 200
          - contains_all(body, "ClearML", "automate and orchestrate your ML stack")
        condition: and
