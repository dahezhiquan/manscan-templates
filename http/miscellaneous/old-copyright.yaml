id: old-copyright

info:
  name: 旧版权年份页面检测
  author: geeknik
  severity: low
  description: |
    检测页面中是否存在过期版权年份。该结果可作为站点长期未维护、内容陈旧或资产归属线索，但需要结合业务上下文判断是否构成风险。
  impact: |
    - 命中内容可用于资产画像、人员/社群关联、公开目录发现或业务线索收集。
    - 单独结果通常不等同于漏洞，但与其他信息组合后可能降低攻击者侦察成本。
  remediation: |
    - 确认公开信息是否符合预期，移除不必要的联系人、目录、社群或资源索引。
    - 对必须公开的文件和链接进行最小化披露，避免包含内部路径或敏感标识。
    - 定期巡检公开页面，确保内容仍然准确且未泄露额外信息。
  metadata:
    verified: true
    max-request: 1
  tags: miscellaneous,misc,generic,vuln

http:
  - method: GET
    path:
      - "{{BaseURL}}"

    host-redirects: true
    max-redirects: 3

    matchers-condition: and
    matchers:
      - type: word
        part: body
        words:
          - '2026'
        negative: true

      - type: regex
        part: body
        regex:
          - 'Copyright [1-9]\d* ?\-? ?[1-9]?\d*'
          - '© [1-9]\d* ?\-? ?[1-9]?\d*'
          - '&copy; [1-9]\d* ?\-? ?[1-9]?\d*'
          - '&#169; [1-9]\d* ?\-? ?[1-9]?\d*'

    extractors:
      - type: regex
        part: body
        regex:
          - 'Copyright [1-9]\d* ?\-? ?[1-9]?\d*'
          - '© [1-9]\d* ?\-? ?[1-9]?\d*'
          - '&copy; [1-9]\d* ?\-? ?[1-9]?\d*'
          - '&#169; [1-9]\d* ?\-? ?[1-9]?\d*'
