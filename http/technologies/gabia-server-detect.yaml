id: gabia-server-detect

info:
  name: Gabia 指纹识别（指纹识别）
  author: jadu101
  severity: info
  description: >-
    Gabia 是域名、托管和企业互联网服务提供商，其服务器页面或响应特征可用于识别相关托管环境。该模板通过请求目标服务并检查预设路径或首页响应、HTTP 响应头、正则特征、状态码等指纹特征，判断目标是否使用或暴露了
    Gabia 相关组件；命中结果仅表示指纹特征匹配，可用于资产盘点、技术栈识别和后续安全评估，不代表已确认存在可利用漏洞。
  metadata:
    verified: true
    max-request: 1
    shodan-query: "Server: gabia"
  tags: tech,gabia,detect,discovery
http:
  - method: GET
    path:
      - "{{BaseURL}}"

    matchers-condition: and
    matchers:
      - type: regex
        part: header
        regex:
          - "Server: gabia"

      - type: status
        status:
          - 200

    extractors:
      - type: kval
        part: header
        kval:
          - Server
