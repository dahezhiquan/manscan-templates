id: ec2-unrestricted-ssh
info:
  name: EC2 安全组对公网开放 SSH 端口（云安全）
  author: princechaddha
  severity: high
  description: EC2 安全组对公网开放 SSH 端口是一类远程管理入口暴露风险，TCP 22 面向任意来源会显著增加凭据爆破、密钥泄露后滥用和 SSH 服务漏洞利用风险。SSH 应通过堡垒机、VPN、SSM Session Manager 或可信运维网段访问。模板通过 `describe-security-groups` 筛选 22 端口且来源为 `0.0.0.0/0` 的入站规则，并输出命中的安全组 ID。
  impact: |
    - Linux 实例可能遭受互联网级爆破和漏洞利用，导致主机被接管。
    - 攻击者获得 SSH 访问后，可窃取云凭据、植入后门并进一步横向移动。
  remediation: |
    - 移除面向公网的 22 端口入站规则，仅允许堡垒机、VPN 或可信运维网段访问。
    - 优先使用 SSM Session Manager，禁用密码登录并定期轮换 SSH 密钥。
  reference:
    - https://docs.aws.amazon.com/AWSEC2/latest/UserGuide/security-group-rules-reference.html
  metadata:
    vendor: amazon
    product: ec2
  tags: cloud,devops,aws,amazon,ec2,aws-cloud-config

variables:
  region: "us-east-1"

self-contained: true
code:
  - engine:
      - sh
      - bash
    source: |
      aws ec2 describe-security-groups --region $region --filters Name=ip-permission.from-port,Values=22 Name=ip-permission.to-port,Values=22 Name=ip-permission.cidr,Values='0.0.0.0/0' --output json --query 'SecurityGroups[*].GroupId'

    extractors:
      - type: json
        name: securitygroup
        internal: true
        json:
          - '.[]'

      - type: dsl
        dsl:
          - 'securitygroup + " security group(s) alows unrestricted access (0.0.0.0/0 or ::/0) on TCP port 22"'
