id: confluence-eol

info:
  name: Atlassian Confluence EOL 指纹识别（指纹识别）
  author: Shivam Kamboj
  severity: info
  description: >-
    Atlassian Confluence 是团队知识库和协作文档平台，EOL 版本表示目标实例运行的 Confluence 分支已结束官方支持。该模板通过请求目标服务并检查预设路径或首页响应、页面正文关键字、正则特征、DSL
    条件等指纹特征，判断目标是否使用或暴露了 Atlassian Confluence EOL 相关组件；命中结果仅表示指纹特征匹配，可用于资产盘点、技术栈识别和后续安全评估，不代表已确认存在可利用漏洞。
  reference:
  - https://endoflife.date/confluence
  - https://confluence.atlassian.com/support/atlassian-support-end-of-life-policy-201851003.html
  metadata:
    verified: true
    max-request: 2
    shodan-query: http.component:"Atlassian Confluence"
  tags: tech,confluence,eol
http:
  - method: GET
    path:
      - "{{BaseURL}}/login.action"
      - "{{BaseURL}}"

    stop-at-first-match: true

    matchers-condition: and
    matchers:
      - type: regex
        part: body
        regex:
          - '(?i)Atlassian Confluence'
          - 'id=["\'']footer-build-information["\'']'
        condition: or

      - type: dsl
        dsl:
          - 'compare_versions(version, "<= 8.8.99")'

    extractors:
      - type: regex
        name: version
        part: body
        group: 1
        regex:
          - 'Atlassian Confluence</a>.*?<span[^>]*id=["\'']footer-build-information["\''][^>]*>([0-9.]+)'
          - '<meta[^>]*name=["\'']ajs-version-number["\''][^>]*content=["\'']([0-9.]+)["\'']'
