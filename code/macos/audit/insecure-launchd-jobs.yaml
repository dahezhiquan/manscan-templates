id: insecure-launchd-jobs

info:
  name: macOS launchd 任务全局可写（本地基线扫描）
  author: geeknik
  severity: medium
  description: |
    launchd 任务会在系统启动或用户会话中自动加载，任务文件全局可写会给普通用户提供持久化和自动执行入口。模板检查系统与用户 LaunchDaemons/LaunchAgents 目录中具有 other-write 权限的任务文件，匹配到结果时表示 launchd 任务权限不安全。
  impact: |
    - 本地攻击者可篡改 plist 任务，在启动、登录或定时条件下执行恶意命令。
    - 自动加载机制被污染后，可能形成持久化、权限提升或防御绕过。
  remediation: |
    - 移除 launchd 任务文件的全局可写权限，确保系统任务由 root 或授权管理员维护。
    - 审计可疑 plist 的 Program/ProgramArguments、RunAtLoad 和 WatchPaths 等字段。
  tags: macos,audit,local,security,launchd

self-contained: true

code:
  - engine:
      - sh
      - bash
    source: |
      find /System/Library/LaunchDaemons/ /System/Library/LaunchAgents/ /Library/LaunchDaemons/ /Library/LaunchAgents/ ~/Library/LaunchAgents/ -perm -o+w -type f -ls 2>/dev/null
    matchers:
      - type: regex
        regex:
          - "\\d+\\s+-[rwx-]*w[rwx-]*w[rwx-]*\\s+"
