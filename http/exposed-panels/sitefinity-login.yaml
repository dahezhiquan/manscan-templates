id: sitefinity-login

info:
  name: Sitefinity Login 面板识别（暴露面识别）
  author: dhiyaneshDK
  severity: info
  description: 该模板通过识别 Sitefinity Login 登录入口的页面标题、特征文本或重定向行为，判断目标是否暴露了对应的认证界面。若命中，说明该登录面板对外可访问，可用于暴露面梳理与后续安全评估。
  reference:
    - https://www.exploit-db.com/ghdb/6722
  classification:
    cpe: cpe:2.3:a:progress:sitefinity_cms:*:*:*:*:*:*:*:*
  metadata:
    max-request: 1
    vendor: progress
    product: sitefinity_cms
  tags: sitefinity,edb,panel,progress,discovery

http:
  - method: GET
    path:
      - '{{BaseURL}}/Sitefinity/Authenticate/SWT'

    matchers-condition: and
    matchers:
      - type: word
        words:
          - 'Telerik.Sitefinity.Web.UI.UserPreferences'

      - type: status
        status:
          - 200
