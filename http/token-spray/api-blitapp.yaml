id: api-blitapp

info:
  name: Blitapp API Token 可用性校验（token喷洒）
  author: daffainfo
  severity: info
  description: 该模板通过调用 Blitapp API 的已知接口验证提供的 token 是否有效，命中后通常表示可访问网页截图能力。
  reference:
    - https://blitapp.com/api/
    - https://github.com/daffainfo/all-about-apikey/tree/main/blitapp
  metadata:
    max-request: 1
  tags: token-spray,blitapp

self-contained: true

http:
  - raw:
      - |
        GET https://blitapp.com/api/scheduledcapture HTTP/1.1
        Host: blitapp.com
        Accept: application/json
        Api-key: {{token}}

    matchers:
      - type: word
        part: body
        words:
          - '"id"'
          - '"name"'
          - '"apps"'
        condition: and
