id: azure-storage-static-website-review
info:
  name: Azure Storage Static Website Configuration Review（云安全）
  author: princechaddha
  severity: medium
  description: Azure Storage staticWebsite.enabled 为 true 时，账户启用了静态网站功能，网站内容通常通过静态网站终结点公开提供；该配置本身是业务能力而非确定性漏洞。本模板枚举存储账户并查询 staticWebsite.enabled，在返回 true 时报告启用状态，需结合 $web 容器内容、访问边界和业务用途进一步审查。
  impact: |
    - 若将敏感文件、源代码、备份或内部配置放入静态网站容器，可能被匿名访问并造成数据泄露。
    - 公开网站账户与其他业务数据共用时，错误上传、内容篡改或配置疏漏会扩大暴露面；仅启用功能并不等于已发生泄露。
  remediation: |
    - 确认静态网站确有业务需要，并审查 $web 容器中的文件、发布流程和访问日志，禁止放置敏感数据。
    - 对需要身份认证或私有访问的内容改用具备访问控制的服务；将公开站点与内部存储账户隔离，并持续审计内容和权限变更。
  reference:
    - https://docs.microsoft.com/en-us/azure/storage/blobs/storage-blob-static-website
  metadata:
    vendor: microsoft
    product: azure-storage
  tags: cloud,devops,azure,microsoft,storage-account,azure-cloud-config

flow: |
  code(1);
  for (let accountData of iterate(template.accountList)) {
    accountData = JSON.parse(accountData);
    set("name", accountData.Name);
    code(2);
  }

self-contained: true
code:
  - engine:
      - sh
      - bash
    source: |
      az storage account list --query '[*].{"Name":name}'

    extractors:
      - type: json
        name: accountList
        internal: true
        json:
          - '.[]'

  - engine:
      - sh
      - bash
    source: |
      az storage blob service-properties show --account-name "$name" --query 'staticWebsite.enabled'

    matchers-condition: and
    matchers:
      - type: word
        words:
          - 'true'

    extractors:
      - type: dsl
        dsl:
          - 'name + " is configured to host static websites"'
