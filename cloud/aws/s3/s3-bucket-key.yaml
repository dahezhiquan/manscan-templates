id: s3-bucket-key
info:
  name: S3 Bucket Key 未启用（云安全）
  author: princechaddha
  severity: medium
  description: S3 Bucket Key 可在使用 SSE-KMS 时降低对 AWS KMS 的请求量并简化加密成本治理；未启用时，KMS 调用和权限依赖会更频繁。该模板检查 bucket 加密规则中 SSEAlgorithm 为 aws:kms 时 BucketKeyEnabled 是否为 false。
  impact: |
    - 高频对象读写会产生更多 KMS 请求，增加成本并放大 KMS 权限或配额异常对业务的影响。
    - 加密链路治理缺少 bucket key 优化，可能不符合组织对大规模 S3 加密的成本和运维基线。
  remediation: |
    - 对使用 SSE-KMS 的 S3 bucket 启用 Bucket Key。
    - 同步复核 KMS key policy、bucket 默认加密和访问审计，确保加密配置持续有效。
  reference:
    - https://docs.aws.amazon.com/AmazonS3/latest/userguide/manage-versioning-examples.html
  metadata:
    max-request: 2
    vendor: amazon
    product: s3
  tags: cloud,devops,aws,amazon,s3,aws-cloud-config

flow: |
  code(1)
  for(let bucketName of iterate(template.buckets)){
    set("bucket", bucketName)
    code(2)
  }

self-contained: true
code:
  - engine:
      - sh
      - bash
    source: |
      aws s3api list-buckets --query 'Buckets[*].Name'

    extractors:
      - type: json # type of the extractor
        internal: true
        name: buckets
        json:
          - '.[]'

  - engine:
      - sh
      - bash
    source: |
        aws s3api get-bucket-encryption --bucket cc-prod-log-bucket --query 'ServerSideEncryptionConfiguration.Rules[?ApplyServerSideEncryptionByDefault.SSEAlgorithm==`aws:kms`].BucketKeyEnabled'

    matchers:
      - type: word
        words:
          - false

    extractors:
      - type: dsl
        dsl:
          - '"Key is not enabled for S3 Bucket " + bucket'
