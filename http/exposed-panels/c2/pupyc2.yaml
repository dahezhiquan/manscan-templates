id: pupyc2

info:
  name: PupyC2 识别（暴露面识别）
  author: pussycat0x
  severity: info
  description: |
    该模板通过识别 PupyC2 相关页面或响应特征，判断目标是否暴露了疑似 C2、窃密或钓鱼基础设施面板。若命中，可作为外部暴露面排查、威胁狩猎与恶意基础设施识别的线索。
  reference:
    - https://twitter.com/TLP_R3D/status/1654038602282565632
    - https://github.com/n1nj4sec/pupy
  metadata:
    verified: true
    max-request: 1
    shodan-query: aa3939fc357723135870d5036b12a67097b03309
  tags: c2,ir,osint,pupyc2,panel,vuln

http:
  - method: GET
    path:
      - '{{BaseURL}}'

    matchers-condition: and
    matchers:
      - type: word
        part: header
        words:
          - 'Etag: "aa3939fc357723135870d5036b12a67097b03309"'

      - type: status
        status:
          - 200
