id: matrix-homeserver-detect

info:
  name: Matrix Homeserver 指纹识别（指纹识别）
  author: davidegirardi
  severity: info
  description: >-
    Matrix Homeserver 是 Matrix 协议的服务器端实现，Synapse 是常见实现之一，用于承载账户、房间和联邦通信。该模板通过请求目标服务并检查预设路径或首页响应、页面正文关键字等指纹特征，判断目标是否使用或暴露了
    Matrix Homeserver 相关组件；命中结果仅表示指纹特征匹配，可用于资产盘点、技术栈识别和后续安全评估，不代表已确认存在可利用漏洞。
  classification:
    cpe: cpe:2.3:a:matrix:synapse:*:*:*:*:*:*:*:*
  metadata:
    verified: true
    max-request: 1
    vendor: matrix
    product: synapse
    shodan-query: title:"Synapse is running"
  tags: tech,matrix,synapse,discovery
http:
  - method: GET
    path:
      - "{{BaseURL}}/_matrix/federation/v1/version"

    redirects: true
    max-redirects: 2

    matchers-condition: and
    matchers:
      - type: word
        part: body
        words:
          - '"server":'
          - '"name":'
          - '"version":'
        condition: and

      - type: word
        part: content_type
        words:
          - 'application/json'

    extractors:
      - type: json
        part: body
        json:
          - '.server | select((.name != null) and (.version != null)) | .name, .version'
