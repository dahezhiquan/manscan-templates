id: gcloud-dnssec-rsasha1-deprecated

info:
  name: DNSSEC RSASHA1 Algorithm Deprecated（云安全）
  author: princechaddha
  severity: medium
  description: Cloud DNS 托管区域的 DNSSEC 配置若仍使用 RSASHA1 zone signing，说明签名算法已落后于当前安全基线。本模板检查 dnssecConfig，同时匹配 rsasha1 和 zoneSigning 时报告区域签名使用已弃用算法。
  impact: |
    - 弱签名算法会降低 DNSSEC 对解析记录完整性的保护强度，并可能引发合规整改要求。
    - 未来客户端或解析器策略收紧时，过时算法可能影响域名解析可信度。
  remediation: |
    - 将 Cloud DNS 托管区域的 DNSSEC zone signing 算法迁移到更安全的受支持算法。
    - 按 DNSSEC 变更流程更新父区 DS 记录，并验证签名链完整性。
  reference:
    - https://cloud.google.com/dns/docs/dnssec-configuring
  metadata:
    vendor: google
    product: cloud-dns
  tags: cloud,devops,gcp,gcloud,dns,dnssec,gcp-cloud-config,discovery

flow: |
  code(1)
  for(let projectId of iterate(template.projectIds)){
    set("projectId", projectId)
    code(2)
    for(let managedZone of iterate(template.managedZones)){
      set("managedZoneName", managedZone)
      code(3)
    }
  }

self-contained: true

code:
  - engine:
      - sh
      - bash
    source: |
      gcloud projects list --format="json(projectId)"

    extractors:
      - type: json
        name: projectIds
        internal: true
        json:
          - '.[].projectId'

  - engine:
      - sh
      - bash
    source: |
      gcloud dns managed-zones list --project $projectId --format="json(name,visibility)"

    extractors:
      - type: json
        name: managedZones
        internal: true
        json:
          - '.[].name'

  - engine:
      - sh
      - bash
    source: |
      gcloud dns managed-zones describe $managedZoneName --project $projectId --format="json(dnssecConfig)"

    matchers:
      - type: word
        words:
          - 'rsasha1'
          - 'zoneSigning'
        condition: and

    extractors:
      - type: dsl
        dsl:
          - '"Deprecated RSASHA1 Algorithm used in DNSSEC for Managed Zone: " + managedZoneName + " in Project: " + projectId'
