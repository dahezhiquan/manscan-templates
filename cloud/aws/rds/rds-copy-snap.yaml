id: rds-copy-snap

info:
  name: RDS 快照标签复制未启用（云安全）
  author: DhiyaneshDK
  severity: low
  description: RDS 实例未启用 CopyTagsToSnapshot 时，自动或手动快照可能不会继承源实例标签，削弱快照治理和生命周期管理。该模板枚举 MySQL/PostgreSQL 实例，并检查 CopyTagsToSnapshot 是否为 false。
  impact: |
    - 无标签快照可能绕过成本、保留周期、敏感数据分类或安全审计规则。
    - 资产归属不清会增加误删、长期遗留和不符合合规要求的风险。
  remediation: |
    - 为 RDS 实例启用 CopyTagsToSnapshot，并统一维护关键治理标签。
    - 对历史快照进行标签补齐，确保备份、成本和安全策略可按标签生效。
  reference:
    - https://www.trendmicro.com/cloudoneconformity-staging/knowledge-base/aws/RDS/copy-tags-to-snapshot.html
    - https://docs.aws.amazon.com/AmazonRDS/latest/UserGuide/USER_Tagging.html
  metadata:
    vendor: amazon
    product: rds
  tags: cloud,devops,aws,amazon,rds,aws-cloud-config
variables:
  region: "us-west-2"

flow: |
  code(1)
  for(let DBClusterIdentifier of iterate(template.dbclusters)){
    set("dbcluster", DBClusterIdentifier)
    code(2)
  }

self-contained: true

code:
  - engine:
      - sh
      - bash
    source: |
      aws rds describe-db-instances --region $region --output json --query 'DBInstances[?Engine==`mysql` || Engine==`postgres`].DBInstanceIdentifier | []'

    extractors:
      - type: json
        name: dbclusters
        internal: true
        json:
          - '.[]'

  - engine:
      - sh
      - bash

    source: |
        aws rds describe-db-instances --region $region --db-instance-identifier $dbcluster --query 'DBInstances[*].CopyTagsToSnapshot'

    matchers:
      - type: word
        words:
          - 'false'

    extractors:
      - type: dsl
        dsl:
          - '"Copy Tags To Snapshot is not enable for instance " + dbcluster'
