id: makefile-exposure

info:
  name: Makefile 暴露（暴露面识别）
  author: 0x_Akoko
  severity: low
  description: |
    检测到对外可访问的 Makefile。这类配置资源可能包含部署细节、访问凭据、内部地址、组件版本或调试开关，公开暴露后会显著增加被侦察和后续利用的风险。
  reference:
    - https://www.gnu.org/software/make/manual/make.html
  metadata:
    verified: true
    max-request: 2
  tags: exposure,config,makefile

http:
  - method: GET
    path:
      - "{{BaseURL}}/Makefile"
      - "{{BaseURL}}/makefile"

    stop-at-first-match: true

    matchers:
      - type: dsl
        dsl:
          - 'status_code == 200'
          - 'contains_any(body, "PHONY:", "all:", "clean:", ".SUFFIXES:", "$(MAKE)")'
          - '!contains_any(body,"<!DOCTYPE","<html","<script>")'
          - 'len(body) > 100 && len(body) < 100000'
        condition: and
