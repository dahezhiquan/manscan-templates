id: github-workflows-disclosure

info:
  name: GitHub Workflow暴露（暴露面识别）
  author: dhiyaneshDk,geeknik
  severity: medium
  description: |
    检测到目标站点可直接访问 GitHub Workflow。Git 配置和凭据文件可能暴露源码仓库地址、子模块、账号凭据或访问令牌。该模板请求 `{{paths}}`，并通过 HTTP 状态码、响应正文关键字、文件格式特征、正则匹配或响应头进行确认。此类资源公开后可能泄露部署细节、内部路径、依赖版本、环境变量、访问凭据或调试信息，增加被侦察和后续利用的风险。
  impact: |-
    - 构建与部署配置可能暴露流水线步骤、发布目标、私有包源、环境变量名称和内部服务地址。
    - 攻击者可据此推断供应链入口、构建依赖和部署路径，提升投毒、凭据钓取或定向攻击成功率。
    - 若配置中包含令牌或密钥，可能进一步导致代码仓库、制品库或生产环境被未授权访问。
  remediation: |-
    - 确认该资源是否必须公网可访问；如非业务必需，应立即从 Web 根目录、静态资源目录、对象存储或反向代理公开路径中移除。
    - 在 Web 服务器、网关、CDN 或应用路由层增加拒绝规则、身份认证、IP allowlist 或内网访问限制。
    - 检查访问日志、下载记录和缓存记录，评估该资源是否已被外部访问或搜索引擎收录。
    - 若文件中包含凭据、令牌、连接串或私有地址，应执行密钥轮换、权限收敛和受影响系统访问审计。
  reference:
    - https://github.com/detectify/ugly-duckling/blob/master/modules/crowdsourced/github-workflows-disclosure.json
  metadata:
    max-request: 27
  tags: exposure,config,vuln

http:
  - method: GET
    path:
      - "{{BaseURL}}{{paths}}"
    payloads:
      paths:
        - "/.github/workflows/ci.yml"
        - "/.github/workflows/ci.yaml"
        - "/.github/workflows/CI.yml"
        - "/.github/workflows/main.yml"
        - "/.github/workflows/main.yaml"
        - "/.github/workflows/build.yml"
        - "/.github/workflows/build.yaml"
        - "/.github/workflows/test.yml"
        - "/.github/workflows/test.yaml"
        - "/.github/workflows/tests.yml"
        - "/.github/workflows/tests.yaml"
        - "/.github/workflows/release.yml"
        - "/.github/workflows/publish.yml"
        - "/.github/workflows/deploy.yml"
        - "/.github/workflows/push.yml"
        - "/.github/workflows/lint.yml"
        - "/.github/workflows/coverage.yml"
        - "/.github/workflows/release.yaml"
        - "/.github/workflows/pr.yml"
        - "/.github/workflows/automerge.yml"
        - "/.github/workflows/docker.yml"
        - "/.github/workflows/ci-generated.yml"
        - "/.github/workflows/ci-push.yml"
        - "/.github/workflows/ci-daily.yml"
        - "/.github/workflows/ci-issues.yml"
        - "/.github/workflows/smoosh-status.yml"
        - "/.github/workflows/snyk.yml"

    matchers-condition: and
    matchers:
      - type: regex
        regex:
          - "(?m)^\\s*\"?on\"?:"
          - "(?m)^\\s*\"?jobs\"?:"
          - "(?m)^\\s*\"?steps\"?:"
          - "(?m)^\\s*- \"?uses\"?:"
        part: body
        condition: and

      - type: status
        status:
          - 200
