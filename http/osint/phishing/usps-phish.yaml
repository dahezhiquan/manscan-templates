id: usps-phish

info:
  name: USPS 仿冒钓鱼网站（钓鱼网站识别）
  author: rxerium
  severity: info
  description: |
    检测到疑似仿冒 USPS 的钓鱼网站。模板在目标页面返回 200、页面内容命中 USPS 的品牌页面特征，且当前主机不属于 usps.com 官方域名时触发，用于识别借用 USPS 品牌页面诱导用户信任的仿冒站点。
  reference:
    - https://usps.com
  metadata:
    max-request: 1
  tags: phishing,usps,government,osint,discovery
http:
  - method: GET
    path:
      - "{{BaseURL}}"

    host-redirects: true
    max-redirects: 2

    matchers-condition: and
    matchers:
      - type: word
        words:
          - "Welcome to USPS.com. Track packages, pay and print postage with Click-N-Ship, schedule free package pickups, look up ZIP Codes, calculate postage prices, and find everything you need for sending mail and shipping packages."

      - type: status
        status:
          - 200

      - type: dsl
        dsl:
          - '!contains(host,"usps.com")'
