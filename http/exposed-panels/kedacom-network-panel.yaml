id: kedacom-network-panel

info:
  name: Kedacom Network Keyboard Console 面板识别（暴露面识别）
  author: DhiyaneshDk
  severity: info
  description: |
    该模板通过识别 Kedacom Network Keyboard Console 面板、控制台或管理界面的页面特征，判断目标是否暴露了对应服务入口。若命中，说明该后台或运维界面对外可访问，可用于资产识别与暴露面排查。
  metadata:
    verified: true
    max-request: 1
    fofa-query: 网络键盘控制台
  tags: panel,login,kedacom,network,discovery

http:
  - method: GET
    path:
      - "{{BaseURL}}/login.html"

    matchers-condition: and
    matchers:
      - type: word
        words:
          - '网络键盘控制台'

      - type: status
        status:
          - 200
