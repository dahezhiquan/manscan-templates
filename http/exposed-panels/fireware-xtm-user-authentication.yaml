id: fireware-xtm-user-authentication

info:
  name: Fireware XTM 登录面板识别（暴露面识别）
  author: dhiyaneshDK
  severity: info
  description: 该模板通过识别 Fireware XTM 登录入口的页面标题、特征文本或重定向行为，判断目标是否暴露了对应的认证界面。若命中，说明该登录面板对外可访问，可用于暴露面梳理与后续安全评估。
  classification:
    cvss-metrics: CVSS:3.0/AV:N/AC:L/PR:N/UI:N/S:U/C:N/I:N/A:N
    cwe-id: CWE-200
    cpe: cpe:2.3:a:watchguard:fireware_xtm:*:*:*:*:*:*:*:*
  metadata:
    max-request: 1
    vendor: watchguard
    product: fireware_xtm
    shodan-query:
      - http.title:"Fireware XTM User Authentication"
      - http.title:"fireware xtm user authentication"
    fofa-query: title="fireware xtm user authentication"
    google-query: intitle:"fireware xtm user authentication"
  tags: panel,watchguard,discovery

http:
  - method: GET
    path:
      - '{{BaseURL}}/sslvpn_logon.shtml'

    matchers-condition: and
    matchers:
      - type: word
        words:
          - '<title>User Authentication'

      - type: status
        status:
          - 200
