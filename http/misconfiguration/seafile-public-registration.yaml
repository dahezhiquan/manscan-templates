id: seafile-public-registration

info:
  name: Seafile 公开注册已启用
  author: theamanrawat
  severity: low
  description: |
    该模板用于核查 Seafile 公开注册已启用。该类问题通常源于公开注册、自助开户或默认初始化策略未按业务预期关闭。模板会向目标发送探测请求，并依据请求 `/accounts/register/`、匹配 `status_code == 200`等证据确认目标是否存在该配置问题。
  impact: |
    - 攻击者可自行创建账号进入系统，枚举内部功能、数据或协作空间。
    - 若新账号默认权限过高，可能进一步导致数据泄露、配置变更或平台滥用。
  remediation: |
    - 关闭不需要的公开注册和自助开户入口。
    - 对必须开放的注册流程增加审批、邮箱域限制、验证码和速率限制。
    - 审计近期新建账号、权限分配和异常登录行为。
  reference:
    - https://forum.seafile.com/t/seafile-disable-email-registration-for-users/4957
  metadata:
    verified: true
    max-requests: 1
    shodan-query: http.title:"Seafile"
    fofa-query: title="Seafile"
  tags: misconfig,seafile,registration,exposure

http:
  - method: GET
    path:
      - "{{BaseURL}}/accounts/register/"

    matchers:
      - type: dsl
        dsl:
          - 'status_code == 200'
          - 'contains_all(body, "id_email", "id_password1", "csrfmiddlewaretoken", "seafile-ui.css", "SEAFILE_GLOBAL")'
        condition: and
