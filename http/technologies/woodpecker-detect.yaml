id: woodpecker-detect

info:
  name: Woodpecker CI 指纹识别（指纹识别）
  author: righettod
  severity: info
  description: >-
    Woodpecker CI 是开源持续集成平台，用于基于代码仓库触发构建、测试和部署流水线。该模板通过请求目标服务并检查预设路径或首页响应、DSL 条件、正则特征等指纹特征，判断目标是否使用或暴露了
    Woodpecker CI 相关组件；命中结果仅表示指纹特征匹配，可用于资产盘点、技术栈识别和后续安全评估，不代表已确认存在可利用漏洞。
  reference:
  - https://github.com/woodpecker-ci/woodpecker
  - https://woodpecker-ci.org/
  metadata:
    verified: true
    shodan-query: http.title:"woodpecker"
    max-request: 1
  tags: tech,woodpecker,detect,discovery
http:
  - method: GET
    path:
      - "{{BaseURL}}/web-config.js"

    matchers:
      - type: dsl
        dsl:
          - 'status_code == 200'
          - 'contains(to_lower(body), "window.woodpecker_")'
        condition: and

    extractors:
      - type: regex
        part: body
        group: 1
        regex:
          - '(?i)window.WOODPECKER_VERSION\s*=\s*"([0-9.]+)"'
