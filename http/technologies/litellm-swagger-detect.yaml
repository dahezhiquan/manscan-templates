id: litellm-swagger-detect

info:
  name: LiteLLM API - Swagger UI 指纹识别（指纹识别）
  author: rxerium
  severity: info
  description: |
    用于识别目标暴露的 LiteLLM API - Swagger UI，模板会结合页面标题、页面正文、状态码和特定路径或已知端点判断是否存在对应技术或默认页面特征。
  reference:
    - https://github.com/BerriAI/litellm
    - https://docs.litellm.ai/
  metadata:
    verified: true
    max-request: 1
    shodan-query: http.title:"LiteLLM API - Swagger UI"
  tags: tech,litellm,swagger,api,ai,llm

http:
  - method: GET
    path:
      - "{{BaseURL}}"

    matchers-condition: and
    matchers:
      - type: word
        part: body
        words:
          - "<title>LiteLLM API - Swagger UI"

      - type: status
        status:
          - 200
