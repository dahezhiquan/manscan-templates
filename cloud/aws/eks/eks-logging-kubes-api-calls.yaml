id: eks-logging-kubes-api-calls

info:
  name: Enable CloudTrail 日志记录 的Kubernetes API Calls（云安全）
  author: princechaddha
  severity: high
  description: 该规则用于检查 AWS EKS 是否启用了日志记录、审计、监控或告警能力，以确保能够及时发现异常行为并满足审计与取证要求。
  impact: |
    - 缺少日志、审计或告警能力会削弱对异常活动的发现、响应与取证能力。
    - 安全事件可能因此长时间不被察觉，扩大影响范围并增加溯源难度。
  remediation: |
    - 启用必要的日志、审计、监控和告警能力，并确保日志输出到集中化、可审计的位置。
    - 为高风险事件设置实时通知与响应流程，避免关键安全事件长期无感知。
  reference:
    - https://www.trendmicro.com/cloudoneconformity/knowledge-base/aws/EKS/eks-logging-kubes-api-calls.html
    - https://docs.aws.amazon.com/eks/latest/userguide/logging-using-cloudtrail.html
  tags: cloud,devops,aws,amazon,eks,aws-cloud-config

variables:
  region: "us-east-1"

flow: |
  code(1)
  for(let trailName of iterate(template.trails)){
    set("trail", trailName)
    code(2)
  }

self-contained: true

code:
  - engine:
      - sh
      - bash
    source: |
      aws cloudtrail list-trails --region $region --query 'Trails[*].Name' --output json

    extractors:
      - type: json
        name: trails
        internal: true
        json:
          - '.[]'

  - engine:
      - sh
      - bash
    source: |
      aws cloudtrail get-trail-status --name $trail --region $region --query 'IsLogging' --output json

    matchers:
      - type: word
        words:
          - "false"

    extractors:
      - type: dsl
        dsl:
          - '"CloudTrail trail " + trail + " is not logging EKS API calls"'
