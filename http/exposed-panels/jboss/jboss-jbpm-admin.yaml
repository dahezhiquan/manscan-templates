id: jboss-jbpm-admin

info:
  name: JBoss jBPM Administration Console 登录面板识别（暴露面识别）
  author: DhiyaneshDK
  severity: medium
  description: |-
    检测到目标站点暴露 JBoss jBPM Administration Console 相关 Web 面板或登录入口。JBoss jBPM Administration Console 是监控、日志、分析或可观测性系统，用于展示运行指标、告警事件、日志数据和服务状态。模板请求 `/jbpm-console/app/tasks.jsf`，并通过页面标题或正文关键字、状态码确认入口可访问；该结果可作为威胁情报排查、攻击基础设施清理和暴露面收敛依据。
  impact: |-
    - 可帮助攻击者或防守方确认目标存在 JBoss jBPM Administration Console 相关 C2、远控、窃密、钓鱼或恶意基础设施，暴露组织资产、演练环境或恶意运营节点。
    - 若该面板未限制来源或存在弱口令、默认凭据、已知漏洞，攻击者可能接管控制端、获取会话数据、篡改任务配置或扩大攻击链影响。
    - 对外暴露的恶意基础设施面板还可能导致溯源线索、受害数据或行动配置被第三方发现和滥用。
  remediation: |-
    - 核实 JBoss jBPM Administration Console 面板是否属于授权资产、演练环境或应急分析环境；若为未知或恶意基础设施，应立即隔离主机并保全日志证据。
    - 对确需保留的控制台限制访问来源，仅允许 VPN、堡垒机或可信管理网段访问，并启用强认证、最小权限和完整审计。
    - 轮换相关凭据、令牌和证书，检查是否存在异常任务、回连会话或数据外传痕迹，并持续监控同类指纹再次暴露。
  reference:
    - https://github.com/PortSwigger/j2ee-scan/blob/master/src/main/java/burp/j2ee/issues/impl/JBossjBPMAdminConsole.java
  classification:
    cvss-metrics: CVSS:3.1/AV:N/AC:L/PR:N/UI:N/S:U/C:N/I:N/A:N
    cwe-id: CWE-200
    cpe: cpe:2.3:a:redhat:jbpm:*:*:*:*:*:*:*:*
  metadata:
    verified: true
    max-request: 1
    vendor: redhat
    product: jbpm
    shodan-query:
      - html:"JBossWS"
      - http.html:"jbossws"
    fofa-query: body="jbossws"
  tags: jboss,panel,login,redhat,discovery
http:
  - method: GET
    path:
      - '{{BaseURL}}/jbpm-console/app/tasks.jsf'

    matchers-condition: and
    matchers:
      - type: word
        part: body
        words:
          - 'JBoss jBPM Administration Console'

      - type: status
        status:
          - 200
