id: linux-nisplus-service

info:
  name: NIS+ 服务应禁用（本地基线扫描）
  author: songyaeji
  severity: high
  description: |
    NIS+ 相关守护进程属于旧式网络身份服务组件，继续运行会带来过时信任机制和目录信息暴露风险。模板通过 systemd 或进程列表检查 `rpc.yppasswdd`、`rpc.yppupdated`、`ypxfrd` 是否运行，输出 `[VULNERABLE]` 时表示 NIS+ 服务仍启用。
  impact: |
    - 目录和账号相关信息可能被非预期访问，用于进一步身份攻击。
    - 旧式服务增加 RPC 暴露面，并削弱主机最小化基线。
  remediation: |
    - 停止并禁用 NIS+ 相关守护进程，移除不再使用的服务包。
    - 使用受支持的身份管理方案替代，并通过防火墙阻断遗留 RPC 访问。
  reference:
    - https://isms.kisa.or.kr
  tags: linux,local,audit,kisa,compliance

self-contained: true

code:
  - engine:
      - sh
      - bash
    source: |
      if command -v systemctl >/dev/null 2>&1; then
          if systemctl is-active --quiet rpc.yppasswdd rpc.yppupdated ypxfrd; then
              echo "[VULNERABLE] NIS+ service is running"
              systemctl status rpc.yppasswdd rpc.yppupdated ypxfrd
          else
              echo "[SAFE] NIS+ service is not running"
          fi
      else
          running=$(ps -ef | egrep "rpc.yppasswdd|rpc.yppupdated|ypxfrd" | grep -v grep)
          if [ -n "$running" ]; then
              echo "[VULNERABLE] NIS+ service is running"
              echo "$running"
          else
              echo "[SAFE] NIS+ service is not running"
          fi
      fi

    matchers:
      - type: word
        part: response
        words:
          - "[VULNERABLE]"
