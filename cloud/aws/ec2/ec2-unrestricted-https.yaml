id: ec2-unrestricted-https
info:
  name: EC2 安全组对公网开放 HTTPS 端口（云安全）
  author: princechaddha
  severity: critical
  description: EC2 安全组对公网开放 HTTPS 端口是一类公网 Web 暴露面风险，端口 443 面向任意来源表示实例服务可被互联网直接访问。HTTPS 提供传输加密，但不能替代身份鉴别、应用授权和漏洞防护。模板通过 `describe-security-groups` 筛选 443 端口且来源为 `0.0.0.0/0` 的入站规则，并输出命中的安全组 ID。
  impact: |
    - 直接暴露的 HTTPS 服务仍可能被漏洞扫描、路径枚举、认证爆破或应用层攻击。
    - 管理控制台或内部 API 若通过 443 暴露，可能导致权限滥用或敏感信息泄露。
  remediation: |
    - 确认 443 端口确需公网开放；对内部服务仅允许 VPN、负载均衡或受信任网段访问。
    - 为公网 Web 入口配置 WAF、访问控制、证书生命周期管理和应用层认证。
  reference:
    - https://docs.aws.amazon.com/AWSEC2/latest/UserGuide/ec2-security-groups.html
  metadata:
    vendor: amazon
    product: ec2
  tags: cloud,devops,aws,amazon,ec2,aws-cloud-config

variables:
  region: "us-east-1"

self-contained: true
code:
  - engine:
      - sh
      - bash
    source: |
      aws ec2 describe-security-groups --region $region --filters Name=ip-permission.from-port,Values=443 Name=ip-permission.to-port,Values=443 Name=ip-permission.cidr,Values='0.0.0.0/0' --query 'SecurityGroups[*].GroupId' --output json

    extractors:
      - type: json
        name: securitygroup
        internal: true
        json:
          - '.[]'

      - type: dsl
        dsl:
          - 'securitygroup + " security group(s) alows unrestricted access (0.0.0.0/0 or ::/0) on TCP port 443"'
