id: azure-aks-rbac-unconfigured
info:
  name: Azure AKS Kubernetes RBAC 未启用（云安全）
  author: princechaddha
  severity: medium
  description: AKS 集群未启用 Kubernetes RBAC 时，Kubernetes API 的资源级授权能力不足，用户和服务账号可能难以按命名空间及操作类型实施最小权限。该模板查询 enableRbac，并在返回 false 时判定 Kubernetes RBAC 未启用。
  impact: |
    - 获得集群访问凭据的攻击者或内部账号可能拥有超出业务所需的资源访问能力，进而读取机密、修改工作负载或扩大权限。
    - 缺少细粒度授权会削弱多租户隔离、变更审计和异常操作追责能力。
  remediation: |
    - 在集群创建或支持的更新路径中启用 Kubernetes RBAC，并重新梳理 Role、ClusterRole 及绑定关系。
    - 结合 Microsoft Entra ID 或 Azure RBAC、命名空间隔离和最小权限原则，移除不必要的 cluster-admin 授权。
  reference:
    - https://docs.microsoft.com/en-us/azure/aks/concepts-identity
  metadata:
    vendor: microsoft
    product: azure-kubernetes-service
  tags: cloud,devops,azure,microsoft,aks,azure-cloud-config

flow: |
  code(1);
  for (let ClusterData of iterate(template.clusterList)) {
    ClusterData = JSON.parse(ClusterData);
    set("name", ClusterData.name);
    set("resourceGroup", ClusterData.resourceGroup);
    code(2);
  }

self-contained: true
code:
  - engine:
      - sh
      - bash
    source: |
      az aks list --output json --query '[*].{name:name, resourceGroup:resourceGroup}'

    extractors:
      - type: json
        name: clusterList
        internal: true
        json:
          - '.[]'

  - engine:
      - sh
      - bash
    source: |
      az aks show --name "$name" --resource-group "$resourceGroup" --query 'enableRbac'

    matchers-condition: and
    matchers:
      - type: word
        words:
          - 'false'

    extractors:
      - type: dsl
        dsl:
          - 'name + " in " + resourceGroup + " has RBAC not enabled"'
