id: wingftp-panel

info:
  name: Wing FTP Server 登录面板识别（暴露面识别）
  author: pdteam
  severity: info
  description: |
    该模板通过识别 Wing FTP Server 登录入口的页面标题、特征文本或重定向行为，判断目标是否暴露了对应的认证界面。若命中，说明该登录面板对外可访问，可用于暴露面梳理与后续安全评估。
  reference:
    - https://www.wftpserver.com/
  metadata:
    product: wingftp
    vendor: wingftp
    shodan-query:
      - http.html_hash:2121146066
      - http.favicon.hash:963565804
      - title:"Wing FTP Server"
      - "Server: Wing FTP Server"
    fofa-query:
      - icon_hash="963565804"
      - title="Wing FTP Server"
      - "Server: Wing FTP Server"
    zoomeye-query:
      - app="Wing FTP Server"
    verified: true
  tags: panel,login,wingftp,discovery

http:
  - method: GET
    path:
      - "{{BaseURL}}/login.html"

    matchers:
      - type: word
        part: response
        words:
          - "Wing FTP Server"

    extractors:
      - type: regex
        part: body
        group: 1
        regex:
          - 'Wing FTP Server\s+v?([0-9]+\.[0-9]+\.[0-9]+)'
