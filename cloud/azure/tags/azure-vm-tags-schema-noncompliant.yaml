id: azure-vm-tags-schema-noncompliant
info:
  name: Azure VM Tags Schema Non-compliant（云安全）
  author: princechaddha
  severity: low
  description: 该规则用于检查 Azure tags 相关身份、权限或口令安全策略是否符合最小权限和强认证要求，避免因过度授权或弱认证导致资源被滥用。
  impact: |
    - 过度授权、弱口令策略或缺少 MFA 会显著提升账户被滥用的风险。
    - 一旦身份被攻破，攻击者可能借助合法权限直接访问或控制云资源。
  remediation: |
    - 落实最小权限原则，收敛高危权限、通配授权和不必要的管理员能力。
    - 对关键账户和控制台访问强制启用 MFA，并完善口令复杂度、轮换与重用限制策略。
  reference:
    - https://docs.microsoft.com/en-us/azure/virtual-machines/tagging
  tags: cloud,devops,azure,microsoft,azure-vm,azure-cloud-config

flow: |
  code(1);
  for (let VMData of iterate(template.vmList)) {
    VMData = JSON.parse(VMData);
    set("resourceId", VMData.id);
    code(2);
  }

self-contained: true
code:
  - engine:
      - sh
      - bash
    source: |
      az vm list --query '[*].{"id":id}'

    extractors:
      - type: json
        name: vmList
        internal: true
        json:
          - '.[]'

  - engine:
      - sh
      - bash
    source: |
      az tag list --resource-id "$resourceId" --output json --query 'properties.tags'

    matchers-condition: and
    matchers:
      - type: word
        words:
          - ''

      - type: word
        words:
          - "Name"
        negative: true

    extractors:
      - type: dsl
        dsl:
          - 'resourceId + " does not use the recommended tagging schema"'
