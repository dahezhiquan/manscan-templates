id: hue-wireless-lighting

info:
  name: Hue Personal Wireless Lighting 指纹识别（指纹识别）
  author: ProjectDiscoveryAI
  severity: info
  description: >-
    Philips Hue 是智能照明系统，用于通过桥接器和应用控制灯具、场景和自动化。该模板通过请求目标服务并检查预设路径或首页响应、页面正文关键字等指纹特征，判断目标是否使用或暴露了
    Hue Personal Wireless Lighting 相关组件；命中结果仅表示指纹特征匹配，可用于资产盘点、技术栈识别和后续安全评估，不代表已确认存在可利用漏洞。
  metadata:
    verified: true
    max-request: 1
    shodan-query: title:"Hue Personal"
  tags: tech,hue,iot,discovery
http:
  - method: GET
    path:
      - "{{BaseURL}}"

    matchers:
      - type: word
        words:
          - "hue personal wireless lighting"
          - "Welcome to hue"
        condition: or
