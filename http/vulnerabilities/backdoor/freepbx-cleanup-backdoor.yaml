id: freepbx-cleanup-backdoor

info:
  name: FreePBX 清理脚本后门检测
  severity: high
  description: |
    该模板用于检测 FreePBX 清理脚本后门检测。命中通常表示目标存在后门、植入组件、恶意脚本或可疑未授权入口。模板主要向 `/.clean.sh` 等路径发送探测请求，并根据响应中的 `LOGS`、`Processing file` 等特征确认漏洞是否存在。
  impact: |
    - 命中通常表示目标存在后门、植入组件或可疑恶意脚本，攻击者可能已具备未授权访问能力。
    - 后门可能被用于执行命令、窃取数据、维持持久化访问或作为进一步入侵的跳板。
  remediation: |
    - 立即隔离受影响资产，保留证据并开展入侵排查，不要仅删除单个可疑文件后恢复上线。
    - 清理后门文件、恶意脚本、异常账号、计划任务和持久化项，并从可信介质重建受影响组件。
    - 升级相关产品，轮换系统、数据库、应用和第三方集成凭据。
  author: darses
  metadata:
    verified: true
    max-request: 1
    vendor: sangoma
    product: freepbx
    shodan-query:
      - http.title:"FreePBX"
      - http.favicon.hash:-1908328911
      - http.favicon.hash:1574423538
    fofa-query:
      - title="FreePBX"
      - icon_hash="-1908328911"
      - icon_hash="1574423538"
  reference:
    - https://community.freepbx.org/t/security-advisory-please-lock-down-your-administrator-access/107203
  tags: backdoor,sangoma,freepbx,vuln

http:
  - method: GET
    path:
      - "{{BaseURL}}/.clean.sh"

    matchers-condition: and
    matchers:
      - type: word
        words:
          - "LOGS"
          - "Processing file"
          - "sed -i --follow-symlinks"
          - "/var/log/asterisk/freepbx_security.log"
        condition: and

      - type: status
        status:
          - 200

    extractors:
      - type: kval
        part: header
        kval:
          - last_modified
