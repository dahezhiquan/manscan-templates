id: hydra-dashboard

info:
  name: Hydra Router Dashboard 识别（暴露面识别）
  author: tess
  severity: info
  description: 该模板通过识别 Hydra Router Dashboard 仪表盘或后台界面的页面特征，判断目标是否对外暴露了相关控制台。若命中，说明该服务面向外部可访问，可用于资产识别与访问控制核查。
  classification:
    cvss-metrics: CVSS:3.0/AV:N/AC:L/PR:N/UI:N/S:U/C:N/I:N/A:N
    cwe-id: CWE-200
    cpe: cpe:2.3:a:hydra_project:hydra:*:*:*:*:*:*:*:*
  metadata:
    verified: true
    max-request: 1
    vendor: hydra_project
    product: hydra
    shodan-query:
      - title:"Hydra Router Dashboard"
      - http.title:"hydra router dashboard"
    fofa-query: title="hydra router dashboard"
    google-query: intitle:"hydra router dashboard"
  tags: panel,exposure,hydra,hydra_project,discovery

http:
  - method: GET
    path:
      - '{{BaseURL}}'

    matchers-condition: and
    matchers:
      - type: word
        part: body
        words:
          - "Hydra Router Dashboard"
          - "screen: 'dashboard'"
        condition: and

      - type: status
        status:
          - 200
