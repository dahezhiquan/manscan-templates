id: api-hunter

info:
  name: Hunter API Token 可用性校验（token喷洒）
  author: daffainfo
  severity: info
  description: 该模板通过调用 Hunter API 的已知接口验证提供的 token 是否有效，命中后通常表示可访问邮件发送、投递或邮箱服务能力。
  reference:
    - https://hunter.io/api-documentation/v2
    - https://github.com/daffainfo/all-about-apikey/tree/main/hunter
  metadata:
    max-request: 1
  tags: token-spray,hunter

self-contained: true

http:
  - method: GET
    path:
      - "https://api.hunter.io/v2/domain-search?domain=stripe.com&api_key={{token}}"

    matchers:
      - type: word
        part: body
        words:
          - '"domain"'
          - '"disposable"'
          - '"webmail"'
        condition: and
