id: endpoint-protector-panel

info:
  name: Endpoint Protector 登录面板识别（暴露面识别）
  author: pussycat0x
  severity: info
  description: |
    该模板通过识别 Endpoint Protector 登录入口的页面标题、特征文本或重定向行为，判断目标是否暴露了对应的认证界面。若命中，说明该登录面板对外可访问，可用于暴露面梳理与后续安全评估。
  classification:
    cpe: cpe:2.3:a:cososys:endpoint_protector:*:*:*:*:*:*:*:*
  metadata:
    verified: true
    max-request: 1
    vendor: cososys
    product: endpoint_protector
    shodan-query: http.title:"Endpoint Protector"
  tags: panel,endpoint,login,detect,endpoint-protector,discovery

http:
  - method: GET
    path:
      - "{{BaseURL}}"

    matchers-condition: and
    matchers:
      - type: word
        words:
          - "Endpoint Protector - Reporting and Administration Tool"

      - type: status
        status:
          - 200
