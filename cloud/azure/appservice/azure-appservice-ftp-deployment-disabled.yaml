id: azure-appservice-ftp-deployment-disabled
info:
  name: Azure App Service FTP 部署入口未禁用（云安全）
  author: princechaddha
  severity: medium
  description: Azure App Service 的 ftpsState 为 AllAllowed 时，部署端点同时允许 FTP 和 FTPS，明文 FTP 可能被用于传输发布凭据和应用文件。该模板枚举 Web App，查询 ftpsState，并在返回 AllAllowed 时报告 FTP 部署入口仍处于允许状态。
  impact: |
    - FTP 传输可能泄露发布凭据、源代码、配置文件和部署包，攻击者可进一步篡改应用内容。
    - 发布凭据被窃取后，攻击者可能植入后门、读取应用数据或破坏线上版本。
  remediation: |
    - 禁止普通 FTP 部署，仅保留组织确需使用的 FTPS，并优先采用受控的 CI/CD 部署方式。
    - 轮换已用于 FTP/S 的发布凭据，限制部署账户权限并审计发布端点的登录和文件变更记录。
  reference:
    - https://docs.microsoft.com/en-us/azure/app-service/deploy-ftp
  metadata:
    vendor: microsoft
    product: azure-app-service
  tags: cloud,devops,azure,microsoft,appservice,azure-cloud-config

flow: |
  code(1);
  for (let WebAppId of iterate(template.webAppIds)) {
    set("ids", WebAppId);
    code(2);
  }

self-contained: true
code:
  - engine:
      - sh
      - bash
    source: |
      az webapp list --output json --query '[*].id'

    extractors:
      - type: json
        name: webAppIds
        internal: true
        json:
          - '.[]'

  - engine:
      - sh
      - bash
    source: |
      az webapp config show --ids $ids --output json --query 'ftpsState'

    matchers:
      - type: word
        words:
          - "AllAllowed"

    extractors:
      - type: dsl
        dsl:
          - 'ids + " has FTP deployment enabled, which is not secure"'
