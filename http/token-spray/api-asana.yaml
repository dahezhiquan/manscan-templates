id: api-asana

info:
  name: Asana API Token 可用性校验（token喷洒）
  author: zzeitlin
  severity: info
  description: 该模板通过调用 Asana API 的已知接口验证提供的 token 是否有效，命中后通常表示可访问协作、任务或项目管理能力。
  reference:
    - https://developers.asana.com/docs/using-terminal
    - https://github.com/daffainfo/all-about-apikey/tree/main/asana
  metadata:
    max-request: 1
  tags: token-spray,asana

self-contained: true

http:
  - method: GET
    path:
      - "https://app.asana.com/api/1.0/users/me"

    headers:
      Authorization: Bearer {{token}}
    matchers:
      - type: word
        part: body
        words:
          - 'data:'
          - 'email'
          - 'name'
        condition: and
