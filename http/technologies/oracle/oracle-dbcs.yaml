id: oracle-dbcs

info:
  name: Oracle Database Cloud Service 指纹识别（指纹识别）
  author: pussycat0x
  severity: info
  description: >-
    Oracle Database Cloud Service 是 Oracle 数据库云服务，用于托管数据库实例、备份和管理操作。该模板通过请求目标服务并检查预设路径或首页响应、页面正文关键字、状态码等指纹特征，判断目标是否使用或暴露了
    Oracle Database Cloud Service 相关组件；命中结果仅表示指纹特征匹配，可用于资产盘点、技术栈识别和后续安全评估，不代表已确认存在可利用漏洞。
  classification:
    cpe: cpe:2.3:a:oracle:database_server:*:*:*:*:*:*:*:*
  metadata:
    max-request: 1
    vendor: oracle
    product: database_server
    shodan-query: http.title:"Oracle Database as a Service"
  tags: oracle,tech,discovery
http:
  - method: GET
    path:
      - '{{BaseURL}}'

    matchers-condition: and
    matchers:
      - type: word
        words:
          - '<title>Oracle Database as a Service</title>'
        part: body

      - type: status
        status:
          - 200
