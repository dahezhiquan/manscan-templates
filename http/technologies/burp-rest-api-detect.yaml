id: burp-rest-api-detect

info:
  name: Burp Rest API 服务器 指纹识别（指纹识别）
  author: joanbono
  severity: info
  description: Burp Rest API 服务器 是 Burp Suite REST API 服务，用于自动化控制扫描、项目和安全测试流程。该模板请求 `/v0.1/`，并依据 HTTP 200 状态码、页面标题、正文关键字或品牌资源特征、响应头特征识别目标是否使用或暴露了 Burp Rest API 服务器 相关组件，适用于资产盘点、技术栈识别和后续安全评估；命中结果仅表示指纹特征匹配，不代表已确认存在可利用漏洞。
  reference:
  - https://portswigger.net/burp/documentation/enterprise/api-reference
  metadata:
    product: burp
    max-request: 1
  tags: burp,tech,discovery

http:
  - method: GET
    path:
      - "{{BaseURL}}/v0.1/"

    matchers-condition: and
    matchers:
      - type: word
        words:
          - '<title>Burp API</title>'
        part: body

      - type: word
        words:
          - 'X-Burp-Version'
        part: header

      - type: status
        status:
          - 200

    extractors:
      - type: regex
        name: detected_version
        part: header
        group: 1
        regex:
          - (?mi)^X-Burp-Version:[ \t]*([0-9]+(?:[.][0-9]+)+(?:[-+._][0-9A-Za-z]+)*)[ \t]*\r?$
        internal: true
      - type: dsl
        dsl:
          - 'regex("^[0-9]+(?:[.][0-9]+)*(?:[-+._][0-9A-Za-z]+)*$", detected_version) ? detected_version : ""'
