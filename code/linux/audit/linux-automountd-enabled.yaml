id: linux-automountd-enabled

info:
  name: automountd 服务已启用（本地基线扫描）
  author: songyaeji
  severity: medium
  description: |
    该模板检查 automountd 是否启用或运行。该服务历史上存在可被本地滥用的风险，在无业务需求时应禁用以降低提权面。
  reference:
    - https://isms.kisa.or.kr
  metadata:
    verified: true
  tags: local,linux,privesc,kisa

self-contained: true

code:
  - engine:
      - sh
      - bash
    source: |
      whoami

  - engine:
      - sh
      - bash
    source: |
      if pgrep -x "automountd" > /dev/null; then
        echo "[VULNERABLE] automountd service is running"
      else
        echo "[SAFE] automountd service is not running"
      fi

    matchers-condition: and
    matchers:
      - type: word
        part: response
        words:
          - "root"
        negative: true

      - type: word
        part: response
        words:
          - "[VULNERABLE]"
