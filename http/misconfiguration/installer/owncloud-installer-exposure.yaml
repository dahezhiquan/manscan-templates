id: owncloud-installer-exposure

info:
  name: OwnCloud 安装向导 暴露
  author: DhiyaneshDk
  severity: high
  description: |
    检测到 OwnCloud 安装向导 暴露。该页面属于安装、初始化或配置向导流程，若对外暴露，攻击者可能完成初始化、创建管理员账户或重新配置目标系统。
  classification:
    cpe: cpe:2.3:a:owncloud:owncloud:*:*:*:*:*:*:*:*
  metadata:
    verified: true
    max-request: 2
    vendor: owncloud
    product: owncloud
    shodan-query: title:"owncloud"
  tags: misconfig,owncloud,exposure,install,vuln

http:
  - method: GET
    path:
      - '{{BaseURL}}'
      - '{{BaseURL}}/owncloud/'

    stop-at-first-match: true

    matchers-condition: and
    matchers:
      - type: word
        part: body
        words:
          - "<legend>Create an <strong>admin account</strong>"
          - "ownCloud"
        condition: and

      - type: word
        part: header
        words:
          - "text/html"

      - type: status
        status:
          - 200
