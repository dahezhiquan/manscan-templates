id: peplink-panel

info:
  name: Peplink 登录面板识别（暴露面识别）
  author: pussycat0x
  severity: info
  description: 该模板通过识别 Peplink 登录入口的页面标题、特征文本或重定向行为，判断目标是否暴露了对应的认证界面。若命中，说明该登录面板对外可访问，可用于暴露面梳理与后续安全评估。
  metadata:
    verified: true
    shodan-query: html:"PEPLINK"
    vendor: peplink
    product: balance_two_firmware
  tags: panel,peplink,router,login,discovery

http:
  - method: GET
    path:
      - "{{BaseURL}}/cgi-bin/MANGA/index.cgi"

    matchers-condition: and
    matchers:
      - type: word
        part: body
        words:
          - 'init_company_name = "Peplink"'
          - '<title>Web Admin | Welcome'
        condition: and

      - type: status
        status:
          - 200
