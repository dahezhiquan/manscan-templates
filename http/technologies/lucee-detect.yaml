id: lucee-detect

info:
  name: Lucee 指纹识别（指纹识别）
  author: geeknik,DhiyaneshDK
  severity: info
  description: >-
    Lucee 是开源 CFML 应用服务器，用于运行 ColdFusion Markup Language Web 应用。该模板通过请求目标服务并检查预设路径或首页响应、页面正文关键字、HTTP
    响应头、正则特征等指纹特征，判断目标是否使用或暴露了 Lucee 相关组件；命中结果仅表示指纹特征匹配，可用于资产盘点、技术栈识别和后续安全评估，不代表已确认存在可利用漏洞。
  metadata:
    product: lucee
    max-request: 2
    shodan-query: "html:\"Lucee\""
    fofa-query: "app=\"Lucee-Engine\""
  tags: tech,lucee,discovery
http:
  - method: GET
    path:
      - "{{BaseURL}}/lucee/doc/functions.cfm"
      - "{{BaseURL}}"

    stop-at-first-match: false
    matchers-condition: or
    matchers:
      - type: regex
        part: header
        regex:
          - "(?i)X-Lucee-Version"
          - "(?i)X-CB-Server: LUCEE"
          - "(?i)X-IDG-Appserver: Lucee"
        condition: or

      - type: word
        part: body
        words:
          - "Lucee Function Reference"

    extractors:
      - type: regex
        name: detected_version
        part: header
        group: 1
        regex:
          - (?mi)^X-Lucee-Version:[ \t]*([0-9]+(?:[.][0-9]+)+(?:[-+._][0-9A-Za-z]+)*)[ \t]*\r?$
        internal: true
      - type: dsl
        dsl:
          - 'regex("^[0-9]+(?:[.][0-9]+)*(?:[-+._][0-9A-Za-z]+)*$", detected_version) ? detected_version : ""'
