id: docker-registry-browser-detect

info:
  name: Docker Registry Browser 指纹识别（指纹识别）
  author: pussycat0x
  severity: info
  description: |-
    Docker Registry Browser 是 Docker 镜像仓库浏览界面，用于查看镜像、标签和仓库内容。该模板请求首页，并依据 HTTP 200 状态码、页面标题、正文关键字或品牌资源特征识别目标是否使用或暴露了 Docker Registry Browser 相关组件，适用于资产盘点、技术栈识别和后续安全评估；命中结果仅表示指纹特征匹配，不代表已确认存在可利用漏洞。
  reference:
  - https://github.com/klausmeyer/docker-registry-browser
  metadata:
    verified: true
    max-request: 1
    shodan-query: html:"Docker Registry Browser"
  tags: docker,registry,browser,ui,tech,discovery

http:
  - method: GET
    path:
      - "{{BaseURL}}"

    host-redirects: true
    max-redirects: 2

    matchers-condition: and
    matchers:
      - type: word
        part: body
        words:
          - "<title>Docker Registry Browser</title>"

      - type: status
        status:
          - 200
