id: thinkcmf-detection

info:
  name: ThinkCMF 指纹识别（指纹识别）
  author: pikpikcu,daffainfo
  severity: info
  description: >-
    ThinkCMF 是基于 PHP/ThinkPHP 的内容管理框架，用于构建门户、企业站点和后台管理系统。该模板通过请求目标服务并检查预设路径或首页响应、页面正文关键字、状态码等指纹特征，判断目标是否使用或暴露了
    ThinkCMF 相关组件；命中结果仅表示指纹特征匹配，可用于资产盘点、技术栈识别和后续安全评估，不代表已确认存在可利用漏洞。
  classification:
    cvss-metrics: CVSS:3.0/AV:N/AC:L/PR:N/UI:N/S:U/C:N/I:N/A:N
    cvss-score: 0
    cwe-id: CWE-200
  metadata:
    max-request: 1
  tags: panel,thinkcmf,login,tech,discovery
http:
  - method: GET
    path:
      - "{{BaseURL}}"

    matchers-condition: and
    matchers:
      - type: word
        part: body
        words:
          - '<meta name="author" content="ThinkCMF">'

      - type: status
        status:
          - 200
