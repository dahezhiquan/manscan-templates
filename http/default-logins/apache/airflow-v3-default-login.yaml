id: airflow-v3-default-login

info:
  name: Apache Airflow v3 默认口令登录（弱口令）
  author: pdteam
  severity: high
  description: |
    该模板用于检测 Apache Airflow v3 是否仍可使用默认凭据或弱口令登录。模板主要向 `/auth/login/` 等认证入口发送请求，使用内置默认凭据组合进行认证尝试，并根据响应中的 `contains(body_1, "Airflow") && status_code_2 == 302`、`contains(body_2, "You should be redirected automatically")` 等登录成功特征判断登录是否成功；命中说明目标未及时修改出厂、示例或初始化账号口令。
  impact: |
    - 攻击者可进入 Apache Airflow v3 管理后台，修改任务、服务、插件、路由、作业调度或部署配置。
    - 在 DevOps、网关、监控或调度场景中，后台失陷可能影响生产任务执行、泄露密钥配置，并扩大到下游主机或业务系统。
  remediation: |
    - 立即修改默认管理员口令并清理示例账号，按角色最小化后台管理权限。
    - 将控制台和管理 API 放入受控网络或 VPN 后方，并开启多因素认证、登录失败限制和操作审计。
    - 复核近期任务、插件、连接配置、访问令牌和部署记录，轮换可能暴露的密钥。
  reference:
    - https://airflow.apache.org/docs/apache-airflow/stable/start/docker.html
  classification:
    cvss-metrics: CVSS:3.0/AV:N/AC:L/PR:N/UI:N/S:C/C:L/I:L/A:L
    cvss-score: 8.3
    cwe-id: CWE-522
  metadata:
    product: airflow
    vendor: apache
    max-request: 2
    shodan-query: title:"Airflow"
  tags: airflow,default-login,apache,vuln

http:
  - raw:
      - |
        GET /auth/login/ HTTP/1.1
        Host: {{Hostname}}
        Origin: {{BaseURL}}

      - |
        POST /auth/login/ HTTP/1.1
        Host: {{Hostname}}
        Origin: {{BaseURL}}
        Content-Type: application/x-www-form-urlencoded
        Referer: {{BaseURL}}/auth/login

        username={{username}}&password={{password}}&_csrf_token={{csrf_token}}

    attack: pitchfork
    payloads:
      username:
        - airflow
      password:
        - airflow

    extractors:
      - type: regex
        name: csrf_token
        group: 1
        internal: true
        regex:
          - type="hidden" value="(.*?)">

    matchers-condition: and
    matchers:
      - type: dsl
        dsl:
          - 'contains(body_1, "Airflow") && status_code_2 == 302'
          - 'contains(body_2, "You should be redirected automatically")'
          - 'contains(header_2, "session=")'
          - '!contains(location_2, "/login")'
        condition: and
