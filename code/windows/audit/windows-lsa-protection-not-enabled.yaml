id: windows-lsa-protection-not-enabled

info:
  name: LSA 保护未启用或未配置（本地基线扫描）
  author: princechaddha
  severity: high
  description: |
    该模板检查 Local Security Authority（LSA）保护是否未启用。缺少 LSA 保护会增加凭据转储风险。
  impact: |
    攻击者可更容易从 LSASS 相关进程中提取凭据。
  remediation: |
    启用 LSA Protection（RunAsPPL）并结合 Credential Guard。
  tags: windows,lsa,code,windows-audit

self-contained: true

code:
  - pre-condition: |
      IsWindows();
    engine:
      - powershell
      - powershell.exe
    args:
      - -ExecutionPolicy
      - Bypass
    pattern: "*.ps1"
    source: |
      ($null -eq (Get-ItemProperty -Path 'HKLM:\SYSTEM\CurrentControlSet\Control\Lsa' -Name 'RunAsPPL' -ErrorAction SilentlyContinue).RunAsPPL) -or ((Get-ItemProperty -Path 'HKLM:\SYSTEM\CurrentControlSet\Control\Lsa' -Name 'RunAsPPL' -ErrorAction SilentlyContinue).RunAsPPL -eq 0)

    matchers:
      - type: word
        words:
          - "True"
