id: iparapheur-detect

info:
  name: Iparapheur 指纹识别（指纹识别）
  author: righettod
  severity: info
  description: >-
    iParapheur 是电子签章和文件审批平台，用于政企场景中的文档流转、签署和归档。该模板通过请求目标服务并检查预设路径或首页响应、页面正文关键字、状态码等指纹特征，判断目标是否使用或暴露了
    Iparapheur 相关组件；命中结果仅表示指纹特征匹配，可用于资产盘点、技术栈识别和后续安全评估，不代表已确认存在可利用漏洞。
  reference:
  - https://www.libriciel.fr/logiciels/iparapheur/
  metadata:
    verified: true
    max-request: 1
    shodan-query: http.favicon.hash:-1383463717
  tags: iparapheur,detect,tech,discovery
http:
  - method: GET
    path:
      - "{{BaseURL}}"

    host-redirects: true
    max-redirects: 2
    matchers-condition: and
    matchers:
      - type: word
        part: body
        words:
          - "<title>iparapheur</title>"
          - "Libriciel SCOP"
        condition: and

      - type: status
        status:
          - 200
