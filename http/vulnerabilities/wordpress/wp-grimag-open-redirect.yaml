id: wp-grimag-open-redirect

info:
  name: WordPress Grimag <1.1.1 - 开放重定向漏洞
  author: 0x_Akoko
  severity: medium
  description: WordPress Grimag <1.1.1 - 开放重定向ion 存在开放重定向漏洞。攻击者可构造恶意跳转链接诱导用户访问钓鱼站点，或配合其他业务流程绕过安全校验。
  remediation: |
    - 按厂商公告升级到已修复版本；原始说明中提到的版本信息为：Fixed in 1。
    - 对跳转目标实施白名单校验，避免直接信任用户可控的 URL 参数。
    - 对登录、回调和重定向相关流程增加来源校验与业务约束。
  reference:
    - https://wpscan.com/vulnerability/db319d4c-7de6-4d36-90e9-86de82e9c03a
  classification:
    cvss-metrics: CVSS:3.1/AV:N/AC:L/PR:N/UI:R/S:C/C:L/I:L/A:N
    cvss-score: 6.1
    cwe-id: CWE-601
  metadata:
    max-request: 1
  tags: wp-theme,redirect,wpscan,wordpress,vuln

http:
  - method: GET
    path:
      - "{{BaseURL}}/wp-content/themes/Grimag/go.php?https://interact.sh"

    matchers:
      - type: regex
        regex:
          - '(?m)^(?:Location\s*?:\s*?)(?:https?://|//)?(?:[a-zA-Z0-9\-_\.@]*)interact\.sh.*$'
        part: header
