id: audiobookshelf-panel

info:
  name: Audiobookshelf 登录面板识别（指纹识别）
  author: ritikchaddha
  severity: info
  description: |-
    检测到目标站点存在 Audiobookshelf 相关响应特征。Audiobookshelf 是一套通过 Web 提供访问的管理面板或业务系统，通常用于配置服务、查看状态、管理数据或执行日常运维操作。模板请求 `/`、`/login` 路径，并通过页面标题或正文关键字、状态码确认该系统指纹，用于资产识别、系统盘点和暴露面梳理。
  reference:
    - https://github.com/advplyr/audiobookshelf
  classification:
    cpe: cpe:2.3:a:audiobookshelf:audiobookshelf:*:*:*:*:*:*:*:*
  metadata:
    verified: true
    max-request: 2
    shodan-query: title:"Audiobookshelf"
    product: audiobookshelf
    vendor: audiobookshelf
  tags: panel,audiobookshelf,detect,discovery
http:
  - method: GET
    path:
      - "{{BaseURL}}"
      - "{{BaseURL}}/login"

    stop-at-first-match: true
    host-redirects: true
    max-redirects: 2

    matchers-condition: and
    matchers:
      - type: word
        part: body
        words:
          - '<title>Audiobookshelf'
          - 'content="Audiobookshelf'
        condition: or

      - type: status
        status:
          - 200
