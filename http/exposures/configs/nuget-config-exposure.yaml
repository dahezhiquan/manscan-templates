id: nuget-config-exposure

info:
  name: NuGet.config 包源凭据暴露（暴露面识别）
  author: ChrisJr404
  severity: high
  description: |
    检测到目标站点可直接访问 NuGet.config 包源凭据。凭据类配置通常用于连接云服务、数据库、代码仓库、CI/CD 或第三方 API。该模板请求 `/nuget.config`、`/NuGet.Config`、`/.nuget/nuget.config`，并通过 HTTP 状态码、响应正文关键字、文件格式特征、正则匹配或响应头进行确认。此类资源公开后可能泄露部署细节、内部路径、依赖版本、环境变量、访问凭据或调试信息，增加被侦察和后续利用的风险。
  impact: |-
    - 泄露的凭据、令牌或密钥可能被用于访问云资源、数据库、代码仓库、CI/CD、邮件或第三方 API。
    - 攻击者可能借助有效凭据读取或篡改业务数据、部署恶意版本、创建持久化访问或产生额外云资源费用。
    - 即使凭据权限有限，也可能暴露账号命名、环境划分和内部系统关系，辅助后续横向移动。
  remediation: |-
    - 立即撤销并轮换暴露文件中可能出现的密码、API Key、访问令牌、SSH Key、数据库连接串和云访问密钥。
    - 将敏感配置迁移到密钥管理系统、环境变量注入或受控配置中心，避免随静态文件对外发布。
    - 限制相关账号权限并启用最小权限、MFA、访问审计和异常调用告警。
    - 排查近期登录、API 调用、代码仓库、云资源和制品库操作记录，确认是否存在未授权使用。
  reference:
    - https://learn.microsoft.com/en-us/nuget/reference/nuget-config-file
    - https://learn.microsoft.com/en-us/nuget/consume-packages/consuming-packages-authenticated-feeds
  classification:
    cvss-metrics: CVSS:3.1/AV:N/AC:L/PR:N/UI:N/S:U/C:H/I:N/A:N
    cvss-score: 7.5
    cwe-id: CWE-522
  metadata:
    verified: false
    max-request: 3
    google-query: intitle:"index of" "nuget.config"
  tags: exposure,config,nuget,dotnet,credentials,files

http:
  - method: GET
    path:
      - "{{BaseURL}}/nuget.config"
      - "{{BaseURL}}/NuGet.Config"
      - "{{BaseURL}}/.nuget/nuget.config"

    stop-at-first-match: true

    matchers:
      - type: dsl
        dsl:
          - 'status_code == 200'
          - 'contains_all(body, "<configuration>", "packageSourceCredentials", "Username")'
          - 'contains_any(tolower(body), "cleartextpassword", "\"password\"")'
          - '!contains_any(tolower(body), "<html", "<!doctype", "<script", "<meta", "application/json", "application/javascript", "application/x-javascript", "application/xml", "text/xml", "image/", "response xmlns", "mongodb over http")'
        condition: and

    extractors:
      - type: regex
        part: body
        group: 1
        regex:
          - 'key="Username"\s+value="([^"]+)"'
