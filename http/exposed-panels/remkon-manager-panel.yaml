id: remkon-manager-panel

info:
  name: RemKon Device Manager 登录面板识别（暴露面识别）
  author: pikpikcu,daffainfo
  severity: info
  description: 该模板通过识别 RemKon Device Manager 登录入口的页面标题、特征文本或重定向行为，判断目标是否暴露了对应的认证界面。若命中，说明该登录面板对外可访问，可用于暴露面梳理与后续安全评估。
  classification:
    cvss-metrics: CVSS:3.0/AV:N/AC:L/PR:N/UI:N/S:U/C:N/I:N/A:N
    cwe-id: CWE-200
    cpe: cpe:2.3:a:nascent:remkon_device_manager:*:*:*:*:*:*:*:*
  metadata:
    max-request: 1
    shodan-query: http.title:"Remkon Device Manager"
    product: remkon_device_manager
    vendor: nascent
  tags: panel,remkon,login,discovery

http:
  - method: GET
    path:
      - '{{BaseURL}}/login.php'

    matchers-condition: and
    matchers:
      - type: status
        status:
          - 200

      - type: word
        part: body
        words:
          - "<title>Remkon Device Manager</title>"
