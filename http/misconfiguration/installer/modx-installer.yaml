id: modx-installer

info:
  name: ModX CMS 未完成安装ation
  author: DhiyaneshDk
  severity: high
  description: |
    检测到 ModX CMS 未完成安装ation。该页面属于安装、初始化或配置向导流程，若对外暴露，攻击者可能完成初始化、创建管理员账户或重新配置目标系统。
  reference:
    - https://modx.com/
    - https://docs.modx.com/3.x/en/getting-started/installation
  metadata:
    verified: true
    max-request: 1
    shodan-query: title:"MODX Revolution"
  tags: modx,install,exposure,misconfig

http:
  - method: GET
    path:
      - "{{BaseURL}}/setup/"

    matchers-condition: and
    matchers:
      - type: word
        words:
          - "ModX Revolution"
          - "installer-steps"
        condition: and
        case-insensitive: true

      - type: status
        status:
          - 200
