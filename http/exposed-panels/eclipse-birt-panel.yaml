id: eclipse-birt-panel

info:
  name: Eclipse BIRT 面板识别（指纹识别）
  author: Shiva (Strobes Security)
  severity: info
  description: |-
    检测到目标站点存在 Eclipse BIRT 相关响应特征。Eclipse BIRT 是报表与商业智能组件，Web 面板用于展示、运行和管理报表内容。模板请求 `/`、`/reportviewer/`、`/birt/` 等路径，并通过页面标题或正文关键字、状态码确认该系统指纹，用于资产识别、系统盘点和暴露面梳理。
  reference:
    - https://eclipse.github.io/birt-website/
  classification:
    cvss-metrics: CVSS:3.0/AV:N/AC:L/PR:N/UI:N/S:U/C:N/I:N/A:N
    cwe-id: CWE-200
    cpe: cpe:2.3:a:eclipse:business_intelligence_and_reporting_tools:*:*:*:*:*:*:*:*
  metadata:
    verified: true
    max-request: 2
    shodan-query: title:"Eclipse BIRT Home"
    google-query: intitle:"Eclipse BIRT Home"
    product: business_intelligence_and_reporting_tools
    vendor: eclipse
  tags: panel,eclipsebirt,detect,discovery
http:
  - method: GET
    path:
      - '{{BaseURL}}'
      - '{{BaseURL}}/reportviewer/'
      - '{{BaseURL}}/birt/'
      - '{{BaseURL}}/birt-viewer/'

    host-redirects: true
    max-redirects: 2
    stop-at-first-match: true

    matchers-condition: and
    matchers:
      - type: word
        words:
          - 'alt="Eclipse Logo'
          - 'Eclipse BIRT Home'
        condition: or
        case-insensitive: true

      - type: status
        status:
          - 200

    extractors:
      - type: regex
        part: body
        group: 1
        regex:
          - 'Viewer Version : ([0-9.-]+)'
