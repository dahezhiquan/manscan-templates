id: file-disable-ssh-forwarding

info:
  name: SSH 转发功能未禁用（本地文件安全扫描）
  author: pussycat0x
  severity: medium
  description: |
    该模板检查 SSH X11、代理或端口转发配置。转发功能若被入侵账户滥用，可能成为横向移动或内网访问通道。
  remediation: |
    在 /etc/ssh/sshd_config 中设置 X11Forwarding no 和 AllowTcpForwarding no，并重启 SSH 服务。
  reference:
    - https://vishalraj82.medium.com/hardening-openssh-security-37f5d634015f
  metadata:
    verified: true
  tags: audit,config,file,ssh

file:
  - extensions:
      - all

    matchers:
      - type: word
        words:
          - "AllowTcpForwarding yes"
          - "X11Forwarding yes"
        condition: or
