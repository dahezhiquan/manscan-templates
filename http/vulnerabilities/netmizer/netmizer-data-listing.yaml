id: netmizer-data-listing

info:
  name: NetMizer LogManagement System Data - Directory Exposure
  author: DhiyaneshDk
  severity: high
  description: |
    该模板用于检测 NetMizer LogManagement System Data - Directory Exposure。该类问题通常源于调试页面、配置文件、接口响应或目录资源被非预期暴露。模板会向 `/data/` 等位置发送探测请求，并结合响应状态、关键字、错误信息、时间差或外带交互等证据判断目标是否受影响。
  impact: |
    - 攻击者可获取系统版本、路径、账号、密钥、配置或业务数据等敏感信息。
    - 泄露的信息可能被用于后续漏洞匹配、凭据攻击、权限提升或横向移动。
  remediation: |
    - 关闭不必要的调试、示例、备份和信息展示接口，避免向未授权用户返回敏感内容。
    - 对敏感文件和接口增加访问控制，并从 Web 根目录移除备份、日志和配置文件。
    - 排查已泄露的凭据、令牌和配置，必要时执行轮换并检查访问日志。
  reference:
    - https://github.com/Threekiii/Awesome-POC/blob/master/%E7%BD%91%E7%BB%9C%E8%AE%BE%E5%A4%87%E6%BC%8F%E6%B4%9E/NetMizer%20%E6%97%A5%E5%BF%97%E7%AE%A1%E7%90%86%E7%B3%BB%E7%BB%9F%20data%20%E7%9B%AE%E5%BD%95%E9%81%8D%E5%8E%86%E6%BC%8F%E6%B4%9E.md
  metadata:
    verified: true
    max-request: 1
    shodan-query: title:"NetMizer"
    fofa-query: title="NetMizer 日志管理系统"
  tags: netmizer,exposure,listing,vuln

http:
  - method: GET
    path:
      - "{{BaseURL}}/data/"

    matchers-condition: and
    matchers:
      - type: word
        part: body
        words:
          - 'Index of /data'
          - 'bin/'
        condition: and

      - type: word
        part: header
        words:
          - 'text/html'

      - type: status
        status:
          - 200
