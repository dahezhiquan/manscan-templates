id: nameserver-fingerprint

info:
  name: NS 记录识别（dns）
  author: pdteam
  severity: info
  description: |
    NS 记录指定负责域名或子域名解析的权威名称服务器，可用于识别 DNS 托管商、委派关系和区域管理边界。公开 NS 记录是 DNS 正常工作的必要信息，不代表存在漏洞。本模板查询 NS 记录，匹配 `IN NS` 响应并提取权威名称服务器。
  impact: |
    - 权威名称服务器会暴露 DNS 服务商和可能的区域管理入口，帮助攻击者关联账户、供应商和其他同托管资产。
    - 过期、错误或未受保护的委派可能导致解析中断、域名控制权混乱，严重时会形成域名接管的前置条件。
  remediation: |
    - 仅保留当前使用且由组织控制的权威名称服务器，删除迁移和停用服务后的旧委派。
    - 保护注册商和 DNS 托管账户，启用多因素认证、注册锁、变更审计和异常 NS 变更告警。
    - 定期核对注册商委派、父区域、权威 DNS 和内部资产台账的一致性。
  classification:
    cwe-id: CWE-200
  metadata:
    max-request: 1
  tags: dns,ns,discovery

dns:
  - name: "{{FQDN}}"
    type: NS
    matchers:
      - type: regex
        part: answer
        regex:
          - "IN\tNS\\t(.+)$"

    extractors:
      - type: regex
        group: 1
        regex:
          - "IN\tNS\t(.+)"
