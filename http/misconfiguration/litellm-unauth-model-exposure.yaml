id: litellm-unauth-model-exposure

info:
  name: LiteLLM Proxy Model 暴露
  author: DevamShah
  severity: medium
  description: |
    该模板用于核查 LiteLLM Proxy Model 暴露。该类问题通常源于管理端、API、控制台或服务接口缺少认证授权，导致未登录用户可直接访问敏感功能。模板会向目标发送探测请求，并依据请求 `/model/info`、匹配 `status_code == 200`、匹配 `contains(content_type, "application/json")`、匹配 `contains_all(body, "\"data\":", "\"litellm_params\":", "\"model_info\":")`等证据确认目标是否存在该配置问题。
  impact: |
    - 攻击者可在未授权状态下查看系统状态、业务数据、任务信息或管理接口。
    - 若接口支持写操作，可能进一步导致配置篡改、服务接管、数据删除或横向移动。
  remediation: |
    - 为相关管理端和 API 启用认证授权，并按最小权限限制可访问功能。
    - 将管理接口限制在内网、VPN 或可信来源范围内，并开启访问审计。
    - 检查历史访问日志，确认是否存在未授权访问、批量枚举或异常操作。
  reference:
    - https://docs.litellm.ai/docs/proxy/virtual_keys
    - https://docs.litellm.ai/docs/proxy/configs
    - https://github.com/BerriAI/litellm
  classification:
    cvss-metrics: CVSS:3.1/AV:N/AC:L/PR:N/UI:N/S:U/C:L/I:N/A:L
    cvss-score: 6.5
    cwe-id: CWE-862
  metadata:
    verified: true
    max-request: 1
    vendor: berriai
    product: litellm
    shodan-query:
      - 'http.title:"LiteLLM API - Swagger UI"'
      - 'http.html:"LiteLLM"'
    fofa-query: title="LiteLLM API"
  tags: litellm,llm,ai,misconfig,exposure

http:
  - method: GET
    path:
      - "{{BaseURL}}/model/info"

    matchers-condition: and
    matchers:
      - type: dsl
        dsl:
          - 'status_code == 200'
          - 'contains(content_type, "application/json")'
          - 'contains_all(body, "\"data\":", "\"litellm_params\":", "\"model_info\":")'
        condition: and

    extractors:
      - type: json
        name: models
        part: body
        json:
          - '.data[].model_name'
