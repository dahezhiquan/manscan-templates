id: sap-public-admin

info:
  name: SAP ICM Admin Web 界面
  author: t3l3machus
  severity: low
  description: |
    检测到 SAP ICM Admin Web 界面。目标响应或文件中可能暴露配置、凭据、密钥、令牌、环境变量或历史记录等敏感信息，可能被用于进一步入侵。
  reference:
    - https://www.saptechnicalguru.com/information-disclosure-sap-web-administration-interface/
  metadata:
    verified: true
    max-request: 1
    shodan-query: html:"SAP"
  tags: sap,misconfig,admin,dashboard,vuln

http:
  - method: GET
    path:
      - "{{BaseURL}}/sap/admin/public/index.html"

    matchers-condition: and
    matchers:
      - type: word
        part: body
        words:
          - "<title>Administration</title>"
          - "sap.ui"
        condition: and

      - type: status
        status:
          - 200
