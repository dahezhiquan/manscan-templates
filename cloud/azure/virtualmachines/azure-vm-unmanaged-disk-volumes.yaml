id: azure-vm-unmanaged-disk-volumes
info:
  name: Azure VM Unmanaged Disk Volumes Detected（云安全）
  author: princechaddha
  severity: medium
  description: Azure Managed Disks 提供平台化的磁盘生命周期、加密、快照和访问治理；VM 的 osDisk 或 dataDisks 缺少 managedDisk.id 时，仍可能使用非托管 VHD。本模板查询磁盘 ID，在匹配 null 或空数组时报告未使用托管磁盘。
  impact: |
    - 非托管 VHD 依赖 Storage 账户 ACL 和 Blob 访问控制，若账户或容器暴露，磁盘数据可能被下载或篡改。
    - 旧式 VHD 的加密、备份、快照、监控和生命周期治理较分散，增加数据泄露、恢复失败和遗留资源风险。
  remediation: |
    - 评估业务兼容性后将非托管 VHD 迁移到 Managed Disks，并为目标磁盘启用适用的加密和备份策略。
    - 迁移期间限制源 Storage 账户网络和访问权限，完成校验后删除不再需要的 VHD、快照和访问密钥。
  reference:
    - https://docs.microsoft.com/en-us/azure/virtual-machines/managed-disks-overview
  metadata:
    vendor: microsoft
    product: azure-virtual-machines
  tags: cloud,devops,azure,microsoft,virtual-machine,azure-cloud-config

flow: |
  code(1);
  for (let VMData of iterate(template.vmList)) {
    set("ids", VMData);
    code(2);
  }

self-contained: true
code:
  - engine:
      - sh
      - bash
    source: |
      az vm list --query '[*].{"id":id}'

    extractors:
      - type: json
        name: vmList
        internal: true
        json:
          - '.[]'

  - engine:
      - sh
      - bash
    source: |
      az vm show --ids "$ids" --query 'storageProfile.{"osDiskType":osDisk.managedDisk.id,"dataDiskType":dataDisks[*].managedDisk.id}'

    matchers:
      - type: word
        words:
          - 'null'
          - '[]'

    extractors:
      - type: dsl
        dsl:
          - 'ids + " is not using managed OS/data disk volume(s)"'
