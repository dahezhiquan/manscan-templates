id: hp-laserjet-detect

info:
  name: HP LaserJet Professional 面板（IOT）
  author: dhiyaneshDk
  severity: low
  description: |
    检测到 HP LaserJet Professional 面板。该面板暴露可用于确认打印设备型号和管理入口，可能进一步暴露设备状态或配置页面。
  impact: |
    - 打印机 Web 面板暴露可能泄露设备型号、网络配置、耗材状态和打印服务入口。
    - 在配置不当时，攻击者可能滥用打印服务、修改设备设置或获取作业信息。
  remediation: |
    - 限制打印机 Web 管理页面仅办公内网或管理网段访问。
    - 启用管理员认证，修改默认口令并升级打印机固件。
    - 关闭不必要的远程管理、匿名访问和未使用的打印协议。
  reference:
    - https://www.exploit-db.com/ghdb/6459
  classification:
    cvss-metrics: CVSS:3.1/AV:N/AC:L/PR:N/UI:N/S:U/C:N/I:N/A:N
    cvss-score: 0
    cwe-id: CWE-200
  metadata:
    max-request: 1
  tags: iot,edb,discovery

http:
  - method: GET
    path:
      - "{{BaseURL}}/SSI/index.htm"

    matchers-condition: and
    matchers:
      - type: word
        words:
          - 'HP LaserJet Professional'
        part: body

      - type: status
        status:
          - 200
