id: firebase-fcm-server-key-disclosure

info:
  name: Firebase Cloud Messaging Server 密钥暴露（暴露面识别）
  author: 0x_Akoko
  severity: medium
  description: |
    检测到目标站点响应中暴露 Firebase Cloud Messaging Server 密钥。Firebase/FCM Server Key 用于推送通知和 Google Firebase 项目集成。该模板请求 `/`、`/firebase-messaging-sw.js`、`/manifest.json`，并在目标响应正文中通过正则表达式匹配对应格式的密钥、令牌、连接串或客户端凭据。公开后可能导致对应平台资源、数据、流水线、消息发送或第三方集成被未授权访问。
  impact: |-
    - 泄露的 API Key、访问令牌、客户端密钥、连接串或服务账号凭据可能被用于直接调用对应平台 API 或访问受保护资源。
    - 攻击者可能借助有效凭据读取、修改或删除数据，触发构建/部署任务，发送消息，管理云资源，或冒用集成应用身份。
    - 即使令牌权限有限，也会暴露账号、项目、组织或环境边界，辅助横向移动、供应链攻击和定向社工。
  remediation: |-
    - 立即撤销并轮换暴露的 API Key、访问令牌、客户端密钥、连接串、Webhook Secret 或服务账号凭据。
    - 在对应平台检查令牌权限、作用域、有效期和最近调用记录，移除不必要的高权限或长期凭据。
    - 将密钥迁移到密钥管理系统、受保护的 CI/CD 变量或运行时注入机制，避免写入前端页面、日志、源码和公开配置。
    - 启用最小权限、IP/来源限制、MFA、告警和审计日志，并排查是否存在未授权资源访问或数据变更。
  reference:
    - https://firebase.google.com/docs/cloud-messaging
  classification:
    cvss-metrics: CVSS:3.1/AV:N/AC:L/PR:N/UI:N/S:U/C:L/I:L/A:N
    cvss-score: 5.4
    cwe-id: CWE-200
  metadata:
    verified: true
    max-request: 3
  tags: firebase,google,fcm,server-key,exposure

http:
  - method: GET
    path:
      - "{{BaseURL}}/"
      - "{{BaseURL}}/firebase-messaging-sw.js"
      - "{{BaseURL}}/manifest.json"

    stop-at-first-match: true

    matchers-condition: and
    matchers:
      - type: regex
        part: body
        regex:
          - 'AAAA[A-Za-z0-9_-]{7}:[A-Za-z0-9_-]{140}'

      - type: word
        part: body
        words:
          - "firebaseConfig"
          - "serverKey"
        condition: or

      - type: status
        status:
          - 200

    extractors:
      - type: regex
        name: fcm-server-key
        part: body
        regex:
          - 'AAAA[A-Za-z0-9_-]{7}:[A-Za-z0-9_-]{140}'
