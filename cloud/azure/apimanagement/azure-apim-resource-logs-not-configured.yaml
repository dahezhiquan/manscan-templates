id: azure-apim-resource-logs-not-configured
info:
  name: Azure API Management 资源日志未配置（云安全）
  author: princechaddha
  severity: medium
  description: APIM 实例未配置 Azure Monitor 诊断设置时，网关请求、错误、管理操作和性能事件可能无法发送到集中日志目标。该模板枚举 APIM 实例，并通过 az monitor diagnostic-settings list 查询 Microsoft.ApiManagement/service 资源；当返回空数组时报告未配置资源日志。
  impact: |
    - API 滥用、异常认证、策略绕过和后端错误缺少可检索证据，安全事件发现与溯源会明显延迟。
    - 无法基于请求量、延迟和失败率建立告警，可能使性能故障和数据访问异常持续扩大。
  remediation: |
    - 为 APIM 配置 Azure Monitor 诊断设置，并将必要的网关、审计、性能和错误日志发送到 Log Analytics 或受控存储。
    - 对日志目标启用访问控制、保留期限和告警规则，避免日志本身泄露令牌、密钥或敏感请求内容。
  reference:
    - https://docs.microsoft.com/en-us/azure/api-management/api-management-howto-use-diagnostic-logs
  metadata:
    vendor: microsoft
    product: azure-api-management
  tags: cloud,devops,azure,microsoft,api-management,azure-cloud-config

flow: |
  code(1);
  for (let Resource of iterate(template.resourceList)) {
    Resource = JSON.parse(Resource);
    set("resource", Resource.name);
    set("resourceGroup", Resource.resourceGroup);
    code(2);
  }

self-contained: true
code:
  - engine:
      - sh
      - bash
    source: |
      az apim list --output json --query '[*].{name:name, resourceGroup:resourceGroup}'

    extractors:
      - type: json
        name: resourceList
        internal: true
        json:
          - '.[]'

  - engine:
      - sh
      - bash
    source: |
      az monitor diagnostic-settings list --resource $resource --resource-group $resourceGroup --resource-type "Microsoft.ApiManagement/service" --query '[*].name'

    matchers-condition: and
    matchers:
      - type: word
        words:
          - "[]"

    extractors:
      - type: dsl
        dsl:
          - 'resource + " in " + resourceGroup + " does not have resource logs configured for Azure API Management services"'
