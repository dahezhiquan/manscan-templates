id: zazzle-phish

info:
  name: Zazzle 仿冒钓鱼网站（钓鱼网站识别）
  author: rxerium
  severity: info
  description: |
    检测到疑似仿冒 Zazzle 的钓鱼网站。模板在目标页面返回 200、页面内容命中 Zazzle 的品牌页面特征，且当前主机不属于 zazzle.com 官方域名时触发，用于识别借用 Zazzle 品牌页面诱导用户信任的仿冒站点。
  reference:
    - https://zazzle.com
  metadata:
    max-request: 1
  tags: phishing,zazzle,osint,discovery
http:
  - method: GET
    path:
      - "{{BaseURL}}"

    host-redirects: true
    max-redirects: 2

    matchers-condition: and
    matchers:
      - type: word
        words:
          - "Celebrate life’s moments with custom invitations, announcements, photo cards, and more. Discover unique gifts crafted by our community of Independent Creators."

      - type: status
        status:
          - 200

      - type: dsl
        dsl:
          - '!contains(host,"zazzle.com")'
