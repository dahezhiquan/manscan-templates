id: file-scheme

info:
  name: Android file URI Scheme 识别（本地文件安全扫描）
  author: gaurang
  severity: low
  description: |
    Android `file://` URI 可将本地文件路径传递给组件或 WebView。单独声明 File Scheme 不代表漏洞，但若应用把外部输入、跨应用共享和 WebView 文件访问组合使用，可能越过预期的文件边界。本模板匹配 XML 中的 `android:scheme="file"`，识别相关入口供后续审计。
  impact: |
    - 处理不可信 `file://` URI 的组件可能读取应用私有文件、缓存或其他本地敏感资源。
    - 通过外部 Intent 共享本地路径时，可能造成路径探测、文件覆盖或跨应用数据泄露。
  remediation: |
    - 优先使用受控的 `content://` URI 和 FileProvider，避免向外部组件暴露原始文件路径。
    - 对 File Scheme 入口执行路径规范化、调用方校验和最小权限控制，禁止将不可信 URI 直接交给高权限 WebView。
  classification:
    cvss-metrics: CVSS:3.1/AV:N/AC:L/PR:N/UI:N/S:U/C:N/I:N/A:N
    cvss-score: 0
    cwe-id: CWE-200
  tags: android,file

file:
  - extensions:
      - xml
    matchers:
      - type: word
        words:
          - "android:scheme=\"file\""

