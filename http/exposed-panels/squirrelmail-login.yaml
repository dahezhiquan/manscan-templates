id: squirrelmail-login

info:
  name: SquirrelMail 登录面板识别（暴露面识别）
  author: dhiyaneshDk,ritikchaddha
  severity: info
  description: 该模板通过识别 SquirrelMail 登录入口的页面标题、特征文本或重定向行为，判断目标是否暴露了对应的认证界面。若命中，说明该登录面板对外可访问，可用于暴露面梳理与后续安全评估。
  reference:
    - https://www.exploit-db.com/ghdb/7407
  classification:
    cvss-metrics: CVSS:3.0/AV:N/AC:L/PR:N/UI:N/S:U/C:N/I:N/A:N
    cwe-id: CWE-200
    cpe: cpe:2.3:a:squirrelmail:squirrelmail:*:*:*:*:*:*:*:*
  metadata:
    max-request: 4
    vendor: squirrelmail
    product: squirrelmail
    shodan-query:
      - title:"SquirrelMail"
      - http.title:"squirrelmail"
      - cpe:"cpe:2.3:a:squirrelmail:squirrelmail"
    fofa-query: title="squirrelmail"
    google-query: intitle:"squirrelmail"
  tags: squirrelmail,edb,panel,discovery

http:
  - method: GET
    path:
      - "{{BaseURL}}"
      - "{{BaseURL}}/src/login.php"
      - "{{BaseURL}}/webmail/src/login.php"
      - "{{BaseURL}}/squirrelmail/src/login.php"

    host-redirects: true
    max-redirects: 2
    stop-at-first-match: true

    matchers-condition: and
    matchers:
      - type: word
        part: body
        words:
          - "SquirrelMail"

      - type: status
        status:
          - 200
