id: sphinxonline-panel

info:
  name: SphinxOnline 登录面板识别（指纹识别）
  author: righettod
  severity: info
  description: |-
    SphinxOnline 是 Web 业务管理入口，用于用户登录、配置和应用后台操作。该模板请求 `/SphinxAuth/Account/Login`，并依据 HTTP 200 状态码、页面标题、正文关键字或品牌资源特征识别目标是否部署了该系统或暴露了对应入口，适用于资产指纹确认；命中结果仅表示系统特征匹配，不代表已确认存在未授权访问或可利用漏洞。
  reference:
  - https://www.lesphinx-developpement.fr/
  metadata:
    verified: true
    max-request: 1
    shodan-query: http.title:"Connection - SphinxOnline"
  tags: panel,sphinxonline,login,detect,discovery

http:
  - method: GET
    path:
      - '{{BaseURL}}/SphinxAuth/Account/Login'

    matchers-condition: and
    matchers:
      - type: word
        part: body
        words:
          - '<title>Connection - SphinxOnline</title>'
          - 'SphinxOnline</span>'
        condition: or
        case-insensitive: true

      - type: status
        status:
          - 200

    extractors:
      - type: regex
        part: body
        group: 1
        regex:
          - 'Sphinxonline ([a-f0-9.]+)</a>'
