id: druid-default-login

info:
  name: Alibaba Druid Monitor 默认口令登录（弱口令）
  author: pikpikcu,j4vaovo
  severity: high
  description: 该模板通过尝试 Alibaba Druid Monitor 的默认账号口令（如 admin/admin），并依据认证成功后的响应特征判断目标是否仍在使用未修改的弱口令。若命中，攻击者可直接登录系统，进一步访问敏感信息、修改配置或执行未授权操作。
  classification:
    cwe-id: CWE-798
  metadata:
    max-request: 2
    fofa-query: title="druid monitor"
  tags: druid,alibaba,default-login,vuln
flow: http(1) && http(2)

http:
  - raw:
      - |
        GET /druid/submitLogin HTTP/1.1
        Host: {{Hostname}}

    matchers:
      - type: word
        internal: true
        words:
          - 'error'

  - raw:
      - |
        POST /druid/submitLogin HTTP/1.1
        Host: {{Hostname}}

        loginUsername={{username}}&loginPassword={{password}}

    payloads:
      username:
        - admin
      password:
        - admin
    attack: pitchfork

    matchers-condition: and
    matchers:
      - type: status
        status:
          - 200

      - type: regex
        regex:
          - "^success$"
