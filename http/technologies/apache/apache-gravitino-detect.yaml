id: apache-gravitino-detect

info:
  name: Apache Gravitino 指纹识别（指纹识别）
  author: icarot
  severity: info
  description: |
    用于识别目标是否使用 Apache Gravitino，模板会结合页面标题、状态码和特定路径或已知端点进行技术指纹匹配。
  metadata:
    max-request: 1
    vendor: apache
    product: gravitino
    shodan-query: title:"Gravitino"
  tags: tech,gravitino,apache,detect,discovery

http:
  - method: GET
    path:
      - "{{BaseURL}}/ui/metalakes"

    matchers-condition: and
    matchers:
      - type: word
        words:
          - '<title>Gravitino'

      - type: status
        status:
          - 200
