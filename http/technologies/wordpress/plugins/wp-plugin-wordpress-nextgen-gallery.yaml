id: wp-plugin-wordpress-nextgen-gallery

info:
  name: WordPress NextGEN Gallery 插件指纹识别（指纹识别）
  author: ricardomaia
  severity: info
  description: >-
    NextGEN Gallery 是 WordPress 插件，主要用于图片画廊、媒体展示、PDF 嵌入或媒体文件替换管理。该模板通过请求目标服务并检查预设路径或首页响应、正则特征、DSL
    条件等指纹特征，判断目标是否使用或暴露了 WordPress NextGEN Gallery 插件 相关组件；命中结果仅表示指纹特征匹配，可用于资产盘点、技术栈识别和后续安全评估，不代表已确认存在可利用漏洞。
  reference:
  - https://wordpress.org/plugins/nextgen-gallery/
  metadata:
    plugin_namespace: nextgen-gallery
    wpscan: https://wpscan.com/plugin/nextgen-gallery
  tags: tech,wordpress,wp-plugin,top-200,discovery
http:
  - method: GET
    path:
      - "{{BaseURL}}/wp-content/plugins/nextgen-gallery/readme.txt"

    payloads:
      last_version: helpers/wordpress/plugins/nextgen-gallery.txt

    extractors:
      - type: regex
        part: body
        internal: true
        name: internal_detected_version
        group: 1
        regex:
          - '(?i)Stable.tag:\s?([\w.]+)'

      - type: regex
        part: body
        name: detected_version
        group: 1
        regex:
          - '(?i)Stable.tag:\s?([\w.]+)'

    matchers-condition: or
    matchers:
      - type: dsl
        name: "outdated_version"
        dsl:
          - compare_versions(internal_detected_version, concat("< ", last_version))

      - type: regex
        part: body
        regex:
          - '(?i)Stable.tag:\s?([\w.]+)'
