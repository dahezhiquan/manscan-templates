id: xerox-workcentre-detect

info:
  name: Xerox WorkCentre 指纹识别（指纹识别）
  author: pussycat0x
  severity: info
  description: >-
    Xerox WorkCentre 是多功能打印/复印设备系列，Web 管理界面用于查看设备状态、网络配置和打印管理。该模板通过请求目标服务并检查预设路径或首页响应、页面正文关键字、状态码等指纹特征，判断目标是否使用或暴露了
    Xerox WorkCentre 相关组件；命中结果仅表示指纹特征匹配，可用于资产盘点、技术栈识别和后续安全评估，不代表已确认存在可利用漏洞。
  classification:
    cpe: cpe:2.3:h:xerox:workcentre_7970i:*:*:*:*:*:*:*:*
  metadata:
    verified: true
    max-request: 1
    vendor: xerox
    product: workcentre_7970i
    shodan-query: title:"XEROX WORKCENTRE"
  tags: tech,xerox,workcentre,discovery
http:
  - method: GET
    path:
      - "{{BaseURL}}/index.dhtml"

    matchers-condition: and
    matchers:
      - type: word
        part: body
        words:
          - "XEROX WORKCENTRE"
          - "/header.php?tab=status"
        condition: and

      - type: status
        status:
          - 200
