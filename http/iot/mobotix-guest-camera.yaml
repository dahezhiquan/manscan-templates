id: mobotix-guest-camera

info:
  name: MOBOTIX 访客摄像机实时画面（IOT）
  author: dhiyaneshDK
  severity: medium
  description: |
    检测到 MOBOTIX Guest Camera 实时画面。该页面公开时可能导致摄像头视频或静态画面被未授权查看。
  impact: |
    - 攻击者无需认证即可访问设备页面或功能，可能读取状态、配置和网络信息。
    - 若接口允许写操作，可能进一步导致设备配置被篡改或服务被滥用。
  remediation: |
    - 启用设备 Web 管理认证并修改默认口令，关闭匿名访问。
    - 升级固件并检查是否存在已知未授权访问漏洞。
    - 将管理页面限制在内网、管理 VLAN 或 VPN 内，并开启访问审计。
  reference:
    - https://www.exploit-db.com/ghdb/6848
  classification:
    cvss-metrics: CVSS:3.1/AV:N/AC:L/PR:N/UI:N/S:U/C:N/I:N/A:N
    cvss-score: 0
    cwe-id: CWE-200
  metadata:
    max-request: 1
  tags: iot,edb,discovery

http:
  - method: GET
    path:
      - '{{BaseURL}}/cgi-bin/guestimage.html'

    matchers-condition: and
    matchers:
      - type: word
        words:
          - 'MOBOTIX'

      - type: status
        status:
          - 200
