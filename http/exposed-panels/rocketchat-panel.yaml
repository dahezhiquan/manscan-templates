id: rocketchat-panel

info:
  name: RocketChat 登录面板识别（暴露面识别）
  author: righettod
  severity: info
  description: 该模板通过识别 RocketChat 登录入口的页面标题、特征文本或重定向行为，判断目标是否暴露了对应的认证界面。若命中，说明该登录面板对外可访问，可用于暴露面梳理与后续安全评估。
  reference:
    - https://www.rocket.chat/
  classification:
    cpe: cpe:2.3:a:rocket.chat:rocket.chat:*:*:*:*:*:*:*:*
  metadata:
    verified: true
    max-request: 1
    vendor: rocket.chat
    product: rocket.chat
    shodan-query: http.title:"Rocket.Chat"
  tags: panel,rocketchat,login,detect,discovery

http:
  - method: GET
    path:
      - "{{BaseURL}}"

    host-redirects: true
    max-redirects: 2
    matchers:
      - type: dsl
        dsl:
          - 'status_code == 200'
          - 'contains_any(body, "<title>Rocket.Chat", "content=\"Rocket.Chat")'
        condition: and
