id: mssql-detect

info:
  name: Microsoft SQL Server 服务识别（指纹识别）
  author: Ice3man543,tarunKoyalwar
  severity: info
  description: |
    通过 MSSQL 客户端向 TCP 1433 端口发送 TDS PRELOGIN 请求，在响应通过协议校验后识别 Microsoft SQL Server，并从服务端返回的 VERSION 字段提取主版本、次版本和构建号，例如 15.0.2000。仅输出实际返回的有效版本；版本为空或主版本为零时保留服务识别结果，不推测产品年份或补丁修订号。探测不提交登录凭据，也不执行 SQL 查询。
  metadata:
    max-request: 1
    shodan-query: port:1433
    vendor: microsoft
    product: mssql
  tags: js,mssql,detect,network,discovery

javascript:
  - code: |
      var m = require("nuclei/mssql");
      var c = m.MSSQLClient();
      var info = c.FingerprintMssql(Host, Port);
      var version = info.Version || "";
      var hasVersion = typeof version === "string" && /^[1-9][0-9]*\.[0-9]+\.[0-9]+$/.test(version);
      Export("mssql" + (hasVersion ? " " + version : ""));
    args:
      Host: "{{Host}}"
      Port: "1433"
    matchers:
      - type: dsl
        dsl:
          - 'regex("^mssql( [1-9][0-9]*[.][0-9]+[.][0-9]+)?$", response)'
          - "success == true"
        condition: and

    extractors:
      - type: regex
        name: version
        part: response
        group: 1
        regex:
          - '^mssql ([1-9][0-9]*\.[0-9]+\.[0-9]+)$'
