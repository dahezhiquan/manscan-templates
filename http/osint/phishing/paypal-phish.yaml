id: Paypal-phish

info:
  name: PayPal 仿冒钓鱼网站（钓鱼网站识别）
  author: rxerium
  severity: info
  description: |
    检测到疑似仿冒 PayPal 的钓鱼网站。模板在目标页面返回 200、页面内容命中 PayPal 的登录或账号页面特征，且当前主机不属于 paypal.com 官方域名时触发，用于识别借用 PayPal 品牌页面诱导用户信任的仿冒站点。
  reference:
    - https://paypal.com
  metadata:
    max-request: 1
  tags: phishing,paypal,osint,discovery
http:
  - method: GET
    path:
      - "{{BaseURL}}"

    host-redirects: true
    max-redirects: 2

    matchers-condition: and
    matchers:
      - type: word
        words:
          - "Log in to PayPal automatically for faster checkout without entering your password wherever you're logged in with your Google account."

      - type: status
        status:
          - 200

      - type: dsl
        dsl:
          - '!contains(host,"paypal.com")'
