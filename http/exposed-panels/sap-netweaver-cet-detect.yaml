id: sap-netweaver-cet-detect

info:
  name: SAP NetWeaver Composition Environment Tools 面板识别（指纹识别）
  author: ap3r
  severity: info
  description: |-
    SAP NetWeaver Composition Environment Tools 是 SAP NetWeaver 组合环境工具入口，用于企业 Java 应用与集成组件管理。该模板请求 `/rep/start/index.jsp` 路径，并依据 HTTP 200 状态码、页面标题、正文关键字或品牌资源特征、响应头特征识别目标是否部署了该系统或暴露了对应入口，适用于资产指纹确认；命中结果仅表示系统特征匹配，不代表已确认存在未授权访问或可利用漏洞。
  reference:
  - https://help.sap.com/doc/saphelp_scm700_ehp02/7.0.2/en-US/f6/2a7cb018bc4b239ea5b7af675a18ef/content.htm?no_cache=true
  metadata:
    max-request: 1
    shodan-query: http.favicon.hash:-266008933
  tags: sap,netweaver,cet,detect,discovery

http:
  - method: GET
    path:
      - "{{BaseURL}}/rep/start/index.jsp"

    matchers-condition: and
    matchers:
      - type: word
        part: body
        words:
          - "Composition Environment Tools"

      - type: word
        part: header
        words:
          - "text/html"

      - type: status
        status:
          - 200
