id: wp-registration-enabled

info:
  name: WordPress 用户注册开放
  author: tess,DhiyaneshDK
  severity: low
  description: |-
    该模板用于核查 WordPress 用户注册开放。WordPress 站点启用公开用户注册后，外部用户可通过注册入口创建账号；若站点角色、插件能力或审批流程配置不当，可能扩大后台攻击面。模板访问 /wp-login.php，并根据注册链接、HTML 内容类型和状态码确认注册入口可用。
  remediation: |-
    - 如无业务需要，关闭 WordPress 公开注册功能。
    - 将默认新用户角色限制为最低权限，并启用验证码、邮件验证和注册审核。
    - 监控异常注册行为，清理可疑账户并复核用户角色配置。
  reference:
    - https://www.acunetix.com/vulnerabilities/web/wordpress-user-registration-enabled/
  classification:
    cvss-metrics: CVSS:3.1/AV:N/AC:L/PR:N/UI:N/S:U/C:N/I:N/A:N
    cvss-score: 0
    cwe-id: CWE-200
  metadata:
    verified: true
    max-request: 1
  tags: wordpress,misconfig,vuln
  impact: |-
    - 攻击者可批量注册账户，用于垃圾内容发布、撞库、权限探测或社工投递。
    - 若默认角色权限过高或插件存在权限缺陷，注册账户可能成为进一步提权的入口。
http:
  - method: GET
    path:
      - "{{BaseURL}}/wp-login.php"

    matchers-condition: and
    matchers:
      - type: word
        part: body
        words:
          - '?action=register"'

      - type: word
        part: header
        words:
          - 'text/html'

      - type: status
        status:
          - 200
