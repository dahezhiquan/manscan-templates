id: unauthenticated-glances

info:
  name: Glances 未授权 面板
  author: remonsec
  severity: low
  description: |
    检测到 Glances 未授权 面板。目标功能在未认证状态下可访问，可能暴露管理入口、业务数据、系统状态或可执行操作，需确认是否存在访问控制缺失。
  reference:
    - https://glances.readthedocs.io/en/latest/quickstart.html#how-to-protect-your-server-or-web-server-with-a-login-password
  metadata:
    max-request: 1
  tags: exposure,glances,misconfig,vuln

http:
  - method: GET
    path:
      - '{{BaseURL}}'

    matchers-condition: and
    matchers:
      - type: status
        status:
          - 200

      - type: word
        part: body
        words:
          - "<title>Monitor</title>"
