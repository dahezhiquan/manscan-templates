id: gcloud-dnssec-keysigning-rsasha1

info:
  name: DNSSEC RSASHA1 Algorithm Deprecated Usage（云安全）
  author: princechaddha
  severity: medium
  description: DNSSEC 使用 RSASHA1 算法属于过时配置，密钥签名或区域签名应迁移到更强算法。本模板枚举 Cloud DNS 托管区域并检查 dnssecConfig，发现 rsasha1 时报告 DNSSEC 使用了已弃用算法。
  impact: |
    - 过时签名算法降低 DNSSEC 保护强度，可能不满足现代安全基线或审计要求。
    - 长期保留弱算法会增加未来兼容性和密钥轮换风险。
  remediation: |
    - 将 DNSSEC 算法迁移到 Google Cloud DNS 支持的更强签名算法，并按变更流程完成 DS 记录更新。
    - 迁移期间监控解析和签名状态，确认旧 RSASHA1 配置已完全移除。
  reference:
    - https://cloud.google.com/dns/docs/dnssec-config
  metadata:
    vendor: google
    product: cloud-dns
  tags: cloud,devops,gcp,gcloud,dns,dnssec,gcp-cloud-config,discovery

flow: |
  code(1)
  for(let projectId of iterate(template.projectIds)){
    set("projectId", projectId)
    code(2)
    for(let managedZone of iterate(template.managedZones)){
      set("managedZone", managedZone)
      code(3)
    }
  }

self-contained: true

code:
  - engine:
      - sh
      - bash
    source: |
      gcloud projects list --format="json(projectId)"

    extractors:
      - type: json
        name: projectIds
        internal: true
        json:
          - '.[].projectId'

  - engine:
      - sh
      - bash
    source: |
      gcloud dns managed-zones list --project $projectId --format="json(name)"

    extractors:
      - type: json
        name: managedZones
        internal: true
        json:
          - '.[].name'

  - engine:
      - sh
      - bash
    source: |
      gcloud dns managed-zones describe $managedZone --project $projectId --format="json(dnssecConfig)"

    matchers:
      - type: word
        words:
          - 'rsasha1'

    extractors:
      - type: dsl
        dsl:
          - '"Deprecated RSASHA1 algorithm found in DNS managed zone: " + managedZone + " in Project: " + projectId'
