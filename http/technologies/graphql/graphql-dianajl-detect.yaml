id: graphql-dianajl-detect
info:
  name: Diana.jl GraphQL 指纹识别（指纹识别）
  author: princechaddha
  severity: info
  description: >-
    Diana.jl 是 Julia 生态中的 GraphQL 服务端实现，用于在 Julia 应用中提供 GraphQL API。该模板通过请求目标服务并检查预设路径或首页响应、页面正文关键字、HTTP
    响应头、状态码等指纹特征，判断目标是否使用或暴露了 Diana.jl GraphQL 相关组件；命中结果仅表示指纹特征匹配，可用于资产盘点、技术栈识别和后续安全评估，不代表已确认存在可利用漏洞。
  reference:
  - https://github.com/dolevf/graphw00f/blob/main/graphw00f/lib.py
  tags: tech,graphql,dianajl
http:
  - method: POST
    path:
      - "{{BaseURL}}/graphql"
      - "{{BaseURL}}/api/graphql"
      - "{{BaseURL}}/query"
      - "{{BaseURL}}/"
    body: '{"query":"queryy { __typename }"}'
    headers:
      Content-Type: application/json
    redirects: true

    matchers-condition: and
    matchers:
      - type: status
        status:
          - 200
          - 400

      - type: word
        words:
          - 'Syntax Error GraphQL request (1:1) Unexpected Name "queryy"'
        part: body
