id: dionaea-mysql-honeypot-detect

info:
  name: Dionaea MySQL 蜜罐识别（蜜罐识别）
  author: UnaPibaGeek
  severity: info
  description: |
    Dionaea 可模拟 MySQL 服务以捕获数据库扫描、弱口令和恶意客户端行为。该模板读取 MySQL 握手响应，并通过固定版本 `5.7.16` 与 `aaaaaaaa` 等默认仿真特征识别 Dionaea MySQL 蜜罐。
  metadata:
    max-request: 1
    vendor: dionaea
    product: mysql
    shodan-query: product:"mysql"
  tags: dionaea,mysql,honeypot,ir,cti,network,tcp,discovery
tcp:
  - inputs:
      - data: "\x4a\x00\x00\x00\x0a\x35\x2e\x31\x2e\x32\x39\x00\x0b\x00\x00\x00\x21\x3e\x34\x1b\x51\x3f\x34\x33\x60\x00\x00\x00\x00\x00\x00\x00\x00\x00\x00\x00\x00\x00\x00\x00\x00"

    host:
      - "{{Hostname}}"
    port: 3306
    read-size: 1024

    matchers-condition: and
    matchers:
      - type: word
        words:
          - "5.7.16"

      - type: word
        words:
          - "aaaaaaaa"
