id: wp-plugin-wordpress-divi-form-builder-detect

info:
  name: WordPress Divi Form Builder 插件指纹识别（指纹识别）
  author: rxerium
  severity: info
  description: >-
    Divi Form Builder 是 WordPress 插件，主要用于页面构建、区块扩展、模板导入或可视化站点搭建。该模板通过请求目标服务并检查预设路径或首页响应、页面正文关键字、状态码、正则特征等指纹特征，判断目标是否使用或暴露了
    WordPress Divi Form Builder 插件 相关组件；命中结果仅表示指纹特征匹配，可用于资产盘点、技术栈识别和后续安全评估，不代表已确认存在可利用漏洞。
  reference:
  - https://diviengine.com/product/divi-form-builder/
  metadata:
    verified: true
    max-request: 1
    shodan-query: 'http.html:"wp-content/plugins/divi-form-builder"'
  tags: tech,wordpress,wp-plugin,divi-form-builder,divi
http:
  - method: GET
    path:
      - "{{BaseURL}}/"

    matchers-condition: and
    matchers:
      - type: word
        part: body
        words:
          - "wp-content/plugins/divi-form-builder"

      - type: status
        status:
          - 200

    extractors:
      - type: regex
        name: version
        part: body
        group: 1
        regex:
          - 'divi-form-builder[^"'']*\?ver=([0-9.]+)'
