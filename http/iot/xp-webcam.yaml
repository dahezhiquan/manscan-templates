id: xp-webcam

info:
  name: XP Webcam 查看页面暴露（IOT）
  author: aashiq
  severity: medium
  description: |
    检测到暴露的 webcamXP 查看页面。模板通过 /mobile.html 端点和页面中的 webcamXP 特征识别可公开访问的摄像头页面。
  metadata:
    max-request: 1
  tags: webcam,iot,discovery

http:
  - method: GET
    path:
      - "{{BaseURL}}/mobile.html"

    matchers-condition: and
    matchers:
      - type: word
        words:
          - "webcams and ip cameras server for windows"
        part: body

      - type: word
        words:
          - "Please provide a valid username/password to access this server."
        part: body
        negative: true
