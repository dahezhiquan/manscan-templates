id: ptr-fingerprint

info:
  name: PTR 记录识别（dns）
  author: pdteam
  severity: info
  description: |
    PTR 记录将 IP 地址映射回主机名，常用于邮件服务器反向解析、资产归属核对和网络指纹识别。公开 PTR 记录本身通常是正常配置，但主机名可能暴露内部命名和服务关系。本模板查询 PTR 记录，匹配 `IN PTR` 响应并提取反向解析结果。
  impact: |
    - 反向主机名可帮助攻击者关联 IP、主机角色、区域和邮件基础设施，补充网络资产画像。
    - PTR 与正向解析或邮件 HELO 身份不一致时，可能导致邮件投递失败、信誉下降或运维定位错误。
  remediation: |
    - 仅为确有需要的公网地址配置 PTR，并避免在名称中泄露内部环境、主机用途或敏感项目名称。
    - 对邮件服务器保持 PTR、正向 A/AAAA、HELO 和邮件认证配置一致，迁移或释放地址时及时清理记录。
    - 定期审查云厂商和网络服务商侧的反向 DNS 委派，确保记录仍由组织控制。
  classification:
    cwe-id: CWE-200
  metadata:
    max-request: 1
  tags: dns,ptr,discovery

dns:
  - name: "{{FQDN}}"
    type: PTR
    matchers:
      - type: regex
        part: answer
        regex:
          - "IN\tPTR\\t(.+)$"

    extractors:
      - type: regex
        group: 1
        regex:
          - "IN\tPTR\t(.+)"
