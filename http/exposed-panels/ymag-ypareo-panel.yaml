id: ymag-ypareo-panel

info:
  name: YPAREO 登录面板识别（指纹识别）
  author: righettod
  severity: info
  description: |-
    YPAREO 是教育培训管理平台，用于学员、课程、排课、考勤和教务业务管理。该模板请求 `/index.php`、`/net-ypareo/index.php`、`/netypareo/index.php` 等路径，并依据 DSL 条件识别目标是否部署了该系统或暴露了对应入口，适用于资产指纹确认；命中结果仅表示系统特征匹配，不代表已确认存在未授权访问或可利用漏洞。
  reference:
  - https://www.ypareo.com/legacy
  - https://www.ymag.fr/
  metadata:
    verified: true
    max-request: 4
    shodan-query: http.html:"ypareo"
  tags: panel,ymag,ypareo,login,detect,discovery

http:
  - method: GET
    path:
      - "{{BaseURL}}/index.php"
      - "{{BaseURL}}/net-ypareo/index.php"
      - "{{BaseURL}}/netypareo/index.php"
      - "{{BaseURL}}/index.html"

    stop-at-first-match: true

    matchers:
      - type: dsl
        dsl:
          - 'status_code == 200'
          - 'contains_any(to_lower(body), "<title>ypareo", "<title>NetYParéo")'
        condition: and

    extractors:
      - type: regex
        part: body
        group: 1
        regex:
          - 'script.js\?v=([0-9.]+)'
