id: exposed-glances-api

info:
  name: 暴露 Glances API 泄露（暴露面识别）
  author: princechaddha
  severity: low
  description: 检测到可直接访问的 暴露 Glances API。日志、异常页面或调试输出通常会泄露堆栈信息、内部路径、查询语句、账号标识、令牌片段或业务数据，不应向未授权用户开放。
  reference:
    - https://nicolargo.github.io/glances/
  metadata:
    max-request: 1
  tags: glances,exposure,vuln

http:
  - method: GET
    path:
      - "{{BaseURL}}"

    matchers-condition: and
    matchers:
      - type: status
        status:
          - 200

      - type: word
        words:
          - 'title">Glances</title>'
          - 'glances.config'
          - '<glances></glances>'
        part: body
        condition: and
