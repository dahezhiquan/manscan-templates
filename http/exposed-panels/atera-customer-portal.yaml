id: atera-customer-portal

info:
  name: Atera 客户门户 - 登录面板（指纹识别）
  author: rxerium
  severity: info
  description: |-
    检测到目标站点存在 Atera 客户门户 - 相关响应特征。Atera 客户门户 - 是监控、日志、分析或仪表盘系统，用于展示运行指标、访问统计、日志事件和服务状态。模板请求 `/`，并通过页面标题或正文关键字、状态码确认该系统指纹，用于资产识别、系统盘点和暴露面梳理。
  reference:
    - https://support.atera.com/hc/en-us
  metadata:
    verified: true
    max-request: 1
    shodan-query: http.title:"Atera - Customers Portal"
  tags: panel,atera,rmm,login,detect
http:
  - method: GET
    path:
      - "{{BaseURL}}"

    matchers-condition: and
    matchers:
      - type: word
        part: body
        words:
          - '<title>Atera - Customers Portal</title>'
          - 'window.ateraAnalyticsFirstLoad'
        condition: and

      - type: status
        status:
          - 200
