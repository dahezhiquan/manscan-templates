id: ldap-metadata

info:
  name: LDAP 元数据枚举（服务漏洞）
  author: pussycat0x
  severity: medium
  description: |
    该模板枚举 LDAP 目录服务的基础元数据、命名上下文、域功能级别与 Schema 信息。模板调用 LDAP CollectMetadata 能力并提取 BaseDN、DnsHostName、DefaultNamingContext 等字段，用于评估目录服务暴露面。
  impact: |
    - 暴露的 LDAP 元数据可泄露域名、命名上下文、域功能级别和目录结构。
    - 攻击者可利用这些信息构建账号枚举、权限路径分析或域内横向移动计划。
  remediation: |
    - 禁止匿名或低权限账户读取不必要的目录元数据，收紧 RootDSE 与 Schema 查询暴露范围。
    - 将 LDAP/LDAPS 限制在可信网络内，启用访问审计并使用最小权限目录查询账号。
  reference:
    - https://docs.projectdiscovery.io/templates/protocols/javascript/modules/ldap.Metadata
  metadata:
    max-request: 1
    shodan-query: ldap
  tags: js,network,ldap,discovery

javascript:
  - code: |
      const ldap = require('nuclei/ldap');
      const cfg = new ldap.Config();
      cfg.Upgrade = true;
      const client = new ldap.Client(Host, Port);
      const metadata = client.CollectMetadata();
      Export((metadata))

    args:
      Host: "ldap://{{Host}}"
      Port: 389

    matchers:
      - type: dsl
        dsl:
          - "len(BaseDn) != 0"
          - "len(DnsHostName) != 0"
          - "len(DefaultNamingContext) != 0"
          - "len(DomainFunctionality) != 0"
          - "len(ForestFunctionality) != 0"
          - "len(DomainControllerFunctionality) != 0"
          - "success == true"

    extractors:
      - type: json
        internal: true
        name: BaseDn
        json:
          - '.BaseDN'

      - type: json
        internal: true
        name: DnsHostName
        json:
          - '.DnsHostName'

      - type: json
        internal: true
        name: DefaultNamingContext
        json:
          - '.DefaultNamingContext'

      - type: json
        internal: true
        name: DomainFunctionality
        json:
          - '.DomainFunctionality'

      - type: json
        internal: true
        name: ForestFunctionality
        json:
          - '.ForestFunctionality'

      - type: json
        internal: true
        name: DomainControllerFunctionality
        json:
          - '.DomainControllerFunctionality'

      - type: json
        json:
          - '"BaseDN: " + .BaseDN'
          - '"DnsHostName: " + .DnsHostName'
          - '"DefaultNamingContext: "+ .DefaultNamingContext'
          - '"DomainFunctionality: "+ .DomainFunctionality'
          - '"ForestFunctionality: " + .ForestFunctionality'
          - '"DomainControllerFunctionality: "+ .DomainControllerFunctionality'
