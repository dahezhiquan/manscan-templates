id: meduza-stealer

info:
  name: Meduza Stealer 面板识别（暴露面识别）
  author: dwisiswant0
  severity: info
  description: |
    该模板通过识别 Meduza Stealer 相关页面或响应特征，判断目标是否暴露了疑似 C2、窃密或钓鱼基础设施面板。若命中，可作为外部暴露面排查、威胁狩猎与恶意基础设施识别的线索。
  metadata:
    verified: "true"
    max-request: 1
    shodan-query: http.title:"Meduza Stealer"
  tags: rat,meduza-stealer,c2,panel,vuln

http:
  - method: GET
    path:
      - "{{BaseURL}}"

    host-redirects: true

    matchers-condition: and
    matchers:
      - type: xpath
        part: body
        xpath:
          - "/html/head/title[contains(text(), 'Meduza Stealer')]"

      - type: status
        status:
          - 200
