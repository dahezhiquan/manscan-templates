id: kopano-webapp-panel

info:
  name: Kopano WebApp 登录面板识别（暴露面识别）
  author: righettod
  severity: info
  description: 该模板通过识别 Kopano WebApp 登录入口的页面标题、特征文本或重定向行为，判断目标是否暴露了对应的认证界面。若命中，说明该登录面板对外可访问，可用于暴露面梳理与后续安全评估。
  reference:
    - https://kopano.com/
  classification:
    cpe: cpe:2.3:a:kopano:webapp:*:*:*:*:*:*:*:*
  metadata:
    verified: true
    max-request: 1
    vendor: kopano
    product: webapp
    shodan-query: http.title:"Kopano WebApp"
  tags: panel,kopano,login,detect,discovery

http:
  - method: GET
    path:
      - "{{BaseURL}}/webapp/"

    host-redirects: true
    max-redirects: 2
    matchers:
      - type: dsl
        dsl:
          - 'status_code == 200'
          - 'contains_any(body, "<title>Kopano WebApp", "content=\"Kopano WebApp")'
        condition: and

    extractors:
      - type: regex
        part: body
        group: 1
        regex:
          - '\?kv([0-9.]+)"'
