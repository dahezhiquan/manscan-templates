id: rails-history-exposure

info:
  name: Rails/Ruby Console History 暴露（暴露面识别）
  author: theamanrawat
  severity: medium
  description: |
    检测到目标站点可直接访问 Rails/Ruby Console History。Ruby on Rails 配置文件通常包含数据库连接、密钥、环境配置和框架运行参数。该模板请求 `/.irb_history`、`/.pry_history`，并通过 HTTP 状态码、响应正文关键字、文件格式特征、正则匹配或响应头进行确认。此类文件公开后可能泄露源码结构、依赖版本、内部路径、业务配置、访问凭据或调试数据，扩大暴露面并降低攻击者的后续利用成本。
  impact: |-
    - 调试、状态、历史或转储文件可能泄露环境变量、内存片段、命令历史、内部路径、组件版本和运行参数。
    - 攻击者可利用这些细节筛选已知漏洞、还原业务流程、定位敏感文件或制定更精确的后续攻击路径。
    - 部分历史或转储内容可能直接包含凭据、请求数据、SQL 语句或用户信息，扩大敏感数据泄露范围。
  remediation: |-
    - 关闭生产环境中的调试、状态、历史、转储、phpinfo、探针和未受保护的运行信息页面。
    - 将历史记录、崩溃转储和调试产物从 Web 可访问目录移除，并清理 CDN、对象存储和搜索引擎缓存。
    - 检查文件中是否包含凭据、请求数据、SQL 语句或用户信息，必要时执行密钥轮换和受影响账号处置。
    - 复核相关组件版本和配置，修复因暴露信息指向的弱配置或已知漏洞。
  reference:
    - https://pry.github.io
    - https://docs.ruby-lang.org/en/2.6.0/IRB.html
  tags: exposure,rails,ruby,config

http:
  - method: GET
    path:
      - "{{BaseURL}}/.irb_history"
      - "{{BaseURL}}/.pry_history"

    stop-at-first-match: true
    matchers:
      - type: dsl
        dsl:
          - 'status_code == 200'
          - 'contains_all(body, "User.find", "Rails.application")'
          - '!contains_any(body,"<!DOCTYPE","<html","<script>")'
        condition: and
