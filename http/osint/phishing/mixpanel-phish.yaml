id: mixpanel-phish

info:
  name: Mixpanel 仿冒钓鱼网站（钓鱼网站识别）
  author: rxerium
  severity: info
  description: |
    检测到疑似仿冒 Mixpanel 的钓鱼网站。模板在目标页面返回 200、页面内容命中 Mixpanel 的品牌页面特征，且当前主机不属于 mixpanel.com 官方域名时触发，用于识别借用 Mixpanel 品牌页面诱导用户信任的仿冒站点。
  reference:
    - https://mixpanel.com
  metadata:
    max-request: 1
  tags: phishing,mixpanel,analytics,osint,discovery
http:
  - method: GET
    path:
      - "{{BaseURL}}"

    host-redirects: true
    max-redirects: 2

    matchers-condition: and
    matchers:
      - type: word
        words:
          - '<title>Product Analytics &amp; Robust Event Tracking | Mixpanel'

      - type: status
        status:
          - 200

      - type: dsl
        dsl:
          - '!contains(host,"mixpanel.com")'
