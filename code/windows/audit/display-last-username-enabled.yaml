id: display-last-username-enabled

info:
  name: 登录界面显示上次用户名（本地基线扫描）
  author: princechaddha
  severity: medium
  description: |
    该模板检查系统是否在登录界面显示上次登录用户名。该信息会泄露有效账户线索。
  impact: |
    攻击者可减少账户枚举成本，并对已知用户名执行密码攻击。
  remediation: |
    启用“不显示上次登录用户名”安全策略。
  tags: login,username,code,windows-audit

self-contained: true

code:
  - pre-condition: |
      IsWindows();
    engine:
      - powershell
      - powershell.exe
    args:
      - -ExecutionPolicy
      - Bypass
    pattern: "*.ps1"
    source: |
      Get-ItemProperty -Path 'HKLM:\SOFTWARE\Microsoft\Windows\CurrentVersion\Policies\System' -Name 'DontDisplayLastUserName'

    matchers:
      - type: word
        words:
          - "0"
