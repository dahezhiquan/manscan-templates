id: azure-vm-performance-diagnostics-unenabled
info:
  name: Azure VM Performance Diagnostics Feature未启用（云安全）
  author: princechaddha
  severity: medium
  description: Azure Performance Diagnostics 扩展可采集虚拟机 CPU、内存、磁盘和网络等性能数据，帮助识别异常负载和可用性问题。本模板枚举虚拟机及扩展，匹配 AzurePerformanceDiagnosticsLinux 且排除 provisioning 状态 Succeeded，用于发现扩展缺失或未成功运行的实例。
  impact: |
    - 主机性能异常、资源耗尽和潜在拒绝服务迹象可能无法及时发现，影响故障定位和恢复速度。
    - 诊断扩展未成功运行会造成监控盲区，使异常进程、磁盘耗尽或网络拥塞更难与安全事件关联。
  remediation: |
    - 在支持的 Linux VM 上安装并修复 Azure Performance Diagnostics 扩展，确认 provisioning 状态为 Succeeded。
    - 将性能数据发送到受控监控工作区，限制扩展和日志读取权限，并结合异常 CPU、磁盘和网络指标配置告警。
  reference:
    - https://docs.microsoft.com/en-us/azure/virtual-machines/performance-diagnostics
  metadata:
    vendor: microsoft
    product: azure-virtual-machines
  tags: cloud,devops,azure,microsoft,virtual-machine,azure-cloud-config

flow: |
  code(1);
  for (let vmData of iterate(template.vmList)) {
    vmData = JSON.parse(vmData);
    set("name", vmData.Name);
    set("resourceGroup", vmData.ResourceGroup);
    code(2);
  }

self-contained: true
code:
  - engine:
      - sh
      - bash
    source: |
      az vm list --output json --query '[*].{"Name":name,"ResourceGroup":resourceGroup}'

    extractors:
      - type: json
        name: vmList
        internal: true
        json:
          - '.[]'

  - engine:
      - sh
      - bash
    source: |
      az vm extension list --vm-name "$name" --resource-group "$resourceGroup" --output json --query '[*].{"ExtensionName": name, "ProvisioningState": provisioningState}'

    matchers-condition: and
    matchers:
      - type: word
        part: body
        words:
          - 'AzurePerformanceDiagnosticsLinux'

      - type: word
        part: body
        words:
          - 'Succeeded'
        negative: true

    extractors:
      - type: dsl
        dsl:
          - '"Performance Diagnostics is not enabled for " + name + " in " + resourceGroup'
