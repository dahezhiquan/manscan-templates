id: acm-cert-renewal-45days
info:
  name: ACM 证书 45 天内到期（云安全）
  author: princechaddha
  severity: medium
  description: ACM 已签发证书 45 天内到期是一类证书生命周期预警风险，通常意味着续期、验证或替换流程需要提前介入。若证书未满足 ACM 托管续期条件，或导入证书缺少人工轮换计划，到期后可能导致 HTTPS 服务中断。模板先枚举 ISSUED 状态的证书 ARN，再读取 `Certificate.NotAfter`，当证书剩余有效期小于 45 天时输出证书 ARN。
  impact: |
    - 证书到期后，依赖该证书的 HTTPS 服务可能出现访问失败、客户端报错或自动化调用中断。
    - 提前量不足会增加证书续期失败后的应急处置压力，尤其影响多区域或多服务复用证书的场景。
  remediation: |
    - 检查 ACM 托管续期状态，确保相关域名验证记录仍然存在且可解析。
    - 对导入证书或不满足自动续期条件的证书，提前签发新证书并完成依赖服务切换。
  reference:
    - https://docs.aws.amazon.com/acm/latest/userguide/acm-renewal.html
  metadata:
    max-request: 2
    vendor: amazon
    product: acm
  tags: cloud,devops,aws,amazon,acm,aws-cloud-config
variables:
  region: "us-east-1"

flow: |
  code(1)
  for(let arns of iterate(template.certificatearns)){
    set("certificatearn", arns)
    code(2)
  }

self-contained: true
code:
  - engine:
      - sh
      - bash
    source: |
      aws acm list-certificates --region $region --certificate-statuses ISSUED --query 'CertificateSummaryList[*].CertificateArn' --output json

    extractors:
      - type: json
        name: certificatearns
        internal: true
        json:
          - '.CertificateSummaryList[] | .CertificateArn'

  - engine:
      - sh
      - bash
    source: |
         aws acm describe-certificate --region $region --certificate-arn $certificatearn --query 'Certificate.[NotAfter, CertificateArn]' --output json | jq -r 'select((.[0] | fromdateiso8601 | mktime) - (now | mktime) < (45 * 86400)) | .[1]'

    extractors:
      - type: regex # type of the extractor
        name: certificate
        internal: true
        regex:
          - '^arn.*'

      - type: dsl
        dsl:
          - '"The AWS ACM Certificate " + certificate +" is about to expire in 30 days"'
