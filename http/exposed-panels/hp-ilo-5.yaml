id: hp-ilo-5

info:
  name: Hewlett Packard Integrated Lights Out 5 登录面板识别（暴露面识别）
  author: geeknik
  severity: info
  description: 该模板通过识别 Hewlett Packard Integrated Lights Out 5 登录入口的页面标题、特征文本或重定向行为，判断目标是否暴露了对应的认证界面。若命中，说明该登录面板对外可访问，可用于暴露面梳理与后续安全评估。
  reference:
    - https://www.hpe.com/us/en/servers/integrated-lights-out-ilo.html
  classification:
    cvss-metrics: CVSS:3.0/AV:N/AC:L/PR:N/UI:N/S:U/C:N/I:N/A:N
    cwe-id: CWE-200
    cpe: cpe:2.3:h:hpe:integrated_lights-out_5:*:*:*:*:*:*:*:*
  metadata:
    max-request: 1
    vendor: hpe
    product: integrated_lights-out_5
  tags: hp,ilo,panel,hpe,discovery

http:
  - method: GET
    path:
      - "{{BaseURL}}/html/login.html"

    matchers-condition: and
    matchers:
      - type: status
        status:
          - 200

      - type: word
        part: body
        words:
          - "titleHeading>iLO 5"
          - "titleFwver>Firmware"
          - "2002-2018 Hewlett Packard Enterprise Development LP"
        condition: and

      - type: word
        part: header
        words:
          - "text/html"
