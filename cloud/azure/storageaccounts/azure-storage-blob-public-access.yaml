id: azure-storage-blob-public-access
info:
  name: Azure Storage Blob 公共访问已启用（云安全）
  author: princechaddha
  severity: medium
  description: Azure Storage 账户的 allowBlobPublicAccess 为 true 时，容器和 Blob 可以被配置为匿名读取，公共数据与敏感数据混用时容易产生意外暴露。本模板枚举存储账户并查询 allowBlobPublicAccess，在返回 true 时报告。
  impact: |
    - 未授权用户可能读取公开容器中的文件、备份、日志或业务数据，造成数据泄露和隐私合规风险。
    - 公开对象也可能被用于投放恶意文件、收集业务信息或支撑后续针对内部系统的攻击。
  remediation: |
    - 将 allowBlobPublicAccess 设置为 false，并检查已有容器的 public access 设置，撤销不必要的匿名访问。
    - 对必须公开发布的内容使用隔离账户和明确的内容审核流程，禁止将敏感数据放入公共容器。
  reference:
    - https://docs.microsoft.com/en-us/azure/storage/common/storage-disallow-access
  metadata:
    vendor: microsoft
    product: azure-storage
  tags: cloud,devops,azure,microsoft,storage,azure-cloud-config

flow: |
  code(1);
  for (let AccountData of iterate(template.accountList)) {
    set("ids", AccountData);
    code(2);
  }

self-contained: true
code:
  - engine:
      - sh
      - bash
    source: |
      az storage account list --query '[*].id'

    extractors:
      - type: json
        name: accountList
        internal: true
        json:
          - '.[]'

  - engine:
      - sh
      - bash
    source: |
      az storage account show --ids "$ids" --query 'allowBlobPublicAccess'

    matchers-condition: and
    matchers:
      - type: word
        words:
          - 'true'

    extractors:
      - type: dsl
        dsl:
          - 'ids + " has public access enabled"'
