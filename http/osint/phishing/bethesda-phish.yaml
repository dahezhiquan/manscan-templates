id: bethesda-phish

info:
  name: Bethesda 仿冒钓鱼网站（钓鱼网站识别）
  author: rxerium
  severity: info
  description: |
    检测到疑似仿冒 Bethesda 的钓鱼网站。模板在目标页面返回 200、页面内容命中 Bethesda 的品牌页面特征，且当前主机不属于 bethesda.net 官方域名时触发，用于识别借用 Bethesda 品牌页面诱导用户信任的仿冒站点。
  reference:
    - https://bethesda.net
  metadata:
    max-request: 1
  tags: phishing,bethesda,osint,discovery
http:
  - method: GET
    path:
      - "{{BaseURL}}"

    host-redirects: true
    max-redirects: 2

    matchers-condition: and
    matchers:
      - type: word
        words:
          - 'The official site for Bethesda, publisher of Fallout, DOOM, Dishonored, Skyrim, Wolfenstein, The Elder Scrolls, more. Your source for news, features &amp; community'
          - 'Bethesda'
        condition: and

      - type: status
        status:
          - 200

      - type: dsl
        dsl:
          - '!contains(host,"bethesda.net")'
