id: private-key

info:
  name: 私钥泄露检测（本地文件安全扫描）
  author: gaurang,geeknik
  severity: high
  description: |
    私钥用于证明设备、用户或应用的加密身份。私钥一旦泄露，攻击者可能冒充持有者建立 SSH、VPN、签名或解密关系；公钥材料本身通常不具备同等风险。本模板匹配 PEM 私钥头、OpenSSH/SSH 公钥前缀和 PGP 私钥块等关键标记；命中后必须区分私钥与可公开的公钥材料。
  impact: |
    - 私钥可被用于冒充用户、主机、VPN 对等端或签名主体，绕过依赖密钥认证的访问控制。
    - 与私钥配套的授权范围可能包括代码仓库、生产主机、网络隧道、备份或加密数据。
    - 若命中的是 SSH 公钥而非私钥，主要影响是暴露身份和信任关系，不能直接推导为可登录。
  remediation: |
    - 立即撤销或替换命中的私钥，并同步更新 authorized_keys、VPN 对等端、证书、部署系统和相关信任列表。
    - 使用硬件密钥或受控密钥代理保存新密钥，设置口令保护、最小权限和明确的过期策略。
    - 审计私钥对应账户和主机的访问记录，清理仓库历史、日志、制品和备份中的旧副本。
  tags: file,keys,token
file:
  - extensions:
      - all

    extractors:
      - type: regex
        regex:
          - "BEGIN OPENSSH PRIVATE KEY"
          - "BEGIN PRIVATE KEY"
          - "BEGIN RSA PRIVATE KEY"
          - "BEGIN DSA PRIVATE KEY"
          - "BEGIN EC PRIVATE KEY"
          - "BEGIN PGP PRIVATE KEY BLOCK"
          - "ssh-rsa"
          - "ssh-dsa"
          - "ssh-ed25519"
