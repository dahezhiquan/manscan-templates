id: unauth-fastvue-dashboard

info:
  name: Fastvue 仪表盘 面板 未授权 检测
  author: DhiyaneshDK
  severity: medium
  description: |
    检测到 Fastvue 仪表盘 面板 未授权 检测。目标功能在未认证状态下可访问，可能暴露管理入口、业务数据、系统状态或可执行操作，需确认是否存在访问控制缺失。
  classification:
    cvss-metrics: CVSS:3.1/AV:N/AC:L/PR:N/UI:N/S:U/C:L/I:N/A:N
    cvss-score: 5.3
    cwe-id: CWE-200
  metadata:
    verified: true
    max-request: 1
    shodan-query: http.favicon.hash:-1117549627
  tags: panel,fastvue,unauth,misconfig,discovery

http:
  - method: GET
    path:
      - "{{BaseURL}}/dashboard.aspx"

    matchers-condition: and
    matchers:
      - type: word
        words:
          - "<title>Fastvue Sophos Reporter</title>"
          - "<title>Fastvue Reporter for SonicWall</title>"
        condition: or

      - type: word
        part: body
        words:
          - "Dashboard"

      - type: status
        status:
          - 200
