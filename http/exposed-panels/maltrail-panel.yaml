id: maltrail-panel

info:
  name: Maltrail 面板识别（指纹识别）
  author: ritikchaddha
  severity: info
  description: |-
    检测到目标站点存在 Maltrail 相关响应特征。Maltrail 是恶意流量检测与监控平台，Web 面板用于查看告警、传感器、流量事件和威胁线索。模板请求 `/`，并通过页面标题或正文关键字、状态码确认该系统指纹，用于资产识别、系统盘点和暴露面梳理。
  metadata:
    verified: true
    max-request: 1
    shodan-query: title:"Maltrail"
  tags: panel,maltrail,detect,discovery
http:
  - method: GET
    path:
      - "{{BaseURL}}"

    matchers-condition: and
    matchers:
      - type: word
        part: body
        words:
          - "Maltrail</title>"
          - "/stamparm/maltrail/wiki"
          - "<b>M</b>altrail"
        condition: or

      - type: status
        status:
          - 200

    extractors:
      - type: regex
        part: body
        group: 1
        regex:
          - '<b>M<\/b>altrail \(v<b>([0-9.]+)<\/b>'
