id: swarmui-panel

info:
  name: SwarmUI 面板识别（指纹识别）
  author: rxerium
  severity: info
  description: |
    该模板通过识别 SwarmUI 面板、控制台或管理界面的页面特征，判断目标是否暴露了对应服务入口。若命中，说明该后台或运维界面对外可访问，可用于资产识别与暴露面排查。
  reference:
    - https://github.com/mcmonkeyprojects/SwarmUI
  metadata:
    verified: true
    max-request: 1
    vendor: mcmonkeyprojects
    product: SwarmUI
    shodan-query: 'http.title:"SwarmUI"'
  tags: panel,swarmui,stablediffusion,ai,image-generation,detect,discovery

http:
  - method: GET
    path:
      - "{{BaseURL}}"
      - "{{BaseURL}}/Login"

    stop-at-first-match: true
    host-redirects: true
    max-redirects: 2

    matchers-condition: and
    matchers:
      - type: word
        part: body
        words:
          - 'version-display'
          - 'SwarmUI'
        condition: and

      - type: status
        status:
          - 200
