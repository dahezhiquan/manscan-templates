id: acontent-detect

info:
  name: AContent 指纹识别（指纹识别）
  author: pikpikcu
  severity: info
  description: AContent 是开源学习内容管理系统，用于课程内容、在线学习和无障碍教育资源管理。该模板请求首页，并依据 HTTP 200 状态码、页面标题、正文关键字或品牌资源特征识别目标是否使用或暴露了 AContent 相关组件，适用于资产盘点、技术栈识别和后续安全评估；命中结果仅表示指纹特征匹配，不代表已确认存在可利用漏洞。
  metadata:
    max-request: 1
  tags: tech,acontent,discovery

http:
  - method: GET
    path:
      - "{{BaseURL}}"

    host-redirects: true

    matchers-condition: and
    matchers:
      - type: word
        part: body
        words:
          - "<title>AContent : Home</title>"
          - "AContent - Copyright 2010 by IDRC/IDI http://inclusivedesign.ca/"
        condition: or

      - type: status
        status:
          - 200
