id: gcloud-org-uniform-bucket-access

info:
  name: Uniform Bucket-Level 访问 未Enforced（云安全）
  author: princechaddha
  severity: medium
  description: Uniform bucket-level access 未在组织层强制时，Cloud Storage bucket 仍可能使用对象 ACL，导致对象级权限与 IAM 权限并存。本模板检查 storage.uniformBucketLevelAccess 组织策略 booleanPolicy，返回空对象 {} 时报告未强制统一桶级访问。
  impact: |
    - 对象 ACL 可能造成难以发现的单对象公开或越权访问，削弱集中 IAM 管理效果。
    - 权限模型混用会增加审计复杂度，访问问题和数据泄露排查更困难。
  remediation: |
    - 启用 storage.uniformBucketLevelAccess 组织策略，强制新建和现有 bucket 使用统一桶级访问。
    - 迁移前清点依赖对象 ACL 的应用，改用 IAM、条件授权和受控服务账号。
  reference:
    - https://www.trendmicro.com/cloudoneconformity/knowledge-base/gcp/ResourceManager/enforce-uniform-bucket-level-access-constraint.html
    - https://cloud.google.com/storage/docs/uniform-bucket-level-access
  metadata:
    vendor: google
    product: resource-manager
  tags: cloud,devops,gcp,gcloud,resourcemanager,security,storage,bucket,gcp-cloud-config

flow: |
  code(1)
  for(let orgId of iterate(template.orgIds)){
    set("orgId", orgId)
    code(2)
  }

self-contained: true

code:
  - engine:
      - sh
      - bash
    source: |
      gcloud organizations list --format="json(name)"

    extractors:
      - type: json
        name: orgIds
        internal: true
        json:
          - '.[].name'

  - engine:
      - sh
      - bash
    source: |
      gcloud alpha resource-manager org-policies describe storage.uniformBucketLevelAccess --organization=$orgId --effective --format="json(booleanPolicy)"

    matchers:
      - type: word
        words:
          - "{}"

    extractors:
      - type: dsl
        dsl:
          - '"Organization " + orgId + " has not enforced uniform bucket-level access for Cloud Storage buckets"'
