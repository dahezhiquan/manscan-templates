id: milesight-system-log

info:
  name: Milesight Industrial Cellular Routers 信息泄露（暴露面识别）
  author: ritikchaddha
  severity: high
  description: |
    检测到可直接访问的 Milesight Industrial Cellular Routers 相关信息资源。日志、异常页面或调试输出通常会泄露堆栈信息、内部路径、查询语句、账号标识、令牌片段或业务数据，不应向未授权用户开放。
  reference:
    - https://medium.com/@win3zz/inside-the-router-how-i-accessed-industrial-routers-and-reported-the-flaws-29c34213dfdf
  metadata:
    verified: true
    max-request: 1
    shodan-query: http.html:rt_title
    google-query: '"/lang/log/system" ext:log'
    product: ur5x_firmware
    vendor: milesight
    fofa-query: body=rt_title
  tags: milesight,log,exposure,vuln

http:
  - method: GET
    path:
      - '{{BaseURL}}/lang/log/system.log'

    matchers-condition: and
    matchers:
      - type: word
        part: body
        words:
          - 'daemon.info'
          - 'authpriv.info'
        condition: and

      - type: word
        part: header
        words:
          - 'text/plain'

      - type: status
        status:
          - 200
