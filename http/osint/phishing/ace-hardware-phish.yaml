id: ace-hardware-phish

info:
  name: Ace Hardware 仿冒钓鱼网站（钓鱼网站识别）
  author: rxerium
  severity: info
  description: |
    检测到疑似仿冒 Ace Hardware 的钓鱼网站。模板在目标页面返回 200、页面内容命中 Ace Hardware 的品牌页面特征，且当前主机不属于 acehardware.com 官方域名时触发，用于识别借用 Ace Hardware 品牌页面诱导用户信任的仿冒站点。
  reference:
    - https://acehardware.com
  metadata:
    max-request: 1
  tags: phishing,ace-hardware,ecommerce,osint,discovery
http:
  - method: GET
    path:
      - "{{BaseURL}}"

    host-redirects: true
    max-redirects: 2

    matchers-condition: and
    matchers:
      - type: word
        words:
          - 'Ace Hardware'
          - 'Shop Ace Hardware for grills, hardware, home improvement, lawn and garden, and tools. Buy online &amp; pickup today!'
        condition: and

      - type: status
        status:
          - 200

      - type: dsl
        dsl:
          - '!contains(host,"acehardware.com")'
