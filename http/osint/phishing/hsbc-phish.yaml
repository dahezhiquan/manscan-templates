id: hsbc-phish

info:
  name: HSBC 仿冒钓鱼网站（钓鱼网站识别）
  author: rxerium
  severity: info
  description: |
    检测到疑似仿冒 HSBC 的钓鱼网站。模板在目标页面返回 200、页面内容命中 HSBC 的金融或支付页面特征，且当前主机不属于 hsbc.com 官方域名时触发，用于识别借用 HSBC 品牌页面诱导用户信任的仿冒站点。
  reference:
    - https://hsbc.com
  metadata:
    max-request: 1
  tags: phishing,hsbc,bank,osint,discovery
http:
  - method: GET
    path:
      - "{{BaseURL}}"

    host-redirects: true
    max-redirects: 2

    matchers-condition: and
    matchers:
      - type: word
        words:
          - "HSBC, one of the largest banking and financial services institutions in the world, serves millions of customers through its four global businesses."

      - type: status
        status:
          - 200

      - type: dsl
        dsl:
          - '!contains(host,"hsbc.com")'
