id: siemens-logo8-panel

info:
  name: Siemens LOGO! 8 Web 登录面板（IOT）
  author: biero-el-corridor
  severity: medium
  description: |
    检测到 Siemens LOGO! 8 Web 登录面板。该入口与小型 PLC/自动化控制设备相关，公网暴露会增加工业控制设备被探测和攻击的风险。
  impact: |
    - 工业控制、楼宇自动化或能源设备面板暴露可能泄露设施运行状态和控制系统入口。
    - 若存在弱口令或历史漏洞，可能影响生产、楼控、供电或环境控制的安全边界。
  remediation: |
    - 将 OT/IoT 管理页面放置在隔离网络中，仅允许可信运维主机或 VPN 访问。
    - 启用强认证、最小权限和设备访问审计，及时更新厂商固件。
    - 避免将控制设备直接暴露到互联网，并监控异常登录和配置变更。
  metadata:
    max-request: 1
    verified: true
    shodan-query: html:"/logo_login.shtm"
  tags: ics,siemens,panel,login,discovery

http:
  - method: GET
    path:
      - "{{BaseURL}}/logo_login.shtm?!App-Language=1"

    matchers-condition: and
    matchers:
      - type: word
        part: body
        words:
          - "LOGO! Login"
          - "ReadMe OSS"
        condition: and

      - type: status
        status:
          - 200
