id: mlflow-panel

info:
  name: MLflow 面板识别（指纹识别）
  author: rxerium
  severity: info
  description: |-
    检测到目标站点存在 MLflow 相关响应特征。MLflow 是机器学习生命周期管理平台，用于跟踪实验、模型注册、模型部署和 MLOps 工作流。模板请求 `/`，并通过页面标题或正文关键字、状态码确认该系统指纹，用于资产识别、系统盘点和暴露面梳理。
  reference:
    - https://github.com/mlflow/mlflow
    - https://mlflow.org
  metadata:
    verified: true
    max-request: 1
    vendor: databricks
    product: mlflow
    shodan-query: 'http.title:"MLflow"'
  tags: panel,mlflow,ml,ai,mlops,detect,discovery
http:
  - method: GET
    path:
      - "{{BaseURL}}"

    host-redirects: true
    max-redirects: 2

    matchers-condition: and
    matchers:
      - type: word
        part: body
        words:
          - "MLflow"

      - type: status
        status:
          - 200
