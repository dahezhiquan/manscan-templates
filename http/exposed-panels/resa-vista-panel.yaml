id: resa-vista-panel

info:
  name: RESA Vista 登录面板识别（指纹识别）
  author: righettod
  severity: info
  description: |-
    RESA Vista 是 Web 管理入口，用于对应业务系统的登录、配置和日常操作。该模板请求 `/account/login` 路径，并依据 DSL 条件识别目标是否部署了该系统或暴露了对应入口，适用于资产指纹确认；命中结果仅表示系统特征匹配，不代表已确认存在未授权访问或可利用漏洞。
  reference:
  - https://resa.aero/en/solutions-operations-billing/vista-staff-fids/
  metadata:
    verified: true
    max-request: 1
  tags: panel,resa,login,detect

http:
  - method: GET
    path:
      - "{{BaseURL}}/account/login"

    matchers:
      - type: dsl
        dsl:
          - 'status_code == 200'
          - 'contains_all(to_lower(body), "vista", "resa airport", "login")'
        condition: and

    extractors:
      - type: regex
        part: body
        group: 1
        regex:
          - 'v=([0-9.]+)'
