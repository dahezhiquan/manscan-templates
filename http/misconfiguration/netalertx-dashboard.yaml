id: netalertx-dashboard

info:
  name: NetAlert X Admin 仪表盘 暴露
  author: s4e-io
  severity: medium
  description: |
    检测到 NetAlert X Admin 仪表盘 暴露。目标功能在未认证状态下可访问，可能暴露管理入口、业务数据、系统状态或可执行操作，需确认是否存在访问控制缺失。
  reference:
    - https://github.com/jokob-sk/NetAlertX
  metadata:
    verified: true
    max-request: 2
    vendor: jokob-sk
    product: netalertx
    fofa-query: "NetAlert X"
  tags: netalertx,unauth,dashboard,misconfig,discovery

http:
  - method: GET
    path:
      - "{{BaseURL}}"
      - "{{BaseURL}}/devices.php"

    matchers-condition: and
    matchers:
      - type: word
        part: body
        words:
          - "<title>NetAlertX"
          - "Sign out</a>"
          - "My Devices"
        condition: and

      - type: status
        status:
          - 200
