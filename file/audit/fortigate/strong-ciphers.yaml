id: strong-ciphers

info:
  name: HTTPS/SSH 强加密套件未启用（本地文件安全扫描）
  author: pussycat0x
  severity: info
  description: |
    该模板检测 FortiGate HTTPS/SSH 是否使用强加密套件。弱加密可能被本地网络攻击者破解或降级利用。
  reference:
    - https://docs.fortinet.com/document/fortigate/6.2.0/hardening-your-fortigate/582009/system-administrator-best-practices
  tags: audit,config,file,firewall,fortigate

file:
  - extensions:
      - conf

    matchers-condition: and
    matchers:
      - type: word
        words:
          - "set strong-crypto enable"
        negative: true

      - type: word
        words:
          - "config system"
          - "config router"
          - "config firewall"
        condition: or
