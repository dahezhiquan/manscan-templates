id: wp-yoast-user-enumeration

info:
  name: WordPress Yoast SEO Plugin - 用户名枚举漏洞
  author: FLX
  severity: low
  description: |
    该模板用于检测 WordPress Yoast SEO Plugin - 用户名枚举漏洞。该类问题通常源于调试页面、配置文件、接口响应或目录资源被非预期暴露。模板会根据请求响应中的状态码、关键字、错误信息、时间差或外带交互等证据判断目标是否受影响。
  impact: |
    - 攻击者可获取系统版本、路径、账号、密钥、配置或业务数据等敏感信息。
    - 泄露的信息可能被用于后续漏洞匹配、凭据攻击、权限提升或横向移动。
  remediation: |
    - 关闭不必要的调试、示例、备份和信息展示接口，避免向未授权用户返回敏感内容。
    - 对敏感文件和接口增加访问控制，并从 Web 根目录移除备份、日志和配置文件。
    - 排查已泄露的凭据、令牌和配置，必要时执行轮换并检查访问日志。
  reference:
    - https://developer.yoast.com/features/xml-sitemaps/functional-specification/
  classification:
    cpe: cpe:2.3:a:yoast:yoast_seo:*:*:*:*:wordpress:*:*:*
  metadata:
    verified: true
    max-request: 1
    vendor: yoast
    product: yoast_seo
    google-query: inurl:"/author-sitemap.xml"
  tags: wordpress,wp-plugin,username,disclosure,vuln

http:
  - raw:
      - |
        @timeout: 15s
        GET /author-sitemap.xml HTTP/1.1
        Host: {{Hostname}}

    matchers-condition: and
    matchers:
      - type: word
        part: body
        words:
          - "<?xml"
          - "<lastmod>"
          - "<loc>"
        condition: and

      - type: word
        part: header
        words:
          - "application/xml"
          - "text/xml"

      - type: status
        status:
          - 200
