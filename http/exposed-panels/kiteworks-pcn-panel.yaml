id: kiteworks-pcn-panel

info:
  name: Kiteworks PCN 面板识别（指纹识别）
  author: righettod
  severity: info
  description: |-
    检测到目标站点存在 Kiteworks PCN 相关响应特征。Kiteworks PCN 是监控、日志、分析或可观测性系统，用于展示运行指标、告警事件、日志数据和服务状态。模板请求 `/login/locales/login_en.json`，并通过页面标题或正文关键字、响应头关键字、状态码确认该系统指纹，用于资产识别、系统盘点和暴露面梳理。
  reference:
    - https://www.kiteworks.com/platform/private-content-network/
  classification:
    cpe: cpe:2.3:a:accellion:kiteworks:*:*:*:*:*:*:*:*
  metadata:
    verified: true
    max-request: 1
    vendor: accellion
    product: kiteworks
    shodan-query: http.favicon.hash:-1215318992
    fofa-query: icon_hash=-1215318992
  tags: panel,kiteworks,login,detect,accellion,discovery
http:
  - method: GET
    path:
      - '{{BaseURL}}/login/locales/login_en.json'

    matchers-condition: and
    matchers:
      - type: word
        part: body
        words:
          - 'Secured by Kiteworks'
          - 'Return to sign in'
        condition: and
        case-insensitive: true

      - type: word
        part: header
        words:
          - 'application/octet-stream'

      - type: status
        status:
          - 200
