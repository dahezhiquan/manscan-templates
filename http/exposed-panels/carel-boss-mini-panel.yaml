id: carel-boss-mini-panel

info:
  name: CAREL Boss Mini - Login Panel 识别（指纹识别）
  author: Kazgangap
  severity: info
  description: |
    该模板通过识别 CAREL Boss Mini - Login 登录入口的页面标题、特征文本或重定向行为，判断目标是否暴露了对应的认证界面。若命中，说明该登录面板对外可访问，可用于暴露面梳理与后续安全评估。
  reference:
    - https://www.carel.com/
  metadata:
    verified: true
    max-request: 1
    vendor: carel
    product: boss-mini
    fofa-query: icon_hash=="1092427843"
  tags: panel,carel,boss-mini,ics,login,detect

http:
  - method: GET
    path:
      - "{{BaseURL}}/boss/"

    matchers:
      - type: dsl
        dsl:
          - 'contains_all(body, "boss_logo", "System administration", "Login")'
          - 'status_code == 200'
        condition: and
