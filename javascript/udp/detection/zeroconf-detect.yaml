id: zeroconf-detect

info:
  name: Zeroconf 服务识别（指纹识别）
  author: pussycat0x
  severity: info
  description: |
    Zeroconf 通常结合 mDNS 和 DNS-SD 实现本地网络零配置发现，用于自动发现打印机、媒体投放、文件共享、IoT 设备和其他局域网服务。该模板向 UDP 5353 查询 _services._dns-sd._udp.local，并根据 mDNS/DNS-SD 响应内容确认 Zeroconf 服务发现指纹。
  reference:
    - https://en.wikipedia.org/wiki/Zero-configuration_networking
  metadata:
    verified: true
    zoomeye-query: service="zeroconf"
  tags: zeroconf,network,js,udp,discovery,detect

javascript:

  - pre-condition: |
      isUDPPortOpen(Host,Port);

    code: |
      let packet = bytes.NewBuffer();
      const c = require("nuclei/net");
      const cmd = "000000000001000000000000095f7365727669636573075f646e732d7364045f756470056c6f63616c00000c0001"
      packet.WriteString(cmd)
      let conn = c.Open('udp', `${Host}:${Port}`);
      conn.SendHex(packet);
      const result = conn.RecvFullHex();
      result

    args:
      Host: "{{Host}}"
      Port: 5353

    matchers:
      - type: dsl
        dsl:
          - 'success == true'
          - 'contains_all(response, "udp.local","rvices._dns-sd") || contains(response, "-servers.net")'
        condition: and
