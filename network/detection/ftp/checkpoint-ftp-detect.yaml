id: checkpoint-ftp-detect
info:
  name: Check Point FireWall-1 FTP 服务识别（指纹识别）
  author: pussycat0x
  severity: info
  description: |
    Check Point FireWall-1 FTP 是 FTP 服务实现、设备内置文件传输组件或 FTP 代理，常用于文件传输、设备配置、固件维护或旧系统集成。该模板连接 21/TCP 并读取协议响应，通过匹配 `Check Point FireWall-1 Secure FTP` 等响应特征识别目标服务。
  metadata:
    verified: true
    shodan-query: "Check Point FireWall-1 Secure FTP"
    max-request: 1
  tags: network,ftp,checkpoint,detect,tcp,firewall,discovery

tcp:
  - inputs:
      - data: 00000000
        type: hex

    host:
      - "{{Hostname}}"
    port: 21
    read-size: 1024

    matchers:
      - type: word
        words:
          - "Check Point FireWall-1 Secure FTP"

    extractors:
      - type: regex
        group: 1
        name: hostname
        regex:
          - "server running on ([A-Z-0-9]+)"
