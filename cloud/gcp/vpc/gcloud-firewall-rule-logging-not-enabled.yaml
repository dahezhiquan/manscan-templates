id: gcloud-firewall-rule-logging-not-enabled

info:
  name: Enable 日志记录 的VPC Firewall Rules（云安全）
  author: princechaddha
  severity: medium
  description: VPC 防火墙规则日志可记录命中规则的连接元数据，是排查异常访问、验证策略效果和事后取证的重要依据。未启用日志时，即使规则仍在放行或拒绝流量，也难以及时发现异常网络行为。本模板遍历项目中的 VPC 网络和防火墙规则，匹配处于启用状态且 logConfig enable 为 false 的规则。
  impact: |
    - 安全团队无法从防火墙层面还原命中规则、连接方向和流量来源，影响入侵排查与合规审计。
    - 错误开放的端口或异常扫描可能长期不可见，延缓响应并扩大横向移动窗口。
  remediation: |
    - 为关键 VPC 防火墙规则启用 Firewall Rules Logging，并按隐私要求选择是否包含元数据。
    - 将防火墙日志集中到 Cloud Logging 或 SIEM，并为高风险端口、广泛来源和拒绝异常配置告警。
  reference:
    - https://cloud.google.com/vpc/docs/using-firewall-rules-logging
  metadata:
    vendor: google
    product: cloud-vpc
  tags: cloud,devops,gcp,gcloud,google-cloud-vpc,firewall-logging,security,gcp-cloud-config

flow: |
  code(1)
  for(let projectId of iterate(template.projectIds)){
    set("projectId", projectId)
    code(2)
    for(let network of iterate(template.networks)){
      set("networkName", network)
      code(3)
    }
  }

self-contained: true

code:
  - engine:
      - sh
      - bash
    source: |
      gcloud projects list --format="json(projectId)"

    extractors:
      - type: json
        name: projectIds
        internal: true
        json:
          - '.[].projectId'

  - engine:
      - sh
      - bash
    source: |
      gcloud compute networks list --project $projectId --format="json(name)"

    extractors:
      - type: json
        name: networks
        internal: true
        json:
          - '.[].name'

  - engine:
      - sh
      - bash
    source: |
      gcloud compute firewall-rules list --filter="network=$networkName" --sort-by="priority" --format="json(name,disabled,direction,logConfig)"

    matchers:
      - type: word
        words:
          - '"enable": false'
          - '"disabled": false'
        condition: and

    extractors:
      - type: dsl
        dsl:
          - '"The firewall rule " + name + " in network " + networkName + " in project " + projectId + " does not have logging enabled."'
