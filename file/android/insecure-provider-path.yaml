id: insecure-provider-path

info:
  name: Android Provider Path 配置不安全检测（本地文件安全扫描）
  author: gaurang
  severity: medium
  description: |
    该模板检测 Android FileProvider 或相关 provider path 中可能过宽的路径配置。路径暴露过大可能导致文件读取或共享边界失控。
  classification:
    cvss-metrics: CVSS:3.1/AV:N/AC:L/PR:N/UI:N/S:U/C:L/I:N/A:N
    cvss-score: 5.3
    cwe-id: CWE-200
  tags: android,file

file:
  - extensions:
      - all
    matchers:
      - type: regex
        regex:
          - "root-path name=\"[0-9A-Za-z\\-_]{1,10}\" path=\".\""
          - "root-path name=\"[0-9A-Za-z\\-_]{1,10}\" path=\"\""
