id: gcloud-vertexai-vtpm

info:
  name: Virtual Trusted Platform Module 未Enabled 的Vertex AI Notebooks（云安全）
  author: princechaddha
  severity: medium
  description: vTPM 可为 Shielded VM 提供可信度量和密钥保护能力，Vertex AI notebook 未启用时完整性验证能力受限。本模板检查 gceSetup.shieldedInstanceConfig.enableVtpm，输出包含 shieldedInstanceConfig 空对象时报告 vTPM 未启用。
  impact: |
    - 实例启动度量和可信状态验证能力不足，难以及时发现底层篡改。
    - 对处理敏感数据和模型的 notebook，运行环境信任链不完整会削弱整体安全基线。
  remediation: |
    - 为 Vertex AI notebook 启用 Shielded VM vTPM。
    - 将 vTPM 与 Secure Boot、Integrity Monitoring 一起纳入 notebook 创建基线。
  reference:
    - https://www.trendmicro.com/cloudoneconformity/knowledge-base/gcp/VertexAI/enable-vtpm.html
    - https://cloud.google.com/vertex-ai/docs/workbench/user-managed/manage-instance
  metadata:
    vendor: google
    product: vertex-ai
  tags: cloud,devops,gcp,gcloud,vertexai,security,vtpm,gcp-cloud-config,ai

flow: |
  code(1)
  for(let projectId of iterate(template.projectIds)){
    set("projectId", projectId)
    code(2)
  }

self-contained: true

code:
  - engine:
      - sh
      - bash
    source: |
      gcloud projects list --format="json(projectId)"

    extractors:
      - type: json
        name: projectIds
        internal: true
        json:
          - '.[].projectId'

  - engine:
      - sh
      - bash
    source: |
      gcloud workbench instances describe tm-vertex-ai-notebook-instance --location=us-central1-a --project=$projectId --format="yaml(gceSetup.shieldedInstanceConfig.enableVtpm)"

    matchers:
      - type: word
        words:
          - "shieldedInstanceConfig: {}"

    extractors:
      - type: dsl
        dsl:
          - '"Project " + projectId + " has Vertex AI notebook instances without Virtual Trusted Platform Module (vTPM) enabled"'
