id: dc-direct-connect-detect

info:
  name: Direct Connect 服务识别（指纹识别）
  author: pussycat0x
  severity: info
  description: |
    该模板用于识别目标是否暴露 Direct Connect P2P 协议服务。模板向目标端口发送空探测数据，并根据响应中的 `$MyNick` 或 `$Lock EXTENDEDPROTOCOL` 等握手特征判断目标是否运行 Direct Connect 相关服务。
  reference:
    - https://en.wikipedia.org/wiki/Direct_Connect_(protocol)
  metadata:
    verified: true
    shodan-query: product:"Direct Connect P2P"
    max-request: 1
  tags: js,network,detect,dc,direct-connect,p2p,discovery

tcp:
  - inputs:
      - data: 00000000
        type: hex

    host:
      - "{{Hostname}}"

    port: 548
    read-size: 1024

    matchers:
      - type: word
        words:
          - "$MyNick bb3096"
          - "$Lock EXTENDEDPROTOCOL"
        condition: or
