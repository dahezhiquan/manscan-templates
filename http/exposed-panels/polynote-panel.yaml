id: polynote-panel

info:
  name: Polynote 面板识别（指纹识别）
  author: rxerium
  severity: info
  description: |
    该模板通过识别 Polynote 面板、控制台或管理界面的页面特征，判断目标是否暴露了对应服务入口。若命中，说明该后台或运维界面对外可访问，可用于资产识别与暴露面排查。
  reference:
    - https://github.com/polynote/polynote
    - https://polynote.org
  metadata:
    verified: true
    max-request: 1
    vendor: polynote
    product: polynote
    shodan-query: 'http.title:"Polynote"'
  tags: panel,polynote,notebook,scala,python,detect,discovery

http:
  - method: GET
    path:
      - "{{BaseURL}}"

    host-redirects: true
    max-redirects: 2

    matchers-condition: and
    matchers:
      - type: word
        part: body
        words:
          - "<title>Polynote</title>"

      - type: status
        status:
          - 200
