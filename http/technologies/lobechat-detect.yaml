id: lobechat-detect

info:
  name: LobeChat 指纹识别（指纹识别）
  author: s4e-io
  severity: info
  description: >-
    LobeChat 是开源 AI 聊天和智能体前端，用于接入多种大语言模型并提供对话、插件和知识库能力。该模板通过请求目标服务并检查预设路径或首页响应、DSL
    条件等指纹特征，判断目标是否使用或暴露了 LobeChat 相关组件；命中结果仅表示指纹特征匹配，可用于资产盘点、技术栈识别和后续安全评估，不代表已确认存在可利用漏洞。
  reference:
  - https://github.com/lobehub/lobe-chat
  metadata:
    verified: true
    max-request: 1
    fofa-query: icon_hash="1975020705"
  tags: lobechat,tech,detect,discovery
http:
  - method: GET
    path:
      - "{{BaseURL}}/welcome"

    host-redirects: true
    matchers:
      - type: dsl
        dsl:
          - 'contains(body, "Welcome to LobeChat")'
          - 'status_code == 200'
        condition: and
