id: nginx-version

info:
  name: Nginx version 指纹识别（指纹识别）
  author: philippedelteil,daffainfo
  severity: info
  description: 用于识别目标是否部署 Nginx version 并提取相关版本或构建信息，模板会结合 HTTP 响应头、状态码、特定路径或已知端点和版本或标识提取结果进行指纹匹配。
  metadata:
    max-request: 1
  tags: tech,nginx,discovery

http:
  - method: GET
    path:
      - "{{BaseURL}}"

    matchers-condition: and
    matchers:
      - type: regex
        part: header
        regex:
          - 'nginx/[0-9.]+'

      - type: status
        status:
          - 200

    extractors:
      - type: regex
        part: header
        regex:
          - 'nginx/[0-9.]+'
