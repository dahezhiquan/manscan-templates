id: actifio-panel

info:
  name: Actifio Resource Center 面板（指纹识别）
  author: Splint3r7
  severity: info
  description: |
    该模板通过识别 Actifio Resource Center 面板、控制台或管理界面的页面特征，判断目标是否暴露了对应服务入口。若命中，说明该后台或运维界面对外可访问，可用于资产识别与暴露面排查。
  classification:
    cwe-id: CWE-200
  metadata:
    max-request: 1
    shodan-query: http.title:"Actifio Resource Center"
  tags: panel,actifio,login,detect,discovery

http:
  - method: GET
    path:
      - "{{BaseURL}}"

    matchers:
      - type: dsl
        dsl:
          - 'contains(body, "<title>Actifio Resource Center")'
          - 'status_code == 200'
        condition: and
