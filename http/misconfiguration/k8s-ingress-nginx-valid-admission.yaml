id: k8s-ingress-nginx-valid-admission

info:
  name: Kubernetes Ingress Nginx AdmissionReview 暴露
  author: burso
  severity: high
  description: |
    该模板用于核查 Kubernetes Ingress Nginx AdmissionReview 暴露。该类问题通常源于容器、Kubernetes、CI/CD、注册表、服务发现或运维 API 暴露在公网且缺少访问控制。模板会向目标发送探测请求，并依据匹配 `status_code == 200`、匹配 `contains(content_type, "application/json")`、匹配 `contains_all(body, "AdmissionReview", "test-{{string}}")`等证据确认目标是否存在该配置问题。
  impact: |
    - 攻击者可查看集群对象、容器、任务、节点、配置、构建流水线或运行状态。
    - 若接口允许操作，可能导致容器创建、任务执行、配置泄露、集群接管或远程代码执行。
  remediation: |
    - 禁止将 Kubernetes、容器运行时、CI/CD 和运维 API 直接暴露到公网。
    - 启用 TLS、认证授权、RBAC、来源限制和最小权限访问策略。
    - 审计集群对象、任务、容器和访问日志，清理未知资源并轮换相关令牌。
  metadata:
    verified: true
    max-request: 1
    shodan-query: ssl:"ingress-nginx" port:8443
  tags: kubernetes,ingress,nginx,vuln

variables:
  string: "{{to_lower(rand_base(5))}}"

http:
  - raw:
      - |
        POST /validate HTTP/1.1
        Host: {{Hostname}}
        Content-Type: application/json

        {
          "kind": "AdmissionReview",
          "apiVersion": "admission.k8s.io/v1",
          "request": {
            "uid": "{{string}}",
            "kind": {
              "group": "networking.k8s.io",
              "version": "v1",
              "kind": "Ingress"
            },
            "operation": "CREATE",
            "object": {
              "metadata": {
                "name": "test-{{string}}",
                "namespace": "default"
              },
              "spec": {
                "rules": [
                  {
                    "host": "example.com",
                    "http": {
                      "paths": []
                    }
                  }
                ]
              }
            }
          }
        }

    matchers:
      - type: dsl
        dsl:
          - 'status_code == 200'
          - 'contains(content_type, "application/json")'
          - 'contains_all(body, "AdmissionReview", "test-{{string}}")'
        condition: and
