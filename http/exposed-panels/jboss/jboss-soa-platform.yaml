id: jboss-soa-platform

info:
  name: JBoss SOA Platform 登录面板识别（指纹识别）
  author: ritikchaddha,righettod
  severity: info
  description: 该模板通过识别 JBoss SOA Platform 登录入口的页面标题、特征文本或重定向行为，判断目标是否暴露了对应的认证界面。若命中，说明该登录面板对外可访问，可用于暴露面梳理与后续安全评估。
  classification:
    cvss-metrics: CVSS:3.1/AV:N/AC:L/PR:N/UI:N/S:U/C:N/I:N/A:N
    cwe-id: CWE-200
    cpe: cpe:2.3:a:redhat:jboss_soa_platform:*:*:*:*:*:*:*:*
  metadata:
    verified: true
    max-request: 1
    vendor: redhat
    product: jboss_soa_platform
    shodan-query:
      - http.title:"Welcome to the JBoss SOA Platform"
      - http.title:"welcome to the jboss soa platform"
    fofa-query: title="welcome to the jboss soa platform"
    google-query: intitle:"welcome to the jboss soa platform"
  tags: panel,jboss,soa,redhat,detect,discovery

http:
  - method: GET
    path:
      - '{{BaseURL}}/css/footer.js'
      - '{{BaseURL}}'

    stop-at-first-match: true

    matchers-condition: and
    matchers:
      - type: word
        part: body
        words:
          - 'Welcome to the JBoss SOA Platform'
          - 'JBoss Enterprise SOA Platform: Embedded ESB Server'
        condition: or

      - type: status
        status:
          - 200

    extractors:
      - type: regex
        part: body
        group: 1
        regex:
          - '(?i)Version\s+([A-Z0-9.]+)'
