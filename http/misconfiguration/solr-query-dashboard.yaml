id: solr-admin-query

info:
  name: Solr Admin Page 访问
  author: dhiyaneshDK
  severity: high
  description: |
    检测到 Solr Admin Page 访问。目标功能在未认证状态下可访问，可能暴露管理入口、业务数据、系统状态或可执行操作，需确认是否存在访问控制缺失。
  reference:
    - https://www.exploit-db.com/ghdb/5856
  classification:
    cpe: cpe:2.3:a:apache:solr:*:*:*:*:*:*:*:*
  metadata:
    max-request: 2
    vendor: apache
    product: solr
  tags: solr,unauth,edb,misconfig,discovery

http:
  - method: GET
    path:
      - '{{BaseURL}}/admin/'
      - '{{BaseURL}}/solr/admin/'

    matchers-condition: and
    matchers:
      - type: word
        words:
          - '<title>Solr admin page</title>'

      - type: status
        status:
          - 200
