id: siemens-simatic-panel

info:
  name: Siemens SIMATIC HMI Miniweb 登录面板（IOT）
  author: biero-el-corridor
  severity: medium
  description: |
    检测到 Siemens SIMATIC HMI Miniweb 登录面板。该界面与工业 HMI 设备相关，暴露后可能泄露控制系统远程访问入口。
  impact: |
    - 工业控制、楼宇自动化或能源设备面板暴露可能泄露设施运行状态和控制系统入口。
    - 若存在弱口令或历史漏洞，可能影响生产、楼控、供电或环境控制的安全边界。
  remediation: |
    - 将 OT/IoT 管理页面放置在隔离网络中，仅允许可信运维主机或 VPN 访问。
    - 启用强认证、最小权限和设备访问审计，及时更新厂商固件。
    - 避免将控制设备直接暴露到互联网，并监控异常登录和配置变更。
  metadata:
    max-request: 1
    verified: true
    shodan-query: title:"Miniweb Start Page"
  tags: ics,siemens,login,panel,miniweb,discovery

http:
  - method: GET
    path:
      - "{{BaseURL}}/start.html"

    matchers-condition: and
    matchers:
      - type: word
        part: body
        words:
          - "Miniweb Start Page"
          - "HMI_Panel"
        condition: and

      - type: status
        status:
          - 200
