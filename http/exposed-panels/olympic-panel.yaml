id: olympic-panel

info:
  name: OLYMPIC Banking System 登录面板识别（暴露面识别）
  author: righettod
  severity: info
  description: 该模板通过识别 OLYMPIC Banking System 登录入口的页面标题、特征文本或重定向行为，判断目标是否暴露了对应的认证界面。若命中，说明该登录面板对外可访问，可用于暴露面梳理与后续安全评估。
  reference:
    - https://www.olympicbankingsystem.com/en/
  metadata:
    max-request: 2
    shodan-query: http.title:"olympic banking system"
  tags: panel,olympic,login,discovery

http:
  - method: GET
    path:
      - "{{BaseURL}}/Connect.do"
      - "{{BaseURL}}/javaScript/responsive/portal.js"

    stop-at-first-match: true
    matchers:
      - type: dsl
        dsl:
          - 'status_code == 200'
          - 'contains_any(to_lower(body), "olympic banking system", "olympic.action=")'
        condition: and

    extractors:
      - type: regex
        part: body
        group: 1
        regex:
          - '&#169;([0-9]+)-'
