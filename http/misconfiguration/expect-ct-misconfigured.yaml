id: expect-ct-misconfigured

info:
  name: Expect CT Header 配置不当
  author: theamanrawat
  severity: info
  description: |
    检测到 Expect CT Header 配置不当。目标响应或文件中可能暴露配置、凭据、密钥、令牌、环境变量或历史记录等敏感信息，可能被用于进一步入侵。
  reference:
    - https://developer.mozilla.org/en-US/docs/Web/HTTP/Headers/Expect-CT
    - https://scotthelme.co.uk/a-new-security-header-expect-ct/
  tags: headers,expect-ct,misconfiguration

http:
  - method: GET
    path:
      - "{{BaseURL}}"

    matchers:
      - type: dsl
        dsl:
          - 'contains(tolower(header), "expect-ct")'
          - 'contains(tolower(header), "max-age=0") || !contains(tolower(header), "enforce")'
        condition: and

    extractors:
      - type: kval
        part: header
        kval:
          - expect_ct
