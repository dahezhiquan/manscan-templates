id: icewarp-open-redirect

info:
  name: IceWarp - 开放重定向漏洞
  author: uomogrande
  severity: medium
  description: IceWarp - 开放重定向 存在开放重定向漏洞。攻击者可构造恶意跳转链接诱导用户访问钓鱼站点，或配合其他业务流程绕过安全校验。
  remediation: |
    - 按厂商公告升级到已修复版本；原始说明中提到的版本信息为：Fixed in 13。
    - 对跳转目标实施白名单校验，避免直接信任用户可控的 URL 参数。
    - 对登录、回调和重定向相关流程增加来源校验与业务约束。
  classification:
    cvss-metrics: CVSS:3.1/AV:N/AC:L/PR:N/UI:R/S:C/C:L/I:L/A:N
    cvss-score: 6.1
    cwe-id: CWE-601
    cpe: cpe:2.3:a:icewarp:icewarp:*:*:*:*:*:*:*:*
  metadata:
    verified: true
    max-request: 1
    shodan-query: title:"icewarp"
    product: icewarp
    vendor: icewarp
  tags: icewarp,redirect,vuln

http:
  - method: GET
    path:
      - "{{BaseURL}}///interact.sh/%2F.."

    matchers-condition: and
    matchers:
      - type: word
        part: header
        words:
          - 'IceWarp'

      - type: regex
        part: header
        regex:
          - '(?m)^(?:Location\s*?:\s*?)(?:https?:\/\/|\/\/|\/\\\\|\/\\)(?:[a-zA-Z0-9\-_\.@]*)interact\.sh\/?(\/|[^.].*)?$' # https://regex101.com/r/L403F0/1

    extractors:
      - type: regex
        name: redirected
        part: header
        group: 1
        regex:
          - 'Server: (.{4,20})'
