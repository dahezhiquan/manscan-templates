id: dell-dpi-panel

info:
  name: Dell DPI Remote Power Management 指纹识别（指纹识别）
  author: megamansec
  severity: info
  description: |
    用于识别目标是否运行 Dell DPI Remote Power Management，模板会结合页面标题、页面正文、状态码和特定路径或已知端点进行服务指纹匹配。
  metadata:
    max-request: 1
  tags: tech,dell,dpi,rpm,discovery

http:
  - method: GET
    path:
      - "{{BaseURL}}/index2.html"

    matchers-condition: and
    matchers:
      - type: word
        part: body
        words:
          - 'title="DELL DPI Remote Power Management'
          - '<TITLE>DELL DPI Remote Power Management'
        condition: or
        case-insensitive: true

      - type: status
        status:
          - 200
