id: vpc-flowlogs-not-enabled
info:
  name: VPC Flow Logs 未启用（云安全）
  author: princechaddha
  severity: low
  description: VPC Flow Logs 可记录网络接口、子网或 VPC 的流量元数据，用于安全分析、排障和合规审计。该模板枚举 VPC，并检查 describe-flow-logs 返回是否为空数组。
  impact: |
    - 横向移动、异常出站连接或拒绝流量缺少网络层审计证据。
    - 发生安全事件或网络故障时，团队难以还原通信双方、端口和流量趋势。
  remediation: |
    - 为关键 VPC、子网或 ENI 启用 VPC Flow Logs，并输出到 CloudWatch Logs 或 S3。
    - 设置日志保留、访问控制和异常流量告警，确保网络审计数据可检索、可追踪。
  reference:
    - https://docs.aws.amazon.com/vpc/latest/userguide/flow-logs.html
  metadata:
    max-request: 2
    vendor: amazon
    product: vpc
  tags: cloud,devops,aws,amazon,vpc,aws-cloud-config
variables:
  region: "us-east-1"

flow: |
  code(1)
  for(let VpcIds of iterate(template.VpcId)){
    set("vpc", VpcIds)
    code(2)
  }

self-contained: true
code:
  - engine:
      - sh
      - bash
    source: |
      aws ec2 describe-vpcs --region $region --query 'Vpcs[*].VpcId' --output json

    extractors:
      - type: json
        name: VpcId
        internal: true
        json:
          - '.[]'

  - engine:
      - sh
      - bash
    source: |
         aws ec2 describe-flow-logs --region $region --filter "Name=resource-id,Values=$vpc"

    matchers:
      - type: word
        words:
          - "[]"
        condition: and


    extractors:
      - type: dsl
        dsl:
          - '"Flow Logs feature is not enabled for the VPC " + vpc'
