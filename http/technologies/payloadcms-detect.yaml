id: payloadcms-detect

info:
  name: PayloadCMS 指纹识别（指纹识别）
  author: Shivam Kamboj
  severity: info
  description: |
    用于识别目标是否使用 PayloadCMS，模板会结合页面标题、页面正文和特定路径或已知端点匹配内容管理系统相关指纹。
  reference:
    - https://payloadcms.com/
    - https://github.com/payloadcms/payload
  metadata:
    verified: true
    max-request: 2
    vendor: payloadcms
    product: payload
    shodan-query:
      - http.html:"payload__modal"
      - http.html:"@layer payload-default"
    google-query: intitle:"Payload" inurl:"/admin"
  tags: tech,detect,payloadcms,cms

http:
  - method: GET
    path:
      - "{{BaseURL}}"
      - "{{BaseURL}}/admin/login"

    stop-at-first-match: true
    redirects: true

    matchers:
      - type: dsl
        dsl:
          - "contains_any(body, '<title>Login - Payload', '<title>Payload Admin')"
          - 'status_code == 200'
        condition: and
