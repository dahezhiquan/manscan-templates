id: weblogic-detect

info:
  name: Oracle WebLogic Server 指纹识别（指纹识别）
  author: pdteam
  severity: info
  description: >-
    Oracle WebLogic Server 是 Java EE 应用服务器，用于部署企业级 Java 应用、中间件服务和管理控制台。该模板通过请求目标服务并检查预设路径或首页响应、页面正文关键字、状态码等指纹特征，判断目标是否使用或暴露了
    Oracle WebLogic Server 相关组件；命中结果仅表示指纹特征匹配，可用于资产盘点、技术栈识别和后续安全评估，不代表已确认存在可利用漏洞。
  metadata:
    max-request: 1
    shodan-query: product:"Oracle Weblogic"
  tags: tech,weblogic,intrusive,discovery
http:
  - method: GET
    path:
      - "{{BaseURL}}/{{randstr}}"

    matchers-condition: and
    matchers:
      - type: word
        words:
          - "From RFC 2068"
          - "Error 404--Not Found"
        condition: and

      - type: status
        status:
          - 404
