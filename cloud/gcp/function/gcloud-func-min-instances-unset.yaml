id: gcloud-func-min-instances-unset

info:
  name: Unset Minimum Instances 的Cloud Functions（云安全）
  author: princechaddha
  severity: medium
  description: Cloud Functions 未设置 minimum instances 时，函数在空闲后可能缩容到零，关键路径请求会受到冷启动影响。本模板枚举函数并检查 serviceConfig.minInstanceCount，字段为 null 时报告函数未配置最小实例数。
  impact: |
    - 对延迟敏感的 HTTP 函数或事件处理链路，冷启动会增加响应时间并影响用户体验。
    - 流量突增时缺少预热实例可能导致处理延迟、超时或上游重试放大。
  remediation: |
    - 为关键函数设置合适的 minInstanceCount，并结合并发、超时和成本评估容量。
    - 对非关键或低频函数记录例外，避免为无需低延迟的函数产生不必要常驻成本。
  reference:
    - https://cloud.google.com/functions/docs/scaling#setting_a_minimum_number_of_instances
  metadata:
    vendor: google
    product: cloud-functions
  tags: cloud,devops,gcp,gcloud,google-cloud-functions,gcp-cloud-config

flow: |
  code(1)
  for(let projectId of iterate(template.projectIds)){
    set("projectId", projectId)
    code(2)
    for(let functionDetail of iterate(template.functions)){
      set("functionName", functionDetail)
      code(3)
    }
  }

self-contained: true

code:
  - engine:
      - sh
      - bash
    source: |
      gcloud projects list --format="json(projectId)"

    extractors:
      - type: json
        name: projectIds
        internal: true
        json:
          - '.[].projectId'

  - engine:
      - sh
      - bash
    source: |
      gcloud functions list --project $projectId --format="json(name)"

    extractors:
      - type: json
        name: functions
        internal: true
        json:
          - '.[].name'

  - engine:
      - sh
      - bash
    source: |
      gcloud functions describe $functionName --format="json(serviceConfig.minInstanceCount)"

    matchers:
      - type: word
        words:
          - 'null'

    extractors:
      - type: dsl
        dsl:
          - '"Minimum Instances not configured for function: " + functionName + " in " + projectId + " project"'
