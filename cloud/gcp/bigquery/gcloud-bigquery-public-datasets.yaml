id: gcloud-bigquery-public-datasets

info:
  name: 公开可访问 BigQuery Datasets（云安全）
  author: princechaddha
  severity: high
  description: 该规则用于检查 GCP bigquery 相关资源是否存在公开暴露、未受限访问或匿名可访问等高风险配置，避免敏感数据、管理接口或网络服务直接暴露在公网。
  impact: |
    - 公开暴露的资源可能被未授权访问、枚举、下载或恶意利用。
    - 一旦涉及管理接口、对象存储或数据库服务，可能进一步导致数据泄露、权限滥用或业务中断。
  remediation: |
    - 收敛公网暴露面，仅允许受信任网络、IP 范围或必要身份访问相关资源。
    - 对对象存储、负载均衡、数据库或控制台接口启用更严格的访问控制与网络隔离策略。
  reference:
    - https://cloud.google.com/bigquery/docs/managing-dataset-access
  tags: cloud,devops,gcp,gcloud,bigquery,gcp-cloud-config

flow: |
  code(1)
  for(let projectId of iterate(template.projectIds)){
    set("projectId", projectId)
    code(2)
    for(let datasetId of iterate(template.datasetIds)){
      set("datasetId", datasetId)
      code(3)
    }
  }

self-contained: true

code:
  - engine:
      - sh
      - bash
    source: |
      gcloud projects list --format="json(projectId)"

    extractors:
      - type: json
        name: projectIds
        internal: true
        json:
          - '.[].projectId'

  - engine:
      - sh
      - bash
    source: |
      bq ls --project_id $projectId --format=json

    extractors:
      - type: json
        name: datasetIds
        internal: true
        json:
          - '.[].datasetId'

  - engine:
      - sh
      - bash
    source: |
      bq show --format=prettyjson $projectId:$datasetId | jq '.access[] | select(.role != null and (.specialGroup == "allUsers" or .specialGroup == "allAuthenticatedUsers")) | .role'

    matchers:
      - type: word
        words:
          - 'roles/bigquery.dataViewer'
          - 'roles/bigquery.dataEditor'
          - 'roles/bigquery.dataOwner'
        condition: or

    extractors:
      - type: dsl
        dsl:
          - '"Publicly Accessible BigQuery Dataset: " + datasetId + " in Project: " + projectId'
