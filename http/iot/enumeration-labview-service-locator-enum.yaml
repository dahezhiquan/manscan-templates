id: enumeration-labview-service-locator-enum

info:
  name: LabVIEW/NI Service Locator 枚举（指纹识别）
  author: matejsmycka
  severity: info
  description: |
    National Instruments/LabVIEW Service Locator 用于发布和发现 NI 相关服务，常见于测试测量、工业控制和实验室设备环境。该模板请求 `/dumpinfo`，通过 `Service Locator URL Mappings` 与 `National Instruments` 特征枚举可见服务信息。
  reference:
    - https://forums.ni.com/t5/LabVIEW/Get-list-of-services-from-NI-service-locator/td-p/3850515
    - https://www.ni.com/en/support/security/configuring-software-and-hardware-firewalls-to-support-national-.html
  metadata:
    verified: true
    max-request: 1
    shodan-query: http.favicon.hash:1192389544 port:3580
  tags: detect,labview,panel,enumeration,discovery

http:
  - method: GET
    path:
      - "{{BaseURL}}/dumpinfo"

    matchers-condition: and
    matchers:
      - type: word
        part: body
        words:
          - "Service Locator URL Mappings"
          - "National Instruments"
        condition: and

      - type: status
        status:
          - 200
