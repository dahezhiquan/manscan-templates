id: redmine-panel

info:
  name: Redmine 登录面板识别（指纹识别）
  author: righettod
  severity: info
  description: Redmine 是项目管理与缺陷跟踪系统，用于问题、版本、Wiki 和项目协作管理。该模板请求 `/login` 路径，并依据 DSL 条件识别目标是否部署了该系统或暴露了对应入口，适用于资产指纹确认；命中结果仅表示系统特征匹配，不代表已确认存在未授权访问或可利用漏洞。
  reference:
  - https://www.redmine.org/
  classification:
    cpe: cpe:2.3:a:redmine:redmine:*:*:*:*:*:*:*:*
  metadata:
    verified: true
    max-request: 1
    vendor: redmine
    product: redmine
    shodan-query: http.html:'content="Redmine'
  tags: panel,redmine,login,detect,discovery

http:
  - method: GET
    path:
      - "{{BaseURL}}/login"

    matchers:
      - type: dsl
        dsl:
          - 'status_code == 200'
          - 'contains(body, "content=\"Redmine")'
        condition: and
