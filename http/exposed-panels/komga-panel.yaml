id: komga-panel

info:
  name: Komga 面板 - 检测（暴露面识别）
  author: ChrisJr404
  severity: info
  description: |-
    Komga（komga.org / github.com/gotson/komga）是一款自托管的漫画、日漫、BD 及电子书媒体服务器。默认 Docker 端口为 25600。暴露的实例会呈现登录面板，并可能泄露所托管的馆藏内容。
  reference:
    - https://github.com/gotson/komga
    - https://komga.org/
  metadata:
    verified: true
    max-request: 1
    vendor: gotson
    product: komga
    shodan-query: http.title:"Komga"
    fofa-query: title="Komga"
  tags: panel,komga,media,manga,comics,selfhosted,detect,discovery,login

http:
  - method: GET
    path:
      - "{{BaseURL}}"

    host-redirects: true
    max-redirects: 2

    matchers:
      - type: dsl
        dsl:
          - 'status_code == 200'
          - 'contains(to_lower(body), "<title>komga</title>")'
        condition: and
