id: ml-h2o-driverless-ai-panel

info:
  name: H2O Driverless AI 面板 - 检测（指纹识别）
  author: rxerium
  severity: info
  description: |-
    检测到目标站点存在 H2O Driverless AI 相关响应特征。H2O Driverless AI 是 AI、机器学习或 Notebook 相关平台，用于管理模型、数据集、工作区、实验、推理服务或训练任务。模板请求 `/login`，并通过页面标题或正文关键字、响应头关键字、状态码确认该系统指纹，用于资产识别、系统盘点和暴露面梳理。
  reference:
    - https://h2o.ai/platform/ai-cloud/make/driverless-ai/
    - https://docs.h2o.ai/driverless-ai/latest-stable/docs/userguide/index.html
  metadata:
    verified: true
    max-request: 1
    vendor: h2o.ai
    product: driverless-ai
    shodan-query: 'http.title:"H2O.ai - Login"'
  tags: panel,h2o-driverless-ai,ml,ai,automl,detect,discovery
http:
  - method: GET
    path:
      - "{{BaseURL}}/login"

    host-redirects: true
    max-redirects: 2

    matchers-condition: and
    matchers:
      - type: word
        part: header
        words:
          - "Server: H2O Driverless AI"

      - type: word
        part: body
        words:
          - "DRIVERLESS AI"
        case-insensitive: true

      - type: status
        status:
          - 200
