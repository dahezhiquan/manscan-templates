id: redpanda-console

info:
  name: Redpanda 控制台 暴露
  author: kh4sh3i
  severity: medium
  description: |
    检测到 Redpanda 控制台 暴露。目标功能在未认证状态下可访问，可能暴露管理入口、业务数据、系统状态或可执行操作，需确认是否存在访问控制缺失。
  impact: |
    - 未授权用户可能访问管理功能、业务数据或系统状态。
    - 暴露接口可能被用于进一步枚举、修改配置或执行敏感操作。
  reference:
    - https://github.com/redpanda-data/console
  metadata:
    verified: true
    max-request: 1
    shodan-query: title:"Redpanda Console"
  tags: misconfig,redpanda,console,streaming,vuln

http:
  - method: GET
    path:
      - "{{BaseURL}}/overview"

    matchers-condition: and
    matchers:
      - type: word
        part: body
        words:
          - "Redpanda Console"

      - type: status
        status:
          - 200
