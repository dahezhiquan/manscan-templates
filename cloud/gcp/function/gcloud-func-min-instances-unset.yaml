id: gcloud-func-min-instances-unset

info:
  name: Unset Minimum Instances 的Cloud Functions（云安全）
  author: princechaddha
  severity: medium
  description: 该规则用于检查 GCP function 相关资源是否满足推荐的云安全与合规配置要求，命中通常表示当前配置仍存在可改进的风险项。
  impact: |
    - 当前配置偏离推荐的云安全基线，可能增加攻击面、审计缺口或运维失误带来的风险。
    - 具体影响取决于受影响资源的重要性、暴露范围以及周边安全控制是否到位。
  remediation: |
    - 参考云厂商安全基线和官方文档修正当前配置偏差。
    - 建议结合资源标签、自动化检测与周期性审计，持续跟踪该类风险项的整改状态。
  reference:
    - https://cloud.google.com/functions/docs/scaling#setting_a_minimum_number_of_instances
  tags: cloud,devops,gcp,gcloud,google-cloud-functions,gcp-cloud-config

flow: |
  code(1)
  for(let projectId of iterate(template.projectIds)){
    set("projectId", projectId)
    code(2)
    for(let functionDetail of iterate(template.functions)){
      set("functionName", functionDetail)
      code(3)
    }
  }

self-contained: true

code:
  - engine:
      - sh
      - bash
    source: |
      gcloud projects list --format="json(projectId)"

    extractors:
      - type: json
        name: projectIds
        internal: true
        json:
          - '.[].projectId'

  - engine:
      - sh
      - bash
    source: |
      gcloud functions list --project $projectId --format="json(name)"

    extractors:
      - type: json
        name: functions
        internal: true
        json:
          - '.[].name'

  - engine:
      - sh
      - bash
    source: |
      gcloud functions describe $functionName --format="json(serviceConfig.minInstanceCount)"

    matchers:
      - type: word
        words:
          - 'null'

    extractors:
      - type: dsl
        dsl:
          - '"Minimum Instances not configured for function: " + functionName + " in " + projectId + " project"'
