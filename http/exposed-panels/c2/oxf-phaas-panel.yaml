id: oxf-phaas-panel

info:
  name: OXF Phishing as a Service 面板识别（暴露面识别）
  author: pussycat0x
  severity: info
  description: |
    该模板通过识别 OXF Phishing as a Service 相关页面或响应特征，判断目标是否暴露了疑似 C2、窃密或钓鱼基础设施面板。若命中，可作为外部暴露面排查、威胁狩猎与恶意基础设施识别的线索。
  reference:
    - https://x.com/solostalking/status/1946069612090495059
  metadata:
    verified: true
    max-request: 1
    fofa-query: title="OXF Panel"
  tags: c2,oxf,phishing,panel,login,vuln

http:
  - method: GET
    path:
      - "{{BaseURL}}/login"

    matchers-condition: and
    matchers:
      - type: word
        part: body
        words:
          - "<title>Login · OXF Panel"

      - type: status
        status:
          - 200
