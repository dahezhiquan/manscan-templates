id: homebridge-default-login

info:
  name: Homebridge 默认管理员凭据（弱口令）
  author: 0x_Akoko
  severity: high
  description: |
    该模板通过尝试 Homebridge 的默认管理员账号口令（如 admin:admin），并依据认证成功后的响应特征判断目标是否仍在使用未修改的弱口令。若命中，攻击者通常可直接获得后台管理权限，进一步访问敏感信息、修改配置或执行未授权操作。
  reference:
    - https://github.com/homebridge/homebridge
    - https://github.com/homebridge/homebridge-config-ui-x
  classification:
    cvss-metrics: CVSS:3.1/AV:N/AC:L/PR:N/UI:N/S:U/C:H/I:H/A:H
    cvss-score: 9.8
    cwe-id: CWE-798
  metadata:
    verified: true
    max-request: 1
    vendor: homebridge
    product: homebridge-config-ui-x
    shodan-query: 'http.title:"Homebridge"'
    fofa-query: 'title="Homebridge"'
  tags: default-login,homebridge,iot,vuln

variables:
  username: "admin"
  password: "admin"

flow: http(1) && http(2)

http:
  - raw:
      - |
        GET / HTTP/1.1
        Host: {{Hostname}}

    matchers:
      - type: dsl
        internal: true
        dsl:
          - 'status_code == 200'
          - 'contains_any(to_lower(body), "homebridge", "homebridge-config-ui")'
        condition: and

  - raw:
      - |
        POST /api/auth/login HTTP/1.1
        Host: {{Hostname}}
        Content-Type: application/json

        {"username":"{{username}}","password":"{{password}}"}

    matchers:
      - type: dsl
        dsl:
          - 'status_code == 200 || status_code == 201'
          - 'contains(content_type, "application/json")'
          - 'contains_all(body, "access_token", "token_type")'
        condition: and
