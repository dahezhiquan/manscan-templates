id: gcloud-bucket-lock-not-configured

info:
  name: Configure Retention 策略 使用Bucket Lock 的Log Buckets（云安全）
  author: princechaddha
  severity: medium
  description: 用于日志导出的 Cloud Storage bucket 未配置 Retention Policy 和 Bucket Lock 时，日志可被过早删除或篡改，影响审计完整性。本模板枚举项目 logging sinks，并对目标 bucket 执行 gsutil retention get，返回 no Retention Policy 时报告未配置保留策略。
  impact: |
    - 攻击者或误操作可能删除关键日志，导致入侵调查、责任追踪和合规审计缺少证据。
    - 日志保留策略不固定会让项目间留存期限不一致，影响集中取证。
  remediation: |
    - 为日志 bucket 配置合适的 Retention Policy，并在确认期限后使用 Bucket Lock 固化策略。
    - 限制日志 bucket 管理权限，定期验证保留策略、访问控制和日志写入状态。
  reference:
    - https://cloud.google.com/storage/docs/bucket-lock
  metadata:
    vendor: google
    product: cloud-storage
  tags: cloud,devops,gcp,gcloud,google-cloud-logging,retention,bucket-lock,security,gcp-cloud-config

flow: |
  code(1)
  for(let projectId of iterate(template.projectIds)){
    set("projectId", projectId)
    code(2)
    for(let sink of iterate(template.sinks)){
      sink = JSON.parse(sink);
      set("bucketName", sink.name)
      code(3)
    }
  }

self-contained: true

code:
  - engine:
      - sh
      - bash
    source: |
      gcloud projects list --format="json(projectId)"

    extractors:
      - type: json
        name: projectIds
        internal: true
        json:
          - '.[].projectId'

  - engine:
      - sh
      - bash
    source: |
      gcloud logging sinks list --project=$projectId --format="json(name,destination)"

    extractors:
      - type: json
        name: sinks
        internal: true
        json:
          - '.[]'

  - engine:
      - sh
      - bash
    source: |
      gsutil retention get gs://$bucketName

    matchers:
      - type: word
        words:
          - 'no Retention Policy'

    extractors:
      - type: dsl
        dsl:
          - '"The bucket " + bucketName + " in project " + projectId + " does not have a configured retention policy with Bucket Lock."'
