id: endian-firewall-panel

info:
  name: Endian Firewall - 登录面板（暴露面识别）
  author: rxerium
  severity: info
  description: |-
    Endian Firewall Community 是一款开源 UTM（统一威胁管理）设备兼 VPN 网关。其 Web 管理界面通常暴露在 10443 端口，并配有自签名证书。
  reference:
    - https://www.endian.com/community/overview/
  metadata:
    max-request: 1
    shodan-query: 'http.title:"Endian Firewall" port:10443'
  tags: panel,endian,firewall,utm,vpn,network

http:
  - method: GET
    path:
      - "{{BaseURL}}"

    redirects: true
    max-redirects: 2


    matchers-condition: and
    matchers:
      - type: word
        words:
          - "Endian Firewall"
        part: body

      - type: status
        status:
          - 200
