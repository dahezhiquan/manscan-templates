id: mac-c2-jarm

info:
  name: MacC2 JARM 识别（服务漏洞）
  author: pussycat0x
  severity: info
  description: |
    该模板通过 JARM TLS 指纹识别目标是否可能为 MacC2 相关命令控制基础设施。
  reference:
    - https://github.com/cedowens/C2-JARM
    - https://github.com/cedowens/MacC2
  metadata:
    max-request: 1
  tags: jarm,network,c2,ir,osint,cti,macc2,tcp,vuln
tcp:
  - inputs:
      - data: 2E
        type: hex
    host:
      - "{{Hostname}}"
    matchers:
      - type: dsl
        dsl:
          - "jarm(Hostname) == '2ad2ad0002ad2ad22c42d42d000000faabb8fd156aa8b4d8a37853e1063261'"
          - "jarm(Hostname) == '2ad2ad0002ad2ad00042d42d000000ad9bf51cc3f5a1e29eecb81d0c7b06eb'"
        condition: or
