id: admiralcloud-detect

info:
  name: AdmiralCloud 指纹识别（指纹识别）
  author: righettod
  severity: info
  description: |-
    AdmiralCloud 是数字资产管理平台，用于媒体素材、文件归档和团队协作管理。该模板请求首页，并依据 DSL 条件识别目标是否使用或暴露了 AdmiralCloud 相关组件，适用于资产盘点、技术栈识别和后续安全评估；命中结果仅表示指纹特征匹配，不代表已确认存在可利用漏洞。
  reference:
  - https://www.admiralcloud.com/en/
  metadata:
    verified: true
    max-request: 1
    shodan-query: http.title:"AdmiralCloud"
  tags: tech,admiralcloud,detect,discovery

http:
  - method: GET
    path:
      - "{{BaseURL}}"

    redirects: true
    max-redirects: 2
    matchers:
      - type: dsl
        dsl:
          - 'status_code == 200'
          - 'contains_any(to_lower(body), "content=\"admiralcloud", "<title>admiralcloud")'
        condition: and

    extractors:
      - type: regex
        part: body
        group: 1
        regex:
          - '\s+([0-9\.]+)</title>'
