id: stormshield-network-security-panel

info:
  name: Stormshield Network Security - 登录面板（暴露面识别）
  author: rxerium
  severity: info
  description: |-
    Stormshield Network Security (SNS) 是一款法国网络安全设备，提供防火墙、IPS、VPN 和网页过滤功能。其 Web 管理门户经常暴露在非标准端口上。
  reference:
    - https://www.stormshield.com/products/network-security/
  metadata:
    max-request: 3
    shodan-query: http.title:"Stormshield Network Security - Portal"
  tags: panel,stormshield,vpn,firewall,network-security,detect

http:
  - method: GET
    path:
      - "{{BaseURL}}"
      - "{{BaseURL}}/admin"
      - "{{BaseURL}}/admin/admin.html"

    redirects: true
    max-redirects: 2

    matchers-condition: and
    matchers:
      - type: word
        part: body
        words:
          - 'Stormshield Network Security - Portal'

      - type: status
        status:
          - 200
