id: nfs-daemon-service

info:
  name: NFS 服务守护进程应禁用（本地基线扫描）
  author: songyaeji
  severity: high
  description: |
    NFS 服务会通过网络导出文件系统，若非专用文件共享主机仍运行 NFS 守护进程，会暴露额外文件访问入口。模板通过 systemd 检查 `nfs-server`，或在非 systemd 环境检查 `nfsd` 进程，输出 `[VULNERABLE]` 时表示 NFS 服务处于活动状态。
  impact: |
    - 未授权或配置错误的 NFS 访问可能导致文件读取、写入或敏感目录暴露。
    - NFS 相关 RPC 服务会增加网络攻击面和访问控制复杂度。
  remediation: |
    - 如无业务需求，停止并禁用 `nfs-server`/`nfsd`，卸载 NFS 服务端组件。
    - 如必须提供共享，限制客户端来源、导出路径和挂载权限，并审计 `/etc/exports`。
  reference:
    - https://isms.kisa.or.kr
  tags: linux,local,audit,kisa,compliance

self-contained: true

code:
  - engine:
      - sh
      - bash
    source: |
      if command -v systemctl >/dev/null 2>&1; then
        if systemctl is-active --quiet nfs-server; then
          echo "[VULNERABLE] NFS service is active (systemd nfs-server is running)"
        else
          echo "[SAFE] NFS service is not running"
        fi
      else
        if ps -ef | grep -v grep | grep -q nfsd; then
          echo "[VULNERABLE] NFS service is active (nfsd is running)"
        else
          echo "[SAFE] NFS service is not running"
        fi
      fi

    matchers:
      - type: word
        part: response
        words:
          - "[VULNERABLE]"
