id: 3cx-installer

info:
  name: 3CX Phone System 安装向导页面 暴露
  author: DhiyaneshDk
  severity: high
  description: |
    该模板用于核查 3CX Phone System 安装向导页面 暴露。该类问题通常源于安装、初始化、升级或配置向导在部署完成后仍可从公网访问。模板会向目标发送探测请求，并依据请求 ``、匹配 `3CX Configuration Tool`、匹配 `3CX Initial Setup`、匹配 `Welcome to the 3CX Management Console`等证据确认目标是否存在该配置问题。
  impact: |
    - 攻击者可能完成初始化流程、创建管理员账户、覆盖配置或触发升级逻辑。
    - 在部分系统中，暴露安装入口还可能导致数据库连接信息泄露、站点被重新配置或业务被接管。
  remediation: |
    - 完成部署后立即删除、禁用或限制安装与升级入口。
    - 对初始化流程增加来源限制和一次性安装校验，避免公网直接访问。
    - 检查系统是否已被异常初始化或创建未知管理员账户，并轮换相关凭据。
  reference:
    - https://www.3cx.com/docs/manual/install/
    - https://www.3cx.com/
  classification:
    cwe-id: CWE-668
  metadata:
    verified: true
    max-request: 1
    vendor: 3cx
    product: 3cx
    shodan-query: http.title:"3CX Phone System Management Console"
    fofa-query: title="3CX Phone System Management Console"
  tags: 3cx,voip,exposure,misconfig,installer,panel

http:
  - method: GET
    path:
      - "{{BaseURL}}"

    host-redirects: true
    max-redirects: 2

    matchers-condition: and
    matchers:
      - type: word
        part: body
        words:
          - "3CX Configuration Tool"
          - "3CX Initial Setup"
          - "Welcome to the 3CX Management Console"
        condition: or

      - type: status
        status:
          - 200
