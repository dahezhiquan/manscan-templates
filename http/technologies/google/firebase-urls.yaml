id: firebase-urls

info:
  name: Google Firebase Realtime Database URL 指纹识别（指纹识别）
  author: panch0r3d
  severity: info
  description: >-
    Firebase Realtime Database 是 Google Firebase 的实时数据库服务，公开 URL 可反映应用后端数据服务的使用情况。该模板通过请求目标服务并检查预设路径或首页响应、页面正文关键字、正则特征等指纹特征，判断目标是否使用或暴露了
    Google Firebase Realtime Database URL 相关组件；命中结果仅表示指纹特征匹配，可用于资产盘点、技术栈识别和后续安全评估，不代表已确认存在可利用漏洞。
  metadata:
    max-request: 1
  tags: tech,firebase,google,discovery
http:
  - method: GET
    path:
      - "{{BaseURL}}"

    host-redirects: true
    max-redirects: 1

    matchers-condition: and
    matchers:
      - type: regex
        regex:
          - ".*?(f|F)(i|I)(r|R)(e|E)(b|B)(a|A)(s|S)(e|E)(i|I)(o|O)[.](c|C)(o|O)(m|M).*?"
        part: body
