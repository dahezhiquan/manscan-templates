id: headlamp-panel

info:
  name: Headlamp Kubernetes UI 面板识别（暴露面识别）
  author: shamo0
  severity: medium
  description: |
    该模板用于识别 Headlamp Kubernetes UI 是否存在对外暴露的管理、服务或状态界面。若命中，说明目标公开了相关功能入口，可作为资产盘点与攻击面收敛的依据。
  reference:
    - https://headlamp.dev/
    - https://github.com/kubernetes-sigs/headlamp
  classification:
    cvss-metrics: CVSS:3.1/AV:N/AC:L/PR:N/UI:N/S:U/C:L/I:N/A:N
    cvss-score: 5.3
    cwe-id: CWE-200
  metadata:
    verified: true
    max-request: 2
    product: headlamp
    vendor: kubernetes-sigs
    fofa-query: body="headlampBaseUrl" && body="Headlamp"
  tags: panel,headlamp,kubernetes,exposure

http:
  - method: GET
    path:
      - "{{BaseURL}}/settings/plugins"
      - "{{BaseURL}}/settings/cluster"

    stop-at-first-match: true
    host-redirects: true
    max-redirects: 2

    matchers:
      - type: dsl
        dsl:
          - 'status_code == 200'
          - 'contains_all(body, "Headlamp: Kubernetes Web UI", "headlampBaseUrl")'
        condition: and
