id: ems-webclient-panel

info:
  name: EMS Web Client 登录面板识别（暴露面识别）
  author: pussycat0x,daffainfo
  severity: info
  description: 该模板通过识别 EMS 登录入口的页面标题、特征文本或重定向行为，判断目标是否暴露了对应的认证界面。若命中，说明该登录面板对外可访问，可用于暴露面梳理与后续安全评估。
  classification:
    cvss-metrics: CVSS:3.0/AV:N/AC:L/PR:N/UI:N/S:U/C:N/I:N/A:N
    cwe-id: CWE-200
    cpe: cpe:2.3:a:ems_project:ems:*:*:*:*:*:*:*:*
  metadata:
    max-request: 2
    google-query: inurl:EMSWebClient/
    product: ems
    vendor: ems_project
  tags: panel,ems,discovery

http:
  - method: GET
    path:
      - "{{BaseURL}}/emswebclient/Login.aspx"
      - "{{BaseURL}}/Login.aspx"

    stop-at-first-match: true

    matchers-condition: and
    matchers:
      - type: word
        part: body
        words:
          - "EMS Web Client - Login"

      - type: status
        status:
          - 200

    extractors:
      - type: regex
        part: body
        group: 1
        regex:
          - 'Web Client Version (.*)</span>'
