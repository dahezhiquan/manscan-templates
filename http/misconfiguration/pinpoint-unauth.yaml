id: pinpoint-unauth

info:
  name: PinPoint 未授权
  author: dhiyaneshDk
  severity: high
  description: |
    检测到 PinPoint 未授权。目标功能在未认证状态下可访问，可能暴露管理入口、业务数据、系统状态或可执行操作，需确认是否存在访问控制缺失。
  reference:
    - https://github.com/pinpoint-apm/pinpoint
  metadata:
    max-request: 1
  tags: pippoint,unauth,misconfig,vuln

http:
  - method: GET
    path:
      - '{{BaseURL}}/applications.pinpoint'

    matchers-condition: and
    matchers:
      - type: word
        words:
          - "applicationName"
          - "serviceType"
        condition: and
        part: body

      - type: word
        words:
          - "application/json"
        part: header

      - type: status
        status:
          - 200
