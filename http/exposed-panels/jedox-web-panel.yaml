id: jedox-web-panel

info:
  name: Jedox Web 登录面板识别（指纹识别）
  author: Team Syslifters / Christoph MAHRL,Aron MOLNAR,Patrick PIRKER,Michael WEDL
  severity: info
  description: |-
    检测到目标站点存在 Jedox Web 相关响应特征。Jedox Web 是数据库、报表或数据分析服务的 Web 管理入口，用于查看数据、执行查询、管理报表、集群或连接配置。模板请求 `/`、`/ui/login/` 路径，并通过页面标题或正文关键字、状态码确认该系统指纹，用于资产识别、系统盘点和暴露面梳理。
  reference:
    - https://www.jedox.com
  classification:
    cpe: cpe:2.3:a:jedox:jedox:*:*:*:*:*:*:*:*
  metadata:
    verified: true
    max-request: 2
    vendor: jedox
    product: jedox
    shodan-query:
      - title:"Jedox Web - Login"
      - http.title:"jedox web - login"
      - http.title:"jedox web login"
    google-query:
      - intitle:"Jedox Web Login"
      - intitle:"jedox web login"
      - intitle:"jedox web - login"
    fofa-query:
      - title="jedox web login"
      - title="jedox web - login"
  tags: panel,jedox,detect,discovery
http:
  - method: GET
    path:
      - "{{BaseURL}}"
      - "{{BaseURL}}/ui/login/"

    stop-at-first-match: true
    host-redirects: true
    max-redirects: 2

    matchers-condition: and
    matchers:
      - type: word
        part: body
        words:
          - "Jedox Web - Login"
          - "guide-jedox-software"
        condition: or

      - type: status
        status:
          - 200
