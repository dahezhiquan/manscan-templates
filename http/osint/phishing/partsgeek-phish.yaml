id: partsgeek-phish

info:
  name: PartsGeek 仿冒钓鱼网站（钓鱼网站识别）
  author: rxerium
  severity: info
  description: |
    检测到疑似仿冒 PartsGeek 的钓鱼网站。模板在目标页面返回 200、页面内容命中 PartsGeek 的品牌页面特征，且当前主机不属于 partsgeek.com 官方域名时触发，用于识别借用 PartsGeek 品牌页面诱导用户信任的仿冒站点。
  reference:
    - https://partsgeek.com
  metadata:
    max-request: 1
  tags: phishing,partsgeek,ecommerce,osint,discovery
http:
  - method: GET
    path:
      - "{{BaseURL}}"

    host-redirects: true
    max-redirects: 2

    matchers-condition: and
    matchers:
      - type: word
        words:
          - 'PartsGeek'
          - "SHOP Partsgeek's online auto parts warehouse for original OEM & aftermarket replacement car parts. The dealer alternative store for quality discount auto parts and accessories."
        condition: and

      - type: status
        status:
          - 200

      - type: dsl
        dsl:
          - '!contains(host,"partsgeek.com")'
