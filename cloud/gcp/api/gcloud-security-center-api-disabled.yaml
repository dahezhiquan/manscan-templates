id: gcloud-security-center-api-disabled

info:
  name: Security Command Center API未启用（云安全）
  author: princechaddha
  severity: high
  description: Security Command Center API 用于集中获取 Google Cloud 安全发现、资产风险和威胁检测结果；未启用会影响安全运营可见性。本模板检查项目启用服务列表，未发现 securitycenter.googleapis.com 时报告该 API 未启用。
  impact: |
    - 安全发现、风险聚合和告警自动化能力可能无法覆盖该项目，延迟发现错误配置或威胁活动。
    - 跨项目安全态势管理缺少统一数据来源，影响审计、响应和整改闭环。
  remediation: |
    - 在纳入安全治理的项目或组织范围启用 Security Command Center API。
    - 配置发现结果接收、权限和告警流程，确保新增项目不会绕过集中安全监控。
  reference:
    - https://cloud.google.com/security-command-center/docs/reference/rest
  metadata:
    vendor: google
    product: security-command-center
  tags: cloud,devops,gcp,gcloud,security-center,gcp-cloud-config

flow: |
  code(1)
  for(let projectId of iterate(template.projectIds)){
    set("projectId", projectId)
    code(2)
  }

self-contained: true

code:
  - engine:
      - sh
      - bash
    source: |
      gcloud projects list --format="json(projectId)"

    extractors:
      - type: json
        name: projectIds
        internal: true
        json:
          - '.[].projectId'

  - engine:
      - sh
      - bash
    source: |
      gcloud services list --project $projectId --enabled --filter="name:securitycenter.googleapis.com" --format="json"

    matchers:
      - type: word
        words:
          - '[]'

    extractors:
      - type: dsl
        dsl:
          - '"Security Command Center API is not enabled in Project: " + projectId'
