id: checkpoint-firewall-enum

info:
  name: Check Point 防火墙主机名信息泄露（服务漏洞）
  author: pussycat0x
  severity: low
  description: |
    Check Point Firewall 是企业边界防护和 VPN 远程访问场景中常见的安全网关。部分部署会在 TCP 264 端口响应 SecuRemote/拓扑相关查询，并在返回数据的证书主题字段中暴露防火墙主机名、SmartCenter 主机名等管理线索；该模板发送协议探测报文并提取 CN/O 字段以确认信息泄露。
  impact: |
    - 暴露的防火墙主机名和 SmartCenter 信息可帮助攻击者识别安全边界与管理平面。
    - 这些内部标识可被用于定向社工、漏洞匹配、网络拓扑推断或后续攻击路径规划。
  remediation: |
    - 限制 TCP 264 等远程访问和管理相关端口仅允许可信管理网段访问。
    - 关闭不必要的拓扑查询或主机名暴露功能，升级 Check Point 组件并审计 SecuRemote/VPN 配置。
  reference:
    - https://github.com/rapid7/metasploit-framework/blob/master/modules/auxiliary/gather/checkpoint_hostname.rb
  metadata:
    verified: true
    shodan-query: "product:\"Check Point Firewall\""
    max-request: 1
  tags: js,network,firewall,checkpoint,enum,discovery

javascript:
  - pre-condition: |
      isPortOpen(Host,Port);
    code: |
      let packet = bytes.NewBuffer();
      let prob = "\x51\x00\x00\x00\x00\x00\x00\x21\x00\x00\x00\x0bsecuremote\x00"
      data = packet.Write(prob)
      const c = require("nuclei/net");
      let conn = c.Open('tcp', `${Host}:${Port}`);
      conn.Send(data);
      let resp = conn.RecvFullString();
      let regex = /CN=(.+),O=(.+?)\./i;
      let match = resp.match(regex);
      let fw_hostname = match[1];
      let sc_hostname = match[2];
      let result = (`Firewall Host: ${fw_hostname}, SmartCenter Host: ${sc_hostname}`);
      result

    args:
      Host: "{{Host}}"
      Port: 264

    extractors:
      - type: dsl
        dsl:
          - response
