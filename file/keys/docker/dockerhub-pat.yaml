id: dockerhub-pat

info:
  name: Docker Hub Personal 访问令牌 泄露检测（本地文件安全扫描）
  author: DhiyaneshDK
  severity: high
  description: |
    Docker Hub Personal 访问令牌用于从镜像仓库拉取或推送容器镜像。配置中的认证信息泄露后，攻击者可能读取私有镜像，或在凭据具备写权限时植入恶意镜像和供应链内容。本模板在全部文件中使用服务名、凭据前缀或字段上下文，并结合令牌长度和字符集约束提取候选值；正则命中只表示格式相似，不能单独证明凭据仍有效或拥有相应权限。
  impact: |
    - 读取权限可能导致私有镜像、依赖和环境变量泄露，暴露应用源码和构建秘密。
    - 推送权限可能被用于上传后门镜像，影响集群部署和软件供应链。
    - Kubernetes 中的镜像凭据还可能被多个命名空间或节点复用，扩大泄露范围。
  remediation: |
    - 在 Docker Hub 或目标镜像仓库撤销并重新生成命中的令牌，限制到必要仓库、操作和有效期。
    - 更新 Kubernetes Secret、ServiceAccount 和 CI/CD 凭据，避免在镜像层、Pod 日志和清单历史中保留旧值。
    - 对镜像启用签名、扫描和发布审批，审计泄露期间的拉取、推送和标签变更。
  reference:
    - https://github.com/praetorian-inc/noseyparker/blob/main/crates/noseyparker/data/default/builtin/rules/dockerhub.yml
    - https://docs.docker.com/security/for-developers/access-tokens/
  metadata:
    verified: true
  tags: docker,keys,file

file:
  - extensions:
      - all

    extractors:
      - type: regex
        part: body
        regex:
          - \b(dckr_pat_[a-zA-Z0-9_-]{27})(?:$|[^a-zA-Z0-9_-])
