id: enumeration-gitea-userenum

info:
  name: Gitea 用户枚举
  author: icarot
  severity: low
  description: |
    该模板用于核查 Gitea 用户枚举。该类问题通常源于用户、账号、仓库或接口查询端点缺少枚举防护，导致攻击者可批量验证目标对象是否存在。模板会向目标发送探测请求，并依据请求 `/explore/users/sitemap-1.xml`、`/schemas/sitemap/`、匹配 `lastmod`、状态码 200等证据确认目标是否存在该配置问题。
  impact: |
    - 攻击者可收集有效账号、仓库、用户资料或组织结构信息。
    - 枚举结果可被用于密码喷洒、钓鱼、凭据填充或后续权限攻击。
  remediation: |
    - 对枚举接口增加认证授权、速率限制和统一错误响应。
    - 避免在未授权响应中区分“存在”和“不存在”等状态差异。
    - 监控批量查询、异常失败率和针对账号空间的自动化探测。
  classification:
    cpe: cpe:2.3:a:gitea:gitea:*:*:*:*:*:-:*:*
  metadata:
    max-request: 1
    vendor: gitea
    product: gitea
    shodan-query: title:"Gitea"
  tags: gitea,enumeration

http:
  - method: GET
    path:
      - "{{BaseURL}}/explore/users/sitemap-1.xml"

    matchers-condition: and
    matchers:
      - type: word
        words:
          - '/schemas/sitemap/'
          - 'lastmod'
        condition: and

      - type: status
        status:
          - 200

    extractors:
      - type: regex
        name: user
        group: 1
        part: body
        regex:
          - "<loc>https?:\\/\\/.+\\/(?<user>.+)<\\/loc>"
