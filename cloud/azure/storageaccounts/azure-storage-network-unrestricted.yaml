id: azure-storage-network-unrestricted
info:
  name: Azure Storage Default Network 访问 未Restricted（云安全）
  author: princechaddha
  severity: medium
  description: Azure Storage 的 networkRuleSet.defaultAction 为 Allow 时，存储账户网络 ACL 默认允许来自公共网络的请求，访问边界主要依赖身份认证、SAS 和其他数据平面权限控制。本模板枚举存储账户并查询 defaultAction，在返回 "Allow" 时报告默认网络访问未收敛；该结果不等同于绕过认证或允许匿名读取。
  impact: |
    - 存储数据平面持续可从公网到达，会扩大凭据、SAS 或应用漏洞遭利用后的数据枚举、下载和写入攻击面。
    - 一旦访问凭据泄露，攻击者可从任意网络发起访问，数据外传和恶意修改更难通过网络边界阻断。
  remediation: |
    - 对不需要公网访问的账户将 defaultAction 设置为 Deny，并按业务需要配置虚拟网络、IP 规则或 Private Endpoint。
    - 复核现有客户端、SAS 和身份权限，确认收紧网络规则后业务仍可用，并持续审计网络 ACL 的变更。
  reference:
    - https://docs.microsoft.com/en-us/azure/storage/common/storage-network-security
  metadata:
    vendor: microsoft
    product: azure-storage
  tags: cloud,devops,azure,microsoft,storage,azure-cloud-config

flow: |
  code(1);
  for (let StorageData of iterate(template.storageList)) {
    StorageData = JSON.parse(StorageData);
    set("name", StorageData.Name);
    code(2);
  }

self-contained: true
code:
  - engine:
      - sh
      - bash
    source: |
      az storage account list --query '[*].{"Name":name}'

    extractors:
      - type: json
        name: storageList
        internal: true
        json:
          - '.[]'

  - engine:
      - sh
      - bash
    source: |
      az storage account show --name "$name" --query 'networkRuleSet.defaultAction'

    matchers-condition: and
    matchers:
      - type: word
        words:
          - '"Allow"'

    extractors:
      - type: dsl
        dsl:
          - 'name + " storage account network access is not restricted (default action is Allow)"'
