id: monstra-admin-panel

info:
  name: Monstra Admin 面板识别（暴露面识别）
  author: ritikchaddha
  severity: info
  description: 该模板通过识别 Monstra Admin 面板、控制台或管理界面的页面特征，判断目标是否暴露了对应服务入口。若命中，说明该后台或运维界面对外可访问，可用于资产识别与暴露面排查。
  reference:
    - https://github.com/monstra-cms/monstra/
  classification:
    cvss-metrics: CVSS:3.0/AV:N/AC:L/PR:N/UI:N/S:U/C:N/I:N/A:N
    cwe-id: CWE-200
    cpe: cpe:2.3:a:monstra:monstra_cms:*:*:*:*:*:*:*:*
  metadata:
    verified: true
    max-request: 1
    vendor: monstra
    product: monstra_cms
    shodan-query: http.favicon.hash:419828698
    fofa-query: icon_hash=419828698
  tags: panel,monstra,discovery

http:
  - method: GET
    path:
      - "{{BaseURL}}/admin/index.php"

    matchers-condition: and
    matchers:
      - type: word
        part: body
        words:
          - 'content="Monstra Admin Area'

      - type: status
        status:
          - 200

    extractors:
      - type: regex
        part: body
        group: 1
        regex:
          - 'Version ([0-9.]+)'
