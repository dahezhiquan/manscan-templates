id: api-harvardart

info:
  name: Harvard Art Museums API Token 可用性校验（token喷洒）
  author: daffainfo
  severity: info
  description: 该模板通过调用 Harvard Art Museums API 的已知接口验证提供的 token 是否有效，命中后通常表示可访问相关 API 能力。
  reference:
    - https://github.com/harvardartmuseums/api-docs
    - https://github.com/daffainfo/all-about-apikey/tree/main/harvard-art-museums
  metadata:
    max-request: 1
  tags: token-spray,harvardart

self-contained: true

http:
  - method: GET
    path:
      - "https://api.harvardartmuseums.org/color/34838442?apikey={{token}}"

    matchers:
      - type: word
        part: body
        words:
          - '"colorid"'
          - '"name"'
          - '"hex"'
        condition: and
