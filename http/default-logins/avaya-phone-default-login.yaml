id: avaya-phone-default-login

info:
  name: Avaya Phone Web Interface 默认口令登录（弱口令）
  author: tpierru
  severity: high
  description: |
    该模板通过尝试 Avaya Phone Web Interface 的默认账号口令，并依据认证成功后的响应特征判断目标是否仍在使用未修改的弱口令。若命中，攻击者可直接登录系统，进一步访问敏感信息、修改配置或执行未授权操作。
  reference:
    - https://documentation.avaya.com/bundle/InstallandadminJ100seriesIPPhone_r4.1.x/page/Logging_into_web_UI.html
  classification:
    cwe-id: CWE-1392
  metadata:
    verified: true
    max-requests: 1
    shodan-query: html:"Avaya J179 Phone"
  tags: default-login,avaya,misconfig

variables:
  username: "admin"
  password: "27238"

flow: http(1) && http(2)

http:
  - method: GET
    path:
      - "{{BaseURL}}/cgi-bin/J100WebServer.cgi?Operation=0"

    extractors:
      - type: kval
        name: nonce
        kval:
          - j100nonce
        internal: true

  - raw:
      - |
        POST /cgi-bin/J100WebServer.cgi?Operation=1 HTTP/1.1
        Host: {{Host}}
        Content-Type: application/x-www-form-urlencoded

        uname={{username}}&psw={{sha256(concat(password,nonce))}}

    matchers-condition: and
    matchers:
      - type: word
        part: body
        words:
          - "/cgi-bin/J100WebServer.cgi?Operation=211"
          - "id=\"redirectToDefault"
        condition: or

      - type: word
        part: body
        words:
          - "Invalid username or password"
        negative: true

      - type: status
        status:
          - 200
