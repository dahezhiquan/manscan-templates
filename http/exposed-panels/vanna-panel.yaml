id: vanna-panel

info:
  name: Vanna AI 面板识别（指纹识别）
  author: rxerium
  severity: info
  description: |-
    Vanna AI 是面向数据库问答的 AI SQL 助手，用于自然语言生成 SQL、查询数据和构建聊天式分析。该模板请求首页，并依据 HTTP 200 状态码、页面标题、正文关键字或品牌资源特征识别目标是否部署了该系统或暴露了对应入口，适用于资产指纹确认；命中结果仅表示系统特征匹配，不代表已确认存在未授权访问或可利用漏洞。
  reference:
  - https://github.com/vanna-ai/vanna
  - https://vanna.ai
  metadata:
    verified: true
    max-request: 1
    vendor: vanna-ai
    product: vanna
    shodan-query: 'http.title:"Vanna"'
  tags: panel,vanna,ai,sql,chat,detect,discovery

http:
  - method: GET
    path:
      - "{{BaseURL}}"

    host-redirects: true
    max-redirects: 2

    matchers-condition: and
    matchers:
      - type: regex
        part: body
        regex:
          - "(?i)<title>[^<]*Vanna[^<]*</title>"

      - type: word
        part: body
        words:
          - "vanna-"

      - type: status
        status:
          - 200
