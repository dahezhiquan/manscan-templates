id: langtrace-panel

info:
  name: Langtrace 面板 - 检测（指纹识别）
  author: rxerium
  severity: info
  description: |-
    检测到目标站点存在 Langtrace 相关响应特征。Langtrace 是面向 LLM 应用的追踪与可观测性平台，用于采集调用链、性能、成本和模型交互数据。模板请求 `/`，并通过页面标题或正文关键字、状态码确认该系统指纹，用于资产识别、系统盘点和暴露面梳理。
  reference:
    - https://github.com/Scale3-Labs/langtrace
    - https://langtrace.ai
  metadata:
    verified: true
    max-request: 1
    vendor: scale3labs
    product: langtrace
    shodan-query: 'http.title:"Langtrace"'
  tags: panel,langtrace,llm,ai,observability,detect,discovery
http:
  - method: GET
    path:
      - "{{BaseURL}}"

    host-redirects: true
    max-redirects: 2

    matchers-condition: and
    matchers:
      - type: word
        part: body
        words:
          - "<title>Langtrace</title>"
          - "Open source observability for your LLM applications"
        condition: and

      - type: status
        status:
          - 200
