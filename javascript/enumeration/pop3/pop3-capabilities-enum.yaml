id: pop3-capabilities-enum

info:
  name: POP3 能力枚举（服务漏洞）
  author: pussycat0x,daffainfo
  severity: low
  description: |
    该模板枚举 POP3 服务支持的 CAPA 能力与实现信息。模板连接 POP3 端口发送 CAPA 命令，并根据 +OK 响应、能力关键字与提取结果确认服务特征。
  impact: |
    - POP3 能力枚举会暴露认证机制、TLS 支持和邮件服务实现特征。
    - 攻击者可据此判断是否存在明文认证、弱认证方式或过时服务端版本。
  remediation: |
    - 禁用明文认证或过时认证机制，优先要求 TLS 保护的 POP3S/STARTTLS。
    - 限制 POP3 服务暴露范围，保持邮件服务端更新并审计异常能力探测。
  reference:
    - https://nmap.org/nsedoc/scripts/pop3-capabilities.html
  metadata:
    verified: true
    max-request: 1
    shodan-query: "port:110"
  tags: js,network,pop3,enum,discovery

javascript:
  - pre-condition: |
      isPortOpen(Host,Port);
    code: |
      let data = "CAPA\r\n"
      let c = require("nuclei/net");
      let conn = c.Open('tcp', `${Host}:${Port}`);
      conn.Send(data);
      let result = conn.RecvString();
      Export(result);

    args:
      Host: "{{Host}}"
      Port: 110

    matchers-condition: and
    matchers:
      - type: dsl
        dsl:
          - "success == true"

      - type: regex
        regex:
          - '\+OK.*'

      - type: word
        words:
          - "HTTP/1.1"
        negative: true

    extractors:
      - type: dsl
        dsl:
          - replace_regex(replace_regex(response, "\\+OK.*\\r\\n\\+OK.*\\r\\n", ""), "\\r\\n", " ")
