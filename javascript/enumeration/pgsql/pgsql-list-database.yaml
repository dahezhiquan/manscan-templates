id: pgsql-list-database

info:
  name: PostgreSQL 数据库列表枚举（服务漏洞）
  author: pussycat0x
  severity: high
  description: |
    PostgreSQL 服务接受模板尝试的凭据后，允许已认证用户查询 pg_database 并枚举实例中的数据库列表，说明账号可见范围可能超过业务所需。该模板登录后执行 SELECT datname FROM pg_database，并输出可见库名作为验证证据。
  impact: |
    - 数据库列表会暴露业务系统、租户划分、环境名称和潜在敏感库。
    - 攻击者可据此优先选择高价值数据库继续查询或尝试权限提升。
  remediation: |
    - 移除弱凭据，并限制普通账号枚举无关数据库的权限。
    - 使用最小权限角色和网络访问控制，监控异常数据库清单查询。
  reference:
    - https://github.com/swisskyrepo/PayloadsAllTheThings/blob/master/SQL%20Injection/PostgreSQL%20Injection.md#postgresql-list-password-hashes
    - https://launchbylunch.com/posts/2024/Jan/16/postgres-password-encryption/#postgresql-password-encryption-scram-sha-256
  metadata:
    verified: true
    max-request: 8
    shodan-query: "product:\"PostgreSQL\""
    vendor: postgresql
    product: postgresql
  tags: js,network,postgresql,authenticated,enum,discovery
javascript:
  - pre-condition: |
      isPortOpen(Host,Port);
    code: |
      const postgres = require('nuclei/postgres');
      const client = new postgres.PGClient;
      connected =  client.ExecuteQuery(Host, Port, User, Pass, Db, "SELECT datname FROM pg_database");
      Export(connected);

    args:
      Host: "{{Host}}"
      Port: 5432
      User: "{{usernames}}"
      Pass: "{{password}}"
      Db: "{{database}}"

    payloads:
      usernames:
        - postgres
        - admin
      password:
        - postgres
        -
        - 123
        - amber
      database:
        - postgres

    attack: clusterbomb

    extractors:
      - type: json
        json:
          - '.Rows[].datname'
