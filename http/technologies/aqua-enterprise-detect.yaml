id: aqua-enterprise-detect

info:
  name: Aqua Enterprise 指纹识别（指纹识别）
  author: daffainfo
  severity: info
  description: Aqua Enterprise 是云原生安全平台，用于容器、镜像、Kubernetes 和运行时安全管理。该模板请求 `/api`，并依据 HTTP 200 状态码、页面标题、正文关键字或品牌资源特征识别目标是否使用或暴露了 Aqua Enterprise 相关组件，适用于资产盘点、技术栈识别和后续安全评估；命中结果仅表示指纹特征匹配，不代表已确认存在可利用漏洞。
  reference:
  - https://www.aquasec.com/
  metadata:
    verified: true
    max-request: 1
    shodan-query: http.favicon.hash:-1261322577
  tags: tech,aqua,discovery

http:
  - method: GET
    path:
      - "{{BaseURL}}/api"

    matchers-condition: and
    matchers:
      - type: regex
        part: body
        regex:
          - '"version"'
          - '"enable_sso"'
          - '"num_protected_kube_nodes"'
        condition: and

      - type: status
        status:
          - 200

    extractors:
      - type: regex
        group: 1
        regex:
          - '{"version":"([0-9.]+)",'
