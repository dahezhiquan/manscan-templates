id: zte-panel

info:
  name: ZTE 面板识别（暴露面识别）
  author: its0x08,idealphase
  severity: info
  description: |
    该模板通过识别 ZTE 面板、控制台或管理界面的页面特征，判断目标是否暴露了对应服务入口。若命中，说明该后台或运维界面对外可访问，可用于资产识别与暴露面排查。
  reference:
    - https://www.zte.com.cn/global/
  classification:
    cvss-metrics: CVSS:3.0/AV:N/AC:L/PR:N/UI:N/S:U/C:N/I:N/A:N
    cwe-id: CWE-200
    cpe: cpe:2.3:h:zte:nr8120a:*:*:*:*:*:*:*:*
  metadata:
    verified: true
    max-request: 1
    shodan-query: http.html:"ZTE Corporation"
    product: nr8120a
    vendor: zte
  tags: panel,zte,discovery

http:
  - method: GET
    path:
      - "{{BaseURL}}"

    matchers:
      - type: word
        part: body
        words:
          - "ZTE Corporation. All rights reserved. </div>"
          - '<form name="fLogin" id="fLogin" method="post"  onsubmit="return false;" action="">'
        condition: and

      - type: word
        part: header
        words:
          - "Mini web server 1.0 ZTE corp 2005."

    extractors:
      - type: regex
        part: body
        group: 1
        regex:
          - '<div class="type"><font id="">(.+)<\/font><\/div>'
