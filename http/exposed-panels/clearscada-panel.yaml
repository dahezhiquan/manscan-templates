id: clearscada-panel

info:
  name: Schneider Electric ClearSCADA 面板（暴露面识别）
  author: rxerium
  severity: info
  description: |
    该模板用于识别 Schneider Electric ClearSCADA 是否存在对外暴露的管理、服务或状态界面。若命中，说明目标公开了相关功能入口，可作为资产盘点与攻击面收敛的依据。
  reference:
    - https://www.se.com/ww/en/work/products/product-launch/scada/
    - https://www.se.com/us/en/faqs/FA298792/
  metadata:
    max-request: 1
    verified: true
    vendor: Schneider Electric
    product: clearscada
    shodan-query: 'http.title:"ClearSCADA"'
  tags: panel,ics,scada,schneider,clearscada,discovery

http:
  - method: GET
    path:
      - '{{BaseURL}}'

    host-redirects: true
    max-redirects: 2

    matchers-condition: and
    matchers:
      - type: word
        part: body
        words:
          - 'ClearSCADA Home'
          - 'ClearSCADA'
          - '/webservices'
        condition: or

      - type: status
        status:
          - 200
