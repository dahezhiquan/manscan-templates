id: nocodb-public-registration-enabled

info:
  name: NocoDB 公开注册已启用
  author: pussycat0x
  severity: medium
  description: |
    该模板用于核查 NocoDB 公开注册已启用。该类问题通常源于公开注册、自助开户或默认初始化策略未按业务预期关闭。模板会向目标发送探测请求，并依据匹配 `contains(body, "token\":\"ey")`、匹配 `contains(header, 'application/json')`、匹配 `status_code == 200`等证据确认目标是否存在该配置问题。
  impact: |
    - 攻击者可自行创建账号进入系统，枚举内部功能、数据或协作空间。
    - 若新账号默认权限过高，可能进一步导致数据泄露、配置变更或平台滥用。
  remediation: |
    - 关闭不需要的公开注册和自助开户入口。
    - 对必须开放的注册流程增加审批、邮箱域限制、验证码和速率限制。
    - 审计近期新建账号、权限分配和异常登录行为。
  reference:
    - https://docs.nocodb.com/getting-started/self-hosted/environment-variables/
    - https://nocodb.com/docs/product-docs/account-settings/oss-specific-details
  metadata:
    max-request: 1
    verified: true
    shodan-query: http.title:"NocoDB"
    fofa-query: title="NocoDB"
    product: nocodb
    vendor: nocodb
  tags: nocodb,misconfig,exposure,intrusive

variables:
  email: "{{randstr}}@{{rand_base(5)}}.com"
  password: "{{rand_base(8)}}"

http:
  - raw:
      - |
        POST /api/v1/auth/user/signup HTTP/1.1
        Host: {{Hostname}}
        Content-Type: application/json

        {"email":"{{email}}","password":"{{password}}"}

    matchers:
      - type: dsl
        dsl:
          - contains(body, "token\":\"ey")
          - contains(header, 'application/json')
          - "status_code == 200"
        condition: and

    extractors:
      - type: dsl
        dsl:
          - '"Email: " + email + ". Password: "+ password'
