id: filebrowser-unauth

info:
  name: 文件 Browser 仪表盘 未授权 访问
  author: ritikchaddha
  severity: medium
  description: |
    检测到 文件 Browser 仪表盘 未授权 访问。目标功能在未认证状态下可访问，可能暴露管理入口、业务数据、系统状态或可执行操作，需确认是否存在访问控制缺失。
  reference:
    - https://filebrowser.org/
  metadata:
    verified: true
    max-request: 2
    shodan-query: http.favicon.hash:1052926265
    product: filebrowser
    vendor: filebrowser
    fofa-query: icon_hash=1052926265
  tags: misconfig,filebrowser,unauth,vuln

http:
  - method: GET
    path:
      - "{{BaseURL}}"
      - "{{BaseURL}}/login"

    stop-at-first-match: true
    host-redirects: true
    max-redirects: 2

    matchers-condition: and
    matchers:
      - type: word
        part: body
        words:
          - 'File Browser</title>'
          - 'window.FileBrowser'
        condition: or

      - type: word
        part: body
        words:
          - 'LoginPage":false'
          - '"NoAuth":true'
        condition: and
