id: piwik-unauthenticated-access

info:
  name: Piwik Matomo 未授权访问
  author: 0x_Akoko
  severity: high
  description: |
    该模板用于核查 Piwik Matomo 未授权访问。该类问题通常源于管理端、API、控制台或服务接口缺少认证授权，导致未登录用户可直接访问敏感功能。模板会向目标发送探测请求，并依据匹配 `nb_visits`、匹配 `nb_uniq_visitors`、匹配 `nb_actions`等证据确认目标是否存在该配置问题。
  impact: |
    - 攻击者可在未授权状态下查看系统状态、业务数据、任务信息或管理接口。
    - 若接口支持写操作，可能进一步导致配置篡改、服务接管、数据删除或横向移动。
  remediation: |
    - 为相关管理端和 API 启用认证授权，并按最小权限限制可访问功能。
    - 将管理接口限制在内网、VPN 或可信来源范围内，并开启访问审计。
    - 检查历史访问日志，确认是否存在未授权访问、批量枚举或异常操作。
  reference:
    - https://developer.matomo.org/api-reference/reporting-api
    - https://matomo.org/faq/general/faq_152/
  metadata:
    verified: true
    max-request: 5
    vendor: matomo
    product: matomo
    shodan-query:
      - http.title:"Piwik"
      - http.title:"Matomo"
    fofa-query:
      - title="Piwik"
      - title="Matomo"
  tags: piwik,matomo,unauth,exposure,misconfig,analytics

http:
  - method: GET
    path:
      - "{{BaseURL}}/index.php?module=API&method=VisitsSummary.get&idSite=1&period=day&date=today&format=json&token_auth=anonymous"
      - "{{BaseURL}}/matomo/index.php?module=API&method=VisitsSummary.get&idSite=1&period=day&date=today&format=json&token_auth=anonymous"
      - "{{BaseURL}}/piwik/index.php?module=API&method=VisitsSummary.get&idSite=1&period=day&date=today&format=json&token_auth=anonymous"
      - "{{BaseURL}}/index.php?module=API&method=SitesManager.getAllSites&format=json&token_auth=anonymous"
      - "{{BaseURL}}/matomo/index.php?module=API&method=SitesManager.getAllSites&format=json&token_auth=anonymous"

    stop-at-first-match: true
    matchers-condition: and
    matchers:
      - type: word
        part: body
        words:
          - "nb_visits"
          - "nb_uniq_visitors"
          - "nb_actions"
          - "idsite"
          - "main_url"
        condition: or

      - type: word
        part: content_type
        words:
          - "application/json"

      - type: status
        status:
          - 200
