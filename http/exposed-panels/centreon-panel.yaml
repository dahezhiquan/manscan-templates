id: centreon-panel

info:
  name: Centreon 登录面板识别（暴露面识别）
  author: pikpikcu,daffainfo
  severity: info
  description: 该模板通过识别 Centreon 登录入口的页面标题、特征文本或重定向行为，判断目标是否暴露了对应的认证界面。若命中，说明该登录面板对外可访问，可用于暴露面梳理与后续安全评估。
  classification:
    cvss-metrics: CVSS:3.0/AV:N/AC:L/PR:N/UI:N/S:U/C:N/I:N/A:N
    cwe-id: CWE-200
    cpe: cpe:2.3:a:centreon:centreon_web:*:*:*:*:*:*:*:*
  metadata:
    max-request: 1
    vendor: centreon
    product: centreon_web
    shodan-query:
      - http.title:"Centreon"
      - http.title:"centreon"
    fofa-query: title="centreon"
    google-query: intitle:"centreon"
  tags: panel,centreon,login,discovery

http:
  - method: GET
    path:
      - "{{BaseURL}}/centreon/index.php"

    matchers-condition: and
    matchers:
      - type: word
        part: body
        condition: or
        words:
          - '<title>Centreon - IT & Network Monitoring</title>'
          - '<input name="centreon_token" type="hidden"'

      - type: status
        status:
          - 200

    extractors:
      - type: regex
        part: body
        group: 1
        regex:
          - 'v. (.*)'
