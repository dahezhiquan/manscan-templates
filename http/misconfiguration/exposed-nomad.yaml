id: exposed-nomad

info:
  name: Nomad 暴露 Jobs
  author: pdteam
  severity: medium
  description: |
    检测到 Nomad 暴露 Jobs。目标响应或文件中可能暴露配置、凭据、密钥、令牌、环境变量或历史记录等敏感信息，可能被用于进一步入侵。
  reference:
    - https://www.nomadproject.io/docs/internals/security
  classification:
    cvss-metrics: CVSS:3.0/AV:N/AC:L/PR:N/UI:N/S:U/C:L/I:N/A:N
    cvss-score: 5.3
    cwe-id: CWE-200
  metadata:
    max-request: 1
  tags: nomad,devops,hashicorp,panel,misconfig,vuln

http:
  - method: GET
    path:
      - "{{BaseURL}}/ui/jobs"

    matchers-condition: and
    matchers:
      - type: word
        words:
          - "Nomad"
          - "nomad-ui"
        condition: and

      - type: word
        words:
          - "text/html"
        part: header

      - type: status
        status:
          - 200
