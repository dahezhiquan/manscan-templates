id: thingsboard-panel

info:
  name: ThingsBoard 登录面板识别（指纹识别）
  author: righettod
  severity: info
  description: |-
    ThingsBoard 是物联网平台，用于设备接入、遥测数据、规则引擎、仪表盘和告警管理。该模板请求 `/login`，并依据 DSL 条件识别目标是否部署了该系统或暴露了对应入口，适用于资产指纹确认；命中结果仅表示系统特征匹配，不代表已确认存在未授权访问或可利用漏洞。
  reference:
  - https://github.com/thingsboard/thingsboard
  - https://thingsboard.io/
  metadata:
    verified: true
    max-request: 1
    shodan-query: http.title:"ThingsBoard"
  tags: panel,thingsboard,detect,discovery

http:
  - method: GET
    path:
      - "{{BaseURL}}/login"

    matchers:
      - type: dsl
        dsl:
          - 'status_code == 200'
          - 'contains(to_lower(body), "<title>thingsboard</title>")'
        condition: and
