id: webview-file-access-fromfileurl-java

info:
  name: Android WebView file URL 文件访问检测 Java（本地文件安全扫描）
  author: 7h3b4dger
  severity: info
  description: |
    该模板在 Java 源码中检测 WebView 是否允许 file URL 发起文件访问。该配置可能让本地文件页面读取其他本地资源。
  tags: android,file,webview

file:
  - extensions:
      - java

    matchers-condition: and
    matchers:
      - type: word
        words:
          - "setAllowFileAccessFromFileURLs(true)"

      - type: regex
        part: body
        regex:
          - package\s+(?:.*)

    extractors:
      - type: regex
        part: body
        name: package
        group: 1
        regex:
          - (?m)^\s*package\s+([A-Za-z_][A-Za-z0-9_\.]*)\s*;
