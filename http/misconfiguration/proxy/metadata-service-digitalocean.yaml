id: metadata-service-digitalocean

# This attack abuses a misconfigured proxy that allows access to the metadata
# IP or a name which resolves to the IP. A standard proxy request is made to
# the proxy using the full metadata URL, which the proxy will fulfill to its
# own metadata service.
#
# The proxy may also be vulnerable to host/port enumeration on localhost or
# inside the private network.
info:
  name: DigitalOcean 元数据 服务 Check
  author: sullo
  severity: critical
  description: |
    检测到 DigitalOcean 元数据 服务 Check。目标可能暴露云实例、容器或运行环境元数据，攻击者可据此获取实例身份、网络配置、凭据线索或部署信息。
  remediation: |
    - 限制该端点的公网访问，仅允许可信来源访问。
    - 启用认证、授权和审计，并根据业务需要关闭不必要的调试或管理功能。
  reference:
    - https://developers.digitalocean.com/documentation/metadata/
    - https://blog.projectdiscovery.io/abusing-reverse-proxies-metadata/
    - https://www.mcafee.com/blogs/enterprise/cloud-security/how-an-attacker-could-use-instance-metadata-to-breach-your-app-in-aws/
  classification:
    cvss-metrics: CVSS:3.1/AV:N/AC:L/PR:N/UI:N/S:C/C:H/I:L/A:N
    cvss-score: 9.3
    cwe-id: CWE-441
  metadata:
    max-request: 2
  tags: exposure,config,digitalocean,proxy,misconfig,metadata,vuln

http:
  - raw:
      - |+
        GET http://{{hostval}}/metadata/v1.json HTTP/1.1
        Host: {{hostval}}

    payloads:
      hostval:
        - aws.oast.online
        - 169.254.169.254
    unsafe: true
    matchers:
      - type: word
        part: body
        words:
          - "droplet_id"
