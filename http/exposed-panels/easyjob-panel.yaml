id: easyjob-panel

info:
  name: EasyJOB 登录面板识别（暴露面识别）
  author: righettod
  severity: info
  description: |
    该模板通过识别 EasyJOB 登录入口的页面标题、特征文本或重定向行为，判断目标是否暴露了对应的认证界面。若命中，说明该登录面板对外可访问，可用于暴露面梳理与后续安全评估。
  reference:
    - https://www.en.because-software.com/software/easyjob/
  metadata:
    verified: true
    max-request: 1
    shodan-query: http.title:"Log in - easyJOB"
  tags: panel,easyjob,login,discovery

http:
  - method: GET
    path:
      - "{{BaseURL}}/easy/app/Account/Login"

    matchers:
      - type: dsl
        dsl:
          - 'status_code == 200'
          - 'contains(body, "easyJOB") && contains(body, "/easy/app/") && contains(body, "because-software.com")'
        condition: and

    extractors:
      - type: regex
        part: body
        group: 1
        regex:
          - 'easyJOB\s+([0-9.]+)'
