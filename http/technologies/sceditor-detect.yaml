id: sceditor-detect

info:
  name: SCEditor 指纹识别（指纹识别）
  author: pikpikcu
  severity: info
  description: >-
    SCEditor 是浏览器富文本/BBCode 编辑器组件，用于论坛、CMS 和表单中的文本编辑。该模板通过请求目标服务并检查预设路径或首页响应、页面正文关键字、状态码等指纹特征，判断目标是否使用或暴露了
    SCEditor 相关组件；命中结果仅表示指纹特征匹配，可用于资产盘点、技术栈识别和后续安全评估，不代表已确认存在可利用漏洞。
  metadata:
    max-request: 1
  tags: tech,sceditor,discovery
http:
  - method: GET
    path:
      - "{{BaseURL}}"

    matchers-condition: and
    matchers:
      - type: word
        words:
          - "<title>Ticket BBCode editor - SCEditor</title>"
          - 'title="SCEditor"'
        condition: and

      - type: status
        status:
          - 200
