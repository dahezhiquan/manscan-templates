id: fastmile-5g-gateway-panel

info:
  name: FastMile 5G Gateway 面板识别（指纹识别）
  author: Th3l0newolf
  severity: info
  description: |-
    检测到目标站点存在 FastMile 5G Gateway 相关响应特征。FastMile 5G Gateway 是网络设备或网关的 Web 管理界面，用于配置路由、无线、蜂窝接入、端口转发和设备运维参数。模板请求 `/web_whw/`、`/web_whw/overview` 路径，并通过页面标题或正文关键字、状态码确认该系统指纹，用于资产识别、系统盘点和暴露面梳理。
  classification:
    cvss-metrics: CVSS:3.0/AV:N/AC:L/PR:N/UI:N/S:U/C:N/I:N/A:N
    cwe-id: CWE-200
  metadata:
    max-request: 2
    verified: true
    shodan-query: html:"FastMile 5G Gateway"
  tags: panel,login,router,5g,detect,discovery
http:
  - method: GET
    path:
      - "{{BaseURL}}/web_whw/"
      - "{{BaseURL}}/web_whw/overview"

    stop-at-first-match: true
    matchers-condition: and
    matchers:
      - type: word
        part: body
        words:
          - "<title>FastMile 5G Gateway</title>"

      - type: status
        status:
          - 200
