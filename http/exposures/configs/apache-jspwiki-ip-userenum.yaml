id: apache-jspwiki-ip-userenum

info:
  name: Apache JSPWiki User IP Enumeration 泄露（暴露面识别）
  author: icarot
  severity: low
  description: |
    检测到对外可访问的 Apache JSPWiki User IP Enumeration。这类配置资源可能包含部署细节、访问凭据、内部地址、组件版本或调试开关，公开暴露后会显著增加被侦察和后续利用的风险。
  classification:
    cpe: cpe:2.3:a:apache:jspwiki:*:*:*:*:*:*:*:*
  metadata:
    max-request: 1
    verified: true
    vendor: apache
    product: jspwiki
  tags: jspwiki,apache,enumeration,discovery

http:
  - method: GET
    path:
      - "{{BaseURL}}/Wiki.jsp?page=SystemInfo"

    matchers-condition: and
    matchers:
      - type: word
        part: body
        words:
          - '<b>Active Wiki Users</b>'
          - 'Number of active sessions'
        condition: and

      - type: status
        status:
          - 200
