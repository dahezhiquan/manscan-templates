id: abb-ability-genix-detect

info:
  name: ABB Ability Genix 工业分析与人工智能套件 - 检测（指纹识别）
  author: rxerium
  severity: info
  description: |-
    检测到 ABB Ability Genix 工业数据分析与人工智能管理门户。
  reference:
    - https://new.abb.com/process-automation/genix
  metadata:
    max-request: 1
    shodan-query: 'title:"ABB Ability" title:"Genix Industrial Analytics"'
  tags: tech,abb,genix,iiot,ics

http:
  - method: GET
    path:
      - "{{BaseURL}}"

    matchers-condition: and
    matchers:
      - type: word
        part: body
        words:
          - '<title>ABB Ability&trade; Genix Industrial Analytics and AI Suite</title>'
          - 'assets/abb_favicon.ico'
        condition: and

      - type: status
        status:
          - 200
