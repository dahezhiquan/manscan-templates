id: cloudtrail-s3-bucket-logging
info:
  name: CloudTrail 日志桶访问日志未启用（云安全）
  author: princechaddha
  severity: high
  description: CloudTrail 日志桶访问日志未启用是一类日志存储位置审计缺失风险，对 CloudTrail 日志桶本身的读取、写入和删除访问可能缺少独立记录。发生未授权访问或日志篡改尝试时，缺少桶访问日志会降低取证能力。模板获取 trail 关联的 `S3BucketName` 后调用 `aws s3api get-bucket-logging --query LoggingEnabled`，当返回 `null` 时判定访问日志未配置。
  impact: |
    - 对 CloudTrail 日志桶本身的访问行为缺少记录，可能无法发现未授权读取或删除尝试。
    - 日志存储位置发生异常访问时，取证人员会缺少桶级访问证据。
  remediation: |
    - 为 CloudTrail 日志桶启用 S3 Server Access Logging 或等效的集中化访问审计能力。
    - 将访问日志投递到独立、受控的目标桶，并配置权限、加密和生命周期策略。
  reference:
    - https://docs.aws.amazon.com/awscloudtrail/latest/userguide/cloudtrail-log-file-validation-intro.html
  metadata:
    max-request: 3
    vendor: amazon
    product: s3
  tags: cloud,devops,aws,amazon,s3,cloudtrail,aws-cloud-config
variables:
  region: "ap-south-1"

flow: |
  code(1)
  for(let CloudTrail of iterate(template.cloudtrailname)){
    set("trail", CloudTrail)
    code(2)
    for(let BucketNames of iterate(template.buckets)){
      set("bucket", BucketNames)
      code(3)
    }
  }

self-contained: true
code:
  - engine:
      - sh
      - bash
    source: |
      aws cloudtrail list-trails --region $region --query 'Trails[*].Name' --output json

    extractors:
      - type: json
        name: cloudtrailname
        internal: true
        json:
          - '.[]'

  - engine:
      - sh
      - bash
    source: |
      aws cloudtrail describe-trails --region $region --trail-name-list $trail --query 'trailList[*].S3BucketName'

    extractors:
      - type: json
        name: buckets
        internal: true
        json:
          - '.[]'

  - engine:
      - sh
      - bash
    source: |
      aws s3api get-bucket-logging --bucket $bucket --query 'LoggingEnabled'

    matchers:
      - type: word
        words:
          - 'null'

    extractors:
      - type: dsl
        dsl:
          - '"Access logging is not enabled for the S3 bucket associated with CloudTrail trail " + trail'
