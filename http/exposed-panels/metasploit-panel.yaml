id: metasploit-panel

info:
  name: Metasploit 面板识别（暴露面识别）
  author: lu4nx
  severity: info
  description: |
    该模板通过识别 Metasploit 面板、控制台或管理界面的页面特征，判断目标是否暴露了对应服务入口。若命中，说明该后台或运维界面对外可访问，可用于资产识别与暴露面排查。
  classification:
    cvss-metrics: CVSS:3.1/AV:N/AC:L/PR:N/UI:N/S:U/C:N/I:N/A:N
    cwe-id: CWE-200
    cpe: cpe:2.3:a:rapid7:metasploit:*:*:*:*:*:*:*:*
  metadata:
    verified: true
    max-request: 1
    vendor: rapid7
    product: metasploit
    shodan-query:
      - http.title:"metasploit"
      - http.title:"metasploit - setup and configuration"
    zoomeye-query: app="Metasploit"
    fofa-query:
      - title="metasploit"
      - title="metasploit - setup and configuration"
    google-query:
      - intitle:"metasploit"
      - intitle:"metasploit - setup and configuration"
  tags: panel,metasploit,login,rapid7,discovery

http:
  - method: GET
    path:
      - '{{BaseURL}}/login'

    matchers-condition: and
    matchers:
      - type: word
        part: body
        words:
          - '<title>Metasploit</title>'

      - type: status
        status:
          - 200
