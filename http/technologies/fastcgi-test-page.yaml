id: fastcgi-test-page

info:
  name: FastCGI 测试页面指纹识别（指纹识别）
  author: DhiyaneshDk
  severity: info
  description: |
    用于识别目标是否使用 FastCGI 测试页面，模板会结合页面标题、页面正文、状态码和特定路径或已知端点进行技术指纹匹配。
  metadata:
    verified: true
    max-request: 1
    google-query: intitle:"FastCGI test page"
  tags: tech,fastcgi,discovery

http:
  - method: GET
    path:
      - "{{BaseURL}}/test/fcgi/test.html"

    matchers-condition: and
    matchers:
      - type: word
        part: body
        words:
          - 'FastCGI test page'
          - 'FastCGI possibilities test page'
        condition: and

      - type: status
        status:
          - 200
