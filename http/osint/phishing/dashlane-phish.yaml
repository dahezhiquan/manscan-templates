id: dashlane-phish

info:
  name: Dashlane 仿冒钓鱼网站（钓鱼网站识别）
  author: rxerium
  severity: info
  description: |
    检测到疑似仿冒 Dashlane 的钓鱼网站。模板在目标页面返回 200、页面内容命中 Dashlane 的登录或账号页面特征，且当前主机不属于 dashlane.com 官方域名时触发，用于识别借用 Dashlane 品牌页面诱导用户信任的仿冒站点。
  reference:
    - https://dashlane.com
  metadata:
    max-request: 1
  tags: phishing,dashlane,osint,discovery
http:
  - method: GET
    path:
      - "{{BaseURL}}"

    host-redirects: true
    max-redirects: 2

    matchers-condition: and
    matchers:
      - type: word
        words:
          - 'Dashlane Password Manager'
          - 'Dashlane Password Manager safeguards businesses &amp; people with easy-to-use, powerful features. Protect &amp; manage passwords and passkeys in one secure solution.'
        condition: and

      - type: status
        status:
          - 200

      - type: dsl
        dsl:
          - '!contains(host,"dashlane.com")'
