id: misconfigured-docker

info:
  name: Docker 容器 配置不当 暴露
  author: dhiyaneshDK
  severity: critical
  description: |
    检测到 Docker 容器 配置不当 暴露。目标功能在未认证状态下可访问，可能暴露管理入口、业务数据、系统状态或可执行操作，需确认是否存在访问控制缺失。
  reference:
    - https://madhuakula.com/content/attacking-and-auditing-docker-containers-using-opensource/attacking-docker-containers/misconfiguration.html
  metadata:
    max-request: 1
  tags: misconfig,docker,unauth,devops,vuln

http:
  - method: GET
    path:
      - "{{BaseURL}}/images/json"

    matchers-condition: and
    matchers:
      - type: word
        words:
          - '"ParentId":'
          - '"Containers":'
          - '"Labels":'
        condition: and

      - type: status
        status:
          - 200
