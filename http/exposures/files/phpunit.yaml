id: phpunit

info:
  name: phpunit.XML 文件泄露（暴露面识别）
  author: pikpikcu
  severity: info
  description: 检测到对外可访问的 phpunit.XML 文件。相关文件可能泄露项目结构、依赖关系、部署细节、敏感参数或其他不应公开的内部信息。
  remediation: |
    - 将相关文件或接口移出 Web 根目录，或通过鉴权与访问控制限制访问。
    - 清理已暴露内容中的敏感信息，并评估是否需要轮换关联凭据。
    - 检查部署、备份与静态资源发布流程，防止同类资源再次被公开访问。
  reference:
    - https://www.wampserver.com/en/
  classification:
    cwe-id: CWE-200
  metadata:
    max-request: 1
  tags: exposure,files,vuln

http:
  - method: GET
    path:
      - "{{BaseURL}}/phpunit.xml"

    matchers-condition: and
    matchers:
      - type: word
        words:
          - "<phpunit"
          - "</phpunit>"
        condition: and

      - type: status
        status:
          - 200
