id: vllm-openai-api-exposed

info:
  name: vLLM OpenAI 兼容 API - 未认证暴露（暴露面识别）
  author: fsoppelsa
  severity: medium
  description: |
    检测到目标站点对外暴露 vLLM OpenAI 兼容 API -。vLLM 是大语言模型推理服务框架，OpenAI 兼容 API 可承载模型调用和推理资源。该模板请求 `/v1/models`，并结合 HTTP 状态码、响应正文关键字、JSON 字段、接口文档特征或响应头进行确认。公开的接口、接口文档、调试端点或管理 API 可能泄露路由结构、参数格式、认证方式和内部功能边界，帮助攻击者完成接口枚举和后续利用准备。
  impact: |-
    - 攻击者可枚举接口路径、参数、认证方式和数据模型，降低后续漏洞挖掘与越权测试成本。
    - 若接口缺少鉴权或权限边界配置不当，可能进一步读取、修改业务数据或调用管理功能。
    - 公开的调试、文档或管理端点会暴露内部服务结构、组件版本和部署信息，扩大攻击面。
  remediation: |-
    - 关闭生产环境不需要公开的 API 文档、调试端点、管理 API 或诊断页面。
    - 为必须保留的接口启用统一鉴权、最小权限、租户隔离、速率限制和审计日志。
    - 通过 API 网关、反向代理或防火墙限制来源地址，避免管理类或内部接口直接暴露在公网。
    - 复查接口文档中暴露的示例密钥、测试账号、内部域名和敏感参数，并及时清理或轮换。
  reference:
    - https://docs.vllm.ai/en/latest/serving/openai_compatible_server.html
    - https://github.com/vllm-project/vllm
  classification:
    cvss-metrics: CVSS:3.1/AV:N/AC:L/PR:N/UI:N/S:U/C:L/I:N/A:L
    cvss-score: 6.5
    cwe-id: CWE-306
  metadata:
    verified: true
    max-request: 1
    shodan-query: title:"vLLM"
    fofa-query: title="vLLM"
  tags: exposure,vllm,llm,ai,api,unauth,misconfig

http:
  - method: GET
    path:
      - "{{BaseURL}}/v1/models"

    matchers-condition: and
    matchers:
      - type: regex
        regex:
          - '"object"\s*:\s*"list"'

      - type: regex
        regex:
          - '"owned_by"\s*:\s*"vllm'
          - '"max_model_len"'
        condition: or

      - type: word
        part: header
        words:
          - "application/json"

      - type: status
        status:
          - 200

    extractors:
      - type: json
        part: body
        json:
          - ".data[].id"
