id: gcloud-dns-dnssec-unenabled

info:
  name: DNSSEC 未Enabled 的Google Cloud DNS Zones（云安全）
  author: princechaddha
  severity: medium
  description: DNSSEC 可为 Cloud DNS 托管区域提供 DNS 响应完整性验证，降低记录被伪造或篡改的风险。本模板枚举 managed zones，并检查 dnssecConfig.state，值为 off 时报告该区域未启用 DNSSEC。
  impact: |
    - 解析链路缺少 DNSSEC 保护时，用户可能更容易受到 DNS 欺骗、缓存投毒或流量劫持影响。
    - 对关键域名或合规要求场景，未启用 DNSSEC 会降低域名解析可信度。
  remediation: |
    - 为需要保护的 Cloud DNS 公共托管区域启用 DNSSEC，并在注册商侧正确发布 DS 记录。
    - 启用后监控签名状态和密钥轮换，避免配置错误导致域名解析失败。
  reference:
    - https://cloud.google.com/dns/docs/dnssec
  metadata:
    vendor: google
    product: cloud-dns
  tags: cloud,devops,gcp,gcloud,dns,gcp-cloud-config,discovery

flow: |
  code(1)
  for(let projectId of iterate(template.projectIds)){
    set("projectId", projectId)
    code(2)
    for(let managedZone of iterate(template.managedZones)){
      set("managedZoneName", managedZone)
      code(3)
    }
  }

self-contained: true

code:
  - engine:
      - sh
      - bash
    source: |
      gcloud projects list --format="json(projectId)"

    extractors:
      - type: json
        name: projectIds
        internal: true
        json:
          - '.[].projectId'

  - engine:
      - sh
      - bash
    source: |
      gcloud dns managed-zones list --project $projectId --format="json(name,visibility)"

    extractors:
      - type: json
        name: managedZones
        internal: true
        json:
          - '.[].name'

  - engine:
      - sh
      - bash
    source: |
      gcloud dns managed-zones describe $managedZoneName --project $projectId --format="json(dnssecConfig.state)"

    matchers:
      - type: word
        words:
          - 'off'

    extractors:
      - type: dsl
        dsl:
          - '"DNSSEC not enabled for Managed Zone: " + managedZoneName + " in Project: " + projectId'
