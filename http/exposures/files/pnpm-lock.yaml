id: pnpm-lock

info:
  name: PNPM Lock YAML 文件泄露（暴露面识别）
  author: noraj
  severity: info
  description: |
    检测到对外可访问的 PNPM Lock YAML 文件。相关文件可能泄露项目结构、依赖关系、部署细节、敏感参数或其他不应公开的内部信息。
  reference:
    - https://pnpm.io/cli/install#tldr
  metadata:
    verified: true
    max-request: 1
    shodan-query: html:"pnpm-lock.yaml"
  tags: exposure,files,node,npm,pnpm,vuln

http:
  - method: GET
    path:
      - "{{BaseURL}}/pnpm-lock.yaml"

    matchers-condition: and
    matchers:
      - type: word
        part: body
        words:
          - "lockfileVersion:"
          - "specifiers:"
          - "packages:"
        condition: and

      - type: status
        status:
          - 200
