id: tautulli-panel

info:
  name: Tautulli 登录面板识别（指纹识别）
  author: rxerium
  severity: info
  description: |-
    Tautulli 是 Plex 媒体服务器监控平台，用于播放历史、用户活动、统计和通知管理。该模板请求首页、`/auth/login`，并依据 HTTP 200 状态码、页面标题、正文关键字或品牌资源特征识别目标是否部署了该系统或暴露了对应入口，适用于资产指纹确认；命中结果仅表示系统特征匹配，不代表已确认存在未授权访问或可利用漏洞。
  reference:
  - https://tautulli.com/
  - https://github.com/Tautulli/Tautulli
  classification:
    cpe: cpe:2.3:a:tautulli:tautulli:*:*:*:*:*:*:*:*
  metadata:
    verified: true
    max-request: 2
    vendor: tautulli
    product: tautulli
    shodan-query:
    - title:"TAUTULLI"
    - http.title:"tautulli"
    - http.title:"tautulli - home"
    fofa-query:
    - title="tautulli - home"
    - title="tautulli"
    google-query:
    - intitle:"tautulli"
    - intitle:"tautulli - home"
  tags: panel,tautulli,detect,discovery

http:
  - method: GET
    path:
      - "{{BaseURL}}"
      - "{{BaseURL}}/auth/login"

    host-redirects: true
    max-redirects: 2
    stop-at-first-match: true

    matchers-condition: and
    matchers:
      - type: word
        words:
          - '<title>Tautulli - Login'
          - 'content="Tautulli'
          - 'alt="Tautulli'
          - 'Sign In with Tautulli'
        condition: or

      - type: status
        status:
          - 200
