id: repetier-server-panel

info:
  name: Repetier Server 登录面板识别（指纹识别）
  author: ritikchaddha
  severity: info
  description: |-
    Repetier Server 是3D 打印服务器管理平台，用于打印机连接、作业队列和远程控制。该模板请求 `/#!/login` 路径，并依据 HTTP 200 状态码、页面标题、正文关键字或品牌资源特征识别目标是否部署了该系统或暴露了对应入口，适用于资产指纹确认；命中结果仅表示系统特征匹配，不代表已确认存在未授权访问或可利用漏洞。
  classification:
    cpe: cpe:2.3:a:repetier-server:repetier-server:*:*:*:*:*:*:*:*
  metadata:
    verified: true
    max-request: 1
    vendor: repetier-server
    product: repetier-server
    shodan-query:
    - title:"Repetier-Server"
    - http.title:"repetier-server"
    fofa-query: title="repetier-server"
    google-query: intitle:"repetier-server"
  tags: panel,repetier,detect,repetier-server,discovery

http:
  - method: GET
    path:
      - "{{BaseURL}}/#!/login"

    matchers-condition: and
    matchers:
      - type: word
        part: body
        words:
          - 'content="Repetier-Server'
          - 'About Repetier-Server'
        condition: or

      - type: status
        status:
          - 200

    extractors:
      - type: regex
        part: body
        group: 2
        regex:
          - 'Repetier\-Server ([A-Za-z]+) ([0-9.]+)'
