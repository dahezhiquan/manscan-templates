id: gcloud-ssl-policy-insecure-ciphers

info:
  name: Insecure SSL Cipher Suites 中的GCP Load Balancers（云安全）
  author: princechaddha
  severity: medium
  description: 该规则用于检查 GCP loadbalancing 是否正确启用传输中或静态数据加密、证书校验及安全协议配置，防止敏感数据在存储或通信过程中被窃听、篡改或滥用。
  impact: |
    - 未正确启用加密或安全协议时，敏感数据可能在传输或存储过程中被窃听、窃取或篡改。
    - 这还可能导致不满足行业合规要求，增加数据泄露与法律责任风险。
  remediation: |
    - 启用厂商推荐的加密方案，并优先使用更安全的协议、算法或客户管理密钥。
    - 同时检查相关证书、密钥与依赖服务的生命周期管理，确保配置持续有效。
  reference:
    - https://cloud.google.com/load-balancing/docs/ssl-policies
  tags: cloud,devops,gcp,gcloud,google-cloud-load-balancing,gcp-cloud-config

flow: |
  code(1)
  for(let projectId of iterate(template.projectIds)){
    set("projectId", projectId)
    code(2)
    for(let proxy of iterate(template.httpsProxies)){
      set("sslPolicy", proxy.sslPolicy)
      code(4)
    }
    code(3)
    for(let proxy of iterate(template.sslProxies)){
      set("sslPolicy", proxy.sslPolicy)
      code(4)
    }
  }

self-contained: true

code:
  - engine:
      - sh
      - bash
    source: |
      gcloud projects list --format="json(projectId)"

    extractors:
      - type: json
        internal: true
        name: projectIds
        json:
          - '.[].projectId'

  - engine:
      - sh
      - bash
    source: |
      gcloud compute target-https-proxies list --project $projectId --format="json(name,sslPolicy)"

    extractors:
      - type: json
        internal: true
        name: httpsProxies
        json:
          - '.[]'

  - engine:
      - sh
      - bash
    source: |
      gcloud compute target-ssl-proxies list --project $projectId --format="json(name,sslPolicy)"

    extractors:
      - type: json
        internal: true
        name: sslProxies
        json:
          - '.[]'

  - engine:
      - sh
      - bash
    source: |
      gcloud compute ssl-policies describe $sslPolicy --format="json(minTlsVersion,profile,enabledFeatures)"

    matchers:
      - type: word
        words:
          - 'TLS_1_0'
          - 'TLS_RSA_WITH_AES_128_GCM_SHA256'
          - 'TLS_RSA_WITH_AES_256_GCM_SHA384'
          - 'TLS_RSA_WITH_AES_128_CBC_SHA'
          - 'TLS_RSA_WITH_AES_256_CBC_SHA'
          - 'TLS_RSA_WITH_3DES_EDE_CBC_SHA'

      - type: dsl
        dsl:
          - '"Insecure SSL Policy Detected in Proxy: " + sslPolicy + " in Project: " + projectId'
