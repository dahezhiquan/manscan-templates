id: wp-wpfront-scroll-top-fpd

info:
  name: WordPress WPFront Scroll Top 完整路径泄露
  author: DhiyaneshDk
  severity: low
  description: |
    检测到 WordPress WPFront Scroll Top 完整路径泄露。目标暴露了调试、错误或堆栈信息，可能泄露应用路径、框架版本、环境变量、源码位置或内部调用细节。
  reference:
    - https://wordpress.org/plugins/wpfront-scroll-top/
  metadata:
    verified: true
    max-request: 1
    publicwww-query: "/plugins/wpfront-scroll-top"
  tags: wp,wordpress,wp-plugin,fpd,wpfront-scroll-top,misconfig

http:
  - method: GET
    path:
      - "{{BaseURL}}/wp-content/plugins/wpfront-scroll-top/wpfront-scroll-top.php"

    matchers:
      - type: dsl
        dsl:
          - 'contains_all(body, "Fatal error", "Uncaught Error") || contains_all(body, "Warning:","failed to open stream")'
          - 'contains(body, "wpfront-scroll-top")'
          - 'status_code == 200 || status_code == 500'
        condition: and
