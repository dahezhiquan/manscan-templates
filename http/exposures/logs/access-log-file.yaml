id: access-log-file

info:
  name: 访问日志文件泄露（暴露面识别）
  author: sheikhrishad
  severity: low
  description: 检测到可直接访问的 访问日志文件。日志、异常页面或调试输出通常会泄露堆栈信息、内部路径、查询语句、账号标识、令牌片段或业务数据，不应向未授权用户开放。
  classification:
    cwe-id: CWE-219,CWE-552
  metadata:
    max-request: 4
  tags: logs,exposure,vuln

http:
  - method: GET
    path:
      - "{{BaseURL}}/access.log"
      - "{{BaseURL}}/log/access.log"
      - "{{BaseURL}}/logs/access.log"
      - "{{BaseURL}}/application/logs/access.log"

    matchers-condition: and
    matchers:
      - type: word
        words:
          - '"GET /'

      - type: word
        words:
          - "text/plain"
        part: header

      - type: status
        status:
          - 200
