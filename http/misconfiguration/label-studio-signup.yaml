id: label-studio-signup

info:
  name: Label Studio Sign up 检测
  author: DhiyaneshDK
  severity: medium
  description: |
    检测到 Label Studio Sign up 检测。目标响应或文件中可能暴露配置、凭据、密钥、令牌、环境变量或历史记录等敏感信息，可能被用于进一步入侵。
  classification:
    cpe: cpe:2.3:a:heartex:label_studio:*:*:*:*:*:*:*:*
  metadata:
    verified: true
    max-request: 1
    vendor: heartex
    product: label_studio
    shodan-query: http.favicon.hash:-1649949475
  tags: label-studio,sign-up,misconfig,vuln

http:
  - raw:
      - |
        GET /user/signup HTTP/1.1
        Host: {{Hostname}}
        Accept: */*

    matchers-condition: and
    matchers:
      - type: word
        part: body
        words:
          - "Label Studio"
          - "Sign up"
          - "Create Account"
        condition: and

      - type: status
        status:
          - 200
