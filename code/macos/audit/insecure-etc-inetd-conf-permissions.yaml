id: insecure-etc-inetd-conf-permissions

info:
  name: macOS /etc/inetd.conf 权限不安全（本地基线扫描）
  author: geeknik
  severity: high
  description: |
    `/etc/inetd.conf` 控制 inetd 管理的网络服务，权限不安全会让本地攻击者注册或修改网络入口。模板检查该文件是否存在且不符合 root 管理的只读基线权限，命中时表示 inetd 配置文件权限异常。
  impact: |
    - 本地攻击者可能启用恶意或不必要的网络服务，形成远程访问入口。
    - 被篡改的 inetd 配置会扩大主机暴露面并削弱审计可信度。
  remediation: |
    - 将 `/etc/inetd.conf` 属主设置为 root，并使用只允许管理员写入的严格权限。
    - 审计 inetd 服务条目，禁用遗留服务并确认系统未加载异常配置。
  tags: macos,audit,local,security

self-contained: true

code:
  - engine:
      - sh
      - bash
    source: |
      ls -l /etc/inetd.conf 2>&1
    matchers-condition: and
    matchers:
      - type: status
        status:
          - 0
      - type: regex
        regex:
          - "^-rw-r--r--\\s+\\d+\\s+root\\s+\\w+"
        negative: true
