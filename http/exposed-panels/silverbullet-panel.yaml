id: silverbullet-panel

info:
  name: SilverBullet 面板检测（暴露面识别）
  author: ChrisJr404
  severity: info
  description: |-
    SilverBullet（silverbullet.md / github.com/silverbulletmd/silverbullet）是一款开源的自托管、基于浏览器的 Markdown 笔记和个人知识库应用。未启用认证的实例会将完整的笔记空间暴露给任意读写。
  reference:
    - https://github.com/silverbulletmd/silverbullet
    - https://silverbullet.md/
  metadata:
    verified: true
    max-request: 1
    vendor: silverbulletmd
    product: silverbullet
    shodan-query: http.title:"SilverBullet"
    fofa-query: title="SilverBullet"
  tags: panel,silverbullet,notes,markdown,selfhosted,detect,discovery

http:
  - method: GET
    path:
      - "{{BaseURL}}"

    host-redirects: true
    max-redirects: 2

    matchers:
      - type: dsl
        dsl:
          - 'status_code == 200'
          - 'contains(body, "<title>SilverBullet</title>")'
        condition: and
