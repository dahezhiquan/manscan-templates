id: infinispan-default-login

info:
  name: Infinispan 默认管理员登录（弱口令）
  author: DhiyanesDk
  severity: high
  description: |
    该模板通过尝试 Infinispan 的默认管理员账号口令（如 admin:password），并依据认证成功后的响应特征判断目标是否仍在使用未修改的弱口令。若命中，攻击者通常可直接获得后台管理权限，进一步访问敏感信息、修改配置或执行未授权操作。
  reference:
    - https://infinispan.org/docs/stable/titles/security/security.html
    - https://infinispan.org/
  metadata:
    max-request: 2
    verified: true
    vendor: redhat
    product: infinispan
    shodan-query: http.favicon.hash:647951307
  tags: default-login,infinispan,redhat,config

flow: http(1) && http(2)

variables:
  username: "admin"
  password: "password"

http:
  - raw:
      - |
        GET /rest/v2/cache-managers/default HTTP/1.1
        Host: {{Hostname}}
        Accept: application/json

    matchers:
      - type: dsl
        dsl:
          - 'status_code_1 == 401'
          - 'contains(tolower(header_1), "digest realm=")'
        condition: and
        internal: true

    extractors:
      - type: regex
        name: realm
        part: header
        group: 1
        regex:
          - 'realm="([^"]+)"'
        internal: true

      - type: regex
        name: nonce
        part: header
        group: 1
        regex:
          - 'nonce="([^"]+)"'
        internal: true

  - raw:
      - |
        GET /rest/v2/cache-managers/default HTTP/1.1
        Host: {{Hostname}}
        Accept: application/json
        Authorization: Digest username="{{username}}", realm="{{realm}}", nonce="{{nonce}}", uri="/rest/v2/cache-managers/default", qop=auth, nc=00000001, cnonce="0a4f113b", response="{{md5(concat(md5(concat(username,":",realm,":",password)),":",nonce,":00000001:0a4f113b:auth:",md5("GET:/rest/v2/cache-managers/default")))}}", algorithm=MD5

    matchers:
      - type: dsl
        dsl:
          - 'status_code == 200'
          - 'contains_all(body, "\"name\"", "\"cache_manager_status\"")'
        condition: and
