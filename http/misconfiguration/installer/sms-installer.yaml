id: sms-installer

info:
  name: SMS Gateway 安装
  author: ritikchaddha
  severity: high
  description: |
    检测到 SMS Gateway 安装。该页面属于安装、初始化或配置向导流程，若对外暴露，攻击者可能完成初始化、创建管理员账户或重新配置目标系统。
  metadata:
    verified: true
    max-request: 1
    shodan-query: http.title:"SMS Gateway | Installation"
  tags: misconfig,sms,install,vuln

http:
  - method: GET
    path:
      - '{{BaseURL}}/install/index.php'

    matchers-condition: and
    matchers:
      - type: word
        part: body
        words:
          - 'SMS Gateway | Installation'

      - type: status
        status:
          - 200
