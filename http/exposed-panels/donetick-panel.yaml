id: donetick-panel

info:
  name: Donetick 面板 - 检测（指纹识别）
  author: ChrisJr404
  severity: info
  description: |-
    Donetick（donetick.com / github.com/donetick/donetick）是一个开源的自托管任务与家务管理工具，后端使用 Go，前端使用 React，默认 Docker 端口为 2021。暴露的实例可能泄露家庭任务清单、成员信息及日程安排。
  reference:
    - https://github.com/donetick/donetick
    - https://donetick.com/
  metadata:
    verified: true
    max-request: 1
    vendor: donetick
    product: donetick
    shodan-query: http.title:"Donetick"
    fofa-query: title="Donetick"
  tags: panel,donetick,tasks,selfhosted,detect,discovery

http:
  - method: GET
    path:
      - "{{BaseURL}}"

    host-redirects: true
    max-redirects: 2

    matchers:
      - type: dsl
        dsl:
          - 'status_code == 200'
          - 'contains(to_lower(body), "<title>donetick</title>")'
        condition: and
