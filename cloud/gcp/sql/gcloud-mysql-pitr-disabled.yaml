id: gcloud-mysql-pitr-disabled

info:
  name: MySQL 实例未启用时间点恢复（云安全）
  author: princechaddha
  severity: medium
  description: MySQL Point-in-Time Recovery 依赖二进制日志，可将实例恢复到特定时间点，未启用会削弱误删、误写或攻击后的恢复能力。本模板枚举 Cloud SQL MySQL 实例并检查 settings.backupConfiguration.binaryLogEnabled，值为 False 时报告未启用 PITR。
  impact: |
    - 数据被误删、批量覆盖或遭恶意篡改后，可能只能恢复到最近备份点，导致更多数据丢失。
    - 缺少精确时间点恢复会延长数据库事故处理时间，影响业务连续性。
  remediation: |
    - 为关键 Cloud SQL MySQL 实例启用 Point-in-Time Recovery，并确认自动备份和二进制日志配置正常。
    - 定期演练恢复流程，确保保留窗口、备份时间和业务 RPO/RTO 要求匹配。
  reference:
    - https://cloud.google.com/sql/docs/mysql/backup-recovery/pitr
  metadata:
    vendor: google
    product: cloud-sql
  tags: cloud,devops,gcp,gcloud,google-cloud-sql,gcp-cloud-config

flow: |
  code(1)
  for(let projectId of iterate(template.projectIds)){
    set("projectId", projectId)
    code(2)
    for(let sqlInstance of iterate(template.sqlInstances)){
      set("sqlInstance", sqlInstance)
      code(3)
    }
  }

self-contained: true

code:
  - engine:
      - sh
      - bash
    source: |
      gcloud projects list --format="json(projectId)"

    extractors:
      - type: json
        name: projectIds
        internal: true
        json:
          - '.[].projectId'

  - engine:
      - sh
      - bash
    source: |
      gcloud sql instances list --project $projectId --filter="DATABASE_VERSION:MYSQL*" --format="json(name)"

    extractors:
      - type: json
        name: sqlInstances
        internal: true
        json:
          - '.[].name'

  - engine:
      - sh
      - bash
    source: |
      gcloud sql instances describe $sqlInstance --project $projectId --format="value(settings.backupConfiguration.binaryLogEnabled)"

    matchers:
      - type: word
        words:
          - 'False'

    extractors:
      - type: dsl
        dsl:
          - '"Point-in-Time Recovery is not enabled for MySQL instance " + sqlInstance + " in project " + projectId'
