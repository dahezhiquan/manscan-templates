id: ibm-http-server

info:
  name: IBM HTTP Server 指纹识别（指纹识别）
  author: dhiyaneshDK,pussycat0x
  severity: info
  description: >-
    IBM HTTP Server 是基于 Apache HTTP Server 的 IBM Web 服务器发行版，常与 WebSphere 等中间件配套部署。该模板通过请求目标服务并检查预设路径或首页响应、页面正文关键字、正则特征、状态码等指纹特征，判断目标是否使用或暴露了
    IBM HTTP Server 相关组件；命中结果仅表示指纹特征匹配，可用于资产盘点、技术栈识别和后续安全评估，不代表已确认存在可利用漏洞。
  classification:
    cpe: cpe:2.3:a:ibm:http_server:*:*:*:*:*:*:*:*
  metadata:
    max-request: 1
    vendor: ibm
    product: http_server
    shodan-query: http.title:"IBM-HTTP-Server"
  tags: tech,ibm,discovery
http:
  - method: GET
    path:
      - '{{BaseURL}}'

    matchers-condition: and
    matchers:
      - type: word
        words:
          - '<title>IBM HTTP Server</title>'

      - type: status
        status:
          - 200

    extractors:
      - type: regex
        part: body
        regex:
          - "IBM HTTP Server ([0-9.]+)"
