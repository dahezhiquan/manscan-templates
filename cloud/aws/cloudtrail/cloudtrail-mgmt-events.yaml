id: cloudtrail-mgmt-events
info:
  name: CloudTrail 管理事件日志未启用（云安全）
  author: princechaddha
  severity: medium
  description: CloudTrail 管理事件日志未启用是一类控制面审计缺失风险，账户配置变更、权限调整和资源管理 API 调用可能无法被记录。缺少管理事件会直接影响入侵调查、误操作追踪和合规审计。模板调用 `get-event-selectors` 并读取 `EventSelectors[*].IncludeManagementEvents`，当值为 `false` 时判定管理事件日志关闭。
  impact: |
    - IAM、网络、计算和存储等控制面变更可能无法被该 trail 捕获。
    - 入侵调查中会缺少关键 API 调用证据，影响攻击路径还原和责任追踪。
  remediation: |
    - 为关键账户和区域的 CloudTrail trail 启用管理事件记录。
    - 根据审计需求配置读写事件范围，并将日志投递到集中、安全、可检索的位置。
  reference:
    - https://docs.aws.amazon.com/awscloudtrail/latest/userguide/logging-management-and-data-events-with-cloudtrail.html
  metadata:
    max-request: 2
    vendor: amazon
    product: cloudtrail
  tags: cloud,devops,aws,amazon,cloudtrail,aws-cloud-config
variables:
  region: "ap-south-1"

flow: |
  code(1)
  for(let CloudTrail of iterate(template.cloudtrailname)){
    set("trail", CloudTrail)
    code(2)
  }

self-contained: true
code:
  - engine:
      - sh
      - bash
    source: |
      aws cloudtrail list-trails --region $region --query 'Trails[*].Name' --output json

    extractors:
      - type: json
        name: cloudtrailname
        internal: true
        json:
          - '.[]'

  - engine:
      - sh
      - bash
    source: |
         aws cloudtrail get-event-selectors --region $region --trail-name $trail --query 'EventSelectors[*].IncludeManagementEvents'

    matchers:
      - type: word
        words:
          - "false"

    extractors:
      - type: dsl
        dsl:
          - '"CloudTrail trail" + trail + " is not configured to capture management operations performed on your AWS cloud resources"'
