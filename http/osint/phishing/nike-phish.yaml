id: nike-phish

info:
  name: Nike 仿冒钓鱼网站（钓鱼网站识别）
  author: rxerium
  severity: info
  description: |
    检测到疑似仿冒 Nike 的钓鱼网站。模板在目标页面返回 200、页面内容命中 Nike 的品牌页面特征，且当前主机不属于 nike.com 官方域名时触发，用于识别借用 Nike 品牌页面诱导用户信任的仿冒站点。
  reference:
    - https://nike.com
  metadata:
    max-request: 1
  tags: phishing,nike,ecommerce,osint,discovery
http:
  - method: GET
    path:
      - "{{BaseURL}}"

    host-redirects: true
    max-redirects: 2

    matchers-condition: and
    matchers:
      - type: word
        words:
          - 'Nike'
          - '<title>Nike. Just Do It. Nike.com'
        condition: and

      - type: status
        status:
          - 200

      - type: dsl
        dsl:
          - '!contains(host,"nike.com")'
