id: default-runcloud-page

info:
  name: RunCloud 默认页面 指纹识别（指纹识别）
  author: pussycat0x
  severity: info
  description: RunCloud 默认页面 是云服务器管理平台，用于 PHP 应用、站点、数据库和服务器运维。该模板请求首页，并依据 HTTP 200 状态码、页面标题、正文关键字或品牌资源特征识别目标是否使用或暴露了 RunCloud 默认页面 相关组件，适用于资产盘点、技术栈识别和后续安全评估；命中结果仅表示指纹特征匹配，不代表已确认存在可利用漏洞。
  metadata:
    verified: true
    max-request: 1
    shodan-query: http.title:"Welcome To RunCloud"
  tags: tech,runcloud,default-page,discovery

http:
  - method: GET
    path:
      - '{{BaseURL}}'

    matchers-condition: and
    matchers:
      - type: word
        part: body
        words:
          - 'Welcome To RunCloud'

      - type: status
        status:
          - 200
