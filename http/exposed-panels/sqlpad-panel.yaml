id: sqlpad-panel

info:
  name: SQLPad 面板识别（暴露面识别）
  author: s4e-io
  severity: info
  description: |
    该模板通过识别 SQLPad 面板、控制台或管理界面的页面特征，判断目标是否暴露了对应服务入口。若命中，说明该后台或运维界面对外可访问，可用于资产识别与暴露面排查。
  reference:
    - https://github.com/sqlpad/sqlpad
  metadata:
    verified: true
    max-request: 1
    fofa-query: "SQLPad"
  tags: panel,login,sqlpad,detect,discovery

http:
  - method: GET
    path:
      - "{{BaseURL}}/signin"

    matchers:
      - type: dsl
        dsl:
          - 'contains_any(body, "<title>SQLPad</title>", "webpackJsonpsqlpad")'
          - 'status_code == 200'
        condition: and
