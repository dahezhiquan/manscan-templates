id: privatebin-detect

info:
  name: PrivateBin 指纹识别（指纹识别）
  author: righettod
  severity: info
  description: >-
    PrivateBin 是零知识文本粘贴服务，用于以浏览器端加密方式分享文本或代码片段。该模板通过请求目标服务并检查预设路径或首页响应、DSL 条件、正则特征等指纹特征，判断目标是否使用或暴露了
    PrivateBin 相关组件；命中结果仅表示指纹特征匹配，可用于资产盘点、技术栈识别和后续安全评估，不代表已确认存在可利用漏洞。
  reference:
  - https://privatebin.info/
  classification:
    cpe: cpe:2.3:a:privatebin:privatebin:*:*:*:*:*:*:*:*
  metadata:
    verified: true
    max-request: 1
    vendor: privatebin
    product: privatebin
    shodan-query:
    - title:"PrivateBin"
    - http.favicon.hash:1358855492
    fofa-query:
    - title="PrivateBin"
    - icon_hash="1358855492"
  tags: tech,privatebin,detect,discovery
http:
  - method: GET
    path:
      - "{{BaseURL}}"

    redirects: true
    max-redirects: 2
    matchers:
      - type: dsl
        dsl:
          - 'status_code == 200'
          - 'contains_any(to_lower(body), "privatebin.js", "privatebin</title>", "content=\"privatebin")'
        condition: and

    extractors:
      - type: regex
        part: body
        group: 1
        regex:
          - 'privatebin\.[a-z]{2,3}\?([0-9.]+)'
