id: wp-googlecaptcha-fpd

info:
  name: WordPress Plugin reCaptcha BestWebSoft (google captcha) 完整路径泄露
  author: DhiyaneshDk
  severity: low
  description: |
    检测到 WordPress Plugin reCaptcha BestWebSoft (google captcha) 完整路径泄露。目标暴露了调试、错误或堆栈信息，可能泄露应用路径、框架版本、环境变量、源码位置或内部调用细节。
  reference:
    - https://wordpress.org/plugins/google-captcha/
  metadata:
    max-request: 1
    verified: true
    shodan-query: html:"/plugins/google-captcha"
  tags: debug,wordpress,fpd,vuln

http:
  - method: GET
    path:
      - "{{BaseURL}}/wp-content/plugins/google-captcha/includes/captcha-for-formidable.php"

    matchers:
      - type: dsl
        dsl:
          - 'status_code == 200'
          - 'contains(body, "/plugins/google-captcha")'
          - 'contains_all(body, "Fatal error", "Uncaught Error:")'
        condition: and
