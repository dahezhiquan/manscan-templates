id: oracle-ebusiness-panel

info:
  name: Oracle E-Business Suite 登录面板识别（指纹识别）
  author: righettod
  severity: info
  description: |-
    检测到目标站点存在 Oracle E-Business Suite 相关响应特征。Oracle E-Business Suite 是数据库、ERP 或数据服务的 Web 管理入口，用于查看数据、执行查询、管理业务对象、集群或连接配置。模板请求 `/OA_HTML/AppsLogin`，并通过页面标题或正文关键字、状态码、DSL 条件确认该系统指纹，用于资产识别、系统盘点和暴露面梳理。
  reference:
    - https://www.oracle.com/applications/ebusiness/
  classification:
    cpe: cpe:2.3:a:oracle:e-business_suite:*:*:*:*:*:*:*:*
  metadata:
    verified: true
    max-request: 1
    vendor: oracle
    product: e-business_suite
    shodan-query: http.html:"Oracle UIX"
  tags: panel,oracle,login,detect,discovery
http:
  - method: GET
    path:
      - "{{BaseURL}}/OA_HTML/AppsLogin"

    redirects: true
    max-redirects: 2
    matchers:
      - type: dsl
        dsl:
          - 'status_code == 200'
          - 'contains_any(to_lower(body), "/oa_html/oa.jsp", "oracle uix")'
        condition: and

    extractors:
      - type: regex
        part: body
        group: 1
        regex:
          - '(?i)/OA_HTML/cabo/oajsLibs/oafcore([A-Z0-9]+).js'
