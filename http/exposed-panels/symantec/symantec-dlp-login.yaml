id: symantec-dlp-login

info:
  name: Symantec Data Loss Prevention 登录面板识别（暴露面识别）
  author: princechaddha
  severity: info
  description: 该模板通过识别 Symantec Data Loss Prevention 登录入口的页面标题、特征文本或重定向行为，判断目标是否暴露了对应的认证界面。若命中，说明该登录面板对外可访问，可用于暴露面梳理与后续安全评估。
  classification:
    cvss-metrics: CVSS:3.0/AV:N/AC:L/PR:N/UI:N/S:U/C:N/I:N/A:N
    cwe-id: CWE-200
    cpe: cpe:2.3:a:symantec:data_loss_prevention:*:*:*:*:*:*:*:*
  metadata:
    max-request: 1
    vendor: symantec
    product: data_loss_prevention
    shodan-query:
      - http.title:"Symantec Data Loss Prevention"
      - http.title:"symantec data loss prevention"
    fofa-query: title="symantec data loss prevention"
    google-query: intitle:"symantec data loss prevention"
  tags: symantec,panel,login,discovery

http:
  - method: GET
    path:
      - '{{BaseURL}}/ProtectManager/Logon'

    matchers-condition: and
    matchers:
      - type: word
        words:
          - "<title>Symantec Data Loss Prevention</title>"
        part: body

      - type: status
        status:
          - 200
