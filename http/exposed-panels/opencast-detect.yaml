id: opencast-panel

info:
  name: Opencast Admin Panel Discovery 面板识别（暴露面识别）
  author: cyllective,daffainfo
  severity: info
  description: 该模板通过识别 Opencast Admin Panel Discovery 面板、控制台或管理界面的页面特征，判断目标是否暴露了对应服务入口。若命中，说明该后台或运维界面对外可访问，可用于资产识别与暴露面排查。
  reference:
    - https://github.com/opencast/opencast
  metadata:
    max-request: 1
  tags: panel,opencast,discovery

http:
  - method: GET
    path:
      - "{{BaseURL}}/admin-ng/login.html"

    matchers-condition: and
    matchers:
      - type: word
        part: body
        words:
          - '<title>Opencast</title>'

      - type: status
        status:
          - 200
