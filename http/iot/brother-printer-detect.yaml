id: brother-printer-detect

info:
  name: Brother 打印机面板（IOT）
  author: pussycat0x
  severity: low
  description: |
    检测到 Brother 打印机 Web 管理面板。该页面暴露可用于确认打印设备资产，并可能进一步暴露打印配置、状态信息或管理入口。
  reference:
    - https://www.exploit-db.com/ghdb/6889
  metadata:
    max-request: 1
  tags: iot,printer,tech,discovery

http:
  - method: GET
    path:
      - "{{BaseURL}}/general/status.html"

    matchers-condition: and
    matchers:
      - type: word
        words:
          - "Brother Industries"

      - type: status
        status:
          - 200
