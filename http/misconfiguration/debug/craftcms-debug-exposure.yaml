id: craftcms-debug-exposure

info:
  name: CraftCMS 调试 Methods 暴露
  author: 0x_Akoko
  severity: medium
  description: |
    该模板用于核查 CraftCMS 调试 Methods暴露状态。该类问题通常源于生产环境暴露调试页面、诊断端点、状态接口或详细错误信息。模板会向目标发送探测请求，并依据请求 `/actions/debug/default/index`、`/actions/debug/default/toolbar`等证据确认目标是否存在该配置问题。
  impact: |
    - 攻击者可获取服务版本、运行状态、内部路径、模块列表、环境变量或错误栈信息。
    - 这些信息可辅助识别组件版本、构造后续攻击路径，或暴露内部系统结构与敏感配置线索。
  remediation: |
    - 关闭生产环境中的调试、状态、示例和诊断接口，避免向未授权用户返回内部细节。
    - 对确需保留的运维端点增加认证授权、来源限制和访问审计。
    - 检查历史访问日志和错误日志，确认敏感信息是否已被枚举或泄露。
  reference:
    - https://craftcms.com/docs/5.x/system/config.html#devmode
    - https://www.acunetix.com/vulnerabilities/web/craft-cms-development-mode-enabled/
  metadata:
    max-request: 3
    verified: true
    shodan-query: http.component:"Craft CMS"
    fofa-query: app="Craft-CMS"
  tags: craftcms,debug,misconfig,exposure,yii2

http:
  - method: GET
    path:
      - "{{BaseURL}}/actions/debug/default/index"
      - "{{BaseURL}}/actions/debug/default/toolbar"
      - "{{BaseURL}}/actions/debug/default/view"

    stop-at-first-match: true

    matchers:
      - type: dsl
        dsl:
          - 'status_code == 200'
          - 'contains_any(body, "Yii Debugger", "yii-debug-toolbar", "Available Debug Data")'
          - 'contains(header, "Craft CMS") || contains(body, "cpresources")'
        condition: and
