id: ssh-weak-public-key

info:
  name: SSH 主机密钥小于 2048 位（服务漏洞）
  author: pussycat0x
  severity: low
  description: |
    目标 SSH 主机密钥长度低于 2048 位，可能削弱服务身份验证强度。模板枚举服务端主机密钥并检查 RSA/ECDSA 位数，在低于阈值时输出对应 key length 作为证据。
  impact: |
    - 低于 2048 位的 SSH 主机密钥会削弱服务端身份验证强度。
    - 弱主机密钥可能增加密钥破解、冒充服务端或中间人攻击风险。
  remediation: |
    - 重新生成长度不低于 2048 位的 RSA 主机密钥，或使用符合基线的现代主机密钥类型。
    - 删除旧弱主机密钥并重启 SSH 服务，必要时同步更新客户端 known_hosts。
  reference:
    - https://www.tenable.com/plugins/nessus/153954
  metadata:
    verified: true
    max-request: 2
    shodan-query: product:"OpenSSH"
  tags: enum,js,ssh,misconfig,network,vuln

variables:
  ecdsa_bit: '256' # 256 bytes = 2048 bits
  rsa_bit: '2048' # 2048 bits

javascript:
  - pre-condition: |
      isPortOpen(Host,Port);
    code: |
      let m = require("nuclei/ssh");
      let c = m.SSHClient();
      let response = c.ConnectSSHInfoMode(Host, Port);
      Export(response);
    args:
      Host: "{{Host}}"
      Port: "22"

    matchers-condition: and
    matchers:
      - type: word
        words:
          - "server_host_key"

      - type: dsl
        dsl:
          - 'len(ecdsa_keylen) != 0 && ecdsa_keylen < ecdsa_bit'
          - 'len(rsa_keylen) !=0 && rsa_keylen < rsa_bit'

    extractors:
      - type: json
        internal: true
        name: ecdsa_keylen
        json:
          - '.DHKeyExchange.server_host_key.ecdsa_public_key.length'

      - type: json
        internal: true
        name: rsa_keylen
        json:
          - '.DHKeyExchange.server_host_key.rsa_public_key.length'
