id: magento-debug-log-exposure

info:
  name: Magento Debug Log 暴露（暴露面识别）
  author: 0x_Akoko
  severity: medium
  description: |
    检测到目标站点可直接访问 Magento Debug Log。Magento 调试日志可能记录异常、模块路径、请求参数和后台组件信息。该模板请求 `/var/log/debug.log`，并结合 HTTP 状态码、日志关键字、错误堆栈、响应头或页面特征确认日志/调试信息可被访问。此类信息公开后会帮助攻击者了解应用运行状态、内部结构和错误上下文，增加后续利用成功率。
  impact: |-
    - 日志、异常或调试页面可能泄露内部路径、堆栈信息、SQL 语句、请求参数、账号标识、令牌片段和组件版本。
    - 攻击者可利用这些信息筛选匹配漏洞、定位敏感文件、复现业务流程或构造更精确的后续攻击。
    - 若日志中包含真实凭据、会话标识、个人信息或业务数据，可能直接造成数据泄露和合规风险。
  remediation: |-
    - 关闭生产环境中可公开访问的日志、异常、调试、状态或报告页面，并将日志目录移出 Web 根目录。
    - 在 Web 服务器、反向代理、CDN 和对象存储层阻断常见日志文件、调试路径和错误报告的公网访问。
    - 检查日志内容是否包含凭据、会话、个人信息、SQL 或业务数据；如有泄露，应执行密钥轮换、账号处置和数据影响评估。
    - 清理公开缓存、历史发布包和搜索引擎收录，并为日志访问启用鉴权、内网限制和审计。
  reference:
    - https://devdocs.magento.com/guides/v2.4/config-guide/log/log-intro.html
  classification:
    cvss-metrics: CVSS:3.1/AV:N/AC:L/PR:N/UI:N/S:U/C:H/I:N/A:N
    cvss-score: 7.5
    cwe-id: CWE-538
  metadata:
    max-request: 1
    verified: true
  tags: magento,exposure,logs,misconfig

http:
  - method: GET
    path:
      - "{{BaseURL}}/var/log/debug.log"

    max-size: 500000

    matchers:
      - type: dsl
        dsl:
          - 'contains_any(body, "main.DEBUG", "main.CRITICAL", "main.ERROR", "main.INFO")'
          - 'contains_any(body, "Magento\\", "/vendor/magento/", "cache_invalidate", "Cron Job")'
          - 'contains_any(content_type, "text/x-log")'
          - 'status_code == 200'
        condition: and
