id: url-extension-inspector

info:
  name: URL 扩展名检查（本地文件安全扫描）
  author: ayadim
  severity: low
  description: |
    公开 URL 列表中的备份、配置、源码、数据库、证书、密钥、日志和压缩包扩展名，可能指向被错误发布或可直接访问的敏感资源。该模板不主动请求目标 URL，而是扫描输入文件内容，按多组正则提取扩展名和路径模式；命中表示需要进行授权访问验证的暴露线索，不等于资源已经可下载。
  impact: |
    - 若相关资源可被未授权访问，攻击者可能获取源码、数据库备份、私钥、VPN 配置、凭据或内部业务文档。
    - 泄露的配置和备份可帮助攻击者进一步接管应用、数据库、云资源或内部网络。
  remediation: |
    - 从 Web 根目录和公开对象存储中移除备份、源码、配置、数据库、证书和密钥文件，禁止将敏感文件作为静态资源发布。
    - 在网关和存储策略中实施最小权限、目录索引关闭、访问控制和敏感扩展名拦截，并定期扫描公开 URL。
    - 对已暴露的密钥、证书、数据库账号和 VPN 配置立即吊销或轮换，并检查访问日志和下载记录。
  reference:
    - https://github.com/CYS4srl/CYS4-SensitiveDiscoverer/
  tags: file,url-analyse,urls,extension
file:
  - extensions:
      - all

    extractors:
      - type: regex
        name: Hot finding
        regex:
          - "(?i)(htdocs|www|html|web|webapps|public|public_html|uploads|website|api|test|app|backup|bin|bak|old|release|sql)\\.(7z|bz2|gz|lz|rar|tar\\.gz|tar\\.bz2|xz|zip|z)"

      - type: regex
        name: Backup file
        regex:
          - "(?i)(\\.bak|\\.backup|\\.bkp|\\._bkp|\\.bk|\\.BAK)('|\")"

      - type: regex
        name: PHP Source
        regex:
          - "(?i)(\\.php)(\\.~|\\.bk|\\.bak|\\.bkp|\\.BAK|\\.swp|\\.swo|\\.swn|\\.tmp|\\.save|\\.old|\\.new|\\.orig|\\.dist|\\.txt|\\.disabled|\\.original|\\.backup|\\._back|\\._1\\.bak|~|!|\\.0|\\.1|\\.2|\\.3)('|\")"

      - type: regex
        name: ASP Source
        regex:
          - "(?i)(\\.asp)(\\.~|\\.bk|\\.bak|\\.bkp|\\.BAK|\\.swp|\\.swo|\\.swn|\\.tmp|\\.save|\\.old|\\.new|\\.orig|\\.dist|\\.txt|\\.disabled|\\.original|\\.backup|\\._back|\\._1\\.bak|~|!|\\.0|\\.1|\\.2|\\.3)('|\")"

      - type: regex
        name: Database file
        regex:
          - "(?i)\\.db|\\.sql('|\")"

      - type: regex
        name: Bash script
        regex:
          - "(?i)(\\.sh|\\.bashrc|\\.zshrc)('|\")"

      - type: regex
        name: 1Password password manager database file
        regex:
          - "(?i)\\.agilekeychain('|\")"

      - type: regex
        name: ASP configuration file
        regex:
          - "(?i)\\.asa('|\")"

      - type: regex
        name: Apple Keychain database file
        regex:
          - "(?i)\\.keychain('|\")"

      - type: regex
        name: Azure service configuration schema file
        regex:
          - "(?i)\\.cscfg('|\")"

      - type: regex
        name: Compressed archive file
        regex:
          - "(?i)(\\.zip|\\.gz|\\.tar|\\.rar|\\.tgz)('|\")"

      - type: regex
        name: Configuration file
        regex:
          - "(?i)(\\.ini|\\.config|\\.conf)('|\")"

      - type: regex
        name: Day One journal file
        regex:
          - "(?i)\\.dayone('|\")"

      - type: regex
        name: Document file
        regex:
          - "(?i)(\\.doc|\\.docx|\\.rtf)('|\")"

      - type: regex
        name: GnuCash database file
        regex:
          - "(?i)\\.gnucash('|\")"

      - type: regex
        name: Include file
        regex:
          - "(?i)\\.inc('|\")"

      - type: regex
        name: XML file
        regex:
          - "(?i)\\.xml('|\")"

      - type: regex
        name: Old file
        regex:
