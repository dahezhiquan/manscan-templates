id: redis-default-logins

info:
  name: Redis 默认凭据检测（服务漏洞）
  author: tarunKoyalwar
  severity: high
  description: |
    目标 Redis 服务接受空口令或常见弱口令访问，可能暴露键值数据与管理命令。模板使用 Redis INFO 认证探测逐一尝试内置口令，并在返回 redis_version 且非 Sentinel 响应时确认命中。
  impact: |
    - 攻击者可使用空口令或弱口令读取 Redis 键值数据，获取会话、令牌、缓存数据或业务状态。
    - 若实例暴露管理命令，还可能修改数据、清空缓存、写入持久化内容或影响依赖 Redis 的业务。
  remediation: |
    - 为 Redis 配置强口令或 ACL，避免使用空口令、默认口令或共享弱口令。
    - 将 Redis 绑定到可信网络接口，限制公网访问，并按需启用 TLS 与命令级权限控制。
  classification:
    cwe-id: CWE-521
  metadata:
    max-request: 6
    shodan-query: product:"redis"
    product: redis
    vendor: redis
  tags: js,redis,default-login,network,vuln

javascript:
  - pre-condition: |
      isPortOpen(Host,Port)
    code: |
      var m = require("nuclei/redis");
      m.GetServerInfoAuth(Host,Port,Password);
    args:
      Host: "{{Host}}"
      Port: "6379"
      Password: "{{passwords}}"
    payloads:
      passwords:
        - ""
        - root
        - password
        - admin
        - iamadmin
    stop-at-first-match: true

    matchers-condition: and
    matchers:
      - type: word
        words:
          - "redis_version"

      - type: word
        negative: true
        words:
          - "redis_mode:sentinel"
