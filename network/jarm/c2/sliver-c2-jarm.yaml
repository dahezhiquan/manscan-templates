id: sliver-c2-jarm

info:
  name: Sliver C2 JARM 识别（服务漏洞）
  author: pussycat0x
  severity: info
  description: |
    该模板通过 JARM TLS 指纹识别目标是否可能为 Sliver C2 相关命令控制基础设施。
  reference:
    - https://github.com/cedowens/C2-JARM
    - https://github.com/BishopFox/sliver
  metadata:
    max-request: 1
  tags: jarm,network,c2,ir,osint,cti,sliver,tcp,vuln
tcp:
  - inputs:
      - data: 2E
        type: hex
    host:
      - "{{Hostname}}"
    matchers:
      - type: dsl
        dsl:
          - "jarm(Hostname) == '2ad2ad0002ad2ad00041d2ad2ad41da5207249a18099be84ef3c8811adc883'"
