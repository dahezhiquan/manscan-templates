id: aim-panel

info:
  name: Aim 面板 - 检测（暴露面识别）
  author: rxerium
  severity: info
  description: |-
    Aim 是一款开源、可自托管的 AI/ML 实验跟踪工具，用于记录、查询和可视化机器学习训练运行。本次通过匹配其独特的 Web UI 页面标题和 meta 描述检测到该工具，从而降低了通用词 "Aim" 带来的误报。
  reference:
    - https://github.com/aimhubio/aim
    - https://aimstack.io
  metadata:
    verified: true
    max-request: 1
    vendor: aimhubio
    product: aim
    shodan-query: 'html:"Open-source, self-hosted AI experiment tracking tool"'
  tags: panel,aim,ml,ai,mlops,detect,discovery

http:
  - method: GET
    path:
      - "{{BaseURL}}"

    host-redirects: true
    max-redirects: 2

    matchers-condition: and
    matchers:
      - type: word
        part: body
        words:
          - "<title>Aim</title>"
          - "Open-source, self-hosted AI experiment tracking tool"
        condition: and

      - type: status
        status:
          - 200
