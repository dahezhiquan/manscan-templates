id: suid-sgid

info:
  name: root SUID/SGID 文件检查（本地基线扫描）
  author: songyaeji
  severity: high
  description: |
    该模板检查 root 拥有且设置 SUID/SGID 位的文件。此类文件若配置不当或存在漏洞，可能成为本地提权入口。
  reference:
    - https://isms.kisa.or.kr
  tags: linux,local,audit,compliance,privesc,kisas

self-contained: true

code:
  - engine:
      - sh
      - bash
    source: |
      find / -user root -type f \( -perm -4000 -o -perm -2000 \) -exec ls -lg {} \; 2>/dev/null | head -n 10

    matchers:
      - regex:
          - "^-rws.*"   # SUID
          - "^-..s.*"   # SGID
