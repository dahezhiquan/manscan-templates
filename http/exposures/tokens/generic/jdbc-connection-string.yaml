id: jdbc-connection-string

info:
  name: JDBC 连接字符串 泄露（暴露面识别）
  author: Ice3man
  severity: high
  metadata:
    max-request: 1
  tags: exposure,token,generic,vuln

http:
  - method: GET
    path:
      - "{{BaseURL}}"

    extractors:
      - type: regex
        part: body
        regex:
          - 'jdbc:[a-z:]+://[A-Za-z0-9\.\-_:;=/@?,&]+'
