id: posteio-installer

info:
  name: First Poste.io 配置 安装 Wizard
  author: ritikchaddha
  severity: high
  description: |
    检测到 First Poste.io 配置 安装 Wizard。该页面属于安装、初始化或配置向导流程，若对外暴露，攻击者可能完成初始化、创建管理员账户或重新配置目标系统。
  metadata:
    verified: true
    max-request: 1
    shodan-query: title:"Initial server configuration"
  tags: misconfig,exposure,install,poste,vuln

http:
  - method: GET
    path:
      - "{{BaseURL}}/admin/install/server"

    matchers-condition: and
    matchers:
      - type: word
        part: body
        words:
          - "<title>Initial server configuration"
          - "Generate</button>"
        condition: and

      - type: status
        status:
          - 200
