id: turnkey-lamp-panel

info:
  name: TurnKey LAMP 登录面板识别（指纹识别）
  author: ritikchaddha
  severity: info
  description: |-
    TurnKey LAMP 是 TurnKey Linux LAMP 应用栈管理入口，用于 Webmin、数据库和应用服务维护。该模板请求首页，并依据 HTTP 200 状态码、页面标题、正文关键字或品牌资源特征识别目标是否部署了该系统或暴露了对应入口，适用于资产指纹确认；命中结果仅表示系统特征匹配，不代表已确认存在未授权访问或可利用漏洞。
  reference:
  - https://www.turnkeylinux.org/lamp
  metadata:
    max-request: 1
    verified: true
    shodan-query: title:"TurnKey LAMP"
    fofa-query: title="TurnKey LAMP"
  tags: panel,login,turnkey,lamp,detect,discovery

http:
  - method: GET
    path:
      - "{{BaseURL}}"

    matchers-condition: and
    matchers:
      - type: word
        part: body
        words:
          - "TurnKey LAMP</title>"

      - type: status
        status:
          - 200
