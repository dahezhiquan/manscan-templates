id: wildix-collaboration-panel

info:
  name: Wildix Collaboration 面板识别（指纹识别）
  author: rxerium
  severity: info
  description: |
    该模板通过识别 Wildix Collaboration 登录入口的页面标题、特征文本或重定向行为，判断目标是否暴露了对应的认证界面。若命中，说明该登录面板对外可访问，可用于暴露面梳理与后续安全评估。
  reference:
    - https://www.wildix.com/product/collaboration-ucc-platform/#
  classification:
    cwe-id: CWE-200
  metadata:
    max-request: 1
    verified: true
    shodan-query: http.favicon.hash:-1295577382
  tags: panel,login,wildix,detect,discovery

http:
  - method: GET
    path:
      - "{{BaseURL}}"

    host-redirects: true
    max-redirects: 2

    matchers:
      - type: word
        part: server
        words:
          - "wildix"
