id: flowise-panel

info:
  name: Flowise 面板识别（指纹识别）
  author: rxerium
  severity: info
  description: |-
    检测到目标站点存在 Flowise 相关响应特征。Flowise 是低代码 LLM 工作流编排平台，用于构建聊天流程、代理、工具链和模型调用链。模板请求 `/`，并通过页面标题或正文关键字、状态码确认该系统指纹，用于资产识别、系统盘点和暴露面梳理。
  reference:
    - https://github.com/FlowiseAI/Flowise
    - https://flowiseai.com/
  metadata:
    verified: true
    max-request: 1
    vendor: FlowiseAI
    product: flowise
    shodan-query: 'http.title:"Flowise - Build AI Agents, Visually"'
  tags: panel,flowise,llm,ai,detect,discovery
http:
  - method: GET
    path:
      - "{{BaseURL}}"

    host-redirects: true
    max-redirects: 2

    matchers-condition: and
    matchers:
      - type: word
        part: body
        words:
          - "<title>Flowise - Build AI Agents, Visually</title>"

      - type: status
        status:
          - 200
