id: aws-app-enum

info:
  name: AWS Apps - Cloud Enumeration（云安全）
  author: initstring
  severity: info
  description: 该规则用于检查 enum aws-app-enum.yaml 相关资源是否满足推荐的云安全与合规配置要求，命中通常表示当前配置仍存在可改进的风险项。
  metadata:
    verified: true
    max-request: 1
  tags: cloud,enum,cloud-enum,aws,discovery

self-contained: true

variables:
  BaseDNS: "awsapps.com"

http:
  - raw:
      - |
        GET https://{{wordlist}}.{{BaseDNS}} HTTP/1.1
        Host: {{wordlist}}.{{BaseDNS}}

    redirects: false

    attack: batteringram
    threads: 10

    matchers:
      - type: status
        name: "Registered AWS App"
        status:
          - 200
          - 302
        condition: or
