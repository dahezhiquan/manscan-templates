id: api-abstract-email-validation

info:
  name: Abstract API Email Validation Token 可用性校验（token喷洒）
  author: daffainfo
  severity: info
  description: 该模板通过调用 Abstract Email Validation API 验证提供的 token 是否有效，命中后通常表示可访问邮箱校验能力。
  reference:
    - https://www.abstractapi.com/api/email-verification-validation-api
    - https://github.com/daffainfo/all-about-apikey/tree/main/abstract-email-validation
  metadata:
    max-request: 1
  tags: token-spray,abstractapi

self-contained: true

http:
  - method: GET
    path:
      - "https://emailvalidation.abstractapi.com/v1/?api_key={{token}}&email=johnsmith@gmail.com"

    matchers:
      - type: word
        part: body
        words:
          - '"email":'
          - '"autocorrect":'
          - '"is_valid_format":'
        condition: and
