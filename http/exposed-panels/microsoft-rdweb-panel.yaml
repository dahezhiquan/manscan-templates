id: microsoft-rdweb-panel

info:
  name: RD Web Access 面板识别（指纹识别）
  author: rxerium,sorrowx3
  severity: info
  description: |-
    检测到目标站点存在 RD Web Access 相关响应特征。RD Web Access 是 AI、机器学习或 Notebook 相关平台，用于管理模型、数据集、工作区、实验、推理服务或训练任务。模板请求 `/RDWeb/`，并通过页面标题或正文关键字、响应头关键字确认该系统指纹，用于资产识别、系统盘点和暴露面梳理。
  reference:
    - https://rdweb.wvd.microsoft.com/webclient
  classification:
    cpe: cpe:2.3:a:microsoft:remote_desktop:*:*:*:*:android:*:*:*
  metadata:
    verified: true
    max-request: 1
    vendor: microsoft
    product: remote_desktop
    shodan-query:
      - html:"RD Web Access"
      - http.html:"rd web access"
    fofa-query: body="rd web access"
  tags: panel,login,rdp,web-access,microsoft,detect,discovery
http:
  - method: GET
    path:
      - '{{BaseURL}}/RDWeb/'

    host-redirects: true
    max-redirects: 2

    matchers-condition: or
    matchers:
      - type: word
        part: header
        words:
          - "TSWAFeatureCheckCookie=true; path=/RDWeb/"

      - type: word
        part: response
        words:
          - "<rdp-client-top-view>"
          - "Microsoft Remote Desktop"
        condition: and
