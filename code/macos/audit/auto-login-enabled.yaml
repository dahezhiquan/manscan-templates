id: auto-login-enabled

info:
  name: macOS 自动登录已启用（本地基线扫描）
  author: geeknik
  severity: high
  description: |
    macOS 自动登录会在设备启动后直接进入指定用户会话，绕过开机后的交互式身份验证，设备丢失或被短暂接触时风险很高。模板读取 `com.apple.loginwindow autoLoginUser`，当该键存在且不是 “does not exist” 时表示自动登录已启用。
  impact: |
    - 未授权人员可在无需密码的情况下访问用户桌面、文件和已登录应用。
    - 自动登录会削弱 FileVault、屏幕锁定和账号审计带来的保护效果。
  remediation: |
    - 禁用自动登录，确保启动和唤醒后均需要用户凭据。
    - 对移动办公设备启用 FileVault、强密码和屏幕锁定策略。
  tags: macos,audit,local,security

self-contained: true

code:
  - engine:
      - sh
      - bash
    source: |
      defaults read /Library/Preferences/com.apple.loginwindow autoLoginUser 2>&1

    matchers-condition: and
    matchers:
      - type: status
        status:
          - 0

      - type: word
        words:
          - "does not exist"
        negative: true
