id: kafka-topics-ui

info:
  name: Apache Kafka Topics 面板识别（指纹识别）
  author: pdteam,righettod
  severity: info
  description: |-
    检测到目标站点存在 Apache Kafka Topics 相关响应特征。Apache Kafka Topics 是工业控制、能源、楼宇自动化或 HMI/SCADA 场景中的管理界面，用于监控设备状态、过程数据和现场控制相关配置。模板请求 `/`、`/info` 路径，并通过页面标题或正文关键字、状态码确认该系统指纹，用于资产识别、系统盘点和暴露面梳理。
  reference:
    - https://kafka.apache.org/
    - https://github.com/provectus/kafka-ui
  classification:
    cvss-metrics: CVSS:3.0/AV:N/AC:L/PR:N/UI:N/S:U/C:N/I:N/A:N
    cwe-id: CWE-200
    cpe: cpe:2.3:a:provectus:ui:*:*:*:*:kafka:*:*:*
  metadata:
    max-request: 2
    vendor: provectus
    product: ui
    platform: kafka
  tags: panel,kafka,apache,detect,provectus,discovery
http:
  - method: GET
    path:
      - '{{BaseURL}}'
      - '{{BaseURL}}/info'

    stop-at-first-match: true
    matchers-condition: and
    matchers:
      - type: word
        words:
          - '<title>Kafka Topics UI - Browse Kafka Data</title>'
          - '<title>UI for Apache Kafka</title>'
          - 'github.com/provectus/kafka-ui'
        condition: or

      - type: status
        status:
          - 200

    extractors:
      - type: regex
        part: body
        group: 1
        regex:
          - '"v([0-9.]+)"'
