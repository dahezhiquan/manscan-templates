id: redmine-panel

info:
  name: Redmine 登录面板识别（指纹识别）
  author: righettod
  severity: info
  description: 该模板通过识别 Redmine 登录入口的页面标题、特征文本或重定向行为，判断目标是否暴露了对应的认证界面。若命中，说明该登录面板对外可访问，可用于暴露面梳理与后续安全评估。
  reference:
    - https://www.redmine.org/
  classification:
    cpe: cpe:2.3:a:redmine:redmine:*:*:*:*:*:*:*:*
  metadata:
    verified: true
    max-request: 1
    vendor: redmine
    product: redmine
    shodan-query: http.html:'content="Redmine'
  tags: panel,redmine,login,detect,discovery

http:
  - method: GET
    path:
      - "{{BaseURL}}/login"

    matchers:
      - type: dsl
        dsl:
          - 'status_code == 200'
          - 'contains(body, "content=\"Redmine")'
        condition: and
