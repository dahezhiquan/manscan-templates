id: iclock-admin-panel

info:
  name: iClock Automatic Data Master Server Admin 面板识别（暴露面识别）
  author: deFr0ggy
  severity: info
  description: 该模板通过识别 iClock Automatic Data Master Server Admin 登录入口的页面标题、特征文本或重定向行为，判断目标是否暴露了对应的认证界面。若命中，说明该登录面板对外可访问，可用于暴露面梳理与后续安全评估。
  classification:
    cwe-id: CWE-200
  metadata:
    verified: true
    max-request: 2
    shodan-query: html:"iClock Automatic"
  tags: panel,iclock,login,admin,discovery

http:
  - method: GET
    path:
      - '{{BaseURL}}/iclock/accounts/login/'
      - '{{BaseURL}}/iclock/accounts/login/?next=/iclock/data/iclock/'

    stop-at-first-match: true
    host-redirects: true
    max-redirects: 2

    matchers-condition: and
    matchers:
      - type: word
        part: body
        words:
          - '"site-name">iClock Automatic Data Master Server'
          - '<title> | Django site admin</title>'
        condition: or

      - type: status
        status:
          - 200

    extractors:
      - type: regex
        part: body
        group: 1
        regex:
          - '<span style="float:right">\(v([0-9.-]+)\)</span>'
