id: exported-activities

info:
  name: Android 导出 Activity 检测（本地文件安全扫描）
  author: 7h3b4dger
  severity: info
  description: |
    该模板检测 AndroidManifest.xml 中导出的 Activity，排除启动器和常见 Google/Jetpack 依赖组件。导出 Activity 可能被外部应用直接调用。
  tags: android,file,exportedcomponents

file:
  - extensions:
      - xml

    matchers:
      - type: xpath
        part: body
        xpath:
          - "//activity[@android:exported='true']"
          - "//activity/intent-filter/action[@android:name!='android.intent.category.LAUNCHER']"
        condition: and

    extractors:
      - type: xpath
        part: body
        attribute: android:name
        xpath:
          - "//activity[@android:exported='true'and not(contains(@android:name, 'androidx')) and not(contains(@android:name, 'google'))]"
