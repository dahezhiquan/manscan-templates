id: gcloud-approved-external-lb

info:
  name: Unapproved External Load Balancers 中的Google Cloud Projects（云安全）
  author: princechaddha
  severity: medium
  description: 未经批准的外部负载均衡器会扩大互联网入口和变更治理范围，可能绕过组织既定的暴露面审批。本模板枚举 URL map、HTTP proxy 和 forwarding rules，并在 loadBalancingScheme 命中 EXTERNAL_MANAGED 时报告项目中存在外部托管负载均衡器。
  impact: |
    - 对外入口未经资产登记和安全评审时，后端服务、证书、WAF 和访问控制可能配置不完整。
    - 外部流量路径缺少审批记录会增加暴露面盘点、事件响应和合规证明难度。
  remediation: |
    - 建立外部负载均衡器审批清单，仅允许业务需要且安全控制齐备的入口继续保留。
    - 对不需要公网访问的负载均衡器改为内部方案或移除 forwarding rule，并补充标签、日志和防护策略。
  reference:
    - https://cloud.google.com/load-balancing/docs
  metadata:
    vendor: google
    product: cloud-load-balancing
  tags: cloud,devops,gcp,gcloud,google-cloud-load-balancing,gcp-cloud-config

flow: |
  code(1)
  for(let projectId of iterate(template.projectIds)){
    set("projectId", projectId)
    code(2)
    for(let urlMap of iterate(template.urlMaps)){
      set("urlMap", urlMap)
      code(3)
      for(let targetHttpProxy of iterate(template.targetHttpProxies)){
        set("targetHttpProxy", targetHttpProxy)
        code(4)
        for(let forwardingRule of iterate(template.forwardingRules)){
          code(5)
        }
      }
    }
  }

self-contained: true

code:
  - engine:
      - sh
      - bash
    source: |
      gcloud projects list --format="json(projectId)"

    extractors:
      - type: json
        name: projectIds
        internal: true
        json:
          - '.[].projectId'

  - engine:
      - sh
      - bash
    source: |
      gcloud compute url-maps list --project $projectId --format="json(name)"

    extractors:
      - type: json
        name: urlMaps
        internal: true
        json:
          - '.[].name'

  - engine:
      - sh
      - bash
    source: |
      gcloud compute target-http-proxies list --project $projectId --format="json(name,urlMap)"

    extractors:
      - type: json
        name: targetHttpProxies
        internal: true
        json:
          - '.[] | {name: .name, urlMap: .urlMap}'

  - engine:
      - sh
      - bash
    source: |
      gcloud compute forwarding-rules list --project $projectId --format="json(name,loadBalancingScheme,target)"

    matchers:
      - type: word
        words:
          - 'EXTERNAL_MANAGED'

    extractors:
      - type: dsl
        dsl:
          - '"Unapproved External Load Balancer in project: " + projectId + ", Load Balancer: " + name'
