id: nis-client

info:
  name: NIS 客户端不应安装（本地基线扫描）
  author: Th3l0newolf
  severity: low
  description: |
    NIS 客户端依赖旧式网络身份信息分发机制，安全边界和加密能力较弱，现代环境中通常不应保留。CIS Ubuntu 基线建议移除不必要的 NIS 组件；模板通过 `dpkg-query` 检查 `nis` 包是否安装，命中 Policy-Fail 表示不符合基线。
  impact: |
    - 增加主机误用高风险协议或旧式信任机制的机会，可能暴露凭据、会话内容或内部连接信息。
    - 攻击者在获得低权限落点后，可能利用已安装客户端辅助横向连接、数据传输或绕过组织基线管控。
  remediation: |
    - 如无明确业务需求，卸载 `nis` 或对应软件包，并清理残留服务配置。
    - 如必须保留，限制访问来源和可用范围，启用加密认证，并纳入补丁、日志和基线审计。
  reference:
    - https://www.cisecurity.org/benchmark/ubuntu_linux
  metadata:
    verified: true
  tags: cis,local,cisecurity,audit,linux,ubuntu,nis

self-contained: true

code:
  - engine:
      - bash

    args:
      - "-c"
      - |
        # Check if the nis package is installed
        if dpkg-query -W -f='${Status}' nis 2>/dev/null | grep -q "install ok installed"; then
          echo "[cis-nis-client-check:Policy-Fail] [NIS is installed] [CIS_FAIL]"
        else
          echo "[cis-nis-client-check:Policy-Pass] [NIS is not installed] [CIS_PASS]"
        fi

    matchers:
      - type: word
        name: policy-pass
        words:
          - "Policy-Pass"

      - type: word
        name: policy-fail
        words:
          - "Policy-Fail"
