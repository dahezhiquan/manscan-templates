id: mappproxy-detect

info:
  name: MapProxy 指纹识别（指纹识别）
  author: philippedelteil
  severity: info
  description: >-
    MapProxy 是地图瓦片代理和缓存服务，用于缓存、转换和发布 WMS/WMTS 等 GIS 地图服务。该模板通过请求目标服务并检查预设路径或首页响应、页面正文关键字、HTTP
    响应头、正则特征等指纹特征，判断目标是否使用或暴露了 MapProxy 相关组件；命中结果仅表示指纹特征匹配，可用于资产盘点、技术栈识别和后续安全评估，不代表已确认存在可利用漏洞。
  reference:
  - https://github.com/mapproxy/mapproxy
  - https://mapproxy.org
  metadata:
    max-request: 2
    shodan-query: http.html:"Welcome to MapProxy"
  tags: tech,mapproxy,detect,discovery
http:
  - method: GET
    path:
      - "{{BaseURL}}"
      - "{{BaseURL}}/demo"

    host-redirects: true
    max-redirects: 2

    matchers-condition: and
    matchers:
      - type: word
        part: body
        words:
          - "Welcome to MapProxy"
          - "MapProxy Demo"
        condition: or

      - type: word
        part: header
        words:
          - "text/html"

    extractors:
      - type: regex
        part: body
        group: 1
        regex:
          - MapProxy(?i) ([0-9]+\.[0-9]+\.[0-9]+)
