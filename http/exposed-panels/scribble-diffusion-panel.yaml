id: scribble-diffusion-panel

info:
  name: Scribble Diffusion 面板识别（指纹识别）
  author: rxerium
  severity: info
  description: |-
    Scribble Diffusion 是 AI 图像生成应用，用于将草图或提示词转换为生成式图像。该模板请求首页，并依据 HTTP 200 状态码、页面标题、正文关键字或品牌资源特征识别目标是否部署了该系统或暴露了对应入口，适用于资产指纹确认；命中结果仅表示系统特征匹配，不代表已确认存在未授权访问或可利用漏洞。
  reference:
  - https://scribblediffusion.com/
  - https://github.com/replicate/scribble-diffusion
  metadata:
    verified: true
    max-request: 1
    shodan-query: title:"Scribble Diffusion"
  tags: panel,scribble,detect,discovery,ai

http:
  - method: GET
    path:
      - "{{BaseURL}}"

    matchers-condition: and
    matchers:
      - type: word
        words:
          - '<title>Scribble Diffusion'
          - 'content="Scribble Diffusion'
        condition: or

      - type: status
        status:
          - 200
