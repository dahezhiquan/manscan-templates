id: fastly-debug-headers

info:
  name: Fastly CDN 调试 Headers 暴露
  author: pussycat0x
  severity: low
  description: |
    检测到 Fastly CDN 调试 Headers 暴露。目标暴露了调试、错误或堆栈信息，可能泄露应用路径、框架版本、环境变量、源码位置或内部调用细节。
  reference:
    - https://www.fastly.com/documentation/reference/http/http-headers/Fastly-Debug/
  metadata:
    max-request: 1
    verified: true
    shodan-query: 'X-Served-By: cache'
  tags: fastly,cdn,exposure,misconfig

http:
  - method: GET
    path:
      - "{{BaseURL}}"

    headers:
      Fastly-Debug: "1"

    matchers-condition: or
    matchers:
      - type: regex
        name: fastly-debug-path
        part: header
        regex:
          - '(?i)fastly-debug-path:\s*.+'

      - type: regex
        name: fastly-debug-ttl
        part: header
        regex:
          - '(?i)fastly-debug-ttl:\s*.+'

      - type: regex
        name: fastly-debug-digest
        part: header
        regex:
          - '(?i)fastly-debug-digest:\s*.+'
