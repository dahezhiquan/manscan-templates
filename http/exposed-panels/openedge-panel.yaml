id: openedge-panel

info:
  name: OpenEdge 登录面板识别（指纹识别）
  author: rxerium
  severity: info
  description: |
    该模板通过识别 OpenEdge 登录入口的页面标题、特征文本或重定向行为，判断目标是否暴露了对应的认证界面。若命中，说明该登录面板对外可访问，可用于暴露面梳理与后续安全评估。
  classification:
    cpe: cpe:2.3:a:progress:openedge:*:*:*:*:*:*:*:*
  metadata:
    verified: true
    max-request: 1
    vendor: progress
    product: openedge
    shodan-query: html:"Welcome to Progress Application Server for OpenEdge"
  tags: panel,openedge,login,detect,discovery

http:
  - method: GET
    path:
      - '{{BaseURL}}'

    matchers-condition: and
    matchers:
      - type: word
        part: body
        words:
          - "Welcome to Progress Application Server for OpenEdge"

      - type: status
        status:
          - 200
