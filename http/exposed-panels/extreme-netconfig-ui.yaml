id: extreme-netconfig-ui

info:
  name: Extreme NetConfig UI 面板识别（指纹识别）
  author: pussycat0x
  severity: info
  description: |-
    检测到目标站点存在 Extreme NetConfig UI 相关响应特征。Extreme NetConfig UI 是网络设备或网关的 Web 管理界面，用于配置路由、无线、蜂窝接入、端口转发和设备运维参数。模板请求 `/index.php5`，并通过页面标题或正文关键字、状态码确认该系统指纹，用于资产识别、系统盘点和暴露面梳理。
  classification:
    cvss-metrics: CVSS:3.0/AV:N/AC:L/PR:N/UI:N/S:U/C:N/I:N/A:N
    cwe-id: CWE-200
  metadata:
    max-request: 1
    shodan-query: http.title:"Extreme NetConfig UI"
  tags: panel,tech,hiveos,extreme,discovery
http:
  - method: GET
    path:
      - "{{BaseURL}}/index.php5"

    matchers-condition: and
    matchers:
      - type: word
        part: body
        words:
          - '<title>Extreme NetConfig UI</title>'
        condition: and

      - type: status
        status:
          - 200

    extractors:
      - type: regex
        part: body
        group: 1
        regex:
          - 'version" align="right" valign="bottom">([0-9.a-z]+)<\/td>'
