id: orangescrum-install

info:
  name: Orangescrum 暴露 安装
  author: ritikchaddha
  severity: high
  description: |
    检测到 Orangescrum 暴露 安装。该页面属于安装、初始化或配置向导流程，若对外暴露，攻击者可能完成初始化、创建管理员账户或重新配置目标系统。
  classification:
    cpe: cpe:2.3:a:orangescrum:orangescrum:*:*:*:*:*:*:*:*
  metadata:
    verified: true
    max-request: 1
    vendor: orangescrum
    product: orangescrum
    shodan-query: title:"Orangescrum Setup Wizard"
  tags: misconfig,orangescrum,install,vuln

http:
  - method: GET
    path:
      - "{{BaseURL}}"

    matchers-condition: and
    matchers:
      - type: word
        words:
          - '<title>Orangescrum Setup Wizard'

      - type: status
        status:
          - 200
