id: redirect-pizza-takeover
info:
  name: Redirect.pizza 重定向域名接管检测（子域名接管）
  author: Ranjan Kumar
  severity: high
  description: |
    检测 Redirect.pizza 自定义域名未关联有效重定向配置的情况，说明目标子域名可能仍指向 Redirect.pizza 服务，存在被重新声明并接管跳转行为的风险。
  reference:
    - https://redirect.pizza/docs
  metadata:
    max-request: 1
    shodan-query: html:"redirect.pizza"
    fofa-query: body="redirect.pizza"
  tags: takeover,redirect-pizza,vuln

http:
  - method: GET
    path:
      - "{{BaseURL}}"

    matchers-condition: and
    matchers:
      - type: dsl
        dsl:
          - Host != ip
          - contains_all(body, "Unable to redirect","redirect.pizza")
          - contains(content_type, "text/html")
        condition: and

    extractors:
      - type: dsl
        dsl:
          - cname
