id: tekon-info-leak

info:
  name: Tekon - 未授权访问漏洞
  author: gy741
  severity: low
  description: |
    该模板用于检测 Tekon - 未授权访问漏洞。该类漏洞通常源于认证、授权或会话校验逻辑不完整，使未授权用户可访问受保护接口或执行敏感操作。模板会向 `/cgi-bin/log.cgi` 等位置发送探测请求，并结合响应状态、关键字、错误信息、时间差或外带交互等证据判断目标是否受影响。
  impact: |
    - 攻击者可绕过登录或权限限制，访问管理功能、敏感数据或业务操作接口。
    - 在管理接口暴露的场景下，可能进一步导致配置被篡改、账号被接管或系统被植入后门。
  remediation: |
    - 在服务端统一执行认证和授权校验，避免仅依赖前端控制或可预测参数。
    - 修复存在绕过问题的版本，并限制管理接口、调试接口和敏感 API 的访问来源。
    - 审计异常登录、权限变更和配置修改记录，轮换可能受影响的账号凭据。
  reference:
    - https://medium.com/@bertinjoseb/post-auth-rce-based-in-malicious-lua-plugin-script-upload-scada-controllers-located-in-russia-57044425ac38
  classification:
    cpe: cpe:2.3:o:tekon:kio_firmware:*:*:*:*:*:*:*:*
  metadata:
    max-request: 1
    vendor: tekon
    product: kio_firmware
    shodan-query: title:"контроллер"
  tags: tekon,exposure,unauth,vuln

http:
  - method: GET
    path:
      - '{{BaseURL}}/cgi-bin/log.cgi'

    max-size: 2048

    matchers-condition: and
    matchers:
      - type: word
        part: body
        words:
          - "-- Logs begin at"
          - "end at"
        condition: and

      - type: word
        part: header
        words:
          - "text/plain"

      - type: status
        status:
          - 200
