id: swag-instance-default-page

info:
  name: SWAG 默认页面 指纹识别（指纹识别）
  author: DhiyaneshDK
  severity: info
  description: >-
    SWAG 是基于 Nginx 的安全 Web 应用网关容器，常用于反向代理、TLS 证书和自托管服务入口。该模板通过请求目标服务并检查预设路径或首页响应、页面正文关键字、HTTP
    响应头、状态码等指纹特征，判断目标是否使用或暴露了 SWAG 默认页面 相关组件；命中结果仅表示指纹特征匹配，可用于资产盘点、技术栈识别和后续安全评估，不代表已确认存在可利用漏洞。
  classification:
    cvss-metrics: CVSS:3.0/AV:N/AC:L/PR:N/UI:N/S:U/C:N/I:N/A:N
    cvss-score: 0
    cwe-id: CWE-200
  metadata:
    verified: true
    max-request: 1
    shodan-query: title:"Welcome to your SWAG instance"
  tags: panel,tech,discovery
http:
  - method: GET
    path:
      - "{{BaseURL}}"

    matchers-condition: and
    matchers:
      - type: word
        words:
          - "<title>Welcome to your SWAG instance</title>"

      - type: word
        part: header
        words:
          - "text/html"

      - type: status
        status:
          - 200
