id: wordpress-wp-cron

info:
  name: Wordpress wp-cron.php DOS
  author: pathtaga
  severity: medium
  description: |
    该模板用于检测 Wordpress wp-cron.php DOS。该问题通常源于受影响接口或组件缺少必要的输入校验、访问控制或安全边界限制。模板会向 `/wp-cron.php` 等位置发送探测请求，并结合响应状态、关键字、错误信息、时间差或外带交互等证据判断目标是否受影响。
  impact: |
    - 攻击者可能利用该缺陷访问敏感功能、读取或篡改数据，或扩大对目标系统的控制范围。
    - 在公网暴露、权限配置过宽或与其他缺陷组合时，可能造成更严重的业务中断和数据泄露。
  remediation: |
    - 升级受影响产品或组件到厂商修复版本，并移除不再维护的高风险功能。
    - 对相关接口增加认证、授权、输入校验和访问来源限制。
    - 复核访问日志和异常操作记录，确认是否存在已被利用的迹象。
  reference:
    - https://book.hacktricks.wiki/en/network-services-pentesting/pentesting-web/wordpress.html
    - https://medium.com/@thecpanelguy/the-nightmare-that-is-wpcron-php-ae31c1d3ae30
  metadata:
    max-request: 2
  tags: wordpress,cron,dos,vuln

http:
  - method: GET
    path:
      - "{{BaseURL}}"
      - "{{BaseURL}}/wp-cron.php"

    matchers-condition: and
    matchers:
      - type: dsl
        dsl:
          - (regex("<link[^>]+s\d+\.wp\.com",body_1))
          - (regex("<!-- This site is optimized with the Yoast (?:WordPress )?SEO plugin v([\d.]+) -",body_1))
          - (regex("<!--[^>]+WP-Super-Cache",body_1))
          - contains(body_1, "/wp-content/themes/")
          - contains(body_1, "/wp-includes/")
          - contains(body_1, 'name=\"generator\" content=\"wordpress')
          - contains(body_1, '<!-- performance optimized by w3 total cache.')
        condition: or

      - type: dsl
        dsl:
          - "len(body_2) == 0"
          - "status_code_2 == 200"
          - "contains(content_type_2, 'text/html')"
        condition: and
