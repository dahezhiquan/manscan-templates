id: oreilly-phish

info:
  name: O'Reilly Auto Parts 仿冒钓鱼网站（钓鱼网站识别）
  author: rxerium
  severity: info
  description: |
    检测到疑似仿冒 O'Reilly Auto Parts 的钓鱼网站。模板在目标页面返回 200、页面内容命中 O'Reilly Auto Parts 的品牌页面特征，且当前主机不属于 oreillyauto.com 官方域名时触发，用于识别借用 O'Reilly Auto Parts 品牌页面诱导用户信任的仿冒站点。
  reference:
    - https://oreillyauto.com
  metadata:
    max-request: 1
  tags: phishing,oreilly,ecommerce,osint,discovery
http:
  - method: GET
    path:
      - "{{BaseURL}}"

    host-redirects: true
    max-redirects: 2

    matchers-condition: and
    matchers:
      - type: word
        words:
          - "Find auto parts, tools, and more at O&#39;Reilly Auto Parts. Shop online for FREE Next Day shipping or pick up your order at one of more than 6,000 stores."

      - type: status
        status:
          - 200

      - type: dsl
        dsl:
          - '!contains(host,"oreillyauto.com")'
