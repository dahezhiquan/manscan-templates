id: azure-lb-unused
info:
  name: Azure Unused Load Balancer 检查（云安全）
  author: princechaddha
  severity: low
  description: Azure Load Balancer 若没有任何后端 IP 配置，通常表示负载均衡器处于闲置或遗留状态。本模板枚举负载均衡器，查询 backendAddressPools 中的 backendIpConfigurations，并在返回空数组 [] 时报告未关联后端实例。
  impact: |
    - 闲置的公网负载均衡器会保留不必要的公网入口、配置和权限对象，增加误配置和被探测的攻击面。
    - 遗留资源还会产生持续费用，导致资产盘点、变更审批和事件响应时误判实际流量路径。
  remediation: |
    - 结合流量、DNS、监控和变更记录确认是否仍有业务依赖；无依赖时删除负载均衡器及其不再需要的公网资源。
    - 仍需保留时补齐后端池、健康探测和访问控制，并记录用途、负责人和生命周期。
  reference:
    - https://docs.microsoft.com/en-us/azure/load-balancer/load-balancer-overview
  metadata:
    vendor: microsoft
    product: azure-load-balancer
  tags: cloud,devops,azure,microsoft,load-balancer,azure-cloud-config

flow: |
  code(1);
  for (let BalancerData of iterate(template.balancerList)) {
    BalancerData = JSON.parse(BalancerData);
    set("name", BalancerData.Name);
    set("resourceGroup", BalancerData.ResourceGroup);
    code(2);
  }

self-contained: true
code:
  - engine:
      - sh
      - bash
    source: |
      az network lb list --output json --query '[*].{"Name":name,"ResourceGroup":resourceGroup}'

    extractors:
      - type: json
        name: balancerList
        internal: true
        json:
          - '.[]'

  - engine:
      - sh
      - bash
    source: |
      az network lb show --name "$name" --resource-group "$resourceGroup" --query 'backendAddressPools[*].backendIpConfigurations[*].id | []'

    matchers-condition: and
    matchers:
      - type: word
        words:
          - '[]'

    extractors:
      - type: dsl
        dsl:
          - 'name + " in " + resourceGroup + " is unused with no backend instances"'
