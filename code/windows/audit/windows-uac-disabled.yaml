id: windows-uac-disabled

info:
  name: 用户账户控制 UAC 已禁用（本地基线扫描）
  author: princechaddha
  severity: high
  description: |
    该模板检查 User Account Control（UAC）是否关闭。UAC 关闭会减少管理员操作提示和隔离保护。
  impact: |
    恶意程序可更容易进行系统级修改，扩大入侵影响。
  remediation: |
    启用 UAC，并配置管理操作需要确认或凭据提示。
  tags: windows,uac,code,windows-audit

self-contained: true

code:
  - pre-condition: |
      IsWindows();
    engine:
      - powershell
      - powershell.exe
    args:
      - -ExecutionPolicy
      - Bypass
    pattern: "*.ps1"
    source: |
      Get-ItemProperty -Path 'HKLM:\Software\Microsoft\Windows\CurrentVersion\Policies\System' -Name 'EnableLUA'

    matchers:
      - type: word
        words:
          - "EnableLUA    : 0"
