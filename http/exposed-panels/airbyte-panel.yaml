id: airbyte-panel

info:
  name: Airbyte 面板识别（指纹识别）
  author: ChrisJr404
  severity: info
  description: |-
    检测到目标站点存在 Airbyte 相关响应特征。Airbyte 是数据集成与同步平台，控制台用于配置数据源、目标端、连接任务和同步状态。模板请求 `/`、`/api/v1/health` 路径，并通过页面标题或正文关键字、状态码、DSL 条件确认该系统指纹，用于资产识别、系统盘点和暴露面梳理。
  reference:
    - https://github.com/airbytehq/airbyte
    - https://airbyte.com/
    - https://docs.airbyte.com/api-documentation
  metadata:
    verified: true
    max-request: 2
    vendor: airbyte
    product: airbyte
    shodan-query: http.title:"Airbyte"
    fofa-query: title="Airbyte"
  tags: panel,airbyte,login,detect
http:
  - method: GET
    path:
      - "{{BaseURL}}"
      - "{{BaseURL}}/api/v1/health"

    host-redirects: true
    max-redirects: 2
    stop-at-first-match: true

    matchers:
      - type: dsl
        dsl:
          - 'contains_any(to_lower(body), "<title>airbyte", "name=\"airbyte:")'
          - 'status_code == 200'
        condition: and
