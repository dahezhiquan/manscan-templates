id: secret-manager-not-inuse

info:
  name: Secrets Manager 未使用（云安全）
  author: DhiyaneshDK
  severity: info
  description: AWS Secrets Manager 用于集中存储、加密和轮换数据库口令、API key 等敏感凭据；账号内没有 secret 通常表示凭据可能仍分散在代码、环境变量或人工流程中。该模板调用 list-secrets，并在 SecretList 为空数组时命中。
  impact: |
    - 凭据分散管理会增加硬编码、泄露后无法快速轮换和权限不可审计的风险。
    - 缺少集中密钥管理会削弱应用凭据生命周期治理和合规证明能力。
  remediation: |
    - 将应用和数据库敏感凭据迁移到 AWS Secrets Manager 或组织认可的集中密钥管理服务。
    - 为 secret 配置 KMS 加密、最小权限访问策略、审计日志和必要的自动轮换。
  reference:
    - https://www.trendmicro.com/cloudoneconformity-staging/knowledge-base/aws/SecretsManager/secrets-manager-in-use.html
    - https://docs.aws.amazon.com/secretsmanager/latest/userguide/intro.html
  metadata:
    vendor: amazon
    product: secrets-manager
  tags: cloud,devops,aws,amazon,secret-manager,aws-cloud-config

variables:
  region: "us-west-2"

self-contained: true
code:
  - engine:
      - sh
      - bash
    source: |
      aws secretsmanager list-secrets --region $region --query 'SecretList[*].Name' --output json

    matchers:
      - type: word
        words:
          - '[]'

    extractors:
      - type: dsl
        dsl:
          - '"Secrets Manager Not In Use" + region + " AWS region"'
