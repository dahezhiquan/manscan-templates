id: aviatrix-panel

info:
  name: Aviatrix Cloud Controller 面板（暴露面识别）
  author: pikpikcu,philippedelteil,daffainfo
  severity: info
  description: 该模板通过识别 Aviatrix Cloud Controller 登录入口的页面标题、特征文本或重定向行为，判断目标是否暴露了对应的认证界面。若命中，说明该登录面板对外可访问，可用于暴露面梳理与后续安全评估。
  reference:
    - https://docs.aviatrix.com/HowTos/controller_config.html
  classification:
    cwe-id: CWE-200
    cpe: cpe:2.3:a:aviatrix:controller:*:*:*:*:*:*:*:*
  metadata:
    max-request: 1
    vendor: aviatrix
    product: controller
    shodan-query:
      - http.title:"Aviatrix Cloud Controller"
      - http.title:"aviatrix cloud controller"
    fofa-query: title="aviatrix cloud controller"
    google-query: intitle:"aviatrix cloud controller"
  tags: panel,aviatrix,discovery

http:
  - method: GET
    path:
      - "{{BaseURL}}"

    matchers-condition: and
    matchers:
      - type: word
        part: body
        words:
          - '<title>Aviatrix'
          - 'Controller</title>'
        condition: and

      - type: status
        status:
          - 200
