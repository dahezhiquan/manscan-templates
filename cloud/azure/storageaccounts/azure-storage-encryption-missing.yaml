id: azure-storage-encryption-missing
info:
  name: Azure Storage 基础设施加密状态缺失（云安全）
  author: princechaddha
  severity: high
  description: Azure Storage 基础设施加密是在服务端加密之外增加的一层静态数据保护，适用于需要纵深加密的高敏感数据。本模板枚举存储账户并查询 requireInfrastructureEncryption，在返回值为 null 时报告未明确配置该状态；命中结果应结合账户 SKU 和服务能力进一步复核。
  impact: |
    - 存储介质、快照或底层基础设施暴露时，账户缺少额外静态加密层保护。
    - 对受监管数据，无法证明基础设施加密状态可能导致合规证据不足和整改延迟。
  remediation: |
    - 结合账户类型和区域能力确认是否支持基础设施加密，并在支持时启用 requireInfrastructureEncryption。
    - 对不支持该能力的账户评估迁移到合适的冗余类型或服务配置，并保留加密状态审计证据。
  reference:
    - https://docs.microsoft.com/en-us/azure/storage/common/storage-service-encryption
  metadata:
    vendor: microsoft
    product: azure-storage
  tags: cloud,devops,azure,microsoft,azure-storage,azure-cloud-config

flow: |
  code(1);
  for (let StorageData of iterate(template.storageList)) {
    set("name", StorageData);
    code(2);
  }

self-contained: true
code:
  - engine:
      - sh
      - bash
    source: |
      az storage account list --query '[*].name'

    extractors:
      - type: json
        name: storageList
        internal: true
        json:
          - '.[]'

  - engine:
      - sh
      - bash
    source: |
      az storage account show --name "$name" --query '{"requireInfrastructureEncryption":encryption.requireInfrastructureEncryption}'

    matchers-condition: and
    matchers:
      - type: word
        words:
          - '"requireInfrastructureEncryption": null'

    extractors:
      - type: dsl
        dsl:
          - 'name + " does not have Infrastructure Encryption enabled"'
