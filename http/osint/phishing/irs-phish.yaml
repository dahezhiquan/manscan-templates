id: irs-phish

info:
  name: IRS 仿冒钓鱼网站（钓鱼网站识别）
  author: rxerium
  severity: high
  description: |
    IRS 是面向美国税务申报、身份验证和纳税服务的政府机构品牌，钓鱼仿冒常借助税务通知、退税或欠税场景诱导用户提交敏感信息。该模板用于识别疑似仿冒 IRS 的钓鱼网站；模板访问目标站点首页，在目标页面返回 200 状态码，且页面内容命中 IRS 官方页面常见文案或标题特征（“Pay your taxes. Get your refund status. Find IRS forms and...”），且当前主机不属于 irs.gov 等官方域名时触发。该类仿冒页面通常用于收集身份资料、税务信息、付款信息或验证码，可能造成身份冒用、退税诈骗和后续精准欺诈。
  impact: |-
    - 用户可能在仿冒页面提交身份资料、税务信息、付款信息或验证码，导致身份冒用、退税诈骗和个人敏感信息泄露。
    - 钓鱼站点可能被用于投递恶意链接、伪造登录流程或绕过用户对官方品牌的信任判断。
    - 品牌方或被仿冒组织可能面临客户投诉、欺诈交易、信誉受损以及后续应急处置成本。
  remediation: |-
    - 确认该站点是否为授权域名；若确认为仿冒站点，立即在网关、DNS、邮件安全和浏览器安全策略中阻断访问。
    - 向被仿冒品牌、托管商、注册商、CDN 和浏览器安全浏览服务提交滥用举报或下架请求。
    - 保留 URL、域名、解析记录、页面截图、证书和命中特征等证据，用于威胁情报关联和后续追踪。
    - 排查是否已有用户访问或提交信息；对疑似受影响账号执行密码重置、会话撤销、令牌轮换和多因素认证加固。
    - 对可能暴露的税务账号、身份资料和支付渠道执行身份核验、交易监控和异常申报排查。
  reference:
    - https://irs.gov
  metadata:
    max-request: 1
  tags: phishing,irs,government,osint,discovery
http:
  - method: GET
    path:
      - "{{BaseURL}}"

    host-redirects: true
    max-redirects: 2

    matchers-condition: and
    matchers:
      - type: word
        words:
          - "Pay your taxes. Get your refund status. Find IRS forms and answers to tax questions. We help you understand and meet your federal tax responsibilities."

      - type: status
        status:
          - 200

      - type: dsl
        dsl:
          - '!contains(host,"irs.gov")'
