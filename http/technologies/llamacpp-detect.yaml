id: llamacpp-detect

info:
  name: llama.cpp 指纹识别（指纹识别）
  author: rxerium
  severity: info
  description: |
    用于识别目标暴露的 llama.cpp，模板会结合 HTTP 响应头、页面正文和特定路径或已知端点判断是否存在对应技术或默认页面特征。
  reference:
    - https://github.com/ggerganov/llama.cpp
  metadata:
    verified: true
    max-request: 1
    vendor: ggerganov
    product: llama.cpp
    shodan-query: 'http.headers.server:"llama.cpp"'
    fofa-query: 'server="llama.cpp"'
  tags: tech,llamacpp,llm,ai,detect,discovery

http:
  - raw:
      - |
        GET /health HTTP/1.1
        Host: {{Hostname}}

    host-redirects: true
    max-redirects: 2

    matchers-condition: and
    matchers:
      - type: word
        part: body
        words:
          - '"status":"ok"'

      - type: dsl
        dsl:
          - contains(header, "llama.cpp")
          - status_code == 200
        condition: and
