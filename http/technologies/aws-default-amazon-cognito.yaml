id: aws-default-amazon-cognito

info:
  name: Amazon Cognito Developer Authentication Sample 指纹识别（指纹识别）
  author: pussycat0x
  severity: info
  description: Amazon Cognito Developer Authentication Sample 是 AWS 身份认证服务，用于用户池、身份联合和应用登录集成。该模板请求首页，并依据 DSL 条件识别目标是否使用或暴露了 Amazon Cognito Developer Authentication Sample 相关组件，适用于资产盘点、技术栈识别和后续安全评估；命中结果仅表示指纹特征匹配，不代表已确认存在可利用漏洞。
  reference:
  - https://docs.aws.amazon.com/cognito/latest/developerguide/developer-authenticated-identities.html
  metadata:
    verified: true
    max-request: 1
    shodan-query: http.title:"Amazon Cognito Developer Authentication Sample"
  tags: aws,cognito,default,tech,discovery

http:
  - method: GET
    path:
      - "{{BaseURL}}"

    matchers:
      - type: dsl
        dsl:
          - 'contains(body, "Amazon Cognito Developer Authentication Sample") && contains(body, "Congratulations!")'
          - 'status_code == 200'
        condition: and
