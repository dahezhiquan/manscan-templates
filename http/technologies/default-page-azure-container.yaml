id: default-page-azure-container

info:
  name: Azure Container 实例 默认页面 指纹识别（指纹识别）
  author: DhiyaneshDK
  severity: info
  description: Azure Container 实例 默认页面 是 Azure 容器实例默认页面，用于表示云容器服务已部署并响应 HTTP 请求。该模板请求首页，并依据 HTTP 200 状态码、页面标题、正文关键字或品牌资源特征识别目标是否使用或暴露了 Azure Container 实例 默认页面 相关组件，适用于资产盘点、技术栈识别和后续安全评估；命中结果仅表示指纹特征匹配，不代表已确认存在可利用漏洞。
  metadata:
    verified: true
    max-request: 1
    shodan-query: title:"Welcome to Azure Container Instances!"
  tags: tech,azure,cloud,discovery

http:
  - method: GET
    path:
      - "{{BaseURL}}"

    matchers-condition: and
    matchers:
      - type: word
        words:
          - '<title>Welcome to Azure Container Instances!</title>'

      - type: status
        status:
          - 200
