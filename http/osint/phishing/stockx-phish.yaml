id: stockx-phish

info:
  name: StockX 仿冒钓鱼网站（钓鱼网站识别）
  author: rxerium
  severity: info
  description: |
    检测到疑似仿冒 StockX 的钓鱼网站。模板在目标页面返回 200、页面内容命中 StockX 的品牌页面特征，且当前主机不属于 stockx.com 官方域名时触发，用于识别借用 StockX 品牌页面诱导用户信任的仿冒站点。
  reference:
    - https://stockx.com
  metadata:
    max-request: 1
  tags: phishing,stockx,ecommerce,osint,discovery
http:
  - method: GET
    path:
      - "{{BaseURL}}"

    host-redirects: true
    max-redirects: 2

    matchers-condition: and
    matchers:
      - type: word
        words:
          - 'StockX'
          - 'Buy and sell the hottest sneakers including Adidas Yeezy and Retro Jordans, Supreme streetwear, trading cards, collectibles, designer handbags and watches.'
        condition: and

      - type: status
        status:
          - 200

      - type: dsl
        dsl:
          - '!contains(host,"stockx.com")'
