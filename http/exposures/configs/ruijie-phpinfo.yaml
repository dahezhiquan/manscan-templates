id: ruijie-phpinfo

info:
  name: Ruijie PHPinfo配置暴露（暴露面识别）
  author: pikpikcu
  severity: low
  description: |
    检测到目标站点可直接访问 Ruijie PHPinfo配置。锐捷网络设备和管理页面常用于校园、企业网络接入和网关管理，公开配置或状态信息可能暴露设备细节。该模板请求 `/tool/view/phpinfo.view.php`，并通过 HTTP 状态码、响应正文关键字、文件格式特征、正则匹配或响应头进行确认。配置文件公开后可能泄露部署细节、内部路径、依赖版本、环境变量、访问凭据或调试信息，增加被侦察和后续利用的风险。
  impact: |-
    - 调试、状态、历史或转储文件可能泄露环境变量、内存片段、命令历史、内部路径、组件版本和运行参数。
    - 攻击者可利用这些细节筛选已知漏洞、还原业务流程、定位敏感文件或制定更精确的后续攻击路径。
    - 部分历史或转储内容可能直接包含凭据、请求数据、SQL 语句或用户信息，扩大敏感数据泄露范围。
  remediation: |-
    - 关闭生产环境中的调试、状态、历史、转储、phpinfo、探针和未受保护的运行信息页面。
    - 将历史记录、崩溃转储和调试产物从 Web 可访问目录移除，并清理 CDN、对象存储和搜索引擎缓存。
    - 检查文件中是否包含凭据、请求数据、SQL 语句或用户信息，必要时执行密钥轮换和受影响账号处置。
    - 复核相关组件版本和配置，修复因暴露信息指向的弱配置或已知漏洞。
  reference:
    - https://github.com/PeiQi0/PeiQi-WIKI-POC/blob/PeiQi/PeiQi_Wiki/%E7%BD%91%E7%BB%9C%E8%AE%BE%E5%A4%87%E6%BC%8F%E6%B4%9E/%E9%94%90%E6%8D%B7/%E9%94%90%E6%8D%B7EG%E6%98%93%E7%BD%91%E5%85%B3%20phpinfo.view.php%20%E4%BF%A1%E6%81%AF%E6%B3%84%E9%9C%B2%E6%BC%8F%E6%B4%9E.md
  classification:
    cwe-id: CWE-200
  metadata:
    max-request: 1
  tags: phpinfo,config,exposure,ruijie,vuln

http:
  - method: GET
    path:
      - "{{BaseURL}}/tool/view/phpinfo.view.php"

    matchers-condition: and
    matchers:
      - type: word
        words:
          - "PHP Version"
          - "PHP Extension"
        condition: and

      - type: status
        status:
          - 200
