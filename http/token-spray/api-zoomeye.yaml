id: api-zoomeye

info:
  name: ZoomEye API Token 可用性校验（token喷洒）
  author: 0ri2N
  severity: info
  description: |
    该模板通过调用 ZoomEye API 的已知接口验证提供的 token 是否有效，命中后通常表示可访问安全情报与资产查询能力。
  reference:
    - https://zoomeye.org
    - https://zoomeye.org/doc
  metadata:
    max-request: 1
  tags: recon,zoomeye,token-spray

self-contained: true

http:
  - method: GET
    path:
      - https://api.zoomeye.org/resources-info

    headers:
      API-KEY: "{{token}}"
    matchers:
      - type: word
        part: body
        words:
          - '"plan"'
          - '"stats"'
          - '"user_info"'
        condition: and
