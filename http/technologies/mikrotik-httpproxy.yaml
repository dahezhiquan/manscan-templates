id: mikrotik-httpproxy

info:
  name: MikroTik HTTP Proxy 指纹识别（指纹识别）
  author: its0x08,DhiyaneshDk
  severity: info
  description: >-
    MikroTik HTTP Proxy 是 RouterOS 的代理服务组件，用于网络代理、缓存和流量转发场景。该模板通过请求目标服务并检查预设路径或首页响应、HTTP
    响应头、页面正文关键字等指纹特征，判断目标是否使用或暴露了 MikroTik HTTP Proxy 相关组件；命中结果仅表示指纹特征匹配，可用于资产盘点、技术栈识别和后续安全评估，不代表已确认存在可利用漏洞。
  classification:
    cpe: cpe:2.3:h:mikrotik:rb3011uias-rm:*:*:*:*:*:*:*:*
  metadata:
    verified: true
    max-request: 1
    vendor: mikrotik
    product: rb3011uias-rm
    shodan-query: 'Server: mikrotik httpproxy'
  tags: tech,mikrotik,discovery
http:
  - method: GET
    path:
      - '{{BaseURL}}'

    matchers-condition: and
    matchers:
      - type: word
        part: header
        words:
          - 'Server: Mikrotik HttpProxy'
        case-insensitive: true
