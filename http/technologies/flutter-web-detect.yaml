id: flutter-web-detect

info:
  name: Flutter Web 指纹识别（指纹识别）
  author: incogbyte
  severity: info
  description: >-
    Flutter Web 是 Flutter 跨平台框架生成的 Web 应用形态，用于将 Dart 前端应用发布到浏览器环境。该模板通过请求目标服务并检查预设路径或首页响应、页面正文关键字等指纹特征，判断目标是否使用
    Flutter Web 构建；命中结果仅表示指纹特征匹配，可用于资产盘点、技术栈识别和后续安全评估，不代表已确认存在可利用漏洞。
  metadata:
    max-request: 1
    verified: true
    shodan-query: http.html:"flutter_bootstrap.js"
    fofa-query: body="flutter_bootstrap.js"
  tags: tech,detect,flutter,discovery
http:
  - method: GET
    path:
      - "{{BaseURL}}/flutter_service_worker.js"
      - "{{BaseURL}}/main.dart.js"
      - "{{BaseURL}}/flutter_bootstrap.js"

    stop-at-first-match: true
    matchers:
      - type: word
        part: body
        words:
          - "_flutter.loader.didCreateEngineInitializer"
          - "_flutter.buildConfig"
          - "flutter-app-manifest"
          - "flutter-temp-cache"
          - "flutter-app-cache"
          - "ext.flutter.disassemble"
          - "#flutterweb-theme"
        condition: or
