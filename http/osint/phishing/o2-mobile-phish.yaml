id: o2-mobile-phish

info:
  name: O2 Mobile 仿冒钓鱼网站（钓鱼网站识别）
  author: rxerium
  severity: high
  description: |
    O2 Mobile 是面向移动通信、宽带或运营商客户服务的品牌平台，通常涉及账号登录、账单、套餐、手机号和身份验证信息。该模板用于识别疑似仿冒 O2 Mobile 的钓鱼网站；模板访问目标站点首页，在目标页面返回 200 状态码，且页面内容命中 O2 Mobile 官方页面常见文案或标题特征（“O2 | Phone, SIM &amp; Tech Deals - See What You Can Do”），且当前主机不属于 o2.co.uk 等官方域名时触发。该类仿冒页面通常用于窃取组织账号、通讯账号、验证码、联系人或工作数据，可能造成账号接管、数据泄露和社交工程扩散。
  impact: |-
    - 用户可能在仿冒页面提交组织账号、通讯账号、验证码、联系人或工作数据，导致账号接管、内部资料泄露和进一步社交工程攻击。
    - 钓鱼站点可能被用于投递恶意链接、伪造登录流程或绕过用户对官方品牌的信任判断。
    - 品牌方或被仿冒组织可能面临客户投诉、欺诈交易、信誉受损以及后续应急处置成本。
  remediation: |-
    - 确认该站点是否为授权域名；若确认为仿冒站点，立即在网关、DNS、邮件安全和浏览器安全策略中阻断访问。
    - 向被仿冒品牌、托管商、注册商、CDN 和浏览器安全浏览服务提交滥用举报或下架请求。
    - 保留 URL、域名、解析记录、页面截图、证书和命中特征等证据，用于威胁情报关联和后续追踪。
    - 排查是否已有用户访问或提交信息；对疑似受影响账号执行密码重置、会话撤销、令牌轮换和多因素认证加固。
    - 审计受影响账号的登录历史、第三方授权、转发规则、工作区成员和消息发送记录，撤销异常会话。
  reference:
    - https://o2.co.uk
  metadata:
    max-request: 1
  tags: phishing,o2,osint,discovery
http:
  - method: GET
    path:
      - "{{BaseURL}}"

    host-redirects: true
    max-redirects: 2

    matchers-condition: and
    matchers:
      - type: word
        words:
          - 'O2 | Phone, SIM &amp; Tech Deals - See What You Can Do'

      - type: status
        status:
          - 200

      - type: dsl
        dsl:
          - '!contains(host,"o2.co.uk")'
