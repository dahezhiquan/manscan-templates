id: chatbot-rasa-detect

info:
  name: Rasa Open Source 指纹识别（指纹识别）
  author: rxerium
  severity: info
  description: |-
    Rasa Open Source 是开源对话式 AI 平台，用于构建聊天机器人、意图识别和对话流程。该模板请求 `/version`，并依据 HTTP 200 状态码、页面标题、正文关键字或品牌资源特征识别目标是否使用或暴露了 Rasa Open Source 相关组件，适用于资产盘点、技术栈识别和后续安全评估；命中结果仅表示指纹特征匹配，不代表已确认存在可利用漏洞。
  reference:
  - https://github.com/RasaHQ/rasa
  - https://rasa.com/docs/rasa/
  metadata:
    verified: true
    max-request: 1
    vendor: rasa
    product: rasa
    shodan-query: 'html:"Hello from Rasa"'
  tags: tech,rasa,ai,chatbot,detect,discovery

http:
  - method: GET
    path:
      - "{{BaseURL}}/version"

    matchers-condition: and
    matchers:
      - type: word
        part: body
        words:
          - '"minimum_compatible_version"'

      - type: status
        status:
          - 200

    extractors:
      - type: regex
        part: body
        group: 1
        regex:
          - '"version"\s*:\s*"([0-9a-zA-Z\.\-]+)"'
