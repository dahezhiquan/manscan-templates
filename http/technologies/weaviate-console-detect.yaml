id: weaviate-console-detect

info:
  name: Weaviate 控制台指纹识别（指纹识别）
  author: rxerium
  severity: info
  description: |
    用于识别目标暴露的 Weaviate 控制台，模板会结合页面标题和特定路径或已知端点判断是否存在对应技术或默认页面特征。
  reference:
    - https://weaviate.io/
    - https://github.com/weaviate/weaviate
  metadata:
    verified: true
    max-request: 1
    fofa-query: title="Weaviate Console"
    shodan-query: title:"Weaviate Console"
  tags: tech,weaviate,vector-database,ai,ml,database

http:
  - method: GET
    path:
      - "{{BaseURL}}"

    matchers:
      - type: dsl
        dsl:
          - 'status_code == 200'
          - 'contains_all(body, "<title>Weaviate Console", "webpackJsonpweaviate-console")'
        condition: and
