id: prisma-schema-exposure

info:
  name: 暴露 Prisma 数据库 Schema 暴露（暴露面识别）
  author: Umut ÖZEN
  severity: medium
  description: |
    检测到目标站点可直接访问 暴露 Prisma 数据库 Schema。这类配置或资源文件通常服务于应用部署、依赖管理、调试、运行参数或内部集成。该模板请求 `/schema.prisma`、`/prisma/schema.prisma`、`/src/prisma/schema.prisma` 等路径，并通过状态码、目录索引、文件头、数据库转储关键字或压缩包特征确认资源可被下载。备份文件一旦置于公开目录，可能暴露源码、数据库内容、配置、账号信息或历史凭据。
  impact: |-
    - 备份或转储文件可能包含源码、数据库记录、用户资料、配置和历史凭据，导致敏感数据直接外泄。
    - 攻击者可利用泄露的表结构、账号信息或业务数据复现系统逻辑，进一步发起凭据填充、权限提升或定向攻击。
    - 暴露文件通常可被搜索引擎或扫描器长期缓存，增加数据扩散和合规处置难度。
  remediation: |-
    - 确认该资源是否必须公网可访问；如非业务必需，应立即从 Web 根目录、静态资源目录、对象存储或反向代理公开路径中移除。
    - 在 Web 服务器、网关、CDN 或应用路由层增加拒绝规则、身份认证、IP allowlist 或内网访问限制。
    - 检查访问日志、下载记录和缓存记录，评估该资源是否已被外部访问或搜索引擎收录。
    - 若文件中包含凭据、令牌、连接串或私有地址，应执行密钥轮换、权限收敛和受影响系统访问审计。
  metadata:
    max-requests: 5
    verified: true
  tags: exposure,prisma,database,config,custom

http:
  - method: GET
    path:
      - "{{BaseURL}}/schema.prisma"
      - "{{BaseURL}}/prisma/schema.prisma"
      - "{{BaseURL}}/src/prisma/schema.prisma"
      - "{{BaseURL}}/db/schema.prisma"
      - "{{BaseURL}}/.prisma/schema.prisma"

    stop-at-first-match: true
    matchers-condition: and
    matchers:
      - type: word
        part: body
        words:
          - 'generator'
          - 'datasource '
          - 'provider ='
          - 'model '
        condition: and

      - type: status
        status:
          - 200

    extractors:
      - type: regex
        part: body
        name: db_provider
        regex:
          - 'provider\s*=\s*"([^"]+)"'

      - type: regex
        part: body
        name: db_url
        regex:
          - 'url\s*=\s*(env\([^)]+\)|"[^"]+")'
          - '(?i)postgre(sql|s)?:\/\/[^"\n]+'
          - '(?i)mysql:\/\/[^"\n]+'
          - '(?i)mongodb:\/\/[^"\n]+'
