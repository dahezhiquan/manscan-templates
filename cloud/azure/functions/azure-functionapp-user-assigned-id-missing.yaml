id: azure-functionapp-user-assigned-id-missing
info:
  name: Azure Functions 未配置用户分配托管身份（云安全）
  author: princechaddha
  severity: medium
  description: 用户分配托管身份可脱离单个函数应用独立管理，并供需要共享身份或跨资源迁移的 Azure Functions 使用。本模板查询 identity.type，并在返回 SystemAssigned 或空值时报告未按该基线配置用户分配托管身份。
  impact: |
    - 未配置用户分配身份时，依赖共享身份生命周期或跨应用权限复用的场景可能退回到长期密钥，增加凭据泄露和轮换风险。
    - 如果团队误以为已具备可复用的统一身份，可能导致部署失败，或临时授予过宽权限以绕过访问问题。
  remediation: |
    - 确需跨应用共享身份时，为函数应用绑定专用的用户分配托管身份，并只授予目标资源所需的最小权限。
    - 不需要共享身份时，可保留系统分配身份并记录基线例外，避免为满足检查而扩大身份复用范围。
  reference:
    - https://docs.microsoft.com/en-us/azure/app-service/overview-managed-identity
  metadata:
    vendor: microsoft
    product: azure-functions
  tags: cloud,devops,azure,microsoft,functionapp,azure-cloud-config

flow: |
  code(1);
  for (let AppData of iterate(template.functionApps)) {
    AppData = JSON.parse(AppData)
    set("name", AppData.name);
    set("resourceGroup", AppData.resourceGroup);
    code(2);
  }

self-contained: true
code:
  - engine:
      - sh
      - bash
    source: |
      az functionapp list --output json --query '[*].{name:name, resourceGroup:resourceGroup}'

    extractors:
      - type: json
        name: functionApps
        internal: true
        json:
          - '.[]'

  - engine:
      - sh
      - bash
    source: |
      az functionapp show --name $name --resource-group $resourceGroup --query 'identity.type' --output json

    matchers:
      - type: word
        words:
          - "SystemAssigned"
          - ""

    extractors:
      - type: dsl
        dsl:
          - 'name + " does not use user-assigned managed identity"'
