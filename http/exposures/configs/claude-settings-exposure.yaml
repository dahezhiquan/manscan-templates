id: claude-settings-exposure

info:
  name: Claude Code 项目设置暴露（暴露面识别）
  author: shadowhunter-92
  severity: medium
  description: |
    在 Web 服务器上检测到 Claude Code 项目配置文件（`.claude/settings.json` 或 `.claude/settings.local.json`）。该文件控制 Claude Code 的运行行为，包括权限规则（Bash 允许/拒绝列表、文件访问）、环境变量、在生命周期事件中执行 shell 命令的 hooks，以及 MCP 服务器配置。若该文件泄露，可能暴露敏感权限规则、环境变量（包括写入 `env` 块中的 API Key），并泄露项目内部自动化配置相关信息。
  reference:
    - https://docs.claude.com/en/docs/claude-code/settings
    - https://docs.claude.com/en/docs/claude-code/permissions
  classification:
    cvss-metrics: CVSS:3.1/AV:N/AC:L/PR:N/UI:N/S:U/C:H/I:N/A:N
    cvss-score: 7.5
    cwe-id: CWE-200,CWE-538
  metadata:
    verified: true
    max-request: 3
    shodan-query: http.html:"claude"
  tags: config,exposure,claude,claude-code,anthropic,ai

http:
  - method: GET
    path:
      - "{{BaseURL}}/.claude/settings.json"
      - "{{BaseURL}}/.claude/settings.local.json"
      - "{{BaseURL}}/.mcp.json"

    stop-at-first-match: false

    matchers-condition: and
    matchers:
      - type: dsl
        dsl:
          - 'contains_any(body, "\"permissions\"", "\"hooks\"", "\"env\"", "\"mcpServers\"", "\"additionalDirectories\"", "\"enableAllProjectMcpServers\"", "\"defaultMode\"")'

      - type: word
        part: content_type
        words:
          - "application/json"
          - "text/json"
          - "text/plain"
          - "application/octet-stream"
        condition: or

      - type: status
        status:
          - 200
