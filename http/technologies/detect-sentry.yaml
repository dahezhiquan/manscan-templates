id: detect-sentry

info:
  name: Sentry 实例 指纹识别（指纹识别）
  author: Sicksec,Shivam Kamboj
  severity: info
  description: Sentry 实例 是应用错误监控平台，用于收集异常、性能数据、版本事件和项目告警。该模板请求首页，并依据 HTTP 200 状态码、页面标题、正文关键字或品牌资源特征识别目标是否使用或暴露了 Sentry 实例 相关组件，适用于资产盘点、技术栈识别和后续安全评估；命中结果仅表示指纹特征匹配，不代表已确认存在可利用漏洞。
  reference:
  - https://hackerone.com/reports/374737
  - https://twitter.com/itsecurityguard/status/1127893545619218432?lang=en
  metadata:
    max-request: 1
    shodan-query: html:"Sentry.init"
  tags: ssrf,sentry,tech,discovery

http:
  - method: GET
    path:
      - "{{BaseURL}}"

    redirects: true

    matchers-condition: and
    matchers:
      - type: word
        part: body
        words:
          - "Sentry.init"
        case-insensitive: true

      - type: status
        status:
          - 200

    extractors:
      - type: regex
        part: body
        regex:
          - "https://[0-9a-f]*@[a-z0-9]+\\.[a-z.]+.?[0-9]+"
