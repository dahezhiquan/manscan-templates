id: emerson-intellislot-webcard

info:
  name: Emerson IntelliSlot Web Card 暴露（IOT）
  author: Th3l0newolf
  severity: medium
  description: |
    检测到 Emerson Network Power IntelliSlot Web Card 管理界面。该接口用于远程监控和管理 Emerson 电力设备，若缺少严格访问控制，可能暴露关键供电设备的状态信息或控制入口。
  reference:
    - https://www.vertiv.com
  metadata:
    verified: true
    max-request: 1
    shodan-query: 'http.title:"Emerson Network Power IntelliSlot Web Card"'
  tags: emerson,intellislot,iot,misconfig,exposure,discovery

http:
  - method: GET
    path:
      - "{{BaseURL}}"

    host-redirects: true
    max-redirects: 2

    matchers-condition: and
    matchers:
      - type: word
        part: body
        words:
          - "<title>Emerson Network Power IntelliSlot Web Card</title>"

      - type: status
        status:
          - 200
