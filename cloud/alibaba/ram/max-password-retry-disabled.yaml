id: max-password-retry-disabled

info:
  name: Maximum Password Retry Constraint 策略 -未启用（云安全）
  author: DhiyaneshDK
  severity: medium
  description: 该规则用于检查 阿里云 RAM 相关安全控制、保护能力或合规配置是否处于未启用、缺失或未正确配置状态，以降低持续暴露风险并提升整体云安全基线。
  reference:
    - https://www.alibabacloud.com/help/en/ram/user-guide/configure-a-password-policy-for-ram-users
  metadata:
    max-request: 1
    verified: true
  tags: cloud,devops,aliyun,alibaba,alibaba-cloud-config,alibaba-ram

variables:
  region: "cn-hangzhou"

self-contained: true

code:
  - engine:
      - sh
      - bash
    source: |
      aliyun ram GetPasswordPolicy --region $region

    matchers:
      - type: word
        name: policy
        words:
          - '"MaxLoginAttemps": 0'

    extractors:
      - type: dsl
        dsl:
          - '"Maximum Password Retry Constraint Policy is Disabled "'
