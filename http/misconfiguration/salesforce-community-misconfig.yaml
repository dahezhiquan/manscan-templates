id: salesforce-community-misconfig

info:
  name: Salesforce Community 配置不当
  author: domwhewell-sage
  severity: medium
  description: |
    该模板用于核查 Salesforce Community 配置不当。该类问题通常源于高危管理接口未授权开放、危险方法启用或可写接口暴露，攻击者可借助接口能力写入文件或触发命令执行。模板会向目标发送探测请求，并依据请求 `{{RootURL}}/s/`、`{{RootURL}}/s/sfsites/aura`、状态码 200、匹配 `\/s\/sfsites\/l\/([a-zA-Z0-9\-_~.%]+)\/[^\/]+\.js`、匹配 `recordTypeInfo`等证据确认目标是否存在该配置问题。
  impact: |
    - 攻击者可能上传文件、执行命令、提交任务或控制目标服务。
    - 成功利用后可导致主机沦陷、数据泄露、横向移动和业务中断。
  remediation: |
    - 立即为相关接口启用认证授权并限制可信来源访问。
    - 关闭不必要的危险 HTTP 方法、远程执行能力和可写管理接口。
    - 检查系统进程、上传目录和访问日志，清理异常文件并轮换凭据。
  reference:
    - https://www.varonis.com/blog/abusing-salesforce-communities
    - https://www.enumerated.ie/index/salesforce
  metadata:
    verified: true
    publicwww-query: sfsites
  tags: aura,unauth,salesforce,exposure,misconfig,vuln

variables:
  actions: '{"actions":[{"id":"{{randstr}}","descriptor":"serviceComponent://ui.force.components.controllers.lists.selectableListDataProvider.SelectableListDataProviderController/ACTION$getItems","callingDescriptor":"UNKNOWN","params":{"entityNameOrId":"ContentDocument","layoutType":"FULL","pageSize":20,"currentPage":0,"useTimeout":false,"getCount":true,"enableRowActions":false}}]}'

http:
  - method: GET
    path:
      - "{{RootURL}}/s/"
    redirects: true
    max-redirects: 1

    matchers:
      - type: status
        status:
          - 200
        internal: true

    extractors:
      - type: regex
        name: aura_context
        part: body
        group: 1
        regex:
          - '\/s\/sfsites\/l\/([a-zA-Z0-9\-_~.%]+)\/[^\/]+\.js'
        internal: true

  - method: POST
    path:
      - "{{RootURL}}/s/sfsites/aura"
    headers:
      Content-Type: application/x-www-form-urlencoded
    body: |
      message={{url_encode(actions)}}&aura.context={{aura_context}}&aura.token=null

    matchers:
      - type: word
        part: body
        words:
          - "recordTypeInfo"
