id: sap-message-server-detect

info:
  name: SAP Message 服务器 HTTP 指纹识别（指纹识别）
  author: LRVT,l4rm4nd
  severity: info
  description: |
    用于识别目标是否部署 SAP Message 服务器 HTTP 并提取相关版本或构建信息，模板会结合 HTTP 响应头、页面正文、特定路径或已知端点和版本或标识提取结果进行指纹匹配。
  metadata:
    max-request: 1
    shodan-query: http.html:SAP Message Server
  tags: sap,discovery,recon

http:
  - method: GET
    path:
      - "{{RootURL}}"

    matchers:
      - type: word
        part: header
        words:
          - "SAP Message Server"

    extractors:
      - type: regex
        part: header
        name: version
        group: 1
        regex:
          - "(?i)server:\\s*(SAP Message Server[^\\r\\n]*)"
