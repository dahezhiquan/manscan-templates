id: nintendo-phish

info:
  name: Nintendo 仿冒钓鱼网站（钓鱼网站识别）
  author: rxerium
  severity: info
  description: |
    检测到疑似仿冒 Nintendo 的钓鱼网站。模板在目标页面返回 200、页面内容命中 Nintendo 的品牌页面特征，且当前主机不属于 nintendo.com 官方域名时触发，用于识别借用 Nintendo 品牌页面诱导用户信任的仿冒站点。
  reference:
    - https://nintendo.com
  metadata:
    max-request: 1
  tags: phishing,nintendo,osint,discovery
http:
  - method: GET
    path:
      - "{{BaseURL}}"

    host-redirects: true
    max-redirects: 2

    matchers-condition: and
    matchers:
      - type: word
        words:
          - "Visit the official Nintendo site to shop for Nintendo Switch™ systems and video games, read the latest news, find fun gear and gifts with a Nintendo twist, and much more."

      - type: status
        status:
          - 200

      - type: dsl
        dsl:
          - '!contains(host,"nintendo.com")'
