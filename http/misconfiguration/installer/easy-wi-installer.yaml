id: easy-wi-installer

info:
  name: Easy WI 安装 Page 暴露
  author: DhiyaneshDK
  severity: high
  description: |
    检测到 Easy WI 安装 Page 暴露。该页面属于安装、初始化或配置向导流程，若对外暴露，攻击者可能完成初始化、创建管理员账户或重新配置目标系统。
  metadata:
    verified: true
    max-request: 1
    fofa-query: body="Easy-WI Installer"
  tags: misconfig,exposure,install,easy-wi,vuln

http:
  - method: GET
    path:
      - "{{BaseURL}}/install/install.php"

    matchers-condition: and
    matchers:
      - type: word
        part: body
        words:
          - "Welcome to the Easy-WI installer!"

      - type: status
        status:
          - 200
