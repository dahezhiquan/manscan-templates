id: dionaea-http-honeypot-detect

info:
  name: Dionaea HTTP蜜罐识别（蜜罐识别）
  author: UnaPibaGeek
  severity: info
  description: |
    该模板用于识别 Dionaea HTTP 蜜罐。它发送异常 HTTP 方法 `AAAA`，并通过 501 状态、伪装的 `nginx` 响应头和 XML 错误正文特征判断目标是否为 Dionaea 捕获环境。
  impact: |
    - 命中说明目标可能用于收集恶意请求和样本，继续探测行为可能被记录和分析。
    - 对防守方而言，该识别有助于资产分类和威胁诱捕节点监控。
  remediation: |
    - 授权部署的 Dionaea 蜜罐应与生产资产隔离，并纳入监控和日志留存。
    - 若该服务非预期出现，应确认主机来源、容器部署和端口映射配置。
    - 测试人员应避免向蜜罐发送真实凭据或敏感内部信息。
  metadata:
    max-request: 1
    vendor: dionaea
    product: http
    shodan-query: '"python/3.10 aiohttp/3.8.3" && bad status'
  tags: dionaea,honeypot,ir,cti,discovery

http:
  - raw:
      - |
        AAAA / HTTP/1.1
        Host: {{Hostname}}

    unsafe: true

    matchers-condition: and
    matchers:
      - type: status
        status:
          - 501

      - type: word
        part: header
        words:
          - "nginx"

      - type: word
        part: body
        words:
          - '<?xml version="1.0" encoding="ascii"?>'
