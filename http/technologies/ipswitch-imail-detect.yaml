id: ipswitch-imail-detect

info:
  name: Ipswitch IMail 指纹识别（指纹识别）
  author: Shivam Kamboj
  severity: info
  description: >-
    Ipswitch IMail Server 是邮件服务器产品，用于提供 SMTP、POP3、IMAP 和 Webmail 能力。该模板通过请求目标服务并检查预设路径或首页响应、HTTP
    响应头、正则特征、DSL 条件等指纹特征，判断目标是否使用或暴露了 Ipswitch IMail 相关组件；命中结果仅表示指纹特征匹配，可用于资产盘点、技术栈识别和后续安全评估，不代表已确认存在可利用漏洞。
  metadata:
    verified: true
    max-request: 1
    shodan-query: "Ipswitch-IMail"
  tags: tech,ipswitch,imail,detect,discovery
http:
  - method: GET
    path:
      - "{{BaseURL}}"

    matchers:
      - type: dsl
        dsl:
          - 'contains(header, "Ipswitch-IMail")'

    extractors:
      - type: regex
        name: imail_version
        part: header
        group: 1
        regex:
          - 'Ipswitch-IMail/([0-9.]+)'
