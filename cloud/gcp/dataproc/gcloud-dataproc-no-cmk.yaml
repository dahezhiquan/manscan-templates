id: gcloud-dataproc-no-cmk

info:
  name: Dataproc Cluster 未Using Customer-Managed Keys（云安全）
  author: princechaddha
  severity: high
  description: Dataproc 集群未使用 Customer-Managed Key 时，集群持久磁盘加密不受客户 KMS 密钥生命周期控制。本模板枚举 Dataproc 集群并检查 config.encryptionConfig.gcePdKmsKeyName，值为 null 时报告集群未使用 CMK。
  impact: |
    - 处理敏感数据的 Spark、Hadoop 或临时计算磁盘无法通过客户管理密钥执行轮换、禁用和审计。
    - 对受监管数据处理场景，未使用 CMK 可能不满足组织加密和密钥隔离要求。
  remediation: |
    - 为 Dataproc 集群配置 gcePdKmsKeyName，并确保 Dataproc 服务账号具备 Cloud KMS 密钥使用权限。
    - 对现有集群制定重建或迁移计划，将 CMK 配置纳入集群模板和自动化部署基线。
  reference:
    - https://www.trendmicro.com/cloudoneconformity/knowledge-base/gcp/Dataproc/enable-encryption-with-cmks-for-dataproc-clusters.html
    - https://cloud.google.com/dataproc/docs/concepts/configuring-clusters/customer-managed-encryption
  metadata:
    vendor: google
    product: dataproc
  tags: cloud,devops,gcp,gcloud,dataproc,security,encryption,cmk,gcp-cloud-config

flow: |
  code(1)
  for(let projectId of iterate(template.projectIds)){
    set("projectId", projectId)
    code(2)
    for(let cluster of iterate(template.clusters)){
      cluster = JSON.parse(cluster)
      set("clusterName", cluster.clusterName)
      set("region", cluster.region)
      code(3)
    }
  }

self-contained: true

code:
  - engine:
      - sh
      - bash
    source: |
      gcloud projects list --format="json(projectId)"

    extractors:
      - type: json
        name: projectIds
        internal: true
        json:
          - '.[].projectId'

  - engine:
      - sh
      - bash
    source: |
      gcloud dataproc clusters list --project $projectId --format="json"

    extractors:
      - type: json
        name: clusters
        internal: true
        json:
          - '.[]'

  - engine:
      - sh
      - bash
    source: |
      gcloud dataproc clusters describe $clusterName --region $region --project $projectId --format="json(config.encryptionConfig.gcePdKmsKeyName)"

    matchers:
      - type: word
        words:
          - "null"

    extractors:
      - type: dsl
        dsl:
          - '"Dataproc cluster " + clusterName + " in region " + region + " of project " + projectId + " is not encrypted with Customer-Managed Keys"'
