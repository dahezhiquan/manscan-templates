id: ibm-maximo-login

info:
  name: IBM Maximo 登录面板识别（指纹识别）
  author: ritikchaddha,righettod
  severity: info
  description: |-
    检测到目标站点存在 IBM Maximo 相关响应特征。IBM Maximo 是企业资产管理平台，用于维护资产、工单、库存、采购和设备生命周期。模板请求 `/maximo/webclient/login/login.jsp?appservauth=true`，并通过页面标题或正文关键字、状态码确认该系统指纹，用于资产识别、系统盘点和暴露面梳理。
  reference:
    - https://www.ibm.com/support/pages/what-default-username-and-password-websphere-application-server-community-edition-and-how-add-users-admin-group
    - https://www.ibm.com/products/maximo
  classification:
    cvss-metrics: CVSS:3.0/AV:N/AC:L/PR:N/UI:N/S:U/C:N/I:N/A:N
    cwe-id: CWE-200
    cpe: cpe:2.3:a:ibm:maximo_asset_management:*:*:*:*:*:*:*:*
  metadata:
    verified: true
    max-request: 1
    vendor: ibm
    product: maximo_asset_management
    shodan-query: http.favicon.hash:-399298961
    fofa-query: icon_hash=-399298961
  tags: maximo,panel,ibm,login,detect,discovery
http:
  - method: GET
    path:
      - "{{BaseURL}}/maximo/webclient/login/login.jsp?appservauth=true"

    host-redirects: true
    max-redirects: 2

    matchers-condition: and
    matchers:
      - type: word
        part: body
        words:
          - "maximo-icon.png"
          - "IBM"
        condition: and

      - type: status
        status:
          - 200

    extractors:
      - type: regex
        part: body
        group: 1
        regex:
          - '(?i)Copyright\s+IBM\s+Corp\.\s+([0-9-]+)'
