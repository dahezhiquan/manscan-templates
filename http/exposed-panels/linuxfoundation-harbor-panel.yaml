id: linuxfoundation-harbor-panel

info:
  name: Harbor 登录面板识别（指纹识别）
  author: daffainfo,righettod
  severity: info
  description: |-
    检测到目标站点存在 Harbor 相关响应特征。Harbor 是研发运维或制品管理平台，用于管理构建、代码、制品、任务、插件、凭据和执行记录。模板请求 `/api/v2.0/systeminfo`、`/api/systeminfo`、`/account/sign-in` 等路径，并通过页面标题或正文关键字、状态码、DSL 条件确认该系统指纹，用于资产识别、系统盘点和暴露面梳理。
  reference:
    - https://github.com/goharbor/harbor
  classification:
    cvss-metrics: CVSS:3.0/AV:N/AC:L/PR:N/UI:N/S:U/C:N/I:N/A:N
    cwe-id: CWE-200
    cpe: cpe:2.3:a:linuxfoundation:harbor:*:*:*:*:*:*:*:*
  metadata:
    verified: true
    max-request: 4
    vendor: linuxfoundation
    product: harbor
    shodan-query: http.favicon.hash:657337228
    fofa-query: icon_hash=657337228
  tags: panel,harbor,linuxfoundation,detect,login,discovery
http:
  - method: GET
    path:
      - '{{BaseURL}}/api/v2.0/systeminfo'
      - '{{BaseURL}}/api/systeminfo'
      - '{{BaseURL}}/account/sign-in'
      - '{{BaseURL}}/harbor/sign-in'

    stop-at-first-match: true
    matchers:
      - type: dsl
        dsl:
          - 'status_code == 200'
          - 'contains_any(to_lower(body), "<title>harbor</title>", "<harbor-app>", "harbor_version")'
        condition: and

    extractors:
      - type: regex
        part: body
        group: 1
        regex:
          - '(?i)"harbor_version":\s*"([a-z0-9.\-]+)"'
