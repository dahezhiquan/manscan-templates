id: vpn-tunnel-down
info:
  name: AWS VPN Tunnel Down（云安全）
  author: princechaddha
  severity: high
  description: 该规则用于检查 AWS VPC 相关资源是否满足推荐的云安全与合规配置要求，命中通常表示当前配置仍存在可改进的风险项。
  impact: |
    - 当前配置偏离推荐的云安全基线，可能增加攻击面、审计缺口或运维失误带来的风险。
    - 具体影响取决于受影响资源的重要性、暴露范围以及周边安全控制是否到位。
  remediation: |
    - 参考云厂商安全基线和官方文档修正当前配置偏差。
    - 建议结合资源标签、自动化检测与周期性审计，持续跟踪该类风险项的整改状态。
  reference:
    - https://docs.aws.amazon.com/vpn/latest/s2svpn/VPNConnections.html
  metadata:
    max-request: 2
  tags: cloud,devops,aws,amazon,vpn,aws-cloud-config
variables:
  region: "us-east-1"

flow: |
  code(1)
  for(let VpnConnectionIds of iterate(template.vpnconnactions)){
    set("vpnid", VpnConnectionIds)
    code(2)
  }

self-contained: true
code:
  - engine:
      - sh
      - bash
    source: |
      aws ec2 describe-vpn-connections --region $region --filters "Name=state,Values=available" --query 'VpnConnections[*].VpnConnectionId' --output json

    extractors:
      - type: json
        name: vpnconnactions
        internal: true
        json:
          - '.[]'

  - engine:
      - sh
      - bash
    source: |
         aws ec2 describe-vpn-connections --region $region --vpn-connection-ids $vpnid --query 'VpnConnections[*].VgwTelemetry[*].Status[]'

    matchers:
      - type: word
        words:
          - "DOWN"

    extractors:
      - type: dsl
        dsl:
          - 'vpnid + " VPN tunnel is down"'
