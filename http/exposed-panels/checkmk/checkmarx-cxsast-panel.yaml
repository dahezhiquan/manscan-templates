id: checkmarx-cxsast-panel

info:
  name: Checkmarx 登录面板识别（指纹识别）
  author: joanbonon,righettod
  severity: info
  description: |-
    检测到目标站点存在 Checkmarx 相关响应特征。Checkmarx 是监控、日志、分析或可观测性系统，用于展示运行指标、告警事件、日志数据和服务状态。模板请求 `/cxrestapi/help/system/version`、`/cxwebclient/Login.aspx`、`/cxrestapi/auth/identity/.well-known/openid-configuration` 路径，并通过页面标题或正文关键字、状态码、DSL 条件确认该系统指纹，用于资产识别、系统盘点和暴露面梳理。
  reference:
    - https://docs.checkmarx.com/en/34965-44074-checkmarx-sast.html
  classification:
    cvss-metrics: CVSS:3.0/AV:N/AC:L/PR:N/UI:N/S:U/C:N/I:N/A:N
    cwe-id: CWE-200
    cpe: cpe:2.3:a:checkmarx:cxsast:*:*:*:*:*:*:*:*
  metadata:
    max-request: 3
    verified: true
    vendor: checkmarx
    product: cxsast
    shodan-query: http.html:"CxSASTManagerUri"
  tags: panel,checkmarx,cxsast,detect,login,discovery
http:
  - method: GET
    path:
      - "{{BaseURL}}/cxrestapi/help/system/version"
      - "{{BaseURL}}/cxwebclient/Login.aspx"
      - "{{BaseURL}}/cxrestapi/auth/identity/.well-known/openid-configuration"

    stop-at-first-match: true
    matchers:
      - type: dsl
        dsl:
          - 'status_code == 200'
          - 'contains_any(to_lower(body), "cxsastmanageruri", "cxauthorityconfigurations", "/cxwebclient/webapp/", "sast_api", "sast_rest_api" , "sast-permissions", "hotfix")'
        condition: and

    extractors:
      - type: regex
        part: body
        group: 1
        regex:
          - '(?i)"version":\s*"([0-9.]+)"'
