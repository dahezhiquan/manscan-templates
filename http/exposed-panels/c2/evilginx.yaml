id: evilginx

info:
  name: EvilGinx 识别（指纹识别）
  author: pussycat0x
  severity: info
  description: |-
    检测到目标站点存在 EvilGinx 相关响应特征。Evilginx 是常被用于钓鱼演练或恶意钓鱼活动的反向代理框架，可代理登录流程并捕获会话相关信息。模板请求 `/login`，并通过页面标题或正文关键字、状态码、DSL 条件确认该基础设施指纹；命中结果主要用于威胁狩猎、恶意基础设施识别和外部暴露面梳理。
  reference:
    - https://dmcxblue.gitbook.io/red-team-notes-2-0/red-team-infrastructure/delivery/evilginx
  metadata:
    verified: "true"
    max-request: 1
    censys-query: b18d778b4e4b6bf1fd5b2d790c941270145a6a6d
  tags: tech,evilginx,c2,phishing,panel,vuln
http:
  - method: GET
    path:
      - "{{BaseURL}}/login"

    matchers-condition: and
    matchers:
      - type: dsl
        dsl:
          - "status_code == 200 && contains(body, 'Evilginx')"
          - "(\"b18d778b4e4b6bf1fd5b2d790c941270145a6a6d\" == sha1(body))"
        condition: and
