id: cloudfront-traffic-unencrypted

info:
  name: CloudFront 到源站流量未加密（云安全）
  author: DhiyaneshDK
  severity: medium
  description: CloudFront 到源站流量未加密是一类传输链路明文暴露风险，边缘节点与自定义源站之间的请求和响应可能通过 HTTP 传输。若链路中包含会话标识、鉴权头或敏感数据，可能被中间网络窃听或篡改。模板读取 `Origins.Items[*].CustomOriginConfig.OriginProtocolPolicy`，当值为 `http-only` 时判定回源链路未使用 HTTPS。
  impact: |
    - CloudFront 与源站之间的请求和响应可能被中间网络窃听或篡改。
    - 如果链路传输会话标识、鉴权头或个人数据，明文回源会显著增加数据泄露风险。
  remediation: |
    - 将源站协议策略调整为 `https-only`，或在确需兼容时使用 `match-viewer` 并强制 viewer 侧 HTTPS。
    - 为源站配置有效证书和安全 TLS 协议，验证 CloudFront 回源访问正常。
  reference:
    - https://www.trendmicro.com/cloudoneconformity-staging/knowledge-base/aws/CloudFront/cloudfront-traffic-to-origin-unencrypted.html
    - http://docs.aws.amazon.com/AmazonCloudFront/latest/DeveloperGuide/SecureConnections.html
  metadata:
    vendor: amazon
    product: cloudfront
  tags: cloud,devops,aws,amazon,cloudfront,aws-cloud-config

variables:
  region: "us-west-2"

flow: |
  code(1)
  for(let DistributionListItemsId of iterate(template.distributions)){
    set("distribution", DistributionListItemsId)
    code(2)
  }

self-contained: true

code:
  - engine:
      - sh
      - bash

    source: |
      aws cloudfront list-distributions --output table --query 'DistributionList.Items[*].Id' --region $region --output json

    extractors:
      - type: json
        name: distributions
        internal: true
        json:
          - '.[]'

  - engine:
      - sh
      - bash

    source: |
        aws cloudfront get-distribution --id $distribution --query 'Distribution.DistributionConfig.Origins.Items[*].CustomOriginConfig.OriginProtocolPolicy' --region $region --output json

    matchers:
      - type: word
        words:
          - '"http-only"'

    extractors:
      - type: dsl
        dsl:
          - '"CloudFront " + distribution + " uses HTTP Only"'
