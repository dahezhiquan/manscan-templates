id: zitadel-panel

info:
  name: ZITADEL 面板识别（指纹识别）
  author: ChrisJr404
  severity: info
  description: |
    该模板通过识别 ZITADEL 面板、控制台或管理界面的页面特征，判断目标是否暴露了对应服务入口。若命中，说明该后台或运维界面对外可访问，可用于资产识别与暴露面排查。
  reference:
    - https://github.com/zitadel/zitadel
    - https://zitadel.com/docs
  metadata:
    verified: true
    max-request: 1
    vendor: zitadel
    product: zitadel
    shodan-query: '"X-Zitadel"'
    fofa-query: title="ZITADEL"
  tags: panel,zitadel,iam,oidc,detect

http:
  - method: GET
    path:
      - "{{BaseURL}}/ui/console/"

    host-redirects: true
    max-redirects: 2

    matchers:
      - type: dsl
        dsl:
          - 'contains_all(body, "ZITADEL", "<cnsl-root>")'
          - 'status_code == 200'
        condition: and
