id: dbgate-anonymous-access

info:
  name: DbGate 匿名 访问 检测
  author: benharvey-sage
  severity: high
  description: |
    该模板用于核查 DbGate 匿名 访问相关配置。该类问题通常源于管理端、API、控制台或调试接口缺少认证授权，导致未登录用户可直接访问敏感功能。模板会向目标发送探测请求，并依据请求 `/auth/login`、匹配 `{"accessToken":"`、状态码 200 等证据确认目标是否存在该配置问题。
  impact: |
    - 攻击者可在未授权状态下查看系统状态、任务信息、配置数据或业务内容。
    - 若接口允许执行操作，可能进一步导致配置被修改、任务被触发、数据被导出或服务被接管。
  remediation: |
    - 为相关管理入口和 API 增加强认证、细粒度授权与访问审计。
    - 限制控制台、调试页和内部服务的公网访问，仅允许可信网络或堡垒机访问。
    - 排查访问日志，确认是否存在未授权访问、异常操作或批量枚举行为。
  reference:
    - https://github.com/dbgate/dbgate
    - https://dbgate.io/
    - https://docs.dbgate.io/
  classification:
    cwe-id: CWE-1188
  metadata:
    verified: true
    max-request: 1
    vendor: dbgate
    product: dbgate
    shodan-query:
      - http.title:"DbGate"
      - http.favicon.hash:-1320884137,1198579728,361029891,-1421367029,1377130137,-1258062033
  tags: misconfig,exposure,unauth,anonymous,dbgate

http:
  - raw:
      - |
        POST /auth/login HTTP/1.1
        Host: {{Hostname}}
        Content-Type: application/json

        {"amoid":"none"}

    matchers-condition: and
    matchers:
      - type: word
        part: body
        words:
          - '{"accessToken":"'

      - type: status
        status:
          - 200

    extractors:
      - type: json
        name: access_token
        part: body
        json:
          - '.accessToken'
