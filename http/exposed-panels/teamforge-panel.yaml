id: teamforge-panel

info:
  name: TeamForge Panel - 识别（暴露面识别）
  author: lstatro
  severity: info
  description: |
    该模板通过识别 TeamForge 登录入口的页面标题、特征文本或重定向行为，判断目标是否暴露了对应的认证界面。若命中，说明该登录面板对外可访问，可用于暴露面梳理与后续安全评估。
  reference:
    - https://digital.ai/products/teamforge/
  metadata:
    verified: true
    max-request: 1
    shodan-query: title:"TeamForge :"
    fofa-query: title="TeamForge :"
  tags: panel,teamforge,login,discovery

http:
  - method: GET
    path:
      - "{{BaseURL}}"

    redirects: true
    matchers-condition: and
    matchers:
      - type: word
        part: body
        words:
          - "<title>TeamForge :"
          - "Log In to TeamForge"
        condition: and

      - type: status
        status:
          - 200

    extractors:
      - type: regex
        name: version
        part: body
        regex:
          - "teamforge(\\d+)"
