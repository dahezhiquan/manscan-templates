id: frigate-api-exposure

info:
  name: Frigate NVR API 暴露（暴露面识别）
  author: 0x_Akoko
  severity: medium
  description: |
    检测到对外可访问的 Frigate NVR API。公开的接口文档、调试端点或管理 API 可能泄露路由结构、参数格式、鉴权方式和内部功能边界，从而帮助攻击者快速完成接口枚举与利用准备。
  reference:
    - https://frigate.video/
    - https://github.com/blakeblackshear/frigate
  metadata:
    verified: true
    max-request: 1
    shodan-query: http.title:"Frigate"
    fofa-query: title="Frigate"
  tags: frigate,nvr,iot,exposure,camera,config

http:
  - method: GET
    path:
      - "{{BaseURL}}/api/config"

    matchers:
      - type: dsl
        dsl:
          - 'status_code == 200'
          - 'contains(content_type, "application/json")'
          - 'contains_all(body, "\"cameras\"", "\"version\"", "\"detectors\"")'
          - 'contains_any(body, "\"mqtt\"", "\"frigate\"", "\"birdseye\"", "\"record\"")'
        condition: and
