id: s3-protection-disabled

info:
  name: GuardDuty S3 防护未启用（云安全）
  author: DhiyaneshDK
  severity: medium
  description: GuardDuty S3 Protection 用于分析 S3 数据事件和访问模式，发现异常访问、可疑枚举或潜在数据泄露活动；关闭后，S3 维度的托管威胁检测覆盖不足。该模板检查 DataSources.S3Logs.Status 是否为 DISABLED。
  impact: |
    - S3 bucket 中的异常读取、枚举或恶意访问行为可能无法及时形成 GuardDuty findings。
    - 对敏感对象存储的访问调查缺少数据事件层面的威胁检测线索。
  remediation: |
    - 为 GuardDuty detector 启用 S3 Protection，并确保关键区域和账号均纳入集中管理。
    - 结合 S3 Block Public Access、bucket policy 审计和 CloudTrail 数据事件日志，形成完整的存储安全监控。
  reference:
    - https://www.trendmicro.com/cloudoneconformity-staging/knowledge-base/aws/GuardDuty/enable-s3-protection.html
    - https://docs.aws.amazon.com/guardduty/latest/ug/s3-protection.html
  metadata:
    vendor: amazon
    product: guardduty
  tags: cloud,devops,aws,amazon,guardduty,aws-cloud-config
variables:
  region: "us-west-2"

flow: |
  code(1)
  for(let DetectorIds of iterate(template.detectors)){
    set("detector", DetectorIds)
    code(2)
  }

self-contained: true

code:
  - engine:
      - sh
      - bash
    source: |
      aws guardduty list-detectors --region $region --query 'DetectorIds' --output json

    extractors:
      - type: json
        name: detectors
        internal: true
        json:
          - '.[]'

  - engine:
      - sh
      - bash
    source: |
        aws guardduty get-detector --region $region --detector-id "$detector" --query 'DataSources.S3Logs.Status' --output json

    matchers:
      - type: word
        words:
          - "DISABLED"

    extractors:
      - type: dsl
        dsl:
          - '"GuardDuty S3 Protection " + detector + " is Disabled"'
