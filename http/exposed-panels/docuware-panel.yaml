id: docuware-panel

info:
  name: DocuWare 识别（指纹识别）
  author: righettod
  severity: info
  description: |
    该模板通过识别 DocuWare 面板、控制台或管理界面的页面特征，判断目标是否暴露了对应服务入口。若命中，说明该后台或运维界面对外可访问，可用于资产识别与暴露面排查。
  reference:
    - https://start.docuware.com/
  metadata:
    verified: true
    max-request: 1
    shodan-query: http.title:"Docuware"
  tags: panel,docuware,detect,login,discovery

http:
  - method: GET
    path:
      - "{{BaseURL}}/DocuWare/Identity/Account/Login"

    matchers:
      - type: dsl
        dsl:
          - 'status_code == 200'
          - 'contains_all(to_lower(body), "docuware</title>", "/docuware/identity/")'
        condition: and
