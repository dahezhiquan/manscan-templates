id: panos-management-panel

info:
  name: PAN-OS Management 面板识别（指纹识别）
  author: bhutch
  severity: info
  description: |
    该模板通过识别 PAN-OS Management 面板、控制台或管理界面的页面特征，判断目标是否暴露了对应服务入口。若命中，说明该后台或运维界面对外可访问，可用于资产识别与暴露面排查。
  reference:
    - https://security.paloaltonetworks.com/PAN-SA-2024-0015
  classification:
    cvss-metrics: CVSS:3.0/AV:N/AC:L/PR:N/UI:N/S:U/C:N/I:N/A:N
    cwe-id: CWE-200
  metadata:
    verified: true
    max-request: 1
    shodan-query: http.favicon.hash:873381299
  tags: panel,panos,login,detect,paloaltonetworks,discovery

http:
  - method: GET
    path:
      - "{{BaseURL}}/php/login.php"

    matchers-condition: and
    matchers:
      - type: word
        part: body
        words:
          - "<TITLE>Login</TITLE>"
          - 'PAN_FORM_CONTENT'
        condition: and

      - type: status
        status:
          - 200
