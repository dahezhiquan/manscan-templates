id: vmware-vcloud-director

info:
  name: VMware vCloud Director 面板识别（暴露面识别）
  author: DhiyaneshDK
  severity: info
  description: 该模板通过识别 VMware vCloud Director 面板、控制台或管理界面的页面特征，判断目标是否暴露了对应服务入口。若命中，说明该后台或运维界面对外可访问，可用于资产识别与暴露面排查。
  classification:
    cvss-metrics: CVSS:3.0/AV:N/AC:L/PR:N/UI:N/S:U/C:N/I:N/A:N
    cwe-id: CWE-200
    cpe: cpe:2.3:a:vmware:vcloud_director:*:*:*:*:*:*:*:*
  metadata:
    verified: true
    max-request: 1
    vendor: vmware
    product: vcloud_director
    shodan-query:
      - title:"VMware vCloud Director"
      - http.title:"vmware vcloud director"
    fofa-query: title="vmware vcloud director"
    google-query: intitle:"vmware vcloud director"
  tags: panel,vmware,vcloud,discovery

http:
  - method: GET
    path:
      - '{{BaseURL}}/cloud/'

    matchers-condition: and
    matchers:
      - type: word
        part: body
        words:
          - '<title>VMware vCloud Director</title>'

      - type: status
        status:
          - 200
