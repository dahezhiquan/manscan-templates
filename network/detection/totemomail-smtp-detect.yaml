id: totemomail-smtp-detect

info:
  name: Totemomail SMTP 服务 识别（服务漏洞）
  author: princechaddha,userdehghani
  severity: info
  description: |
    该模板通过网络响应特征识别目标是否开放 Totemomail SMTP Server 相关服务。
  metadata:
    max-request: 1
  tags: mail,smtp,network,totemomail,detect,detection,tcp,discovery

tcp:
  - inputs:
      - data: "\r\n"
    read-size: 2048

    host:
      - "{{Hostname}}"
    port: 25,465,587

    matchers:
      - type: word
        words:
          - "totemomail"
