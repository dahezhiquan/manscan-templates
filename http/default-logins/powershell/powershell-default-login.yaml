id: powershell-default-login

info:
  name: PowerShell Universal 默认口令登录（弱口令）
  author: ap3r
  severity: high
  description: |
    该模板通过尝试 PowerShell Universal 的默认管理员账号口令，并依据认证成功后的响应特征判断目标是否仍在使用未修改的弱口令。若命中，攻击者通常可直接获得后台管理权限，进一步访问敏感信息、修改配置或执行未授权操作。
  reference:
    - https://ironmansoftware.com/powershell-universal
  metadata:
    verified: true
    max-request: 3
    shodan-query: "html:\"PowerShell Universal\""
  tags: default-login,powershell-universal,vuln

http:
  - raw:
      - |
        POST /api/v1/signin HTTP/1.1
        Host: {{Hostname}}
        Content-Type: application/json

        {"username":"{{username}}","password":"{{password}}"}

    attack: clusterbomb
    payloads:
      username:
        - admin
      password:
        - admin
        - password
        - powershell

    host-redirects: true
    stop-at-first-match: true
    matchers-condition: and
    matchers:
      - type: status
        status:
          - 200

      - type: word
        part: header
        words:
          - 'Set-Cookie'

      - type: word
        part: body
        words:
          - '{"returnUrl":"/admin"}'

      - type: word
        part: body
        words:
          - '{"errorMessage":"Bad username or password"}'
        negative: true
