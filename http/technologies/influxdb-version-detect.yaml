id: influxdb-version-detect

info:
  name: InfluxDB 指纹识别（指纹识别）
  author: c-sh0
  severity: info
  description: >-
    InfluxDB 是时序数据库，用于存储指标、日志、IoT 和监控数据。该模板通过请求目标服务并检查预设路径或首页响应、页面正文关键字、HTTP 响应头等指纹特征，判断目标是否使用或暴露了
    InfluxDB 相关组件；命中结果仅表示指纹特征匹配，可用于资产盘点、技术栈识别和后续安全评估，不代表已确认存在可利用漏洞。
  reference:
  - https://docs.influxdata.com/influxdb/v1.8/tools/api/#ping-http-endpoint
  - https://github.com/influxdata/influxdb/blob/master/http/platform_handler.go#L62
  classification:
    cvss-metrics: CVSS:3.1/AV:N/AC:L/PR:N/UI:N/S:U/C:N/I:N/A:N
    cvss-score: 0
    cwe-id: CWE-200
    cpe: cpe:2.3:a:influxdata:influxdb:*:*:*:*:*:*:*:*
  metadata:
    verified: true
    max-request: 1
    shodan-query: "X-Influxdb-"
    product: influxdb
    vendor: influxdata
  tags: tech,influxdb,api,discovery
http:
  - method: GET
    path:
      - "{{BaseURL}}"

    matchers-condition: and
    matchers:
      - type: word
        part: header
        words:
          - 'X-Influxdb-'

    extractors:
      - type: kval
        kval:
          - "X_Influxdb_Version"
