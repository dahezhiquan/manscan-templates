id: linshare-panel

info:
  name: LinShare 登录面板识别（指纹识别）
  author: righettod
  severity: info
  description: |-
    检测到目标站点存在 LinShare 相关响应特征。LinShare 是监控、日志、分析或可观测性系统，用于展示运行指标、告警事件、日志数据和服务状态。模板请求 `/`、`/login`、`/new/login` 路径，并通过页面标题或正文关键字、状态码、DSL 条件确认该系统指纹，用于资产识别、系统盘点和暴露面梳理。
  reference:
    - https://www.linshare.org/
    - https://github.com/linagora/linshare
  metadata:
    verified: true
    max-request: 3
    shodan-query: http.title:"LinShare"
  tags: panel,linshare,login,detect,discovery
http:
  - method: GET
    path:
      - "{{BaseURL}}"
      - "{{BaseURL}}/login"
      - "{{BaseURL}}/new/login"

    stop-at-first-match: true
    host-redirects: true
    max-redirects: 2

    matchers:
      - type: dsl
        dsl:
          - 'status_code == 200'
          - 'contains_any(body, "<title>LinShare", "x-ng-app=\"linshareAdminApp")'
        condition: and
