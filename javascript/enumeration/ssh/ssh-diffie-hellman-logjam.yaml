id: ssh-diffie-hellman-logjam

info:
  name: SSH Diffie-Hellman 模数小于等于 1024 位（服务漏洞）
  author: pussycat0x
  severity: low
  description: |
    目标 SSH 服务支持 diffie-hellman-group1-sha1 等弱 Diffie-Hellman 密钥交换算法，可能暴露 Logjam 类降强度风险且不符合现代 SSH 加密基线。该模板枚举服务端算法列表，并在返回弱 DH 算法时确认命中。
  impact: |
    - 弱 Diffie-Hellman 组会降低 SSH 会话密钥协商强度，增加被降级或离线攻击的风险。
    - 在合适网络位置的攻击者可能利用弱组影响会话保密性。
  remediation: |
    - 禁用 diffie-hellman-group1-sha1 等弱 DH 密钥交换算法。
    - 配置符合组织基线的现代 KEX 算法，并重启 SSH 服务使配置生效。
  reference:
    - https://access.redhat.com/solutions/4278651
  metadata:
    verified: true
    max-request: 2
    shodan-query: product:"OpenSSH"
  tags: js,enum,ssh,misconfig,network,discovery

javascript:
  - pre-condition: |
      isPortOpen(Host,Port);
    code: |
      let m = require("nuclei/ssh");
      let c = m.SSHClient();
      let response = c.ConnectSSHInfoMode(Host, Port);
      Export(response);

    args:
      Host: "{{Host}}"
      Port: "22"

    matchers-condition: and
    matchers:
      - type: word
        words:
          - "kex_algorithms"

      - type: word
        words:
          - "diffie-hellman-group1-sha1"
