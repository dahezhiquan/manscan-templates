id: gcloud-gke-public-endpoint-enabled

info:
  name: GKE Clusters 使用Public Control Plane Endpoints（云安全）
  author: princechaddha
  severity: medium
  description: GKE 控制面公开端点开启时，Kubernetes API Server 可经公网访问，依赖授权网络和认证策略进行防护。本模板检查 privateClusterConfig.enablePrivateEndpoint，未启用私有端点且响应包含 endpoint 时报告控制面公网端点可用。
  impact: |
    - 控制面 API 暴露在公网后，更容易受到扫描、凭据攻击和配置失误影响。
    - 若授权网络、身份认证或 RBAC 配置不严，攻击者可能进一步访问或控制集群资源。
  remediation: |
    - 启用私有控制面端点或严格限制 master authorized networks，仅允许可信管理网络访问。
    - 强化 IAM、RBAC、审计日志和管理员访问流程，定期复核公网端点暴露必要性。
  reference:
    - https://cloud.google.com/kubernetes-engine/docs/how-to/private-clusters
    - https://www.trendmicro.com/cloudoneconformity/knowledge-base/gcp/GKE/clusters-with-private-endpoints.html
  metadata:
    vendor: google
    product: google-kubernetes-engine
  tags: cloud,devops,gcp,gcloud,gke,kubernetes,security,networking,gcp-cloud-config

flow: |
  code(1)
  for(let projectId of iterate(template.projectIds)){
    set("projectId", projectId)
    code(2)
    for(let cluster of iterate(template.clusters)){
      cluster = JSON.parse(cluster)
      set("clusterName", cluster.name)
      set("location", cluster.location)
      code(3)
    }
  }

self-contained: true

code:
  - engine:
      - sh
      - bash
    source: |
      gcloud projects list --format="json(projectId)"

    extractors:
      - type: json
        name: projectIds
        internal: true
        json:
          - '.[].projectId'

  - engine:
      - sh
      - bash
    source: |
      gcloud container clusters list --project $projectId --format="json(name,location)"

    extractors:
      - type: json
        name: clusters
        internal: true
        json:
          - '.[]'

  - engine:
      - sh
      - bash
    source: |
      gcloud container clusters describe $clusterName --location $location --project $projectId --format="json(privateClusterConfig.enablePrivateEndpoint)"

    matchers-condition: and
    matchers:
      - type: word
        words:
          - "endpoint"

      - type: word
        words:
          - "enablePrivateEndpoint"
        negative: true

    extractors:
      - type: dsl
        dsl:
          - '"GKE cluster " + clusterName + " in " + location + " of project " + projectId + " has public endpoint access enabled"'
