id: aws-opensearch-login

info:
  name: AWS OpenSearch 登录识别（暴露面识别）
  author: Higor Melgaço (eremit4)
  severity: info
  description: 该模板通过识别 AWS OpenSearch 登录入口的页面标题、特征文本或重定向行为，判断目标是否暴露了对应的认证界面。若命中，说明该登录面板对外可访问，可用于暴露面梳理与后续安全评估。
  reference:
    - https://aws.amazon.com/pt/blogs/opensource/introducing-opensearch/
  classification:
    cvss-metrics: CVSS:3.0/AV:N/AC:L/PR:N/UI:N/S:U/C:N/I:N/A:N
    cwe-id: CWE-200
    cpe: cpe:2.3:a:amazon:opensearch:*:*:*:*:maven:*:*:*
  metadata:
    max-request: 1
    vendor: amazon
    product: opensearch
  tags: panel,opensearch,aws,amazon,discovery

http:
  - method: GET
    path:
      - '{{BaseURL}}/_dashboards/app/login'

    matchers-condition: and
    matchers:
      - type: status
        status:
          - 200

      - type: word
        words:
          - "Please login to OpenSearch Dashboards"
