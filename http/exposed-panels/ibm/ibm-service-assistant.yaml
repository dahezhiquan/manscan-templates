id: ibm-service-assistant

info:
  name: IBM Service Assistant 登录面板识别（指纹识别）
  author: dhiyaneshDK,righettod
  severity: info
  description: 该模板通过识别 IBM Service Assistant 登录入口的页面标题、特征文本或重定向行为，判断目标是否暴露了对应的认证界面。若命中，说明该登录面板对外可访问，可用于暴露面梳理与后续安全评估。
  reference:
    - https://mediacenter.ibm.com/media/Using+the+IBM+Support+Assistant/0_ffe9o5w1
  classification:
    cvss-metrics: CVSS:3.0/AV:N/AC:L/PR:N/UI:N/S:U/C:N/I:N/A:N
    cwe-id: CWE-200
  metadata:
    max-request: 1
    shodan-query: http.title:"Welcome to Service Assistant"
  tags: panel,ibm,service,login,detect,discovery

http:
  - method: GET
    path:
      - '{{BaseURL}}/service/'

    matchers-condition: and
    matchers:
      - type: word
        words:
          - '<title>Welcome to Service Assistant</title>'

      - type: status
        status:
          - 200

    extractors:
      - type: regex
        part: body
        group: 1
        regex:
          - '(?i)([a-z0-9\s]+)\s+Service\s+Assistant\s+Tool'
          - '(?i)svcProductMtm\s+=\s+.?([0-9a-z\-]+).?'
