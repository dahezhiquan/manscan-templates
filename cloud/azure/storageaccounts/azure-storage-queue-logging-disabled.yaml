id: azure-storage-queue-logging-disabled
info:
  name: Azure Storage Queue 日志记录未启用（云安全）
  author: princechaddha
  severity: high
  description: Azure Storage Queue 日志可记录队列消息的读取、写入和删除请求；关闭这些操作的日志会削弱对消息滥用、批量清理和异常访问的审计能力。本模板枚举存储账户并执行 az storage logging show --services q，在 delete、read 和 write 均为 false 时报告 Queue 服务未启用操作日志。
  impact: |
    - 未授权读取、注入、删除或批量清空消息的行为可能无法及时发现，攻击者可借此干扰异步任务和业务流程。
    - 发生消息泄露、篡改或丢失后，缺少操作日志会削弱溯源、影响评估和事件响应能力。
  remediation: |
    - 根据审计和事件响应需求启用 Queue 服务的 read、write 和 delete 日志，并配置日志保留、访问控制和集中分析。
    - 将队列操作日志接入异常访问和批量删除告警，同时评估日志成本与敏感数据脱敏要求。
  reference:
    - https://docs.microsoft.com/en-us/azure/storage/queues/storage-queues-introduction
  metadata:
    vendor: microsoft
    product: azure-storage
  tags: cloud,devops,azure,microsoft,storage-queue,azure-cloud-config

flow: |
  code(1);
  for (let StorageAccount of iterate(template.storageAccounts)) {
    StorageAccount = JSON.parse(StorageAccount);
    set("name", StorageAccount.Name);
    code(2);
  }

self-contained: true
code:
  - engine:
      - sh
      - bash
    source: |
      az storage account list --query '[*].{"Name":name}'

    extractors:
      - type: json
        name: storageAccounts
        internal: true
        json:
          - '.[]'

  - engine:
      - sh
      - bash
    source: |
      az storage logging show --services q --account-name "$name" --output json

    matchers:
      - type: word
        words:
          - '"delete": false'
          - '"read": false'
          - '"write": false'
        condition: and

    extractors:
      - type: dsl
        dsl:
          - 'name + " does not have logging enabled for delete, read, or write actions."'
