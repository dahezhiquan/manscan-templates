id: fronsetiav-xss

info:
  name: Fronsetiav1.1 - 跨站脚本漏洞
  author: s4e-io
  severity: high
  description: |
    该模板用于检测 Fronsetiav1.1 - 跨站脚本漏洞。该类漏洞通常源于页面未对用户输入进行正确过滤或输出编码，导致脚本内容被浏览器执行。模板主要向 `/show_operations.jsp?Fronsetia_WSDL=%22%3E%3Cimg%2Bsrc%3Dx%20onerror%3Dalert(document.domain)%3E` 等路径发送探测请求，并根据状态码、响应头、页面关键字或时间差等证据确认漏洞是否存在。
  impact: |
    - 攻击者可诱导用户访问构造链接或页面，在受害者浏览器中执行脚本。
    - 成功利用后可能窃取会话信息、执行越权操作、篡改页面内容，或作为钓鱼和横向攻击链的一环。
  remediation: |
    - 对所有反射或存储到页面的用户输入进行上下文相关输出编码。
    - 对富文本、URL、HTML 属性等高风险输入使用白名单过滤，并启用合适的 Content-Security-Policy。
    - 升级受影响组件，检查是否存在被植入的恶意脚本或异常后台操作。
  reference:
    - https://seclists.org/fulldisclosure/2024/Nov/10
    - https://packetstormsecurity.com/files/182764/fronsetia-1.1-Cross-Site-Scripting.html
    - https://msecureltd.blogspot.com/2024/11/friday-fun-pentest-series-14-reflected.html
  classification:
    cwe-id: CWE-79,CWE-83
  metadata:
    max-request: 1
    vendor: fronsetiav1.1
    product: fronsetiav1.1
  tags: xss,fronsetia,vuln

http:
  - method: GET
    path:
      - "{{BaseURL}}/show_operations.jsp?Fronsetia_WSDL=%22%3E%3Cimg%2Bsrc%3Dx%20onerror%3Dalert(document.domain)%3E"

    matchers:
      - type: dsl
        dsl:
          - 'contains(body, "\"><img src=x onerror=alert(document.domain)> </title>")'
          - 'contains(content_type, "text/html")'
          - 'status_code == 200'
        condition: and
