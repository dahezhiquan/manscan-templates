id: default-apache2-ubuntu-page

info:
  name: Apache2 Ubuntu 默认页面 指纹识别（指纹识别）
  author: dhiyaneshDk
  severity: info
  description: Apache2 Ubuntu 默认页面是 Ubuntu 系统上 Apache HTTP Server 的安装确认页面，用于表明 Web 服务已部署并可响应请求。该模板请求首页，并依据页面标题、正文关键字或品牌资源特征识别目标是否使用或暴露了 Apache2 Ubuntu 默认页面 相关组件，适用于资产盘点、技术栈识别和后续安全评估；命中结果仅表示指纹特征匹配，不代表已确认存在可利用漏洞。
  metadata:
    max-request: 1
    shodan-query: http.title:"Apache2 Ubuntu Default Page"
  tags: tech,apache,discovery

http:
  - method: GET
    path:
      - '{{BaseURL}}'

    matchers:
      - type: word
        words:
          - "<title>Apache2 Ubuntu Default Page: It works</title>"
        part: body
