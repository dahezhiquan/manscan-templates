id: whatsup-gold-panel

info:
  name: Whatsup Gold 登录面板识别（指纹识别）
  author: rxerium
  severity: info
  description: |
    该模板通过识别 Whatsup Gold 登录入口的页面标题、特征文本或重定向行为，判断目标是否暴露了对应的认证界面。若命中，说明该登录面板对外可访问，可用于暴露面梳理与后续安全评估。
  reference:
    - https://www.whatsupgold.com/
  classification:
    cpe: cpe:2.3:a:progress:whatsup_gold:*:*:*:*:*:*:*:*
  metadata:
    verified: true
    max-request: 2
    vendor: progress
    product: whatsup_gold
    shodan-query: title:"WhatsUp Gold" http.favicon.hash:-2107233094
  tags: panel,whatsup-gold,detect,discovery

http:
  - method: GET
    path:
      - '{{BaseURL}}/NmConsole'
      - '{{BaseURL}}'

    host-redirects: true
    max-redirects: 2
    stop-at-first-match: true

    matchers-condition: and
    matchers:
      - type: word
        part: body
        words:
          - "<title>WhatsUp Gold</title>"

      - type: status
        status:
          - 200
