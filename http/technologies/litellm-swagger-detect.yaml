id: litellm-swagger-detect

info:
  name: LiteLLM Swagger UI 指纹识别（指纹识别）
  author: rxerium
  severity: info
  description: >-
    LiteLLM 是统一大模型 API 代理和网关，Swagger UI 用于展示和调试其 HTTP API。该模板通过请求目标服务并检查预设路径或首页响应、页面正文关键字、状态码等指纹特征，判断目标是否使用或暴露了
    LiteLLM Swagger UI 相关组件；命中结果仅表示指纹特征匹配，可用于资产盘点、技术栈识别和后续安全评估，不代表已确认存在可利用漏洞。
  reference:
  - https://github.com/BerriAI/litellm
  - https://docs.litellm.ai/
  metadata:
    verified: true
    max-request: 1
    shodan-query: http.title:"LiteLLM API - Swagger UI"
  tags: tech,litellm,swagger,api,ai,llm
http:
  - method: GET
    path:
      - "{{BaseURL}}"

    matchers-condition: and
    matchers:
      - type: word
        part: body
        words:
          - "<title>LiteLLM API - Swagger UI"

      - type: status
        status:
          - 200
