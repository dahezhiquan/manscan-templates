id: csp-script-src-wildcard

info:
  name: Content Security Policy "script src" Wildcard 检测ed
  author: pussycat0x
  severity: info
  description: |
    检测到 Content Security Policy "script src" Wildcard 检测ed。目标响应或文件中可能暴露配置、凭据、密钥、令牌、环境变量或历史记录等敏感信息，可能被用于进一步入侵。
  reference:
    - https://developer.mozilla.org/en-US/docs/Web/HTTP/Headers/Content-Security-Policy/script-src
  metadata:
    max-request: 1
    verified: true
  tags: csp,misconfig,headers

http:
  - method: GET
    path:
      - "{{BaseURL}}"

    matchers-condition: and
    matchers:

      - type: word
        part: header
        words:
          - "Content-Security-Policy"
        case-insensitive: true

      - type: regex
        part: header
        regex:
          - "(?i)script-src[^;]*\\*[^;]*(?:;|$)"
