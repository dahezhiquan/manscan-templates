id: gcloud-kms-public-access

info:
  name: 公开可访问 Google Cloud KMS Keys（云安全）
  author: princechaddha
  severity: high
  description: 该规则用于检查 GCP kms 相关资源是否存在公开暴露、未受限访问或匿名可访问等高风险配置，避免敏感数据、管理接口或网络服务直接暴露在公网。
  impact: |
    - 公开暴露的资源可能被未授权访问、枚举、下载或恶意利用。
    - 一旦涉及管理接口、对象存储或数据库服务，可能进一步导致数据泄露、权限滥用或业务中断。
  remediation: |
    - 收敛公网暴露面，仅允许受信任网络、IP 范围或必要身份访问相关资源。
    - 对对象存储、负载均衡、数据库或控制台接口启用更严格的访问控制与网络隔离策略。
  reference:
    - https://cloud.google.com/kms/docs/restricting-access
  tags: cloud,devops,gcp,gcloud,google-kms,gcp-cloud-config

flow: |
  code(1)
  for(let keyRing of iterate(template.keyRings)){
    set("keyRing", keyRing)
    code(2)
    for(let key of iterate(template.keys)){
      set("keyName", key)
      code(3)
    }
  }

self-contained: true

code:
  - engine:
      - sh
      - bash
    source: |
      gcloud kms keyrings list --location=global --format="json(name)"

    extractors:
      - type: json
        name: keyRings
        internal: true
        json:
          - '.[].name'

  - engine:
      - sh
      - bash
    source: |
      gcloud kms keys list --keyring=$keyRing --location=global --format="json(name)"

    extractors:
      - type: json
        name: keys
        internal: true
        json:
          - '.[].name'

  - engine:
      - sh
      - bash
    source: |
      gcloud kms keys get-iam-policy $keyName --keyring=$keyRing --location=global --format="json"

    matchers:
      - type: word
        words:
          - "allUsers"
          - "allAuthenticatedUsers"
        condition: or

    extractors:
      - type: dsl
        dsl:
          - '"Public Access found in KMS Key: " + keyName + ", KeyRing: " + keyRing + ", Location: Global"'
