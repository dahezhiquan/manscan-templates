id: laravel-nova-unauth

info:
  name: Laravel Nova 管理面板未授权访问
  author: moamenbasel
  severity: high
  description: |
    该模板用于核查 Laravel Nova 管理面板未授权访问。该类问题通常源于管理端、API、控制台或服务接口缺少认证授权，导致未登录用户可直接访问敏感功能。模板会向目标发送探测请求，并依据请求 `/nova/dashboards/main`、`/nova/resources`、匹配 `Nova.booting`、匹配 `nova-resources`、匹配 `nova-login`等证据确认目标是否存在该配置问题。
  impact: |
    - 攻击者可在未授权状态下查看系统状态、业务数据、任务信息或管理接口。
    - 若接口支持写操作，可能进一步导致配置篡改、服务接管、数据删除或横向移动。
  remediation: |
    - 为相关管理端和 API 启用认证授权，并按最小权限限制可访问功能。
    - 将管理接口限制在内网、VPN 或可信来源范围内，并开启访问审计。
    - 检查历史访问日志，确认是否存在未授权访问、批量枚举或异常操作。
  reference:
    - https://nova.laravel.com/docs/4.0/installation.html#authorizing-nova
  metadata:
    verified: true
    max-request: 2
    shodan-query: html:"nova-resources" html:"laravel"
  tags: laravel,nova,admin,unauth,exposure

http:
  - method: GET
    path:
      - "{{BaseURL}}/nova/dashboards/main"
      - "{{BaseURL}}/nova/resources"

    stop-at-first-match: true

    matchers-condition: and
    matchers:
      - type: word
        part: body
        words:
          - "Nova.booting"
          - "nova-resources"
        condition: or

      - type: word
        part: body
        words:
          - "nova-login"
          - "/nova/login"
        negative: true

      - type: status
        status:
          - 200
