id: couchdb-detect
info:
  name: CouchDB 指纹识别（指纹识别）
  author: pussycat0x
  severity: info
  description: |-
    CouchDB 是文档型 NoSQL 数据库，用于 JSON 文档存储、复制和 HTTP API 数据访问。该模板请求首页，并依据 HTTP 200 状态码、页面标题、正文关键字或品牌资源特征识别目标是否使用或暴露了 CouchDB 相关组件，适用于资产盘点、技术栈识别和后续安全评估；命中结果仅表示指纹特征匹配，不代表已确认存在可利用漏洞。
  metadata:
    verified: true
    max-request: 1
    shodan-query: html:""couchdb":"
  tags: couchdb,tech,detect,db,discovery

http:
  - method: GET
    path:
      - "{{BaseURL}}"

    matchers-condition: and
    matchers:
      - type: word
        part: body
        words:
          - '"couchdb":'
          - '"vendor":'
        condition: and

      - type: word
        part: content_type
        words:
          - 'application/json'

      - type: status
        status:
          - 200

    extractors:
      - type: regex
        part: body
        name: version
        group: 1
        regex:
          - '"version":"([0-9]+\.[0-9]+\.[0-9]+)"'
