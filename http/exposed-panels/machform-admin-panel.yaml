id: machform-admin-panel

info:
  name: MachForm Admin 面板识别（暴露面识别）
  author: ritikchaddha
  severity: info
  description: 该模板通过识别 MachForm Admin 面板、控制台或管理界面的页面特征，判断目标是否暴露了对应服务入口。若命中，说明该后台或运维界面对外可访问，可用于资产识别与暴露面排查。
  reference:
    - https://www.machform.com/
  classification:
    cvss-metrics: CVSS:3.0/AV:N/AC:L/PR:N/UI:N/S:U/C:N/I:N/A:N
    cwe-id: CWE-200
    cpe: cpe:2.3:a:machform:machform:*:*:*:*:*:*:*:*
  metadata:
    verified: true
    max-request: 1
    shodan-query: title:"MachForm Admin Panel"
    product: machform
    vendor: machform
  tags: panel,machform,admin,discovery

http:
  - method: GET
    path:
      - "{{BaseURL}}"

    host-redirects: true
    max-redirects: 2

    matchers-condition: and
    matchers:
      - type: word
        part: body
        words:
          - 'alt="MachForm"'
          - '<title>MachForm Admin Panel</title>'
        condition: or

      - type: status
        status:
          - 200
