id: pypirc-credentials-exposure

info:
  name: Python .pypirc 凭据泄露（暴露面识别）
  author: ChrisJr404
  severity: high
  description: |-
    检测到 Python .pypirc 配置文件被暴露。该文件存储了 twine 和 setuptools 等工具用于将软件包上传至 PyPI 或私有软件包索引的凭据，通常包含明文密码或上传 API 令牌。
  reference:
    - https://packaging.python.org/en/latest/specifications/pypirc/
    - https://twine.readthedocs.io/en/stable/
  classification:
    cvss-metrics: CVSS:3.1/AV:N/AC:L/PR:N/UI:N/S:U/C:H/I:N/A:N
    cvss-score: 7.5
    cwe-id: CWE-522
  metadata:
    verified: false
    max-request: 2
    google-query: intitle:"index of" ".pypirc"
  tags: exposure,config,pypi,python,credentials,files

http:
  - raw:
      - |
        GET /.pypirc HTTP/1.1
        Host: {{Hostname}}
      - |
        GET /.config/.pypirc HTTP/1.1
        Host: {{Hostname}}
      - |
        GET /.pypirc.bak HTTP/1.1
        Host: {{Hostname}}

    stop-at-first-match: true
    matchers-condition: and
    matchers:
      - type: word
        part: body
        words:
          - "[distutils]"
          - "[pypi]"
          - "[testpypi]"
        condition: or

      - type: word
        part: body
        words:
          - "password"
          - "username"
        condition: or

      - type: word
        part: body
        words:
          - "MongoDB over HTTP on the native"
          - "application/javascript"
          - "application/x-javascript"
          - "application/json"
          - "application/xml"
          - "text/xml"
          - "<html"
          - "<!doctype"
          - "<script"
          - "<meta"
          - "image/"
          - "Response xmlns"
        condition: or
        negative: true
