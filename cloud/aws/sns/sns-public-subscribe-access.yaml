id: sns-public-subscribe-access

info:
  name: SNS Topic Policy 允许公共订阅（云安全）
  author: Ritesh_Gohil(#L4stPL4Y3R)
  severity: high
  description: SNS topic policy 允许 Principal 为 * 且 Action 为 SNS:Subscribe 时，外部主体可能订阅主题并接收消息。该模板枚举 topics，读取 Attributes.Policy，并匹配无 Condition 限制的公共 Subscribe 授权。
  impact: |
    - 未授权订阅者可能接收业务通知、事件数据或系统告警，造成信息泄露。
    - 恶意订阅还可能扩大消息分发面，增加告警噪声和合规审计压力。
  remediation: |
    - 移除面向 * 的 SNS:Subscribe 授权，改为仅允许可信 AWS account、role 或受控协议端点订阅。
    - 为 topic policy 增加必要的 Condition 限制，并定期审计订阅列表和策略变更。
  reference:
    - https://docs.aws.amazon.com/sns/latest/api/API_GetTopicAttributes.html
  metadata:
    vendor: amazon
    product: sns
  tags: cloud,devops,aws,amazon,sns,aws-cloud-config

flow: |
  code(1)
  for (let topicArn of iterate(template.topics)) {
    set("topicArn", topicArn)
    code(2)
  }

self-contained: true
code:
  - engine:
      - sh
      - bash
    source: |
      aws sns list-topics --query 'Topics[*].TopicArn'

    extractors:
      - type: json
        internal: true
        name: topics
        json:
          - '.[]'

  - engine:
      - sh
      - bash
    source: |
      aws sns get-topic-attributes --topic-arn $topicArn --query Attributes.Policy --output text

    matchers-condition: and
    matchers:
      - type: word
        part: body
        words:
          - '"Effect":"Allow"'

      - type: word
        part: body
        words:
          - '"Principal":{"AWS":"*"}'

      - type: word
        part: body
        words:
          - '"Action":"SNS:Subscribe"'

      - type: regex
        part: body
        negative: true
        regex:
          - '"Condition"'

    extractors:
      - type: dsl
        dsl:
          - '"The SNS topic " + topicArn + " allows public subscription via Policy"'
