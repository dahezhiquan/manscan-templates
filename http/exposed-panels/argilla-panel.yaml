id: argilla-panel

info:
  name: Argilla 面板识别（指纹识别）
  author: rxerium
  severity: info
  description: |-
    检测到目标站点存在 Argilla 相关响应特征。Argilla 是 AI、LLM 或机器学习相关平台，用于管理模型、数据集、工作区、代理任务或可观测性信息。模板请求 `/`，并通过页面标题或正文关键字、状态码确认该系统指纹，用于资产识别、系统盘点和暴露面梳理。
  reference:
    - https://github.com/argilla-io/argilla
    - https://argilla.io
  metadata:
    verified: true
    max-request: 1
    vendor: Argilla
    product: Argilla
    shodan-query: 'http.title:"Argilla"'
  tags: panel,argilla,llm,ai,data-labelling,detect,discovery
http:
  - method: GET
    path:
      - "{{BaseURL}}"

    host-redirects: true
    max-redirects: 2

    matchers-condition: and
    matchers:
      - type: word
        part: body
        words:
          - "<title>Argilla</title>"

      - type: word
        part: body
        words:
          - "argilla.io"
          - "__NUXT__"
        condition: or

      - type: status
        status:
          - 200
