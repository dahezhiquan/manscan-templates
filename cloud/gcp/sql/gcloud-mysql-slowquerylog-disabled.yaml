id: gcloud-mysql-slowquerylog-disabled

info:
  name: MySQL 数据库服务器慢查询日志未启用（云安全）
  author: princechaddha
  severity: medium
  description: MySQL slow_query_log 可记录执行耗时较长的查询，帮助发现异常访问、低效查询和潜在滥用行为。本模板检查 Cloud SQL MySQL 实例 settings.databaseFlags，并在输出中匹配 off 时报告慢查询日志未启用。
  impact: |
    - 慢查询、异常扫描或高成本查询缺少日志证据，数据库性能问题和可疑访问更难定位。
    - 安全和运维团队无法基于慢查询日志建立容量优化、异常检测和审计分析。
  remediation: |
    - 为 Cloud SQL MySQL 实例启用 slow_query_log，并按业务特征配置 long_query_time 等相关参数。
    - 将慢查询日志纳入集中日志分析，定期复核异常查询来源和性能影响。
  reference:
    - https://cloud.google.com/sql/docs/mysql/flags
  metadata:
    vendor: google
    product: cloud-sql
  tags: cloud,devops,gcp,gcloud,google-cloud-sql,gcp-cloud-config

flow: |
  code(1)
  for(let projectId of iterate(template.projectIds)){
    set("projectId", projectId)
    code(2)
    for(let sqlInstance of iterate(template.sqlInstances)){
      set("sqlInstance", sqlInstance)
      code(3)
    }
  }

self-contained: true

code:
  - engine:
      - sh
      - bash
    source: |
      gcloud projects list --format="json(projectId)"

    extractors:
      - type: json
        name: projectIds
        internal: true
        json:
          - '.[].projectId'

  - engine:
      - sh
      - bash
    source: |
      gcloud sql instances list --project $projectId --filter='DATABASE_VERSION:MYSQL*' --format="json(name)"

    extractors:
      - type: json
        name: sqlInstances
        internal: true
        json:
          - '.[].name'

  - engine:
      - sh
      - bash
    source: |
      gcloud sql instances describe $sqlInstance --format="json(settings.databaseFlags)"

    matchers:
      - type: word
        words:
          - '"off"'

    extractors:
      - type: dsl
        dsl:
          - '"The slow_query_log flag is disabled for MySQL instance " + sqlInstance + " in project: " + projectId'
