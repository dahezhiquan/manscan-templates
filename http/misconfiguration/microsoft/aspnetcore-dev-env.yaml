id: aspnetcore-dev-env

info:
  name: ASP.NET Core Development 环境 暴露
  author: Mys7ic
  severity: info
  description: |
    检测到 ASP.NET Core Development 环境 暴露。目标暴露了调试、错误或堆栈信息，可能泄露应用路径、框架版本、环境变量、源码位置或内部调用细节。
  impact: |
    - 攻击者可能利用暴露信息进行资产测绘、权限探测或后续攻击。
    - 若目标接口缺少访问控制，可能进一步造成敏感数据泄露或系统被滥用。
  remediation: |
    - 限制该端点的公网访问，仅允许可信来源访问。
    - 启用认证、授权和审计，并根据业务需要关闭不必要的调试或管理功能。
  reference:
    - https://docs.microsoft.com/en-us/aspnet/core/fundamentals/environments
  metadata:
    max-request: 1
    vendor: microsoft
    product: asp.net-core
    shodan-query: html:"ASPNETCORE_ENVIRONMENT"
    verified: true
  tags: misconfig,aspnetcore,exposure,vuln

http:
  - method: GET
    path:
      - "{{BaseURL}}/Error"

    matchers-condition: or
    matchers:
      - type: word
        part: body
        words:
          - "<strong>ASPNETCORE_ENVIRONMENT</strong> environment variable to <strong>Development</strong>"

      - type: word
        part: body
        words:
          - "ASPNETCORE_ENVIRONMENT"
          - "<environment include=\"Development\">"
        condition: and
