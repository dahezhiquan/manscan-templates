id: unauthorized-puppet-node-manager

info:
  name: Puppet Node Manager 未授权 访问
  author: pussycat0x
  severity: medium
  description: |
    检测到 Puppet Node Manager 未授权 访问。目标功能在未认证状态下可访问，可能暴露管理入口、业务数据、系统状态或可执行操作，需确认是否存在访问控制缺失。
  metadata:
    max-request: 1
    fofa-query: 'app="puppet-Node-Manager"'
  tags: node,misconfig,vuln

http:
  - method: GET
    path:
      - "{{BaseURL}}"

    matchers-condition: and
    matchers:
      - type: word
        words:
          - '<a href="/nodes">Nodes</a>'

      - type: status
        status:
          - 200
