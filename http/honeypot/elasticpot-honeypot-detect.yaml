id: elasticpot-honeypot-detect

info:
  name: ElasticPot蜜罐识别（蜜罐识别）
  author: UnaPibaGeek
  severity: info
  description: |
    系统检测到 ElasticPot (Elasticsearch 模拟) 蜜罐。
    该蜜罐在响应对 "_cluster/settings" 的请求时其返回特征与真实的 Elasticsearch 安装有明显差异，以此表明该服务可能是一个极具欺骗性的陷阱/蜜罐设置。
  metadata:
    max-request: 1
    vendor: elasticpot
    product: elasticsearch
    fofa-query: "index_not_found_exception"
  tags: elasticpot,elasticsearch,honeypot,ir,cti,discovery

http:
  - method: GET
    path:
      - "{{BaseURL}}/_cluster/settings"

    matchers:
      - type: word
        part: body
        words:
          - 'index_not_found_exception'
