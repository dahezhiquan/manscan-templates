id: hashicorp-boundary-detect

info:
  name: HashiCorp Boundary 指纹识别（指纹识别）
  author: codexlynx
  severity: info
  description: >-
    HashiCorp Boundary 是身份感知的远程访问管理平台，用于按身份和策略控制对基础设施资源的访问。该模板通过请求目标服务并检查预设路径或首页响应、页面正文关键字等指纹特征，判断目标是否使用或暴露了
    HashiCorp Boundary 相关组件；命中结果仅表示指纹特征匹配，可用于资产盘点、技术栈识别和后续安全评估，不代表已确认存在可利用漏洞。
  metadata:
    max-request: 1
  tags: tech,hashicorp,discovery
http:
  - method: GET
    path:
      - "{{BaseURL}}"

    matchers:
      - type: word
        part: body
        words:
          - 'HashiCorp Boundary'
