id: brickcom-camera-unauth-snapshot

info:
  name: Brickcom Camera 未授权 Snapshot 访问
  author: 0xr2r
  severity: high
  description: |
    检测到 Brickcom Camera 未授权 Snapshot 访问。目标功能在未认证状态下可访问，可能暴露管理入口、业务数据、系统状态或可执行操作，需确认是否存在访问控制缺失。
  reference:
    - https://cxsecurity.com/issue/WLB-2026020031
  metadata:
    verified: true
    max-request: 2
    shodan-query: 'realm="Brickcom"'
  tags: iot,camera,default-login,exposure,unauth

http:
  - method: GET
    path:
      - "{{BaseURL}}/ONVIF/media.cgi?action=getSnapshot"
      - "{{BaseURL}}/ONVIF/media.cgi?action=getSnapshot&channel=1"

    stop-at-first-match: true
    matchers-condition: and
    matchers:
      - type: status
        status:
          - 200

      - type: word
        part: header
        words:
          - "image/jpeg"
