id: gcloud-sql-auto-storage-disabled

info:
  name: Google Cloud SQL 实例自动扩容未启用（云安全）
  author: princechaddha
  severity: high
  description: Cloud SQL 自动存储扩容可在磁盘接近容量上限时自动增加存储，避免写满导致数据库不可用。本模板枚举 Cloud SQL 实例并检查 settings.storageAutoResize，值为 False 时报告自动扩容未启用。
  impact: |
    - 数据库磁盘写满后可能导致写入失败、实例不可用或恢复时间延长。
    - 攻击、批量导入或日志激增等突发写入会更容易触发业务中断。
  remediation: |
    - 为关键 Cloud SQL 实例启用 automatic storage increase，并结合容量告警提前处理增长趋势。
    - 定期复核磁盘使用率、增长速度和成本影响，避免容量耗尽造成服务中断。
  reference:
    - https://cloud.google.com/sql/docs/overview#automatic-storage-increase
  metadata:
    vendor: google
    product: cloud-sql
  tags: cloud,devops,gcp,gcloud,google-cloud-sql,gcp-cloud-config

flow: |
  code(1)
  for(let projectId of iterate(template.projectIds)){
    set("projectId", projectId)
    code(2)
    for(let sqlInstance of iterate(template.sqlInstances)){
      set("sqlInstance", sqlInstance)
      code(3)
    }
  }

self-contained: true

code:
  - engine:
      - sh
      - bash
    source: |
      gcloud projects list --format="json(projectId)"

    extractors:
      - type: json
        name: projectIds
        internal: true
        json:
          - '.[].projectId'

  - engine:
      - sh
      - bash
    source: |
      gcloud sql instances list --project $projectId --format="json(name)"

    extractors:
      - type: json
        name: sqlInstances
        internal: true
        json:
          - '.[].name'

  - engine:
      - sh
      - bash
    source: |
      gcloud sql instances describe $sqlInstance --format="value(settings.storageAutoResize)"

    matchers:
      - type: word
        words:
          - 'False'
        condition: or

    extractors:
      - type: dsl
        dsl:
          - '"Automatic Storage Increase is disabled for SQL instance " + sqlInstance + " in project " + projectId'
