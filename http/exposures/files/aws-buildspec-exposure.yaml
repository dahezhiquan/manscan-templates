id: aws-buildspec-exposure

info:
  name: AWS CodeBuild Build Spec 暴露（暴露面识别）
  author: theamanrawat
  severity: low
  description: |
    检测到对外可访问的 AWS CodeBuild Build Spec。相关文件可能泄露项目结构、依赖关系、部署细节、敏感参数或其他不应公开的内部信息。
  reference:
    - https://docs.aws.amazon.com/codebuild/latest/userguide/build-spec-ref.html
  metadata:
    verified: true
    max-request: 2
  tags: aws,codebuild,exposure,config,devops

http:
  - method: GET
    path:
      - "{{BaseURL}}/buildspec.yml"
      - "{{BaseURL}}/buildspec.yaml"

    stop-at-first-match: true
    matchers-condition: and
    matchers:
      - type: word
        part: body
        words:
          - "version:"
          - "phases:"
          - "build:"
          - "commands:"
        condition: and

      - type: word
        part: header
        words:
          - "text/yaml"
          - "text/plain"
          - "application/x-yaml"
        condition: or
      - type: status
        status:
          - 200
