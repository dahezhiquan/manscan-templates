id: ibm-spectrum-detect

info:
  name: IBM Spectrum 指纹识别（指纹识别）
  author: righettod
  severity: info
  description: >-
    IBM Spectrum 是 IBM 存储与数据管理产品线，用于企业级存储、备份和资源管理。该模板通过请求目标服务并检查预设路径或首页响应、页面正文关键字、正则特征、DSL
    条件等指纹特征，判断目标是否使用或暴露了 IBM Spectrum 相关组件；命中结果仅表示指纹特征匹配，可用于资产盘点、技术栈识别和后续安全评估，不代表已确认存在可利用漏洞。
  reference:
  - https://www.ibm.com/docs/en/products?filter=spectrum
  metadata:
    max-request: 1
    verified: true
    shodan-query: http.title:"IBM Spectrum"
  tags: tech,ibm,spectrum,discovery
http:
  - method: GET
    path:
      - "{{BaseURL}}/"
      - "{{BaseURL}}/BACLIENT"
      - "{{BaseURL}}/JNLP"

    stop-at-first-match: true
    matchers:
      - type: dsl
        dsl:
          - 'status_code == 200'
          - 'contains_all(to_lower(body), "ibm spectrum", "com.ibm.")'
        condition: and

    extractors:
      - type: regex
        part: body
        group: 1
        regex:
          - '(?i)"guiVersion"\s*:\s*"([0-9.\-]+)"'
          - '(?i)name="?version"?\s+value="?([0-9.\-]+)"?'
