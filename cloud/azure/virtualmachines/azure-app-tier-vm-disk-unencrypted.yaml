id: azure-app-tier-vm-disk-unencrypted
info:
  name: Azure App-Tier VM Disk 加密未启用（云安全）
  author: princechaddha
  severity: high
  description: Azure 虚拟机磁盘承载应用层数据、临时文件和凭据；未启用磁盘加密时，获得磁盘介质、快照或备份访问权的主体可能在虚拟机关闭后直接读取数据。本模板筛选 app_tier_tag 为约定值的虚拟机，执行 az vm encryption show，并在输出包含 Disk is not encrypted 时报告。
  impact: |
    - 应用数据、连接字符串、日志和本地密钥可能在磁盘或快照泄露后被离线恢复，造成数据泄露和凭据接管。
    - 未加密的应用层磁盘可能不满足静态数据保护要求，并扩大备份、迁移和退役介质处置风险。
  remediation: |
    - 为应用层虚拟机启用 Azure Disk Encryption 或服务器端加密，按数据敏感度配置平台托管或客户管理密钥。
    - 在变更前确认备份、扩缩容和恢复流程兼容加密配置，并持续监控磁盘、快照和备份的加密状态。
  reference:
    - https://docs.microsoft.com/en-us/azure/security/fundamentals/encryption-atrest
  metadata:
    vendor: microsoft
    product: azure-virtual-machines
  tags: cloud,devops,azure,microsoft,vm-disk,azure-cloud-config

flow: |
  code(1);
  for (let vmData of iterate(template.vmList)) {
    set("ids", vmData);
    code(2);
  }

self-contained: true
code:
  - engine:
      - sh
      - bash
    source: |
      az vm list --query '[?(tags==`{"app_tier_tag":"app_tier_tag_value"}`)].{"id":id}'

    extractors:
      - type: json
        name: vmList
        internal: true
        json:
          - '.[]'

  - engine:
      - sh
      - bash
    source: |
      az vm encryption show --ids "$ids" --query 'disks'

    matchers-condition: and
    matchers:
      - type: word
        words:
          - 'Disk is not encrypted'

    extractors:
      - type: dsl
        dsl:
          - 'ids + " disk volume is not encrypted"'
