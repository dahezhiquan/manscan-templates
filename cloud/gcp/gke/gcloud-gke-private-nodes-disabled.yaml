id: gcloud-gke-private-nodes-disabled

info:
  name: GKE 集群未启用私有节点（云安全）
  author: princechaddha
  severity: medium
  description: GKE 未启用私有节点时，节点可能拥有外部可达路径，扩大集群工作负载的网络暴露面。本模板枚举集群并检查 networkConfig.defaultEnablePrivateNodes，值为 false 时报告集群未启用私有节点。
  impact: |
    - 节点网络暴露面更大，可能增加被扫描、误配置访问或绕过集中入口控制的风险。
    - 工作负载出入站路径更难统一通过私有网络和受控网关治理。
  remediation: |
    - 为新集群启用 private nodes，并通过 NAT、Private Google Access 或私有连接满足必要出站访问。
    - 对既有集群评估迁移方案，收敛节点公网入口和防火墙规则。
  reference:
    - https://cloud.google.com/kubernetes-engine/docs/how-to/private-clusters
    - https://www.trendmicro.com/cloudoneconformity/knowledge-base/gcp/GKE/enable-private-nodes.html
  metadata:
    vendor: google
    product: google-kubernetes-engine
  tags: cloud,devops,gcp,gcloud,gke,kubernetes,security,networking,gcp-cloud-config

flow: |
  code(1)
  for(let projectId of iterate(template.projectIds)){
    set("projectId", projectId)
    code(2)
    for(let cluster of iterate(template.clusters)){
      cluster = JSON.parse(cluster)
      set("clusterName", cluster.name)
      set("location", cluster.location)
      code(3)
    }
  }

self-contained: true

code:
  - engine:
      - sh
      - bash
    source: |
      gcloud projects list --format="json(projectId)"

    extractors:
      - type: json
        name: projectIds
        internal: true
        json:
          - '.[].projectId'

  - engine:
      - sh
      - bash
    source: |
      gcloud container clusters list --project $projectId --format="json(name,location)"

    extractors:
      - type: json
        name: clusters
        internal: true
        json:
          - '.[]'

  - engine:
      - sh
      - bash
    source: |
      gcloud container clusters describe $clusterName --location $location --project $projectId --format="json(networkConfig.defaultEnablePrivateNodes)"

    matchers:
      - type: word
        words:
          - '"defaultEnablePrivateNodes": false'

    extractors:
      - type: dsl
        dsl:
          - '"GKE cluster " + clusterName + " in " + location + " of project " + projectId + " does not have private nodes enabled"'
