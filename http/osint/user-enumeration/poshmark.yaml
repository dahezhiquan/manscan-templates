id: poshmark

info:
  name: Poshmark 用户名信息枚举（OSINT）
  author: dwisiswant0
  severity: info
  description: |
    对 Poshmark 的用户名进行 OSINT 枚举检查。模板请求公开路径 https://poshmark.com/closet/用户名，当响应状态为 200 且页面或响应内容命中 “is using Poshmark to sell it...” 等用户资料页特征时，判定目标用户名可能存在。
  classification:
    cvss-metrics: CVSS:3.1/AV:N/AC:L/PR:N/UI:N/S:U/C:N/I:N/A:N
    cvss-score: 0
    cwe-id: CWE-200
  metadata:
    max-request: 1
  tags: osint,osint-shopping,poshmark,discovery

self-contained: true

http:
  - method: GET
    path:
      - "https://poshmark.com/closet/{{user}}"

    matchers-condition: and
    matchers:
      - type: status
        status:
          - 200

      - type: word
        part: body
        words:
          - " is using Poshmark to sell items from their closet."
