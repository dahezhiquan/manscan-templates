id: librespeed-panel

info:
  name: LibreSpeed 面板识别（指纹识别）
  author: ritikchaddha
  severity: info
  description: |
    该模板通过识别 LibreSpeed 面板、控制台或管理界面的页面特征，判断目标是否暴露了对应服务入口。若命中，说明该后台或运维界面对外可访问，可用于资产识别与暴露面排查。
  reference:
    - https://github.com/librespeed/speedtest
  metadata:
    verified: true
    max-request: 1
    shodan-query: title:"LibreSpeed"
  tags: panel,librespeed,detect,discovery

http:
  - method: GET
    path:
      - "{{BaseURL}}"

    matchers-condition: and
    matchers:
      - type: word
        part: body
        words:
          - 'LibreSpeed'
          - 'Ping'
          - 'Jitter'
        condition: and
        case-insensitive: true

      - type: status
        status:
          - 200
