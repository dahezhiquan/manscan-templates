id: file-limit-ssh-users-access

info:
  name: SSH 用户访问未限制（本地文件安全扫描）
  author: pussycat0x
  severity: medium
  description: |
    SSH `AllowUsers` 可明确限制允许远程登录的账户。未配置该项时，默认行为可能允许更多本地账户参与认证，扩大远程攻击面。本模板检查标准配置中是否缺少 `AllowUsers`，不判断 `AllowGroups`、系统账户 shell、Include 文件和 Match 块。
  impact: |
    - 服务账户、临时账户或低权限本地账户可能被用于口令攻击和主机横向移动。
    - 登录范围不清晰会增加离职账户、共享账户和凭据泄露后的处置难度。
  remediation: |
    - 使用 `AllowUsers` 或 `AllowGroups` 仅放行必要的管理主体，先测试运维和应急登录路径。
    - 禁用不需要登录的系统账户，配合密钥/MFA、来源 ACL 和集中审计控制认证活动。
  reference:
    - https://vishalraj82.medium.com/hardening-openssh-security-37f5d634015f
    - https://cloud.ibm.com/docs/ssh-keys?topic=ssh-keys-granting-ssh-access-to-a-user
  metadata:
    verified: true
  tags: audit,config,file,ssh

file:
  - extensions:
      - all

    matchers-condition: and
    matchers:
      - type: word
        words:
          - "# This is the sshd server system-wide configuration file"

      - type: word
        words:
          - "AllowUsers"
        negative: true
