id: windows-autorun-enabled

info:
  name: Windows AutoRun 已启用（本地基线扫描）
  author: princechaddha
  severity: medium
  description: |
    该模板检查可移动介质 AutoRun 是否启用。插入设备时自动运行内容可能触发恶意代码。
  impact: |
    攻击者可利用 U 盘等介质自动执行恶意程序。
  remediation: |
    禁用 AutoRun，尤其是所有可移动驱动器。
  tags: windows,autorun,code,windows-audit

self-contained: true

code:
  - pre-condition: |
      IsWindows();
    engine:
      - powershell.exe
    args:
      - -ExecutionPolicy
      - Bypass
    pattern: "*.ps1"
    source: |
      if ((Get-ItemProperty -Path 'HKLM:\SOFTWARE\Microsoft\Windows\CurrentVersion\Policies\Explorer' -Name 'NoDriveTypeAutoRun' -ErrorAction SilentlyContinue).NoDriveTypeAutoRun -ne '0xFF') { Write-Output 'AutoRun is enabled'; }

    matchers:
      - type: word
        words:
          - "AutoRun is enabled"
