id: wp-install

info:
  name: WordPress 安装入口暴露
  author: princechaddha,0xpugal
  severity: critical
  description: |
    该模板用于核查 WordPress 安装入口暴露。该类问题通常源于安装、初始化、升级或配置向导在部署完成后仍可从公网访问。模板会向目标发送探测请求，并依据请求 `/wp-admin/install.php?step=1`、匹配 `<title>WordPress &rsaquo; Installation</title>`、匹配 `Site Title`、状态码 200 等证据确认目标是否存在该配置问题。
  impact: |
    - 攻击者可能完成初始化流程、创建管理员账户、覆盖配置或触发升级逻辑。
    - 在部分系统中，暴露安装入口还可能导致数据库连接信息泄露、站点被重新配置或业务被接管。
  remediation: |
    - 完成部署后立即删除、禁用或限制安装与升级入口。
    - 对初始化流程增加来源限制和一次性安装校验，避免公网直接访问。
    - 检查系统是否已被异常初始化或创建未知管理员账户，并轮换相关凭据。
  reference:
    - https://smaranchand.com.np/2020/04/misconfigured-wordpress-takeover-to-remote-code-execution/
    - https://x.com/0xPugal/status/1610315762392268802
  classification:
    cvss-metrics: CVSS:3.1/AV:N/AC:L/PR:N/UI:N/S:U/C:L/I:H/A:H
    cvss-score: 9.4
    cwe-id: CWE-284
  metadata:
    max-request: 1
  tags: misconfig,panel,wordpress,vuln

http:
  - method: GET
    path:
      - "{{BaseURL}}/wp-admin/install.php?step=1"

    matchers-condition: and
    matchers:
      - type: word
        words:
          - "<title>WordPress &rsaquo; Installation</title>"
          - "Site Title"
        condition: and

      - type: status
        status:
          - 200
