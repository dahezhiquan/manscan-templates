id: sql-server-dump

info:
  name: SQL Server 转储文件泄露（暴露面识别）
  author: userdehghani
  severity: medium
  description: |
    检测到目标站点可直接访问 SQL Server 转储文件。备份、转储或历史文件通常用于恢复系统和数据，内容可能比线上页面包含更多源码、配置和业务数据。该模板请求 `{{paths}}`，并通过状态码、目录索引、文件头、数据库转储关键字或压缩包特征确认资源可被下载。备份文件一旦置于公开目录，可能暴露源码、数据库内容、配置、账号信息或历史凭据。
  impact: |-
    - 备份或转储文件可能包含源码、数据库记录、用户资料、配置和历史凭据，导致敏感数据直接外泄。
    - 攻击者可利用泄露的表结构、账号信息或业务数据复现系统逻辑，进一步发起凭据填充、权限提升或定向攻击。
    - 暴露文件通常可被搜索引擎或扫描器长期缓存，增加数据扩散和合规处置难度。
  remediation: |-
    - 将备份、转储、压缩包和历史文件迁移到非 Web 可访问位置，并使用专用备份系统或私有对象存储保存。
    - 在 Web 服务器和 CDN 层阻断常见备份扩展名、数据库转储文件和目录列表访问。
    - 轮换可能出现在备份中的数据库、后台、云服务和第三方 API 凭据。
    - 清理搜索引擎、对象存储公开 ACL、CDN 缓存和历史发布包中的泄露副本。
  classification:
    cvss-metrics: CVSS:3.0/AV:N/AC:L/PR:N/UI:N/S:U/C:L/I:N/A:N
    cvss-score: 5.3
    cwe-id: CWE-200
  metadata:
    max-request: 21
  tags: exposure,backup,mssql,vuln

http:
  - method: GET
    path:
      - "{{BaseURL}}{{paths}}"

    payloads:
      paths:
        - "/sa.bak"
        - "/wwwroot.bak"
        - "/backup.bak"
        - "/database.bak"
        - "/data.bak"
        - "/db_backup.bak"
        - "/dbdump.bak"
        - "/db.bak"
        - "/dump.bak"
        - "/{{Hostname}}.bak"
        - "/{{Hostname}}_db.bak"
        - "/localhost.bak"
        - "/mysqldump.bak"
        - "/mysql.bak"
        - "/site.bak"
        - "/sql.bak"
        - "/temp.bak"
        - "/translate.bak"
        - "/users.bak"
        - "/www.bak"
        - "/wp-content/uploads/dump.bak"
        - "/wp-content/mysql.bak"

    headers:
      Range: "bytes=0-500"
    max-size: 500 # Size in bytes - Max Size to read from server response

    matchers-condition: and
    matchers:
      - type: binary
        part: body
        binary:
          - "54415045" # Microsoft Tape Format

      - type: status
        status:
          - 200
