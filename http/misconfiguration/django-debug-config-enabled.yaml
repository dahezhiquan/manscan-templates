id: django-debug-config-enabled

info:
  name: Django 调试 配置 启用
  author: dhiyaneshDK,hackergautam
  severity: medium
  description: |
    检测到 Django 调试 配置 启用。目标暴露了调试、错误或堆栈信息，可能泄露应用路径、框架版本、环境变量、源码位置或内部调用细节。
  metadata:
    max-request: 1
  tags: django,debug,misconfig,vuln

http:
  - method: GET
    path:
      - "{{BaseURL}}/NON_EXISTING_PATH/"

    matchers-condition: and
    matchers:
      - type: word
        words:
          - URLconf defined
          - Page not found
          - Django tried these URL patterns, in this order
        condition: and

      - type: status
        status:
          - 404
