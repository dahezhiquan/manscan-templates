id: gcloud-run-services-user-labels-missing

info:
  name: 缺失 User-Defined Labels 中的Cloud Run Services（云安全）
  author: princechaddha
  severity: low
  description: Cloud Run 服务缺少用户自定义标签会影响资产归属、成本分摊、策略筛选和安全运营。本模板枚举 Cloud Run services 并检查 metadata.labels，若仅发现系统标签 cloud.googleapis.com 而缺少业务标签，则报告服务未配置用户标签。
  impact: |
    - 安全团队难以按业务、环境、负责人或数据等级筛选服务，影响漏洞响应和暴露面治理。
    - 成本、合规和生命周期管理缺少标签依据，容易出现无人维护的服务长期运行。
  remediation: |
    - 为 Cloud Run 服务添加组织要求的用户自定义标签，例如 owner、env、app、data-classification。
    - 在部署流水线中强制标签校验，并定期扫描缺失或不符合规范的服务。
  reference:
    - https://cloud.google.com/run/docs/configuring/labels
  metadata:
    vendor: google
    product: cloud-run
  tags: cloud,devops,gcp,gcloud,google-cloud-run,gcp-cloud-config

flow: |
  code(1)
  for(let projectId of iterate(template.projectIds)){
    set("projectId", projectId)
    code(2)
    for(let serviceDetail of iterate(template.services)){
      set("serviceName", serviceDetail.metadata.name)
      set("serviceLocation", serviceDetail.metadata.labels['cloud.googleapis.com/location'])
      code(3)
    }
  }

self-contained: true

code:
  - engine:
      - sh
      - bash
    source: |
      gcloud projects list --format="json(projectId)"

    extractors:
      - type: json
        name: projectIds
        internal: true
        json:
          - '.[].projectId'

  - engine:
      - sh
      - bash
    source: |
      gcloud run services list --project $projectId --format="json(metadata.name, metadata.labels)"

    extractors:
      - type: json
        name: services
        internal: true
        json:
          - '.[].metadata'

  - engine:
      - sh
      - bash
    source: |
      gcloud run services describe $serviceName --region=$serviceLocation --format="json(metadata.labels)"

    matchers:
      - type: word
        words:
          - 'cloud.googleapis.com'

    extractors:
      - type: dsl
        dsl:
          - '"Service " + serviceName + " in Location " + serviceLocation + " of Project " + projectId + " does not have user-defined labels for resource management."'
