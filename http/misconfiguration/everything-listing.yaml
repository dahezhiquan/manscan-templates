id: everything-listing

info:
  name: Everything 服务器 暴露
  author: pussycat0x
  severity: high
  description: |
    该模板用于核查 Everything 服务器 暴露。该类问题通常源于 Web 目录索引、仓库列表、对象列表或文件浏览功能未关闭，导致未授权用户可枚举文件和目录。模板会向目标发送探测请求，并依据请求 ``、匹配 `<title>Everything</title>`、匹配 `indexof`、状态码 200等证据确认目标是否存在该配置问题。
  impact: |
    - 攻击者可浏览目录结构、源代码、备份、日志、构建产物或对象存储资源。
    - 暴露的文件名和内容可能泄露业务结构、凭据线索或可进一步利用的敏感数据。
  remediation: |
    - 关闭目录索引、公开列表和未授权文件浏览功能。
    - 为需要下载的资源配置显式访问控制，避免把备份、源码和日志放入 Web 可访问路径。
    - 检查已暴露目录中的敏感文件并轮换可能泄露的凭据或令牌。
  reference:
    - https://www.voidtools.com/
  classification:
    cpe: cpe:2.3:a:voidtools:everything:*:*:*:*:*:*:*:*
  metadata:
    verified: 'true'
    max-request: 1
    vendor: voidtools
    product: everything
    shodan-query: http.favicon.hash:-977323269
  tags: exposure,everything,listing,voidtools,misconfig,vuln

http:
  - method: GET
    path:
      - "{{BaseURL}}"

    matchers-condition: and
    matchers:
      - type: word
        words:
          - "<title>Everything</title>"
          - "indexof"
        condition: and

      - type: status
        status:
          - 200
