id: bedita-panel

info:
  name: BEdita 登录面板识别（暴露面识别）
  author: pikpikcu,daffainfo
  severity: info
  description: 该模板通过识别 BEdita 登录入口的页面标题、特征文本或重定向行为，判断目标是否暴露了对应的认证界面。若命中，说明该登录面板对外可访问，可用于暴露面梳理与后续安全评估。
  reference:
    - https://www.bedita.com/
  classification:
    cvss-metrics: CVSS:3.0/AV:N/AC:L/PR:N/UI:N/S:U/C:N/I:N/A:N
    cwe-id: CWE-200
    cpe: cpe:2.3:a:bedita:bedita:*:*:*:*:*:*:*:*
  metadata:
    max-request: 1
    vendor: bedita
    product: bedita
    shodan-query:
      - http.title:"BEdita"
      - http.title:"bedita"
    fofa-query: title="bedita"
    google-query: intitle:"bedita"
  tags: panel,bedita,discovery

http:
  - method: GET
    path:
      - "{{BaseURL}}"

    matchers-condition: and
    matchers:
      - type: regex
        part: body
        regex:
          - 'BEdita(.*)</a><br>'

      - type: status
        status:
          - 200

    extractors:
      - type: regex
        part: body
        group: 1
        regex:
          - 'target="besite">(.*)</a><br>'
