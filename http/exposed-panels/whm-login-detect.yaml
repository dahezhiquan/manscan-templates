id: whm-login-detect

info:
  name: WHM 登录面板识别（暴露面识别）
  author: pussycat0x
  severity: info
  description: 该模板通过识别 WHM 登录入口的页面标题、特征文本或重定向行为，判断目标是否暴露了对应的认证界面。若命中，说明该登录面板对外可访问，可用于暴露面梳理与后续安全评估。
  reference:
    - https://www.exploit-db.com/ghdb/7128
  classification:
    cvss-metrics: CVSS:3.0/AV:N/AC:L/PR:N/UI:N/S:U/C:N/I:N/A:N
    cwe-id: CWE-200
    cpe: cpe:2.3:a:cpanel:whm:*:*:*:*:*:*:*:*
  metadata:
    max-request: 1
    vendor: cpanel
    product: whm
  tags: edb,whm,panel,login,cpanel,discovery

http:
  - method: GET
    path:
      - "{{BaseURL}}/"

    matchers-condition: and
    matchers:
      - type: word
        words:
          - "<title>WHM Login</title>"

      - type: status
        status:
          - 200
