id: nginx-auto-installer

info:
  name: NginX Auto 安装向导 暴露
  author: pussycat0x
  severity: low
  description: |
    检测到 NginX Auto 安装向导 暴露。该页面属于安装、初始化或配置向导流程，若对外暴露，攻击者可能完成初始化、创建管理员账户或重新配置目标系统。
  metadata:
    verified: true
    max-request: 1
    shodan-query: title:"NginX Auto Installer"
  tags: misconfig,nginx,install,exposure,vuln

http:
  - method: GET
    path:
      - '{{BaseURL}}'

    matchers-condition: and
    matchers:
      - type: word
        part: body
        words:
          - 'NginX Auto Installer'

      - type: status
        status:
          - 200
