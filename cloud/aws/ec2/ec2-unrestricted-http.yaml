id: ec2-unrestricted-http
info:
  name: EC2 安全组对公网开放 HTTP 端口（云安全）
  author: princechaddha
  severity: critical
  description: EC2 安全组对公网开放 HTTP 端口是一类未加密 Web 服务暴露风险，端口 80 面向任意来源会允许客户端通过明文访问实例服务。若该端口承载管理页面、内部接口或未强制跳转 HTTPS，可能造成凭据、会话或业务数据暴露。模板通过 `describe-security-groups` 筛选 80 端口且来源为 `0.0.0.0/0` 的入站规则，并输出命中的安全组 ID。
  impact: |
    - 明文 HTTP 流量可能泄露 Cookie、令牌、查询参数或页面内容。
    - 暴露的 Web 服务可能被扫描和利用，成为攻击者进入实例或后端网络的入口。
  remediation: |
    - 若业务不需要公网 HTTP，移除面向 `0.0.0.0/0` 的 80 端口规则。
    - 对公网 Web 流量使用负载均衡、WAF 和 HTTPS，并确保 HTTP 仅用于跳转且不承载敏感操作。
  reference:
    - https://docs.aws.amazon.com/AWSEC2/latest/UserGuide/ec2-security-groups.html
  metadata:
    vendor: amazon
    product: ec2
  tags: cloud,devops,aws,amazon,ec2,aws-cloud-config

variables:
  region: "us-east-1"

self-contained: true
code:
  - engine:
      - sh
      - bash
    source: |
      aws ec2 describe-security-groups --region $region --filters Name=ip-permission.from-port,Values=80 Name=ip-permission.to-port,Values=80 Name=ip-permission.cidr,Values='0.0.0.0/0' --query 'SecurityGroups[*].GroupId' --output json

    extractors:
      - type: json
        name: securitygroup
        internal: true
        json:
          - '.[]'

      - type: dsl
        dsl:
          - 'securitygroup + " security group(s) alows unrestricted access (0.0.0.0/0 or ::/0) on TCP port 80"'
