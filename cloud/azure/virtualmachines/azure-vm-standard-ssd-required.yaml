id: azure-vm-standard-ssd-required
info:
  name: Azure VM Premium SSD 未Required（云安全）
  author: princechaddha
  severity: high
  description: Azure Premium SSD 提供更高的 IOPS、吞吐和可预测性能，适合关键业务虚拟机；本模板枚举 VM，查询操作系统盘和数据盘的 managedDisk.storageAccountType，并在结果包含 Premium_LRS 时报告未满足模板设定的 Premium SSD 检查条件。
  impact: |
    - 磁盘性能不足可能造成数据库延迟、应用超时和批处理积压，进一步影响业务可用性。
    - 在高峰期通过临时扩容或未规划的迁移补救，可能增加变更风险和数据恢复压力。
  remediation: |
    - 结合磁盘 IOPS、吞吐、延迟和业务等级评估是否需要 Premium SSD，确认 VM 大小支持目标磁盘类型后迁移或更换磁盘。
    - 变更前验证快照、备份、加密、缓存和高可用配置，避免仅按模板命中结果盲目升级存储规格。
  reference:
    - https://docs.microsoft.com/en-us/azure/virtual-machines/disks-types
  metadata:
    vendor: microsoft
    product: azure-virtual-machines
  tags: cloud,devops,azure,microsoft,virtual-machine,azure-cloud-config

flow: |
  code(1);
  for (let VMData of iterate(template.vmList)) {
    VMData = JSON.parse(VMData);
    set("ids", VMData.id);
    code(2);
  }

self-contained: true
code:
  - engine:
      - sh
      - bash
    source: |
      az vm list --query '[*].{"id":id}'

    extractors:
      - type: json
        name: vmList
        internal: true
        json:
          - '.[]'

  - engine:
      - sh
      - bash
    source: |
      az vm show --ids "$ids" --query 'storageProfile.{"osDiskStorageType":osDisk.managedDisk.storageAccountType,"dataDiskStorageType":dataDisks[*].managedDisk.storageAccountType}'

    matchers-condition: and
    matchers:
      - type: word
        words:
          - 'Premium_LRS'

    extractors:
      - type: dsl
        dsl:
          - 'ids + " is using Premium SSD volumes for OS or data disks which is not recommended for its current workload"'
