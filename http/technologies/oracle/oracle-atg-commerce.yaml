id: oracle-atg-commerce

info:
  name: Oracle ATG Commerce 面板指纹识别（指纹识别）
  author: Dale Clarke
  severity: info
  description: 用于识别目标是否部署 Oracle ATG Commerce 面板 并提取相关版本或构建信息，模板会结合 HTTP 响应头、状态码、特定路径或已知端点和版本或标识提取结果进行指纹匹配。
  reference:
    - https://docs.oracle.com/cd/E35319_01/Platform.10-2/ATGPlatformProgGuide/html/s0101introduction01.html
  classification:
    cvss-metrics: CVSS:3.1/AV:N/AC:L/PR:N/UI:N/S:U/C:N/I:N/A:N
    cvss-score: 0
    cwe-id: CWE-200
  metadata:
    verified: true
    max-request: 1
  tags: tech,oracle,atg,commerce,discovery

http:
  - method: GET
    path:
      - "{{BaseURL}}"

    matchers-condition: and
    matchers:
      - type: word
        part: header
        words:
          - "x-atg-version"
          - "atg_session_id"
        condition: or
        case-insensitive: true

      - type: status
        status:
          - 200
