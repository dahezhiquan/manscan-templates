id: flock-safety-camera-panel

info:
  name: Flock Safety 摄像头管理面板（IOT）
  author: inokii
  severity: medium
  description: |
    检测到 Flock Safety 摄像头管理面板。该面板与视频监控和安防摄像设备相关，暴露后可能泄露监控系统管理入口或设备部署信息。
  impact: |
    - 摄像头或录像设备暴露可能导致实时画面、截图、设备位置和监控范围被未授权查看。
    - 监控入口泄露还会增加弱口令、默认凭据和已知固件漏洞被利用的概率。
  remediation: |
    - 禁止公网直接访问摄像头、NVR/DVR 或视频流页面，统一放置在隔离网络或 VPN 后。
    - 启用强认证并修改默认口令，定期升级设备固件。
    - 对视频访问、配置变更和异常登录启用日志审计。
  reference:
    - https://www.flocksafety.com/products/video-cameras
  metadata:
    verified: true
    max-request: 1
    shodan-query: http.html:"Flock Admin"
  tags: panel,iot,camera,flock-safety,discovery

http:
  - method: GET
    path:
      - "{{BaseURL}}"

    matchers-condition: and
    matchers:
      - type: word
        part: body
        words:
          - "Flock Admin</title>"
          - "com.flocksafety.android.cameraconfig"
          - "com.flocksafety.android.videorecording"
        condition: or

      - type: status
        status:
          - 200
