id: craft-cms-detect

info:
  name: Craft CMS 指纹识别（指纹识别）
  author: skeltavik
  severity: info
  description: 用于识别目标是否使用 Craft CMS，模板会结合 HTTP 响应头、页面正文和特定路径或已知端点匹配内容管理系统相关指纹。
  reference:
    - https://craftcms.com
  metadata:
    max-request: 1
  tags: tech,craftcms,discovery

http:
  - method: GET
    path:
      - '{{BaseURL}}'

    host-redirects: true
    max-redirects: 2

    matchers:
      - type: word
        part: header
        words:
          - 'X-Powered-By: Craft CMS'

      - type: regex
        part: header
        regex:
          - 'Set-Cookie: (Craft|CRAFT)'

      - type: regex
        part: body
        regex:
          - '(?i)CRAFT_CSRF_TOKEN'
