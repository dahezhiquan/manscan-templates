id: whatsup-gold-panel

info:
  name: Whatsup Gold 登录面板识别（指纹识别）
  author: rxerium
  severity: info
  description: |-
    Whatsup Gold 是网络监控平台，用于设备发现、可用性、性能、告警和拓扑管理。该模板请求 `/NmConsole`、首页，并依据 HTTP 200 状态码、页面标题、正文关键字或品牌资源特征识别目标是否部署了该系统或暴露了对应入口，适用于资产指纹确认；命中结果仅表示系统特征匹配，不代表已确认存在未授权访问或可利用漏洞。
  reference:
  - https://www.whatsupgold.com/
  classification:
    cpe: cpe:2.3:a:progress:whatsup_gold:*:*:*:*:*:*:*:*
  metadata:
    verified: true
    max-request: 2
    vendor: progress
    product: whatsup_gold
    shodan-query: title:"WhatsUp Gold" http.favicon.hash:-2107233094
  tags: panel,whatsup-gold,detect,discovery

http:
  - method: GET
    path:
      - '{{BaseURL}}/NmConsole'
      - '{{BaseURL}}'

    host-redirects: true
    max-redirects: 2
    stop-at-first-match: true

    matchers-condition: and
    matchers:
      - type: word
        part: body
        words:
          - "<title>WhatsUp Gold</title>"

      - type: status
        status:
          - 200
