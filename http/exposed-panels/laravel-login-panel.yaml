id: laravel-login-panel

info:
  name: Laravel Login 面板识别（暴露面识别）
  author: ProjectDiscoveryAI
  severity: info
  description: |
    该模板通过识别 Laravel Login 登录入口的页面标题、特征文本或重定向行为，判断目标是否暴露了对应的认证界面。若命中，说明该登录面板对外可访问，可用于暴露面梳理与后续安全评估。
  metadata:
    verified: true
    max-request: 3
    shodan-query: title:"Login Laravel"
  tags: laravel,login,panel

http:
  - method: GET
    path:
      - "{{BaseURL}}/admin/login"
      - "{{BaseURL}}/authentication/login"
      - "{{BaseURL}}/login"

    stop-at-first-match: true

    host-redirects: true
    max-redirects: 2

    matchers-condition: and
    matchers:
      - type: word
        words:
          - 'content="Laravel"'
          - "Laravel Login"
        condition: or

      - type: status
        status:
          - 200
