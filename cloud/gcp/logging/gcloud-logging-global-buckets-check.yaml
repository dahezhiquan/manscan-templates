id: gcloud-logging-global-buckets-check

info:
  name: 日志记录 Buckets 未Configured 使用Global Location（云安全）
  author: princechaddha
  severity: medium
  description: Cloud Logging bucket 未使用 global 位置时，可能不符合统一日志路由和跨区域审计留存要求。本模板枚举项目日志 bucket，并通过名称路径判断是否包含 /global/，不包含时报告该 bucket 未配置为 global location。
  impact: |
    - 日志位置不符合组织基线时，集中查询、跨区域事件响应和数据驻留控制可能出现偏差。
    - 多位置日志 bucket 会增加权限、保留策略和导出路径的管理复杂度。
  remediation: |
    - 按组织日志架构使用 global 位置的 Logging bucket，或确认并记录需要使用区域位置的业务例外。
    - 统一复核日志 bucket 的位置、保留期、访问控制和导出策略，避免项目间配置漂移。
  reference:
    - https://cloud.google.com/logging/docs/export/configure_export_v2
  metadata:
    vendor: google
    product: cloud-logging
  tags: cloud,devops,gcp,gcloud,google-cloud-logging,logging-buckets,gcp-cloud-config

flow: |
  code(1)
  for(let projectId of iterate(template.projectIds)){
    set("projectId", projectId)
    code(2)
    for (let bucket of template.buckets) {
      set("bucket", bucket);
      javascript(1);
    }}

self-contained: true

code:
  - engine:
      - sh
      - bash
    source: |
      gcloud projects list --format="json(projectId)"

    extractors:
      - type: json
        name: projectIds
        internal: true
        json:
          - '.[].projectId'

  - engine:
      - sh
      - bash
    source: |
      gcloud logging buckets list --project $projectId --format="json(name,location)"

    extractors:
      - type: json
        name: buckets
        internal: true
        json:
          - '.[].name'

javascript:
  - code: |
        bucket = template.bucket
        if (!bucket.includes('/global/')) {
          let result = `Bucket '${bucket}' is not configured with a global location.`;
          Export(result);
        }

    extractors:
      - type: dsl
        dsl:
          - response
