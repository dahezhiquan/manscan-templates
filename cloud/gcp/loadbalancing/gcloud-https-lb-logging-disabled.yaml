id: gcloud-https-lb-logging-disabled

info:
  name: HTTP(S) 负载均衡器日志记录未启用（云安全）
  author: princechaddha
  severity: high
  description: HTTP(S) 负载均衡器后端日志可记录请求、延迟和后端响应信息，是排查攻击流量和异常访问的重要依据。本模板从 URL map 解析默认 backend service，并检查 logConfig.enable，值为 false 时报告该后端未启用负载均衡日志。
  impact: |
    - 攻击扫描、异常请求、后端错误和流量峰值缺少可审计记录，延迟检测和取证。
    - 多业务共用负载均衡路径时，日志缺失会影响访问溯源、SLO 分析和合规留痕。
  remediation: |
    - 为 HTTP(S) 负载均衡器 backend service 启用 logConfig，并按业务需要配置采样率。
    - 将负载均衡日志导出到集中日志平台，配置关键状态码、异常流量和后端错误告警。
  reference:
    - https://cloud.google.com/load-balancing/docs/https
  metadata:
    vendor: google
    product: cloud-load-balancing
  tags: cloud,devops,gcp,gcloud,google-cloud-load-balancing,gcp-cloud-config

flow: |
  code(1)
  for(let projectId of iterate(template.projectIds)){
    set("projectId", projectId)
    code(2)
    for(let urlMapName of iterate(template.urlMaps)){
      set("urlMapName", urlMapName)
      code(3)
      for(let backendServiceName of iterate(template.backendServices)){
        set("backendServiceName", backendServiceName)
        code(4)
      }
    }
  }

self-contained: true

code:
  - engine:
      - sh
      - bash
    source: |
      gcloud projects list --format="json(projectId)"

    extractors:
      - type: json
        name: projectIds
        internal: true
        json:
          - '.[].projectId'

  - engine:
      - sh
      - bash
    source: |
      gcloud compute url-maps list --project $projectId --format="json(name)"

    extractors:
      - type: json
        name: urlMaps
        internal: true
        json:
          - '.[].name'

  - engine:
      - sh
      - bash
    source: |
      gcloud compute url-maps describe $urlMapName --project $projectId --format="json(defaultService)"

    extractors:
      - type: json
        name: backendServices
        internal: true
        json:
          - '.defaultService'

  - engine:
      - sh
      - bash
    source: |
      gcloud compute backend-services describe $backendServiceName --project $projectId --format="json(logConfig.enable)"

    matchers:
      - type: word
        words:
          - 'false'

    extractors:
      - type: dsl
        dsl:
          - '"Logging is disabled on load balancer " + urlMapName + " on backend service " + backendServiceName + " in project " + projectId'
