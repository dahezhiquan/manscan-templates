id: gcloud-dns-dangling-records

info:
  name: Dangling DNS Records 检查（云安全）
  author: princechaddha
  severity: high
  description: Cloud DNS 中残留的悬空记录可能指向已释放或未绑定的云资源，形成域名接管或错误流量转发风险。本模板枚举托管区域和记录集，并结合外部地址状态检查，发现可疑残留记录时报告 Dangling DNS Record。
  impact: |
    - 攻击者可能重新占用被 DNS 指向的云资源，从而接管子域名或接收用户流量。
    - 残留记录会导致业务访问异常、证书签发混乱和安全监控误判。
  remediation: |
    - 核对命中的 DNS 记录与实际云资源绑定关系，删除不再使用或指向失效资源的记录。
    - 在资源下线流程中同步清理 DNS、负载均衡和外部地址，并定期巡检悬空记录。
  reference:
    - https://cloud.google.com/dns/docs
  metadata:
    vendor: google
    product: cloud-dns
  tags: cloud,devops,gcp,gcloud,dns,gcp-cloud-config,discovery

flow: |
  code(1)
  for(let projectId of iterate(template.projectIds)){
    set("projectId", projectId)
    code(2)
    for(let managedZone of iterate(template.managedZones)){
      set("managedZone", managedZone)
      code(3)
      for(let recordSet of iterate(template.recordSets)){
        recordSet = JSON.parse(recordSet)
        set("recordType", recordSet.type)
        set("recordData", recordSet.rrdatas)
        code(4)
      }
    }
  }

self-contained: true

code:
  - engine:
      - sh
      - bash
    source: |
      gcloud projects list --format="json(projectId)"

    extractors:
      - type: json
        name: projectIds
        internal: true
        json:
          - '.[].projectId'

  - engine:
      - sh
      - bash
    source: |
      gcloud dns managed-zones list --project $projectId --format="json(name,visibility)"

    extractors:
      - type: json
        name: managedZones
        internal: true
        json:
          - '.[].name'

  - engine:
      - sh
      - bash
    source: |
      gcloud dns record-sets list --zone=$managedZone --format="json(type,rrdatas)"

    extractors:
      - type: json
        name: recordSets
        internal: true
        json:
          - '{type: .type, rrdatas: .rrdatas[]}'

  - engine:
      - sh
      - bash
    source: |
      gcloud compute addresses list --filter "addressType~EXTERNAL" --format="json(name,status,address)"

    matchers:
      - type: word
        words:
          - 'RESERVED'

    extractors:
      - type: dsl
        dsl:
          - '"Dangling DNS Record: Type: " + recordType + " Data: " + recordData + " in Zone: " + managedZone + " of Project: " + projectId'
