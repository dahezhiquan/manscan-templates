id: nperf-server-detect

info:
  name: nPerf 服务器指纹识别（指纹识别）
  author: rxerium
  severity: info
  description: |
    用于识别目标是否部署 nPerf 服务器 并提取相关版本或构建信息，模板会结合 HTTP 响应头、页面标题、页面正文、特定路径或已知端点和版本或标识提取结果进行指纹匹配。
  reference:
    - https://www.nperf.com
  metadata:
    verified: true
    max-request: 1
    shodan-query: product:"nPerf"
  tags: tech,nperf,detect,discovery

http:
  - method: GET
    path:
      - "{{BaseURL}}"

    matchers-condition: or
    matchers:
      - type: word
        part: body
        words:
          - "<title>nPerfServer</title>"

      - type: word
        part: header
        words:
          - "Nperfserver-Remote-Endpoint"
          - "nPerf/"
        condition: or

    extractors:
      - type: kval
        part: header
        kval:
          - Server
