id: senayan-slims-cms-detect

info:
  name: Senayan SLiMS CMS 指纹识别（指纹识别）
  author: nblirwn
  severity: info
  description: >-
    Senayan SLiMS 是图书馆管理系统，用于馆藏、借阅、会员和在线公共检索目录管理。该模板通过请求目标服务并检查预设路径或首页响应、页面正文关键字等指纹特征，判断目标是否使用或暴露了
    Senayan SLiMS CMS 相关组件；命中结果仅表示指纹特征匹配，可用于资产盘点、技术栈识别和后续安全评估，不代表已确认存在可利用漏洞。
  reference:
  - https://github.com/slims
  metadata:
    verified: true
    max-request: 1
    shodan-query: html:'content="SLiMS'
  tags: tech,slims,cms,senayan,discovery
http:
  - method: GET
    path:
      - "{{BaseURL}}"

    matchers:
      - type: word
        part: body
        words:
          - 'content="SLiMS'
