id: policja2009

info:
  name: Policja2009 用户名信息枚举（OSINT）
  author: dwisiswant0
  severity: info
  description: |
    Policja2009 是提供公开账号主页或用户内容入口的在线服务，用户资料页通常会公开展示用户名、个人资料或与该服务相关的公开活动信息。该模板用于在公开互联网侧枚举 Policja2009 用户名，不需要认证；模板请求公开路径 http://www.policja2009.fora.pl/search.php?search_author=用户名，并结合响应状态为 200、页面或响应内容命中 “Znaleziono” 等资料页特征判断目标用户名是否存在。该检查属于 OSINT 用户枚举，结果仅表示公开资料页或公开搜索结果可被访问，不代表目标平台存在可直接修复的漏洞。
  classification:
    cvss-metrics: CVSS:3.1/AV:N/AC:L/PR:N/UI:N/S:U/C:N/I:N/A:N
    cvss-score: 0
    cwe-id: CWE-200
  metadata:
    max-request: 1
  tags: osint,osint-misc,policja2009,discovery

self-contained: true

http:
  - method: GET
    path:
      - "http://www.policja2009.fora.pl/search.php?search_author={{user}}"

    matchers-condition: and
    matchers:
      - type: status
        status:
          - 200

      - type: word
        part: body
        words:
          - "Znaleziono"
