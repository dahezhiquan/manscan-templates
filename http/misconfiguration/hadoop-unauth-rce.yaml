id: hadoop-unauth-rce

info:
  name: Apache Hadoop YARN ResourceManager 远程代码执行
  author: pdteam,Couskito
  severity: critical
  description: |
    该模板用于核查 Apache Hadoop YARN ResourceManager 远程代码执行。该类问题通常源于高危管理接口未授权开放，攻击者可借助接口能力提交任务或触发命令执行。模板会向目标发送探测请求，并依据请求 `/ws/v1/cluster/apps/new-application`、匹配 `"application-id"`、状态码 200等证据确认目标是否存在该配置问题。
  impact: |
    - 攻击者可能在目标服务或集群节点上执行命令、提交任务或控制计算资源。
    - 成功利用后可导致主机沦陷、数据泄露、横向移动和业务中断。
  remediation: |
    - 立即为相关管理接口启用认证授权并限制可信来源访问。
    - 按厂商建议升级或加固受影响组件，关闭不需要的远程任务提交能力。
    - 检查集群任务、系统进程和访问日志，清理异常任务并轮换凭据。
  reference:
    - http://archive.hack.lu/2016/Wavestone%20-%20Hack.lu%202016%20-%20Hadoop%20safari%20-%20Hunting%20for%20vulnerabilities%20-%20v1.0.pdf
    - https://github.com/rapid7/metasploit-framework/blob/master/modules/exploits/linux/http/hadoop_unauth_exec.rb
    - https://github.com/vulhub/vulhub/tree/master/hadoop/unauthorized-yarn
    - https://github.com/Al1ex/Hadoop-Yarn-ResourceManager-RCE
  classification:
    cvss-metrics: CVSS:3.1/AV:N/AC:L/PR:N/UI:N/S:U/C:H/I:H/A:H
    cvss-score: 9.8
    cwe-id: CWE-306
  metadata:
    max-request: 1
  tags: vulhub,apache,hadoop,unauth,rce,msf,misconfig,vuln

http:
  - method: POST
    path:
      - "{{BaseURL}}/ws/v1/cluster/apps/new-application"

    matchers-condition: and
    matchers:
      - type: word
        words:
          - '"application-id"'

      - type: status
        status:
          - 200
