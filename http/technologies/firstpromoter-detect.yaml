id: firstpromoter-detect

info:
  name: FirstPromoter 指纹识别（指纹识别）
  author: Shivam Kamboj
  severity: info
  description: >-
    FirstPromoter 是联盟营销和推荐奖励平台，用于跟踪推广链接、转化和佣金结算。该模板通过请求目标服务并检查预设路径或首页响应、DSL 条件等指纹特征，判断目标是否使用或暴露了
    FirstPromoter 相关组件；命中结果仅表示指纹特征匹配，可用于资产盘点、技术栈识别和后续安全评估，不代表已确认存在可利用漏洞。
  reference:
  - https://firstpromoter.com/
  - https://docs.firstpromoter.com/guides/tracking-with-fprjs
  metadata:
    verified: true
    max-request: 1
    vendor: firstpromoter
    product: firstpromoter
    shodan-query:
    - http.html:"cdn.firstpromoter.com"
    - http.html:"fpr.js"
  tags: tech,discovery,affiliate,firstpromoter
http:
  - method: GET
    path:
      - "{{BaseURL}}"

    matchers:
      - type: dsl
        dsl:
          - 'contains_any(body, "cdn.firstpromoter.com/fpr.js", "cdn.firstpromoter.com/fprom.js", "//cdn.firstpromoter.com")'
          - 'status_code == 200'
        condition: and
