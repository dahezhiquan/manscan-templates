id: ruckus-wireless-admin-login

info:
  name: Ruckus Wireless Admin 登录面板识别（暴露面识别）
  author: pussycat0x
  severity: info
  description: 该模板通过识别 Ruckus Wireless Admin 登录入口的页面标题、特征文本或重定向行为，判断目标是否暴露了对应的认证界面。若命中，说明该登录面板对外可访问，可用于暴露面梳理与后续安全评估。
  classification:
    cvss-metrics: CVSS:3.0/AV:N/AC:L/PR:N/UI:N/S:U/C:N/I:N/A:N
    cwe-id: CWE-200
    cpe: cpe:2.3:h:ruckuswireless:e510:*:*:*:*:*:*:*:*
  metadata:
    verified: true
    max-request: 1
    vendor: ruckuswireless
    product: e510
    shodan-query:
      - title:"ruckus"
      - http.title:"ruckus"
    fofa-query: title="ruckus"
    google-query: intitle:"ruckus"
  tags: panel,exposed,ruckus,ruckuswireless,discovery

http:
  - method: GET
    path:
      - '{{BaseURL}}/login.asp'

    matchers-condition: and
    matchers:
      - type: word
        part: body
        words:
          - "<title>Ruckus Wireless Admin</title>"

      - type: status
        status:
          - 200
