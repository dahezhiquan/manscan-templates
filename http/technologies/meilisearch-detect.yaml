id: meilisearch-detect

info:
  name: Meilisearch 指纹识别（指纹识别）
  author: userdehghani
  severity: info
  description: >-
    Meilisearch 是开源全文搜索引擎，用于为网站和应用提供快速、容错的搜索能力。该模板通过请求目标服务并检查预设路径或首页响应、DSL 条件等指纹特征，判断目标是否使用或暴露了
    Meilisearch 相关组件；命中结果仅表示指纹特征匹配，可用于资产盘点、技术栈识别和后续安全评估，不代表已确认存在可利用漏洞。
  reference:
  - https://www.meilisearch.com/
  metadata:
    verified: true
    max-request: 1
    fofa-query: app="meilisearch"
  tags: meilisearch,detect,tech,discovery
http:
  - method: GET
    path:
      - "{{BaseURL}}"

    matchers-condition: and
    matchers:
      - type: dsl
        dsl:
          - 'status_code == 200'
          - 'contains(body, "Meilisearch is running")'
        condition: and
