id: palo-alto-paloalto-expedition-panel

info:
  name: Palo Alto Expedition Project 登录面板识别（指纹识别）
  author: johnk3r
  severity: info
  description: |-
    Palo Alto Expedition Project 是 Palo Alto Networks 策略迁移与优化工具，用于防火墙策略转换、清理和评估。该模板请求首页，并依据 HTTP 200 状态码、页面标题、正文关键字或品牌资源特征识别目标是否部署了该系统或暴露了对应入口，适用于资产指纹确认；命中结果仅表示系统特征匹配，不代表已确认存在未授权访问或可利用漏洞。
  metadata:
    verified: true
    max-request: 1
    vendor: paloaltonetworks
    product: expedition
    shodan-query: http.favicon.hash:1499876150
  tags: panel,expedition,palo-alto,login,detect,discovery

http:
  - method: GET
    path:
      - "{{BaseURL}}"

    host-redirects: true
    max-redirects: 2

    matchers-condition: and
    matchers:
      - type: word
        part: body
        words:
          - "<title>Expedition Project</title>"

      - type: status
        status:
          - 200
