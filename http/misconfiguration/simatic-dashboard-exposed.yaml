id: simatic-dashboard-exposed

info:
  name: Siemens SIMATIC 300 仪表盘 暴露
  author: Th3l0newolf
  severity: high
  description: |
    检测到 Siemens SIMATIC 300 仪表盘 暴露。目标功能在未认证状态下可访问，可能暴露管理入口、业务数据、系统状态或可执行操作，需确认是否存在访问控制缺失。
  reference:
    - https://new.siemens.com
  metadata:
    verified: true
    max-request: 1
    shodan-query: title:"SIMATIC 300"
  tags: siemens,simatic,plc,scada,iot,misconfig,unauth,vuln

http:
  - method: GET
    path:
      - "{{BaseURL}}/Portal0000.htm"

    matchers-condition: and
    matchers:
      - type: regex
        part: body
        regex:
          - "SIMATIC\\s*300"

      - type: word
        part: body
        words:
          - 'alt="Simatic S7 CP"'

      - type: status
        status:
          - 200
