id: riot-games-phish

info:
  name: Riot Games 仿冒钓鱼网站（钓鱼网站识别）
  author: rxerium
  severity: info
  description: |
    检测到疑似仿冒 Riot Games 的钓鱼网站。模板在目标页面返回 200、页面内容命中 Riot Games 的品牌页面特征，且当前主机不属于 riotgames.com 官方域名时触发，用于识别借用 Riot Games 品牌页面诱导用户信任的仿冒站点。
  reference:
    - https://riotgames.com
  metadata:
    max-request: 1
  tags: phishing,riot-games,osint,discovery
http:
  - method: GET
    path:
      - "{{BaseURL}}"

    host-redirects: true
    max-redirects: 2

    matchers-condition: and
    matchers:
      - type: word
        words:
          - "Riot Games. Developer of League of Legends, VALORANT, Teamfight Tactics, Legends of Runeterra, and Wild Rift. Creators of Arcane. Home of LOL and VALORANT Esports."

      - type: status
        status:
          - 200

      - type: dsl
        dsl:
          - '!contains(host,"riotgames.com")'
