id: unauth-etcd-server

info:
  name: Etcd 服务器 未授权 访问
  author: sharath,pussycat0x
  severity: high
  description: |
    检测到 Etcd 服务器 未授权 访问。目标功能在未认证状态下可访问，可能暴露管理入口、业务数据、系统状态或可执行操作，需确认是否存在访问控制缺失。
  remediation: |
    - 为相关管理界面和 API 启用强认证、授权校验和最小权限控制。
    - 将后台端点限制在可信网络或 VPN 内，并记录访问审计日志。
  reference:
    - https://www.optiv.com/insights/source-zero/blog/kubernetes-attack-surface
  metadata:
    verified: true
    max-request: 1
    shodan-query: product:"etcd"
  tags: tech,k8s,kubernetes,devops,etcd,unauth,anonymous,misconfig,vuln

http:
  - method: GET
    path:
      - "{{BaseURL}}/v2/keys/"

    matchers-condition: and
    matchers:
      - type: word
        part: body
        words:
          - '"node":'
          - '"key":'
        condition: and

      - type: word
        part: header
        words:
          - "application/json"

      - type: status
        status:
          - 200
