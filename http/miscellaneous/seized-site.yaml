id: seized-site

info:
  name: 执法接管网站检测
  author: rxerium
  severity: low
  description: |
    检测网站是否显示已被执法机构接管的页面。命中通常表示域名或站点已被司法、执法或监管机构查封。
  impact: |
    - 被篡改页面可能传播垃圾内容、恶意链接或黑客署名，影响用户安全和站点声誉。
    - 篡改迹象通常意味着攻击者已经具备写入页面或修改内容的能力。
  remediation: |
    - 从可信备份恢复内容，并清理恶意页面、隐藏链接和可疑重定向。
    - 排查 CMS、插件、账号、文件权限和部署流程中的入侵入口。
    - 增加文件完整性监控和发布审计，修复后轮换相关凭据。
  metadata:
    max-request: 1
    verified: true
    shodan-query: title:"THIS WEBSITE HAS BEEN SEIZED"
  tags: seized,miscellaneous,misc,vuln

http:
  - method: GET
    path:
      - "{{BaseURL}}"

    matchers-condition: and
    matchers:
      - type: word
        part: body
        words:
          - "THIS WEBSITE HAS BEEN SEIZED"
          - "This domain has been seized by the Federal Bureau of Investigation"
        case-insensitive: true
        condition: or

      - type: status
        status:
          - 200
