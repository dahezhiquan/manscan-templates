id: debug-vars

info:
  name: Golang Expvar 检测（暴露面识别）
  author: luqman
  severity: low
  description: 检测到对外可访问的 Golang Expvar。这类配置资源可能包含部署细节、访问凭据、内部地址、组件版本或调试开关，公开暴露后会显著增加被侦察和后续利用的风险。
  metadata:
    max-request: 1
  tags: go,debug,exposure,vuln

http:
  - method: GET
    path:
      - "{{BaseURL}}/debug/vars"

    matchers-condition: and
    matchers:
      - type: word
        words:
          - '"memstats":'
          - '"cmdline":'
        condition: and

      - type: status
        status:
          - 200
