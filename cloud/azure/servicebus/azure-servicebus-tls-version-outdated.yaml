id: azure-servicebus-tls-version-outdated
info:
  name: Azure Service Bus TLS 版本低于 1.2（云安全）
  author: princechaddha
  severity: medium
  description: Azure Service Bus 命名空间的 minimumTlsVersion 低于 1.2 时，客户端可能协商已不推荐的 TLS 版本，降低消息传输的机密性和完整性保护。本模板枚举命名空间并查询 minimumTlsVersion，在返回结果包含 1. 且不包含 1.2 时报告。
  impact: |
    - 旧版 TLS 可能使用较弱的协议协商和密码套件，增加窃听、中间人攻击及协议降级风险。
    - 消息内容、访问令牌或服务调用元数据可能在传输链路上暴露，且不符合现代安全基线和合规要求。
  remediation: |
    - 将 Service Bus 命名空间的 minimumTlsVersion 设置为 1.2，并确认生产客户端支持该版本。
    - 在切换前盘点旧客户端和集成服务，完成兼容性验证后禁用旧协议，并监控连接失败和重试异常。
  reference:
    - https://docs.microsoft.com/en-us/azure/service-bus-messaging/service-bus-tls
  metadata:
    vendor: microsoft
    product: azure-service-bus
  tags: cloud,devops,azure,microsoft,service-bus,azure-cloud-config

flow: |
  code(1);
  for (let NamespaceData of iterate(template.namespaceList)) {
    NamespaceData = JSON.parse(NamespaceData);
    set("name", NamespaceData.Name);
    set("resourceGroup", NamespaceData.ResourceGroup);
    code(2);
  }

self-contained: true
code:
  - engine:
      - sh
      - bash
    source: |
      az servicebus namespace list --output json --query '[*].{"Name":name,"ResourceGroup":resourceGroup}'

    extractors:
      - type: json
        name: namespaceList
        internal: true
        json:
          - '.[]'

  - engine:
      - sh
      - bash
    source: |
      az servicebus namespace show --name "$name" --resource-group "$resourceGroup" --query 'minimumTlsVersion'

    matchers-condition: and
    matchers:
      - type: word
        words:
          - '"1."'

      - type: word
        words:
          - '"1.2"'
        negative: true

    extractors:
      - type: dsl
        dsl:
          - 'name + " in " + resourceGroup + " is not using TLS 1.2"'
