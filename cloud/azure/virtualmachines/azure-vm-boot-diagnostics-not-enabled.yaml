id: azure-vm-boot-diagnostics-not-enabled
info:
  name: Azure VM 启动诊断未启用（云安全）
  author: princechaddha
  severity: medium
  description: Azure VM Boot Diagnostics 可记录启动过程的串行日志和屏幕截图，帮助识别引导失败、启动循环及早期系统异常。本模板枚举虚拟机，查询 diagnosticsProfile.bootDiagnostics.enabled，并在返回 false 时报告启动诊断未启用。
  impact: |
    - 启动故障和异常重启缺少关键证据时，运维和安全团队可能无法及时区分配置错误、恶意篡改和平台故障。
    - 取证信息不足会延长恢复时间，并降低对持久化启动项和异常系统行为的发现能力。
  remediation: |
    - 为需要审计和故障排查的虚拟机启用 Boot Diagnostics，并将日志和截图存储到受控的 Storage 账户。
    - 限制诊断数据读取权限，设置合理保留期和告警，避免诊断存储本身成为敏感信息暴露点。
  reference:
    - https://docs.microsoft.com/en-us/azure/virtual-machines/troubleshooting/boot-diagnostics
  metadata:
    vendor: microsoft
    product: azure-virtual-machines
  tags: cloud,devops,azure,microsoft,virtual-machines,azure-cloud-config

flow: |
  code(1);
  for (let VmData of iterate(template.vmList)) {
    set("ids", VmData);
    code(2);
  }

self-contained: true
code:
  - engine:
      - sh
      - bash
    source: |
      az vm list --query '[*].id'

    extractors:
      - type: json
        name: vmList
        internal: true
        json:
          - '.[]'

  - engine:
      - sh
      - bash
    source: |
      az vm show --ids "$ids" --query '{"BootDiagnosticsStatus": diagnosticsProfile.bootDiagnostics.enabled}'

    matchers-condition: and
    matchers:
      - type: word
        words:
          - '"BootDiagnosticsStatus": false'

    extractors:
      - type: dsl
        dsl:
          - 'ids + " does not have Boot Diagnostics enabled."'
