id: acm-wildcard-cert
info:
  name: ACM 通配符证书使用检查（云安全）
  author: princechaddha
  severity: low
  description: ACM 通配符证书使用是一类证书影响面扩大风险，单个证书可覆盖同一域名层级下的多个子域名业务。通配符证书便于统一管理，但一旦私钥、导出权限或关联服务配置失控，可能同时影响多个入口。模板枚举 ISSUED 状态的证书 ARN，再读取 `Certificate.DomainName`，当域名包含 `*.` 时判定为通配符证书。
  impact: |
    - 单个证书或私钥管理失误可能影响多个子域名服务，扩大证书滥用或冒用的范围。
    - 过度使用通配符证书会降低按业务边界进行吊销、轮换和权限隔离的精细度。
  remediation: |
    - 评估通配符证书是否确有必要；对高敏感业务优先使用精确域名证书。
    - 加强证书关联资源、私钥导出权限和续期状态的持续审计，减少单点证书影响面。
  reference:
    - https://docs.aws.amazon.com/acm/latest/userguide/acm-certificate.html
  metadata:
    max-request: 2
    vendor: amazon
    product: acm
  tags: cloud,devops,aws,amazon,acm,aws-cloud-config
variables:
  region: "us-east-1"

flow: |
  code(1)
  for(let arns of iterate(template.certificatearns)){
    set("certificatearn", arns)
    code(2)
  }

self-contained: true
code:
  - engine:
      - sh
      - bash
    source: |
      aws acm list-certificates --region $region --certificate-statuses ISSUED --query 'CertificateSummaryList[*].CertificateArn' --output json

    extractors:
      - type: json
        name: certificatearns
        internal: true
        json:
          - '.[]'

  - engine:
      - sh
      - bash
    source: |
         aws acm describe-certificate --region $region --certificate-arn $certificatearn --query 'Certificate.DomainName'

    matchers:
      - type: word
        words:
          - "*."

    extractors:
      - type: dsl
        dsl:
          - 'certificatearn + " AWS ACM certificate is a wildcard certificate"'
