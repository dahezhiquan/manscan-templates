id: config-rb

info:
  name: Ruby 配置文件检测（暴露面识别）
  author: DhiyaneshDK
  severity: high
  description: 检测到对外可访问的 Ruby 配置文件。这类配置资源可能包含部署细节、访问凭据、内部地址、组件版本或调试开关，公开暴露后会显著增加被侦察和后续利用的风险。
  metadata:
    verified: true
    max-request: 3
    shodan-query: html:"config.rb"
  tags: ruby,devops,exposure,config,vuln

http:
  - method: GET
    path:
      - "{{BaseURL}}/config.rb"
      - "{{BaseURL}}/.chef/config.rb"
      - "{{BaseURL}}/assets/config.rb"

    stop-at-first-match: true

    matchers-condition: and
    matchers:
      - type: word
        words:
          - 'images_dir'
          - 'css_dir'
        condition: and

      - type: status
        status:
          - 200
