id: openai-plugin

info:
  name: OpenAI Plugin 指纹识别（指纹识别）
  author: pdteam
  severity: info
  description: |
    用于识别目标是否部署 OpenAI Plugin 并提取相关版本或构建信息，模板会结合特定路径或已知端点和版本或标识提取结果进行指纹匹配。
  reference:
    - https://platform.openai.com/docs/plugins/introduction
  metadata:
    verified: true
    max-request: 1
  tags: tech,openai,plugin,discovery,ai

http:
  - method: GET
    path:
      - "{{BaseURL}}/.well-known/ai-plugin.json"

    matchers:
      - type: word
        words:
          - '"schema_version":'
          - '"name_for_model":'
        condition: and

    extractors:
      - type: json
        json:
          - '.name_for_human'
