id: pyramid-debug-toolbar

info:
  name: Pyramid Debug Toolbar 泄露（暴露面识别）
  author: geeknik
  severity: medium
  description: 检测到可直接访问的 Pyramid Debug Toolbar。日志、异常页面或调试输出通常会泄露堆栈信息、内部路径、查询语句、账号标识、令牌片段或业务数据，不应向未授权用户开放。
  reference:
    - https://github.com/Pylons/pyramid_debugtoolbar
  metadata:
    max-request: 1
  tags: pyramid,logs,exposure,vuln

http:
  - method: GET
    path:
      - "{{BaseURL}}/_debug_toolbar/"

    matchers-condition: and
    matchers:
      - type: word
        words:
          - "<title>Pyramid Debug Toolbar</title>"
          - "Pyramid DebugToolbar</a>"
        condition: and

      - type: status
        status:
          - 200
