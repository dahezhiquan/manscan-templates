id: browserless-swagger-detect

info:
  name: Browserless API Swagger 指纹识别（指纹识别）
  author: theamanrawat
  severity: info
  description: |
    用于识别目标暴露的 Browserless API Swagger，模板会结合页面标题、页面正文、状态码和特定路径或已知端点判断是否存在对应技术或默认页面特征。
  reference:
    - https://github.com/browserless/browserless
    - https://docs.browserless.io/
  metadata:
    verified: true
    max-request: 4
    shodan-query: "browserless"
  tags: tech,browserless,swagger,api

flow: http(1) && http(2)

http:
  - method: GET
    path:
      - "{{BaseURL}}/docs/swagger-ui-init.js"

    matchers-condition: and
    matchers:
      - type: word
        part: body
        words:
          - "browserless/chrome API"
          - "browserless Swagger documentation"
        condition: and
        internal: true

      - type: status
        status:
          - 200
        internal: true

  - method: GET
    path:
      - "{{BaseURL}}/docs"

    host-redirects: true
    max-redirects: 2
    matchers-condition: and
    matchers:
      - type: word
        part: body
        words:
          - "<title>Swagger UI"

      - type: status
        status:
          - 200
