id: sailsjs-detect

info:
  name: Sails.js 指纹识别（指纹识别）
  author: Shivam Kamboj
  severity: info
  description: >-
    Sails.js 是 Node.js MVC 框架，用于构建实时 API、Web 应用和数据驱动服务。该模板通过请求目标服务并检查预设路径或首页响应、HTTP
    响应头、页面正文关键字、正则特征等指纹特征，判断目标是否使用或暴露了 Sails.js 相关组件；命中结果仅表示指纹特征匹配，可用于资产盘点、技术栈识别和后续安全评估，不代表已确认存在可利用漏洞。
  reference:
  - https://sailsjs.com/
  metadata:
    verified: true
    max-request: 1
    shodan-query: "sails.sid"
  tags: tech,discovery,sailsjs
http:
  - method: GET
    path:
      - "{{BaseURL}}"

    matchers-condition: and
    matchers:
      - type: word
        part: header
        words:
          - "X-Powered-By: Sails"
        case-insensitive: true

      - type: regex
        part: header
        regex:
          - '(?i)set-cookie:\s*sails\.sid='
