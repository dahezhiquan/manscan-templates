id: cgit-detect

info:
  name: cgit Web Interface - 识别（指纹识别）
  author: ritikchaddha
  severity: info
  description: |
    该模板用于识别 cgit Web Interface 相关页面或服务入口是否对外暴露。若命中，说明目标可被识别为对应产品或组件，可用于资产发现与攻击面管理。
  reference:
    - https://git.zx2c4.com/cgit/about/
    - https://wiki.archlinux.org/title/Cgit
  metadata:
    max-request: 1
    verified: true
    product: cgit
    vendor: zx2c4
    shodan-query: http.html:"cgit"
    fofa-query: body="cgit"
    google-query: intext:"generated by cgit"
  tags: tech,cgit,git,panel,detect

http:
  - method: GET
    path:
      - "{{BaseURL}}/"
      - "{{BaseURL}}/cgit/"

    redirects: true

    matchers-condition: and
    matchers:
      - type: word
        part: body
        words:
          - "cgit"
          - "generated by"
        condition: and

      - type: word
        part: body
        words:
          - "repository list"
          - "class='list nowrap'"
          - "id='cgit'"
          - "cgit.css"
        condition: or

      - type: status
        status:
          - 200
