id: azure-vmss-public-ip-disabled
info:
  name: Azure VMSS Public IP 未Assigned（云安全）
  author: princechaddha
  severity: high
  description: VMSS 实例公共 IP 会使实例直接获得公网可达地址，扩大管理和应用入口；本模板枚举规模集并执行 az vmss list-instance-public-ips，在返回空数组 [] 时报告未发现实例公网 IP，属于针对模板命名的反向检查结果，需结合实际业务语义复核。
  impact: |
    - 若实例实际配置公网 IP，SSH、RDP、管理接口或应用端口可能被互联网扫描和利用，主机被接管后可横向访问云内资源。
    - 即使没有公网 IP，错误依赖公共负载均衡或出站 NAT 也可能造成边界判断失真。
  remediation: |
    - 对不需要直接公网访问的 VMSS 移除实例公共 IP，使用 Private Link、内部负载均衡、跳板机或受控出站方案。
    - 对必须公开的服务仅通过 WAF、负载均衡、NSG、JIT 和最小端口规则暴露，并持续验证实际 IP 与入口清单。
  reference:
    - https://docs.microsoft.com/en-us/azure/virtual-machine-scale-sets/virtual-machine-scale-sets-networking
  metadata:
    vendor: microsoft
    product: azure-virtual-machine-scale-sets
  tags: cloud,devops,azure,microsoft,vmss,azure-cloud-config

flow: |
  code(1);
  for (let InstanceData of iterate(template.vmssList)) {
    InstanceData = JSON.parse(InstanceData);
    set("name", InstanceData.name);
    set("resourceGroup", InstanceData.resourceGroup);
    code(2);
  }

self-contained: true
code:
  - engine:
      - sh
      - bash
    source: |
      az vmss list --output json --query '[*].{"name":name,"resourceGroup":resourceGroup}'

    extractors:
      - type: json
        name: vmssList
        internal: true
        json:
          - '.[]'

  - engine:
      - sh
      - bash
    source: |
      az vmss list-instance-public-ips --name "$name" --resource-group "$resourceGroup" --query '[*].ipAddress'

    matchers-condition: and
    matchers:
      - type: word
        words:
          - '[]'

    extractors:
      - type: dsl
        dsl:
          - 'name + " in " + resourceGroup + " has no public IP addresses assigned."'
