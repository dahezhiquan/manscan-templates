id: ibm-websphere-panel

info:
  name: IBM WebSphere Portal 登录面板识别（暴露面识别）
  author: pdteam
  severity: info
  description: 该模板通过识别 IBM WebSphere Portal 登录入口的页面标题、特征文本或重定向行为，判断目标是否暴露了对应的认证界面。若命中，说明该登录面板对外可访问，可用于暴露面梳理与后续安全评估。
  classification:
    cvss-metrics: CVSS:3.0/AV:N/AC:L/PR:N/UI:N/S:U/C:N/I:N/A:N
    cwe-id: CWE-200
    cpe: cpe:2.3:a:ibm:websphere_portal:*:*:*:*:*:*:*:*
  metadata:
    max-request: 1
    vendor: ibm
    product: websphere_portal
    shodan-query:
      - http.html:"IBM WebSphere Portal"
      - http.html:"ibm websphere portal"
      - cpe:"cpe:2.3:a:ibm:websphere_portal"
    fofa-query: body="ibm websphere portal"
  tags: ibm,websphere,panel,discovery

http:
  - method: GET
    path:
      - '{{RootURL}}/wps/portal'

    host-redirects: true
    max-redirects: 2

    matchers-condition: and
    matchers:
      - type: status
        status:
          - 200

      - type: word
        words:
          - 'IBM WebSphere Portal'
          - 'IBMPortalWeb'
        condition: or

      - type: regex
        part: header
        regex:
          - "Content-Location: .+"
        negative: true
