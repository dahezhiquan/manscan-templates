id: drupal-detect

info:
  name: Drupal 指纹识别（指纹识别）
  author: 1nf1n7y,pathtaga
  severity: info
  description: Drupal 是开源内容管理框架，用于网站内容、模块、用户和权限管理。该模板请求首页、`/CHANGELOG.txt`、`/core/install.php` 等路径，并依据页面标题、正文关键字或品牌资源特征、响应头特征识别目标是否使用或暴露了 Drupal 相关组件，适用于资产盘点、技术栈识别和后续安全评估；命中结果仅表示指纹特征匹配，不代表已确认存在可利用漏洞。
  classification:
    cvss-metrics: CVSS:3.0/AV:N/AC:L/PR:N/UI:N/S:U/C:N/I:N/A:N
    cwe-id: CWE-200
    cpe: cpe:2.3:a:drupal:drupal:*:*:*:*:*:*:*:*
  metadata:
    verified: true
    max-request: 4
    vendor: drupal
    product: drupal
    shodan-query:
    - http.component:"drupal"
    - cpe:"cpe:2.3:a:drupal:drupal"
  tags: tech,drupal,discovery

http:
  - method: GET
    path:
      - "{{BaseURL}}"
      - "{{BaseURL}}/CHANGELOG.txt"
      - "{{BaseURL}}/core/install.php"
      - "{{BaseURL}}/user/login"

    stop-at-first-match: true
    matchers-condition: or
    matchers:
      - type: word
        part: body
        words:
          - 'Initial release'
          - 'Drupal 1.0.0'
        condition: and

      - type: word
        part: body
        words:
          - 'content="Drupal'

      - type: regex
        part: header
        regex:
          - '(?i)x-drupal'
          - "(?i)x-generator: drupal"
        condition: or

    extractors:
      - type: regex
        part: body
        name: version_by_install
        group: 1
        regex:
          - 'class="site-version">([0-9.x-]+)'
