id: nmon-login-panel

info:
  name: nMon 面板识别（指纹识别）
  author: Th3l0newolf
  severity: info
  description: |-
    检测到目标站点存在 nMon 相关响应特征。nMon 是 AI、机器学习或 Notebook 相关平台，用于管理模型、数据集、工作区、实验、推理服务或训练任务。模板请求 `/?route=signin`，并通过页面标题或正文关键字、状态码确认该系统指纹，用于资产识别、系统盘点和暴露面梳理。
  classification:
    cvss-metrics: CVSS:3.0/AV:N/AC:L/PR:N/UI:N/S:U/C:N/I:N/A:N
    cwe-id: CWE-200
  metadata:
    max-request: 1
    verified: true
    shodan-query: title:"nMon"
  tags: panel,login,nmon,detect
http:
  - method: GET
    path:
      - "{{BaseURL}}/?route=signin"

    matchers-condition: and
    matchers:
      - type: word
        part: body
        words:
          - "<title>nMon</title>"

      - type: status
        status:
          - 200
