id: sharepoint-toolshell-backdoor

info:
  name: SharePoint - WebShell 检测
  author: johnk3r
  severity: critical
  description: |
    该模板用于检测 SharePoint - WebShell 检测。命中通常表示目标存在后门、植入组件、恶意脚本或可疑未授权入口。模板主要向 `/_layouts/15/spinstall0.aspx` 等路径发送探测请求，并根据状态码、响应头、页面关键字或时间差等证据确认漏洞是否存在。
  impact: |
    - 命中通常表示目标存在后门、植入组件或可疑恶意脚本，攻击者可能已具备未授权访问能力。
    - 后门可能被用于执行命令、窃取数据、维持持久化访问或作为进一步入侵的跳板。
  remediation: |
    - 立即隔离受影响资产，保留证据并开展入侵排查，不要仅删除单个可疑文件后恢复上线。
    - 清理后门文件、恶意脚本、异常账号、计划任务和持久化项，并从可信介质重建受影响组件。
    - 升级相关产品，轮换系统、数据库、应用和第三方集成凭据。
  reference:
    - https://research.eye.security/sharepoint-under-siege/
  metadata:
    verified: true
    max-request: 1
    shodan-query: http.component:"Sharepoint"
  tags: sharepoint,webshell,implant,aspx,backdoor,vuln

http:
  - method: GET
    path:
      - "{{BaseURL}}/_layouts/15/spinstall0.aspx"

    matchers:
      - type: dsl
        dsl:
          - 'len(body) <= 160'
          - 'status_code == 200'
          - 'contains(to_lower(header), "microsoftsharepointteamservices")'
          - 'contains_all(to_lower(body), "hmacsha256", "framework20sp1", "auto")'
        condition: and

    extractors:
      - type: regex
        name: machinekey
        regex:
          - '^[A-Z0-9]{64}\|HMACSHA256\|[A-Z0-9]{64}\|Auto\|Framework20SP1$'
