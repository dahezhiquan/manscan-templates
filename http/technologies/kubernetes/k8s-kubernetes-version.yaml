id: k8s-kubernetes-version

info:
  name: Kubernetes 指纹识别（指纹识别）
  author: raesene,idealphase
  severity: info
  description: >-
    Kubernetes 属于 Kubernetes 控制面或节点组件暴露的接口能力，用于管理、观测或查询容器集群资源状态。该模板通过请求目标服务并检查预设路径或首页响应、页面正文关键字等指纹特征，判断目标是否使用或暴露了
    Kubernetes 相关组件；命中结果仅表示指纹特征匹配，可用于资产盘点、技术栈识别和后续安全评估，不代表已确认存在可利用漏洞。
  reference:
  - https://cloud.google.com/kubernetes-engine/docs/release-notes
  - https://docs.aws.amazon.com/eks/latest/userguide/kubernetes-versions.html
  metadata:
    max-request: 1
    shodan-query: product:"Kubernetes" version:"1.21.5-eks-bc4871b"
  tags: tech,kubernetes,devops,discovery
http:
  - method: GET
    path:
      - "{{BaseURL}}/version"

    matchers:
      - type: word
        words:
          - "gitVersion"
          - "goVersion"
          - "platform"
        condition: and

    extractors:
      - type: json
        json:
          - '.gitVersion'
