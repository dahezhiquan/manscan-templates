id: bank-of-america-phish

info:
  name: Bank of America 仿冒钓鱼网站（钓鱼网站识别）
  author: rxerium
  severity: info
  description: |
    检测到疑似仿冒 Bank of America 的钓鱼网站。模板在目标页面返回 200、页面内容命中 Bank of America 的金融或支付页面特征，且当前主机不属于 bankofamerica.com 官方域名时触发，用于识别借用 Bank of America 品牌页面诱导用户信任的仿冒站点。
  reference:
    - https://bankofamerica.com
  metadata:
    max-request: 1
  tags: phishing,BankOfAmerica,osint,discovery
http:
  - method: GET
    path:
      - "{{BaseURL}}"

    host-redirects: true
    max-redirects: 2

    matchers-condition: and
    matchers:
      - type: word
        words:
          - 'Bank of America - Banking, Credit Cards, Loans and Merrill Investing'

      - type: status
        status:
          - 200

      - type: dsl
        dsl:
          - '!contains(host,"bankofamerica.com")'
