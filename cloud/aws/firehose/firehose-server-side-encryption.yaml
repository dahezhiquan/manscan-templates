id: firehose-server-side-encryption

info:
  name: Firehose Delivery Stream 服务端加密未启用（云安全）
  author: DhiyaneshDK
  severity: high
  description: Amazon Data Firehose delivery stream 的服务端加密用于保护流中缓冲和处理的数据；未启用时，数据在 Firehose 服务侧处理阶段缺少预期的加密控制。该模板检查 DeliveryStreamEncryptionConfiguration.KeyType 是否为 null。
  impact: |
    - 包含日志、指标或业务事件的流数据在服务侧缓冲期间保护不足，可能不满足内部数据保护或合规要求。
    - 无法通过 KMS 密钥策略、审计日志和轮换机制对 Firehose 数据处理链路进行细粒度管控。
  remediation: |
    - 为 Firehose delivery stream 启用服务端加密，优先使用符合组织策略的 AWS KMS key。
    - 为相关 IAM principal、Firehose 服务角色和 KMS key policy 配置最小必要权限，并定期审计加密状态。
  reference:
    - https://www.trendmicro.com/cloudoneconformity-staging/knowledge-base/aws/Firehose/delivery-stream-encrypted-with-kms-customer-master-keys.html
    - https://docs.aws.amazon.com/AmazonS3/latest/dev/UsingKMSEncryption.html
  metadata:
    vendor: amazon
    product: firehose
  tags: cloud,devops,aws,amazon,firehose,aws-cloud-config
variables:
  region: "us-west-2"

flow: |
  code(1)
  for(let DeliveryStreamNames of iterate(template.deliverys)){
    set("delivery", DeliveryStreamNames)
    code(2)
  }

self-contained: true

code:
  - engine:
      - sh
      - bash
    source: |
      aws firehose list-delivery-streams --region $region --query 'DeliveryStreamNames' --output json

    extractors:
      - type: json
        name: deliverys
        internal: true
        json:
          - '.[]'

  - engine:
      - sh
      - bash
    source: |
        aws firehose describe-delivery-stream --region $region --delivery-stream-name $delivery --query 'DeliveryStreamDescription.DeliveryStreamEncryptionConfiguration.KeyType' --output json

    matchers:
      - type: word
        words:
          - "null"

    extractors:
      - type: dsl
        dsl:
          - '"Firehose delivery stream " + delivery + " is not encrypted using SSE"'
