id: sitecore-version

info:
  name: Sitecore 指纹识别（指纹识别）
  author: bernardofsr
  severity: info
  description: >-
    Sitecore 是企业数字体验和内容管理平台，用于内容发布、个性化营销和客户体验管理。该模板通过请求目标服务并检查预设路径或首页响应、状态码、页面正文关键字、正则特征等指纹特征，判断目标是否使用或暴露了
    Sitecore 相关组件；命中结果仅表示指纹特征匹配，可用于资产盘点、技术栈识别和后续安全评估，不代表已确认存在可利用漏洞。
  reference:
  - https://www.cvedetails.com/vulnerability-list/vendor_id-9609/Sitecore.html
  metadata:
    max-request: 1
  tags: sitecore,tech,discovery
http:
  - method: GET
    path:
      - "{{BaseURL}}/sitecore/shell/sitecore.version.xml"

    matchers-condition: and
    matchers:
      - type: status
        status:
          - 200

      - type: word
        words:
          - "Sitecore Corporation"
        part: body

    extractors:
      - type: regex
        group: 1
        regex:
          - "<major>([0-9]+)</major>"

      - type: regex
        group: 1
        regex:
          - "<minor>([0-9]+)</minor>"

      - type: regex
        group: 1
        regex:
          - "<build>([0-9]+)</build>"

      - type: regex
        group: 1
        regex:
          - "<revision>([0-9]+)</revision>"
