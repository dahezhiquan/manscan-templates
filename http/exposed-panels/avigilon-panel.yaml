id: avigilon-panel

info:
  name: Avigilon 登录面板识别（暴露面识别）
  author: robotshell
  severity: medium
  description: |-
    检测到目标站点暴露 Avigilon 相关面板或登录入口。Avigilon 是视频监控或安防设备的 Web 控制界面，用于查看视频流、配置录像、网络参数和设备账号。模板请求 `/cfg/login`，并通过页面标题或正文关键字、响应头关键字、状态码确认入口可访问；此类面板若直接暴露在公网，会增加账号枚举、口令攻击、漏洞匹配和未授权访问尝试的机会。
  impact: |-
    - 攻击者可确认目标部署了 Avigilon 或相关组件，并据此开展账号枚举、口令喷洒、默认凭据尝试或针对性漏洞匹配。
    - 若面板存在弱口令、默认配置、访问控制缺陷或未修复漏洞，可能导致后台权限被获取、配置被篡改、敏感数据泄露或业务系统被接管。
    - 管理入口长期暴露在公网会扩大攻击面，增加自动化扫描、撞库、社会工程和后续横向移动的风险。
  remediation: |-
    - 将 Avigilon 面板限制在内网、VPN、堡垒机或可信源 IP 访问范围内，避免管理入口直接暴露在公网。
    - 启用强密码、多因素认证、登录失败限制和默认账户清理，定期审计登录日志与管理员账号权限。
    - 保持系统和相关组件更新到受支持版本，关闭不必要的管理路径，并在必须公网访问时增加反向代理访问控制、WAF 或零信任访问策略。
  classification:
    cvss-metrics: CVSS:3.0/AV:N/AC:L/PR:N/UI:N/S:U/C:N/I:N/A:N
    cwe-id: CWE-200
    cpe: cpe:2.3:a:avigilon:avigilon_control_center:*:*:*:*:*:*:*:*
  metadata:
    verified: true
    max-request: 1
    vendor: avigilon
    product: avigilon_control_center
    shodan-query:
      - http.title:"Login - Avigilon Control Center"
      - http.title:"login - avigilon control center"
    fofa-query: title="login - avigilon control center"
    google-query: intitle:"login - avigilon control center"
  tags: panel,avigilon,discovery
http:
  - method: GET
    path:
      - '{{BaseURL}}/cfg/login'

    matchers-condition: and
    matchers:
      - type: word
        part: body
        words:
          - '<title>Login - Avigilon Control Center Gateway</title>'
          - '<title>Iniciar sesión - Puerta de enlace de Avigilon Control Center</title>'
        condition: or

      - type: word
        part: header
        words:
          - 'text/html'

      - type: status
        status:
          - 200
