id: sidewinder-ftp-detect
info:
  name: Sidewinder FTP 代理 服务 识别（指纹识别）
  author: pussycat0x
  severity: info
  description: |
    该模板通过 FTP Banner、响应特征或协商行为识别目标是否运行 Sidewinder FTP Proxy Service - Detect 相关 FTP 服务实现。
  metadata:
    verified: true
    shodan-query: "Sidewinder ftp proxy"
    max-request: 1
  tags: network,ftp,sidewinder,detect,tcp,discovery

tcp:
  - inputs:
      - data: 00000000
        type: hex

    host:
      - "{{Hostname}}"
    port: 21
    read-size: 1024

    matchers:
      - type: word
        words:
          - "Sidewinder ftp proxy"
