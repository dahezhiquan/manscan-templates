id: hetzner-phish

info:
  name: Hetzner 仿冒钓鱼网站（钓鱼网站识别）
  author: rxerium
  severity: info
  description: |
    检测到疑似仿冒 Hetzner 的钓鱼网站。模板在目标页面返回 200、页面内容命中 Hetzner 的官方服务页面特征，且当前主机不属于 hetzner.com 官方域名时触发，用于识别借用 Hetzner 品牌页面诱导用户信任的仿冒站点。
  reference:
    - https://hetzner.com
  metadata:
    max-request: 1
  tags: phishing,hetzner,cloud,hosting,osint,discovery
http:
  - method: GET
    path:
      - "{{BaseURL}}"

    host-redirects: true
    max-redirects: 2

    matchers-condition: and
    matchers:
      - type: word
        words:
          - '<title>Affordable dedicated servers, cloud &amp; hosting from Germany'

      - type: status
        status:
          - 200

      - type: dsl
        dsl:
          - '!contains(host,"hetzner.com")'
