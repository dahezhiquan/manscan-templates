id: searxng-detect

info:
  name: SearXNG 指纹识别（指纹识别）
  author: rxerium
  severity: info
  description: >-
    SearXNG 是开源元搜索引擎，用于聚合多个搜索源并提供隐私友好的搜索入口。该模板通过请求目标服务并检查预设路径或首页响应、页面正文关键字、状态码等指纹特征，判断目标是否使用或暴露了
    SearXNG 相关组件；命中结果仅表示指纹特征匹配，可用于资产盘点、技术栈识别和后续安全评估，不代表已确认存在可利用漏洞。
  reference:
  - https://github.com/searxng/searxng
  metadata:
    max-request: 1
    verified: true
    shodan-query: http.title:SearXNG
  tags: searxng,search-engine,tech,discovery
http:
  - method: GET
    path:
      - "{{BaseURL}}"

    matchers-condition: and
    matchers:
      - type: word
        part: body
        words:
          - "<title>SearXNG</title>"

      - type: status
        status:
          - 200
