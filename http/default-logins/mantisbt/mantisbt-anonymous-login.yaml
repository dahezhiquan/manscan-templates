id: mantisbt-anonymous-login

info:
  name: mantisbt 匿名登录（弱口令）
  author: pussycat0x
  severity: medium
  description: |
    该模板用于检测 mantisbt 是否允许匿名或默认账号直接登录。模板主要向 `/my_view_page.php` 等认证入口发送请求，并根据响应中的 `"user-info">anonymous</span>`、`My View` 等登录成功特征判断是否已进入有效会话；命中说明目标访问控制配置不当，未对敏感管理功能执行可靠身份校验。
  impact: |
    - 攻击者可登录 mantisbt 后台，管理内容、用户、插件、主题、文件、表单或业务流程配置。
    - 后台权限被滥用后，可能导致页面篡改、恶意文件上传、敏感资料泄露，或进一步取得服务器执行能力。
  remediation: |
    - 关闭匿名登录或来宾账号，为所有访问敏感功能的用户强制执行独立身份认证和最小权限授权。
    - 限制后台登录入口访问来源，启用多因素认证、登录失败锁定和验证码等防护。
    - 检查近期内容、插件、主题、文件上传和管理员操作记录，确认没有持久化后门。
  classification:
    cpe: cpe:2.3:a:mantisbt:mantisbt:*:*:*:*:*:*:*:*
  metadata:
    verified: true
    max-request: 1
    vendor: mantisbt
    product: mantisbt
    shodan-query: http.favicon.hash:662709064
  tags: default-login,anonymous,mantisbt,vuln

http:
  - method: GET
    path:
      - '{{BaseURL}}/my_view_page.php'

    matchers-condition: and
    matchers:
      - type: word
        part: body
        words:
          - '"user-info">anonymous</span>'
          - 'My View'
          - 'Roadmap'
        condition: and

      - type: status
        status:
          - 200
