id: rds-ri-payment-fail
info:
  name: RDS 预留实例付款失败（云安全）
  author: princechaddha
  severity: high
  description: RDS Reserved DB Instance 处于 payment-failed 状态时，预留购买或续费未成功，可能导致预期容量折扣和预算规划失效。该模板枚举 reserved DB instances，并检查 State 是否为 payment-failed。
  impact: |
    - 数据库成本可能回落到按需计费，造成预算超支或财务告警。
    - 付款失败反映账号账单或采购流程异常，可能影响后续资源采购和合规运营。
  remediation: |
    - 检查 AWS Billing、付款方式和预留实例订单状态，修复失败付款原因。
    - 将 RI 状态纳入成本治理监控，确保财务负责人及时处理 payment-failed 事件。
  reference:
    - https://docs.aws.amazon.com/AmazonRDS/latest/UserGuide/USER_WorkingWithReservedDBInstances.html
  metadata:
    max-request: 2
    vendor: amazon
    product: rds
  tags: cloud,devops,aws,amazon,rds,aws-cloud-config
variables:
  region: "ap-northeast-1"

flow: |
  code(1)
  for(let DBInstances of iterate(template.instances)){
    set("db", DBInstances)
    code(2)
  }

self-contained: true
code:
  - engine:
      - sh
      - bash
    source: |
      aws rds describe-reserved-db-instances --region $region --output json --query 'ReservedDBInstances[*].ReservedDBInstanceId'

    extractors:
      - type: json
        name: snapshots
        internal: true
        json:
          - '.[]'

  - engine:
      - sh
      - bash
    source: |
         aws rds describe-reserved-db-instances --region $region --reserved-db-instance-id $db --query 'ReservedDBInstances[*].State'

    matchers:
      - type: word
        words:
          - 'payment-failed'

    extractors:
      - type: dsl
        dsl:
          - '"RDS Reserved Instance purchase has failed for " + db'
