id: joplin-panel

info:
  name: Joplin Server Login 面板（暴露面识别）
  author: pussycat0x
  severity: info
  description: |
    该模板通过识别 Joplin Server Login 登录入口的页面标题、特征文本或重定向行为，判断目标是否暴露了对应的认证界面。若命中，说明该登录面板对外可访问，可用于暴露面梳理与后续安全评估。
  metadata:
    verified: true
    shodan-query: 'title:"Joplin Server"'
    max-request: 1
  tags: panel,joplin,login,discovery

http:
  - method: GET
    path:
      - "{{BaseURL}}/login"

    matchers-condition: and
    matchers:
      - type: word
        part: body
        words:
          - "<title>Joplin Server - Login</title>"

      - type: status
        status:
          - 200
