id: nginx-version

info:
  name: Nginx 指纹识别（指纹识别）
  author: philippedelteil,daffainfo
  severity: info
  description: >-
    Nginx 是高性能 Web 服务器和反向代理，常用于静态资源服务、负载均衡和应用入口代理。该模板通过请求目标服务并检查预设路径或首页响应、HTTP 响应头、正则特征、状态码等指纹特征，判断目标是否使用或暴露了
    Nginx 相关组件；命中结果仅表示指纹特征匹配，可用于资产盘点、技术栈识别和后续安全评估，不代表已确认存在可利用漏洞。
  metadata:
    max-request: 1
  tags: tech,nginx,discovery
http:
  - method: GET
    path:
      - "{{BaseURL}}"

    matchers-condition: and
    matchers:
      - type: regex
        part: header
        regex:
          - 'nginx/[0-9.]+'

      - type: status
        status:
          - 200

    extractors:
      - type: regex
        part: header
        regex:
          - 'nginx/[0-9.]+'
