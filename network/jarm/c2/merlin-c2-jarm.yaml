id: merlin-c2-jarm

info:
  name: Merlin C2 JARM 识别（C2 识别）
  author: pussycat0x
  severity: high
  description: |
    Merlin 是基于 Go 的跨平台 C2 框架，支持多种通信方式和 Agent 管理能力。该模板计算目标 TLS 服务的 JARM 指纹，并与已知 Merlin C2 指纹匹配，用于识别疑似 Merlin 命令控制基础设施。
  reference:
    - https://github.com/cedowens/C2-JARM
    - https://merlin-c2.readthedocs.io/en/latest/
  metadata:
    max-request: 1
  tags: jarm,network,c2,ir,osint,cti,merlin,tcp,vuln
tcp:
  - inputs:
      - data: 2E
        type: hex
    host:
      - "{{Hostname}}"
    matchers:
      - type: dsl
        dsl:
          - "jarm(Hostname) == '29d21b20d29d29d21c41d21b21b41d494e0df9532e75299f15ba73156cee38'"
