id: sphinxonline-panel

info:
  name: SphinxOnline 面板识别（暴露面识别）
  author: righettod
  severity: info
  description: |
    该模板通过识别 SphinxOnline 登录入口的页面标题、特征文本或重定向行为，判断目标是否暴露了对应的认证界面。若命中，说明该登录面板对外可访问，可用于暴露面梳理与后续安全评估。
  reference:
    - https://www.lesphinx-developpement.fr/
  metadata:
    verified: true
    max-request: 1
    shodan-query: http.title:"Connection - SphinxOnline"
  tags: panel,sphinxonline,login,detect,discovery

http:
  - method: GET
    path:
      - '{{BaseURL}}/SphinxAuth/Account/Login'

    matchers-condition: and
    matchers:
      - type: word
        part: body
        words:
          - '<title>Connection - SphinxOnline</title>'
          - 'SphinxOnline</span>'
        condition: or
        case-insensitive: true

      - type: status
        status:
          - 200

    extractors:
      - type: regex
        part: body
        group: 1
        regex:
          - 'Sphinxonline ([a-f0-9.]+)</a>'
