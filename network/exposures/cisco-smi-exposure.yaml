id: cisco-smi-exposure

info:
  name: Cisco Smart Install 端点暴露（服务漏洞）
  author: dwisiswant0
  severity: medium
  description: |
    Cisco Smart Install 用于 Cisco 交换机零接触部署和集中配置分发，若部署完成后仍在 TCP 4786 暴露且缺少访问控制，可能被远程滥用读取或改写设备配置。该模板发送 Smart Install 客户端探测报文，并以 Cisco SMI 协议响应确认端点暴露。
  impact: |
    - 暴露的 Smart Install 客户端可能被用于下载配置、修改启动配置、加载镜像或触发设备重启。
    - 攻击者可借此获取网络设备凭据、SNMP 团体字串、拓扑信息，并进一步控制交换基础设施。
  remediation: |
    - 按 Cisco 建议在不需要 Smart Install 时禁用该功能，例如使用 `no vstack` 或升级到不受影响的软件版本。
    - 在边界和管理平面 ACL 中限制 TCP 4786，仅允许受控管理源访问，并排查互联网上暴露的 SMI 客户端。
  reference:
    - https://blog.talosintelligence.com/2017/02/cisco-coverage-for-smart-install-client.html
    - https://blogs.cisco.com/security/cisco-psirt-mitigating-and-detecting-potential-abuse-of-cisco-smart-install-feature
    - https://tools.cisco.com/security/center/content/CiscoSecurityResponse/cisco-sr-20170214-smi
    - https://github.com/Cisco-Talos/smi_check/blob/master/smi_check.py#L52-L53
    - https://github.com/Sab0tag3d/SIET
  classification:
    cvss-metrics: CVSS:3.0/AV:N/AC:L/PR:N/UI:N/S:U/C:L/I:N/A:N
    cvss-score: 5.3
    cwe-id: CWE-200
  metadata:
    max-request: 1
  tags: network,cisco,smi,exposure,tcp,discovery

tcp:
  - inputs:
      - data: "000000010000000100000004000000080000000100000000"
        type: hex

    host:
      - "{{Hostname}}"
    port: 4786

    matchers:
      - type: word
        encoding: hex
        words:
          - "000000040000000000000003000000080000000100000000"
