id: apache-tomcat-ajp-protocol-detect

info:
  name: Apache Tomcat AJP 协议识别（指纹识别）
  author: pussycat0x
  severity: info
  description: |
    Apache Tomcat AJP 是 Web 服务器与 Tomcat 后端容器之间转发请求的二进制协议，常见于 Apache HTTP Server、IIS 等前置服务器与 Tomcat 集成场景。该模板向 TCP 8009 端口发送 AJP CPing 探测报文，并根据返回的 CPong 响应头 `AB\x00\x01` 判断目标是否暴露 AJP13 协议；命中仅表示服务指纹存在，不单独证明存在具体漏洞。
  reference:
    - https://tomcat.apache.org/connectors-doc/ajp/ajpv13a.html
  metadata:
    verified: true
    shodan-query: 'port:8009 product:"Apache Tomcat"'
    max-request: 1
    vendor: apache
    product: tomcat
  tags: js,network,detect,tomcat,apache,tcp,discovery

javascript:
  - pre-condition: |
      isPortOpen(Host,Port);
    code: |
      let packet = bytes.NewBuffer();
      let ajp_ping = "\x12\x34\x00\x01\x0a"
      data = packet.Write(ajp_ping )
      const c = require("nuclei/net");
      let conn = c.Open('tcp', `${Host}:${Port}`);
      conn.Send(data);
      let resp = conn.RecvFullString();
      // AJP messages start with "AB"
      if (resp.includes("AB\x00\x01")) {
        Export("AJP Detected");
      } else {
        conn.Close();
      }

    args:
      Host: "{{Host}}"
      Port: 8009

    extractors:
      - type: dsl
        dsl:
          - response
