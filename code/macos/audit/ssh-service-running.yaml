id: ssh-service-running

info:
  name: macOS SSH 服务正在运行（本地基线扫描）
  author: geeknik
  severity: info
  description: |
    该模板检查 macOS Remote Login/SSH 服务是否运行。无需求时启用 SSH 会增加远程登录攻击面。
  impact: |
    不必要的登录入口会增加未授权访问、暴力破解或设备丢失后的数据暴露风险。
  remediation: |
    如无远程管理需求，关闭 Remote Login/SSH；如必须启用，应限制来源并使用密钥认证。
  tags: macos,audit,local,security,ssh

self-contained: true

code:
  - engine:
      - sh
      - bash
    source: |
      launchctl print system/com.openssh.sshd 2>&1
    matchers-condition: and
    matchers:
      - type: status
        status:
          - 0
      - type: word
        words:
          - "state = running"
          - "com.openssh.sshd"
