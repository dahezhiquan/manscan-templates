id: mt-bank-phish

info:
  name: M&T Bank 仿冒钓鱼网站（钓鱼网站识别）
  author: rxerium
  severity: info
  description: |
    检测到疑似仿冒 M&T Bank 的钓鱼网站。模板在目标页面返回 200、页面内容命中 M&T Bank 的金融或支付页面特征，且当前主机不属于 mtb.com 官方域名时触发，用于识别借用 M&T Bank 品牌页面诱导用户信任的仿冒站点。
  reference:
    - https://mtb.com
  metadata:
    max-request: 1
  tags: phishing,mt-bank,bank,osint,discovery
http:
  - method: GET
    path:
      - "{{BaseURL}}"

    host-redirects: true
    max-redirects: 2

    matchers-condition: and
    matchers:
      - type: word
        words:
          - "With a community bank approach, M&T Bank helps people reach their personal and business goals with banking, mortgage, loan and investment services."

      - type: status
        status:
          - 200

      - type: dsl
        dsl:
          - '!contains(host,"mtb.com")'
