id: apache-nifi-detect

info:
  name: Apache NiFi 指纹识别（指纹识别）
  author: dwisiswant0
  severity: info
  description: Apache NiFi 是数据流自动化平台，用于可视化编排数据采集、路由、转换和传输流程。该模板请求 `/access/config`、`/controller/config`、`/controller/registry-clients` 等路径，并依据 HTTP 200 状态码、页面标题、正文关键字或品牌资源特征识别目标是否使用或暴露了 Apache NiFi 相关组件，适用于资产盘点、技术栈识别和后续安全评估；命中结果仅表示指纹特征匹配，不代表已确认存在可利用漏洞。
  metadata:
    max-request: 7
  tags: tech,apache,nifi,discovery

http:
  - method: GET
    path:
      - "{{BaseURL}}/access/config"
      - "{{BaseURL}}/controller/config"
      - "{{BaseURL}}/controller/registry-clients"
      - "{{BaseURL}}/counters"
      - "{{BaseURL}}/flow/registries"
      - "{{BaseURL}}/system-diagnostics"
      - "{{BaseURL}}/nifi-api/access/config"

    stop-at-first-match: true

    matchers-condition: and
    matchers:
      - type: regex
        part: body
        regex:
          - "supportsLogin"
          - "disconnectedNodeAcknowledged"
          - "(aggregate|node)Snapshots?"
        condition: or

      - type: status
        status:
          - 200
