id: tembosocial-panel

info:
  name: TemboSocial Admin 面板识别（暴露面识别）
  author: DhiyaneshDK
  severity: info
  description: 该模板通过识别 TemboSocial Admin 面板、控制台或管理界面的页面特征，判断目标是否暴露了对应服务入口。若命中，说明该后台或运维界面对外可访问，可用于资产识别与暴露面排查。
  classification:
    cvss-metrics: CVSS:3.0/AV:N/AC:L/PR:N/UI:N/S:U/C:N/I:N/A:N
    cwe-id: CWE-200
  metadata:
    verified: true
    max-request: 1
    shodan-query: title:"TemboSocial Administration"
  tags: panel,tembosocial,discovery

http:
  - method: GET
    path:
      - "{{BaseURL}}/admin.php"

    host-redirects: true
    max-redirects: 2

    matchers-condition: and
    matchers:
      - type: word
        words:
          - '<title>TemboSocial Administration</title>'

      - type: status
        status:
          - 200
