id: discord-invite-detect

info:
  name: Discord 邀请链接检测
  author: rxerium
  severity: low
  description: |
    检测页面中是否存在面向用户、机器人或服务器的 Discord 邀请链接。该信息可用于发现公开社群入口或关联资产。
  impact: |
    - 命中内容可用于资产画像、人员/社群关联、公开目录发现或业务线索收集。
    - 单独结果通常不等同于漏洞，但与其他信息组合后可能降低攻击者侦察成本。
  remediation: |
    - 确认公开信息是否符合预期，移除不必要的联系人、目录、社群或资源索引。
    - 对必须公开的文件和链接进行最小化披露，避免包含内部路径或敏感标识。
    - 定期巡检公开页面，确保内容仍然准确且未泄露额外信息。
  reference:
    - https://discord.com
  tags: discord,info,osint,misc,vuln

http:
  - method: GET
    path:
      - "{{BaseURL}}"

    extractors:
      - type: regex
        name: discord-server-invite
        regex:
          - "https?:\\/\\/(?:www\\.)?discord\\.gg\\/([a-zA-Z0-9-]+)"

      - type: regex
        name: discord-user-invite
        regex:
          - "https?:\\/\\/discord\\.com\\/users\\/([0-9]+)"

      - type: regex
        name: discord-bot-invite
        regex:
          - "https?:\\/\\/discord\\.com\\/oauth2\\/authorize\\?client_id=([0-9]+)[^\\s\"']*"
