id: pocketbase-detect

info:
  name: PocketBase 指纹识别（指纹识别）
  author: aykutgokbulut
  severity: info
  description: >-
    PocketBase 是轻量级开源后端平台，内置数据库、认证、文件存储和实时 API。该模板通过请求目标服务并检查预设路径或首页响应、页面正文关键字、状态码等指纹特征，判断目标是否使用或暴露了
    PocketBase 相关组件；命中结果仅表示指纹特征匹配，可用于资产盘点、技术栈识别和后续安全评估，不代表已确认存在可利用漏洞。
  reference:
  - https://pocketbase.io/
  metadata:
    verified: true
    max-request: 1
    vendor: pocketbase
    product: pocketbase
    shodan-query: http.favicon.hash:981081715
  tags: tech,pocketbase,detect,discovery
http:
  - method: GET
    path:
      - "{{BaseURL}}"

    host-redirects: true
    max-redirects: 3

    matchers-condition: and
    matchers:
      - type: word
        part: body
        words:
          - '<title>PocketBase'

      - type: status
        status:
          - 200
