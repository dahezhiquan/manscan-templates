id: saltbo-zpan-panel

info:
  name: Saltbo/zpan 登录面板识别（指纹识别）
  author: ritikchaddha
  severity: info
  description: |-
    Saltbo/zpan 是自托管网盘或文件管理平台，用于文件上传、分享和用户访问管理。该模板请求首页，并依据 HTTP 200 状态码、页面标题、正文关键字或品牌资源特征识别目标是否部署了该系统或暴露了对应入口，适用于资产指纹确认；命中结果仅表示系统特征匹配，不代表已确认存在未授权访问或可利用漏洞。
  reference:
  - https://github.com/saltbo/zpan
  classification:
    cpe: cpe:2.3:a:saltbo:zpan:*:*:*:*:*:*:*:*
  metadata:
    verified: true
    max-request: 1
    vendor: saltbo
    product: zpan
    fofa-query: title="zpan"
    shodan-query: title:"zpan"
  tags: panel,zpan,login,detect,discovery

http:
  - method: GET
    path:
      - "{{BaseURL}}"

    host-redirects: true

    matchers-condition: and
    matchers:
      - type: word
        part: body
        words:
          - "<title>ZPan"

      - type: status
        status:
          - 200
