id: guest-user-enabled

info:
  name: macOS 访客用户已启用（本地基线扫描）
  author: geeknik
  severity: medium
  description: |
    该模板检查 macOS Guest 访客账户是否启用。启用后任何人都可能在设备上建立临时会话。
  impact: |
    不必要的登录入口会增加未授权访问、暴力破解或设备丢失后的数据暴露风险。
  remediation: |
    禁用自动登录或访客账户，确保访问设备需要强身份验证。
  tags: macos,audit,local,security

self-contained: true

code:
  - engine:
      - sh
      - bash
    source: |
      defaults read /Library/Preferences/com.apple.loginwindow GuestEnabled 2>&1
    matchers-condition: and
    matchers:
      - type: status
        status:
          - 0
      - type: regex
        regex:
          - "^1$"
