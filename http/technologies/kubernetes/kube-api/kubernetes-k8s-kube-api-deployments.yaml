id: kubernetes-k8s-kube-api-deployments

info:
  name: Kubernetes API Deployments 指纹识别（指纹识别）
  author: sharath
  severity: info
  description: >-
    Kubernetes API Server 是集群控制面的核心接口，Deployments 资源用于声明和管理无状态应用副本。该模板通过请求目标服务并检查预设路径或首页响应、页面正文关键字、状态码等指纹特征，判断目标是否使用或暴露了
    Kubernetes API Deployments 相关组件；命中结果仅表示指纹特征匹配，可用于资产盘点、技术栈识别和后续安全评估，不代表已确认存在可利用漏洞。
  metadata:
    max-request: 1
  tags: tech,kubernetes,devops,kube,discovery
http:
  - method: GET
    path:
      - "{{BaseURL}}/apis/apps/v1/namespaces/default/deployments"

    matchers-condition: and
    matchers:
      - type: status
        status:
          - 200

      - type: word
        part: body
        words:
          - '"DeploymentList":'
          - '"items":'
        condition: and
