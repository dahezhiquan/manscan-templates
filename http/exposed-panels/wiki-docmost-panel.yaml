id: wiki-docmost-panel

info:
  name: Docmost 面板识别（指纹识别）
  author: ChrisJr404
  severity: info
  description: |-
    Docmost 是自托管协作文档和知识库平台，用于团队页面、空间和文档管理。该模板请求首页，并依据 DSL 条件识别目标是否部署了该系统或暴露了对应入口，适用于资产指纹确认；命中结果仅表示系统特征匹配，不代表已确认存在未授权访问或可利用漏洞。
  reference:
  - https://github.com/docmost/docmost
  - https://docmost.com/
  metadata:
    verified: false
    max-request: 1
    vendor: docmost
    product: docmost
    shodan-query: http.title:"Docmost"
    fofa-query: title="Docmost"
  tags: panel,docmost,wiki,selfhosted,detect,discovery

http:
  - method: GET
    path:
      - "{{BaseURL}}"

    host-redirects: true
    max-redirects: 2

    matchers:
      - type: dsl
        dsl:
          - "status_code == 200"
          - "contains_all(to_lower(body), \"<title>docmost</title>\", \"apple-mobile-web-app-title\")"
        condition: and
