id: gcloud-pg-log-parser-stats-enabled

info:
  name: PostgreSQL 数据库实例启用了 log_parser_stats（云安全）
  author: princechaddha
  severity: medium
  description: PostgreSQL log_parser_stats 会记录解析器统计信息，适合短期调试，不适合作为生产环境长期配置。本模板检查 Cloud SQL PostgreSQL 实例 databaseFlags 中 log_parser_stats 的值，匹配 on 时报告该统计日志已启用。
  impact: |
    - 解析器统计日志会增加日志噪声和存储成本，降低关键安全日志的可见性。
    - 长期启用可能暴露查询结构和执行细节，并对数据库性能造成额外负担。
  remediation: |
    - 关闭 log_parser_stats，仅在受控诊断期间临时启用。
    - 使用 Query Insights、监控指标或短期采样完成性能分析后，及时恢复安全基线。
  reference:
    - https://cloud.google.com/sql/docs/postgres/flags
  metadata:
    vendor: google
    product: cloud-sql
  tags: cloud,devops,gcp,gcloud,google-cloud-sql,postgresql,gcp-cloud-config

flow: |
  code(1)
  for(let projectId of iterate(template.projectIds)){
    set("projectId", projectId)
    code(2)
    for(let sqlInstance of iterate(template.sqlInstances)){
      set("sqlInstance", sqlInstance)
      code(3)
    }
  }

self-contained: true

code:
  - engine:
      - sh
      - bash
    source: |
      gcloud projects list --format="json(projectId)"

    extractors:
      - type: json
        name: projectIds
        internal: true
        json:
          - '.[].projectId'

  - engine:
      - sh
      - bash
    source: |
      gcloud sql instances list --project $projectId --filter='DATABASE_VERSION:POSTGRES*' --format="json(name)"

    extractors:
      - type: json
        name: sqlInstances
        internal: true
        json:
          - '.[].name'

  - engine:
      - sh
      - bash
    source: |
      gcloud sql instances describe $sqlInstance --project $projectId --format=json | jq '.settings.databaseFlags // [] | map(select(.name=="log_parser_stats")) | .[].value'

    matchers:
      - type: word
        words:
          - 'on'

    extractors:
      - type: dsl
        dsl:
          - '"The log_parser_stats flag is enabled for PostgreSQL instance " + sqlInstance + " in project " + projectId'
