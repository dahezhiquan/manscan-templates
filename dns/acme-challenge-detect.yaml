id: acme-challenge-detect

info:
  name: ACME DNS-01 验证记录识别（dns）
  author: rxerium
  severity: info
  description: |
    该模板检测 _acme-challenge 等 ACME DNS-01 验证记录，这类记录通常由 Let's Encrypt 或其他证书颁发机构用于验证域名控制权。
  reference:
    - https://www.rfc-editor.org/rfc/rfc8555
    - https://letsencrypt.org/docs/challenge-types/
  metadata:
    max-request: 1
  tags: dns,acme,letsencrypt,certificate,discovery

dns:
  - name: "_acme-challenge.{{FQDN}}"
    type: TXT

    matchers:
      - type: regex
        regex:
          - "IN\tTXT"
          - "[A-Za-z0-9_-]{43}"

    extractors:
      - type: regex
        regex:
          - 'TXT\s+"([^"]+)"'
