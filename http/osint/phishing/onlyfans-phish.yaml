id: onlyfans-phish

info:
  name: OnlyFans 仿冒钓鱼网站（钓鱼网站识别）
  author: rxerium
  severity: info
  description: |
    检测到疑似仿冒 OnlyFans 的钓鱼网站。模板在目标页面返回 200、页面内容命中 OnlyFans 的官方服务页面特征，且当前主机不属于 onlyfans.com 官方域名时触发，用于识别借用 OnlyFans 品牌页面诱导用户信任的仿冒站点。
  reference:
    - https://onlyfans.com
  metadata:
    max-request: 1
  tags: phishing,onlyfans,osint,discovery
http:
  - method: GET
    path:
      - "{{BaseURL}}"

    host-redirects: true
    max-redirects: 2

    matchers-condition: and
    matchers:
      - type: word
        words:
          - '<title>OnlyFans'
          - 'OnlyFans is the social platform revolutionizing creator and fan connections. The site is inclusive of artists and content creators from all genres and allows them to monetize their content while developing authentic relationships with their fanbase.'
        condition: and

      - type: status
        status:
          - 200

      - type: dsl
        dsl:
          - '!contains(host,"onlyfans.com")'
