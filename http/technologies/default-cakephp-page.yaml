id: default-cakephp-page

info:
  name: CakePHP 默认页面 指纹识别（指纹识别）
  author: DhiyaneshDK
  severity: info
  description: CakePHP 默认页面 是 PHP Web 应用框架，用于 MVC 应用、路由和数据库访问。该模板请求首页，并依据 HTTP 200 状态码、页面标题、正文关键字或品牌资源特征识别目标是否使用或暴露了 CakePHP 默认页面 相关组件，适用于资产盘点、技术栈识别和后续安全评估；命中结果仅表示指纹特征匹配，不代表已确认存在可利用漏洞。
  classification:
    cpe: cpe:2.3:a:cakephp:cakephp:*:*:*:*:*:*:*:*
  metadata:
    verified: true
    max-request: 1
    vendor: cakephp
    product: cakephp
    shodan-query: html:"Welcome to CakePHP"
  tags: tech,cakephp,default-page,discovery

http:
  - method: GET
    path:
      - '{{BaseURL}}'

    matchers-condition: and
    matchers:
      - type: word
        part: body
        words:
          - 'Welcome to CakePHP'
          - 'CakePHP Issues'
        condition: and

      - type: status
        status:
          - 200

    extractors:
      - type: regex
        part: body
        group: 1
        regex:
          - "Welcome to CakePHP ([0-9.]+)"
