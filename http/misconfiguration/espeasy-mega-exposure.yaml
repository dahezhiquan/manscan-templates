id: espeasy-mega-exposure

info:
  name: ESPEasy Mega 面板 暴露
  author: ritikchaddha
  severity: high
  description: |
    检测到 ESPEasy Mega 面板 暴露。目标响应或文件中可能暴露配置、凭据、密钥、令牌、环境变量或历史记录等敏感信息，可能被用于进一步入侵。
  metadata:
    verified: true
    max-request: 1
    shodan-query: http.html:"ESP Easy Mega"
  tags: misconfig,espeasy,exposure,vuln

http:
  - method: GET
    path:
      - "{{BaseURL}}"

    matchers-condition: and
    matchers:
      - type: word
        part: body
        words:
          - "ESP Easy Mega:"
          - "Config"
          - "Tools"
        condition: and

      - type: status
        status:
          - 200
