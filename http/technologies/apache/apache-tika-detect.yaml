id: apache-tika-detect

info:
  name: Apache Tika 指纹识别（指纹识别）
  author: icarot
  severity: info
  description: |-
    Apache Tika 是内容分析工具包，用于识别文件类型、提取元数据和文本内容。该模板请求首页、`/tika`、`/version`，并依据 HTTP 200 状态码、页面标题、正文关键字或品牌资源特征识别目标是否使用或暴露了 Apache Tika 相关组件，适用于资产盘点、技术栈识别和后续安全评估；命中结果仅表示指纹特征匹配，不代表已确认存在可利用漏洞。
  reference:
  - https://github.com/apache/tika/
  classification:
    cpe: cpe:2.3:a:apache:tika:*:*:*:*:*:*:*:*
  metadata:
    max-request: 3
    shodan-query: title:"Welcome to the Apache Tika"
    vendor: apache
    product: tika
  tags: tech,tika,apache,detect

http:
  - method: GET
    path:
      - "{{BaseURL}}/"
      - "{{BaseURL}}/tika"
      - "{{BaseURL}}/version"

    stop-at-first-match: true

    matchers-condition: and
    matchers:
      - type: word
        words:
          - 'Apache Tika'
          - 'apache.tika'
        condition: and

      - type: status
        status:
          - 200

    extractors:
      - type: regex
        part: response
        regex:
          - "Apache Tika [0-9]{1,3}\\.[0-9]{1,3}\\.[0-9]{1,3}"
