id: gcloud-iam-separation-duties

info:
  name: Enforce Separation of Duties 的Service-Account Related Roles（云安全）
  author: princechaddha
  severity: medium
  description: 同一主体同时拥有服务账号管理和服务账号使用权限会削弱职责分离，可能形成创建、修改并冒用服务账号的权限链。本模板遍历项目 IAM bindings，并通过脚本检查 Service Account Admin 与 Service Account User 角色的职责分离违规。
  impact: |
    - 身份被攻破后，攻击者可能管理服务账号并借助其权限访问更多云资源。
    - 缺少职责分离会增加权限提升、持久化和审计责任不清的风险。
  remediation: |
    - 将服务账号管理和服务账号使用权限分配给不同职责的组或自动化身份，避免同一成员同时持有。
    - 对已有例外配置建立审批、到期时间和定期审计，优先使用更细粒度的预定义或自定义角色。
  reference:
    - https://cloud.google.com/iam/docs/understanding-roles
  metadata:
    vendor: google
    product: cloud-iam
  tags: cloud,devops,gcp,gcloud,google-cloud-iam,gcp-cloud-config

flow: |
  code(1)
  for(let projectId of iterate(template.projectIds)){
    set("projectId", projectId)
    code(2)
    for(let binding of iterate(template.bindings)){
      set("binding", binding)
      javascript(1)
    }
  }

self-contained: true

code:
  - engine:
      - sh
      - bash
    source: |
      gcloud projects list --format="json(projectId)"

    extractors:
      - type: json
        name: projectIds
        internal: true
        json:
          - '.[].projectId'

  - engine:
      - sh
      - bash
    source: |
      gcloud projects get-iam-policy $projectId --format="json"

    extractors:
      - type: json
        name: bindings
        internal: true
        json:
          - '.bindings[]'

javascript:
  - code: |
      if (template.binding && Array.isArray(template.binding.members) && template.binding.role) {
        let roles = new Set();
        template.binding.members.forEach(member => {
          roles.add(template.binding.role);
        });
        if (roles.has('roles/iam.serviceAccountAdmin') && roles.has('roles/iam.serviceAccountUser')) {
          Export("Violation of SoD: Both Service Account Admin and User roles are assigned to one or more members in Project: " + template.projectId);
        }
      }

    extractors:
      - type: dsl
        dsl:
          - response
