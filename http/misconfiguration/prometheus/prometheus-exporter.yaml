id: prometheus-exporter

info:
  name: Prometheus Exporter 暴露
  author: jarijaas
  severity: medium
  description: |
    该模板用于核查 Prometheus Exporter 暴露。该类问题通常源于 Prometheus、Exporter、监控端点或服务指标接口未加访问控制而暴露。模板会向目标发送探测请求，并依据匹配 `Exporter`、匹配 `<a href="/metrics">Metrics</a>`、匹配 `<title>(.*?)</title>`等证据确认目标是否存在该配置问题。
  impact: |
    - 攻击者可获取主机、容器、服务版本、资源使用、网络接口、文件系统或集群状态等运行信息。
    - 指标信息可辅助攻击者绘制内部架构、识别高价值节点并制定后续攻击路径。
  remediation: |
    - 为指标端点增加认证授权、来源限制或仅绑定内网监听地址。
    - 通过反向代理、服务网格或监控采集器收敛访问路径，避免公网直接访问。
    - 审计已暴露的指标内容，确认是否包含主机名、版本、标签或业务敏感标识。
  reference:
    - https://github.com/prometheus/prometheus/wiki/Default-port-allocations
  metadata:
    max-request: 1
  tags: prometheus,misconfig,vuln

http:
  - method: GET
    path:
      - "{{BaseURL}}"

    matchers-condition: and
    matchers:
      - type: word
        words:
          - 'Exporter'
          - '<a href="/metrics">Metrics</a>'
        condition: and

    extractors:
      - type: regex
        part: body
        group: 1
        regex:
          - "<title>(.*?)</title>"
