id: gcloud-vm-public-ip-enabled

info:
  name: VM Instance Using Public IP Address（云安全）
  author: princechaddha
  severity: high
  description: Compute Engine 实例配置外部访问入口时会扩大互联网暴露面，尤其是管理端口或内部服务未充分限制时风险更高。本模板检查实例 networkInterfaces[].accessConfigs，用于发现配置了公网访问能力的 VM。
  impact: |
    - 实例上的 SSH、RDP、Web 或自定义服务可能被互联网扫描和攻击。
    - 公网入口会绕过仅依赖私网边界的防护假设，增加补丁、认证和防火墙配置失误的影响面。
  remediation: |
    - 移除不必要的外部 IP，优先通过负载均衡、IAP、VPN、Bastion 或私有连接访问实例。
    - 对必须公网暴露的实例收敛防火墙来源、启用强认证和日志监控，并定期复核开放端口。
  reference:
    - https://www.trendmicro.com/cloudoneconformity/knowledge-base/gcp/ComputeEngine/instances-with-public-ip-addresses.html
    - https://cloud.google.com/compute/docs/ip-addresses/reserve-static-external-ip-address
  metadata:
    vendor: google
    product: compute-engine
  tags: cloud,devops,gcp,gcloud,compute,security,networking,public-ip,gcp-cloud-config

flow: |
  code(1)
  for(let projectId of iterate(template.projectIds)){
    set("projectId", projectId)
    code(2)
    for(let instance of iterate(template.instances)){
      instance = JSON.parse(instance)
      set("instanceName", instance.name)
      set("zone", instance.zone)
      code(3)
    }
  }

self-contained: true

code:
  - engine:
      - sh
      - bash
    source: |
      gcloud projects list --format="json(projectId)"

    extractors:
      - type: json
        name: projectIds
        internal: true
        json:
          - '.[].projectId'

  - engine:
      - sh
      - bash
    source: |
      gcloud compute instances list --project $projectId --format="json(name,zone.basename())"

    extractors:
      - type: json
        name: instances
        internal: true
        json:
          - '.[]'

  - engine:
      - sh
      - bash
    source: |
      gcloud compute instances describe $instanceName --zone $zone --project $projectId --format="json(networkInterfaces[].accessConfigs)"

    matchers-condition: and
    matchers:
      - type: word
        words:
          - '"natIP":'
        negative: true

      - type: word
        words:
          - '"accessConfigs":'

    extractors:
      - type: dsl
        dsl:
          - '"VM instance " + instanceName + " in zone " + zone + " of project " + projectId + " has a public IP address configured"'
