id: obsolete-ssh-version

info:
  name: SSHv1 遗留协议启用（服务漏洞）
  author: pussycat0x
  severity: medium
  description: |
    SSH Protocol Version 1 是已淘汰的远程管理协议版本，缺少现代 SSHv2 的完整性和密钥协商安全能力。该模板建立 SSH 信息探测连接，读取服务端协议版本，并在返回的 ProtoVersion 为 1.0 时确认目标仍启用 SSHv1。
  impact: |
    - SSHv1 协议缺少现代完整性和加密保护，容易受到中间人、会话劫持或降级类攻击影响。
    - 继续支持 SSHv1 会暴露遗留客户端兼容面，并降低远程管理入口整体安全性。
  remediation: |
    - 禁用 SSH Protocol 1，仅允许 SSH Protocol 2。
    - 升级 SSH 服务端到受支持版本，并移除依赖 SSHv1 的旧客户端。
  reference:
    - https://nmap.org/nsedoc/scripts/sshv1.html
  metadata:
    max-request: 2
    shodan-query: port:22
  tags: enum,js,ssh,network,discovery

javascript:
  - pre-condition: |
      isPortOpen(Host,Port)
    code: |
      var m = require("nuclei/ssh");
      var c = m.SSHClient();
      var response = c.ConnectSSHInfoMode(Host, Port);
      Export(response);

    args:
      Host: "{{Host}}"
      Port: "22"

    matchers:
      - type: dsl
        dsl:
          - "success == true"
          - "version == '1.0'"
        condition: and

    extractors:
      - type: json
        name: SSH Protocol Version
        json:
          - '.ServerID.ProtoVersion'

      - type: json
        internal: true
        name: version
        json:
          - '.ServerID.ProtoVersion'
