id: api-dbt

info:
  name: dbt Cloud API Token 可用性校验（token喷洒）
  author: dwisiswant0
  severity: info
  description: 该模板通过调用 dbt Cloud API 的已知接口验证提供的 token 是否有效，命中后通常表示可访问数据管理与集成能力。
  reference:
    - https://docs.getdbt.com/docs/introduction
  classification:
    cvss-metrics: CVSS:3.1/AV:N/AC:L/PR:N/UI:N/S:U/C:N/I:N/A:N
    cvss-score: 0
    cwe-id: CWE-200
  metadata:
    max-request: 1
  tags: token-spray,dbt

self-contained: true

http:
  - method: GET
    path:
      - "https://cloud.getdbt.com/api/v2/accounts/"

    headers:
      Content-Type: application/json
      Authorization: Token {{token}}
    matchers:
      - type: word
        part: body
        words:
          - "Invalid token"
          - "Authentication credentials were not provided."
          - "User API Keys are deprecated"
        condition: or
        negative: true
