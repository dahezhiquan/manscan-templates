id: azure-vm-poweroff-unalerted
info:
  name: Azure 虚拟机关机告警未配置（云安全）
  author: princechaddha
  severity: high
  description: 虚拟机关机会停止操作系统和工作负载运行，未配置 Activity Log 告警时，异常关机可能不被及时发现。该模板枚举已启用的 Activity Log Alert，并检查 condition 是否缺少 Microsoft.Compute/virtualMachines/powerOff/action 操作条件。
  impact: |
    - 生产虚拟机被异常关机可能造成服务中断、未提交数据丢失和任务失败。
    - 攻击者可借助关机破坏监控、代理或取证环境，扩大事件响应难度。
  remediation: |
    - 创建针对虚拟机关机操作的 Activity Log Alert，并将告警发送到业务和安全值班渠道。
    - 限制关机权限，结合应用健康检查、自动恢复和变更审批及时恢复异常停止的实例。
  reference:
    - https://docs.microsoft.com/en-us/azure/azure-monitor/platform/alerts-activity-log
  metadata:
    vendor: microsoft
    product: azure-monitor
  tags: cloud,devops,azure,microsoft,virtual-machines,azure-cloud-config

flow: |
  code(1);
  for (let AlertData of iterate(template.alertList)) {
    set("id", AlertData);
    code(2);
  }

self-contained: true
code:
  - engine:
      - sh
      - bash
    source: |
      az monitor activity-log alert list --output json --query '[?(enabled==`true`)].id'

    extractors:
      - type: json
        name: alertList
        internal: true
        json:
          - '.[]'

  - engine:
      - sh
      - bash
    source: |
      az monitor activity-log alert show --ids "$id" --query 'condition'

    matchers-condition: and
    matchers:
      - type: word
        words:
          - '"field": "operationName"'

      - type: word
        words:
          - "Microsoft.Compute/virtualMachines/powerOff/action"
        negative: true

    extractors:
      - type: dsl
        dsl:
          - 'id + " does not have the correct alert configuration for Power Off Virtual Machine events"'
