id: dionaea-ftp-honeypot-detect

info:
  name: Dionaea FTP 蜜罐识别（蜜罐识别）
  author: UnaPibaGeek
  severity: info
  description: |
    Dionaea 是用于捕获恶意软件传播、漏洞利用和弱口令行为的低交互蜜罐框架，可模拟 FTP 等多种服务。该模板发送 `USER root` 和空 `PASS` 登录探测，并通过 `500 Syntax error: PASS requires an argument` 响应识别 Dionaea FTP 蜜罐。
  metadata:
    max-request: 1
    vendor: dionaea
    product: ftp
  tags: dionaea,ftp,honeypot,ir,cti,network,tcp,discovery
tcp:
  - inputs:
      - data: "USER root\r\n"
        read: 1024
      - data: "PASS \r\n"
        read: 1024

    host:
      - "{{Hostname}}"
    port: 21
    read-size: 2048

    matchers:
      - type: word
        words:
          - "500 Syntax error: PASS requires an argument"
