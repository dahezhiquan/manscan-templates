id: matomo-panel

info:
  name: Matomo 面板识别（指纹识别）
  author: Arr0way,userdehghani
  severity: info
  description: |-
    检测到目标站点存在 Matomo 相关响应特征。Matomo 是网站访问分析平台，用于统计访问量、来源、用户行为、转化和隐私友好的 Web 分析数据。模板请求 `/`、`/index.php`、`/plugins/CoreHome/images/favicon.png` 路径，并通过页面标题或正文关键字、状态码、favicon 哈希、DSL 条件确认该系统指纹，用于资产识别、系统盘点和暴露面梳理。
  reference:
    - https://matomo.org/
    - https://matomo.org/faq/on-premise/installing-matomo/#getting-started
  classification:
    cvss-metrics: CVSS:3.0/AV:N/AC:L/PR:N/UI:N/S:U/C:N/I:N/A:N
    cwe-id: CWE-200
    cpe: cpe:2.3:a:matomo:matomo:*:*:*:*:*:*:*:*
  metadata:
    verified: true
    max-request: 3
    vendor: matomo
    product: matomo
    shodan-query:
      - "http.favicon.hash:-2023266783"
      - cpe:"cpe:2.3:a:matomo:matomo"
    fofa-query: icon_hash=-2023266783
  tags: panel,matomo,login,detect,discovery
http:
  - method: GET
    path:
      - "{{BaseURL}}"
      - "{{BaseURL}}/index.php"
      - "{{BaseURL}}/plugins/CoreHome/images/favicon.png"

    stop-at-first-match: true
    matchers-condition: or
    matchers:
      - type: word
        part: body
        words:
          - 'Sign in - Matomo'
          - 'content="Matomo'
          - 'title="Matomo'
        condition: or
        case-insensitive: true

      - type: dsl
        dsl:
          - "status_code==200 && (\"-2023266783\" == mmh3(base64_py(body)))"
