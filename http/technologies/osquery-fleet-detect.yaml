id: osquery-fleet-detect

info:
  name: osquery Fleet 指纹识别（指纹识别）
  author: Adam Crosser
  severity: info
  description: >-
    Fleet 是 osquery 的集中管理平台，用于终端查询、策略、资产清单和安全可观测性管理。该模板通过请求目标服务并检查预设路径或首页响应、页面正文关键字、状态码等指纹特征，判断目标是否使用或暴露了
    osquery Fleet 相关组件；命中结果仅表示指纹特征匹配，可用于资产盘点、技术栈识别和后续安全评估，不代表已确认存在可利用漏洞。
  reference:
  - https://fleetdm.com/
  classification:
    cvss-metrics: CVSS:3.0/AV:N/AC:L/PR:N/UI:N/S:U/C:N/I:N/A:N
    cvss-score: 0
    cwe-id: CWE-200
    cpe: cpe:2.3:a:kolide:fleet:*:*:*:*:*:*:*:*
  metadata:
    max-request: 1
    shodan-query: http.favicon.hash:-1529860313
    product: fleet
    vendor: kolide
  tags: panel,fleet,osquery,tech,discovery
http:
  - method: GET
    path:
      - '{{BaseURL}}/login'

    matchers-condition: and
    matchers:
      - type: word
        part: body
        words:
          - "Fleet"
          - "osquery"
          - "/assets/bundle"
        condition: and

      - type: status
        status:
          - 200
