id: msmtp-config

info:
  name: Msmtp 配置暴露（暴露面识别）
  author: geeknik
  severity: high
  description: 检测到对外可访问的 Ms。这类配置资源可能包含部署细节、访问凭据、内部地址、组件版本或调试开关，公开暴露后会显著增加被侦察和后续利用的风险。
  reference:
    - https://wiki.archlinux.org/title/Msmtp
  metadata:
    verified: true
    max-request: 1
  tags: exposure,msmtp,vuln

http:
  - method: GET
    path:
      - "{{BaseURL}}/.msmtprc"

    matchers-condition: and
    matchers:
      - type: word
        words:
          - 'account'
          - 'host'
          - 'from'
          - 'auth'
          - 'tls'
        condition: and

      - type: word
        part: header
        words:
          - 'text/plain'
          - 'octet-stream'
        condition: or

      - type: status
        status:
          - 200
