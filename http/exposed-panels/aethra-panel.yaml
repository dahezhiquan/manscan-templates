id: aethra-panel

info:
  name: Aethra Telecommunications Login 面板（指纹识别）
  author: Splint3r7
  severity: info
  description: |-
    检测到目标站点存在 Aethra Telecommunications Login 相关响应特征。Aethra Telecommunications Login 是监控、日志、分析或仪表盘系统，用于展示运行指标、访问统计、日志事件和服务状态。模板请求 `/`，并通过页面标题或正文关键字、状态码、DSL 条件确认该系统指纹，用于资产识别、系统盘点和暴露面梳理。
  classification:
    cwe-id: CWE-200
  metadata:
    max-request: 1
    shodan-query: http.title:"Aethra Telecommunications Operating System"
    verified: true
  tags: panel,aethra,login,detect,discovery
http:
  - method: GET
    path:
      - "{{BaseURL}}"

    host-redirects: true
    max-redirects: 2

    matchers:
      - type: dsl
        dsl:
          - 'contains(body, "<title>Aethra Telecommunications Operating System")'
          - 'status_code == 200'
        condition: and
