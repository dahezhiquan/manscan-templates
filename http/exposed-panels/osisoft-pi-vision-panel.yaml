id: osisoft-pi-vision-panel

info:
  name: OSIsoft PI Vision - 登录面板（暴露面识别）
  author: rxerium
  severity: info
  description: |
    该模板通过识别 OSIsoft PI Vision 登录入口的页面标题、特征文本或重定向行为，判断目标是否暴露了对应的认证界面。若命中，说明该登录面板对外可访问，可用于暴露面梳理与后续安全评估。
  reference:
    - https://www.aveva.com/en/products/pi-vision/
    - https://docs.aveva.com/bundle/pi-vision/
  metadata:
    max-request: 2
    verified: true
    vendor: OSIsoft
    product: pi-vision
    shodan-query: 'http.title:"PI Vision"'
  tags: panel,scada,historian,ics,osisoft,aveva,pi-vision,pi-system,energy,discovery

http:
  - method: GET
    path:
      - "{{BaseURL}}"

    host-redirects: true
    max-redirects: 2

    matchers:
      - type: dsl
        dsl:
          - 'status_code == 200'
          - 'contains(body, "<title>PI Vision</title>")'
          - 'contains_any(body, "PI Vision User Guide", "PI Vision display", "project=PIVISION")'
        condition: and
