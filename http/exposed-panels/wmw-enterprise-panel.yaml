id: wmw-enterprise-panel

info:
  name: WMW Enterprise 登录面板识别（指纹识别）
  author: Matt Galligan
  severity: info
  description: |
    该模板通过识别 WMW Enterprise 登录入口的页面标题、特征文本或重定向行为，判断目标是否暴露了对应的认证界面。若命中，说明该登录面板对外可访问，可用于暴露面梳理与后续安全评估。
  reference:
    - https://www.wmw-hub.com/
  classification:
    cvss-metrics: CVSS:3.1/AV:N/AC:L/PR:N/UI:N/S:U/C:N/I:N/A:N
    cwe-id: CWE-200
  metadata:
    verified: true
    max-request: 1
  tags: panel,wmw,detect,discovery

http:
  - method: GET
    path:
      - "{{BaseURL}}/en/login"

    matchers-condition: and
    matchers:
      - type: word
        words:
          - "WMW Enterprise login"
          - "Welcome to the WMW dashboard"
        condition: or

      - type: status
        status:
          - 200
