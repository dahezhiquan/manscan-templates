id: gotify-panel

info:
  name: Gotify 登录面板识别（指纹识别）
  author: righettod
  severity: info
  description: |-
    检测到目标站点存在 Gotify 相关响应特征。Gotify 是监控、日志、分析或可观测性系统，用于展示运行指标、告警事件、日志数据和服务状态。模板请求 `/`，并通过页面标题或正文关键字、状态码、DSL 条件确认该系统指纹，用于资产识别、系统盘点和暴露面梳理。
  reference:
    - https://github.com/gotify/server
  classification:
    cpe: cpe:2.3:a:gotify:server:*:*:*:*:*:*:*:*
  metadata:
    verified: true
    max-request: 1
    vendor: gotify
    product: server
    shodan-query:
      - http.title:"Gotify"
      - http.title:"gotify"
    fofa-query: title="gotify"
    google-query: intitle:"gotify"
  tags: panel,gotify,login,detect,discovery
http:
  - method: GET
    path:
      - "{{BaseURL}}"

    matchers:
      - type: dsl
        dsl:
          - 'status_code == 200'
          - 'contains_any(body, "<title>Gotify", "content=\"Gotify")'
        condition: and

    extractors:
      - type: regex
        part: body
        group: 1
        regex:
          - '"version":"([0-9.]+)"'
