id: azure-sql-database-rename-unalerted
info:
  name: Azure SQL 数据库重命名告警未配置（云安全）
  author: princechaddha
  severity: high
  description: Azure SQL 数据库移动或重命名操作可能改变资源标识、连接配置和依赖关系；未配置 Activity Log 告警时，数据库标识变化可能不被及时发现。该模板枚举已启用的 Activity Log Alert，并检查 condition 是否缺少 Microsoft.Sql/servers/databases/move/action 操作条件。
  impact: |
    - 数据库重命名可能造成应用连接失败、监控失联和备份任务指向错误资源。
    - 恶意移动或重命名会增加隐藏资源、规避监控和破坏业务依赖的可能性。
  remediation: |
    - 创建针对 SQL 数据库移动或重命名操作的 Activity Log Alert，并接入数据库运维响应流程。
    - 限制数据库移动权限，维护资源依赖清单并对连接字符串、监控和备份配置执行变更验证。
  reference:
    - https://docs.microsoft.com/en-us/azure/azure-monitor/platform/alerts-activity-log
  metadata:
    vendor: microsoft
    product: azure-monitor
  tags: cloud,devops,azure,microsoft,sql-database,azure-cloud-config

flow: |
  code(1);
  for (let AlertData of iterate(template.alertList)) {
    set("id", AlertData);
    code(2);
  }

self-contained: true
code:
  - engine:
      - sh
      - bash
    source: |
      az monitor activity-log alert list --output json --query '[?(enabled==`true`)].id'

    extractors:
      - type: json
        name: alertList
        internal: true
        json:
          - '.[]'

  - engine:
      - sh
      - bash
    source: |
      az monitor activity-log alert show --ids "$id" --query 'condition'

    matchers-condition: and
    matchers:
      - type: word
        words:
          - '"field": "operationName"'

      - type: word
        words:
          - "Microsoft.Sql/servers/databases/move/action"
        negative: true

    extractors:
      - type: dsl
        dsl:
          - 'id + " does not have the correct alert configuration for Rename Azure SQL Database events"'
