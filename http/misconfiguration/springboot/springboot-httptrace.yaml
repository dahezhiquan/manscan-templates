id: springboot-httptrace

info:
  name: Spring Boot Actuator HTTP Trace 暴露
  author: that_juan_,dwisiswant0,wdahlenb
  severity: low
  description: |-
    该模板用于核查 Spring Boot Actuator HTTP Trace端点是否对外暴露。Actuator 是 Spring Boot 的运维监控能力，错误配置会让本应受保护的运行状态、日志、指标或内部结构被匿名访问。模板访问 /httptrace、/actuator/httptrace，并根据响应中的 traces、timestamp、principal、session字段以及 JSON/Actuator Content-Type 判断端点是否可访问。
  metadata:
    max-request: 2
  tags: springboot,exposure,misconfig,vuln
  impact: |-
    - 攻击者可获取应用健康状态、运行指标、线程、日志、依赖组件、内部路由或环境线索。
    - 这些信息可帮助攻击者识别技术栈、推断内部服务拓扑，并为后续漏洞利用、凭据搜集或拒绝服务攻击提供依据。
  remediation: |-
    - 仅暴露业务必需的 Actuator 端点，避免在生产环境开放敏感端点。
    - 为 Actuator 增加认证授权、管理端口隔离、来源 IP 限制和访问审计。
    - 通过 `management.endpoints.web.exposure.include`/`exclude`、Spring Security 或网关策略收敛公开端点。
http:
  - method: GET
    path:
      - "{{BaseURL}}/httptrace"
      - "{{BaseURL}}/actuator/httptrace"

    stop-at-first-match: true

    matchers-condition: and
    matchers:
      - type: word
        part: body
        words:
          - '"traces"'
          - '"timestamp"'
          - '"principal"'
          - '"session"'
        condition: and

      - type: word
        part: header
        words:
          - "application/json"
          - "application/vnd.spring-boot.actuator"
          - "application/vnd.spring-boot.actuator.v1+json"
        condition: or

      - type: status
        status:
          - 200
