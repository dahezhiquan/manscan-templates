id: quivr-panel

info:
  name: Quivr 登录面板识别（指纹识别）
  author: s4e-io
  severity: info
  description: |-
    Quivr 是基于大语言模型的知识库应用，用于私有资料检索、问答和团队知识管理。该模板请求 `/login` 路径，并依据 DSL 条件识别目标是否部署了该系统或暴露了对应入口，适用于资产指纹确认；命中结果仅表示系统特征匹配，不代表已确认存在未授权访问或可利用漏洞。
  reference:
  - https://github.com/QuivrHQ/quivr
  metadata:
    verified: true
    max-request: 1
    fofa-query: icon_hash="848114197"
  tags: panel,login,quivr,detect,discovery

http:
  - method: GET
    path:
      - "{{BaseURL}}/login"

    matchers:
      - type: dsl
        dsl:
          - 'contains_any(body, "<title>Quivr - Get a Second Brain", "data-sentry-component=\"QuivrLogo\"")'
          - 'status_code == 200'
        condition: and
