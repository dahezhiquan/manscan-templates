id: nexus-repository-swagger-unauth

info:
  name: Nexus Repository Manager Swagger API 未授权访问
  author: dahezhiquan
  severity: low
  description: |
    Nexus Repository Manager 的 `/service/rest/swagger.json` 接口在未登录状态下公开返回完整 REST API 文档时，会暴露管理接口路径、参数、权限要求和数据模型。模板直接请求该接口，并结合 Nexus 服务端特征、Swagger 2.0 文档字段、Nexus REST API 标题及 HTTP 200 响应确认文档可被匿名访问。
  impact: |
    - 攻击者可枚举 Nexus 的仓库、用户、权限、任务和制品管理接口，降低后续攻击与越权测试成本。
    - 文档中可能包含内部接口结构、组件版本和安全管理端点信息；若其他接口同时存在授权缺陷，风险可能扩大为配置篡改或制品数据泄露。
  remediation: |
    - 在反向代理或访问控制层限制 `/service/rest/swagger.json` 的访问来源，生产环境不需要时关闭或移除公开 API 文档。
    - 为 Nexus REST API 启用统一认证和最小权限控制，禁止匿名访问安全管理、用户、权限及仓库管理接口。
    - 升级 Nexus Repository Manager 到受支持版本，并审计近期匿名访问记录及可能暴露的内部接口信息。
  reference:
    - https://help.sonatype.com/en/rest-and-integration-api.html
    - https://help.sonatype.com/en/access-control.html
  classification:
    cwe-id: CWE-200
  metadata:
    vendor: sonatype
    product: nexus_repository_manager
  tags: nexus,sonatype,swagger,unauth,misconfig,exposure,vuln

http:
  - method: GET
    path:
      - "{{BaseURL}}/service/rest/swagger.json"

    matchers-condition: and
    matchers:
      - type: status
        status:
          - 200

      - type: word
        part: body
        words:
          - '"swagger"'
          - '"Nexus Repository Manager REST API"'
          - '"basePath"'
          - '"/service/rest/"'
        condition: and
