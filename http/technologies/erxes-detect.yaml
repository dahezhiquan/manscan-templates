id: erxes-detect

info:
  name: Erxes 指纹识别（指纹识别）
  author: princechaddha
  severity: info
  description: >-
    Erxes 是开源客户关系管理和营销自动化平台，用于管理客户沟通、销售线索和支持流程。该模板通过请求目标服务并检查预设路径或首页响应、页面正文关键字、正则特征、状态码等指纹特征，判断目标是否使用或暴露了
    Erxes 相关组件；命中结果仅表示指纹特征匹配，可用于资产盘点、技术栈识别和后续安全评估，不代表已确认存在可利用漏洞。
  metadata:
    max-request: 1
    shodan-query: http.title:"erxes"
    product: erxes
    vendor: erxes
    fofa-query: title="erxes"
    google-query: intitle:"erxes"
  tags: tech,erxes,discovery
http:
  - method: GET
    path:
      - "{{BaseURL}}"

    matchers-condition: and
    matchers:
      - type: regex
        part: body
        regex:
          - "<title>erxes(.*)</title>"

      - type: status
        status:
          - 200
