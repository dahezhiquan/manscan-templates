id: api-blockfrost

info:
  name: Blockfrost API Token 可用性校验（token喷洒）
  author: daffainfo
  severity: info
  description: 该模板通过调用 Blockfrost API 的已知接口验证提供的 token 是否有效，命中后通常表示可访问区块链与加密资产数据能力。
  reference:
    - https://docs.blockfrost.io/
    - https://github.com/daffainfo/all-about-apikey/tree/main/blockfrost
  metadata:
    max-request: 1
  tags: token-spray,blockfrost

self-contained: true

http:
  - raw:
      - |
        GET https://cardano-mainnet.blockfrost.io/api/v0/ HTTP/1.1
        Host: cardano-mainnet.blockfrost.io
        project_id: {{token}}

    matchers:
      - type: word
        part: body
        words:
          - '"url":'
          - '"version":'
        condition: and
