id: philo-phish

info:
  name: Philo 仿冒钓鱼网站（钓鱼网站识别）
  author: rxerium
  severity: info
  description: |
    检测到疑似仿冒 Philo 的钓鱼网站。模板在目标页面返回 200、页面内容命中 Philo 的品牌页面特征，且当前主机不属于 philo.com 官方域名时触发，用于识别借用 Philo 品牌页面诱导用户信任的仿冒站点。
  reference:
    - https://philo.com
  metadata:
    max-request: 1
  tags: phishing,philo,streaming,osint,discovery
http:
  - method: GET
    path:
      - "{{BaseURL}}"

    host-redirects: true
    max-redirects: 2

    matchers-condition: and
    matchers:
      - type: word
        words:
          - "Why pay more for TV? Philo offers live TV and on-demand content for just $33/month. Stream your favorite shows, movies, and more across all your devices."

      - type: status
        status:
          - 200

      - type: dsl
        dsl:
          - '!contains(host,"philo.com")'
