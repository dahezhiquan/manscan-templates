id: urbackup-panel

info:
  name: UrBackup 登录面板识别（指纹识别）
  author: DhiyaneshDk
  severity: info
  description: UrBackup 是开源备份系统，用于客户端备份、恢复、存储和任务调度管理。该模板请求首页，并依据 HTTP 200 状态码、页面标题、正文关键字或品牌资源特征识别目标是否部署了该系统或暴露了对应入口，适用于资产指纹确认；命中结果仅表示系统特征匹配，不代表已确认存在未授权访问或可利用漏洞。
  classification:
    cpe: cpe:2.3:a:urbackup:urbackup:*:*:*:*:*:*:*:*
  metadata:
    verified: true
    max-request: 1
    vendor: urbackup
    product: urbackup
    shodan-query: html:"UrBackup - Keeps your data safe"
  tags: urbackup,panel,login,detect,discovery

http:
  - method: GET
    path:
      - "{{BaseURL}}"

    matchers-condition: and
    matchers:
      - type: word
        part: body
        words:
          - "<title>UrBackup - Keeps your data safe</title>"

      - type: status
        status:
          - 200
