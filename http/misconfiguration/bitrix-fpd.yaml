id: bitrix-fpd

info:
  name: Bitrix Path 泄露
  author: DhiyaneshDk
  severity: low
  description: |
    该模板用于核查 Bitrix Path泄露状态。该类问题通常源于生产环境暴露调试页面、诊断端点、状态接口或详细错误信息。模板会向目标发送探测请求，并依据请求 `/?USER_FIELD_MANAGER=1`、`/bitrix/admin/restore_export.php`、匹配 `Bitrix Site Manager`、`/bitrix/`等证据确认目标是否存在该配置问题。
  impact: |
    - 攻击者可获取服务版本、运行状态、内部路径、模块列表、环境变量或错误栈信息。
    - 这些信息可辅助识别组件版本、构造后续攻击路径，或暴露内部系统结构与敏感配置线索。
  remediation: |
    - 关闭生产环境中的调试、状态、示例和诊断接口，避免向未授权用户返回内部细节。
    - 对确需保留的运维端点增加认证授权、来源限制和访问审计。
    - 检查历史访问日志和错误日志，确认敏感信息是否已被枚举或泄露。
  reference:
    - https://www.bitrix24.in/tools/crm/
  metadata:
    max-request: 9
    verified: true
    shodan-query: html:"/bitrix/"
  tags: debug,bitrix,fpd,vuln

flow: http(1) && http(2)

http:
  - method: GET
    path:
      - "{{BaseURL}}"

    redirects: true
    matchers:
      - type: word
        part: response
        words:
          - "Bitrix Site Manager"
          - "/bitrix/"
        condition: or
        internal: true

  - method: GET
    path:
      - '{{BaseURL}}/?USER_FIELD_MANAGER=1'
      - '{{BaseURL}}/bitrix/admin/restore_export.php'
      - '{{BaseURL}}/bitrix/admin/tools_index.php'
      - '{{BaseURL}}/bitrix/bitrix.php'
      - '{{BaseURL}}/bitrix/modules/main/ajax_tools.php'
      - '{{BaseURL}}/bitrix/php_interface/after_connect_d7.php'
      - '{{BaseURL}}/bitrix/themes/.default/.description.php'
      - '{{BaseURL}}/bitrix/components/bitrix/main.ui.selector/templates/.default/template.php'
      - '{{BaseURL}}/bitrix/components/bitrix/forum.user.profile.edit/templates/.default/interface.php'

    stop-at-first-match: true

    matchers:
      - type: dsl
        dsl:
          - 'status_code == 200 || status_code == 500'
          - 'contains_all(body, "bitrix", "Fatal error")'
        condition: and
