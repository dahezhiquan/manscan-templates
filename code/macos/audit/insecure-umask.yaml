id: insecure-umask

info:
  name: macOS umask 配置过宽（本地基线扫描）
  author: geeknik
  severity: medium
  description: |
    该模板检查 macOS umask 是否过于宽松。过宽 umask 会让新建文件或目录默认暴露给更多用户。
  impact: |
    不符合基线的配置会扩大本地攻击面，并削弱 macOS 主机的访问控制和审计能力。
  remediation: |
    收紧相关文件或目录权限，移除全局可写位，确保关键配置仅由 root 或授权管理员维护。
  tags: macos,audit,local,security,umask

self-contained: true

code:
  - engine:
      - sh
      - bash
    source: |
      umask
    matchers:
      - type: regex
        regex:
          - "^0?0[0-2][0-7]$"
        negative: true
