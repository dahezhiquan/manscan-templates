id: ibm-security-verify-panel

info:
  name: IBM Security Verify Access Login 面板（指纹识别）
  author: johnk3r
  severity: info
  description: |-
    检测到目标站点存在 IBM Security Verify Access Login 相关响应特征。IBM Security Verify 是身份认证和访问管理平台，用于管理用户、单点登录、多因素认证和访问策略。模板请求 `/`，并通过页面标题或正文关键字、状态码确认该系统指纹，用于资产识别、系统盘点和暴露面梳理。
  reference:
    - https://www.ibm.com/docs/en/sva/10.0.8?topic=overview-introduction-security-verify-access
  metadata:
    max-request: 1
    vendor: ibm
    shodan-query: http.title:"IBM Security Verify Access"
  tags: panel,ibm,login,detect,discovery
http:
  - method: GET
    path:
      - "{{BaseURL}}"

    host-redirects: true
    max-redirects: 2

    matchers-condition: and
    matchers:
      - type: word
        words:
          - '<title>IBM Security Verify Access</title>'

      - type: status
        status:
          - 200
