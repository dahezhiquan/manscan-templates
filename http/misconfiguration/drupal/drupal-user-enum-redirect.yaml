id: drupal-user-enum-redirect

info:
  name: "Drupal 用户枚举 [Redirect]"
  author: 0w4ys
  severity: low
  description: |
    该模板用于核查 Drupal 用户枚举 [Redirect]。该类问题通常源于用户、账号、仓库或接口查询端点缺少枚举防护，导致攻击者可批量验证目标对象是否存在。模板会向目标发送探测请求，并依据请求 `/user/0`、`/user/1`、状态码 301等证据确认目标是否存在该配置问题。
  impact: |
    - 攻击者可收集有效账号、仓库、用户资料或组织结构信息。
    - 枚举结果可被用于密码喷洒、钓鱼、凭据填充或后续权限攻击。
  remediation: |
    - 对枚举接口增加认证授权、速率限制和统一错误响应。
    - 避免在未授权响应中区分“存在”和“不存在”等状态差异。
    - 监控批量查询、异常失败率和针对账号空间的自动化探测。
  classification:
    cpe: cpe:2.3:a:drupal:drupal:*:*:*:*:*:*:*:*
  metadata:
    verified: true
    max-request: 4
    vendor: drupal
    product: drupal
    shodan-query: http.component:"Drupal"
  tags: drupal,misconfig,vuln

http:
  - method: GET
    path:
      - "{{BaseURL}}/user/0"
      - "{{BaseURL}}/user/1"
      - "{{BaseURL}}/user/2"
      - "{{BaseURL}}/user/3"

    stop-at-first-match: true

    matchers-condition: and
    matchers:
      - type: regex
        regex:
          - '(?i)Location: https?:\/\/[\w\.\-]+[:\/\w-]*\/users\/\w+'
        part: header

      - type: status
        status:
          - 301

    extractors:
      - type: regex
        part: header
        regex:
          - 'users\/\w+'
