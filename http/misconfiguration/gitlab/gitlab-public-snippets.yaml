id: gitlab-public-snippets

info:
  name: GitLab 公开代码片段暴露
  author: pdteam
  severity: medium
  description: |
    该模板用于核查 GitLab 公开代码片段暴露。该类问题通常源于容器、CI/CD、注册表、服务发现或运维 API 暴露在公网且缺少访问控制。模板会向目标发送探测请求，并依据请求 `/explore/snippets`、`/-/snippets`、匹配 `<title>Snippets · Explore · GitLab</title>`、状态码 200、匹配 `No snippets found`等证据确认目标是否存在该配置问题。
  impact: |
    - 攻击者可查看镜像、容器、任务、节点、配置、构建流水线或运行状态。
    - 若接口允许操作，可能导致容器创建、任务执行、镜像篡改、配置泄露或集群接管。
  remediation: |
    - 禁止将运维 API、容器接口和注册表直接暴露到公网。
    - 启用 TLS、认证授权、来源限制和最小权限访问策略。
    - 审计镜像、容器、任务和访问日志，清理未知资源并轮换相关令牌。
  reference:
    - https://gist.github.com/vysecurity/20311c29d879e0aba9dcffbe72a88b10
    - https://twitter.com/intigriti/status/1375078783338876929
  metadata:
    max-request: 2
    shodan-query: http.title:"GitLab"
  tags: gitlab,exposure,misconfig,vuln

http:
  - method: GET
    path:
      - "{{BaseURL}}/explore/snippets"
      - "{{BaseURL}}/-/snippets"

    matchers-condition: and
    matchers:
      - type: word
        words:
          - '<title>Snippets · Explore · GitLab</title>'

      - type: status
        status:
          - 200

      - type: word
        negative: true
        condition: or
        words:
          - "No snippets found"
          - "Nothing here."
