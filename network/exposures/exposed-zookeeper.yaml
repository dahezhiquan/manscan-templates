id: exposed-zookeeper

info:
  name: Apache ZooKeeper 未认证访问（服务漏洞）
  author: pdteam
  severity: high
  description: |
    Apache ZooKeeper 用于分布式协调、服务发现和配置管理。若 2181 端口允许未认证访问四字命令或 ZooKeeper 协议请求，攻击者可读取版本、环境和节点数据；该模板分别发送 `envi` 命令和协议查询，并通过 `zookeeper.version` 或响应中的 zookeeper 标识确认未认证访问。
  impact: |
    - 攻击者可枚举 ZooKeeper 版本、运行环境、配置和部分 znode 数据，暴露分布式系统拓扑。
    - 如果 ACL 配置不当，还可能进一步读取或修改协调数据，影响 Kafka、HBase、Dubbo 等依赖服务。
  remediation: |
    - 启用 ZooKeeper 认证与 ACL，限制四字命令白名单，避免管理命令对不可信来源开放。
    - 使用网络 ACL 限制 2181 端口访问来源，并审计 znode 权限和异常读取/写入行为。
  reference:
    - https://zookeeper.apache.org/security.html
    - https://zookeeper.apache.org/doc/r3.5.5/zookeeperAdmin.html#sc_zkCommands
    - https://github.com/h1thub/Unauthorized-zookeeper
  classification:
    cwe-id: CWE-306
  metadata:
    verified: true
    max-request: 2
    shodan-query: 'X-Powered-By: ZooKeeper'
    fofa-query: protocol="zookeeper"
  tags: network,zookeeper,unauth,exposure,tcp,discovery

flow: tcp(1) || tcp(2)

tcp:
  - inputs:
      - data: "envi\r\nquit\r\n"

    host:
      - "{{Hostname}}"
    port: 2181
    read-size: 2048

    matchers:
      - type: word
        words:
          - "zookeeper.version"

    extractors:
      - type: regex
        regex:
          - "zookeeper\\.version=([^\r\n]+)"

  - inputs:
      - data: "0000002d000000000000000000000000000075300000000000000000000000100000000000000000000000000000000000"
        type: hex
        read: 1024

      - data: "0000000e0000000100000008000000012f00"
        type: hex
        read: 4096

    host:
      - "{{Hostname}}"
    port: 2181

    matchers-condition: and
    matchers:
      - type: word
        part: raw
        words:
          - "zookeeper"

      - type: dsl
        dsl:
          - "len(raw) > 70"

    extractors:
      - type: regex
        part: raw
        regex:
          - "zookeeper"
