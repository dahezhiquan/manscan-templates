id: umami-panel

info:
  name: Umami 登录面板识别（指纹识别）
  author: userdehghani
  severity: info
  description: |-
    Umami 是网站访问分析平台，用于统计流量、来源、事件和访客行为。该模板请求 `/login`、`/favicon.ico`、`/~404`，并依据 favicon 哈希、DSL 条件识别目标是否部署了该系统或暴露了对应入口，适用于资产指纹确认；命中结果仅表示系统特征匹配，不代表已确认存在未授权访问或可利用漏洞。
  reference:
  - https://umami.is/
  - https://umami.is/docs
  metadata:
    verified: true
    max-request: 3
    shodan-query: http.favicon.hash:-130447705
  tags: panel,umami,login,detect,discovery

flow: http(1) && http(2)

http:
  - method: GET
    path:
      - "{{BaseURL}}/login"
      - "{{BaseURL}}/favicon.ico"

    stop-at-first-match: true
    matchers:
      - type: dsl
        dsl:
          - 'status_code==200 && contains_any(tolower(body), "Login | umami", "umami</div>", "umami</h1>", "<title>umami - login")'
          - "status_code==200 && (\"-130447705\" == mmh3(base64_py(body)))"
        condition: or

  - method: GET
    path:
      - "{{BaseURL}}/~404"

    extractors:
      - type: regex
        part: body
        regex:
          - 'v(?P<version>\d+\.\d+\.\d+)'
