id: imgproxy-detect

info:
  name: Imgproxy 指纹识别（指纹识别）
  author: userdehghani
  severity: info
  description: >-
    imgproxy 是图片代理和实时处理服务，用于按 URL 参数完成图片裁剪、缩放、格式转换和缓存。该模板通过请求目标服务并检查预设路径或首页响应、DSL
    条件等指纹特征，判断目标是否使用或暴露了 Imgproxy 相关组件；命中结果仅表示指纹特征匹配，可用于资产盘点、技术栈识别和后续安全评估，不代表已确认存在可利用漏洞。
  reference:
  - https://imgproxy.net/
  classification:
    cpe: cpe:2.3:a:evilmartians:imgproxy:*:*:*:*:*:*:*:*
  metadata:
    verified: true
    max-request: 1
    vendor: evilmartians
    product: imgproxy
    shodan-query: html:"imgproxy"
  tags: imgproxy,tech,detect,discovery
http:
  - method: GET
    path:
      - "{{BaseURL}}"

    matchers:
      - type: dsl
        dsl:
          - 'status_code == 200'
          - 'contains(server, "imgproxy")'
        condition: and
