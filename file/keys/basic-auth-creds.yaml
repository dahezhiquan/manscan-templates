id: basic-auth-creds

info:
  name: Basic 认证凭据泄露检测（本地文件安全扫描）
  author: gaurang
  severity: high
  description: |
    URL 中的 Basic 认证凭据把服务地址、账户标识和密码放在同一连接配置中。完整连接串泄露后，攻击者可能直接连接目标服务，具体读写范围取决于账号权限和网络策略。本模板匹配 `http`、`https` 或 `ftp` URL 中的 `用户名:密码@主机` 结构，识别嵌入 URL 的基础认证凭据。
  impact: |
    - 攻击者可在网络可达的前提下直接尝试连接数据库、对象存储或媒体服务，读取、修改或删除其中的数据。
    - 连接串通常同时暴露主机、用户名和认证材料，便于进一步枚举服务和组织资产。
  remediation: |
    - 立即轮换连接串中的密码、密钥或共享访问签名，并检查数据库、存储和媒体服务的访问日志。
    - 将连接信息放入 Secret 管理系统，限制网络来源、账户权限、可访问数据库或容器，并禁止写入源码和构建产物。
    - 对公开资源关闭匿名访问，验证新的连接配置不会被日志和错误信息回显。
  classification:
    cvss-metrics: CVSS:3.1/AV:N/AC:L/PR:N/UI:N/S:U/C:H/I:N/A:N
    cvss-score: 7.5
    cwe-id: CWE-200
  tags: file,keys,token,auth
file:
  - extensions:
      - all

    extractors:
      - type: regex
        regex:
          - "(http|https|ftp)://[a-zA-Z0-9][^/\\s:@]{2,19}:[^/\\s:@]{3,50}@[a-zA-Z0-9.-]{3,100}(:[0-9]{2,5})?(/|$)[\"'\\s]"
