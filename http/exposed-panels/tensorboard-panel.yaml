id: tensorboard-panel

info:
  name: TensorBoard 面板识别（指纹识别）
  author: rxerium
  severity: info
  description: |
    该模板通过识别 TensorBoard 面板、控制台或管理界面的页面特征，判断目标是否暴露了对应服务入口。若命中，说明该后台或运维界面对外可访问，可用于资产识别与暴露面排查。
  reference:
    - https://github.com/tensorflow/tensorboard
    - https://www.tensorflow.org/tensorboard
  metadata:
    verified: true
    max-request: 1
    vendor: tensorflow
    product: tensorboard
    shodan-query: 'http.title:"TensorBoard"'
  tags: panel,tensorboard,tensorflow,ml,ai,detect,discovery

http:
  - method: GET
    path:
      - "{{BaseURL}}"

    host-redirects: true
    max-redirects: 2

    matchers-condition: and
    matchers:
      - type: regex
        part: body
        regex:
          - '(?i)<title>[^<]*TensorBoard[^<]*</title>'

      - type: status
        status:
          - 200
