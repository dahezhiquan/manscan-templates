id: ricoh-default-login

info:
  name: Ricoh 默认口令登录（弱口令）
  author: gy741
  severity: high
  description: |
    该模板用于检测 Ricoh 是否仍可使用默认凭据或弱口令登录。模板主要向 `/web/guest/tw/websys/webArch/login.cgi` 等认证入口发送请求，使用内置默认凭据组合进行认证尝试，并根据响应中的 `wimsesid=[0-9]+` 等登录成功特征判断登录是否成功；命中说明目标未及时修改出厂、示例或初始化账号口令。
  impact: |
    - 攻击者可接管 Ricoh 的 Web 管理界面，查看设备状态、网络配置、运行日志或敏感业务参数。
    - 被接管的网络、工控、打印、视频、存储或远程管理设备可能被用于中断业务、改变访问策略、窃取流量或作为内网横向移动入口。
  remediation: |
    - 立即修改所有默认账号口令，禁用不再使用的出厂账号，并为管理账户设置高强度唯一密码。
    - 将设备管理入口限制在 VPN、堡垒机或可信管理网段内，避免直接暴露到公网。
    - 升级设备固件或管理组件，审计近期登录记录、配置变更和异常会话。
  reference:
    - https://ricoh-printer.co/default-username-and-password-for-ricoh-web-image-monitor/
  classification:
    cvss-metrics: CVSS:3.0/AV:N/AC:L/PR:N/UI:N/S:C/C:L/I:L/A:L
    cvss-score: 8.3
    cwe-id: CWE-522
  metadata:
    max-request: 1
  tags: ricoh,default-login,intrusive,vuln

http:
  - raw:
      - |
        POST /web/guest/tw/websys/webArch/login.cgi HTTP/1.1
        Host: {{Hostname}}
        Cookie: cookieOnOffChecker=on;

        wimToken=&userid_work=&userid={{base64(username)}}&password_work=&password=&open=

    payloads:
      username:
        - admin
    attack: pitchfork

    matchers-condition: and
    matchers:
      - type: regex
        regex:
          - 'wimsesid=[0-9]+'
        part: header

      - type: status
        status:
          - 302
