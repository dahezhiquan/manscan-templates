id: pnc-bank-phish

info:
  name: PNC Bank 仿冒钓鱼网站（钓鱼网站识别）
  author: rxerium
  severity: info
  description: |
    检测到疑似仿冒 PNC Bank 的钓鱼网站。模板在目标页面返回 200、页面内容命中 PNC Bank 的登录或账号页面特征，且当前主机不属于 pnc.com 官方域名时触发，用于识别借用 PNC Bank 品牌页面诱导用户信任的仿冒站点。
  reference:
    - https://pnc.com
  metadata:
    max-request: 1
  tags: phishing,pnc-bank,bank,osint,discovery
http:
  - method: GET
    path:
      - "{{BaseURL}}"

    host-redirects: true
    max-redirects: 2

    matchers-condition: and
    matchers:
      - type: word
        words:
          - "PNC Bank offers a wide range of personal banking services including checking and savings accounts, credit cards, mortgage loans, auto loans and much more."

      - type: status
        status:
          - 200

      - type: dsl
        dsl:
          - '!contains(host,"pnc.com")'
