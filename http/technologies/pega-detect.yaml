id: pega-detect

info:
  name: Pega Infinity 指纹识别（指纹识别）
  author: sshell
  severity: info
  description: >-
    Pega Infinity 是低代码业务流程和客户关系自动化平台，用于工作流、规则决策和企业应用构建。该模板通过请求目标服务并检查预设路径或首页响应、页面正文关键字、状态码、HTTP
    响应头等指纹特征，判断目标是否使用或暴露了 Pega Infinity 相关组件；命中结果仅表示指纹特征匹配，可用于资产盘点、技术栈识别和后续安全评估，不代表已确认存在可利用漏洞。
  metadata:
    max-request: 1
  tags: tech,pega,discovery
http:
  - method: GET
    path:
      - "{{BaseURL}}/prweb/PRRestService/unauthenticatedAPI/v1/docs"

    matchers-condition: and
    matchers:
      - type: word
        part: body
        words:
          - '"description" :"The Pega API'

      - type: status
        status:
          - 200

      - type: word
        part: header
        words:
          - 'application/json'
