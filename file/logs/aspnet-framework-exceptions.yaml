id: aspnet-framework-exceptions

info:
  name: ASP.NET 框架异常日志检测（本地文件安全扫描）
  author: Aayush Dhakal
  severity: info
  description: |
    该模板检测可疑 ASP.NET 框架异常日志，这些异常可能表明探测、利用尝试或应用错误信息泄露。
  reference:
    - https://docs.microsoft.com/en-us/dotnet/api/system.web.httpexception
  tags: file,logs,aspnet

file:
  - extensions:
      - all

    extractors:
      - type: regex
        name: exception
        part: body
        regex:
          - 'HttpException'
          - 'InvalidOperationException'
          - 'UnauthorizedAccessException'
          - 'NotFound'
