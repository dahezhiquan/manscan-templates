id: minecraft-enum

info:
  name: Minecraft 服务信息枚举（服务漏洞）
  author: pussycat0x
  severity: low
  description: |
    Minecraft 服务端会在状态查询阶段返回 MOTD、在线人数、最大人数、服务端版本和协议编号等公开信息。该模板发送 Minecraft 状态查询请求，并从响应 JSON 中提取服务器描述、玩家数量和版本字段，用于确认服务暴露与资产特征。
  impact: |
    - 暴露的 Minecraft 服务信息可泄露服务端版本、在线人数和协议编号。
    - 攻击者可据此识别过时服务端、插件生态或高峰时段，辅助后续弱口令、拒绝服务或已知漏洞攻击。
  remediation: |
    - 将 Minecraft 服务更新到受支持版本，并减少不必要的公开状态信息。
    - 仅向可信玩家或代理入口开放服务端口，并启用访问控制、速率限制和日志监控。
  reference:
    - https://github.com/sjhilt/Nmap-NSEs/blob/master/minecraft-info.nse
  metadata:
    verified: true
    max-request: 1
    shodan-query: product:"Minecraft"
  tags: js,network,minecraft,enum,discovery

javascript:
  - pre-condition: |
      isPortOpen(Host,Port);
  - code: |
      let data = "fe01"
      let c = require("nuclei/net");
      let conn = c.Open('tcp', `${Host}:${Port}`);
      conn.SendHex(data);
      let response = conn.RecvString();
      if (response.includes("HTTP/1.1")) {
        conn.Close();
      } else {
        let cleanedResponse = response.replace(/\x00/g, '');
        const version = cleanedResponse.slice(16, 30).replace(/(\d+)(\d{1})(\d+)/, "$1.$2.$3");
        const description = cleanedResponse.slice(30, -4);
        const onlinePlayers = cleanedResponse.slice(-1);
        const maxPlayers = cleanedResponse.slice(-3);
        Export("Version: ", version , " Description:", description ," Online Players:", onlinePlayers, " Maximum Players:", maxPlayers);
      }

    args:
      Host: "{{Host}}"
      Port: 25565

    matchers-condition: and
    matchers:
      - type: dsl
        dsl:
          - "success == true"

    extractors:
      - type: dsl
        dsl:
          - response
