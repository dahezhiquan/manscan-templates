id: stack-notification-disabled

info:
  name: CloudFormation 栈通知未启用（云安全）
  author: DhiyaneshDK
  severity: medium
  description: CloudFormation 栈通知未启用是一类基础设施变更可观测性风险，会使栈创建、更新和删除事件缺少主动通知链路。关键栈发生失败更新、资源替换或异常操作时，团队可能无法及时获知。模板枚举 CREATE_COMPLETE 状态的栈，并读取 `Stacks[*].NotificationARNs[]`，当返回为空数组时判定该栈未配置 SNS 通知。
  impact: |
    - 栈创建、更新或删除过程中的失败事件可能无法及时通知到运维或安全团队。
    - 对关键基础设施的变更缺少主动告警，会延长故障和异常配置的发现时间。
  remediation: |
    - 为关键 CloudFormation 栈配置合适的 SNS 通知主题，并确认订阅方可正常接收事件。
    - 将通知配置纳入栈创建和更新流程，避免新建栈遗漏事件通知。
  reference:
    - https://www.trendmicro.com/cloudoneconformity-staging/knowledge-base/aws/CloudFormation/cloudformation-stack-notification.html
    - http://docs.aws.amazon.com/AWSCloudFormation/latest/UserGuide/aws-properties-stack.html
  metadata:
    vendor: amazon
    product: cloudformation
  tags: cloud,devops,aws,amazon,cloudformation,aws-cloud-config

variables:
  region: "us-west-2"

flow: |
  code(1)
  for(let StackSummaries of iterate(template.stacksummaries)){
    set("stacksummary", StackSummaries)
    code(2)
  }

self-contained: true

code:
  - engine:
      - sh
      - bash
    source: |
      aws cloudformation list-stacks --region $region --stack-status-filter CREATE_COMPLETE --output json --query 'StackSummaries[*].StackName'

    extractors:
      - type: json
        name: stacksummaries
        internal: true
        json:
          - '.[]'

  - engine:
      - sh
      - bash
    source: |
        aws cloudformation describe-stacks --region $region --stack-name $stacksummary --query 'Stacks[*].NotificationARNs[]'

    matchers:
      - type: word
        words:
          - '[]'

    extractors:
      - type: dsl
        dsl:
          - '"CloudFormation Stack Notification " + stacksummary + " is Disabled"'
