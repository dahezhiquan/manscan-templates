id: google-storage-csp-bypass

info:
  name: 内容安全策略 CSP 绕过 - Google Storage（DAST）
  author: 0x_Akoko
  severity: medium
  description: |
    CSP 绕过风险表示站点虽然部署了 Content-Security-Policy，但策略允许的第三方源可被用来承载或触发脚本执行，导致已有 XSS 注入点绕过脚本来源限制。该模板针对 Google Storage 相关允许源，先检查响应头存在 `Content-Security-Policy` 且包含 `storage.googleapis.com`，再在 headless 浏览器中注入利用该允许源的脚本载荷，通过弹窗事件确认绕过是否可用。
  impact: |
    - 攻击者可在存在注入点的页面中绕过 CSP 执行 JavaScript，窃取会话信息、读取页面数据或发起同源操作。
    - 第三方脚本源一旦被策略长期信任，会削弱 CSP 对 XSS 的缓解效果，并扩大供应链与配置错误带来的影响。
  remediation: |
    - 从 CSP 允许列表中移除非必要的 `storage.googleapis.com` 等第三方脚本源，按业务功能收敛到最小来源集合。
    - 对必须保留的脚本源使用 nonce/hash、`strict-dynamic`、子资源完整性和版本固定，并同时修复页面中的 XSS 注入点。
  reference:
    - https://0xn3va.gitbook.io/cheat-sheets/web-application/content-security-policy
    - https://huntr.com/bounties/6cea89d1-39dc-4023-82fa-821f566b841a
  metadata:
    verified: true
    max-request: 2
  classification:
    cwe-id: CWE-79
  tags: xss,csp-bypass,google-storage,vuln

flow: http(1) && headless(1)

http:
  - method: GET
    path:
      - "{{BaseURL}}"

    matchers:
      - type: word
        part: header
        words:
          - "Content-Security-Policy"
          - "storage.googleapis.com"
        condition: and
        internal: true

headless:
  - steps:
      - action: navigate
        args:
          url: "{{BaseURL}}"

      - action: waitdialog
        name: google_storage_csp_xss
        args:
          max-duration: 5s

    payloads:
      injection:
        - "<script>alert(document.domain)</script>"

    fuzzing:
      - part: query
        type: replace
        mode: single
        fuzz:
          - "{{url_encode(injection)}}"

      - part: path
        type: replace
        mode: single
        fuzz:
          - "{{url_encode(injection)}}"

    matchers:
      - type: dsl
        dsl:
          - "google_storage_csp_xss == true"
