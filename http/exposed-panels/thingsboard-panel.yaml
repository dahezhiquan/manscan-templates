id: thingsboard-panel

info:
  name: ThingsBoard 面板识别（暴露面识别）
  author: righettod
  severity: info
  description: |
    该模板通过识别 ThingsBoard 面板、控制台或管理界面的页面特征，判断目标是否暴露了对应服务入口。若命中，说明该后台或运维界面对外可访问，可用于资产识别与暴露面排查。
  reference:
    - https://github.com/thingsboard/thingsboard
    - https://thingsboard.io/
  metadata:
    verified: true
    max-request: 1
    shodan-query: http.title:"ThingsBoard"
  tags: panel,thingsboard,detect,discovery

http:
  - method: GET
    path:
      - "{{BaseURL}}/login"

    matchers:
      - type: dsl
        dsl:
          - 'status_code == 200'
          - 'contains(to_lower(body), "<title>thingsboard</title>")'
        condition: and
