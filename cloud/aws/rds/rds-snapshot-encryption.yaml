id: rds-snapshot-encryption
info:
  name: RDS 手动快照未加密（云安全）
  author: princechaddha
  severity: medium
  description: RDS 快照未加密时，备份数据缺少 KMS 静态加密保护，快照复制、共享或长期留存都会扩大敏感数据暴露面。该模板枚举手动快照，并检查 Encrypted 是否为 false。
  impact: |
    - 数据库备份中的敏感数据在快照层缺少加密边界，泄露后影响范围较大。
    - 未加密快照难以满足合规要求，并限制后续安全共享和跨账号复制策略。
  remediation: |
    - 通过复制快照并启用加密的方式生成加密快照，确认可恢复后删除未加密副本。
    - 为新建数据库和快照流程强制启用 KMS 加密，并定期审计手动快照状态。
  reference:
    - https://docs.aws.amazon.com/AmazonRDS/latest/UserGuide/USER_EncryptSnapshot.html
  metadata:
    max-request: 2
    vendor: amazon
    product: rds
  tags: cloud,devops,aws,amazon,rds,aws-cloud-config
variables:
  region: "ap-northeast-1"

flow: |
  code(1)
  for(let RDPsnaps of iterate(template.snapshots)){
    set("snapshot", RDPsnaps)
    code(2)
  }

self-contained: true
code:
  - engine:
      - sh
      - bash
    source: |
      aws rds describe-db-snapshots --region $region --snapshot-type manual --output json --query 'DBSnapshots[*].DBSnapshotIdentifier'

    extractors:
      - type: json
        name: snapshots
        internal: true
        json:
          - '.[]'

  - engine:
      - sh
      - bash
    source: |
         aws rds describe-db-snapshots --region $region --db-snapshot-identifier $snapshot --query 'DBSnapshots[*].Encrypted'

    matchers:
      - type: word
        words:
          - 'false'

    extractors:
      - type: dsl
        dsl:
          - '"Amazon RDS database snapshot " + snapshot + " is not encrypted"'
