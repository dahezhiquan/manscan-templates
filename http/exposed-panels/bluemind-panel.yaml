id: bluemind-panel

info:
  name: Bluemind 面板识别（指纹识别）
  author: Tigibus
  severity: info
  description: |-
    检测到目标站点存在 Bluemind 相关响应特征。Bluemind 是监控、日志、分析或仪表盘系统，用于展示运行指标、访问统计、日志事件和服务状态。模板请求 `/login/native`，并通过页面标题或正文关键字、状态码确认该系统指纹，用于资产识别、系统盘点和暴露面梳理。
  reference:
    - https://bluemind.net/
  metadata:
    verified: true
    max-request: 1
    shodan-query: http.title:"Welcome to BlueMind"
  tags: bluemind,login,panel,detect,discovery
http:
  - method: GET
    path:
      - "{{BaseURL}}/login/native"

    matchers-condition: and
    matchers:
      - type: word
        part: body
        words:
          - 'alt="BlueMind"'
          - 'window.bmExtensions'
        condition: and

      - type: status
        status:
          - 200

    extractors:
      - type: regex
        group: 1
        part: body
        regex:
          - 'window\.applicationVersion = "([0-9.]+)";'
