id: azure-functionapp-vnet-integration-missing
info:
  name: Azure Functions 未启用虚拟网络集成（云安全）
  author: princechaddha
  severity: high
  description: Azure Functions 的虚拟网络集成用于控制函数应用的出站流量，使其能够访问私有终结点和受网络限制的依赖服务。未启用集成时，函数可能无法访问内部资源，或被迫通过公网终结点连接后端。本模板查询 siteConfig.vnetName，并在返回空值时报告未配置虚拟网络集成。
  impact: |
    - 函数到存储、数据库或密钥服务的出站流量可能无法经过预期的网络隔离和私有访问路径。
    - 为绕过连接失败而开放后端公网访问，会扩大数据服务攻击面并增加凭据被滥用后的横向移动风险。
  remediation: |
    - 将函数应用接入专用子网并配置虚拟网络集成，确保子网委派、路由和 DNS 能够支持目标私有终结点。
    - 对后端服务同步启用 Private Endpoint 或网络规则，避免仅依赖虚拟网络集成而保留不必要的公网入口。
  reference:
    - https://docs.microsoft.com/en-us/azure/azure-functions/functions-networking-options
  metadata:
    vendor: microsoft
    product: azure-functions
  tags: cloud,devops,azure,microsoft,functionapp,azure-cloud-config

flow: |
  code(1);
  for (let AppData of iterate(template.functionApps)) {
    AppData = JSON.parse(AppData);
    set("name", AppData.name);
    set("resourceGroup", AppData.resourceGroup);
    code(2);
  }

self-contained: true
code:
  - engine:
      - sh
      - bash
    source: |
      az functionapp list --output json --query '[*].{name:name, resourceGroup:resourceGroup}'

    extractors:
      - type: json
        name: functionApps
        internal: true
        json:
          - '.[]'

  - engine:
      - sh
      - bash
    source: |
      az functionapp show --name $name --resource-group $resourceGroup --query 'siteConfig.vnetName' --output json

    matchers:
      - type: word
        words:
          - ""

    extractors:
      - type: dsl
        dsl:
          - 'name + " does not have Virtual Network Integration enabled"'
