id: avaya-aura-communication-manager-panel

info:
  name: Avaya Aura Communication Manager Login 面板识别（暴露面识别）
  author: princechaddha
  severity: info
  description: 该模板通过识别 Avaya Aura Communication Manager Login 登录入口的页面标题、特征文本或重定向行为，判断目标是否暴露了对应的认证界面。若命中，说明该登录面板对外可访问，可用于暴露面梳理与后续安全评估。
  classification:
    cvss-metrics: CVSS:3.0/AV:N/AC:L/PR:N/UI:N/S:U/C:N/I:N/A:N
    cwe-id: CWE-200
    cpe: cpe:2.3:a:avaya:aura_communication_manager:*:*:*:*:*:*:*:*
  metadata:
    max-request: 1
    vendor: avaya
    product: aura_communication_manager
  tags: panel,avaya,discovery

http:
  - method: GET
    path:
      - "{{BaseURL}}/cgi-bin/common/login/webLogin"

    matchers-condition: and
    matchers:
      - type: word
        part: body
        words:
          - "Avaya Aura"
          - "Communication Manager (CM)"
        condition: and

      - type: status
        status:
          - 200
