id: gradio-fooocus-panel

info:
  name: 检测 Fooocus 面板（指纹识别）
  author: rxerium
  severity: info
  description: |-
    检测到目标站点存在 检测 Fooocus 相关响应特征。检测 Fooocus 是 AI、LLM 或机器学习相关平台，用于管理模型、数据集、工作区、推理服务或生成任务。模板请求 `/`，并通过页面标题或正文关键字、状态码确认该基础设施指纹；命中结果主要用于威胁狩猎、恶意基础设施识别和外部暴露面梳理。
  reference:
    - https://github.com/lllyasviel/Fooocus
  metadata:
    verified: true
    max-request: 1
    vendor: lllyasviel
    product: fooocus
    shodan-query: 'html:"fooocus"'
  tags: panel,fooocus,ai,image-generation,gradio,detect,discovery
http:
  - method: GET
    path:
      - "{{BaseURL}}"

    host-redirects: true
    max-redirects: 2

    matchers-condition: and
    matchers:
      - type: word
        part: body
        words:
          - 'og:title" content="Fooocus'
          - "window.gradio_config"
        condition: and

      - type: status
        status:
          - 200
