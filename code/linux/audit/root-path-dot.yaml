id: root-path-dot

info:
  name: root PATH 包含当前目录（本地基线扫描）
  author: songyaeji
  severity: high
  description: |
    该模板检查 root 用户 PATH 是否包含当前目录 .。若包含，root 在错误目录执行命令时可能优先运行攻击者放置的同名程序。
  reference:
    - https://isms.kisa.or.kr/main/csap/notice/
    - https://www.hackingarticles.in/linux-privilege-escalation-using-path-variable/
  metadata:
    verified: true
  tags: local,linux,audit,privesc,kisa

self-contained: true

code:
  - engine:
      - sh
    source: |
      echo $PATH | grep -Eq '(^\.?:|:.:|:\.$|^\.$)' && echo "dot-in-path" || echo "safe-path"

    matchers:
      - type: word
        part: response
        words:
          - "dot-in-path"
