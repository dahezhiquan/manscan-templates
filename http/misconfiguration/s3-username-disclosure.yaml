id: s3-username-disclosure

info:
  name: S3 元数据用户名泄露
  author: DhiyaneshDK
  severity: low
  description: |
    该模板用于核查 S3 元数据用户名泄露。该类问题通常源于云对象存储桶或兼容对象存储服务开启了公开读取、公开列表或错误访问策略。模板会向目标发送探测请求，并依据匹配 `(?mi)^x-amz-meta-s3cmd-attrs:\s*\S.+$`、状态码 200、匹配 `(?mi)^(x-amz-meta-s3cmd-attrs:\s*\S.+)$`等证据确认目标是否存在该配置问题。
  impact: |
    - 攻击者可枚举对象列表并下载公开文件，造成业务资料、备份、日志或静态资源泄露。
    - 若桶内资源被业务系统引用，攻击者还可能利用公开内容辅助供应链攻击或品牌仿冒。
  remediation: |
    - 关闭对象存储桶公共访问和列表权限，按业务需要配置最小化 Bucket Policy。
    - 启用云厂商的公共访问阻断、访问日志和异常访问告警。
    - 检查桶内历史文件，移除敏感对象并轮换已暴露的密钥、令牌或下载链接。
  reference:
    - https://github.com/s3tools/s3cmd/issues/1173
    - https://hackerone.com/reports/819146
    - https://medium.com/@jonathanbouman/how-s3cmd-discloses-your-linux-username-to-the-world-b9e4d79cb9e3
  metadata:
    max-request: 1
    shodan-query: 'x-amz-meta-s3cmd-attrs'
  tags: s3,aws,exposure,misconfig,header

http:
  - method: GET
    path:
      - "{{BaseURL}}"

    host-redirects: true
    max-redirects: 2

    matchers-condition: and
    matchers:
      - type: regex
        part: header
        regex:
          - (?mi)^x-amz-meta-s3cmd-attrs:\s*\S.+$

      - type: status
        status:
          - 200

    extractors:
      - type: regex
        part: header
        regex:
          - (?mi)^(x-amz-meta-s3cmd-attrs:\s*\S.+)$
