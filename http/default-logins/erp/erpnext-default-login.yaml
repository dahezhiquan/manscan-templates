id: erpnext-default-login

info:
  name: ERPNext 默认口令登录（弱口令）
  author: 0x_Akoko
  severity: high
  description: |
    该模板用于检测 ERPNext 是否仍可使用默认凭据或弱口令登录。模板主要向 `/` 等认证入口发送请求，使用内置默认凭据组合进行认证尝试，并根据响应中的 `status_code == 200`、`contains_all(body, "Logged In", "home_page", "Administrator")` 等登录成功特征判断登录是否成功；命中说明目标未及时修改出厂、示例或初始化账号口令。
  impact: |
    - 攻击者可登录 ERPNext 后台，管理内容、用户、插件、主题、文件或站点配置。
    - 后台权限被滥用后，可能导致页面篡改、恶意文件上传、敏感资料泄露，或进一步取得服务器执行能力。
  remediation: |
    - 立即修改默认管理员凭据，删除安装向导、演示账号和不必要的后台用户。
    - 限制后台登录入口访问来源，启用多因素认证、登录失败锁定和验证码等防护。
    - 检查近期内容、插件、主题、文件上传和管理员操作记录，确认没有持久化后门。
  reference:
    - https://github.com/frappe/erpnext
    - https://github.com/frappe/erpnext/blob/develop/README.md
  metadata:
    verified: true
    max-request: 1
    vendor: frappe
    product: erpnext
    shodan-query: html:"Login to Frappe"
  tags: erpnext,erp,default-login,vuln

http:
  - raw:
      - |
        POST / HTTP/1.1
        Host: {{Hostname}}
        Content-Type: application/x-www-form-urlencoded; charset=UTF-8

        cmd=login&usr={{username}}&pwd={{password}}&device=desktop

    attack: pitchfork
    payloads:
      username:
        - Administrator
      password:
        - admin

    matchers:
      - type: dsl
        dsl:
          - 'status_code == 200'
          - 'contains_all(body, "Logged In", "home_page", "Administrator")'
          - 'contains_all(set_cookie, "sid=", "system_user=yes")'
        condition: and
