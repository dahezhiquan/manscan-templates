id: gcloud-artifact-registry-public

info:
  name: 公开可访问 Artifact Registry Repositories（云安全）
  author: princechaddha
  severity: high
  description: Artifact Registry 仓库如果 IAM 成员包含 allUsers 或 allAuthenticatedUsers，制品可能被匿名用户或所有 Google 账号访问。本模板枚举项目仓库并读取仓库 IAM policy，匹配这些公共成员时报告仓库存在公开访问配置。
  impact: |
    - 容器镜像、包或构建产物可能被未授权下载，泄露业务代码、依赖版本、镜像层文件或内部配置。
    - 公开仓库还可能被用于供应链侦察，帮助攻击者定位可利用组件和部署流程。
  remediation: |
    - 从 Artifact Registry 仓库 IAM policy 中移除 allUsers 和 allAuthenticatedUsers 授权。
    - 按团队、流水线或服务账号授予最小必要角色，并审计历史制品中是否包含敏感内容。
  reference:
    - https://cloud.google.com/artifact-registry/docs/managing/access-control
  metadata:
    vendor: google
    product: artifact-registry
  tags: cloud,devops,gcp,gcloud,artifact-registry,gcp-cloud-config

flow: |
  code(1)
  for(let projectId of iterate(template.projectIds)){
    set("projectId", projectId)
    code(2)
    for(let repository of iterate(template.repositories)){
      set("repositoryName", repository)
      code(3)
    }
  }

self-contained: true

code:
  - engine:
      - sh
      - bash
    source: |
      gcloud projects list --format="json(projectId)"

    extractors:
      - type: json
        name: projectIds
        internal: true
        json:
          - '.[].projectId'

  - engine:
      - sh
      - bash
    source: |
      gcloud artifacts repositories list --project $projectId --format="json(name)"

    extractors:
      - type: json
        name: repositories
        internal: true
        json:
          - '.[].name'

  - engine:
      - sh
      - bash
    source: |
      gcloud artifacts repositories get-iam-policy $repositoryName --project $projectId --format=json | jq '.bindings[].members[]'

    matchers:
      - type: word
        words:
          - 'allUsers'
          - 'allAuthenticatedUsers'
        condition: or

    extractors:
      - type: dsl
        dsl:
          - '"Publicly Accessible Artifact Repository: " + repositoryName + " in Project: " + projectId'
