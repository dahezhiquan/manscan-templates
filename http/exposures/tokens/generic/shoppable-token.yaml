id: shoppable-token

info:
  name: Shoppable Service Auth 令牌泄露（暴露面识别）
  author: philippedelteil
  severity: high
  reference:
    - https://ask.shoppable.com/knowledge/quick-start-api-guide
  metadata:
    max-request: 1
  tags: exposure,shoppable,token,auth,service,generic,vuln

http:
  - method: GET
    path:
      - "{{BaseURL}}"

    matchers:
      - type: word
        part: body
        words:
          - data-shoppable-auth-token
