id: amazon-web-services-phish

info:
  name: Amazon Web Services 仿冒钓鱼网站（钓鱼网站识别）
  author: rxerium
  severity: info
  description: |
    检测到疑似仿冒 Amazon Web Services 的钓鱼网站。模板在目标页面返回 200、页面内容命中 Amazon Web Services 的品牌页面特征，且当前主机不属于 amazon.com 官方域名时触发，用于识别借用 Amazon Web Services 品牌页面诱导用户信任的仿冒站点。
  reference:
    - https://signin.aws.amazon.com
  metadata:
    max-request: 1
  tags: phishing,amazon-web-services,aws,osint,discovery
http:
  - method: GET
    path:
      - "{{BaseURL}}"

    host-redirects: true
    max-redirects: 2

    matchers-condition: and
    matchers:
      - type: word
        words:
          - 'Amazon Web Services Sign-In'

      - type: status
        status:
          - 200

      - type: dsl
        dsl:
          - '!contains(host,"amazon.com")'
