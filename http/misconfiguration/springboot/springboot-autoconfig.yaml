id: springboot-autoconfig

info:
  name: 检测 Springboot auto配置 Actuator
  author: pussycat0x
  severity: low
  description: |
    检测到 检测 Springboot auto配置 Actuator。目标响应或文件中可能暴露配置、凭据、密钥、令牌、环境变量或历史记录等敏感信息，可能被用于进一步入侵。
  metadata:
    max-request: 2
  tags: springboot,exposure,misconfig,vuln

http:
  - method: GET
    path:
      - "{{BaseURL}}/autoconfig"
      - "{{BaseURL}}/actuator/autoconfig"

    stop-at-first-match: true

    matchers-condition: and
    matchers:
      - type: word
        part: body
        words:
          - "positiveMatches"
          - "AuditAutoConfiguration#auditListener"
          - "EndpointAutoConfiguration#beansEndpoint"
        condition: and

      - type: status
        status:
          - 200
