id: redis-detect

info:
  name: Redis 服务 识别（指纹识别）
  author: pussycat0x
  severity: info
  description: |
    该模板用于识别目标是否开放 Redis 服务。模板向 6379/6380 端口发送 `INFO` 请求，并通过 `DENIED Redis`、`CONFIG REWRITE` 或 `NOAUTH Authentication` 等 Redis 原生错误/认证响应确认服务存在，避免依赖 Web 页面特征造成误判。
  classification:
    cvss-metrics: CVSS:3.1/AV:N/AC:L/PR:N/UI:N/S:U/C:N/I:N/A:N
    cwe-id: CWE-200
  metadata:
    verified: true
    max-request: 2
    shodan-query: product:"redis"
    product: redis
    vendor: redis
  tags: network,redis,detect,tcp,discovery
tcp:
  - inputs:
      - data: "*1\r\n$4\r\ninfo\r\n"

    host:
      - "{{Hostname}}"
      - "tls://{{Hostname}}"
    port: 6379,6380
    read-size: 1024

    matchers:
      - type: word
        words:
          - "DENIED Redis"
          - "CONFIG REWRITE"
          - "NOAUTH Authentication"
        condition: or
