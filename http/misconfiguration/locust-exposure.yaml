id: locust-exposure

info:
  name: Locust 暴露
  author: DhiyaneshDK,bhutch
  severity: medium
  description: |
    该模板用于核查 Locust 暴露。该类问题通常源于配置文件、备份文件、管理页面、服务状态或敏感资源被错误暴露到 Web 访问路径。模板会向目标发送探测请求，并依据匹配 `<title>Locust(?: for.+)?</title>`、匹配 `locust.js`、匹配 `Charts</a>`等证据确认目标是否存在该配置问题。
  impact: |
    - 攻击者可获取版本、路径、账号、密钥、令牌、配置或业务数据等敏感信息。
    - 泄露的信息可能被用于凭据攻击、漏洞匹配、权限提升或横向移动。
  remediation: |
    - 移除 Web 根目录下不应公开的配置、备份、日志和临时文件。
    - 为敏感页面和资源增加访问控制，并按最小暴露原则收敛公开路径。
    - 轮换已暴露的密钥、令牌和凭据，并审计异常下载或枚举行为。
  classification:
    cpe: cpe:2.3:a:locust:locust:*:*:*:*:*:*:*:*
  metadata:
    verified: true
    max-request: 1
    vendor: locust
    product: locust
    shodan-query: title:"Locust"
  tags: exposure,locust,misconfig,vuln

http:
  - method: GET
    path:
      - '{{BaseURL}}'

    matchers-condition: and
    matchers:
      - type: regex
        part: body
        regex:
          - '<title>Locust(?: for.+)?</title>'

      - type: word
        part: body
        words:
          - 'locust.js'
          - 'Charts</a>'
        condition: or

      - type: status
        status:
          - 200
