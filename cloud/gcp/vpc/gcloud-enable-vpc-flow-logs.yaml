id: gcloud-enable-vpc-flow-logs

info:
  name: Enable VPC Flow Logs 的VPC Subnets（云安全）
  author: princechaddha
  severity: medium
  description: VPC Flow Logs 可记录子网内网络连接元数据，是发现横向移动、异常出站和访问基线偏差的重要信号。本模板枚举 VPC 子网并检查 enableFlowLogs，值为 false 或 null 时报告未启用流日志。
  impact: |
    - 子网内东西向流量和出站连接缺少可审计记录，影响入侵调查和网络取证。
    - 安全团队难以及时发现异常端口扫描、数据外传或非常规通信路径。
  remediation: |
    - 为关键子网启用 VPC Flow Logs，并根据日志量配置采样、聚合间隔和元数据字段。
    - 将流日志接入安全分析和告警，关注异常来源、端口、地理位置和数据量变化。
  reference:
    - https://cloud.google.com/vpc/docs/using-flow-logs
  metadata:
    vendor: google
    product: cloud-vpc
  tags: cloud,devops,gcp,gcloud,google-cloud-vpc,flow-logs,networking,security,gcp-cloud-config

flow: |
  code(1)
  for(let projectId of iterate(template.projectIds)){
    set("projectId", projectId)
    code(2)
    for(let network of iterate(template.networks)){
      set("networkName", network)
      code(3)
      for(let subnet of iterate(template.subnets)){
        subnet = JSON.parse(subnet);
        set("subnetName", subnet.name)
        set("subnetRegion", subnet.region)
        code(4)
      }
    }
  }

self-contained: true

code:
  - engine:
      - sh
      - bash
    source: |
      gcloud projects list --format="json(projectId)"

    extractors:
      - type: json
        name: projectIds
        internal: true
        json:
          - '.[].projectId'

  - engine:
      - sh
      - bash
    source: |
      gcloud compute networks list --project $projectId --format="json(name)"

    extractors:
      - type: json
        name: networks
        internal: true
        json:
          - '.[].name'

  - engine:
      - sh
      - bash
    source: |
      gcloud compute networks subnets list --network=$networkName --project=$projectId --format="json(name,region.basename())"

    extractors:
      - type: json
        name: subnets
        internal: true
        json:
          - '.[]'

  - engine:
      - sh
      - bash
    source: |
      gcloud compute networks subnets describe $subnetName --project=$projectId --format=json --region $subnetRegion | jq '.enableFlowLogs // "null"'

    matchers:
      - type: word
        words:
          - 'false'
          - 'null'

    extractors:
      - type: dsl
        dsl:
          - '"The subnet " + subnetName + " of network " + networkName + " in project " + projectId + " does not have VPC Flow Logs enabled"'
