id: azure-aks-managed-identity-unassigned
info:
  name: Azure AKS 未使用系统分配托管身份（云安全）
  author: princechaddha
  severity: medium
  description: AKS 集群身份类型配置为 UserAssigned 而不是 SystemAssigned 时，集群身份的生命周期与集群资源解耦，可能偏离要求使用集群专属身份的安全基线。该模板查询 identity.type，并在返回 UserAssigned 时报告未使用系统分配托管身份。
  impact: |
    - 用户分配身份可以跨资源复用；若角色权限过宽或被多个集群共享，一个身份被滥用可能扩大影响范围。
    - 身份与集群生命周期不一致会增加权限回收、资源销毁和异常身份使用审计的复杂度。
  remediation: |
    - 对不需要跨资源复用身份的集群，改用 SystemAssigned，并为其授予运行所需的最小 Azure RBAC 权限。
    - 如业务必须使用 UserAssigned，应限制身份复用范围，定期审计角色分配、凭据使用和集群销毁后的残留权限。
  reference:
    - https://docs.microsoft.com/en-us/azure/aks/use-managed-identity
  metadata:
    vendor: microsoft
    product: azure-kubernetes-service
  tags: cloud,devops,azure,microsoft,aks,azure-cloud-config

flow: |
  code(1);
  for (let AKSData of iterate(template.clusterList)) {
    AKSData = JSON.parse(AKSData);
    set("name", AKSData.name);
    set("resourceGroup", AKSData.resourceGroup);
    code(2);
  }

self-contained: true
code:
  - engine:
      - sh
      - bash
    source: |
      az aks list --output json --query '[*].{name:name, resourceGroup:resourceGroup}'

    extractors:
      - type: json
        name: clusterList
        internal: true
        json:
          - '.[]'

  - engine:
      - sh
      - bash
    source: |
      az aks show --name "$name" --resource-group "$resourceGroup" --query 'identity.type'

    matchers-condition: and
    matchers:
      - type: word
        words:
          - "UserAssigned"

    extractors:
      - type: dsl
        dsl:
          - '"AKS cluster named " + name + " in resource group " + resourceGroup + " is not using a system-assigned managed identity"'
