id: pulsar-admin-console

info:
  name: Pulsar Admin Console 面板识别（暴露面识别）
  author: ritikchaddha
  severity: info
  description: 该模板通过识别 Pulsar Admin Console 面板、控制台或管理界面的页面特征，判断目标是否暴露了对应服务入口。若命中，说明该后台或运维界面对外可访问，可用于资产识别与暴露面排查。
  classification:
    cvss-metrics: CVSS:3.0/AV:N/AC:L/PR:N/UI:N/S:U/C:N/I:N/A:N
    cwe-id: CWE-200
    cpe: cpe:2.3:a:apache:pulsar:*:*:*:*:*:*:*:*
  metadata:
    verified: true
    max-request: 1
    vendor: apache
    product: pulsar
    shodan-query:
      - title:"Pulsar Admin Console"
      - http.title:"pulsar admin ui"
      - http.title:"pulsar admin console"
    fofa-query:
      - title="pulsar admin ui"
      - title="pulsar admin console"
    google-query:
      - intitle:"pulsar admin ui"
      - intitle:"pulsar admin console"
  tags: panel,pulsar,console,admin,apache,discovery

http:
  - method: GET
    path:
      - '{{BaseURL}}/#/admin/dashboard'

    matchers-condition: and
    matchers:
      - type: word
        part: body
        words:
          - '<title>Pulsar Admin Console'

      - type: status
        status:
          - 200
