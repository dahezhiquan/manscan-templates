id: gcloud-vm-ip-forwarding-enabled

info:
  name: IP Forwarding 未Disabled 的VM Instances（云安全）
  author: princechaddha
  severity: medium
  description: Compute Engine 实例启用 IP forwarding 后可转发非本机目的地址的流量，通常只应出现在 NAT、代理或安全设备场景。本模板枚举 VM 并检查 canIpForward，值为 true 时报告实例启用了 IP 转发。
  impact: |
    - 被入侵的实例可能被用作流量转发、绕过网络边界或辅助横向移动的节点。
    - 非预期转发会增加路由和防火墙排障复杂度，削弱网络隔离策略的可控性。
  remediation: |
    - 对普通业务 VM 关闭 IP forwarding，仅在明确的 NAT、路由、防火墙或代理设备上启用。
    - 复核启用实例的路由、服务账号和防火墙规则，记录业务用途并纳入持续巡检。
  reference:
    - https://www.trendmicro.com/cloudoneconformity/knowledge-base/gcp/ComputeEngine/disable-ip-forwarding.html
    - https://cloud.google.com/vpc/docs/using-routes
  metadata:
    vendor: google
    product: compute-engine
  tags: cloud,devops,gcp,gcloud,compute,security,networking,ip-forwarding,gcp-cloud-config

flow: |
  code(1)
  for(let projectId of iterate(template.projectIds)){
    set("projectId", projectId)
    code(2)
    for(let instance of iterate(template.instances)){
      instance = JSON.parse(instance)
      set("instanceName", instance.name)
      set("zone", instance.zone)
      code(3)
    }
  }

self-contained: true

code:
  - engine:
      - sh
      - bash
    source: |
      gcloud projects list --format="json(projectId)"

    extractors:
      - type: json
        name: projectIds
        internal: true
        json:
          - '.[].projectId'

  - engine:
      - sh
      - bash
    source: |
      gcloud compute instances list --project $projectId --format="json(name,zone.basename())"

    extractors:
      - type: json
        name: instances
        internal: true
        json:
          - '.[]'

  - engine:
      - sh
      - bash
    source: |
      gcloud compute instances describe $instanceName --zone $zone --project $projectId --format="json(canIpForward)"

    matchers:
      - type: word
        words:
          - '"canIpForward": true'

    extractors:
      - type: dsl
        dsl:
          - '"VM instance " + instanceName + " in zone " + zone + " of project " + projectId + " has IP forwarding enabled"'
