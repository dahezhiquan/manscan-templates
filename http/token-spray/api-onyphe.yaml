id: api-onyphe

info:
  name: Onyphe API Token 可用性校验（token喷洒）
  author: 0xpugal
  severity: info
  description: 该模板通过调用 Onyphe API 的已知接口验证提供的 token 是否有效，命中后通常表示可访问安全情报与资产查询能力。
  reference:
    - https://www.onyphe.io/docs
  metadata:
    verified: true
    max-request: 1
  tags: token-spray,onyphe

self-contained: true

http:
  - method: GET
    path:
      - "https://www.onyphe.io/api/v2/user"

    headers:
      Authorization: Bearer {{token}}
      Content-Type: application/json

    matchers-condition: and
    matchers:
      - type: word
        part: body
        words:
          - '"apikey":"'
          - '"apis":'
          - '"@timestamp":'
          - '"@category":'
        condition: and

      - type: word
        part: header
        words:
          - 'application/json'

      - type: status
        status:
          - 200
