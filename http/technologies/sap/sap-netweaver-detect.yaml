id: sap-netweaver-detect

info:
  name: SAP NetWeaver ICM 指纹识别（指纹识别）
  author: randomstr1ng,righettod
  severity: info
  description: |
    用于识别目标是否部署 SAP NetWeaver ICM 并提取相关版本或构建信息，模板会结合 favicon 哈希、HTTP 响应头、页面正文、特定路径或已知端点和版本或标识提取结果进行指纹匹配。
  metadata:
    verified: true
    max-request: 1
    shodan-query: http.favicon.hash:-266008933
    fofa-query:
      - "sap-server:"
      - icon_hash=-266008933
    product: content_server
    vendor: sap
  tags: sap,webserver,tech,detect,discovery

http:
  - method: GET
    path:
      - "{{BaseURL}}"

    redirects: true
    max-redirects: 2
    matchers-condition: or
    matchers:
      - type: word
        part: header
        words:
          - "sap-server:"
          - "SAP NetWeaver Application Server"
        condition: or
        case-insensitive: true

      - type: word
        part: body
        words:
          - "SAP NetWeaver Application Server"
          - "SAP NetWeaver Developer Studio"
          - "SAP Management Console"
        condition: or

    extractors:
      - type: kval
        part: header
        kval:
          - "server"
