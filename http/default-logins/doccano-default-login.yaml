id: doccano-default-login

info:
  name: Doccano 默认口令登录（弱口令）
  author: 0x_Akoko
  severity: high
  description: |
    该模板用于检测 Doccano 是否仍可使用默认凭据或弱口令登录。模板主要向 `/auth`、`/v1/auth-token` 等认证入口发送请求，使用内置默认凭据组合进行认证尝试，并根据响应中的 `status_code == 200`、`contains_all(body, "doccano", "/_nuxt/")` 等登录成功特征判断登录是否成功；命中说明目标未及时修改出厂、示例或初始化账号口令。
  impact: |
    - 攻击者可进入 Doccano 管理后台，修改任务、服务、插件、路由、作业调度或部署配置。
    - 在 DevOps、网关、监控或调度场景中，后台失陷可能影响生产任务执行、泄露密钥配置，并扩大到下游主机或业务系统。
  remediation: |
    - 立即修改默认管理员口令并清理示例账号，按角色最小化后台管理权限。
    - 将控制台和管理 API 放入受控网络或 VPN 后方，并开启多因素认证、登录失败限制和操作审计。
    - 复核近期任务、插件、连接配置、访问令牌和部署记录，轮换可能暴露的密钥。
  reference:
    - https://github.com/doccano/doccano
    - https://doccano.github.io/doccano/
  metadata:
    verified: true
    max-request: 3
    vendor: doccano
    product: doccano
    shodan-query: http.title:"doccano"
    fofa-query: title="doccano"
  tags: doccano,default-login,vuln

flow: http(1) && http(2) && http(3)

http:
  - raw:
      - |
        GET /auth HTTP/1.1
        Host: {{Hostname}}
        Accept: text/html

    matchers:
      - type: dsl
        dsl:
          - 'status_code == 200'
          - 'contains_all(body, "doccano", "/_nuxt/")'
        condition: and
        internal: true

  - raw:
      - |
        POST /v1/auth-token HTTP/1.1
        Host: {{Hostname}}
        Content-Type: application/json
        Accept: application/json

        {"username":"admin","password":"password"}

    matchers:
      - type: dsl
        dsl:
          - 'status_code == 200'
          - 'contains(content_type, "application/json")'
          - 'contains(body, "token")'
        condition: and
        internal: true

    extractors:
      - type: json
        name: token
        part: body
        json:
          - '.token'
        internal: true

  - raw:
      - |
        GET /v1/me HTTP/1.1
        Host: {{Hostname}}
        Authorization: Token {{token}}
        Accept: application/json


    matchers:
      - type: dsl
        dsl:
          - 'status_code == 200'
          - 'contains(content_type, "application/json")'
          - 'contains_all(body, "\"username\"", "\"is_superuser\"", "admin")'
        condition: and
