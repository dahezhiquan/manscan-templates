id: vikunja-detect

info:
  name: Vikunja - 检测（指纹识别）
  author: ChrisJr404
  severity: info
  description: |-
    通过未认证的 info API 端点检测 Vikunja 实例并提取运行版本。Vikunja 是一款自托管的待办事项与项目管理应用。
  reference:
    - https://vikunja.io/
    - https://github.com/go-vikunja/vikunja
    - https://vikunja.io/docs/config-options/
  metadata:
    verified: true
    max-request: 1
    shodan-query: http.title:"Vikunja"
  tags: tech,vikunja,detect

http:
  - method: GET
    path:
      - "{{BaseURL}}/api/v1/info"

    matchers-condition: and
    matchers:
      - type: dsl
        dsl:
          - 'status_code == 200'
          - 'contains(content_type, "application/json")'
          - 'contains_all(body, "\"link_sharing_enabled\"", "\"available_migrators\"", "\"caldav_enabled\"")'
        condition: and

    extractors:
      - type: json
        part: body
        json:
          - '.version'
