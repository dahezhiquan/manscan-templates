id: azure-openai-private-endpoints-unconfigured
info:
  name: Azure OpenAI 服务实例未配置专用终结点（云安全）
  author: princechaddha
  severity: high
  description: Azure OpenAI 服务实例未配置 Private Endpoint 时，客户端可能通过公共终结点访问 AI 服务，网络隔离和出站控制能力会受到限制。该模板枚举 kind 为 OpenAI 的服务实例，查询 properties.privateEndpointConnections；当返回空数组 [] 时判定未配置专用终结点。
  impact: |
    - 公共终结点扩大了服务的可达范围，增加未授权调用、凭据滥用和敏感提示词或响应数据外泄的风险。
    - 无法将访问限制在受控虚拟网络内时，网络审计、出站过滤和数据边界控制会更难落实。
  remediation: |
    - 在承载工作负载的虚拟网络中为 Azure OpenAI 创建 Private Endpoint，并配置对应的私有 DNS 解析和网络路由。
    - 结合服务支持情况关闭公共网络访问或收紧网络 ACL，并验证应用仅能通过预期的私有路径访问服务。
  reference:
    - https://docs.microsoft.com/en-us/azure/private-link/private-endpoint-overview
  metadata:
    vendor: microsoft
    product: azure-openai
  tags: cloud,devops,azure,microsoft,openai,azure-cloud-config,ai

flow: |
  code(1);
  for (let ServiceInstance of iterate(template.serviceList)) {
    ServiceInstance = JSON.parse(ServiceInstance);
    set("name", ServiceInstance.Name);
    set("resourceGroup", ServiceInstance.ResourceGroup);
    code(2);
  }

self-contained: true
code:
  - engine:
      - sh
      - bash
    source: |
      az cognitiveservices account list --output json --query '[?(kind==`OpenAI`)].{Name:name, ResourceGroup:resourceGroup}'

    extractors:
      - type: json
        name: serviceList
        internal: true
        json:
          - '.[]'

  - engine:
      - sh
      - bash
    source: |
      az cognitiveservices account show --name "$name" --resource-group "$resourceGroup" --query 'properties.privateEndpointConnections'

    matchers-condition: and
    matchers:
      - type: word
        words:
          - '[]'

    extractors:
      - type: dsl
        dsl:
          - 'name + " in " + resourceGroup + " does not have private endpoint connections configured"'
