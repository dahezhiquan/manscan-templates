id: dockwatch-panel

info:
  name: Dockwatch 面板识别（暴露面识别）
  author: s4e-io
  severity: info
  description: |
    该模板通过识别 Dockwatch 面板、控制台或管理界面的页面特征，判断目标是否暴露了对应服务入口。若命中，说明该后台或运维界面对外可访问，可用于资产识别与暴露面排查。
  metadata:
    verified: true
    max-request: 1
    fofa-query: icon_hash="1991646591"
  tags: panel,login,dockwatch,detect,discovery

http:
  - method: GET
    path:
      - "{{BaseURL}}/login.php"

    matchers:
      - type: dsl
        dsl:
          - 'contains_any(body, "dockwatch-maintenance", "Restart Dockwatch")'
          - 'status_code == 200'
        condition: and
