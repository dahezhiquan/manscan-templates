id: apache-cocoon-detect

info:
  name: Apache Cocoon 指纹识别（指纹识别）
  author: ffffffff0x
  severity: info
  description: Apache Cocoon 是基于 Java/XML 的 Web 应用框架，用于内容发布和管道式 Web 处理。该模板请求首页，并依据页面标题、正文关键字或品牌资源特征、响应头特征识别目标是否使用或暴露了 Apache Cocoon 相关组件，适用于资产盘点、技术栈识别和后续安全评估；命中结果仅表示指纹特征匹配，不代表已确认存在可利用漏洞。
  classification:
    cpe: cpe:2.3:a:apache:cocoon:*:*:*:*:*:*:*:*
  metadata:
    verified: true
    max-request: 1
    vendor: apache
    product: cocoon
    shodan-query: http.html:"Apache Cocoon"
    fofa-query: app="APACHE-Cocoon"
  tags: apache,cocoon,tech,discovery

http:
  - method: GET
    path:
      - "{{BaseURL}}"

    host-redirects: true
    max-redirects: 2
    matchers:
      - type: word
        part: header
        words:
          - "X-Cocoon-Version"

    extractors:
      - type: regex
        part: header
        regex:
          - 'X\-Cocoon\-Version:([ 0-9.]+)'
