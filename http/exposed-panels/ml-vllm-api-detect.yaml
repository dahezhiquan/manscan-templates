id: ml-vllm-api-detect

info:
  name: vLLM OpenAI-Compatible Server 识别（指纹识别）
  author: ChrisJr404
  severity: info
  description: |-
    检测到目标站点存在 vLLM OpenAI-Compatible Server 相关响应特征。vLLM OpenAI-Compatible Server 是 API 管理、计算或服务控制台，用于维护接口、路由、执行环境、上游服务和访问策略。模板请求 `/`，并通过页面标题或正文关键字、状态码、DSL 条件确认该系统指纹，用于资产识别、系统盘点和暴露面梳理。
  reference:
    - https://github.com/vllm-project/vllm
    - https://docs.vllm.ai/en/latest/serving/openai_compatible_server.html
  metadata:
    verified: true
    max-request: 1
    vendor: vllm-project
    product: vllm
    shodan-query: '"served-model-name"'
    fofa-query: body="vllm" && body="/v1/models"
  tags: tech,vllm,llm,ai,ml,openai,detect
http:
  - method: GET
    path:
      - "{{BaseURL}}"

    matchers:
      - type: dsl
        dsl:
          - 'status_code == 200'
          - 'contains_all(body, "vLLM", "/v1/models", "/v1/chat/completions")'
        condition: and

    extractors:
      - type: regex
        part: body
        group: 1
        regex:
          - '"version"\s*:\s*"([^"]+)"'
