id: hp-printer-default-login

info:
  name: Hewlett Packard LaserJet Printer 默认口令登录（弱口令）
  author: JohnAsbjorn
  severity: high
  description: |
    该模板用于检测 Hewlett Packard LaserJet Printer 是否仍可使用默认凭据或弱口令登录。模板主要向 `/hp/device/SignIn/Index` 等认证入口发送请求，使用内置默认凭据组合进行认证尝试，并根据响应中的 `User: Administrator`、`Sign out` 等登录成功特征判断登录是否成功；命中说明目标未及时修改出厂、示例或初始化账号口令。
  impact: |
    - 攻击者可接管 Hewlett Packard LaserJet Printer 的 Web 管理界面，查看设备状态、网络配置、运行日志或敏感业务参数。
    - 被接管的网络、工控、打印、语音、存储或远程管理设备可能被用于中断业务、改变路由/访问策略、窃取流量或作为内网横向移动入口。
  remediation: |
    - 立即修改所有默认账号口令，禁用不再使用的出厂账号，并为管理账户设置高强度唯一密码。
    - 将设备管理入口限制在 VPN、堡垒机或可信管理网段内，避免直接暴露到公网。
    - 升级设备固件或管理组件，审计近期登录记录、配置变更和异常会话。
  reference:
    - https://h30434.www3.hp.com/t5/Printing-Errors-or-Lights-Stuck-Print-Jobs/What-is-the-user-name-and-password-in-Embedded-Web-Server/td-p/6165417
  metadata:
    verified: true
    shodan-query: html:"hp/device/SignIn/Index"
    max-request: 2
  tags: hp,printer,default-login,intrusive,vuln

http:
  - raw:
      - |
        GET /hp/device/SignIn/Index HTTP/1.1
        Host: {{Hostname}}
        Accept-Encoding: identity
        Accept-Language: en

    extractors:
      - type: regex
        name: token
        part: body
        group: 1
        regex:
          - 'id="CSRFToken" name="CSRFToken" value="([^"]+)"'
        internal: true

  - raw:
      - |
        POST /hp/device/SignIn/Index HTTP/1.1
        Host: {{Hostname}}
        Accept-Encoding: identity
        Content-Type: application/x-www-form-urlencoded
        Origin: {{RootURL}}
        Referer: {{RootURL}}/hp/device/SignIn/Index

        CSRFToken={{token}}&agentIdSelect=hp_EmbeddedPin_v1&PinDropDown=AdminItem&PasswordTextBox=&signInOk=Sign+In

    redirects: true
    max-redirects: 2

    matchers-condition: or
    matchers:
      - type: word
        part: body
        words:
          - "User: Administrator"
          - "Sign out"
        condition: and

      - type: regex
        part: header
        regex:
          - 'Set-Cookie: .*session.*'

      - type: status
        status:
          - 200
