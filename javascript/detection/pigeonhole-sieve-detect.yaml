id: pigeonhole-sieve-detect

info:
  name: Pigeonhole Sieve 服务识别（指纹识别）
  author: pussycat0x
  severity: info
  description: |
    Dovecot Pigeonhole 是 Dovecot 邮件服务器的 Sieve 过滤规则实现，ManageSieve 服务通常用于让用户远程管理邮件过滤脚本。该模板连接 TCP 4190 端口并读取服务端欢迎语与能力响应，在响应同时包含 `SIEVE` 和 `IMPLEMENTATION` 时确认 Pigeonhole/ManageSieve 服务，并提取 `VERSION` 字段作为版本指纹。
  metadata:
    verified: true
    vendor: dovecot
    product: pigeonhole
    shodan-query: product:"Dovecot Pigeonhole sieve"
  tags: sieve,network,js,tcp,detect,discovery

javascript:

  - pre-condition: |
      isPortOpen(Host,Port);

    code: |
      let packet = bytes.NewBuffer();
      const c = require("nuclei/net");
      const cmd = "00000000"
      packet.WriteString(cmd)
      let conn = c.Open('tcp', `${Host}:${Port}`);
      conn.SendHex(packet.Hex());
      const result = conn.RecvString();
      Export(result);

    args:
      Host: "{{Host}}"
      Port: 4190

    matchers:
      - type: dsl
        dsl:
          - "success == true"
          - contains_all(response, "SIEVE","IMPLEMENTATION")
        condition: and

    extractors:
      - type: regex
        name: version
        regex:
          - 'VERSION([ "0-9.]+)'
