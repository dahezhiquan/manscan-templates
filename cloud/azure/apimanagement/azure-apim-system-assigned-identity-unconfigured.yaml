id: azure-apim-system-assigned-identity-unconfigured
info:
  name: Azure API Management 未配置系统分配托管身份（云安全）
  author: princechaddha
  severity: medium
  description: APIM 实例未使用系统分配托管身份时，访问 Key Vault、证书或其他 Azure 资源可能需要长期密钥或人工维护的服务主体凭据。该模板查询 identity.type，并在返回 UserAssigned 或 none 时报告未配置系统分配托管身份。
  impact: |
    - 长期凭据可能被写入配置或脚本并被滥用，导致 Key Vault 机密、证书或后端资源被未授权读取。
    - 缺少与 APIM 生命周期绑定的身份会增加权限回收、凭据轮换和异常访问审计成本。
  remediation: |
    - 为 APIM 启用系统分配托管身份，并通过 Azure RBAC 或 Key Vault 权限模型授予所需的最小权限。
    - 迁移完成后停用或轮换旧凭据，审计身份的角色范围、密钥访问记录和后端资源授权。
  reference:
    - https://docs.microsoft.com/en-us/azure/api-management/api-management-howto-use-managed-service-identity
  metadata:
    vendor: microsoft
    product: azure-api-management
  tags: cloud,devops,azure,microsoft,api-management,azure-cloud-config

flow: |
  code(1);
  for (let ApiService of iterate(template.apiServiceList)) {
    ApiService = JSON.parse(ApiService);
    set("name", ApiService.name);
    set("resourceGroup", ApiService.resourceGroup);
    code(2);
  }

self-contained: true
code:
  - engine:
      - sh
      - bash
    source: |
      az apim list --output json --query '[*].{name:name, resourceGroup:resourceGroup}'

    extractors:
      - type: json
        name: apiServiceList
        internal: true
        json:
          - '.[]'

  - engine:
      - sh
      - bash
    source: |
      az apim show --name "$name" --resource-group "$resourceGroup" --query 'identity.type'

    matchers-condition: and
    matchers:
      - type: word
        words:
          - "UserAssigned"
          - "none"

    extractors:
      - type: dsl
        dsl:
          - 'name + " in " + resourceGroup + " does not have a system-assigned managed identity enabled"'
