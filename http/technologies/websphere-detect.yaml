id: websphere-detect

info:
  name: IBM WebSphere 应用服务器指纹识别（指纹识别）
  author: Shivam Kamboj
  severity: info
  description: 用于识别目标是否部署 IBM WebSphere 应用服务器 并提取相关版本或构建信息，模板会结合 HTTP 响应头、特定路径或已知端点和版本或标识提取结果进行指纹匹配。
  reference:
    - https://www.ibm.com/products/websphere-application-server
  metadata:
    max-request: 1
    vendor: ibm
    product: websphere
    fofa-query: "WebSphere-Application-Server"
  tags: tech,websphere,ibm

http:
  - method: GET
    path:
      - "{{BaseURL}}"

    matchers:
      - type: regex
        part: header
        regex:
          - '(?i)WebSphere Application Server'

    extractors:
      - type: regex
        part: header
        group: 1
        regex:
          - '(?i)WebSphere Application Server/([0-9.]+)'
