id: krpano-detect

info:
  name: Krpano Panorama Viewer 指纹识别（指纹识别）
  author: matejsmycka
  severity: info
  description: |
    用于识别目标是否使用 Krpano Panorama Viewer，模板会结合页面正文和特定路径或已知端点进行技术指纹匹配。
  reference:
    - https://krpano.com/
  metadata:
    vendor: krpano
    product: panorama_viewer
    shodan-query: http.html:"embedpano"
  tags: tech,krpano,viewer,discovery

http:
  - method: GET
    path:
      - "{{BaseURL}}"
      - "{{BaseURL}}/krpano.html"

    stop-at-first-match: true

    host-redirects: true
    max-redirects: 2

    matchers:
      - type: word
        part: body
        words:
          - "embedpano({"
          - "passQueryParameters:true"
          - "swf"
        condition: and
