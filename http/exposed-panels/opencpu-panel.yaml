id: opencpu-panel

info:
  name: OpenCPU 面板识别（暴露面识别）
  author: wa1tf0rme
  severity: info
  description: 该模板通过识别 OpenCPU 面板、控制台或管理界面的页面特征，判断目标是否暴露了对应服务入口。若命中，说明该后台或运维界面对外可访问，可用于资产识别与暴露面排查。
  reference:
    - https://github.com/opencpu/opencpu/
  classification:
    cvss-metrics: CVSS:3.1/AV:N/AC:L/PR:N/UI:N/S:U/C:N/I:N/A:N
    cwe-id: CWE-200
  metadata:
    max-request: 1
  tags: panel,opencpu,oss,discovery

http:
  - method: GET
    path:
      - "{{BaseURL}}/ocpu/"

    max-redirects: 2
    redirects: true
    matchers:
      - type: word
        words:
          - OpenCPU Test Page
          - OpenCPU API Explorer
        condition: or
