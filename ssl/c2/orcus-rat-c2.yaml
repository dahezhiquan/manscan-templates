id: orcus-rat-c2

info:
  name: Orcus RAT 证书识别（证书安全）
  author: pussycat0x
  severity: info
  description: 该模板通过证书颁发者字段识别目标是否可能与 Orcus RAT 基础设施相关。命中说明对端证书与 Orcus 家族常见的签发标识一致。
  reference:
    - https://github.com/thehappydinoa/awesome-censys-queries#orcusrat--
  metadata:
    verified: "true"
    max-request: 1
    censys-query: 'services.tls.certificates.leaf_data.subject.common_name: {"Orcus Server", "OrcusServerCertificate"}'
  tags: c2,ssl,tls,ir,osint,malware,orcusrat,discovery
ssl:
  - address: "{{Host}}:{{Port}}"
    matchers:
      - type: word
        part: issuer_cn
        words:
          - "Orcus Server"
          - "OrcusServerCertificate"
        condition: or

    extractors:
      - type: json
        json:
          - ".issuer_cn"
