id: netstat-service-expose

info:
  name: Netstat 服务暴露（服务漏洞）
  author: pussycat0x
  severity: low
  description: |
    目标暴露了历史 Netstat 服务，远程用户可能直接获取网络连接、路由或服务状态信息。模板连接相关端口并检查返回内容中的网络状态格式，以确认该信息泄露面存在。
  impact: |
    - 远程用户可能直接获取网络连接、服务状态、路由或系统运行细节。
    - 这些信息可被用于资产画像、攻击面分析或后续定向利用。
  remediation: |
    - 关闭不必要的 Netstat/历史诊断服务，或仅允许可信管理主机访问。
    - 在边界防火墙阻断相关端口，并审计是否还有其他遗留 inetd 服务暴露。
  metadata:
    verified: true
    max-request: 1
    zoomeye-query: port="15" && "netstat"
  tags: netstat,network,js,tcp,vuln

javascript:
  - pre-condition: |
      isPortOpen(Host,Port);
    code: |
      let packet = bytes.NewBuffer();
      const c = require("nuclei/net");
      const cmd = "00000000"
      packet.WriteString(cmd)
      let conn = c.Open('tcp', `${Host}:${Port}`);
      conn.SendHex(packet.Hex());
      const result = conn.RecvString();
      result;

    args:
      Host: "{{Host}}"
      Port: 15

    matchers:
      - type: dsl
        dsl:
          - "success == true"
          - contains(response, "Active Internet connections")
        condition: and

    extractors:
      - type: dsl
        dsl:
          - response
