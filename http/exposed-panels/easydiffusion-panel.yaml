id: easydiffusion-panel

info:
  name: Easy Diffusion 面板识别（指纹识别）
  author: rxerium
  severity: info
  description: |-
    检测到目标站点存在 Easy Diffusion 相关响应特征。Easy Diffusion 是 Stable Diffusion 图像生成的 Web UI，用于本地或服务器端生成、管理和调试 AI 图像任务。模板请求 `/`，并通过页面标题或正文关键字、状态码确认该基础设施指纹；命中结果主要用于威胁狩猎、恶意基础设施识别和外部暴露面梳理。
  reference:
    - https://github.com/easydiffusion/easydiffusion
    - https://easydiffusion.github.io/
  metadata:
    verified: true
    max-request: 1
    vendor: easydiffusion
    product: easydiffusion
    shodan-query: 'http.title:"Easy Diffusion"'
  tags: panel,easydiffusion,stable-diffusion,ai,image-generation,detect,discovery
http:
  - method: GET
    path:
      - "{{BaseURL}}"

    host-redirects: true
    max-redirects: 2

    matchers-condition: and
    matchers:
      - type: word
        part: body
        words:
          - "<title>Easy Diffusion</title>"

      - type: status
        status:
          - 200
