id: ypareo-panel

info:
  name: YPAREO 面板识别（暴露面识别）
  author: righettod
  severity: info
  description: |
    该模板通过识别 YPAREO 面板、控制台或管理界面的页面特征，判断目标是否暴露了对应服务入口。若命中，说明该后台或运维界面对外可访问，可用于资产识别与暴露面排查。
  reference:
    - https://www.ypareo.com/legacy
    - https://www.ymag.fr/
  metadata:
    verified: true
    max-request: 4
    shodan-query: http.html:"ypareo"
  tags: panel,ymag,login,detect,discovery

http:
  - method: GET
    path:
      - "{{BaseURL}}/index.php"
      - "{{BaseURL}}/net-ypareo/index.php"
      - "{{BaseURL}}/netypareo/index.php"
      - "{{BaseURL}}/index.html"

    stop-at-first-match: true

    matchers:
      - type: dsl
        dsl:
          - 'status_code == 200'
          - 'contains_any(to_lower(body), "<title>ypareo", "<title>NetYParéo")'
        condition: and

    extractors:
      - type: regex
        part: body
        group: 1
        regex:
          - 'script.js\?v=([0-9.]+)'
