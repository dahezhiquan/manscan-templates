id: grandstream-grp-default-login

info:
  name: Grandstream GRP 默认口令登录（弱口令）
  author: DhiyaneshDK
  severity: high
  description: |
    该模板通过向 Grandstream GRP 设备的 Web 管理接口提交默认口令对应的 SHA-256 值，并依据返回的成功 JSON 与会话信息判断目标是否仍在使用弱口令。若命中，攻击者可直接接管设备管理界面。
  remediation: |
    - 立即修改默认管理员密码。
    - 升级到最新固件版本，以便在恢复出厂设置后自动生成随机密码。
  metadata:
    verified: true
    max-request: 1
    vendor: grandstream
    shodan-query: tl.account.ucm.js
  tags: default-login,grandstream,grp,iot,vuln

http:
  - raw:
      - |
        POST /cgi-bin/access HTTP/1.1
        Host: {{Hostname}}
        X-Requested-With: XMLHttpRequest
        Accept: application/json, text/plain, */*
        Content-Type: application/x-www-form-urlencoded
        Origin: {{RootURL}}
        Referer: {{RootURL}}

        access={{sha256("admin")}}

    matchers-condition: and
    matchers:
      - type: word
        part: body
        words:
          - '"response":"success"'
          - '"body":'
        condition: and

      - type: status
        status:
          - 200
