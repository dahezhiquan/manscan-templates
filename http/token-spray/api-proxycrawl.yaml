id: api-proxycrawl

info:
  name: ProxyCrawl API Token 可用性校验（token喷洒）
  author: daffainfo
  severity: info
  description: 该模板通过调用 ProxyCrawl API 的已知接口验证提供的 token 是否有效，命中后通常表示可访问网页抓取与内容提取能力。
  reference:
    - https://proxycrawl.com/docs/
    - https://github.com/daffainfo/all-about-apikey/tree/main/proxycrawl
  metadata:
    max-request: 1
  tags: token-spray,proxycrawl

self-contained: true

http:
  - method: GET
    path:
      - "https://api.proxycrawl.com/leads?token={{token}}&domain=www.amazon.com"

    matchers:
      - type: word
        part: body
        words:
          - '"remaining_requests"'
          - '"domain"'
          - '"leads"'
        condition: and
