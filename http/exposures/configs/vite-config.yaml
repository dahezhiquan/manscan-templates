id: vite-config

info:
  name: Vite 配置文件暴露（暴露面识别）
  author: DhiyaneshDk
  severity: low
  description: |
    检测到对外可访问的 Vite 配置文件。这类配置资源可能包含部署细节、访问凭据、内部地址、组件版本或调试开关，公开暴露后会显著增加被侦察和后续利用的风险。
  reference:
    - https://vitejs.dev/config/
  metadata:
    verified: true
    max-request: 1
    shodan-query: html:"vite.config.js"
  tags: devops,exposure,files,vite,config,vuln

http:
  - method: GET
    path:
      - "{{BaseURL}}/vite.config.js"

    matchers-condition: and
    matchers:
      - type: word
        part: body
        words:
          - 'export default defineConfig'
          - 'plugins:'
          - 'laravel'
        condition: and

      - type: status
        status:
          - 200
