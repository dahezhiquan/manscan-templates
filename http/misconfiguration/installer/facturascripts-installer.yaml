id: facturascripts-installer

info:
  name: FacturaScripts 安装向导 暴露
  author: DhiyaneshDk
  severity: high
  description: |
    检测到 FacturaScripts 安装向导 暴露。该页面属于安装、初始化或配置向导流程，若对外暴露，攻击者可能完成初始化、创建管理员账户或重新配置目标系统。
  classification:
    cpe: cpe:2.3:a:facturascripts:facturascripts:*:*:*:*:*:*:*:*
  metadata:
    verified: true
    max-request: 1
    vendor: facturascripts
    product: facturascripts
    shodan-query: html:"FacturaScripts installer"
  tags: misconfig,facturascripts,install,exposure,vuln

http:
  - method: GET
    path:
      - '{{BaseURL}}'

    matchers-condition: and
    matchers:
      - type: word
        part: body
        words:
          - 'FacturaScripts installer'
          - 'connect to the database'
        condition: and

      - type: word
        part: header
        words:
          - 'text/html'

      - type: status
        status:
          - 200
