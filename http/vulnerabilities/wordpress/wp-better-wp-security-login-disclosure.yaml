id: wp-better-wp-security-login-disclosure

info:
  name: WordPress Solid Security < 9.0.1 - 未授权访问漏洞
  author: 0x_Akoko
  severity: medium
  description: WordPress Solid Security < 9.0.1 - 未授权 Login Page Disclosure 存在未授权访问漏洞。未授权访问者可获取配置、凭证、用户数据或系统元信息，从而为后续攻击提供情报支持。
  reference:
    - https://wordpress.org/plugins/better-wp-security/
    - https://wpscan.com/vulnerability/b7201fc1-d825-484f-aca9-ba14a968179b/
  classification:
    cvss-metrics: CVSS:3.1/AV:N/AC:L/PR:N/UI:N/S:U/C:L/I:N/A:N
    cvss-score: 5.3
    cwe-id: CWE-200
  metadata:
    verified: true
    max-request: 1
  tags: wordpress,wp-plugin,wp,exposure,ithemes,solid-security

http:
  - method: GET
    path:
      - "{{BaseURL}}/"

    host-redirects: true
    max-redirects: 3

    matchers:
      - type: dsl
        dsl:
          - 'status_code == 200'
          - 'contains(body, "itsec-hb-token=")'
        condition: and

    extractors:
      - type: regex
        name: secret-login-slug
        part: body
        group: 1
        regex:
          - 'itsec-hb-token=([a-zA-Z0-9_-]+)'
