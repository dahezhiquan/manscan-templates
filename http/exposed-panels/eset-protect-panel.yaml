id: eset-protect-panel

info:
  name: Eset Protect 登录面板识别（指纹识别）
  author: Charles D.
  severity: info
  description: |-
    检测到目标站点存在 Eset Protect 相关响应特征。ESET PROTECT 是终端安全集中管理平台，用于管理客户端、防护策略、告警、更新和安全事件。模板请求 `/era/webconsole/`，并通过页面标题或正文关键字、状态码确认该系统指纹，用于资产识别、系统盘点和暴露面梳理。
  classification:
    cvss-metrics: CVSS:3.0/AV:N/AC:L/PR:N/UI:N/S:U/C:N/I:N/A:N
    cwe-id: CWE-200
  metadata:
    verified: true
    max-request: 1
    shodan-query: http.favicon.hash:751911084
  tags: login,eset,panel,detect,discovery
http:
  - method: GET
    path:
      - "{{BaseURL}}/era/webconsole/"

    matchers-condition: and
    matchers:
      - type: word
        part: body
        words:
          - "ESET PROTECT"
          - "window.eset"
        condition: or

      - type: status
        status:
          - 200

    extractors:
      - type: regex
        part: body
        group: 1
        regex:
          - 'displayVersion: "([0-9.]+)",'
