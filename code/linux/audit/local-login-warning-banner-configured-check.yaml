id: local-login-warning-banner-configured-check

info:
  name: 确保本地登录警告横幅配置正确（本地基线扫描）
  author: Th3l0newolf
  severity: low
  description: |
    本地登录横幅若包含系统版本、内核或发行版标识，会向未认证用户泄露环境指纹，便于攻击者选择针对性漏洞和口令策略。CIS Ubuntu 基线建议登录前提示仅保留授权告知内容；模板检查 `/etc/issue` 是否包含 `\v`、`\r`、`\m`、`\s` 或发行版 ID，命中 Policy-Fail 表示横幅泄露系统信息。
  impact: |
    - 未认证本地访问者可获取系统类型和版本线索，降低后续攻击成本。
    - 合规警告内容被系统指纹替代时，会削弱授权边界提示。
  remediation: |
    - 清理 `/etc/issue` 中的动态系统信息变量和发行版标识。
    - 配置符合组织要求的授权使用警告文本，并保持文件属主和权限受控。
  reference:
    - https://www.cisecurity.org/benchmark/ubuntu_linux
  tags: cis,linux,ubuntu,issue,banner,audit
  metadata:
    verified: true

self-contained: true

code:
  - engine:
      - bash
    args:
      - "-c"
      - |
        os_id=$(grep '^ID=' /etc/os-release | cut -d= -f2 | sed 's/"//g')

        if grep -E -i "(\\\v|\\\r|\\\m|\\\s|$os_id)" /etc/issue >/dev/null 2>&1; then
          echo "[local-login-warning-banner-configured-check:Policy-Fail] [/etc/issue contains system information] [CIS_FAIL] [low]"
        else
          echo "[local-login-warning-banner-configured-check:Policy-Pass] [/etc/issue is properly configured] [CIS_PASS] [low]"
        fi

    matchers:
      - type: word
        name: policy-pass
        words:
          - "Policy-Pass"

      - type: word
        name: policy-fail
        words:
          - "Policy-Fail"
