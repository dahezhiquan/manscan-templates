id: azure-redis-nonssl-port-disabled
info:
  name: Azure Cache for Redis 非 SSL 端口已启用（云安全）
  author: princechaddha
  severity: high
  description: Azure Cache for Redis 启用非 SSL 端口时，客户端可以绕过 TLS 连接缓存服务，传输中的凭据、命令和缓存数据可能以明文传输。本模板枚举 Redis 实例并查询 enableNonSslPort，在返回值为 true 时报告。
  impact: |
    - 同一网络路径上的攻击者可能窃听或篡改 Redis 命令、访问令牌和缓存内容。
    - 被截获的 Redis 凭据或会话信息可能被用于读取、修改缓存数据，甚至进一步影响依赖缓存的应用会话。
  remediation: |
    - 将 enableNonSslPort 设置为 false，强制客户端使用 TLS 端口，并更新连接字符串和证书校验配置。
    - 变更前确认所有客户端均支持 TLS，迁移完成后通过网络规则限制非必要的缓存访问来源。
  reference:
    - https://docs.microsoft.com/en-us/azure/azure-cache-for-redis/cache-configure#ssl-ports
  metadata:
    vendor: microsoft
    product: azure-cache-for-redis
  tags: cloud,devops,azure,microsoft,redis,azure-cloud-config

flow: |
  code(1);
  for (let CacheData of iterate(template.redisList)) {
    set("name", CacheData);
    code(2);
  }

self-contained: true
code:
  - engine:
      - sh
      - bash
    source: |
      az redis list --query '[*].id'

    extractors:
      - type: json
        name: redisList
        internal: true
        json:
          - '.[]'

  - engine:
      - sh
      - bash
    source: |
      az redis show --ids "$name" --query 'enableNonSslPort'

    matchers-condition: and
    matchers:
      - type: word
        words:
          - 'true'

    extractors:
      - type: dsl
        dsl:
          - 'name + " has non-SSL port enabled, therefore encryption in transit is not enforced."'
