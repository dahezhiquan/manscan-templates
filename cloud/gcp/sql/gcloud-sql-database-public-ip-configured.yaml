id: gcloud-sql-database-public-ip-configured

info:
  name: Cloud SQL Database Instances 使用Public IPs（云安全）
  author: princechaddha
  severity: medium
  description: Cloud SQL 实例配置 Public IP 会使数据库拥有公网连接入口，即使配合授权网络也会扩大攻击面。本模板检查实例 ipAddresses[].type，发现 PRIMARY 公网地址时报告该实例未仅使用私有 IP。
  impact: |
    - 数据库公网入口可能被扫描、爆破或利用配置缺陷攻击，增加数据泄露和服务中断风险。
    - 公网访问路径会绕过统一私网访问架构，增加防火墙、授权网络和证书管理复杂度。
  remediation: |
    - 优先为 Cloud SQL 实例使用 Private IP、Private Service Connect 或受控代理访问。
    - 对必须保留公网入口的实例，严格限制 authorized networks、强制 SSL/TLS 并持续监控访问来源。
  reference:
    - https://cloud.google.com/sql/docs/mysql/configure-private-ip
  metadata:
    vendor: google
    product: cloud-sql
  tags: cloud,devops,gcp,gcloud,google-cloud-sql,networking,security,gcp-cloud-config

flow: |
  code(1)
  for(let projectId of iterate(template.projectIds)){
    set("projectId", projectId)
    code(2)
    for(let sqlInstance of iterate(template.sqlInstances)){
      set("sqlInstance", sqlInstance)
      code(3)
    }
  }

self-contained: true

code:
  - engine:
      - sh
      - bash
    source: |
      gcloud projects list --format="json(projectId)"

    extractors:
      - type: json
        name: projectIds
        internal: true
        json:
          - '.[].projectId'

  - engine:
      - sh
      - bash
    source: |
      gcloud sql instances list --project $projectId --format="json(name)"

    extractors:
      - type: json
        name: sqlInstances
        internal: true
        json:
          - '.[].name'

  - engine:
      - sh
      - bash
    source: |
      gcloud sql instances describe $sqlInstance --project $projectId --format=json | jq -r '.ipAddresses[]?.type // "null"'

    matchers:
      - type: word
        words:
          - 'PRIMARY'

    extractors:
      - type: dsl
        dsl:
          - '"The SQL instance " + sqlInstance + " in project " + projectId + " is configured with a public IP address and is not set to use only private IPs."'
