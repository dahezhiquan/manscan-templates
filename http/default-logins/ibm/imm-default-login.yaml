id: imm-default-login

info:
  name: Integrated Management Module 默认口令登录（弱口令）
  author: jpg0mez
  severity: high
  description: |
    该模板用于检测 Integrated Management Module 是否仍可使用默认凭据或弱口令登录。模板主要向 `/data/login` 等认证入口发送请求，使用内置默认凭据组合进行认证尝试，并根据响应中的 `<authResult>0</authResult>`、`authResult":"0` 等登录成功特征判断登录是否成功；命中说明目标未及时修改出厂、示例或初始化账号口令。
  impact: |
    - 攻击者可接管 Integrated Management Module 的 Web 管理界面，查看设备状态、网络配置、运行日志或敏感业务参数。
    - 被接管的网络、工控、打印、语音、存储或远程管理设备可能被用于中断业务、改变路由/访问策略、窃取流量或作为内网横向移动入口。
  remediation: |
    - 立即修改所有默认账号口令，禁用不再使用的出厂账号，并为管理账户设置高强度唯一密码。
    - 将设备管理入口限制在 VPN、堡垒机或可信管理网段内，避免直接暴露到公网。
    - 升级设备固件或管理组件，审计近期登录记录、配置变更和异常会话。
  reference:
    - https://pubs.lenovo.com/x3650-m4/t_logging_web_interface
    - https://www.ibm.com/docs/en/tcs-service?topic=oip-logging-imm-web-interface
  classification:
    cwe-id: CWE-798
    cpe: cpe:2.3:h:ibm:integrated_management_module:*:*:*:*:*:*:*:*
  metadata:
    verified: true
    max-request: 1
    shodan-query: html:"ibmdojo"
    fofa-query: "integrated management module"
    product: integrated_management_module
    vendor: ibm
  tags: imm,ibm,default-login,vuln

http:
  - method: POST
    path:
      - "{{BaseURL}}/data/login"
    body: "user=USERID&password=PASSW0RD"

    redirects: true
    matchers-condition: and
    matchers:
      - type: word
        words:
          - "<authResult>0</authResult>"
          - 'authResult":"0'
        condition: or

      - type: word
        words:
          - "index-console.php"
          - "home.php"
        condition: and

      - type: status
        status:
          - 200
