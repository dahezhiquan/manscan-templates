id: launchdarkly-detect

info:
  name: LaunchDarkly 指纹识别（指纹识别）
  author: Shivam Kamboj
  severity: info
  description: >-
    LaunchDarkly 是特性开关和发布管理平台，用于按用户、环境或规则控制功能发布。该模板通过请求目标服务并检查预设路径或首页响应、页面正文关键字等指纹特征，判断目标是否使用或暴露了
    LaunchDarkly 相关组件；命中结果仅表示指纹特征匹配，可用于资产盘点、技术栈识别和后续安全评估，不代表已确认存在可利用漏洞。
  reference:
  - https://launchdarkly.com/
  - https://launchdarkly.com/docs/sdk/client-side/javascript
  metadata:
    verified: true
    max-request: 1
    shodan-query: html:"LDClient.initialize"
  tags: tech,discovery,launchdarkly
http:
  - method: GET
    path:
      - "{{BaseURL}}"

    redirects: true

    matchers:
      - type: word
        part: body
        words:
          - "LDClient.initialize"
          - "ldclient.min.js"
          - "launchdarkly-js-client-sdk"
        condition: or
