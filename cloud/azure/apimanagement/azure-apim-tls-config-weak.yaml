id: azure-apim-tls-config-weak
info:
  name: Azure API Management 启用弱 TLS 协议（云安全）
  author: princechaddha
  severity: medium
  description: APIM 网关启用 SSL 3.0、TLS 1.0 或 TLS 1.1 等过时协议时，客户端与网关之间的加密协商可能降级到缺少现代安全保护的版本。该模板查询 customProperties，并在任一弱协议属性为 True 时报告问题。
  impact: |
    - 过时协议的密码套件和防护能力较弱，增加流量降级、窃听、篡改及中间人攻击风险。
    - 不符合现代 TLS 基线可能导致合规检查失败，并与只支持安全协议的客户端产生兼容性问题。
  remediation: |
    - 禁用 SSL 3.0、TLS 1.0 和 TLS 1.1，仅保留平台支持的现代 TLS 协议版本。
    - 在变更前验证客户端、后端和自定义域名兼容性，更新证书和密码套件基线并持续监控协议协商结果。
  reference:
    - https://docs.microsoft.com/en-us/azure/api-management/api-management-howto-configure-protocols
  metadata:
    vendor: microsoft
    product: azure-api-management
  tags: cloud,devops,azure,microsoft,api-management,azure-cloud-config

flow: |
  code(1);
  for (let GatewayData of iterate(template.gatewayList)) {
    GatewayData = JSON.parse(GatewayData);
    set("name", GatewayData.name);
    set("resourceGroup", GatewayData.resourceGroup);
    code(2);
  }

self-contained: true
code:
  - engine:
      - sh
      - bash
    source: |
      az apim list --output json --query '[*].{name:name, resourceGroup:resourceGroup}'

    extractors:
      - type: json
        name: gatewayList
        internal: true
        json:
          - '.[]'

  - engine:
      - sh
      - bash
    source: |
      az apim show --name "$name" --resource-group "$resourceGroup" --output json --query 'customProperties'

    matchers:
      - type: word
        words:
          - 'Ssl30": "True"'
          - 'Tls10": "True"'
          - 'Tls11": "True"'

    extractors:
      - type: dsl
        dsl:
          - 'name + " in resource group " + resourceGroup + " is configured with weak TLS protocols"'
