id: gcloud-iam-unrestricted-decryption

info:
  name: IAM Users 使用Unrestricted Data Decryption Permissions（云安全）
  author: princechaddha
  severity: medium
  description: 在项目层级授予 Cloud KMS 解密相关角色且缺少 IAM Conditions，会让成员对范围内密钥具备过宽的解密能力。本模板检查 cloudkms.cryptoKeyDecrypter、cryptoOperator 和 cryptoKeyEncrypterDecrypter 角色绑定，并在未发现 condition 字段时报告无限制解密权限。
  impact: |
    - 身份被滥用后，攻击者可能解密受 KMS 保护的数据或绕过按密钥、资源、时间设定的访问边界。
    - 过宽的解密权限会削弱敏感数据分区隔离和合规审计可信度。
  remediation: |
    - 将 KMS 解密权限限制到具体 key ring、crypto key 或业务身份，并使用 IAM Conditions 约束访问条件。
    - 移除项目级过宽角色绑定，定期审计 KMS IAM policy 中的解密和加解密角色。
  reference:
    - https://www.trendmicro.com/cloudoneconformity/knowledge-base/gcp/IAM/decryption-with-all-keys-not-allowed.html
    - https://cloud.google.com/kms/docs/reference/permissions-and-roles
  metadata:
    vendor: google
    product: cloud-iam
  tags: cloud,devops,gcp,gcloud,iam,security,encryption,kms,gcp-cloud-config

flow: |
  code(1)
  for(let projectId of iterate(template.projectIds)){
    set("projectId", projectId)
    code(2)
  }

self-contained: true

code:
  - engine:
      - sh
      - bash
    source: |
      gcloud projects list --format="json(projectId)"

    extractors:
      - type: json
        name: projectIds
        internal: true
        json:
          - '.[].projectId'

  - engine:
      - sh
      - bash
    source: |
      gcloud projects get-iam-policy $projectId --format="json(bindings[?(@.role=='roles/cloudkms.cryptoKeyDecrypter' || @.role=='roles/cloudkms.cryptoOperator' || @.role=='roles/cloudkms.cryptoKeyEncrypterDecrypter')])"

    matchers:
      - type: word
        words:
          - '"condition":'
        negative: true

    extractors:
      - type: dsl
        dsl:
          - '"Project " + projectId + " has IAM users with unrestricted decryption permissions that can access all KMS keys"'
