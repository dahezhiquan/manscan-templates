id: mailhog-panel

info:
  name: MailHog 面板识别（暴露面识别）
  author: kh4sh3i
  severity: info
  description: |
    该模板通过识别 MailHog 面板、控制台或管理界面的页面特征，判断目标是否暴露了对应服务入口。若命中，说明该后台或运维界面对外可访问，可用于资产识别与暴露面排查。
  reference:
    - https://github.com/mailhog/MailHog
  classification:
    cvss-metrics: CVSS:3.0/AV:N/AC:L/PR:N/UI:N/S:U/C:N/I:N/A:N
    cwe-id: CWE-200
  metadata:
    verified: true
    max-request: 1
    shodan-query: http.html:"mailhog"
  tags: panel,mailhog,mail,smtp,discovery

http:
  - method: GET
    path:
      - "{{BaseURL}}"

    matchers-condition: and
    matchers:
      - type: word
        part: body
        words:
          - 'MailHog'
          - 'SMTP server'
        condition: and

      - type: status
        status:
          - 200
