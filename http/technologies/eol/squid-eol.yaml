id: squid-eol

info:
  name: Squid EOL 指纹识别（指纹识别）
  author: Shivam Kamboj
  severity: info
  description: >-
    Squid 是代理缓存服务器，EOL 版本表示目标服务运行的 Squid 分支已不再获得官方维护。该模板通过请求目标服务并检查预设路径或首页响应、HTTP
    响应头、正则特征、DSL 条件等指纹特征，判断目标是否使用或暴露了 Squid EOL 相关组件；命中结果仅表示指纹特征匹配，可用于资产盘点、技术栈识别和后续安全评估，不代表已确认存在可利用漏洞。
  reference:
  - https://endoflife.date/squid
  - https://www.squid-cache.org/Versions/
  metadata:
    verified: true
    max-request: 1
    shodan-query: "Server: squid/"
  tags: tech,squid,eol
http:
  - method: GET
    path:
      - "{{BaseURL}}"

    extractors:
      - type: regex
        name: version
        part: header
        group: 1
        regex:
          - '(?i)Server:\s*squid/([0-9.]+)'

    matchers:
      - type: dsl
        dsl:
          - compare_versions(version, '<=6.14')
          - contains(tolower(header), 'squid')
        condition: and
