id: iis-asp-microsoft-devexpress-detect

info:
  name: DevExpress ASP.NET 组件 指纹识别（指纹识别）
  author: CravateRouge
  severity: info
  description: >-
    DevExpress ASP.NET 组件是企业 Web 应用常用的 UI 控件库，用于构建表格、报表、编辑器和管理界面。该模板通过请求目标服务并检查预设路径或首页响应、页面正文关键字等指纹特征，判断目标是否使用或暴露了
    DevExpress ASP.NET 组件 相关组件；命中结果仅表示指纹特征匹配，可用于资产盘点、技术栈识别和后续安全评估，不代表已确认存在可利用漏洞。
  reference:
  - https://github.com/DevExpress/aspnet-security-bestpractices/blob/master/SecurityBestPractices.WebForms/README.md#53-information-exposure-through-source-code
  - https://supportcenter.devexpress.com/ticket/details/q311748/dxr-axd-what-is-it-and-how-to-disable-it
  classification:
    cpe: cpe:2.3:a:devexpress:devexpress_components:*:*:*:*:*:*:*:*
  metadata:
    max-request: 1
    vendor: devexpress
    product: devexpress_components
    shodan-query: html:"DXR.axd"
  tags: devexpress,iis,microsoft,asp,tech,discovery
http:
  - method: GET
    path:
      - "{{BaseURL}}"

    redirects: true
    max-redirects: 2
    matchers:
      - type: word
        part: body
        words:
          - "DXR.axd"
