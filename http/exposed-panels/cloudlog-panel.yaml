id: cloudlog-panel

info:
  name: Cloudlog 面板识别（指纹识别）
  author: s4e-io
  severity: info
  description: |-
    检测到目标站点存在 Cloudlog 相关响应特征。Cloudlog 是监控、日志、分析或可观测性系统，用于展示运行指标、告警事件、日志数据和服务状态。模板请求 `/`、`/index.php/user/login` 路径，并通过页面标题或正文关键字、状态码、DSL 条件确认该系统指纹，用于资产识别、系统盘点和暴露面梳理。
  reference:
    - https://github.com/magicbug/Cloudlog
    - https://lab.uberspace.de/guide_cloudlog/
  metadata:
    verified: true
    max-request: 1
    fofa-query: title="Login - Cloudlog"
  tags: panel,login,cloudlog,detect,discovery
http:
  - method: GET
    path:
      - "{{BaseURL}}"
      - "{{BaseURL}}/index.php/user/login"

    stop-at-first-match: true
    host-redirects: true
    max-redirects: 2
    matchers:
      - type: dsl
        dsl:
          - 'contains_any(body, "<title>Login - Cloudlog", "Login to Cloudlog", "/CloudLog_logo.png")'
          - 'status_code == 200'
        condition: and
