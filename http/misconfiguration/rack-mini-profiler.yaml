id: rack-mini-profiler

info:
  name: rack mini pro文件r 环境 信息泄露
  author: vzamanillo
  severity: high
  description: |
    检测到 rack mini pro文件r 环境 信息泄露。目标暴露了调试、错误或堆栈信息，可能泄露应用路径、框架版本、环境变量、源码位置或内部调用细节。
  metadata:
    max-request: 1
  tags: config,debug,rails,misconfig,vuln

http:
  - method: GET
    path:
      - "{{BaseURL}}/?pp=env"

    matchers-condition: and
    matchers:
      - type: word
        words:
          - "Rack Environment"

      - type: status
        status:
          - 200
