id: loxone-web-panel

info:
  name: Loxone WebInterface 面板识别（指纹识别）
  author: DhiyaneshDk
  severity: info
  description: |-
    检测到目标站点存在 Loxone WebInterface 相关响应特征。Loxone WebInterface 是工业控制、能源、楼宇自动化或 HMI/SCADA 场景中的管理界面，用于监控设备状态、过程数据和现场控制相关配置。模板请求 `/`，并通过页面标题或正文关键字、状态码确认该系统指纹，用于资产识别、系统盘点和暴露面梳理。
  metadata:
    verified: true
    max-request: 1
    shodan-query: html:"<title>Webinterface</title>"
  tags: panel,login,loxone,detect,discovery
http:
  - method: GET
    path:
      - "{{BaseURL}}"

    matchers-condition: and
    matchers:
      - type: word
        words:
          - '<title>Webinterface</title>'
          - 'loxone'
        condition: and

      - type: status
        status:
          - 200
