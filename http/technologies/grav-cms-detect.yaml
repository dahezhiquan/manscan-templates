id: grav-cms-detect

info:
  name: Grav CMS 指纹识别（指纹识别）
  author: cyllective
  severity: info
  description: >-
    Grav CMS 是基于文件的 PHP 内容管理系统，用于构建轻量级网站和文档站点。该模板通过请求目标服务并检查预设路径或首页响应、页面正文关键字、HTTP
    响应头等指纹特征，判断目标是否使用或暴露了 Grav CMS 相关组件；命中结果仅表示指纹特征匹配，可用于资产盘点、技术栈识别和后续安全评估，不代表已确认存在可利用漏洞。
  reference:
  - https://github.com/getgrav/grav
  metadata:
    max-request: 1
  tags: tech,grav,cms,discovery
http:
  - method: GET
    path:
      - "{{BaseURL}}"

    matchers-condition: or
    matchers:
      - type: word
        part: header
        words:
          - 'Set-Cookie: grav-site-'

      - type: word
        part: body
        words:
          - '<meta name="generator" content="GravCMS" />'
