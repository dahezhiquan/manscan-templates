id: deepstack-panel

info:
  name: DeepStack AI 服务器面板 - 检测（暴露面识别）
  author: rxerium
  severity: info
  description: |-
    检测到 DeepStack。DeepStack 是一个开源、自托管的计算机视觉（AI）服务器，提供物体、人脸和场景检测 API，常与 Home Assistant、Frigate 等家庭自动化组件一同部署在 5000 端口。发现一个处于暴露状态且无需认证即可访问的 DeepStack 登录/激活页面。
  reference:
    - https://github.com/johnolafenwa/DeepStack
    - https://deepstack.cc
    - http://dev.deepstack.cc
  metadata:
    verified: true
    max-request: 1
    vendor: deepstackai
    product: deepstack
    shodan-query: 'html:"DeepStack Activated"'
  tags: panel,deepstack,ai,computer-vision,detect,discovery

http:
  - method: GET
    path:
      - "{{BaseURL}}"

    host-redirects: true
    max-redirects: 2

    matchers-condition: and
    matchers:
      - type: word
        part: body
        words:
          - "DeepStack Activated"
          - "deepstack.cc"
          - "<title>DeepStack</title>"
        condition: and

      - type: status
        status:
          - 200
