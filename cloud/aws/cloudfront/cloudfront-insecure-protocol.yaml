id: cloudfront-insecure-protocol

info:
  name: CloudFront 源站 SSLv3 协议未禁用（云安全）
  author: DhiyaneshDK
  severity: medium
  description: CloudFront 源站仍允许 SSLv3 是一类传输加密弱协议风险，表示边缘节点到自定义源站的 HTTPS 协商可能包含已淘汰协议。SSLv3 不再适合作为安全传输协议，可能带来协议降级和加密弱点风险。模板读取 `Origins.Items[*].CustomOriginConfig.OriginSslProtocols.Items`，当结果包含 `SSLv3` 时判定源站协议配置过旧。
  impact: |
    - CloudFront 与源站之间的通信可能使用弱协议，增加中间人攻击和协议降级风险。
    - 过旧协议通常不满足现代安全基线和合规审计对传输加密的要求。
  remediation: |
    - 从 CloudFront 源站 SSL 协议列表中移除 `SSLv3`，仅保留满足安全基线的 TLS 版本。
    - 同步检查源站服务器支持的 TLS 协议和证书配置，确保协议收敛后业务访问正常。
  reference:
    - https://www.trendmicro.com/cloudoneconformity-staging/knowledge-base/aws/CloudFront/cloudfront-insecure-origin-ssl-protocols.html
    - http://docs.aws.amazon.com/AmazonCloudFront/latest/DeveloperGuide/SecureConnections.html
  metadata:
    vendor: amazon
    product: cloudfront
  tags: cloud,devops,aws,amazon,cloudfront,aws-cloud-config

variables:
  region: "us-west-2"

flow: |
  code(1)
  for(let DistributionListItemsId of iterate(template.distributions)){
    set("distribution", DistributionListItemsId)
    code(2)
  }

self-contained: true

code:
  - engine:
      - sh
      - bash

    source: |
      aws cloudfront list-distributions --output table --query 'DistributionList.Items[*].Id' --region $region --output json

    extractors:
      - type: json
        name: distributions
        internal: true
        json:
          - '.[]'

  - engine:
      - sh
      - bash

    source: |
        aws cloudfront get-distribution --id $distribution --query 'Distribution.DistributionConfig.Origins.Items[*].CustomOriginConfig.OriginSslProtocols.Items | []' --region $region --output json

    matchers:
      - type: word
        words:
          - "SSLv3"

    extractors:
      - type: dsl
        dsl:
          - '"CloudFront Uses SSLv3 Protocol in" + distribution'
