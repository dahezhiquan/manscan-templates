id: blazor-webassembly-detect

info:
  name: Blazor WebAssembly 指纹识别（指纹识别）
  author: righettod
  severity: info
  description: |-
    Blazor WebAssembly 是 Microsoft 前端框架，用于在浏览器中运行 .NET WebAssembly 应用。该模板请求 `/_framework/blazor.boot.json`，并依据 HTTP 200 状态码、页面标题、正文关键字或品牌资源特征识别目标是否使用或暴露了 Blazor WebAssembly 相关组件，适用于资产盘点、技术栈识别和后续安全评估；命中结果仅表示指纹特征匹配，不代表已确认存在可利用漏洞。
  reference:
  - https://dotnet.microsoft.com/en-us/apps/aspnet/web-apps/blazor
  - https://github.com/righettod/burp-piper-custom-scripts/issues/1
  metadata:
    verified: true
    max-request: 1
    shodan-query: html:"blazor.boot.json"
  tags: blazor,webassembly,detect,discovery

http:
  - method: GET
    path:
      - '{{BaseURL}}/_framework/blazor.boot.json'

    stop-at-first-match: true

    matchers-condition: and
    matchers:
      - type: word
        part: body
        words:
          - 'dotnet.wasm'
          - '"entryAssembly"'
          - '"Microsoft.JSInterop.WebAssembly.dll"'
        condition: and
        case-insensitive: true

      - type: status
        status:
          - 200

    extractors:
      - type: regex
        part: body
        group: 1
        regex:
          - 'dotnet.([0-9.]+).[a-z0-9]+.js'
