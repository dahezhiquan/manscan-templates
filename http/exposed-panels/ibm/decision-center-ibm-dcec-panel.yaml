id: decision-center-ibm-dcec-panel

info:
  name: IBM Decision Center Enterprise Console 面板识别（指纹识别）
  author: DhiyaneshDK
  severity: info
  description: |-
    检测到目标站点存在 IBM Decision Center Enterprise Console 相关响应特征。IBM Decision Center Enterprise Console 是自动化运维、持续集成或任务编排平台，用于管理作业、流水线、凭据、执行记录和部署流程。模板请求 `/teamserver/faces/login.jsp`，并通过页面标题或正文关键字、状态码确认该系统指纹，用于资产识别、系统盘点和暴露面梳理。
  reference:
    - https://www.ibm.com/docs/en/odm/8.5.1?topic=console-tutorial-getting-started-decision-center-enterprise
  metadata:
    verified: true
    max-request: 1
    shodan-query: html:"Decision Center Enterprise console"
  tags: panel,ibm,login,detect,decision-center,discovery
http:
  - method: GET
    path:
      - "{{BaseURL}}/teamserver/faces/login.jsp"

    matchers-condition: and
    matchers:
      - type: word
        part: body
        words:
          - "<title>Decision Center Enterprise console</title>"
          - "Sign in to Decision Center"
        condition: or

      - type: status
        status:
          - 200
