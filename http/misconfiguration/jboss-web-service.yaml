id: jboss-web-service

info:
  name: JBoss Web 服务 控制台 检测
  author: DhiyaneshDK
  severity: low
  description: |
    检测到 JBoss Web 服务 控制台 检测。目标响应或文件中可能暴露配置、凭据、密钥、令牌、环境变量或历史记录等敏感信息，可能被用于进一步入侵。
  remediation: |
    - 立即移除公开文件中的敏感信息并轮换已暴露的凭据、密钥和令牌。
    - 使用安全的密钥管理方案，并阻止配置、日志和历史文件被 Web 直接访问。
  reference:
    - https://github.com/PortSwigger/j2ee-scan/blob/master/src/main/java/burp/j2ee/issues/impl/JBossWS.java
  metadata:
    verified: true
    max-request: 1
    shodan-query: html:"JBossWS"
  tags: jboss,misconfig,vuln

http:
  - method: GET
    path:
      - '{{BaseURL}}/jbossws/services'

    matchers-condition: and
    matchers:
      - type: word
        part: body
        words:
          - 'JBossWS/Services</div>'
        case-insensitive: true

      - type: word
        part: body
        words:
          - 'no endpoints deployed'
        negative: true

      - type: status
        status:
          - 200
