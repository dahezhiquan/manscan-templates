id: azure-vm-delete-unalerted
info:
  name: Azure 虚拟机删除告警未配置（云安全）
  author: princechaddha
  severity: high
  description: 虚拟机删除操作未配置 Activity Log 告警时，计算实例及其运行环境可能被破坏而不被及时发现。该模板枚举已启用的 Activity Log Alert，并检查 condition 是否缺少 Microsoft.Compute/virtualMachines/delete 操作条件。
  impact: |
    - 删除虚拟机可能导致业务中断、未备份数据丢失和取证材料缺失。
    - 攻击者删除工作负载后，缺少告警会延长恢复时间并掩盖入侵路径。
  remediation: |
    - 创建针对虚拟机删除操作的 Activity Log Alert，并绑定计算资源应急响应 Action Group。
    - 限制删除权限，启用资源锁、备份和恢复演练，确保删除事件可被及时阻断和追踪。
  reference:
    - https://docs.microsoft.com/en-us/azure/azure-monitor/platform/alerts-activity-log
  metadata:
    vendor: microsoft
    product: azure-monitor
  tags: cloud,devops,azure,microsoft,virtual-machines,azure-cloud-config

flow: |
  code(1);
  for (let AlertData of iterate(template.alertList)) {
    set("id", AlertData);
    code(2);
  }

self-contained: true
code:
  - engine:
      - sh
      - bash
    source: |
      az monitor activity-log alert list --output json --query '[?(enabled==`true`)].id'

    extractors:
      - type: json
        name: alertList
        internal: true
        json:
          - '.[]'

  - engine:
      - sh
      - bash
    source: |
      az monitor activity-log alert show --ids "$id" --query 'condition'

    matchers-condition: and
    matchers:
      - type: word
        words:
          - '"field": "operationName"'

      - type: word
        words:
          - "Microsoft.Compute/virtualMachines/delete"
        negative: true

    extractors:
      - type: dsl
        dsl:
          - 'id + " does not have the correct alert configuration for Delete Virtual Machine events"'
