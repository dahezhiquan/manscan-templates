id: polycom-hdx-web-exposure

info:
  name: Polycom HDX - Web Interface 面板暴露（暴露面识别）
  author: 0x_Akoko
  severity: low
  description: |-
    Polycom HDX - Web Interface 是视频会议终端的 Web 管理界面，用于会议设备配置、状态和远程管理。该模板请求首页，并依据 DSL 条件判断目标是否对外暴露了 Polycom HDX - Web Interface 的面板，用于发现互联网可访问的后台、控制台或业务入口。
  impact: "- 暴露的 Polycom HDX - Web Interface 面板会泄露目标正在使用的产品、部署路径、页面特征或组织业务入口，便于攻击者进行指纹确认和漏洞匹配。\n- 如果认证、访问控制或默认凭据策略薄弱，攻击者可能进一步尝试进入后台，影响设备配置、网络边界、工业/楼宇控制状态或远程运维能力。\n- 对互联网开放的管理入口会增加暴力破解、凭据填充、已知漏洞利用和钓鱼仿冒的攻击面。"
  remediation: "- 将 Polycom HDX - Web Interface 的面板限制在内网、VPN、零信任代理或专用管理网段访问，避免直接暴露在互联网。\n- 启用强密码、多因素认证、登录失败限制和审计告警，排查默认账号、弱口令及长期未使用账号。\n- 保持 Polycom HDX - Web Interface 及其依赖组件更新到受支持版本，并通过反向代理、ACL 或防火墙限制敏感路径访问。"
  reference:
  - https://www.polycom.com/products-services/hd-telepresence-video-conferencing.html
  - https://support.polycom.com/content/support/north-america/usa/en/support/video.html
  classification:
    cvss-metrics: CVSS:3.1/AV:N/AC:L/PR:N/UI:N/S:U/C:L/I:L/A:N
    cvss-score: 6.5
    cwe-id: CWE-200
  metadata:
    verified: true
    max-request: 1
    shodan-query: http.title:"Polycom HDX"
    fofa-query: title="Polycom" && body="HDX"
  tags: polycom,hdx,iot,exposure,video-conferencing

http:
  - method: GET
    path:
      - "{{BaseURL}}/"

    matchers:
      - type: dsl
        dsl:
          - 'status_code == 200'
          - 'contains_any(body, "Polycom", "u_keepalive.htm", "u_status.xml")'
        condition: and
