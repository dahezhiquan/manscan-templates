id: vrealize-hyperic-panel

info:
  name: vRealize Hyperic 登录面板识别（指纹识别）
  author: Charles D
  severity: info
  description: |-
    vRealize Hyperic 是 VMware 应用和基础设施监控平台，用于主机、服务、指标和告警管理。该模板请求 `/app/login`，并依据 HTTP 200 状态码、页面标题、正文关键字或品牌资源特征识别目标是否部署了该系统或暴露了对应入口，适用于资产指纹确认；命中结果仅表示系统特征匹配，不代表已确认存在未授权访问或可利用漏洞。
  classification:
    cvss-metrics: CVSS:3.0/AV:N/AC:L/PR:N/UI:N/S:U/C:N/I:N/A:N
    cwe-id: CWE-200
    cpe: cpe:2.3:a:vmware:hyperic_hq:*:*:*:*:*:*:*:*
  metadata:
    verified: true
    max-request: 1
    shodan-query: http.title:"Sign In - Hyperic"
    product: hyperic_hq
    vendor: vmware
  tags: login,panel,vrealize,hyperic,detect,discovery

http:
  - method: GET
    path:
      - '{{BaseURL}}/app/login'

    matchers-condition: and
    matchers:
      - type: word
        part: body
        words:
          - "Sign In - Hyperic"

      - type: status
        status:
          - 200
