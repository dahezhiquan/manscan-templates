id: superset-login

info:
  name: Apache Superset 登录面板暴露（暴露面识别）
  author: DhiyaneshDk,righettod,icarot
  severity: medium
  description: Apache Superset 是开源 BI 和数据可视化平台，用于数据集、图表、仪表盘和查询分析。该模板请求首页、`/login`，并依据 DSL 条件判断目标是否对外暴露了 Apache Superset 的登录面板，用于发现互联网可访问的后台、控制台或业务入口。
  impact: "- 暴露的 Apache Superset 登录面板会泄露目标正在使用的产品、部署路径、页面特征或组织业务入口，便于攻击者进行指纹确认和漏洞匹配。\n- 如果认证、访问控制或默认凭据策略薄弱，攻击者可能进一步尝试进入后台，影响后台配置、业务数据、用户账号或设备运行状态。\n- 对互联网开放的管理入口会增加暴力破解、凭据填充、已知漏洞利用和钓鱼仿冒的攻击面。"
  remediation: "- 将 Apache Superset 的登录面板限制在内网、VPN、零信任代理或专用管理网段访问，避免直接暴露在互联网。\n- 启用强密码、多因素认证、登录失败限制和审计告警，排查默认账号、弱口令及长期未使用账号。\n- 保持 Apache Superset 及其依赖组件更新到受支持版本，并通过反向代理、ACL 或防火墙限制敏感路径访问。"
  classification:
    cvss-metrics: CVSS:3.0/AV:N/AC:L/PR:N/UI:N/S:U/C:N/I:N/A:N
    cwe-id: CWE-200
    cpe: cpe:2.3:a:apache:superset:*:*:*:*:*:*:*:*
  metadata:
    verified: true
    max-request: 2
    vendor: apache
    product: superset
    shodan-query:
    - http.favicon.hash:1582430156
    - http.html:"apache superset"
    - http.html:"superset"
    fofa-query:
    - body="apache superset"
    - icon_hash=1582430156
  tags: panel,superset,apache,discovery

http:
  - method: GET
    path:
      - '{{BaseURL}}'
      - '{{BaseURL}}/login'
    stop-at-first-match: true
    host-redirects: true
    max-redirects: 2

    matchers:
      - type: dsl
        dsl:
          - 'status_code == 200'
          - 'contains(content_type, "text/html")'
          - 'contains_any(body, "alt=\"Superset\"", "<title>Superset</title>", "SUPERSET", "superset")'
        condition: and

    extractors:
      - type: regex
        part: body
        group: 1
        regex:
          - '&#34;version_string&#34;:\s+&#34;([0-9a-z\.\-]+)&#34;'
