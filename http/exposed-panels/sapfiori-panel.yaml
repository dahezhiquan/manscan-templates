id: sapfiori-panel

info:
  name: SAP Fiori 登录面板识别（暴露面识别）
  author: righettod
  severity: info
  description: 该模板通过识别 SAP Fiori 登录入口的页面标题、特征文本或重定向行为，判断目标是否暴露了对应的认证界面。若命中，说明该登录面板对外可访问，可用于暴露面梳理与后续安全评估。
  classification:
    cvss-metrics: CVSS:3.0/AV:N/AC:L/PR:N/UI:N/S:U/C:N/I:N/A:N
    cwe-id: CWE-200
    cpe: cpe:2.3:a:sap:fiori:*:*:*:*:erp_hcm:*:*:*
  metadata:
    max-request: 2
    vendor: sap
    product: fiori
  tags: panel,sap,fiori,discovery

http:
  - method: GET
    path:
      - "{{BaseURL}}/fiori"
      - "{{BaseURL}}/irj/portal/fiori"

    matchers-condition: or
    matchers:
      - type: word
        words:
          - 'fioriLogin'
          - 'action="/fiori"'
        part: body
        condition: and

      - type: word
        words:
          - "UIPPortalPath"
          - "/irj/portal/fiori"
        part: body
        condition: and
