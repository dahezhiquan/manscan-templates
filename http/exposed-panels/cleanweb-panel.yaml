id: cleanweb-panel

info:
  name: CleanWeb 登录面板识别（指纹识别）
  author: righettod
  severity: info
  description: |
    该模板通过识别 CleanWeb 登录入口的页面标题、特征文本或重定向行为，判断目标是否暴露了对应的认证界面。若命中，说明该登录面板对外可访问，可用于暴露面梳理与后续安全评估。
  reference:
    - https://tentelemed.com/
  metadata:
    verified: true
    max-request: 1
    shodan-query: http.title:"CleanWeb"
  tags: panel,cleanweb,login,detect,discovery

http:
  - method: GET
    path:
      - "{{BaseURL}}"

    redirects: true
    max-redirects: 4

    matchers:
      - type: dsl
        dsl:
          - 'status_code == 200'
          - 'contains_any(to_lower(body), "<title>cleanweb","logo cleanweb", "-cleanweb-")'
        condition: and

    extractors:
      - type: regex
        part: body
        group: 1
        regex:
          - 'title="version\s+([0-9A-Za-z\s\.\-]+)"'
