id: api-binaryedge

info:
  name: BinaryEdge API Token 可用性校验（token喷洒）
  author: 0ri2N
  severity: info
  description: |
    该模板通过调用 BinaryEdge API 的已知接口验证提供的 token 是否有效，命中后通常表示可访问安全情报与资产查询能力。
  reference:
    - https://binaryedge.io
    - https://docs.binaryedge.io
  metadata:
    max-request: 1
  tags: recon,binaryedge,token-spray

self-contained: true

http:
  - method: GET
    path:
      - https://api.binaryedge.io/v2/user/subscription

    headers:
      X-Key: "{{token}}"
    matchers:
      - type: word
        part: body
        words:
          - '"subscription"'
          - '"requests_left"'
        condition: and
