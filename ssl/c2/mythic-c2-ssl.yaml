id: mythic-c2-ssl

info:
  name: Mythic C2 证书识别（证书安全）
  author: johnk3r
  severity: info
  description: 该模板通过 SSL/TLS 证书颁发者字段识别目标是否可能与 Mythic 命令控制平台相关。命中可用于辅助发现红队演练或恶意基础设施。
  reference:
    - https://docs.mythic-c2.net
    - https://www.team-cymru.com/post/mythic-case-study-assessing-common-offensive-security-tools
  metadata:
    verified: "true"
    max-request: 1
    shodan-query: ssl:"Mythic"
    censys-query: services.tls.certificates.leaf_data.issuer.common_name:Mythic
  tags: c2,ssl,tls,ir,osint,malware,mythic,discovery
ssl:
  - address: "{{Host}}:{{Port}}"
    matchers:
      - type: word
        part: issuer_dn
        words:
          - "O=Mythic"

    extractors:
      - type: json
        json:
          - " .issuer_dn"
