id: nextcloud-install

info:
  name: Nextcloud 暴露 安装
  author: skeltavik
  severity: high
  description: |
    检测到 Nextcloud 暴露 安装。该页面属于安装、初始化或配置向导流程，若对外暴露，攻击者可能完成初始化、创建管理员账户或重新配置目标系统。
  reference:
    - https://docs.nextcloud.com/server/latest/admin_manual/installation/installation_wizard.html
  metadata:
    max-request: 1
  tags: tech,nextcloud,storage,misconfig,vuln

http:
  - method: GET
    path:
      - '{{BaseURL}}'

    host-redirects: true
    max-redirects: 2

    matchers-condition: and
    matchers:
      - type: word
        part: body
        words:
          - '<fieldset id="adminaccount"><legend>Create an <strong>admin account</strong></legend>'
          - '<legend><a id="showAdvanced" tabindex="0" href="#">Storage &amp; database'
        condition: and

      - type: status
        status:
          - 200
