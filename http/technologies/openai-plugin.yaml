id: openai-plugin

info:
  name: OpenAI Plugin 指纹识别（指纹识别）
  author: pdteam
  severity: info
  description: >-
    OpenAI Plugin 描述文件用于声明可供 AI 客户端调用的插件能力、API 入口和认证方式。该模板通过请求目标服务并检查预设路径或首页响应、页面正文关键字等指纹特征，判断目标是否使用或暴露了
    OpenAI Plugin 相关组件；命中结果仅表示指纹特征匹配，可用于资产盘点、技术栈识别和后续安全评估，不代表已确认存在可利用漏洞。
  reference:
  - https://platform.openai.com/docs/plugins/introduction
  metadata:
    verified: true
    max-request: 1
  tags: tech,openai,plugin,discovery,ai
http:
  - method: GET
    path:
      - "{{BaseURL}}/.well-known/ai-plugin.json"

    matchers:
      - type: word
        words:
          - '"schema_version":'
          - '"name_for_model":'
        condition: and

    extractors:
      - type: json
        json:
          - '.name_for_human'
