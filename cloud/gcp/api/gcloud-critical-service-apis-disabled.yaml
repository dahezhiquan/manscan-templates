id: gcloud-critical-service-apis-disabled

info:
  name: Critical Service APIs未启用（云安全）
  author: princechaddha
  severity: critical
  description: IAM API 等关键 Google Cloud 服务 API 是身份权限管理和自动化治理的基础。该模板枚举项目已启用服务，并检查 iam.googleapis.com 是否存在；返回空列表时报告关键服务 API 未启用。
  impact: |
    - 关键 API 未启用可能导致身份治理、权限审计或自动化安全控制无法正常运行。
    - 安全基线依赖的服务能力缺失时，项目权限配置更容易长期处于不可见或不可管理状态。
  remediation: |
    - 按组织基线启用 IAM API 及其他必需的关键服务 API，并限制谁可以启停服务。
    - 将关键 API 启用状态纳入项目创建基线和持续合规检查。
  reference:
    - https://cloud.google.com/service-usage/docs/enable-disable
  metadata:
    vendor: google
    product: service-usage
  tags: cloud,devops,gcp,gcloud,api-management,gcp-cloud-config

flow: |
  code(1)
  for(let projectId of iterate(template.projectIds)){
    set("projectId", projectId)
    code(2)
  }

self-contained: true

code:
  - engine:
      - sh
      - bash
    source: |
      gcloud projects list --format="json(projectId)"
    extractors:
      - type: json
        name: projectIds
        internal: true
        json:
          - '.[].projectId'

  - engine:
      - sh
      - bash
    source: |
      gcloud services list --project $projectId --enabled --filter=name:iam.googleapis.com --format="json" | jq '.'

    matchers:
      - type: word
        words:
          - '[]'

    extractors:
      - type: dsl
        dsl:
          - '"Critical API not enabled: IAM API in Project: " + projectId'
