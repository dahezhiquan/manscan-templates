id: laravel-clockwork-exposure

info:
  name: Laravel Clockwork 敏感信息 暴露
  author: moamenbasel
  severity: medium
  description: |
    检测到 Laravel Clockwork 敏感信息 暴露。目标响应或文件中可能暴露配置、凭据、密钥、令牌、环境变量或历史记录等敏感信息，可能被用于进一步入侵。
  remediation: |
    - 立即移除公开文件中的敏感信息并轮换已暴露的凭据、密钥和令牌。
    - 使用安全的密钥管理方案，并阻止配置、日志和历史文件被 Web 直接访问。
  reference:
    - https://github.com/itsgoingd/clockwork
    - https://underground.works/clockwork/
  metadata:
    verified: true
    max-request: 1
    shodan-query: html:"clockwork" html:"laravel"
  tags: laravel,clockwork,misconfig,exposure

http:
  - method: GET
    path:
      - "{{BaseURL}}/__clockwork"

    matchers-condition: and
    matchers:
      - type: word
        part: body
        words:
          - '"__meta":'
          - '"toolbar":'
        condition: and

      - type: word
        part: content_type
        words:
          - "application/json"

      - type: status
        status:
          - 200
