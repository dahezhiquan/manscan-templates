id: apache-kyuubi-detect

info:
  name: Apache Kyuubi 指纹识别（指纹识别）
  author: icarot
  severity: info
  description: |-
    Apache Kyuubi 是分布式 SQL 网关，用于向 Spark、Flink 等计算引擎提供多租户 SQL 服务。该模板请求 `/ui/`，并依据 HTTP 200 状态码、页面标题、正文关键字或品牌资源特征识别目标是否使用或暴露了 Apache Kyuubi 相关组件，适用于资产盘点、技术栈识别和后续安全评估；命中结果仅表示指纹特征匹配，不代表已确认存在可利用漏洞。
  reference:
  - https://github.com/apache/kyuubi/
  classification:
    cpe: cpe:2.3:a:apache:kyuubi:*:*:*:*:*:*:*:*
  metadata:
    max-request: 1
    vendor: apache
    product: kyuubi
  tags: tech,kyuubi,apache,detect,discovery

http:
  - method: GET
    path:
      - "{{BaseURL}}/ui/"

    matchers-condition: and
    matchers:
      - type: word
        words:
          - '<title>Apache Kyuubi Dashboard'

      - type: status
        status:
          - 200
