id: semantic-ui-detect

info:
  name: Semantic UI 框架指纹识别（指纹识别）
  author: Shivam Kamboj
  severity: info
  description: |
    用于识别目标前端或应用中是否使用 Semantic UI 框架，模板会结合页面正文和特定路径或已知端点进行技术栈指纹匹配。
  reference:
    - https://semantic-ui.com/
  metadata:
    verified: true
    max-request: 1
    shodan-query: html:"semantic.min.css"
  tags: tech,semantic-ui,discovery

http:
  - method: GET
    path:
      - "{{BaseURL}}"

    redirects: true

    matchers:
      - type: regex
        part: body
        regex:
          - '(?i)href=["''][^"'']*semantic(?:[\.-]min)?\.css'
          - '(?i)src=["''][^"'']*semantic(?:[\.-]min)?\.js'
        condition: or
