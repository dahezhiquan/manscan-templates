id: gcloud-insufficient-data-retention-period

info:
  name: 检查 的Sufficient Data Retention Period 的Cloud Storage Buckets（云安全）
  author: princechaddha
  severity: medium
  description: Cloud Storage bucket 未配置足够保留期或保留策略未锁定时，关键数据和日志可能被过早删除。本模板对 bucket 执行 gsutil retention get，返回 no Retention Policy 时报告缺少足够的数据保留配置。
  impact: |
    - 误删、恶意删除或勒索攻击后，组织可能无法按要求恢复或证明历史数据完整性。
    - 不满足合规留存期限会影响审计、取证和法律保全。
  remediation: |
    - 根据数据分类和合规要求配置 bucket Retention Policy，并在确认无误后锁定策略。
    - 对不同数据类型设置明确保留期限，定期复核 bucket 的保留策略和删除权限。
  reference:
    - https://cloud.google.com/storage/docs/bucket-lock
  metadata:
    vendor: google
    product: cloud-storage
  tags: cloud,devops,gcp,gcloud,google-cloud-storage,retention,security,compliance,gcp-cloud-config

flow: |
  code(1)
  for(let projectId of iterate(template.projectIds)){
    set("projectId", projectId)
    code(2)
    for(let bucketName of iterate(template.buckets)){
      set("bucketName", bucketName)
      code(3)
    }
  }

self-contained: true

code:
  - engine:
      - sh
      - bash
    source: |
      gcloud projects list --format="json(projectId)"

    extractors:
      - type: json
        name: projectIds
        internal: true
        json:
          - '.[].projectId'

  - engine:
      - sh
      - bash
    source: |
      gsutil ls -p $projectId | jq -R . | jq -s .

    extractors:
      - type: json
        name: buckets
        internal: true
        json:
          - '.[]'

  - engine:
      - sh
      - bash
    source: |
      gsutil retention get $bucketName

    matchers:
      - type: word
        words:
          - 'no Retention Policy'

    extractors:
      - type: dsl
        dsl:
          - '"The bucket " + bucketName + " in project " + projectId + " does not have a sufficient retention period configured or the retention policy is unlocked."'
