id: k8s-containers-share-host-ipc

info:
  name: Containers sharing host IPC namespace（云安全）
  author: princechaddha
  severity: critical
  description: Pod 启用 hostIPC 会让容器共享宿主机 IPC 命名空间，可能访问或干扰节点上其他进程的共享内存与信号量。本模板枚举 Pod，并在启用 hostIPC 的工作负载上报告。
  impact: |
    - 容器可能观察或影响宿主机及其他 Pod 的 IPC 资源，破坏隔离边界。
    - 被攻陷容器可利用共享 IPC 进行信息窃取或干扰同节点进程。
  remediation: |
    - 除明确需要节点级诊断的受控工作负载外，禁止 hostIPC。
    - 使用 Pod Security Admission 或策略引擎阻止普通命名空间创建 hostIPC Pod。
  reference:
    - https://kubernetes.io/docs/tasks/configure-pod-container/security-context/
  metadata:
    vendor: kubernetes
    product: kubernetes
  tags: cloud,devops,kubernetes,devsecops,pods,k8s-cluster-security
flow: |
  code(1);
  for (let pod of template.items) {
    set("pod",pod)
    javascript(1);
  }

self-contained: true
code:
  - engine:
      - sh
      - bash
    source: kubectl get pods --all-namespaces --output=json
    extractors:
      - type: json
        name: items
        internal: true
        json:
          - '.items[]'

javascript:
  - code: |
        pod = JSON.parse(template.pod);
        if (pod.spec.hostIPC) {
          let result = (`Pod '${pod.metadata.name}' in namespace '${pod.metadata.namespace}' is configured to share the host IPC namespace.`);
          Export(result);
        }

    extractors:
      - type: dsl
        dsl:
          - response
