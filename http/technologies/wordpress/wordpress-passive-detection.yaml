id: wordpress-passive-detection

info:
  name: WordPress 插件与主题被动枚举指纹识别（指纹识别）
  author: princechaddha
  severity: info
  description: 用于被动枚举目标 WordPress 站点安装的插件和主题，模板会结合 REST API 发现结果、HTML 源码和常见资源路径进行指纹匹配。
  reference:
    - https://developer.wordpress.org/rest-api/using-the-rest-api/discovery/
    - https://github.com/Chocapikk/wpprobe
    - https://chocapikk.com/posts/2025/wpprobe/
  classification:
    cpe: cpe:2.3:a:wordpress:wordpress:*:*:*:*:*:*:*:*
  metadata:
    verified: true
    max-request: 3
    vendor: wordpress
    product: wordpress
    shodan-query:
      - http.component:"wordpress"
  tags: tech,wordpress,cms,wp,plugin,theme,discovery,passive,enum

http:
  - method: GET
    path:
      - "{{BaseURL}}/?rest_route=/"
      - "{{BaseURL}}/wp-json/"
      - "{{BaseURL}}"

    redirects: true
    max-redirects: 2
    stop-at-first-match: true

    extractors:
      - type: regex
        name: plugin_slug
        part: body
        group: 1
        regex:
          - '\/wp-content\/plugins\/([a-zA-Z0-9_-]+)\/'

      - type: regex
        name: theme_slug
        part: body
        group: 1
        regex:
          - '\/wp-content\/themes\/([a-zA-Z0-9_-]+)\/'
          - 'themes\/([a-zA-Z0-9_-]+)\/style\.css'
