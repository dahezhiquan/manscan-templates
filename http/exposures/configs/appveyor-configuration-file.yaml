id: appveyor-configuration-file

info:
  name: AppVeyor 配置 页面 检测（暴露面识别）
  author: DhiyaneshDk
  severity: medium
  description: 检测到对外可访问的 AppVeyor 配置 页面。这类配置资源可能包含部署细节、访问凭据、内部地址、组件版本或调试开关，公开暴露后会显著增加被侦察和后续利用的风险。
  classification:
    cvss-metrics: CVSS:3.1/AV:N/AC:L/PR:N/UI:N/S:U/C:L/I:N/A:N
    cvss-score: 5.3
    cwe-id: CWE-200
  metadata:
    verified: true
    max-request: 2
    shodan-query: html:"appveyor.yml"
  tags: config,exposure,devops,vuln

http:
  - method: GET
    path:
      - "{{BaseURL}}/.appveyor.yml"
      - "{{BaseURL}}/appveyor.yml"

    stop-at-first-match: true

    matchers-condition: and
    matchers:
      - type: word
        words:
          - "install:"
          - "test_script:"
        condition: and

      - type: status
        status:
          - 200
