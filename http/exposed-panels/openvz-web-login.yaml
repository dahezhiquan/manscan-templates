id: openvz-web-login

info:
  name: OpenVZ Web Panel 登录面板识别（暴露面识别）
  author: nullfuzz
  severity: info
  description: |
    该模板通过识别 OpenVZ Web 登录入口的页面标题、特征文本或重定向行为，判断目标是否暴露了对应的认证界面。若命中，说明该登录面板对外可访问，可用于暴露面梳理与后续安全评估。
  reference:
    - https://github.com/sibprogrammer/owp
  classification:
    cvss-metrics: CVSS:3.0/AV:N/AC:L/PR:N/UI:N/S:U/C:N/I:N/A:N
    cwe-id: CWE-200
  metadata:
    verified: true
    max-request: 1
    shodan-query: http.favicon.hash:-1898583197
  tags: panel,openvz,discovery

http:
  - method: GET
    path:
      - "{{BaseURL}}"

    matchers:
      - type: dsl
        dsl:
          - 'status_code == 200'
          - 'contains(body, "Login - OpenVZ Web Panel")'
        condition: and
