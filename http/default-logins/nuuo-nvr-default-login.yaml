id: nuuo-nvr-default-login

info:
  name: NUUO NVR 默认口令登录（弱口令）
  author: ritikchaddha
  severity: high
  description: |
    该模板通过尝试 NUUO NVR 的默认凭据（如 admin:admin），并依据认证成功后的响应特征判断目标是否仍在使用未修改的弱口令。若命中，攻击者可直接登录系统并访问相应管理功能或业务数据。
  reference:
    - http://www.nuuo.com/
  metadata:
    verified: true
    max-request: 1
    shodan-query: title:"NUUO"
    fofa-query: title="NUUO"
  tags: nuuo,nvr,default-login,misconfig,vuln

variables:
  username: admin
  password: admin

http:
  - raw:
      - |
        GET /login.php HTTP/1.1
        Host: {{Hostname}}

      - |
        POST /login.php HTTP/1.1
        Host: {{Hostname}}
        Content-Type: application/x-www-form-urlencoded

        language=en&user={{username}}&pass={{password}}&submit=Login

      - |
        GET /setting.php HTTP/1.1
        Host: {{Hostname}}

    matchers:
      - type: dsl
        dsl:
          - "contains_all(body_3, 'cmd=logout', 'v_settings')"
          - "status_code_3 == 200 && status_code_2 == 302"
        condition: and
