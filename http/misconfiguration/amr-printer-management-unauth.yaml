id: amr-printer-management-unauth

info:
  name: AMR Printer 管理 仪表盘 暴露
  author: ritikchaddha
  severity: medium
  description: |
    检测到 AMR Printer 管理 仪表盘 暴露。目标功能在未认证状态下可访问，可能暴露管理入口、业务数据、系统状态或可执行操作，需确认是否存在访问控制缺失。
  metadata:
    max-request: 1
    verified: true
    shodan-query: title:"AMR Printer Management"
    fofa-query: title="AMR Printer Management"
  tags: network,iot,printer,misconfig,unauth,vuln

http:
  - method: GET
    path:
      - "{{BaseURL}}"
      - "{{BaseURL}}/amr"

    stop-at-first-match: true
    matchers-condition: and
    matchers:
      - type: word
        part: body
        words:
          - "AMR Printer Management"
          - "<span>Basic Setup"
          - "<span>Log"
        condition: and

      - type: status
        status:
          - 200
