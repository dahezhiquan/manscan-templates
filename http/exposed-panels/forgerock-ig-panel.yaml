id: forgerock-ig-panel

info:
  name: ForgeRock IG Login/Welcome Page 识别（指纹识别）
  author: r3dg33k
  severity: info
  description: |-
    检测到目标站点存在 ForgeRock IG Login/Welcome Page 相关响应特征。ForgeRock IG Login/Welcome Page 是网络设备或网关的 Web 管理界面，用于配置路由、无线、蜂窝接入、端口转发和设备运维参数。模板请求 `/`，并通过页面标题或正文关键字、状态码、DSL 条件确认该系统指纹，用于资产识别、系统盘点和暴露面梳理。
  metadata:
    verified: true
    max-request: 1
    fofa-query: body="ForgeRock Identity Platform"
    shodan-query: html:"ForgeRock Identity Platform"
  tags: forgerock,ig,login,identity-gateway,detect,discovery
http:
  - method: GET
    path:
      - "{{BaseURL}}"

    redirects: true

    matchers:
      - type: dsl
        dsl:
          - 'status_code == 200'
          - 'contains(tolower(body), "forgerock")'
          - 'contains_any(tolower(body), "<title>ig", "identity gateway", "forgerock identity platform", "welcome to identity gateway")'
        condition: and

    extractors:
      - type: regex
        name: ig_version
        part: body
        regex:
          - 'Identity Gateway (\d+\.\d+(\.\d+)?)'   # Extracts version like 7.2 or 7.2.0
