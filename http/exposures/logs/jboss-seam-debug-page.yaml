id: jboss-seam-debug-page

info:
  name: Jboss Seam Debug 页面 Enabled 泄露（暴露面识别）
  author: dhiyaneshDK
  severity: medium
  description: 检测到可直接访问的 Jboss Seam Debug 页面 Enabled。日志、异常页面或调试输出通常会泄露堆栈信息、内部路径、查询语句、账号标识、令牌片段或业务数据，不应向未授权用户开放。
  reference:
    - https://github.com/jaeles-project/jaeles-signatures/blob/master/common/jboss-seam-debug-page.yaml
  metadata:
    max-request: 1
  tags: jboss,logs,exposure,vuln

http:
  - method: GET
    path:
      - "{{BaseURL}}/debug.seam"

    matchers-condition: and
    matchers:
      - type: word
        words:
          - "SeamDebugPage"
          - "org.jboss.seam"
        condition: and

      - type: status
        status:
          - 200
