id: hp-laserjet-config

info:
  name: HP LaserJet 配置暴露（暴露面识别）
  author: DhiyaneshDk
  severity: medium
  description: |
    检测到目标站点可直接访问 HP LaserJet 配置。这类配置或资源文件通常服务于应用部署、依赖管理、调试、运行参数或内部集成。该模板请求 `/hp/device/this.LCDispatcher?nav=hp.Config`、`/info_configuration.html?tab=Home&menu=DevConfig`、`/SSI/info_configuration.htm`，并通过 HTTP 状态码、响应正文关键字、文件格式特征、正则匹配或响应头进行确认。此类资源公开后可能泄露部署细节、内部路径、依赖版本、环境变量、访问凭据或调试信息，增加被侦察和后续利用的风险。
  impact: |-
    - 设备或工业系统配置暴露可能泄露管理接口、网络地址、型号版本和运行参数。
    - 攻击者可据此定位设备管理入口、默认配置或已知漏洞，增加未授权访问和业务中断风险。
    - 在生产、办公或物联网场景中，相关信息还可能辅助横向移动和物理设备攻击。
  remediation: |-
    - 确认该资源是否必须公网可访问；如非业务必需，应立即从 Web 根目录、静态资源目录、对象存储或反向代理公开路径中移除。
    - 在 Web 服务器、网关、CDN 或应用路由层增加拒绝规则、身份认证、IP allowlist 或内网访问限制。
    - 检查访问日志、下载记录和缓存记录，评估该资源是否已被外部访问或搜索引擎收录。
    - 若文件中包含凭据、令牌、连接串或私有地址，应执行密钥轮换、权限收敛和受影响系统访问审计。
  reference:
    - https://support.hp.com/us-en/document/ish_4629476-1206130-16
    - https://h10032.www1.hp.com/ctg/Manual/c03137192.pdf
    - https://www.exploit-db.com/ghdb/6459
  classification:
    cvss-metrics: CVSS:3.1/AV:N/AC:L/PR:N/UI:N/S:U/C:L/I:N/A:N
    cvss-score: 5.3
    cwe-id: CWE-200
  metadata:
    verified: true
    max-request: 3
    vendor: hp
    product: laserjet
    shodan-query: http.title:"HP LaserJet"
    fofa-query: title="HP LaserJet"
    google-query: intitle:"HP LaserJet" inurl:info_configuration
  tags: hp,laserjet,printer,iot,config,exposure,misconfig,intrusive

http:
  - method: GET
    path:
      - "{{BaseURL}}/hp/device/this.LCDispatcher?nav=hp.Config"
      - "{{BaseURL}}/info_configuration.html?tab=Home&menu=DevConfig"
      - "{{BaseURL}}/SSI/info_configuration.htm"

    stop-at-first-match: true

    matchers-condition: and
    matchers:
      - type: word
        part: body
        words:
          - "Configuration Page"
          - "Device Configuration"
          - "set_config_deviceinfo"
        condition: or

      - type: status
        status:
          - 200
