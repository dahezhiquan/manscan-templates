id: vinchin-panel

info:
  name: Vinchin Backup & Recovery 面板识别（暴露面识别）
  author: pussycat0x
  severity: info
  description: 该模板通过识别 Vinchin Backup & Recovery 登录入口的页面标题、特征文本或重定向行为，判断目标是否暴露了对应的认证界面。若命中，说明该登录面板对外可访问，可用于暴露面梳理与后续安全评估。
  classification:
    cwe-id: CWE-200
    cpe: cpe:2.3:a:vinchin:vinchin_backup_and_recovery:*:*:*:*:*:*:*:*
  metadata:
    verified: true
    max-request: 1
    shodan-query: html:"VinChin"
    product: vinchin_backup_and_recovery
    vendor: vinchin
  tags: panel,vinchin,login,discovery

http:
  - method: GET
    path:
      - '{{BaseURL}}'

    host-redirects: true

    matchers-condition: and
    matchers:
      - type: word
        part: body
        words:
          - 'Vinchin Backup & Recovery'

      - type: status
        status:
          - 200
