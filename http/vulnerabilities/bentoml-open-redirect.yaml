id: bentoml-open-redirect

info:
  name: BentoML v1.3.9 - 开放重定向漏洞（CVE-2024-12760）
  author: DhiyaneshDK
  severity: medium
  description: |
    该模板用于检测 BentoML v1.3.9 - 开放重定向漏洞（CVE-2024-12760）。该类漏洞通常源于跳转地址未经过严格校验，导致用户可被引导到外部恶意站点。模板主要向 `/ui/gradio_api/file=https://oast.me` 等路径发送探测请求，并根据OAST/DNS/HTTP 外带交互、响应状态或关键字回显确认漏洞是否存在。
  impact: |
    - 攻击者可构造跳转链接，将用户从可信域名引导到恶意站点。
    - 该问题常被用于钓鱼、OAuth 授权码劫持、绕过跳转白名单或提升社工攻击可信度。
  remediation: |
    - 对跳转目标使用固定白名单或相对路径，禁止直接信任用户传入的完整 URL。
    - 规范化校验协议、主机名、反斜杠和多重编码后的跳转地址。
    - 审计登录、授权和下载等跳转场景，避免开放重定向进入认证链路。
  reference:
    - https://huntr.com/bounties/2a284ff6-cc6c-4a10-b72e-1bb31c842bca
  metadata:
    verified: true
    max-request: 1
    shodan-query: html:"BentoML"
  tags: gradio,redirect,oss,bentoml,vuln

http:
  - method: GET
    path:
      - "{{BaseURL}}/ui/gradio_api/file=https://oast.me"

    matchers:
      - type: regex
        part: header
        regex:
          - '(?m)^(?:Location\s*?:\s*?)(?:https?://|//)?(?:[a-zA-Z0-9\-_\.@]*)oast\.me.*$'
