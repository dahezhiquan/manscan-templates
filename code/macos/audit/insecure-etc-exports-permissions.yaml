id: insecure-etc-exports-permissions

info:
  name: macOS /etc/exports 权限不安全（本地基线扫描）
  author: geeknik
  severity: high
  description: |
    该模板检查 /etc/exports 权限，该文件用于配置 NFS 导出。权限过宽可能导致共享配置被篡改。
  impact: |
    本地攻击者可能篡改可自动执行或高权限相关文件，造成持久化、权限提升或配置破坏。
  remediation: |
    收紧相关文件或目录权限，移除全局可写位，确保关键配置仅由 root 或授权管理员维护。
  tags: macos,audit,local,security,nfs

self-contained: true

code:
  - engine:
      - sh
      - bash
    source: |
      ls -l /etc/exports 2>&1
    matchers-condition: and
    matchers:
      - type: status
        status:
          - 0
      - type: regex
        regex:
          - "^-rw-r--r--\\s+\\d+\\s+root\\s+\\w+"
        negative: true
