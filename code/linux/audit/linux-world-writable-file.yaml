id: linux-world-writable-file

info:
  name: Linux 全局可写文件权限异常（本地基线扫描）
  author: songyaeji
  severity: high
  description: |
    该模板检查系统文件是否存在全局可写权限。关键文件可被任意用户修改时，可能被用于提权、篡改配置或破坏系统。
  reference:
    - https://isms.kisa.or.kr
  tags: linux,local,audit,compliance,kisa

self-contained: true

code:
  - engine:
      - sh
      - bash
    source: |
      find / -type f -perm -0002 ! -path "/tmp/*" -exec ls -l {} \; 2>/dev/null

    matchers:
      - type: regex
        name: world-writable-files
        part: response
        regex:
          - "^-........w.*"
