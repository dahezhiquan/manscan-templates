id: redbubble-phish

info:
  name: Redbubble 仿冒钓鱼网站（钓鱼网站识别）
  author: rxerium
  severity: info
  description: |
    检测到疑似仿冒 Redbubble 的钓鱼网站。模板在目标页面返回 200、页面内容命中 Redbubble 的品牌页面特征，且当前主机不属于 redbubble.com 官方域名时触发，用于识别借用 Redbubble 品牌页面诱导用户信任的仿冒站点。
  reference:
    - https://redbubble.com
  metadata:
    max-request: 1
  tags: phishing,redbubble,osint,discovery
http:
  - method: GET
    path:
      - "{{BaseURL}}"

    host-redirects: true
    max-redirects: 2

    matchers-condition: and
    matchers:
      - type: word
        words:
          - 'Redbubble'
          - 'Over 700,000 creatives worldwide making things like shirts, stickers, phone cases, and pillows weirdly meaningful. Find your thing or open your own shop.'
        condition: and

      - type: status
        status:
          - 200

      - type: dsl
        dsl:
          - '!contains(host,"redbubble.com")'
