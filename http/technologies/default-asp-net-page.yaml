id: default-asp-net-page

info:
  name: ASP.Net 默认页面指纹识别（指纹识别）
  author: dhiyaneshDk
  severity: info
  description: |
    用于识别目标是否部署 ASP.Net 默认页面 并提取相关版本或构建信息，模板会结合页面标题、页面正文、特定路径或已知端点和版本或标识提取结果进行指纹匹配。
  metadata:
    max-request: 1
    shodan-query: http.title:"Home Page - My ASP.NET Application"
  tags: tech,asp,discovery

http:
  - method: GET
    path:
      - '{{BaseURL}}'

    matchers:
      - type: word
        part: body
        words:
          - "Home Page - My ASP.NET Application"
          - "ASP.NET is a free web framework for building great Web sites and Web applications"
          - "My ASP.NET Application"
        condition: or
