id: gcloudignore-file-exposure

info:
  name: Google Cloud Ignore 文件暴露（暴露面识别）
  author: DhiyaneshDK
  severity: low
  description: |
    检测到对外可访问的 Google Cloud Ignore 文件。相关文件可能泄露项目结构、依赖关系、部署细节、敏感参数或其他不应公开的内部信息。
  reference:
    - https://cloud.google.com/sdk/gcloud/reference/topic/gcloudignore
  metadata:
    verified: true
    max-request: 1
  tags: exposure,gcloud,google,config,files,cloud

http:
  - method: GET
    path:
      - "{{BaseURL}}/.gcloudignore"

    matchers-condition: and
    matchers:
      - type: word
        part: body
        words:
          - "deployment"
          - "Cloud Build"
        condition: or

      - type: word
        part: content_type
        words:
          - "application/octet-stream"

      - type: status
        status:
          - 200
