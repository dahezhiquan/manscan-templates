id: quilium-panel

info:
  name: Quilium 登录面板识别（指纹识别）
  author: righettod
  severity: info
  description: |-
    Quilium 是 Web 应用管理界面，用于对应服务的账户登录、配置和业务操作。该模板请求首页、`/en/login` 路径，并依据 HTTP 200 状态码、页面标题、正文关键字或品牌资源特征识别目标是否部署了该系统或暴露了对应入口，适用于资产指纹确认；命中结果仅表示系统特征匹配，不代表已确认存在未授权访问或可利用漏洞。
  reference:
  - https://www.quilium.io/
  metadata:
    verified: true
    max-request: 2
    shodan-query: http.html:"CMS Quilium"
  tags: panel,quilium,login,detect,discovery

http:
  - method: GET
    path:
      - '{{BaseURL}}'
      - '{{BaseURL}}/en/login'

    stop-at-first-match: true

    matchers-condition: and
    matchers:
      - type: word
        part: body
        words:
          - 'content="CMS Quilium'
          - 'Quilium</a>'
        condition: or
        case-insensitive: true

      - type: status
        status:
          - 200

    extractors:
      - type: regex
        part: body
        group: 1
        regex:
          - 'CMS Quilium ([a-f0-9.]+)'
