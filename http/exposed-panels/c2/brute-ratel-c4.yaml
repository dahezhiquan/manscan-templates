id: brute-ratel-c4

info:
  name: Brute Ratel C4 识别（暴露面识别）
  author: pussycat0x
  severity: info
  description: |
    该模板通过识别 Brute Ratel C4 相关页面或响应特征，判断目标是否暴露了疑似 C2、窃密或钓鱼基础设施面板。若命中，可作为外部暴露面排查、威胁狩猎与恶意基础设施识别的线索。
  reference:
    - https://bruteratel.com/
  metadata:
    verified: "true"
    max-request: 1
    shodan-query: http.html_hash:-1957161625
  tags: c2,bruteratel,c4,panel,vuln

http:
  - method: GET
    path:
      - "{{BaseURL}}"

    matchers-condition: and
    matchers:
      - type: dsl
        dsl:
          - "contains(body, '404 file not found')"
          - "(\"1a279f5df4103743b823ec2a6a08436fdf63fe30\" == sha1(body))"
        condition: and
