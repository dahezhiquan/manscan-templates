id: aircube-dashboard-panel

info:
  name: airCube Dashboard 登录面板识别（暴露面识别）
  author: theamanrawat
  severity: info
  description: 该模板通过识别 airCube 仪表盘或后台界面的页面特征，判断目标是否对外暴露了相关控制台。若命中，说明该服务面向外部可访问，可用于资产识别与访问控制核查。
  classification:
    cvss-metrics: CVSS:3.0/AV:N/AC:L/PR:N/UI:N/S:U/C:N/I:N/A:N
    cwe-id: CWE-200
    cpe: cpe:2.3:h:ui:aircube:*:*:*:*:*:*:*:*
  metadata:
    verified: true
    max-request: 1
    shodan-query: http.title:"AirCube Dashboard"
    product: aircube
    vendor: ui
  tags: panel,aircube,discovery

http:
  - method: GET
    path:
      - '{{BaseURL}}'

    matchers-condition: and
    matchers:
      - type: word
        part: body
        words:
          - 'AirCube Dashboard'

      - type: status
        status:
          - 200
