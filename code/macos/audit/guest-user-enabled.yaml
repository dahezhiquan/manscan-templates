id: guest-user-enabled

info:
  name: macOS 访客用户已启用（本地基线扫描）
  author: geeknik
  severity: medium
  description: |
    macOS 访客用户启用后，任何能接触设备的人都可能创建临时会话，增加本地滥用和数据暴露风险。模板读取 `com.apple.loginwindow GuestEnabled`，当值为 `1` 时表示访客账户已启用。
  impact: |
    - 未授权人员可在不具备正式账号的情况下使用设备资源和网络环境。
    - 访客会话可能绕过组织对用户身份、日志和数据访问的管控。
  remediation: |
    - 禁用 Guest User，并确保登录窗口仅允许授权账号。
    - 配合屏幕锁定、FileVault 和设备管理策略降低物理接触风险。
  tags: macos,audit,local,security

self-contained: true

code:
  - engine:
      - sh
      - bash
    source: |
      defaults read /Library/Preferences/com.apple.loginwindow GuestEnabled 2>&1
    matchers-condition: and
    matchers:
      - type: status
        status:
          - 0
      - type: regex
        regex:
          - "^1$"
