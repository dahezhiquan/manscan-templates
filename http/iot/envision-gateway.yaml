id: envision-gateway

info:
  name: EnvisionGateway 调度面板（IOT）
  author: dhiyaneshDK
  severity: medium
  description: |
    检测到 EnvisionGateway Scheduler 面板。该面板暴露可用于确认调度系统或网关资产，并可能泄露内部业务调度服务的访问入口。
  impact: |
    - 网关、路由器或 VPN 管理入口暴露会增加口令攻击、配置探测和设备接管风险。
    - 网络边界设备一旦被控制，可能导致流量劫持、访问策略篡改或内网横向移动。
  remediation: |
    - 将网络设备管理入口限制在可信管理网段或 VPN 内，禁止公网暴露。
    - 修改默认凭据，启用强认证和登录失败限制。
    - 定期升级固件并审计路由、DNS、端口转发和 VPN 配置变更。
  reference:
    - https://www.exploit-db.com/ghdb/7315
  classification:
    cvss-metrics: CVSS:3.1/AV:N/AC:L/PR:N/UI:N/S:U/C:N/I:N/A:N
    cvss-score: 0
    cwe-id: CWE-200
  metadata:
    max-request: 1
    shodan-query: http.title:"EnvisionGateway"
  tags: iot,edb,discovery

http:
  - method: GET
    path:
      - '{{BaseURL}}/#'

    matchers-condition: and
    matchers:
      - type: word
        words:
          - '<title>EnvisionGateway</title>'

      - type: status
        status:
          - 200
