id: package-json

info:
  name: NPM package.JSON 泄露（暴露面识别）
  author: geeknik,afaq,noraj
  severity: info
  description: |
    检测到对外可访问的 NPM package.JSON。这类配置资源可能包含部署细节、访问凭据、内部地址、组件版本或调试开关，公开暴露后会显著增加被侦察和后续利用的风险。
  reference:
    - https://docs.npmjs.com/cli/v9/configuring-npm/package-json
    - https://classic.yarnpkg.com/lang/en/docs/package-json/
    - https://pnpm.io/package_json
  classification:
    cwe-id: CWE-552
  metadata:
    verified: true
    max-request: 2
  tags: config,exposure,node,npm,vuln

http:
  - method: GET
    path:
      - "{{BaseURL}}/package.json"
      - "{{BaseURL}}/package-lock.json"

    matchers-condition: and
    matchers:
      - type: word
        words:
          - "name"
          - "version"
        condition: and

      - type: word
        part: header
        words:
          - "application/json"

      - type: status
        status:
          - 200
