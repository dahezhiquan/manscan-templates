id: weights-biases-wandb-detect

info:
  name: Weights & Biases 指纹识别（指纹识别）
  author: rxerium
  severity: info
  description: >-
    Weights & Biases 是机器学习实验跟踪和 MLOps 平台，用于记录训练指标、模型、数据集和协作看板。该模板通过请求目标服务并检查预设路径或首页响应、页面正文关键字、状态码等指纹特征，判断目标是否使用或暴露了
    Weights & Biases 相关组件；命中结果仅表示指纹特征匹配，可用于资产盘点、技术栈识别和后续安全评估，不代表已确认存在可利用漏洞。
  reference:
  - https://github.com/wandb/wandb
  - https://wandb.ai/
  metadata:
    verified: true
    max-request: 1
    vendor: wandb
    product: weights-and-biases
    shodan-query: 'http.html:"wandb" http.title:"Weights & Biases"'
  tags: tech,weights-biases,wandb,mlops,ai,detect,discovery
http:
  - method: GET
    path:
      - "{{BaseURL}}"

    host-redirects: true
    max-redirects: 2

    matchers-condition: and
    matchers:
      - type: word
        part: body
        words:
          - "<title>Weights & Biases"

      - type: status
        status:
          - 200
