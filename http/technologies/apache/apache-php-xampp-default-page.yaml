id: apache-php-xampp-default-page

info:
  name: XAMPP 默认页面 指纹识别（指纹识别）
  author: dhiyaneshDK
  severity: info
  description: XAMPP 默认页面 是集成 Apache、PHP、MariaDB 等组件的本地 Web 开发环境。该模板请求 `/dashboard/`，并依据 HTTP 200 状态码、页面标题、正文关键字或品牌资源特征识别目标是否使用或暴露了 XAMPP 默认页面 相关组件，适用于资产盘点、技术栈识别和后续安全评估；命中结果仅表示指纹特征匹配，不代表已确认存在可利用漏洞。
  classification:
    cpe: cpe:2.3:a:apachefriends:xampp:*:*:*:*:*:*:*:*
  metadata:
    max-request: 1
    vendor: apachefriends
    product: xampp
    shodan-query: http.title:"XAMPP"
  tags: tech,php,xampp,apache,discovery

http:
  - method: GET
    path:
      - '{{BaseURL}}/dashboard/'

    matchers-condition: and
    matchers:
      - type: regex
        regex:
          - '(?i)<title>\s*(?:Welcome to XAMPP|XAMPP(?: Version)?\s+[0-9]+(?:[.][0-9]+)+)\s*</title>'

      - type: status
        status:
          - 200

    extractors:
      - type: regex
        name: detected_version
        part: body
        group: 1
        regex:
          - '(?i)<title>\s*XAMPP(?: Version)?\s+([0-9]+(?:[.][0-9]+)+(?:[-+._][0-9A-Za-z]+)*)\s*</title>'
          - (?i)XAMPP for (?:Windows|Linux|OS X)\s+([0-9]+(?:[.][0-9]+)+(?:[-+._][0-9A-Za-z]+)*)\s*<
        internal: true
      - type: dsl
        dsl:
          - 'regex("^[0-9]+(?:[.][0-9]+)*(?:[-+._][0-9A-Za-z]+)*$", detected_version) ? detected_version : ""'
