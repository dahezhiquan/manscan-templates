id: agent-zero-detect

info:
  name: Agent-Zero 应用 指纹识别（指纹识别）
  author: 0x_Akoko
  severity: info
  description: |-
    Agent-Zero 应用 是 AI Agent 应用框架或 Web 控制台，用于组织代理任务、提示词和自动化工作流。该模板请求首页，并依据 DSL 条件识别目标是否使用或暴露了 Agent-Zero 应用 相关组件，适用于资产盘点、技术栈识别和后续安全评估；命中结果仅表示指纹特征匹配，不代表已确认存在可利用漏洞。
  reference:
  - https://github.com/agent0ai/agent-zero
  metadata:
    verified: true
    max-request: 1
  tags: agent-zero,detect,tech,discovery

http:
  - method: GET
    path:
      - "{{BaseURL}}"

    matchers:
      - type: dsl
        dsl:
          - 'status_code == 200'
          - 'contains(body, "Agent Zero") && contains(body, "a0version")'
        condition: and

    extractors:
      - type: regex
        part: body
        group: 1
        regex:
          - 'v([0-9]+\.[0-9]+\.[0-9]+(?:\.[0-9]+)?)'
