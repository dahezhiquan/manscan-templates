id: pgsql-list-users

info:
  name: PostgreSQL 用户列表枚举（服务漏洞）
  author: pussycat0x
  severity: high
  description: |
    PostgreSQL 服务接受模板尝试的凭据后，允许枚举数据库用户和角色信息。模板登录后查询用户列表，并以返回的账号字段作为验证证据，用于识别账号面与高权限角色线索。
  impact: |
    - 用户和角色列表会暴露数据库账号面、权限模型和潜在高权限角色。
    - 攻击者可将账号信息用于口令猜测、权限路径分析或针对管理账号的后续攻击。
  remediation: |
    - 限制普通账号枚举角色和用户信息的权限，移除弱凭据。
    - 定期清理无用角色，最小化权限授予，并监控异常账号枚举查询。
  reference:
    - https://github.com/swisskyrepo/PayloadsAllTheThings/blob/master/SQL%20Injection/PostgreSQL%20Injection.md#postgresql-list-users
  metadata:
    verified: true
    max-request: 8
    shodan-query: "product:\"PostgreSQL\""
    vendor: postgresql
    product: postgresql
  tags: js,network,postgresql,enum,authenticated,discovery
javascript:
  - pre-condition: |
      isPortOpen(Host,Port);
    code: |
      const postgres = require('nuclei/postgres');
      const client = new postgres.PGClient;
      connected =  client.ExecuteQuery(Host, Port, User, Pass, Db, "SELECT usename FROM pg_user");
      Export(connected);

    args:
      Host: "{{Host}}"
      Port: 5432
      User: "{{usernames}}"
      Pass: "{{password}}"
      Db: "{{database}}"

    payloads:
      usernames:
        - postgres
        - admin
      password:
        - postgres
        -
        - 123
        - amber
      database:
        - postgres

    attack: clusterbomb

    extractors:
      - type: json
        json:
          - '.Rows[].usename'
