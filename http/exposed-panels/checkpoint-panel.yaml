id: checkpoint-panel

info:
  name: Checkpoint 登录面板识别（暴露面识别）
  author: 0x240x23elu
  severity: info
  description: 该模板通过识别 Checkpoint 登录入口的页面标题、特征文本或重定向行为，判断目标是否暴露了对应的认证界面。若命中，说明该登录面板对外可访问，可用于暴露面梳理与后续安全评估。
  classification:
    cvss-metrics: CVSS:3.0/AV:N/AC:L/PR:N/UI:N/S:U/C:N/I:N/A:N
    cwe-id: CWE-200
  metadata:
    max-request: 2
  tags: panel,checkpoint,discovery

http:
  - method: GET
    path:
      - "{{BaseURL}}/sslvpn/Login/Login"
      - "{{BaseURL}}/Login/Login"

    matchers-condition: and
    host-redirects: true
    matchers:
      - type: status
        status:
          - 200

      - type: word
        part: body
        words:
          - "Check Point Software Technologies Ltd. All rights reserved."
          - "/Login/images/CompanyLogo.png"
        condition: and

      - type: word
        part: header
        words:
          - "text/html"
