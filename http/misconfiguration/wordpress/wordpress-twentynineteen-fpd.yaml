id: wordpress-twentynineteen-fpd

info:
  name: WordPress Twenty Nineteen 完整路径泄露
  author: pussycat0x
  severity: low
  description: |
    检测到 WordPress Twenty Nineteen 完整路径泄露。目标功能在未认证状态下可访问，可能暴露管理入口、业务数据、系统状态或可执行操作，需确认是否存在访问控制缺失。
  reference:
    - https://wordpress.org/themes/twentynineteen/
  metadata:
    verified: false
  tags: wordpress,wp,wp-theme,twentytwenty,fpd

http:
  - method: GET
    path:
      - "{{BaseURL}}/wp-content/themes/twentynineteen/functions.php"

    matchers:
      - type: dsl
        dsl:
          - 'contains_all(body, "Fatal error", "Uncaught Error:") || contains_all(body, "Warning:", "failed to open stream")'
          - 'contains(body, "twentytwenty")'
          - 'status_code == 200 || status_code == 500'
        condition: and
