id: haivision-gateway-panel

info:
  name: Haivision Gateway 登录面板识别（指纹识别）
  author: righettod
  severity: info
  description: |-
    检测到目标站点存在 Haivision Gateway 相关响应特征。Haivision Gateway 是网络设备或网关的 Web 管理界面，用于配置路由、无线、蜂窝接入、端口转发和设备运维参数。模板请求 `/`，并通过页面标题或正文关键字、状态码、DSL 条件确认该系统指纹，用于资产识别、系统盘点和暴露面梳理。
  reference:
    - https://www.haivision.com/
  metadata:
    verified: true
    max-request: 1
    shodan-query: http.title:"Haivision Gateway"
  tags: panel,haivision,login,detect,discovery
http:
  - method: GET
    path:
      - "{{BaseURL}}"

    matchers:
      - type: dsl
        dsl:
          - 'status_code == 200'
          - 'contains_any(body, "<title>Haivision Gateway", "content=\"Haivision Gateway")'
        condition: and
