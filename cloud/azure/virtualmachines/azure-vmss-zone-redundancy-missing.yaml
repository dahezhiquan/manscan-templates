id: azure-vmss-zone-redundancy-missing
info:
  name: Azure VMSS Zone-Redundant Configuration未启用（云安全）
  author: princechaddha
  severity: high
  description: Azure 可用性区域可将 VMSS 实例分散到不同物理故障域；zones 为空或未包含预期区域编号时，本模板无法确认规模集启用了区域冗余。本模板枚举规模集并查询 zones，在匹配空数组且未匹配区域值 1 时报告。
  impact: |
    - 区域级故障、维护或网络事件可能同时影响全部实例，造成服务不可用和恢复压力。
    - 缺少故障域分散还会降低跨区域演练和容量切换的可靠性，影响关键业务的连续性目标。
  remediation: |
    - 在支持可用性区域的区域中重新设计或迁移 VMSS，明确指定多个 zones，并验证镜像、磁盘、负载均衡和容量配额兼容性。
    - 对不支持区域冗余的区域或工作负载记录例外，使用可用性集、跨区域部署、备份和灾难恢复演练补偿。
  reference:
    - https://docs.microsoft.com/en-us/azure/virtual-machine-scale-sets/virtual-machine-scale-sets-design-overview
  metadata:
    vendor: microsoft
    product: azure-virtual-machine-scale-sets
  tags: cloud,devops,azure,microsoft,vmss,azure-cloud-config

flow: |
  code(1);
  for (let ScaleSetData of iterate(template.scaleSetList)) {
    ScaleSetData = JSON.parse(ScaleSetData);
    set("name", ScaleSetData.name);
    set("resourceGroup", ScaleSetData.resourceGroup);
    code(2);
  }

self-contained: true
code:
  - engine:
      - sh
      - bash
    source: |
      az vmss list --output json --query '[*].{"name":name,"resourceGroup":resourceGroup}'

    extractors:
      - type: json
        name: scaleSetList
        internal: true
        json:
          - '.[]'

  - engine:
      - sh
      - bash
    source: |
      az vmss show --name "$name" --resource-group "$resourceGroup" --query 'zones' --output json

    matchers-condition: and
    matchers:
      - type: word
        part: body
        words:
          - '[]'

      - type: word
        negative: true
        words:
          - "1"

    extractors:
      - type: dsl
        dsl:
          - 'name + " in " + resourceGroup + " is not using a zone-redundant configuration"'
