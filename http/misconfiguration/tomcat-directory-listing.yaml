id: tomcat-directory-listing

info:
  name: Apache Tomcat 目录列出启用
  author: oleveloper
  severity: medium
  description: |-
    该模板用于核查 Apache Tomcat 目录列出启用。Web 服务器或应用目录开启目录列出后，未授权用户可浏览目录中的文件名和资源结构。模板访问 目标入口，并根据目录索引标题、链接列表或组件目录特征确认目录列出是否启用。
  remediation: |-
    - 关闭 Web 服务器目录索引功能，例如 Apache `Options -Indexes` 或 Nginx 禁用 `autoindex`。
    - 将敏感文件移出 Web 根目录，并为必要目录配置认证和访问控制。
    - 清理历史备份、临时文件和调试文件，避免可下载资源长期暴露。
  reference:
    - https://isms.kisa.or.kr
  metadata:
    verified: true
    max-request: 1
    vendor: apache
    product: tomcat
    shodan-query: title:"Apache Tomcat"
  tags: tomcat,misconfig,listing,kisa,vuln
  impact: |-
    - 攻击者可枚举备份文件、配置文件、日志、源码包和未公开资源。
    - 暴露的目录结构可辅助识别组件版本、文件路径和后续下载目标。
http:
  - method: GET
    path:
      - "{{BaseURL}}"

    matchers-condition: and
    matchers:
      - type: word
        part: body
        words:
          - "Directory Listing For"
          - "<a href="
        condition: and

      - type: regex
        part: header
        regex:
          - "(?i)content-type:.*text/html"

      - type: status
        status:
          - 200
