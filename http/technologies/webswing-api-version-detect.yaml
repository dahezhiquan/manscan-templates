id: webswing-api-version-detect

info:
  name: WebSwing REST API 版本指纹识别（指纹识别）
  author: aushack
  severity: info
  description: |
    用于识别目标是否部署 WebSwing REST API 版本 并提取相关版本或构建信息，模板会结合页面正文、状态码、特定路径或已知端点和版本或标识提取结果进行指纹匹配。
  metadata:
    verified: true
    max-request: 1
    shodan-query: 'Server: webswing.org'
  tags: webswing,rest,api,version,detect,discovery

http:
  - method: GET
    path:
      - "{{BaseURL}}/rest/version"

    matchers-condition: and
    matchers:
      - type: word
        part: server
        words:
          - "webswing.org"

      - type: status
        status:
          - 200

    extractors:
      - type: regex
        part: body
        regex:
          - '^(\d+(?:\.\d+)*)$'
        group: 1
