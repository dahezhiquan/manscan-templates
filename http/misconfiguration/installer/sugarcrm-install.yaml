id: sugarcrm-install

info:
  name: SugarCRM 暴露 安装
  author: ritikchaddha
  severity: high
  description: |
    检测到 SugarCRM 暴露 安装。该页面属于安装、初始化或配置向导流程，若对外暴露，攻击者可能完成初始化、创建管理员账户或重新配置目标系统。
  classification:
    cpe: cpe:2.3:a:sugarcrm:sugarcrm:*:*:*:*:*:*:*:*
  metadata:
    verified: true
    max-request: 1
    vendor: sugarcrm
    product: sugarcrm
    shodan-query: title:"Sugar Setup Wizard"
  tags: misconfig,sugar,sugarcrm,install,vuln

http:
  - method: GET
    path:
      - "{{BaseURL}}/install.php"

    matchers-condition: and
    matchers:
      - type: word
        part: body
        words:
          - "<title>Sugar Setup Wizard"

      - type: status
        status:
          - 200
