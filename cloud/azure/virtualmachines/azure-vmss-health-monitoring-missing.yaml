id: azure-vmss-health-monitoring-missing
info:
  name: Azure VMSS Health 监控未启用（云安全）
  author: princechaddha
  severity: medium
  description: Azure VMSS Application Health 扩展为滚动升级和自动修复提供实例健康信号；缺少 ApplicationHealthLinux 或 healthRepairExtension 时，平台无法可靠判断实例是否可接收流量。本模板枚举规模集并查询扩展名称，在扩展列表存在但未匹配这些名称时报告。
  impact: |
    - 不健康实例可能继续接收请求，造成间歇性故障、数据处理错误或服务可用性下降。
    - 自动升级和自动修复缺少可靠健康门槛时，可能扩大故障范围或将异常版本快速传播到实例池。
  remediation: |
    - 安装并配置 Application Health 扩展或适用的健康修复扩展，提供不依赖外部脆弱链路的健康探测端点。
    - 将健康状态接入滚动升级、自动修复和负载均衡策略，并监控扩展 provisioning 状态与探测失败原因。
  reference:
    - https://docs.microsoft.com/en-us/azure/virtual-machine-scale-sets/virtual-machine-scale-sets-health-extension
  metadata:
    vendor: microsoft
    product: azure-virtual-machine-scale-sets
  tags: cloud,devops,azure,microsoft,vmss,azure-cloud-config

flow: |
  code(1);
  for (let VMSSData of iterate(template.vmssList)) {
    VMSSData = JSON.parse(VMSSData);
    set("name", VMSSData.name);
    set("resourceGroup", VMSSData.resourceGroup);
    code(2);
  }

self-contained: true
code:
  - engine:
      - sh
      - bash
    source: |
      az vmss list --output json --query '[*].{"name":name,"resourceGroup":resourceGroup}'

    extractors:
      - type: json
        name: vmssList
        internal: true
        json:
          - '.[]'

  - engine:
      - sh
      - bash
    source: |
      az vmss show --name "$name" --resource-group "$resourceGroup" --query 'virtualMachineProfile.extensionProfile.extensions[*].name'

    matchers-condition: and
    matchers:
      - type: word
        words:
          - '['

      - type: word
        words:
          - 'ApplicationHealthLinux'
          - 'healthRepairExtension'
        negative: true

    extractors:
      - type: dsl
        dsl:
          - 'name + " in " + resourceGroup + " does not have health monitoring enabled"'
