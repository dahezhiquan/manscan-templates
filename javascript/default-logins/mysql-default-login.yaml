id: mysql-default-login

info:
  name: MySQL 默认凭据检测（服务漏洞）
  author: DhiyaneshDk,pussycat0x,ritikchaddha
  severity: high
  description: |
    目标 MySQL 服务接受常见默认或弱口令凭据连接，可能导致数据库被未授权访问。模板先读取服务握手响应并匹配 MySQL 指纹，确认目标为 MySQL 后再使用内置用户名和密码字典建立连接，并在首组凭据认证成功时确认风险并停止后续尝试。
  impact: |
    - 攻击者可使用弱凭据访问 MySQL 数据库，读取、修改或删除业务数据。
    - 若账户具备 FILE、SUPER 或管理权限，可能进一步读取服务器文件、写入恶意内容或影响数据库可用性。
  remediation: |
    - 删除或禁用默认/匿名账号，为 root 和应用账户设置唯一强口令。
    - 限制 MySQL 监听地址和来源 IP，定期审计账户权限并启用登录失败监控。
  classification:
    cwe-id: CWE-521
  metadata:
    verified: true
    max-request: 254
    shodan-query: "port:3306"
    vendor: oracle
    product: mysql
  tags: js,mysql,default-login,network,fuzz,enum,vuln

flow: tcp(1) && javascript(1)

tcp:
  - inputs:
      - data: "\n"

    host:
      - "{{Hostname}}"
    port: 3306

    matchers:
      - type: word
        part: body
        words:
          - "mysql"
        case-insensitive: true
        internal: true

javascript:
  - pre-condition: |
      isPortOpen(Host,Port);
    code: |
      var m = require("nuclei/mysql");
      var c = m.MySQLClient();
      c.Connect(Host,Port,User,Pass)

    args:
      Host: "{{Host}}"
      Port: "3306"
      User: "{{usernames}}"
      Pass: "{{passwords}}"

    payloads:
      usernames: helpers/wordlists/mysql-users.txt
      passwords: helpers/wordlists/mysql-passwords.txt
    attack: clusterbomb
    stop-at-first-match: true

    matchers:
      - type: dsl
        dsl:
          - "response == true"
          - "success == true"
        condition: and
