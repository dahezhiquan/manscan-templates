id: dify-panel

info:
  name: Dify 面板识别（指纹识别）
  author: s4e-io
  severity: info
  description: |-
    检测到目标站点存在 Dify 相关响应特征。Dify 是 AI、LLM 或机器学习相关平台，用于管理模型、数据集、工作区、推理服务或可观测性信息。模板请求 `/signin`、`/` 路径，并通过页面标题或正文关键字、状态码、DSL 条件确认该系统指纹，用于资产识别、系统盘点和暴露面梳理。
  reference:
    - https://github.com/langgenius/dify
  metadata:
    verified: true
    max-request: 2
    vendor: langgenius
    product: dify
    fofa-query: icon_hash="97378986"
  tags: panel,login,dify,detect,discovery
http:
  - method: GET
    path:
      - "{{BaseURL}}/signin"
      - "{{BaseURL}}"

    stop-at-first-match: true
    host-redirects: true
    max-redirects: 2
    matchers:
      - type: dsl
        dsl:
          - 'contains(body, "<title>Dify")'
          - "status_code == 200"
        condition: and
