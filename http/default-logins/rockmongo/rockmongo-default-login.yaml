id: rockmongo-default-login

info:
  name: Rockmongo 默认口令登录（弱口令）
  author: pikpikcu
  severity: high
  description: |
    该模板用于检测 Rockmongo 是否仍可使用默认凭据或弱口令登录。模板主要向 `/index.php?action=login.index` 等认证入口发送请求，使用内置默认凭据组合进行认证尝试，并根据响应中的 `Location: /index.php?action=admin.index&host=0`、`Set-Cookie: ROCK_LANG=` 等登录成功特征判断登录是否成功；命中说明目标未及时修改出厂、示例或初始化账号口令。
  impact: |
    - 攻击者可登录 Rockmongo 管理接口，读取、导出或篡改数据、索引、队列、仓库、报表或媒体资源。
    - 若系统保存连接串、访问令牌或集成凭据，弱口令登录可能进一步造成业务数据泄露、权限扩大或服务中断。
  remediation: |
    - 立即修改默认账号口令，删除测试账号，并为管理员、服务账号和集成账号使用唯一强密码。
    - 启用细粒度权限控制、访问来源限制和审计日志，避免管理 API 或控制台直接对公网开放。
    - 检查数据导出、配置变更、令牌使用和异常查询记录，必要时轮换相关凭据。
  reference:
    - https://serverfault.com/questions/331315/how-to-change-the-default-admin-username-and-admin-password-in-rockmongo
  classification:
    cvss-metrics: CVSS:3.0/AV:N/AC:L/PR:N/UI:N/S:C/C:L/I:L/A:L
    cvss-score: 8.3
    cwe-id: CWE-522
  metadata:
    max-request: 1
  tags: rockmongo,default-login,vuln

http:
  - raw:
      - |
        POST /index.php?action=login.index HTTP/1.1
        Host: {{Hostname}}
        Content-Type: application/x-www-form-urlencoded
        Referer: {{Hostname}}/index.php?action=login.index

        more=0&host=0&username={{username}}&password={{password}}&db=&lang=en_us&expire=3

    payloads:
      username:
        - admin
      password:
        - admin
    attack: pitchfork

    matchers-condition: and
    matchers:
      - type: word
        words:
          - "Location: /index.php?action=admin.index&host=0"
          - "Set-Cookie: ROCK_LANG="
        part: header

      - type: status
        status:
          - 302
