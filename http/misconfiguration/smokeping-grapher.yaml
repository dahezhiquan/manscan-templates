id: smokeping-grapher

info:
  name: SmokePing Latency Page Network Latency Grapher 检测
  author: DhiyaneshDk
  severity: low
  description: |
    检测到 SmokePing Latency Page Network Latency Grapher 检测。目标响应或文件中可能暴露配置、凭据、密钥、令牌、环境变量或历史记录等敏感信息，可能被用于进一步入侵。
  reference:
    - https://www.facebook.com/photo/?fbid=620494143454442&set=a.467014098802448
  classification:
    cpe: cpe:2.3:a:smokeping:smokeping:*:*:*:*:*:*:*:*
  metadata:
    verified: true
    max-request: 1
    vendor: smokeping
    product: smokeping
    shodan-query: title:"SmokePing Latency Page for Network Latency Grapher"
  tags: misconfig,smokeping,latency,grapher,vuln

http:
  - method: GET
    path:
      - "{{BaseURL}}/smokeping/"

    matchers-condition: and
    matchers:
      - type: word
        part: body
        words:
          - 'SmokePing Latency Page for'

      - type: status
        status:
          - 200
