id: alfresco-panel

info:
  name: Alfresco Content App 面板识别（暴露面识别）
  author: Splint3r7
  severity: info
  description: |
    该模板通过识别 Alfresco Content App 面板、控制台或管理界面的页面特征，判断目标是否暴露了对应服务入口。若命中，说明该后台或运维界面对外可访问，可用于资产识别与暴露面排查。
  classification:
    cwe-id: CWE-200
  metadata:
    max-request: 1
    shodan-query: http.title:"Alfresco Content App"
  tags: panel,alfresco,login,detect,discovery

http:
  - method: GET
    path:
      - "{{BaseURL}}"

    matchers:
      - type: dsl
        dsl:
          - 'contains(body, "<title>Alfresco Content App")'
          - 'status_code == 200'
        condition: and
