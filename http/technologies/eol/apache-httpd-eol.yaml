id: apache-httpd-eol

info:
  name: Apache HTTP 服务器 End-of-Life 指纹识别（指纹识别）
  author: Shivam Kamboj
  severity: info
  description: |
    用于识别目标是否部署 Apache HTTP 服务器 End-of-Life 并提取相关版本或构建信息，模板会结合 HTTP 响应头、特定路径或已知端点和版本或标识提取结果进行指纹匹配。
  reference:
    - https://httpd.apache.org/
    - https://endoflife.date/apache
  metadata:
    verified: true
    max-request: 1
    shodan-query: "Server: Apache/"
    product: http_server
    vendor: apache
  tags: tech,apache,eol

http:
  - method: GET
    path:
      - "{{BaseURL}}"

    matchers:
      - type: dsl
        dsl:
          - compare_versions(version, '<=2.2.34')
          - contains(server, 'Apache')
        condition: and

    extractors:
      - type: regex
        part: header
        name: version
        group: 1
        regex:
          - 'Server: Apache/([0-9.]+)'
