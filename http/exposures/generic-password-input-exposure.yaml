id: generic-password-input-exposure

info:
  name: Web 登录页密码输入框默认值泄露
  author: dahezhiquan
  severity: high
  description: |
    该模板用于检测 Web 登录页面是否在密码输入框的 `value` 属性中直接下发常见默认口令。密码值随 HTML 响应返回后，未登录访问者即可获得可尝试的认证凭据；模板仅在响应为 HTML、状态码为 200，且密码输入框包含常见默认口令时报告。
  impact: |
    - 未登录用户可从页面源码获取默认口令，并尝试进入对应系统或管理后台。
    - 若该口令仍有效，攻击者可能进一步查看敏感数据、修改业务配置或接管后台账号。
  remediation: |
    - 不要在服务端渲染的登录页面中输出密码输入框的 `value` 属性。
    - 立即修改已暴露的默认口令，并为账号设置唯一、足够复杂的密码。
    - 对登录入口启用最小权限、MFA、失败次数限制和登录审计。
  metadata:
    verified: true
    max-request: 1
  tags: exposure,password,generic,misconfig,login,vuln

http:
  - method: GET
    path:
      - "{{BaseURL}}"

    matchers-condition: and
    matchers:
      - type: regex
        part: body
        regex:
          - |-
            (?i)<input\b[^>]*\btype\s*=\s*["']password["'][^>]*\bvalue\s*=\s*["'](?:123456|12345678|123456789|password|admin|admin123|root|qwerty|p@ssw0rd)["']
          - |-
            (?i)<input\b[^>]*\bvalue\s*=\s*["'](?:123456|12345678|123456789|password|admin|admin123|root|qwerty|p@ssw0rd)["'][^>]*\btype\s*=\s*["']password["']
        condition: or

      - type: regex
        part: header
        regex:
          - |-
            (?i)content-type\s*:\s*[^;]*text/html

      - type: status
        status:
          - 200

    extractors:
      - type: regex
        part: body
        regex:
          - |-
            (?i)<input\b[^>]*\btype\s*=\s*["']password["'][^>]*\bvalue\s*=\s*["']([^"']+)["']
