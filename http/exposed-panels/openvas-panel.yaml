id: openvas-panel

info:
  name: OpenVas 登录面板识别（暴露面识别）
  author: rxerium
  severity: info
  description: |
    该模板通过识别 OpenVas 登录入口的页面标题、特征文本或重定向行为，判断目标是否暴露了对应的认证界面。若命中，说明该登录面板对外可访问，可用于暴露面梳理与后续安全评估。
  reference:
    - https://openvas.org/
  classification:
    cpe: cpe:2.3:a:openvas:openvas_manager:*:*:*:*:*:*:*:*
  metadata:
    verified: true
    max-request: 1
    vendor: openvas
    product: openvas_manager
    shodan-query: http.favicon.hash:1606029165
  tags: panel,openvas,admin,login,discovery

http:
  - method: GET
    path:
      - '{{BaseURL}}'

    host-redirects: true
    max-redirects: 2

    matchers-condition: and
    matchers:
      - type: word
        part: body
        words:
          - '<title>Greenbone Security Assistant'

      - type: status
        status:
          - 200
