id: outline-panel

info:
  name: Outline 面板识别（指纹识别）
  author: ChrisJr404
  severity: info
  description: |
    该模板通过识别 Outline 登录入口的页面标题、特征文本或重定向行为，判断目标是否暴露了对应的认证界面。若命中，说明该登录面板对外可访问，可用于暴露面梳理与后续安全评估。
  reference:
    - https://github.com/outline/outline
    - https://www.getoutline.com/
  metadata:
    verified: true
    max-request: 1
    vendor: outline
    product: outline
    shodan-query: http.title:"Outline"
    fofa-query: title="Outline"
  tags: panel,outline,wiki,knowledge-base,detect,discovery

http:
  - method: GET
    path:
      - "{{BaseURL}}"

    host-redirects: true
    max-redirects: 2

    matchers:
      - type: dsl
        dsl:
          - 'status_code == 200'
          - 'contains(to_lower(body), "<title>outline</title>") || contains(body, "data-outline-team")'
          - 'contains(body, "outline")'
        condition: and

    extractors:
      - type: regex
        part: body
        group: 1
        regex:
          - '<meta name="outline-version" content="([^"]+)"'
