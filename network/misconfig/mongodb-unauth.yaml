id: mongodb-unauth

info:
  name: MongoDB 未认证访问（服务漏洞）
  author: pdteam
  severity: high
  description: |
    该模板检测 MongoDB 是否在未启用认证的情况下对外开放。命中说明数据库内容可能在无口令保护下被直接访问。
  remediation: |
    - 为 MongoDB 启用认证并限制管理网络访问。
    - 检查历史暴露期间是否已有未授权读取、写入或删除行为。
  reference:
    - https://github.com/orleven/Tentacle
    - https://book.hacktricks.wiki/en/network-services-pentesting/27017-27018-mongodb.html
    - https://www.mongodb.com/features/mongodb-authentication
  metadata:
    max-request: 1
  tags: network,mongodb,unauth,misconfig,tcp,vuln

tcp:
  - inputs:
      - data: 450000000100000000000000dd070000000000000030000000026765744c6f670010000000737461727475705761726e696e67730002246462000600000061646d696e0000
        type: hex

    host:
      - "{{Hostname}}"
    port: 27017

    read-size: 2048
    matchers:
      - type: word
        words:
          - "totalLinesWritten"
