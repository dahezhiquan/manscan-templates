id: scan2net-panel

info:
  name: Scan2Net 面板（暴露面识别）
  author: matejsmycka
  severity: info
  description: |
    该模板通过识别 Scan2Net 登录入口的页面标题、特征文本或重定向行为，判断目标是否暴露了对应的认证界面。若命中，说明该登录面板对外可访问，可用于暴露面梳理与后续安全评估。
  metadata:
    verified: true
    max-request: 1
    shodan-query:
      - http.favicon.hash:1780061475
      - http.title:"Scan2Net"
  tags: panel,scan2net,login,discovery

http:
  - method: GET
    path:
      - "{{BaseURL}}"

    host-redirects: true
    max-redirects: 2

    matchers-condition: and
    matchers:
      - type: word
        part: body
        words:
          - "/cgi/index.cgi"
          - "/scanner_ico.gif"
          - "Enhanced Scanning"
        condition: and

      - type: status
        status:
          - 200
