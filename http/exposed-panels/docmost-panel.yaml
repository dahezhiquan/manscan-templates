id: docmost-panel

info:
  name: Docmost 面板 - 检测（暴露面识别）
  author: ChrisJr404
  severity: info
  description: |-
    检测到 Docmost（docmost.com / github.com/docmost/docmost），这是一个开源、自托管的 Wiki 和文档协作平台。默认 Docker 端口为 3000。暴露的实例可能会泄露内部空间、页面以及工作区成员信息。
  reference:
    - https://github.com/docmost/docmost
    - https://docmost.com/
  metadata:
    verified: false
    max-request: 1
    vendor: docmost
    product: docmost
    shodan-query: http.title:"Docmost"
    fofa-query: title="Docmost"
  tags: panel,docmost,wiki,selfhosted,detect,discovery

http:
  - method: GET
    path:
      - "{{BaseURL}}"

    host-redirects: true
    max-redirects: 2

    matchers:
      - type: dsl
        dsl:
          - "status_code == 200"
          - "contains_all(to_lower(body), \"<title>docmost</title>\", \"apple-mobile-web-app-title\")"
        condition: and
