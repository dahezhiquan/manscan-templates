id: empirec2-default-login

info:
  name: Empire C2 / Starkiller Interface 默认口令登录（弱口令）
  author: clem9669,parzival
  severity: high
  description: |
    该模板通过尝试 Empire C2 / Starkiller Interface 的默认账号口令，并依据认证成功后的响应特征判断目标是否仍在使用未修改的弱口令。若命中，攻击者可直接登录系统，进一步访问敏感信息、修改配置或执行未授权操作。
  reference:
    - https://github.com/BC-SECURITY/Empire
    - https://github.com/BC-SECURITY/empire-docs/blob/main/restful-api/README.md
  metadata:
    verified: true
    max-request: 2
  tags: default-login,empire,c2,intrusive,vuln

http:
  - raw:
      - |
        POST /token HTTP/1.1
        Host: {{Hostname}}
        Content-Type: multipart/form-data; boundary=----WebKitFormBoundaryoZwyedGcQU4FrcFV
        Accept: application/json, text/plain, */*

        ------WebKitFormBoundaryoZwyedGcQU4FrcFV
        Content-Disposition: form-data; name="username"

        {{username}}
        ------WebKitFormBoundaryoZwyedGcQU4FrcFV
        Content-Disposition: form-data; name="password"

        {{password}}
        ------WebKitFormBoundaryoZwyedGcQU4FrcFV--
      - |
        POST /api/admin/login HTTP/1.1
        Host: {{Hostname}}
        Content-Type: application/json

        {"username":"{{username}}","password":"{{password}}"}

    attack: pitchfork
    payloads:
      username:
        - empireadmin
      password:
        - password123
    stop-at-first-match: true

    matchers-condition: and
    matchers:
      - type: word
        part: body
        words:
          - 'access_token'
          - '{"token":".*"}'
        condition: or

      - type: word
        part: body
        words:
          - '"code":1001'
        negative: true

      - type: word
        part: content_type
        words:
          - application/json

      - type: status
        status:
          - 200
