id: telnet-detect

info:
  name: Telnet 识别（指纹识别）
  author: pussycat0x
  severity: info
  description: |
    该模板通过网络响应特征识别目标是否开放 Telnet 相关服务。
  metadata:
    verified: true
    max-request: 1
    shodan-query: port:23 telnet
  tags: network,telnet,detect,detection,tcp,discovery
tcp:
  - inputs:
      - data: "\n"

    host:
      - "{{Hostname}}"
    port: 23

    matchers:
      - type: word
        words:
          - "Telnet"
          - "Login authentication"
        condition: and
