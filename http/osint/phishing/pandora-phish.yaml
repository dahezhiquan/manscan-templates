id: pandora-phish

info:
  name: Pandora 仿冒钓鱼网站（钓鱼网站识别）
  author: rxerium
  severity: info
  description: |
    检测到疑似仿冒 Pandora 的钓鱼网站。模板在目标页面返回 200、页面内容命中 Pandora 的品牌页面特征，且当前主机不属于 pandora.com 官方域名时触发，用于识别借用 Pandora 品牌页面诱导用户信任的仿冒站点。
  reference:
    - https://pandora.com
  metadata:
    max-request: 1
  tags: phishing,pandora,streaming,osint,discovery
http:
  - method: GET
    path:
      - "{{BaseURL}}"

    host-redirects: true
    max-redirects: 2

    matchers-condition: and
    matchers:
      - type: word
        words:
          - "Play the songs, albums, playlists and podcasts you love on the all-new Pandora. Sign up for a subscription plan to stream ad-free and on-demand. Listen on your mobile phone, desktop, TV, smart speakers or in the car."

      - type: status
        status:
          - 200

      - type: dsl
        dsl:
          - '!contains(host,"pandora.com")'
