id: sap-netweaver-backdoor

info:
  name: SAP NetWeaver - 后门检测
  author: DhiyaneshDk
  severity: critical
  description: |
    该模板用于检测 SAP NetWeaver - 后门检测。命中通常表示目标存在后门、植入组件、恶意脚本或可疑未授权入口。模板主要向 `/irj/helper.jsp?cmd=ls`、`/irj/cache.jsp?cmd=ls` 等路径发送探测请求，并根据响应中的 `Command: ls<BR>`、`sap` 等特征确认漏洞是否存在。
  impact: |
    - 命中通常表示目标存在后门、植入组件或可疑恶意脚本，攻击者可能已具备未授权访问能力。
    - 后门可能被用于执行命令、窃取数据、维持持久化访问或作为进一步入侵的跳板。
  remediation: |
    - 立即隔离受影响资产，保留证据并开展入侵排查，不要仅删除单个可疑文件后恢复上线。
    - 清理后门文件、恶意脚本、异常账号、计划任务和持久化项，并从可信介质重建受影响组件。
    - 升级相关产品，轮换系统、数据库、应用和第三方集成凭据。
  reference:
    - https://www.bleepingcomputer.com/news/security/sap-fixes-suspected-netweaver-zero-day-exploited-in-attacks/
  metadata:
    max-request: 1
    shodan-query: html:"SAP NetWeaver Application Server Java"
    verified: true
  tags: sap,netweaver,backdoor,vuln

http:
  - method: GET
    path:
      - "{{BaseURL}}/irj/helper.jsp?cmd=ls"
      - "{{BaseURL}}/irj/cache.jsp?cmd=ls"

    matchers-condition: and
    matchers:
      - type: word
        words:
          - "Command: ls<BR>"
          - "sap"
        part: body
        condition: and

      - type: status
        status:
          - 200
