id: amcrest-login

info:
  name: Amcrest Login 面板识别（暴露面识别）
  author: DhiyaneshDK
  severity: info
  description: 该模板通过识别 Amcrest Login 登录入口的页面标题、特征文本或重定向行为，判断目标是否暴露了对应的认证界面。若命中，说明该登录面板对外可访问，可用于暴露面梳理与后续安全评估。
  reference:
    - https://www.exploit-db.com/ghdb/7273
  classification:
    cwe-id: CWE-200
    cpe: cpe:2.3:h:amcrest:ip2m-853ew:*:*:*:*:*:*:*:*
  metadata:
    max-request: 1
    vendor: amcrest
    product: ip2m-853ew
    shodan-query:
      - html:"amcrest"
      - http.html:"amcrest" "ldap user"
      - http.html:"amcrest"
    google-query:
      - intext:"amcrest" "LDAP User"
      - intext:"amcrest" "ldap user"
    fofa-query:
      - body="amcrest" "ldap user"
      - body="amcrest"
  tags: panel,camera,amcrest,edb,discovery

http:
  - method: GET
    path:
      - '{{BaseURL}}'

    matchers-condition: and
    matchers:
      - type: word
        words:
          - "Amcrest Technologies"
          - "LDAPUser"
        condition: and

      - type: status
        status:
          - 200
