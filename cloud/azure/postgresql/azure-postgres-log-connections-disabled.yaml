id: azure-postgres-log-connections-disabled
info:
  name: Azure PostgreSQL 连接日志未启用（云安全）
  author: princechaddha
  severity: medium
  description: Azure PostgreSQL 的 log_connections 参数用于记录客户端连接和认证相关事件，关闭后无法持续获得连接来源和连接时间等审计信息。本模板枚举 PostgreSQL 服务器并查询 log_connections，在返回值为 off 时报告。
  impact: |
    - 异常来源、异常时段或异常连接行为可能无法及时关联，增加凭据滥用和未授权访问的发现难度。
    - 发生数据泄露或账号入侵后，缺少连接审计记录会削弱取证、溯源和责任认定能力。
  remediation: |
    - 将 log_connections 设置为 on，并将 PostgreSQL 日志发送到具备访问控制和完整性保护的集中式平台。
    - 配置日志保留期、异常连接告警和敏感字段保护，避免审计日志被未授权读取或长期缺失。
  reference:
    - https://docs.microsoft.com/en-us/azure/postgresql/concepts-server-logs
  metadata:
    vendor: microsoft
    product: azure-postgresql
  tags: cloud,devops,azure,microsoft,postgresql,azure-cloud-config

flow: |
  code(1);
  for (let ServerData of iterate(template.serverList)) {
    ServerData = JSON.parse(ServerData);
    set("name", ServerData.name);
    set("resourceGroup", ServerData.resourceGroup);
    code(2);
  }

self-contained: true
code:
  - engine:
      - sh
      - bash
    source: |
      az postgres server list --output json --query '[*].{"name":name,"resourceGroup":resourceGroup}'

    extractors:
      - type: json
        name: serverList
        internal: true
        json:
          - '.[]'

  - engine:
      - sh
      - bash
    source: |
      az postgres server configuration show --server-name "$name" --resource-group "$resourceGroup" --name log_connections --query 'value'

    matchers:
      - type: word
        words:
          - 'off'

    extractors:
      - type: dsl
        dsl:
          - 'name + " in " + resourceGroup + " does not have log_connections enabled"'
