id: zk-zkoss-framework-detect

info:
  name: ZK Framework 指纹识别（指纹识别）
  author: ErikOwen,Cursor
  severity: info
  description: >-
    ZK 是 Java Web UI 框架，用于以组件化方式构建企业级浏览器应用界面。该模板通过请求目标服务并检查预设路径或首页响应、页面正文关键字、正则特征等指纹特征，判断目标是否使用或暴露了
    ZK Framework 相关组件；命中结果仅表示指纹特征匹配，可用于资产盘点、技术栈识别和后续安全评估，不代表已确认存在可利用漏洞。
  reference:
  - https://www.zkoss.org/
  classification:
    cpe: cpe:2.3:a:zkoss:zk_framework:*:*:*:*:*:*:*:*
  metadata:
    verified: true
    vendor: zkoss
    product: zk_framework
    shodan-query: http.html:"zk.wpd" OR http.html:"<!-- ZK "
    fofa-query: body="zk.wpd" || body="<!-- ZK "
  tags: zk,zkoss,framework,detect,tech,discovery
http:
  - method: GET
    path:
      - "{{BaseURL}}"

    redirects: true
    max-redirects: 4
    matchers-condition: or
    matchers:
      - type: word
        part: body
        words:
          - "ZK Framework"
          - "zk.wpd"
          - "zkau/web"
          - "zkau/zkau"
          - "zkau/web/js/zk/zk.wpd"
          - "<!-- ZK "
        condition: or

      - type: regex
        part: body
        regex:
          - 'ZK Framework v?([0-9.]+)'
          - '<!-- ZK v?([0-9.]+) [\d\s\w]+ -->'
          - 'zkau/web/js/zk/zk\.wpd\?v=([0-9.]+)'
          - 'zkau/web/js/zk/zk\.js\?v=([0-9.]+)'

    extractors:
      - type: regex
        part: body
        name: version
        group: 1
        regex:
          - 'ZK Framework v?([0-9.]+)'
          - '<!-- ZK v?([0-9.]+) [\d\s\w]+ -->'
          - 'zkau/web/js/zk/zk\.wpd\?v=([0-9.]+)'
          - 'zkau/web/js/zk/zk\.js\?v=([0-9.]+)'
