id: azure-instrumentation-key-exposure

info:
  name: Azure Instrumentation 密钥暴露（暴露面识别）
  author: pussycat0x
  severity: medium
  description: |
    检测到目标站点响应中暴露 Azure Instrumentation 密钥。Microsoft Azure 相关密钥、连接串和 instrumentation key 关联云资源、APIM、存储或应用监控数据。该模板请求 `/appsettings.json`，并在目标响应正文中通过正则表达式匹配对应格式的密钥、令牌、连接串或客户端凭据。公开后可能导致对应平台资源、数据、流水线、消息发送或第三方集成被未授权访问。
  impact: |-
    - 泄露的 API Key、访问令牌、客户端密钥、连接串或服务账号凭据可能被用于直接调用对应平台 API 或访问受保护资源。
    - 攻击者可能借助有效凭据读取、修改或删除数据，触发构建/部署任务，发送消息，管理云资源，或冒用集成应用身份。
    - 即使令牌权限有限，也会暴露账号、项目、组织或环境边界，辅助横向移动、供应链攻击和定向社工。
  remediation: |-
    - 立即撤销并轮换暴露的 API Key、访问令牌、客户端密钥、连接串、Webhook Secret 或服务账号凭据。
    - 在对应平台检查令牌权限、作用域、有效期和最近调用记录，移除不必要的高权限或长期凭据。
    - 将密钥迁移到密钥管理系统、受保护的 CI/CD 变量或运行时注入机制，避免写入前端页面、日志、源码和公开配置。
    - 启用最小权限、IP/来源限制、MFA、告警和审计日志，并排查是否存在未授权资源访问或数据变更。
  reference:
    - https://learn.microsoft.com/en-us/azure/azure-monitor/app/connection-strings
    - http://www.medic-consulting.com/2016/07/10/Share-Asp-Net-Core-appsettings-json-with-Service-Fabric-Microservices/
  metadata:
    max-request: 2
    verified: true
  tags: exposure,azure,instrumentation,appinsights,token

http:
  - method: GET
    path:
      - "{{BaseURL}}"
      - "{{BaseURL}}/appsettings.json"

    stop-at-first-match: true
    matchers-condition: and
    matchers:
      - type: word
        part: body
        words:
          - 'InstrumentationKey'
          - 'instrumentationKey'
          - 'APPINSIGHTS_INSTRUMENTATIONKEY'
          - '<InstrumentationKey>'
        condition: or

      - type: regex
        part: body
        regex:
          - 'instrumentationKey:"([0-9a-z-]+)"'
          - '<InstrumentationKey>(.*)</InstrumentationKey>'
          - 'APPINSIGHTS_INSTRUMENTATIONKEY=([a-z0-9-]+)'
          - 'InstrumentationKey": "([0-9a-z-]+)"'
        condition: or

      - type: status
        status:
          - 200

    extractors:
      - type: regex
        part: body
        group: 1
        regex:
          - 'instrumentationKey:"([0-9a-z-]+)"'
          - '<InstrumentationKey>(.*)</InstrumentationKey>'
          - 'APPINSIGHTS_INSTRUMENTATIONKEY=([a-z0-9-]+)'
          - 'InstrumentationKey": "([0-9a-z-]+)"'
