id: rseenet-detect

info:
  name: Advantech R-SeeNet 指纹识别（指纹识别）
  author: pdteam
  severity: info
  description: >-
    Advantech R-SeeNet 是工业路由器和网络设备监控平台，用于查看设备状态、告警和连接信息。该模板通过请求目标服务并检查预设路径或首页响应、正则特征等指纹特征，判断目标是否使用或暴露了
    Advantech R-SeeNet 相关组件；命中结果仅表示指纹特征匹配，可用于资产盘点、技术栈识别和后续安全评估，不代表已确认存在可利用漏洞。
  reference:
  - https://icr.advantech.cz/products/software/r-seenet
  classification:
    cpe: cpe:2.3:a:advantech:r-seenet:*:*:*:*:*:*:*:*
  metadata:
    max-request: 1
    shodan-query: http.title:"R-SeeNet"
    product: r-seenet
    vendor: advantech
  tags: tech,rseenet,discovery
http:
  - method: GET
    path:
      - "{{BaseURL}}"

    matchers:
      - type: regex
        part: body
        regex:
          - '<title>R-SeeNet (.*)</title>'

    extractors:
      - type: regex
        group: 1
        regex:
          - '<title>R-SeeNet (.*)</title>'
