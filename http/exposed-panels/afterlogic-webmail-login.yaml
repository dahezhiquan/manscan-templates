id: afterlogic-webmail-login

info:
  name: AfterLogic WebMail 登录面板识别（指纹识别）
  author: johnk3r
  severity: info
  description: |-
    检测到目标站点存在 AfterLogic WebMail 相关响应特征。AfterLogic WebMail 是 Web 邮件系统，用于通过浏览器收发邮件、管理联系人和访问邮箱服务。模板请求 `/`，并通过页面标题或正文关键字、状态码确认该系统指纹，用于资产识别、系统盘点和暴露面梳理。
  classification:
    cvss-metrics: CVSS:3.0/AV:N/AC:L/PR:N/UI:N/S:U/C:N/I:N/A:N
    cwe-id: CWE-200
    cpe: cpe:2.3:a:afterlogic:aurora:*:*:*:*:*:*:*:*
  metadata:
    fofa-query: 'X-Server: AfterlogicDAVServer'
    max-request: 1
    product: aurora
    vendor: afterlogic
  tags: panel,afterlogic,login,detect,discovery
http:
  - method: GET
    path:
      - '{{BaseURL}}'

    matchers-condition: and
    matchers:
      - type: word
        part: body
        words:
          - "afterlogic"
          - "dav_url"
        condition: and
        case-insensitive: true

      - type: status
        status:
          - 200
