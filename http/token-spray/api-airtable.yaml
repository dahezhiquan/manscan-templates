id: api-airtable

info:
  name: Airtable API Token 可用性校验（token喷洒）
  author: daffainfo
  severity: info
  description: 该模板通过调用 Airtable API 验证提供的 token 是否有效，命中后通常表示可访问 Airtable 数据表与集成能力。
  reference:
    - https://airtable.com/api
    - https://github.com/daffainfo/all-about-apikey/tree/main/airtable
  metadata:
    max-request: 1
  tags: token-spray,airtable

self-contained: true

http:
  - raw:
      - |
        GET https://api.airtable.com/v0/meta/bases HTTP/1.1
        Host: api.airtable.com
        Authorization: Bearer {{token}}

    matchers:
      - type: word
        part: body
        words:
          - '"bases"'
          - '"id"'
          - '"name"'
        condition: and
