id: ics-red-lion-enip-detect

info:
  name: Red Lion ENIP 识别（指纹识别）
  author: biero-el-corridor
  severity: info
  description: |
    Red Lion ENIP 是工业控制或自动化设备服务，常用于现场控制、设备通信和生产系统管理。该模板连接 502/TCP，通过匹配 `526564204c696f6e20436f6e74726f6c73` 等二进制响应特征识别目标服务。
  metadata:
    max-request: 2
  tags: ics,redlion,detect,network,tcp

tcp:
  - inputs:
      - data: "0004012b1b00"
        type: hex
        read: 200
        name: info
      - data: "0004012a1a00"
        type: hex
        read: 200
        name: note

    host:
      - "{{Hostname}}"
    port: 502
    read-size: 1024

    matchers:
      - type: binary
        part: info
        binary:
          - "526564204c696f6e20436f6e74726f6c73" # Red Lion Controls
