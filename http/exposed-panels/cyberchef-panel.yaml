id: cyberchef-panel

info:
  name: Cyber Chef 面板识别（指纹识别）
  author: rxerium
  severity: info
  description: |-
    检测到目标站点存在 Cyber Chef 相关响应特征。Cyber Chef 是监控、日志、分析或可观测性系统，用于展示运行指标、告警事件、日志数据和服务状态。模板请求 `/`，并通过页面标题或正文关键字、状态码确认该系统指纹，用于资产识别、系统盘点和暴露面梳理。
  reference:
    - https://cyberchef.org
  classification:
    cpe: cpe:2.3:a:gchq:cyberchef:*:*:*:*:*:*:*:*
  metadata:
    verified: true
    max-request: 1
    vendor: gchq
    product: cyberchef
    shodan-query: title:"CyberChef"
  tags: panel,cyberchef,login,detect,discovery
http:
  - method: GET
    path:
      - "{{BaseURL}}"

    host-redirects: true
    max-redirects: 2

    matchers-condition: and
    matchers:
      - type: word
        part: body
        words:
          - '<title>CyberChef</title>'
          - 'The Cyber Swiss Army Knife'
        condition: and

      - type: status
        status:
          - 200
