id: woodpecker-detect

info:
  name: Woodpecker 指纹识别（指纹识别）
  author: righettod
  severity: info
  description: |
    用于识别目标是否部署 Woodpecker 并提取相关版本或构建信息，模板会结合页面标题、页面正文、特定路径或已知端点和版本或标识提取结果进行指纹匹配。
  reference:
    - https://github.com/woodpecker-ci/woodpecker
    - https://woodpecker-ci.org/
  metadata:
    verified: true
    shodan-query: http.title:"woodpecker"
    max-request: 1
  tags: tech,woodpecker,detect,discovery

http:
  - method: GET
    path:
      - "{{BaseURL}}/web-config.js"

    matchers:
      - type: dsl
        dsl:
          - 'status_code == 200'
          - 'contains(to_lower(body), "window.woodpecker_")'
        condition: and

    extractors:
      - type: regex
        part: body
        group: 1
        regex:
          - '(?i)window.WOODPECKER_VERSION\s*=\s*"([0-9.]+)"'
