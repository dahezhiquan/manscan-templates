id: cookies-without-httponly

info:
  name: Cookies without HttpOnly attribute 检测
  author: RJ Coleman,Mr.Bobo HP
  severity: info
  description: |
    检测到 Cookies without HttpOnly attribute 检测。目标响应或文件中可能暴露配置、凭据、密钥、令牌、环境变量或历史记录等敏感信息，可能被用于进一步入侵。
  impact: |
    - 凭据、密钥、配置或环境变量泄露后，攻击者可能访问内部系统或第三方服务。
    - 泄露信息可被用于横向移动、权限提升或供应链攻击。
  remediation: |
    - 立即移除公开文件中的敏感信息并轮换已暴露的凭据、密钥和令牌。
    - 使用安全的密钥管理方案，并阻止配置、日志和历史文件被 Web 直接访问。
  reference:
    - https://owasp.org/www-community/HttpOnly
  classification:
    cvss-metrics: CVSS:3.0/AV:N/AC:L/PR:N/UI:N/S:U/C:N/I:N/A:N
    cvss-score: 0
    cwe-id: CWE-1004
  metadata:
    verified: true
    max-request: 1
  tags: misconfig,http,cookie,generic,vuln

flow: |
    http()
    javascript()

http:
  - method: GET
    path:
      - "{{BaseURL}}"
    host-redirects: true
    max-redirects: 2

javascript:
  - code: |
      content = template.http_all_headers
      const setCookieLines = content
        .split(/\r\n/)
        .filter(line => line.trim().toLowerCase().startsWith('set-cookie:'));

      const nonHttpOnlyCookies = setCookieLines.filter(line => !line.toLowerCase().includes('httponly'));

      const cookieNames = nonHttpOnlyCookies.map(line => {
        const match = line.match(/set-cookie:\s*([^=]+)=/i);
        return match ? match[1] : null;
      }).filter(Boolean);
      cookieNames

    extractors:
      - type: regex
        regex:
          - '[a-zA-Z0-9_-]+'
