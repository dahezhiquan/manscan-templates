id: networkcamera-ftp-detect
info:
  name: Network Camera FTP 服务 识别（指纹识别）
  author: pussycat0x
  severity: info
  description: |
    该模板通过 FTP Banner、响应特征或协商行为识别目标是否运行 Network Camera 相关 FTP 服务实现。
  metadata:
    verified: true
    shodan-query: "Welcome to Network Camera FTP Server"
    max-request: 1
  tags: network,ftp,networkcamera,detect,tcp,discovery

tcp:
  - inputs:
      - data: 00000000
        type: hex

    host:
      - "{{Hostname}}"
    port: 21
    read-size: 1024

    matchers:
      - type: word
        words:
          - "Welcome to Network Camera FTP Server"
