id: wp-yoast-seo-fpd

info:
  name: WordPress Yoast SEO 插件完整路径泄露
  author: ritikchaddha
  severity: low
  description: |-
    该模板用于核查 WordPress Yoast SEO 插件是否存在完整路径泄露。目标在直接访问插件或主题 PHP 文件时返回 Fatal error、Warning、Uncaught Error 或包含 wp-content 路径的错误页面，说明服务器错误显示或文件访问控制配置不当。模板访问 /wp-content/plugins/wordpress-seo/src/main.php、/wp-content/plugins/wordpress-seo/admin/class-admin.php，并根据错误关键字、组件目录名和状态码确认泄露。
  reference:
    - https://wordpress.org/plugins/wordpress-seo/
  metadata:
    verified: true
    max-request: 3
    vendor: yoast
    product: wordpress-seo
    framework: wordpress
    fofa-query: body="/wp-content/plugins/wordpress-seo/"
  tags: wordpress,wp-plugin,fpd,yoast,seo,exposure
  impact: |-
    - 攻击者可获取站点物理路径、插件/主题目录结构和组件安装信息。
    - 路径信息可辅助后续文件包含、上传、调试信息利用或针对特定 WordPress 组件的攻击。
  remediation: |-
    - 关闭生产环境 PHP 错误显示，将错误记录到受保护的服务器日志。
    - 阻止外部直接访问不应单独执行的插件、主题内部 PHP 文件。
    - 及时更新 WordPress、插件和主题，并清理不再使用的组件。
http:
  - method: GET
    path:
      - "{{BaseURL}}/wp-content/plugins/wordpress-seo/src/main.php"
      - "{{BaseURL}}/wp-content/plugins/wordpress-seo/admin/class-admin.php"
      - "{{BaseURL}}/wp-content/plugins/wordpress-seo/inc/class-wpseo-utils.php"

    stop-at-first-match: true

    matchers-condition: and
    matchers:
      - type: word
        part: body
        words:
          - "Fatal error"
          - "/plugins/wordpress-seo"
          - "Uncaught TypeError:"
        condition: and

      - type: status
        status:
          - 200
