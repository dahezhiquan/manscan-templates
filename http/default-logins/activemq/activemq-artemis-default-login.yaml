id: activemq-artemis-default-login

info:
  name: Apache ActiveMQ Artemis Console 默认口令登录（弱口令）
  author: pdteam
  severity: high
  description: |
    该模板通过尝试 Apache ActiveMQ Artemis Console 的默认账号口令，并依据认证成功后的响应特征判断目标是否仍在使用未修改的弱口令。若命中，攻击者可直接登录系统，进一步访问敏感信息、修改配置或执行未授权操作。
  reference:
    - https://activemq.apache.org/components/artemis/documentation/latest/management-console.html
  metadata:
    max-request: 2
    vendor: apache
    product: activemq
    shodan-query: title:"ActiveMQ Artemis Console"
  tags: apache,activemq,artemis,default-login,vuln

http:
  - method: POST
    path:
      - '{{BaseURL}}/console/auth/login'
    headers:
      Content-Type: application/json
      X-Requested-With: XMLHttpRequest
    body: |-
      {"username":"{{username}}","password":"{{password}}"}

    stop-at-first-match: true
    payloads:
      username:
        - artemis
      password:
        - artemis
    attack: pitchfork

    matchers-condition: and
    matchers:
      - type: dsl
        dsl:
          - 'contains(content_type, "application/json")'

      - type: word
        part: body
        words:
          - '{"credentials"'
          - '"principals":['
          - 'org.apache.activemq'
        condition: and

      - type: status
        status:
          - 200

    extractors:
      - type: regex
        name: credential
        part: body
        group: 0
        regex:
          - '{"credentials":.*}'
