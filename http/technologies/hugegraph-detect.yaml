id: hugegraph-detect

info:
  name: HugeGraph 指纹识别（指纹识别）
  author: rxerium
  severity: info
  description: >-
    HugeGraph 是开源图数据库系统，用于存储、查询和分析大规模图结构数据。该模板通过请求目标服务并检查预设路径或首页响应、页面正文关键字、状态码等指纹特征，判断目标是否使用或暴露了
    HugeGraph 相关组件；命中结果仅表示指纹特征匹配，可用于资产盘点、技术栈识别和后续安全评估，不代表已确认存在可利用漏洞。
  reference:
  - https://hugegraph.apache.org/
  metadata:
    max-request: 1
    verified: true
    shodan-query: html:"https://hugegraph.github.io"
  tags: hugegraph,tech,detect,discovery
http:
  - method: GET
    path:
      - "{{BaseURL}}"

    matchers-condition: and
    matchers:
      - type: word
        part: body
        words:
          - '"service":"hugegraph"'

      - type: status
        status:
          - 200
