id: api-ipfind

info:
  name: IPFind API Token 可用性校验（token喷洒）
  author: daffainfo
  severity: info
  description: 该模板通过调用 IPFind API 的已知接口验证提供的 token 是否有效，命中后通常表示可访问IP、网络或归属信息查询能力。
  reference:
    - https://ipfind.io/documentation
    - https://github.com/daffainfo/all-about-apikey/tree/main/ipfind
  metadata:
    max-request: 1
  tags: token-spray,ipfind

self-contained: true

http:
  - method: GET
    path:
      - "https://app.ipfind.io/api/iplocation?apikey={{token}}"

    matchers:
      - type: word
        part: body
        words:
          - '"continent"'
          - '"country"'
          - '"zipCode"'
        condition: and
