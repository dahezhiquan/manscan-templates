id: usergate-ngfw-admin-panel

info:
  name: UserGate NGFW/UTM Admin 面板识别（指纹识别）
  author: darses
  severity: info
  description: |
    该模板通过识别 UserGate NGFW/UTM Admin 面板、控制台或管理界面的页面特征，判断目标是否暴露了对应服务入口。若命中，说明该后台或运维界面对外可访问，可用于资产识别与暴露面排查。
  metadata:
    max-request: 2
    shodan-query: "Server: UserGate-UTM/42"
    fofa-query: icon_hash="-782553370"
  tags: detect,panel,usergate,ngfw,utm,discovery

http:
  - method: GET
    path:
      - "{{BaseURL}}"
      - "{{BaseURL}}/static/console-utm-webui/js/preinit.js"

    stop-at-first-match: true
    matchers:
      - type: dsl
        dsl:
          - status_code == 200
          - contains(body, "Entensys.console")
        condition: and
