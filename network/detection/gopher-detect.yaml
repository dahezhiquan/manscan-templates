id: gopher-detect

info:
  name: Gopher 服务识别（指纹识别）
  author: pry0cc
  severity: info
  description: |
    Gopher 是早期互联网文档检索协议，用于以菜单形式发布和浏览文本资源。该模板连接 70/TCP 并读取握手、Banner 或协商响应中的产品标识，用于识别目标服务。
  classification:
    cvss-metrics: CVSS:3.1/AV:N/AC:L/PR:N/UI:N/S:U/C:N/I:N/A:N
    cwe-id: CWE-200
  metadata:
    max-request: 1
  tags: network,gopher,detect,tcp,discovery

tcp:
  - inputs:
      - data: "\r\n"
    host:
      - "{{Hostname}}"
    port: 70

    matchers:
      - type: dsl
        dsl:
          - "contains(to_lower(raw), 'gopher')"
