id: ec2-unrestricted-netbios
info:
  name: EC2 安全组对公网开放 NetBIOS 端口（云安全）
  author: princechaddha
  severity: critical
  description: EC2 安全组对公网开放 NetBIOS 端口是一类 Windows 文件共享与名称服务暴露风险，137、138、139 端口面向互联网会泄露主机和网络信息。NetBIOS 通常只应在受信任内网中使用，公网开放会增加枚举、爆破和横向移动风险。模板通过 `describe-security-groups` 筛选 137、138、139 端口且来源为 `0.0.0.0/0` 的入站规则，并输出命中的安全组 ID。
  impact: |
    - 攻击者可通过 NetBIOS 枚举主机名、共享和域信息，辅助后续攻击。
    - 若相关 Windows 服务存在弱认证或漏洞，可能导致文件共享访问或主机入侵。
  remediation: |
    - 移除面向公网的 137、138、139 端口入站规则。
    - 仅允许受信任内网或 VPN 访问 Windows 文件共享和名称解析服务。
  reference:
    - https://docs.aws.amazon.com/AWSEC2/latest/UserGuide/ec2-security-groups.html
  metadata:
    vendor: amazon
    product: ec2
  tags: cloud,devops,aws,amazon,ec2,aws-cloud-config

variables:
  region: "us-east-1"

self-contained: true
code:
  - engine:
      - sh
      - bash
    source: |
      aws ec2 describe-security-groups --region $region --filters Name=ip-permission.from-port,Values=137,138,139 Name=ip-permission.to-port,Values=137,138,139 Name=ip-permission.cidr,Values='0.0.0.0/0' --output json --query 'SecurityGroups[*].GroupId'

    extractors:
      - type: json
        name: securitygroup
        internal: true
        json:
          - '.[]'

      - type: dsl
        dsl:
          - 'securitygroup + " security group(s) alows unrestricted access (0.0.0.0/0 or ::/0) on ports 137, 138 or 139"'
