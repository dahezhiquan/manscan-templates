id: struts-ognl-console

info:
  name: Apache Struts OGNL 控制台
  author: DhiyaneshDK
  severity: unknown
  description: |
    检测到 Apache Struts OGNL 控制台。目标响应或文件中可能暴露配置、凭据、密钥、令牌、环境变量或历史记录等敏感信息，可能被用于进一步入侵。
  remediation: |
    - 立即移除公开文件中的敏感信息并轮换已暴露的凭据、密钥和令牌。
    - 使用安全的密钥管理方案，并阻止配置、日志和历史文件被 Web 直接访问。
  reference:
    - https://github.com/PortSwigger/j2ee-scan/blob/master/src/main/java/burp/j2ee/issues/impl/ApacheStrutsWebConsole.java
  classification:
    cpe: cpe:2.3:a:apache:struts:*:*:*:*:*:*:*:*
  metadata:
    verified: true
    max-request: 1
    vendor: apache
    product: struts
    shodan-query: html:"Struts Problem Report"
  tags: apache,struts,ognl,panel,misconfig,vuln

http:
  - method: GET
    path:
      - '{{BaseURL}}/struts/webconsole.html?debug=console'

    matchers-condition: and
    matchers:
      - type: word
        part: body
        words:
          - 'Welcome to the OGNL console!'

      - type: status
        status:
          - 200
