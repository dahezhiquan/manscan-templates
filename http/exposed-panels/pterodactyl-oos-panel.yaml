id: pterodactyl-oos-panel

info:
  name: Pterodactyl game server 登录面板识别（指纹识别）
  severity: info
  author: darses
  description: |-
    Pterodactyl game server 是游戏服务器管理面板，用于容器化部署、控制和维护游戏服务实例。该模板请求 `/auth/login` 路径，并依据 HTTP 200 状态码、页面标题、正文关键字或品牌资源特征、响应头特征识别目标是否部署了该系统或暴露了对应入口，适用于资产指纹确认；命中结果仅表示系统特征匹配，不代表已确认存在未授权访问或可利用漏洞。
  reference:
  - https://github.com/pterodactyl/panel
  metadata:
    verified: true
    max-request: 1
    vendor: pterodactyl
    product: panel
    shodan-query:
    - title:"Pterodactyl"
    - http.favicon.hash:-456405319
    - http.favicon.hash:846001371
    - "Set-Cookie: pterodactyl_session="
    fofa-query:
    - title="Pterodactyl"
    - icon_hash="-456405319"
    - icon_hash="846001371"
    - "Set-Cookie: pterodactyl_session="
  tags: detect,pterodactyl,panel,oos,discovery

http:
  - method: GET
    path:
      - "{{BaseURL}}/auth/login"

    matchers-condition: and
    matchers:
      - type: status
        status:
          - 200

      - type: word
        part: header
        words:
          - "pterodactyl_session="

      - type: word
        part: body
        words:
          - "window.SiteConfiguration"
