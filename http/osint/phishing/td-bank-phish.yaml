id: td-bank-phish

info:
  name: TD Bank 仿冒钓鱼网站（钓鱼网站识别）
  author: rxerium
  severity: info
  description: |
    检测到疑似仿冒 TD Bank 的钓鱼网站。模板在目标页面返回 200、页面内容命中 TD Bank 的登录或账号页面特征，且当前主机不属于 td.com 官方域名时触发，用于识别借用 TD Bank 品牌页面诱导用户信任的仿冒站点。
  reference:
    - https://td.com
  metadata:
    max-request: 1
  tags: phishing,td-bank,bank,osint,discovery
http:
  - method: GET
    path:
      - "{{BaseURL}}"

    host-redirects: true
    max-redirects: 2

    matchers-condition: and
    matchers:
      - type: word
        words:
          - "Explore TD's online banking services, credit cards, checking accounts, savings accounts, loans and more financial products for you and your business."

      - type: status
        status:
          - 200

      - type: dsl
        dsl:
          - '!contains(host,"td.com")'
