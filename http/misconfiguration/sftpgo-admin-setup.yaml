id: sftpgo-admin-setup

info:
  name: SFTPGo Admin 安装配置
  author: ritikchaddha
  severity: high
  description: |
    检测到 SFTPGo Admin 安装配置。目标响应或文件中可能暴露配置、凭据、密钥、令牌、环境变量或历史记录等敏感信息，可能被用于进一步入侵。
  classification:
    cpe: cpe:2.3:a:sftpgo_project:sftpgo:*:*:*:*:*:*:*:*
  metadata:
    verified: true
    max-request: 1
    vendor: sftpgo_project
    product: sftpgo
    fofa-query: title="SFTPGo - Setup"
  tags: sftpgo,misconfig,setup,vuln

http:
  - method: GET
    path:
      - "{{BaseURL}}/web/admin/setup"

    matchers-condition: and
    matchers:
      - type: word
        part: body
        words:
          - 'SFTPGo - Setup'
          - 'SFTPGo you need to create an admin user'
        condition: or

      - type: status
        status:
          - 200
