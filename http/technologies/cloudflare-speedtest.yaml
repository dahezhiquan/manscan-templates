id: cloudflare-speedtest

info:
  name: Cloudflare Speedtest 指纹识别（指纹识别）
  author: DhiyaneshDk
  severity: info
  description: |-
    Cloudflare Speedtest 是 Cloudflare 网络测速服务，用于测量延迟、下载、上传和网络质量。该模板请求首页，并依据页面标题、正文关键字或品牌资源特征识别目标是否使用或暴露了 Cloudflare Speedtest 相关组件，适用于资产盘点、技术栈识别和后续安全评估；命中结果仅表示指纹特征匹配，不代表已确认存在可利用漏洞。
  metadata:
    max-request: 1
    verified: true
    shodan-query: html:"cloudflare/speedtest"
  tags: tech,cloudflare,speedtest,discovery

http:
  - method: GET
    path:
      - '{{BaseURL}}'

    matchers:
      - type: word
        words:
          - "@cloudflare/speedtest"
        part: body
