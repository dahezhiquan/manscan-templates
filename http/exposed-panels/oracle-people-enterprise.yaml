id: oracle-people-enterprise

info:
  name: Oracle PeopleSoft Enterprise 登录面板识别（暴露面识别）
  author: dhiyaneshDk
  severity: info
  description: 该模板通过识别 Oracle PeopleSoft Enterprise 登录入口的页面标题、特征文本或重定向行为，判断目标是否暴露了对应的认证界面。若命中，说明该登录面板对外可访问，可用于暴露面梳理与后续安全评估。
  classification:
    cvss-metrics: CVSS:3.0/AV:N/AC:L/PR:N/UI:N/S:U/C:N/I:N/A:N
    cwe-id: CWE-200
    cpe: cpe:2.3:a:oracle:peoplesoft_enterprise:*:*:*:*:*:*:*:*
  metadata:
    max-request: 1
    vendor: oracle
    product: peoplesoft_enterprise
    shodan-query:
      - http.title:"Oracle Peoplesoft Enterprise"
      - http.title:"oracle peoplesoft enterprise"
    fofa-query: title="oracle peoplesoft enterprise"
    google-query: intitle:"oracle peoplesoft enterprise"
  tags: oracle,login,panel,discovery

http:
  - method: GET
    path:
      - '{{BaseURL}}'

    matchers-condition: and
    matchers:
      - type: word
        condition: and
        words:
          - "/signon.html"
          - "<meta HTTP-EQUIV='Refresh' CONTENT='1"

      - type: status
        status:
          - 200
