id: milvus-detect

info:
  name: Milvus 指纹识别（指纹识别）
  author: s4e-io
  severity: info
  description: >-
    Milvus 是开源向量数据库，用于存储和检索嵌入向量，支撑语义搜索、推荐和 AI 检索应用。该模板通过请求目标服务并检查预设路径或首页响应、页面正文关键字、HTTP
    响应头、正则特征等指纹特征，判断目标是否使用或暴露了 Milvus 相关组件；命中结果仅表示指纹特征匹配，可用于资产盘点、技术栈识别和后续安全评估，不代表已确认存在可利用漏洞。
  reference:
  - https://milvus.io/
  - https://github.com/milvus-io/milvus
  metadata:
    verified: true
    max-request: 1
    fofa-query: title="Milvus"
  tags: tech,vector-database,milvus,detect,discovery
http:
  - method: GET
    path:
      - "{{BaseURL}}"
      - "{{BaseURL}}/healthz"
      - "{{BaseURL}}:9091/healthz"

    stop-at-first-match: true
    matchers-condition: or
    matchers:
      - type: word
        part: body
        words:
          - '<title>Milvus'
          - '<title>Milvus Demo'
          - '<title>Milvus Insight'
          - '<title>Milvus Enterprise Manager'
        condition: or

      - type: regex
        part: header
        regex:
          - '(?i)Server:\s*Milvus/[0-9]+(?:\.[0-9]+)*'

    extractors:
      - type: regex
        part: header
        group: 1
        regex:
          - '(?i)Server:\s*Milvus/([0-9]+(?:\.[0-9]+)*)'
