id: memtracker-exposure

info:
  name: MemTracker 暴露
  author: DhiyaneshDk
  severity: high
  description: |
    检测到 MemTracker 暴露。目标功能在未认证状态下可访问，可能暴露管理入口、业务数据、系统状态或可执行操作，需确认是否存在访问控制缺失。
  classification:
    cwe-id: CWE-200
  metadata:
    verified: true
    max-request: 1
    shodan-query: html:"memtracker"
  tags: memtracker,misconfig,unauth,vuln

http:
  - method: GET
    path:
      - "{{BaseURL}}/mem_tracker"

    matchers:
      - type: dsl
        dsl:
          - 'contains_all(body, "MemTracker","Configs")'
          - 'status_code == 200'
        condition: and
