id: default-asp-net-page

info:
  name: ASP.Net 默认页面 指纹识别（指纹识别）
  author: dhiyaneshDk
  severity: info
  description: |-
    ASP.Net 默认页面 是 Microsoft Web 应用框架，用于构建 .NET Web 应用和服务。该模板请求首页，并依据页面标题、正文关键字或品牌资源特征识别目标是否使用或暴露了 ASP.Net 默认页面 相关组件，适用于资产盘点、技术栈识别和后续安全评估；命中结果仅表示指纹特征匹配，不代表已确认存在可利用漏洞。
  metadata:
    max-request: 1
    shodan-query: http.title:"Home Page - My ASP.NET Application"
  tags: tech,asp,discovery

http:
  - method: GET
    path:
      - '{{BaseURL}}'

    matchers:
      - type: word
        part: body
        words:
          - "Home Page - My ASP.NET Application"
          - "ASP.NET is a free web framework for building great Web sites and Web applications"
          - "My ASP.NET Application"
        condition: or
