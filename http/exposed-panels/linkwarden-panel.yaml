id: linkwarden-panel

info:
  name: Linkwarden 面板识别（暴露面识别）
  author: ChrisJr404
  severity: info
  description: |
    该模板用于识别 Linkwarden 是否存在对外暴露的管理、服务或状态界面。若命中，说明目标公开了相关功能入口，可作为资产盘点与攻击面收敛的依据。
  reference:
    - https://github.com/linkwarden/linkwarden
    - https://linkwarden.app/
  metadata:
    verified: true
    max-request: 1
    vendor: linkwarden
    product: linkwarden
    shodan-query: http.title:"Linkwarden"
    fofa-query: title="Linkwarden"
  tags: panel,linkwarden,bookmarks,selfhosted,detect,discovery

http:
  - method: GET
    path:
      - "{{BaseURL}}"

    host-redirects: true
    max-redirects: 2

    matchers:
      - type: dsl
        dsl:
          - 'status_code == 200'
          - 'contains(to_lower(body), "<title>linkwarden</title>")'
        condition: and

      - type: dsl
        dsl:
          - 'status_code == 200'
          - 'contains_all(body, "linkwarden", "_next")'
        condition: and
