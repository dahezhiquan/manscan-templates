id: password-min-days

info:
  name: 密码最短使用天数未配置（本地基线扫描）
  author: Th3l0newolf
  severity: medium
  description: |
    密码最短使用天数未配置会允许用户连续快速更换密码，绕过密码历史限制并重新使用旧密码。CIS Ubuntu 基线要求设置正数的 `PASS_MIN_DAYS`；模板读取 `/etc/login.defs` 中该值，缺失或为 0 时命中 Policy-Fail。
  impact: |
    - 用户可通过短时间多次改密规避密码历史策略，降低口令轮换质量。
    - 凭据治理和审计要求难以保证，弱密码可能被快速恢复使用。
  remediation: |
    - 在 `/etc/login.defs` 中设置 `PASS_MIN_DAYS` 为大于 0 的组织基线值。
    - 对已有用户使用 `chage` 应用最短使用天数，并配合密码历史策略。
  reference:
    - https://www.cisecurity.org/benchmark/ubuntu_linux
  metadata:
    verified: true
  tags: cis,local,cisecurity,audit,linux,ubuntu,password

self-contained: true

code:
  - engine:
      - bash

    args:
      - "-c"
      - |
        MIN_DAYS_LINE=$(grep -Pi -- '^\h*PASS_MIN_DAYS\h+\d+\b' /etc/login.defs | head -n1)
        if [ -n "$MIN_DAYS_LINE" ]; then
          VALUE=$(echo "$MIN_DAYS_LINE" | awk '{print $2}')
          if [ "$VALUE" -gt 0 ]; then
            echo "[password-min-days-check:Policy-Pass] [PASS_MIN_DAYS is $VALUE (valid)] [CIS_PASS]"
          else
            echo "[password-min-days-check:Policy-Fail] [PASS_MIN_DAYS is $VALUE (invalid)] [CIS_FAIL]"
          fi
        else
          echo "[password-min-days-check:Policy-Fail] [PASS_MIN_DAYS not set or malformed] [CIS_FAIL]"
        fi

    matchers:
      - type: word
        name: policy-pass
        words:
          - "Policy-Pass"

      - type: word
        name: policy-fail
        words:
          - "Policy-Fail"
