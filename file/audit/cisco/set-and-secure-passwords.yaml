id: set-and-secure-passwords

info:
  name: Cisco 密码安全配置检测（本地文件安全扫描）
  author: pussycat0x
  severity: info
  description: |
    该模板检测 Cisco 本地密码与特权级别访问控制配置。弱或缺失的密码策略会增加网络设备被未授权访问的风险。
  reference:
    - https://www.cisco.com/c/en/us/td/docs/ios-xml/ios/security/d1/sec-d1-cr-book/sec-cr-e1.html#wp3884449514
  classification:
    cvss-metrics: CVSS:3.1/AV:N/AC:L/PR:N/UI:N/S:U/C:N/I:N/A:N
    cvss-score: 0
    cwe-id: CWE-200
  tags: audit,file,cisco,config-audit,cisco-switch

file:
  - extensions:
      - conf

    matchers-condition: and
    matchers:
      - type: word
        words:
          - "service password-encryption"
        negative: true

      - type: word
        words:
          - "configure terminal"

