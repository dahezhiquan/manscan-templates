id: kinsta-takeover

info:
  name: Kinsta 站点缺失接管检测（子域名接管）
  author: pdteam
  severity: high
  description: 检测 Kinsta 返回 No Site For Domain 的情况，说明目标域名可能仍指向 Kinsta 但没有关联有效站点，存在被重新绑定后接管的风险。
  reference:
    - https://github.com/EdOverflow/can-i-take-over-xyz
  metadata:
    max-request: 1
  tags: takeover,vuln

http:
  - method: GET
    path:
      - "{{BaseURL}}"

    matchers-condition: and
    matchers:
      - type: dsl
        dsl:
          - Host != ip

      - type: word
        words:
          - No Site For Domain

    extractors:
      - type: dsl
        dsl:
          - cname
