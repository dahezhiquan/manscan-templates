id: netscaler-console-panel

info:
  name: NetScaler Console 面板（暴露面识别）
  author: DhiyaneshDk
  severity: info
  description: |
    该模板通过识别 NetScaler Console 登录入口的页面标题、特征文本或重定向行为，判断目标是否暴露了对应的认证界面。若命中，说明该登录面板对外可访问，可用于暴露面梳理与后续安全评估。
  reference:
    - https://docs.netscaler.com/en-us/netscaler-console-service/overview.html
  metadata:
    verified: true
    max-request: 1
    shodan-query: title:"NetScaler Console"
  tags: netscaler,console,panel,login,discovery

http:
  - method: GET
    path:
      - "{{BaseURL}}/admin_ui/mas/ent/login.html"

    matchers-condition: and
    matchers:
      - type: word
        part: body
        words:
          - "<title>NetScaler Console</title>"

      - type: status
        status:
          - 200
