id: roundcube-webmail-portal

info:
  name: Roundcube Webmail 指纹识别（指纹识别）
  author: ritikchaddha
  severity: info
  description: >-
    Roundcube Webmail 是基于浏览器的邮件客户端，用于通过 IMAP/SMTP 访问和管理邮箱。该模板通过请求目标服务并检查预设路径或首页响应、正则特征、状态码、DSL
    条件等指纹特征，判断目标是否使用或暴露了 Roundcube Webmail 相关组件；命中结果仅表示指纹特征匹配，可用于资产盘点、技术栈识别和后续安全评估，不代表已确认存在可利用漏洞。
  classification:
    cpe: cpe:2.3:a:roundcube:webmail:*:*:*:*:*:*:*:*
  metadata:
    max-request: 2
    vendor: roundcube
    product: webmail
    shodan-query: http.component:"RoundCube"
  tags: roundcube,portal,tech,discovery
http:
  - method: GET
    path:
      - "{{BaseURL}}"
      - "{{BaseURL}}/webmail/"

    host-redirects: true
    max-redirects: 2
    stop-at-first-match: true

    matchers-condition: and
    matchers:
      - type: regex
        regex:
          - '"rcversion":\d\d\d\d'
          - '(?i)roundcube'
        condition: and

      - type: status
        status:
          - 200
    extractors:
      - type: regex
        part: body
        group: 1
        regex:
          - '"rcversion":(\d+)'
        internal: true
        name: raw_version

      - type: dsl
        dsl:
          - 'concat(to_number(substr(raw_version, 0, 1)), ".", to_number(substr(raw_version, 1, 3)), ".", to_number(substr(raw_version, 3)))'
