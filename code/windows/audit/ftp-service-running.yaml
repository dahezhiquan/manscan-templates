id: ftp-service-running

info:
  name: FTP 服务正在运行（本地基线扫描）
  author: princechaddha
  severity: high
  description: |
    该模板检查 Windows FTP 服务是否正在运行。若业务无需 FTP，暴露该服务会增加明文传输和弱口令攻击面。
  impact: |
    攻击者可尝试匿名访问、暴力破解或利用 FTP 服务漏洞。
  remediation: |
    停用不需要的 FTP 服务；如必须使用，强制加密、限制来源并开启审计。
  tags: windows,ftp,service,insecure,code,windows-audit

self-contained: true

code:
  - pre-condition: |
      IsWindows();
    engine:
      - powershell
      - powershell.exe
    args:
      - -ExecutionPolicy
      - Bypass
    pattern: "*.ps1"
    source: |
      Get-Service -Name ftpsvc | Select-Object -ExpandProperty Status

    matchers:
      - type: word
        words:
          - "Running"
