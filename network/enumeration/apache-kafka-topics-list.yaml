id: kafka-topics-list

info:
  name: Kafka 协议识别与 Topics 枚举（指纹识别）
  author: pussycat0x
  severity: info
  description: |
    Kafka 是分布式事件流与消息队列协议。该模板先发送 ApiVersions 请求，根据响应中的关联 ID、成功状态和 API 列表识别 Kafka 兼容服务；另用 Metadata 请求提取允许匿名读取的 Topic 等可见文本。默认端口为 9092/TCP，不依据 API 兼容范围推断软件版本。
  metadata:
    verified: true
    max-request: 2
    shodan-query: product:"Kafka"
  tags: network,detect,enum,kafka,apache,tcp,discovery
tcp:
  - inputs:
      # ApiVersions v0 with correlation ID 0x4b41464b ("KAFK").
      - data: "{{hex_decode('0000000a001200004b41464b0000')}}"

    host:
      - "{{Hostname}}"
    port: 9092
    read-size: 4096

    matchers:
      - type: dsl
        dsl:
          - "regex('^[0-9a-f]{8}4b41464b0000000000(?:0[1-9a-f]|[1-9a-f][0-9a-f])(?:0000|0001)[0-9a-f]{8}', hex_encode(raw))"
          - "regex('0012[0-9a-f]{8}', hex_encode(raw))"
        condition: and

  - inputs:
      - data: 00000020000300000000000200126b61666b612d707974686f6e2d322e302e3200000000
        type: hex

    host:
      - "{{Hostname}}"
    port: 9092
    read-size: 4096

    matchers:
      - type: dsl
        dsl:
          - "regex('^[0-9a-f]{8}00000002000000(0[1-9a-f]|[1-9a-f][0-9a-f])[0-9a-f]{8}00(0[1-9a-f]|[1-9a-f][0-9a-f])[3-7][0-9a-f]', hex_encode(raw))"

    extractors:
      - type: regex
        part: raw
        name: value
        regex:
          - '([a-z.A-Z_0-9-]+)'
