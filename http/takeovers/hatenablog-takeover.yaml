id: hatenablog-takeover

info:
  name: Hatena Blog 博客缺失接管检测（子域名接管）
  author: pdteam
  severity: high
  description: 检测 Hatena Blog 返回博客不存在的 404 页面，说明目标域名可能仍指向 Hatena Blog 但对应博客已删除或未创建，存在被重新注册后接管的风险。
  reference:
    - https://beaglesecurity.com/blog/vulnerability/hatenablog-takeover-detection.html
    - https://github.com/EdOverflow/can-i-take-over-xyz
  metadata:
    max-request: 1
  tags: takeover,hatenablog,vuln

http:
  - method: GET
    path:
      - "{{BaseURL}}"

    matchers-condition: and
    matchers:
      - type: dsl
        dsl:
          - Host != ip

      - type: word
        words:
          - "404 Blog is not found"

    extractors:
      - type: dsl
        dsl:
          - cname
