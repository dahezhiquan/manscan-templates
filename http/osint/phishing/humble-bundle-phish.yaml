id: humble-bundle-phish

info:
  name: Humble Bundle 仿冒钓鱼网站（钓鱼网站识别）
  author: rxerium
  severity: info
  description: |
    检测到疑似仿冒 Humble Bundle 的钓鱼网站。模板在目标页面返回 200、页面内容命中 Humble Bundle 的品牌页面特征，且当前主机不属于 humblebundle.com 官方域名时触发，用于识别借用 Humble Bundle 品牌页面诱导用户信任的仿冒站点。
  reference:
    - https://humblebundle.com
  metadata:
    max-request: 1
  tags: phishing,humble-bundle,osint,discovery
http:
  - method: GET
    path:
      - "{{BaseURL}}"

    host-redirects: true
    max-redirects: 2

    matchers-condition: and
    matchers:
      - type: word
        words:
          - "Humble Bundle sells games, books, software, and more. Our mission is to support charity while providing awesome content to customers at great prices. Since 2010, Humble Bundle customers have given over $275,000,000 to charity."

      - type: status
        status:
          - 200

      - type: dsl
        dsl:
          - '!contains(host,"humblebundle.com")'
