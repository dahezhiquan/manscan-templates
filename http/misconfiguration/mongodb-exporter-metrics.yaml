id: mongodb-exporter-metrics

info:
  name: MongoDB Exporter 指标暴露
  author: pussycat0x
  severity: medium
  description: |
    该模板用于核查 MongoDB Exporter 指标暴露。该类问题通常源于 Prometheus、Exporter、监控端点或服务指标接口未加访问控制而暴露。模板会向目标发送探测请求，并依据请求 `/metrics`、匹配 `# HELP`、匹配 `mongodb`、匹配 `mongodb_exporter_build_info`等证据确认目标是否存在该配置问题。
  impact: |
    - 攻击者可获取主机、容器、服务版本、资源使用、网络接口、文件系统或集群状态等运行信息。
    - 指标信息可辅助攻击者绘制内部架构、识别高价值节点并制定后续攻击路径。
  remediation: |
    - 为指标端点增加认证授权、来源限制或仅绑定内网监听地址。
    - 通过反向代理、服务网格或监控采集器收敛访问路径，避免公网直接访问。
    - 审计已暴露的指标内容，确认是否包含主机名、版本、标签或业务敏感标识。
  reference:
    - https://github.com/percona/mongodb_exporter
  classification:
    cvss-metrics: CVSS:3.1/AV:N/AC:L/PR:N/UI:N/S:U/C:L/I:N/A:N
    cvss-score: 5.3
    cwe-id: CWE-200
  metadata:
    verified: true
    max-request: 1
    shodan-query: title:"MongoDB exporter"
  tags: mongodb,exposure,debug,misconfig,vuln

http:
  - method: GET
    path:
      - "{{BaseURL}}/metrics"

    matchers-condition: and
    matchers:
      - type: word
        part: body
        words:
          - "# HELP"

      - type: word
        part: body
        words:
          - "mongodb"
          - "mongodb_exporter_build_info"
        condition: or

      - type: status
        status:
          - 200
