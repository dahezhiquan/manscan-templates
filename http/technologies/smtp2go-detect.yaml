id: smtp2go-detect

info:
  name: SMTP2GO 指纹识别（指纹识别）
  author: pikpikcu,righettod
  severity: info
  description: >-
    SMTP2GO 是邮件投递服务平台，用于应用邮件发送、投递跟踪和域名认证管理。该模板通过请求目标服务并检查预设路径或首页响应、页面正文关键字、状态码等指纹特征，判断目标是否使用或暴露了
    SMTP2GO 相关组件；命中结果仅表示指纹特征匹配，可用于资产盘点、技术栈识别和后续安全评估，不代表已确认存在可利用漏洞。
  metadata:
    max-request: 1
    shodan-query: http.title:"smtp2go"
  tags: tech,smtp2go,discovery
http:
  - method: GET
    path:
      - "{{BaseURL}}"

    redirects: true
    max-redirects: 2

    matchers-condition: and
    matchers:
      - type: word
        part: body
        words:
          - "<title>SMTP2GO</title>"
          - "2022 &copy; SMTP2GO."
          - "mailto:ticket@smtp2go.com"
          - 'href="https://www.smtp2go.com/"'
        condition: or

      - type: status
        status:
          - 200
