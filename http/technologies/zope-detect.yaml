id: zope-detect

info:
  name: Zope 指纹识别（指纹识别）
  author: pikpikcu
  severity: info
  description: >-
    Zope 是 Python Web 应用服务器和框架，用于运行内容管理、应用服务和对象发布系统。该模板通过请求目标服务并检查预设路径或首页响应、页面正文关键字等指纹特征，判断目标是否使用或暴露了
    Zope 相关组件；命中结果仅表示指纹特征匹配，可用于资产盘点、技术栈识别和后续安全评估，不代表已确认存在可利用漏洞。
  metadata:
    verified: true
    max-request: 1
    shodan-query: http.title:"Zope QuickStart"
  tags: tech,zope,discovery
http:
  - method: GET
    path:
      - "{{BaseURL}}"

    matchers-condition: or
    matchers:
      - type: word
        part: body
        words:
          - "<title>Zope QuickStart</title>"

      - type: word
        part: server
        words:
          - "Zope/"
