id: graphql-alias-batching

info:
  name: GraphQL Alias Batching 配置检测
  author: Dolev Farhi
  severity: medium
  description: |
    该模板用于核查 GraphQL Alias Batching 配置检测。该类问题通常源于 GraphQL 调试界面、交互式控制台、批处理能力或查询错误提示在生产环境中暴露。模板会向目标发送探测请求，并依据匹配 `"data":`、匹配 `"{{str}}1":`、匹配 `"{{str}}6":`等证据确认目标是否存在该配置问题。
  impact: |
    - 攻击者可通过调试界面或错误提示了解 GraphQL Schema、字段、类型和业务对象。
    - 若批处理、GET 请求或复杂查询未限制，可能造成权限绕过、CSRF、资源消耗或批量数据枚举。
  remediation: |
    - 关闭生产环境中的 GraphQL Playground、GraphiQL、Voyager 等调试界面。
    - 对 GraphQL 接口启用认证授权、查询复杂度限制、批处理限制和速率限制。
    - 禁用不必要的字段建议和详细错误回显，并审计异常查询模式。
  reference:
    - https://github.com/dolevf/Damn-Vulnerable-GraphQL-Application
    - https://cheatsheetseries.owasp.org/cheatsheets/GraphQL_Cheat_Sheet.html
    - https://graphql.security/
    - https://stackoverflow.com/questions/62421352/graphql-difference-between-using-alias-versus-multiple-query-objects-when-doin
  classification:
    cpe: cpe:2.3:a:graphql:playground:*:*:*:*:node.js:*:*:*
  metadata:
    max-request: 2
    product: playground
    vendor: graphql
  tags: graphql,misconfig,vuln

variables:
  str: "{{to_lower(rand_text_alpha(5))}}"

http:
  - raw:
      - |
        POST /graphql HTTP/1.1
        Host: {{Hostname}}
        Content-Type: application/json

        {"query":"query {\n {{str}}1:__typename \n {{str}}2:__typename \n {{str}}3:__typename \n {{str}}4:__typename \n {{str}}5:__typename \n {{str}}6:__typename \n }"}
      - |
        POST /api/graphql HTTP/1.1
        Host: {{Hostname}}
        Content-Type: application/json

        {"query":"query {\n {{str}}1:__typename \n {{str}}2:__typename \n {{str}}3:__typename \n {{str}}4:__typename \n {{str}}5:__typename \n {{str}}6:__typename \n }"}

    stop-at-first-match: true

    matchers-condition: and
    matchers:
      - type: word
        part: body
        words:
          - '"data":'
          - '"{{str}}1":'
          - '"{{str}}6":'
        condition: and

      - type: word
        part: header
        words:
          - "application/json"
