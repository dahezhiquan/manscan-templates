id: cluster-trino-panel

info:
  name: Cluster Overview Trino 面板（暴露面识别）
  author: DhiyaneshDk
  severity: info
  description: |
    该模板通过识别 Cluster Overview Trino 登录入口的页面标题、特征文本或重定向行为，判断目标是否暴露了对应的认证界面。若命中，说明该登录面板对外可访问，可用于暴露面梳理与后续安全评估。
  classification:
    cwe-id: CWE-200
  metadata:
    verified: true
    max-request: 1
  tags: cluster,panel,login,discovery

http:
  - method: GET
    path:
      - "{{BaseURL}}/ui/login.html"

    matchers:
      - type: dsl
        dsl:
          - 'contains_all(body, "Cluster Overview - Trino", "Log in")'
          - 'status_code == 200'
        condition: and
