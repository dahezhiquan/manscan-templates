id: ebs-encryption-disabled

info:
  name: EBS 加密 -未启用（云安全）
  author: DhiyaneshDK
  severity: high
  description: 该规则用于检查 AWS EBS 相关安全控制、保护能力或合规配置是否处于未启用、缺失或未正确配置状态，以降低持续暴露风险并提升整体云安全基线。
  impact: |
    - 关键安全控制缺失会降低防护深度，使风险长期处于不可见或不可控状态。
    - 这类配置问题通常不会立即触发故障，但会显著增加后续入侵、横向移动或合规违规的概率。
  remediation: |
    - 按厂商最佳实践启用缺失的安全控制、保护功能或基线配置。
    - 将该类配置纳入持续巡检与自动化合规检查，避免后续资源再次以不安全默认值部署。
  reference:
    - https://www.trendmicro.com/cloudoneconformity-staging/knowledge-base/aws/EBS/ebs-encrypted.html
    - http://docs.aws.amazon.com/AWSEC2/latest/UserGuide/EBSEncryption.html
  tags: cloud,devops,aws,amazon,ebs,aws-cloud-config

variables:
  region: "us-west-2"

flow: |
  code(1)
  for(let VolumesVolumeId of iterate(template.volumes)){
    set("volume", VolumesVolumeId)
    code(2)
  }

self-contained: true

code:
  - engine:
      - sh
      - bash

    source: |
      aws ec2 describe-volumes --region $region --query 'Volumes[*].VolumeId'  --output json

    extractors:
      - type: json
        name: volumes
        internal: true
        json:
          - '.[]'

  - engine:
      - sh
      - bash

    source: |
        aws ec2 describe-volumes --region $region --volume-ids $volume --query 'Volumes[*].Encrypted' --output text

    matchers:
      - type: word
        words:
          - "False"

    extractors:
      - type: dsl
        dsl:
          - '"EBS Encryption  " + volumes + " is Disabled"'
