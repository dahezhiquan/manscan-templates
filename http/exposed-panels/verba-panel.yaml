id: verba-panel

info:
  name: Verba（The Golden RAGtriever）面板 - 检测（指纹识别）
  author: rxerium
  severity: info
  description: |-
    Verba，又称“The Golden RAGtriever”，是 Weaviate 构建的开源检索增强生成（RAG）聊天应用，采用 Next.js 前端并后接 FastAPI/uvicorn 服务器，通常部署在 8000 端口。通过前端捆绑包中特有的编译后 CSS 类名即可识别该应用。
  reference:
    - https://github.com/weaviate/Verba
    - https://weaviate.io
  metadata:
    verified: true
    max-request: 1
    vendor: weaviate
    product: verba
    shodan-query: 'html:"bg-bg-verba"'
  tags: panel,verba,weaviate,llm,ai,rag,detect,discovery

http:
  - method: GET
    path:
      - "{{BaseURL}}"

    host-redirects: true
    max-redirects: 2

    matchers-condition: and
    matchers:
      - type: word
        part: body
        words:
          - "bg-bg-verba"

      - type: status
        status:
          - 200
