id: pa11y-dashboard

info:
  name: Pa11y 仪表盘 暴露
  author: tess
  severity: low
  description: |
    检测到 Pa11y 仪表盘 暴露。目标响应或文件中可能暴露配置、凭据、密钥、令牌、环境变量或历史记录等敏感信息，可能被用于进一步入侵。
  metadata:
    verified: true
    max-request: 1
    shodan-query: title:"Pa11y Dashboard"
  tags: misconfig,exposure,pa11y,discovery

http:
  - method: GET
    path:
      - '{{BaseURL}}'

    matchers-condition: and
    matchers:
      - type: word
        part: body
        words:
          - "Pa11y Dashboard"
          - "Add new URL"
        condition: and

      - type: word
        part: header
        words:
          - "text/html"

      - type: status
        status:
          - 200
