id: zipline-panel

info:
  name: Diced Zipline 登录面板识别（指纹识别）
  author: icarot
  severity: info
  description: |-
    Diced Zipline 是文件上传和分享平台，用于短链接、图片、文件和访问管理。该模板请求 `/auth/login`，并依据 HTTP 200 状态码、页面标题、正文关键字或品牌资源特征识别目标是否部署了该系统或暴露了对应入口，适用于资产指纹确认；命中结果仅表示系统特征匹配，不代表已确认存在未授权访问或可利用漏洞。
  reference:
  - https://github.com/diced/zipline
  metadata:
    verified: true
    max-request: 1
    vendor: diced
    product: zipline
    shodan-query: html:"Zipline"
  tags: diced,zipline,login,panel,detect,discovery

http:
  - method: GET
    path:
      - "{{BaseURL}}/auth/login"

    matchers-condition: and
    matchers:
      - type: word
        words:
          - '"title":"Zipline"'
          - 'Zipline – Login</title>'
        condition: or
        case-insensitive: true

      - type: status
        status:
          - 200
