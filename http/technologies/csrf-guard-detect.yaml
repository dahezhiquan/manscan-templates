id: csrf-guard-detect

info:
  name: OWASP CSRFGuard 3.x/4.x 指纹识别（指纹识别）
  author: forgedhallpass
  severity: info
  description: 用于识别目标是否部署 OWASP CSRFGuard 3.x/4.x 并提取相关版本或构建信息，模板会结合版本或标识提取结果进行指纹匹配。
  reference:
    - https://github.com/OWASP/www-project-csrfguard
  classification:
    cvss-metrics: CVSS:3.1/AV:N/AC:L/PR:N/UI:N/S:U/C:N/I:N/A:N
    cvss-score: 0
    cwe-id: CWE-200
  metadata:
    max-request: 3
  tags: tech,csrfguard,owasp,discovery

http:
  - raw:
      - |
        GET / HTTP/1.1
        Host: {{Hostname}}
      - |
        GET /JavaScriptServlet HTTP/1.1
        Host: {{Hostname}}
        Referer: {{BaseURL}}
      - |
        POST /JavaScriptServlet HTTP/1.1
        Host: {{Hostname}}
        OWASP-CSRFTOKEN: {{masterToken}}

    matchers-condition: or
    matchers:
      - type: word
        name: "CSRFGuard-v3.x"
        words:
          - "FETCH-CSRF-TOKEN"

      - type: word
        name: "CSRFGuard-v4.x"
        words:
          - "masterTokenValue"

      - type: dsl
        name: "Disabled-token-per-page"
        condition: and
        dsl:
          - 'status_code_3==400'
          - 'contains(body, "Token-Per-Page functionality is disabled")'

      - type: dsl
        name: "Enabled-token-per-page"
        condition: and
        dsl:
          - 'status_code_3==200'
          - 'contains(body, "{\"pageTokens")'

    extractors:
      - type: regex
        name: masterToken
        internal: true
        group: 1
        regex:
          - "(?:masterTokenValue\\s*=\\s*')([^']+)';"

      - type: regex
        group: 1
        name: "master-token"
        regex:
          - "(?:masterTokenValue\\s*=\\s*')([^']+)';"

      - type: json
        name: "page-token"
        json:
          - '.pageTokens'
