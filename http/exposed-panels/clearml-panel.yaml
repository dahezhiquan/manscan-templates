id: clearml-panel

info:
  name: ClearML 面板识别（指纹识别）
  author: rxerium
  severity: info
  description: |-
    检测到目标站点存在 ClearML 相关响应特征。ClearML 是 AI、LLM 或机器学习相关平台，用于管理模型、数据集、工作区、推理服务或可观测性信息。模板使用模板内配置的路径集合发起请求，并通过页面标题或正文关键字、状态码、DSL 条件确认该系统指纹，用于资产识别、系统盘点和暴露面梳理。
  reference:
    - https://github.com/allegroai/clearml
    - https://clear.ml/
  metadata:
    verified: true
    max-request: 1
    vendor: allegro
    product: clearml
    shodan-query: 'http.title:"ClearML"'
  tags: panel,clearml,mlops,ai,detect,discovery
http:
  - raw:
      - |
        GET / HTTP/1.1
        Host: {{Hostname}}

    redirects: true
    max-redirects: 2

    matchers:
      - type: dsl
        dsl:
          - status_code == 200
          - contains_all(body, "ClearML", "automate and orchestrate your ML stack")
        condition: and
