id: graylog-panel

info:
  name: Graylog 登录面板识别（指纹识别）
  author: righettod
  severity: info
  description: |-
    检测到目标站点存在 Graylog 相关响应特征。Graylog 是集中日志管理与安全分析平台，用于采集、搜索、解析日志并配置告警和仪表盘。模板请求 `/`，并通过页面标题或正文关键字、状态码、DSL 条件确认该系统指纹，用于资产识别、系统盘点和暴露面梳理。
  reference:
    - https://graylog.org/
  classification:
    cpe: cpe:2.3:a:graylog:graylog:*:*:*:*:*:*:*:*
  metadata:
    verified: true
    max-request: 1
    vendor: graylog
    product: graylog
    shodan-query: http.title:"Graylog Web Interface"
  tags: panel,graylog,login,detect,discovery
http:
  - method: GET
    path:
      - "{{BaseURL}}"

    matchers:
      - type: dsl
        dsl:
          - 'status_code == 200'
          - 'contains(body, "<title>Graylog Web Interface")'
        condition: and
