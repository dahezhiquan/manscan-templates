id: arcgis-rest-api

info:
  name: ArcGIS Exposed REST API 文档 指纹识别（指纹识别）
  author: Podalirius
  severity: info
  description: ArcGIS Exposed REST API 文档 是 Esri 地理信息系统平台，用于地图服务、空间数据、分析和 GIS 应用发布。该模板请求 `/server/sdk/rest/index.html`，并依据 HTTP 200 状态码、页面标题、正文关键字或品牌资源特征识别目标是否使用或暴露了 ArcGIS Exposed REST API 文档 相关组件，适用于资产盘点、技术栈识别和后续安全评估；命中结果仅表示指纹特征匹配，不代表已确认存在可利用漏洞。
  reference:
  - https://enterprise.arcgis.com/en/
  classification:
    cwe-id: CWE-200
    cpe: cpe:2.3:a:esri:arcgis_engine:*:*:*:*:*:*:*:*
  metadata:
    max-request: 1
    vendor: esri
    product: arcgis_engine
  tags: api,arcgis,cms,tech,esri,discovery

http:
  - method: GET
    path:
      - '{{BaseURL}}/server/sdk/rest/index.html'

    matchers-condition: and
    matchers:
      - type: word
        words:
          - 'ArcGIS REST API'

      - type: status
        status:
          - 200
