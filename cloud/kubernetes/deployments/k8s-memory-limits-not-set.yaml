id: k8s-memory-limits-not-set

info:
  name: Memory limits not set 中的Deployments（云安全）
  author: princechaddha
  severity: medium
  description: Deployment 未设置 memory limits 会让容器在异常负载下消耗过多节点内存，可能触发节点内存压力或 OOM。本模板枚举 Deployment，检查 Pod 模板容器是否缺少 resources.limits.memory。
  impact: |
    - 单个容器可能耗尽节点内存，导致同节点其他 Pod 被驱逐或服务中断。
    - 攻击者可通过高内存请求扩大拒绝服务影响。
  remediation: |
    - 为每个容器设置合理的 resources.limits.memory，并基于压测和监控数据调整。
    - 在命名空间配置 LimitRange，防止新工作负载缺省无内存上限。
  reference:
    - https://kubernetes.io/docs/tasks/configure-pod-container/assign-memory-resource/
  metadata:
    vendor: kubernetes
    product: kubernetes
  tags: cloud,devops,kubernetes,devsecops,deployments,k8s-cluster-security
flow: |
  code(1);
  for (let deployment of template.items) {
    set("deployment",deployment)
    javascript(1);
  }

self-contained: true
code:
  - engine:
      - sh
      - bash
    source: kubectl get deployments --all-namespaces --output=json
    extractors:
      - type: json
        name: items
        internal: true
        json:
          - '.items[]'

javascript:
  - code: |
        deployment = JSON.parse(template.deployment);
        if (!deployment.spec.template.spec.containers.some(container => container.resources && container.resources.limits && container.resources.limits.memory)) {
          let result = (`Deployment '${deployment.metadata.name}' in namespace '${deployment.metadata.namespace}' lacks memory limits.`);
          Export(result);
        }

    extractors:
      - type: dsl
        dsl:
          - response
