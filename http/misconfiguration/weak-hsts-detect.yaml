id: weak-hsts-detect

info:
  name: 弱 HTTP Strict Transport Security 配置
  author: saint_orion
  severity: low
  description: |-
    该模板用于核查弱 HTTP Strict Transport Security 配置。目标安全响应头或前端消息通信策略配置过宽，可能削弱浏览器侧防护。模板访问 目标入口，并根据响应头策略或页面脚本中的通配来源特征判断配置是否薄弱。
  reference:
    - https://owasp.org/www-project-secure-headers/
    - https://developer.mozilla.org/en-US/docs/Web/HTTP/Headers/Strict-Transport-Security
  metadata:
    verified: true
    max-request: 1
  tags: misconfig,headers,hsts
  impact: |-
    - 弱 CSP 可能降低跨站脚本防护效果，弱 HSTS 可能增加降级或中间人攻击面。
    - 通配 `postMessage` 来源可能允许不可信页面接收敏感消息或触发前端逻辑。
  remediation: |-
    - 为 CSP 设置明确的脚本、样式、连接和 frame 来源，避免使用不必要的通配符。
    - 配置包含合理 `max-age`、`includeSubDomains` 和 `preload` 的 HSTS 策略。
    - 对 `postMessage` 明确校验 `origin` 和消息结构，避免向 `*` 发送敏感数据。
http:
  - method: GET
    path:
      - "{{BaseURL}}"

    host-redirects: true
    max-redirects: 3

    matchers:
      - type: regex
        part: header
        regex:
          - '(?i)strict-transport-security:\s*max-age=([0-9]{1,7}|[12][0-9]{7}|30[0-9]{6}|31[0-4][0-9]{5}|315[0-2][0-9]{4}|3153[0-5][0-9]{3})\b'

    extractors:
      - type: regex
        part: header
        name: hsts-header
        group: 1
        regex:
          - "(?i)Strict-Transport-Security:\\s*([^\\r\\n]+)"
