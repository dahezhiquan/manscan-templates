id: jhipster-detect

info:
  name: JHipster 指纹识别（指纹识别）
  author: righettod
  severity: info
  description: >-
    JHipster 是应用生成器和开发平台，用于基于 Spring Boot、Angular、React 或 Vue 快速生成现代 Web 应用。该模板通过请求目标服务并检查预设路径或首页响应、页面正文关键字等指纹特征，判断目标是否使用或暴露了
    JHipster 相关组件；命中结果仅表示指纹特征匹配，可用于资产盘点、技术栈识别和后续安全评估，不代表已确认存在可利用漏洞。
  classification:
    cpe: cpe:2.3:a:jhipster:jhipster:*:*:*:*:*:*:*:*
  metadata:
    verified: true
    max-request: 2
    vendor: jhipster
    product: jhipster
    shodan-query: http.html:"JHipster"
  tags: tech,jhipster,discovery
http:
  - method: GET
    path:
      - '{{BaseURL}}'
      - '{{BaseURL}}/i18n/en.json'

    stop-at-first-match: true
    matchers:
      - type: word
        part: body
        words:
          - 'JHipster'
          - '@jhipster'
          - 'Welcome, Java Hipster!'
          - 'jhipster-error'
        condition: or
