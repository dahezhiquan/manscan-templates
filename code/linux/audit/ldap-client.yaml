id: ldap-client

info:
  name: LDAP 客户端不应安装（本地基线扫描）
  author: Th3l0newolf
  severity: low
  description: |
    LDAP 客户端工具可连接目录服务并查询账号、组和组织信息，非必要安装会增加目录信息被误查或凭据被明文配置的风险。CIS Ubuntu 基线建议移除不必要的 LDAP 客户端；模板通过 `dpkg-query` 检查 `ldap-utils` 是否安装，命中 Policy-Fail 表示不符合基线。
  impact: |
    - 增加主机误用高风险协议或旧式信任机制的机会，可能暴露凭据、会话内容或内部连接信息。
    - 攻击者在获得低权限落点后，可能利用已安装客户端辅助横向连接、数据传输或绕过组织基线管控。
  remediation: |
    - 如无明确业务需求，卸载 `ldap-utils` 或对应软件包，并清理残留服务配置。
    - 如必须保留，限制访问来源和可用范围，启用加密认证，并纳入补丁、日志和基线审计。
  reference:
    - https://www.cisecurity.org/benchmark/ubuntu_linux
  metadata:
    verified: true
  tags: cis,local,cisecurity,audit,linux,ubuntu,ldap

self-contained: true

code:
  - engine:
      - bash

    args:
      - "-c"
      - |
        # Check if the ldap-utils package is installed
        if dpkg-query -W -f='${Status}' ldap-utils 2>/dev/null | grep -q "install ok installed"; then
          echo "[cis-ldap-client-check:Policy-Fail] [ldap-utils is installed] [CIS_FAIL]"
        else
          echo "[cis-ldap-client-check:Policy-Pass] [ldap-utils is not installed] [CIS_PASS]"
        fi

    matchers:
      - type: word
        name: policy-pass
        words:
          - "Policy-Pass"

      - type: word
        name: policy-fail
        words:
          - "Policy-Fail"
