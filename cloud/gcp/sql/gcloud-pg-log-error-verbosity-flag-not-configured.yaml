id: gcloud-pg-log-error-verbosity-flag-not-configured

info:
  name: Log Error Verbosity Flag 未Configured Properly 的PostgreSQL Instances（云安全）
  author: princechaddha
  severity: medium
  description: PostgreSQL log_error_verbosity 控制错误日志详细程度，未按要求配置会影响数据库问题排查和安全事件取证。本模板枚举 Cloud SQL PostgreSQL 实例，并从 databaseFlags 中提取 log_error_verbosity，返回 null 时报告该标志未正确配置。
  impact: |
    - 错误日志可能缺少足够上下文，导致异常查询、认证失败或应用错误难以及时定位。
    - 日志详细程度不一致会削弱跨实例审计分析和事件响应质量。
  remediation: |
    - 为 Cloud SQL PostgreSQL 实例显式配置符合组织日志基线的 log_error_verbosity 值。
    - 在调整日志详细程度后复核日志量、敏感信息暴露风险和集中日志解析规则。
  reference:
    - https://cloud.google.com/sql/docs/postgres/flags
  metadata:
    vendor: google
    product: cloud-sql
  tags: cloud,devops,gcp,gcloud,google-cloud-sql,postgresql,logging,gcp-cloud-config

flow: |
  code(1)
  for(let projectId of iterate(template.projectIds)){
    set("projectId", projectId)
    code(2)
    for(let sqlInstance of iterate(template.sqlInstances)){
      set("sqlInstance", sqlInstance)
      code(3)
    }
  }

self-contained: true

code:
  - engine:
      - sh
      - bash
    source: |
      gcloud projects list --format="json(projectId)"

    extractors:
      - type: json
        name: projectIds
        internal: true
        json:
          - '.[].projectId'

  - engine:
      - sh
      - bash
    source: |
      gcloud sql instances list --project $projectId --filter=DATABASE_VERSION:POSTGRES* --format="json(name)"

    extractors:
      - type: json
        name: sqlInstances
        internal: true
        json:
          - '.[].name'

  - engine:
      - sh
      - bash
    source: |
      gcloud sql instances describe $sqlInstance --project $projectId --format=json | jq -r '.settings.databaseFlags[]? | select(.name=="log_error_verbosity") | .value // "null"'

    matchers:
      - type: word
        words:
          - 'null'

    extractors:
      - type: dsl
        dsl:
          - '"The log_error_verbosity flag is not configured properly or is set to an inappropriate value for PostgreSQL instance " + sqlInstance + " in project " + projectId'
