id: comfyui-detect

info:
  name: ComfyUI 指纹识别（指纹识别）
  author: rxerium
  severity: info
  description: |-
    ComfyUI 是 Stable Diffusion 节点式图像生成界面，用于编排模型、节点和生成工作流。该模板请求首页，并依据 HTTP 200 状态码、页面标题、正文关键字或品牌资源特征识别目标是否使用或暴露了 ComfyUI 相关组件，适用于资产盘点、技术栈识别和后续安全评估；命中结果仅表示指纹特征匹配，不代表已确认存在可利用漏洞。
  reference:
  - https://github.com/comfyanonymous/ComfyUI
  metadata:
    verified: true
    max-request: 1
    vendor: comfyanonymous
    product: comfyui
    shodan-query: http.title:"ComfyUI"
  tags: tech,comfyui,discovery

http:
  - method: GET
    path:
      - "{{BaseURL}}"

    host-redirects: true
    max-redirects: 2

    matchers-condition: and
    matchers:
      - type: word
        part: body
        words:
          - '<title>ComfyUI'

      - type: status
        status:
          - 200
