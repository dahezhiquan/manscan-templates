id: cisco-systems-login

info:
  name: Cisco Systems 登录面板识别（暴露面识别）
  author: dhiyaneshDk,idealphase
  severity: info
  description: 该模板通过识别 Cisco Systems 登录入口的页面标题、特征文本或重定向行为，判断目标是否暴露了对应的认证界面。若命中，说明该登录面板对外可访问，可用于暴露面梳理与后续安全评估。
  classification:
    cvss-metrics: CVSS:3.0/AV:N/AC:L/PR:N/UI:N/S:U/C:N/I:N/A:N
    cwe-id: CWE-200
  metadata:
    max-request: 1
    shodan-query: http.title:"Cisco Systems Login"
    google-query: intitle:"Cisco Systems Login"
  tags: panel,cisco,discovery

http:
  - method: GET
    path:
      - "{{BaseURL}}"

    matchers-condition: and
    matchers:
      - type: word
        part: body
        words:
          - "Cisco Systems Login"

      - type: status
        status:
          - 200

    extractors:
      - type: regex
        group: 1
        regex:
          - '<script src="javascript\/translate\.js\?ver=(.+)"><\/script>'
