id: roblox-phish

info:
  name: Roblox 仿冒钓鱼网站（钓鱼网站识别）
  author: rxerium
  severity: info
  description: |
    检测到疑似仿冒 Roblox 的钓鱼网站。模板在目标页面返回 200、页面内容命中 Roblox 的品牌页面特征，且当前主机不属于 roblox.com 官方域名时触发，用于识别借用 Roblox 品牌页面诱导用户信任的仿冒站点。
  reference:
    - https://roblox.com
  metadata:
    max-request: 1
  tags: phishing,roblox,osint,discovery
http:
  - method: GET
    path:
      - "{{BaseURL}}"

    host-redirects: true
    max-redirects: 2

    matchers-condition: and
    matchers:
      - type: word
        words:
          - 'Roblox is ushering in the next generation of entertainment. Imagine, create, and play together with millions of people across an infinite variety of immersive, user-generated 3D worlds.'

      - type: status
        status:
          - 200

      - type: dsl
        dsl:
          - '!contains(host,"roblox.com")'
