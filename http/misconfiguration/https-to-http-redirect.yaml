id: https-to-http-redirect

info:
  name: HTTPS 到 HTTP 重定向 配置不当
  author: kazet,idealphase
  severity: low
  description: |
    该模板用于核查 HTTPS 到 HTTP 重定向 配置不当。该类问题通常源于 HTTP 安全响应头、重定向策略或浏览器安全策略配置不完整。模板会向目标发送探测请求，并依据请求 ``、匹配 `startswith(tolower(location), "http://")`、匹配 `startswith(tostring(BaseURL), "https://")`、匹配 `(status_code == 300 || status_code == 301 || status_code == 302 || status_code == 303 || status_code == 307 || status_code == 308)`等证据确认目标是否存在该配置问题。
  impact: |
    - 缺失或错误的安全响应头会削弱浏览器侧防护，增加 XSS、点击劫持、降级访问或策略绕过风险。
    - 错误的 HTTPS 到 HTTP 重定向可能让敏感请求暴露在明文链路中。
  remediation: |
    - 按业务需要配置 HSTS、CSP、X-Frame-Options、X-Content-Type-Options、Referrer-Policy 等安全响应头。
    - 避免把 HTTPS 请求降级重定向到 HTTP，统一使用安全协议和正确的跳转规则。
    - 上线后通过自动化检查和网关策略持续验证响应头配置。
  metadata:
    verified: true
    max-request: 1
  tags: misconfig,http,https,vuln

http:
  - method: GET
    path:
      - "{{BaseURL}}"

    matchers-condition: or
    matchers:
      - type: dsl
        dsl:
          - 'startswith(tolower(location), "http://")'
          - 'startswith(tostring(BaseURL), "https://")'
          - '(status_code == 300 || status_code == 301 || status_code == 302 || status_code == 303 || status_code == 307 || status_code == 308)'
        condition: and

      - type: dsl
        dsl:
          - 'startswith(tostring(BaseURL), "https://")'
          - 'status_code == 200'
          - 'contains(tolower(body), "<meta http-equiv=\"refresh\" content=\"0; url=http://")'
        condition: and
