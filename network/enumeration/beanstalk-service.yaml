id: beanstalk-service

info:
  name: Beanstalk 队列服务识别（指纹识别）
  author: pussycat0x
  severity: info
  description: |
    Beanstalkd 是轻量级工作队列服务，常用于异步任务投递、延迟任务和后台作业处理。该模板连接 11300/TCP 并发送服务命令探测，通过 `cmd-release`、`cmd-peek` 等帮助信息识别 Beanstalk 队列服务。
  reference:
    - https://jhadiary.wordpress.com/2016/05/18/beanstalk-helping-commands/
  metadata:
    verified: true
    max-request: 1
    shodan-query: port:11300 "cmd-peek"
  tags: network,beanstalk,detect,enum,tcp,discovery
tcp:
  - inputs:
      - data: "stats\r\n"
        read: 8

    host:
      - "{{Hostname}}"
    port: 11300

    matchers:
      - type: word
        part: raw
        words:
          - "cmd-release"
          - "cmd-peek"
        condition: and

    extractors:
      - type: regex
        name: stats
        regex:
          - '([a-z-A-Z: 0-9]+)'
