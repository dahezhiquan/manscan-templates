id: rstudio-panel

info:
  name: RStudio Sign In 面板识别（暴露面识别）
  author: DhiyaneshDk
  severity: info
  description: |
    该模板通过识别 RStudio Sign In 面板、控制台或管理界面的页面特征，判断目标是否暴露了对应服务入口。若命中，说明该后台或运维界面对外可访问，可用于资产识别与暴露面排查。
  metadata:
    max-request: 1
    shodan-query: title:"RStudio Sign In"
  tags: rstudio,login,panel,discovery

http:
  - method: GET
    path:
      - "{{BaseURL}}/auth-sign-in?appUri=%2F"

    host-redirects: true
    max-redirects: 2

    matchers-condition: and
    matchers:
      - type: word
        part: body
        words:
          - "<title>RStudio Sign In</title>"

      - type: status
        status:
          - 200
