id: bower-json

info:
  name: bower.JSON 文件泄露（暴露面识别）
  author: oppsec,noraj
  severity: info
  description: |
    检测到对外可访问的 bower.JSON 文件。相关文件可能泄露项目结构、依赖关系、部署细节、敏感参数或其他不应公开的内部信息。
  reference:
    - https://github.com/bower/spec/blob/master/json.md
  metadata:
    max-request: 1
  tags: exposure,files,bower,vuln

http:
  - method: GET
    path:
      - "{{BaseURL}}/bower.json"

    matchers-condition: and
    matchers:
      - type: word
        part: body
        words:
          - "name"
          - "description"
          - "main"
        condition: and

      - type: word
        part: header
        words:
          - "application/json"

      - type: status
        status:
          - 200
