id: meteobridge-detect

info:
  name: MeteoBridge 指纹识别（指纹识别）
  author: rxerium
  severity: info
  description: |
    用于识别目标暴露的 MeteoBridge，模板会结合 HTTP 响应头、状态码和特定路径或已知端点判断是否存在对应技术或默认页面特征。
  reference:
    - https://www.meteobridge.com
  metadata:
    verified: true
    max-request: 1
    shodan-query: "meteobridge"
  tags: meteobridge,tech,detect,discovery

http:
  - method: GET
    path:
      - "{{BaseURL}}/cgi-bin/meteobridge.cgi"

    matchers-condition: and
    matchers:
      - type: word
        part: header
        words:
          - 'Basic realm="MeteoBridge"'

      - type: status
        status:
          - 401
