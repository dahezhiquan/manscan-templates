id: yii-debugger

info:
  name: View Yii Debugger Information暴露（暴露面识别）
  author: geeknik,rumble773
  severity: low
  description: |
    检测到目标站点可直接访问 View Yii Debugger Information。Yii Debugger 用于调试 Yii 应用请求、配置和运行状态，生产环境公开会泄露大量应用内部信息。该模板请求 `/debug/default/view.html`、`/debug/default/view`、`/frontend/web/debug/default/view` 等路径，并通过 HTTP 状态码、响应正文关键字、文件格式特征、正则匹配或响应头进行确认。配置文件公开后可能泄露部署细节、内部路径、依赖版本、环境变量、访问凭据或调试信息，增加被侦察和后续利用的风险。
  impact: |-
    - 调试、状态、历史或转储文件可能泄露环境变量、内存片段、命令历史、内部路径、组件版本和运行参数。
    - 攻击者可利用这些细节筛选已知漏洞、还原业务流程、定位敏感文件或制定更精确的后续攻击路径。
    - 部分历史或转储内容可能直接包含凭据、请求数据、SQL 语句或用户信息，扩大敏感数据泄露范围。
  remediation: |-
    - 关闭生产环境中的调试、状态、历史、转储、phpinfo、探针和未受保护的运行信息页面。
    - 将历史记录、崩溃转储和调试产物从 Web 可访问目录移除，并清理 CDN、对象存储和搜索引擎缓存。
    - 检查文件中是否包含凭据、请求数据、SQL 语句或用户信息，必要时执行密钥轮换和受影响账号处置。
    - 复核相关组件版本和配置，修复因暴露信息指向的弱配置或已知漏洞。
  reference:
    - https://yii2-framework.readthedocs.io/en/stable/guide/tool-debugger/
  classification:
    cpe: cpe:2.3:a:yii_software:yii:*:*:*:*:*:*:*:*
  metadata:
    verified: true
    max-request: 6
    vendor: yii_software
    product: yii
    shodan-query: title:"Yii Debugger"
  tags: yii,debug,exposure,vuln

http:
  - method: GET
    path:
      - "{{BaseURL}}/debug/default/view.html"
      - "{{BaseURL}}/debug/default/view"
      - "{{BaseURL}}/frontend/web/debug/default/view"
      - "{{BaseURL}}/web/debug/default/view"
      - "{{BaseURL}}/sapi/debug/default/view"
      - "{{BaseURL}}/debug/default"

    host-redirects: true
    max-redirects: 2
    stop-at-first-match: true

    matchers-condition: and
    matchers:
      - type: word
        words:
          - "<title>Yii Debugger</title>"
          - "Status"
          - "Route"
          - "Log"
          - "Time"
          - "Memory"
          - "DB"
        condition: and

      - type: status
        status:
          - 200
