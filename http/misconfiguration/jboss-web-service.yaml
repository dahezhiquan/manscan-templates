id: jboss-web-service

info:
  name: JBoss Web 服务控制台暴露
  author: DhiyaneshDK
  severity: low
  description: |
    该模板用于核查 JBoss Web 服务控制台暴露。该类问题通常源于管理面板、仪表盘或监控控制台暴露在公网或缺少足够访问控制。模板会向目标发送探测请求，并依据请求 `/jbossws/services`、匹配 `JBossWS/Services</div>`、匹配 `no endpoints deployed`、状态码 200 等证据确认目标是否存在该配置问题。
  impact: |
    - 攻击者可获取系统状态、业务指标、任务信息、拓扑结构或管理入口线索。
    - 若面板存在默认凭据、弱认证或操作接口，可能进一步导致未授权管理或服务接管。
  remediation: |
    - 将管理面板和仪表盘限制在内网、VPN 或可信访问网关后。
    - 启用强认证、多因素认证、细粒度授权和操作审计。
    - 隐藏或关闭不需要公开的默认面板，并监控异常访问与暴力探测。
  reference:
    - https://github.com/PortSwigger/j2ee-scan/blob/master/src/main/java/burp/j2ee/issues/impl/JBossWS.java
  metadata:
    verified: true
    max-request: 1
    shodan-query: html:"JBossWS"
  tags: jboss,misconfig,vuln

http:
  - method: GET
    path:
      - '{{BaseURL}}/jbossws/services'

    matchers-condition: and
    matchers:
      - type: word
        part: body
        words:
          - 'JBossWS/Services</div>'
        case-insensitive: true

      - type: word
        part: body
        words:
          - 'no endpoints deployed'
        negative: true

      - type: status
        status:
          - 200
