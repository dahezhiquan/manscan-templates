id: kafka-cruise-control

info:
  name: Kafka Cruise Control UI 检测
  author: dhiyaneshDK
  severity: medium
  description: |
    检测到 Kafka Cruise Control UI 检测。目标响应或文件中可能暴露配置、凭据、密钥、令牌、环境变量或历史记录等敏感信息，可能被用于进一步入侵。
  metadata:
    max-request: 1
    shodan-query: http.title:"Kafka Cruise Control UI"
  tags: kafka,misconfig,vuln

http:
  - method: GET
    path:
      - '{{BaseURL}}'

    host-redirects: true
    max-redirects: 2
    matchers:
      - type: word
        words:
          - '<title>Kafka Cruise Control UI</title>'
