id: regify-panel

info:
  name: Regify 登录面板识别（指纹识别）
  author: righettod
  severity: info
  description: |-
    Regify 是安全通信和文档交换平台，用于加密消息、文件交付和身份认证。该模板请求 `/phpLogin.php` 路径，并依据 HTTP 200 状态码、页面标题、正文关键字或品牌资源特征识别目标是否部署了该系统或暴露了对应入口，适用于资产指纹确认；命中结果仅表示系统特征匹配，不代表已确认存在未授权访问或可利用漏洞。
  reference:
  - https://www.regify.com/
  metadata:
    verified: true
    max-request: 1
    shodan-query: http.favicon.hash:1817615343
  tags: panel,regify,login,detect,discovery

http:
  - method: GET
    path:
      - '{{BaseURL}}/phpLogin.php'

    matchers-condition: and
    matchers:
      - type: word
        part: body
        words:
          - 'regify'
          - 'regibill'
          - 'regify_default.css'
        condition: and
        case-insensitive: true

      - type: status
        status:
          - 200

    extractors:
      - type: regex
        part: body
        group: 1
        regex:
          - '(?i)appv=([0-9.-]+)'
