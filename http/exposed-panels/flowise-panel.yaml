id: flowise-panel

info:
  name: Flowise 面板识别（指纹识别）
  author: rxerium
  severity: info
  description: |
    该模板用于识别 Flowise 是否存在对外暴露的管理、服务或状态界面。若命中，说明目标公开了相关功能入口，可作为资产盘点与攻击面收敛的依据。
  reference:
    - https://github.com/FlowiseAI/Flowise
    - https://flowiseai.com/
  metadata:
    verified: true
    max-request: 1
    vendor: FlowiseAI
    product: flowise
    shodan-query: 'http.title:"Flowise - Build AI Agents, Visually"'
  tags: panel,flowise,llm,ai,detect,discovery

http:
  - method: GET
    path:
      - "{{BaseURL}}"

    host-redirects: true
    max-redirects: 2

    matchers-condition: and
    matchers:
      - type: word
        part: body
        words:
          - "<title>Flowise - Build AI Agents, Visually</title>"

      - type: status
        status:
          - 200
