id: dockwatch-panel

info:
  name: Dockwatch 面板识别（指纹识别）
  author: s4e-io
  severity: info
  description: |-
    检测到目标站点存在 Dockwatch 相关响应特征。Dockwatch 是监控、日志、分析或可观测性系统，用于展示运行指标、告警事件、日志数据和服务状态。模板请求 `/login.php`，并通过页面标题或正文关键字、状态码、DSL 条件确认该系统指纹，用于资产识别、系统盘点和暴露面梳理。
  metadata:
    verified: true
    max-request: 1
    fofa-query: icon_hash="1991646591"
  tags: panel,login,dockwatch,detect,discovery
http:
  - method: GET
    path:
      - "{{BaseURL}}/login.php"

    matchers:
      - type: dsl
        dsl:
          - 'contains_any(body, "dockwatch-maintenance", "Restart Dockwatch")'
          - 'status_code == 200'
        condition: and
