id: avtech-dvr-ssrf

info:
  name: AVTECH DVR - 服务端请求伪造漏洞
  author: ritikchaddha
  severity: medium
  description: |
    该模板用于检测 AVTECH DVR - 服务端请求伪造漏洞。该类漏洞通常源于服务端可被诱导请求攻击者指定的 URL 或内部地址。模板主要向 `/cgi-bin/nobody/Search.cgi?action=scan` 等路径发送探测请求，并根据响应中的 `Search.Device`、`Proto=` 等特征确认漏洞是否存在。
  impact: |
    - 攻击者可诱使服务器向内网地址、云元数据地址或外部攻击者控制的地址发起请求。
    - 成功利用后可能泄露云临时凭据、探测内网服务、访问未暴露管理接口或触发二次漏洞。
  remediation: |
    - 对服务端发起请求的目标地址实施严格 allowlist，禁止访问本地地址、内网网段和云元数据地址。
    - 禁用不必要的远程 URL 加载功能，并对重定向、DNS 解析和协议类型进行约束。
    - 在网络层限制应用服务器的出站访问，审计异常外联和元数据接口访问记录。
  classification:
    cwe-id: CWE-918
  metadata:
    verified: true
    max-request: 1
    shodan-query: title:"login" product:"Avtech"
    fofa-query: app="AVTECH-视频监控"
  tags: ssrf,avtech,unauth,iot,vuln

http:
  - method: GET
    path:
      - "{{BaseURL}}/cgi-bin/nobody/Search.cgi?action=scan"

    matchers-condition: and
    matchers:
      - type: word
        part: body
        words:
          - 'Search.Device'
          - 'Proto='
          - 'IPAddress='
        condition: and

      - type: word
        part: header
        words:
          - text/plain

      - type: status
        status:
          - 200
