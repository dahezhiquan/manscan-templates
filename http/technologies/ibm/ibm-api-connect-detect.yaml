id: ibm-api-connect-detect

info:
  name: IBM API Connect Developer Portal 指纹识别（指纹识别）
  author: righettod
  severity: info
  description: >-
    IBM API Connect Developer Portal 是 API Connect 的开发者门户，用于发布 API 文档、订阅和开发者自助接入。该模板通过请求目标服务并检查预设路径或首页响应、页面正文关键字、正则特征、favicon
    哈希、DSL 条件等指纹特征，判断目标是否使用 IBM API Connect Developer Portal；命中结果仅表示指纹特征匹配，可用于资产盘点、技术栈识别和后续安全评估，不代表已确认存在可利用漏洞。
  reference:
  - https://github.com/ibm-apiconnect/devportal
  - https://www.ibm.com/products/api-connect/developer-portal
  metadata:
    verified: true
    max-request: 3
    shodan-query: http.favicon.hash:"801517258"
  tags: tech,ibm,detect,discovery
http:
  - method: GET
    path:
      - '{{BaseURL}}'
      - '{{BaseURL}}/favicon.ico'
      - '{{BaseURL}}/modules/ibm_apim/ibm_apim.info.yml'

    stop-at-first-match: true
    matchers:
      - type: dsl
        dsl:
          - 'contains_any(to_lower(body), "ibm developer portal is ready", "package: ibm api developer")'
          - '("801517258" == mmh3(base64_py(body)))'
        condition: or

    extractors:
      - type: regex
        part: body
        group: 1
        regex:
          - '(?i)version:\s+([0-9a-z\-_.]+)'
