id: bentoml-openllm-panel

info:
  name: OpenLLM 面板识别（指纹识别）
  author: rxerium
  severity: info
  description: |-
    检测到目标站点存在 OpenLLM 相关响应特征。OpenLLM 是 AI、LLM 或机器学习相关平台，用于管理模型、数据集、工作区、代理任务或可观测性信息。模板请求 `/`，并通过状态码、正则特征确认该系统指纹，用于资产识别、系统盘点和暴露面梳理。
  reference:
    - https://github.com/bentoml/OpenLLM
    - https://bentoml.com
  metadata:
    verified: true
    max-request: 1
    vendor: BentoML
    product: OpenLLM
    shodan-query: 'http.title:"OpenLLM"'
  tags: panel,openllm,bentoml,llm,ai,detect,discovery
http:
  - method: GET
    path:
      - "{{BaseURL}}"

    host-redirects: true
    max-redirects: 2

    matchers-condition: and
    matchers:
      - type: regex
        part: body
        regex:
          - '(?i)<title>[^<]*OpenLLM[^<]*</title>'

      - type: status
        status:
          - 200
