id: veeam-backup-manager-login

info:
  name: Veeam Backup Enterprise Manager 登录面板识别（指纹识别）
  author: Charles D
  severity: info
  description: |-
    Veeam Backup Enterprise Manager 是 Veeam 备份集中管理平台，用于备份作业、恢复、报表和权限管理。该模板请求 `/login.aspx`，并依据 HTTP 200 状态码、页面标题、正文关键字或品牌资源特征识别目标是否部署了该系统或暴露了对应入口，适用于资产指纹确认；命中结果仅表示系统特征匹配，不代表已确认存在未授权访问或可利用漏洞。
  classification:
    cvss-metrics: CVSS:3.0/AV:N/AC:L/PR:N/UI:N/S:U/C:N/I:N/A:N
    cwe-id: CWE-200
  metadata:
    max-request: 1
    verified: true
    shodan-query:
    - title:"veeam backup enterprise manager"
    - http.favicon.hash:169658321
    - '"Set-Cookie: .ASPXANONYMOUS" http.html:"Veeam"'
    fofa-query:
    - title="veeam backup enterprise manager"
    - icon_hash="169658321"
  tags: veeam,panel,enterprise-manager,login,detect,discovery

http:
  - method: GET
    path:
      - "{{BaseURL}}/login.aspx"

    matchers-condition: and
    matchers:
      - type: word
        part: body
        words:
          - "Veeam Backup Enterprise Manager : Login"

      - type: status
        status:
          - 200

    extractors:
      - type: regex
        name: version
        group: 1
        regex:
          - login.bundle.js\?v=([\d\.]+)
