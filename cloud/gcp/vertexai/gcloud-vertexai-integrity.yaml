id: gcloud-vertexai-integrity

info:
  name: 完整性 监控 未Enabled 的Vertex AI Notebooks（云安全）
  author: princechaddha
  severity: medium
  description: Integrity Monitoring 可检测 Shielded VM 启动完整性变化，Vertex AI notebook 未启用时更难发现启动链或内核级篡改。本模板检查 gceSetup.shieldedInstanceConfig.enableIntegrityMonitoring，返回 {} 或 null 时报告完整性监控未启用。
  impact: |
    - 启动组件或内核被篡改时，安全团队缺少完整性告警信号。
    - Notebook 处理敏感模型、数据和凭据时，底层环境可信度降低。
  remediation: |
    - 为 Vertex AI notebook 启用 Shielded VM Integrity Monitoring。
    - 将完整性事件接入 Cloud Monitoring/Logging，定期复核异常启动或基线变化。
  reference:
    - https://www.trendmicro.com/cloudoneconformity/knowledge-base/gcp/VertexAI/enable-integrity-monitoring.html
    - https://cloud.google.com/vertex-ai/docs/workbench/user-managed/manage-instance
  metadata:
    vendor: google
    product: vertex-ai
  tags: cloud,devops,gcp,gcloud,vertexai,security,integrity,gcp-cloud-config,ai

flow: |
  code(1)
  for(let projectId of iterate(template.projectIds)){
    set("projectId", projectId)
    code(2)
  }

self-contained: true

code:
  - engine:
      - sh
      - bash
    source: |
      gcloud projects list --format="json(projectId)"

    extractors:
      - type: json
        name: projectIds
        internal: true
        json:
          - '.[].projectId'

  - engine:
      - sh
      - bash
    source: |
      gcloud workbench instances describe tm-vertex-ai-notebook-instance --location=us-central1-a --project=$projectId --format="yaml(gceSetup.shieldedInstanceConfig.enableIntegrityMonitoring)"

    matchers:
      - type: word
        words:
          - "{}"
          - "null"
        condition: or

    extractors:
      - type: dsl
        dsl:
          - '"Project " + projectId + " has Vertex AI notebook instances without integrity monitoring enabled"'
