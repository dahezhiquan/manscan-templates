id: octobercms-default-login

info:
  name: OctoberCMS 默认管理员账户发现（弱口令）
  author: princechaddha
  severity: high
  description: |
    该模板用于检测 OctoberCMS 是否仍可使用默认凭据或弱口令登录。模板主要向 `/backend/backend/auth/signin` 等认证入口发送请求，使用内置默认凭据组合进行认证尝试，并根据响应中的 `october_session=`、`admin_auth=` 等登录成功特征判断登录是否成功；命中说明目标未及时修改出厂、示例或初始化账号口令。
  impact: |
    - 攻击者可登录 OctoberCMS 后台，管理内容、用户、插件、主题、文件、表单或业务流程配置。
    - 后台权限被滥用后，可能导致页面篡改、恶意文件上传、敏感资料泄露，或进一步取得服务器执行能力。
  remediation: |
    - 立即修改默认管理员凭据，删除安装向导、演示账号和不必要的后台用户。
    - 限制后台登录入口访问来源，启用多因素认证、登录失败锁定和验证码等防护。
    - 检查近期内容、插件、主题、文件上传和管理员操作记录，确认没有持久化后门。
  reference:
    - https://github.com/octobercms/october
    - https://octobercms.com/
  classification:
    cvss-metrics: CVSS:3.0/AV:N/AC:L/PR:N/UI:N/S:C/C:L/I:L/A:L
    cvss-score: 8.3
    cwe-id: CWE-522
    cpe: cpe:2.3:a:octobercms:october:*:*:*:*:*:*:*:*
  metadata:
    verified: true
    max-request: 4
    shodan-query: http.component:"October CMS"
    product: october
    vendor: octobercms
  tags: octobercms,default-login,oss,vuln

http:
  - raw:
      - |
        GET /backend/backend/auth/signin HTTP/1.1
        Host: {{Hostname}}
        Origin: {{BaseURL}}
      - |
        POST /backend/backend/auth/signin HTTP/1.1
        Host: {{Hostname}}
        Origin: {{BaseURL}}
        Content-Type: application/x-www-form-urlencoded

        _token={{token}}&postback=1&login={{username}}&password={{password}}

    attack: clusterbomb
    payloads:
      username:
        - admin
      password:
        - admin
        - ""

    matchers-condition: and
    matchers:
      - type: word
        part: header
        words:
          - "october_session="
          - "admin_auth="
        condition: and

      - type: status
        status:
          - 302

    extractors:
      - type: regex
        part: body
        name: token
        internal: true
        group: 1
        regex:
          - 'meta name="csrf\-token" content="([A-Za-z0-9]+)">'
