id: netbios-ssn-detect

info:
  name: NetBIOS 会话服务 netbios-ssn 识别（指纹识别）
  author: dahezhiquan
  severity: info
  description: |
    NetBIOS 会话服务通常通过 TCP 139 为 SMB 等上层协议提供会话传输。该模板使用 Nmap SMBProgNeg 探针，覆盖该探针下全部 18 条启用的 netbios-ssn 指纹规则，包括会话确认、会话拒绝以及 Samba、Thursby DAVE、NetWare、NetApp 和多种打印设备的 SMB 协商响应。
    按原规则保留固定字节、变长字段、字符范围和匹配边界，并累计读取分段响应后执行十六进制匹配。命中仅确认 netbios-ssn 服务，不代表存在漏洞，也不单独输出厂商、操作系统或版本结论。
  reference:
    - https://github.com/nmap/nmap/blob/master/nmap-service-probes
    - https://www.rfc-editor.org/rfc/rfc1002
  metadata:
    max-request: 1
    product: netbios-ssn
    shodan-query: 'port:139'
  tags: netbios-ssn,network,detect,tcp,discovery

tcp:
  - inputs:
      - data: ""
        type: hex
        read: 1

    host:
      - "{{Hostname}}"
    port: 139
    read-all: true

    matchers:
      - type: dsl
        name: netbios-ssn
        dsl:
          - "regex('^000000[0-9a-f]{2}ff534d4272000000008801000000000000000000000000000000400600000100110600(?:[0-9a-f]{2})*(?:[0-289a-f][0-9a-f]|3[a-f]|[46]0|5[b-e]|7[b-f])(?:(?:(?:2[de]|3[0-9]|[46][1-9a-f]|5[0-9af]|7[0-9a]))+)00(?:0a)?$', hex_encode(raw))"
          - "regex('^000000[0-9a-f]{2}ff534d42720000000088[0-9a-f]{2}[0-9a-f]{2}0000(?:(?:2[0de]|3[0-9]|[46][1-9a-f]|5[0-9af]|7[0-9a]))*(?:00)+400600000100110600[0-9a-f]{84}(?:(?:[0-9a-f]{2})*)0000(?:(?:[0-9a-f]{2})*)0000(?:0a)?$', hex_encode(raw))"
          - "regex('^000000[0-9a-f]{2}ff534d42720000000088[0-9a-f]{2}[0-9a-f]{2}0000(?:(?:2[0de]|3[0-9]|[46][1-9a-f]|5[0-9af]|7[0-9a]))*(?:00)+400600000100110600(?:[0-9a-f]{2})*(?:(?:0[1-9a-f]|[1-9a-f][0-9a-f])|(?:[016-9a-f][0-9a-f]|2[0-9a-cef]|3[a-f]|40|5[b-e])00)(?:(?:(?:2d|3[0-9]|[46][1-9a-f]|5[0-9af]|7[0-9a])00){2,50})', hex_encode(raw))"
          - "regex('^000000[0-9a-f]{2}ff534d42720000000088[0-9a-f]{2}[0-9a-f]{2}0000000000000000000000000000400600000100110600[0-9a-f]{2}[0-9a-f]{2}000100[0-9a-f]{2}[0-9a-f]{2}0000[0-9a-f]{2}[0-9a-f]{2}[0-9a-f]{2}00[0-9a-f]{2}[0-9a-f]{2}0000', hex_encode(raw))"
          - "regex('^8300000181(?:0a)?$', hex_encode(raw))"
          - "regex('^000000[0-9a-f]{2}ff534d42720000000088[0-9a-f]{2}[0-9a-f]{2}000000000000000000000000000040060000010001ffff0000(?:0a)?$', hex_encode(raw))"
          - "regex('^000000[0-9a-f]{2}ff534d4272020059009801[0-9a-f]{2}0000000000000000000000000000400600000100000700', hex_encode(raw))"
          - "regex('^830000018f(?:0a)?$', hex_encode(raw))"
          - "regex('^0000004dff534d42720000000080010000000000000000000000000000004006000001001107000332000100ffff000000000100', hex_encode(raw))"
          - "regex('^000000[0-9a-f]{2}ff534d4272000000009801000000000000000000000000000000400600000100110700(?:[0-9a-f]{2})*(?:(?:0[1-9a-f]|[1-9a-f][0-9a-f])|(?:[016-9a-f][0-9a-f]|2[0-9a-cef]|3[a-f]|40|5[b-e])00)(?:(?:(?:2d|3[0-9]|[46][1-9a-f]|5[0-9af]|7[0-9a])00){2,50})', hex_encode(raw))"
          - "regex('^000000(?:0[0-9b-f]|[1-9a-f][0-9a-f])ff534d4272000000009801000000000000000000000000000000400600000100110700(?:(?:0[0-9b-f]|[1-9a-f][0-9a-f]))*(?:[0-289a-f][0-9a-f]|3[a-f]|[46]0|5[b-e]|7[b-f])(?:(?:(?:2[de]|3[0-9]|[46][1-9a-f]|5[0-9af]|7[0-9a]))+)00(?:0a)?$', hex_encode(raw))"
          - "regex('^0000004dff534d4272000000008800000000000000000000000000000000400600000100110700020200010000800000000001000100000000020000', hex_encode(raw))"
          - "regex('^820000000a2d3e20646f487474703a20436f6e6e656374696f6e2074696d656f75746564210a0a74656c6e6574643a20546869732073797374656d202a494e205553452a207669612074656c6e65742e0a7368656c6c207265737461727465642e0a0808080820202020202020202a2a2a20204550534f4e204e6574776f726b205072696e74205365727665722028(?:(?:(?:[013-9a-f][0-9a-f]|2[0-8a-f]))+)2920202a2a2a0a0a0808080820202020202020200a50617373776f72643a20', hex_encode(raw))"
          - "regex('^0000004dff534d42720000000098[0-9a-f]{2}200000000000000000000000000000004006000001001107000332000100[0-9a-f]{2}[0-9a-f]{2}[0-9a-f]{2}[0-9a-f]{2}00000100[0-9a-f]{2}[0-9a-f]{2}[0-9a-f]{2}[0-9a-f]{2}f4c20000', hex_encode(raw))"
          - "regex('^0000004dff534d42720000000098010000000000000000000000000000004006000001001107000201000100ffff0000ffff00000000000001020000', hex_encode(raw))"
          - "regex('^00000047ff534d42720000000088000000000000000000000000000000004006000001000d04000000a00502000100000000000000000000000000000000000000574f524b47524f555000(?:0a)?$', hex_encode(raw))"
          - "regex('^00000047ff534d42720000000088000000000000000000000000000000004006000001000d04000000a00502000100000000000000000000000000000000000000', hex_encode(raw))"
          - "regex('^82000000(?:0a)?$', hex_encode(raw))"
        condition: or
