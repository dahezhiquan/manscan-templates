id: api-web3storage

info:
  name: Web3 Storage API Token 可用性校验（token喷洒）
  author: daffainfo
  severity: info
  description: 该模板通过调用 Web3 Storage API 的已知接口验证提供的 token 是否有效，命中后通常表示可访问文件存储与分发能力。
  reference:
    - https://docs.web3.storage/
    - https://github.com/daffainfo/all-about-apikey/tree/main/web3-storage
  metadata:
    max-request: 1
  tags: token-spray,web3storage,intrusive

self-contained: true

http:
  - raw:
      - |
        GET https://api.web3.storage/user/uploads HTTP/1.1
        Host: api.web3.storage
        Authorization: Bearer {{token}}

    matchers:
      - type: word
        part: body
        words:
          - '"created"'
          - '"cid"'
        condition: and
