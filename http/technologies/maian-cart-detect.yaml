id: maian-cart-detect

info:
  name: Maian Cart 指纹识别（指纹识别）
  author: pdteam
  severity: info
  description: >-
    Maian Cart 是 PHP 购物车和电商系统，用于管理商品、订单和在线销售流程。该模板通过请求目标服务并检查预设路径或首页响应、favicon 哈希、DSL
    条件等指纹特征，判断目标是否使用或暴露了 Maian Cart 相关组件；命中结果仅表示指纹特征匹配，可用于资产盘点、技术栈识别和后续安全评估，不代表已确认存在可利用漏洞。
  metadata:
    max-request: 1
  tags: tech,maian,discovery
http:
  - method: GET
    path:
      - "{{BaseURL}}/favicon.ico"

    matchers:
      - type: dsl
        dsl:
          - "status_code==200 && (\"-498581627\" == mmh3(base64_py(body)))"
