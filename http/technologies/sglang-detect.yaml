id: sglang-detect

info:
  name: SGLang - 检测（指纹识别）
  author: insidetrust,hdm
  severity: info
  description: |-
    检测 SGLang，一个提供 OpenAI 兼容 API 的高性能 LLM 服务框架（默认端口 30000）。该模板通过检查独特的 /get_model_info 端点（返回 "model_path" 和 "is_generation"）以及以 "sglang:" 为前缀的 Prometheus 指标来识别 SGLang。未认证的服务器会暴露推理访问权限，并泄露底层模型路径，若发现则予以提取。
  reference:
    - https://github.com/sgl-project/sglang
    - https://docs.sglang.ai/backend/openai_api_completions.html
  metadata:
    verified: true
    max-request: 2
    vendor: sgl-project
    product: sglang
    shodan-query: http.html:"is_generation"
  tags: tech,detect,sglang,llm

http:
  - method: GET
    path:
      - "{{BaseURL}}/get_model_info"
      - "{{BaseURL}}/metrics"

    stop-at-first-match: true
    matchers-condition: or
    matchers:
      - type: dsl
        dsl:
          - 'status_code == 200'
          - 'contains_all(body, "\"model_path\"", "\"is_generation\"") || contains(body, "sglang")'
        condition: and
