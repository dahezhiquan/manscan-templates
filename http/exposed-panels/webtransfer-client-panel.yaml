id: webtransfer-client-panel

info:
  name: Web Transfer Client 登录面板识别（指纹识别）
  author: righettod
  severity: info
  description: Web Transfer Client 是 Web 文件传输客户端，用于用户登录、上传下载和文件交换。该模板请求 `/ThinClient/WTM/public/index.html`，并依据 DSL 条件识别目标是否部署了该系统或暴露了对应入口，适用于资产指纹确认；命中结果仅表示系统特征匹配，不代表已确认存在未授权访问或可利用漏洞。
  reference:
  - https://www.progress.com/ftp-server/web-transfer
  classification:
    cpe: cpe:2.3:a:progress:moveit_transfer:*:*:*:*:*:*:*:*
  metadata:
    verified: true
    max-request: 1
    vendor: progress
    product: moveit_transfer
    shodan-query: http.title:"Web Transfer Client"
  tags: panel,webtransferclient,login,detect,discovery

http:
  - method: GET
    path:
      - "{{BaseURL}}/ThinClient/WTM/public/index.html"

    matchers:
      - type: dsl
        dsl:
          - 'status_code == 200'
          - 'contains(body, "<title>Web Transfer Client")'
        condition: and
