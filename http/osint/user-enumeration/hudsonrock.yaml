id: hudsonrock

info:
  name: HudsonRock 用户名信息枚举（OSINT）
  author: princechaddha,rxerium
  severity: info
  description: |
    HudsonRock 是面向安全研究、漏洞众测或安全社区的在线平台，用户资料页通常会公开展示研究者身份、报告活动或社区贡献信息。该模板用于在公开互联网侧枚举 HudsonRock 用户名，不需要认证；模板请求公开路径 https://cavalier.hudsonrock.com/api/json/v2/osint-tools/search-by-username?username=用户名，并结合响应状态为 200、页面或响应内容命中 “This username is associated with a...”、“hudsonrock.com” 等资料页特征判断目标用户名是否存在。该检查属于 OSINT 用户枚举，结果仅表示公开资料页或公开搜索结果可被访问，不代表目标平台存在可直接修复的漏洞。
  classification:
    cvss-metrics: CVSS:3.1/AV:N/AC:L/PR:N/UI:N/S:U/C:N/I:N/A:N
    cvss-score: 0
    cwe-id: CWE-200
  metadata:
    max-request: 1
    verified: true
  tags: osint,osint-security,hudsonrock,discovery

self-contained: true

http:
  - method: GET
    path:
      - "https://cavalier.hudsonrock.com/api/json/v2/osint-tools/search-by-username?username={{user}}"

    matchers-condition: and
    matchers:
      - type: status
        status:
          - 200

      - type: word
        part: body
        words:
          - "This username is associated with a computer that was infected by an info-stealer"
          - "hudsonrock.com"
        condition: and
