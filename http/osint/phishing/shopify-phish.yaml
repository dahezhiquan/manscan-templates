id: shopify-phish

info:
  name: Shopify 仿冒钓鱼网站（钓鱼网站识别）
  author: rxerium
  severity: info
  description: |
    检测到疑似仿冒 Shopify 的钓鱼网站。模板在目标页面返回 200、页面内容命中 Shopify 的品牌页面特征，且当前主机不属于 shopify.com、myshopify.com 官方域名时触发，用于识别借用 Shopify 品牌页面诱导用户信任的仿冒站点。
  reference:
    - https://shopify.com
  metadata:
    max-request: 1
  tags: phishing,shopify,ecommerce,osint,discovery
http:
  - method: GET
    path:
      - "{{BaseURL}}"

    host-redirects: true
    max-redirects: 2

    matchers-condition: and
    matchers:
      - type: word
        words:
          - "Try Shopify free and start a business or grow an existing one. Get more than ecommerce software with tools to manage every part of your business."
          - 'Start your free trial'
        condition: or

      - type: status
        status:
          - 200

      - type: dsl
        dsl:
          - '!contains(host,"shopify.com")'
          - '!contains(host,"myshopify.com")'
