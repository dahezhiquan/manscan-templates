id: ngsurvey-panel

info:
  name: ngSurvey 登录面板识别（指纹识别）
  author: righettod
  severity: info
  description: |-
    检测到目标站点存在 ngSurvey 相关响应特征。ngSurvey 是 AI、机器学习或 Notebook 相关平台，用于管理模型、数据集、工作区、实验、推理服务或训练任务。模板请求 `/home/login`，并通过页面标题或正文关键字、状态码、DSL 条件确认该系统指纹，用于资产识别、系统盘点和暴露面梳理。
  reference:
    - https://www.ngsurvey.com/
  metadata:
    max-request: 1
    verified: true
    shodan-query: http.title:"ngSurvey enterprise survey software"
  tags: panel,ngsurvey,login,detect,discovery
http:
  - method: GET
    path:
      - "{{BaseURL}}/home/login"

    matchers:
      - type: dsl
        dsl:
          - 'status_code == 200'
          - 'contains_all(to_lower(body), "<title>ngsurvey enterprise survey software</title>", "ngsconfig.js")'
        condition: and
