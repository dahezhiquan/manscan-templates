id: db-xml-file

info:
  name: db.XML 文件 检测（暴露面识别）
  author: tess
  severity: medium
  description: 检测到对外可访问的 db.XML 文件。相关文件可能泄露项目结构、依赖关系、部署细节、敏感参数或其他不应公开的内部信息。
  classification:
    cvss-metrics: CVSS:3.1/AV:N/AC:L/PR:N/UI:N/S:U/C:L/I:N/A:N
    cvss-score: 5.3
    cwe-id: CWE-200
  metadata:
    verified: true
    max-request: 1
  tags: misconfig,db,files,exposure,vuln

http:
  - method: GET
    path:
      - "{{BaseURL}}/db.xml"

    host-redirects: true
    max-redirects: 2

    matchers-condition: and
    matchers:
      - type: word
        part: body
        words:
          - "<ServerName>"
          - "<DBPASS>"
          - "<DBtype>"
        condition: and

      - type: status
        status:
          - 200
