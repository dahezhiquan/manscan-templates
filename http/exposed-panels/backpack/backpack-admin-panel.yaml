id: backpack-admin-panel

info:
  name: Laravel Backpack Admin 登录面板识别（暴露面识别）
  author: shine
  severity: info
  description: |
    该模板通过识别 Laravel Backpack Admin 登录入口的页面标题、特征文本或重定向行为，判断目标是否暴露了对应的认证界面。若命中，说明该登录面板对外可访问，可用于暴露面梳理与后续安全评估。
  classification:
    cvss-metrics: CVSS:3.0/AV:N/AC:L/PR:N/UI:N/S:U/C:N/I:N/A:N
    cwe-id: CWE-200
    cpe: cpe:2.3:a:backpackforlaravel:backpack\\\\crud:*:*:*:*:*:*:*:*
  metadata:
    max-request: 1
    shodan-query: title:"Backpack Admin"
    verified: true
    product: backpack\\\\crud
    vendor: backpackforlaravel
  tags: panel,backpack,admin,discovery

http:
  - method: GET
    path:
      - "{{BaseURL}}/admin/login"

    matchers:
      - type: word
        part: body
        words:
          - 'Backpack Admin'
          - 'backpack_alerts'
        condition: or
