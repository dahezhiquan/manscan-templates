id: helpdesk-sysaid-panel

info:
  name: SysAid 登录面板识别（指纹识别）
  author: pdteam,darses
  severity: info
  description: |-
    检测到目标站点存在 SysAid 相关响应特征。SysAid 是 AI、LLM 或机器学习相关平台，用于管理模型、数据集、工作区、推理服务或生成任务。模板请求 `/Login.jsp`、`/InvalidAccount.jsp`、`/favicon.ico` 路径，并通过页面标题或正文关键字、状态码、favicon 哈希、DSL 条件确认该系统指纹，用于资产识别、系统盘点和暴露面梳理。
  classification:
    cvss-metrics: CVSS:3.0/AV:N/AC:L/PR:N/UI:N/S:U/C:N/I:N/A:N
    cwe-id: CWE-200
    cpe: cpe:2.3:a:sysaid:sysaid:*:*:*:*:*:*:*:*
  metadata:
    max-request: 3
    vendor: sysaid
    product: sysaid
    shodan-query: http.favicon.hash:1540720428
    fofa-query: icon_hash=1540720428
  tags: panel,sysaid,helpdesk,detect,discovery
http:
  - method: GET
    path:
      - "{{BaseURL}}/Login.jsp"
      - "{{BaseURL}}/InvalidAccount.jsp"
      - "{{BaseURL}}/favicon.ico"

    stop-at-first-match: true
    matchers:
      - type: dsl
        dsl:
          - "status_code==200 && contains(tolower(body), 'sysaid help desk software')"
          - "status_code==200 && contains(tolower(body), 'info@sysaid.com')"
          - "status_code==200 && ('1540720428' == mmh3(base64_py(body)))"
        condition: or

    extractors:
      - type: regex
        name: version
        part: body
        group: 2
        regex:
          - "(ajaxTools\\.js|master\\.css)\\?v([\\d\\.\\w]+)\""
