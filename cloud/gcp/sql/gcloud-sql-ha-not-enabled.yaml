id: gcloud-sql-ha-not-enabled

info:
  name: High Availability 未Enabled 的Cloud SQL Database Instances（云安全）
  author: princechaddha
  severity: high
  description: Cloud SQL 高可用配置可通过区域内备用实例降低单区故障影响，未启用会降低关键数据库可用性。本模板检查 settings.availabilityType，值为 ZONAL 时报告实例未启用 High Availability。
  impact: |
    - 单区故障、维护或底层资源异常可能导致数据库中断并延长恢复时间。
    - 关键业务缺少 HA 会影响 RTO/SLA，增加安全事件或故障期间的业务连续性风险。
  remediation: |
    - 为生产和关键 Cloud SQL 实例启用 REGIONAL 高可用配置。
    - 定期演练故障转移和恢复流程，并确认备份、连接串和应用重试策略与 HA 配置匹配。
  reference:
    - https://cloud.google.com/sql/docs/mysql/high-availability
  metadata:
    vendor: google
    product: cloud-sql
  tags: cloud,devops,gcp,gcloud,google-cloud-sql,gcp-cloud-config

flow: |
  code(1)
  for(let projectId of iterate(template.projectIds)){
    set("projectId", projectId)
    code(2)
    for(let sqlInstance of iterate(template.sqlInstances)){
      set("sqlInstance", sqlInstance)
      code(3)
    }
  }

self-contained: true

code:
  - engine:
      - sh
      - bash
    source: |
      gcloud projects list --format="json(projectId)"

    extractors:
      - type: json
        name: projectIds
        internal: true
        json:
          - '.[].projectId'

  - engine:
      - sh
      - bash
    source: |
      gcloud sql instances list --project $projectId --format="json(name)"

    extractors:
      - type: json
        name: sqlInstances
        internal: true
        json:
          - '.[].name'

  - engine:
      - sh
      - bash
    source: |
      gcloud sql instances describe $sqlInstance --format="value(settings.availabilityType)"

    matchers:
      - type: word
        words:
          - 'ZONAL'

    extractors:
      - type: dsl
        dsl:
          - '"High Availability is not enabled for Cloud SQL instance: " + sqlInstance + " in project: " + projectId'
