id: get-stored-credentials-cmdkey

info:
  name: 通过 cmdkey 获取已保存凭据（本地基线扫描）
  author: pussycat0x
  severity: high
  description: |
    Windows Credential Manager 中保存的网络、网站或远程计算机凭据可被本地会话枚举，若终端已被入侵，这些凭据会成为横向移动入口。模板执行 `cmdkey /list` 列出当前用户上下文保存的凭据目标，用于发现可复用的认证材料暴露面。
  impact: |
    - 攻击者可识别已保存的远程资源凭据目标，并进一步尝试调用、转储或复用这些凭据访问共享、RDP、WinRM 或业务系统。
    - 长期保存的凭据会扩大单台终端失陷后的影响范围。
  remediation: |
    - 清理不必要的已保存凭据，禁用或限制保存网络认证凭据的策略。
    - 对高价值账户使用短期凭据、MFA 和受管访问方式，并在终端失陷后轮换相关密码。
  metadata:
    verified: true
  tags: code,windows,privesc,ps,enum

self-contained: true

code:
  - engine:
      - powershell
      - powershell.exe

    args:
      - -ExecutionPolicy
      - Bypass
      - -File

    pattern: "*.ps1"

    source: |
      cmdkey /list

    extractors:
      - type: dsl
        dsl:
          - response
