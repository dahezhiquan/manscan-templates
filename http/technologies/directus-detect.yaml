id: directus-detect

info:
  name: Directus 指纹识别（指纹识别）
  author: ricardomaia
  severity: info
  description: |-
    Directus 是无头 CMS 和数据平台，用于数据库内容管理、API 发布和权限控制。该模板请求首页，并依据页面标题、正文关键字或品牌资源特征、响应头特征识别目标是否使用或暴露了 Directus 相关组件，适用于资产盘点、技术栈识别和后续安全评估；命中结果仅表示指纹特征匹配，不代表已确认存在可利用漏洞。
  reference:
  - https://directus.io/
  classification:
    cpe: cpe:2.3:a:monospace:directus:*:*:*:*:-:*:*:*
  metadata:
    verified: true
    max-request: 1
    vendor: monospace
    product: directus
    google-query: 'X-Powered-By: Directus'
  tags: tech,directus,detect,discovery

http:
  - method: GET
    path:
      - "{{BaseURL}}"

    matchers:
      - type: word
        part: header
        words:
          - "X-Powered-By: Directus"
        case-insensitive: true
