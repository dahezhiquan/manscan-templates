id: mx-service-detector

info:
  name: 邮件服务提供商识别（dns）
  author: binaryfigments,rxerium
  severity: info
  description: |
    不同邮件托管和邮件安全网关会使用稳定的 MX 域名。通过这些特征可以识别 Microsoft 365、Google Workspace、ProtonMail、Zoho、Proofpoint、Mimecast 等服务及区域网关。本模板查询 MX 记录，并根据预置的服务商域名特征进行匹配；命中是邮件服务指纹，不等于邮件配置存在漏洞。
  impact: |
    - 服务商和区域信息可帮助攻击者选择针对性的邮件钓鱼、登录攻击和供应链攻击路径。
    - 过期 MX 或未纳入资产管理的第三方网关可能造成邮件中断、告警丢失和邮件路由边界失控。
  remediation: |
    - 核对命中的 MX 与当前邮件架构、供应商合同和账户归属，删除迁移后遗留的记录。
    - 保护邮件服务管理员账户，启用多因素认证、异常登录监控和供应商侧反滥用控制。
    - 将邮件服务变更纳入 DNS 变更审批，并定期验证 MX 优先级和实际投递路径。
  classification:
    cwe-id: CWE-200
  metadata:
    max-request: 1
  tags: dns,service,discovery

dns:
  - name: "{{FQDN}}"
    type: MX

    matchers-condition: or
    matchers:
      - type: word
        name: "Office 365"
        words:
          - "mail.protection.outlook.com"
          - "mx.microsoft"

      - type: word
        name: "Google Apps"
        words:
          - "aspmx2.googlemail.com"
          - "aspmx3.googlemail.com"
          - "alt1.aspmx.l.google.com"
          - "alt2.aspmx.l.google.com"
          - "aspmx.l.google.com"

      - type: word
        name: "ProtonMail"
        words:
          - "mail.protonmail.ch"
          - "mailsec.protonmail.ch"

      - type: word
        name: "Zoho Mail"
        words:
          - "mx.zoho.eu"
          - "mx2.zoho.eu"
          - "mx3.zoho.eu"

      - type: word
        name: "ForcePoint Email Security"
        words:
          - "in.mailcontrol.com"

      - type: word
        name: "E-Zorg NL"
        words:
          - "spamfilter02.ezorg.nl"
          - "spamfilter01.ezorg.nl"
          - "spamfilter.ezorg.nl"
          - "spamfilter03.ezorg.nl"

      - type: word
        name: "Kerio Cloud EU"
        words:
          - "mx1.eu1.kerio.cloud"
          - "mx2.eu1.kerio.cloud"

      - type: word
        name: "Kerio Cloud US"
        words:
          - "mx1.us1.kerio.cloud"
          - "mx2.us1.kerio.cloud"
          - "mx3.us1.kerio.cloud"

      - type: word
        name: "Proofpoint EU"
        words:
          - "mx1-eu1.ppe-hosted.com"
          - "mx2-eu1.ppe-hosted.com"

      - type: word
        name: "Proofpoint US"
        words:
          - "mx1-us1.ppe-hosted.com"
          - "mx2-us1.ppe-hosted.com"

      - type: word
        name: "Mimecast"
        words:
          - "mimecast.com"

      - type: word
        name: "Cisco IronPort"
        words:
          - "iphmx.com"

      - type: word
        name: "Trellix (FireEye)"
        words:
          - "fireeyecloud.com"

      - type: word
        name: "Symantec MessageLabs"
        words:
          - "messagelabs.com"

      - type: word
        name: "MailSpamProtection"
        words:
          - "mailspamprotection.com"

      - type: word
        name: "Retarus"
        words:
          - "retarus.com"

      - type: word
        name: "Rackspace Email"
        words:
          - "emailsrvr.com"
