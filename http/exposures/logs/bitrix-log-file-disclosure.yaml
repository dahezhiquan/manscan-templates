id: bitrix-log-file-disclosure

info:
  name: Bitrix Site Manager 日志文件泄露（暴露面识别）
  author: 0x_Akoko
  severity: medium
  description: |
    检测到可直接访问的 Bitrix Site Manager 日志文件。日志、异常页面或调试输出通常会泄露堆栈信息、内部路径、查询语句、账号标识、令牌片段或业务数据，不应向未授权用户开放。
  reference:
    - https://dev.1c-bitrix.ru/learning/course/index.php?COURSE_ID=43&LESSON_ID=2795
    - https://dev.1c-bitrix.ru/api_help/main/general/error.php
  classification:
    cvss-metrics: CVSS:3.1/AV:N/AC:L/PR:N/UI:N/S:U/C:L/I:N/A:N
    cvss-score: 5.3
    cwe-id: CWE-532
  metadata:
    verified: true
    max-request: 2
    shodan-query: http.html:"bitrix"
    fofa-query: body="/bitrix/modules/"
  tags: exposure,bitrix,logs,files,disclosure

http:
  - method: GET
    path:
      - "{{BaseURL}}/bitrix/modules/updater.log"
      - "{{BaseURL}}/bitrix/modules/updater_partner.log"

    stop-at-first-match: true

    matchers-condition: and
    matchers:
      - type: word
        words:
          - "LICENSE_KEY"
          - "CUpdateClient"
          - "UPD_SUCCESS"
          - "UPD_ERROR"
          - "SUPD_VER"
          - "bitm_"
        condition: or

      - type: word
        part: content_type
        words:
          - "text/plain"

      - type: status
        status:
          - 200
