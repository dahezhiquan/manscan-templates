id: azure-keyvault-audit-not-enabled
info:
  name: Azure Key Vault 未启用审计日志（云安全）
  author: princechaddha
  severity: medium
  description: Azure Key Vault 保存密钥、证书和机密，诊断设置中的 AuditEvent 日志可记录对这些对象的访问和管理活动。未配置诊断日志会削弱对读取、修改和删除操作的追踪能力。本模板查询 Key Vault 资源的诊断设置日志，并在结果为空数组 [] 时报告未发现审计日志配置。
  impact: |
    - 对密钥、证书和机密的异常读取、修改或删除可能无法及时发现，形成高价值数据访问的审计盲区。
    - 发生凭据泄露或密钥滥用后，缺少操作证据会增加事件溯源、责任认定和合规取证难度。
  remediation: |
    - 为每个 Key Vault 创建诊断设置，将 AuditEvent 发送到 Log Analytics、Event Hub 或受控存储，并按要求设置保留期限。
    - 对高风险密钥读取、权限变更和删除操作配置告警，同时限制日志工作区的读取和删除权限，防止审计记录被一并篡改。
  reference:
    - https://docs.microsoft.com/en-us/azure/key-vault/general/overview-security
  metadata:
    vendor: microsoft
    product: azure-key-vault
  tags: cloud,devops,azure,microsoft,keyvault,azure-cloud-config

flow: |
  code(1);
  for (let VaultData of iterate(template.vaultNames)) {
    set("vaultName", VaultData);
    code(2);
  }

self-contained: true
code:
  - engine:
      - sh
      - bash
    source: |
      az keyvault list --query '[*].id' --output json

    extractors:
      - type: json
        name: vaultNames
        internal: true
        json:
          - '.[]'

  - engine:
      - sh
      - bash
    source: |
      az monitor diagnostic-settings list --resource $vaultName --query '[*].logs | []' --output json

    matchers:
      - type: word
        words:
          - '[]'

    extractors:
      - type: dsl
        dsl:
          - 'vaultName + " does not have AuditEvent logging enabled"'
