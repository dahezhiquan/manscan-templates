id: hyperdx-panel

info:
  name: HyperDX 面板识别（指纹识别）
  author: righettod
  severity: info
  description: |-
    检测到目标站点存在 HyperDX 相关响应特征。HyperDX 是可观测性平台，用于集中查看日志、指标、追踪、会话回放和应用异常。模板请求 `/search`，并通过页面标题或正文关键字、状态码、DSL 条件确认该系统指纹，用于资产识别、系统盘点和暴露面梳理。
  reference:
    - https://github.com/hyperdxio/hyperdx
    - https://www.hyperdx.io/
  metadata:
    max-request: 1
    verified: true
    shodan-query: html:"hyperdx"
  tags: panel,hyperdx,detect,discovery
http:
  - method: GET
    path:
      - "{{BaseURL}}/search"

    matchers:
      - type: dsl
        dsl:
          - 'status_code == 200'
          - 'contains_any(to_lower(body), ">hyperdx</span>", ">loading hyperdx<")'
        condition: and

    extractors:
      - type: regex
        part: body
        group: 1
        regex:

          - '(?i)"version":"([0-9.]+)"'
