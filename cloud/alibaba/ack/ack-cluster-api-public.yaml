id: ack-cluster-api-public

info:
  name: 阿里云ACK 集群 API Server 公网访问已启用（云安全）
  author: ritikchaddha
  severity: high
  description: 阿里云ACK 集群 API Server 配置公网 Endpoint 时，互联网主机可以连接到 Kubernetes 控制面入口，显著扩大凭据攻击、漏洞利用和未授权访问的暴露面。模板通过 aliyun cs GET /clusters 获取集群列表，当 master_url.api_server_endpoint 存在且不为空时判定 API Server 公网访问已启用。
  impact: |
    - Kubernetes 控制面入口直接暴露到公网，攻击者可持续进行端口探测、认证尝试或利用相关组件漏洞。
    - 一旦 kubeconfig、Token 或控制面认证链路被攻破，攻击者可能读取或修改集群资源，进而影响业务工作负载和敏感数据。
  remediation: |
    - 在 ACK 控制台的集群基本信息中取消 API Server Public Endpoint 绑定，或通过 ModifyCluster 将 api_server_eip 设置为 false。
    - 将 API Server 访问限制在 VPC、专线、VPN 或受控堡垒入口内，并配合 RAM、RBAC、审计日志和来源控制降低控制面暴露风险。
  reference:
    - https://www.trendmicro.com/cloudoneconformity/knowledge-base/alibaba-cloud/AlibabaCloud-ACK/private-cluster.html
  metadata:
    max-request: 1
    verified: true
    vendor: alibaba
    product: ack
  tags: cloud,devops,aliyun,alibaba,aliyun-cloud-config,ack

variables:
  region: "cn-hangzhou"

self-contained: true

code:
  - engine:
      - sh
      - bash
    source: |
      aliyun cs GET /clusters --header "Content-Type=application/json;" --body "{}"

    matchers-condition: and
    matchers:
      - type: word
        words:
          - 'master_url":'
          - 'api_server_endpoint\":\"'

      - type: word
        words:
          - 'api_server_endpoint\":\"\",'
        negative: true
