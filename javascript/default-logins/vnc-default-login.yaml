id: vnc-default-login

info:
  name: VNC 默认凭据检测（服务漏洞）
  author: pussycat0x
  severity: high
  description: |
    目标 VNC 服务接受常见默认口令，攻击者可能直接建立远程桌面会话。模板对内置 VNC 密码字典逐项发起认证，并以协议认证成功作为命中依据。
  impact: |
    - 攻击者可通过 VNC 弱凭据访问远程桌面，查看屏幕内容并操作图形会话。
    - 若桌面会话已登录业务系统，可能导致数据泄露、配置篡改或进一步主机接管。
  remediation: |
    - 更改 VNC 默认口令，启用强认证和传输加密，禁用无需保护的远程桌面入口。
    - 将 VNC 限制在 VPN、堡垒机或可信网段内，并审计异常连接。
  classification:
    cwe-id: CWE-521
  metadata:
    verified: true
    shodan-query: product:"vnc"
  tags: js,network,vnc,default-login

javascript:
  - pre-condition: |
      isPortOpen(Host,Port);
    code: |
      var vnc = require('nuclei/vnc');
      var client = new vnc.VNCClient();
      var resp = client.Connect(Host, Port, Password);
      resp;

    args:
      Host: "{{Host}}"
      Port: 5900
      Password: "{{passwords}}"

    payloads:
      passwords:
        - password123
        - mysecret
        - password
        - admin
        - iamadmin

    stop-at-first-match: true

    matchers:
      - type: dsl
        dsl:
          - "success == true"
          - "response == true"
        condition: and
