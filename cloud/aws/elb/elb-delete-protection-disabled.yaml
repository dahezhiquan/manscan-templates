id: elb-delete-protection-disabled

info:
  name: ELB 删除保护未启用（云安全）
  author: DhiyaneshDK
  severity: medium
  description: AWS Elastic Load Balancing 的删除保护用于防止负载均衡器被误删或被拥有控制面权限的攻击者删除；未启用时，关键入口资源缺少操作防护边界。该模板枚举 ELBv2 负载均衡器，并检查 deletion_protection.enabled 属性是否为 false。
  impact: |
    - 误操作、自动化脚本错误或被盗用的高权限凭据可能直接删除负载均衡器，导致业务入口中断。
    - 攻击者在取得云控制面权限后更容易破坏流量入口和可用性，增加恢复与排障成本。
  remediation: |
    - 为生产和关键环境的 Application Load Balancer、Network Load Balancer 或 Gateway Load Balancer 启用 deletion_protection.enabled。
    - 限制可修改或删除负载均衡器的 IAM 权限，并将该配置纳入持续合规检查。
  reference:
    - https://www.trendmicro.com/cloudoneconformity-staging/knowledge-base/aws/ELBv2/enable-gwlb-deletion-protection.html
    - https://awscli.amazonaws.com/v2/documentation/api/latest/reference/elbv2/index.html
  metadata:
    vendor: amazon
    product: elb
  tags: cloud,devops,aws,amazon,elb,aws-cloud-config
variables:
  region: "us-west-2"

flow: |
  code(1)
  for (let LoadBalancer of iterate(template.loadbalancers)) {
    set("loadbalancer", LoadBalancer)
    code(2)
  }

self-contained: true

code:
  - engine:
      - sh
      - bash
    source: |
      aws elbv2 describe-load-balancers --region $region --query 'LoadBalancers[*].LoadBalancerArn' --output json

    extractors:
      - type: json
        name: loadbalancers
        internal: true
        json:
          - '.[]'

  - engine:
      - sh
      - bash

    source: |
      aws elbv2 describe-load-balancer-attributes --region $region --load-balancer-arn $loadbalancer --query 'Attributes[?(Key == `deletion_protection.enabled`)].Value | []'

    matchers:
      - type: word
        words:
          - '"false"'

    extractors:
      - type: dsl
        dsl:
          - '"ELB Delete Protection " + loadbalancer + " is Disabled"'
