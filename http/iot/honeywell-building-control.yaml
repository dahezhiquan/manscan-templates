id: honeywell-building-control

info:
  name: Honeywell 楼宇控制面板（IOT）
  author: dhiyaneshDK
  severity: medium
  description: |
    检测到 Honeywell Building Control 面板。该页面与 Honeywell/Alerton 楼宇控制模块相关，暴露后可能帮助攻击者定位楼宇自动化资产。
  impact: |
    - 工业控制、楼宇自动化或能源设备面板暴露可能泄露设施运行状态和控制系统入口。
    - 若存在弱口令或历史漏洞，可能影响生产、楼控、供电或环境控制的安全边界。
  remediation: |
    - 将 OT/IoT 管理页面放置在隔离网络中，仅允许可信运维主机或 VPN 访问。
    - 启用强认证、最小权限和设备访问审计，及时更新厂商固件。
    - 避免将控制设备直接暴露到互联网，并监控异常登录和配置变更。
  classification:
    cpe: cpe:2.3:h:honeywell:alerton_ascent_control_module:*:*:*:*:*:*:*:*
  metadata:
    max-request: 1
    vendor: honeywell
    product: alerton_ascent_control_module
    shodan-query: html:"Honeywell Building Control"
  tags: panel,iot,discovery

http:
  - method: GET
    path:
      - "{{BaseURL}}"

    matchers-condition: and
    matchers:
      - type: word
        words:
          - '<title>Honeywell Building Control</title>'

      - type: status
        status:
          - 200
