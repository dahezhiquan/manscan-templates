id: wiki-outline-panel

info:
  name: Outline 面板识别（指纹识别）
  author: ChrisJr404
  severity: info
  description: |-
    Outline 是团队知识库平台，用于文档、空间、权限和协作编辑管理。该模板请求首页，并依据 DSL 条件识别目标是否部署了该系统或暴露了对应入口，适用于资产指纹确认；命中结果仅表示系统特征匹配，不代表已确认存在未授权访问或可利用漏洞。
  reference:
  - https://github.com/outline/outline
  - https://www.getoutline.com/
  metadata:
    verified: true
    max-request: 1
    vendor: outline
    product: outline
    shodan-query: http.title:"Outline"
    fofa-query: title="Outline"
  tags: panel,outline,wiki,knowledge-base,detect,discovery

http:
  - method: GET
    path:
      - "{{BaseURL}}"

    host-redirects: true
    max-redirects: 2

    matchers:
      - type: dsl
        dsl:
          - 'status_code == 200'
          - 'contains(to_lower(body), "<title>outline</title>") || contains(body, "data-outline-team")'
          - 'contains(body, "outline")'
        condition: and

    extractors:
      - type: regex
        part: body
        group: 1
        regex:
          - '<meta name="outline-version" content="([^"]+)"'
