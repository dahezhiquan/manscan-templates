id: k8s-ns-usage-check

info:
  name: Ensure namespaces are utilized（云安全）
  author: princechaddha
  severity: low
  description: 未合理使用 Kubernetes 命名空间会削弱资源、权限、网络和配额的隔离能力。本模板读取 namespaces 列表，并根据输出内容判断集群是否未体现命名空间使用。
  impact: |
    - 不同环境或团队资源混杂，RBAC、配额和 NetworkPolicy 难以按边界实施。
    - 误操作和过宽权限可能影响更多工作负载，增加审计复杂度。
  remediation: |
    - 按业务、环境或团队划分命名空间，并配置 ResourceQuota、LimitRange、RBAC 和 NetworkPolicy。
    - 避免将生产工作负载集中在 default 命名空间。
  reference:
    - https://kubernetes.io/docs/concepts/overview/working-with-objects/namespaces/
  metadata:
    vendor: kubernetes
    product: kubernetes
  tags: cloud,devops,kubernetes,devsecops,namespaces,k8s-cluster-security
variables:
  argument: "namespaces"

self-contained: true
code:
  - engine:
      - sh
      - bash
    source: |
      kubectl get namespaces --output=json

    matchers-condition: and
    matchers:
      - type: word
        words:
          - '"items":'

      - type: word
        words:
          - '"Namespace"'
        negative: true

    extractors:
      - type: dsl
        dsl:
          - '"Kubernetes cluster is not utilizing " + argument'
