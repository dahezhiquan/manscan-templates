id: aws-code-env
info:
  name: AWS 云环境校验（云安全）
  author: princechaddha
  severity: info
  description: 检查当前环境是否已正确配置 AWS CLI 以及执行云安全基线检测所需的相关工具。
  reference:
    - https://aws.amazon.com/cli/
  metadata:
    max-request: 2
  tags: cloud,devops,aws,amazone,aws-cloud-config

variables:
  region: "us-east-1"

flow: code(1) && code(2)

self-contained: true
code:
  - engine:
      - sh
      - bash
    source: |
      aws sts get-caller-identity --output json

    matchers:
      - type: word
        internal: true
        words:
          - '"UserId"'

    extractors:
      - type: json
        name: account
        internal: true
        json:
          - '.Account'

  - engine:
      - sh
      - bash
    source: |
      jq --version >/dev/null 2>&1 && echo "jq is installed." || echo "jq is not installed."

    matchers:
      - type: word
        words:
          - "jq is installed"

    extractors:
      - type: dsl
        dsl:
          - '"AWS CLI is properly configured for account \"" + account + "\" and all the necessary tools required are installed"'
