id: qvidium-management-system-exposed

info:
  name: QVidium 管理 System 暴露
  author: tess
  severity: medium
  description: |
    检测到 QVidium 管理 System 暴露。目标响应或文件中可能暴露配置、凭据、密钥、令牌、环境变量或历史记录等敏感信息，可能被用于进一步入侵。
  metadata:
    verified: true
    max-request: 1
    shodan-query: html:"QVidium Management"
  tags: misconfig,qvidium,vuln

http:
  - method: GET
    path:
      - '{{BaseURL}}'

    host-redirects: true
    max-redirects: 2

    matchers-condition: and
    matchers:
      - type: word
        part: body
        words:
          - 'QVidium Management'
          - 'src="/cgi-bin/banner.cgi'
        condition: and

      - type: word
        part: header
        words:
          - 'text/html'

      - type: status
        status:
          - 200
