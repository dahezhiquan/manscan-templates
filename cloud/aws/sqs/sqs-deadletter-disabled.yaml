id: sqs-deadletter-disabled

info:
  name: SQS Dead Letter Queue 未启用（云安全）
  author: DhiyaneshDK
  severity: medium
  description: SQS Dead Letter Queue 可隔离多次处理失败的消息，帮助分析消费异常并避免失败消息持续阻塞主队列。该模板枚举 queue URL，并检查 RedrivePolicy 是否为 null。
  impact: |
    - 消费失败的消息可能反复重试，造成处理延迟、成本增加或队列积压。
    - 无法集中分析失败消息会降低故障排查和数据一致性恢复效率。
  remediation: |
    - 为关键 SQS queue 配置 Dead Letter Queue，并设置合理的 maxReceiveCount。
    - 对 DLQ 深度配置 CloudWatch 告警，并建立失败消息分析和 redrive 流程。
  reference:
    - https://www.trendmicro.com/cloudoneconformity-staging/knowledge-base/aws/SQS/dead-letter-queue.html
    - https://docs.aws.amazon.com/AWSSimpleQueueService/latest/SQSDeveloperGuide/sqs-dead-letter-queues.html
  metadata:
    vendor: amazon
    product: sqs
  tags: cloud,devops,aws,amazon,sqs,aws-cloud-config

variables:
  region: "us-west-2"

flow: |
  code(1)
  for(let QueueUrls of iterate(template.queueurls)){
    set("queueurl", QueueUrls)
    code(2)
  }

self-contained: true

code:
  - engine:
      - sh
      - bash
    source: |
      aws sqs list-queues --region $region --query 'QueueUrls[*]' --output json

    extractors:
      - type: json
        name: queueurls
        internal: true
        json:
          - '.[]'

  - engine:
      - sh
      - bash
    source: |
        aws sqs get-queue-attributes --region $region --queue-url $queueurl --attribute-names RedrivePolicy --query 'Attributes.RedrivePolicy' --output json

    matchers:
      - type: word
        words:
          - 'null'

    extractors:
      - type: dsl
        dsl:
          - '"SQS Dead Letter Queue " + queueurl + " is Disabled"'
