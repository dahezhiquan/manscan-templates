id: gcloud-object-versioning-not-enabled

info:
  name: Enable Object Versioning 的Cloud Storage Buckets（云安全）
  author: princechaddha
  severity: medium
  description: 该规则用于检查 GCP 存储账户 是否正确配置备份、快照、证书续期、密钥轮换或其他韧性保护措施，以降低中断、失效或数据恢复失败的风险。
  impact: |
    - 缺少备份、续期、轮换或删除保护会增加服务中断、数据丢失或恢复失败的风险。
    - 当故障、误操作或攻击发生时，业务可用性和恢复能力都会受到明显影响。
  remediation: |
    - 启用备份、快照、版本控制、证书续期、密钥轮换或删除保护等韧性配置。
    - 定期验证恢复流程和到期提醒机制，确保在故障或攻击发生时能够快速恢复。
  reference:
    - https://cloud.google.com/storage/docs/object-versioning
  tags: cloud,devops,gcp,gcloud,google-cloud-storage,object-versioning,backup,gcp-cloud-config

flow: |
  code(1)
  for(let projectId of iterate(template.projectIds)){
    set("projectId", projectId)
    code(2)
    for(let bucketName of iterate(template.buckets)){
      set("bucketName", bucketName)
      code(3)
    }
  }

self-contained: true

code:
  - engine:
      - sh
      - bash
    source: |
      gcloud projects list --format="json(projectId)"

    extractors:
      - type: json
        name: projectIds
        internal: true
        json:
          - '.[].projectId'

  - engine:
      - sh
      - bash
    source: |
      gsutil ls -p $projectId | jq -R . | jq -s .

    extractors:
      - type: json
        name: buckets
        internal: true
        json:
          - '.[]'

  - engine:
      - sh
      - bash
    source: |
      gsutil versioning get $bucketName

    matchers:
      - type: word
        words:
          - 'Suspended'

    extractors:
      - type: dsl
        dsl:
          - '"Object versioning is not enabled for the bucket " + bucketName + " in project " + projectId'
