id: paloaltonetworks-panos-management-panel

info:
  name: PAN-OS Management 登录面板识别（指纹识别）
  author: bhutch
  severity: info
  description: |-
    PAN-OS Management 是 Palo Alto Networks 防火墙管理界面，用于配置安全策略、网络接口和设备运维。该模板请求 `/php/login.php` 路径，并依据 HTTP 200 状态码、页面标题、正文关键字或品牌资源特征识别目标是否部署了该系统或暴露了对应入口，适用于资产指纹确认；命中结果仅表示系统特征匹配，不代表已确认存在未授权访问或可利用漏洞。
  reference:
  - https://security.paloaltonetworks.com/PAN-SA-2024-0015
  classification:
    cvss-metrics: CVSS:3.0/AV:N/AC:L/PR:N/UI:N/S:U/C:N/I:N/A:N
    cwe-id: CWE-200
  metadata:
    verified: true
    max-request: 1
    shodan-query: http.favicon.hash:873381299
  tags: panel,panos,login,detect,paloaltonetworks,discovery

http:
  - method: GET
    path:
      - "{{BaseURL}}/php/login.php"

    matchers-condition: and
    matchers:
      - type: word
        part: body
        words:
          - "<TITLE>Login</TITLE>"
          - 'PAN_FORM_CONTENT'
        condition: and

      - type: status
        status:
          - 200
