id: gunicorn-detect

info:
  name: Gunicorn 指纹识别（指纹识别）
  author: joanbono
  severity: info
  description: >-
    Gunicorn 是 Python WSGI HTTP 服务器，常用于在生产环境承载 Flask、Django 等 Python Web 应用。该模板通过请求目标服务并检查预设路径或首页响应、HTTP
    响应头、正则特征等指纹特征，判断目标是否使用或暴露了 Gunicorn 相关组件；命中结果仅表示指纹特征匹配，可用于资产盘点、技术栈识别和后续安全评估，不代表已确认存在可利用漏洞。
  reference:
  - https://github.com/benoitc/gunicorn
  metadata:
    max-request: 1
  tags: tech,gunicorn,discovery
http:
  - method: GET
    path:
      - "{{BaseURL}}"

    matchers-condition: and
    matchers:
      - type: regex
        part: header
        regex:
          - gunicorn+

    extractors:
      - type: kval
        part: header
        kval:
          - Server
