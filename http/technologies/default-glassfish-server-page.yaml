id: default-glassfish-server-page

info:
  name: GlassFish 服务器 默认页面 指纹识别（指纹识别）
  author: dhiyaneshDk,righettod
  severity: info
  description: GlassFish 服务器 默认页面 是 Java EE/Jakarta EE 应用服务器，用于部署企业 Java 应用和服务。该模板请求首页，并依据 DSL 条件识别目标是否使用或暴露了 GlassFish 服务器 默认页面 相关组件，适用于资产盘点、技术栈识别和后续安全评估；命中结果仅表示指纹特征匹配，不代表已确认存在可利用漏洞。
  classification:
    cpe: cpe:2.3:a:oracle:glassfish_server:*:*:*:*:*:*:*:*
  metadata:
    max-request: 1
    vendor: oracle
    product: glassfish_server
    shodan-query: http.title:"GlassFish Server - Server Running"
  tags: tech,glassfish,discovery

http:
  - method: GET
    path:
      - '{{BaseURL}}'

    matchers:
      - type: dsl
        dsl:
          - 'status_code == 200'
          - 'contains_any(to_lower(body), "glassfish server - server running", "glassfish server with premier support", "<b>glassfish server</b>", "glassfish server installation directory")'
        condition: and

    extractors:
      - type: regex
        part: header
        group: 1
        regex:
          - 'GlassFish\s+Server\s+([A-Za-z0-9\s.]+)(\n|\r)'
