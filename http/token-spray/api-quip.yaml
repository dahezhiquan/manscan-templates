id: api-quip

info:
  name: Quip API Token 可用性校验（token喷洒）
  author: daffainfo
  severity: info
  description: 该模板通过调用 Quip API 的已知接口验证提供的 token 是否有效，命中后通常表示可访问相关 API 能力。
  reference:
    - https://quip.com/dev/automation/documentation
    - https://github.com/daffainfo/all-about-apikey/tree/main/quip
  metadata:
    max-request: 1
  tags: token-spray,quip

self-contained: true

http:
  - raw:
      - |
        GET https://platform.quip.com/1/users/current HTTP/1.1
        Host: platform.quip.com
        Authorization: Bearer {{token}}

    matchers:
      - type: word
        part: body
        words:
          - '"id":'
          - '"name":'
        condition: and
