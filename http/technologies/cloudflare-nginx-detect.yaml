id: cloudflare-nginx-detect

info:
  name: Cloudflare Nginx 指纹识别（指纹识别）
  author: idealphase
  severity: info
  description: Cloudflare Nginx 是 Cloudflare 边缘或代理后的 Nginx Web 服务组合，用于内容代理、加速和 Web 响应处理。该模板请求首页，并依据 HTTP 200 状态码、页面标题、正文关键字或品牌资源特征、响应头特征识别目标是否使用或暴露了 Cloudflare Nginx 相关组件，适用于资产盘点、技术栈识别和后续安全评估；命中结果仅表示指纹特征匹配，不代表已确认存在可利用漏洞。
  reference:
  - https://blog.cloudflare.com/end-of-the-road-for-cloudflare-nginx/
  metadata:
    verified: true
    max-request: 1
    shodan-query: product:"cloudflare-nginx"
  tags: cloudflare,nginx,tech,discovery

http:
  - method: GET
    path:
      - '{{BaseURL}}'

    matchers-condition: and
    matchers:
      - type: word
        part: header
        words:
          - "Server: cloudflare-nginx"

      - type: status
        status:
          - 200
