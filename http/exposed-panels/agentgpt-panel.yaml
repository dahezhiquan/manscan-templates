id: agentgpt-panel

info:
  name: AgentGPT 面板识别（指纹识别）
  author: rxerium
  severity: info
  description: |-
    检测到目标站点存在 AgentGPT 相关响应特征。AgentGPT 是基于大语言模型的自动化代理平台，用于创建、运行和管理面向任务的 AI Agent。模板请求 `/`，并通过页面标题或正文关键字、状态码确认该系统指纹，用于资产识别、系统盘点和暴露面梳理。
  reference:
    - https://github.com/reworkd/AgentGPT
    - https://agentgpt.reworkd.ai/
  metadata:
    verified: true
    max-request: 1
    vendor: reworkd
    product: agentgpt
    shodan-query: 'http.title:"AgentGPT"'
  tags: panel,agentgpt,agent,ai,detect,discovery
http:
  - method: GET
    path:
      - "{{BaseURL}}"

    host-redirects: true
    max-redirects: 2

    matchers-condition: and
    matchers:
      - type: word
        part: body
        words:
          - "<title>AgentGPT</title>"

      - type: status
        status:
          - 200
