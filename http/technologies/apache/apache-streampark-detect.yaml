id: apache-streampark-detect

info:
  name: Apache Streampark 指纹识别（指纹识别）
  author: icarot
  severity: info
  description: |-
    Apache Streampark 是流处理开发和运维平台，用于 Flink/Spark 作业管理、发布和监控。该模板请求首页，并依据 HTTP 200 状态码、页面标题、正文关键字或品牌资源特征识别目标是否使用或暴露了 Apache Streampark 相关组件，适用于资产盘点、技术栈识别和后续安全评估；命中结果仅表示指纹特征匹配，不代表已确认存在可利用漏洞。
  reference:
  - https://github.com/apache/streampark
  classification:
    cpe: cpe:2.3:a:apache:streampark:*:*:*:*:*:*:*:*
  metadata:
    max-request: 1
    vendor: apache
    product: streampark
    shodan-query: title:"Apache StreamPark"
  tags: tech,apache,streampark,detect,discovery

http:
  - method: GET
    path:
      - "{{BaseURL}}/"

    matchers-condition: and
    matchers:
      - type: word
        words:
          - '<title>Apache StreamPark</title>'
        condition: and

      - type: status
        status:
          - 200
