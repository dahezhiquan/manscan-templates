id: password-reset-lock-screen-enabled

info:
  name: 锁屏界面允许密码重置（本地基线扫描）
  author: princechaddha
  severity: medium
  description: |
    该功能若配置不当可能被本地攻击者滥用。对应基线项为“锁屏界面是否提供密码重置选项”；模板读取注册表 `HKLM:\SOFTWARE\Policies\Microsoft\Windows\System` 的 `DisablePasswordReset` 值，结合命中值判断策略是否不符合基线。
  impact: |
    - 攻击者可能借助物理访问尝试重置账户密码或绕过正常登录流程。
    - 凭据保护不足会增加横向移动、远程登录和离线破解风险。
  remediation: |
    - 禁用锁屏密码重置入口，或确保重置流程需要强身份验证。
    - 变更策略后清理历史凭据，并轮换可能受影响的账户密码。
  tags: password,code,windows-audit

self-contained: true

code:
  - pre-condition: |
      IsWindows();
    engine:
      - powershell
      - powershell.exe
    args:
      - -ExecutionPolicy
      - Bypass
    pattern: "*.ps1"
    source: |
      if ((Get-ItemProperty -Path 'HKLM:\SOFTWARE\Policies\Microsoft\Windows\System' -Name 'DisablePasswordReset' -ErrorAction SilentlyContinue).DisablePasswordReset -eq 0) { "Password reset from lock screen is enabled." }

    matchers:
      - type: word
        words:
          - "Password reset from lock screen is enabled."
