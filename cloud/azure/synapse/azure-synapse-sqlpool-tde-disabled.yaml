id: azure-synapse-sqlpool-tde-disabled
info:
  name: Azure Synapse Analytics SQL Pool Transparent Data 加密未启用（云安全）
  author: princechaddha
  severity: high
  description: Azure Synapse dedicated SQL pool 的透明数据加密可保护持久化数据、临时文件和备份；状态为 Disabled 时，静态数据缺少服务端加密保护。本模板枚举 Synapse workspace 和 SQL pool，查询当前透明数据加密状态，并在输出包含 "Disabled" 时报告。
  impact: |
    - 获取存储介质、备份或快照的攻击者可能直接分析未加密的数据，造成业务数据和个人信息泄露。
    - 未启用 TDE 还可能导致数据仓库不满足组织的静态数据保护和合规要求。
  remediation: |
    - 为每个受支持的 dedicated SQL pool 启用透明数据加密，并确认状态变为 Enabled。
    - 结合数据分类评估客户管理密钥、密钥轮换和 Key Vault 访问控制要求，启用后持续监控加密状态。
  reference:
    - https://docs.microsoft.com/en-us/azure/synapse-analytics/sql-data-warehouse/sql-data-warehouse-overview-what-is
  metadata:
    vendor: microsoft
    product: azure-synapse-analytics
  tags: cloud,devops,azure,microsoft,synapse,azure-cloud-config

flow: |
  code(1);
  for (let workspaceId of iterate(template.workspaceIds)) {
    set("workspaceId", workspaceId);
    code(2);
    for (let sqlPoolId of iterate(template.sqlPoolIds)) {
      set("sqlPoolId", sqlPoolId);
      code(3);
    }
  }

self-contained: true
code:
  - engine:
      - sh
      - bash
    source: |
      az synapse workspace list --query '[*].id'

    extractors:
      - type: json
        name: workspaceIds
        internal: true
        json:
          - '.[]'

  - engine:
      - sh
      - bash
    source: |
      az synapse sql pool list --workspace-name "$workspaceId" --resource-group "$resourceGroup" --query '[*].id'

    extractors:
      - type: json
        name: sqlPoolIds
        internal: true
        json:
          - '.[]'

  - engine:
      - sh
      - bash
    source: |
      az synapse sql pool tde show --ids "$sqlPoolId" --transparent-data-encryption-name current --query 'status'

    matchers:
      - type: word
        words:
          - '"Disabled"'

    extractors:
      - type: dsl
        dsl:
          - 'workspaceId + " " + sqlPoolId + " does not have TDE enabled"'
