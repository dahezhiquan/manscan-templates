id: kaco-new-energy-detect

info:
  name: KACO New Energy Solar Inverter 识别（暴露面识别）
  author: rxerium
  severity: info
  description: |
    该模板用于识别 KACO New Energy Solar Inverter 相关页面或服务入口是否对外暴露。若命中，说明目标可被识别为对应产品或组件，可用于资产发现与攻击面管理。
  reference:
    - https://kaco-newenergy.com/
  metadata:
    max-request: 1
    verified: true
    shodan-query: http.title:"KACO new energy"
    vendor: kaco
    product: solar-inverter
  tags: tech,panel,kaco,ics,solar,energy,inverter,detect

http:
  - method: GET
    path:
      - "{{BaseURL}}"

    host-redirects: true
    max-redirects: 2

    headers:
      Accept-Encoding: gzip

    matchers:
      - type: dsl
        dsl:
          - 'status_code == 200'
          - 'contains(body, "KACO inverter web page")'
          - 'contains(body, "<title>KACO new energy</title>")'
        condition: and
