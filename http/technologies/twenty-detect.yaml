id: twenty-detect

info:
  name: Twenty CRM 指纹识别（指纹识别）
  author: righettod
  severity: info
  description: >-
    Twenty 是开源客户关系管理系统，用于管理客户、公司、销售机会和业务流程。该模板通过请求目标服务并检查预设路径或首页响应、DSL 条件等指纹特征，判断目标是否使用或暴露了
    Twenty CRM 相关组件；命中结果仅表示指纹特征匹配，可用于资产盘点、技术栈识别和后续安全评估，不代表已确认存在可利用漏洞。
  reference:
  - https://github.com/twentyhq/twenty
  - https://twenty.com/
  metadata:
    max-request: 1
    shodan-query: http.title:"Twenty"
  tags: tech,twenty,detect,discovery
http:
  - method: GET
    path:
      - "{{BaseURL}}/welcome"

    matchers:
      - type: dsl
        dsl:
          - 'status_code == 200'
          - 'contains_all(to_lower(body), "<title>twenty</title>", "open-source crm")'
        condition: and
