id: jitsi-meet-detect

info:
  name: Jitsi Meet 指纹识别（指纹识别）
  author: DhiyaneshDk,righettod
  severity: info
  description: >-
    Jitsi Meet 是开源视频会议平台，用于提供浏览器端音视频会议、屏幕共享和协作通信。该模板通过请求目标服务并检查预设路径或首页响应、页面正文关键字、正则特征、DSL
    条件等指纹特征，判断目标是否使用或暴露了 Jitsi Meet 相关组件；命中结果仅表示指纹特征匹配，可用于资产盘点、技术栈识别和后续安全评估，不代表已确认存在可利用漏洞。
  reference:
  - https://jitsi.org/
  - https://github.com/jitsi
  classification:
    cpe: cpe:2.3:a:jitsi:meet:*:*:*:*:docker:*:*:*
  metadata:
    max-request: 1
    vendor: jitsi
    product: meet
    shodan-query: http.title:"Jitsi Meet"
  tags: tech,jitsi,discovery
http:
  - method: GET
    path:
      - '{{BaseURL}}'

    matchers:
      - type: dsl
        dsl:
          - 'status_code == 200'
          - 'contains_any(to_lower(body), "<title>jitsi meet</title>", "jitsimeetjs.app")'
        condition: and

    extractors:
      - type: regex
        part: body
        group: 1
        regex:
          - 'lib\-jitsi\-meet\.min\.js\?v=([0-9]+)'
