id: wp-wordpress-passive-detection

info:
  name: WordPress 插件与主题被动枚举 指纹识别（指纹识别）
  author: princechaddha
  severity: info
  description: >-
    WordPress 是开源内容管理系统，插件和主题用于扩展站点功能、外观和第三方集成；被动枚举用于从页面资源中识别已启用组件。该模板通过请求目标服务并检查预设路径或首页响应、正则特征等指纹特征，判断目标是否使用或暴露了
    WordPress 插件与主题被动枚举 相关组件；命中结果仅表示指纹特征匹配，可用于资产盘点、技术栈识别和后续安全评估，不代表已确认存在可利用漏洞。
  reference:
  - https://developer.wordpress.org/rest-api/using-the-rest-api/discovery/
  - https://github.com/Chocapikk/wpprobe
  - https://chocapikk.com/posts/2025/wpprobe/
  classification:
    cpe: cpe:2.3:a:wordpress:wordpress:*:*:*:*:*:*:*:*
  metadata:
    verified: true
    max-request: 3
    vendor: wordpress
    product: wordpress
    shodan-query:
    - http.component:"wordpress"
  tags: tech,wordpress,cms,plugin,theme,discovery,passive,enum
http:
  - method: GET
    path:
      - "{{BaseURL}}/?rest_route=/"
      - "{{BaseURL}}/wp-json/"
      - "{{BaseURL}}"

    redirects: true
    max-redirects: 2
    stop-at-first-match: true

    extractors:
      - type: regex
        name: plugin_slug
        part: body
        group: 1
        regex:
          - '\/wp-content\/plugins\/([a-zA-Z0-9_-]+)\/'

      - type: regex
        name: theme_slug
        part: body
        group: 1
        regex:
          - '\/wp-content\/themes\/([a-zA-Z0-9_-]+)\/'
          - 'themes\/([a-zA-Z0-9_-]+)\/style\.css'
