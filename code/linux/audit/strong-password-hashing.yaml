id: strong-password-hashing

info:
  name: 强密码哈希算法未配置（本地基线扫描）
  author: Th3l0newolf
  severity: high
  description: |
    弱密码哈希算法会降低离线破解成本，一旦 `/etc/shadow` 或备份泄露，攻击者更容易恢复明文密码。CIS Ubuntu 基线建议使用 SHA512 或 yescrypt 等强哈希；模板检查 `/etc/login.defs` 中 `ENCRYPT_METHOD` 是否为 `SHA512` 或 `yescrypt`，否则命中 Policy-Fail。
  impact: |
    - 密码哈希泄露后更容易被离线破解，导致账号接管和横向移动。
    - 新建账号或改密流程若继续使用弱算法，会扩大凭据暴露后的影响范围。
  remediation: |
    - 在 `/etc/login.defs` 中设置 `ENCRYPT_METHOD SHA512` 或 `yescrypt`。
    - 要求用户重新设置密码以生成新哈希，并保护 `/etc/shadow` 及其备份文件。
  reference:
    - https://www.cisecurity.org/benchmark/ubuntu_linux
  metadata:
    verified: true
  tags: cis,local,cisecurity,audit,linux,ubuntu,password

self-contained: true

code:
  - engine:
      - bash

    args:
      - "-c"
      - |
        HASH_METHOD_LINE=$(grep -Pi -- '^\h*ENCRYPT_METHOD\h+(SHA512|yescrypt)\b' /etc/login.defs | head -n1)
        if [ -n "$HASH_METHOD_LINE" ]; then
          VALUE=$(echo "$HASH_METHOD_LINE" | awk '{print $2}' | tr '[:upper:]' '[:lower:]')
          if [ "$VALUE" = "sha512" ] || [ "$VALUE" = "yescrypt" ]; then
            echo "[strong-password-hashing-check:Policy-Pass] [ENCRYPT_METHOD is $VALUE (valid)] [CIS_PASS]"
          else
            echo "[strong-password-hashing-check:Policy-Fail] [ENCRYPT_METHOD is $VALUE (invalid)] [CIS_FAIL]"
          fi
        else
          echo "[strong-password-hashing-check:Policy-Fail] [ENCRYPT_METHOD not set or malformed] [CIS_FAIL]"
        fi

    matchers:
      - type: word
        name: policy-pass
        words:
          - "Policy-Pass"

      - type: word
        name: policy-fail
        words:
          - "Policy-Fail"
