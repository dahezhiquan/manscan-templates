id: vault-panel

info:
  name: Vault 登录面板识别（指纹识别）
  author: DhiyaneshDK,righettod
  severity: info
  description: 该模板通过识别 Vault 登录入口的页面标题、特征文本或重定向行为，判断目标是否暴露了对应的认证界面。若命中，说明该登录面板对外可访问，可用于暴露面梳理与后续安全评估。
  reference:
    - https://developer.hashicorp.com/vault
    - https://developer.hashicorp.com/vault/api-docs
    - https://developer.hashicorp.com/vault/api-docs#help
  classification:
    cvss-metrics: CVSS:3.0/AV:N/AC:L/PR:N/UI:N/S:U/C:N/I:N/A:N
    cwe-id: CWE-200
    cpe: cpe:2.3:a:hashicorp:vault:*:*:*:*:*:*:*:*
  metadata:
    verified: true
    max-request: 4
    vendor: hashicorp
    product: vault
    shodan-query: http.favicon.hash:-919788577
    fofa-query: icon_hash=-919788577
  tags: panel,vault,detect,hashicorp,discovery

http:
  - method: GET
    path:
      - "{{BaseURL}}/v1/sys/health"
      - "{{BaseURL}}/ui/vault/auth"
      - "{{BaseURL}}/ui/auth"
      - "{{BaseURL}}/v1/sys/health?help=1"

    stop-at-first-match: true
    matchers:
      - type: dsl
        dsl:
          - 'status_code == 200 || status_code == 429'
          - 'contains_any(to_lower(body), "vault-cluster", "vault/config/environment", "<title>vault</title>", "hashicorp vault api")'
        condition: and

    extractors:
      - type: json
        part: body_1
        name: version
        json:
          - ".version"
