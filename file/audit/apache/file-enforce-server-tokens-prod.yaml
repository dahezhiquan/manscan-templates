id: file-enforce-server-tokens-prod

info:
  name: Apache2 ServerTokens 未设置为 Prod（本地文件安全扫描）
  author: pussycat0x
  severity: medium
  description: |
    该模板检查 Apache ServerTokens 是否设置为 Prod，以减少响应头中暴露的版本和组件细节。
  remediation: |
    在 Apache 配置中设置 ServerTokens Prod，并重启服务。
  reference:
    - https://httpd.apache.org/docs/2.4/mod/core.html#servertokens
  metadata:
    verified: true
  tags: audit,config,file,apache,hardening

file:
  - extensions:
      - conf

    matchers-condition: and
    matchers:
      - type: word
        words:
          - "<Directory"
          - "<FilesMatch"
        condition: and

      - type: word
        words:
          - "ServerTokens Prod"
        negative: true
