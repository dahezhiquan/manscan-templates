id: beyondtrust-priv-panel

info:
  name: BeyondTrust Privileged Remote Access 面板（指纹识别）
  author: righettod
  severity: info
  description: |
    该模板通过识别 BeyondTrust Privileged Remote Access 登录入口的页面标题、特征文本或重定向行为，判断目标是否暴露了对应的认证界面。若命中，说明该登录面板对外可访问，可用于暴露面梳理与后续安全评估。
  reference:
    - https://www.beyondtrust.com/products/privileged-remote-access
  classification:
    cpe: cpe:2.3:a:beyondtrust:privileged_remote_access:*:*:*:*:*:*:*:*
  metadata:
    verified: true
    max-request: 2
    vendor: beyondtrust
    product: privileged_remote_access
    shodan-query: "http.html:\"BeyondTrust Privileged Remote Access Login\""
  tags: panel,beyondtrust,login,detect,discovery

http:
  - method: GET
    path:
      - "{{BaseURL}}/login/login"
      - "{{BaseURL}}/login/pre_login_agreement"

    stop-at-first-match: true
    matchers:
      - type: dsl
        dsl:
          - 'status_code == 200'
          - 'contains_any(to_lower(body), "<title>beyondtrust privileged remote access login", "privileged-remote-access") && contains(to_lower(body), "login")'
        condition: and
