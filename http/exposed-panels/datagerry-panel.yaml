id: datagerry-panel

info:
  name: Datagerry 面板识别（指纹识别）
  author: s4e-io
  severity: info
  description: |-
    检测到目标站点存在 Datagerry 相关响应特征。Datagerry 是监控、日志、分析或可观测性系统，用于展示运行指标、告警事件、日志数据和服务状态。模板请求 `/auth`、`/` 路径，并通过页面标题或正文关键字、状态码、DSL 条件确认该系统指纹，用于资产识别、系统盘点和暴露面梳理。
  reference:
    - https://datagerry.com/
  metadata:
    verified: true
    max-request: 1
    vendor: becon
    product: datagerry
    shodan-query: http.title:"datagerry"
    fofa-query: title="datagerry"
    google-query: intitle:"datagerry"
  tags: panel,login,datagerry,detect,discovery
http:
  - method: GET
    path:
      - "{{BaseURL}}/auth"
      - "{{BaseURL}}"

    stop-at-first-match: true
    host-redirects: true
    max-redirects: 2
    matchers:
      - type: dsl
        dsl:
          - 'contains_any(tolower(body), "<title>datagerry", "content=\"datagerry")'
          - 'status_code == 200'
        condition: and
