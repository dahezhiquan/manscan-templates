id: gcloud-org-vpc-peering

info:
  name: VPC Peering Usage 未Restricted（云安全）
  author: princechaddha
  severity: medium
  description: VPC peering 未受组织策略限制时，网络可与任意其他网络建立对等连接，可能绕过既定网络边界。本模板检查 compute.restrictVpcPeering 组织策略 listPolicy.allValues，值为 ALLOW 时报告 VPC peering 使用未受限制。
  impact: |
    - 非授权网络互联可能扩大东西向访问路径，增加横向移动和数据外流风险。
    - Peering 关系缺少集中治理会影响路由规划、IP 冲突排查和安全域隔离。
  remediation: |
    - 配置 compute.restrictVpcPeering，仅允许与批准的网络建立 VPC peering。
    - 将 peering 创建纳入网络变更审批，并定期复核现有对等连接和路由传播。
  reference:
    - https://www.trendmicro.com/cloudoneconformity/knowledge-base/gcp/ResourceManager/restrict-vpc-peering-usage.html
    - https://cloud.google.com/vpc/docs/vpc-peering
  metadata:
    vendor: google
    product: resource-manager
  tags: cloud,devops,gcp,gcloud,resourcemanager,security,networking,vpc,gcp-cloud-config

flow: |
  code(1)
  for(let orgId of iterate(template.orgIds)){
    set("orgId", orgId)
    code(2)
  }

self-contained: true

code:
  - engine:
      - sh
      - bash
    source: |
      gcloud organizations list --format="json(name)"

    extractors:
      - type: json
        name: orgIds
        internal: true
        json:
          - '.[].name'

  - engine:
      - sh
      - bash
    source: |
      gcloud alpha resource-manager org-policies describe compute.restrictVpcPeering --organization=$orgId --effective --format="json(listPolicy.allValues)"

    matchers:
      - type: word
        words:
          - "ALLOW"

    extractors:
      - type: dsl
        dsl:
          - '"Organization " + orgId + " has not restricted VPC peering usage, allowing networks to be peered with any other network"'
