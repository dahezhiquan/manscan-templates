id: gcloud-sql-log-checkpoints-disabled

info:
  name: PostgreSQL 数据库实例未启用 log_checkpoints（云安全）
  author: princechaddha
  severity: medium
  description: PostgreSQL log_checkpoints 可记录检查点活动，帮助分析写入压力、性能抖动和恢复行为。本模板检查 Cloud SQL PostgreSQL 实例 databaseFlags 中 log_checkpoints 的值，匹配 off 时报告未启用检查点日志。
  impact: |
    - 检查点异常、磁盘写入压力或数据库恢复相关问题缺少关键日志证据。
    - 安全事件后还原数据库运行时间线和资源压力变化会更加困难。
  remediation: |
    - 启用 log_checkpoints，并将数据库日志集中保存以便后续分析。
    - 结合 Cloud SQL 指标监控磁盘写入、延迟和检查点频率，及时发现异常负载。
  reference:
    - https://cloud.google.com/sql/docs/postgres/configure-instance-settings
  metadata:
    vendor: google
    product: cloud-sql
  tags: cloud,devops,gcp,gcloud,google-cloud-sql,postgresql,gcp-cloud-config

flow: |
  code(1)
  for(let projectId of iterate(template.projectIds)){
    set("projectId", projectId)
    code(2)
    for(let sqlInstance of iterate(template.sqlInstances)){
      set("sqlInstance", sqlInstance)
      code(3)
    }
  }

self-contained: true

code:
  - engine:
      - sh
      - bash
    source: |
      gcloud projects list --format="json(projectId)"

    extractors:
      - type: json
        name: projectIds
        internal: true
        json:
          - '.[].projectId'

  - engine:
      - sh
      - bash
    source: |
      gcloud sql instances list --project $projectId --filter='DATABASE_VERSION:POSTGRES*' --format="json(name)"

    extractors:
      - type: json
        name: sqlInstances
        internal: true
        json:
          - '.[].name'

  - engine:
      - sh
      - bash
    source: |
      gcloud sql instances describe $sqlInstance --format=json | jq '.settings.databaseFlags // [] | map(select(.name == "log_checkpoints")) | .[0]?.value'

    matchers:
      - type: word
        words:
          - 'off'

    extractors:
      - type: dsl
        dsl:
          - '"Log Checkpoints flag is disabled in PostgreSQL instance: " + sqlInstance + " in project: " + projectId'
