id: laravel-debugbar-exposure

info:
  name: Laravel 调试bar 敏感信息 暴露
  author: moamenbasel
  severity: medium
  description: |
    检测到 Laravel 调试bar 敏感信息 暴露。目标暴露了调试、错误或堆栈信息，可能泄露应用路径、框架版本、环境变量、源码位置或内部调用细节。
  remediation: |
    - 限制该端点的公网访问，仅允许可信来源访问。
    - 启用认证、授权和审计，并根据业务需要关闭不必要的调试或管理功能。
  reference:
    - https://github.com/barryvdh/laravel-debugbar
    - https://laravel.com/docs/10.x/configuration#environment-configuration
  metadata:
    verified: true
    max-request: 1
    shodan-query: html:"_debugbar"
  tags: laravel,debugbar,misconfig,exposure

http:
  - method: GET
    path:
      - "{{BaseURL}}/_debugbar/open"

    matchers-condition: and
    matchers:
      - type: word
        part: body
        words:
          - "debugbar"

      - type: word
        part: content_type
        words:
          - "application/json"

      - type: status
        status:
          - 200
