id: sftp-credentials-exposure

info:
  name: SFTP 配置文件凭据暴露（暴露面识别）
  author: geeknik,sheikhrishad
  severity: high
  description: |
    检测到目标站点可直接访问 SFTP 配置文件凭据。凭据、密钥或令牌类文件通常用于系统认证、服务调用、代码发布、远程登录或第三方 API 集成。该模板请求 `/sftp-config.json`、`/ftpsync.settings`，并通过 HTTP 状态码、响应正文关键字、文件格式特征、正则匹配或响应头进行确认。配置文件公开后可能泄露部署细节、内部路径、依赖版本、环境变量、访问凭据或调试信息，增加被侦察和后续利用的风险。
  impact: |-
    - 泄露的密码、API Key、访问令牌、私钥或服务账号凭据可能被用于直接访问云资源、代码仓库、数据库、邮件服务或内部系统。
    - 攻击者可能借助有效凭据读取或篡改业务数据、发布恶意制品、创建持久化访问、冒用服务身份或产生额外资源费用。
    - 即使凭据权限有限，也会暴露账号命名、环境划分和内部系统关系，辅助后续横向移动。
  remediation: |-
    - 立即撤销并轮换暴露文件中可能出现的密码、API Key、访问令牌、SSH/SSL 私钥、数据库连接串和云访问密钥。
    - 将敏感配置迁移到密钥管理系统、环境变量注入或受控配置中心，避免随静态文件对外发布。
    - 限制相关账号权限并启用最小权限、MFA、访问审计和异常调用告警。
    - 排查近期登录、API 调用、代码仓库、云资源和制品库操作记录，确认是否存在未授权使用。
  reference:
    - https://blog.sucuri.net/2012/11/psa-sftpftp-password-exposure-via-sftp-config-json.html
    - https://www.acunetix.com/vulnerabilities/web/sftp-ftp-credentials-exposure/
    - https://codexns.io/products/sftp_for_sublime/settings
  classification:
    cvss-metrics: CVSS:3.1/AV:N/AC:L/PR:N/UI:N/S:U/C:H/I:N/A:N
    cvss-score: 7.5
    cwe-id: CWE-200
    cpe: cpe:2.3:a:southrivertech:titan_sftp_server:*:*:*:*:windows:*:*:*
  metadata:
    verified: true
    max-request: 2
    github-query: filename:sftp-config.json
    product: titan_sftp_server
    vendor: southrivertech
  tags: sftp,config,exposure,vuln

http:
  - method: GET
    path:
      - "{{BaseURL}}/sftp-config.json"
      - "{{BaseURL}}/ftpsync.settings"

    matchers:
      - type: word
        part: body
        words:
          - '"host":'
          - '"user":'
          - '"password":'
          - '"remote_path":'
        condition: and

      - type: word
        part: body
        words:
          - "file_permissions"
          - "extra_list_connections"
        condition: and
