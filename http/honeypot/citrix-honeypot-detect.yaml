id: citrix-honeypot-detect

info:
  name: Citrix蜜罐识别（蜜罐识别）
  author: UnaPibaGeek
  severity: info
  description: |
    系统检测到 Citrix 模拟蜜罐。
    目标返回的 HTTP 响应报文和 HTML 源码特征，高度契合 Citrix Web 应用模拟蜜罐的搭建模式，可能属于虚假的目标诱捕环境。
  metadata:
    verified: true
    max-request: 1
    vendor: citrix
    product: citrix
    shodan-query:
      - http.title:“Citrix Login”
      - http.title:“citrix login”
    fofa-query: title=“citrix login”
    google-query: intitle:“citrix login”
  tags: citrix,honeypot,ir,cti,discovery

http:
  - method: GET
    path:
      - "{{BaseURL}}"

    matchers-condition: and
    matchers:
      - type: dsl
        dsl:
          - 'len(body)<2000'

      - type: word
        part: body
        words:
          - "<title>Citrix Login</title>"

      - type: word
        part: body
        words:
          - "In order to use our services, you must agree to Citrix's Terms of Service."
        negative: true
