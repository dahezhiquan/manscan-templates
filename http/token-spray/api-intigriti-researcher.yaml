id: api-intigriti-researcher

info:
  name: Intigriti-Researcher API Token 可用性校验（token喷洒）
  author: 0xpugal
  severity: high
  description: |-
    平台介绍：Intigriti-Researcher API 是面向开发者提供 API 能力的在线服务平台，常用于通过访问令牌调用账户、数据查询、自动化或集成功能。该模板用于校验提交的 Intigriti-Researcher API Token 是否仍然有效。检测逻辑会向 `api.intigriti.com/external/researcher/v1/programs` 发起低影响 API 请求，通过 Bearer Token 认证头传递 `{{token}}`，并依据响应中的 `"records"`、`"webLinks"`、`"detail"`、状态码 200 判断凭据是否可用；命中通常表示该 Token 可被继续调用对应平台能力。
  reference:
    - https://kb.intigriti.com/en/articles/8529303-intigriti-researcher-api
  metadata:
    verified: true
    max-request: 1
  tags: token-spray,intigriti
  impact: |-
    - 攻击者可确认 Token 有效并调用平台 API，读取账户、资源、配额或业务数据。
    - 有效 Token 可能被持续滥用，造成数据泄露、配额消耗、费用增加、服务滥用或进一步横向访问。
  remediation: |-
    - 立即撤销或轮换已暴露的 API Token，并确认旧 Token 不再可用。
    - 按最小权限原则重新签发凭据，限制作用域、来源地址、项目范围和有效期。
    - 在代码仓库、CI/CD、日志和配置文件中排查泄露来源，避免 Token 再次提交或外传。
self-contained: true

http:
  - method: GET
    path:
      - "https://api.intigriti.com/external/researcher/v1/programs"

    headers:
      Authorization: Bearer {{token}}
      Content-Type: application/json

    matchers-condition: and
    matchers:
      - type: word
        part: body
        words:
          - '"records"'
          - '"webLinks"'
          - '"detail"'
          - '"handle"'
          - '"value"'
          - '"status"'
        condition: and

      - type: word
        part: header
        words:
          - 'application/json'

      - type: status
        status:
          - 200
