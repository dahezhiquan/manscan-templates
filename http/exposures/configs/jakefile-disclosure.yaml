id: jakefile-disclosure

info:
  name: Jakefile Build 配置暴露（暴露面识别）
  author: 0x_Akoko
  severity: medium
  description: |
    检测到目标站点可直接访问 Jakefile Build 配置。这类配置或资源文件通常服务于应用部署、依赖管理、调试、运行参数或内部集成。该模板请求 `/Jakefile`、`/Jakefile.js`，并通过 HTTP 状态码、响应正文关键字、文件格式特征、正则匹配或响应头进行确认。此类资源公开后可能泄露部署细节、内部路径、依赖版本、环境变量、访问凭据或调试信息，增加被侦察和后续利用的风险。
  impact: |-
    - 构建与部署配置可能暴露流水线步骤、发布目标、私有包源、环境变量名称和内部服务地址。
    - 攻击者可据此推断供应链入口、构建依赖和部署路径，提升投毒、凭据钓取或定向攻击成功率。
    - 若配置中包含令牌或密钥，可能进一步导致代码仓库、制品库或生产环境被未授权访问。
  remediation: |-
    - 确认该资源是否必须公网可访问；如非业务必需，应立即从 Web 根目录、静态资源目录、对象存储或反向代理公开路径中移除。
    - 在 Web 服务器、网关、CDN 或应用路由层增加拒绝规则、身份认证、IP allowlist 或内网访问限制。
    - 检查访问日志、下载记录和缓存记录，评估该资源是否已被外部访问或搜索引擎收录。
    - 若文件中包含凭据、令牌、连接串或私有地址，应执行密钥轮换、权限收敛和受影响系统访问审计。
  reference:
    - https://jakejs.com/
    - https://github.com/jakejs/jake
  classification:
    cvss-metrics: CVSS:3.1/AV:N/AC:L/PR:N/UI:N/S:U/C:L/I:N/A:N
    cvss-score: 5.3
    cwe-id: CWE-200
  metadata:
    verified: true
    max-request: 2
    shodan-query: html:"Jakefile"
  tags: exposure,devops,jakefile,nodejs,config

http:
  - method: GET
    path:
      - "{{BaseURL}}/Jakefile"
      - "{{BaseURL}}/Jakefile.js"

    stop-at-first-match: true
    matchers:
      - type: dsl
        dsl:
          - 'status_code == 200'
          - '!contains_any(body, "<!DOCTYPE", "<html", "<HTML")'
          - 'contains(body, "task(") && contains_any(body, "desc(", "jake.", "namespace(")'
        condition: and
