id: gcloud-object-versioning-not-enabled

info:
  name: Enable Object Versioning 的Cloud Storage Buckets（云安全）
  author: princechaddha
  severity: medium
  description: Cloud Storage object versioning 可保留对象历史版本，降低误删、覆盖或恶意篡改后的恢复难度。本模板执行 gsutil versioning get，返回 Suspended 时报告 bucket 未启用对象版本控制。
  impact: |
    - 对象被误删或覆盖后可能无法恢复到先前版本，造成数据丢失。
    - 勒索、供应链错误或批量覆盖事件发生时，缺少版本会显著降低恢复能力。
  remediation: |
    - 为关键 bucket 启用 object versioning，并结合生命周期规则管理旧版本保留期限和成本。
    - 定期演练对象恢复流程，确认删除、覆盖和版本回滚权限受控。
  reference:
    - https://cloud.google.com/storage/docs/object-versioning
  metadata:
    vendor: google
    product: cloud-storage
  tags: cloud,devops,gcp,gcloud,google-cloud-storage,object-versioning,backup,gcp-cloud-config

flow: |
  code(1)
  for(let projectId of iterate(template.projectIds)){
    set("projectId", projectId)
    code(2)
    for(let bucketName of iterate(template.buckets)){
      set("bucketName", bucketName)
      code(3)
    }
  }

self-contained: true

code:
  - engine:
      - sh
      - bash
    source: |
      gcloud projects list --format="json(projectId)"

    extractors:
      - type: json
        name: projectIds
        internal: true
        json:
          - '.[].projectId'

  - engine:
      - sh
      - bash
    source: |
      gsutil ls -p $projectId | jq -R . | jq -s .

    extractors:
      - type: json
        name: buckets
        internal: true
        json:
          - '.[]'

  - engine:
      - sh
      - bash
    source: |
      gsutil versioning get $bucketName

    matchers:
      - type: word
        words:
          - 'Suspended'

    extractors:
      - type: dsl
        dsl:
          - '"Object versioning is not enabled for the bucket " + bucketName + " in project " + projectId'
