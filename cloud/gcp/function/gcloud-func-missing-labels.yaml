id: gcloud-func-missing-labels

info:
  name: 缺失 User-Defined Labels 中的Google Cloud Functions（云安全）
  author: princechaddha
  severity: low
  description: Cloud Functions 缺少用户自定义标签时，资源归属、成本分摊和合规治理难以自动化。本模板枚举函数并检查 labels 字段，值为 null 时报告函数未配置标签。
  impact: |
    - 安全团队难以按应用、环境、负责人或数据等级筛选函数，影响风险分级和整改追踪。
    - 成本核算、生命周期管理和例外审批缺少可靠元数据支撑。
  remediation: |
    - 为函数添加符合组织规范的标签，例如 owner、env、app、data-classification 和 cost-center。
    - 在部署流水线中强制校验必需标签，避免新函数无归属上线。
  reference:
    - https://cloud.google.com/resource-manager/docs/creating-managing-labels
  metadata:
    vendor: google
    product: cloud-functions
  tags: cloud,devops,gcp,gcloud,google-cloud-functions,gcp-cloud-config

flow: |
  code(1)
  for(let projectId of iterate(template.projectIds)){
    set("projectId", projectId)
    code(2)
    for(let functionDetail of iterate(template.functions)){
      set("functionName", functionDetail)
      code(3)
    }
  }

self-contained: true

code:
  - engine:
      - sh
      - bash
    source: |
      gcloud projects list --format="json(projectId)"

    extractors:
      - type: json
        name: projectIds
        internal: true
        json:
          - '.[].projectId'

  - engine:
      - sh
      - bash
    source: |
      gcloud functions list --project $projectId --format="json(name)"

    extractors:
      - type: json
        name: functions
        internal: true
        json:
          - '.[].name'

  - engine:
      - sh
      - bash
    source: |
      gcloud functions describe $functionName --format="json(labels)"

    matchers:
      - type: word
        words:
          - 'null'

    extractors:
      - type: dsl
        dsl:
          - '"Missing labels for function: " + functionName + " in " + projectId + " project"'
