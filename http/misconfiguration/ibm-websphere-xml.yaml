id: ibm-websphere-xml

info:
  name: IBM WebSphere Application Source 文件 暴露
  author: r3nz0
  severity: medium
  description: |
    检测到 IBM WebSphere Application Source 文件 暴露。目标响应或文件中可能暴露配置、凭据、密钥、令牌、环境变量或历史记录等敏感信息，可能被用于进一步入侵。
  reference:
    - https://www.acunetix.com/vulnerabilities/web/ibm-websphere-weblogic-application-source-file-exposure/
  classification:
    cwe-id: CWE-219
  metadata:
    verified: true
    max-request: 1
  tags: ibm,websphere,exposure,misconfig,vuln

http:
  - method: GET
    path:
      - "{{BaseURL}}/iojs/%2e/WEB-INF/web.xml"

    matchers-condition: and
    matchers:
      - type: word
        part: body
        words:
          - "</web-app>"
          - "<servlet>"
        condition: and

      - type: status
        status:
          - 200
