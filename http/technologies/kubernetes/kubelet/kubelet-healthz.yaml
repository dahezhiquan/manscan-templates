id: kubelet-healthz

info:
  name: Kubelet Healthz 指纹识别（指纹识别）
  author: sharath
  severity: info
  description: 用于识别目标是否使用 Kubelet Healthz，模板会结合 HTTP 响应头、页面正文、状态码和特定路径或已知端点进行技术指纹匹配。
  metadata:
    max-request: 1
  tags: tech,k8s,kubernetes,devops,kubelet,discovery

http:
  - method: GET
    path:
      - "{{BaseURL}}/healthz"

    matchers-condition: and
    matchers:
      - type: status
        status:
          - 200

      - type: regex
        part: header
        regex:
          - "text/plain"

      - type: word
        part: body
        words:
          - "ok"

      - type: word
        part: header
        words:
          - "Kubernetes"
