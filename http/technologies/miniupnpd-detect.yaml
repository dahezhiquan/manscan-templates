id: miniupnpd-detect

info:
  name: MiniUPnPd 指纹识别（指纹识别）
  author: Shivam Kamboj
  severity: info
  description: >-
    MiniUPnPd 是轻量级 UPnP IGD/NAT-PMP 服务，用于路由器或网关设备的端口映射和网络发现。该模板通过请求目标服务并检查预设路径或首页响应、HTTP
    响应头、正则特征等指纹特征，判断目标是否使用或暴露了 MiniUPnPd 相关组件；命中结果仅表示指纹特征匹配，可用于资产盘点、技术栈识别和后续安全评估，不代表已确认存在可利用漏洞。
  metadata:
    max-request: 1
    shodan-query: "MiniUPnPd"
  tags: tech,miniupnpd
http:
  - method: GET
    path:
      - "{{BaseURL}}"

    matchers:
      - type: regex
        part: header
        regex:
          - 'MiniUPnPd'

    extractors:
      - type: regex
        part: header
        group: 1
        regex:
          - 'MiniUPnPd/([0-9.]+)'
