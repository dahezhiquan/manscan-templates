id: greatpages-takeover

info:
  name: GreatPages 页面缺失接管检测（子域名接管）
  author: juliosmelo
  severity: high
  description: |
    通过识别 GreatPages.com.br 未声明页面显示的默认 404 错误，检测目标子域名是否仍指向 GreatPages 但未绑定有效页面，从而判断潜在接管风险。
  reference:
    - https://greatpages.com.br
  metadata:
    verified: true
    fofa-query: cname="cname.greatpages.com.br"
    max-request: 1
  tags: takeover,greatpages,vuln

http:
  - method: GET
    path:
      - "{{BaseURL}}"

    matchers-condition: and
    matchers:
      - type: dsl
        dsl:
          - Host != ip

      - type: word
        words:
          - "Página não encontrada (Erro 404)"

    extractors:
      - type: dsl
        dsl:
          - cname
