id: sogo-detect

info:
  name: SOGo 指纹识别（指纹识别）
  author: righettod
  severity: info
  description: >-
    SOGo 是开源群件和 Webmail 平台，用于邮件、日历、通讯录和移动同步服务。该模板通过请求目标服务并检查预设路径或首页响应、页面正文关键字、状态码等指纹特征，判断目标是否使用或暴露了
    SOGo 相关组件；命中结果仅表示指纹特征匹配，可用于资产盘点、技术栈识别和后续安全评估，不代表已确认存在可利用漏洞。
  reference:
  - https://www.sogo.nu/
  classification:
    cpe: cpe:2.3:a:alinto:sogo:*:*:*:*:*:*:*:*
  metadata:
    verified: true
    max-request: 2
    vendor: alinto
    product: sogo
    shodan-query: http.title:"SOGo"
  tags: sogo,tech,discovery
http:
  - method: GET
    path:
      - "{{BaseURL}}"
      - "{{BaseURL}}/SOGo"

    stop-at-first-match: true
    host-redirects: true
    max-redirects: 2

    matchers-condition: and
    matchers:
      - type: word
        part: body
        words:
          - 'content="SOGo Web Interface"'
          - 'sg-default="SOGo'
        condition: or

      - type: status
        status:
          - 200
