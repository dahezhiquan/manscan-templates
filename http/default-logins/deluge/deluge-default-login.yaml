id: deluge-default-login

info:
  name: Deluge 默认口令登录（弱口令）
  author: ritikchaddha
  severity: high
  description: |
    该模板通过尝试 Deluge 的默认账号口令，并依据认证成功后的响应特征判断目标是否仍在使用未修改的弱口令。若命中，攻击者可直接登录系统，进一步访问敏感信息、修改配置或执行未授权操作。
  reference:
    - https://docs.linuxserver.io/images/docker-deluge/#:~:text=The%20admin%20interface%20is%20available,%2D%3EInterface%2D%3EPassword.
  metadata:
    max-request: 1
    verified: true
    shodan-query: title:"Deluge"
  tags: deluge,default-login,vuln

http:
  - raw:
      - |
        POST /json HTTP/1.1
        Host: {{Hostname}}
        Content-Type: application/json

        {"method":"auth.login","params":["{{password}}"],"id":51}

    payloads:
      password:
        - deluge

    matchers-condition: and
    matchers:
      - type: word
        part: body
        words:
          - 'result": true'
          - 'error": null'
          - 'id": 51'
        condition: and

      - type: word
        part: header
        words:
          - "_session_id="
          - "application/json"
        condition: and

      - type: status
        status:
          - 200
