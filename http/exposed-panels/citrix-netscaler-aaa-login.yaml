id: citrix-netscaler-aaa-login

info:
  name: NetScaler AAA 登录面板识别（指纹识别）
  author: dhiyaneshDk,righettod
  severity: info
  description: |-
    检测到目标站点存在 NetScaler AAA 相关响应特征。NetScaler AAA 是自动化运维、持续集成或任务编排平台，用于管理作业、流水线、凭据、执行记录和部署流程。模板请求 `/logon/LogonPoint/tmindex.html`，并通过页面标题或正文关键字确认该系统指纹，用于资产识别、系统盘点和暴露面梳理。
  reference:
    - https://www.exploit-db.com/ghdb/6898
  classification:
    cvss-metrics: CVSS:3.0/AV:N/AC:L/PR:N/UI:N/S:U/C:N/I:N/A:N
    cwe-id: CWE-200
    cpe: cpe:2.3:a:citrix:netscaler:*:*:*:*:*:*:*:*
  metadata:
    max-request: 1
    vendor: citrix
    product: netscaler
  tags: panel,netscaler,login,edb,citrix,detect,discovery
http:
  - method: GET
    path:
      - '{{BaseURL}}/logon/LogonPoint/tmindex.html'

    matchers:
      - type: word
        words:
          - "NetScaler AAA</title>"
          - "_ctxstxt_NetscalerAAA"
        condition: or
