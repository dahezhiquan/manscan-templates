id: aerohive-netconfig-ui

info:
  name: Aerohive NetConfig UI 面板识别（暴露面识别）
  author: pussycat0x
  severity: info
  description: 该模板用于识别 Aerohive NetConfig UI 相关页面或服务入口是否对外暴露。若命中，说明目标可被识别为对应产品或组件，可用于资产发现与攻击面管理。
  reference:
    - https://docs.aerohive.com/330000/docs/help/english/ng/Content/reference/docs/online-help-systems.htm
  classification:
    cwe-id: CWE-200
    cpe: cpe:2.3:h:extremenetworks:aerohive_netconfig:*:*:*:*:*:*:*:*
  metadata:
    max-request: 1
    shodan-query: http.title:"Aerohive NetConfig UI"
    product: aerohive_netconfig
    vendor: extremenetworks
  tags: panel,tech,hiveos,aerohive,discovery

http:
  - method: GET
    path:
      - "{{BaseURL}}/index.php5"

    matchers-condition: and
    matchers:
      - type: word
        part: body
        words:
          - '<title>Aerohive NetConfig UI</title>'

      - type: status
        status:
          - 200

    extractors:
      - type: regex
        part: body
        group: 1
        regex:
          - 'version" align="right" valign="bottom">([0-9.a-z]+)<\/td>'
