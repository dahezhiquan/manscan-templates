id: wordpress-eol

info:
  name: WordPress EOL 指纹识别（指纹识别）
  author: Shivam Kamboj
  severity: info
  description: >-
    WordPress 是开源内容管理与博客系统，EOL 版本表示目标站点运行的核心版本已结束维护。该模板通过请求目标服务并检查预设路径或首页响应、页面正文关键字、正则特征、DSL
    条件等指纹特征，判断目标是否使用或暴露了 WordPress EOL 相关组件；命中结果仅表示指纹特征匹配，可用于资产盘点、技术栈识别和后续安全评估，不代表已确认存在可利用漏洞。
  reference:
  - https://endoflife.date/wordpress
  - https://wordpress.org/documentation/article/wordpress-versions/
  metadata:
    verified: true
    max-request: 1
    shodan-query: "WordPress"
  tags: tech,wordpress,eol
http:
  - method: GET
    path:
      - "{{BaseURL}}"

    extractors:
      - type: regex
        part: body
        name: version
        group: 1
        regex:
          - '(?i)<meta[^>]*name=["\'']?generator["\'']?[^>]*content=["\'']?WordPress\s+([0-9.]+)'
          - 'wp-includes/js/wp-emoji-release(?:\.min)?\.js\?ver=([0-9]+\.[0-9.]+)'
          - 'wp-includes/css/dist/block-library/style(?:\.min)?\.css\?ver=([0-9]+\.[0-9.]+)'
          - 'wp-includes/blocks/[a-z-]+/style(?:\.min)?\.css\?ver=([0-9]+\.[0-9.]+)'

    matchers-condition: and
    matchers:
      - type: dsl
        dsl:
          - 'contains_any(to_lower(body), "/wp-content/","/wp-includes/","/wp-json/")'
        condition: or

      - type: dsl
        dsl:
          - 'len(version) > 0'
          - 'compare_versions(version, "<6.9")'
        condition: and
