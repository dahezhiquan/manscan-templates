id: node-red-unauth

info:
  name: Node RED 未授权 访问
  author: 0xBassia
  severity: high
  description: |
    检测到 Node RED 未授权 访问。目标功能在未认证状态下可访问，可能暴露管理入口、业务数据、系统状态或可执行操作，需确认是否存在访问控制缺失。
  impact: |
    - 未授权用户可能访问管理功能、业务数据或系统状态。
    - 暴露接口可能被用于进一步枚举、修改配置或执行敏感操作。
  remediation: |
    - 为相关管理界面和 API 启用强认证、授权校验和最小权限控制。
    - 将后台端点限制在可信网络或 VPN 内，并记录访问审计日志。
  reference:
    - https://nodered.org/docs/user-guide/runtime/securing-node-red
    - https://nodered.org/docs/user-guide/runtime/configuration
  classification:
    cvss-metrics: CVSS:3.1/AV:N/AC:L/PR:N/UI:N/S:U/C:H/I:H/A:H
    cvss-score: 9.8
    cwe-id: CWE-306
  metadata:
    verified: true
    max-request: 1
    shodan-query: title:"Node-RED"
  tags: misconfig,nodered,unauth,rce

http:
  - method: GET
    path:
      - '{{BaseURL}}/flows'

    matchers-condition: and
    matchers:
      - type: word
        part: body
        words:
          - '"id"'
          - '"type"'
          - '"wires"'
        condition: and

      - type: word
        part: header
        words:
          - "application/json"

      - type: status
        status:
          - 200
