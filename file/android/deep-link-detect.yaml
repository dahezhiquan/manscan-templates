id: deep-link-detect

info:
  name: Android 深度链接识别（本地文件安全扫描）
  author: Hardik-Solanki
  severity: info
  description: |
    该模板检测 Android 应用中的 Deep Link 配置。深度链接若缺少校验，可能被外部输入触发敏感页面或业务动作。
  reference:
    - https://developer.android.com/training/app-links/deep-linking
    - https://www.geeksforgeeks.org/deep-linking-in-android-with-example/
    - https://medium.com/@muratcanbur/intro-to-deep-linking-on-android-1b9fe9e38abd
  classification:
    cvss-metrics: CVSS:3.1/AV:N/AC:L/PR:N/UI:N/S:U/C:N/I:N/A:N
    cvss-score: 0
    cwe-id: CWE-200
  metadata:
    verified: true
  tags: android,file,deeplink

file:
  - extensions:
      - xml

    matchers-condition: and
    matchers:
      - type: word
        words:
          - "android:scheme"
          - "android:host"
          - "android:name"
        condition: and

