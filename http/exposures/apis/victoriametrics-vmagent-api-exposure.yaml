id: victoriametrics-vmagent-api-exposure

info:
  name: VictoriaMetrics vmagent - 未认证 Targets 暴露（暴露面识别）
  author: RootKaito
  severity: low
  description: |-
    VictoriaMetrics vmagent 的 targets 接口在未认证的情况下暴露，泄露了内部服务清单和抓取配置。
  reference:
    - https://docs.victoriametrics.com/victoriametrics/vmagent/
  classification:
    cpe: cpe:2.3:a:victoriametrics:victoriametrics:*:*:*:*:*:*:*:*
  metadata:
    verified: true
    max-request: 1
    vendor: victoriametrics
    product: vmagent
  tags: exposure,victoriametrics,vmagent,unauth,misconfig

http:
  - method: GET
    path:
      - "{{BaseURL}}/api/v1/targets"

    matchers-condition: and
    matchers:
      - type: word
        part: body
        words:
          - '"activeTargets"'

      - type: word
        part: header
        words:
          - "X-Server-Hostname"

      - type: status
        status:
          - 200

    extractors:
      - type: json
        name: active_targets
        json:
          - ".data.activeTargets"
