id: somansa-dlp-detect

info:
  name: Somansa DLP 登录面板暴露（暴露面识别）
  author: gy741,ritikchaddha
  severity: low
  description: Somansa DLP 是数据防泄漏平台，用于敏感数据发现、终端管控和泄露审计。该模板请求 `/DLPCenter/loginform.sms`、`/DLPCenter/images/favicon.ico`，并依据 favicon 哈希、页面标题、正文关键字或品牌资源特征、DSL 条件判断目标是否对外暴露了 Somansa DLP 的登录面板，用于发现互联网可访问的后台、控制台或业务入口。
  impact: "- 暴露的 Somansa DLP 登录面板会泄露目标正在使用的产品、部署路径、页面特征或组织业务入口，便于攻击者进行指纹确认和漏洞匹配。\n- 如果认证、访问控制或默认凭据策略薄弱，攻击者可能进一步尝试进入后台，影响安全策略、终端资产、告警处置流程和审计数据。\n- 对互联网开放的管理入口会增加暴力破解、凭据填充、已知漏洞利用和钓鱼仿冒的攻击面。"
  remediation: "- 将 Somansa DLP 的登录面板限制在内网、VPN、零信任代理或专用管理网段访问，避免直接暴露在互联网。\n- 启用强密码、多因素认证、登录失败限制和审计告警，排查默认账号、弱口令及长期未使用账号。\n- 保持 Somansa DLP 及其依赖组件更新到受支持版本，并通过反向代理、ACL 或防火墙限制敏感路径访问。"
  reference:
  - https://www.somansa.com/solution/integrated_solution/dlp/
  classification:
    cvss-metrics: CVSS:3.0/AV:N/AC:L/PR:N/UI:N/S:U/C:N/I:N/A:N
    cwe-id: CWE-200
  metadata:
    verified: true
    max-request: 2
    shodan-query: http.html:"DLP system"
  tags: panel,somansa,dlp,discovery

http:
  - method: GET
    path:
      - "{{BaseURL}}/DLPCenter/loginform.sms"
      - "{{BaseURL}}/DLPCenter/images/favicon.ico"

    stop-at-first-match: true

    matchers-condition: or
    matchers:
      - type: word
        part: body
        words:
          - "/DLPCenter/js/"
          - "SOMANSA"
        condition: and
        case-insensitive: true

      - type: dsl
        dsl:
          - "status_code==200 && (\"-1217239281\" == mmh3(base64_py(body)))"
