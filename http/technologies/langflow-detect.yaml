id: langflow-detect

info:
  name: Langflow 指纹识别（指纹识别）
  author: rxerium
  severity: info
  description: |
    用于识别目标是否部署 Langflow 并提取相关版本或构建信息，模板会结合页面标题、页面正文、特定路径或已知端点和版本或标识提取结果进行指纹匹配。
  reference:
    - https://github.com/langflow-ai/langflow
    - https://docs.langflow.org/
  metadata:
    verified: true
    max-request: 2
    vendor: langflow-ai
    product: langflow
    shodan-query: 'http.title:"Langflow"'
  tags: tech,langflow,llm,ai,detect,discovery

http:
  - method: GET
    path:
      - "{{BaseURL}}/api/v1/version"
      - "{{BaseURL}}"

    stop-at-first-match: true

    matchers-condition: or
    matchers:
      - type: word
        part: body
        words:
          - '"package":"Langflow"'

      - type: word
        part: body
        words:
          - "<title>Langflow</title>"

    extractors:
      - type: regex
        part: body
        group: 1
        regex:
          - '"version"\s*:\s*"([0-9\.]+)"'
