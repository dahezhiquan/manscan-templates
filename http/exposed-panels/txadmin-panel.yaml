id: txadmin-panel

info:
  name: txAdmin 登录面板识别（指纹识别）
  author: s4e-io
  severity: info
  description: |-
    txAdmin 是 FiveM 服务器管理面板，用于游戏服务器状态、玩家、配置和运维控制。该模板请求 `/auth`，并依据 DSL 条件识别目标是否部署了该系统或暴露了对应入口，适用于资产指纹确认；命中结果仅表示系统特征匹配，不代表已确认存在未授权访问或可利用漏洞。
  metadata:
    verified: true
    max-request: 1
    fofa-query: title="txAdmin Login"
  tags: panel,login,txadmin,detect,discovery

http:
  - method: GET
    path:
      - "{{BaseURL}}/auth"

    matchers:
      - type: dsl
        dsl:
          - 'contains_any(body, "<title>txAdmin Login</title>", "txAdmin Logo")'
          - 'status_code == 200'
        condition: and
