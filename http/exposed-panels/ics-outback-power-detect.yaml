id: ics-outback-power-detect

info:
  name: OutBack Power Mate3s Gateway 识别（指纹识别）
  author: rxerium
  severity: info
  description: |-
    检测到目标站点存在 OutBack Power Mate3s Gateway 相关响应特征。OutBack Power Mate3s Gateway 是网络设备或网关的 Web 管理界面，用于配置路由、无线、端口转发、安全策略和设备运行参数。模板请求 `/`，并通过页面标题或正文关键字、状态码确认该系统指纹，用于资产识别、系统盘点和暴露面梳理。
  reference:
    - https://www.outbackpower.com/outback-products/communications/detail/mate3s
  metadata:
    max-request: 1
    verified: true
    shodan-query: http.title:"Outback Power"
    vendor: outback-power
    product: mate3s
  tags: tech,panel,outback,ics,solar,energy,scada,detect
http:
  - method: GET
    path:
      - "{{BaseURL}}"

    host-redirects: true
    max-redirects: 2

    matchers-condition: and
    matchers:
      - type: word
        part: body
        words:
          - '<title>Outback Power</title>'
          - 'status_tab'
          - 'meters_tab'
        condition: or

      - type: status
        status:
          - 200
