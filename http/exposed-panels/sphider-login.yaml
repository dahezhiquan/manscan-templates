id: sphider-login

info:
  name: Sphider Admin 登录面板识别（暴露面识别）
  author: dhiyaneshDK
  severity: info
  description: 该模板通过识别 Sphider Admin 登录入口的页面标题、特征文本或重定向行为，判断目标是否暴露了对应的认证界面。若命中，说明该登录面板对外可访问，可用于暴露面梳理与后续安全评估。
  reference:
    - https://www.exploit-db.com/ghdb/6641
  classification:
    cvss-metrics: CVSS:3.0/AV:N/AC:L/PR:N/UI:N/S:U/C:N/I:N/A:N
    cwe-id: CWE-200
    cpe: cpe:2.3:a:sphider:sphider:*:*:*:*:*:*:*:*
  metadata:
    max-request: 3
    vendor: sphider
    product: sphider
  tags: edb,panel,sphider,discovery

http:
  - method: GET
    path:
      - '{{BaseURL}}/admin/spider.php'
      - '{{BaseURL}}/sphider/admin/admin.php'
      - '{{BaseURL}}/search/admin/admin.php'

    stop-at-first-match: true

    matchers-condition: and
    matchers:
      - type: word
        words:
          - '<title>Sphider Admin Login</title>'

      - type: status
        status:
          - 200
