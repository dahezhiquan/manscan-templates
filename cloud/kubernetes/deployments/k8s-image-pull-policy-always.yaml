id: k8s-image-pull-policy-always

info:
  name: Image Pull 策略 set to Always（云安全）
  author: princechaddha
  severity: low
  description: Deployment 未统一设置 imagePullPolicy 为 Always 时，节点可能复用本地缓存镜像，导致镜像更新、回滚和安全修复无法按预期生效。本模板枚举 Deployment，检查所有容器是否均配置 imagePullPolicy 为 Always。
  impact: |
    - 节点可能继续运行旧镜像，延迟漏洞修复或配置变更生效。
    - 不同节点缓存状态不一致时，同一 Deployment 可能运行不同镜像内容，影响可追溯性。
  remediation: |
    - 对需要持续拉取的工作负载设置 imagePullPolicy 为 Always，并配合固定镜像标签或 digest 使用。
    - 建立镜像发布和回滚流程，确保节点缓存不会掩盖镜像更新。
  reference:
    - https://kubernetes.io/docs/concepts/containers/images/#updating-images
  metadata:
    vendor: kubernetes
    product: kubernetes
  tags: cloud,devops,kubernetes,devsecops,deployments,images,docker,k8s-cluster-security
flow: |
  code(1);
  for (let deployment of template.items) {
    set("deployment",deployment)
    javascript(1);
  }

self-contained: true

code:
  - engine:
      - sh
      - bash
    source: kubectl get deployments --all-namespaces --output=json
    extractors:
      - type: json
        name: items
        internal: true
        json:
          - '.items[]'

javascript:
  - code: |
        deployment = JSON.parse(template.deployment);
        if (!deployment.spec.template.spec.containers.every(container => container.imagePullPolicy === 'Always')) {
          let result = (`Deployment '${deployment.metadata.name}' in namespace '${deployment.metadata.namespace}' does not have image pull policy set to Always.`);
          Export(result);
        }

    extractors:
      - type: dsl
        dsl:
          - response
