id: azure-apim-http2-not-enabled
info:
  name: Azure API Management HTTP/2 支持未启用（云安全）
  author: princechaddha
  severity: medium
  description: Azure API Management 网关未启用 HTTP/2 时，客户端无法使用该协议提供的连接复用和传输效率，可能影响高并发 API 的性能与资源利用。该模板枚举 APIM 实例，查询 customProperties，并在 Microsoft.WindowsAzure.ApiManagement.Gateway.Protocols.Server.Http2 为 False 时报告问题。
  impact: |
    - 高并发场景下连接建立和请求复用效率可能下降，增加网关延迟、连接开销和扩容压力。
    - 依赖 HTTP/2 特性的客户端或 API 集成可能出现性能退化或兼容性差异。
  remediation: |
    - 在确认客户端、网关 SKU 和后端兼容后启用 APIM 网关 HTTP/2 支持。
    - 变更后通过真实 API 流量验证协议协商、延迟、连接复用和错误率，并纳入配置基线持续检查。
  reference:
    - https://docs.microsoft.com/en-us/azure/api-management/api-management-howto-http2
  metadata:
    vendor: microsoft
    product: azure-api-management
  tags: cloud,devops,azure,microsoft,api-management,azure-cloud-config

flow: |
  code(1);
  for (let APIData of iterate(template.apiList)) {
    APIData = JSON.parse(APIData);
    set("name", APIData.name);
    set("resourceGroup", APIData.resourceGroup);
    code(2);
  }

self-contained: true
code:
  - engine:
      - sh
      - bash
    source: |
      az apim list --output json --query '[*].{name:name, resourceGroup:resourceGroup}'

    extractors:
      - type: json
        name: apiList
        internal: true
        json:
          - '.[]'

  - engine:
      - sh
      - bash
    source: |
      az apim show --name "$name" --resource-group "$resourceGroup" --output json --query 'customProperties'

    matchers-condition: and
    matchers:
      - type: word
        words:
          - '"Microsoft.WindowsAzure.ApiManagement.Gateway.Protocols.Server.Http2": "False"'

    extractors:
      - type: dsl
        dsl:
          - 'name + " in resource group " + resourceGroup + " does not have HTTP/2 enabled"'
