id: traccar-panel

info:
  name: Traccar 登录面板识别（指纹识别）
  author: s4e-io
  severity: info
  description: |-
    Traccar 是 GPS 车辆和设备定位平台，用于设备接入、轨迹、告警和用户管理。该模板请求 `/login`，并依据 DSL 条件识别目标是否部署了该系统或暴露了对应入口，适用于资产指纹确认；命中结果仅表示系统特征匹配，不代表已确认存在未授权访问或可利用漏洞。
  metadata:
    verified: true
    max-request: 1
    fofa-query: app="Traccar"
    shodan-query: html:"Traccar"
  tags: panel,login,traccar,detect,discovery

http:
  - method: GET
    path:
      - "{{BaseURL}}/login"

    host-redirects: true
    matchers:
      - type: dsl
        dsl:
          - 'contains_any(body, "<title>Traccar</title>", "Traccar GPS Tracking System")'
          - 'status_code == 200'
        condition: and
