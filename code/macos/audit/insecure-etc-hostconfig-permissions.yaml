id: insecure-etc-hostconfig-permissions

info:
  name: macOS /etc/hostconfig 权限不安全（本地基线扫描）
  author: geeknik
  severity: high
  description: |
    `/etc/hostconfig` 属于历史系统服务配置文件，若权限不安全，攻击者可能篡改遗留服务行为或影响兼容组件启动。模板检查该文件是否存在且不符合 root 管理的只读基线权限，命中时表示配置文件权限异常。
  impact: |
    - 本地攻击者可能篡改可自动执行或高权限相关文件，造成持久化、权限提升或配置破坏。
    - 关键配置完整性受损后，系统行为和审计结果可能被误导。
  remediation: |
    - 移除全局可写位，确保关键文件和目录仅由 root 或授权管理员维护。
    - 对已发现的异常文件核验内容、属主和最近修改记录，必要时从可信基线恢复。
  tags: macos,audit,local,security

self-contained: true

code:
  - engine:
      - sh
      - bash
    source: |
      ls -l /etc/hostconfig 2>&1
    matchers-condition: and
    matchers:
      - type: status
        status:
          - 0
      - type: regex
        regex:
          - "^-rw-r--r--\\s+\\d+\\s+root\\s+\\w+"
        negative: true
