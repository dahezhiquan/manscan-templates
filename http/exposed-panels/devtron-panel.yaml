id: devtron-panel

info:
  name: Devtron Panel 登录面板识别（暴露面识别）
  author: johnk3r
  severity: info
  description: |
    该模板通过识别 Devtron 登录入口的页面标题、特征文本或重定向行为，判断目标是否暴露了对应的认证界面。若命中，说明该登录面板对外可访问，可用于暴露面梳理与后续安全评估。
  reference:
    - https://devtron.ai/
  metadata:
    max-request: 1
    shodan-query: http.title:"Devtron"
  tags: panel,devtron,discovery

http:
  - method: GET
    path:
      - "{{BaseURL}}/dashboard/login"

    matchers-condition: and
    matchers:
      - type: word
        part: body
        words:
          - "<title>Devtron</title>"

      - type: status
        status:
          - 200
