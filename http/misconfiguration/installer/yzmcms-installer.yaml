id: yzmcms-installer

info:
  name: YzmCMS 安装向导
  author: ritikchaddha
  severity: high
  description: |
    该模板用于核查 YzmCMS 安装向导。该类问题通常源于安装、初始化、升级或配置向导在部署完成后仍可从公网访问。模板会向目标发送探测请求，并依据请求 `/application/install/index.php`、`/index.php?step=2`、匹配 `安装程序 - YzmCMS`、匹配 `YzmCMS`等证据确认目标是否存在该配置问题。
  impact: |
    - 攻击者可能完成初始化流程、创建管理员账户、覆盖配置或触发升级逻辑。
    - 在部分系统中，暴露安装入口还可能导致数据库连接信息泄露、站点被重新配置或业务被接管。
  remediation: |
    - 完成部署后立即删除、禁用或限制安装与升级入口。
    - 对初始化流程增加来源限制和一次性安装校验，避免公网直接访问。
    - 检查系统是否已被异常初始化或创建未知管理员账户，并轮换相关凭据。
  classification:
    cpe: cpe:2.3:a:yzmcms:yzmcms:*:*:*:*:*:*:*:*
  metadata:
    verified: true
    max-request: 1
    vendor: yzmcms
    product: yzmcms
    shodan-query: title:"YzmCMS"
    fofa-query: title="YzmCMS"
  tags: misconfig,yzmcms,install,exposure,vuln

http:
  - method: GET
    path:
      - '{{BaseURL}}/application/install/index.php'

    matchers-condition: and
    matchers:
      - type: word
        part: body
        words:
          - '安装程序 - YzmCMS'
          - 'YzmCMS'
        condition: or

      - type: word
        part: body
        words:
          - '/index.php?step=2'
          - '/install.css'
        condition: or

      - type: status
        status:
          - 200
