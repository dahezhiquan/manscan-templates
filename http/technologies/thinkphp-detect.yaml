id: thinkphp-detect

info:
  name: ThinkPHP 指纹识别（指纹识别）
  author: pwnhxl
  severity: info
  description: >-
    ThinkPHP 是基于 PHP 的 Web 应用开发框架，常用于快速构建企业站点、后台系统和接口服务。该模板通过请求目标服务并检查预设路径或首页响应、页面正文关键字、HTTP
    响应头等指纹特征，判断目标是否使用或暴露了 ThinkPHP 相关组件；命中结果仅表示指纹特征匹配，可用于资产盘点、技术栈识别和后续安全评估，不代表已确认存在可利用漏洞。
  classification:
    cvss-metrics: CVSS:3.0/AV:N/AC:L/PR:N/UI:N/S:U/C:N/I:N/A:N
    cvss-score: 0
    cwe-id: CWE-200
    cpe: cpe:2.3:a:thinkphp:thinkphp:*:*:*:*:*:*:*:*
  metadata:
    verified: true
    max-request: 2
    shodan-query: title:"ThinkPHP"
    fofa-query: app="ThinkPHP"
    product: thinkphp
    vendor: thinkphp
  tags: thinkphp,tech,detect,intrusive,discovery
http:
  - method: GET
    path:
      - "{{BaseURL}}"
      - "{{BaseURL}}/?s={{randstr}}&c={{randstr}}&a={{randstr}}&m={{randstr}}"

    stop-at-first-match: true

    matchers-condition: or
    matchers:
      - type: word
        part: body
        words:
          - '/Library/Think/'
          - '{ Fast & Simple OOP PHP Framework } -- [ WE CAN DO IT JUST THINK ]'
          - '/thinkphp/library/think/'
        condition: or

      - type: word
        part: header
        words:
          - 'X-Powered-By: ThinkPHP'
