id: nimplant-c2

info:
  name: NimPlant C2 Server 指纹识别（指纹识别）
  author: ja1sh
  severity: info
  description: >-
    NimPlant C2 Server 是基于 Nim 的命令控制框架服务端，用于安全研究或红队场景中的会话管理。该模板通过请求目标服务并检查预设路径或首页响应、HTTP
    响应头、页面正文关键字等指纹特征，判断目标是否使用或暴露了 NimPlant C2 Server 相关组件；命中结果仅表示指纹特征匹配，可用于资产盘点、技术栈识别和后续安全评估，不代表已确认存在可利用漏洞。
  reference:
  - https://github.com/chvancooten/NimPlant
  metadata:
    verified: true
    max-request: 1
    shodan-query: "nimplant C2 server"
  tags: tech,nimplant,c2,discovery
http:
  - method: GET
    path:
      - "{{BaseURL}}"

    matchers:
      - type: word
        part: header
        words:
          - "NimPlant C2 Server"
