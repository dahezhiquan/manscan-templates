id: azure-postgres-log-checkpoints-disabled
info:
  name: Azure PostgreSQL Flexible Server 检查点日志未启用（云安全）
  author: princechaddha
  severity: medium
  description: Azure PostgreSQL Flexible Server 的 log_checkpoints 参数用于记录检查点执行信息，关闭后会减少对写入压力、检查点耗时和恢复行为的审计线索。本模板枚举 Flexible Server 并查询 log_checkpoints，在返回值为 off 时报告。
  impact: |
    - 数据库出现性能抖动、恢复异常或异常写入时，运维人员缺少关键时间线，可能延长定位和恢复时间。
    - 检查点相关行为无法被纳入数据库审计和容量分析，异常资源消耗可能更晚被发现。
  remediation: |
    - 将 log_checkpoints 设置为 on，并将日志接入集中式日志平台，设置合理的保留期和访问权限。
    - 结合日志量、存储成本和生产负载评估采集级别，避免因日志策略不当影响数据库性能。
  reference:
    - https://docs.microsoft.com/en-us/azure/postgresql/flexible-server/concepts-server-parameters
  metadata:
    vendor: microsoft
    product: azure-postgresql
  tags: cloud,devops,azure,microsoft,postgresql,azure-cloud-config

flow: |
  code(1);
  for (let ServerData of iterate(template.serverList)) {
    ServerData = JSON.parse(ServerData);
    set("name", ServerData.name);
    set("resourceGroup", ServerData.resourceGroup);
    code(2);
  }

self-contained: true
code:
  - engine:
      - sh
      - bash
    source: |
      az postgres flexible-server list --output json --query '[*].{"name":name,"resourceGroup":resourceGroup}'

    extractors:
      - type: json
        name: serverList
        internal: true
        json:
          - '.[]'

  - engine:
      - sh
      - bash
    source: |
      az postgres flexible-server parameter show --server-name "$name" --resource-group "$resourceGroup" --name log_checkpoints --query 'value'

    matchers:
      - type: word
        words:
          - 'off'

    extractors:
      - type: dsl
        dsl:
          - 'name + " in " + resourceGroup + " has log_checkpoints disabled"'
