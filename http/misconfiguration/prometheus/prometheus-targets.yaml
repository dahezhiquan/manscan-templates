id: prometheus-targets

info:
  name: Prometheus targets API endpoint 检测
  author: geeknik
  severity: info
  description: |
    检测到 Prometheus targets API endpoint 检测。目标可能暴露云实例、容器或运行环境元数据，攻击者可据此获取实例身份、网络配置、凭据线索或部署信息。
  reference:
    - https://jfrog.com/blog/dont-let-prometheus-steal-your-fire/
  metadata:
    max-request: 1
  tags: prometheus,misconfig,vuln

http:
  - method: GET
    path:
      - "{{BaseURL}}/api/v1/targets"

    matchers-condition: and
    matchers:
      - type: status
        status:
          - 200

      - type: word
        part: body
        words:
          - '"status": "success"'
          - '"data":'
          - '"labels":'
        condition: and

      - type: word
        part: header
        words:
          - 'application/json'
