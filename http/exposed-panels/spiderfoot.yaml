id: spiderfoot

info:
  name: SpiderFoot 登录面板识别（指纹识别）
  author: geeknik
  severity: info
  description: SpiderFoot 是开源 OSINT 自动化平台，用于资产侦察、情报收集和风险分析。该模板请求首页，并依据 HTTP 200 状态码、页面标题、正文关键字或品牌资源特征识别目标是否部署了该系统或暴露了对应入口，适用于资产指纹确认；命中结果仅表示系统特征匹配，不代表已确认存在未授权访问或可利用漏洞。
  classification:
    cvss-metrics: CVSS:3.0/AV:N/AC:L/PR:N/UI:N/S:U/C:N/I:N/A:N
    cwe-id: CWE-200
  metadata:
    max-request: 1
  tags: panel,login,tech,spiderfoot,discovery

http:
  - method: GET
    path:
      - "{{BaseURL}}"

    matchers-condition: and
    matchers:
      - type: word
        part: body
        words:
          - '<title>SpiderFoot'
          - 'support@spiderfoot.net'
        condition: and

      - type: status
        status:
          - 200

    extractors:
      - type: regex
        part: body
        regex:
          - 'SpiderFoot v([0-9.]+)'
