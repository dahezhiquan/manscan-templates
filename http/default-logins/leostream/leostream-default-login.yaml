id: leostream-default-login

info:
  name: Leostream 默认口令登录（弱口令）
  author: bhutch
  severity: high
  description: |
    该模板用于检测 Leostream 是否仍可使用默认凭据或弱口令登录。模板主要向 `/` 等认证入口发送请求，使用内置默认凭据组合进行认证尝试，并根据响应中的 `Set-Cookie: lld=%21`、`index.pl` 等登录成功特征判断登录是否成功；命中说明目标未及时修改出厂、示例或初始化账号口令。
  impact: |
    - 攻击者可进入 Leostream 管理界面，查看或修改用户、权限、认证策略、资产信息或运维配置。
    - 身份、资产、监控或业务管理系统被弱口令接管后，可能造成越权访问、策略绕过、敏感资产信息泄露和更大范围的权限扩散。
  remediation: |
    - 立即修改默认管理员口令，禁用初始化账号，并为高权限账户启用多因素认证。
    - 限制管理入口来源，按最小权限拆分管理员角色，并开启认证、授权和配置变更审计。
    - 复核用户、角色、认证策略、访问令牌和近期登录记录，必要时强制重置相关账号凭据。
  classification:
    cvss-metrics: CVSS:3.0/AV:N/AC:L/PR:N/UI:N/S:C/C:L/I:L/A:L
    cvss-score: 8.3
    cwe-id: CWE-522
    cpe: cpe:2.3:a:leostream:connection_broker:*:*:*:*:*:*:*:*
  metadata:
    verified: true
    max-request: 1
    shodan-query: http.title:"Leostream"
    product: connection_broker
    vendor: leostream
  tags: leostream,default-login,vuln

http:
  - raw:
      - |
        POST / HTTP/1.1
        Host: {{Hostname}}

        login_type=0&user={{username}}&password={{password}}&submit=SIGN+IN

    payloads:
      username:
        - admin
      password:
        - leo
    attack: pitchfork

    matchers-condition: and
    matchers:
      - type: word
        part: header
        words:
          - "Set-Cookie: lld=%21"

      - type: word
        part: header
        words:
          - 'index.pl'
          - 'server.pl'
          - 'status.pl'
        condition: or

      - type: status
        status:
          - 302
