id: ibm-sterling-detect

info:
  name: IBM Sterling File Gateway 指纹识别（指纹识别）
  author: princechaddha
  severity: info
  description: >-
    IBM Sterling File Gateway 是企业托管文件传输平台，用于自动化 B2B 文件交换和交易伙伴管理。该模板通过请求目标服务并检查预设路径或首页响应、页面正文关键字、状态码等指纹特征，判断目标是否使用或暴露了
    IBM Sterling File Gateway 相关组件；命中结果仅表示指纹特征匹配，可用于资产盘点、技术栈识别和后续安全评估，不代表已确认存在可利用漏洞。
  metadata:
    max-request: 1
  tags: tech,sterling,ibm,discovery
http:
  - method: GET
    path:
      - "{{BaseURL}}"

    matchers-condition: and
    matchers:
      - type: word
        part: body
        words:
          - "<title>Welcome to IBM Sterling File Gateway"

      - type: status
        status:
          - 200
