id: password-expiration

info:
  name: 密码最长使用期限未配置（本地基线扫描）
  author: Th3l0newolf
  severity: medium
  description: |
    密码最长使用期限未配置或过长会让已泄露凭据长期有效，增加账号被持续滥用的窗口。CIS Ubuntu 基线要求在 `/etc/login.defs` 中设置合理的 `PASS_MAX_DAYS`；模板读取该值，缺失、非正数或大于 365 天时命中 Policy-Fail。
  impact: |
    - 被泄露或复用的密码可长期保持有效，增加账号接管和横向移动风险。
    - 缺少过期策略会削弱凭据生命周期管理和合规审计。
  remediation: |
    - 在 `/etc/login.defs` 中设置 `PASS_MAX_DAYS` 为 365 天或组织要求的更短周期。
    - 对已有用户使用 `chage` 同步密码过期策略，并结合强密码和多因素认证。
  reference:
    - https://www.cisecurity.org/benchmark/ubuntu_linux
  metadata:
    verified: true
  tags: cis,local,cisecurity,audit,linux,ubuntu,password

self-contained: true

code:
  - engine:
      - bash

    args:
      - "-c"
      - |
        MAX_DAYS_LINE=$(grep -Pi -- '^\h*PASS_MAX_DAYS\h+\d+\b' /etc/login.defs | head -n1)
        if [ -n "$MAX_DAYS_LINE" ]; then
          VALUE=$(echo "$MAX_DAYS_LINE" | awk '{print $2}')
          if [ "$VALUE" -gt 0 ] && [ "$VALUE" -le 365 ]; then
            echo "[password-expiration-check:Policy-Pass] [PASS_MAX_DAYS is $VALUE (valid)] [CIS_PASS]"
          else
            echo "[password-expiration-check:Policy-Fail] [PASS_MAX_DAYS is $VALUE (invalid)] [CIS_FAIL]"
          fi
        else
          echo "[password-expiration-check:Policy-Fail] [PASS_MAX_DAYS not set or malformed] [CIS_FAIL]"
        fi

    matchers:
      - type: word
        name: policy-pass
        words:
          - "Policy-Pass"

      - type: word
        name: policy-fail
        words:
          - "Policy-Fail"
