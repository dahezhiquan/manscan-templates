id: dynatrace-login

info:
  name: Dynatrace 登录面板识别（暴露面识别）
  author: ja1sh
  severity: info
  description: |
    该模板通过识别 Dynatrace 登录入口的页面标题、特征文本或重定向行为，判断目标是否暴露了对应的认证界面。若命中，说明该登录面板对外可访问，可用于暴露面梳理与后续安全评估。
  classification:
    cvss-metrics: CVSS:3.1/AV:N/AC:L/PR:N/UI:N/S:U/C:N/I:N/A:N
    cwe-id: CWE-200
  metadata:
    verified: true
    max-request: 1
    shodan-query: http.favicon.hash:1828614783
  tags: dynatrace,login,panel,discovery

http:
  - method: GET
    path:
      - "{{BaseURL}}"

    matchers-condition: and
    matchers:
      - type: word
        part: body
        words:
          - "Login - Dynatrace"

      - type: status
        status:
          - 200
