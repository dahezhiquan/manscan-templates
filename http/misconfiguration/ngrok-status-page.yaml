id: ngrok-status-page

info:
  name: Ngrok 状态页
  author: pussycat0x
  severity: low
  description: |
    检测到 Ngrok 状态页。目标响应或文件中可能暴露配置、凭据、密钥、令牌、环境变量或历史记录等敏感信息，可能被用于进一步入侵。
  metadata:
    verified: true
    max-request: 1
    shodan-query: http.title:"ngrok"
  tags: ngrok,misconfig,status,vuln

http:
  - method: GET
    path:
      - '{{BaseURL}}/status'

    matchers-condition: and
    matchers:
      - type: word
        part: body
        words:
          - '<title>ngrok</title>'
          - '<title>ngrok - Status</title>'
        condition: or

      - type: status
        status:
          - 200
