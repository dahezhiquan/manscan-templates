id: smtp-axigen-mail-server-detect

info:
  name: Axigen Mail 服务识别（指纹识别）
  author: pikpikcu
  severity: info
  description: |
    Axigen Mail Server 是邮件服务器产品，用于 SMTP 邮件投递、邮箱服务和企业邮件管理。该模板连接 25/TCP 并读取协议响应，通过匹配 `Axigen ESMTP`、`AXIGEN` 等响应特征识别目标服务。
  metadata:
    verified: true
    max-request: 1
    shodan-query: product:"Axigen"
    fofa-query: app="axigen-Mail-Server"
  tags: network,axigen,detect,smtp,tcp,discovery
tcp:
  - inputs:
      - data: "\n"

    host:
      - "{{Hostname}}"
    port: 25

    matchers:
      - type: word
        words:
          - "Axigen ESMTP"
          - "AXIGEN"
