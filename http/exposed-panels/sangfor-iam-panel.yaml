id: sangfor-iam-panel

info:
  name: 深信服上网行为管理 - 登录面板（暴露面识别）
  author: rxerium
  severity: info
  description: |-
    深信服上网行为管理（IAM）是深信服科技推出的网络接入控制与网页过滤设备，用于企业环境中管理互联网访问策略和用户身份认证。
  reference:
    - https://www.sangfor.com/en/product/internet-access-management
  metadata:
    max-request: 1
    shodan-query: 'http.title:"Sangfor Internet Access"'
  tags: panel,sangfor,iam,vpn

http:
  - method: GET
    path:
      - "{{BaseURL}}"

    redirects: true
    max-redirects: 2

    matchers-condition: and
    matchers:
      - type: word
        words:
          - 'SANGFOR Internet Access Management'
        part: body

      - type: status
        status:
          - 200
