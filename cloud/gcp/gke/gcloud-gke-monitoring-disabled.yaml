id: gcloud-gke-monitoring-disabled

info:
  name: GKE Clusters 未启用Cloud 监控已启用（云安全）
  author: princechaddha
  severity: medium
  description: GKE 集群未启用 Cloud Monitoring 时，集群指标和资源状态无法集中进入 Google Cloud 监控体系。本模板枚举集群并检查 monitoringService，值为 none 时报告集群未启用 Cloud Monitoring。
  impact: |
    - 节点、Pod 和控制面指标缺失会降低容量管理、故障发现和异常行为检测能力。
    - 告警、SLO 和自动化运维依赖的数据可能不完整。
  remediation: |
    - 为 GKE 集群启用 Cloud Monitoring，并按业务重要性配置指标、告警和仪表盘。
    - 定期验证关键工作负载、节点资源和控制面健康状态是否被监控覆盖。
  reference:
    - https://cloud.google.com/kubernetes-engine/docs/how-to/monitoring
    - https://www.trendmicro.com/cloudoneconformity/knowledge-base/gcp/GKE/enable-and-configure-cloud-monitoring.html
  metadata:
    vendor: google
    product: google-kubernetes-engine
  tags: cloud,devops,gcp,gcloud,gke,kubernetes,monitoring,observability,gcp-cloud-config

flow: |
  code(1)
  for(let projectId of iterate(template.projectIds)){
    set("projectId", projectId)
    code(2)
    for(let cluster of iterate(template.clusters)){
      cluster = JSON.parse(cluster)
      set("clusterName", cluster.name)
      set("location", cluster.location)
      code(3)
    }
  }

self-contained: true

code:
  - engine:
      - sh
      - bash
    source: |
      gcloud projects list --format="json(projectId)"

    extractors:
      - type: json
        name: projectIds
        internal: true
        json:
          - '.[].projectId'

  - engine:
      - sh
      - bash
    source: |
      gcloud container clusters list --project $projectId --format="json(name,location)"

    extractors:
      - type: json
        name: clusters
        internal: true
        json:
          - '.[]'

  - engine:
      - sh
      - bash
    source: |
      gcloud container clusters describe $clusterName --location $location --project $projectId --format="json(monitoringService)"

    matchers:
      - type: word
        words:
          - '"monitoringService": "none"'

    extractors:
      - type: dsl
        dsl:
          - '"GKE cluster " + clusterName + " in " + location + " of project " + projectId + " does not have Cloud Monitoring enabled"'
