id: homer-panel

info:
  name: Homer 面板识别（指纹识别）
  author: rxerium
  severity: info
  description: |-
    检测到目标站点存在 Homer 相关响应特征。Homer 是监控、日志、分析或可观测性系统，用于展示运行指标、告警事件、日志数据和服务状态。模板请求 `/index.html`，并通过页面标题或正文关键字、状态码确认该系统指纹，用于资产识别、系统盘点和暴露面梳理。
  reference:
    - https://github.com/bastienwirtz/homer
    - https://homer-demo.netlify.app/
  metadata:
    verified: true
    max-request: 1
    shodan-query: http.favicon.hash:-417785140
  tags: panel,homer,detect,login,discovery
http:
  - method: GET
    path:
      - "{{BaseURL}}/index.html"

    matchers-condition: and
    matchers:
      - type: word
        part: body
        words:
          - '<title>Homer</title>'

      - type: status
        status:
          - 200
