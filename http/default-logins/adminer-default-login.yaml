id: adminer-default-login

info:
  name: Adminer 默认口令登录检测（弱口令）
  author: j4vaovo
  severity: high
  description: |
    该模板用于检测 Adminer 是否仍可使用默认凭据或弱口令登录。模板主要向 `/index.php` 等认证入口发送请求，使用内置默认凭据组合进行认证尝试，并根据响应中的 `Create database`、`Privileges` 等登录成功特征判断登录是否成功；命中说明目标未及时修改出厂、示例或初始化账号口令。
  impact: |
    - 攻击者可登录 Adminer 后台，管理内容、用户、插件、主题、文件或站点配置。
    - 后台权限被滥用后，可能导致页面篡改、恶意文件上传、敏感资料泄露，或进一步取得服务器执行能力。
  remediation: |
    - 立即修改默认管理员凭据，删除安装向导、演示账号和不必要的后台用户。
    - 限制后台登录入口访问来源，启用多因素认证、登录失败锁定和验证码等防护。
    - 检查近期内容、插件、主题、文件上传和管理员操作记录，确认没有持久化后门。
  reference:
    - https://www.adminer.org
  classification:
    cvss-metrics: CVSS:3.0/AV:N/AC:L/PR:N/UI:N/S:C/C:L/I:L/A:L
    cvss-score: 8.3
    cwe-id: CWE-522
  metadata:
    verified: true
    max-request: 5
    shodan-query: http.title:adminer
  tags: default-login,adminer,vuln

http:
  - raw:
      - |
        POST /index.php HTTP/1.1
        Host: {{Hostname}}
        Content-Type: application/x-www-form-urlencoded

        auth[driver]=server&auth[server]=&auth[username]={{username}}&auth[password]={{password}}&auth[db]=

    attack: clusterbomb
    payloads:
      username:
        - root
      password:
        - root
        - toor
        - 123
        - 123456
        - 123456789
    host-redirects: true
    max-redirects: 1
    stop-at-first-match: true

    matchers-condition: and
    matchers:
      - type: word
        part: body
        words:
          - 'Create database'
          - 'Privileges'
          - 'Process list'
          - 'Adminer'
        condition: and
        case-insensitive: true

      - type: word
        part: header
        words:
          - 'text/html'

      - type: status
        status:
          - 200
