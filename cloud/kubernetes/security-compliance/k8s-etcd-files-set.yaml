id: k8s-etcd-files-set

info:
  name: Ensure etcd cert and key set（云安全）
  author: princechaddha
  severity: medium
  description: etcd 未配置服务端证书和私钥会导致传输层身份认证不足，影响集群状态存储的机密性和完整性。本模板读取 etcd 启动命令，发现缺少 etcd-certfile 或 etcd-keyfile 时报告。
  impact: |
    - 客户端与 etcd 通信可能缺少强 TLS 身份保护，增加凭据和集群数据泄露风险。
    - 未加固的 etcd 接口一旦暴露，可能导致整个集群状态被读取或篡改。
  remediation: |
    - 为 etcd 配置 etcd-certfile 和 etcd-keyfile，并启用客户端证书认证。
    - 保护证书私钥文件权限，限制 etcd 端口仅对控制面组件开放。
  reference:
    - https://etcd.io/docs/v3.4.0/op-guide/security/
  metadata:
    vendor: kubernetes
    product: etcd
  tags: cloud,devops,kubernetes,devsecops,etcd,k8s-cluster-security
variables:
  argument: "etcd-certfile or etcd-keyfile"

self-contained: true
code:
  - engine:
      - sh
      - bash
    source: |
      kubectl get pods -n kube-system -l component=etcd -o jsonpath="{.items[*].spec.containers[*].command}"

    matchers-condition: and
    matchers:
      - type: word
        words:
          - 'etcd'

      - type: word
        words:
          - "etcd-certfile"
          - "etcd-keyfile"
        negative: true

    extractors:
      - type: dsl
        dsl:
          - '"etcd server configuration is missing the " + argument + " arguments."'
