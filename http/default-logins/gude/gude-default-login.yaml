id: gude-default-login

info:
  name: GUDE 默认口令登录（弱口令）
  author: Bretss
  severity: high
  description: 该模板通过尝试 GUDE 的默认账号口令（如 admin:admin），并依据认证成功后的响应特征判断目标是否仍在使用未修改的弱口令。若命中，攻击者可直接登录系统，进一步访问敏感信息、修改配置或执行未授权操作。
  reference:
    - https://media.distrelec.com/Web/Downloads/_m/an/Gude_2302-1_ger_man.pdf
  classification:
    cvss-metrics: CVSS:3.0/AV:N/AC:L/PR:N/UI:N/S:C/C:L/I:L/A:L
    cvss-score: 8.3
    cwe-id: CWE-522
  metadata:
    max-request: 1
    shodan-query: http.html:"Expert Net Control"
    fofa-query: body="Expert Net Control"
  tags: gude,default-login

http:
  - method: GET
    path:
      - "{{BaseURL}}/ov.html?"

    headers:
      Authorization: "Basic YWRtaW46YWRtaW4="

    matchers:
      - type: dsl
        dsl:
          - 'contains(body, "Control Panel")'
          - 'status_code == 200'
        condition: and
