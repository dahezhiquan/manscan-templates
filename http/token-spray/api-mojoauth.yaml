id: api-mojoauth

info:
  name: MojoAuth API Token 可用性校验（token喷洒）
  author: daffainfo
  severity: info
  description: 该模板通过调用 MojoAuth API 的已知接口验证提供的 token 是否有效，命中后通常表示可访问相关 API 能力。
  reference:
    - https://mojoauth.com/docs/
    - https://github.com/daffainfo/all-about-apikey/tree/main/mojoauth
  metadata:
    max-request: 1
  tags: token-spray,mojoauth

self-contained: true

http:
  - raw:
      - |
        POST https://api.mojoauth.com/token/jwks HTTP/1.1
        Host: api.mojoauth.com
        X-API-Key: {{token}}

    matchers:
      - type: word
        part: body
        words:
          - '"keys"'
          - '"kty"'
          - '"kid"'
        condition: and
