id: dreambox-detect

info:
  name: DreamBox 指纹识别（指纹识别）
  author: pikpikcu
  severity: info
  description: DreamBox 是设备或 Web 应用管理界面，用于对应系统的配置和业务访问。该模板请求首页，并依据 HTTP 200 状态码、页面标题、正文关键字或品牌资源特征识别目标是否使用或暴露了 DreamBox 相关组件，适用于资产盘点、技术栈识别和后续安全评估；命中结果仅表示指纹特征匹配，不代表已确认存在可利用漏洞。
  metadata:
    max-request: 1
  tags: dreambox,tech,discovery

http:
  - method: GET
    path:
      - '{{BaseURL}}'

    matchers-condition: and
    matchers:
      - type: status
        status:
          - 200

      - type: word
        part: body
        words:
          - '<title>Dreambox WebControl</title>'
