id: gcloud-iam-admin-roles

info:
  name: IAM Users 使用Administrative Roles（云安全）
  author: princechaddha
  severity: medium
  description: 项目级 Owner、Editor 或名称包含 admin/Admin 的角色通常具备广泛管理权限，授予普通用户会偏离最小权限原则。本模板检查项目 IAM policy 中符合这些条件的 bindings，出现 role 字段时报告存在管理类角色授权。
  impact: |
    - 用户账号被攻破后，攻击者可能创建资源、修改 IAM、读取敏感数据或关闭安全控制。
    - 管理权限过度集中会增加误操作和越权变更风险，削弱职责分离和审计效果。
  remediation: |
    - 移除普通用户不必要的 Owner、Editor 和管理员类角色，改用按职责拆分的预定义角色或自定义角色。
    - 对确需管理员权限的身份使用受控组、临时授权、审批流程和多因素认证，并定期复核 IAM bindings。
  reference:
    - https://www.trendmicro.com/cloudoneconformity/knowledge-base/gcp/IAM/roles-with-admin-permissions.html
    - https://cloud.google.com/iam/docs/understanding-roles
  metadata:
    vendor: google
    product: cloud-iam
  tags: cloud,devops,gcp,gcloud,iam,security,admin,permissions,gcp-cloud-config

flow: |
  code(1)
  for(let projectId of iterate(template.projectIds)){
    set("projectId", projectId)
    code(2)
  }

self-contained: true

code:
  - engine:
      - sh
      - bash
    source: |
      gcloud projects list --format="json(projectId)"

    extractors:
      - type: json
        name: projectIds
        internal: true
        json:
          - '.[].projectId'

  - engine:
      - sh
      - bash
    source: |
      gcloud projects get-iam-policy $projectId --format="json(bindings[?(@.role=='roles/owner' || @.role=='roles/editor' || @.role contains 'admin' || @.role contains 'Admin')])"

    matchers:
      - type: word
        words:
          - '"role":'

    extractors:
      - type: dsl
        dsl:
          - '"Project " + projectId + " has IAM users with administrative roles that grant excessive permissions"'
