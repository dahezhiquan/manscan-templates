id: vrealize-hyperic-panel

info:
  name: vRealize Hyperic 登录面板识别（指纹识别）
  author: Charles D
  severity: info
  description: |
    该模板通过识别 vRealize Hyperic 登录入口的页面标题、特征文本或重定向行为，判断目标是否暴露了对应的认证界面。若命中，说明该登录面板对外可访问，可用于暴露面梳理与后续安全评估。
  classification:
    cvss-metrics: CVSS:3.0/AV:N/AC:L/PR:N/UI:N/S:U/C:N/I:N/A:N
    cwe-id: CWE-200
    cpe: cpe:2.3:a:vmware:hyperic_hq:*:*:*:*:*:*:*:*
  metadata:
    verified: true
    max-request: 1
    shodan-query: http.title:"Sign In - Hyperic"
    product: hyperic_hq
    vendor: vmware
  tags: login,panel,vrealize,hyperic,detect,discovery

http:
  - method: GET
    path:
      - '{{BaseURL}}/app/login'

    matchers-condition: and
    matchers:
      - type: word
        part: body
        words:
          - "Sign In - Hyperic"

      - type: status
        status:
          - 200
