id: yapi-detect

info:
  name: YApi 指纹识别（指纹识别）
  author: pikpikcu
  severity: info
  description: >-
    YApi 是接口管理和 API 文档平台，用于维护接口定义、Mock、测试和团队协作。该模板通过请求目标服务并检查预设路径或首页响应、页面正文关键字、状态码等指纹特征，判断目标是否使用或暴露了
    YApi 相关组件；命中结果仅表示指纹特征匹配，可用于资产盘点、技术栈识别和后续安全评估，不代表已确认存在可利用漏洞。
  classification:
    cpe: cpe:2.3:a:ymfe:yapi:*:*:*:*:*:*:*:*
  metadata:
    max-request: 1
    vendor: ymfe
    product: yapi
    shodan-query: http.title:"YApi"
  tags: tech,yapi,discovery
http:
  - method: GET
    path:
      - "{{BaseURL}}"

    matchers-condition: and
    matchers:
      - type: word
        part: body
        words:
          - "<title>YApi-高效、易用、功能强大的可视化接口管理平台</title>"

      - type: status
        status:
          - 200
