id: dozzle-container-logs

info:
  name: Dozzle 容器日志暴露（暴露面识别）
  author: theabhinavgaur
  severity: medium
  description: 检测到可直接访问的 Dozzle 容器日志。日志、异常页面或调试输出通常会泄露堆栈信息、内部路径、查询语句、账号标识、令牌片段或业务数据，不应向未授权用户开放。
  reference:
    - https://github.com/amir20/dozzle
    - https://dozzle.dev/
  metadata:
    verified: true
    max-request: 1
    shodan-query: http.title:"Dozzle"
  tags: exposure,logs,dozzle,docker,vuln

http:
  - method: GET
    path:
      - "{{BaseURL}}"

    matchers-condition: and
    matchers:
      - type: word
        part: body
        words:
          - '"authorizationNeeded": "false"'
          - 'Dozzle'
        condition: and

      - type: status
        status:
          - 200
