id: api-pagecdn

info:
  name: PageCDN API Token 可用性校验（token喷洒）
  author: daffainfo
  severity: info
  description: 该模板通过调用 PageCDN API 的已知接口验证提供的 token 是否有效，命中后通常表示可访问相关 API 能力。
  reference:
    - https://pagecdn.com/docs/public-api
    - https://github.com/daffainfo/all-about-apikey/tree/main/pagecdn
  metadata:
    max-request: 1
  tags: token-spray,pagecdn

self-contained: true

http:
  - method: GET
    path:
      - "https://pagecdn.com/api/v2/private/account/info?apikey={{token}}"

    matchers:
      - type: word
        part: body
        words:
          - '"username"'
          - '"email"'
        condition: and
