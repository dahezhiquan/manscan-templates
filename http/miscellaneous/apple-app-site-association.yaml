id: apple-app-site-association

info:
  name: Apple App Site Association 端点收集
  author: panch0r3d
  severity: low
  description: |
    检测目标是否暴露 Apple App Site Association 文件。该文件用于 iOS Universal Links、App Clips 或 Web Credentials 等能力，将网站域名与 Apple 应用标识关联；模板访问常见 AASA 路径并匹配 JSON/声明内容特征。
  impact: |
    - well-known 策略或身份文件通常用于公开声明域名、应用、邮件、证书或身份关联。
    - 若内容过期、配置错误或非预期暴露，可能泄露组织关系、端点能力、用户标识或验证材料。
  remediation: |
    - 确认该 well-known 文件是否为业务或合规所需；非必要内容应删除或限制访问。
    - 定期检查文件内容是否准确、未过期且不包含敏感信息。
    - 对应用关联、邮件策略、证书验证和身份声明文件建立变更审计。
  metadata:
    max-request: 3
  tags: miscellaneous,misc,apple,vuln

http:
  - method: GET
    path:
      - "{{BaseURL}}/.well-known/apple-app-site-association"
      - "{{BaseURL}}/well-known/apple-app-site-association"
      - "{{BaseURL}}/apple-app-site-association"

    stop-at-first-match: true

    matchers-condition: and
    matchers:
      - type: word
        part: body
        words:
          - 'applinks'
          - 'appID'
          - 'paths'
        condition: and

      - type: word
        part: header
        words:
          - 'application/json'

      - type: status
        status:
          - 200

    extractors:
      - type: json
        json:
          - .applinks.details[].appID
