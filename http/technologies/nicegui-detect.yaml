id: nicegui-detect

info:
  name: NiceGUI 指纹识别（指纹识别）
  author: theamanrawat
  severity: info
  description: |
    用于识别目标是否部署 NiceGUI 并提取相关版本或构建信息，模板会结合 HTTP 响应头、页面正文、特定路径或已知端点和版本或标识提取结果进行指纹匹配。
  metadata:
    max-request: 1
    shodan-query: "x-nicegui-content"
  tags: nicegui,detect,tech

http:
  - method: GET
    path:
      - "{{BaseURL}}"

    matchers-condition: and
    matchers:
      - type: word
        part: header
        words:
          - "x-nicegui-content"
        case-insensitive: true

    extractors:
      - type: regex
        part: body
        group: 1
        regex:
          - '/_nicegui/([0-9.]+)/'
