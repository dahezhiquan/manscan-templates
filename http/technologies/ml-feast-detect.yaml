id: ml-feast-detect

info:
  name: Feast Feature Store 指纹识别（指纹识别）
  author: rxerium
  severity: info
  description: >-
    Feast 是机器学习特征存储平台，用于统一管理、服务和复用训练与在线推理特征。该模板通过请求目标服务并检查预设路径或首页响应、页面正文关键字、状态码等指纹特征，判断目标是否使用或暴露了
    Feast Feature Store 相关组件；命中结果仅表示指纹特征匹配，可用于资产盘点、技术栈识别和后续安全评估，不代表已确认存在可利用漏洞。
  reference:
  - https://github.com/feast-dev/feast
  - https://feast.dev/
  metadata:
    verified: true
    max-request: 1
    vendor: feast
    product: feast
    shodan-query: http.title:"Feast Feature Store"
  tags: tech,feast,feature-store,ml,detect,discovery
http:
  - method: GET
    path:
      - "{{BaseURL}}/p/automl_pipeline"

    matchers-condition: and
    matchers:
      - type: word
        part: body
        words:
          - '<title>Feast Feature Store'

      - type: status
        status:
          - 200
