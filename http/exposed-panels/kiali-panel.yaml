id: kiali-panel

info:
  name: Kiali 识别（指纹识别）
  author: righettod
  severity: info
  description: |-
    检测到目标站点存在 Kiali 相关响应特征。Kiali 是云原生、中间件或集群管理平台，用于管理服务、工作负载、消息流、API 网关、配置和运行状态。模板请求 `/kiali/api/status`、`/kiali/` 路径，并通过页面标题或正文关键字、状态码、DSL 条件确认该系统指纹，用于资产识别、系统盘点和暴露面梳理。
  reference:
    - https://kiali.io/
  classification:
    cpe: cpe:2.3:a:kiali:kiali:*:*:*:*:*:*:*:*
  metadata:
    verified: true
    max-request: 2
    vendor: kiali
    product: kiali
    shodan-query: title:"Kiali"
  tags: panel,kiali,detect,login,discovery
http:
  - method: GET
    path:
      - "{{BaseURL}}/kiali/api/status"
      - "{{BaseURL}}/kiali/"

    host-redirects: true
    max-redirects: 2
    stop-at-first-match: true
    matchers:
      - type: dsl
        dsl:
          - 'status_code == 200'
          - 'contains_any(to_lower(body), "kiali-ui", "<title>kiali</title>", "<title>kiali console</title>", "kiali version")'
        condition: and

    extractors:
      - type: regex
        part: body
        group: 1
        regex:
          - '(?i)"Kiali version":\s*"([a-z0-9.]+)"'
