id: content-scheme

info:
  name: Android content URI Scheme 识别（本地文件安全扫描）
  author: gaurang
  severity: low
  description: |
    Android `content://` URI 是 Content Provider 对外提供数据访问的标准地址形式，可用于在组件之间共享文件或结构化数据。该 Scheme 本身是正常机制，是否存在风险取决于 Provider 的导出状态、权限校验和 URI 授权范围。本模板匹配 `android:scheme="content"`，仅识别相关入口，不确认数据已被未授权访问。
  impact: |
    - 若关联 Provider 对外导出且缺少读写权限控制，其他应用可能读取、修改或删除本地数据。
    - 过宽的 URI 授权可能暴露附件、缓存、数据库或临时文件，形成跨应用数据泄露。
  remediation: |
    - 对 Content Provider 明确设置 `android:exported="false"` 或使用签名级权限，按接口逐项校验调用方身份。
    - 限制 URI path 和临时授权范围，避免通过 `content://` 暴露应用私有目录、数据库和长期有效的读写权限。
  classification:
    cvss-metrics: CVSS:3.1/AV:N/AC:L/PR:N/UI:N/S:U/C:N/I:N/A:N
    cvss-score: 0
    cwe-id: CWE-200
  tags: android,file

file:
  - extensions:
      - xml
    matchers:
      - type: word
        words:
          - "android:scheme=\"content\""
