id: k8s-etcd-cafile-set

info:
  name: Ensure etcd-cafile argument set（云安全）
  author: princechaddha
  severity: medium
  description: 该规则用于检查 Kubernetes security-compliance 相关资源是否满足推荐的云安全与合规配置要求，命中通常表示当前配置仍存在可改进的风险项。
  impact: |
    - 当前配置偏离推荐的云安全基线，可能增加攻击面、审计缺口或运维失误带来的风险。
    - 具体影响取决于受影响资源的重要性、暴露范围以及周边安全控制是否到位。
  remediation: |
    - 参考云厂商安全基线和官方文档修正当前配置偏差。
    - 建议结合资源标签、自动化检测与周期性审计，持续跟踪该类风险项的整改状态。
  reference:
    - https://etcd.io/docs/v3.5/op-guide/security/
  tags: cloud,devops,kubernetes,devsecops,etcd,k8s,k8s-cluster-security

variables:
  argument: "etcd-cafile"

self-contained: true
code:
  - engine:
      - sh
      - bash
    source: |
      kubectl get pods -n kube-system -l component=etcd -o jsonpath="{.items[*].spec.containers[*].command}"

    matchers-condition: and
    matchers:
      - type: word
        words:
          - 'etcd'

      - type: word
        words:
          - "etcd-cafile"
        negative: true

    extractors:
      - type: dsl
        dsl:
          - '"Etcd configuration is missing the " + argument + " argument"'
