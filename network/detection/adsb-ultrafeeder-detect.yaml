id: adsb-ultrafeeder-detect

info:
  name: ADS-B Ultrafeeder Beast Mode 暴露识别（服务漏洞）
  author: Random-Robbie
  severity: low
  description: |
    ADS-B Ultrafeeder/Beast Mode 数据流通常由 dump1090、readsb 等 ADS-B 接收与转发组件输出，用于传输航空器广播报文、位置和航迹数据。该模板向 30005/TCP 发送探测数据，并匹配 Beast 二进制帧起始字节 `0x1a31`、`0x1a32` 或 `0x1a33`，用于确认目标正在输出航空广播数据流。
  impact: |
    - ADS-B 数据流对外暴露可能泄露接收站可见的航空器位置、速度和航迹信息，造成敏感区域或业务运行态势被外部持续观察。
    - 未受控的 Beast Mode 端口还可能被第三方滥用为数据源，增加服务负载并影响本地采集链路稳定性。
  remediation: |
    - 确认 30005/TCP 数据流是否需要对外提供；如仅供本地组件使用，应绑定到本地或内网接口。
    - 使用防火墙或反向代理访问控制限制可信来源，并监控异常长连接或高频数据拉取。
  reference:
    - https://github.com/flightaware/dump1090
    - https://github.com/wiedehopf/readsb
    - https://mode-s.org/decode/content/ads-b/1-basics.html
  metadata:
    verified: true
    max-request: 1
    shodan-query: html:"ADSB"
    fofa-query: port="30005" && body="ADSB"
  tags: network,tcp,flight,adsb,enum

tcp:
  - inputs:
      - data: 00000000
        type: hex

    host:
      - "{{Hostname}}"
    port: 30005
    read-size: 2048

    matchers:
      - type: binary
        binary:
          - "1a31"
          - "1a32"
          - "1a33"
        condition: or

    extractors:
      - type: regex
        name: beast_message_types
        regex:
          - "1a(3[1-3])"

      - type: regex
        name: feed_quality
        regex:
          - "(1a)"
