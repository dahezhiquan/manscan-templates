id: elastic-kibana-config

info:
  name: Elastic Kibana 配置 文件泄露（暴露面识别）
  author: DhiyaneshDk
  severity: medium
  description: |
    检测到对外可访问的 Elastic Kibana 配置 文件。相关文件可能泄露项目结构、依赖关系、部署细节、敏感参数或其他不应公开的内部信息。
  reference:
    - https://www.elastic.co/guide/en/kibana/current/settings.html
  metadata:
    verified: true
    max-request: 1
    fofa-query: body="kibana.yml"
  tags: exposure,elastic,kibana,files,config,vuln

http:
  - method: GET
    path:
      - '{{BaseURL}}/kibana.yml'

    matchers:
      - type: dsl
        dsl:
          - 'status_code == 200'
          - 'contains(content_type, "application/octet-stream")'
          - 'contains_all(body, "elasticsearch.username:","elasticsearch.password:")'
        condition: and
