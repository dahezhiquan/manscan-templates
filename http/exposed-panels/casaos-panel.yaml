id: casaos-panel

info:
  name: CasaOS 登录面板识别（指纹识别）
  author: DhiyaneshDK
  severity: info
  description: |-
    检测到目标站点存在 CasaOS 相关响应特征。CAS 是 Central Authentication Service 单点登录系统，登录入口用于为多个应用提供统一认证能力。模板请求 `/`、`/#/login` 路径，并通过页面标题或正文关键字、状态码确认该系统指纹，用于资产识别、系统盘点和暴露面梳理。
  classification:
    cvss-metrics: CVSS:3.0/AV:N/AC:L/PR:N/UI:N/S:U/C:N/I:N/A:N
    cwe-id: CWE-200
    cpe: cpe:2.3:o:icewhale:casaos:*:*:*:*:*:*:*:*
  metadata:
    verified: true
    max-request: 2
    shodan-query: html:"CasaOS"
    product: casaos
    vendor: icewhale
  tags: panel,casaos,login,detect,discovery
http:
  - method: GET
    path:
      - '{{BaseURL}}'
      - '{{BaseURL}}/#/login'

    stop-at-first-match: true
    host-redirects: true
    max-redirects: 2

    matchers-condition: and
    matchers:
      - type: word
        words:
          - "/CasaOS-UI/"
          - "We're sorry but CasaOS"
        condition: or

      - type: status
        status:
          - 200
