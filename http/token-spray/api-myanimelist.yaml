id: api-myanimelist

info:
  name: MyAnimeList API Token 可用性校验（token喷洒）
  author: daffainfo
  severity: info
  description: 该模板通过调用 MyAnimeList API 的已知接口验证提供的 token 是否有效，命中后通常表示可访问相关 API 能力。
  reference:
    - https://myanimelist.net/apiconfig/references/api/v2
    - https://github.com/daffainfo/all-about-apikey/tree/main/myanimelist
  metadata:
    max-request: 1
  tags: token-spray,myanimelist

self-contained: true

http:
  - method: GET
    path:
      - "https://api.myanimelist.net/v2/anime?q=one&limit=4"

    headers:
      Authorization: Bearer {{token}}
    matchers:
      - type: word
        part: body
        words:
          - '"data":'
          - '"paging":'
          - '"next":'
        condition: and
