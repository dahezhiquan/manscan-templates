id: nextchat-chatgpt-detect

info:
  name: NextChat 指纹识别（指纹识别）
  author: s4e-io
  severity: info
  description: >-
    NextChat 是面向 ChatGPT 和多模型接入的开源聊天前端，用于提供浏览器端 AI 对话和模型配置能力。该模板通过请求目标服务并检查预设路径或首页响应、页面正文关键字、状态码等指纹特征，判断目标是否使用或暴露了
    NextChat 相关组件；命中结果仅表示指纹特征匹配，可用于资产盘点、技术栈识别和后续安全评估，不代表已确认存在可利用漏洞。
  reference:
  - https://github.com/ChatGPTNextWeb/NextChat
  - https://nextchat.dev
  metadata:
    verified: true
    max-request: 1
    shodan-query: title:"NextChat"
    fofa-query: title="NextChat"
  tags: tech,chatgpt,nextchat,detect,discovery,ai
http:
  - method: GET
    path:
      - "{{BaseURL}}"

    matchers-condition: and
    matchers:
      - type: word
        part: body
        words:
          - '<title>NextChat'
          - 'content="NextChat"'
        condition: or

      - type: status
        status:
          - 200
