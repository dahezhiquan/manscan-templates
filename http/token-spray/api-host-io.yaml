id: api-host-io

info:
  name: host.io API Token 可用性校验（token喷洒）
  author: daffainfo
  severity: info
  description: 该模板通过调用 host.io API 的已知接口验证提供的 token 是否有效，命中后通常表示可访问IP、网络或归属信息查询能力。
  reference:
    - https://host.io/docs
    - https://github.com/daffainfo/all-about-apikey/tree/main/host-io
  metadata:
    max-request: 1
  tags: token-spray,hostio

self-contained: true

http:
  - method: GET
    path:
      - "https://host.io/api/full/facebook.com?token=${{token}}"

    matchers:
      - type: word
        part: body
        words:
          - '"domain"'
          - '"rank"'
          - '"url"'
        condition: and
