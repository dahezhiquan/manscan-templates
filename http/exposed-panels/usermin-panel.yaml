id: usermin-panel

info:
  name: Usermin 登录面板识别（指纹识别）
  author: s4e-io
  severity: info
  description: |-
    Usermin 是 Webmin 配套的用户级 Web 管理界面，用于邮箱、密码、文件和用户个人配置。该模板请求首页，并依据 DSL 条件识别目标是否部署了该系统或暴露了对应入口，适用于资产指纹确认；命中结果仅表示系统特征匹配，不代表已确认存在未授权访问或可利用漏洞。
  metadata:
    verified: true
    max-request: 1
    fofa-query: "Login to Usermin"
  tags: panel,login,usermin,detect,discovery

http:
  - method: GET
    path:
      - "{{BaseURL}}"

    matchers:
      - type: dsl
        dsl:
          - 'contains_all(body, "<title>Login to Usermin</title>", "/manifest-usermin.json")'
          - 'status_code == 200'
        condition: and
