id: cogent-datahub-panel

info:
  name: Cogent DataHub (OPC DataHub) 面板（暴露面识别）
  author: rxerium
  severity: info
  description: |
    该模板用于识别 Cogent DataHub (OPC DataHub) 是否存在对外暴露的管理、服务或状态界面。若命中，说明目标公开了相关功能入口，可作为资产盘点与攻击面收敛的依据。
  reference:
    - https://www.cogentdatahub.com/products/datahub/
    - https://www.opcdatahub.com/
  metadata:
    max-request: 1
    verified: true
    vendor: Cogent Real-Time Systems
    product: cogent-datahub
    shodan-query: 'http.title:"DataHub Web Server"'
  tags: panel,cogent,datahub,opc,scada,ics,ot,discovery

http:
  - method: GET
    path:
      - "{{BaseURL}}"

    host-redirects: true
    max-redirects: 2

    matchers-condition: and
    matchers:
      - type: word
        part: body
        words:
          - 'DataHub Web Server'
          - 'dhwebserver.css'
          - 'Cogent'
        condition: or

      - type: status
        status:
          - 200
