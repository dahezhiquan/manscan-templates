id: jira-atlassian-connect-descriptor

info:
  name: Atlassian Connect Descriptor 指纹识别（指纹识别）
  author: pussycat0x
  severity: info
  description: >-
    Atlassian Connect Descriptor 是 Atlassian 应用插件的描述文件，用于声明 Jira/Confluence 扩展的模块、权限和回调地址。该模板通过请求目标服务并检查预设路径或首页响应、页面正文关键字、HTTP
    响应头、状态码等指纹特征，判断目标是否使用或暴露了 Atlassian Connect Descriptor 相关组件；命中结果仅表示指纹特征匹配，可用于资产盘点、技术栈识别和后续安全评估，不代表已确认存在可利用漏洞。
  reference:
  - https://developer.atlassian.com/cloud/jira/platform/connect-app-descriptor/
  metadata:
    verified: true
    max-request: 1
    shodan-query: html:"atlassian-connect.json"
  tags: atlassian,tech,jira,discovery
http:
  - method: GET
    path:
      - "{{BaseURL}}/atlassian-connect.json"

    matchers-condition: and
    matchers:
      - type: word
        part: body
        words:
          - '"name":'
          - '"vendor":'
          - '"key":'
          - '"baseUrl":'
          - '"authentication":'
        condition: and

      - type: word
        part: header
        words:
          - application/json

      - type: status
        status:
          - 200
