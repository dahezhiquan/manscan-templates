id: tinyproxy-detect

info:
  name: Tinyproxy 指纹识别（指纹识别）
  author: bhutch
  severity: info
  description: >-
    Tinyproxy 是轻量级 HTTP/HTTPS 代理服务器，常用于小型网络代理、转发和访问控制场景。该模板通过请求目标服务并检查预设路径或首页响应、HTTP
    响应头、页面正文关键字等指纹特征，判断目标是否使用或暴露了 Tinyproxy 相关组件；命中结果仅表示指纹特征匹配，可用于资产盘点、技术栈识别和后续安全评估，不代表已确认存在可利用漏洞。
  reference:
  - https://github.com/tinyproxy/tinyproxy
  classification:
    cpe: cpe:2.3:a:tinyproxy_project:tinyproxy:*:*:*:*:*:*:*:*
  metadata:
    verified: true
    max-request: 1
    vendor: tinyproxy_project
    product: tinyproxy
    shodan-query: "Server: tinyproxy"
  tags: tech,proxy,detect,discovery
http:
  - method: GET
    path:
      - "{{BaseURL}}"

    matchers:
      - type: word
        part: header
        words:
          - "server: tinyproxy"
        case-insensitive: true

    extractors:
      - type: kval
        kval:
          - server
