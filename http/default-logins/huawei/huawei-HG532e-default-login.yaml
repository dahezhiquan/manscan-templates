id: huawei-HG532e-default-login

info:
  name: Huawei HG532e 默认凭据（弱口令）
  author: pussycat0x
  severity: high
  description: |
    该模板用于检测 Huawei HG532e 是否仍可使用默认凭据或弱口令登录。模板主要向 `/index/login.cgi` 等认证入口发送请求，使用内置默认凭据组合进行认证尝试，并根据响应中的 `Set-Cookie: SessionID`、`<title>replace</title>` 等登录成功特征判断登录是否成功；命中说明目标未及时修改出厂、示例或初始化账号口令。
  impact: |
    - 攻击者可接管 Huawei HG532e 的 Web 管理界面，查看设备状态、网络配置、运行日志或敏感业务参数。
    - 被接管的网络、工控、打印、语音、存储或远程管理设备可能被用于中断业务、改变路由/访问策略、窃取流量或作为内网横向移动入口。
  remediation: |
    - 立即修改所有默认账号口令，禁用不再使用的出厂账号，并为管理账户设置高强度唯一密码。
    - 将设备管理入口限制在 VPN、堡垒机或可信管理网段内，避免直接暴露到公网。
    - 升级设备固件或管理组件，审计近期登录记录、配置变更和异常会话。
  classification:
    cvss-metrics: CVSS:3.0/AV:N/AC:L/PR:N/UI:N/S:C/C:L/I:L/A:L
    cvss-score: 8.3
    cwe-id: CWE-522
    cpe: cpe:2.3:h:huawei:hg532e:*:*:*:*:*:*:*:*
  metadata:
    max-request: 1
    shodan-query: http.html:"HG532e"
    product: hg532e
    vendor: huawei
  tags: default-login,huawei,vuln

http:
  - raw:
      - |
        POST /index/login.cgi HTTP/1.1
        Host: {{Hostname}}
        Cookie: Language=en; FirstMenu=Admin_0; SecondMenu=Admin_0_0; ThirdMenu=Admin_0_0_0
        Content-Type: application/x-www-form-urlencoded

        Username=user&Password=MDRmODk5NmRhNzYzYjdhOTY5YjEwMjhlZTMwMDc1NjllYWYzYTYzNTQ4NmRkYWIyMTFkNTEyYzg1YjlkZjhmYg%3D%3D

    matchers-condition: and
    matchers:
      - type: word
        part: header
        words:
          - 'Set-Cookie: SessionID'

      - type: word
        part: body
        words:
          - "<title>replace</title>"

      - type: status
        status:
          - 200
