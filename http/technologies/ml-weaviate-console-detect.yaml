id: ml-weaviate-console-detect

info:
  name: Weaviate Console 指纹识别（指纹识别）
  author: rxerium
  severity: info
  description: >-
    Weaviate 是向量数据库，Console 是其管理和查询界面，用于查看 schema、对象和向量检索能力。该模板通过请求目标服务并检查预设路径或首页响应、DSL
    条件等指纹特征，判断目标是否使用或暴露了 Weaviate Console 相关组件；命中结果仅表示指纹特征匹配，可用于资产盘点、技术栈识别和后续安全评估，不代表已确认存在可利用漏洞。
  reference:
  - https://weaviate.io/
  - https://github.com/weaviate/weaviate
  metadata:
    verified: true
    max-request: 1
    fofa-query: title="Weaviate Console"
    shodan-query: title:"Weaviate Console"
  tags: tech,weaviate,vector-database,ai,ml,database
http:
  - method: GET
    path:
      - "{{BaseURL}}"

    matchers:
      - type: dsl
        dsl:
          - 'status_code == 200'
          - 'contains_all(body, "<title>Weaviate Console", "webpackJsonpweaviate-console")'
        condition: and
