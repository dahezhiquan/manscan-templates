id: kyocera-printer-panel

info:
  name: Kyocera 打印机面板（IOT）
  author: gy741
  severity: low
  description: |
    检测到 Kyocera 打印机 Web 面板。该入口暴露可能泄露打印设备型号、状态信息或远程管理界面。
  impact: |
    - 打印机 Web 面板暴露可能泄露设备型号、网络配置、耗材状态和打印服务入口。
    - 在配置不当时，攻击者可能滥用打印服务、修改设备设置或获取作业信息。
  remediation: |
    - 限制打印机 Web 管理页面仅办公内网或管理网段访问。
    - 启用管理员认证，修改默认口令并升级打印机固件。
    - 关闭不必要的远程管理、匿名访问和未使用的打印协议。
  metadata:
    verified: true
    max-request: 1
    shodan-query: http.favicon.hash:-50306417
    product: d-copia253mf_plus_firmware
    vendor: kyocera
    fofa-query: icon_hash=-50306417
  tags: iot,panel,kyocera,printer,discovery

http:
  - method: GET
    path:
      - "{{BaseURL}}"

    matchers-condition: and
    matchers:
      - type: word
        part: body
        words:
          - '/startwlm/Start_Wlm.htm'

      - type: status
        status:
          - 200
