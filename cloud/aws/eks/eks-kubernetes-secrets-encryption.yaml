id: eks-kubernetes-secrets-encryption

info:
  name: EKS Kubernetes Secrets 未配置 KMS 加密（云安全）
  author: princechaddha
  severity: high
  description: EKS Kubernetes Secrets 未配置 KMS 加密是一类集群敏感配置静态保护不足风险，etcd 中的 Secrets 可能缺少客户管理密钥加密边界。Secrets 常包含令牌、密码和连接串，未配置 KMS provider 会降低密钥治理和合规控制能力。模板枚举 EKS 集群后读取 `cluster.encryptionConfig[*].provider.keyArn`，当返回 `null` 时判定未配置 Secrets 加密。
  impact: |
    - Kubernetes Secrets 静态数据缺少客户管理 KMS 密钥保护，泄露后影响面更难控制。
    - 无法通过 KMS key policy、密钥轮换和解密审计满足更严格的数据保护要求。
  remediation: |
    - 为 EKS 集群配置 Kubernetes Secrets KMS 加密，并选择符合组织要求的 KMS key。
    - 配置后轮换或重新写入关键 Secrets，确保既有敏感对象受到新加密配置保护。
  reference:
    - https://docs.aws.amazon.com/eks/latest/userguide/encryption-configuration.html
    - https://docs.aws.amazon.com/eks/latest/userguide/update-cluster.html
  metadata:
    vendor: amazon
    product: eks
  tags: cloud,devops,aws,amazon,eks,aws-cloud-config

variables:
  region: "us-east-1"

flow: |
  code(1)
  for(let cluster of iterate(template.clusters)){
    set("cluster", cluster)
    code(2)
  }

self-contained: true

code:
  - engine:
      - sh
      - bash
    source: |
      aws eks list-clusters --region $region --query 'clusters' --output json

    extractors:
      - type: json
        name: clusters
        internal: true
        json:
          - '.[]'

  - engine:
      - sh
      - bash
    source: |
      aws eks describe-cluster --region $region --name $cluster --query 'cluster.encryptionConfig[*].provider.keyArn' --output json

    matchers:
      - type: word
        words:
          - "null"

    extractors:
      - type: dsl
        dsl:
          - '"EKS cluster " + cluster + " does not have encryption enabled for Kubernetes secrets"'
