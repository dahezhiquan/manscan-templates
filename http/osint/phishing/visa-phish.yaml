id: visa-phish

info:
  name: Visa 仿冒钓鱼网站（钓鱼网站识别）
  author: rxerium
  severity: info
  description: |
    检测到疑似仿冒 Visa 的钓鱼网站。模板在目标页面返回 200、页面内容命中 Visa 的金融或支付页面特征，且当前主机不属于 visa.com 官方域名时触发，用于识别借用 Visa 品牌页面诱导用户信任的仿冒站点。
  reference:
    - https://visa.com
  metadata:
    max-request: 1
  tags: phishing,visa,credit-card,osint,discovery
http:
  - method: GET
    path:
      - "{{BaseURL}}"

    host-redirects: true
    max-redirects: 2

    matchers-condition: and
    matchers:
      - type: word
        words:
          - "Discover Visa personal payment solutions, secure transactions, travel support, cards and rewards designed to bring more value to your everyday experiences."

      - type: status
        status:
          - 200

      - type: dsl
        dsl:
          - '!contains(host,"visa.com")'
