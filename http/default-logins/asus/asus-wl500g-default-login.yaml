id: asus-wl500g-default-login

info:
  name: ASUS WL-500G 默认口令登录（弱口令）
  author: ritikchaddha
  severity: high
  description: |
    该模板通过尝试 ASUS WL-500G 的默认管理员账号口令（如 admin），并依据认证成功后的响应特征判断目标是否仍在使用未修改的弱口令。若命中，攻击者通常可直接获得后台管理权限，进一步访问敏感信息、修改配置或执行未授权操作。
  metadata:
    verified: true
    max-request: 1
    shodan-query: "WL-500G"
  tags: default-login,asus,wl-500,vuln

http:
  - raw:
      - |
        GET /index.asp HTTP/1.1
        Host: {{Hostname}}
        Authorization: Basic {{base64(username + ':' + password)}}

    attack: pitchfork
    payloads:
      username:
        - admin
      password:
        - admin

    matchers-condition: and
    matchers:
      - type: word
        part: body
        words:
          - '401 Unauthorized'
        negative: true

      - type: word
        part: body
        words:
          - '"Main_Index_AccessPoint.asp'
          - 'Main_List.asp'
        condition: and

      - type: status
        status:
          - 200
