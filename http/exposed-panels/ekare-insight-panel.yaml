id: ekare-insight-panel

info:
  name: eKare inSight 面板识别（暴露面识别）
  author: s4e-io
  severity: info
  description: |
    该模板通过识别 eKare inSight 面板、控制台或管理界面的页面特征，判断目标是否暴露了对应服务入口。若命中，说明该后台或运维界面对外可访问，可用于资产识别与暴露面排查。
  reference:
    - https://www.ekare.ai/insight
  metadata:
    verified: true
    fofa-query: icon_hash="125375398"
  tags: panel,login,ekare,insight,discovery

http:
  - method: GET
    path:
      - "{{BaseURL}}"

    host-redirects: true
    max-redirects: 2

    matchers:
      - type: dsl
        dsl:
          - 'contains(body, "<title>eKare inSight")'
          - 'status_code == 200'
        condition: and
