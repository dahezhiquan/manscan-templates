id: oracle-weblogic-iiop-detect

info:
  name: Oracle WebLogic IIOP 协议识别（指纹识别）
  author: F1tz
  severity: info
  description: |
    Oracle WebLogic IIOP/GIOP 是 WebLogic Server 的远程对象通信通道，常用于 CORBA/RMI 相关服务访问。该模板发送 GIOP NameService 探测报文，并通过匹配 `GIOP`、`weblogic` 等响应特征识别 WebLogic IIOP 通道。
  metadata:
    max-request: 1
    vendor: oracle
    product: weblogic_server
  tags: network,weblogic,detect,oracle,iiop,tcp,discovery
tcp:
  - inputs:
      - data: "{{hex_decode('47494f50010200030000001700000002000000000000000b4e616d6553657276696365')}}"
    host:
      - "{{Hostname}}"
    read-size: 1024

    matchers-condition: and
    matchers:
      - type: word
        words:
          - "GIOP"
          - "weblogic"
        condition: and
