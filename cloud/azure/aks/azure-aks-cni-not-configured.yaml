id: azure-aks-cni-not-configured
info:
  name: Azure AKS 未使用 Azure CNI 网络模式（云安全）
  author: princechaddha
  severity: medium
  description: AKS 集群使用 Kubenet 而不是 Azure CNI 时，Pod 通常通过节点地址转换和路由表接入网络，不能直接从 Azure 虚拟网络子网获得地址。该模板查询 networkProfile.networkPlugin，当返回 kubenet 时判定未配置 Azure CNI 网络模式。
  impact: |
    - Pod 与 Azure 虚拟网络资源的直连和分段能力受限，可能使网络安全组、路由和审计策略难以按工作负载粒度落地。
    - 在需要严格网络隔离、私有服务访问或精细出站控制的场景中，Kubenet 配置可能增加横向移动和数据外传的管控难度。
  remediation: |
    - 根据业务网络隔离需求选择 Azure CNI，并为 Pod 地址预留足够的虚拟网络子网空间。
    - 在迁移或重建集群前验证网络策略、NSG、路由、负载均衡器和私有终结点连通性，避免切换造成业务中断。
  reference:
    - https://docs.microsoft.com/en-us/azure/aks/configure-azure-cni
  metadata:
    vendor: microsoft
    product: azure-kubernetes-service
  tags: cloud,devops,azure,microsoft,aks,azure-cloud-config

flow: |
  code(1);
  for (let clusterData of iterate(template.clusterList)) {
    clusterData = JSON.parse(clusterData);
    set("name", clusterData.name);
    set("resourceGroup", clusterData.resourceGroup);
    code(2);
  }

self-contained: true
code:
  - engine:
      - sh
      - bash
    source: |
      az aks list --output json --query '[*].{name:name, resourceGroup:resourceGroup}'

    extractors:
      - type: json
        name: clusterList
        internal: true
        json:
          - '.[]'

  - engine:
      - sh
      - bash
    source: |
      az aks show --name "$name" --resource-group "$resourceGroup" --query 'networkProfile.networkPlugin'

    matchers-condition: and
    matchers:
      - type: word
        words:
          - "kubenet"

    extractors:
      - type: dsl
        dsl:
          - 'name + " in " + resourceGroup + " is using Kubenet instead of Azure CNI"'
