id: circutor-default-login

info:
  name: Circutor Line-TCPRS1 默认口令登录（弱口令）
  author: s4e-io
  severity: high
  description: |
    该模板通过尝试 Circutor Line-TCPRS1 的默认账号口令，并依据认证成功后的响应特征判断目标是否仍在使用未修改的弱口令。若命中，攻击者可直接登录系统，进一步访问敏感信息、修改配置或执行未授权操作。
  reference:
    - https://circutor.com/en/products/line-tcprs1/
  metadata:
    verified: true
    max-request: 1
    vendor: circutor
    product: line-tcprs1
    shodan-query: http.html:"Line-TCPRS1"
    fofa-query: body="Line-TCPRS1"
  tags: circutor,iot,tcprs1,default-login,vuln

http:
  - raw:
      - |
        POST /api/v1/login HTTP/1.1
        Host: {{Hostname}}
        Content-Type: application/json;charset=UTF-8

        {"Username":"{{username}}","Password":"{{password}}"}

    attack: pitchfork
    payloads:
      username:
        - admin
      password:
        - circutor

    matchers-condition: and
    matchers:
      - type: regex
        part: body
        regex:
          - '"Token"\s*:\s*"eyJ[a-zA-Z0-9]{10,}\.eyJ[a-zA-Z0-9]{10,}\.[a-zA-Z0-9_\-]{10,}"'

      - type: word
        part: header
        words:
          - 'application/json'

      - type: status
        status:
          - 200

    extractors:
      - type: regex
        part: body
        name: token
        group: 1
        regex:
          - '"Token"\s*:\s*"(eyJ[a-zA-Z0-9]{10,}\.eyJ[a-zA-Z0-9]{10,}\.[a-zA-Z0-9_\-]{10,})"'
