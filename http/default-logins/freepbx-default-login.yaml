id: freepbx-default-login

info:
  name: FreePBX 默认管理员凭据（弱口令）
  author: 0x_Akoko
  severity: high
  description: |
    该模板用于检测 FreePBX 是否仍可使用默认凭据或弱口令登录。模板主要向 `/admin/config.php` 等认证入口发送请求，使用内置默认凭据组合进行认证尝试，并根据响应中的 `status_code == 200`、`contains(body, "FreePBX")` 等登录成功特征判断登录是否成功；命中说明目标未及时修改出厂、示例或初始化账号口令。
  impact: |
    - 攻击者可进入 FreePBX 管理界面，查看或修改用户、权限、认证策略、流程或资产配置。
    - 身份、流程或资产管理系统被弱口令接管后，可能造成越权访问、策略绕过、敏感资产信息泄露和更大范围的权限扩散。
  remediation: |
    - 立即修改默认管理员口令，禁用初始化账号，并为高权限账户启用多因素认证。
    - 限制管理入口来源，按最小权限拆分管理员角色，并开启认证、授权和配置变更审计。
    - 复核用户、角色、认证策略、访问令牌和近期登录记录，必要时强制重置相关账号凭据。
  reference:
    - https://www.freepbx.org/
    - https://community.freepbx.org/t/freepbx-default-admin-passwords/9221
  metadata:
    verified: true
    max-request: 2
    vendor: sangoma
    product: freepbx
    shodan-query: http.title:"FreePBX"
    fofa-query: title="FreePBX"
  tags: freepbx,default-login,auth,misconfig

variables:
  username: "admin"
  password: "admin"

flow: http(1) && http(2)

http:
  - raw:
      - |
        GET /admin/config.php HTTP/1.1
        Host: {{Hostname}}

    matchers:
      - type: dsl
        internal: true
        dsl:
          - 'status_code == 200'
          - 'contains(body, "FreePBX")'
        condition: and

    extractors:
      - type: regex
        name: session
        part: header
        group: 1
        internal: true
        regex:
          - 'Set-Cookie: (PHPSESSID=[^;]+)'

  - raw:
      - |
        POST /admin/config.php HTTP/1.1
        Host: {{Hostname}}
        Content-Type: application/x-www-form-urlencoded
        Cookie: {{session}}

        username={{username}}&password={{password}}

    matchers:
      - type: dsl
        dsl:
          - 'status_code == 200'
          - 'contains(body, "FreePBX Administration")'
          - '!contains(body, "loginform")'
        condition: and
