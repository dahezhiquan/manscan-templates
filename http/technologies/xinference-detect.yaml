id: xinference-detect

info:
  name: Xinference 指纹识别（指纹识别）
  author: rxerium
  severity: info
  description: >-
    Xinference 是本地和分布式 AI 模型推理平台，用于部署大语言模型、嵌入模型和多模态模型服务。该模板通过请求目标服务并检查页面正文关键字、DSL
    条件等指纹特征，判断目标是否使用或暴露了 Xinference 相关组件；命中结果仅表示指纹特征匹配，可用于资产盘点、技术栈识别和后续安全评估，不代表已确认存在可利用漏洞。
  reference:
  - https://github.com/xorbitsai/inference
  - https://inference.readthedocs.io/
  metadata:
    verified: true
    max-request: 1
    vendor: xorbitsai
    product: xinference
    shodan-query: 'port:9997 http.html:"xinference"'
  tags: tech,xinference,llm,inference,ai,detect,discovery
http:
  - raw:
      - |
        GET /v1/models HTTP/1.1
        Host: {{Hostname}}

    matchers-condition: and
    matchers:
      - type: word
        words:
          - '"object":"list"'
          - '"data":'
        part: body
        condition: and

      - type: dsl
        dsl:
          - status_code == 200
          - contains(content_type, "application/json")
          - contains(header, "uvicorn")
        condition: and
