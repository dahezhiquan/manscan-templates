id: iam-password-policy
info:
  name: IAM 账号密码策略未配置（云安全）
  author: princechaddha
  severity: medium
  description: AWS 账号未配置自定义 IAM password policy 时，控制台用户口令复杂度、长度、重用限制和过期策略缺少统一约束。该模板调用 get-account-password-policy，并在返回 NoSuchEntity 时命中。
  impact: |
    - 弱口令或长期不变的口令更容易被猜解、撞库或钓鱼后复用。
    - 组织无法统一证明控制台身份符合内部安全基线或合规要求。
  remediation: |
    - 配置账号级 IAM password policy，覆盖最小长度、复杂度、重用限制和过期策略。
    - 结合 MFA、集中身份管理和最小权限策略，逐步减少长期 IAM 控制台用户。
  reference:
    - https://docs.aws.amazon.com/cli/latest/reference/iam/get-account-password-policy.html
  metadata:
    vendor: amazon
    product: iam
  tags: cloud,devops,aws,amazon,iam,aws-cloud-config
self-contained: true
code:
  - engine:
      - sh
      - bash
    source: |
      aws iam get-account-password-policy

    matchers:
      - type: word
        words:
          - "NoSuchEntity"

    extractors:
      - type: dsl
        dsl:
          - '"AWS cloud account is not configured with a custom IAM password policy"'
