id: citibank-phish

info:
  name: Citibank 仿冒钓鱼网站（钓鱼网站识别）
  author: rxerium
  severity: info
  description: |
    检测到疑似仿冒 Citibank 的钓鱼网站。模板在目标页面返回 200、页面内容命中 Citibank 的金融或支付页面特征，且当前主机不属于 citi.com、citibank.com 官方域名时触发，用于识别借用 Citibank 品牌页面诱导用户信任的仿冒站点。
  reference:
    - https://citi.com
  metadata:
    max-request: 1
  tags: phishing,citibank,citi,bank,osint,discovery
http:
  - method: GET
    path:
      - "{{BaseURL}}"

    host-redirects: true
    max-redirects: 2

    matchers-condition: and
    matchers:
      - type: word
        words:
          - 'Citi'
          - 'Citibank is the consumer division of financial services multinational Citigroup. Citibank was founded in 1812 as the City Bank of New York, and later became First National City Bank of New York. Citibank provides credit cards, mortgages, personal loans, commercial loans, and lines of credit.'
        condition: and

      - type: status
        status:
          - 200

      - type: dsl
        dsl:
          - '!contains(host,"citi.com")'
          - '!contains(host,"citibank.com")'
