id: posh-c2

info:
  name: PoshC2 证书识别（证书安全）
  author: pussycat0x
  severity: info
  description: 该模板通过证书颁发者字段识别目标是否可能与 PoshC2 命令控制平台相关。命中通常意味着远端使用了该框架常见的证书标识。
  reference:
    - https://twitter.com/MichalKoczwara/status/1551639708949692416
    - https://poshc2.readthedocs.io/en/latest/
  metadata:
    verified: "true"
    max-request: 1
    shodan-query: ssl:"P18055077"
  tags: c2,ssl,tls,ir,osint,malware,posh,discovery
ssl:
  - address: "{{Host}}:{{Port}}"
    matchers:
      - type: word
        part: issuer_cn
        words:
          - "P18055077"

    extractors:
      - type: json
        json:
          - ".issuer_cn"
