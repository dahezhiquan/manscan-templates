id: api-clockify

info:
  name: Clockify API Token 可用性校验（token喷洒）
  author: daffainfo
  severity: info
  description: 该模板通过调用 Clockify API 的已知接口验证提供的 token 是否有效，命中后通常表示可访问协作、任务或项目管理能力。
  reference:
    - https://clockify.me/developers-api
    - https://github.com/daffainfo/all-about-apikey/tree/main/clockify
  metadata:
    max-request: 1
  tags: token-spray,clockify

self-contained: true

http:
  - raw:
      - |
        GET https://api.clockify.me/api/v1/user HTTP/1.1
        Host: api.clockify.me
        X-Api-Key: {{token}}
        Content-Type: application/json

    matchers:
      - type: word
        part: body
        words:
          - '"id":'
          - '"email":'
          - '"name":'
        condition: and
