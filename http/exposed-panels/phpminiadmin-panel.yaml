id: phpminiadmin-panel

info:
  name: phpMiniAdmin 登录面板识别（暴露面识别）
  author: nullfuzz
  severity: info
  description: |
    该模板通过识别 phpMiniAdmin 登录入口的页面标题、特征文本或重定向行为，判断目标是否暴露了对应的认证界面。若命中，说明该登录面板对外可访问，可用于暴露面梳理与后续安全评估。
  reference:
    - https://github.com/osalabs/phpminiadmin
  classification:
    cvss-metrics: CVSS:3.0/AV:N/AC:L/PR:N/UI:N/S:U/C:N/I:N/A:N
    cwe-id: CWE-200
    cpe: cpe:2.3:a:phpminiadmin_project:phpminiadmin:*:*:*:*:*:*:*:*
  metadata:
    verified: true
    max-request: 1
    shodan-query: http.html:"phpMiniAdmin"
    product: phpminiadmin
    vendor: phpminiadmin_project
  tags: panel,phpminiadmin,discovery

http:
  - method: GET
    path:
      - "{{BaseURL}}/phpminiadmin.php"

    matchers:
      - type: dsl
        dsl:
          - "status_code == 200"
          - "contains(body, '<title>phpMiniAdmin')"
        condition: and

    extractors:
      - type: regex
        part: body
        group: 1
        regex:
          - 'phpMiniAdmin ([0-9._]+)'
