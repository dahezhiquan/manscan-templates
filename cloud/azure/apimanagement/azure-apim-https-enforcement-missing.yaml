id: azure-apim-https-enforcement-missing
info:
  name: Azure API Management HTTPS Enforcement 未Configured（云安全）
  author: princechaddha
  severity: high
  description: 该规则用于检查 Azure apimanagement 相关安全控制、保护能力或合规配置是否处于未启用、缺失或未正确配置状态，以降低持续暴露风险并提升整体云安全基线。
  impact: |
    - 关键安全控制缺失会降低防护深度，使风险长期处于不可见或不可控状态。
    - 这类配置问题通常不会立即触发故障，但会显著增加后续入侵、横向移动或合规违规的概率。
  remediation: |
    - 按厂商最佳实践启用缺失的安全控制、保护功能或基线配置。
    - 将该类配置纳入持续巡检与自动化合规检查，避免后续资源再次以不安全默认值部署。
  reference:
    - https://docs.microsoft.com/en-us/azure/api-management/api-management-howto-secure-backend
  tags: cloud,devops,azure,microsoft,apim,azure-cloud-config

flow: |
  code(1);
  for (let Service of iterate(template.serviceList)) {
    Service = JSON.parse(Service);
    set("servicename", Service.name);
    set("resourcegroup", Service.resourceGroup);
    code(2);
    for (let Api of iterate(template.apiList)) {
      set("apiid", Api);
      code(3);
    }
  }

self-contained: true
code:
  - engine:
      - sh
      - bash
    source: |
      az apim list --output json --query '[*].{name:name, resourceGroup:resourceGroup}'

    extractors:
      - type: json
        name: serviceList
        internal: true
        json:
          - '.[]'

  - engine:
      - sh
      - bash
    source: |
      az apim api list -g $resourcegroup -n $servicename  --query '[].name'

    extractors:
      - type: json
        name: apiList
        internal: true
        json:
          - '.[]'

  - engine:
      - sh
      - bash
    source: |
      az apim api show --api-id "$apiid" --service-name $servicename --resource-group $resourcegroup --query 'protocols'

    matchers-condition: and
    matchers:
      - type: word
        words:
          - "https"

      - type: word
        words:
          - "http"
        negative: true

    extractors:
      - type: dsl
        dsl:
          - '"Service: " + service-name + " API: " + api-id + " does not enforce HTTPS exclusively"'

      - type: dsl
        dsl:
          - stderr
