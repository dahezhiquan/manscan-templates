id: k8s-readiness-probe-not-set

info:
  name: Readiness Probes not set 中的Deployments（云安全）
  author: princechaddha
  severity: medium
  description: Deployment 未配置 readinessProbe 时，Kubernetes 可能在容器尚未准备好接收流量时将其加入 Service 后端。本模板枚举 Deployment，检查 Pod 模板中是否没有任何容器配置 readinessProbe。
  impact: |
    - 未就绪实例可能接收真实流量，造成请求失败、超时或错误响应。
    - 滚动发布时缺少就绪判断会降低发布稳定性和故障隔离能力。
  remediation: |
    - 为对外服务容器配置 readinessProbe，确保只有真正可服务的实例进入流量池。
    - 根据应用依赖设置合理的初始延迟、超时和失败阈值。
  reference:
    - https://kubernetes.io/docs/tasks/configure-pod-container/configure-liveness-readiness-startup-probes/
  metadata:
    vendor: kubernetes
    product: kubernetes
  tags: cloud,devops,kubernetes,devsecops,deployments,k8s-cluster-security
flow: |
  code(1);
  for (let deployment of template.items) {
    set("deployment",deployment)
    javascript(1);
  }

self-contained: true
code:
  - engine:
      - sh
      - bash
    source: kubectl get deployments --all-namespaces --output=json
    extractors:
      - type: json
        name: items
        internal: true
        json:
          - '.items[]'

javascript:
  - code: |
        deployment = JSON.parse(template.deployment);
        if (!deployment.spec.template.spec.containers.some(container => container.readinessProbe)) {
          let result = (`Deployment '${deployment.metadata.name}' in namespace '${deployment.metadata.namespace}' lacks readiness probes.`);
          Export(result);
        }

    extractors:
      - type: dsl
        dsl:
          - response
