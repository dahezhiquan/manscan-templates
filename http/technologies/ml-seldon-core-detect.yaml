id: ml-seldon-core-detect

info:
  name: Seldon Core 指纹识别（指纹识别）
  author: rxerium
  severity: info
  description: >-
    Seldon Core 是 Kubernetes 上的机器学习模型部署平台，用于发布、扩缩容和监控模型推理服务。该模板通过请求目标服务并检查预设路径或首页响应、正则特征、HTTP
    响应头、页面正文关键字等指纹特征，判断目标是否使用或暴露了 Seldon Core 相关组件；命中结果仅表示指纹特征匹配，可用于资产盘点、技术栈识别和后续安全评估，不代表已确认存在可利用漏洞。
  reference:
  - https://github.com/SeldonIO/seldon-core
  - https://docs.seldon.ai/seldon-core-2
  metadata:
    verified: true
    max-request: 1
    vendor: seldonio
    product: seldon-core
    shodan-query: '"seldon-pipelinegateway"'
  tags: tech,seldon-core,ml,ai,mlops,detect,discovery
http:
  - method: GET
    path:
      - "{{BaseURL}}/"

    matchers-condition: and
    matchers:
      - type: regex
        part: body
        regex:
          - '"name":\s*"seldon-pipelinegateway"'

      - type: word
        part: header
        words:
          - "seldon-pipelinegateway"
