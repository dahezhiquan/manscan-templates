id: pfsense-login

info:
  name: pfSense 登录面板识别（暴露面识别）
  author: idealphase
  severity: info
  description: 该模板通过识别 pfSense 登录入口的页面标题、特征文本或重定向行为，判断目标是否暴露了对应的认证界面。若命中，说明该登录面板对外可访问，可用于暴露面梳理与后续安全评估。
  reference:
    - https://www.pfsense.org/download/
    - https://www.pfsense.org/getting-started/
  classification:
    cvss-metrics: CVSS:3.0/AV:N/AC:L/PR:N/UI:N/S:U/C:N/I:N/A:N
    cwe-id: CWE-200
    cpe: cpe:2.3:a:pfsense:pfsense:*:*:*:*:*:*:*:*
  metadata:
    max-request: 1
    vendor: pfsense
    product: pfsense
    shodan-query:
      - http.title:"pfSense - Login"
      - http.title:"pfsense - login"
    google-query:
      - intitle:"pfSense - Login"
      - intitle:"pfsense - login"
    fofa-query: title="pfsense - login"
  tags: panel,pfsense,discovery

http:
  - method: GET
    path:
      - "{{BaseURL}}"

    matchers-condition: and
    matchers:
      - type: word
        part: body
        words:
          - "<title>pfSense - Login</title>"

      - type: status
        status:
          - 200

    extractors:
      - type: regex
        group: 1
        regex:
          - '<script src="\/js\/pfSense\.js\?(.+)"><\/script>'
