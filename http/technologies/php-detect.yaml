id: php-detect

info:
  name: PHP 指纹识别（指纹识别）
  author: y0no
  severity: info
  description: >-
    PHP 是服务端脚本语言，广泛用于动态网站、CMS、API 和业务 Web 应用开发。该模板通过请求目标服务并检查预设路径或首页响应、HTTP 响应头、页面正文关键字、状态码、正则特征等指纹特征，判断目标是否使用或暴露了
    PHP 相关组件；命中结果仅表示指纹特征匹配，可用于资产盘点、技术栈识别和后续安全评估，不代表已确认存在可利用漏洞。
  classification:
    cpe: cpe:2.3:a:php:php:*:*:*:*:*:*:*:*
  metadata:
    verified: true
    max-request: 1
    vendor: php
    product: php
    shodan-query: "X-Powered-By: PHP"
  tags: tech,php,discovery
http:
  - method: GET
    path:
      - "{{BaseURL}}"

    matchers-condition: and
    matchers:
      - type: word
        part: header
        words:
          - "PHP"

      - type: status
        status:
          - 200

    extractors:
      - type: regex
        part: header
        group: 1
        regex:
          - "X-Powered-By: PHP/([0-9.]+)"
