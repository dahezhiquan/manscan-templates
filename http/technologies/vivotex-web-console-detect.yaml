id: vivotex-web-console-detect

info:
  name: VIVOTEK Web Console 指纹识别（指纹识别）
  author: pikpikcu
  severity: info
  description: >-
    VIVOTEK Web Console 是威泰克网络摄像机或视频设备的 Web 管理界面，用于查看视频、配置设备和管理状态。该模板通过请求目标服务并检查预设路径或首页响应、页面正文关键字、HTTP
    响应头、状态码等指纹特征，判断目标是否使用或暴露了 VIVOTEK Web Console 相关组件；命中结果仅表示指纹特征匹配，可用于资产盘点、技术栈识别和后续安全评估，不代表已确认存在可利用漏洞。
  classification:
    cpe: cpe:2.3:h:vivotek:ip7361:*:*:*:*:*:*:*:*
  metadata:
    max-request: 1
    vendor: vivotek
    product: ip7361
    shodan-query: title:"VIVOTEK Web Console"
    fofa-query: app="VIVOTEK-Web-Console"
  tags: tech,vivotex,console,discovery
http:
  - method: GET
    path:
      - "{{BaseURL}}"

    matchers-condition: and
    matchers:
      - type: word
        part: body
        words:
          - "<title>VIVOTEK Web Console</title>"

      - type: word
        part: header
        words:
          - "text/html"

      - type: status
        status:
          - 200
