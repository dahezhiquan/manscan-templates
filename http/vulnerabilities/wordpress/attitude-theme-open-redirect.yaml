id: attitude-theme-open-redirect

info:
  name: WordPress Attitude 1.1.1 - 开放重定向漏洞
  author: 0x_Akoko
  severity: medium
  description: WordPress Attitude 1.1.1 - 开放重定向 存在开放重定向漏洞。攻击者可构造恶意跳转链接诱导用户访问钓鱼站点，或配合其他业务流程绕过安全校验。
  reference:
    - https://cxsecurity.com/issue/WLB-2020030185
  classification:
    cvss-metrics: CVSS:3.1/AV:N/AC:L/PR:N/UI:R/S:C/C:L/I:L/A:N
    cvss-score: 6.1
    cwe-id: CWE-601
  metadata:
    max-request: 1
  tags: wordpress,wp-theme,redirect,vuln

http:
  - method: GET
    path:
      - "{{BaseURL}}/wp-content/themes/Attitude/go.php?https://interact.sh/"

    matchers:
      - type: regex
        regex:
          - '(?m)^(?:Location\s*?:\s*?)(?:https?://|//)?(?:[a-zA-Z0-9\-_\.@]*)interact\.sh.*$'
        part: header
