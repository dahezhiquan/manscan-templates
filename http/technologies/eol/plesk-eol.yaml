id: plesk-eol

info:
  name: Plesk EOL 指纹识别（指纹识别）
  author: Shivam Kamboj
  severity: info
  description: >-
    Plesk 是主机和网站管理控制面板，EOL 版本表示目标面板分支已结束官方维护。该模板通过请求目标服务并检查预设路径或首页响应、页面正文关键字、正则特征、DSL
    条件等指纹特征，判断目标是否使用或暴露了 Plesk EOL 相关组件；命中结果仅表示指纹特征匹配，可用于资产盘点、技术栈识别和后续安全评估，不代表已确认存在可利用漏洞。
  reference:
  - https://endoflife.date/plesk
  - https://docs.plesk.com/release-notes/obsidian/change-log/
  metadata:
    verified: true
    max-request: 2
    shodan-query: "Plesk"
  tags: tech,plesk,eol
http:
  - method: GET
    path:
      - "{{BaseURL}}"
      - "{{BaseURL}}/login_up.php"

    stop-at-first-match: true

    extractors:
      - type: regex
        part: body
        name: version
        group: 1
        regex:
          - '(?i)<title>Plesk Obsidian ([0-9.]+)'
          - '(?i)Plesk Obsidian ([0-9.]+)'

    matchers:
      - type: dsl
        dsl:
          - 'len(version) > 0'
          - 'compare_versions(version, "<18.0.75")'
        condition: and
