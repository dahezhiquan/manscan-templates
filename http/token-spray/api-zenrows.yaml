id: api-zenrows

info:
  name: ZenRows API Token 可用性校验（token喷洒）
  author: daffainfo
  severity: info
  description: 该模板通过调用 ZenRows API 的已知接口验证提供的 token 是否有效，命中后通常表示可访问网页抓取与内容提取能力。
  reference:
    - https://www.zenrows.com/documentation/
    - https://github.com/daffainfo/all-about-apikey/tree/main/zenrows
  metadata:
    max-request: 1
  tags: token-spray,zenrows

self-contained: true

http:
  - method: GET
    path:
      - "https://api.zenrows.com/v1/?apikey={{token}}&url=https://oast.me/"

    matchers:
      - type: word
        part: body
        words:
          - '<h1> Interactsh Server </h1>'
