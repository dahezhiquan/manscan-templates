id: insecure-tty-permissions

info:
  name: macOS TTY 设备全局可读（本地基线扫描）
  author: geeknik
  severity: medium
  description: |
    该模板检查 TTY 设备是否全局可读。权限过宽可能造成会话内容被其他用户窥探。
  impact: |
    本地攻击者可能篡改可自动执行或高权限相关文件，造成持久化、权限提升或配置破坏。
  remediation: |
    收紧相关文件或目录权限，移除全局可写位，确保关键配置仅由 root 或授权管理员维护。
  tags: macos,audit,local,security,tty

self-contained: true

code:
  - engine:
      - sh
      - bash
    source: |
      ls -l /dev/tty*
    matchers:
      - type: regex
        regex:
          - "crw-rw-rw-.*"
