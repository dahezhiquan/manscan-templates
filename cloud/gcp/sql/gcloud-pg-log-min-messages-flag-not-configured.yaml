id: gcloud-pg-log-min-messages-flag-not-configured

info:
  name: Log Min Messages Flag 未Configured Properly 的PostgreSQL Instances（云安全）
  author: princechaddha
  severity: medium
  description: PostgreSQL log_min_messages 控制写入服务器日志的最低消息级别，未配置会造成日志粒度不可控。本模板检查 Cloud SQL PostgreSQL 实例 databaseFlags 中的 log_min_messages，返回 null 时报告该标志未正确配置。
  impact: |
    - 日志级别过高可能遗漏重要告警，过低则产生大量噪声并增加成本。
    - 缺少统一消息级别会削弱跨实例日志关联、告警规则和审计复核效果。
  remediation: |
    - 为 PostgreSQL 实例显式设置符合组织要求的 log_min_messages。
    - 将日志级别变更纳入发布和变更审批，避免诊断后遗留过宽或过窄配置。
  reference:
    - https://cloud.google.com/sql/docs/postgres/flags
  metadata:
    vendor: google
    product: cloud-sql
  tags: cloud,devops,gcp,gcloud,google-cloud-sql,postgresql,logging,gcp-cloud-config

flow: |
  code(1)
  for(let projectId of iterate(template.projectIds)){
    set("projectId", projectId)
    code(2)
    for(let sqlInstance of iterate(template.sqlInstances)){
      set("sqlInstance", sqlInstance)
      code(3)
    }
  }

self-contained: true

code:
  - engine:
      - sh
      - bash
    source: |
      gcloud projects list --format="json(projectId)"

    extractors:
      - type: json
        name: projectIds
        internal: true
        json:
          - '.[].projectId'

  - engine:
      - sh
      - bash
    source: |
      gcloud sql instances list --project $projectId --filter=DATABASE_VERSION:POSTGRES* --format="json(name)"

    extractors:
      - type: json
        name: sqlInstances
        internal: true
        json:
          - '.[].name'

  - engine:
      - sh
      - bash
    source: |
      gcloud sql instances describe $sqlInstance --project $projectId --format=json | jq -r '.settings.databaseFlags[]? | select(.name=="log_min_messages") | .value // "null"'

    matchers:
      - type: word
        words:
          - 'null'

    extractors:
      - type: dsl
        dsl:
          - '"The log_min_messages flag is not configured properly or is set to an inappropriate value for PostgreSQL instance " + sqlInstance + " in project " + projectId'
