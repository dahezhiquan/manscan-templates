id: servicenow-title-injection

info:
  name: ServiceNow 标题注入
  author: DhiyaneshDk
  severity: high
  description: |
    该模板用于核查 ServiceNow 标题注入。该类问题通常源于配置文件、备份文件、管理页面、服务状态或敏感资源被错误暴露到 Web 访问路径。模板会向目标发送探测请求，并依据请求 `/login.do?jvar_page_title=<style><foo>Injected Title</foo></style>`、匹配 `<title><style><foo>Injected Title</foo></style></title>`、匹配 `text/html`、状态码 200 等证据确认目标是否存在该配置问题。
  impact: |
    - 攻击者可获取版本、路径、账号、密钥、令牌、配置或业务数据等敏感信息。
    - 泄露的信息可能被用于凭据攻击、漏洞匹配、权限提升或横向移动。
  remediation: |
    - 移除 Web 根目录下不应公开的配置、备份、日志和临时文件。
    - 为敏感页面和资源增加访问控制，并按最小暴露原则收敛公开路径。
    - 轮换已暴露的密钥、令牌和凭据，并审计异常下载或枚举行为。
  reference:
    - https://www.assetnote.io/resources/research/chaining-three-bugs-to-access-all-your-servicenow-data
  classification:
    cpe: cpe:2.3:a:servicenow:servicenow:*:*:*:*:*:*:*:*
    cwe-id: CWE-79
  metadata:
    verified: true
    max-request: 1
    vendor: servicenow
    product: servicenow
    shodan-query:
      - http.favicon.hash:1701804003
      - http.title:"servicenow"
    fofa-query:
      - icon_hash=1701804003
      - title="servicenow"
    google-query: intitle:"servicenow"
  tags: cve,cve2024,servicenow,injection,vuln

http:
  - method: GET
    path:
      - "{{BaseURL}}/login.do?jvar_page_title=<style><foo>Injected Title</foo></style>"

    matchers-condition: and
    matchers:
      - type: word
        part: body
        words:
          - '<title><style><foo>Injected Title</foo></style></title>'

      - type: word
        part: header
        words:
          - 'text/html'

      - type: status
        status:
          - 200
