id: allnet-default-login

info:
  name: Allnet 默认口令登录（弱口令）
  author: ritikchaddha
  severity: high
  description: |
    该模板通过尝试 Allnet 的默认管理员账号口令（如 admin），并依据认证成功后的响应特征判断目标是否仍在使用未修改的弱口令。若命中，攻击者通常可直接获得后台管理权限，进一步访问敏感信息、修改配置或执行未授权操作。
  metadata:
    verified: true
    max-request: 2
    shodan-query: http.favicon.hash:-121681558
  tags: default-login,allnet,vuln

http:
  - raw:
      - |
        POST /cgi-bin/dispatcher.cgi?cmd=1 HTTP/1.1
        Host: {{Hostname}}
        Content-Type: application/x-www-form-urlencoded

        username={{username}}&password={{password}}&login=1

      - |
        POST /cgi-bin/dispatcher.cgi?cmd=3 HTTP/1.1
        Host: {{Hostname}}
        Content-Type: application/x-www-form-urlencoded

        username={{username}}&password={{password}}&login=1

    stop-at-first-match: true
    attack: pitchfork
    payloads:
      username:
        - admin
      password:
        - admin

    matchers-condition: and
    matchers:
      - type: word
        part: body
        words:
          - '>LOGOUT</a>'
          - 'REBOOT</a>'
        condition: and

      - type: status
        status:
          - 200
