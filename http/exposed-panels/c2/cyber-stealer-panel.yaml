id: cyber-stealer-panel

info:
  name: Cyber Stealer C2 面板识别（暴露面识别）
  author: pussycat0x
  severity: info
  description: |
    该模板通过识别 Cyber Stealer C2 相关页面或响应特征，判断目标是否暴露了疑似 C2、窃密或钓鱼基础设施面板。若命中，可作为外部暴露面排查、威胁狩猎与恶意基础设施识别的线索。
  reference:
    - https://x.com/solostalking/status/1947143367336534254
  metadata:
    verified: true
    max-request: 1
    shodan-query: html:"Cyber Stealer - Secure Access"
    fofa-query: title="Cyber Stealer - Secure Access"
  tags: c2,cyber-stealer,stealer,panel,login,vuln

http:
  - method: GET
    path:
      - "{{BaseURL}}/webpanel/panel/login.php"

    host-redirects: true

    matchers-condition: and
    matchers:
      - type: word
        part: body
        words:
          - "<title>Cyber Stealer - Secure Access"

      - type: status
        status:
          - 200
