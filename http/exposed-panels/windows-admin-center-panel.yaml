id: windows-admin-center-panel

info:
  name: Windows Admin Center 面板识别（指纹识别）
  author: darses
  severity: info
  description: |-
    Windows Admin Center 是 Microsoft Windows 服务器 Web 管理中心，用于主机、服务、存储、事件和远程管理。该模板请求首页，并依据 HTTP 403 状态码、页面标题、正文关键字或品牌资源特征识别目标是否部署了该系统或暴露了对应入口，适用于资产指纹确认；命中结果仅表示系统特征匹配，不代表已确认存在未授权访问或可利用漏洞。
  reference:
  - https://github.com/microsoft/Windows-admin-center
  metadata:
    shodan-query:
    - http.favicon.hash:-765377534
    - title:"Windows Admin Center"
    fofa-query:
    - icon_hash="-765377534"
    - title="Windows Admin Center"
  tags: detect,windows,panel,discovery

http:
  - method: GET
    path:
      - "{{BaseURL}}"

    matchers-condition: and
    matchers:
      - type: status
        status:
          - 403

      - type: word
        part: body
        words:
          - "Windows Admin Center</title>"
