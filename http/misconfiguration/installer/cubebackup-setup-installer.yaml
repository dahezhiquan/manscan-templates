id: cubebackup-setup-installer

info:
  name: CubeBackup 安装配置 Page 暴露
  author: DhiyaneshDK
  severity: high
  description: |
    检测到 CubeBackup 安装配置 Page 暴露。该页面属于安装、初始化或配置向导流程，若对外暴露，攻击者可能完成初始化、创建管理员账户或重新配置目标系统。
  reference:
    - https://www.cubebackup.com/
  metadata:
    verified: true
    max-request: 1
    fofa-query: body="CubeBackup setup"
  tags: misconfig,install,exposure,cubebackup,vuln

http:
  - method: GET
    path:
      - "{{BaseURL}}"

    matchers-condition: and
    matchers:
      - type: word
        part: body
        words:
          - "CubeBackup setup"

      - type: status
        status:
          - 200
