id: azure-delete-lb-alert-unconfigured
info:
  name: Azure 负载均衡器删除告警未配置（云安全）
  author: princechaddha
  severity: high
  description: 负载均衡器删除操作未配置 Activity Log 告警时，公网入口或内部流量分发组件可能被删除而不被及时发现。该模板枚举已启用的 Activity Log Alert，并检查 condition 是否缺少 Microsoft.Network/loadBalancers/delete 操作条件。
  impact: |
    - 负载均衡器被删除可能导致服务入口中断、流量黑洞或后端资源失去统一暴露控制。
    - 攻击者删除网络入口后，团队缺少及时告警会延长业务中断和事件响应时间。
  remediation: |
    - 创建针对负载均衡器删除操作的 Activity Log Alert，并将通知发送到运维和安全响应渠道。
    - 限制负载均衡器删除权限，结合资源锁、变更审批和恢复演练降低破坏性操作影响。
  reference:
    - https://docs.microsoft.com/en-us/azure/azure-monitor/platform/alerts-activity-log
  metadata:
    vendor: microsoft
    product: azure-monitor
  tags: cloud,devops,azure,microsoft,load-balancer,azure-cloud-config

flow: |
  code(1);
  for (let AlertData of iterate(template.alertList)) {
    set("id", AlertData);
    code(2);
  }

self-contained: true
code:
  - engine:
      - sh
      - bash
    source: |
      az monitor activity-log alert list --output json --query '[?(enabled==`true`)].id'

    extractors:
      - type: json
        name: alertList
        internal: true
        json:
          - '.[]'

  - engine:
      - sh
      - bash
    source: |
      az monitor activity-log alert show --ids "$id" --query 'condition'

    matchers-condition: and
    matchers:
      - type: word
        words:
          - '"field": "operationName"'

      - type: word
        words:
          - "Microsoft.Network/loadBalancers/delete"
        negative: true

    extractors:
      - type: dsl
        dsl:
          - 'id + " does not have the correct alert configuration for Delete Load Balancer events"'
