id: contentify-installer

info:
  name: Contentify 安装向导 暴露
  author: ritikchaddha
  severity: high
  description: |
    检测到 Contentify 安装向导 暴露。该页面属于安装、初始化或配置向导流程，若对外暴露，攻击者可能完成初始化、创建管理员账户或重新配置目标系统。
  metadata:
    verified: true
    max-request: 1
  tags: misconfig,contentify,install,exposure,vuln

http:
  - method: GET
    path:
      - '{{BaseURL}}/install'

    matchers-condition: and
    matchers:
      - type: word
        part: body
        words:
          - 'Contentify - Step 1'
          - 'start the installation'
        condition: and

      - type: status
        status:
          - 200
