id: cloudfront-logging-disabled

info:
  name: CloudFront 访问日志未启用（云安全）
  author: DhiyaneshDK
  severity: medium
  description: CloudFront 访问日志未启用是一类边缘访问审计缺失风险，客户端请求、来源地区、缓存结果和异常访问行为可能无法被留存。发生安全事件或业务异常时，缺少访问日志会削弱取证、统计和趋势分析能力。模板读取 `Distribution.DistributionConfig.Logging.Enabled`，当返回 `False` 时判定访问日志关闭。
  impact: |
    - 安全事件发生后，可能缺少边缘访问记录用于溯源、取证和影响面分析。
    - 运维团队难以及时发现异常流量、缓存异常和来源地区等访问模式变化。
  remediation: |
    - 为 CloudFront 分配启用标准访问日志或实时日志，并将日志投递到受控存储位置。
    - 对日志存储桶配置访问控制、加密和生命周期策略，确保日志可用且不被未授权访问。
  reference:
    - https://www.trendmicro.com/cloudoneconformity-staging/knowledge-base/aws/CloudFront/cloudfront-logging-enabled.html
    - http://docs.aws.amazon.com/AmazonCloudFront/latest/DeveloperGuide/AccessLogs.html
  metadata:
    vendor: amazon
    product: cloudfront
  tags: cloud,devops,aws,amazon,cloudfront,aws-cloud-config

variables:
  region: "us-west-2"

flow: |
  code(1)
  for(let DistributionListItemsId of iterate(template.distributions)){
    set("distribution", DistributionListItemsId)
    code(2)
  }

self-contained: true

code:
  - engine:
      - sh
      - bash

    source: |
      aws cloudfront list-distributions --output table --query 'DistributionList.Items[*].Id' --region $region --output json

    extractors:
      - type: json
        name: distributions
        internal: true
        json:
          - '.[]'

  - engine:
      - sh
      - bash

    source: |
        aws cloudfront get-distribution --id $distribution --query 'Distribution.DistributionConfig.Logging.Enabled' --region $region --output text

    matchers:
      - type: word
        words:
          - "False"

    extractors:
      - type: dsl
        dsl:
          - '"Cloudfront Logging " + distribution + " is Disabled"'
