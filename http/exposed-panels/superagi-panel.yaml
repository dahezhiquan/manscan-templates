id: superagi-panel

info:
  name: SuperAGI 面板识别（指纹识别）
  author: rxerium
  severity: info
  description: |-
    SuperAGI 是自主智能体平台，用于创建、运行和管理 AI Agent 工作流。该模板请求首页，并依据 DSL 条件识别目标是否部署了该系统或暴露了对应入口，适用于资产指纹确认；命中结果仅表示系统特征匹配，不代表已确认存在未授权访问或可利用漏洞。
  reference:
  - https://github.com/TransformerOptimus/SuperAGI
  - https://superagi.com/
  metadata:
    verified: true
    max-request: 1
    vendor: TransformerOptimus
    product: superagi
    shodan-query: 'http.favicon.hash:-2056571568'
    fofa-query: 'icon_hash="-2056571568"'
  tags: panel,superagi,ai,agent,detect,discovery

http:
  - raw:
      - |
        GET / HTTP/1.1
        Host: {{Hostname}}

    host-redirects: true
    max-redirects: 2

    matchers:
      - type: dsl
        dsl:
          - contains(body, "<title>SuperAGI</title>")
          - status_code == 200 || status_code == 404
        condition: and
