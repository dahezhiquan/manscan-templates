id: divi-form-builder-detect

info:
  name: Divi Form Builder 指纹识别（指纹识别）
  author: rxerium
  severity: info
  description: |
    用于识别目标是否部署 Divi Form Builder 并提取相关版本或构建信息，模板会结合页面正文、状态码、特定路径或已知端点和版本或标识提取结果进行指纹匹配。
  reference:
    - https://diviengine.com/product/divi-form-builder/
  metadata:
    verified: true
    max-request: 1
    shodan-query: 'http.html:"wp-content/plugins/divi-form-builder"'
  tags: tech,wordpress,wp-plugin,divi-form-builder,divi

http:
  - method: GET
    path:
      - "{{BaseURL}}/"

    matchers-condition: and
    matchers:
      - type: word
        part: body
        words:
          - "wp-content/plugins/divi-form-builder"

      - type: status
        status:
          - 200

    extractors:
      - type: regex
        name: version
        part: body
        group: 1
        regex:
          - 'divi-form-builder[^"'']*\?ver=([0-9.]+)'
