id: azure-nsg-delete-unalerted
info:
  name: Azure NSG 删除告警未配置（云安全）
  author: princechaddha
  severity: high
  description: NSG 删除操作未配置 Activity Log 告警时，子网和网卡的网络边界可能被移除而不被及时发现。该模板枚举已启用的 Activity Log Alert，并检查 condition 是否缺少 Microsoft.Network/networkSecurityGroups/delete 操作条件。
  impact: |
    - 删除 NSG 可能使关联资源失去预期网络过滤，扩大攻击面或造成服务不可达。
    - 攻击者删除网络边界后若无告警，安全团队难以及时恢复原有控制。
  remediation: |
    - 创建针对 NSG 删除操作的 Activity Log Alert，并将告警接入即时响应渠道。
    - 限制 NSG 删除权限，使用资源锁和变更审批保护承载关键工作负载的网络资源。
  reference:
    - https://docs.microsoft.com/en-us/azure/azure-monitor/platform/alerts-activity-log
  metadata:
    vendor: microsoft
    product: azure-monitor
  tags: cloud,devops,azure,microsoft,network-security-group,azure-cloud-config

flow: |
  code(1);
  for (let AlertData of iterate(template.alertList)) {
    set("nsg", AlertData);
    code(2);
  }

self-contained: true
code:
  - engine:
      - sh
      - bash
    source: |
      az monitor activity-log alert list --output json --query '[?(enabled==`true`)].id'

    extractors:
      - type: json
        name: alertList
        internal: true
        json:
          - '.[]'

  - engine:
      - sh
      - bash
    source: |
      az monitor activity-log alert show --ids "$nsg" --query 'condition'

    matchers-condition: and
    matchers:
      - type: word
        words:
          - '"field": "operationName"'

      - type: word
        words:
          - "Microsoft.Network/networkSecurityGroups/delete"
        negative: true

    extractors:
      - type: dsl
        dsl:
          - 'nsg + " does not have the correct alert configuration for Delete Network Security Group events"'
