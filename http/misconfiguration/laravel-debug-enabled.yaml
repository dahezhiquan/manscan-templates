id: laravel-debug-enabled

info:
  name: Laravel 调试 启用
  author: notsoevilweasel
  severity: medium
  description: |
    检测到 Laravel 调试 启用。目标暴露了调试、错误或堆栈信息，可能泄露应用路径、框架版本、环境变量、源码位置或内部调用细节。
  remediation: |
    - 限制该端点的公网访问，仅允许可信来源访问。
    - 启用认证、授权和审计，并根据业务需要关闭不必要的调试或管理功能。
  metadata:
    max-request: 1
  tags: debug,laravel,misconfig,vuln

http:
  - method: GET
    path:
      - "{{BaseURL}}/_ignition/health-check"

    matchers-condition: and
    matchers:
      - type: word
        part: body
        words:
          - can_execute_commands

      - type: status
        status:
          - 200
