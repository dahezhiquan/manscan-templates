id: openstack-config

info:
  name: Openstack Infomation 泄露
  author: MayankPandey01
  severity: low
  description: |
    检测到 Openstack Infomation 泄露。目标可能暴露云实例、容器或运行环境元数据，攻击者可据此获取实例身份、网络配置、凭据线索或部署信息。
  reference:
    - https://docs.openstack.org/python-cloudkittyclient/stein/api_reference/info.html
  classification:
    cpe: cpe:2.3:a:openstack:swift:*:*:*:*:*:*:*:*
  metadata:
    max-request: 2
    vendor: openstack
    product: swift
    shodan-query: http.favicon.hash:786533217
  tags: exposure,misconfig,openstack,vuln

http:
  - method: GET
    path:
      - "{{BaseURL}}/info"
      - "{{BaseURL}}/v1/info"

    stop-at-first-match: true

    matchers-condition: and
    matchers:
      - type: word
        words:
          - '{"formpost"'
          - '"bulk_'
        condition: and

      - type: word
        part: header
        words:
          - 'application/json'

      - type: status
        status:
          - 200
