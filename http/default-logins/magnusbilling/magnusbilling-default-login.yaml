id: magnusbilling-default-login

info:
  name: MagnusBilling 默认口令登录（弱口令）
  author: DhiyaneshDk
  severity: high
  description: |
    该模板用于检测 MagnusBilling 是否仍启用默认管理账户。若命中，攻击者可借助弱口令直接控制计费平台，进一步查看账务数据、修改配置，甚至在暴露接口较多的场景下执行额外命令。
  impact: |
    - 攻击者可直接获取 MagnusBilling 平台的完整管理权限。
    - 计费数据、客户信息与系统配置可能因此泄露或被恶意篡改。
    - 在与内部系统联动较多的部署场景下，攻击者还可能进一步横向移动到内网基础设施。
  metadata:
    verified: true
    max-request: 1
    shodan-query: html:"MagnusBilling"
  tags: mbilling,default-login,vuln

variables:
  username: "root"
  password: "9F4CA770B638615AC5C3E0D2DA16B77C80C2F2C6"   # magnus

http:
  - raw:
      - |
        POST /mbilling/index.php/authentication/login HTTP/1.1
        Host: {{Hostname}}
        Content-Type: application/x-www-form-urlencoded; charset=UTF-8

        user={{username}}&password={{password}}&key=

    matchers-condition: and
    matchers:
      - type: word
        part: body
        words:
          - '"success":"root"'

      - type: status
        status:
          - 200
