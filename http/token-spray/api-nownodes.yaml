id: api-nownodes

info:
  name: Nownodes API Token 可用性校验（token喷洒）
  author: daffainfo
  severity: info
  description: 该模板通过调用 Nownodes API 的已知接口验证提供的 token 是否有效，命中后通常表示可访问区块链与加密资产数据能力。
  reference:
    - https://nownodes.io/
    - https://github.com/daffainfo/all-about-apikey/tree/main/nownodes
  metadata:
    max-request: 1
  tags: token-spray,nownodes

self-contained: true

http:
  - raw:
      - |
        GET https://bsc-blockbook.nownodes.io/api HTTP/1.1
        Host: bsc-blockbook.nownodes.io
        api-key: {{token}}
        Content-Type: application/json

    matchers:
      - type: word
        part: body
        words:
          - '"coin":'
          - '"host":'
          - '"version":'
        condition: and
