id: codeigniter-installer

info:
  name: Codeigniter Application 安装向导 暴露
  author: ritikchaddha
  severity: high
  description: |
    检测到 Codeigniter Application 安装向导 暴露。该页面属于安装、初始化或配置向导流程，若对外暴露，攻击者可能完成初始化、创建管理员账户或重新配置目标系统。
  classification:
    cpe: cpe:2.3:a:codeigniter:codeigniter:*:*:*:*:*:*:*:*
  metadata:
    verified: true
    max-request: 1
    vendor: codeigniter
    product: codeigniter
    shodan-query: http.title:"Codeigniter Application Installer"
  tags: misconfig,codeigniter,install,exposure,vuln

http:
  - method: GET
    path:
      - '{{BaseURL}}/install/'

    matchers-condition: and
    matchers:
      - type: word
        part: body
        words:
          - 'Codeigniter Application Installer'

      - type: status
        status:
          - 200
