id: cisco-finesse-detect

info:
  name: Cisco Finesse 指纹识别（指纹识别）
  author: 0x_Akoko
  severity: info
  description: |-
    Cisco Finesse 是 Cisco 联络中心坐席桌面，用于客服坐席通话、状态和客户交互管理。该模板请求 `/desktop/assets/js/finesse.js`，并依据 DSL 条件识别目标是否使用或暴露了 Cisco Finesse 相关组件，适用于资产盘点、技术栈识别和后续安全评估；命中结果仅表示指纹特征匹配，不代表已确认存在可利用漏洞。
  metadata:
    verified: true
    max-request: 1
  tags: tech,cisco,finesse,detect,discovery

http:
  - method: GET
    path:
      - "{{BaseURL}}/desktop/assets/js/finesse.js"

    matchers:
      - type: dsl
        dsl:
          - 'status_code == 200'
          - 'contains(body, "Cisco Finesse")'
        condition: and

    extractors:
      - type: regex
        name: version
        group: 1
        regex:
          - '(?i)Version\s+([\d.]+[(]\d+[)])'
