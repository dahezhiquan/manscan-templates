id: ptc-thingworx-panel

info:
  name: PTC ThingWorx 面板（暴露面识别）
  author: rxerium
  severity: info
  description: |
    该模板通过识别 PTC ThingWorx 仪表盘或后台界面的页面特征，判断目标是否对外暴露了相关控制台。若命中，说明该服务面向外部可访问，可用于资产识别与访问控制核查。
  reference:
    - https://www.ptc.com/en/products/thingworx
  metadata:
    max-request: 1
    verified: true
    vendor: PTC
    product: thingworx
    shodan-query: 'http.title:"Thingworx"'
  tags: panel,ics,iot,ptc,thingworx,discovery

http:
  - method: GET
    path:
      - "{{BaseURL}}"

    host-redirects: true
    max-redirects: 2

    matchers-condition: and
    matchers:
      - type: word
        part: body
        words:
          - '<title>Thingworx</title>'
          - '/Thingworx/Home'
          - 'thingworx.com'
        condition: or

      - type: status
        status:
          - 200
