id: metaflow-ui-panel

info:
  name: Metaflow UI 面板识别（指纹识别）
  author: rxerium
  severity: info
  description: |-
    检测到目标站点存在 Metaflow UI 相关响应特征。Metaflow UI 是机器学习工作流平台的 Web 界面，用于查看 Flow、运行记录、数据工件和任务状态。模板请求 `/`，并通过页面标题或正文关键字、状态码确认该系统指纹，用于资产识别、系统盘点和暴露面梳理。
  reference:
    - https://github.com/Netflix/metaflow-ui
    - https://metaflow.org
  metadata:
    verified: true
    max-request: 1
    vendor: Netflix
    product: Metaflow UI
    shodan-query: 'http.title:"Metaflow UI"'
  tags: panel,metaflow,netflix,mlops,ai,detect,discovery
http:
  - method: GET
    path:
      - "{{BaseURL}}"

    host-redirects: true
    max-redirects: 2

    matchers-condition: and
    matchers:
      - type: word
        part: body
        words:
          - "<title>Metaflow UI</title>"

      - type: word
        part: body
        words:
          - "webpackJsonpmetaflow-ui"
          - "metaflow-ui"
        condition: or

      - type: status
        status:
          - 200
