id: morningstar-prostar-mppt-detect

info:
  name: Morningstar ProStar MPPT Solar Charge Controller 识别（指纹识别）
  author: rxerium
  severity: info
  description: |
    该模板用于识别 Morningstar ProStar MPPT Solar Charge Controller 是否存在对外暴露的管理、服务或状态界面。若命中，说明目标公开了相关功能入口，可作为资产盘点与攻击面收敛的依据。
  reference:
    - https://www.morningstarcorp.com/products/prostar-mppt/
  metadata:
    max-request: 1
    verified: true
    shodan-query: http.title:"Prostar MPPT - Live Data"
    vendor: morningstar
    product: prostar-mppt
  tags: tech,panel,morningstar,ics,solar,energy,scada,detect

http:
  - method: GET
    path:
      - "{{BaseURL}}"

    host-redirects: true
    max-redirects: 2

    matchers-condition: and
    matchers:
      - type: word
        part: body
        words:
          - '<title>Prostar MPPT - Live Data</title>'
          - 'ProstarMPPTLive'
          - 'morningstarcorp.com'
        condition: or

      - type: status
        status:
          - 200
