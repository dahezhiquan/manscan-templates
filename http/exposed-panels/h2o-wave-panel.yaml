id: h2o-wave-panel

info:
  name: H2O Wave ML Application Server 识别（指纹识别）
  author: rxerium
  severity: info
  description: |-
    检测到目标站点存在 H2O Wave ML Application Server 相关响应特征。H2O Wave ML Application Server 是 AI、LLM 或机器学习相关平台，用于管理模型、数据集、工作区、推理服务或生成任务。模板请求 `/`，并通过页面标题或正文关键字、状态码确认该系统指纹，用于资产识别、系统盘点和暴露面梳理。
  reference:
    - https://github.com/h2oai/wave
    - https://wave.h2o.ai/
  metadata:
    verified: true
    max-request: 1
    vendor: h2oai
    product: wave
    shodan-query: 'http.title:"H2O Wave"'
  tags: panel,h2o-wave,h2o,ml,ai,detect,discovery
http:
  - method: GET
    path:
      - "{{BaseURL}}"

    host-redirects: true
    max-redirects: 2

    matchers-condition: and
    matchers:
      - type: word
        part: body
        words:
          - "h2o-wave"
          - "H2O Wave"
        condition: or

      - type: status
        status:
          - 200
