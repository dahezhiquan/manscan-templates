id: ftp-directory-permission-check

info:
  name: FTP 目录权限配置不当（本地基线扫描）
  author: nukunga[SungHyunJeon]
  severity: medium
  description: |
    过宽权限可能导致任意用户读取或写入文件。对应基线项为“FTP 主目录是否向 Everyone 组授予访问权限”；模板执行本地检查命令并以 `FTP_HOME_DIRECTORY_EVERYONE_FOUND` 等输出作为命中依据。
  impact: |
    - 攻击者可上传 WebShell、篡改文件或窃取 FTP 目录中的数据。
    - 远程入口暴露或协议保护不足会增加暴力破解、中间人攻击和远程控制风险。
  remediation: |
    - 移除 Everyone 权限，仅授予必要用户或组最小访问权限。
    - 限制访问来源，优先使用加密和强认证，并关闭无业务需求的远程服务。
  reference:
    - https://isms.kisa.or.kr/main/csap/notice/?boardId=bbs_0000000000000004&mode=view&cntId=85
  tags: ftp,iis,security,windows,code,windows-audit,kisa

self-contained: true

code:
  - pre-condition: |
      IsWindows();
    engine:
      - powershell
      - powershell.exe
    args:
      - -ExecutionPolicy
      - Bypass
    pattern: "*.ps1"
    source: |
      # Define the FTP home directory path (adjust if necessary)
      $ftpHome = "C:\inetpub\ftproot"
      if (!(Test-Path $ftpHome)) {
          "FTP_HOME_DIRECTORY_NOT_FOUND"
          exit
      }
      # Retrieve the ACL for the FTP home directory
      $acl = Get-Acl $ftpHome
      $vulnerable = $false
      foreach ($ace in $acl.Access) {
          if ($ace.IdentityReference.ToString() -like "*Everyone*") {
              $vulnerable = $true
              break
          }
      }
      if ($vulnerable) {
          "FTP_HOME_DIRECTORY_EVERYONE_FOUND"
      } else {
          "FTP_HOME_DIRECTORY_NO_EVERYONE"
      }

    matchers:
      - type: word
        words:
          - "FTP_HOME_DIRECTORY_EVERYONE_FOUND"
