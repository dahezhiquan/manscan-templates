id: outsystems-servicecenter-panel

info:
  name: OutSystems Service Center 登录面板识别（指纹识别）
  author: righettod
  severity: info
  description: |-
    OutSystems Service Center 是 OutSystems 低代码平台的运维控制台，用于应用部署、运行监控和环境管理。该模板请求 `/Login.aspx`、`/ServiceCenter/Login.aspx` 路径，并依据页面标题、正文关键字或品牌资源特征、DSL 条件识别目标是否部署了该系统或暴露了对应入口，适用于资产指纹确认；命中结果仅表示系统特征匹配，不代表已确认存在未授权访问或可利用漏洞。
  reference:
  - https://www.outsystems.com/
  classification:
    cpe: cpe:2.3:a:outsystems:platform_server:*:*:*:*:*:*:*:*
  metadata:
    verified: true
    max-request: 2
    vendor: outsystems
    product: platform_server
    shodan-query: http.html:"outsystems"
  tags: panel,outsystems,login,detect,discovery

http:
  - method: GET
    path:
      - "{{BaseURL}}/Login.aspx"
      - "{{BaseURL}}/ServiceCenter/Login.aspx"

    host-redirects: true
    max-redirects: 2

    stop-at-first-match: true

    matchers:
      - type: dsl
        dsl:
          - 'status_code == 200'
          - 'contains(body, "Enter your OutSystems credentials")'
        condition: and

      - type: word
        part: set_cookie
        words:
          - "osVisitor="
          - "osVisit="
        condition: or

    extractors:
      - type: regex
        part: body
        group: 1
        regex:
          - 'environmentName:.?([a-z0-9A-Z\s]+).?'
