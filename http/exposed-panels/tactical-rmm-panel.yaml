id: tactical-rmm-panel

info:
  name: Tactical RMM 登录面板识别（暴露面识别）
  author: johnk3r
  severity: info
  description: 该模板通过识别 Tactical RMM 登录入口的页面标题、特征文本或重定向行为，判断目标是否暴露了对应的认证界面。若命中，说明该登录面板对外可访问，可用于暴露面梳理与后续安全评估。
  classification:
    cwe-id: CWE-200
  metadata:
    verified: true
    max-request: 1
    shodan-query: http.title:"Tactical RMM - Login"
  tags: panel,tacticalrmm,login,detect,discovery

http:
  - method: GET
    path:
      - "{{BaseURL}}"

    matchers-condition: and
    matchers:
      - type: word
        part: body
        words:
          - "<title>Tactical RMM - Login"

      - type: status
        status:
          - 200
