id: mcloud-installer

info:
  name: mCloud 面板 安装向导
  author: ritikchaddha
  severity: critical
  description: |
    检测到 mCloud 面板 安装向导。该页面属于安装、初始化或配置向导流程，若对外暴露，攻击者可能完成初始化、创建管理员账户或重新配置目标系统。
  reference:
    - https://mcloudcorp.com/
  classification:
    cvss-metrics: CVSS:3.1/AV:N/AC:L/PR:N/UI:N/S:U/C:L/I:H/A:H
    cvss-score: 9.4
    cwe-id: CWE-284
  metadata:
    verified: true
    max-request: 1
    shodan-query: http.title:"mcloud-installer-web"
  tags: panel,mcloud,exposure,misconfig,vuln

http:
  - method: GET
    path:
      - '{{BaseURL}}/clusterList'

    matchers-condition: and
    matchers:
      - type: word
        part: body
        words:
          - '<title>mcloud-installer-web'

      - type: status
        status:
          - 200
