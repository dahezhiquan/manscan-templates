id: mappproxy-detect

info:
  name: Mapproxy 指纹识别（指纹识别）
  author: philippedelteil
  severity: info
  description: |
    用于识别目标是否部署 Mapproxy 并提取相关版本或构建信息，模板会结合 HTTP 响应头、页面正文、特定路径或已知端点和版本或标识提取结果进行指纹匹配。
  reference:
    - https://github.com/mapproxy/mapproxy
    - https://mapproxy.org
  metadata:
    max-request: 2
    shodan-query: http.html:"Welcome to MapProxy"
  tags: tech,mapproxy,detect,discovery

http:
  - method: GET
    path:
      - "{{BaseURL}}"
      - "{{BaseURL}}/demo"

    host-redirects: true
    max-redirects: 2

    matchers-condition: and
    matchers:
      - type: word
        part: body
        words:
          - "Welcome to MapProxy"
          - "MapProxy Demo"
        condition: or

      - type: word
        part: header
        words:
          - "text/html"

    extractors:
      - type: regex
        part: body
        group: 1
        regex:
          - MapProxy(?i) ([0-9]+\.[0-9]+\.[0-9]+)
