id: ghost-panel

info:
  name: Ghost 面板识别（指纹识别）
  author: userdehghani
  severity: info
  description: |-
    检测到目标站点存在 Ghost 相关响应特征。Ghost 是内容管理或知识协作系统，用于维护站点内容、文档、素材、权限和发布流程。模板请求 `/ghost/#/signin`，并通过页面标题或正文关键字确认该系统指纹，用于资产识别、系统盘点和暴露面梳理。
  reference:
    - https://ghost.org/
  classification:
    cpe: cpe:2.3:a:ghost:ghost:*:*:*:*:*:*:*:*
  metadata:
    verified: true
    max-request: 1
    vendor: ghost
    product: ghost
    fofa-query: app="Ghost"
  tags: panel,ghost,login,detect,discovery
http:
  - method: GET
    path:
      - "{{BaseURL}}/ghost/#/signin"

    matchers-condition: or
    matchers:
      - type: word
        part: body
        words:
          - '<title>Ghost Admin'
          - 'content="Ghost"'
        condition: or
        case-insensitive: true
