id: azure-functionapp-appinsights-missing
info:
  name: Azure Functions 未配置 Application Insights 监控（云安全）
  author: princechaddha
  severity: high
  description: Application Insights 可为 Azure Functions 收集请求、依赖、异常、日志和性能指标，为故障排查、异常发现和安全审计提供运行时可见性。本模板读取函数应用设置，并在未发现 APPINSIGHTS_INSTRUMENTATIONKEY 时报告未配置监控集成。
  impact: |
    - 缺少运行时遥测会形成监控盲区，攻击者调用、异常错误、敏感操作和性能退化可能无法及时发现。
    - 发生入侵或业务故障后，缺少请求链路和异常记录会增加取证、定位和恢复成本。
  remediation: |
    - 为函数应用创建或关联 Application Insights，并按当前运行时支持的方式配置连接字符串或检测密钥。
    - 配置合理的日志保留、访问控制和告警规则，同时确认采集内容不包含不必要的密钥或个人敏感信息。
  reference:
    - https://docs.microsoft.com/en-us/azure/azure-monitor/app/app-insights-overview
  metadata:
    vendor: microsoft
    product: azure-monitor
  tags: cloud,devops,azure,microsoft,application-insights,azure-cloud-config

flow: |
  code(1);
  for (let AppData of iterate(template.functionApps)) {
    AppData = JSON.parse(AppData);
    set("name", AppData.name);
    set("resourceGroup", AppData.resourceGroup);
    code(2);
  }

self-contained: true
code:
  - engine:
      - sh
      - bash
    source: |
      az functionapp list --query '[*].{name:name, resourceGroup:resourceGroup}' --output json

    extractors:
      - type: json
        name: functionApps
        internal: true
        json:
          - '.[]'

  - engine:
      - sh
      - bash
    source: |
      az functionapp config appsettings list --name $name --resource-group $resourceGroup --query '[*].name' --output json

    matchers-condition: and
    matchers:
      - type: word
        words:
          - "APPINSIGHTS_INSTRUMENTATIONKEY"
        negative: true

      - type: word
        part: body
        words:
          - "["

    extractors:
      - type: dsl
        dsl:
          - 'name + " does not have Application Insights integration enabled"'
