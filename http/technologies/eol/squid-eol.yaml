id: squid-eol

info:
  name: Squid End-of-Life 指纹识别（指纹识别）
  author: Shivam Kamboj
  severity: info
  description: |
    用于识别目标是否部署 Squid End-of-Life 并提取相关版本或构建信息，模板会结合 HTTP 响应头、特定路径或已知端点和版本或标识提取结果进行指纹匹配。
  reference:
    - https://endoflife.date/squid
    - https://www.squid-cache.org/Versions/
  metadata:
    verified: true
    max-request: 1
    shodan-query: "Server: squid/"
  tags: tech,squid,eol

http:
  - method: GET
    path:
      - "{{BaseURL}}"

    extractors:
      - type: regex
        name: version
        part: header
        group: 1
        regex:
          - '(?i)Server:\s*squid/([0-9.]+)'

    matchers:
      - type: dsl
        dsl:
          - compare_versions(version, '<=6.14')
          - contains(tolower(header), 'squid')
        condition: and
