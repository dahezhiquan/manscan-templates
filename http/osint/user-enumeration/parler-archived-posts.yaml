id: parler-archived-posts

info:
  name: Parler Archived Posts 用户名信息枚举（OSINT）
  author: dwisiswant0
  severity: info
  description: |
    Parler Archived Posts 是面向历史页面、归档资料或已保存公开内容的检索服务，相关页面通常用于确认账号资料、历史发布内容或归档记录是否存在。该模板用于在公开互联网侧枚举 Parler Archived Posts 用户名，不需要认证；模板请求公开路径 http://archive.org/wayback/available?url=https://parler.com/profile/用户名/posts，并结合响应状态为 200、页面或响应内容命中 “"archived_snapshots": {"closest"” 等资料页特征判断目标用户名是否存在。该检查属于 OSINT 用户枚举，结果仅表示公开资料页或公开搜索结果可被访问，不代表目标平台存在可直接修复的漏洞。
  classification:
    cvss-metrics: CVSS:3.1/AV:N/AC:L/PR:N/UI:N/S:U/C:N/I:N/A:N
    cvss-score: 0
    cwe-id: CWE-200
  metadata:
    max-request: 1
  tags: osint,osint-archived,parler-archived-posts,discovery

self-contained: true

http:
  - method: GET
    path:
      - "http://archive.org/wayback/available?url=https://parler.com/profile/{{user}}/posts"

    matchers-condition: and
    matchers:
      - type: status
        status:
          - 200

      - type: word
        part: body
        words:
          - "\"archived_snapshots\": {\"closest\""
