id: squid-analysis-report-generator

info:
  name: Squid Analysis Report Generator 暴露（暴露面识别）
  author: geeknik
  severity: high
  description: |
    检测到目标站点可直接访问 Squid Analysis Report Generator。日志、异常页面或调试输出通常记录请求上下文、堆栈信息、内部路径、组件版本、账号标识或业务数据。该模板请求 模板中定义的接口或文件路径，并结合 HTTP 状态码、日志关键字、错误堆栈、响应头或页面特征确认日志/调试信息可被访问。此类信息公开后会帮助攻击者了解应用运行状态、内部结构和错误上下文，增加后续利用成功率。
  impact: |-
    - 日志、异常或调试页面可能泄露内部路径、堆栈信息、SQL 语句、请求参数、账号标识、令牌片段和组件版本。
    - 攻击者可利用这些信息筛选匹配漏洞、定位敏感文件、复现业务流程或构造更精确的后续攻击。
    - 若日志中包含真实凭据、会话标识、个人信息或业务数据，可能直接造成数据泄露和合规风险。
  remediation: |-
    - 关闭生产环境中可公开访问的日志、异常、调试、状态或报告页面，并将日志目录移出 Web 根目录。
    - 在 Web 服务器、反向代理、CDN 和对象存储层阻断常见日志文件、调试路径和错误报告的公网访问。
    - 检查日志内容是否包含凭据、会话、个人信息、SQL 或业务数据；如有泄露，应执行密钥轮换、账号处置和数据影响评估。
    - 清理公开缓存、历史发布包和搜索引擎收录，并为日志访问启用鉴权、内网限制和审计。
  reference:
    - https://sourceforge.net/projects/sarg/
  metadata:
    max-request: 1
  tags: sarg,exposure,logs,vuln

http:
  - method: GET
    path:
      - "{{BaseURL}}"

    matchers-condition: and
    matchers:
      - type: word
        part: body
        words:
          - "Squid User Access Report"
          - "Squid User's Access Report"
        condition: or

      - type: word
        part: body
        words:
          - "<td>Daily reports"
          - "FILE/PERIOD"
        condition: or

    extractors:
      - type: regex
        part: body
        regex:
          - sarg-[0-99].[0-99].[0-99]
