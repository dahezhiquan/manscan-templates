id: file-mongodb-auth-disabled

info:
  name: MongoDB 身份认证未启用（本地文件安全扫描）
  author: pussycat0x
  severity: high
  description: |
    该模板检测 mongod.conf 中 MongoDB 身份认证是否缺失或关闭。若 security.authorization 未启用，数据库访问可能不需要认证。
  reference:
    - https://wiki.devsecopsguides.com/docs/checklists/mongodb/
    - https://wiki.devsecopsguides.com/docs/checklists/mongodb/
  metadata:
    verified: true
  tags: file,mongodb,audit,hardening

file:
  - extensions:
      - conf

    matchers-condition: and
    matchers:
      - type: word
        words:
          - "storage"
          - "operationProfiling"
          - "#security"
        condition: and

      - type: word
        words:
          - "authorization: enabled"
        negative: true
