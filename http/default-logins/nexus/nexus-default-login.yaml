id: nexus-default-login

info:
  name: Nexus 默认口令登录（弱口令）
  author: pikpikcu
  severity: high
  description: |
    该模板用于检测 Nexus 是否仍可使用默认凭据或弱口令登录。模板主要向 `/service/rapture/session` 等认证入口发送请求，使用内置默认凭据组合进行认证尝试，并根据响应中的 `Server: Nexus`、`NXSESSIONID` 等登录成功特征判断登录是否成功；命中说明目标未及时修改出厂、示例或初始化账号口令。
  impact: |
    - 攻击者可登录 Nexus 管理接口，读取、导出或篡改数据、索引、队列、仓库、报表或媒体资源。
    - 若系统保存连接串、访问令牌或集成凭据，弱口令登录可能进一步造成业务数据泄露、权限扩大或服务中断。
  remediation: |
    - 立即修改默认账号口令，删除测试账号，并为管理员、服务账号和集成账号使用唯一强密码。
    - 启用细粒度权限控制、访问来源限制和审计日志，避免管理 API 或控制台直接对公网开放。
    - 检查数据导出、配置变更、令牌使用和异常查询记录，必要时轮换相关凭据。
  classification:
    cvss-metrics: CVSS:3.0/AV:N/AC:L/PR:N/UI:N/S:C/C:L/I:L/A:L
    cvss-score: 8.3
    cwe-id: CWE-522
  metadata:
    max-request: 1
  tags: nexus,default-login,vuln

http:
  - raw:
      - |
        POST /service/rapture/session HTTP/1.1
        Host: {{Hostname}}
        X-Nexus-UI: true
        Content-Type: application/x-www-form-urlencoded; charset=UTF-8

        username={{base64(username)}}&password={{base64(password)}}

    payloads:
      username:
        - admin
      password:
        - admin123
    attack: pitchfork

    matchers-condition: and
    matchers:
      - type: status
        status:
          - 204

      - type: word
        words:
          - "Server: Nexus"
          - "NXSESSIONID"
        part: header
        condition: and
