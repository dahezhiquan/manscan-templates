id: payara-micro-detect

info:
  name: Payara Micro 指纹识别（指纹识别）
  author: pikpikcu
  severity: info
  description: >-
    Payara Micro 是轻量级 Jakarta EE 应用运行时，用于以单个可执行包运行 Java 微服务。该模板通过请求目标服务并检查预设路径或首页响应、页面正文关键字、状态码等指纹特征，判断目标是否使用或暴露了
    Payara Micro 相关组件；命中结果仅表示指纹特征匹配，可用于资产盘点、技术栈识别和后续安全评估，不代表已确认存在可利用漏洞。
  classification:
    cpe: cpe:2.3:a:payara:payara:*:*:*:*:*:*:*:*
  metadata:
    verified: true
    max-request: 1
    vendor: payara
    product: payara
    shodan-query: 'title:"Payara Micro #badassfish - Error report"'
  tags: tech,payara,discovery
http:
  - method: GET
    path:
      - "{{BaseURL}}"

    matchers-condition: and
    matchers:
      - type: word
        part: body
        words:
          - "Payara Micro #badassfish - Error report"

      - type: status
        status:
          - 404
