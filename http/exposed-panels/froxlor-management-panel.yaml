id: froxlor-management-panel

info:
  name: Froxlor Server Management 登录面板识别（暴露面识别）
  author: DhiyaneshDK
  severity: info
  description: 该模板通过识别 Froxlor Server Management 登录入口的页面标题、特征文本或重定向行为，判断目标是否暴露了对应的认证界面。若命中，说明该登录面板对外可访问，可用于暴露面梳理与后续安全评估。
  classification:
    cvss-metrics: CVSS:3.0/AV:N/AC:L/PR:N/UI:N/S:U/C:N/I:N/A:N
    cwe-id: CWE-200
    cpe: cpe:2.3:a:froxlor:froxlor:*:*:*:*:gentoo:*:*:*
  metadata:
    verified: true
    max-request: 1
    vendor: froxlor
    product: froxlor
    shodan-query:
      - title:"Froxlor Server Management Panel"
      - http.title:"froxlor server management panel"
    fofa-query: title="froxlor server management panel"
    google-query: intitle:"froxlor server management panel"
  tags: panel,froxlor,discovery

http:
  - method: GET
    path:
      - "{{BaseURL}}"

    matchers-condition: and
    matchers:
      - type: word
        words:
          - "<title>Froxlor Server Management Panel</title>"

      - type: word
        part: header
        words:
          - "text/html"

      - type: status
        status:
          - 200
