id: compreface-panel

info:
  name: CompreFace 面板检测（指纹识别）
  author: rxerium
  severity: info
  description: |-
    检测到 CompreFace，这是 Exadel 开发的开源人脸识别平台，通过 Web UI 和 REST API 提供人脸检测、识别与验证服务。其暴露的登录/管理面板实例存在，该面板默认无需认证即可访问初始界面。
  reference:
    - https://github.com/exadel-inc/CompreFace
    - https://exadel.com/compreface/
  metadata:
    verified: true
    max-request: 1
    vendor: exadel
    product: compreface
    shodan-query: 'http.title:"CompreFace"'
  tags: panel,compreface,ai,computer-vision,face-recognition,detect,discovery

http:
  - method: GET
    path:
      - "{{BaseURL}}"

    host-redirects: true
    max-redirects: 2

    matchers-condition: and
    matchers:
      - type: word
        part: body
        words:
          - "<title>CompreFace</title>"

      - type: status
        status:
          - 200
