id: wildfly-default-login

info:
  name: Wildfly 默认管理员登录（弱口令）
  author: s0obi
  severity: high
  description: |
    该模板通过尝试 Wildfly 的默认管理员账号口令，并依据认证成功后的响应特征判断目标是否仍在使用未修改的弱口令。若命中，攻击者通常可直接获得后台管理权限，进一步访问敏感信息、修改配置或执行未授权操作。
  reference:
    - https://docs.wildfly.org/26.1/#administrator-guides
  metadata:
    max-request: 1
  tags: wildfly,default-login,vuln

http:
  - raw:
      - |
        GET /management HTTP/1.1
        Host: {{Hostname}}

    digest-username: admin
    digest-password: admin

    matchers-condition: and
    matchers:
      - type: word
        part: body
        words:
          - "management-major-version"
          - "product-version"
        condition: and

      - type: word
        part: header
        words:
          - "application/json"

      - type: status
        status:
          - 200
