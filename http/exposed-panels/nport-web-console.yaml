id: nport-web-console

info:
  name: NPort Web Console 登录面板识别（暴露面识别）
  author: prajiteshsingh
  severity: info
  description: 该模板通过识别 NPort Web Console 登录入口的页面标题、特征文本或重定向行为，判断目标是否暴露了对应的认证界面。若命中，说明该登录面板对外可访问，可用于暴露面梳理与后续安全评估。
  reference:
    - https://www.moxa.com/en/
  classification:
    cvss-metrics: CVSS:3.0/AV:N/AC:L/PR:N/UI:N/S:U/C:N/I:N/A:N
    cwe-id: CWE-200
    cpe: cpe:2.3:o:moxa:nport_6450-t_firmware:*:*:*:*:*:*:*:*
  metadata:
    verified: true
    max-request: 1
    shodan-query: title:"NPort Web Console"
    product: nport_6450-t_firmware
    vendor: moxa
  tags: panel,nport,discovery

http:
  - method: GET
    path:
      - "{{BaseURL}}"

    matchers-condition: and
    matchers:
      - type: word
        part: body
        words:
          - "NPort Web Console"

      - type: status
        status:
          - 200
