id: unencrypted-aws-ami
info:
  name: EC2 AMI 使用未加密 EBS 快照（云安全）
  author: princechaddha
  severity: high
  description: EC2 AMI 使用未加密 EBS 快照是一类镜像静态数据保护不足风险，基于该 AMI 启动的实例可能继承未加密存储。AMI 中的 EBS 快照可能包含系统文件、应用配置或业务数据，未加密会降低数据边界和密钥治理能力。模板枚举自有 AMI 后读取 `BlockDeviceMappings[*].Ebs.Encrypted[]`，当值为 `false` 时判定 AMI 存在未加密快照。
  impact: |
    - 镜像快照缺少 KMS 加密保护，复制、共享或恢复时更难满足数据保护要求。
    - 基于未加密 AMI 批量创建实例会把未加密存储风险扩散到更多工作负载。
  remediation: |
    - 使用加密快照重新创建 AMI，并确保后续实例启动卷默认加密。
    - 对镜像构建流水线启用加密检查，阻止未加密 EBS 快照进入共享或发布流程。
  reference:
    - https://docs.aws.amazon.com/AWSEC2/latest/UserGuide/AMIEncryption.html
  metadata:
    max-request: 2
    vendor: amazon
    product: ec2
  tags: cloud,devops,aws,amazon,ec2,aws-cloud-config
variables:
  region: "us-east-1"

flow: |
  code(1)
  for(let AmiName of iterate(template.amis)){
    set("ami", AmiName)
    code(2)
  }

self-contained: true
code:
  - engine:
      - sh
      - bash
    source: |
      aws ec2 describe-images --region $region --owners self --output json --query 'Images[*].ImageId'

    extractors:
      - type: json
        name: amis
        internal: true
        json:
          - '.[]'

  - engine:
      - sh
      - bash
    source: |
         aws ec2 describe-images --region $region --image-ids $ami --query 'Images[*].BlockDeviceMappings[*].Ebs.Encrypted[]'

    matchers:
      - type: word
        words:
          - "false"

    extractors:
      - type: dsl
        dsl:
          - 'ami + " AMI is not encrypted"'
