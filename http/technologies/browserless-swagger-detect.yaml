id: browserless-swagger-detect

info:
  name: Browserless API Swagger 指纹识别（指纹识别）
  author: theamanrawat
  severity: info
  description: |-
    Browserless API Swagger 是 Browserless 浏览器自动化服务的 API 文档入口，用于无头浏览器任务和接口调用说明。该模板请求 `/docs/swagger-ui-init.js`、`/docs`，并依据 HTTP 200 状态码、页面标题、正文关键字或品牌资源特征识别目标是否使用或暴露了 Browserless API Swagger 相关组件，适用于资产盘点、技术栈识别和后续安全评估；命中结果仅表示指纹特征匹配，不代表已确认存在可利用漏洞。
  reference:
  - https://github.com/browserless/browserless
  - https://docs.browserless.io/
  metadata:
    verified: true
    max-request: 4
    shodan-query: "browserless"
  tags: tech,browserless,swagger,api

flow: http(1) && http(2)

http:
  - method: GET
    path:
      - "{{BaseURL}}/docs/swagger-ui-init.js"

    matchers-condition: and
    matchers:
      - type: word
        part: body
        words:
          - "browserless/chrome API"
          - "browserless Swagger documentation"
        condition: and
        internal: true

      - type: status
        status:
          - 200
        internal: true

  - method: GET
    path:
      - "{{BaseURL}}/docs"

    host-redirects: true
    max-redirects: 2
    matchers-condition: and
    matchers:
      - type: word
        part: body
        words:
          - "<title>Swagger UI"

      - type: status
        status:
          - 200
