id: oracle-tns-listener

info:
  name: Oracle TNS 监听器识别（指纹识别）
  author: pussycat0x
  severity: info
  description: |
    Oracle TNS Listener 是 Oracle Database 的网络监听组件，负责接收客户端连接并将其路由到对应数据库实例或服务。该模板调用 Oracle 协议探测 TCP 1521 端口，并从监听器响应中提取 `Oracle TNS Listener Version` 等版本字段，用于确认 TNS Listener 服务指纹和可见版本信息。
  reference:
    - https://www.tenable.com/plugins/nessus/110053
  metadata:
    verified: true
    max-request: 1
    shodan-query: product:"Oracle TNS Listener"
    vendor: oracle
    product: database_server
  tags: js,detect,oracle,tns,network,discovery

javascript:
  - pre-condition: |
      isPortOpen(Host,Port);
    code: |
      var m = require("nuclei/oracle");
      var response = m.IsOracle(Host, Port);
      Export(response);
    args:
      Host: "{{Host}}"
      Port: "1521"

    extractors:
      - type: regex
        name: Version
        regex:
          - 'Oracle TNS Listener Version:([0-9.]+)'
