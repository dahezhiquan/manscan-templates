id: defaced-website-detect

info:
  name: 网站被篡改检测
  author: ggranjus
  severity: high
  description: |
    检测目标网站是否出现被篡改后的页面特征。命中通常表示页面标题或内容包含黑客署名、篡改标识或异常展示内容。
  impact: |
    - 网站篡改会破坏品牌可信度，可能向访问者展示恶意内容、政治口号或钓鱼链接。
    - 命中通常提示服务器、CMS、账号或发布链路可能已被攻击者控制。
  remediation: |
    - 立即隔离受影响站点并恢复可信备份，保留日志用于溯源。
    - 排查 WebShell、弱口令、插件漏洞和部署凭据泄露问题。
    - 修复入侵入口后再恢复上线，并轮换后台、主机和数据库凭据。
  metadata:
    verified: 'true'
    max-request: 1
    shodan-query: http.title:"Hacked By"
  tags: miscellaneous,defacement,misc,vuln

http:
  - method: GET
    path:
      - "{{BaseURL}}"

    matchers:
      - type: regex
        part: body
        regex:
          - '(?i)<title>.*Hacked( By .+)?<\/title>'

    extractors:
      - type: xpath
        xpath:
          - '/html/head/title'
