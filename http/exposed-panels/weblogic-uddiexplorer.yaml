id: weblogic-uddiexplorer

info:
  name: Oracle WebLogic UDDI Explorer 面板识别（暴露面识别）
  author: pdteam
  severity: info
  description: |
    该模板通过识别 Oracle WebLogic UDDI Explorer 面板、控制台或管理界面的页面特征，判断目标是否暴露了对应服务入口。若命中，说明该后台或运维界面对外可访问，可用于资产识别与暴露面排查。
  reference:
    - https://www.tenable.com/plugins/was/112421
  classification:
    cvss-metrics: CVSS:3.0/AV:N/AC:L/PR:N/UI:N/S:U/C:N/I:N/A:N
    cwe-id: CWE-200
    cpe: cpe:2.3:a:oracle:weblogic_server:*:*:*:*:-:*:*:*
  metadata:
    max-request: 1
    vendor: oracle
    product: weblogic_server
    shodan-query:
      - product:"oracle weblogic"
      - http.title:"oracle peoplesoft sign-in"
    fofa-query: title="oracle peoplesoft sign-in"
    google-query: intitle:"oracle peoplesoft sign-in"
  tags: panel,oracle,weblogic,tenable,discovery

http:
  - method: GET
    path:
      - "{{BaseURL}}/uddiexplorer/"

    matchers-condition: and
    matchers:
      - type: word
        part: body
        words:
          - 'WebLogic UDDI Explorer'

      - type: status
        status:
          - 200
