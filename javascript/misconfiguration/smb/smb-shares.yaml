id: smb-shares

info:
  name: SMB 共享枚举（服务漏洞）
  author: pussycat0x
  severity: low
  description: |
    该模板尝试枚举 SMB 共享列表及其基础属性，用于识别暴露目录与访问边界。
  reference:
    - https://nmap.org/nsedoc/scripts/smb-enum-shares.html
  metadata:
    verified: true
    max-request: 1
    shodan-query: port:445
    product: dionaea
    vendor: dionaea
  tags: js,network,smb,enum,auth,vuln

javascript:
  - pre-condition: |
      isPortOpen(Host,Port);
    code: |
      var m = require("nuclei/smb");
      var c = m.SMBClient();
      var response = c.ListShares(Host, Port, User, Pass);
      Export(response);

    args:
      Host: "{{Host}}"
      Port: "445"
      User: "{{usernames}}"
      Pass: "{{passwords}}"
    attack: clusterbomb
    payloads:
      usernames:
        - ' '
        - 'admin'
        - 'administrator'
        - 'guest'
      passwords:
        - ' '
        - 'admin'
        - 'password'
        - 'guest'

    stop-at-first-match: true
    matchers:
      - type: dsl
        dsl:
          - 'response != "[]"'
          - 'success == true'
        condition: and

    extractors:
      - type: dsl
        dsl:
          - response
