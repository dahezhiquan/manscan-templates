id: metatag-cms

info:
  name: Metatag CMS 指纹识别（指纹识别）
  author: dadevel
  severity: info
  description: 用于识别目标是否部署 Metatag CMS 并提取相关版本或构建信息，模板会结合 HTTP 响应头、页面正文、特定路径或已知端点和版本或标识提取结果进行指纹匹配。
  reference:
    - https://www.w3schools.com/tags/att_meta_name.asp
  metadata:
    max-request: 1
  tags: tech,cms,discovery

http:
  - method: GET
    path:
      - "{{BaseURL}}"

    host-redirects: true
    max-redirects: 2

    matchers-condition: and
    matchers:
      - type: word
        part: header
        words:
          - 'text/html'

      - type: regex
        part: body
        regex:
          - '(?i)<meta\s+?name="?generator"?\s+?content="[^"]+?"'

    extractors:
      - type: regex
        part: body
        group: 1
        regex:
          - '(?i)<meta\s+?name="?generator"?\s+?content="([^"]+?)"'
