id: azure-iam-role-resource-lock-unassigned
info:
  name: Azure IAM 角色缺少资源锁管理权限（云安全）
  author: princechaddha
  severity: medium
  description: Azure 资源锁用于防止关键资源被误删或误改；承担资源保护职责的自定义 IAM 角色若未包含 Microsoft.Authorization/locks 的读写删除权限，且该角色已被分配给主体，可能无法管理资源锁。该模板枚举自定义角色，检查锁权限是否缺失，并确认角色存在实际分配。
  impact: |
    - 负责资源治理的身份可能无法创建、查看或移除资源锁，影响关键资源防误删能力。
    - 资源锁职责与角色权限不匹配会造成运维流程失败，或使生产资源长期缺少删除保护。
  remediation: |
    - 为承担资源锁管理职责的自定义角色显式添加 locks/read、locks/write 和 locks/delete 等必要操作。
    - 复核已分配自定义角色的职责边界，避免权限缺失或过度授权，并对关键资源启用适当锁定策略。
  reference:
    - https://docs.microsoft.com/en-us/azure/role-based-access-control/custom-roles
  metadata:
    vendor: microsoft
    product: azure-rbac
  tags: cloud,devops,azure,microsoft,resource-lock,azure-cloud-config

flow: |
  code(1);
  for (let roleName of iterate(template.roleNameList)) {
    set("roleName", roleName);
    code(2) && code(3)
  }

self-contained: true
code:
  - engine:
      - sh
      - bash
    source: |
      az role definition list --custom-role-only true --query '[].{roleName:roleName}' --output json

    extractors:
      - type: json
        name: roleNameList
        internal: true
        json:
          - '.[].roleName'

  - engine:
      - sh
      - bash
    source: |
      az role definition list --name "$roleName" --query '[*].permissions[].actions[]' --output json

    matchers-condition: and
    matchers:
      - type: word
        words:
          - "Microsoft.Authorization/locks/read"
          - "Microsoft.Authorization/locks/write"
          - "Microsoft.Authorization/locks/delete"
        condition: and
        negative: true

  - engine:
      - sh
      - bash
    source: |
      az role assignment list --role "$roleName" --query '[*].principalName' --output json

    matchers-condition: and
    matchers:
      - type: word
        words:
          - "[]"
        negative: true

    extractors:
      - type: dsl
        dsl:
          - '"Role " + roleName + " is not assigned to any identity. Role unutilized for resource lock management."'
