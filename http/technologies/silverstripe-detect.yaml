id: silverstripe-detect

info:
  name: Silverstripe CMS 指纹识别（指纹识别）
  author: Chirag Mistry
  severity: info
  description: >-
    Silverstripe CMS 是 PHP 内容管理系统和 Web 框架，用于构建可定制的企业网站。该模板通过请求目标服务并检查预设路径或首页响应、页面正文关键字、状态码、正则特征等指纹特征，判断目标是否使用或暴露了
    Silverstripe CMS 相关组件；命中结果仅表示指纹特征匹配，可用于资产盘点、技术栈识别和后续安全评估，不代表已确认存在可利用漏洞。
  metadata:
    max-request: 9
    shodan-query: http.component:"SilverStripe"
  tags: silverstripe,detect,tech
http:
  - method: GET
    path:
      - "{{BaseURL}}"
      - "{{BaseURL}}/robots.txt"
      - "{{BaseURL}}/sitemap.xml"
      - "{{BaseURL}}/favicon.ico"
      - "{{BaseURL}}/index.php"
      - "{{BaseURL}}/assets/"
      - "{{BaseURL}}/cms/"
      - "{{BaseURL}}/admin/"
      - "{{BaseURL}}/themes/"

    stop-at-first-match: true
    matchers-condition: and
    matchers:
      - type: word
        part: response
        words:
          - "Powered by SilverStripe"
          - "X-Powered-By-SilverStripe"
        condition: or
        case-insensitive: true

      - type: status
        status:
          - 200
          - 403

    extractors:
      - type: regex
        part: body
        name: version
        regex:
          - 'SilverStripe ([0-9.]+)'
          - 'Powered by SilverStripe ([0-9.]+)'

      - type: regex
        part: body
        name: silverstripe_id
        regex:
          - 'silverstripe-site-id=([a-z0-9]+)'
          - 'silverstripe\.org/([^/]+)'
