id: gcloud-cdn-ssl-enforcement

info:
  name: Cloud CDN SSL/TLS 未Enforced（云安全）
  author: princechaddha
  severity: medium
  description: Cloud CDN 或外部负载均衡如果继续允许 80 端口明文访问，客户端到边缘节点之间的流量可能未被 TLS 保护。本模板枚举 URL map 和 forwarding rule，并在转发规则端口范围为 80-80 时报告未强制使用 SSL/TLS。
  impact: |
    - 用户请求、Cookie、令牌或业务数据可能通过明文 HTTP 传输，被中间人窃听或篡改。
    - 明文入口还可能破坏 HSTS、合规加密要求和统一的安全访问策略。
  remediation: |
    - 将 Cloud CDN 前端入口切换到 HTTPS，并对 HTTP 请求执行 301/308 跳转或关闭 80 端口转发规则。
    - 配置受信任证书、合适的 SSL policy 和 HSTS，持续检查新增转发规则是否允许明文访问。
  reference:
    - https://cloud.google.com/cdn/docs/using-https
  metadata:
    vendor: google
    product: cloud-cdn
  tags: cloud,devops,gcp,gcloud,cloud-cdn,gcp-cloud-config

flow: |
  code(1)
  for(let projectId of iterate(template.projectIds)){
    set("projectId", projectId)
    code(2)
    for(let urlMap of iterate(template.urlMaps)){
      set("urlMapName", urlMap.name)
      set("defaultService", urlMap.defaultService)
      code(3)
      for(let forwardingRule of iterate(template.forwardingRules)){
        set("forwardingRuleName", forwardingRule)
        code(4)
      }
    }
  }

self-contained: true

code:
  - engine:
      - sh
      - bash
    source: |
      gcloud projects list --format="json(projectId)"

    extractors:
      - type: json
        name: projectIds
        internal: true
        json:
          - '.[].projectId'

  - engine:
      - sh
      - bash
    source: |
      gcloud compute url-maps list --project $projectId --format="json(name,defaultService)"

    extractors:
      - type: json
        name: urlMaps
        internal: true
        json:
          - '.[]'

  - engine:
      - sh
      - bash
    source: |
      gcloud compute forwarding-rules list --project $projectId --format="json(name)"

    extractors:
      - type: json
        name: forwardingRules
        internal: true
        json:
          - '.[].name'

  - engine:
      - sh
      - bash
    source: |
      gcloud compute forwarding-rules describe $forwardingRuleName --project $projectId --global --format="value(portRange)"

    matchers:
      - type: word
        words:
          - '80-80'

    extractors:
      - type: dsl
        dsl:
          - '"SSL/TLS not enforced on Cloud CDN backend bucket origin: " + defaultService + " via URL map: " + urlMapName + " in Project: " + projectId'
