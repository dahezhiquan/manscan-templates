id: steve-default-login

info:
  name: SteVe Login Panel - Detect（弱口令）
  author: clem9669
  severity: high
  description: |
    该模板用于检测 SteVe Login Panel 是否仍可使用默认凭据或弱口令登录。模板主要向 `/steve/manager/signin` 等认证入口发送请求，使用内置默认凭据组合进行认证尝试，并根据响应中的 `<a>DATA MANAGEMENT`、`SIGN OUT</a>` 等登录成功特征判断登录是否成功；命中说明目标未及时修改出厂、示例或初始化账号口令。
  impact: |
    - 攻击者可进入 SteVe Login Panel 管理后台，修改任务、服务、插件、路由、作业调度或部署配置。
    - 在 DevOps、网关、监控或运维场景中，后台失陷可能影响生产任务执行、泄露密钥配置，并扩大到下游主机或业务系统。
  remediation: |
    - 立即修改默认管理员口令并清理示例账号，按角色最小化后台管理权限。
    - 将控制台和管理 API 放入受控网络或 VPN 后方，并开启多因素认证、登录失败限制和操作审计。
    - 复核近期任务、插件、连接配置、访问令牌和部署记录，轮换可能暴露的密钥。
  reference:
    - https://github.com/steve-community/steve
    - https://github.com/steve-community/steve/blob/e42ddcf1acf6c4ad2287bb466b2d3550663ce978/src/main/resources/config/test/main.properties
  classification:
    cvss-metrics: CVSS:3.0/AV:N/AC:L/PR:N/UI:N/S:U/C:N/I:N/A:N
    cvss-score: 0
    cwe-id: CWE-200
    cpe: cpe:2.3:a:steve-community:steve:*:*:*:*:*:*:*:*
  metadata:
    verified: true
    max-request: 2
    shodan-query: http.title:"SteVe - Steckdosenverwaltung"
    google-query: intitle:"SteVe - Steckdosenverwaltung"
    product: steve
    vendor: steve-community
  tags: panel,default-login,steve,vuln

http:
  - raw:
      - |
        GET /steve/manager/signin HTTP/1.1
        Host: {{Hostname}}
      - |
        POST /steve/manager/signin HTTP/1.1
        Host: {{Hostname}}
        Content-Type: application/x-www-form-urlencoded

        username={{username}}&password={{password}}&_csrf={{csrf}}

    attack: clusterbomb
    payloads:
      username:
        - admin
      password:
        - 1234
    redirects: true
    max-redirects: 2

    matchers-condition: and
    matchers:
      - type: word
        part: body_2
        words:
          - "<a>DATA MANAGEMENT"
          - "SIGN OUT</a>"
        condition: and

      - type: status
        status:
          - 200

    extractors:
      - type: regex
        part: body
        name: csrf
        group: 1
        regex:
          - '_csrf" value="(.*?)"/>'
        internal: true
