id: gcloud-cloud-asset-disabled

info:
  name: Cloud Asset Inventory未启用（云安全）
  author: princechaddha
  severity: high
  description: Cloud Asset Inventory 用于集中查询和审计 Google Cloud 资产、IAM 策略与资源变更；未启用会削弱资产可见性。本模板检查项目已启用服务列表，若未发现 cloudasset.googleapis.com 则报告 Cloud Asset Inventory API 未启用。
  impact: |
    - 安全团队难以及时盘点资源、权限和配置漂移，影响暴露面治理和事件响应。
    - 依赖资产清单的合规审计、变更追踪和风险关联分析可能出现盲区。
  remediation: |
    - 在需要统一资产清单和策略审计的项目中启用 Cloud Asset Inventory API。
    - 将资产导出、变更订阅或集中查询纳入云安全运营流程，并持续监控 API 启用状态。
  reference:
    - https://cloud.google.com/asset-inventory/docs
  metadata:
    vendor: google
    product: cloud-asset-inventory
  tags: cloud,devops,gcp,gcloud,cloud-asset,gcp-cloud-config

flow: |
  code(1)
  for(let projectId of iterate(template.projectIds)){
    set("projectId", projectId)
    code(2)
  }

self-contained: true

code:
  - engine:
      - sh
      - bash
    source: |
      gcloud projects list --format="json(projectId)"

    extractors:
      - type: json
        name: projectIds
        internal: true
        json:
          - '.[].projectId'

  - engine:
      - sh
      - bash
    source: |
      gcloud services list --project $projectId --enabled --filter="name:cloudasset.googleapis.com" --format="json"

    matchers:
      - type: word
        words:
          - '[]'

    extractors:
      - type: dsl
        dsl:
          - '"OS Config service is disabled for Project: " + projectId'
