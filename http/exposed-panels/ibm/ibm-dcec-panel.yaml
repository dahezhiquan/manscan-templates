id: ibm-dcec-panel

info:
  name: IBM Decision Center Enterprise Console 面板识别（暴露面识别）
  author: DhiyaneshDK
  severity: info
  description: |
    该模板通过识别 IBM Decision Center Enterprise Console 面板、控制台或管理界面的页面特征，判断目标是否暴露了对应服务入口。若命中，说明该后台或运维界面对外可访问，可用于资产识别与暴露面排查。
  reference:
    - https://www.ibm.com/docs/en/odm/8.5.1?topic=console-tutorial-getting-started-decision-center-enterprise
  metadata:
    verified: true
    max-request: 1
    shodan-query: html:"Decision Center Enterprise console"
  tags: panel,ibm,login,detect,decision-center,discovery

http:
  - method: GET
    path:
      - "{{BaseURL}}/teamserver/faces/login.jsp"

    matchers-condition: and
    matchers:
      - type: word
        part: body
        words:
          - "<title>Decision Center Enterprise console</title>"
          - "Sign in to Decision Center"
        condition: or

      - type: status
        status:
          - 200
