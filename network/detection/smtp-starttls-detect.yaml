id: smtp-starttls-detect

info:
  name: STARTTLS Mail 服务识别（指纹识别）
  author: dahezhiquan
  severity: info
  description: |
    SMTP STARTTLS 是明文 SMTP 连接上的加密升级能力。该模板先读取 25、2525、587/TCP 的 `220` 欢迎横幅，再发送带域名参数的 `EHLO`，仅在服务端的 `250` 扩展能力行中确认 STARTTLS；465/TCP 的隐式 TLS 不属于 STARTTLS。
  metadata:
    max-request: 1
  tags: mail,starttls,network,detect,smtp,tcp,discovery

tcp:
  - inputs:
      - data: ""
        name: greeting
        read: 2048
      - data: "EHLO manscan.invalid\r\n"
        name: ehlo
        read: 2048

    host:
      - "{{Hostname}}"
    port: 25,2525,587

    matchers-condition: and
    matchers:
      - type: regex
        part: greeting
        regex:
          - '(?m)^220[ -][^\r\n]{1,512}\r?$'

      - type: regex
        part: ehlo
        regex:
          - '(?mi)^250[- ]STARTTLS[ \t]*\r?$'

    extractors:
      - type: regex
        name: product_version_0
        part: raw
        group: 1
        regex:
          - (?mi)^220[^\r\n]*\bExim\s+V?([0-9]+(?:[.][0-9]+)+(?:[-+._][0-9A-Za-z]+)*)\b
        internal: true
      - type: dsl
        dsl:
          - 'regex("^[0-9]+(?:[.][0-9]+)*(?:[-+._][0-9A-Za-z]+)*$", product_version_0) ? "exim:" + product_version_0 : ""'
      - type: regex
        name: product_version_1
        part: raw
        group: 1
        regex:
          - (?mi)^220[^\r\n]*\bSendmail\s+([0-9]+(?:[.][0-9]+)+(?:[-+._][0-9A-Za-z]+)*)\b
        internal: true
      - type: dsl
        dsl:
          - 'regex("^[0-9]+(?:[.][0-9]+)*(?:[-+._][0-9A-Za-z]+)*$", product_version_1) ? "sendmail:" + product_version_1 : ""'
      - type: regex
        name: product_version_2
        part: raw
        group: 1
        regex:
          - (?mi)^220[^\r\n]*CommuniGate Pro SMTP\s+([0-9]+(?:[.][0-9]+)+(?:[-+._][0-9A-Za-z]+)*)\b
        internal: true
      - type: dsl
        dsl:
          - 'regex("^[0-9]+(?:[.][0-9]+)*(?:[-+._][0-9A-Za-z]+)*$", product_version_2) ? "communigate:" + product_version_2 : ""'
