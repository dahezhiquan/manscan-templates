id: asyncrat-c2

info:
  name: AsyncRAT C2 证书识别（证书安全）
  author: johnk3r
  severity: info
  description: 该模板通过 SSL/TLS 证书颁发者字段识别目标是否可能与 AsyncRAT 命令控制基础设施相关。命中特征通常反映了该恶意家族常见的证书命名习惯。
  reference:
    - https://malpedia.caad.fkie.fraunhofer.de/details/win.asyncrat
  metadata:
    verified: "true"
    max-request: 1
    shodan-query: ssl:"AsyncRAT Server"
    censys-query: services.tls.certificates.leaf_data.issuer.common_name:AsyncRat
  tags: c2,ssl,tls,ir,osint,malware,asyncrat,discovery
ssl:
  - address: "{{Host}}:{{Port}}"
    matchers:
      - type: word
        part: issuer_cn
        words:
          - "AsyncRAT Server"

    extractors:
      - type: json
        json:
          - " .issuer_cn"
