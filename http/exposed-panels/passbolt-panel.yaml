id: passbolt-panel

info:
  name: Passbolt 登录面板（暴露面识别）
  author: righettod
  severity: info
  description: |
    该模板通过识别 Passbolt 登录入口的页面标题、特征文本或重定向行为，判断目标是否暴露了对应的认证界面。若命中，说明该登录面板对外可访问，可用于暴露面梳理与后续安全评估。
  reference:
    - https://www.passbolt.com/
  classification:
    cpe: cpe:2.3:a:passbolt:passbolt_api:*:*:*:*:*:*:*:*
  metadata:
    verified: true
    max-request: 1
    vendor: passbolt
    product: passbolt_api
    shodan-query: http.title:"Passbolt | Open source password manager for teams"
  tags: panel,passbolt,login,discovery

http:
  - method: GET
    path:
      - "{{BaseURL}}/auth/login"

    matchers:
      - type: dsl
        dsl:
          - 'status_code == 200'
          - 'contains(body, "Passbolt") && contains(body, "Open source password manager for teams")'
        condition: and

    extractors:
      - type: regex
        part: body
        group: 1
        regex:
          - '(?i)v=([0-9a-z.-]+)'
