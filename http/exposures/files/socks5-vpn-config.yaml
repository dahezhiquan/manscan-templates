id: socks5-vpn-config

info:
  name: Socks5 VPN 敏感文件泄露（暴露面识别）
  author: DhiyaneshDk
  severity: high
  description: |
    检测到目标站点可直接访问 Socks5 VPN 敏感文件。SOCKS5/VPN 配置可能暴露代理服务器、认证信息和网络访问路径。该模板请求 `/backup/config.xml`，并通过 HTTP 状态码、响应正文关键字、文件格式特征、正则匹配或响应头进行确认。此类文件公开后可能泄露源码结构、依赖版本、内部路径、业务配置、访问凭据或调试数据，扩大暴露面并降低攻击者的后续利用成本。
  impact: |-
    - 网络、代理、SSH、FTP、VPN 或远程访问配置可能泄露内部地址、远程入口、认证方式和信任关系。
    - 攻击者可利用这些信息定位管理面、尝试未授权访问或开展定向凭据攻击。
    - 若文件包含私钥、密码或会话参数，可能直接造成远程系统被登录或流量被代理滥用。
  remediation: |-
    - 移除公开的代理、SSH、FTP、SFTP、VPN 或远程访问配置文件，并限制此类文件在 Web 根目录发布。
    - 轮换可能暴露的私钥、密码、known_hosts 信任信息、代理认证和远程访问凭据。
    - 通过防火墙、VPN、IP allowlist 和强认证限制管理入口，只允许受信任来源访问。
    - 审计远程登录、文件传输、代理连接和异常网络访问记录，确认是否存在凭据滥用。
  reference:
    - https://github.com/Threekiii/Awesome-POC/blob/master/%E7%BD%91%E7%BB%9C%E8%AE%BE%E5%A4%87%E6%BC%8F%E6%B4%9E/%E6%83%A0%E5%B0%94%E9%A1%BF%20e%E5%9C%B0%E9%80%9A%20config.xml%20%E4%BF%A1%E6%81%AF%E6%B3%84%E6%BC%8F%E6%BC%8F%E6%B4%9E.md
    - https://github.com/PeiQi0/PeiQi-WIKI-Book/blob/main/docs/wiki/iot/%E6%83%A0%E5%B0%94%E9%A1%BF/%E6%83%A0%E5%B0%94%E9%A1%BF%20e%E5%9C%B0%E9%80%9A%20config.xml%20%E4%BF%A1%E6%81%AF%E6%B3%84%E6%BC%8F%E6%BC%8F%E6%B4%9E.md?plain=1
  metadata:
    verified: true
    max-request: 1
    fofa-query: app="惠尔顿-e地通VPN"
  tags: esocks5,exposure,misconfig,files,disclosure,vuln

http:
  - method: GET
    path:
      - "{{BaseURL}}/backup/config.xml"

    matchers-condition: and
    matchers:
      - type: word
        part: body
        words:
          - "<config>"
          - "password="
          - "username="
        condition: and

      - type: word
        part: header
        words:
          - "application/xml"

      - type: status
        status:
          - 200
