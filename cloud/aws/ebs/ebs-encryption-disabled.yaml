id: ebs-encryption-disabled

info:
  name: EBS 卷未启用加密（云安全）
  author: DhiyaneshDK
  severity: high
  description: EBS 卷未启用加密是一类块存储静态数据保护不足风险，卷中数据、快照及从快照创建的副本可能缺少 KMS 加密边界。对于承载数据库、日志或业务文件的卷，未加密会增加磁盘数据泄露和合规审计失败风险。模板枚举 EBS 卷 ID 后读取 `Volumes[*].Encrypted`，当返回 `False` 时判定该卷未启用加密。
  impact: |
    - 卷、快照或复制数据缺少静态加密保护，敏感数据泄露后的影响更难控制。
    - 无法使用 KMS key policy、密钥轮换和访问审计实现更细粒度的数据保护。
  remediation: |
    - 为新建 EBS 卷启用默认加密，并为现有未加密卷通过加密快照重建或迁移。
    - 使用客户管理 KMS 密钥时，定期审计 key policy、密钥轮换和解密权限。
  reference:
    - https://www.trendmicro.com/cloudoneconformity-staging/knowledge-base/aws/EBS/ebs-encrypted.html
    - http://docs.aws.amazon.com/AWSEC2/latest/UserGuide/EBSEncryption.html
  metadata:
    vendor: amazon
    product: ebs
  tags: cloud,devops,aws,amazon,ebs,aws-cloud-config

variables:
  region: "us-west-2"

flow: |
  code(1)
  for(let VolumesVolumeId of iterate(template.volumes)){
    set("volume", VolumesVolumeId)
    code(2)
  }

self-contained: true

code:
  - engine:
      - sh
      - bash

    source: |
      aws ec2 describe-volumes --region $region --query 'Volumes[*].VolumeId'  --output json

    extractors:
      - type: json
        name: volumes
        internal: true
        json:
          - '.[]'

  - engine:
      - sh
      - bash

    source: |
        aws ec2 describe-volumes --region $region --volume-ids $volume --query 'Volumes[*].Encrypted' --output text

    matchers:
      - type: word
        words:
          - "False"

    extractors:
      - type: dsl
        dsl:
          - '"EBS Encryption  " + volumes + " is Disabled"'
