id: s3-server-side-encryption
info:
  name: S3 Bucket 服务端加密未启用（云安全）
  author: princechaddha
  severity: high
  description: S3 bucket 缺少默认服务端加密配置时，对象静态数据可能没有按组织要求使用指定加密策略或 KMS key。该模板调用 get-bucket-encryption，并在返回 ServerSideEncryptionConfigurationNotFoundError 时命中。
  impact: |
    - 新上传对象可能不符合静态数据加密和密钥审计要求。
    - 对敏感数据 bucket 而言，缺少默认加密会增加误配置和合规失败风险。
  remediation: |
    - 为 S3 bucket 配置默认服务端加密，按数据敏感度选择 SSE-S3 或 SSE-KMS。
    - 对需要强管控的数据使用客户管理 KMS key，并审计 key policy、bucket policy 和对象加密状态。
  reference:
    - https://docs.aws.amazon.com/cli/latest/reference/s3api/get-bucket-encryption.html
  metadata:
    max-request: 2
    vendor: amazon
    product: s3
  tags: cloud,devops,aws,amazon,s3,aws-cloud-config

flow: |
  code(1)
  for(let bucketName of iterate(template.buckets)){
    set("bucket", bucketName)
    code(2)
  }

self-contained: true
code:
  - engine:
      - sh
      - bash
    source: |
      aws s3api list-buckets --query 'Buckets[*].Name'

    extractors:
      - type: json # type of the extractor
        internal: true
        name: buckets
        json:
          - '.[]'

  - engine:
      - sh
      - bash
    source: |
        aws s3api get-bucket-encryption --bucket $bucket

    matchers:
      - type: word
        words:
          - "ServerSideEncryptionConfigurationNotFoundError"

    extractors:
      - type: dsl
        dsl:
          - '"The S3 bucket " + bucket +" is not encrypted at rest"'
