id: hestiacp-hestia-panel

info:
  name: Hestia Control Panel 登录识别（指纹识别）
  author: JustaAcat
  severity: info
  description: |-
    检测到目标站点存在 Hestia Control Panel 相关响应特征。Hestia Control Panel 是一套通过 Web 提供访问的管理面板或业务系统，通常用于配置服务、查看状态、管理数据或执行日常运维操作。模板请求 `/login/`，并通过页面标题或正文关键字、状态码确认该系统指纹，用于资产识别、系统盘点和暴露面梳理。
  reference:
    - https://hestiacp.com/
  classification:
    cvss-metrics: CVSS:3.1/AV:N/AC:L/PR:N/UI:N/S:U/C:N/I:N/A:N
    cwe-id: CWE-200
    cpe: cpe:2.3:a:hestiacp:control_panel:*:*:*:*:*:*:*:*
  metadata:
    verified: true
    max-request: 1
    vendor: hestiacp
    product: control_panel
    shodan-query:
      - title:"Hestia Control Panel"
      - http.favicon.hash:-476299640
      - http.title:"hestia control panel"
    fofa-query:
      - icon_hash=-476299640
      - title="hestia control panel"
    google-query: intitle:"hestia control panel"
  tags: panel,hestia,detect,hestiacp,discovery
http:
  - method: GET
    path:
      - '{{BaseURL}}/login/'

    matchers-condition: and
    matchers:
      - type: word
        part: body
        words:
          - "Hestia Control Panel"
          - "Welcome to Hestia Control"
        condition: or

      - type: status
        status:
          - 200
