id: phppgadmin-version

info:
  name: phpPgAdmin 指纹识别（指纹识别）
  author: dr0pd34d
  severity: info
  description: >-
    phpPgAdmin 是 PostgreSQL 的 Web 管理工具，用于浏览数据库对象、执行 SQL 和管理用户权限。该模板通过请求目标服务并检查预设路径或首页响应、正则特征、状态码等指纹特征，判断目标是否使用或暴露了
    phpPgAdmin 相关组件；命中结果仅表示指纹特征匹配，可用于资产盘点、技术栈识别和后续安全评估，不代表已确认存在可利用漏洞。
  classification:
    cvss-metrics: CVSS:3.1/AV:N/AC:L/PR:N/UI:N/S:U/C:N/I:N/A:N
    cvss-score: 0
    cwe-id: CWE-200
  metadata:
    max-request: 1
  tags: tech,phppgadmin,discovery
http:
  - method: GET
    path:
      - "{{BaseURL}}/phppgadmin/intro.php"

    matchers-condition: and
    matchers:
      - type: regex
        part: body
        regex:
          - '<span class="appname">phpPgAdmin</span> <span class="version">.*</span>'

      - type: status
        status:
          - 200

    extractors:
      - type: regex
        part: body
        regex:
          - 'phpPgAdmin.*\(.*\)'
