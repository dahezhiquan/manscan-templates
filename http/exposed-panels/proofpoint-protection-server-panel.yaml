id: proofpoint-protection-server-panel

info:
  name: Proofpoint Protection Server 登录面板识别（指纹识别）
  author: johnk3r
  severity: info
  description: Proofpoint Protection Server 是邮件安全网关管理平台，用于反垃圾邮件、策略和邮件防护配置。该模板请求首页、`/euweb/login` 路径，并依据页面标题、正文关键字或品牌资源特征、响应头特征识别目标是否部署了该系统或暴露了对应入口，适用于资产指纹确认；命中结果仅表示系统特征匹配，不代表已确认存在未授权访问或可利用漏洞。
  classification:
    cvss-metrics: CVSS:3.0/AV:N/AC:L/PR:N/UI:N/S:U/C:N/I:N/A:N
    cwe-id: CWE-200
  metadata:
    verified: true
    max-request: 2
    vendor: proofpoint
    product: proofpoint protection server
    shodan-query: http.favicon.hash:942678640
    fofa-query: icon_hash=942678640
  tags: panel,proofpoint,login,detect,discovery

http:
  - method: GET
    path:
      - "{{BaseURL}}"
      - "{{BaseURL}}/euweb/login"

    stop-at-first-match: true
    host-redirects: true
    max-redirects: 2

    matchers-condition: or
    matchers:
      - type: word
        part: body
        words:
          - '<TITLE>Proofpoint Protection Server'
          - 'Proofpoint End User Application.'
          - 'Powered by Proofpoint'
        condition: or

      - type: word
        part: header
        words:
          - 'PPSAUTH='
