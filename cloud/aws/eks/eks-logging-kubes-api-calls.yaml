id: eks-logging-kubes-api-calls

info:
  name: EKS API 调用未通过 CloudTrail 持续记录（云安全）
  author: princechaddha
  severity: high
  description: EKS API 调用未通过 CloudTrail 持续记录是一类 AWS 控制面审计缺失风险，针对 Amazon EKS 的 API 操作可能无法持续投递到审计日志。CloudTrail 可记录调用主体、来源 IP、时间和请求信息，缺失时会影响 EKS 集群生命周期操作的追踪。模板枚举 CloudTrail trail 名称并读取 `get-trail-status` 的 `IsLogging`，当值为 `false` 时判定相关审计记录未持续开启。
  impact: |
    - EKS 集群创建、更新、删除等控制面 API 调用可能缺少持续审计记录。
    - 发生异常变更或凭据滥用时，安全团队难以还原调用主体和来源。
  remediation: |
    - 确保至少一个覆盖 EKS 所在区域的 CloudTrail trail 处于 logging 状态。
    - 将 CloudTrail 日志集中投递到受控位置，并为高风险 EKS API 操作配置告警。
  reference:
    - https://www.trendmicro.com/cloudoneconformity/knowledge-base/aws/EKS/eks-logging-kubes-api-calls.html
    - https://docs.aws.amazon.com/eks/latest/userguide/logging-using-cloudtrail.html
  metadata:
    vendor: amazon
    product: eks
  tags: cloud,devops,aws,amazon,eks,aws-cloud-config

variables:
  region: "us-east-1"

flow: |
  code(1)
  for(let trailName of iterate(template.trails)){
    set("trail", trailName)
    code(2)
  }

self-contained: true

code:
  - engine:
      - sh
      - bash
    source: |
      aws cloudtrail list-trails --region $region --query 'Trails[*].Name' --output json

    extractors:
      - type: json
        name: trails
        internal: true
        json:
          - '.[]'

  - engine:
      - sh
      - bash
    source: |
      aws cloudtrail get-trail-status --name $trail --region $region --query 'IsLogging' --output json

    matchers:
      - type: word
        words:
          - "false"

    extractors:
      - type: dsl
        dsl:
          - '"CloudTrail trail " + trail + " is not logging EKS API calls"'
