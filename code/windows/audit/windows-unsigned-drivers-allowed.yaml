id: windows-unsigned-drivers-allowed

info:
  name: 允许安装未签名驱动（本地基线扫描）
  author: princechaddha
  severity: high
  description: |
    该模板检查系统是否允许安装未签名驱动。未签名驱动来源不可验证，可能包含恶意或不稳定代码。
  impact: |
    攻击者可加载恶意驱动获取内核级能力或破坏系统稳定性。
  remediation: |
    仅允许安装签名驱动，并启用驱动签名强制策略。
  tags: windows,code,windows-audit

self-contained: true

code:
  - pre-condition: |
      IsWindows();
    engine:
      - powershell
      - powershell.exe
    args:
      - -ExecutionPolicy
      - Bypass
    pattern: "*.ps1"
    source: |
      (Get-ItemProperty -Path 'HKLM:\SOFTWARE\Microsoft\Driver Signing').Policy

    matchers:
      - type: word
        words:
          - "0"
