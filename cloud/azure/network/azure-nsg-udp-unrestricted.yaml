id: azure-nsg-udp-unrestricted
info:
  name: Azure NSG 对互联网开放任意 UDP 端口（云安全）
  author: princechaddha
  severity: high
  description: UDP 无连接且常用于 DNS、媒体、发现和自定义协议；允许互联网任意来源访问 UDP 端口会使多个无状态服务同时暴露。本模板查询入站允许的 UDP NSG 规则，并在来源地址为 *、internet 或 any 时报告。
  impact: |
    - 攻击者可探测未登记的 UDP 服务，利用协议缺陷、伪造源地址或反射放大造成数据泄露和服务中断。
    - 宽泛 UDP 规则还可能绕过仅针对 TCP 设计的审计和访问控制，扩大横向移动路径。
  remediation: |
    - 删除任意来源的 UDP 入站规则，仅开放业务明确需要的端口、协议和来源网段。
    - 对 UDP 服务启用应用层认证、速率限制和反射放大防护，并持续审计规则关联资源。
  reference:
    - https://docs.microsoft.com/en-us/azure/virtual-network/network-security-groups-overview
  metadata:
    vendor: microsoft
    product: azure-network-security-group
  tags: cloud,devops,azure,microsoft,nsg,azure-cloud-config

flow: |
  code(1);
  for (let NsgData of iterate(template.nsgdata)) {
    NsgData = JSON.parse(NsgData)
    set("nsg", NsgData.name)
    set("resourcegroup", NsgData.resourceGroup)
    code(2)
  }

self-contained: true
code:
  - engine:
      - sh
      - bash
    source: |
      az network nsg list --query '[*].{name:name, resourceGroup:resourceGroup}' --output json

    extractors:
      - type: json
        name: nsgdata
        internal: true
        json:
          - '.[]'

  - engine:
      - sh
      - bash
    source: |
      az network nsg rule list --nsg-name $nsg --resource-group $resourcegroup --query "[?direction=='Inbound' && access=='Allow' && protocol=='UDP']"

    matchers:
      - type: word
        words:
          - '"sourceAddressPrefix": "*"'
          - '"sourceAddressPrefix": "internet"'
          - '"sourceAddressPrefix": "any"'

    extractors:
      - type: dsl
        dsl:
          - 'nsg + " has unrestricted access on UDP ports"'
