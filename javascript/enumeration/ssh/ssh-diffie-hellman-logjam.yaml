id: ssh-diffie-hellman-logjam

info:
  name: SSH Diffie-Hellman 模数小于等于 1024 位（服务漏洞）
  author: pussycat0x
  severity: low
  description: |
    该模板检测 SSH 服务器是否仍使用弱 Diffie-Hellman 模数，从而评估 Logjam 类降强度风险。
  reference:
    - https://access.redhat.com/solutions/4278651
  metadata:
    verified: true
    max-request: 2
    shodan-query: product:"OpenSSH"
  tags: js,enum,ssh,misconfig,network,discovery

javascript:
  - pre-condition: |
      isPortOpen(Host,Port);
    code: |
      let m = require("nuclei/ssh");
      let c = m.SSHClient();
      let response = c.ConnectSSHInfoMode(Host, Port);
      Export(response);

    args:
      Host: "{{Host}}"
      Port: "22"

    matchers-condition: and
    matchers:
      - type: word
        words:
          - "kex_algorithms"

      - type: word
        words:
          - "diffie-hellman-group1-sha1"
