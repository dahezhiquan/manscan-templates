id: vllm-openai-api-exposed

info:
  name: vLLM OpenAI 兼容 API - 未认证暴露（暴露面识别）
  author: fsoppelsa
  severity: medium
  description: |-
    检测到 vLLM 推理服务器未经认证便暴露其 OpenAI 兼容 API。/v1/models 接口会返回已提供模型的列表，任何未认证客户端都可访问，导致模型枚举和未授权推理（资源滥用 / 成本与信息泄露）。vLLM 默认不启用 API key，仅当服务器以 --api-key 参数启动时才会强制校验。
  reference:
    - https://docs.vllm.ai/en/latest/serving/openai_compatible_server.html
    - https://github.com/vllm-project/vllm
  classification:
    cvss-metrics: CVSS:3.1/AV:N/AC:L/PR:N/UI:N/S:U/C:L/I:N/A:L
    cvss-score: 6.5
    cwe-id: CWE-306
  metadata:
    verified: true
    max-request: 1
    shodan-query: title:"vLLM"
    fofa-query: title="vLLM"
  tags: exposure,vllm,llm,ai,api,unauth,misconfig

http:
  - method: GET
    path:
      - "{{BaseURL}}/v1/models"

    matchers-condition: and
    matchers:
      - type: regex
        regex:
          - '"object"\s*:\s*"list"'

      - type: regex
        regex:
          - '"owned_by"\s*:\s*"vllm'
          - '"max_model_len"'
        condition: or

      - type: word
        part: header
        words:
          - "application/json"

      - type: status
        status:
          - 200

    extractors:
      - type: json
        part: body
        json:
          - ".data[].id"
