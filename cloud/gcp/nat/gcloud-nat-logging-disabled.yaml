id: gcloud-nat-logging-disabled

info:
  name: Cloud NAT 网关日志记录未启用（云安全）
  author: princechaddha
  severity: medium
  description: Cloud NAT 日志可记录私有实例的出站连接、错误和地址转换信息，未启用会影响网络排障和安全取证。本模板枚举网络、Cloud Router 和 NAT 网关，并检查 logConfig.enable，值为 False 时报告 NAT 日志关闭。
  impact: |
    - 私有工作负载的异常外连、扫描或数据外传行为缺少 NAT 层记录，降低检测和溯源能力。
    - 出站连接失败或地址池耗尽等问题也更难排查，可能影响业务可用性。
  remediation: |
    - 为 Cloud NAT 网关启用日志记录，并根据成本和可见性要求选择错误日志或连接日志范围。
    - 将 NAT 日志接入集中监控和告警，关注异常目的地、连接失败和地址耗尽事件。
  reference:
    - https://cloud.google.com/nat/docs/logging
  metadata:
    vendor: google
    product: cloud-nat
  tags: cloud,devops,gcp,gcloud,google-cloud-nat,gcp-cloud-config

flow: |
  code(1)
  for(let projectId of iterate(template.projectIds)){
    set("projectId", projectId)
    code(2)
    for(let network of iterate(template.networks)){
      set("network", network)
      code(3)
      for(let router of iterate(template.routers)){
        set("router", router)
        code(4)
        for(let nat of iterate(template.nats)){
          set("nat", nat)
          code(5)
        }
      }
    }
  }

self-contained: true

code:
  - engine:
      - sh
      - bash
    source: |
      gcloud projects list --format="json(projectId)"

    extractors:
      - type: json
        name: projectIds
        internal: true
        json:
          - '.[].projectId'

  - engine:
      - sh
      - bash
    source: |
      gcloud compute networks list --project=$projectId --format="json(name)"

    extractors:
      - type: json
        name: networks
        internal: true
        json:
          - '.[].name'

  - engine:
      - sh
      - bash
    source: |
      gcloud compute routers list --project=$projectId --filter="network:($network)" --format="json(name,region)"

    extractors:
      - type: json
        name: routers
        internal: true
        json:
          - '.[].name'
          - '.[].region'

  - engine:
      - sh
      - bash
    source: |
      gcloud compute routers nats list --region=$region --router=$router --format="json(name)"

    extractors:
      - type: json
        name: nats
        internal: true
        json:
          - '.[].name'

  - engine:
      - sh
      - bash
    source: |
      gcloud compute routers nats describe $nat --region=$region --router=$router --format="json(logConfig.enable)"

    matchers:
      - type: word
        words:
          - 'False'

    extractors:
      - type: dsl
        dsl:
          - '"Logging is disabled for Cloud NAT Gateway: " + nat + " in Router: " + router + " of Network: " + network + " in Project: " + projectId'
