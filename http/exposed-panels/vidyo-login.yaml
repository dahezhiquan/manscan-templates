id: vidyo-login

info:
  name: Vidyo Admin 登录面板识别（暴露面识别）
  author: johnk3r
  severity: info
  description: 该模板通过识别 Vidyo Admin 登录入口的页面标题、特征文本或重定向行为，判断目标是否暴露了对应的认证界面。若命中，说明该登录面板对外可访问，可用于暴露面梳理与后续安全评估。
  classification:
    cvss-metrics: CVSS:3.0/AV:N/AC:L/PR:N/UI:N/S:U/C:N/I:N/A:N
    cwe-id: CWE-200
    cpe: cpe:2.3:a:vidyo:vidyo:*:*:*:*:*:*:*:*
  metadata:
    max-request: 2
    shodan-query: http.favicon.hash:-1970367401
    product: vidyo
    vendor: vidyo
  tags: panel,vidyo,discovery

http:
  - method: GET
    path:
      - '{{BaseURL}}/admin/login.html?lang=en'
      - '{{BaseURL}}/vr2conf/login.html'

    matchers-condition: and
    matchers:
      - type: word
        words:
          - '<title>Vidyo Admin</title>'
          - '<title>VidyoRouter Configuration</title>'
        condition: or

      - type: status
        status:
          - 200
