id: appspace-panel

info:
  name: Appspace 登录面板识别（指纹识别）
  author: ritikchaddha
  severity: info
  description: |-
    检测到目标站点存在 Appspace 相关响应特征。Appspace 是一套通过 Web 提供访问的管理面板或业务系统，通常用于配置服务、查看状态、管理数据或执行日常运维操作。模板请求 `/`、`/app/login.aspx`、`/signin/#!/login?returnUrl=%2Fapp%2Fdefault.aspx` 路径，并通过页面标题或正文关键字、状态码确认该系统指纹，用于资产识别、系统盘点和暴露面梳理。
  reference:
    - https://www.appspace.com/
  classification:
    cpe: cpe:2.3:a:appspace:appspace:*:*:*:*:*:*:*:*
  metadata:
    verified: true
    max-request: 3
    vendor: appspace
    product: appspace
    shodan-query:
      - title:"Appspace"
      - http.title:"appspace"
    fofa-query: title="appspace"
    google-query: intitle:"appspace"
  tags: appspace,panel,detect,discovery
http:
  - method: GET
    path:
      - "{{BaseURL}}"
      - "{{BaseURL}}/app/login.aspx"
      - "{{BaseURL}}/signin/#!/login?returnUrl=%2Fapp%2Fdefault.aspx"

    stop-at-first-match: true
    host-redirects: true
    max-redirects: 2

    matchers-condition: and
    matchers:
      - type: word
        part: body
        words:
          - '.appspace-ui'
          - 'appspace-logo'
          - '<title>Appspace</title>'
          - 'class="btnSSOAppspace'
          - 'Sign in to Appspace Core'
        condition: or
        case-insensitive: true

      - type: status
        status:
          - 200
