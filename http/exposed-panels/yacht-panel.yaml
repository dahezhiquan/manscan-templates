id: yacht-panel

info:
  name: Yacht 登录面板识别（指纹识别）
  author: Fur1na
  severity: info
  description: |-
    Yacht 是 Docker 容器管理面板，用于容器、镜像、模板和应用栈管理。该模板请求首页，并依据 HTTP 200 状态码、页面标题、正文关键字或品牌资源特征识别目标是否部署了该系统或暴露了对应入口，适用于资产指纹确认；命中结果仅表示系统特征匹配，不代表已确认存在未授权访问或可利用漏洞。
  metadata:
    verified: true
    max-request: 1
    zoomeye-query: app="Yacht"
  tags: panel,yacht,login,detect,discovery

http:
  - method: GET
    path:
      - "{{BaseURL}}"

    host-redirects: true
    max-redirects: 2

    matchers-condition: and
    matchers:
      - type: word
        part: body
        words:
          - "<title>Yacht</title>"
          - "but Yacht do"
        condition: and

      - type: status
        status:
          - 200
