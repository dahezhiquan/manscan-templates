id: gcloud-bigquery-cmk-not-enabled

info:
  name: BigQuery Datasets 未Encrypted 使用Customer-Managed Keys（云安全）
  author: princechaddha
  severity: high
  description: BigQuery 表未使用 Customer-Managed Key 加密时，组织无法对表级数据密钥进行自主治理。本模板枚举项目、数据集和表，并检查表的 encryptionConfiguration.encryptionType 是否为 null，命中时报告该表未使用客户管理密钥。
  impact: |
    - 表级敏感数据缺少客户管理密钥控制，无法通过 KMS 权限、轮换或禁用机制快速限制数据访问。
    - 对有强合规要求的数据集，未使用 CMK 可能导致审计不通过或密钥生命周期管理不一致。
  remediation: |
    - 为需要客户管理密钥的 BigQuery 表配置 CMEK，并验证 BigQuery 服务账号具备 Cloud KMS CryptoKey Encrypter/Decrypter 权限。
    - 对历史表制定迁移计划，统一数据集默认加密配置，避免新表继续以默认密钥创建。
  reference:
    - https://cloud.google.com/bigquery/docs/encryption-customer-managed-keys
  metadata:
    vendor: google
    product: bigquery
  tags: cloud,devops,gcp,gcloud,bigquery,gcp-cloud-config

flow: |
  code(1)
  for(let projectId of iterate(template.projectIds)){
    set("projectId", projectId)
    code(2)
    for(let dataset of iterate(template.datasets)){
      set("datasetId", dataset)
      code(3)
      for(let table of iterate(template.tables)){
        set("tableName", table)
        code(4)
      }
    }
  }

self-contained: true

code:
  - engine:
      - sh
      - bash
    source: |
      gcloud projects list --format="json(projectId)"

    extractors:
      - type: json
        name: projectIds
        internal: true
        json:
          - '.[].projectId'

  - engine:
      - sh
      - bash
    source: |
      bq ls --format=prettyjson --project_id $projectId

    extractors:
      - type: json
        name: datasets
        internal: true
        json:
          - '.[].datasetReference.datasetId'

  - engine:
      - sh
      - bash
    source: |
      bq ls --format=prettyjson --project_id $projectId --dataset_id $datasetId

    extractors:
      - type: json
        name: tables
        internal: true
        json:
          - '.[].tableId'

  - engine:
      - sh
      - bash
    source: |
      bq show --format=prettyjson $projectId:$datasetId.$tableName | jq '.encryptionConfiguration.encryptionType'

    matchers:
      - type: word
        words:
          - 'null'

    extractors:
      - type: dsl
        dsl:
          - '"Table Not Encrypted with CMK: " + tableName + " in Dataset: " + datasetId + " of Project: " + projectId'
