id: laravel-sessions-exposure

info:
  name: Laravel Sessions Folder 暴露
  author: DhiyaneshDk
  severity: high
  description: |
    检测到 Laravel Sessions Folder 暴露。目标功能在未认证状态下可访问，可能暴露管理入口、业务数据、系统状态或可执行操作，需确认是否存在访问控制缺失。
  metadata:
    max-request: 2
    verified: true
    shodan-query: http.html:"Index of" http.html:"sessions"
    fofa-query: body="Index of" && body="sessions"
  tags: laravel,exposure,misconfig,storage,session

http:
  - method: GET
    path:
      - "{{BaseURL}}/storage/framework/sessions/"
      - "{{BaseURL}}/storage/sessions/"

    stop-at-first-match: true

    matchers-condition: and
    matchers:
      - type: word
        part: body
        words:
          - "Index of"
          - "Parent Directory"
          - "<title>Index of"
          - "Directory listing for"
        condition: or

      - type: status
        status:
          - 200
