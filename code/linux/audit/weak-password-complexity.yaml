id: weak-password-complexity

info:
  name: Linux 密码复杂度未强制执行（本地基线扫描）
  author: songyaeji
  severity: high
  description: |
    密码复杂度未强制执行会允许短密码、单一字符类型密码或 root 例外策略长期存在，显著提高口令猜测和凭据复用成功率。模板读取 `/etc/security/pwquality.conf` 以及 PAM 中的 `pam_pwquality.so` 配置，检查最小长度、字符类别和 `enforce_for_root` 等规则是否满足基线。
  impact: |
    - 弱密码更容易被暴力破解、字典攻击或凭据填充命中。
    - root 或特权账号不受复杂度约束时，单点失陷影响更大。
  remediation: |
    - 配置 `pam_pwquality.so` 并设置符合组织要求的 `minlen`、字符类别和重试限制。
    - 启用 `enforce_for_root`，确保 root 设置密码时同样受复杂度策略约束。
  reference:
    - https://isms.kisa.or.kr/main/csap/notice/
  metadata:
    verified: true
  tags: linux,local,audit,kisa,compliance

self-contained: true

code:
  - engine:
      - sh
      - bash
    source: |
      cat /etc/security/pwquality.conf 2>/dev/null || true

  - engine:
      - sh
      - bash
    source: |
      grep pam_pwquality.so /etc/pam.d/system-auth /etc/pam.d/common-password 2>/dev/null || true

    matchers:
      - type: regex
        part: code_1_response
        name: password-quality
        regex:
          - 'minlen\s*=\s*[0-7]'           # Password length < 8 characters
          - 'dcredit\s*=\s*0'              # No digit requirement
          - 'ucredit\s*=\s*0'              # No uppercase requirement
          - 'lcredit\s*=\s*0'              # No lowercase requirement
          - 'ocredit\s*=\s*0'              # No special character requirement
        condition: or

      - type: word
        part: code_2_response
        name: pam
        words:
          - "pam_pwquality.so"

      - type: word
        part: code_2_response
        words:
          - "enforce_for_root"
        negative: true
