id: mojoportal-detect

info:
  name: mojoPortal 指纹识别（指纹识别）
  author: pikpikcu
  severity: info
  description: >-
    mojoPortal 是基于 .NET 的内容管理系统，用于构建企业站点、社区和门户应用。该模板通过请求目标服务并检查预设路径或首页响应、正则特征、状态码等指纹特征，判断目标是否使用或暴露了
    mojoPortal 相关组件；命中结果仅表示指纹特征匹配，可用于资产盘点、技术栈识别和后续安全评估，不代表已确认存在可利用漏洞。
  metadata:
    max-request: 1
  tags: tech,mojoportal,discovery
http:
  - method: GET
    path:
      - "{{BaseURL}}"

    host-redirects: true
    max-redirects: 2

    matchers-condition: and
    matchers:
      - type: regex
        part: body
        regex:
          - "Powered by mojoPortal"
          - "title=['\"]mojoPortal"
          - "alt=['\"]mojoPortal"
        condition: or

      - type: status
        status:
          - 200
