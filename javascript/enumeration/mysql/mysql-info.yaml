id: mysql-info

info:
  name: MySQL 基本信息枚举（服务漏洞）
  author: pussycat0x
  severity: medium
  description: |
    MySQL 服务在协议握手阶段会返回服务版本、协议版本、能力标志和部分认证相关信息。该模板建立 MySQL 协议连接并调用指纹收集逻辑，在握手成功时输出 Version、TLS 和 Transport 等字段，用于识别数据库版本与资产特征。
  impact: |
    - MySQL 版本和握手信息可帮助攻击者判断补丁水平、认证插件和潜在已知漏洞。
    - 暴露的数据库指纹会提高后续弱口令、配置错误或版本漏洞利用的命中率。
  remediation: |
    - 限制 MySQL 端口访问来源，避免不可信主机直接读取数据库握手信息。
    - 保持 MySQL 更新到受支持版本，审计认证插件和账号权限配置。
  reference:
    - https://nmap.org/nsedoc/scripts/mysql-info.html
  metadata:
    max-request: 1
    shodan-query: "port:3306"
    vendor: oracle
    product: mysql
  tags: js,mysql,network,enum,discovery

javascript:
  - pre-condition: |
      isPortOpen(Host,Port);
    code: |
      var m = require("nuclei/mysql");
      var c = m.MySQLClient();
      var response = c.FingerprintMySQL(Host,Port);
      Export(response);

    args:
      Host: "{{Host}}"
      Port: "3306"

    matchers:
      - type: dsl
        dsl:
          - "success == true"

    extractors:
      - type: json
        json:
          - '"Version: "+ .Version '
          - '"TLS "+ .TLS'
          - '"Transport: "+ .Transport '
