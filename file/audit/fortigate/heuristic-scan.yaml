id: heuristic-scan

info:
  name: FortiGate 启发式扫描未配置（本地文件安全扫描）
  author: pussycat0x
  severity: info
  description: |
    该模板检测 FortiGate 启发式扫描配置。启发式扫描可辅助发现未知恶意文件，未启用会降低恶意内容拦截能力。
  reference:
    - https://docs.fortinet.com/document/fortigate/6.2.0/hardening-your-fortigate/582009/system-administrator-best-practices
  classification:
    cvss-metrics: CVSS:3.1/AV:N/AC:L/PR:N/UI:N/S:U/C:N/I:N/A:N
    cvss-score: 0
    cwe-id: CWE-200
  tags: audit,config,file,firewall,fortigate

file:
  - extensions:
      - conf

    matchers-condition: and
    matchers:
      - type: word
        words:
          - "config antivirus heuristic"
          - "set mode block"
        negative: true

      - type: word
        words:
          - "config system"
          - "config router"
          - "config firewall"
        condition: or
