id: salesforce-phish

info:
  name: Salesforce 仿冒钓鱼网站（钓鱼网站识别）
  author: rxerium
  severity: info
  description: |
    检测到疑似仿冒 Salesforce 的钓鱼网站。模板在目标页面返回 200、页面内容命中 Salesforce 的官方服务页面特征，且当前主机不属于 salesforce.com 官方域名时触发，用于识别借用 Salesforce 品牌页面诱导用户信任的仿冒站点。
  reference:
    - https://salesforce.com
  metadata:
    max-request: 1
  tags: phishing,salesforce,crm,osint,discovery
http:
  - method: GET
    path:
      - "{{BaseURL}}"

    host-redirects: true
    max-redirects: 2

    matchers-condition: and
    matchers:
      - type: word
        words:
          - "Salesforce is the #1 AI CRM, helping companies become Agentic Enterprises where humans and agents drive success together through a unified AI, data, and Customer 360 platform."

      - type: status
        status:
          - 200

      - type: dsl
        dsl:
          - '!contains(host,"salesforce.com")'
