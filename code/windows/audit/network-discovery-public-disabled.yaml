id: network-discovery-public-disabled

info:
  name: 公用网络网络发现配置不安全（本地基线扫描）
  author: princechaddha
  severity: medium
  description: |
    该模板检查公用网络配置下网络发现是否关闭。公用网络启用发现会暴露主机信息。
  impact: |
    攻击者可在不可信网络中发现主机、服务和共享资源。
  remediation: |
    关闭公用网络配置文件的网络发现，仅在受信任网络按需启用。
  tags: network,code,windows-audit

self-contained: true

code:
  - pre-condition: |
      IsWindows();
    engine:
      - powershell
      - powershell.exe
    args:
      - -ExecutionPolicy
      - Bypass
    pattern: "*.ps1"
    source: |
      if (-not (Get-NetConnectionProfile | Where-Object { $_.NetworkCategory -eq 'Public' -and $_.NetworkDiscovery -eq 'Discoverable' })) { "Network Discovery is disabled on all Public networks" }

    matchers:
      - type: word
        words:
          - "Network Discovery is disabled on all Public networks"
