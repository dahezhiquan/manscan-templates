id: thruk-panel

info:
  name: Thruk 登录面板暴露（暴露面识别）
  author: ffffffff0x,righettod
  severity: low
  description: Thruk 是监控 Web 前端，用于查看 Nagios/Icinga 等监控系统的主机、服务和告警。该模板请求首页，并依据 DSL 条件判断目标是否对外暴露了 Thruk 的登录面板，用于发现互联网可访问的后台、控制台或业务入口。
  impact: "- 暴露的 Thruk 登录面板会泄露目标正在使用的产品、部署路径、页面特征或组织业务入口，便于攻击者进行指纹确认和漏洞匹配。\n- 如果认证、访问控制或默认凭据策略薄弱，攻击者可能进一步尝试进入后台，影响后台配置、业务数据、用户账号或设备运行状态。\n- 对互联网开放的管理入口会增加暴力破解、凭据填充、已知漏洞利用和钓鱼仿冒的攻击面。"
  remediation: "- 将 Thruk 的登录面板限制在内网、VPN、零信任代理或专用管理网段访问，避免直接暴露在互联网。\n- 启用强密码、多因素认证、登录失败限制和审计告警，排查默认账号、弱口令及长期未使用账号。\n- 保持 Thruk 及其依赖组件更新到受支持版本，并通过反向代理、ACL 或防火墙限制敏感路径访问。"
  reference:
  - https://thruk.org/
  classification:
    cvss-metrics: CVSS:3.0/AV:N/AC:L/PR:N/UI:N/S:U/C:N/I:N/A:N
    cwe-id: CWE-200
    cpe: cpe:2.3:a:thruk:thruk:*:*:*:*:*:*:*:*
  metadata:
    max-request: 6
    vendor: thruk
    product: thruk
    fofa-query:
    - title=="Thruk Monitoring Webinterface"
    - title=="thruk monitoring webinterface"
    - body="thruk"
    shodan-query: http.html:"thruk" || http.title:"thruk monitoring webinterface"
  tags: thruk,panel,login,discovery

http:
  - method: GET
    path:
      - "{{BaseURL}}"

    redirects: true
    max-redirects: 6

    matchers-condition: and
    matchers:
      - type: dsl
        dsl:
          - 'contains_any(to_lower(body), "<title>thruk monitoring webinterface", "<title>thruk - monitoring webinterface", "thruk_static_export")'
          - 'contains_any(to_lower(header), "x-thruk-auth-key", "thruk_test=")'
        condition: or

      - type: dsl
        dsl:
          - 'status_code == 200 || status_code == 401'

    extractors:
      - type: regex
        part: body
        group: 1
        regex:
          - '(?i)version_info\s*=\s*.?([a-z0-9./\s.-]+).?'
