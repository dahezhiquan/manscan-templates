id: riak-detect

info:
  name: Riak 识别（指纹识别）
  author: pussycat0x
  severity: info
  description: |
    Riak 是分布式 NoSQL 数据库，面向高可用键值存储和集群化数据访问。该模板连接 8087/TCP 并读取协议响应，通过匹配 `riak` 等响应特征识别目标服务。
  metadata:
    verified: true
    max-request: 1
    shodan-query: product:"Riak"
    product: riak
  tags: network,oss,detect,riak,nosql,tcp,discovery
tcp:
  - inputs:
      - data: 0000000107
        type: hex

    host:
      - "{{Hostname}}"
    port: 8087

    read-size: 2048
    matchers:
      - type: word
        words:
          - "riak"

    extractors:
      - type: regex
        name: version
        part: data
        group: 1
        regex:
          - 'riak@[^ \t\r\n\x00-\x1f]+\x12[\x01-\x7f]([0-9]+(?:\.[0-9]+)+(?:[A-Za-z][0-9A-Za-z]*)?(?:[-+~._][0-9A-Za-z]+)*)(?:$|[\x00-\x1f])'
