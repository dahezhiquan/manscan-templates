id: qdrant-detect

info:
  name: Qdrant 指纹识别（指纹识别）
  author: rxerium
  severity: info
  description: >-
    Qdrant 是开源向量数据库和相似度搜索引擎，用于语义搜索、推荐和 RAG 检索场景。该模板通过请求目标服务并检查预设路径或首页响应、页面正文关键字、状态码等指纹特征，判断目标是否使用或暴露了
    Qdrant 相关组件；命中结果仅表示指纹特征匹配，可用于资产盘点、技术栈识别和后续安全评估，不代表已确认存在可利用漏洞。
  reference:
  - https://qdrant.tech/documentation/
  metadata:
    max-request: 1
    shodan-query: 'html:"qdrant - vector search engine"'
  tags: tech,qdrant,database,vector
http:
  - method: GET
    path:
      - "{{BaseURL}}"

    matchers-condition: and
    matchers:
      - type: word
        part: body
        words:
          - '"title":"qdrant - vector search engine"'

      - type: status
        status:
          - 200
