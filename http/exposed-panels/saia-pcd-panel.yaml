id: saia-pcd-panel

info:
  name: Saia PCD Web Server 面板识别（暴露面识别）
  author: DhiyaneshDk
  severity: info
  description: |
    该模板通过识别 Saia PCD Web Server 面板、控制台或管理界面的页面特征，判断目标是否暴露了对应服务入口。若命中，说明该后台或运维界面对外可访问，可用于资产识别与暴露面排查。
  metadata:
    max-request: 1
    shodan-query: html:"Saia PCD Web Server"
  tags: saia,login,panel,pcd,discovery

http:
  - method: GET
    path:
      - "{{BaseURL}}/pwdform.htm"

    matchers-condition: and
    matchers:
      - type: word
        part: body
        words:
          - "<title>Saia PCD Web Server</title>"

      - type: status
        status:
          - 200
