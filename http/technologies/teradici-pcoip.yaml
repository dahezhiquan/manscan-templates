id: teradici-pcoip

info:
  name: Teradici PCoIP 指纹识别（指纹识别）
  author: pdteam
  severity: info
  description: 用于识别目标是否部署 Teradici PCoIP 并提取相关版本或构建信息，模板会结合特定路径或已知端点和版本或标识提取结果进行指纹匹配。
  reference:
    - https://www.teradici.com/
  classification:
    cwe-id: CWE-200
  metadata:
    max-request: 1
  tags: tech,pcoip,discovery

http:
  - method: GET
    path:
      - "{{BaseURL}}/info/"

    matchers:
      - type: word
        words:
          - "PCoIP Connection Manager"

    extractors:
      - type: regex
        group: 1
        regex:
          - 'PCoIP Connection Manager\/([0-9.]+)\.'
