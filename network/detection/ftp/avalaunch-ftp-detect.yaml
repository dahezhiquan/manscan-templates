id: avalaunch-ftp-detect
info:
  name: Avalaunch FTP 服务识别（指纹识别）
  author: pussycat0x
  severity: info
  description: |
    Avalaunch FTP 是 FTP 服务实现、设备内置文件传输组件或 FTP 代理，常用于文件传输、设备配置、固件维护或旧系统集成。该模板连接 21/TCP 并读取协议响应，通过匹配 `The Avalaunch FTP system` 等响应特征识别目标服务。
  metadata:
    verified: true
    shodan-query: The Avalaunch FTP system
    max-request: 1
  tags: network,ftp,avalaunch,detect,tcp,discovery

tcp:
  - inputs:
      - data: 00000000
        type: hex

    host:
      - "{{Hostname}}"
    port: 21
    read-size: 1024

    matchers:
      - type: word
        words:
          - "The Avalaunch FTP system"
