id: deep-link-detect

info:
  name: Android 深度链接识别（本地文件安全扫描）
  author: Hardik-Solanki
  severity: low
  description: |
    Android Deep Link 通过 Manifest 中的 Scheme、Host 和 Intent 配置，将外部 URI 映射到应用 Activity。深度链接是正常业务能力，但若入口缺少域名归属、参数校验和授权检查，可能被恶意链接或其他应用滥用。本模板在 XML 中同时匹配 `android:scheme`、`android:host` 和 Activity 相关标识，识别可能存在的深度链接配置，不直接判定可利用。
  impact: |
    - 攻击者可能构造链接打开未授权页面、预填充恶意参数或诱导用户执行敏感操作。
    - 授权回调和会话参数处理不当时，可能导致令牌泄露、账户绑定错误或跨应用数据暴露。
  remediation: |
    - 对 Web 链接启用经过域名验证的 App Links，并在 Activity 入口重新执行身份、权限和参数校验。
    - 拒绝未预期的 Scheme、Host、路径和重定向目标，避免在深度链接中传递长期凭据或直接执行高风险动作。
  reference:
    - https://developer.android.com/training/app-links/deep-linking
    - https://www.geeksforgeeks.org/deep-linking-in-android-with-example/
    - https://medium.com/@muratcanbur/intro-to-deep-linking-on-android-1b9fe9e38abd
  classification:
    cvss-metrics: CVSS:3.1/AV:N/AC:L/PR:N/UI:N/S:U/C:N/I:N/A:N
    cvss-score: 0
    cwe-id: CWE-200
  metadata:
    verified: true
  tags: android,file,deeplink

file:
  - extensions:
      - xml

    matchers-condition: and
    matchers:
      - type: word
        words:
          - "android:scheme"
          - "android:host"
          - "android:name"
        condition: and

