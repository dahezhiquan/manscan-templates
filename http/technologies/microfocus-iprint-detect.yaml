id: microfocus-iprint-detect

info:
  name: Micro Focus iPrint Appliance 指纹识别（指纹识别）
  author: righettod
  severity: info
  description: >-
    Micro Focus iPrint Appliance 是企业打印管理设备，用于集中发布、管理和审计网络打印服务。该模板通过请求目标服务并检查预设路径或首页响应、DSL
    条件、正则特征等指纹特征，判断目标是否使用或暴露了 Micro Focus iPrint Appliance 相关组件；命中结果仅表示指纹特征匹配，可用于资产盘点、技术栈识别和后续安全评估，不代表已确认存在可利用漏洞。
  reference:
  - https://www.opentext.com/products/enterprise-server
  metadata:
    verified: true
    max-request: 1
    shodan-query: http.html:"Micro Focus iPrint Appliance"
  tags: tech,microfocus,detect,discovery
http:
  - method: GET
    path:
      - "{{BaseURL}}/welcome/"

    matchers:
      - type: dsl
        dsl:
          - 'status_code == 200'
          - 'contains_any(to_lower(body), "micro focus iprint appliance", "/ippdocs/clients/", "micro focus iprint", "iprint appliance")'
        condition: and

    extractors:
      - type: regex
        part: body
        group: 1
        regex:
          - '(?i)/welcome/css/core([0-9]+).css'
