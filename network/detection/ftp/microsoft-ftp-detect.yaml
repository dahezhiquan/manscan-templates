id: microsoft-ftp-detect

info:
  name: Microsoft FTP 服务识别（指纹识别）
  author: pussycat0x
  severity: info
  description: |
    Microsoft FTP 是 FTP 服务实现、设备内置文件传输组件或 FTP 代理，常用于文件传输、设备配置、固件维护或旧系统集成。该模板连接 21/TCP 并读取协议响应，通过匹配 `Microsoft FTP Service` 等响应特征识别目标服务。
  metadata:
    product: microsoft-ftp
    max-request: 1
    verified: true
    shodan-query: 'product:"Microsoft ftpd"'
  tags: network,ftp,microsoft,detect,tcp,discovery

tcp:
  - host:
      - "{{Hostname}}"
    port: 21
    read-size: 4096

    matchers:
      - type: word
        name: microsoft-ftp
        part: raw
        words:
          - "Microsoft FTP Service"

    extractors:
      - type: regex
        name: detected_version
        part: raw
        group: 1
        regex:
          - (?mi)^220[^\r\n]*Microsoft FTP Service\s+\(Version\s+([0-9]+(?:[.][0-9]+)+(?:[-+._][0-9A-Za-z]+)*)\)
        internal: true
      - type: dsl
        dsl:
          - 'regex("^[0-9]+(?:[.][0-9]+)*(?:[-+._][0-9A-Za-z]+)*$", detected_version) ? detected_version : ""'
