id: citrix-xenmobile-version

info:
  name: Citrix XenMobile 版本 指纹识别（指纹识别）
  author: Puben
  severity: info
  description: |-
    Citrix XenMobile 版本 是移动设备和企业移动管理平台，用于设备注册、策略和应用管理。该模板请求首页、`/js/app/init.js`，并依据 HTTP 200 状态码、页面标题、正文关键字或品牌资源特征、DSL 条件识别目标是否使用或暴露了 Citrix XenMobile 版本 相关组件，适用于资产盘点、技术栈识别和后续安全评估；命中结果仅表示指纹特征匹配，不代表已确认存在可利用漏洞。
  classification:
    cpe: cpe:2.3:a:citrix:xenmobile_server:*:*:*:*:*:*:*:*
  metadata:
    verified: true
    max-request: 2
    vendor: citrix
    product: xenmobile_server
    shodan-query: "title:\"XenMobile - Console\""
  tags: tech,edb,citrix,version,detect,discovery
flow: http(1) && http(2)

http:
  - method: GET
    path:
      - '{{BaseURL}}'

    matchers:
      - type: dsl
        dsl:
          - 'status_code == 302'
          - 'contains(header, "Location: /zdm/login_xdm_uc.jsp")'
        condition: and
        internal: true

  - method: GET
    path:
      - '{{BaseURL}}/js/app/init.js'

    matchers-condition: and
    matchers:
      - type: regex
        name: version
        part: body
        regex:
          - 'v=([^"]+)'

      - type: status
        status:
          - 200

    extractors:
      - type: regex
        part: body
        group: 1
        regex:
          - 'v=([^"]+)'
