id: siemens-telecontrol-server-basic-panel

info:
  name: Telecontrol Server Basic 登录面板识别（指纹识别）
  author: Kazgangap
  severity: info
  description: |-
    Telecontrol Server Basic 是 Siemens 远程控制服务器，用于工业远程站点通信、遥测数据和自动化设备管理。该模板请求 `/login`、首页，并依据 DSL 条件识别目标是否部署了该系统或暴露了对应入口，适用于资产指纹确认；命中结果仅表示系统特征匹配，不代表已确认存在未授权访问或可利用漏洞。
  reference:
  - https://sieportal.siemens.com/en-ca/products-services/10087338?tree=CatalogTree
  metadata:
    verified: true
    max-request: 1
    vendor: siemens
    product: telecontrol_server_basic
    fofa-query: title=="Logon - Telecontrol Server Basic"
  tags: panel,login,siemens,detect,discovery

http:
  - method: GET
    path:
      - "{{BaseURL}}/login"
      - "{{BaseURL}}"

    host-redirects: true
    max-redirects: 2

    stop-at-first-match: true

    matchers:
      - type: dsl
        dsl:
          - 'contains_all(body, "Telecontrol Server Basic","login")'
          - "status_code == 200"
        condition: and
