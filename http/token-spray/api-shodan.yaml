id: api-shodan

info:
  name: Shodan API Token 可用性校验（token喷洒）
  author: 0ri2N
  severity: info
  description: |
    该模板通过调用 Shodan API 的已知接口验证提供的 token 是否有效，命中后通常表示可访问安全情报与资产查询能力。
  reference:
    - https://shodan.io
    - https://developer.shodan.io
    - https://developer.shodan.io/api
  metadata:
    max-request: 1
  tags: recon,shodan,token-spray

self-contained: true

http:
  - method: GET
    path:
      - https://api.shodan.io/api-info?key={{token}}

    matchers:
      - type: word
        part: body
        words:
          - '"plan"'
          - '"unlocked"'
          - '"scan_credits"'
        condition: and
