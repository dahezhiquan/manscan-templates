id: default-ssltls-test-page

info:
  name: SSL/TLS-aware 测试页面 指纹识别（指纹识别）
  author: dhiyaneshDk
  severity: info
  description: SSL/TLS-aware 测试页面 是 SSL/TLS 测试页面，用于验证站点是否通过加密通道提供服务。该模板请求首页，并依据页面标题、正文关键字或品牌资源特征识别目标是否使用或暴露了 SSL/TLS-aware 测试页面 相关组件，适用于资产盘点、技术栈识别和后续安全评估；命中结果仅表示指纹特征匹配，不代表已确认存在可利用漏洞。
  classification:
    cpe: cpe:2.3:a:apache:http_server:*:*:*:*:*:*:*:*
  metadata:
    max-request: 1
    vendor: apache
    product: http_server
    shodan-query: http.title:"Test Page for the SSL/TLS-aware Apache Installation on Web Site"
  tags: tech,ssl,discovery

http:
  - method: GET
    path:
      - '{{BaseURL}}'

    matchers:
      - type: word
        words:
          - "<TITLE>Test Page for the SSL/TLS-aware Apache Installation on Web Site</TITLE>"
        part: body
