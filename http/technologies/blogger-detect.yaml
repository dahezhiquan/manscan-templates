id: blogger-detect

info:
  name: Blogger 指纹识别（指纹识别）
  author: Chirag Mistry
  severity: info
  description: |
    用于识别目标是否部署 Blogger 并提取相关版本或构建信息，模板会结合 favicon 哈希、HTTP 响应头、页面正文、状态码、特定路径或已知端点和版本或标识提取结果进行指纹匹配。
  metadata:
    verified: true
    max-request: 7
  tags: blogger,detect,tech

http:
  - method: GET
    path:
      - "{{BaseURL}}"
      - "{{BaseURL}}/robots.txt"
      - "{{BaseURL}}/sitemap.xml"
      - "{{BaseURL}}/favicon.ico"
      - "{{BaseURL}}/blogger.js"
      - "{{BaseURL}}/feeds/posts/default"
      - "{{BaseURL}}/search"

    stop-at-first-match: true
    matchers-condition: and
    matchers:
      - type: word
        part: response
        words:
          - "Powered by Blogger"
          - "blogspot.com"
          - "X-Powered-By-Blogger"
          - "blogger.com"
        condition: or
        case-insensitive: true

      - type: status
        status:
          - 200

    extractors:
      - type: regex
        part: body
        name: version
        regex:
          - 'Blogger ([0-9.]+)'
          - 'Powered by Blogger ([0-9.]+)'

      - type: regex
        part: body
        name: blogger_id
        regex:
          - 'blogger-id=([a-z0-9]+)'
          - 'blogspot\.com/([^/]+)'
