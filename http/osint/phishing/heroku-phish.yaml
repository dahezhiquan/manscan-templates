id: heroku-phish

info:
  name: Heroku 仿冒钓鱼网站（钓鱼网站识别）
  author: rxerium
  severity: info
  description: |
    检测到疑似仿冒 Heroku 的钓鱼网站。模板在目标页面返回 200、页面内容命中 Heroku 的官方服务页面特征，且当前主机不属于 heroku.com 官方域名时触发，用于识别借用 Heroku 品牌页面诱导用户信任的仿冒站点。
  reference:
    - https://heroku.com
  metadata:
    max-request: 1
  tags: phishing,heroku,cloud,osint,discovery
http:
  - method: GET
    path:
      - "{{BaseURL}}"

    host-redirects: true
    max-redirects: 2

    matchers-condition: and
    matchers:
      - type: word
        words:
          - "Heroku is an AI platform as a service (AI PaaS) that enables developers to build, run, and scale applications entirely in the cloud."

      - type: status
        status:
          - 200

      - type: dsl
        dsl:
          - '!contains(host,"heroku.com")'
