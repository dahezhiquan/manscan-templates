id: smb-allow-unencrypted-passwords

info:
  name: SMB 允许发送未加密密码（本地基线扫描）
  author: princechaddha
  severity: high
  description: |
    SMB 允许发送未加密密码（本地基线扫描） 表示主机存在不符合安全基线的配置，可能削弱访问控制、审计能力或系统防护边界。对应基线项为“SMB 客户端是否允许向第三方 SMB 服务器发送未加密密码”；模板读取注册表 `HKLM:\SYSTEM\CurrentControlSet\Services\LanmanWorkstation\Parameters` 的 `EnablePlainTextPassword` 值，结合命中值判断策略是否不符合基线。
  impact: |
    - 凭据可能在网络中被截获并用于未授权访问。
    - 凭据保护不足会增加横向移动、远程登录和离线破解风险。
  remediation: |
    - 配置 SMB 禁止发送未加密密码，并使用现代 SMB 安全设置。
    - 变更策略后清理历史凭据，并轮换可能受影响的账户密码。
  tags: smb,password,unencrypted,code,windows-audit

self-contained: true

code:
  - pre-condition: |
      IsWindows();
    engine:
      - powershell
      - powershell.exe
    args:
      - -ExecutionPolicy
      - Bypass
    pattern: "*.ps1"
    source: |
      Get-ItemProperty -Path 'HKLM:\SYSTEM\CurrentControlSet\Services\LanmanWorkstation\Parameters' -Name 'EnablePlainTextPassword'

    matchers:
      - type: word
        words:
          - "EnablePlainTextPassword : 1"
