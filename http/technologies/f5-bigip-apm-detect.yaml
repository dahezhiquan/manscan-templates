id: f5-bigip-apm-detect

info:
  name: F5 BIG-IP APM 指纹识别（指纹识别）
  author: nodauf
  severity: info
  description: >-
    F5 BIG-IP APM 是 F5 BIG-IP 的访问策略管理模块，用于应用访问控制、身份认证和远程访问代理。该模板通过请求目标服务并检查预设路径或首页响应、页面正文关键字、状态码等指纹特征，判断目标是否使用或暴露了
    F5 BIG-IP APM 相关组件；命中结果仅表示指纹特征匹配，可用于资产盘点、技术栈识别和后续安全评估，不代表已确认存在可利用漏洞。
  reference:
  - https://my.f5.com/manage/s/article/K000138683
  classification:
    cpe: cpe:2.3:a:f5:big-ip_access_policy_manager:*:*:*:*:*:*:*:*
  metadata:
    verified: true
    max-request: 2
    vendor: f5
    product: big-ip_access_policy_manager
    shodan-query: html:"BIG-IP APM"
  tags: bigip,tech,f5,detect,discovery
http:
  - method: GET
    path:
      - "{{BaseURL}}/pre/config.php?version=2.0"
      - "{{BaseURL}}/pre/config.php?version=3.0"

    stop-at-first-match: true
    host-redirects: true
    max-redirects: 2

    matchers-condition: and
    matchers:
      - type: word
        part: body
        words:
          - 'F5 Networks'
          - '<PROFILE VERSION='
          - '<VERSION>'
        condition: and

      - type: status
        status:
          - 200
