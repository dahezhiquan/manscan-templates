id: sap-message-server-detect

info:
  name: SAP Message Server HTTP 指纹识别（指纹识别）
  author: LRVT,l4rm4nd
  severity: info
  description: >-
    SAP Message Server HTTP 接口是 SAP 系统消息服务器的 Web 入口，用于暴露实例和路由相关信息。该模板通过请求目标服务并检查预设路径或首页响应、HTTP
    响应头、页面正文关键字、正则特征等指纹特征，判断目标是否使用或暴露了 SAP Message Server HTTP 相关组件；命中结果仅表示指纹特征匹配，可用于资产盘点、技术栈识别和后续安全评估，不代表已确认存在可利用漏洞。
  metadata:
    max-request: 1
    shodan-query: http.html:SAP Message Server
  tags: sap,discovery,recon,detect
http:
  - method: GET
    path:
      - "{{RootURL}}"

    matchers:
      - type: word
        part: header
        words:
          - "SAP Message Server"

    extractors:
      - type: regex
        part: header
        name: version
        group: 1
        regex:
          - "(?i)server:\\s*(SAP Message Server[^\\r\\n]*)"
