id: notebook-python-polynote-panel

info:
  name: Polynote 面板识别（指纹识别）
  author: rxerium
  severity: info
  description: |-
    检测到目标站点存在 Polynote 相关响应特征。Polynote 是 AI、机器学习或 Notebook 相关平台，用于管理模型、数据集、工作区、实验、推理服务或训练任务。模板请求 `/`，并通过页面标题或正文关键字、状态码确认该系统指纹，用于资产识别、系统盘点和暴露面梳理。
  reference:
    - https://github.com/polynote/polynote
    - https://polynote.org
  metadata:
    verified: true
    max-request: 1
    vendor: polynote
    product: polynote
    shodan-query: 'http.title:"Polynote"'
  tags: panel,polynote,notebook,scala,python,detect,discovery
http:
  - method: GET
    path:
      - "{{BaseURL}}"

    host-redirects: true
    max-redirects: 2

    matchers-condition: and
    matchers:
      - type: word
        part: body
        words:
          - "<title>Polynote</title>"

      - type: status
        status:
          - 200
