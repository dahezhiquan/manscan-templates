id: gcloud-postgresql-log-checkpoints-disabled

info:
  name: PostgreSQL Log 检查points Flag未启用（云安全）
  author: princechaddha
  severity: medium
  description: PostgreSQL log_checkpoints 可记录检查点发生情况，帮助分析写入压力、恢复行为和性能异常。本模板检查 Cloud SQL PostgreSQL 实例 databaseFlags，发现相关配置为 off 时报告检查点日志未启用。
  impact: |
    - 数据库性能抖动、写入压力异常或恢复相关问题缺少检查点证据，排障和容量规划更困难。
    - 安全事件后的数据库状态分析可能缺少关键时间线信息。
  remediation: |
    - 为需要审计和性能可见性的 PostgreSQL 实例启用 log_checkpoints。
    - 将数据库日志接入集中日志平台，并结合写入延迟、磁盘和检查点指标建立监控。
  reference:
    - https://cloud.google.com/sql/docs/postgres/flags
  metadata:
    vendor: google
    product: cloud-sql
  tags: cloud,devops,gcp,gcloud,google-cloud-sql,postgresql,gcp-cloud-config

flow: |
  code(1)
  for(let projectId of iterate(template.projectIds)){
    set("projectId", projectId)
    code(2)
    for(let sqlInstance of iterate(template.sqlInstances)){
      set("sqlInstance", sqlInstance)
      code(3)
    }
  }

self-contained: true

code:
  - engine:
      - sh
      - bash
    source: |
      gcloud projects list --format="json(projectId)"

    extractors:
      - type: json
        name: projectIds
        internal: true
        json:
          - '.[].projectId'

  - engine:
      - sh
      - bash
    source: |
      gcloud sql instances list --project $projectId --filter='DATABASE_VERSION:POSTGRES*' --format="json(name)"

    extractors:
      - type: json
        name: sqlInstances
        internal: true
        json:
          - '.[].name'

  - engine:
      - sh
      - bash
    source: |
      gcloud sql instances describe $sqlInstance --format="json(settings.databaseFlags)"

    matchers:
      - type: word
        words:
          - 'off'

    extractors:
      - type: dsl
        dsl:
          - '"PostgreSQL Log Checkpoints flag is disabled in database instance: " + sqlInstance + " in project: " + projectId'
