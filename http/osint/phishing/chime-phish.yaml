id: chime-phish

info:
  name: Chime 仿冒钓鱼网站（钓鱼网站识别）
  author: rxerium
  severity: info
  description: |
    检测到疑似仿冒 Chime 的钓鱼网站。模板在目标页面返回 200、页面内容命中 Chime 的品牌页面特征，且当前主机不属于 chime.com 官方域名时触发，用于识别借用 Chime 品牌页面诱导用户信任的仿冒站点。
  reference:
    - https://chime.com
  metadata:
    max-request: 1
  tags: phishing,chime,fintech,osint,discovery
http:
  - method: GET
    path:
      - "{{BaseURL}}"

    host-redirects: true
    max-redirects: 2

    matchers-condition: and
    matchers:
      - type: word
        words:
          - 'Chime'
          - 'No monthly fees. 60k+ ATMs. Build credit. Get fee-free overdraft up to $200.'
        condition: and

      - type: status
        status:
          - 200

      - type: dsl
        dsl:
          - '!contains(host,"chime.com")'
