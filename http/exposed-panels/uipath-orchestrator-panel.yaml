id: uipath-orchestrator-panel

info:
  name: UiPath Orchestrator 登录面板识别（指纹识别）
  author: righettod
  severity: info
  description: |-
    UiPath Orchestrator 是 RPA 机器人编排平台，用于机器人、流程、队列、凭据和任务调度管理。该模板请求 `/Account/Login`，并依据 DSL 条件识别目标是否部署了该系统或暴露了对应入口，适用于资产指纹确认；命中结果仅表示系统特征匹配，不代表已确认存在未授权访问或可利用漏洞。
  reference:
  - https://www.uipath.com/
  classification:
    cpe: cpe:2.3:a:uipath:orchestrator:*:*:*:*:*:*:*:*
  metadata:
    verified: true
    max-request: 1
    vendor: uipath
    product: orchestrator
    shodan-query: http.title:"UiPath Orchestrator"
  tags: panel,uipath,login,detect,discovery

http:
  - method: GET
    path:
      - "{{BaseURL}}/Account/Login"

    matchers:
      - type: dsl
        dsl:
          - 'status_code == 200'
          - 'contains(to_lower(body), "<title>uipath orchestrator")'
        condition: and

    extractors:
      - type: regex
        part: body
        group: 1
        regex:
          - '\?(?:version|v)=([0-9.]+)'
