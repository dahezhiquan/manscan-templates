id: exposed-dockerd

info:
  name: Docker Daemon 暴露（服务漏洞）
  author: arafatansari
  severity: critical
  description: |
    Docker Daemon API 可创建容器、挂载主机目录、读取镜像和管理网络，通常只能通过本地 Unix socket 或受保护的 TLS 端点访问。该模板向 TCP 2375 发送 `GET /_ping` 请求，并通过 `Server: Docker` 与 `Api-Version` 响应确认未加固的 Docker API 暴露。
  impact: |
    - 攻击者可通过 Docker API 创建特权容器、挂载宿主机文件系统并获得宿主机控制能力。
    - 暴露的 Docker Daemon 还可能泄露镜像、环境变量、容器网络和业务配置。
  remediation: |
    - 禁止将未认证 Docker API 暴露到网络，关闭 TCP 2375 或仅绑定到本地接口。
    - 如确需远程管理，启用 TLS 客户端证书认证、来源 ACL 和最小权限运维通道。
  metadata:
    verified: true
    max-request: 1
    shodan-query: port:2375 product:"docker"
  tags: network,docker,exposure,tcp,discovery
tcp:
  - inputs:
      - data: "GET /_ping HTTP/1.0\r\n\r\n"

    host:
      - "{{Hostname}}"
    port: 2375

    matchers-condition: and
    matchers:
      - type: word
        words:
          - "Server: Docker"
      - type: word
        words:
          - "Api-Version:"
