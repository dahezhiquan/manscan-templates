id: leantime-install-page-exposed

info:
  name: Leantime 未完成安装ation
  author: 0x_Akoko
  severity: high
  description: |
    检测到 Leantime 未完成安装ation。该页面属于安装、初始化或配置向导流程，若对外暴露，攻击者可能完成初始化、创建管理员账户或重新配置目标系统。
  reference:
    - https://github.com/leantime/leantime
    - https://docs.leantime.io/installation/package-installation
  metadata:
    verified: true
    max-request: 1
    vendor: leantime
    product: leantime
    shodan-query: html:"Leantime" http.title:"Leantime"
    fofa-query: title="Leantime" && body="leantime-version"
  tags: misconfig,install,exposure,leantime

http:
  - method: GET
    path:
      - "{{BaseURL}}/install"

    matchers:
      - type: dsl
        dsl:
          - 'contains_all(body, "leantime-version", "create an administrator account")'
          - 'contains(content_type, "text/html")'
          - 'status_code == 200'
        condition: and
