id: max-password-age-too-high

info:
  name: 密码最长使用期限过长或无限制（本地基线扫描）
  author: princechaddha
  severity: medium
  description: |
    该模板检查最大密码使用期限是否过高或未限制。过长周期会延长泄露口令可用时间。
  impact: |
    一旦口令泄露，攻击者可能长期保持访问。
  remediation: |
    设置合理的最大密码期限，并结合 MFA、泄露检测和风险驱动轮换。
  tags: policy,code,windows-audit

self-contained: true

code:
  - pre-condition: |
      IsWindows();
    engine:
      - cmd
    args:
      - /c
    pattern: "*.cmd"
    source: |
      net accounts

    matchers:
      - type: word
        words:
          - "Maximum password age (days):                          0"
