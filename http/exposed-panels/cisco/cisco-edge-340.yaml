id: cisco-edge-340

info:
  name: Cisco Edge 340 面板识别（暴露面识别）
  author: dhiyaneshDk
  severity: info
  description: 该模板通过识别 Cisco Edge 340 面板、控制台或管理界面的页面特征，判断目标是否暴露了对应服务入口。若命中，说明该后台或运维界面对外可访问，可用于资产识别与暴露面排查。
  classification:
    cvss-metrics: CVSS:3.0/AV:N/AC:L/PR:N/UI:N/S:U/C:N/I:N/A:N
    cwe-id: CWE-200
    cpe: cpe:2.3:o:cisco:edge_340_firmware:*:*:*:*:*:*:*:*
  metadata:
    max-request: 1
    vendor: cisco
    product: edge_340_firmware
    shodan-query:
      - http.title:"Cisco Edge 340"
      - http.title:"cisco edge 340"
    fofa-query: title="cisco edge 340"
    google-query: intitle:"cisco edge 340"
  tags: panel,cisco,discovery

http:
  - method: GET
    path:
      - "{{BaseURL}}/auth/?next=%2F"

    matchers-condition: and
    matchers:
      - type: word
        part: body
        words:
          - "<title>Cisco Edge 340</title>"

      - type: status
        status:
          - 200
