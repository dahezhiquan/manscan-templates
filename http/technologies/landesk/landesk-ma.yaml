id: landesk-ma

info:
  name: LANDESK Management Agent 指纹识别（指纹识别）
  author: 0xNirvana
  severity: info
  description: >-
    LANDESK Management Agent 是 LANDESK/Ivanti 终端管理代理组件，用于终端资产、软件分发和策略执行。该模板通过请求目标服务并检查预设路径或首页响应、页面正文关键字等指纹特征，判断目标是否使用或暴露了
    LANDESK Management Agent 相关组件；命中结果仅表示指纹特征匹配，可用于资产盘点、技术栈识别和后续安全评估，不代表已确认存在可利用漏洞。
  classification:
    cpe: cpe:2.3:a:landesk:landesk_management_suite:*:*:*:*:*:*:*:*
  metadata:
    verified: true
    max-request: 1
    vendor: landesk
    product: landesk_management_suite
    shodan-query: http.html:"LANDESK(R)"
  tags: tech,landesk,discovery
http:
  - method: GET
    path:
      - "{{BaseURL}}"

    matchers:
      - type: word
        part: body
        words:
          - "LANDesk(R)"
          - "Management Agent"
        condition: and
