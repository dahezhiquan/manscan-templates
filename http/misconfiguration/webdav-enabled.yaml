id: webdav-enabled

info:
  name: WebDAV Protocol 检测
  author: tess
  severity: info
  description: |
    检测到 WebDAV Protocol 检测。目标响应或文件中可能暴露配置、凭据、密钥、令牌、环境变量或历史记录等敏感信息，可能被用于进一步入侵。
  remediation: |
    - 立即移除公开文件中的敏感信息并轮换已暴露的凭据、密钥和令牌。
    - 使用安全的密钥管理方案，并阻止配置、日志和历史文件被 Web 直接访问。
  reference:
    - https://www.acunetix.com/vulnerabilities/web/webdav-enabled/
  classification:
    cvss-metrics: CVSS:3.1/AV:N/AC:L/PR:N/UI:N/S:U/C:N/I:N/A:N
    cvss-score: 0
    cwe-id: CWE-200
  metadata:
    verified: true
    max-request: 3
    shodan-query: "Ms-Author-Via: DAV"
  tags: webdav,misconfig,exposure,vuln

http:
  - raw:
      - |
        GET / HTTP/1.1
        Host: {{Hostname}}
      - |
        OPTIONS / HTTP/1.1
        Host: {{Hostname}}
      - |
        OPTIONS / HTTP/1.1
        Host: {{Hostname}}
        Authorization: Basic YW5vbnltb3VzOmFub255bW91cw==

    stop-at-first-match: true
    matchers:
      - type: word
        part: header
        words:
          - "Ms-Author-Via: DAV"
