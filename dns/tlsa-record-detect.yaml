id: tlsa-record-detect

info:
  name: TLSA/DANE 记录识别（dns）
  author: rxerium
  severity: info
  description: |
    该模板检测 TLSA 记录。TLSA 记录用于 DANE，将 TLS 证书或公钥信息与 DNSSEC 保护的域名绑定。
  reference:
    - https://en.wikipedia.org/wiki/DNS-based_Authentication_of_Named_Entities
    - https://www.internetsociety.org/resources/deploy360/dane/
  classification:
    cwe-id: CWE-200
  metadata:
    max-request: 1
  tags: dns,tlsa,dane,ssl,discovery

dns:
  - name: "_443._tcp.{{FQDN}}"
    type: TLSA

    matchers:
      - type: regex
        part: answer
        regex:
          - "IN\tTLSA\t(.+)$"

    extractors:
      - type: regex
        group: 1
        regex:
          - "IN\tTLSA\t(.+)"
