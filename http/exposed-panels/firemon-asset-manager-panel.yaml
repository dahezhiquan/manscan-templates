id: firemon-asset-manager-panel

info:
  name: FireMon Asset Manager 登录面板（暴露面识别）
  author: rxerium
  severity: info
  description: |-
    FireMon Asset Manager 是一款网络安全安全管理平台，为防火墙、路由器及其他网络安全基础设施提供可视化、策略管理和合规性报告功能。
  reference:
    - https://www.firemon.com/
  metadata:
    max-request: 1
    shodan-query: 'http.title:"FireMon Asset Manager"'
  tags: panel,firemon,firewall,vpn

http:
  - method: GET
    path:
      - "{{BaseURL}}"

    redirects: true
    max-redirects: 2
    matchers-condition: and
    matchers:
      - type: word
        words:
          - 'FireMon Asset Manager'
        part: body

      - type: status
        status:
          - 200
