id: gcloud-pg-log-statement-flag-not-configured

info:
  name: Log Statement Flag 未Configured Properly 的PostgreSQL Database Instances（云安全）
  author: princechaddha
  severity: medium
  description: 该规则用于检查 GCP SQL 是否启用了日志记录、审计、监控或告警能力，以确保能够及时发现异常行为并满足审计与取证要求。
  impact: |
    - 缺少日志、审计或告警能力会削弱对异常活动的发现、响应与取证能力。
    - 安全事件可能因此长时间不被察觉，扩大影响范围并增加溯源难度。
  remediation: |
    - 启用必要的日志、审计、监控和告警能力，并确保日志输出到集中化、可审计的位置。
    - 为高风险事件设置实时通知与响应流程，避免关键安全事件长期无感知。
  reference:
    - https://cloud.google.com/sql/docs/postgres/flags
  tags: cloud,devops,gcp,gcloud,google-cloud-sql,postgresql,logging,gcp-cloud-config

flow: |
  code(1)
  for(let projectId of iterate(template.projectIds)){
    set("projectId", projectId)
    code(2)
    for(let sqlInstance of iterate(template.sqlInstances)){
      set("sqlInstance", sqlInstance)
      code(3)
    }
  }

self-contained: true

code:
  - engine:
      - sh
      - bash
    source: |
      gcloud projects list --format="json(projectId)"

    extractors:
      - type: json
        name: projectIds
        internal: true
        json:
          - '.[].projectId'

  - engine:
      - sh
      - bash
    source: |
      gcloud sql instances list --project $projectId --filter=DATABASE_VERSION:POSTGRES* --format="json(name)"

    extractors:
      - type: json
        name: sqlInstances
        internal: true
        json:
          - '.[].name'

  - engine:
      - sh
      - bash
    source: |
      gcloud sql instances describe $sqlInstance --project $projectId --format=json | jq -r '.settings.databaseFlags[]? | select(.name=="log_statement") | .value // "null"'

    matchers:
      - type: word
        words:
          - 'null'

    extractors:
      - type: dsl
        dsl:
          - '"The log_statement flag is not configured or is set to an inappropriate value for PostgreSQL instance " + sqlInstance + " in project " + projectId'
