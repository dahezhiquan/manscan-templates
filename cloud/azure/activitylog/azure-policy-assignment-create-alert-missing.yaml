id: azure-policy-assignment-create-alert-missing
info:
  name: Azure 策略分配创建告警未配置（云安全）
  author: princechaddha
  severity: high
  description: Azure Policy assignment 创建会决定哪些策略在管理组、订阅或资源组范围生效；未配置 Activity Log 告警时，策略治理边界变化可能不被及时发现。该模板枚举已启用的 Activity Log Alert，并检查告警条件中是否存在 Microsoft.Authorization/policyAssignments/write 操作。
  impact: |
    - 未授权主体可能部署过宽或绕过安全基线的策略，导致资源治理失效。
    - 错误策略也可能阻断生产部署、改变合规边界或造成大范围配置漂移。
  remediation: |
    - 创建针对策略分配创建操作的 Activity Log Alert，并接入策略管理员和安全团队。
    - 限制 policyAssignments/write 权限，要求策略变更经过审批、版本评审和范围复核。
  reference:
    - https://docs.microsoft.com/en-us/azure/azure-monitor/platform/alerts-activity-log
  metadata:
    vendor: microsoft
    product: azure-monitor
  tags: cloud,devops,azure,microsoft,azure-monitor,azure-cloud-config

flow: |
  code(1);
  for (let AlertData of iterate(template.alertList)) {
    set("id", AlertData);
    code(2);
  }

self-contained: true
code:
  - engine:
      - sh
      - bash
    source: |
      az monitor activity-log alert list --output json --query '[?(enabled==`true`)].id'

    extractors:
      - type: json
        name: alertList
        internal: true
        json:
          - '.[]'

  - engine:
      - sh
      - bash
    source: |
      az monitor activity-log alert show --ids "$id" --query 'condition'

    matchers:
      - type: word
        words:
          - "Microsoft.Authorization/policyAssignments/write"

    extractors:
      - type: dsl
        dsl:
          - 'id + " alert does not detect Create Policy Assignment events"'
