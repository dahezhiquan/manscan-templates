id: audible-phish

info:
  name: Audible 仿冒钓鱼网站（钓鱼网站识别）
  author: rxerium
  severity: info
  description: |
    检测到疑似仿冒 Audible 的钓鱼网站。模板在目标页面返回 200、页面内容命中 Audible 的品牌页面特征，且当前主机不属于 audible.com、amazon.com 官方域名时触发，用于识别借用 Audible 品牌页面诱导用户信任的仿冒站点。
  reference:
    - https://audible.com
  metadata:
    max-request: 1
  tags: phishing,audible,amazon,osint,discovery
http:
  - method: GET
    path:
      - "{{BaseURL}}"

    host-redirects: true
    max-redirects: 2

    matchers-condition: and
    matchers:
      - type: word
        words:
          - 'Audible'
          - 'Try Audible free for 30 days! Start listening to best-selling audiobooks, exclusive Originals, and free podcasts with the Audible app.'
        condition: and

      - type: status
        status:
          - 200

      - type: dsl
        dsl:
          - '!contains(host,"audible.com")'
          - '!contains(host,"amazon.com")'
