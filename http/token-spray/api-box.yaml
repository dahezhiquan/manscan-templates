id: api-box

info:
  name: Box API Token 可用性校验（token喷洒）
  author: daffainfo
  severity: info
  description: 该模板通过调用 Box API 的已知接口验证提供的 token 是否有效，命中后通常表示可访问文件存储与分发能力。
  reference:
    - https://developer.box.com/
    - https://github.com/daffainfo/all-about-apikey/tree/main/box
  metadata:
    max-request: 1
  tags: token-spray,box

self-contained: true

http:
  - raw:
      - |
        GET https://api.box.com/2.0/collections HTTP/1.1
        Host: api.box.com
        Authorization: Bearer {{token}}

    matchers:
      - type: word
        part: body
        words:
          - 'total_count":'
          - 'limit":'
        condition: and
