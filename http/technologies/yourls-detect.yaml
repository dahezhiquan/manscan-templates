id: yourls-detect

info:
  name: YOURLS 指纹识别（指纹识别）
  author: lstatro
  severity: info
  description: |
    用于识别目标是否部署 YOURLS 并提取相关版本或构建信息，模板会结合页面标题、页面正文、状态码、特定路径或已知端点和版本或标识提取结果进行指纹匹配。
  reference:
    - https://github.com/YOURLS/YOURLS
  classification:
    cpe: cpe:2.3:a:yourls:yourls:*:*:*:*:*:*:*:*
  metadata:
    verified: true
    max-request: 1
    vendor: yourls
    product: yourls
    shodan-query: title:"Your Own URL Shortener"
    fofa-query: title="Your Own URL Shortener"
  tags: tech,yourls,discovery

http:
  - method: GET
    path:
      - "{{BaseURL}}"

    redirects: true
    max-redirects: 3

    matchers-condition: and
    matchers:
      - type: word
        part: body
        words:
          - '<title>YOURLS'
          - 'content="YOURLS'
          - 'alt="YOURLS'
          - '/yourls-logo'
        condition: or

      - type: status
        status:
          - 200

    extractors:
      - type: regex
        part: body
        group: 1
        regex:
          - 'YOURLS<\/a>([ a-z0-9.-]+)'
          - 'content="YOURLS([ 0-9.]+)"'
