id: fastchat-panel

info:
  name: 检测 FastChat 面板（指纹识别）
  author: rxerium
  severity: info
  description: |-
    检测到目标站点存在 检测 FastChat 相关响应特征。FastChat 是大模型服务与对话系统框架，Web 面板用于访问模型对话、服务状态或推理接口。模板请求 `/`，并通过页面标题或正文关键字、状态码确认该系统指纹，用于资产识别、系统盘点和暴露面梳理。
  reference:
    - https://github.com/lm-sys/FastChat
    - https://github.com/lm-sys/FastChat/blob/main/fastchat/serve/gradio_web_server.py
  metadata:
    verified: true
    max-request: 1
    vendor: lm-sys
    product: fastchat
    shodan-query: 'html:"notice_markdown" html:"Chat with Open Large Language Models"'
  tags: panel,fastchat,llm,ai,detect,discovery
http:
  - method: GET
    path:
      - "{{BaseURL}}"

    host-redirects: true
    max-redirects: 2

    matchers-condition: and
    matchers:
      - type: word
        part: body
        words:
          - "Chat with Open Large Language Models"
          - "notice_markdown"
        condition: and

      - type: status
        status:
          - 200
