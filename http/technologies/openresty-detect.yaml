id: openresty-detect

info:
  name: OpenResty 指纹识别（指纹识别）
  author: jcockhren
  severity: info
  description: 用于识别目标是否部署 OpenResty 并提取相关版本或构建信息，模板会结合 HTTP 响应头、特定路径或已知端点和版本或标识提取结果进行指纹匹配。
  metadata:
    max-request: 1
    shodan-query: product:"OpenResty"
  tags: tech,openresty,discovery

http:
  - method: GET
    path:
      - "{{BaseURL}}"

    matchers:
      - type: word
        part: server
        words:
          - "openresty"

    extractors:
      - type: regex
        part: header
        regex:
          - 'openresty/[0-9.]+'
