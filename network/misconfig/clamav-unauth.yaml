id: clamav-unauth

info:
  name: ClamAV 未认证扫描服务访问（服务漏洞）
  author: dwisiswant0
  severity: high
  description: |
    ClamAV `clamd` 是常用于邮件网关、文件上传链路和主机侧文件扫描的反恶意软件守护进程。若 TCP 3310 扫描服务对不受信任网络开放，外部人员可能未认证提交扫描命令并探测服务行为。该模板发送针对随机不存在路径的 `SCAN` 请求，并通过 `No such` 与 `lstat() failed` 响应确认 clamd 可被访问。
  impact: |
    - 攻击者可确认内部安全扫描组件的存在、版本行为和部署边界，为规避检测或进一步攻击提供线索。
    - 暴露的扫描服务可能被滥用提交大量扫描请求，消耗 CPU、I/O 或进程资源，影响邮件与文件处理链路。
  remediation: |
    - 仅在本机或受信任内网监听 clamd TCP 服务，优先使用 Unix Socket 或防火墙限制访问来源。
    - 为调用 ClamAV 的业务链路增加认证和流量限制，避免任意主机直接访问扫描端口。
    - 检查 clamd 日志，确认是否存在异常扫描请求或资源耗尽迹象。
  reference:
    - https://seclists.org/nmap-dev/2016/q2/201
    - https://bugzilla.clamav.net/show_bug.cgi?id=11585
  metadata:
    verified: true
    max-request: 1
    shodan-query: port:3310 product:"ClamAV" version:"0.99.2"
  tags: network,clamav,unauth,seclists,misconfig,tcp,vuln
tcp:
  - inputs:
      - data: "SCAN /nonexistent/{{to_lower(rand_text_alpha(10))}}\r\n"
    host:
      - "{{Hostname}}"
    port: 3310
    read-size: 48

    matchers:
      - type: word
        words:
          - "No such"
          - "lstat() failed"
        condition: and
