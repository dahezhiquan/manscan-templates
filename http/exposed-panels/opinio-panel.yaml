id: opinio-panel

info:
  name: Opinio 登录面板识别（指纹识别）
  author: righettod
  severity: info
  description: |-
    检测到目标站点存在 Opinio 相关响应特征。Opinio 是 AI、机器学习或 Notebook 相关平台，用于管理模型、数据集、工作区、实验、推理服务或训练任务。模板请求 `/admin/folder.do`、`/` 路径，并通过页面标题或正文关键字、状态码、DSL 条件确认该系统指纹，用于资产识别、系统盘点和暴露面梳理。
  reference:
    - https://www.objectplanet.com/opinio/
  metadata:
    verified: true
    max-request: 2
    shodan-query: http.title:"Opinio"
  tags: panel,opinio,login,detect,discovery
http:
  - method: GET
    path:
      - "{{BaseURL}}/admin/folder.do"
      - "{{BaseURL}}"

    host-redirects: true
    max-redirects: 2

    matchers:
      - type: dsl
        dsl:
          - 'status_code_2 == 200'
          - 'contains_any(body_2, "<title>Opinio", ">Opinio ")'
        condition: and

    extractors:
      - type: regex
        part: body_1
        group: 1
        regex:
          - 'Opinio\s+([0-9.]+)'
