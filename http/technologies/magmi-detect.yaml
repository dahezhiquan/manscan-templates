id: magmi-detect

info:
  name: MAGMI Magento Mass Importer 指纹识别（指纹识别）
  author: dwisiswant0
  severity: info
  description: >-
    MAGMI 是 Magento Mass Importer 插件，用于批量导入 Magento 商品目录和属性数据。该模板通过请求目标服务并检查预设路径或首页响应、页面正文关键字、状态码等指纹特征，判断目标是否使用或暴露了
    MAGMI Magento Mass Importer 相关组件；命中结果仅表示指纹特征匹配，可用于资产盘点、技术栈识别和后续安全评估，不代表已确认存在可利用漏洞。
  classification:
    cpe: cpe:2.3:a:magmi_project:magmi:*:*:*:*:*:*:*:*
  metadata:
    verified: true
    max-request: 1
    vendor: magmi_project
    product: magmi
    shodan-query: http.component:"Magento"
  tags: magento,magmi,plugin,tech,discovery
http:
  - method: GET
    path:
      - "{{BaseURL}}/magmi/web/js/magmi_utils.js"

    matchers-condition: and
    matchers:
      - type: word
        words:
          - "magmi_multifield"
        part: body

      - type: status
        status:
          - 200
