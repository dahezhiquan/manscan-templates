id: file-disable-empty-password

info:
  name: SSH 空密码登录未禁用（本地文件安全扫描）
  author: pussycat0x
  severity: critical
  description: |
    `PermitEmptyPasswords` 控制 SSH 是否接受没有密码的账户登录。若未明确设置为 `no`，具体行为可能受 OpenSSH 默认值、发行版配置和其他认证方式影响；在可达 SSH 服务上允许空密码会形成直接未授权访问。本模板检查标准 `sshd_config` 上下文中是否缺少 `PermitEmptyPasswords no`，命中后需验证有效配置。
  impact: |
    - 空密码账户可能被无需凭据的远程攻击者直接登录，获得对应账户的文件和命令权限。
    - 若该账户可使用 sudo、转发或访问敏感服务，初始访问可能迅速升级为主机接管。
  remediation: |
    - 在有效的 `sshd_config` 中设置 `PermitEmptyPasswords no`，并确认 Include 文件和 Match 块没有覆盖该设置。
    - 清理空密码账户、禁用不需要的账户，限制 SSH 来源并使用密钥或 MFA 认证。
    - 用 `sshd -t` 验证配置后平滑重载服务，再从受控来源测试认证行为。
  reference:
    - https://vishalraj82.medium.com/hardening-openssh-security-37f5d634015f
    - https://docs.datadoghq.com/security/default_rules/xccdf-org-ssgproject-content-rule-sshd-disable-empty-passwords/
  metadata:
    verified: true
  tags: audit,config,file,ssh

file:
  - extensions:
      - all

    matchers-condition: and
    matchers:
      - type: word
        words:
          - "# This is the sshd server system-wide configuration file"

      - type: word
        words:
          - "PermitEmptyPasswords no"
        negative: true
