id: smartstore-detect

info:
  name: SmartStore 指纹识别（指纹识别）
  author: princechaddha
  severity: info
  description: >-
    SmartStore 是基于 .NET 的开源电商平台，用于商品、订单、支付和店铺管理。该模板通过请求目标服务并检查预设路径或首页响应、正则特征、状态码等指纹特征，判断目标是否使用或暴露了
    SmartStore 相关组件；命中结果仅表示指纹特征匹配，可用于资产盘点、技术栈识别和后续安全评估，不代表已确认存在可利用漏洞。
  reference:
  - https://github.com/smartstore/SmartStoreNET
  classification:
    cpe: cpe:2.3:a:smartstore:smartstore:*:*:*:*:*:*:*:*
  metadata:
    max-request: 1
    vendor: smartstore
    product: smartstore
    shodan-query: http.html:'content="Smartstore'
  tags: tech,smartstore,oss,discovery
http:
  - method: GET
    path:
      - "{{BaseURL}}"

    matchers-condition: and
    matchers:
      - type: regex
        part: body
        regex:
          - '<meta name="generator" content="Smartstore (.*)" />'

      - type: status
        status:
          - 200

    extractors:
      - type: regex
        part: body
        group: 1
        regex:
          - '<meta name="generator" content="Smartstore (.*)" />'
