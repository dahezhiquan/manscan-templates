id: gcloud-gke-secrets-encryption-disabled

info:
  name: GKE Clusters 未启用Application-Layer Secrets 加密（云安全）
  author: princechaddha
  severity: high
  description: GKE Application-Layer Secrets Encryption 可使用 Cloud KMS 对 Kubernetes Secret 进行应用层加密。本模板检查数据库加密配置中的 keyName，值为 null 时报告集群未启用应用层 Secrets 加密。
  impact: |
    - Kubernetes Secret 缺少客户管理的应用层加密控制，降低敏感凭据的密钥隔离和审计能力。
    - 对受监管工作负载，未使用 KMS 加密可能不满足组织的密钥自主控制要求。
  remediation: |
    - 为集群配置 Application-Layer Secrets Encryption，并授予 GKE 使用 Cloud KMS 密钥所需权限。
    - 复核并轮换历史 Secret，确保密钥轮换、备份和恢复流程可用。
  reference:
    - https://cloud.google.com/kubernetes-engine/docs/how-to/encrypting-secrets
    - https://www.trendmicro.com/cloudoneconformity/knowledge-base/gcp/GKE/enable-application-layer-secrets-encryption.html
  metadata:
    vendor: google
    product: google-kubernetes-engine
  tags: cloud,devops,gcp,gcloud,gke,kubernetes,security,encryption,secret,gcp-cloud-config

flow: |
  code(1)
  for(let projectId of iterate(template.projectIds)){
    set("projectId", projectId)
    code(2)
    for(let cluster of iterate(template.clusters)){
      cluster = JSON.parse(cluster)
      set("clusterName", cluster.name)
      set("location", cluster.location)
      code(3)
    }
  }

self-contained: true

code:
  - engine:
      - sh
      - bash
    source: |
      gcloud projects list --format="json(projectId)"

    extractors:
      - type: json
        name: projectIds
        internal: true
        json:
          - '.[].projectId'

  - engine:
      - sh
      - bash
    source: |
      gcloud container clusters list --project $projectId --format="json(name,location)"

    extractors:
      - type: json
        name: clusters
        internal: true
        json:
          - '.[]'

  - engine:
      - sh
      - bash
    source: |
      gcloud container clusters describe $clusterName --location $location --project $projectId --format="yaml(databaseEncryption.keyName,conditions)"

    matchers:
      - type: word
        words:
          - "null"

    extractors:
      - type: dsl
        dsl:
          - '"GKE cluster " + clusterName + " in " + location + " of project " + projectId + " does not have application-layer secrets encryption enabled"'
