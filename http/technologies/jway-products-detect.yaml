id: jway-products-detect

info:
  name: JWay Products 指纹识别（指纹识别）
  author: righettod
  severity: info
  description: >-
    JWay 相关产品用于企业应用或管理系统场景，Web 页面中的固定标识可用于确认目标是否部署该产品。该模板通过请求目标服务并检查预设路径或首页响应、页面正文关键字、正则特征、DSL
    条件等指纹特征，判断目标是否使用或暴露了 JWay Products 相关组件；命中结果仅表示指纹特征匹配，可用于资产盘点、技术栈识别和后续安全评估，不代表已确认存在可利用漏洞。
  reference:
  - https://www.jway.eu/produits-services
  metadata:
    max-request: 1
    verified: true
  tags: panel,jway,detect,discovery
http:
  - method: GET
    path:
      - "{{BaseURL}}/generatedHomepage.html"

    matchers:
      - type: dsl
        dsl:
          - 'status_code == 200'
          - 'contains_any(to_lower(body), "jway.footer.url.help", "jway.footer.url.contact", "jway.footer.url.legal")'
        condition: and

    extractors:
      - type: regex
        part: body
        group: 1
        regex:
          - '(?i)Produced\s+by\s+Form([a-z]+)'

      - type: regex
        part: body
        group: 1
        regex:
          - 'Form(?:[a-zA-Z]+)\s+v([0-9.]+)'
