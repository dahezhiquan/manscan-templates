id: barclays-phish

info:
  name: Barclays 仿冒钓鱼网站（钓鱼网站识别）
  author: rxerium
  severity: info
  description: |
    检测到疑似仿冒 Barclays 的钓鱼网站。模板在目标页面返回 200、页面内容命中 Barclays 的品牌页面特征，且当前主机不属于 barclays.com、home.barclays 官方域名时触发，用于识别借用 Barclays 品牌页面诱导用户信任的仿冒站点。
  reference:
    - https://barclays.com
  metadata:
    max-request: 1
  tags: phishing,barclays,bank,osint,discovery
http:
  - method: GET
    path:
      - "{{BaseURL}}"

    host-redirects: true
    max-redirects: 2

    matchers-condition: and
    matchers:
      - type: word
        words:
          - 'Barclays'
          - '<title>Barclays Group corporate website | Barclays'
        condition: and

      - type: status
        status:
          - 200

      - type: dsl
        dsl:
          - '!contains(host,"barclays.com")'
          - '!contains(host,"home.barclays")'
        condition: and
