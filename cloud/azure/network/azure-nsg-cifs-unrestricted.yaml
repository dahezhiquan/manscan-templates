id: azure-nsg-cifs-unrestricted
info:
  name: Azure NSG 对互联网开放 CIFS 端口 445（云安全）
  author: princechaddha
  severity: high
  description: CIFS/SMB 通常使用 TCP 445 承载文件共享和 Windows 网络服务，直接暴露在互联网会扩大远程文件服务的攻击面，并可能暴露共享资源或遭受口令喷洒和协议漏洞利用。本模板查询入站允许的 TCP 445 NSG 规则，并在来源地址为 *、internet 或 any 时报告。
  impact: |
    - 攻击者可对 SMB 服务进行扫描、认证尝试和漏洞探测，可能导致共享文件泄露或主机被进一步控制。
    - 被攻陷的文件服务可能成为凭据窃取、恶意文件传播和云内横向移动的入口。
  remediation: |
    - 删除面向互联网的 TCP 445 入站允许规则，仅通过私有网络、VPN 或明确的受信任源地址访问。
    - 对必须提供文件共享的场景启用最小权限、强认证和 SMB 安全策略，并持续审计访问日志。
  reference:
    - https://docs.microsoft.com/en-us/azure/virtual-network/network-security-groups-overview
  metadata:
    vendor: microsoft
    product: azure-network-security-group
  tags: cloud,devops,azure,microsoft,nsg,azure-cloud-config

flow: |
  code(1);
  for (let NsgData of iterate(template.nsgdata)) {
    NsgData = JSON.parse(NsgData)
    set("nsg", NsgData.name)
    set("resourcegroup", NsgData.resourceGroup)
    code(2)
  }

self-contained: true
code:
  - engine:
      - sh
      - bash
    source: |
      az network nsg list --query '[*].{name:name, resourceGroup:resourceGroup}' --output json

    extractors:
      - type: json
        name: nsgdata
        internal: true
        json:
          - '.[]'

  - engine:
      - sh
      - bash
    source: |
      az network nsg rule list --nsg-name $nsg --resource-group $resourcegroup --query "[?direction=='Inbound' && access=='Allow' && protocol=='TCP' && (destinationPortRange=='445')]"

    matchers:
      - type: word
        words:
          - '"sourceAddressPrefix": "*"'
          - '"sourceAddressPrefix": "internet"'
          - '"sourceAddressPrefix": "any"'

    extractors:
      - type: dsl
        dsl:
          - 'nsg + " has unrestricted access on TCP port 445"'
