id: latemodel-restoration-phish

info:
  name: Late Model Restoration 仿冒钓鱼网站（钓鱼网站识别）
  author: rxerium
  severity: info
  description: |
    检测到疑似仿冒 Late Model Restoration 的钓鱼网站。模板在目标页面返回 200、页面内容命中 Late Model Restoration 的品牌页面特征，且当前主机不属于 lmr.com 官方域名时触发，用于识别借用 Late Model Restoration 品牌页面诱导用户信任的仿冒站点。
  reference:
    - https://lmr.com
  metadata:
    max-request: 1
  tags: phishing,latemodel-restoration,ecommerce,osint,discovery
http:
  - method: GET
    path:
      - "{{BaseURL}}"

    host-redirects: true
    max-redirects: 2

    matchers-condition: and
    matchers:
      - type: word
        words:
          - "lmr.com"
          - '<title>Ford Mustang Parts &amp; Accessories | Late Model Restoration'
        condition: and

      - type: status
        status:
          - 200

      - type: dsl
        dsl:
          - '!contains(host,"lmr.com")'
