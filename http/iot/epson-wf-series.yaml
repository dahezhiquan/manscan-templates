id: epson-wf-series

info:
  name: Epson WF 系列打印机识别（IOT）
  author: aashiq
  severity: low
  description: |
    检测到 Epson WF 系列打印机。该模板通过页面特征识别域内或目标环境中的 Epson 多功能打印设备。
  impact: |
    - 打印机 Web 面板暴露可能泄露设备型号、网络配置、耗材状态和打印服务入口。
    - 在配置不当时，攻击者可能滥用打印服务、修改设备设置或获取作业信息。
  remediation: |
    - 限制打印机 Web 管理页面仅办公内网或管理网段访问。
    - 启用管理员认证，修改默认口令并升级打印机固件。
    - 关闭不必要的远程管理、匿名访问和未使用的打印协议。
  metadata:
    max-request: 1
  tags: iot,printer,discovery

http:
  - method: GET
    path:
      - "{{BaseURL}}/PRESENTATION/HTML/TOP/PRTINFO.HTML"

    matchers-condition: and
    matchers:
      - type: status
        status:
          - 200

      - type: word
        words:
          - "SEIKO EPSON"
