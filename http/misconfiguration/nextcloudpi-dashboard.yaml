id: nextcloudpi-dashboard

info:
  name: NextcloudPi 仪表盘 暴露
  author: ritikchaddha
  severity: high
  description: |
    检测到 NextcloudPi 仪表盘 暴露。目标响应或文件中可能暴露配置、凭据、密钥、令牌、环境变量或历史记录等敏感信息，可能被用于进一步入侵。
  remediation: |
    - 立即移除公开文件中的敏感信息并轮换已暴露的凭据、密钥和令牌。
    - 使用安全的密钥管理方案，并阻止配置、日志和历史文件被 Web 直接访问。
  reference:
    - https://github.com/nextcloud/nextcloudpi
  metadata:
    verified: true
    max-request: 1
    vendor: nextcloud
    product: nextcloudpi
    shodan-query: title:"NextcloudPi Panel"
    fofa-query: title="NextcloudPi Panel"
  tags: nextcloud,nextcloudpi,dashboard,misconfig,exposed,discovery

http:
  - method: GET
    path:
      - "{{BaseURL}}/?app=config"

    matchers:
      - type: dsl
        dsl:
          - "contains_any(body, 'Power Off', 'Nextcloud configuration')"
          - "status_code==200"
        condition: and
