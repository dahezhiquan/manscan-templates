id: windows-update-service-disabled

info:
  name: Windows Update 服务已禁用（本地基线扫描）
  author: princechaddha
  severity: high
  description: |
    该模板检查 Windows Update 服务是否禁用。服务关闭会阻止系统接收安全更新。
  impact: |
    主机将持续暴露于已修复漏洞，增加被利用风险。
  remediation: |
    启用并正确配置 Windows Update 服务，确保补丁可正常下载和安装。
  tags: windows,code,windows-audit

self-contained: true

code:
  - pre-condition: |
      IsWindows();
    engine:
      - powershell
      - powershell.exe
    args:
      - -ExecutionPolicy
      - Bypass
    pattern: "*.ps1"
    source: |
      (Get-Service -Name wuauserv).Status

    matchers:
      - type: word
        words:
          - "Stopped"
