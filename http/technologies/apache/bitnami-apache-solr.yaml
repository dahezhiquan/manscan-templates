id: bitnami-apache-solr

info:
  name: Bitnami Apache Solr Stack 指纹识别（指纹识别）
  author: Th3l0newolf
  severity: info
  description: |-
    Bitnami Apache Solr Stack 是搜索平台，用于全文检索、索引管理和搜索服务。该模板请求首页，并依据 DSL 条件识别目标是否使用或暴露了 Bitnami Apache Solr Stack 相关组件，适用于资产盘点、技术栈识别和后续安全评估；命中结果仅表示指纹特征匹配，不代表已确认存在可利用漏洞。
  classification:
    cvss-metrics: CVSS:3.0/AV:N/AC:L/PR:N/UI:N/S:U/C:N/I:N/A:N
    cwe-id: CWE-200
  metadata:
    max-request: 1
    verified: true
    shodan-query: html:"Bitnami Apache Solr Stack"
  tags: detect,apache,solr,bitnami,discovery,tech

http:
  - method: GET
    path:
      - "{{BaseURL}}"

    host-redirects: true
    max-redirects: 3

    matchers:
      - type: dsl
        dsl:
          - 'status_code == 200'
          - 'contains(body, "Bitnami Apache Solr Stack")'
        condition: and
