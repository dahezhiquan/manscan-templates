id: gocontrol-event-admin-panel

info:
  name: Go.Control Event Administration 面板识别（指纹识别）
  author: Mys7ic
  severity: info
  description: |-
    检测到目标站点存在 Go.Control Event Administration 相关响应特征。Go.Control Event Administration 是监控、日志、分析或可观测性系统，用于展示运行指标、告警事件、日志数据和服务状态。模板请求 `/admin/`、`/admin/index.php` 路径，并通过页面标题或正文关键字、状态码确认该基础设施指纹；命中结果主要用于威胁狩猎、恶意基础设施识别和外部暴露面梳理。
  reference:
    - https://www.go-control.de/
  classification:
    cvss-metrics: CVSS:3.0/AV:N/AC:L/PR:N/UI:N/S:U/C:N/I:N/A:N
    cwe-id: CWE-200
  metadata:
    verified: true
    max-request: 1
    vendor: go-control
    product: gocontrol
    fofa-query: title="Go.Control"
    zoomeye-query: title="Go.Control"
  tags: panel,gocontrol,login,detect,discovery
http:
  - method: GET
    path:
      - "{{BaseURL}}/admin/"
      - "{{BaseURL}}/admin/index.php"

    stop-at-first-match: true
    host-redirects: true
    max-redirects: 2

    matchers-condition: and
    matchers:
      - type: word
        part: body
        words:
          - '<title>Event Administration | Superuser Login'

      - type: status
        status:
          - 200
