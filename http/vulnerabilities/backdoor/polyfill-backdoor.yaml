id: polyfill-backdoor

info:
  name: Polyfill.io - 后门检测
  author: kazet
  severity: high
  description: |
    该模板用于检测 Polyfill.io - 后门检测。命中通常表示目标存在后门、植入组件、恶意脚本或可疑未授权入口。模板通过构造特定请求与响应匹配逻辑进行探测，并根据响应中的 `<script[^>]* src=['"]https?://([a-zA-Z0-9-]*.)?polyfill.io[/'"]` 等特征确认漏洞是否存在。
  impact: |
    - 命中通常表示目标存在后门、植入组件或可疑恶意脚本，攻击者可能已具备未授权访问能力。
    - 后门可能被用于执行命令、窃取数据、维持持久化访问或作为进一步入侵的跳板。
  remediation: |
    - 立即隔离受影响资产，保留证据并开展入侵排查，不要仅删除单个可疑文件后恢复上线。
    - 清理后门文件、恶意脚本、异常账号、计划任务和持久化项，并从可信介质重建受影响组件。
    - 升级相关产品，轮换系统、数据库、应用和第三方集成凭据。
  reference:
    - https://sansec.io/research/polyfill-supply-chain-attack
    - https://web.archive.org/web/20240229113710/https://github.com/polyfillpolyfill/polyfill-service/issues/2834
    - https://blog.cloudflare.com/polyfill-io-now-available-on-cdnjs-reduce-your-supply-chain-risk
  metadata:
    verified: true
    max-request: 1
    shodan-query: html:"polyfill.io"
  tags: cdn,polyfill-io,backdoor,malware,vuln

http:
  - method: GET
    path:
      - "{{BaseURL}}"

    redirects: true
    max-redirects: 1

    matchers-condition: and
    matchers:
      - type: regex
        part: body
        regex:
          - "<script[^>]* src=['\"]https?://([a-zA-Z0-9-]*.)?polyfill.io[/'\"]"
