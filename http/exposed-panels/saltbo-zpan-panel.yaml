id: saltbo-zpan-panel

info:
  name: Saltbo/zpan 面板识别（暴露面识别）
  author: ritikchaddha
  severity: info
  description: |
    该模板通过识别 Saltbo/zpan 面板、控制台或管理界面的页面特征，判断目标是否暴露了对应服务入口。若命中，说明该后台或运维界面对外可访问，可用于资产识别与暴露面排查。
  reference:
    - https://github.com/saltbo/zpan
  classification:
    cpe: cpe:2.3:a:saltbo:zpan:*:*:*:*:*:*:*:*
  metadata:
    verified: true
    max-request: 1
    vendor: saltbo
    product: zpan
    fofa-query: title="zpan"
    shodan-query: title:"zpan"
  tags: panel,zpan,login,detect,discovery

http:
  - method: GET
    path:
      - "{{BaseURL}}"

    host-redirects: true

    matchers-condition: and
    matchers:
      - type: word
        part: body
        words:
          - "<title>ZPan"

      - type: status
        status:
          - 200
