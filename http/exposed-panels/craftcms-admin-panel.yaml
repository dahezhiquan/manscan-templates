id: craftcms-admin-panel

info:
  name: Craft CMS Admin 登录面板识别（暴露面识别）
  author: Supr4s
  severity: info
  description: 该模板通过识别 Craft CMS Admin 登录入口的页面标题、特征文本或重定向行为，判断目标是否暴露了对应的认证界面。若命中，说明该登录面板对外可访问，可用于暴露面梳理与后续安全评估。
  classification:
    cvss-metrics: CVSS:3.0/AV:N/AC:L/PR:N/UI:N/S:U/C:N/I:N/A:N
    cwe-id: CWE-200
    cpe: cpe:2.3:a:nystudio107:seomatic:*:*:*:*:craft_cms:*:*:*
  metadata:
    max-request: 1
    vendor: nystudio107
    product: seomatic
    shodan-query:
      - 'X-Powered-By: Craft CMS'
      - "x-powered-by: craft cms"
      - 'x-powered-by: craft cms html:"seomatic"'
  tags: panel,craftcms,nystudio107,discovery

http:
  - method: GET
    path:
      - '{{BaseURL}}/admin/login'

    matchers-condition: or
    matchers:
      - type: word
        part: body
        words:
          - 'title="Powered by Craft CMS"'

      - type: word
        part: body
        words:
          - '<a id=\"poweredby\" href=\"http:\/\/craftcms.com\/\"'
