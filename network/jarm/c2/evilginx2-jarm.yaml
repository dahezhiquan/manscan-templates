id: evilginx2-jarm

info:
  name: EvilGinx2 JARM 识别（C2 识别）
  author: pussycat0x
  severity: high
  description: |
    EvilGinx2 是常用于中间人式钓鱼和会话令牌窃取的反向代理框架。该模板计算目标 TLS 服务的 JARM 指纹，并与已知 EvilGinx2 基础设施指纹匹配，用于识别疑似钓鱼代理或相关控制基础设施。
  reference:
    - https://github.com/cedowens/C2-JARM
    - https://github.com/kgretzky/evilginx2
  metadata:
    max-request: 1
  tags: jarm,network,c2,ir,osint,cti,evilginx2,phishing,tcp,vuln
tcp:
  - inputs:
      - data: 2E
        type: hex
    host:
      - "{{Hostname}}"
    matchers:
      - type: dsl
        dsl:
          - "jarm(Hostname) == '20d14d20d21d20d20c20d14d20d20daddf8a68a1444c74b6dbe09910a511e6'"
