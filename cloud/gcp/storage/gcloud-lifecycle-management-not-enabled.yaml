id: gcloud-lifecycle-management-not-enabled

info:
  name: Enable Lifecycle Management 的Cloud Storage Objects（云安全）
  author: princechaddha
  severity: medium
  description: Cloud Storage lifecycle management 可按年龄、版本和状态自动迁移或删除对象，缺失时容易造成过期数据长期留存。本模板执行 gsutil lifecycle get，返回 no lifecycle configuration 时报告 bucket 未启用生命周期管理。
  impact: |
    - 过期、临时或旧版本对象长期保留会增加数据暴露面和存储成本。
    - 缺少自动化生命周期策略会让数据保留依赖人工清理，容易产生合规偏差。
  remediation: |
    - 为 bucket 配置生命周期规则，按数据分类自动归档、降级存储或删除过期对象。
    - 定期复核生命周期规则与业务保留要求、Bucket Lock 和版本控制策略是否一致。
  reference:
    - https://cloud.google.com/storage/docs/lifecycle
  metadata:
    vendor: google
    product: cloud-storage
  tags: cloud,devops,gcp,gcloud,google-cloud-storage,lifecycle-management,cost-optimization,gcp-cloud-config

flow: |
  code(1)
  for(let projectId of iterate(template.projectIds)){
    set("projectId", projectId)
    code(2)
    for(let bucketName of iterate(template.buckets)){
      set("bucketName", bucketName)
      code(3)
    }
  }

self-contained: true

code:
  - engine:
      - sh
      - bash
    source: |
      gcloud projects list --format="json(projectId)"

    extractors:
      - type: json
        name: projectIds
        internal: true
        json:
          - '.[].projectId'

  - engine:
      - sh
      - bash
    source: |
      gsutil ls -p $projectId | jq -R . | jq -s .

    extractors:
      - type: json
        name: buckets
        internal: true
        json:
          - '.[]'

  - engine:
      - sh
      - bash
    source: |
      gsutil lifecycle get $bucketName

    matchers:
      - type: word
        words:
          - 'no lifecycle configuration'

    extractors:
      - type: dsl
        dsl:
          - '"The bucket " + bucketName + " in project " + projectId + " does not have lifecycle management rules enabled."'
