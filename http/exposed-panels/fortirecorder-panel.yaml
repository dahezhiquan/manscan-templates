id: fortirecorder-panel

info:
  name: FortiRecorder 面板识别（暴露面识别）
  author: rxerium
  severity: info
  description: |
    该模板通过识别 FortiRecorder 面板、控制台或管理界面的页面特征，判断目标是否暴露了对应服务入口。若命中，说明该后台或运维界面对外可访问，可用于资产识别与暴露面排查。
  reference:
    - https://www.fortinet.com/content/dam/fortinet/assets/data-sheets/FortiRecorder.pdf
  metadata:
    max-request: 1
    verified: true
    shodan-query: title:FortiRecorder
    fofa-query: title="FortiRecorder"
  tags: fortinet,fortirecorder,login,panel,discovery

http:
  - method: GET
    path:
      - "{{BaseURL}}/admin/"

    matchers-condition: and
    matchers:
      - type: word
        words:
          - "FortiRecorder Admin"
          - "Log In"
        condition: and

      - type: status
        status:
          - 200
