id: webcalendar-install

info:
  name: WebCalendar 暴露 安装
  author: ritikchaddha
  severity: high
  description: |
    检测到 WebCalendar 暴露 安装。该页面属于安装、初始化或配置向导流程，若对外暴露，攻击者可能完成初始化、创建管理员账户或重新配置目标系统。
  classification:
    cpe: cpe:2.3:a:k5n:webcalendar:*:*:*:*:*:*:*:*
  metadata:
    verified: true
    max-request: 1
    vendor: k5n
    product: webcalendar
    shodan-query: title:"WebCalendar Setup Wizard"
    fofa-query: title="WebCalendar Setup Wizard"
  tags: misconfig,webcalendar,install,vuln

http:
  - method: GET
    path:
      - "{{BaseURL}}/install/index.php"

    matchers-condition: and
    matchers:
      - type: word
        words:
          - '<title>WebCalendar Setup Wizard'
          - '>WebCalendar Installation Wizard'
        condition: or

      - type: status
        status:
          - 200
