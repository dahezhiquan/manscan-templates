id: CNVD-2021-32799

info:
  name: 360 天擎终端安全管理系统 SQL 注入漏洞（CNVD-2021-32799）
  author: SleepingBag945
  severity: high
  description: |
    360 天擎终端安全管理系统的报表同步接口存在 SQL 注入相关风险，攻击者可通过可访问的 `rptsvcsyncpoint` 接口探测受影响组件。模板请求 `ccid=1` 并匹配 JSON 中的报表同步字段确认目标暴露该风险接口。
  impact: |
    - 攻击者可能借助受影响接口进一步读取或篡改终端安全管理平台数据。
    - 终端安全平台被攻击后，可能影响客户端升级、策略下发和安全事件处置能力。
  remediation: |
    - 升级 360 天擎终端安全管理系统至修复版本，修复报表同步接口的 SQL 注入缺陷。
    - 限制管理平台接口访问来源，禁止公网直接访问。
    - 审计接口访问日志和平台策略变更，确认未出现异常查询或配置修改。
  reference:
    - https://blog.51cto.com/u_9691128/4295047
    - https://www.cnvd.org.cn/patchInfo/show/270651
    - https://github.com/zan8in/afrog/blob/main/v2/pocs/afrog-pocs/CNVD/2021/CNVD-2021-32799.yaml
  metadata:
    verified: true
    max-request: 1
    fofa-query: app="360新天擎"
  tags: cnvd2021,cnvd,360,xintianqing,sqli,vuln

http:
  - method: GET
    path:
      - '{{BaseURL}}/api/dp/rptsvcsyncpoint?ccid=1'

    matchers-condition: and
    matchers:
      - type: word
        part: body
        words:
          - '"reason":'
          - '"success"'
          - '"antiadwa":'
          - '"clientupgrade":'
        condition: and

      - type: word
        part: header
        words:
          - 'application/json'

      - type: status
        status:
          - 200
