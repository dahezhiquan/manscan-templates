id: ssh-auth-methods

info:
  name: SSH 认证方式识别（指纹识别）
  author: Ice3man543
  severity: info
  description: |
    该模板枚举 SSH 服务器支持的认证方式，如密码、公钥与 keyboard-interactive 等。
  reference:
    - https://nmap.org/nsedoc/scripts/ssh-auth-methods.html
  metadata:
    max-request: 1
    shodan-query: product:"OpenSSH"
  tags: js,detect,ssh,enum,network,discovery

javascript:
  - pre-condition: |
      isPortOpen(Host,Port);
    code: |
      var m = require("nuclei/ssh");
      var c = m.SSHClient();
      var response = c.ConnectSSHInfoMode(Host, Port);
      Export(response);
    args:
      Host: "{{Host}}"
      Port: "22"

    extractors:
      - type: json
        json:
          - '.UserAuth'
