id: linkding-panel

info:
  name: Linkding 面板 - 检测（指纹识别）
  author: ChrisJr404
  severity: info
  description: |-
    检测到目标站点存在 Linkding 相关响应特征。Linkding 是一套通过 Web 提供访问的管理面板或业务系统，通常用于配置服务、查看状态、管理数据或执行日常运维操作。模板请求 `/`，并通过页面标题或正文关键字、状态码、DSL 条件确认该系统指纹，用于资产识别、系统盘点和暴露面梳理。
  reference:
    - https://github.com/sissbruecker/linkding
    - https://linkding.link/
  metadata:
    verified: false
    max-request: 2
    vendor: sissbruecker
    product: linkding
    shodan-query: http.title:"Linkding"
    fofa-query: title="Linkding"
  tags: panel,linkding,bookmarks,selfhosted,detect,discovery
http:
  - method: GET
    path:
      - "{{BaseURL}}"

    host-redirects: true
    max-redirects: 2

    matchers:
      - type: dsl
        dsl:
          - 'status_code == 200'
          - 'contains_all(to_lower(body), "self-hosted bookmark service", "linkding")'
        condition: and
