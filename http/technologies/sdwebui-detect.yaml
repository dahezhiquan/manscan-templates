id: sdwebui-detect

info:
  name: Stable Diffusion WebUI 指纹识别（指纹识别）
  author: rxerium
  severity: info
  description: >-
    Stable Diffusion WebUI 是图像生成模型的 Web 操作界面，用于提示词生成、模型管理和图像处理。该模板通过请求目标服务并检查DSL 条件等指纹特征，判断目标是否使用或暴露了
    Stable Diffusion WebUI 相关组件；命中结果仅表示指纹特征匹配，可用于资产盘点、技术栈识别和后续安全评估，不代表已确认存在可利用漏洞。
  reference:
  - https://github.com/AUTOMATIC1111/stable-diffusion-webui
  metadata:
    verified: true
    max-request: 1
    vendor: AUTOMATIC1111
    product: stable-diffusion-webui
    shodan-query: 'http.html:"hires_fix.js"'
  tags: tech,stable-diffusion,sdwebui,ai,image-generation,detect,discovery
http:
  - raw:
      - |
        GET / HTTP/1.1
        Host: {{Hostname}}

    redirects: true
    max-redirects: 2

    matchers:
      - type: dsl
        dsl:
          - contains_all(body, "hires_fix.js", "AUTOMATIC1111", "gradio_config")
          - status_code == 200
        condition: and
