id: k8s-svc-acct-issuer-set

info:
  name: 检查s if service-account-issuer is correctly configured（云安全）
  author: princechaddha
  severity: medium
  description: kube-apiserver 缺少 service-account-issuer 会影响 Bound ServiceAccount Token 的发行者标识和令牌验证一致性。本模板读取 kube-apiserver 启动命令，发现缺少 service-account-issuer 参数时报告。
  impact: |
    - 服务账号令牌的受众和发行者校验可能不完整，影响工作负载身份信任边界。
    - 外部系统验证 Kubernetes 服务账号令牌时可能出现不一致或弱校验。
  remediation: |
    - 在 kube-apiserver 中配置稳定且唯一的 service-account-issuer。
    - 同步配置 service-account-signing-key-file 和 API audiences，验证新旧令牌兼容性。
  reference:
    - https://kubernetes.io/docs/tasks/configure-pod-container/configure-service-account/
  metadata:
    vendor: kubernetes
    product: kubernetes
  tags: cloud,devops,kubernetes,devsecops,api-server,k8s-cluster-security
variables:
  argument: "service-account-issuer"

self-contained: true
code:
  - engine:
      - sh
      - bash
    source: |
      kubectl get pods -n kube-system -l component=kube-apiserver -o jsonpath="{.items[*].spec.containers[*].command}"

    matchers-condition: and
    matchers:
      - type: word
        words:
          - 'kube-apiserver'

      - type: word
        words:
          - "service-account-issuer"
        negative: true

    extractors:
      - type: dsl
        dsl:
          - '"API server configuration lacks the " + argument + " argument."'
