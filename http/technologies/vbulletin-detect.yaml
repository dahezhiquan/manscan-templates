id: vbulletin-detect

info:
  name: vBulletin 指纹识别（指纹识别）
  author: ricardomaia
  severity: info
  description: >-
    vBulletin 是商业论坛和社区平台，用于构建讨论区、会员系统和社区内容。该模板通过请求目标服务并检查预设路径或首页响应、页面正文关键字、正则特征等指纹特征，判断目标是否使用或暴露了
    vBulletin 相关组件；命中结果仅表示指纹特征匹配，可用于资产盘点、技术栈识别和后续安全评估，不代表已确认存在可利用漏洞。
  reference:
  - https://www.vbulletin.com/
  classification:
    cpe: cpe:2.3:a:vbulletin:vbulletin:*:*:*:*:*:*:*:*
  metadata:
    verified: true
    max-request: 1
    vendor: vbulletin
    product: vbulletin
    shodan-query: title:"Powered By vBulletin"
    google-query: intext:"Powered By vBulletin"
  tags: tech,vbulletin,discovery
http:
  - method: GET
    path:
      - "{{BaseURL}}"

    host-redirects: true
    max-redirects: 2
    matchers:
      - type: word
        part: body
        words:
          - "Powered By vBulletin"
          - 'content="vBulletin'
          - 'id="vbulletin_css'
        condition: or
        case-insensitive: true

    extractors:
      - type: regex
        name: version
        part: body
        group: 1
        regex:
          - '(?i)meta.name=.generator.*content=.vbulletin.([\d.|\d]+)'
          - '(?i)\*.vBulletin.([\d.|\d]+).CSS'
