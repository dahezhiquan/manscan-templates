id: magento-phish

info:
  name: Magento 仿冒钓鱼网站（钓鱼网站识别）
  author: rxerium
  severity: info
  description: |
    检测到疑似仿冒 Magento 的钓鱼网站。模板在目标页面返回 200、页面内容命中 Magento 的官方服务页面特征，且当前主机不属于 magento.com、adobe.com 官方域名时触发，用于识别借用 Magento 品牌页面诱导用户信任的仿冒站点。
  reference:
    - https://magento.com
  metadata:
    max-request: 1
  tags: phishing,magento,ecommerce,osint,discovery
http:
  - method: GET
    path:
      - "{{BaseURL}}"

    host-redirects: true
    max-redirects: 2

    matchers-condition: and
    matchers:
      - type: word
        words:
          - '<title>Adobe Commerce (Magento) | Ecommerce Platform'

      - type: status
        status:
          - 200

      - type: dsl
        dsl:
          - '!contains(host,"magento.com")'
          - '!contains(host,"adobe.com")'
