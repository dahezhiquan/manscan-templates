id: wp-twentyfifteen-fpd

info:
  name: WordPress Twenty Fifteen Theme 完整路径泄露
  author: 0x_Akoko
  severity: info
  description: |
    检测到 WordPress Twenty Fifteen Theme 完整路径泄露。该页面属于安装、初始化或配置向导流程，若对外暴露，攻击者可能完成初始化、创建管理员账户或重新配置目标系统。
  reference:
    - https://wordpress.org/themes/twentyfifteen/
  metadata:
    verified: true
    max-request: 1
  tags: debug,wordpress,fpd,vuln,twentyfifteen,wp-themes

http:
  - method: GET
    path:
      - "{{BaseURL}}/wp-content/themes/twentyfifteen/functions.php"

    matchers:
      - type: dsl
        dsl:
          - 'status_code == 200'
          - 'contains_all(body, "Call to undefined function","/themes/twentyfifteen/")'
        condition: and
