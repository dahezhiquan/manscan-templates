id: dynamic-registered-broadcast-receiver

info:
  name: Android 动态广播接收器注册识别（本地文件安全扫描）
  author: gaurang
  severity: info
  description: |
    该模板检测 Android 应用是否动态注册 Broadcast Receiver。动态广播接收器若未限制来源，可能接收非预期广播或被滥用触发逻辑。
  classification:
    cvss-metrics: CVSS:3.1/AV:N/AC:L/PR:N/UI:N/S:U/C:N/I:N/A:N
    cvss-score: 0
    cwe-id: CWE-200
  tags: android,file

file:
  - extensions:
      - all
    matchers:
      - type: word
        words:
          - ";->registerReceiver(Landroid/content/BroadcastReceiver;Landroid/content/IntentFilter;)"
