id: erigon-server-detect

info:
  name: Erigon JSON-RPC HTTP Server 指纹识别（指纹识别）
  author: Nullfuzz
  severity: info
  description: >-
    Erigon 是以太坊执行客户端，JSON-RPC HTTP Server 用于向钱包、索引器或后端服务提供区块链节点接口。该模板通过请求目标服务并检查页面正文关键字、正则特征、DSL
    条件等指纹特征，判断目标是否使用或暴露了 Erigon JSON-RPC HTTP Server 相关组件；命中结果仅表示指纹特征匹配，可用于资产盘点、技术栈识别和后续安全评估，不代表已确认存在可利用漏洞。
  reference:
  - https://github.com/ledgerwatch/erigon
  metadata:
    verified: true
    max-request: 1
    shodan-query: product:"Erigon"
  tags: tech,erigon,ethereum,web3,blockchain,discovery
http:
  - raw:
      - |
        POST / HTTP/1.1
        Host: {{Hostname}}
        Content-Type: application/json

        {"method":"web3_clientVersion","params":[],"id":1,"jsonrpc":"2.0"}

    matchers:
      - type: dsl
        dsl:
          - 'status_code == 200'
          - 'contains(header, "application/json")'
          - 'contains(body, "erigon")'
        condition: and

    extractors:
      - type: regex
        part: body
        group: 1
        regex:
          - '(erigon/[0-9_.]+)'
