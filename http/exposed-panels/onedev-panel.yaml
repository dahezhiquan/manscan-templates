id: onedev-panel

info:
  name: OneDev 面板识别（指纹识别）
  author: vultza
  severity: info
  description: |
    该模板通过识别 OneDev 面板、控制台或管理界面的页面特征，判断目标是否暴露了对应服务入口。若命中，说明该后台或运维界面对外可访问，可用于资产识别与暴露面排查。
  reference:
    - https://github.com/theonedev/onedev
  metadata:
    verified: true
    max-request: 1
    shodan-query: title:"OneDev"
  tags: tech,detect,onedev,discovery

http:
  - method: GET
    path:
      - "{{BaseURL}}/~login"

    matchers-condition: and
    matchers:
      - type: word
        part: body
        words:
          - "OneDev"
          - "Git Server"
        condition: and
        case-insensitive: true

      - type: status
        status:
          - 200
