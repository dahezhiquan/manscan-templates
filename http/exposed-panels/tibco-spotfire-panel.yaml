id: tibco-spotfire-panel

info:
  name: TIBCO Spotfire 登录面板识别（指纹识别）
  author: righettod
  severity: info
  description: |
    该模板通过识别 TIBCO Spotfire 登录入口的页面标题、特征文本或重定向行为，判断目标是否暴露了对应的认证界面。若命中，说明该登录面板对外可访问，可用于暴露面梳理与后续安全评估。
  reference:
    - https://www.tibco.com/products/tibco-spotfire
  classification:
    cpe: cpe:2.3:a:tibco:spotfire_server:*:*:*:*:*:*:*:*
  metadata:
    verified: true
    max-request: 2
    shodan-query: "TIBCO Spotfire Server"
    product: spotfire_server
    vendor: tibco
  tags: panel,tibco,login,detect,discovery

http:
  - method: GET
    path:
      - "{{BaseURL}}"
      - "{{BaseURL}}/spotfire/login.html"

    stop-at-first-match: true
    host-redirects: true
    max-redirects: 2

    matchers:
      - type: word
        part: body
        words:
          - '<title>TIBCO Spotfire Server'
          - 'content="TIBCO Spotfire'
          - '/spotfire/ui/'
        condition: or
