id: jdwp-detect

info:
  name: Java Debug Wire 协议 识别（服务漏洞）
  author: johnk3r
  severity: info
  description: |
    该模板通过网络响应特征识别目标是否开放 Java Debug Wire Protocol 相关服务。
  reference:
    - https://www.wiz.io/blog/exposed-jdwp-exploited-in-the-wild
  metadata:
    verified: true
    shodan-query: product:"Java Debug Wire Protocol"
  tags: network,jdwp,tcp,detect,discovery

tcp:
  - host:
      - "{{Hostname}}"

    port: 5005

    inputs:
      - data: "4a4457502d48616e647368616b65"  # JDWP-Handshake
        type: hex
        read: 14                             # wait for handshake reply

      - data: "0000000b00000001000101"        # JDWP command: VirtualMachine.Version
        type: hex
        read: 1024                            # wait for VM version response

    matchers:
      - type: word
        part: raw
        words:
          - "JVM version"
          - "VM"
        condition: and

    extractors:
      - type: regex
        name: jdwp-version
        part: raw
        regex:
          - "JVM version ([0-9\\.]+)"
