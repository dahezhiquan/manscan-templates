id: cisco-ucm-selfcare-portal

info:
  name: Cisco Unified Communications Self-Service User Portal - 识别（暴露面识别）
  author: Morgan Robertson
  severity: info
  description: |
    该模板通过识别 Cisco Unified Communications Self-Service User Portal 面板、控制台或管理界面的页面特征，判断目标是否暴露了对应服务入口。若命中，说明该后台或运维界面对外可访问，可用于资产识别与暴露面排查。
  metadata:
    verified: true
    product: unified_communications_manager
    vendor: cisco
    shodan-query: http.title:"Unified Communications Self Care Portal"
    fofa-query: title="Unified Communications Self Care Portal"
  tags: detect,cisco,ucm,panel

http:
  - method: GET
    path:
      - "{{BaseURL}}/ucmuser/"

    matchers-condition: and
    matchers:
      - type: word
        part: body
        words:
          - 'webAppName: "ucmuser"'
          - 'webAppName="ucmuser"'
        condition: or

      - type: status
        status:
          - 200
