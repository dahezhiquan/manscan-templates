id: bikemap

info:
  name: Bikemap 用户名信息枚举（OSINT）
  author: dwisiswant0
  severity: info
  description: |
    Bikemap 是面向健康、运动、医疗经验或生活方式社区的在线平台，用户资料页通常会公开展示个人主页、活动记录、问答或社区互动信息。该模板用于在公开互联网侧枚举 Bikemap 用户名，不需要认证；模板请求公开路径 https://www.bikemap.net/en/u/用户名/routes/created/，并结合响应状态为 200、页面或响应内容命中 “- 🚲 Bikemap</title>” 等资料页特征判断目标用户名是否存在。该检查属于 OSINT 用户枚举，结果仅表示公开资料页或公开搜索结果可被访问，不代表目标平台存在可直接修复的漏洞。
  classification:
    cvss-metrics: CVSS:3.1/AV:N/AC:L/PR:N/UI:N/S:U/C:N/I:N/A:N
    cvss-score: 0
    cwe-id: CWE-200
  metadata:
    max-request: 1
  tags: osint,osint-health,bikemap,discovery

self-contained: true

http:
  - method: GET
    path:
      - "https://www.bikemap.net/en/u/{{user}}/routes/created/"

    matchers-condition: and
    matchers:
      - type: status
        status:
          - 200

      - type: word
        part: header
        words:
          - "- 🚲 Bikemap</title>"
