id: cmsimple-detect

info:
  name: CMSimple 指纹识别（指纹识别）
  author: Shivam Kamboj
  severity: info
  description: |
    用于识别目标是否部署 CMSimple 并提取相关版本或构建信息，模板会结合页面正文、特定路径或已知端点和版本或标识提取结果进行指纹匹配。
  reference:
    - https://www.cmsimple.org/
  metadata:
    verified: true
    max-request: 1
    shodan-query: html:"CMSimple"
  tags: tech,cmsimple,discovery

http:
  - method: GET
    path:
      - "{{BaseURL}}"

    matchers-condition: or
    matchers:
      - type: regex
        part: body
        regex:
          - '(?i)content=["'']CMSimple(?:["''\s>])'

      - type: word
        part: body
        words:
          - "cmsimpleLocatorElement"
          - "Welcome_to_CMSimple"
          - "templates/__cmsimple_"
        condition: or

    extractors:
      - type: regex
        name: version
        part: body
        group: 1
        regex:
          - '(?i)content=["'']CMSimple ([0-9.]+)'
