id: servicenow-panel

info:
  name: ServiceNow 登录面板识别（指纹识别）
  author: righettod
  severity: info
  description: |-
    ServiceNow 是企业 IT 服务管理和工作流平台，用于工单、资产、变更、审批和业务流程自动化。该模板请求 `/login.do`，并依据 HTTP 200 状态码、页面标题、正文关键字或品牌资源特征识别目标是否部署了该系统或暴露了对应入口，适用于资产指纹确认；命中结果仅表示系统特征匹配，不代表已确认存在未授权访问或可利用漏洞。
  reference:
  - https://www.servicenow.com/
  classification:
    cpe: cpe:2.3:a:servicenow:servicenow:*:*:*:*:*:*:*:*
  metadata:
    verified: true
    max-request: 1
    vendor: servicenow
    product: servicenow
    shodan-query:
    - http.favicon.hash:1701804003
    - http.title:"servicenow"
    fofa-query:
    - icon_hash=1701804003
    - title="servicenow"
    google-query: intitle:"servicenow"
  tags: panel,servicenow,login,detect,discovery

http:
  - method: GET
    path:
      - '{{BaseURL}}/login.do'

    matchers-condition: and
    matchers:
      - type: word
        part: body
        words:
          - 'ServiceNow'
          - 'window.NOW.'
          - 'NOW.user.userID'
        condition: and
        case-insensitive: true

      - type: status
        status:
          - 200

    extractors:
      - type: regex
        part: body
        group: 1
        regex:
          - '(?i)g_builddate\s+=\s+"([0-9._-]+)"'
