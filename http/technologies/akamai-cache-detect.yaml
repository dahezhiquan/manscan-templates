id: akamai-cache-detect

info:
  name: Akamai Cache 指纹识别（指纹识别）
  author: nybble04
  severity: info
  description: |-
    Akamai Cache 是 Akamai CDN 缓存节点或缓存服务，用于加速内容分发和边缘缓存。该模板请求首页，并依据页面标题、正文关键字或品牌资源特征、响应头特征识别目标是否使用或暴露了 Akamai Cache 相关组件，适用于资产盘点、技术栈识别和后续安全评估；命中结果仅表示指纹特征匹配，不代表已确认存在可利用漏洞。
  reference:
  - https://community.akamai.com/customers/s/article/Using-Akamai-Pragma-headers-to-investigate-or-troubleshoot-Akamai-content-delivery?language=en_US
  - https://spyclub.tech/2022/12/14/unusual-cache-poisoning-akamai-s3/
  metadata:
    verified: true
    max-request: 1
  tags: cache,akamai,tech,discovery

http:
  - method: HEAD
    path:
      - "{{BaseURL}}"

    headers:
      Pragma: akamai-x-cache-on
    matchers:
      - type: regex
        part: header
        regex:
          - '(?:TCP_HIT|TCP_MISS).*deploy\.akamaitechnologies\.com'
