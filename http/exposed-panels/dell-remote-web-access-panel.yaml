id: dell-remote-web-access-panel

info:
  name: Dell Remote Web Access 面板识别（暴露面识别）
  author: pussycat0x
  severity: info
  description: |
    该模板通过识别 Dell Remote Web Access 面板、控制台或管理界面的页面特征，判断目标是否暴露了对应服务入口。若命中，说明该后台或运维界面对外可访问，可用于资产识别与暴露面排查。
  metadata:
    verified: true
    max-request: 1
    fofa-query: title="Dell Remote web"
  tags: dell,remote-web,panel,login,discovery

http:
  - method: GET
    path:
      - "{{BaseURL}}"

    redirects: true

    matchers:
      - type: dsl
        dsl:
          - "status_code == 200"
          - "contains(body, 'Dell Remote Web Access - Remote Web Access')"
        condition: and
