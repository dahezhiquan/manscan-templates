id: activemq-artemis-default-login

info:
  name: Apache ActiveMQ Artemis Console 默认口令登录（弱口令）
  author: pdteam
  severity: high
  description: |
    该模板用于检测 Apache ActiveMQ Artemis Console 是否仍可使用默认凭据或弱口令登录。模板主要向 `/console/auth/login` 等认证入口发送请求，使用内置默认凭据组合进行认证尝试，并根据响应中的 `contains(content_type, "application/json")`、`{"credentials"` 等登录成功特征判断登录是否成功；命中说明目标未及时修改出厂、示例或初始化账号口令。
  impact: |
    - 攻击者可登录 Apache ActiveMQ Artemis Console 管理接口，读取、导出或篡改数据、索引、队列、仓库、报表或服务配置。
    - 若系统保存连接串、访问令牌或集成凭据，弱口令登录可能进一步造成业务数据泄露、权限扩大或服务中断。
  remediation: |
    - 立即修改默认账号口令，删除测试账号，并为管理员、服务账号和集成账号使用唯一强密码。
    - 启用细粒度权限控制、访问来源限制和审计日志，避免管理 API 或控制台直接对公网开放。
    - 检查数据导出、配置变更、令牌使用和异常查询记录，必要时轮换相关凭据。
  reference:
    - https://activemq.apache.org/components/artemis/documentation/latest/management-console.html
  metadata:
    max-request: 2
    vendor: apache
    product: activemq
    shodan-query: title:"ActiveMQ Artemis Console"
  tags: apache,activemq,artemis,default-login,vuln

http:
  - method: POST
    path:
      - '{{BaseURL}}/console/auth/login'
    headers:
      Content-Type: application/json
      X-Requested-With: XMLHttpRequest
    body: |-
      {"username":"{{username}}","password":"{{password}}"}

    stop-at-first-match: true
    payloads:
      username:
        - artemis
      password:
        - artemis
    attack: pitchfork

    matchers-condition: and
    matchers:
      - type: dsl
        dsl:
          - 'contains(content_type, "application/json")'

      - type: word
        part: body
        words:
          - '{"credentials"'
          - '"principals":['
          - 'org.apache.activemq'
        condition: and

      - type: status
        status:
          - 200

    extractors:
      - type: regex
        name: credential
        part: body
        group: 0
        regex:
          - '{"credentials":.*}'
