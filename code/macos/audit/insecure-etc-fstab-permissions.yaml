id: insecure-etc-fstab-permissions

info:
  name: macOS /etc/fstab 权限不安全（本地基线扫描）
  author: geeknik
  severity: high
  description: |
    `/etc/fstab` 定义文件系统挂载规则，权限不安全会让本地攻击者篡改挂载选项或挂载目标，影响启动和文件系统访问边界。模板检查该文件是否存在且不符合 root 管理的只读基线权限，命中时表示挂载配置文件权限异常。
  impact: |
    - 攻击者可能修改挂载参数，引入不可信文件系统或弱化安全挂载选项。
    - 错误挂载配置可能导致启动异常、数据暴露或权限绕过。
  remediation: |
    - 将 `/etc/fstab` 属主设置为 root，并使用只允许管理员写入的严格权限。
    - 审计挂载项，移除不必要或来源不可信的文件系统配置。
  tags: macos,audit,local,security

self-contained: true

code:
  - engine:
      - sh
      - bash
    source: |
      ls -l /etc/fstab 2>&1
    matchers-condition: and
    matchers:
      - type: status
        status:
          - 0
      - type: regex
        regex:
          - "^-rw-r--r--\\s+\\d+\\s+root\\s+\\w+"
        negative: true
