id: matrix-detect

info:
  name: Matrix 指纹识别（指纹识别）
  author: erethon
  severity: info
  description: >-
    Matrix 是开放的去中心化实时通信协议，服务器用于提供即时消息、房间和联邦通信能力。该模板通过请求目标服务并检查预设路径或首页响应、页面正文关键字、HTTP
    响应头、正则特征、状态码等指纹特征，判断目标是否使用或暴露了 Matrix 相关组件；命中结果仅表示指纹特征匹配，可用于资产盘点、技术栈识别和后续安全评估，不代表已确认存在可利用漏洞。
  reference:
  - https://spec.matrix.org/v1.3/server-server-api/#getwell-knownmatrixserver,
    https://spec.matrix.org/v1.3/client-server-api/#getwell-knownmatrixclient
  metadata:
    max-request: 2
  tags: tech,matrix,discovery
http:
  - method: GET
    redirects: true
    max-redirects: 2
    path:
      - "{{BaseURL}}/.well-known/matrix/server"
      - "{{BaseURL}}/.well-known/matrix/client"

    matchers-condition: and
    matchers:
      - type: regex
        regex:
          - '"m\.([a-z]+)":'

      - type: word
        part: header
        words:
          - text/html
        negative: true

      - type: status
        status:
          - 200

    extractors:
      - type: json
        part: body
        json:
          - '."m.server" | select( . != null )'
          - '."m.homeserver" | .base_url | select( . != null )'
          - '."m.identity_server" | .base_url | select( . != null )'
