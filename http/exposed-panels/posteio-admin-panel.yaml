id: posteio-admin-panel

info:
  name: Poste.io Admin 面板识别（暴露面识别）
  author: ritikchaddha
  severity: info
  description: 该模板通过识别 Poste.io Admin 登录入口的页面标题、特征文本或重定向行为，判断目标是否暴露了对应的认证界面。若命中，说明该登录面板对外可访问，可用于暴露面梳理与后续安全评估。
  classification:
    cpe: cpe:2.3:a:analogic:poste.io:*:*:*:*:*:*:*:*
  metadata:
    verified: true
    max-request: 1
    vendor: analogic
    product: poste.io
    shodan-query: title:"Administration login" html:"poste<span"
  tags: panel,poste,login,detect,discovery

http:
  - method: GET
    path:
      - "{{BaseURL}}/admin/login"

    matchers-condition: and
    matchers:
      - type: word
        part: body
        words:
          - "poste<span"
          - "Administration login"
        condition: and

      - type: status
        status:
          - 200
