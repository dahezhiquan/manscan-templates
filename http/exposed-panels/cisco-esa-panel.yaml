id: cisco-esa-panel

info:
  name: Cisco Email Security Appliance 面板（暴露面识别）
  author: rxerium,darses
  severity: info
  description: |
    该模板通过识别 Cisco Email Security Appliance 登录入口的页面标题、特征文本或重定向行为，判断目标是否暴露了对应的认证界面。若命中，说明该登录面板对外可访问，可用于暴露面梳理与后续安全评估。
  classification:
    cvss-metrics: CVSS:3.0/AV:N/AC:L/PR:N/UI:N/S:U/C:N/I:N/A:N
    cwe-id: CWE-200
  metadata:
    verified: true
    max-request: 1
    shodan-query: product:"IronPort AsyncOS http config"
  tags: login,cisco,panel,email,discovery

http:
  - method: GET
    path:
      - "{{BaseURL}}/login"

    redirects: true
    max-redirects: 2

    matchers-condition: and
    matchers:
      - type: word
        part: body
        words:
          - "Email Security Appliance"
          - "Email Security Virtual Appliance"
          - "IronPort C"
        condition: or

      - type: word
        part: body
        words:
          - "action:Login"

    extractors:
      - type: regex
        part: body
        group: 1
        internal: true
        regex:
          - 'scfw\/1y-([0-9.-]+)'
          - 'Version:\s*([0-9.-]+)'
