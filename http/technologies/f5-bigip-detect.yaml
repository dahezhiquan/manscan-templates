id: f5-bigip-detect

info:
  name: F5 BIG-IP 指纹识别（指纹识别）
  author: PR3R00T,0x240x23elu
  severity: info
  description: >-
    F5 BIG-IP 是应用交付控制器和负载均衡平台，常用于流量调度、TLS 终止和应用安全防护。该模板通过请求目标服务并检查预设路径或首页响应、页面正文关键字、HTTP
    响应头、正则特征等指纹特征，判断目标是否使用或暴露了 F5 BIG-IP 相关组件；命中结果仅表示指纹特征匹配，可用于资产盘点、技术栈识别和后续安全评估，不代表已确认存在可利用漏洞。
  reference:
  - https://www.intelisecure.com/how-to-decode-big-ip-f5-persistence-cookie-values
  - https://support.f5.com/csp/article/K23254150
  metadata:
    max-request: 2
  tags: bigip,tech,f5,discovery
http:
  - method: GET
    path:
      - "{{BaseURL}}"
      - "{{BaseURL}}/my.policy"

    stop-at-first-match: true
    host-redirects: true
    matchers:
      - type: word
        part: header
        words:
          - 'BIGipServer'

      - type: word
        part: header
        words:
          - 'BigIP'

      - type: word
        part: body
        words:
          - 'F5 Networks.'

    extractors:
      - type: regex
        part: header
        group: 1
        regex:
          - '(BIGipServer[a-z\_\.\-\~0-9A-Z]*)=([!a-z0-9A-Z/.=]+)'
