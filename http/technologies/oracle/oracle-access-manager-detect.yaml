id: oracle-access-manager-detect

info:
  name: Oracle Access Manager 指纹识别（指纹识别）
  author: tess
  severity: info
  description: >-
    Oracle Access Manager 是身份与访问管理产品，用于单点登录、访问控制和企业应用认证。该模板通过请求目标服务并检查预设路径或首页响应、页面正文关键字、HTTP
    响应头、状态码等指纹特征，判断目标是否使用或暴露了 Oracle Access Manager 相关组件；命中结果仅表示指纹特征匹配，可用于资产盘点、技术栈识别和后续安全评估，不代表已确认存在可利用漏洞。
  metadata:
    verified: true
    max-request: 1
  tags: tech,oracle,discovery
http:
  - method: GET
    path:
      - '{{BaseURL}}/oamfed/idp/soap'

    matchers-condition: and
    matchers:
      - type: word
        part: body
        words:
          - "processing the SOAP Request"

      - type: word
        part: header
        words:
          - "text/xml"

      - type: status
        status:
          - 200
