id: azure-appservice-tls-latest-version-missing
info:
  name: Azure App Service 未配置 TLS 1.2（云安全）
  author: princechaddha
  severity: medium
  description: Azure App Service 的最小 TLS 版本未配置为 1.2 时，应用可能接受较旧的 TLS 协议，降低传输加密的安全基线。该模板枚举 Web App，查询 minTlsVersion，并在结果不包含 1.2 时报告版本配置不足。
  impact: |
    - 旧版 TLS 协议可能允许较弱的密码套件和已不推荐的协商方式，增加降级、窃听和中间人攻击风险。
    - 不符合 TLS 1.2 基线可能导致合规检查失败，并与现代客户端或依赖服务的安全策略不一致。
  remediation: |
    - 将 App Service 的 minTlsVersion 设置为 1.2，并确认自定义域名、客户端和后端依赖均支持该版本。
    - 配置变更后检查证书、协议协商和客户端错误，逐步淘汰仍使用旧 TLS 版本的调用方。
  reference:
    - https://docs.microsoft.com/en-us/azure/app-service/configure-ssl-bindings#enforce-https
  metadata:
    vendor: microsoft
    product: azure-app-service
  tags: cloud,devops,azure,microsoft,appservice,azure-cloud-config

flow: |
  code(1);
  for (let appData of iterate(template.appList)) {
    appData = JSON.parse(appData);
    set("id", appData.id);
    code(2);
  }

self-contained: true
code:
  - engine:
      - sh
      - bash
    source: |
      az webapp list --output json --query '[*].{id:id}'

    extractors:
      - type: json
        name: appList
        internal: true
        json:
          - '.[]'

  - engine:
      - sh
      - bash
    source: |
      az webapp config show --ids $id --query 'minTlsVersion' --output json

    matchers:
      - type: word
        words:
          - "1.2"
        negative: true

    extractors:
      - type: dsl
        dsl:
          - 'id + " does not have the latest TLS version configured"'
