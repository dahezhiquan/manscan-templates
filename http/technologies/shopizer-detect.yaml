id: shopizer-detect

info:
  name: Shopizer 指纹识别（指纹识别）
  author: pikpikcu
  severity: info
  description: >-
    Shopizer 是开源 Java 电商平台，用于商品目录、购物车、订单和在线店铺管理。该模板通过请求目标服务并检查预设路径或首页响应、状态码、页面正文关键字等指纹特征，判断目标是否使用或暴露了
    Shopizer 相关组件；命中结果仅表示指纹特征匹配，可用于资产盘点、技术栈识别和后续安全评估，不代表已确认存在可利用漏洞。
  metadata:
    max-request: 2
  tags: tech,shopizer,discovery
http:
  - method: GET
    path:
      - "{{BaseURL}}"
      - "{{BaseURL}}/shop/"

    matchers-condition: and
    matchers:
      - type: status
        status:
          - 200

      - type: word
        words:
          - 'Powered by <a href="http://www.shopizer.com"'
        part: body
