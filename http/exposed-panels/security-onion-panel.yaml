id: security-onion-panel

info:
  name: Security Onion 登录面板识别（指纹识别）
  author: rxerium
  severity: info
  description: |-
    Security Onion 是安全监控与威胁检测平台，用于网络安全监测、日志分析、入侵检测和事件调查。该模板请求首页、`/login/`，并依据 HTTP 200 状态码、页面标题、正文关键字或品牌资源特征识别目标是否部署了该系统或暴露了对应入口，适用于资产指纹确认；命中结果仅表示系统特征匹配，不代表已确认存在未授权访问或可利用漏洞。
  reference:
  - https://securityonionsolutions.com/
  - https://github.com/Security-Onion-Solutions/securityonion
  classification:
    cpe: cpe:2.3:a:securityonionsolutions:security_onion:*:*:*:*:*:*:*:*
  metadata:
    verified: true
    max-request: 2
    vendor: securityonionsolutions
    product: security_onion
    shodan-query:
    - title:"Security Onion"
    - http.title:"security onion"
    fofa-query: title="security onion"
    google-query: intitle:"security onion"
  tags: panel,security,onion,detect,securityonionsolutions,discovery

http:
  - method: GET
    path:
      - "{{BaseURL}}"
      - "{{BaseURL}}/login/"

    stop-at-first-match: true

    matchers-condition: and
    matchers:
      - type: word
        words:
          - '<title>Security Onion'
          - 'Login to Security Onion'
          - 'Security Onion Solutions'
        condition: or

      - type: status
        status:
          - 200
