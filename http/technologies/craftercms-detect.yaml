id: craftercms-detect

info:
  name: CrafterCMS 指纹识别（指纹识别）
  author: righettod
  severity: info
  description: |-
    CrafterCMS 是无头/混合 CMS，用于内容创作、静态站点生成和数字体验交付。该模板请求首页，并依据页面标题、正文关键字或品牌资源特征、响应头特征识别目标是否使用或暴露了 CrafterCMS 相关组件，适用于资产盘点、技术栈识别和后续安全评估；命中结果仅表示指纹特征匹配，不代表已确认存在可利用漏洞。
  reference:
  - https://craftercms.org/
  classification:
    cpe: cpe:2.3:a:craftercms:crafter_cms:*:*:*:*:*:*:*:*
  metadata:
    verified: true
    max-request: 1
    vendor: craftercms
    product: crafter_cms
    shodan-query: http.title:"craftercms"
  tags: tech,craftercms,detect,discovery

http:
  - method: GET
    path:
      - "{{BaseURL}}"

    host-redirects: true
    max-redirects: 2
    matchers:
      - type: word
        part: header
        words:
          - 'CrafterCMS'

    extractors:
      - type: regex
        part: body
        group: 1
        regex:
          - 'Copyright\s+\(C\)\s+([0-9-]+)\s+Crafter'
