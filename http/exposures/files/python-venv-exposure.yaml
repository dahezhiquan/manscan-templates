id: python-venv-exposure

info:
  name: Python Virtual Environment Directory 暴露（暴露面识别）
  author: a1baradi
  severity: medium
  description: |
    检测到目标站点可直接访问 Python Virtual Environment Directory。Python 项目文件可能暴露依赖、虚拟环境、命令历史、包发布配置和运行参数。该模板请求 `/venv/`，并通过 HTTP 状态码、响应正文关键字、文件格式特征、正则匹配或响应头进行确认。此类文件公开后可能泄露源码结构、依赖版本、内部路径、业务配置、访问凭据或调试数据，扩大暴露面并降低攻击者的后续利用成本。
  impact: |-
    - 公开文件可能泄露内部路径、组件版本、依赖清单、资源命名、环境变量名称或业务配置线索。
    - 攻击者可利用这些信息缩小目标范围，选择匹配漏洞、弱口令、凭据攻击或目录枚举策略。
    - 若文件中包含真实凭据、令牌、连接串或敏感数据，可能进一步导致数据、代码仓库、云资源或后台系统被未授权访问。
  remediation: |-
    - 确认该文件是否必须公网可访问；如非业务必需，应立即从 Web 根目录、静态资源目录、对象存储或反向代理公开路径中移除。
    - 在 Web 服务器、网关、CDN 或应用路由层增加拒绝规则、身份认证、IP allowlist 或内网访问限制。
    - 检查访问日志、下载记录和缓存记录，评估该资源是否已被外部访问或搜索引擎收录。
    - 若文件中包含凭据、令牌、连接串或私有地址，应执行密钥轮换、权限收敛和受影响系统访问审计。
  reference:
    - https://docs.python.org/3/library/venv.html
  metadata:
    verified: true
    max-request: 1
    google-query: "intitle: Index of /venv"
  tags: venv,exposure,python-env,info,vuln

http:
  - method: GET
    path:
      - "{{BaseURL}}/venv/"

    matchers-condition: and
    matchers:
      - type: word
        part: body
        words:
          - "Index of /venv"

      - type: status
        status:
          - 200
