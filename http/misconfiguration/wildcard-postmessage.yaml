id: wildcard-postmessage

info:
  name: postMessage 通配来源跨站脚本风险
  author: pdteam
  severity: high
  description: |-
    该模板用于核查 postMessage 通配来源跨站脚本风险。目标安全响应头或前端消息通信策略配置过宽，可能削弱浏览器侧防护。模板访问 目标入口，并根据响应头策略或页面脚本中的通配来源特征判断配置是否薄弱。
  reference:
    - https://jlajara.gitlab.io/web/2020/06/12/Dom_XSS_PostMessage.html
    - https://payatu.com/blog/anubhav.singh/postmessage-vulnerabilities
    - https://developer.mozilla.org/en-US/docs/Web/API/Window/postMessage
  classification:
    cvss-metrics: CVSS:3.0/AV:N/AC:L/PR:N/UI:N/S:C/C:L/I:L/A:N
    cvss-score: 7.2
    cwe-id: CWE-346
  metadata:
    max-request: 1
  tags: xss,postmessage,misconfig,vuln
  impact: |-
    - 弱 CSP 可能降低跨站脚本防护效果，弱 HSTS 可能增加降级或中间人攻击面。
    - 通配 `postMessage` 来源可能允许不可信页面接收敏感消息或触发前端逻辑。
  remediation: |-
    - 为 CSP 设置明确的脚本、样式、连接和 frame 来源，避免使用不必要的通配符。
    - 配置包含合理 `max-age`、`includeSubDomains` 和 `preload` 的 HSTS 策略。
    - 对 `postMessage` 明确校验 `origin` 和消息结构，避免向 `*` 发送敏感数据。
http:
  - method: GET
    path:
      - '{{BaseURL}}'

    matchers:
      - type: regex
        regex:
          - postMessage\([a-zA-Z]+,["']\*["']\)
