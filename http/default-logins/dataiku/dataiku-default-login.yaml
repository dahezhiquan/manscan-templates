id: dataiku-default-login

info:
  name: Dataiku 默认口令登录（弱口令）
  author: random-robbie
  severity: high
  description: |
    该模板用于检测 Dataiku 是否仍可使用默认凭据或弱口令登录。模板主要向 `/dip/api/login` 等认证入口发送请求，使用内置默认凭据组合进行认证尝试，并根据响应中的 `dss_access_token` 等登录成功特征判断登录是否成功；命中说明目标未及时修改出厂、示例或初始化账号口令。
  impact: |
    - 攻击者可登录 Dataiku 管理接口，读取、导出或篡改数据、索引、队列、仓库、报表或服务配置。
    - 若系统保存连接串、访问令牌或集成凭据，弱口令登录可能进一步造成业务数据泄露、权限扩大或服务中断。
  remediation: |
    - 立即修改默认账号口令，删除测试账号，并为管理员、服务账号和集成账号使用唯一强密码。
    - 启用细粒度权限控制、访问来源限制和审计日志，避免管理 API 或控制台直接对公网开放。
    - 检查数据导出、配置变更、令牌使用和异常查询记录，必要时轮换相关凭据。
  reference:
    - https://www.dataiku.com
  classification:
    cvss-metrics: CVSS:3.0/AV:N/AC:L/PR:N/UI:N/S:C/C:L/I:L/A:L
    cvss-score: 8.3
    cwe-id: CWE-522
    cpe: cpe:2.3:a:dataiku:data_science_studio:*:*:*:*:*:*:*:*
  metadata:
    verified: true
    max-request: 1
    shodan-query: title:"dataiku"
    product: data_science_studio
    vendor: dataiku
  tags: default-login,dataiku,vuln

http:
  - raw:
      - |
        POST /dip/api/login HTTP/1.1
        Host: {{Hostname}}
        Content-Type: application/x-www-form-urlencoded;charset=utf-8

        login=admin&password=admin

    matchers-condition: and
    matchers:
      - type: word
        part: header
        words:
          - 'dss_access_token'

      - type: status
        status:
          - 200
