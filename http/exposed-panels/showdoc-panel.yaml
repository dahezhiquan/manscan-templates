id: showdoc-panel

info:
  name: ShowDoc 登录面板识别（指纹识别）
  author: rxerium
  severity: info
  description: |-
    ShowDoc 是在线 API 和技术文档管理平台，用于编写、发布和协作维护接口文档。该模板请求 `/web/#/user/login`，并依据 HTTP 200 状态码、页面标题、正文关键字或品牌资源特征识别目标是否部署了该系统或暴露了对应入口，适用于资产指纹确认；命中结果仅表示系统特征匹配，不代表已确认存在未授权访问或可利用漏洞。
  classification:
    cwe-id: CWE-200
  metadata:
    max-request: 1
    vendor: showdoc
    product: showdoc
    shodan-query: http.html:"showdoc"
  tags: panel,discovery,showdoc,tech

http:
  - method: GET
    path:
      - "{{BaseURL}}/web/#/user/login"

    matchers-condition: and
    matchers:
      - type: word
        part: body
        words:
          - '<title>ShowDoc</title>'

      - type: status
        status:
          - 200
