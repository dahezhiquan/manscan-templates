id: canon-ir-adv

info:
  name: Canon iR-ADV 面板识别（指纹识别）
  author: ritikchaddha,matejsmycka
  severity: info
  description: |-
    检测到目标站点存在 Canon iR-ADV 相关响应特征。Canon iR-ADV 是打印或复合办公设备的 Web 管理界面，用于查看设备状态、配置网络、维护耗材和管理打印扫描服务。模板请求 `/`，并通过页面标题或正文关键字、状态码确认该系统指纹，用于资产识别、系统盘点和暴露面梳理。
  metadata:
    verified: true
    max-request: 2
    shodan-query: title:"Canon iR-ADV"
  tags: canon,panel,login,detect,discovery
http:
  - method: GET
    path:
      - "{{BaseURL}}"

    host-redirects: true
    max-redirects: 2

    matchers-condition: and
    matchers:
      - type: word
        part: response
        words:
          - 'iR-ADV'
          - 'Authentication'
          - 'CANON'
        condition: and

      - type: status
        status:
          - 200

    extractors:
      - type: regex
        part: title
        regex:
          - '(iR-ADV C[0-9]+)'
        group: 1
