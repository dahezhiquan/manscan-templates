id: age-recipient-public-key

info:
  name: Age X25519 接收方公钥敏感信息检测（本地文件安全扫描）
  author: DhiyaneshDK
  severity: low
  description: |
    Age X25519 接收方公钥用于标识加密消息的收件方，通常不属于秘密凭据。公开该公钥一般不会直接授予解密能力，但会暴露加密通信对象，并可能与其他泄露凭据组合形成攻击链。本模板匹配 `age1` 开头的 age 收件方公钥格式。
  impact: |
    - 单独泄露通常不会直接授予管理权限，但会帮助攻击者枚举应用、租户、账户、项目或 API 入口。
    - 当接口限制、OAuth 重定向、API 密钥约束或资源 ACL 配置不当时，公开标识可能被用于滥用接口或配合其他凭据攻击。
    - 客户端 ID、公开密钥和用户名不应被误当作密码，但仍需避免与私密配置一同暴露。
  remediation: |
    - 先确认命中的值是否确实属于公开客户端标识；对 API 密钥、OAuth 应用和项目配置启用来源、域名、包名、IP、API 或配额限制。
    - 不要把对应的客户端密钥、私钥或高权限令牌与公开配置一起发布；如已与秘密凭据组合泄露，应立即轮换秘密部分。
    - 复核相关 OAuth 回调地址、资源 ACL 和匿名接口，避免公开标识被用于未授权调用或资产枚举。
  reference:
    - https://github.com/praetorian-inc/noseyparker/blob/main/crates/noseyparker/data/default/builtin/rules/age.yml
    - https://github.com/FiloSottile/age/blob/main/doc/age.1.html
    - https://github.com/C2SP/C2SP/blob/8b6a842e0360d35111c46be2a8019b2276295914/age.md#the-x25519-recipient-type
  metadata:
    verified: true
  tags: file,keys,age-encryption,token

file:
  - extensions:
      - all

    extractors:
      - type: regex
        part: body
        regex:
          - '\bage1[0-9a-z]{58}\b'
