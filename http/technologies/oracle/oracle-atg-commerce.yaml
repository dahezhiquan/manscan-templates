id: oracle-atg-commerce

info:
  name: Oracle ATG Commerce 指纹识别（指纹识别）
  author: Dale Clarke
  severity: info
  description: >-
    Oracle ATG Commerce 是企业电商平台，用于商品目录、购物车、订单和个性化商务体验。该模板通过请求目标服务并检查预设路径或首页响应、HTTP
    响应头、页面正文关键字、状态码等指纹特征，判断目标是否使用或暴露了 Oracle ATG Commerce 相关组件；命中结果仅表示指纹特征匹配，可用于资产盘点、技术栈识别和后续安全评估，不代表已确认存在可利用漏洞。
  reference:
  - https://docs.oracle.com/cd/E35319_01/Platform.10-2/ATGPlatformProgGuide/html/s0101introduction01.html
  classification:
    cvss-metrics: CVSS:3.1/AV:N/AC:L/PR:N/UI:N/S:U/C:N/I:N/A:N
    cvss-score: 0
    cwe-id: CWE-200
  metadata:
    product: atg
    verified: true
    max-request: 1
  tags: tech,oracle,atg,commerce,discovery
http:
  - method: GET
    path:
      - "{{BaseURL}}"

    matchers-condition: and
    matchers:
      - type: word
        part: header
        words:
          - "x-atg-version"
          - "atg_session_id"
        condition: or
        case-insensitive: true

      - type: status
        status:
          - 200

    extractors:
      - type: regex
        name: detected_version
        part: header
        group: 1
        regex:
          - (?mi)^X-ATG-Version:[ \t]*([0-9]+(?:[.][0-9]+)+(?:[-+._][0-9A-Za-z]+)*)[ \t]*\r?$
        internal: true
      - type: dsl
        dsl:
          - 'regex("^[0-9]+(?:[.][0-9]+)*(?:[-+._][0-9A-Za-z]+)*$", detected_version) ? detected_version : ""'
