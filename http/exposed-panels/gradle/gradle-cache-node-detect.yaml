id: gradle-cache-node-detect

info:
  name: Gradle Enterprise Build Cache Node 登录面板识别（指纹识别）
  author: Adam Crosser,righettod
  severity: info
  description: |-
    检测到目标站点存在 Gradle Enterprise Build Cache Node 相关响应特征。Gradle Enterprise Build Cache Node 是自动化运维、持续集成或任务编排平台，用于管理作业、流水线、凭据、执行记录和部署流程。模板请求 `/`，并通过页面标题或正文关键字、状态码、DSL 条件确认该系统指纹，用于资产识别、系统盘点和暴露面梳理。
  reference:
    - https://gradle.com/gradle-enterprise-solutions/build-cache/
  classification:
    cvss-metrics: CVSS:3.0/AV:N/AC:L/PR:N/UI:N/S:U/C:N/I:N/A:N
    cwe-id: CWE-200
  metadata:
    max-request: 1
    verified: true
    shodan-query: http.html:"Gradle Enterprise Build Cache Node"
  tags: panel,gradle,detect,discovery
http:
  - method: GET
    path:
      - "{{BaseURL}}"

    matchers:
      - type: dsl
        dsl:
          - 'status_code == 200 || status_code == 401'
          - 'contains_any(to_lower(body), "gradle enterprise build cache node", "com.gradle.error.fallback")'
        condition: and

    extractors:
      - type: regex
        part: body
        group: 1
        regex:
          - '(?i)"applicationVersion":"([0-9.]+)"'
          - '(?i)Gradle\s+Enterprise\s+Build\s+Cache\s+Node\s+([0-9.]+)'
