id: rds-public-snapshot
info:
  name: RDS 手动快照公开共享（云安全）
  author: princechaddha
  severity: high
  description: RDS 手动快照属性中包含 all 时，表示快照向所有 AWS 账号公开共享，可能暴露完整数据库数据。该模板枚举手动快照并检查 DBSnapshotAttributes 中是否出现 all。
  impact: |
    - 任何 AWS 账号都可能复制或恢复公开快照，导致数据库内容大规模泄露。
    - 快照通常包含历史敏感数据，即使生产库已修复访问控制，泄露风险仍会持续存在。
  remediation: |
    - 立即移除快照 restore 属性中的 all，仅向必要的可信账号共享。
    - 审计历史手动快照和复制快照，避免包含敏感数据的快照被公开或跨账号过度共享。
  reference:
    - https://docs.aws.amazon.com/AmazonRDS/latest/UserGuide/USER_ShareSnapshot.html
  metadata:
    max-request: 2
    vendor: amazon
    product: rds
  tags: cloud,devops,aws,amazon,rds,aws-cloud-config
variables:
  region: "ap-northeast-1"

flow: |
  code(1)
  for(let RDPsnaps of iterate(template.snapshots)){
    set("snapshot", RDPsnaps)
    code(2)
  }

self-contained: true
code:
  - engine:
      - sh
      - bash
    source: |
      aws rds describe-db-snapshots  --region $region  --snapshot-type manual  --output json  --query 'DBSnapshots[*].DBSnapshotIdentifier'

    extractors:
      - type: json
        name: snapshots
        internal: true
        json:
          - '.[]'

  - engine:
      - sh
      - bash
    source: |
         aws rds describe-db-snapshot-attributes --region $region --db-snapshot-identifier $snapshot  --query 'DBSnapshotAttributesResult.DBSnapshotAttributes'

    matchers:
      - type: word
        words:
          - '"all"'

    extractors:
      - type: dsl
        dsl:
          - '"RDS snapshot " + snapshot + " is public"'
