id: openclaw-exposure

info:
  name: Openclaw 网关 mDNS 信息暴露（服务漏洞）
  author: rxerium,fullstackpotato
  severity: medium
  description: |
    Openclaw（曾称 Clawdbot/Moltbot）网关会通过 mDNS/DNS-SD 通告本地服务信息。若 UDP 5353 对非预期来源可达，攻击者可识别 Openclaw 网关并获取 displayName 等设备标识；该模板发送 mDNS 服务发现查询，并匹配 `_openclaw-gw` 或 `clawdbot` 响应。
  impact: |
    - 泄露 Openclaw 网关存在性、设备显示名和局域网服务发现信息。
    - 攻击者可据此定位网关设备，结合管理接口或默认配置进行后续探测。
  remediation: |
    - 限制 mDNS 仅在可信本地链路内可用，禁止跨网段或公网转发 UDP 5353。
    - 清理设备广播中的敏感命名信息，并将网关管理接口放入受控网络。
  classification:
    cwe-id: CWE-200
  metadata:
    verified: true
    max-request: 1
    shodan-query: product:openclaw
    fofa-query: body="ClawdBot"
  tags: network,openclaw,gateway,exposure,udp,mdns,js,discovery

javascript:
  - pre-condition: |
      isUDPPortOpen(Host,Port);

    code: |
      let c = require("nuclei/net");
      let conn = c.Open('udp', `${Host}:${Port}`);
      // mDNS query for _clawdbot-gw._tcp.local PTR record
      let packet = "000000000001000000000000095f7365727669636573075f646e732d7364045f756470056c6f63616c00000c0001"
      conn.SendHex(packet);
      let resp = conn.RecvString(2048);
      resp;

    args:
      Host: "{{Host}}"
      Port: 5353

    matchers:
      - type: dsl
        dsl:
          - "contains(response, '_openclaw-gw') && success == true"
          - "contains(response, 'clawdbot') && success == true"
        condition: or

    extractors:
      - type: regex
        part: response
        name: server
        group: 1
        regex:
          - 'displayName=([a-zA-Z0-9._-]+)'
