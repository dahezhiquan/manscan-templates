id: kaseya-vsa-login-panel

info:
  name: Kaseya VSA - 登录面板（指纹识别）
  author: rxerium
  severity: info
  description: |-
    检测到目标站点存在 Kaseya VSA 相关响应特征。Kaseya VSA 是监控、日志、分析或可观测性系统，用于展示运行指标、告警事件、日志数据和服务状态。模板请求 `/`，并通过页面标题或正文关键字、状态码确认该系统指纹，用于资产识别、系统盘点和暴露面梳理。
  reference:
    - https://www.kaseya.com/products/vsa/
  metadata:
    verified: true
    max-request: 1
    shodan-query: http.html:"/vsapres/web20/core/login.aspx"
  tags: panel,kaseya,vsa,login,detect
http:
  - method: GET
    path:
      - "{{BaseURL}}"

    matchers-condition: and
    matchers:
      - type: word
        part: body
        words:
          - '/vsapres/web20/core/login.aspx'

      - type: status
        status:
          - 200
