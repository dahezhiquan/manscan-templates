id: starnet-dmb-bs-ftp-credentials-disclosure

info:
  name: StarNet DMB-BS FTP 凭据泄露（暴露面识别）
  author: brucelsone
  severity: medium
  description: |
    检测到目标站点可直接访问 StarNet DMB-BS FTP 凭据。锐捷网络设备和管理页面常用于校园、企业网络接入和网关管理，公开配置或状态信息可能暴露设备细节。该模板请求 `{{RootURL}}/dmb/out/taskexport.jsp?taskcode`，并通过 HTTP 状态码、响应正文关键字、文件格式特征、正则匹配或响应头进行确认。配置文件公开后可能泄露部署细节、内部路径、依赖版本、环境变量、访问凭据或调试信息，增加被侦察和后续利用的风险。
  impact: |-
    - 泄露的密码、API Key、访问令牌、私钥或服务账号凭据可能被用于直接访问云资源、代码仓库、数据库、邮件服务或内部系统。
    - 攻击者可能借助有效凭据读取或篡改业务数据、发布恶意制品、创建持久化访问、冒用服务身份或产生额外资源费用。
    - 即使凭据权限有限，也会暴露账号命名、环境划分和内部系统关系，辅助后续横向移动。
  remediation: |-
    - 立即撤销并轮换暴露文件中可能出现的密码、API Key、访问令牌、SSH/SSL 私钥、数据库连接串和云访问密钥。
    - 将敏感配置迁移到密钥管理系统、环境变量注入或受控配置中心，避免随静态文件对外发布。
    - 限制相关账号权限并启用最小权限、MFA、访问审计和异常调用告警。
    - 排查近期登录、API 调用、代码仓库、云资源和制品库操作记录，确认是否存在未授权使用。
  reference:
    - https://www.ddpoc.com/DVB-2024-7055.html
    - https://blog.csdn.net/shelter1234567/article/details/145521914
  metadata:
    verified: true
    max-request: 1
    fofa-query: (app="STAR_NET-数字标牌系统" || -欢迎! -- BS3.2.02.38447- || icon_hash="-260118452")
  tags: starnet,ruijie,ftp,password,exposure,vuln

http:
  - method: GET
    path:
      - "{{RootURL}}/dmb/out/taskexport.jsp?taskcode"

    matchers:
      - type: dsl
        dsl:
          - "contains(content_type, 'text/xml')"
          - "contains_all(body, 'user=','tasks version')"
          - "status_code == 200"
        condition: and
