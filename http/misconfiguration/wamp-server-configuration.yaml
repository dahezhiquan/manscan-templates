id: wamp-server-configuration

info:
  name: wamp 服务器 配置
  author: pussycat0x
  severity: medium
  description: |
    检测到 wamp 服务器 配置。目标响应或文件中可能暴露配置、凭据、密钥、令牌、环境变量或历史记录等敏感信息，可能被用于进一步入侵。
  reference:
    - https://www.exploit-db.com/ghdb/6891.
  metadata:
    max-request: 1
  tags: wamp,exposure,misconfig,vuln

http:
  - method: GET
    path:
      - "{{BaseURL}}"

    matchers-condition: and
    matchers:
      - type: dsl
        dsl:
          - 'contains(tolower(body), "wampserver")'

      - type: status
        status:
          - 200
