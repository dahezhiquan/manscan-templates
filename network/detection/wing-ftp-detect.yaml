id: wing-ftp-detect

info:
  name: Wing FTP 服务识别（指纹识别）
  author: ritikchaddha
  severity: info
  description: |
    Wing FTP Server 是跨平台文件传输服务器，支持 FTP、FTPS、SFTP 和 Web 管理等能力。该模板连接 21/TCP 并读取协议响应，通过匹配 `Wing FTP Server` 等响应特征识别目标服务。
  metadata:
    product: wing
    max-request: 1
    verified: true
    shodan-query: "Wing FTP Server"
  tags: network,ftp,wing,detect,tcp,discovery

tcp:
  - host:
      - "{{Hostname}}"
    port: 21

    matchers:
      - type: word
        part: raw
        words:
          - "Wing FTP Server"

    extractors:
      - type: regex
        name: detected_version
        part: raw
        group: 1
        regex:
          - (?mi)^220[^\r\n]*Wing FTP Server\s+([0-9]+(?:[.][0-9]+)+(?:[-+._][0-9A-Za-z]+)*)\s+ready
        internal: true
      - type: dsl
        dsl:
          - 'regex("^[0-9]+(?:[.][0-9]+)*(?:[-+._][0-9A-Za-z]+)*$", detected_version) ? detected_version : ""'
