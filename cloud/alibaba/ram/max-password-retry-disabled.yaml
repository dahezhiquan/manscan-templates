id: max-password-retry-disabled

info:
  name: 阿里云 RAM 最大密码重试限制未启用（云安全）
  author: DhiyaneshDK
  severity: medium
  description: RAM 密码策略未设置最大登录失败次数时，控制台密码登录缺少账号锁定约束，暴力破解和凭据填充风险升高。模板调用 GetPasswordPolicy，当 MaxLoginAttemps 为 0 时判定最大密码重试限制未启用。
  impact: |
    - 攻击者可持续尝试 RAM 用户密码，增加弱口令或泄露密码被撞库成功的概率。
    - 缺少失败登录限制会削弱账号防护能力，并增加告警和响应压力。
  remediation: |
    - 在 RAM 密码策略中配置合理的最大登录失败次数，并结合锁定时长和告警策略使用。
    - 对高权限 RAM 用户强制 MFA，减少仅依赖密码的登录风险。
  reference:
    - https://www.alibabacloud.com/help/en/ram/user-guide/configure-a-password-policy-for-ram-users
  metadata:
    max-request: 1
    verified: true
    vendor: alibaba
    product: ram
  tags: cloud,devops,aliyun,alibaba,alibaba-cloud-config,alibaba-ram

variables:
  region: "cn-hangzhou"

self-contained: true

code:
  - engine:
      - sh
      - bash
    source: |
      aliyun ram GetPasswordPolicy --region $region

    matchers:
      - type: word
        name: policy
        words:
          - '"MaxLoginAttemps": 0'

    extractors:
      - type: dsl
        dsl:
          - '"Maximum Password Retry Constraint Policy is Disabled "'
