id: cradlepoint-gateway-panel

info:
  name: CradlePoint 网关 - 登录面板（暴露面识别）
  author: rxerium
  severity: info
  description: |-
    CradlePoint（爱立信旗下公司）生产基于蜂窝网络的 SD-WAN 与 VPN 网关设备。其 Web 管理界面通常暴露在 8080 端口。
  reference:
    - https://cradlepoint.com/products/netcloud-manager/
  metadata:
    max-request: 1
    shodan-query: http.title:"CradlePoint" http.html:"Administration Login"
  tags: panel,cradlepoint,gateway,vpn,router,detect

http:
  - method: GET
    path:
      - "{{BaseURL}}"

    matchers-condition: and
    matchers:
      - type: word
        part: body
        words:
          - 'CradlePoint'
          - 'cradlepoint.com'
        condition: or

      - type: status
        status:
          - 200
