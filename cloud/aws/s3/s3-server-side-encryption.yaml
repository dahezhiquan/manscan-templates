id: s3-server-side-encryption
info:
  name: Server-Side 加密 on Amazon S3 Buckets（云安全）
  author: princechaddha
  severity: high
  description: 该规则用于检查 AWS S3 是否正确启用传输中或静态数据加密、证书校验及安全协议配置，防止敏感数据在存储或通信过程中被窃听、篡改或滥用。
  reference:
    - https://docs.aws.amazon.com/cli/latest/reference/s3api/get-bucket-encryption.html
  metadata:
    max-request: 2
  tags: cloud,devops,aws,amazon,s3,aws-cloud-config

flow: |
  code(1)
  for(let bucketName of iterate(template.buckets)){
    set("bucket", bucketName)
    code(2)
  }

self-contained: true
code:
  - engine:
      - sh
      - bash
    source: |
      aws s3api list-buckets --query 'Buckets[*].Name'

    extractors:
      - type: json # type of the extractor
        internal: true
        name: buckets
        json:
          - '.[]'

  - engine:
      - sh
      - bash
    source: |
        aws s3api get-bucket-encryption --bucket $bucket

    matchers:
      - type: word
        words:
          - "ServerSideEncryptionConfigurationNotFoundError"

    extractors:
      - type: dsl
        dsl:
          - '"The S3 bucket " + bucket +" is not encrypted at rest"'
