id: teleport-login-panel

info:
  name: Teleport 登录面板暴露（暴露面识别）
  author: pdteam,mahmoud0x00
  severity: low
  description: |-
    Teleport 是基础设施访问平台，用于 SSH、Kubernetes、数据库和应用访问的身份认证与审计。该模板请求 `/webapi/ping`，并依据页面标题、正文关键字或品牌资源特征判断目标是否对外暴露了 Teleport 的登录面板，用于发现互联网可访问的后台、控制台或业务入口。
  impact: "- 暴露的 Teleport 登录面板会泄露目标正在使用的产品、部署路径、页面特征或组织业务入口，便于攻击者进行指纹确认和漏洞匹配。\n- 如果认证、访问控制或默认凭据策略薄弱，攻击者可能进一步尝试进入后台，影响后台配置、业务数据、用户账号或设备运行状态。\n- 对互联网开放的管理入口会增加暴力破解、凭据填充、已知漏洞利用和钓鱼仿冒的攻击面。"
  remediation: "- 将 Teleport 的登录面板限制在内网、VPN、零信任代理或专用管理网段访问，避免直接暴露在互联网。\n- 启用强密码、多因素认证、登录失败限制和审计告警，排查默认账号、弱口令及长期未使用账号。\n- 保持 Teleport 及其依赖组件更新到受支持版本，并通过反向代理、ACL 或防火墙限制敏感路径访问。"
  reference:
  - https://github.com/gravitational/teleport
  metadata:
    verified: true
    max-request: 1
    shodan-query:
    - http.favicon.hash:544208100
    - http.favicon.hash:1854879765
    - http.favicon.hash:-1275955539
    - "Set-Cookie: __Host-grv_csrf"
    fofa-query:
    - icon_hash="544208100"
    - icon_hash="1854879765"
    - icon_hash="-1275955539"
    - "Set-Cookie: __Host-grv_csrf"
  tags: panel,teleport,login,oss,discovery

http:
  - method: GET
    path:
      - "{{BaseURL}}/webapi/ping"

    matchers:
      - type: regex
        part: body
        regex:
          - '"server_version"\s*:\s*"\d+\.\d+\.\d+"'
          - 'teleport'
        condition: and

    extractors:
      - type: json
        json:
          - '"Version: " +.server_version'
