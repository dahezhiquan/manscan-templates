id: workerman-websocket-detect

info:
  name: Workerman WebSocket 指纹识别（指纹识别）
  author: geeknik
  severity: info
  description: >-
    Workerman 是 PHP 高性能网络应用框架，WebSocket 服务用于实时通信、推送和长连接业务场景。该模板通过请求目标服务并检查预设路径或首页响应、HTTP
    响应头、页面正文关键字等指纹特征，判断目标是否使用或暴露了 Workerman WebSocket 相关组件；命中结果仅表示指纹特征匹配，可用于资产盘点、技术栈识别和后续安全评估，不代表已确认存在可利用漏洞。
  reference:
  - https://www.workerman.net/en/
  - https://github.com/walkor/Workerman
  metadata:
    verified: true
    max-request: 1
    shodan-query: "workerman"
  tags: tech,workerman,websocket,discovery
http:
  - method: GET
    path:
      - "{{BaseURL}}"

    matchers:
      - type: word
        part: header
        words:
          - 'workerman/'

    extractors:
      - type: kval
        part: header
        kval:
          - Server
