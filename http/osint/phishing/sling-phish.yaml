id: sling-phish

info:
  name: Sling TV 仿冒钓鱼网站（钓鱼网站识别）
  author: rxerium
  severity: info
  description: |
    检测到疑似仿冒 Sling TV 的钓鱼网站。模板在目标页面返回 200、页面内容命中 Sling TV 的品牌页面特征，且当前主机不属于 sling.com 官方域名时触发，用于识别借用 Sling TV 品牌页面诱导用户信任的仿冒站点。
  reference:
    - https://sling.com
  metadata:
    max-request: 1
  tags: phishing,sling,streaming,osint,discovery
http:
  - method: GET
    path:
      - "{{BaseURL}}"

    host-redirects: true
    max-redirects: 2

    matchers-condition: and
    matchers:
      - type: word
        words:
          - "Ditch cable & stream live TV for the best price with Sling. Watch live news, sports, movies, and entertainment + top channels like ESPN, TNT, TBS and more."

      - type: status
        status:
          - 200

      - type: dsl
        dsl:
          - '!contains(host,"sling.com")'
