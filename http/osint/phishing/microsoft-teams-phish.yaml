id: microsoft-teams-phish

info:
  name: Microsoft Teams 仿冒钓鱼网站（钓鱼网站识别）
  author: rxerium
  severity: info
  description: |
    检测到疑似仿冒 Microsoft Teams 的钓鱼网站。模板在目标页面返回 200、页面内容命中 Microsoft Teams 的官方服务页面特征，且当前主机不属于 microsoft.com 官方域名时触发，用于识别借用 Microsoft Teams 品牌页面诱导用户信任的仿冒站点。
  reference:
    - https://www.microsoft.com/en-gb/microsoft-teams/download-app
  metadata:
    max-request: 1
  tags: phishing,microsoft-teams,osint,discovery
http:
  - method: GET
    path:
      - "{{BaseURL}}"

    host-redirects: true
    max-redirects: 2

    matchers-condition: and
    matchers:
      - type: word
        words:
          - 'Download Microsoft Teams Desktop and Mobile Apps | Microsoft Teams'

      - type: status
        status:
          - 200

      - type: dsl
        dsl:
          - '!contains(host,"microsoft.com")'
