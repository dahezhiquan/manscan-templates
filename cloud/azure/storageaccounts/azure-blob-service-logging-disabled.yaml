id: azure-blob-service-logging-disabled
info:
  name: Azure Blob 服务读写删除日志未启用（云安全）
  author: princechaddha
  severity: medium
  description: Azure Storage Analytics 可记录 Blob 服务的读取、写入和删除请求，关闭这些日志会减少对数据访问和破坏行为的审计能力。本模板枚举存储账户并执行 az storage logging show --services b，在 delete、read 和 write 均为 false 时报告。
  impact: |
    - 未授权读取、批量下载、恶意覆盖和删除操作可能无法及时发现，攻击者可延长数据访问或破坏窗口。
    - 发生数据泄露或删除事件后，缺少请求日志会削弱溯源、影响评估和恢复决策能力。
  remediation: |
    - 按审计需求启用 Blob 服务的 read、write 和 delete 日志，并将日志账户纳入访问控制和保留管理。
    - 评估日志量与成本，避免无效请求造成日志放大，同时把关键操作接入告警和事件响应流程。
  reference:
    - https://docs.microsoft.com/en-us/azure/storage/common/storage-analytics-logging
  metadata:
    vendor: microsoft
    product: azure-storage
  tags: cloud,devops,azure,microsoft,azure-storage,azure-cloud-config

flow: |
  code(1);
  for (let AccountData of iterate(template.accountList)) {
    AccountData = JSON.parse(AccountData);
    set("name", AccountData.name);
    code(2);
  }

self-contained: true
code:
  - engine:
      - sh
      - bash
    source: |
      az storage account list --query '[*].{"name":name}'

    extractors:
      - type: json
        name: accountList
        internal: true
        json:
          - '.[]'

  - engine:
      - sh
      - bash
    source: |
      az storage logging show --services b --account-name "$name" --output json

    matchers-condition: and
    matchers:
      - type: word
        words:
          - '"delete": false'
          - '"read": false'
          - '"write": false'
        condition: and

    extractors:
      - type: dsl
        dsl:
          - 'name + " has logging disabled for read, write, and delete operations."'
