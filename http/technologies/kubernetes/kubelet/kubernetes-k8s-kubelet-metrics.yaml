id: kubernetes-k8s-kubelet-metrics

info:
  name: Kubelet Metrics 指纹识别（指纹识别）
  author: sharath,righettod
  severity: info
  description: >-
    Kubelet 是每个 Kubernetes 节点上的节点代理，metrics 接口用于暴露节点和容器运行指标。该模板通过请求目标服务并检查预设路径或首页响应、DSL
    条件等指纹特征，判断目标是否使用或暴露了 Kubelet Metrics 相关组件；命中结果仅表示指纹特征匹配，可用于资产盘点、技术栈识别和后续安全评估，不代表已确认存在可利用漏洞。
  reference:
  - https://github.com/kubernetes-sigs/metrics-server
  metadata:
    verified: true
    max-request: 1
    shodan-query: http.title:"Kube Metrics Server"
  tags: tech,kubernetes,devops,kubelet,discovery
http:
  - method: GET
    path:
      - "{{BaseURL}}/"
      - "{{BaseURL}}/metrics"

    stop-at-first-match: true
    matchers:
      - type: dsl
        dsl:
          - 'status_code == 200'
          - 'contains_any(to_lower(body), "<title>kube metrics server</title>", "kube_configmap_", "kube_pod_", "kube_secret_", "kube_deployment_", "kube_namespace_", "kube_service_")'
        condition: and
