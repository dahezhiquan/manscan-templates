id: langsmith-panel

info:
  name: LangSmith 面板识别（指纹识别）
  author: rxerium
  severity: info
  description: |-
    检测到目标站点存在 LangSmith 相关响应特征。LangSmith 是 LLM 应用开发与可观测性平台，用于调试链路、数据集、评估、追踪和部署质量分析。模板请求 `/`，并通过页面标题或正文关键字、状态码确认该系统指纹，用于资产识别、系统盘点和暴露面梳理。
  reference:
    - https://smith.langchain.com/
    - https://docs.smith.langchain.com/
  metadata:
    verified: true
    max-request: 1
    vendor: langchain
    product: langsmith
    shodan-query: 'http.title:"LangSmith"'
  tags: panel,langsmith,langchain,llm,ai,observability,detect,discovery
http:
  - method: GET
    path:
      - "{{BaseURL}}"

    host-redirects: true
    max-redirects: 2

    matchers-condition: and
    matchers:
      - type: word
        part: body
        words:
          - "<title>LangSmith</title>"

      - type: status
        status:
          - 200
