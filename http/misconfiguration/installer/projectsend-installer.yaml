id: projectsend-installer

info:
  name: ProjectSend 安装 Page 暴露
  author: DhiyaneshDK
  severity: high
  description: |
    检测到 ProjectSend 安装 Page 暴露。该页面属于安装、初始化或配置向导流程，若对外暴露，攻击者可能完成初始化、创建管理员账户或重新配置目标系统。
  reference:
    - https://www.projectsend.org/
  classification:
    cpe: cpe:2.3:a:projectsend:projectsend:*:*:*:*:*:*:*:*
  metadata:
    verified: true
    max-request: 1
    vendor: projectsend
    product: projectsend
    shodan-query: html:"ProjectSend setup"
  tags: misconfig,install,exposure,projectsend,vuln

http:
  - method: GET
    path:
      - "{{BaseURL}}/install/index.php"
      - "{{BaseURL}}/install/make-config.php"

    stop-at-first-match: true

    matchers-condition: and
    matchers:
      - type: word
        part: body
        words:
          - "Install &raquo; ProjectSend"

      - type: status
        status:
          - 200
