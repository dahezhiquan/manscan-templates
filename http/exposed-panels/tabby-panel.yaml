id: tabby-panel

info:
  name: Tabby 登录面板识别（指纹识别）
  author: s4e-io
  severity: info
  description: |-
    Tabby 是自托管终端或 SSH 管理工具，用于连接、管理和组织远程终端会话。该模板请求 `/auth/signin`，并依据 DSL 条件识别目标是否部署了该系统或暴露了对应入口，适用于资产指纹确认；命中结果仅表示系统特征匹配，不代表已确认存在未授权访问或可利用漏洞。
  reference:
  - https://github.com/TabbyML/tabby
  metadata:
    verified: true
    max-request: 1
    fofa-query: title="Tabby"
  tags: panel,login,tabby,detect,discovery

http:
  - method: GET
    path:
      - "{{BaseURL}}/auth/signin"

    host-redirects: true
    max-redirects: 2
    matchers:
      - type: dsl
        dsl:
          - 'contains(body, "<title>Tabby - Sign In")'
          - 'status_code == 200'
        condition: and
