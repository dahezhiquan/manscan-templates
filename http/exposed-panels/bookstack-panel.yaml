id: bookstack-panel

info:
  name: BookStack 登录面板识别（暴露面识别）
  author: cyllective,daffainfo
  severity: info
  description: 该模板通过识别 BookStack 登录入口的页面标题、特征文本或重定向行为，判断目标是否暴露了对应的认证界面。若命中，说明该登录面板对外可访问，可用于暴露面梳理与后续安全评估。
  reference:
    - https://github.com/BookStackApp/BookStack
  classification:
    cvss-metrics: CVSS:3.0/AV:N/AC:L/PR:N/UI:N/S:U/C:N/I:N/A:N
    cwe-id: CWE-200
    cpe: cpe:2.3:a:bookstackapp:bookstack:*:*:*:*:*:*:*:*
  metadata:
    max-request: 1
    vendor: bookstackapp
    product: bookstack
    shodan-query:
      - http.title:"BookStack"
      - http.title:"bookstack"
    fofa-query: title="bookstack"
    google-query: intitle:"bookstack"
  tags: panel,bookstack,bookstackapp,discovery

http:
  - method: GET
    path:
      - "{{BaseURL}}/login"

    matchers-condition: and
    matchers:
      - type: word
        part: body
        condition: or
        words:
          - '<title>BookStack</title>'
          - '<span class="logo-text">BookStack</span>'

      - type: word
        part: header
        words:
          - 'Set-Cookie: bookstack_session'

      - type: status
        status:
          - 200

    extractors:
      - type: regex
        part: body
        group: 1
        regex:
          - '(?:app\.js|(?:print\-)?styles\.css)\?version=([\w\.\-]+)["'']>'
