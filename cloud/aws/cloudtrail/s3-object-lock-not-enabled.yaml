id: s3-object-lock-not-enabled
info:
  name: CloudTrail 日志桶未启用 S3 Object Lock（云安全）
  author: princechaddha
  severity: medium
  description: CloudTrail 日志桶未启用 S3 Object Lock 是一类审计日志不可变保护不足风险，日志对象在保留期内可能缺少 WORM 模型保护。对有合规留存或取证要求的环境，缺少对象锁会增加日志被覆盖或删除的风险。模板获取 trail 关联的 `S3BucketName` 后调用 `get-object-lock-configuration`，当 stderr 出现 `ObjectLockConfigurationNotFoundError` 时判定对象锁配置不存在。
  impact: |
    - CloudTrail 日志对象缺少不可变保护，具备权限的主体可能删除或覆盖审计证据。
    - 对需要满足留存、合规或取证要求的环境，日志完整性和抗篡改能力不足。
  remediation: |
    - 对新的 CloudTrail 日志桶启用 S3 Object Lock，并按合规要求配置保留模式和保留期限。
    - 对既有桶无法直接启用对象锁的场景，规划迁移到已启用对象锁的新日志桶或采用独立不可变归档方案。
  reference:
    - https://docs.aws.amazon.com/AmazonS3/latest/dev/object-lock-overview.html
  metadata:
    max-request: 3
    vendor: amazon
    product: s3
  tags: cloud,devops,aws,amazon,s3,aws-cloud-config
variables:
  region: "ap-south-1"

flow: |
  code(1)
  for(let CloudTrail of iterate(template.cloudtrailname)){
    set("trail", CloudTrail)
    code(2)
    for(let BucketNames of iterate(template.buckets)){
      set("bucket", BucketNames)
      code(3)
    }
  }

self-contained: true
code:
  - engine:
      - sh
      - bash
    source: |
      aws cloudtrail list-trails --region $region --query 'Trails[*].Name' --output json

    extractors:
      - type: json
        name: cloudtrailname
        internal: true
        json:
          - '.[]'

  - engine:
      - sh
      - bash
    source: |
      aws cloudtrail describe-trails --region $region --trail-name-list $trail --query 'trailList[*].S3BucketName'

    extractors:
      - type: json
        name: buckets
        internal: true
        json:
          - '.[]'

  - engine:
      - sh
      - bash
    source: |
      aws s3api get-object-lock-configuration --bucket $bucket --query 'ObjectLockConfiguration.ObjectLockEnabled' --output json

    matchers:
      - type: word
        part: code_3_stderr
        words:
          - 'ObjectLockConfigurationNotFoundError'

    extractors:
      - type: dsl
        dsl:
          - '"The Object Lock feature is not enabled for the S3 bucket associated with the CloudTrail trail " + trail'
