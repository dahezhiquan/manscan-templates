id: fastmile-5g-gateway-panel

info:
  name: FastMile 5G Gateway 面板识别（指纹识别）
  author: Th3l0newolf
  severity: info
  description: |
    该模板通过识别 FastMile 5G Gateway 面板、控制台或管理界面的页面特征，判断目标是否暴露了对应服务入口。若命中，说明该后台或运维界面对外可访问，可用于资产识别与暴露面排查。
  classification:
    cvss-metrics: CVSS:3.0/AV:N/AC:L/PR:N/UI:N/S:U/C:N/I:N/A:N
    cwe-id: CWE-200
  metadata:
    max-request: 2
    verified: true
    shodan-query: html:"FastMile 5G Gateway"
  tags: panel,login,router,5g,detect,discovery

http:
  - method: GET
    path:
      - "{{BaseURL}}/web_whw/"
      - "{{BaseURL}}/web_whw/overview"

    stop-at-first-match: true
    matchers-condition: and
    matchers:
      - type: word
        part: body
        words:
          - "<title>FastMile 5G Gateway</title>"

      - type: status
        status:
          - 200
