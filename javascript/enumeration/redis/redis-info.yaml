id: redis-info

info:
  name: Redis 信息枚举（服务漏洞）
  author: DhiyaneshDK
  severity: medium
  description: |
    Redis INFO 命令会返回实例版本、操作系统、架构、进程、内存、连接数、主从角色等运行信息。若该信息可被不可信来源读取，攻击者可了解缓存或消息队列基础设施状态；该模板发送 INFO 探测并提取 redis_version、os、arch_bits、role 等字段。
  impact: |
    - Redis INFO 输出可能泄露版本、运行角色、内存使用、连接数量和主从结构。
    - 攻击者可根据这些信息判断实例价值、补丁水平和后续未授权访问或弱口令攻击路径。
  remediation: |
    - 限制 Redis INFO 等管理信息对不可信来源可见，启用 ACL/requirepass 和最小权限。
    - 将 Redis 绑定到内网或可信接口，保持版本更新并监控异常探测。
  reference:
    - https://nmap.org/nsedoc/scripts/redis-info.html
  metadata:
    max-request: 1
    shodan-query: product:"redis"
    product: redis
    vendor: redis
  tags: js,redis,network,enum,discovery

javascript:
  - pre-condition: |
      isPortOpen(Host,Port);
    code: |
      const redis = require('nuclei/redis');
      const info = redis.GetServerInfo(Host,Port);
      Export(info);

    args:
      Host: "{{Host}}"
      Port: "6379"

    extractors:
      - type: regex
        part: response
        regex:
          - redis_version:(\d+\.\d+\.\d+)
          - os:(.*?)\\r\\n
          - arch_bits:(\d+)\s+bits
          - process_id:(\d+)
          - used_cpu_sys:(\d+\.\d+)
          - used_cpu_user:(\d+\.\d+)
          - connected_clients:(\d+)
          - connected_slaves:(\d+)
          - used_memory_human:(\d+\.\d+[KMGTPEZY]?)
          - role:(\w+)
