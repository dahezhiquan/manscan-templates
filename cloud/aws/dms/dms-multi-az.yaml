id: dms-multi-az

info:
  name: DMS 复制实例未启用 Multi-AZ（云安全）
  author: DhiyaneshDK
  severity: medium
  description: AWS DMS 复制实例未启用 Multi-AZ 是一类迁移链路高可用能力不足风险，实例所在可用区故障时可能影响持续复制或迁移任务。Multi-AZ 可为复制实例提供备用可用区承载能力，降低单可用区故障导致的数据同步中断。模板先枚举 DMS 复制实例 ARN，再读取 `ReplicationInstances[*].MultiAZ`，当值为 `false` 时判定未启用 Multi-AZ。
  impact: |
    - 可用区故障或实例维护期间，数据库迁移、同步任务可能中断或延迟。
    - 对生产迁移或持续复制链路而言，单可用区部署会降低业务连续性和恢复能力。
  remediation: |
    - 对关键 DMS 复制实例启用 Multi-AZ，并在维护窗口内验证切换和任务恢复表现。
    - 将复制实例高可用配置纳入迁移方案评审和持续巡检，避免生产链路使用单可用区实例。
  reference:
    - https://www.trendmicro.com/cloudoneconformity-staging/knowledge-base/aws/DMS/multi-az.html
    - https://docs.aws.amazon.com/cli/latest/reference/dms/describe-replication-instances.html
  metadata:
    vendor: amazon
    product: dms
  tags: cloud,devops,aws,amazon,dms,aws-cloud-config

variables:
  region: "us-west-2"

flow: |
  code(1)
  for(let ReplicationInstances of iterate(template.replications)){
    set("replication", ReplicationInstances)
    code(2)
  }

self-contained: true

code:
  - engine:
      - sh
      - bash
    source: |
      aws dms describe-replication-instances --region $region --query "ReplicationInstances[*].ReplicationInstanceArn" --output json

    extractors:
      - type: json
        name: replications
        internal: true
        json:
          - '.[]'

  - engine:
      - sh
      - bash
    source: |
        aws dms describe-replication-instances --region $region --filters Name=replication-instance-arn,Values=$replication --query "ReplicationInstances[*].MultiAZ" --output json

    matchers:
      - type: word
        words:
          - "false"

    extractors:
      - type: dsl
        dsl:
          - '"DMS Multi-AZ  " + replication + " is not enabled"'
