id: default-codeigniter-page

info:
  name: Default CodeIgniter Page 指纹识别（指纹识别）
  author: dhiyaneshDK
  severity: info
  description: Default CodeIgniter Page 是 PHP Web 应用框架，用于构建轻量级 MVC 应用和接口。该模板请求首页，并依据 HTTP 200 状态码、页面标题、正文关键字或品牌资源特征识别目标是否使用或暴露了 Default CodeIgniter Page 相关组件，适用于资产盘点、技术栈识别和后续安全评估；命中结果仅表示指纹特征匹配，不代表已确认存在可利用漏洞。
  classification:
    cpe: cpe:2.3:a:codeigniter:codeigniter:*:*:*:*:*:*:*:*
  metadata:
    max-request: 1
    vendor: codeigniter
    product: codeigniter
    shodan-query: http.title:"Welcome to CodeIgniter"
  tags: tech,codeigniter,discovery

http:
  - method: GET
    path:
      - '{{BaseURL}}'

    matchers-condition: and
    matchers:
      - type: regex
        regex:
          - '^<title>Welcome to CodeIgniter\s?(?:[0-9]!)?</title>$'

      - type: status
        status:
          - 200
