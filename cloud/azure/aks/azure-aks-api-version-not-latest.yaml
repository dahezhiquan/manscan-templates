id: azure-aks-api-version-not-latest
info:
  name: Azure AKS Kubernetes API 版本存在可用升级（云安全）
  author: princechaddha
  severity: high
  description: AKS 集群的 Kubernetes API 版本存在可用升级而未及时更新时，集群可能继续运行在缺少最新安全修复和兼容性改进的版本上。该模板调用 az aks get-upgrades 获取升级信息，当返回结果包含非空 upgrades 数组时判定仍有可用 API 版本升级。
  impact: |
    - 旧版控制平面可能缺少针对已知问题的修复，并与新版客户端、插件或安全策略产生兼容性风险。
    - 长期不升级会压缩后续迁移窗口，增加一次性升级导致业务中断、回滚困难或节点不一致的概率。
  remediation: |
    - 按 AKS 支持矩阵和升级路径在测试环境验证目标版本，再分阶段升级控制平面和节点池。
    - 升级前检查 PodDisruptionBudget、存储和网络插件兼容性，并安排监控、回滚和业务验收流程。
  reference:
    - https://docs.microsoft.com/en-us/azure/aks/upgrade-cluster
  metadata:
    vendor: microsoft
    product: azure-kubernetes-service
  tags: cloud,devops,azure,microsoft,kubernetes,azure-cloud-config

flow: |
  code(1);
  for (let ClusterData of iterate(template.clusterList)) {
    ClusterData = JSON.parse(ClusterData);
    set("name", ClusterData.name);
    set("resourceGroup", ClusterData.resourceGroup);
    code(2);
  }

self-contained: true
code:
  - engine:
      - sh
      - bash
    source: |
      az aks list --output json --query '[*].{name:name, resourceGroup:resourceGroup}'

    extractors:
      - type: json
        name: clusterList
        internal: true
        json:
          - '.[]'

  - engine:
      - sh
      - bash
    source: |
      az aks get-upgrades --name "$name" --resource-group "$resourceGroup" --output json

    matchers-condition: and
    matchers:
      - type: word
        words:
          - '"upgrades": ['

    extractors:
      - type: dsl
        dsl:
          - 'name + " in resource group " + resourceGroup + " is not on the latest Kubernetes API version"'
