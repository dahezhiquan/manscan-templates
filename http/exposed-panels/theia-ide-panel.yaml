id: theia-ide-panel

info:
  name: Eclipse Theia IDE 面板识别（指纹识别）
  author: 0x_Akoko
  severity: info
  description: |-
    Eclipse Theia IDE 是浏览器中的云原生 IDE，用于代码编辑、终端、扩展和开发工作区管理。该模板请求首页，并依据 DSL 条件识别目标是否部署了该系统或暴露了对应入口，适用于资产指纹确认；命中结果仅表示系统特征匹配，不代表已确认存在未授权访问或可利用漏洞。
  reference:
  - https://github.com/eclipse-theia/theia
  - https://theia-ide.org/
  metadata:
    verified: true
    max-request: 1
    shodan-query: title:"Theia IDE"
    fofa-query: title="Theia IDE"
  tags: theia,ide,panel,detect,tech,discovery

http:
  - method: GET
    path:
      - "{{BaseURL}}/"

    matchers:
      - type: dsl
        dsl:
          - 'status_code == 200'
          - 'contains_any(body, "<title>Theia IDE</title>", "<title>Eclipse Theia</title>")'
          - 'contains(body, "theia-preload")'
        condition: and
