id: shell-box

info:
  name: Shell In A Box 登录面板识别（指纹识别）
  author: irshad ahamed
  severity: info
  description: |-
    Shell In A Box 是基于 Web 的终端模拟器，用于通过浏览器访问服务器 Shell 会话。该模板请求首页，并依据 HTTP 200 状态码、页面标题、正文关键字或品牌资源特征识别目标是否部署了该系统或暴露了对应入口，适用于资产指纹确认；命中结果仅表示系统特征匹配，不代表已确认存在未授权访问或可利用漏洞。
  reference:
  - https://github.com/shellinabox/shellinabox
  - https://www.cvedetails.com/vulnerability-list/vendor_id-15771/product_id-33062/Shellinabox-Project-Shellinabox.html
  classification:
    cpe: cpe:2.3:a:shellinabox_project:shellinabox:*:*:*:*:*:*:*:*
  metadata:
    verified: true
    max-request: 1
    vendor: shellinabox_project
    product: shellinabox
    shodan-query: http.favicon.hash:-629968763
    fofa-query: icon_hash=-629968763
  tags: shell,emulator,detect,panel,login,shellinabox_project,discovery

http:
  - method: GET
    path:
      - "{{BaseURL}}"

    host-redirects: true
    max-redirects: 2

    matchers-condition: and
    matchers:
      - type: word
        words:
          - '<title>Shell In A Box</title>'

      - type: status
        status:
          - 200
