id: exported-services

info:
  name: Android 导出 Service 检测（本地文件安全扫描）
  author: 7h3b4dger
  severity: info
  description: |
    该模板检测 AndroidManifest.xml 中导出的 Service，排除禁用项和常见 Google/Jetpack 依赖服务。导出服务可能被外部应用绑定或启动。
  tags: android,file,exportedcomponents

file:
  - extensions:
      - xml

    matchers:
      - type: xpath
        part: body
        xpath:
          - "//service[@android:exported='true']"

    extractors:
      - type: xpath
        part: body
        attribute: android:name
        xpath:
          - "//service[@android:exported='true' and not(contains(@android:name, 'androidx')) and not(contains(@android:name, 'google'))]"
