id: projectsend-detect

info:
  name: ProjectSend 登录面板指纹识别（指纹识别）
  author: idealphase
  severity: info
  description: 用于识别目标是否部署 ProjectSend 登录面板 并提取相关版本或构建信息，模板会结合页面正文、状态码、特定路径或已知端点和版本或标识提取结果进行指纹匹配。
  reference:
    - https://www.exploit-db.com/ghdb/7380
    - https://github.com/projectsend/projectsend
  classification:
    cvss-metrics: CVSS:3.1/AV:N/AC:L/PR:N/UI:N/S:U/C:N/I:N/A:N
    cvss-score: 0
    cwe-id: CWE-200
    cpe: cpe:2.3:a:projectsend:projectsend:*:*:*:*:*:*:*:*
  metadata:
    max-request: 1
    google-query: intext:Provided by ProjectSend
    product: projectsend
    vendor: projectsend
  tags: tech,projectsend,edb,discovery

http:
  - method: GET
    path:
      - '{{BaseURL}}'

    matchers-condition: and
    matchers:
      - type: regex
        part: body
        regex:
          - 'Provided by <a href="https?:\/\/www\.projectsend\.org\/" target="_blank">ProjectSend<\/a>'

      - type: status
        status:
          - 200

    extractors:
      - type: regex
        part: body
        group: 1
        regex:
          - "version (.*) - Free software"
