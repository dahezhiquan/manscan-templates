id: smtp4dev-interface-exposed

info:
  name: smtp4dev 接口暴露
  author: DhiyaneshDk
  severity: high
  description: |
    该模板用于核查 smtp4dev 接口暴露。该类问题通常源于管理面板、仪表盘或监控控制台暴露在公网或缺少足够访问控制。模板会向目标发送探测请求，并依据匹配 `<title>smtp4dev</title>`、状态码 200 等证据确认目标是否存在该配置问题。
  impact: |
    - 攻击者可获取系统状态、业务指标、任务信息、拓扑结构或管理入口线索。
    - 若面板存在默认凭据、弱认证或操作接口，可能进一步导致未授权管理或服务接管。
  remediation: |
    - 将管理面板和仪表盘限制在内网、VPN 或可信访问网关后。
    - 启用强认证、多因素认证、细粒度授权和操作审计。
    - 隐藏或关闭不需要公开的默认面板，并监控异常访问与暴力探测。
  metadata:
    verified: true
    max-request: 1
    shodan-query: title:"smtp4dev"
  tags: smtp4dev,misconfig,exposure,mail,interface,vuln

http:
  - method: GET
    path:
      - "{{BaseURL}}"

    host-redirects: true
    max-redirects: 2

    matchers-condition: and
    matchers:
      - type: word
        part: body
        words:
          - "<title>smtp4dev</title>"
        case-insensitive: true

      - type: status
        status:
          - 200
