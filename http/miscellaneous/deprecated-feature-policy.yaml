id: deprecated-feature-policy

info:
  name: 已废弃 Feature-Policy 响应头检测
  author: ritikchaddha
  severity: info
  description: |
    检测 HTTP 响应中是否仍使用已废弃的 Feature-Policy 头。该响应头已被 Permissions-Policy 替代，虽然部分浏览器仍为兼容性保留支持，但建议迁移到 Permissions-Policy 以避免策略失效或维护风险。
  reference:
    - https://developer.mozilla.org/en-US/docs/Web/HTTP/Headers/Feature-Policy
    - https://developer.mozilla.org/en-US/docs/Web/HTTP/Headers/Permissions-Policy
    - https://www.w3.org/TR/permissions-policy-1/
    - https://github.com/w3c/webappsec-permissions-policy/blob/main/permissions-policy-explainer.md
  metadata:
    verified: true
    max-request: 1
  tags: misc,headers,deprecated,feature-policy,permissions

http:
  - method: GET
    path:
      - "{{BaseURL}}"

    matchers-condition: and
    matchers:
      - type: word
        part: header
        words:
          - "Feature-Policy:"
        case-insensitive: true

    extractors:
      - type: kval
        part: header
        kval:
          - feature_policy
