id: jboss-detect

info:
  name: JBoss 指纹识别（指纹识别）
  author: daffainfo,idealphase
  severity: info
  description: >-
    JBoss 是 Java EE 应用服务器及中间件家族，常用于部署企业级 Java Web 应用。该模板通过请求目标服务并检查预设路径或首页响应、页面正文关键字、正则特征等指纹特征，判断目标是否使用或暴露了
    JBoss 相关组件；命中结果仅表示指纹特征匹配，可用于资产盘点、技术栈识别和后续安全评估，不代表已确认存在可利用漏洞。
  metadata:
    max-request: 1
  tags: tech,jboss,discovery
http:
  - method: GET
    path:
      - "{{BaseURL}}"

    matchers:
      - type: word
        part: body
        words:
          - "JBoss EAP 7"

      - type: regex
        part: body
        regex:
          - '<title>Welcome to JBoss(.*)</title>'

    extractors:
      - type: regex
        group: 1
        part: body
        regex:
          - '<h1>Welcome to (.+)<\/h1>'
