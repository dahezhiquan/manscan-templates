id: inertiajs-detect

info:
  name: Inertia.js 指纹识别（指纹识别）
  author: antonkulyk
  severity: info
  description: |
    用于识别目标是否运行 Inertia.js，模板会结合页面正文和特定路径或已知端点进行服务指纹匹配。
  reference:
    - https://inertiajs.com/
    - https://github.com/inertiajs/inertia
    - https://github.com/inertiajs/inertia-laravel
  metadata:
    max-request: 1
    product: inertia
    vendor: inertiajs
    shodan-query: html:"&quot;component&quot;" html:"data-page"
  tags: tech,inertiajs,inertia

http:
  - method: GET
    path:
      - "{{BaseURL}}"

    host-redirects: true
    max-redirects: 2

    matchers-condition: or
    matchers:
      - type: word
        part: body
        words:
          - 'data-page="'
          - '&quot;component&quot;'
          - '&quot;props&quot;'
          - '&quot;url&quot;'
        condition: and

      - type: regex
        part: body
        regex:
          - "(?is)data-page\\s*=\\s*\"(?:[^\"\\\\]|\\\\.)*\\\\\"component\\\\\"(?:[^\"\\\\]|\\\\.)*\\\\\"props\\\\\"(?:[^\"\\\\]|\\\\.)*\\\\\"url\\\\\""
