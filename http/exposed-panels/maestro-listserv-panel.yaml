id: maestro-listserv-panel

info:
  name: Maestro LISTSERV 识别（指纹识别）
  author: righettod
  severity: info
  description: |-
    检测到目标站点存在 Maestro LISTSERV 相关响应特征。Maestro LISTSERV 是监控、日志、分析或可观测性系统，用于展示运行指标、告警事件、日志数据和服务状态。模板请求 `/lui/`，并通过页面标题或正文关键字、状态码、DSL 条件确认该系统指纹，用于资产识别、系统盘点和暴露面梳理。
  reference:
    - https://www.lsoft.com/
    - https://www.lsoft.com/products/maestro_11.1.asp
  metadata:
    verified: true
    max-request: 1
    shodan-query: http.title:"LISTSERV Maestro"
  tags: panel,maestro,detect,login,discovery
http:
  - method: GET
    path:
      - "{{BaseURL}}/lui/"

    matchers:
      - type: dsl
        dsl:
          - 'status_code == 200'
          - 'contains_all(to_lower(body), "listserv", "maestro")'
        condition: and

    extractors:
      - type: regex
        part: body
        group: 1
        regex:
          - '(?i)<title>[\n\r\t\s]*LISTSERV\s+Maestro[\n\r\t\s]*([0-9.-]+)[\n\r\t\s]*</title>'
          - '(?i)uniqvp=([0-9.-]+)'
