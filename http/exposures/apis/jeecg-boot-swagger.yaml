id: jeecg-boot-swagger

info:
  name: Jeecg Boot Swagger Bootstrap UI 识别（指纹识别）
  author: ritikchaddha
  severity: info
  description: |
    Jeecg Boot 是基于 Java 的企业级低代码开发平台，Swagger Bootstrap UI 用于展示后端接口文档、请求参数和调试入口。该模板用于识别目标是否部署了相关系统或接口，检测时请求 `/jeecg-boot/`，并依据 HTTP 状态码、页面标题、响应正文关键字、接口返回字段或其他指纹特征进行判断。该模板仅用于资产识别和暴露面梳理，不代表目标一定存在可利用漏洞。
  classification:
    cpe: cpe:2.3:a:jeecg:jeecg-boot:*:*:*:*:*:*:*:*
  metadata:
    verified: true
    max-request: 1
    vendor: jeecg
    product: jeecg-boot
    shodan-query: title:"Jeecg-Boot"
    fofa-query: title="JeecgBoot 企业级低代码平台"
  tags: jeecg,swagger,detect,exposure,discovery

http:
  - method: GET
    path:
      - "{{BaseURL}}/jeecg-boot/"

    matchers:
      - type: word
        part: body
        words:
          - "<title>Swagger-Bootstrap-UI</title>"
