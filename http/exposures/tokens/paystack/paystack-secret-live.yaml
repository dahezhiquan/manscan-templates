id: paystack-secret-live

info:
  name: Paystack 密钥/Live 密钥 暴露（暴露面识别）
  author: Lloydcoder
  severity: info
  description: |
    检测到页面中疑似暴露了 Paystack 密钥/Live 密钥。如果相关密钥、令牌或凭据仍然有效，攻击者可能借此访问关联服务、调用接口、读取数据，或进一步对目标环境发起横向利用。
  reference:
    - https://support.paystack.com/en/articles/2123458
  tags: exposure,token,paystack,fintech,tinlance

http:
  - method: GET
    path:
      - "{{BaseURL}}"

    matchers-condition: and
    matchers:
      - type: regex
        part: body
        regex:
          - "sk_(live|test)_[0-9a-zA-Z]{50,}"

      - type: word
        words:
          - "paystack"
          - "secret_key"
          - "sk_live"
          - "sk_test"
        condition: or
        case-insensitive: true
