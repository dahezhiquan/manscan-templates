id: clearpass-policy-manager

info:
  name: ClearPass Policy Manager 登录面板识别（暴露面识别）
  author: dhiyaneshDK
  severity: info
  description: 该模板通过识别 ClearPass Policy Manager 登录入口的页面标题、特征文本或重定向行为，判断目标是否暴露了对应的认证界面。若命中，说明该登录面板对外可访问，可用于暴露面梳理与后续安全评估。
  classification:
    cvss-metrics: CVSS:3.0/AV:N/AC:L/PR:N/UI:N/S:U/C:N/I:N/A:N
    cwe-id: CWE-200
    cpe: cpe:2.3:a:arubanetworks:clearpass_policy_manager:*:*:*:*:*:*:*:*
  metadata:
    max-request: 1
    vendor: arubanetworks
    product: clearpass_policy_manager
    shodan-query:
      - http.title:"ClearPass Policy Manager"
      - http.title:"clearpass policy manager"
    fofa-query: title="clearpass policy manager"
    google-query: intitle:"clearpass policy manager"
  tags: panel,aruba,arubanetworks,discovery

http:
  - method: GET
    path:
      - '{{BaseURL}}/tips/tipsLogin.action'

    matchers-condition: and
    matchers:
      - type: word
        words:
          - '<title>ClearPass Policy Manager - Aruba Networks</title>'

      - type: status
        status:
          - 200
