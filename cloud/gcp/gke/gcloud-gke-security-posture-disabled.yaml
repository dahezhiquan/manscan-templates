id: gcloud-gke-security-posture-disabled

info:
  name: GKE Security Posture Dashboard未启用（云安全）
  author: princechaddha
  severity: medium
  description: GKE Security Posture 可集中分析集群配置和工作负载安全状态，未启用会降低集群风险可见性。本模板检查 securityPostureConfig.mode，值为 DISABLED 时报告 Security Posture Dashboard 未启用。
  impact: |
    - 集群配置偏差、工作负载风险和安全建议无法集中呈现，延迟漏洞和错误配置发现。
    - 安全团队缺少统一的集群态势数据，影响优先级排序和整改跟踪。
  remediation: |
    - 按组织治理范围启用 GKE Security Posture，并配置相应检测级别和查看权限。
    - 将安全态势结果接入告警和整改流程，定期复核高风险发现。
  reference:
    - https://cloud.google.com/kubernetes-engine/docs/how-to/security-posture
    - https://www.trendmicro.com/cloudoneconformity/knowledge-base/gcp/GKE/enable-and-configure-security-posture.html
  metadata:
    vendor: google
    product: google-kubernetes-engine
  tags: cloud,devops,gcp,gcloud,gke,kubernetes,security,monitoring,gcp-cloud-config

flow: |
  code(1)
  for(let projectId of iterate(template.projectIds)){
    set("projectId", projectId)
    code(2)
    for(let cluster of iterate(template.clusters)){
      cluster = JSON.parse(cluster)
      set("clusterName", cluster.name)
      set("location", cluster.location)
      code(3)
    }
  }

self-contained: true

code:
  - engine:
      - sh
      - bash
    source: |
      gcloud projects list --format="json(projectId)"

    extractors:
      - type: json
        name: projectIds
        internal: true
        json:
          - '.[].projectId'

  - engine:
      - sh
      - bash
    source: |
      gcloud container clusters list --project $projectId --format="json(name,location)"

    extractors:
      - type: json
        name: clusters
        internal: true
        json:
          - '.[]'

  - engine:
      - sh
      - bash
    source: |
      gcloud container clusters describe $clusterName --location $location --project $projectId --format="value(securityPostureConfig.mode)"

    matchers:
      - type: word
        words:
          - "DISABLED"

    extractors:
      - type: dsl
        dsl:
          - '"GKE cluster " + clusterName + " in " + location + " of project " + projectId + " does not have Security Posture dashboard enabled"'
