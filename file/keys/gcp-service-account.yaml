id: gcp-service-account

info:
  name: Google (GCP) Service-account 敏感信息检测（本地文件安全扫描）
  author: gaurang
  severity: low
  description: |
    Google Cloud 服务账号文件通常用于应用程序访问云资源，文件中还可能包含私钥、客户端邮箱和项目标识。仅出现服务账号类型并不等于私钥已经泄露，但若完整 JSON 被公开，攻击者可能以服务账号权限调用云 API。本模板匹配 JSON 中的 `"type": "service_account"`，识别可能属于 Google Cloud 服务账号文件的配置线索，不单独证明文件包含私钥。
  impact: |
    - 完整服务账号 JSON 泄露时，攻击者可能使用其中的私钥访问 Google Cloud 项目，具体影响取决于 IAM 角色。
    - 即使没有私钥，项目 ID、服务账号邮箱等信息也会帮助攻击者枚举云资产和组织结构。
    - 仅命中 `type` 字段不能证明可以认证，需检查是否同时存在 `private_key` 等敏感字段。
  remediation: |
    - 检查 JSON 是否包含 `private_key`、`private_key_id` 和服务账号邮箱；确认泄露后立即在 Google Cloud 中删除或轮换相关服务账号密钥。
    - 依据实际任务收紧 IAM 角色、项目范围和来源网络，避免把完整服务账号 JSON 打包进客户端或公开制品。
    - 清理仓库历史和构建缓存，并通过 Secret Manager 或工作负载身份提供短期凭据。
  tags: file,keys,token,google
file:
  - extensions:
      - all

    extractors:
      - type: regex
        regex:
          - "\"type\": \"service_account\""
