id: filevault-disabled

info:
  name: macOS FileVault 已禁用（本地基线扫描）
  author: geeknik
  severity: high
  description: |
    该模板检查 macOS FileVault 全盘加密是否关闭。关闭后磁盘静态数据缺少系统级加密保护。
  impact: |
    关键 macOS 安全控制关闭会降低数据保护、应用校验或系统完整性防护能力。
  remediation: |
    启用 FileVault 全盘加密，保护设备丢失或被盗时的静态数据。
  tags: macos,audit,local,security

self-contained: true

code:
  - engine:
      - sh
      - bash
    source: |
      fdesetup status
    matchers:
      - type: word
        words:
          - "FileVault is Off."
