id: blockchain-rpc-txpool-exposed

info:
  name: Blockchain RPC txpool content 暴露
  author: 0xBassia
  severity: high
  description: |
    检测到 Blockchain RPC txpool content 暴露。目标响应或文件中可能暴露配置、凭据、密钥、令牌、环境变量或历史记录等敏感信息，可能被用于进一步入侵。
  impact: |
    - 凭据、密钥、配置或环境变量泄露后，攻击者可能访问内部系统或第三方服务。
    - 泄露信息可被用于横向移动、权限提升或供应链攻击。
  remediation: |
    - 立即移除公开文件中的敏感信息并轮换已暴露的凭据、密钥和令牌。
    - 使用安全的密钥管理方案，并阻止配置、日志和历史文件被 Web 直接访问。
  reference:
    - https://geth.ethereum.org/docs/interacting-with-geth/rpc/ns-txpool
    - https://ethereum.org/en/developers/docs/mev/
  classification:
    cvss-metrics: CVSS:3.1/AV:N/AC:L/PR:N/UI:N/S:U/C:H/I:N/A:N
    cvss-score: 7.5
    cwe-id: CWE-200
  metadata:
    verified: true
    max-request: 1
    shodan-query: "jsonrpc"
  tags: misconfig,blockchain,rpc,txpool,mev,web3

http:
  - raw:
      - |
        POST / HTTP/1.1
        Host: {{Hostname}}
        Content-Type: application/json

        {"jsonrpc":"2.0","method":"txpool_content","params":[],"id":1}

    matchers-condition: and
    matchers:
      - type: word
        part: body
        words:
          - '"jsonrpc"'
          - '"result"'
          - '"pending"'
          - '"queued"'
        condition: and

      - type: word
        part: header
        words:
          - "application/json"

      - type: status
        status:
          - 200
