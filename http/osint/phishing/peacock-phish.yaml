id: peacock-phish

info:
  name: Peacock 仿冒钓鱼网站（钓鱼网站识别）
  author: rxerium
  severity: info
  description: |
    检测到疑似仿冒 Peacock 的钓鱼网站。模板在目标页面返回 200、页面内容命中 Peacock 的品牌页面特征，且当前主机不属于 peacocktv.com 官方域名时触发，用于识别借用 Peacock 品牌页面诱导用户信任的仿冒站点。
  reference:
    - https://peacocktv.com
  metadata:
    max-request: 1
  tags: phishing,peacock,streaming,osint,discovery
http:
  - method: GET
    path:
      - "{{BaseURL}}"

    host-redirects: true
    max-redirects: 2

    matchers-condition: and
    matchers:
      - type: word
        words:
          - 'Peacock'
          - "Watch TV shows and movies online with Peacock. Stream iconic shows and movies, exclusive Peacock Originals, live news and sports and more."
        condition: and

      - type: status
        status:
          - 200

      - type: dsl
        dsl:
          - '!contains(host,"peacocktv.com")'
