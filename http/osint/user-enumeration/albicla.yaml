id: albicla

info:
  name: Albicla 用户名信息枚举（OSINT）
  author: dwisiswant0
  severity: info
  description: |
    Albicla 是面向社交互动、社区交流或个人主页展示的在线平台，用户资料页通常会公开展示昵称、动态、关注关系或其他公开身份信息。该模板用于在公开互联网侧枚举 Albicla 用户名，不需要认证；模板请求公开路径 https://albicla.com/用户名/post/1，并结合响应状态为 500、页面或响应内容命中 “500 Post tymczasowo niedostępny” 等资料页特征判断目标用户名是否存在。该检查属于 OSINT 用户枚举，结果仅表示公开资料页或公开搜索结果可被访问，不代表目标平台存在可直接修复的漏洞。
  classification:
    cvss-metrics: CVSS:3.1/AV:N/AC:L/PR:N/UI:N/S:U/C:N/I:N/A:N
    cvss-score: 0
    cwe-id: CWE-200
  metadata:
    max-request: 1
  tags: osint,osint-social,albicla,discovery

self-contained: true

http:
  - method: GET
    path:
      - "https://albicla.com/{{user}}/post/1"

    matchers-condition: and
    matchers:
      - type: status
        status:
          - 500

      - type: word
        part: body
        words:
          - "500 Post tymczasowo niedostępny"
