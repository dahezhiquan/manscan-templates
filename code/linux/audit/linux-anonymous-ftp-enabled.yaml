id: linux-anonymous-ftp-enabled

info:
  name: Linux 匿名 FTP 访问已启用（本地基线扫描）
  author: songyaeji
  severity: high
  description: |
    匿名 FTP 允许未认证用户访问文件传输服务，若目录权限或上传策略配置不当，可能造成敏感文件泄露、恶意文件投放或存储空间滥用。模板检查 `/etc/passwd` 中是否存在 `ftp` 用户，并分别匹配 vsftpd、proftpd、pure-ftpd 的匿名访问配置，输出 `[VULNERABLE]` 时表示匿名访问风险存在。
  impact: |
    - 未认证用户可能读取、上传或覆盖 FTP 目录中的文件，造成数据泄露或恶意内容托管。
    - 匿名入口可能被用于横向侦察、跳板传输或消耗磁盘资源。
  remediation: |
    - 禁用 FTP 匿名登录，移除不需要的 `ftp` 用户和匿名别名配置。
    - 如必须提供公开下载，使用只读隔离目录、最小权限账户、日志审计和网络访问限制。
  reference:
    - https://isms.kisa.or.kr
  metadata:
    verified: true
  tags: linux,local,kisa,audit,ftp,anonymous

self-contained: true

code:
  - engine:
      - bash
    source: |
      if grep -q -E '^ftp:' /etc/passwd; then
          echo "[VULNERABLE] FTP user exists in /etc/passwd"
      else
          echo "[SAFE] No FTP user found in /etc/passwd"
      fi

      # Check vsftpd anonymous login
      if grep -q -i 'anonymous_enable.*yes' /etc/vsftpd/vsftpd.conf 2>/dev/null; then
          echo "[VULNERABLE] anonymous_enable=YES in vsftpd.conf"
      else
          echo "[SAFE] Anonymous login disabled in vsftpd.conf"
      fi

      # Check proftpd anonymous login
      if grep -q -i 'UserAlias.*anonymous' /etc/proftpd/proftpd.conf 2>/dev/null; then
          echo "[VULNERABLE] UserAlias anonymous in proftpd.conf"
      else
          echo "[SAFE] Anonymous login disabled in proftpd.conf"
      fi

    matchers:
      - type: word
        part: response
        words:
          - "[VULNERABLE]"
