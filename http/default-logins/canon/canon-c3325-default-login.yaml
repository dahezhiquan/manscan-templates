id: canon-c3325-default-login

info:
  name: Canon R-ADV C3325 默认口令登录（弱口令）
  author: ritikchaddha
  severity: high
  description: |
    该模板用于检测 Canon R-ADV C3325 是否仍可使用默认凭据或弱口令登录。模板主要向 `/login` 等认证入口发送请求，使用内置默认凭据组合进行认证尝试，并根据响应中的 `writeln('Log Out`、`Remote UI : Portal` 等登录成功特征判断登录是否成功；命中说明目标未及时修改出厂、示例或初始化账号口令。
  impact: |
    - 攻击者可接管 Canon R-ADV C3325 的 Web 管理界面，查看设备状态、网络配置、运行日志或敏感业务参数。
    - 被接管的网络、工控、打印、语音、存储或远程管理设备可能被用于中断业务、改变路由/访问策略、窃取流量或作为内网横向移动入口。
  remediation: |
    - 立即修改所有默认账号口令，禁用不再使用的出厂账号，并为管理账户设置高强度唯一密码。
    - 将设备管理入口限制在 VPN、堡垒机或可信管理网段内，避免直接暴露到公网。
    - 升级设备固件或管理组件，审计近期登录记录、配置变更和异常会话。
  reference:
    - https://oip.manual.canon/USRMA-0618-zz-CS-enLN/contents/1T0002902253.html#:~:text=The%20default%20user%20name%20for,in%20order%20to%20increase%20security.
  metadata:
    verified: true
    max-request: 1
    shodan-query: title:"c3325"
  tags: canon,c3325,default-login,misconfig,intrusive,vuln

variables:
  username: "Administrator"
  password: "7654321"

http:
  - raw:
      - |
        POST /login HTTP/1.1
        Host: {{Hostname}}
        Content-Type: application/x-www-form-urlencoded

        uri=%2F&user_type_generic=true&deptid={{username}}&password={{password}}

    host-redirects: true
    max-redirects: 2
    matchers-condition: and
    matchers:
      - type: word
        part: body
        words:
          - "writeln('Log Out"
          - "Remote UI : Portal"
        condition: and

      - type: status
        status:
          - 200
