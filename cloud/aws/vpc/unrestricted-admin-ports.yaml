id: unrestricted-admin-ports
info:
  name: NACL 管理端口对公网开放（云安全）
  author: princechaddha
  severity: high
  description: NACL 入站规则允许 0.0.0.0/0 访问 SSH 22 或 RDP 3389 等管理端口时，子网管理面会暴露给互联网来源。该模板枚举 network ACL，并匹配入站 allow 规则中的公网 CIDR 与 22/3389 端口。
  impact: |
    - 子网内管理服务更容易遭受暴力破解、漏洞扫描和凭据攻击。
    - 管理端口公网暴露会放大实例安全组误配置或弱凭据带来的账号接管风险。
  remediation: |
    - 移除 NACL 中对 0.0.0.0/0 开放 22/3389 的入站 allow 规则，仅允许堡垒机、VPN 或可信管理网段。
    - 优先使用 AWS Systems Manager Session Manager、VPN 或零信任访问方案替代公网管理端口。
  reference:
    - https://docs.aws.amazon.com/vpc/latest/userguide/vpc-network-acls.html
  metadata:
    max-request: 2
    vendor: amazon
    product: vpc
  tags: cloud,devops,aws,amazon,vpc,aws-cloud-config
variables:
  region: "us-east-1"

flow: |
  code(1)
  for(let NACLIDs of iterate(template.nacls)){
    set("naclid", NACLIDs)
    code(2)
  }

self-contained: true
code:
  - engine:
      - sh
      - bash
    source: |
      aws ec2 describe-network-acls --region $region --query 'NetworkAcls[*].NetworkAclId' --output json

    extractors:
      - type: json
        name: nacls
        internal: true
        json:
          - '.[]'

  - engine:
      - sh
      - bash
    source: |
         aws ec2 describe-network-acls --region $region --network-acl-ids $naclid --query 'NetworkAcls[*].Entries[?(RuleAction==`allow`) && (Egress==`false`)] | []' --output json

    matchers-condition: and
    matchers:
      - type: word
        words:
          - "0.0.0.0/0"
          - "CidrBlock"
        condition: and

      - type: word
        words:
          - "22"
          - "3389"
        condition: or

    extractors:
      - type: dsl
        dsl:
          - '"Access to the VPC subnets associated with your NACL " + naclid + " is not restricted."'
