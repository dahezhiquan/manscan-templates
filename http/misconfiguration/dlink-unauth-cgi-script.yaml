id: dlink-unauth-cgi-script

info:
  name: D Link DNS Series CGI Script 未授权
  author: pussycat0x
  severity: low
  description: |
    检测到 D Link DNS Series CGI Script 未授权。目标功能在未认证状态下可访问，可能暴露管理入口、业务数据、系统状态或可执行操作，需确认是否存在访问控制缺失。
  reference:
    - https://github.com/netsecfish/info_cgi
  classification:
    cpe: cpe:2.3:h:dlink:dns-345:*:*:*:*:*:*:*:*
  metadata:
    verified: true
    max-request: 1
    vendor: dlink
    product: dns-345
    fofa-query: "app=\"D_Link-DNS\""
  tags: unauth,dlink,misconfig,vuln

http:
  - method: GET
    path:
      - "{{BaseURL}}/cgi-bin/info.cgi"

    matchers-condition: and
    matchers:
      - type: word
        words:
          - "Product="
          - "Version="
          - "Model="
        condition: and

      - type: status
        status:
          - 200
