id: contao-login-panel

info:
  name: Contao 登录面板识别（暴露面识别）
  author: princechaddha
  severity: info
  description: 该模板通过识别 Contao 登录入口的页面标题、特征文本或重定向行为，判断目标是否暴露了对应的认证界面。若命中，说明该登录面板对外可访问，可用于暴露面梳理与后续安全评估。
  classification:
    cvss-metrics: CVSS:3.0/AV:N/AC:L/PR:N/UI:N/S:U/C:N/I:N/A:N
    cwe-id: CWE-200
    cpe: cpe:2.3:a:contao:contao:*:*:*:*:*:*:*:*
  metadata:
    verified: true
    max-request: 1
    vendor: contao
    product: contao
    shodan-query:
      - http.html:"Contao Open Source CMS"
      - http.title:"contao"
      - http.html:"contao open source cms"
      - cpe:"cpe:2.3:a:contao:contao"
    fofa-query:
      - title="contao"
      - body="contao open source cms"
    google-query: intitle:"contao"
  tags: panel,contao,discovery

http:
  - method: GET
    path:
      - "{{BaseURL}}/contao/login"

    matchers-condition: and
    matchers:
      - type: word
        part: body
        words:
          - "Contao Open Source CMS"
          - "<h1>Login</h1>"
        condition: and

      - type: status
        status:
          - 200
