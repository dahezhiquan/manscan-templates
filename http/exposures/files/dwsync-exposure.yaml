id: dwsync-exposure

info:
  name: Dreamweaver Dwsync.XML 暴露（暴露面识别）
  author: KaizenSecurity
  severity: info
  description: 检测到对外可访问的 Dreamweaver Dwsync.XML。相关文件可能泄露项目结构、依赖关系、部署细节、敏感参数或其他不应公开的内部信息。
  classification:
    cwe-id: CWE-200
  metadata:
    max-request: 1
  tags: dwsync,exposure,dreamweaver,files,vuln

http:
  - method: GET
    path:
      - "{{BaseURL}}/_notes/dwsync.xml"

    matchers-condition: and
    matchers:
      - type: status
        status:
          - 200

      - type: word
        part: header
        words:
          - application/xml

      - type: word
        part: body
        words:
          - '<dwsync>'
          - '</dwsync>'
        condition: and
