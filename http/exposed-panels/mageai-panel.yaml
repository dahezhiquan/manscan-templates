id: mageai-panel

info:
  name: Mage AI 面板识别（指纹识别）
  author: ChrisJr404
  severity: info
  description: |-
    检测到目标站点存在 Mage AI 相关响应特征。Mage AI 是 AI、LLM 或机器学习相关平台，用于管理模型、数据集、工作区、推理服务、评估或调用追踪。模板请求 `/`、`/api/status` 路径，并通过页面标题或正文关键字、状态码、DSL 条件确认该系统指纹，用于资产识别、系统盘点和暴露面梳理。
  reference:
    - https://github.com/mage-ai/mage-ai
    - https://docs.mage.ai/
  metadata:
    verified: true
    max-request: 2
    vendor: mage_ai
    product: mage-ai
    shodan-query: http.title:"Mage"
    fofa-query: title="Mage"
  tags: panel,mageai,detect
http:
  - method: GET
    path:
      - "{{BaseURL}}"
      - "{{BaseURL}}/api/status"

    host-redirects: true
    max-redirects: 2
    stop-at-first-match: true

    matchers:
      - type: dsl
        dsl:
          - 'status_code == 200 && contains(to_lower(body), "<title>mage</title>")'
          - 'status_code == 200 && contains_all(body, "status\":\"OK", "\"is_instance_healthy\":true")'
          - 'status_code == 200 && contains_all(body, "statuses\":", "is_instance_manager\":", "scheduler_status\":")'
        condition: or
