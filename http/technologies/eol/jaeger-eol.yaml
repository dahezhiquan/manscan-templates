id: jaeger-eol

info:
  name: Jaeger End-of-Life 指纹识别（指纹识别）
  author: Shivam Kamboj
  severity: info
  description: |
    用于识别目标是否部署 Jaeger End-of-Life 并提取相关版本或构建信息，模板会结合页面标题、页面正文、特定路径或已知端点和版本或标识提取结果进行指纹匹配。
  reference:
    - https://endoflife.date/jaeger
    - https://github.com/jaegertracing/jaeger/issues/6321
  metadata:
    verified: true
    max-request: 1
    shodan-query: "title:\"Jaeger UI\""
  tags: tech,jaeger,eol

http:
  - method: GET
    path:
      - "{{BaseURL}}"

    extractors:
      - type: regex
        part: body
        name: version
        group: 1
        regex:
          - '"gitVersion":"v?([0-9]+\.[0-9.]+)"'

    matchers:
      - type: dsl
        dsl:
          - 'len(version) > 0 && compare_versions(version, "<2.0")'
