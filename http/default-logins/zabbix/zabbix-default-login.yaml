id: zabbix-default-login

info:
  name: Zabbix 默认口令登录（弱口令）
  author: pdteam
  severity: high
  description: |
    该模板用于检测 Zabbix 是否仍可使用默认管理员凭据登录。模板向 `/index.php` 或 `/zabbix/index.php` 提交内置默认凭据组合，并根据登录后跳转到 `zabbix.php?action=dashboard.view` 的响应特征判断认证是否成功。
  impact: |
    - 攻击者可进入 Zabbix 控制台，查看主机清单、监控数据、告警历史、脚本配置和集成信息。
    - 若环境启用了远程命令、脚本或敏感宏，后台失陷可能进一步导致凭据泄露、监控对象被操控或内网横向移动。
  remediation: |
    - 立即修改默认管理员密码，删除或禁用不必要的内置账号，并为高权限用户启用强密码策略。
    - 将 Zabbix Web 控制台限制在可信网络范围内，并启用多因素认证、登录失败限制和审计日志。
    - 复核近期用户、脚本、宏、媒介类型和动作配置变更，轮换可能暴露的凭据。
  reference:
    - https://openbaton.github.io/documentation/zabbix-server-configuration-3.0/
  classification:
    cvss-metrics: CVSS:3.0/AV:N/AC:L/PR:N/UI:N/S:C/C:L/I:L/A:L
    cvss-score: 8.3
    cwe-id: CWE-522
  metadata:
    max-request: 2
  tags: zabbix,default-login,vuln

http:
  - raw:
      - |
        POST {{path}} HTTP/1.1
        Host: {{Hostname}}
        Content-Type: application/x-www-form-urlencoded; charset=UTF-8
        X-Requested-With: XMLHttpRequest

        name={{username}}&password={{password}}&autologin=1&enter=Sign+in

    payloads:
      path:
        - /index.php
        - /zabbix/index.php
      username:
        - Admin
      password:
        - zabbix
    attack: clusterbomb

    matchers-condition: and
    matchers:
      - type: word
        part: header
        words:
          - "zabbix.php?action=dashboard.view"

      - type: status
        status:
          - 302
