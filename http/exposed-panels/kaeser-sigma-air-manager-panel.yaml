id: kaeser-sigma-air-manager-panel

info:
  name: Kaeser Sigma Air Manager 面板（指纹识别）
  author: Th3l0newolf
  severity: info
  description: |-
    检测到目标站点存在 Kaeser Sigma Air Manager 相关响应特征。Kaeser Sigma Air Manager 是工业控制、能源、楼宇自动化或 HMI/SCADA 场景中的管理界面，用于监控设备状态、过程数据和现场控制相关配置。模板请求 `/HMI/login.html`，并通过页面标题或正文关键字、状态码、DSL 条件确认该系统指纹，用于资产识别、系统盘点和暴露面梳理。
  reference:
    - https://www.kaeser.com/
  metadata:
    verified: true
    shodan-query: http.title:"SIGMA AIR MANAGER"
  tags: kaeser,login,panel,detect,discovery
http:
  - method: GET
    path:
      - "{{BaseURL}}/HMI/login.html"

    matchers:
      - type: dsl
        dsl:
          - contains(body, "SIGMA AIR MANAGER")
          - status_code == 200
        condition: and
