id: oauth-authorization-server-exposure

info:
  name: Well-Known OAuth 授权服务器元数据暴露
  author: rxerium
  severity: low
  description: |
    检测 OAuth 2.0 授权服务器元数据 (RFC 8414)。该元数据用于公开授权端点、令牌端点、支持的算法和能力信息。
  impact: |
    - well-known 策略或身份文件通常用于公开声明域名、应用、邮件、证书或身份关联。
    - 若内容过期、配置错误或非预期暴露，可能泄露组织关系、端点能力、用户标识或验证材料。
  remediation: |
    - 确认该 well-known 文件是否为业务或合规所需；非必要内容应删除或限制访问。
    - 定期检查文件内容是否准确、未过期且不包含敏感信息。
    - 对应用关联、邮件策略、证书验证和身份声明文件建立变更审计。
  reference:
    - https://www.rfc-editor.org/rfc/rfc8414
  metadata:
    verified: true
    max-request: 1
    google-query: inurl:"/.well-known/oauth-authorization-server"
  tags: well-known,oauth,oidc,security,rfc8414,miscellaneous,misc,vuln

http:
  - method: GET
    path:
      - "{{BaseURL}}/.well-known/oauth-authorization-server"

    matchers-condition: and
    matchers:
      - type: word
        part: body
        words:
          - "issuer"
          - "authorization_endpoint"
        condition: and

      - type: status
        status:
          - 200
