id: openspeedtest-speedtest

info:
  name: OpenSpeedTest 指纹识别（指纹识别）
  author: DhiyaneshDk
  severity: info
  description: >-
    OpenSpeedTest 是基于浏览器的网络测速工具，用于测量下载、上传和延迟等网络性能指标。该模板通过请求目标服务并检查预设路径或首页响应、页面正文关键字等指纹特征，判断目标是否使用或暴露了
    OpenSpeedTest 相关组件；命中结果仅表示指纹特征匹配，可用于资产盘点、技术栈识别和后续安全评估，不代表已确认存在可利用漏洞。
  metadata:
    max-request: 1
    verified: true
    shodan-query: html:"Openspeedtest"
  tags: tech,openspeedtest,discovery
http:
  - method: GET
    path:
      - '{{BaseURL}}'

    matchers:
      - type: word
        words:
          - "SpeedTest by OpenSpeedTest"
        part: body
