id: password-policy

info:
  name: FortiGate 管理员密码策略未设置（本地文件安全扫描）
  author: pussycat0x
  severity: medium
  description: |
    FortiGate 管理员密码策略控制长度、复杂度、历史和轮换等要求。缺少 `config system password-policy` 时，管理员账户可能接受弱口令或长期复用密码。本模板检查该配置块是否存在，不能单独判断现有账户密码是否已经满足强度要求。
  impact: |
    - 弱口令和长期不变的管理凭据会增加暴力破解、凭据填充和内部复用攻击成功率。
    - 管理员账户被接管后，攻击者可能修改边界策略、读取 VPN/密钥配置或关闭安全监控。
  reference:
    - https://docs.fortinet.com/document/fortigate/6.2.0/hardening-your-fortigate/582009/system-administrator-best-practices
  classification:
    cvss-metrics: CVSS:3.1/AV:N/AC:L/PR:N/UI:N/S:U/C:N/I:N/A:N
    cvss-score: 0
    cwe-id: CWE-200
  remediation: |
    - 配置符合组织基线的管理员密码长度、复杂度、历史和有效期要求，并优先启用多因素认证和集中 AAA。
    - 对现有管理员账户执行凭据轮换和权限清理，限制管理接口来源并监控失败登录和异常配置变更。
  tags: fortigate,config,audit,file,firewall

file:
  - extensions:
      - conf

    matchers-condition: and
    matchers:
      - type: word
        words:
          - "config system password-policy"
        negative: true

      - type: word
        words:
          - "config system"
          - "config router"
          - "config firewall"
        condition: or
