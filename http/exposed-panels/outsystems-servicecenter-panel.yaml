id: outsystems-servicecenter-panel

info:
  name: OutSystems Service Center 登录面板识别（暴露面识别）
  author: righettod
  severity: info
  description: |
    该模板通过识别 OutSystems Service Center 登录入口的页面标题、特征文本或重定向行为，判断目标是否暴露了对应的认证界面。若命中，说明该登录面板对外可访问，可用于暴露面梳理与后续安全评估。
  reference:
    - https://www.outsystems.com/
  classification:
    cpe: cpe:2.3:a:outsystems:platform_server:*:*:*:*:*:*:*:*
  metadata:
    verified: true
    max-request: 2
    vendor: outsystems
    product: platform_server
    shodan-query: "http.html:\"outsystems\""
  tags: panel,outsystems,login,detect,discovery

http:
  - method: GET
    path:
      - "{{BaseURL}}/Login.aspx"
      - "{{BaseURL}}/ServiceCenter/Login.aspx"

    host-redirects: true
    max-redirects: 2
    stop-at-first-match: true
    matchers:
      - type: dsl
        dsl:
          - 'status_code == 200'
          - 'contains(body, "Enter your OutSystems credentials")'
        condition: and

    extractors:
      - type: regex
        part: body
        group: 1
        regex:
          - 'environmentName:.?([a-z0-9A-Z\s]+).?'
