id: delegate-ftp-detect
info:
  name: DeleGate PROXY-FTP 服务 识别（指纹识别）
  author: pussycat0x
  severity: info
  description: |
    该模板通过 FTP Banner、响应特征或协商行为识别目标是否运行 DeleGate PROXY- 相关 FTP 服务实现。
  metadata:
    verified: true
    shodan-query: "PROXY-FTP server"
    max-request: 1
  tags: network,ftp,delegate,detect,tcp,discovery

tcp:
  - inputs:
      - data: 00000000
        type: hex

    host:
      - "{{Hostname}}"
    port: 21
    read-size: 1024

    matchers:
      - type: word
        words:
          - "PROXY-FTP server (DeleGate"

    extractors:
      - type: regex
        group: 1
        name: version
        regex:
          - "DeleGate/([0-9.]+)"
