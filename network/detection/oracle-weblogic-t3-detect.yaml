id: oracle-weblogic-t3-detect

info:
  name: Oracle WebLogic T3 协议识别（指纹识别）
  author: F1tz,milo2012,wdahlenb
  severity: info
  description: |
    Oracle WebLogic T3/T3S 是 WebLogic Server 的专有远程通信协议，常用于集群、JNDI、EJB 和管理通信。该模板分别向 7001/TCP 和 7002/TLS 发送 T3/T3S 握手请求，并通过 `HELO` 响应及版本提取特征识别 WebLogic T3 通道。
  impact: |
    - WebLogic T3/T3S 通道对外暴露会提供明确的中间件攻击面，可被继续用于版本识别、JNDI/RMI 面探测或历史漏洞验证。
    - 若目标版本存在未修复漏洞或反序列化入口，开放的 T3 通道可能成为远程攻击链的前置条件。
  remediation: |
    - 限制 7001/7002 等 WebLogic 通信端口仅允许可信应用节点和管理网段访问。
    - 关闭不必要的 T3/T3S 暴露面，或通过网络分段、访问控制和补丁管理降低远程攻击风险。
    - 结合 WebLogic 版本继续检查官方安全更新、反序列化防护和管理通道配置。
  metadata:
    max-request: 2
    vendor: oracle
    product: weblogic_server
  tags: network,weblogic,detect,t3,oracle,tcp,discovery

tcp:
  - inputs:
      - data: "t3 12.2.1\nAS:255\nHL:19\nMS:10000000\nPU:t3://us-l-breens:7001\n\n"
    host:
      - "{{Hostname}}"
    port: 7001
    read-size: 1024
    matchers:
      - type: word
        words:
          - "HELO"

    extractors:
      - type: regex
        part: body
        group: 1
        regex:
          - "HELO:(.*).false"

  - inputs:
      - data: "t3s 12.2.1\nAS:255\nHL:19\nMS:10000000\nPU:t3://us-l-breens:7001\n\n"
    host:
      - "tls://{{Hostname}}"
    read-size: 1024
    port: 7002
    matchers:
      - type: word
        words:
          - "HELO"

    extractors:
      - type: regex
        part: body
        group: 1
        regex:
          - "HELO:(.*).false"
