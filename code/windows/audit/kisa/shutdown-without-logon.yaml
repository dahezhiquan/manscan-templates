id: shutdown-without-logon

info:
  name: 允许未登录关机（本地基线扫描）
  author: nukunga[SungHyunJeon]
  severity: medium
  description: |
    启用后任何具备物理或控制台访问的人都可能关闭系统。对应基线项为““无需登录即可关机”策略”；模板读取注册表 `HKLM:\Software\Microsoft\Windows\CurrentVersion\policies\system` 的 `ShutdownWithoutLogon` 值，结合命中值判断策略是否不符合基线。
  impact: |
    - 攻击者可造成拒绝服务或干扰正在运行的业务任务。
    - 日志缺失会降低入侵发现、事件溯源和合规取证能力。
  remediation: |
    - 禁用 ShutdownWithoutLogon，限制关机操作仅允许已认证授权用户执行。
    - 确认日志容量、归档和集中转发链路可用，并监控审计策略被关闭的情况。
  reference:
    - https://isms.kisa.or.kr/main/csap/notice/?boardId=bbs_0000000000000004&mode=view&cntId=85
  tags: code,windows-audit,kisa,registry

self-contained: true

code:
  - pre-condition: |
      IsWindows();
    engine:
      - powershell
      - powershell.exe
    args:
      - -ExecutionPolicy
      - Bypass
    pattern: "*.ps1"
    source: |
      $regPath = "HKLM:\Software\Microsoft\Windows\CurrentVersion\policies\system"
      $shutdownValue = (Get-ItemProperty -Path $regPath -Name ShutdownWithoutLogon -ErrorAction SilentlyContinue).ShutdownWithoutLogon
      if ($shutdownValue -eq 0) {
          "SHUTDOWN_WITHOUT_LOGON_DISABLED"
      } else {
          "SHUTDOWN_WITHOUT_LOGON_ENABLED"
      }

    matchers:
      - type: word
        words:
          - "SHUTDOWN_WITHOUT_LOGON_ENABLED"
