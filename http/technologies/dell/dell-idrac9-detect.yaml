id: dell-idrac9-detect

info:
  name: Dell iDRAC9 指纹识别（指纹识别）
  author: kophjager007
  severity: info
  description: 用于识别目标是否部署 Dell iDRAC9 并提取相关版本或构建信息，模板会结合页面正文、状态码、特定路径或已知端点和版本或标识提取结果进行指纹匹配。
  metadata:
    max-request: 1
  tags: tech,dell,discovery

http:
  - method: GET
    path:
      - "{{BaseURL}}/sysmgmt/2015/bmc/info" # Firmware Version and other info (iDRAC9)

    matchers-condition: and
    matchers:
      - type: status
        status:
          - 200

      - type: word
        words:
          - "BuildVersion"
          - "SystemModelName"

    extractors:
      - type: regex
        part: body
        regex:
          - '[0-9]{2}G'

      - type: regex
        part: body
        group: 1
        regex:
          - '"FwVer" *: *"([^"]+)"'
