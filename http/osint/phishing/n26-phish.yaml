id: n26-phish

info:
  name: N26 仿冒钓鱼网站（钓鱼网站识别）
  author: rxerium
  severity: info
  description: |
    检测到疑似仿冒 N26 的钓鱼网站。模板在目标页面返回 200、页面内容命中 N26 的品牌页面特征，且当前主机不属于 n26.com 官方域名时触发，用于识别借用 N26 品牌页面诱导用户信任的仿冒站点。
  reference:
    - https://n26.com
  metadata:
    max-request: 1
  tags: phishing,n26,fintech,osint,discovery
http:
  - method: GET
    path:
      - "{{BaseURL}}"

    host-redirects: true
    max-redirects: 2

    matchers-condition: and
    matchers:
      - type: word
        words:
          - "It is with sincere gratitude and appreciation of everything we built together, that we made the tough decision to sharpen our focus on our European business."

      - type: status
        status:
          - 200

      - type: dsl
        dsl:
          - '!contains(host,"n26.com")'
