id: express-default-page

info:
  name: Express 默认页面 指纹识别（指纹识别）
  author: DhiyaneshDk
  severity: info
  description: >-
    Express 是 Node.js Web 应用框架，默认页面通常出现在示例应用、脚手架项目或未完成定制的部署中。该模板通过请求目标服务并检查预设路径或首页响应、页面正文关键字、HTTP
    响应头、状态码等指纹特征，判断目标是否使用或暴露了 Express 默认页面 相关组件；命中结果仅表示指纹特征匹配，可用于资产盘点、技术栈识别和后续安全评估，不代表已确认存在可利用漏洞。
  metadata:
    verified: true
    max-request: 1
    shodan-query: html:"Welcome to Express"
  tags: tech,express,discovery
http:
  - method: GET
    path:
      - '{{BaseURL}}'

    matchers-condition: and
    matchers:
      - type: word
        part: body
        words:
          - "<title>Express</title>"
          - "Welcome to Express"
        condition: and

      - type: word
        part: header
        words:
          - "text/html"

      - type: status
        status:
          - 200
