id: api-jotform

info:
  name: Jotform API Token 可用性校验（token喷洒）
  author: 0xpugal
  severity: info
  description: 该模板通过调用 Jotform API 的已知接口验证提供的 token 是否有效，命中后通常表示可访问相关 API 能力。
  reference:
    - https://api.jotform.com/docs/
  metadata:
    verified: true
    max-request: 1
  tags: token-spray,jotform

self-contained: true

http:
  - method: GET
    path:
      - "https://api.jotform.com/user?apiKey={{token}}"

    matchers-condition: and
    matchers:
      - type: word
        part: body
        words:
          - 'email":"'
          - 'updated_at":"'
          - 'username":"'
          - 'responseCode":200'
        condition: and

      - type: word
        part: content_type
        words:
          - application/json
