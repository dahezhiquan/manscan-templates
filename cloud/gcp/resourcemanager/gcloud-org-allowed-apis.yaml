id: gcloud-org-allowed-apis

info:
  name: Google Cloud APIs and Services 未Restricted（云安全）
  author: princechaddha
  severity: medium
  description: 组织未限制可启用的 Google Cloud APIs and Services 时，项目可开启任意服务，增加未授权服务使用和攻击面扩张风险。本模板检查组织策略 serviceuser.services 的有效 listPolicy.allValues，值为 ALLOW 时报告未限制服务启用范围。
  impact: |
    - 项目成员可能启用未经过安全评审的服务，引入新的公网入口、数据处理路径或费用风险。
    - 安全团队难以维持统一服务清单和合规边界，事件响应时也更难判断服务使用是否经过批准。
  remediation: |
    - 配置 serviceuser.services 组织策略，仅允许经过审批的 Google Cloud 服务被启用。
    - 建立服务启用审批和例外流程，并定期复核组织策略继承效果。
  reference:
    - https://www.trendmicro.com/cloudoneconformity/knowledge-base/gcp/ResourceManager/allowed-apis-and-services.html
    - https://cloud.google.com/resource-manager/docs/organization-policy/org-policy-constraints
  metadata:
    vendor: google
    product: resource-manager
  tags: cloud,devops,gcp,gcloud,resourcemanager,security,api,services,gcp-cloud-config

flow: |
  code(1)
  for(let orgId of iterate(template.orgIds)){
    set("orgId", orgId)
    code(2)
  }

self-contained: true

code:
  - engine:
      - sh
      - bash
    source: |
      gcloud organizations list --format="json(name)"

    extractors:
      - type: json
        name: orgIds
        internal: true
        json:
          - '.[].name'

  - engine:
      - sh
      - bash
    source: |
      gcloud alpha resource-manager org-policies describe serviceuser.services --organization=$orgId --effective --format="json(listPolicy.allValues)"

    matchers:
      - type: word
        words:
          - "ALLOW"

    extractors:
      - type: dsl
        dsl:
          - '"Organization " + orgId + " has not restricted Google Cloud APIs and services, allowing all services to be enabled"'
