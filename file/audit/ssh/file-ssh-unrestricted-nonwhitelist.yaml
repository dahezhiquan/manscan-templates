id: file-ssh-unrestricted-nonwhitelist

info:
  name: SSH IP 白名单未配置（本地文件安全扫描）
  author: pussycat0x
  severity: low
  description: |
    该模板检查 SSH 是否限制允许访问的来源 IP。缺少来源限制会扩大暴露面。
  remediation: |
    通过防火墙、TCP Wrapper 或 SSH 访问控制限制可信来源。
  reference:
    - https://vishalraj82.medium.com/hardening-openssh-security-37f5d634015f
    - https://www.cyberciti.biz/tips/howto-openssh-sshd-listen-multiple-ip-address.html
  metadata:
    verified: true
  tags: audit,config,file,ssh

file:
  - extensions:
      - all

    matchers:
      - type: word
        words:
          - "#ListenAddress"
