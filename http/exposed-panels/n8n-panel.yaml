id: n8n-panel

info:
  name: n8n 面板识别（指纹识别）
  author: userdehghani,rxerium
  severity: info
  description: |-
    检测到目标站点存在 n8n 相关响应特征。n8n 是工作流自动化平台，用于连接应用、编排自动化流程、管理凭据和触发器。模板请求 `/signin`，并通过页面标题或正文关键字、状态码确认该系统指纹，用于资产识别、系统盘点和暴露面梳理。
  reference:
    - https://n8n.io/
  classification:
    cpe: cpe:2.3:a:n8n:n8n:*:*:*:*:node.js:*:*:*
  metadata:
    verified: true
    max-request: 1
    vendor: n8n
    product: n8n
    shodan-query: http.favicon.hash:-831756631
  tags: panel,n8n,login,detect,discovery,ai
http:
  - method: GET
    path:
      - "{{BaseURL}}/signin"

    matchers-condition: and
    matchers:
      - type: word
        part: body
        words:
          - '<title>n8n.io'
        case-insensitive: true

      - type: status
        status:
          - 200

    extractors:
      - type: regex
        name: base64_content
        group: 1
        regex:
          - '<meta name="n8n:config:sentry" content="([A-Za-z0-9+/=]+)"'
        internal: true

      - type: dsl
        name: version
        dsl:
          - 'replace_regex(base64_decode(base64_content), ".*n8n@([0-9]+\\.[0-9]+\\.[0-9]+).*", "$1")'
        internal: true

      - type: dsl
        dsl:
          - '"n8n Version: " + version'
