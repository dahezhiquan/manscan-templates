id: phpinfo-files

info:
  name: PHPinfo 页面 检测（暴露面识别）
  author: pdteam,daffainfo,meme-lord,dhiyaneshDK,wabafet,mastercho
  severity: low
  description: |
    检测到对外可访问的 PHPinfo 页面。这类配置资源可能包含部署细节、访问凭据、内部地址、组件版本或调试开关，公开暴露后会显著增加被侦察和后续利用的风险。
  remediation: |
    - 禁止在公网暴露诊断页面、环境信息页或默认调试入口。
    - 通过 Web 服务器访问控制限制相关页面，仅对受信任管理员开放。
    - 清理页面中泄露的路径、扩展、环境变量与凭据，并评估后续风险。
  classification:
    cwe-id: CWE-200
  metadata:
    max-request: 25
  tags: config,exposure,phpinfo,vuln

http:
  - method: GET
    path:
      - "{{BaseURL}}{{paths}}"
    payloads:
      paths:
        - "/php.php"
        - "/php2.php"
        - "/phpinfo.php"
        - "/info.php"
        - "/infophp.php"
        - "/php_info.php"
        - "/test.php"
        - "/i.php"
        - "/a.php"
        - "/p.php"
        - "/pi.php"
        - "/asdf.php"
        - "/pinfo.php"
        - "/phpversion.php"
        - "/time.php"
        - "/inf0.php"
        - "/index.php"
        - "/temp.php"
        - "/old_phpinfo.php"
        - "/infos.php"
        - "/linusadmin-phpinfo.php"
        - "/php-info.php"
        - "/dashboard/phpinfo.php"
        - "/_profiler/phpinfo.php"
        - "/_profiler/phpinfo"
        - "/?phpinfo=1"
        - "/l.php?act=phpinfo"
        - "/testxx.php"

    stop-at-first-match: true

    matchers-condition: and
    matchers:
      - type: word
        part: body
        words:
          - "PHP Extension"
          - "PHP Version"
        condition: and

      - type: status
        status:
          - 200

    extractors:
      - type: regex
        part: body
        group: 1
        regex:
          - '>PHP Version <\/td><td class="v">([0-9.]+)'
