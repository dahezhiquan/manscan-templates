id: api-ebird

info:
  name: eBird API Token 可用性校验（token喷洒）
  author: daffainfo
  severity: info
  description: 该模板通过调用 eBird API 的已知接口验证提供的 token 是否有效，命中后通常表示可访问汇率、货币或金融校验能力。
  reference:
    - https://documenter.getpostman.com/view/664302/S1ENwy59
    - https://github.com/daffainfo/all-about-apikey/tree/main/ebird
  metadata:
    max-request: 1
  tags: token-spray,ebird

self-contained: true

http:
  - method: GET
    path:
      - "https://api.ebird.org/v2/data/obs/KZ/recent"

    headers:
      X-eBirdApiToken: "{{token}}"
    matchers:
      - type: word
        part: body
        words:
          - '"speciesCode":'
          - '"comName":'
          - '"sciName":'
          - '"locId":'
        condition: and
