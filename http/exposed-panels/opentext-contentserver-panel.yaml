id: opentext-contentserver-panel

info:
  name: OpenText Content Server 登录面板识别（暴露面识别）
  author: righettod
  severity: info
  description: |
    该模板通过识别 OpenText Content Server 登录入口的页面标题、特征文本或重定向行为，判断目标是否暴露了对应的认证界面。若命中，说明该登录面板对外可访问，可用于暴露面梳理与后续安全评估。
  reference:
    - https://www.opentext.com/products/document-management
  metadata:
    max-request: 1
    verified: true
    shodan-query: http.title:"Content Server"
  tags: panel,opentext,login,discovery

http:
  - method: GET
    path:
      - "{{BaseURL}}"

    host-redirects: true
    max-redirects: 4
    matchers:
      - type: dsl
        dsl:
          - 'status_code == 200'
          - 'contains_any(to_lower(body), "opentext content server", "opentext content suite")'
        condition: and

    extractors:
      - type: regex
        part: body
        group: 1
        regex:
          - '(?i)login\.js\?v=([0-9.]+)'
          - '(?i)OpenText\s+Content\s+Server\s+version\s+([0-9.]+)'
