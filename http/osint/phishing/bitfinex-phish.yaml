id: bitfinex-phish

info:
  name: Bitfinex 仿冒钓鱼网站（钓鱼网站识别）
  author: rxerium
  severity: info
  description: |
    检测到疑似仿冒 Bitfinex 的钓鱼网站。模板在目标页面返回 200、页面内容命中 Bitfinex 的金融或支付页面特征，且当前主机不属于 bitfinex.com 官方域名时触发，用于识别借用 Bitfinex 品牌页面诱导用户信任的仿冒站点。
  reference:
    - https://bitfinex.com
  metadata:
    max-request: 1
  tags: phishing,bitfinex,crypto,osint,discovery
http:
  - method: GET
    path:
      - "{{BaseURL}}"

    host-redirects: true
    max-redirects: 2

    matchers-condition: and
    matchers:
      - type: word
        words:
          - 'Bitfinex'
          - 'Bitfinex is the longest-running and most liquid major cryptocurrency exchange. Founded in 2012, it has become the go-to platform for traders &amp; institutional investors.'
        condition: and

      - type: status
        status:
          - 200

      - type: dsl
        dsl:
          - '!contains(host,"bitfinex.com")'
