id: piwik-installer

info:
  name: Piwik 安装向导 暴露
  author: DhiyaneshDk
  severity: low
  description: |
    检测到 Piwik 安装向导 暴露。该页面属于安装、初始化或配置向导流程，若对外暴露，攻击者可能完成初始化、创建管理员账户或重新配置目标系统。
  metadata:
    verified: true
    max-request: 1
    shodan-query: title:"Piwik &rsaquo; Installation"
  tags: misconfig,piwik,install,vuln

http:
  - method: GET
    path:
      - '{{BaseURL}}'

    matchers-condition: and
    matchers:
      - type: word
        part: body
        words:
          - "Piwik"
          - "Installation status"
        condition: and

      - type: word
        part: header
        words:
          - "text/html"

      - type: status
        status:
          - 200
