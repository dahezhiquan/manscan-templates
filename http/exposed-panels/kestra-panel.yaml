id: kestra-panel

info:
  name: Kestra 登录面板（暴露面识别）
  author: Th3l0newolf
  severity: low
  description: |-
    检测到目标站点暴露 Kestra 登录面板。Kestra 是事件驱动的工作流编排和数据管道平台，用于管理 Flow、任务、执行历史、凭据和自动化调度。模板请求 `/ui/login?from=/dashboards`，并通过页面标题或正文关键字、状态码确认入口可访问；此类面板若直接暴露在公网，会增加账号枚举、口令攻击、漏洞匹配和未授权访问尝试的机会。
  impact: |-
    - 攻击者可确认目标部署了 Kestra 或相关工作流平台，并据此开展账号枚举、口令喷洒、默认凭据尝试或针对性漏洞匹配。
    - 若面板存在弱口令、默认配置、访问控制缺陷或未修复漏洞，可能导致工作流被篡改、凭据泄露、任务被未授权执行或业务自动化链路被接管。
    - 管理入口长期暴露在公网会扩大攻击面，增加自动化扫描、撞库、社会工程和后续横向移动的风险。
  remediation: |-
    - 将 Kestra 登录面板限制在内网、VPN、堡垒机或可信源 IP 访问范围内，避免管理入口直接暴露在公网。
    - 启用强密码、多因素认证、登录失败限制和默认账户清理，定期审计登录日志与管理员账号权限。
    - 保持 Kestra 和相关运行环境更新到受支持版本，关闭不必要的管理路径，并在必须公网访问时增加反向代理访问控制、WAF 或零信任访问策略。
  classification:
    cvss-metrics: CVSS:3.0/AV:N/AC:L/PR:N/UI:N/S:U/C:N/I:N/A:N
    cwe-id: CWE-200
  metadata:
    max-request: 1
    verified: true
    shodan-query: html:"Kestra"
  tags: panel,login,kestra,discovery
http:
  - method: GET
    path:
      - "{{BaseURL}}/ui/login?from=/dashboards"

    matchers-condition: and
    matchers:
      - type: word
        part: body
        words:
          - "<title>Kestra</title>"
          - 'window.KESTRA_UI_PATH = "/ui/";'
        condition: and

      - type: status
        status:
          - 200
