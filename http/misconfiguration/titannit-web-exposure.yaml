id: titannit-web-exposure

info:
  name: TitanNit Web Control 暴露
  author: DhiyaneshDk
  severity: medium
  metadata:
    verified: true
    max-request: 1
    shodan-query: title:"TitanNit Web Control"
  tags: misconfig,titannit,web-control,exposure,vuln
  description: |-
    该模板用于核查 TitanNit Web Control 暴露。目标因访问控制、默认配置或文件发布策略不当，暴露了不应公开的页面、接口或文件。模板访问 目标入口，并根据响应状态、页面关键字或组件特征确认该配置问题。
  impact: |-
    - 攻击者可获取内部信息、组件版本、配置细节或可操作的管理入口。
    - 暴露信息可能辅助后续漏洞利用、权限提升、横向移动或业务数据访问。
  remediation: |-
    - 收敛公开访问面，只暴露业务必需的页面和接口。
    - 对敏感入口增加认证授权、来源限制和访问审计。
    - 定期检查部署目录、反向代理规则和默认配置，清理示例与调试资源。
http:
  - method: GET
    path:
      - "{{BaseURL}}"

    matchers-condition: and
    matchers:
      - type: word
        part: body
        words:
          - "<title>TitanNit Web Control"
          - "System</a>"
        condition: and

      - type: status
        status:
          - 200
