id: jupyterhub-default-login

info:
  name: Jupyterhub 默认管理员账户发现（弱口令）
  author: For3stCo1d
  severity: high
  description: |
    该模板用于检测 Jupyterhub 是否仍可使用默认凭据或弱口令登录。模板主要向 `/hub/login?next=` 等认证入口发送请求，使用内置默认凭据组合进行认证尝试，并根据状态码、认证 Cookie、跳转位置或登录后的页面关键字判断登录是否成功；命中说明目标未及时修改出厂、示例或初始化账号口令。
  impact: |
    - 攻击者可进入 Jupyterhub 管理后台，修改任务、服务、插件、路由、作业调度或部署配置。
    - 在 DevOps、网关、监控或运维场景中，后台失陷可能影响生产任务执行、泄露密钥配置，并扩大到下游主机或业务系统。
  remediation: |
    - 立即修改默认管理员口令并清理示例账号，按角色最小化后台管理权限。
    - 将控制台和管理 API 放入受控网络或 VPN 后方，并开启多因素认证、登录失败限制和操作审计。
    - 复核近期任务、插件、连接配置、访问令牌和部署记录，轮换可能暴露的密钥。
  reference:
    - https://github.com/jupyterhub/jupyterhub
  classification:
    cvss-metrics: CVSS:3.0/AV:N/AC:L/PR:N/UI:N/S:C/C:L/I:L/A:L
    cvss-score: 8.3
    cwe-id: CWE-522
    cpe: cpe:2.3:a:jupyter:jupyterhub:*:*:*:*:*:*:*:*
  metadata:
    max-request: 2
    shodan-query: http.title:"JupyterHub"
    product: jupyterhub
    vendor: jupyter
  tags: jupyterhub,default-login,vuln

http:
  - raw:
      - |
        POST /hub/login?next= HTTP/1.1
        Host: {{Hostname}}
        Content-Type: application/x-www-form-urlencoded

        username={{user}}&password={{pass}}

    attack: pitchfork
    payloads:
      user:
        - admin
        - jovyan
      pass:
        - admin
        - jupyter

    matchers-condition: and
    matchers:
      - type: dsl
        dsl:
          - contains(tolower(header), 'jupyterhub-session-id=')
          - contains(tolower(header), 'jupyterhub-hub-login=')
        condition: and

      - type: status
        status:
          - 302
