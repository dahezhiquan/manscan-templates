id: wms-server-detect

info:
  name: WMS Server 指纹识别（指纹识别）
  author: pikpikcu
  severity: info
  description: >-
    WMS Server 是 Web 地图服务组件，用于按照 OGC WMS 协议发布和渲染地图图层。该模板通过请求目标服务并检查预设路径或首页响应、HTTP
    响应头、页面正文关键字等指纹特征，判断目标是否使用或暴露了 WMS Server 相关组件；命中结果仅表示指纹特征匹配，可用于资产盘点、技术栈识别和后续安全评估，不代表已确认存在可利用漏洞。
  classification:
    cpe: cpe:2.3:a:wms_project:wms:*:*:*:*:*:*:*:*
  metadata:
    verified: true
    max-request: 1
    vendor: wms_project
    product: wms
    fofa-query: app="WmsServer"
  tags: tech,wms,httpserver,discovery
http:
  - method: GET
    path:
      - "{{BaseURL}}"

    matchers:
      - type: word
        part: header
        words:
          - "WMSServer/"
