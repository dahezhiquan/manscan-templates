id: default-websphere-liberty

info:
  name: WebSphere Liberty 默认页面 指纹识别（指纹识别）
  author: oppsec
  severity: info
  description: WebSphere Liberty 默认页面 是 IBM 轻量级 Java 应用服务器，用于运行企业 Java 和微服务应用。该模板请求首页，并依据 HTTP 200 状态码、页面标题、正文关键字或品牌资源特征识别目标是否使用或暴露了 WebSphere Liberty 默认页面 相关组件，适用于资产盘点、技术栈识别和后续安全评估；命中结果仅表示指纹特征匹配，不代表已确认存在可利用漏洞。
  classification:
    cpe: cpe:2.3:a:ibm:websphere_liberty:*:*:*:*:*:*:*:*
  metadata:
    verified: true
    max-request: 1
    vendor: ibm
    product: websphere_liberty
    shodan-query: http.title:"WebSphere Liberty"
  tags: tech,websphere,liberty,discovery

http:
  - method: GET
    path:
      - "{{BaseURL}}"

    matchers-condition: and
    matchers:
      - type: word
        part: body
        words:
          - "WebSphere Liberty"

      - type: status
        status:
          - 200

    extractors:
      - type: regex
        part: body
        regex:
          - "(WebSphere Liberty).*?([a-zA-Z0-9.-]+)"
