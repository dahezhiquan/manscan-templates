id: 1a-auto-phish

info:
  name: 1A Auto 仿冒钓鱼网站（钓鱼网站识别）
  author: rxerium
  severity: info
  description: |
    检测到疑似仿冒 1A Auto 的钓鱼网站。模板在目标页面返回 200、页面内容命中 1A Auto 的品牌页面特征，且当前主机不属于 1aauto.com 官方域名时触发，用于识别借用 1A Auto 品牌页面诱导用户信任的仿冒站点。
  reference:
    - https://1aauto.com
  metadata:
    max-request: 1
  tags: phishing,1a-auto,ecommerce,osint,discovery
http:
  - method: GET
    path:
      - "{{BaseURL}}"

    host-redirects: true
    max-redirects: 2

    matchers-condition: and
    matchers:
      - type: word
        words:
          - '<title>1A Auto | Aftermarket Car Parts -  Buy Quality Auto Parts Online'

      - type: status
        status:
          - 200

      - type: dsl
        dsl:
          - '!contains(host,"1aauto.com")'
