id: azure-defender-auto-provisioning-disabled
info:
  name: Microsoft Defender for Cloud 自动预配未启用（云安全）
  author: princechaddha
  severity: medium
  description: Microsoft Defender for Cloud 的自动预配用于为支持的 Azure 资源自动配置安全监控代理或相关数据收集能力，关闭后新资源可能未及时纳入安全监控。本模板执行 az security auto-provisioning-setting list，并在 autoProvision 返回 Off 时报告。
  impact: |
    - 虚拟机和其他支持资源可能缺少安全遥测，导致漏洞、恶意行为和配置偏差无法及时被 Defender for Cloud 发现。
    - 监控覆盖不完整会形成检测盲区，延迟告警、响应和事件调查，并削弱统一安全策略的执行效果。
  remediation: |
    - 在 Defender for Cloud 环境设置中开启适用资源的自动预配，并确认监控代理、工作区和数据收集规则配置正确。
    - 对已存在但未纳管的资源执行补充部署和健康检查，持续监控代理状态、覆盖范围及卸载变更。
  reference:
    - https://docs.microsoft.com/en-us/azure/security-center/security-center-auto-provisioning
  metadata:
    vendor: microsoft
    product: defender-for-cloud
  tags: cloud,devops,azure,microsoft,defender-for-cloud,azure-cloud-config

self-contained: true
code:
  - engine:
      - sh
      - bash
    source: |
      az security auto-provisioning-setting list

    matchers:
      - type: word
        words:
          - '"autoProvision": "Off"'

    extractors:
      - type: dsl
        dsl:
          - '"Automatic Provisioning for Microsoft Defender are not enabled"'
