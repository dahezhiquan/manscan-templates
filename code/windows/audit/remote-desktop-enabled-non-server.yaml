id: remote-desktop-enabled-non-server

info:
  name: 非服务器系统启用远程桌面（本地基线扫描）
  author: princechaddha
  severity: high
  description: |
    无必要启用会扩大远程登录攻击面。对应基线项为“工作站等非服务器版本是否启用远程桌面”；模板读取注册表 `HKLM:\System\CurrentControlSet\Control\Terminal Server` 的 `fDenyTSConnections` 值，结合命中值判断策略是否不符合基线。
  impact: |
    - 攻击者可针对终端发起 RDP 爆破或利用漏洞获得访问。
    - 远程入口暴露或协议保护不足会增加暴力破解、中间人攻击和远程控制风险。
  remediation: |
    - 在非服务器系统上禁用不需要的远程桌面，并通过集中管理工具替代。
    - 限制访问来源，优先使用加密和强认证，并关闭无业务需求的远程服务。
  tags: windows,remote-desktop,network,code,windows-audit

self-contained: true

code:
  - pre-condition: |
      IsWindows();
    engine:
      - powershell
      - powershell.exe
    args:
      - -ExecutionPolicy
      - Bypass
    pattern: "*.ps1"
    source: |
      Get-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server' -Name 'fDenyTSConnections'

    matchers:
      - type: word
        words:
          - "0"
