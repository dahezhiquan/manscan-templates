id: ec2-unrestricted-cifs
info:
  name: EC2 安全组对公网开放 CIFS/SMB 端口（云安全）
  author: princechaddha
  severity: critical
  description: EC2 安全组对公网开放 CIFS/SMB 端口是一类文件共享服务暴露风险，TCP 445 面向互联网会增加凭据爆破、横向移动和文件共享漏洞利用风险。CIFS/SMB 通常应限制在内网或受信任网络中使用，不应直接暴露给任意来源。模板通过 `describe-security-groups` 筛选 445 端口且来源为 `0.0.0.0/0` 或 `::/0` 的入站规则，并输出命中的安全组 ID。
  impact: |
    - 文件共享服务可能被互联网扫描、爆破或利用，导致共享数据泄露或主机被入侵。
    - 一旦 SMB 服务被攻破，攻击者可能借助文件共享和凭据重用进行横向移动。
  remediation: |
    - 移除面向 `0.0.0.0/0` 和 `::/0` 的 445 端口入站规则。
    - 仅允许 VPN、专线或明确受信任网段访问 SMB 服务，并审计主机共享权限。
  reference:
    - https://docs.aws.amazon.com/AWSEC2/latest/UserGuide/using-network-security.html
  metadata:
    vendor: amazon
    product: ec2
  tags: cloud,devops,aws,amazon,ec2,aws-cloud-config

variables:
  region: "us-east-1"

self-contained: true
code:
  - engine:
      - sh
      - bash
    source: |
      aws ec2 describe-security-groups --region $region --filters Name=ip-permission.from-port,Values=445 Name=ip-permission.to-port,Values=445 Name=ip-permission.cidr,Values='0.0.0.0/0' Name=ip-permission.ipv6-cidr,Values='::/0' --output json --query 'SecurityGroups[*].GroupId'

    extractors:
      - type: json
        name: securitygroup
        internal: true
        json:
          - '.[]'

      - type: dsl
        dsl:
          - 'securitygroup + " security group(s) alows unrestricted access (0.0.0.0/0 or ::/0) on TCP port 445"'
