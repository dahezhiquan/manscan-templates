id: api-malshare

info:
  name: MalShare API Token 可用性校验（token喷洒）
  author: daffainfo
  severity: info
  description: 该模板通过调用 MalShare API 的已知接口验证提供的 token 是否有效，命中后通常表示可访问安全情报与资产查询能力。
  reference:
    - https://malshare.com/doc.php
    - https://github.com/daffainfo/all-about-apikey/tree/main/malshare
  metadata:
    max-request: 1
  tags: token-spray,malshare

self-contained: true

http:
  - method: GET
    path:
      - "https://api.malshare.com/api.php?api_key={{token}}&action=getlist"

    matchers:
      - type: word
        part: body
        words:
          - '"md5":'
          - '"sha1":'
        condition: and
