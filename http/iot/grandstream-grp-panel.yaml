id: grandstream-grp-panel

info:
  name: Grandstream GRP Web 管理面板（指纹识别）
  author: DhiyaneshDk
  severity: info
  description: |
    Grandstream GRP 系列设备 Web 管理界面用于配置 IP 电话、语音网关或统一通信终端。该模板访问 `/login`，通过 `tl.account.ucm.js`、`tl.phoneSettings.js` 等前端资源识别 Grandstream GRP 管理面板。
  classification:
    cpe: cpe:2.3:o:grandstream:ucm6200_firmware:*:*:*:*:*:*:*:*
  metadata:
    verified: true
    max-request: 1
    vendor: grandstream
    shodan-query: "tl.account.ucm.js"
  tags: panel,grandstream,grp,iot,detect

http:
  - method: GET
    path:
      - "{{BaseURL}}/login"

    matchers-condition: and
    matchers:
      - type: word
        words:
          - "tl.account.ucm.js"
          - "tl.phoneSettings.js"
        condition: and

      - type: word
        words:
          - "tl.maintenance.js"
          - "tl.sysSettings.js"
        condition: or

      - type: status
        status:
          - 200
