id: carestream-vue-detect

info:
  name: CARESTREAM Vue Motion 指纹识别（指纹识别）
  author: philippedelteil
  severity: info
  description: CARESTREAM Vue Motion 是医学影像 Web 查看系统，用于访问 PACS 影像、报告和临床资料。该模板请求 `/portal/favicon.ico`、`/portal/images/MyVue/MyVueHelp.png`，并依据 DSL 条件识别目标是否使用或暴露了 CARESTREAM Vue Motion 相关组件，适用于资产盘点、技术栈识别和后续安全评估；命中结果仅表示指纹特征匹配，不代表已确认存在可利用漏洞。
  reference:
  - https://www.carestream.com/en/us/-/media/publicsite/resources/radiography-and-health-it/product-brochures/ris-pacs/pdfs/brochure-vue-motion-201601.pdf
  metadata:
    max-request: 2
  tags: tech,myvuehelp,discovery

http:
  - method: GET
    path:
      - "{{BaseURL}}/portal/favicon.ico"
      - "{{BaseURL}}/portal/images/MyVue/MyVueHelp.png"

    host-redirects: true
    stop-at-first-match: true
    max-redirects: 2

    matchers-condition: or
    matchers:
      - type: dsl
        name: "myvuehelp"
        dsl:
          - "status_code==200 && (\"84054196570ecd7526894ccb6e7c5c6e\" == md5(body))"

      - type: dsl
        name: "myvuehelp-favicon"
        dsl:
          - "status_code==200 && (\"1c4b2c10acccc48852d12eddadaf7944\" == md5(body))"
