id: api-stytch

info:
  name: Stytch API Token 可用性校验（token喷洒）
  author: daffainfo
  severity: info
  description: 该模板通过调用 Stytch API 的已知接口验证提供的 token 是否有效，命中后通常表示可访问支付或身份验证能力。
  reference:
    - https://stytch.com/docs/api
    - https://github.com/daffainfo/all-about-apikey/tree/main/stytch
  metadata:
    max-request: 1
  tags: token-spray,stytch

self-contained: true

http:
  - raw:
      - |
        POST https://test.stytch.com/v1/users HTTP/1.1
        Authorization: Basic {{base64(id + ':' + secret)}}
        Host: test.stytch.com
        Content-Type: application/json

        {"email": "test@stytch.com"}

    matchers:
      - type: word
        part: body
        words:
          - '"status_code":'
          - '"request_id":'
          - '"user_id":'
        condition: and
