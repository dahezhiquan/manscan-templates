id: dolibarr-panel

info:
  name: Dolibarr 登录面板识别（暴露面识别）
  author: pikpikcu,daffainfo,righettod
  severity: info
  description: 该模板通过识别 Dolibarr 登录入口的页面标题、特征文本或重定向行为，判断目标是否暴露了对应的认证界面。若命中，说明该登录面板对外可访问，可用于暴露面梳理与后续安全评估。
  classification:
    cvss-metrics: CVSS:3.0/AV:N/AC:L/PR:N/UI:N/S:U/C:N/I:N/A:N
    cwe-id: CWE-200
  metadata:
    max-request: 1
    shodan-query: http.title:"Dolibarr"
  tags: panel,dolibarr,discovery

http:
  - method: GET
    path:
      - "{{BaseURL}}"

    matchers-condition: and
    matchers:
      - type: word
        part: header
        words:
          - 'Set-Cookie: DOLSESSID_'

      - type: word
        part: body
        words:
          - '<meta name="author" content="Dolibarr Development Team">'
          - 'authentication mode = dolibarr'
          - 'Includes JS of Dolibarr'
          - '<div class="login_table_title center" title="Dolibarr'
        condition: or

      - type: status
        status:
          - 200

    extractors:
      - type: regex
        part: body
        group: 1
        regex:
          - '<td align="center">Dolibarr ([0-9.]+)<\/td>'
          - '<td class="center">Dolibarr ([0-9.]+)<\/td>'
          - '<div id="infoVersion">Dolibarr ([0-9.]+)<\/div>'
          - 'amp;version=([0-9.]+)'
