id: azure-vm-create-update-unalerted
info:
  name: Azure 虚拟机创建或更新告警未配置（云安全）
  author: princechaddha
  severity: high
  description: Azure 虚拟机创建或更新可能改变镜像、网络、身份、磁盘和启动配置；未配置 Activity Log 告警时，计算资源的高风险变更可能不被及时发现。该模板枚举已启用的 Activity Log Alert，并检查 condition 是否缺少 Microsoft.Compute/virtualMachines/write 操作条件。
  impact: |
    - 未授权更新可能植入恶意镜像、开放公网访问、替换磁盘或授予过宽的托管身份权限。
    - 异常创建的虚拟机可能用于挖矿、横向移动、数据处理或持久化。
  remediation: |
    - 创建针对虚拟机创建和更新操作的 Activity Log Alert，并接入计算资源安全响应流程。
    - 对镜像来源、网络接口、磁盘加密、托管身份和公网 IP 执行部署基线校验。
  reference:
    - https://docs.microsoft.com/en-us/azure/azure-monitor/platform/alerts-activity-log
  metadata:
    vendor: microsoft
    product: azure-monitor
  tags: cloud,devops,azure,microsoft,virtual-machines,azure-cloud-config

flow: |
  code(1);
  for (let AlertData of iterate(template.alertList)) {
    set("vm_id", AlertData);
    code(2);
  }

self-contained: true
code:
  - engine:
      - sh
      - bash
    source: |
      az monitor activity-log alert list --output json --query '[?(enabled==`true`)].id'
    extractors:
      - type: json
        name: alertList
        internal: true
        json:
          - '.[]'

  - engine:
      - sh
      - bash
    source: |
      az monitor activity-log alert show --ids "$vm_id" --query 'condition'
    matchers-condition: and
    matchers:
      - type: word
        words:
          - '"field": "operationName"'

      - type: word
        words:
          - "Microsoft.Compute/virtualMachines/write"
        negative: true

    extractors:
      - type: dsl
        dsl:
          - 'vm_id + " does not have the correct alert configuration for Create/Update Virtual Machine events"'
