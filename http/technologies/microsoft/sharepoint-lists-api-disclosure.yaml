id: sharepoint-lists-api-disclosure

info:
  name: Microsoft SharePoint Lists API 指纹识别（指纹识别）
  author: theamanrawat
  severity: info
  description: >-
    Microsoft SharePoint Lists API 是 SharePoint 列表数据接口，用于读取和管理站点列表、字段和条目数据。该模板通过请求目标服务并检查预设路径或首页响应、DSL
    条件等指纹特征，判断目标是否使用或暴露了 Microsoft SharePoint Lists API 相关组件；命中结果仅表示指纹特征匹配，可用于资产盘点、技术栈识别和后续安全评估，不代表已确认存在可利用漏洞。
  reference:
  - https://learn.microsoft.com/en-us/sharepoint/dev/sp-add-ins/working-with-lists-and-list-items-with-rest
  metadata:
    verified: true
    max-request: 1
    vendor: microsoft
    product: sharepoint
    shodan-query: http.title:"SharePoint"
    fofa-query: title="SharePoint"
  tags: sharepoint,microsoft,exposure,misconfig,tech
http:
  - method: GET
    path:
      - "{{BaseURL}}/_api/web/lists"

    matchers:
      - type: dsl
        dsl:
          - 'status_code == 200'
          - 'contains_all(body, "TemplateFeatureId","d:ParentWebUrl", "Web/Lists")'
        condition: and
