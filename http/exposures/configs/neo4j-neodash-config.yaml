id: neo4j-neodash-config

info:
  name: Neo4j Neodash 配置暴露（暴露面识别）
  author: icarot
  severity: medium
  description: |
    检测到对外可访问的 Ne。这类配置资源可能包含部署细节、访问凭据、内部地址、组件版本或调试开关，公开暴露后会显著增加被侦察和后续利用的风险。
  classification:
    cpe: cpe:2.3:a:neo4j:*:*:*:*:*:*:*:*:*
  metadata:
    max-request: 1
    verified: true
    vendor: neo4j
    product: neodash
    shodan-query: title:"NeoDash"
  tags: config,exposure,neodash,neo4j,vuln

http:
  - method: GET
    path:
      - "{{BaseURL}}/config.json"

    matchers-condition: and
    matchers:
      - type: word
        part: body
        words:
          - 'standaloneHost'
          - 'standalonePort'
          - 'standaloneDatabase'
        condition: and

      - type: word
        part: header
        words:
          - 'application/json'

      - type: status
        status:
          - 200

    extractors:
      - type: json
        name: config
        part: body
        json:
          - '.standaloneDatabase,.standaloneUsername,.standalonePassword'
