id: dependency-track-panel

info:
  name: Dependency-Track Login 面板（暴露面识别）
  author: Th3l0newolf
  severity: info
  description: |
    该模板通过识别 Dependency-Track Login 登录入口的页面标题、特征文本或重定向行为，判断目标是否暴露了对应的认证界面。若命中，说明该登录面板对外可访问，可用于暴露面梳理与后续安全评估。
  reference:
    - https://docs.dependencytrack.org
  metadata:
    verified: true
    max-request: 1
    shodan-query: html:"Dependency-Track"
  tags: panel,login,dependency,track,discovery

http:
  - method: GET
    path:
      - "{{BaseURL}}/login?redirect=%2Fdashboard"

    matchers-condition: and
    matchers:
      - type: word
        part: body
        words:
          - "<title>Dependency-Track</title>"

      - type: status
        status:
          - 200
