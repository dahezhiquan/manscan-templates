id: exist-db-dashboard-access

info:
  name: eXist 数据库 仪表盘 访问
  author: ritikchaddha
  severity: high
  description: |
    该模板用于核查 eXist 数据库 仪表盘 访问。该类问题通常源于管理面板、仪表盘或监控控制台暴露在公网或缺少足够访问控制。模板会向目标发送探测请求，并依据匹配 `application/xml`、状态码 200等证据确认目标是否存在该配置问题。
  impact: |
    - 攻击者可获取系统状态、业务指标、任务信息、拓扑结构或管理入口线索。
    - 若面板存在默认凭据、弱认证或操作接口，可能进一步导致未授权管理或服务接管。
  remediation: |
    - 将管理面板和仪表盘限制在内网、VPN 或可信访问网关后。
    - 启用强认证、多因素认证、细粒度授权和操作审计。
    - 隐藏或关闭不需要公开的默认面板，并监控异常访问与暴力探测。
  reference:
    - https://exist-db.org/
  metadata:
    verified: true
    max-request: 2
    shodan-query: title:"eXist db"
    fofa-query: title="eXist db"
  tags: misconfig,exist-db,dashboard,login,exposure

variables:
  username: "admin"

http:
  - raw:
      - |
        POST /exist/apps/dashboard/login HTTP/1.1
        Host: {{Hostname}}
        Content-Type: application/x-www-form-urlencoded

        user={{username}}&password=

    matchers-condition: and
    matchers:
      - type: regex
        regex:
          - 'user"\s*:\s*"admin"'
          - 'dba"\s*:\s*"true"'
        condition: and

      - type: word
        part: content_type
        words:
          - "application/xml"

      - type: status
        status:
          - 200
