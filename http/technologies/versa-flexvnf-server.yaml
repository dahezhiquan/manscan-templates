id: versa-flexvnf-server

info:
  name: Versa FlexVNF 服务器指纹识别（指纹识别）
  author: c-sh0
  severity: info
  description: |
    用于识别目标是否部署 Versa FlexVNF 服务器 并提取相关版本或构建信息，模板会结合 HTTP 响应头、状态码、特定路径或已知端点和版本或标识提取结果进行指纹匹配。
  reference:
    - https://versa-networks.com/products/components/
  metadata:
    max-request: 1
  tags: tech,versa,flexvnf,discovery

http:
  - method: GET
    path:
      - "{{BaseURL}}/&?=?"

    host-redirects: true
    max-redirects: 2

    matchers-condition: and
    matchers:
      - type: word
        part: header
        words:
          - "Server: Versa"
          - "FlexVNF"
        condition: and

      - type: status
        status:
          - 200

    extractors:
      - type: kval
        part: header
        kval:
          - Server
