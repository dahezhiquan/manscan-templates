id: squidex-panel

info:
  name: Squidex Headless CMS 面板识别（暴露面识别）
  author: johnk3r
  severity: info
  description: |
    该模板通过识别 Squidex Headless CMS 面板、控制台或管理界面的页面特征，判断目标是否暴露了对应服务入口。若命中，说明该后台或运维界面对外可访问，可用于资产识别与暴露面排查。
  reference:
    - https://github.com/Squidex/squidex
  metadata:
    verified: true
    max-request: 1
    shodan-query: http.favicon.hash:1099097618
  tags: panel,squidex,login,discovery

http:
  - method: GET
    path:
      - "{{BaseURL}}"
      - "{{BaseURL}}/favicon.ico"

    stop-at-first-match: true
    matchers-condition: or
    matchers:
      - type: word
        part: body
        words:
          - '<title>Squidex Headless CMS</title>'
          - '<div>Loading Squidex</div>'
        case-insensitive: true
        condition: or

      - type: dsl
        dsl:
          - "status_code==200 && (\"1099097618\" == mmh3(base64_py(body)))"
