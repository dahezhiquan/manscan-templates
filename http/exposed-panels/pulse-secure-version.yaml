id: pulse-secure-version

info:
  name: Pulse Secure Version 面板暴露（暴露面识别）
  author: dadevel
  severity: low
  description: Pulse Secure Version 是企业 VPN/远程访问网关，用于用户认证、SSL VPN 和内部资源访问控制。该模板请求 `/dana-na/nc/nc_gina_ver.txt`、`/dana-cached/hc/HostCheckerInstaller.osx` 路径，并依据页面标题、正文关键字或品牌资源特征判断目标是否对外暴露了 Pulse Secure Version 的面板，用于发现互联网可访问的后台、控制台或业务入口。
  impact: "- 暴露的 Pulse Secure Version 面板会泄露目标正在使用的产品、部署路径、页面特征或组织业务入口，便于攻击者进行指纹确认和漏洞匹配。\n- 如果认证、访问控制或默认凭据策略薄弱，攻击者可能进一步尝试进入后台，影响后台配置、业务数据、用户账号或设备运行状态。\n- 对互联网开放的管理入口会增加暴力破解、凭据填充、已知漏洞利用和钓鱼仿冒的攻击面。"
  remediation: "- 将 Pulse Secure Version 的面板限制在内网、VPN、零信任代理或专用管理网段访问，避免直接暴露在互联网。\n- 启用强密码、多因素认证、登录失败限制和审计告警，排查默认账号、弱口令及长期未使用账号。\n- 保持 Pulse Secure Version 及其依赖组件更新到受支持版本，并通过反向代理、ACL 或防火墙限制敏感路径访问。"
  classification:
    cpe: cpe:2.3:a:pulsesecure:pulse_connect_secure:*:*:*:*:*:*:*:*
  metadata:
    max-request: 2
    vendor: pulsesecure
    product: pulse_connect_secure
    shodan-query: cpe:"cpe:2.3:a:pulsesecure:pulse_connect_secure"
  tags: pulse,panel,pulsesecure,discovery

http:
  - method: GET
    path:
      - "{{BaseURL}}/dana-na/nc/nc_gina_ver.txt" # not present in newer release
      - "{{BaseURL}}/dana-cached/hc/HostCheckerInstaller.osx"

    stop-at-first-match: true

    matchers-condition: or
    matchers:
      - type: word
        part: body
        words:
          - 'NAME="ProductVersion"'
          - "<key>version</key>"
        condition: or
        case-insensitive: true

    extractors:
      - type: regex
        group: 1
        part: body
        regex:
          - '(?i)NAME="ProductVersion"\s+?VALUE="([^"]+)"'

      - type: regex
        group: 1
        part: body
        regex:
          - "(?i)<string>([^<]+)</string>"
