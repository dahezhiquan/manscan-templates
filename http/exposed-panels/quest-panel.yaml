id: quest-panel

info:
  name: Quest Modem Configuration Login 面板（暴露面识别）
  author: Splint3r7
  severity: info
  description: |
    该模板通过识别 Quest Modem Configuration Login 登录入口的页面标题、特征文本或重定向行为，判断目标是否暴露了对应的认证界面。若命中，说明该登录面板对外可访问，可用于暴露面梳理与后续安全评估。
  classification:
    cwe-id: CWE-200
  metadata:
    max-request: 1
    shodan-query: http.title:"Advanced Setup - Security - Admin User Name &amp; Password"
  tags: panel,quest,login,detect,discovery

http:
  - method: GET
    path:
      - "{{BaseURL}}/cgi-bin/webcm?getpage=../html/login.html"

    matchers:
      - type: dsl
        dsl:
          - 'contains(body, "<title>Advanced Setup - Security - Admin User Name &amp; Password</title>")'
          - 'status_code == 200'
        condition: and
