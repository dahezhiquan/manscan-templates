id: smoothwall-firewall-panel

info:
  name: Smoothwall 防火墙 - 登录面板（暴露面识别）
  author: rxerium
  severity: info
  description: |-
    Smoothwall 是一家总部位于英国的防火墙和网页过滤设备厂商，广泛部署于学校、地方政府和企业，用于互联网安全与网络安全防护管理。
  reference:
    - https://www.smoothwall.com/
  metadata:
    max-request: 1
    shodan-query: 'http.title:"Smoothwall"'
  tags: panel,smoothwall,firewall,vpn

http:
  - method: GET
    path:
      - "{{BaseURL}}"

    redirects: true
    max-redirects: 2

    matchers-condition: and
    matchers:
      - type: word
        words:
          - 'Smoothwall'
        part: body

      - type: status
        status:
          - 200
