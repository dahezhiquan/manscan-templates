id: angular-hybris-sap-spartacus-detect

info:
  name: SAP Spartacus 指纹识别（指纹识别）
  author: TechbrunchFR
  severity: info
  description: SAP Spartacus 是基于 Angular 的 SAP Commerce Storefront，用于构建电商前端和客户体验页面。该模板请求首页，并依据页面标题、正文关键字或品牌资源特征识别目标是否使用或暴露了 SAP Spartacus 相关组件，适用于资产盘点、技术栈识别和后续安全评估；命中结果仅表示指纹特征匹配，不代表已确认存在可利用漏洞。
  reference:
  - https://github.com/SAP/spartacus
  metadata:
    product: angular
    verified: true
    max-request: 1
  tags: tech,sap,hybris,angular,spartacus,discovery

http:
  - method: GET
    path:
      - '{{BaseURL}}'

    matchers:
      - part: body
        type: word
        words:
          - "<cx-storefront"

    extractors:
      - type: regex
        name: detected_version
        part: body
        group: 1
        regex:
          - \bng-version\s*=\s*["\x27]([0-9]+(?:[.][0-9]+)+(?:[-+._][0-9A-Za-z]+)*)["\x27]
        internal: true
      - type: dsl
        dsl:
          - 'regex("^[0-9]+(?:[.][0-9]+)*(?:[-+._][0-9A-Za-z]+)*$", detected_version) ? detected_version : ""'
