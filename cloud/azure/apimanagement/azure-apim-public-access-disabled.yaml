id: azure-apim-public-access-disabled
info:
  name: Azure API Management 公共网络访问未禁用（云安全）
  author: princechaddha
  severity: high
  description: APIM 实例启用公共网络访问时，即使已规划 Private Endpoint，管理面或网关仍可能从公共入口到达，网络隔离边界不完整。该模板枚举 APIM 实例，查询 publicNetworkAccess，并在返回 Enabled 时报告公共网络访问未禁用。
  impact: |
    - 公共入口扩大 API 网关和管理接口的可达范围，增加扫描、凭据滥用和异常调用风险。
    - 私有网络策略可能被公共旁路削弱，导致访问审计、出口控制和敏感后端保护难以统一落实。
  remediation: |
    - 在确认 Private Endpoint、私有 DNS 和内部路由正常后，将 APIM 的 publicNetworkAccess 设置为 Disabled。
    - 通过 Entra ID、网络安全组、最小权限和网关策略限制管理面及 API 调用，持续验证不存在公共旁路。
  reference:
    - https://docs.microsoft.com/en-us/azure/api-management/api-management-howto-protect-backend-with-private-link
  metadata:
    vendor: microsoft
    product: azure-api-management
  tags: cloud,devops,azure,microsoft,api-management,azure-cloud-config

flow: |
  code(1);
  for (let ServiceData of iterate(template.serviceList)) {
    ServiceData = JSON.parse(ServiceData);
    set("name", ServiceData.name);
    set("resourceGroup", ServiceData.resourceGroup);
    code(2);
  }

self-contained: true
code:
  - engine:
      - sh
      - bash
    source: |
      az apim list --output json --query '[*].{name:name, resourceGroup:resourceGroup}'

    extractors:
      - type: json
        name: serviceList
        internal: true
        json:
          - '.[]'

  - engine:
      - sh
      - bash
    source: |
      az apim show --name "$name" --resource-group "$resourceGroup" --query 'publicNetworkAccess'

    matchers-condition: and
    matchers:
      - type: word
        words:
          - 'Enabled'

    extractors:
      - type: dsl
        dsl:
          - 'name + " in resource group " + resourceGroup + " has public network access enabled, which should be disabled."'
