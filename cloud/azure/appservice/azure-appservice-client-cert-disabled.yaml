id: azure-appservice-client-cert-disabled
info:
  name: Azure App Service 未要求客户端证书（云安全）
  author: princechaddha
  severity: medium
  description: Azure App Service 未启用客户端证书要求时，HTTPS 客户端无需提供受信证书即可建立应用层访问，无法使用双向 TLS 对调用方进行强身份校验。该模板枚举 Web App，查询 clientCertEnabled，并在返回 false 时报告未要求客户端证书。
  impact: |
    - 依赖设备证书、服务证书或内部客户端身份的接口可能被非授权客户端调用。
    - 即使应用启用了普通登录，缺少客户端证书也会削弱机器到机器通信的第二道身份边界。
  remediation: |
    - 对需要双向 TLS 的 App Service 应用启用客户端证书要求，并配置受信任的根证书和证书链。
    - 建立证书签发、轮换、吊销和过期告警流程，同时在应用中校验证书主体或扩展属性。
  reference:
    - https://docs.microsoft.com/en-us/azure/app-service/configure-ssl-certificate#require-incoming-certificate
  metadata:
    vendor: microsoft
    product: azure-app-service
  tags: cloud,devops,azure,microsoft,appservice,azure-cloud-config

flow: |
  code(1);
  for (let WebAppId of iterate(template.webAppIds)) {
    set("ids", WebAppId);
    code(2);
  }

self-contained: true
code:
  - engine:
      - sh
      - bash
    source: |
      az webapp list --output json --query '[*].id'

    extractors:
      - type: json
        name: webAppIds
        internal: true
        json:
          - '.[]'

  - engine:
      - sh
      - bash
    source: |
      az webapp show --ids "$ids" --query 'clientCertEnabled' --output json

    matchers:
      - type: word
        words:
          - "false"

    extractors:
      - type: dsl
        dsl:
          - '"Client certificate not required for " + id'
