id: icecast-config

info:
  name: Icecast 配置 文件泄露（暴露面识别）
  author: DhiyaneshDk
  severity: low
  description: |
    检测到对外可访问的 Icecast 配置 文件。相关文件可能泄露项目结构、依赖关系、部署细节、敏感参数或其他不应公开的内部信息。
  reference:
    - https://icecast.org/docs/icecast-trunk/config_file/
  metadata:
    verified: true
    max-request: 1
    fofa-query: body="icecast.xml"
  tags: exposure,icecast,config,files,vuln

http:
  - method: GET
    path:
      - '{{BaseURL}}/icecast.xml'

    matchers:
      - type: dsl
        dsl:
          - 'status_code == 200'
          - 'contains(content_type, "application/xml")'
          - 'contains_all(body, "<hostname>","<fileserve>")'
        condition: and
