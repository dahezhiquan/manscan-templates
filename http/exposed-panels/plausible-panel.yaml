id: plausible-panel

info:
  name: Plausible 登录面板识别（指纹识别）
  author: rxerium
  severity: info
  description: |-
    Plausible 是轻量级网站分析平台，用于访问量、来源和隐私友好的统计分析。该模板请求 `/login` 路径，并依据 HTTP 200 状态码、页面标题、正文关键字或品牌资源特征识别目标是否部署了该系统或暴露了对应入口，适用于资产指纹确认；命中结果仅表示系统特征匹配，不代表已确认存在未授权访问或可利用漏洞。
  reference:
  - https://plausible.io/
  - https://github.com/plausible/analytics
  metadata:
    verified: true
    max-request: 1
    shodan-query: html:"Plausible"
  tags: panel,plausible,detect,discovery

http:
  - method: GET
    path:
      - "{{BaseURL}}/login"

    matchers-condition: and
    matchers:
      - type: word
        words:
          - 'Login'
          - 'Plausible · Web analytics'
        condition: and

      - type: status
        status:
          - 200
