id: drupal-directory-listing

info:
  name: Drupal 目录列出
  author: ritikchaddha
  severity: low
  description: |
    该模板用于核查 Drupal 目录列出。该类问题通常源于 Web 目录索引、仓库列表、对象列表或文件浏览功能未关闭，导致未授权用户可枚举文件和目录。模板会向目标发送探测请求，并依据请求 `/sites/`、`/modules/`、匹配 `!contains_all(body, "Index of /", "PARENTDIR")`、匹配 `Index of /`等证据确认目标是否存在该配置问题。
  impact: |
    - 攻击者可浏览目录结构、源代码、备份、日志、构建产物或对象存储资源。
    - 暴露的文件名和内容可能泄露业务结构、凭据线索或可进一步利用的敏感数据。
  remediation: |
    - 关闭目录索引、公开列表和未授权文件浏览功能。
    - 为需要下载的资源配置显式访问控制，避免把备份、源码和日志放入 Web 可访问路径。
    - 检查已暴露目录中的敏感文件并轮换可能泄露的凭据或令牌。
  reference:
    - https://www.drupal.org/
    - https://www.drupal.org/docs/security-in-drupal
  metadata:
    shodan-query: http.component:"Drupal"
  tags: drupal,directory-listing,exposure

flow: http(1) && http(2)

http:
  - raw:
      - |
        GET / HTTP/1.1
        Host: {{Hostname}}

    matchers:
      - type: dsl
        dsl:
          - '!contains_all(body, "Index of /", "PARENTDIR")'
        internal: true

  - method: GET
    path:
      - "{{BaseURL}}/sites/"
      - "{{BaseURL}}/modules/"
      - "{{BaseURL}}/themes/"
      - "{{BaseURL}}/profiles/"
      - "{{BaseURL}}/includes/"
      - "{{BaseURL}}/misc/"
      - "{{BaseURL}}/scripts/"
      - "{{BaseURL}}/core/"
      - "{{BaseURL}}/vendor/"
      - "{{BaseURL}}/libraries/"

    stop-at-first-match: true
    matchers-condition: and
    matchers:
      - type: word
        words:
          - "Index of /"
          - "Last modified"
          - "Parent Directory"
        condition: and

      - type: status
        status:
          - 200
