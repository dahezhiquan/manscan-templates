id: ocserv-panel

info:
  name: OpenConnect VPN 服务器 (ocserv) - 检测（指纹识别）
  author: rxerium
  severity: info
  description: |-
    检测到目标站点存在 OpenConnect VPN 服务器 (ocserv) 相关响应特征。OpenConnect VPN 服务器 (ocserv) 是远程访问、VPN 或应用交付入口，用于向用户提供企业应用、内网资源或负载均衡服务。模板请求 `/`，并通过响应头关键字、状态码确认该系统指纹，用于资产识别、系统盘点和暴露面梳理。
  reference:
    - https://gitlab.com/openconnect/ocserv
    - https://ocserv.gitlab.io/www/
  metadata:
    max-request: 1
    shodan-query: '"Server: ocserv"'
  tags: panel,ocserv,openconnect,vpn,detect
http:
  - method: GET
    path:
      - "{{BaseURL}}"

    matchers-condition: and
    matchers:
      - type: word
        part: header
        words:
          - 'ocserv'
          - 'OCServer'
        condition: or

      - type: status
        status:
          - 200
