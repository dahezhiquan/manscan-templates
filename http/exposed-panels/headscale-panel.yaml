id: headscale-panel

info:
  name: Headscale - 登录面板（指纹识别）
  author: rxerium
  severity: info
  description: |-
    Headscale 是 Tailscale 控制服务器的开源自托管实现，用于管理基于 WireGuard 的网状 VPN 网络，并提供用于行政管理的 Web 界面。
  reference:
    - https://github.com/juanfont/headscale
    - https://headscale.net
  metadata:
    max-request: 1
    shodan-query: http.title:"headscale"
  tags: panel,headscale,vpn,wireguard,detect

http:
  - method: GET
    path:
      - "{{BaseURL}}"

    matchers-condition: and
    matchers:
      - type: word
        part: body
        words:
          - 'Headscale'
        condition: or

      - type: status
        status:
          - 200
