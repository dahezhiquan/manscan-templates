id: ivanti-sentry-panel

info:
  name: Ivanti Sentry 面板（暴露面识别）
  author: DhiyaneshDk
  severity: medium
  description: |-
    检测到目标站点暴露 Ivanti Sentry 相关面板或登录入口。Ivanti Sentry 是 Ivanti 移动安全与企业访问网关组件，用于为移动设备提供策略执行、邮件与应用访问控制以及安全连接能力。模板请求 `/mics/login.jsp`，并通过页面标题或正文关键字确认入口可访问；此类面板若直接暴露在公网，会增加账号枚举、口令攻击、漏洞匹配和未授权访问尝试的机会。
  impact: |-
    - 攻击者可确认目标部署了 Ivanti Sentry 或相关移动访问组件，并据此开展账号枚举、口令喷洒、默认凭据尝试或针对性漏洞匹配。
    - 若面板存在弱口令、默认配置、访问控制缺陷或未修复漏洞，可能导致移动访问网关配置被篡改、敏感信息泄露或企业应用访问边界被突破。
    - 管理入口长期暴露在公网会扩大攻击面，增加自动化扫描、撞库、社会工程和后续横向移动的风险。
  remediation: |-
    - 将 Ivanti Sentry 面板限制在内网、VPN、堡垒机或可信源 IP 访问范围内，避免管理入口直接暴露在公网。
    - 启用强密码、多因素认证、登录失败限制和默认账户清理，定期审计登录日志与管理员账号权限。
    - 保持 Ivanti Sentry 和相关网关组件更新到受支持版本，关闭不必要的公开访问，并在必须公网访问时增加反向代理访问控制、WAF 或零信任访问策略。
  metadata:
    verified: true
    max-request: 1
    product: sentry
    shodan-query: http.favicon.hash:967636089
  tags: panel,ivanti,discovery,login,sentry
http:
  - method: GET
    path:
      - "{{BaseURL}}/mics/login.jsp"

    host-redirects: true
    max-redirects: 2

    matchers:
      - type: word
        words:
          - "Ivanti System Manager"
          - "sentry"
        condition: and

    extractors:
      - type: regex
        group: 1
        regex:
          - \?([\d.]+)"
