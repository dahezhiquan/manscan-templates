id: untrusted-root-certificate

info:
  name: 不受信任根证书检测（证书安全）
  author: pussycat0x
  severity: low
  description: 该模板检测目标证书链是否锚定到客户端默认不信任的根证书。命中说明证书链无法被常见操作系统或浏览器正常验证，访问时通常会出现信任告警。
  reference:
    - https://www.sslmarket.com/ssl/trusted-and-untrusted-certificate
    - https://www.invicti.com/web-vulnerability-scanner/vulnerabilities/ssl-untrusted-root-certificate/
  metadata:
    verified: true
    max-request: 1
  tags: ssl,tls,untrusted,vuln
ssl:
  - address: "{{Host}}:{{Port}}"
    matchers:
      - type: dsl
        dsl:
          - "untrusted == true"
