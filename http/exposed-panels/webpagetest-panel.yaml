id: webpagetest-panel

info:
  name: WebPageTest 登录面板识别（暴露面识别）
  author: pdteam
  severity: info
  description: 该模板通过识别 WebPageTest 登录入口的页面标题、特征文本或重定向行为，判断目标是否暴露了对应的认证界面。若命中，说明该登录面板对外可访问，可用于暴露面梳理与后续安全评估。
  classification:
    cvss-metrics: CVSS:3.0/AV:N/AC:L/PR:N/UI:N/S:U/C:N/I:N/A:N
    cwe-id: CWE-200
    cpe: cpe:2.3:a:webpagetest:webpagetest:*:*:*:*:*:*:*:*
  metadata:
    max-request: 1
    shodan-query: title:"WebPageTest"
    product: webpagetest
    vendor: webpagetest
  tags: panel,webpagetest,discovery

http:
  - method: GET
    path:
      - '{{BaseURL}}'

    matchers:
      - type: word
        words:
          - 'WebPageTest - Website Performance and Optimization Test'
