id: localai-detect

info:
  name: LocalAI 指纹识别（指纹识别）
  author: s4e-io
  severity: info
  description: >-
    LocalAI 是本地兼容 OpenAI API 的推理服务，用于在私有环境运行文本、语音和图像模型。该模板通过请求目标服务并检查预设路径或首页响应、DSL
    条件等指纹特征，判断目标是否使用或暴露了 LocalAI 相关组件；命中结果仅表示指纹特征匹配，可用于资产盘点、技术栈识别和后续安全评估，不代表已确认存在可利用漏洞。
  reference:
  - https://github.com/mudler/LocalAI
  - https://localai.io/
  metadata:
    verified: true
    max-request: 1
    vendor: mudler
    product: localai
    fofa-query: "LocalAI API"
    shodan-query: http.favicon.hash:-976853304
  tags: localai,tech,detect,discovery
http:
  - method: GET
    path:
      - "{{BaseURL}}"

    host-redirects: true
    matchers:
      - type: dsl
        dsl:
          - 'contains_all(body, "alt=\"LocalAI Logo\"", "<title>LocalAI")'
          - 'status_code == 200'
        condition: and
