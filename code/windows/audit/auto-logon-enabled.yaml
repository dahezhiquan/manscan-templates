id: auto-logon-enabled

info:
  name: Windows 自动登录已启用（本地基线扫描）
  author: princechaddha
  severity: medium
  description: |
    该模板检查 Windows 自动登录配置。启用后系统可在启动时绕过交互式登录，通常还会保存可被读取或滥用的凭据。
  impact: |
    本地或远程攻击者可能利用自动登录凭据直接进入系统。
  remediation: |
    禁用 AutoAdminLogon，清除注册表中保存的默认用户名、密码和域信息。
  tags: autologon,login,code,windows-audit

self-contained: true

code:
  - pre-condition: |
      IsWindows();
    engine:
      - powershell
      - powershell.exe
    args:
      - -ExecutionPolicy
      - Bypass
    pattern: "*.ps1"
    source: |
      (Get-ItemProperty -Path 'HKLM:\SOFTWARE\Microsoft\Windows NT\CurrentVersion\Winlogon' -Name 'AutoAdminLogon' -ErrorAction SilentlyContinue).AutoAdminLogon -eq '1'

    matchers:
      - type: word
        words:
          - "True"
