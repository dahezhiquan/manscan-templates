id: google-api-private-key

info:
  name: Google Api 私钥 泄露（暴露面识别）
  author: DhiyaneshDK
  severity: medium
  description: 检测到对外可访问的 Google Api 私钥。相关文件可能泄露项目结构、依赖关系、部署细节、敏感参数或其他不应公开的内部信息。
  reference:
    - https://www.exploit-db.com/ghdb/6037
  metadata:
    verified: true
    max-request: 3
    google-query: intitle:"index of" "google-api-private-key.json"
  tags: exposure,cloud,google,devops,files,vuln

http:
  - method: GET
    path:
      - "{{BaseURL}}/google-api-private-key.json"
      - "{{BaseURL}}/app/config/pimcore/google-api-private-key.json"
      - "{{BaseURL}}/pimcore/app/config/pimcore/google-api-private-key.json"

    stop-at-first-match: true

    matchers-condition: and
    matchers:
      - type: word
        words:
          - 'private_key_id'
          - 'private_key'
        condition: and

      - type: status
        status:
          - 200
