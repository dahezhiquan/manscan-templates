id: ing-phish

info:
  name: ING 仿冒钓鱼网站（钓鱼网站识别）
  author: rxerium
  severity: info
  description: |
    检测到疑似仿冒 ING 的钓鱼网站。模板在目标页面返回 200、页面内容命中 ING 的金融或支付页面特征，且当前主机不属于 ing.com 官方域名时触发，用于识别借用 ING 品牌页面诱导用户信任的仿冒站点。
  reference:
    - https://ing.com
  metadata:
    max-request: 1
  tags: phishing,ing,bank,osint,discovery
http:
  - method: GET
    path:
      - "{{BaseURL}}"

    host-redirects: true
    max-redirects: 2

    matchers-condition: and
    matchers:
      - type: word
        words:
          - "Corporate site of ING, a global financial institution of Dutch origin, providing news, investor relations and general information"

      - type: status
        status:
          - 200

      - type: dsl
        dsl:
          - '!contains(host,"ing.com")'
