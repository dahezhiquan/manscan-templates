id: ecology-detect

info:
  name: Ecology 指纹识别（指纹识别）
  author: ritikchaddha
  severity: info
  description: Ecology 是泛微 Ecology 协同办公平台，用于流程、门户、文档和组织协同管理。该模板请求首页，并依据 HTTP 200 状态码、页面标题、正文关键字或品牌资源特征、响应头特征识别目标是否使用或暴露了 Ecology 相关组件，适用于资产盘点、技术栈识别和后续安全评估；命中结果仅表示指纹特征匹配，不代表已确认存在可利用漏洞。
  metadata:
    verified: true
    max-request: 1
    shodan-query: ecology_JSessionid
    fofa-query: app="泛微-协同办公OA"
  tags: ecology,tech,discovery

http:
  - method: GET
    path:
      - "{{BaseURL}}"

    matchers-condition: and
    matchers:
      - type: word
        part: header
        words:
          - "ecology_JSessionid"

      - type: status
        status:
          - 200
