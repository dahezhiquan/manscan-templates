id: eks-cluster-logging

info:
  name: EKS 控制平面日志未完整启用（云安全）
  author: princechaddha
  severity: low
  description: EKS 控制平面日志未完整启用是一类 Kubernetes 控制面审计与可观测性缺失风险，API server、audit、authenticator 等日志缺失会削弱异常操作追踪能力。控制平面日志是调查权限滥用、配置变更和集群异常的重要证据来源。模板枚举 EKS 集群后读取 `cluster.logging.clusterLogging[*].enabled`，当存在 `false` 或没有启用项时判定日志未完整开启。
  impact: |
    - 集群 API 调用、认证失败或审计事件可能缺少日志证据，影响入侵调查。
    - 安全团队难以及时发现异常资源创建、权限变更和可疑控制面操作。
  remediation: |
    - 为 EKS 集群启用所需控制平面日志类型，至少覆盖 audit、api 和 authenticator 等关键日志。
    - 将日志集中到 CloudWatch Logs 或安全日志平台，并配置保留周期、告警和访问控制。
  reference:
    - https://www.trendmicro.com/cloudoneconformity/knowledge-base/aws/EKS/cluster-logging.html
    - https://docs.aws.amazon.com/eks/latest/userguide/control-plane-logs.html
  metadata:
    vendor: amazon
    product: eks
  tags: cloud,devops,aws,amazon,eks,aws-cloud-config

variables:
  region: "us-east-1"

flow: |
  code(1)
  for(let cluster of iterate(template.clusters)){
    set("cluster", cluster)
    code(2)
  }

self-contained: true

code:
  - engine:
      - sh
      - bash
    source: |
      aws eks list-clusters --region $region --query 'clusters' --output json

    extractors:
      - type: json
        name: clusters
        internal: true
        json:
          - '.[]'

  - engine:
      - sh
      - bash
    source: |
      aws eks describe-cluster --region $region --name $cluster --query 'cluster.logging.clusterLogging[*].enabled' --output json

    matchers-condition: and
    matchers:
      - type: word
        words:
          - "false"

      - type: word
        words:
          - "true"
        negative: true

    extractors:
      - type: dsl
        dsl:
          - '"EKS cluster " + cluster + " does not have control plane logging enabled"'
