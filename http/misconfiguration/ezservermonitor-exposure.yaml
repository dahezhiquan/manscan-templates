id: ezservermonitor-exposure

info:
  name: eZ 服务器 Monitor 暴露
  author: pussycat0x
  severity: low
  description: |
    检测到 eZ 服务器 Monitor 暴露。目标响应或文件中可能暴露配置、凭据、密钥、令牌、环境变量或历史记录等敏感信息，可能被用于进一步入侵。
  reference:
    - https://github.com/shevabam/ezservermonitor-web
    - https://www.ezservermonitor.com/esm-web/features
  metadata:
    verified: true
    max-request: 4
    shodan-query: title:"eZ Server Monitor"
    fofa-query: title="eZ Server Monitor"
  tags: misconfig,exposure,ezservermonitor,monitoring

http:
  - method: GET
    path:
      - "{{BaseURL}}/"
      - "{{BaseURL}}/esm/"
      - "{{BaseURL}}/monitoring/"
      - "{{BaseURL}}/ezservermonitor/"

    stop-at-first-match: true

    matchers-condition: and
    matchers:
      - type: word
        part: body
        words:
          - "<title>eZ Server Monitor"
          - "eZ Server Monitor - v"
        condition: and

      - type: word
        part: body
        words:
          - "web/css/frontend.css"
          - '<span class="icon-gauge"></span>eSM'
        condition: or

      - type: status
        status:
          - 200

    extractors:
      - type: regex
        name: version
        part: body
        group: 1
        regex:
          - 'eZ Server Monitor - v([0-9.]+)'
