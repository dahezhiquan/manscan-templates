id: langtrace-panel

info:
  name: Langtrace 面板 - 检测（暴露面识别）
  author: rxerium
  severity: info
  description: |-
    检测到 Langtrace，这是一款基于 OpenTelemetry 的开源 LLM 应用可观测性平台，可对 LLM、向量数据库及框架调用提供追踪、监控与分析。识别出一个暴露的自托管 Langtrace 仪表盘实例，该实例通常会将未认证请求重定向到登录页。
  reference:
    - https://github.com/Scale3-Labs/langtrace
    - https://langtrace.ai
  metadata:
    verified: true
    max-request: 1
    vendor: scale3labs
    product: langtrace
    shodan-query: 'http.title:"Langtrace"'
  tags: panel,langtrace,llm,ai,observability,detect,discovery

http:
  - method: GET
    path:
      - "{{BaseURL}}"

    host-redirects: true
    max-redirects: 2

    matchers-condition: and
    matchers:
      - type: word
        part: body
        words:
          - "<title>Langtrace</title>"
          - "Open source observability for your LLM applications"
        condition: and

      - type: status
        status:
          - 200
