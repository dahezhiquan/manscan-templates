id: azure-mfa-not-enabled-privileged-users
info:
  name: Azure 特权用户未启用 MFA（云安全）
  author: princechaddha
  severity: high
  description: Microsoft Entra ID 特权用户未注册 MFA 时，管理员访问仍主要依赖单一口令，口令泄露会直接威胁 Azure 控制面。该模板通过 Microsoft Graph authenticationMethods 报表筛选 isMfaRegistered 为 false 的用户，再检查这些用户是否拥有 Owner、Contributor、Administrator、RBAC Administrator 或 User Access Administrator 等高权限角色。
  impact: |
    - 攻击者获取特权用户口令后可能直接管理订阅、资源和访问控制分配。
    - 缺少 MFA 会显著增加钓鱼、撞库和凭据泄露导致的账号接管风险。
  remediation: |
    - 为所有特权用户强制启用 Microsoft Entra MFA，优先通过 Conditional Access 或 Security Defaults 执行。
    - 对高权限角色启用 PIM、访问评审和最小权限分配，移除不必要的长期管理员权限。
  reference:
    - https://docs.microsoft.com/en-us/azure/active-directory/authentication/concept-mfa-howitworks
    - https://learn.microsoft.com/en-us/azure/role-based-access-control/built-in-roles
    - https://docs.microsoft.com/en-us/graph/api/resources/authenticationmethods-overview
    - https://docs.microsoft.com/en-us/azure/active-directory/authentication/howto-mfa-userstates
  metadata:
    vendor: microsoft
    product: entra-id
  tags: cloud,devops,azure,microsoft,azure-cloud-config,graph-api

flow: |
  code(1);
  for (let User of iterate(template.noMfaUsers)) {
    set("userPrincipalName", User);
    code(2);
  }

self-contained: true
code:
  - engine:
      - sh
      - bash
    source: |
      az rest --method GET --uri 'https://graph.microsoft.com/v1.0/reports/authenticationMethods/userRegistrationDetails' --query "value[?isMfaRegistered==\`false\`].userPrincipalName"

    extractors:
      - type: json
        name: noMfaUsers
        internal: true
        json:
          - '.[]'

  - engine:
      - sh
      - bash
    source: |
      az role assignment list --include-classic-administrators true --assignee "$userPrincipalName" --query '[].{roleDefinitionName:roleDefinitionName}' --output json

    matchers:
      - type: word
        words:
          - 'Owner'
          - 'Contributor'
          - 'Administrator'
          - 'Reservations Administrator'
          - 'Role Based Access Control Administrator'
          - 'User Access Administrator'

    extractors:
      - type: dsl
        dsl:
          - 'userPrincipalName + " is a privileged user without MFA registered"'
