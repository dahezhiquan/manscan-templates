id: dahua-web-panel

info:
  name: Dahua Web Service 面板识别（指纹识别）
  author: dhiyaneshDK,rxerium
  severity: info
  description: |-
    检测到目标站点存在 Dahua Web Service 相关响应特征。Dahua Web Service 是视频监控或安防设备的 Web 控制界面，用于查看视频流、配置录像、网络参数和设备账号。模板请求 `/`，并通过页面标题或正文关键字、状态码确认该系统指纹，用于资产识别、系统盘点和暴露面梳理。
  reference:
    - https://www.exploit-db.com/ghdb/7116
  classification:
    cvss-metrics: CVSS:3.0/AV:N/AC:L/PR:N/UI:N/S:U/C:N/I:N/A:N
    cwe-id: CWE-200
    cpe: cpe:2.3:h:dahuasecurity:sd22204db-gny-w:*:*:*:*:*:*:*:*
  metadata:
    verified: true
    max-request: 1
    shodan-query: http.favicon.hash:1653394551
    product: sd22204db-gny-w
    vendor: dahuasecurity
  tags: edb,panel,dahua,detect,discovery
http:
  - method: GET
    path:
      - '{{BaseURL}}'

    matchers-condition: and
    matchers:
      - type: word
        words:
          - '<title>WEB SERVICE</title>'

      - type: status
        status:
          - 200
