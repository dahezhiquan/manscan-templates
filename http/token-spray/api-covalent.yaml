id: api-covalent

info:
  name: Covalent API Token 可用性校验（token喷洒）
  author: daffainfo
  severity: info
  description: 该模板通过调用 Covalent API 的已知接口验证提供的 token 是否有效，命中后通常表示可访问相关 API 能力。
  reference:
    - https://www.covalenthq.com/docs/api/
    - https://github.com/daffainfo/all-about-apikey/tree/main/covalent
  metadata:
    max-request: 1
  tags: token-spray,covalent

self-contained: true

http:
  - method: GET
    path:
      - "https://api.covalenthq.com/v1/3/address/balances_v2/?&key={{token}}"

    matchers:
      - type: word
        part: body
        words:
          - '"address":'
          - '"updated_at":'
          - '"next_update_at":'
        condition: and
