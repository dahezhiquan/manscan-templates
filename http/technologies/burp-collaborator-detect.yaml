id: burp-collaborator-detect

info:
  name: Burp Collaborator 服务器指纹识别（指纹识别）
  author: lum8rjack
  severity: info
  description: |
    用于识别目标是否部署 Burp Collaborator 服务器 并提取相关版本或构建信息，模板会结合 HTTP 响应头、状态码、特定路径或已知端点和版本或标识提取结果进行指纹匹配。
  reference:
    - https://portswigger.net/burp/documentation/collaborator
  classification:
    cvss-metrics: CVSS:3.0/AV:N/AC:L/PR:N/UI:N/S:U/C:N/I:N/A:N
    cvss-score: 0
    cwe-id: CWE-200
    cpe: cpe:2.3:a:portswigger:burp_suite:*:*:*:*:*:*:*:*
  metadata:
    verified: true
    max-request: 1
    shodan-query: "Server: Burp Collaborator"
    product: burp_suite
    vendor: portswigger
  tags: burp,tech,detect,discovery

http:
  - method: GET
    path:
      - "{{BaseURL}}"

    matchers-condition: and
    matchers:
      - type: word
        part: header
        words:
          - "Server: Burp Collaborator https://burpcollaborator.net/"

      - type: status
        status:
          - 200

    extractors:
      - type: regex
        part: header
        group: 1
        regex:
          - "(?:X-(Collaborator-Version: [0-9]))"
