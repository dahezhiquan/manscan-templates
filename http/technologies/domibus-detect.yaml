id: domibus-detect

info:
  name: Domibus 指纹识别（指纹识别）
  author: righettod
  severity: info
  description: |-
    Domibus 是欧盟 eDelivery 消息网关，用于安全跨组织业务消息交换。该模板请求 `/domibus/rest/application/info`、`/domibus/`，并依据 DSL 条件识别目标是否使用或暴露了 Domibus 相关组件，适用于资产盘点、技术栈识别和后续安全评估；命中结果仅表示指纹特征匹配，不代表已确认存在可利用漏洞。
  reference:
  - https://ec.europa.eu/digital-building-blocks/sites/display/DIGITAL/Domibus
  metadata:
    verified: true
    max-request: 1
    shodan-query: http.title:"Domibus"
  tags: tech,domibus,detect,discovery

http:
  - method: GET
    path:
      - "{{BaseURL}}/domibus/rest/application/info"
      - "{{BaseURL}}/domibus/"

    stop-at-first-match: true
    matchers:
      - type: dsl
        dsl:
          - 'status_code == 200'
          - 'contains_any(to_lower(body), "<title>domibus", "domibus-msh")'
        condition: and

    extractors:
      - type: regex
        part: body
        group: 1
        regex:
          - '"versionNumber":\s*"([0-9.]+)"'
