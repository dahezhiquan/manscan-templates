id: mysql-show-variables

info:
  name: MySQL 变量信息枚举（服务漏洞）
  author: DhiyaneshDk
  severity: high
  description: |
    MySQL 服务接受模板尝试的常见凭据后，允许已认证用户执行 SHOW VARIABLES 查询并枚举系统变量，可能暴露运行路径、认证插件、日志位置和安全开关状态。该模板使用内置用户名和密码组合登录数据库，并提取变量名和值作为命中证据。
  impact: |
    - MySQL 系统变量可能泄露安装路径、数据目录、认证配置、日志位置和安全开关状态。
    - 攻击者可利用这些配置线索制定更精确的数据读取、文件写入或权限提升路径。
  remediation: |
    - 移除弱凭据并限制普通账号查询敏感系统变量的权限。
    - 审计数据库配置，隐藏不必要的路径、日志和认证细节，限制数据库端口访问来源。
  reference:
    - https://nmap.org/nsedoc/scripts/mysql-variables.html
  metadata:
    max-request: 16
    shodan-query: "port:3306"
    vendor: oracle
    product: mysql
  tags: js,mysql,network,enum,discovery

javascript:
  - pre-condition: |
      isPortOpen(Host,Port);
    code: |
      let m = require('nuclei/mysql');
      let c = m.MySQLClient();
      let response = c.ExecuteQuery(Host,Port,User,Pass,Query);
      Export(response);

    args:
      Host: "{{Host}}"
      Port: "3306"
      User: "{{usernames}}"
      Pass: "{{passwords}}"
      Query: "show variables;"

    payloads:
      usernames:
        - root
        - admin
        - mysql
        - test
      passwords:
        - root
        - admin
        - mysql
        - test
    attack: clusterbomb

    stop-at-first-match: true
    matchers:
      - type: dsl
        dsl:
          - "success == true"

    extractors:
      - type: json
        part: response
        json:
          - '.Rows[].Variable_name'
