id: winstone-detect

info:
  name: Winstone Servlet Engine 指纹识别（指纹识别）
  author: Shivam Kamboj
  severity: info
  description: >-
    Winstone 是轻量级 Java Servlet 容器，用于运行 Jenkins 等 Java Web 应用或嵌入式服务。该模板通过请求目标服务并检查预设路径或首页响应、HTTP
    响应头、正则特征等指纹特征，判断目标是否使用或暴露了 Winstone Servlet Engine 相关组件；命中结果仅表示指纹特征匹配，可用于资产盘点、技术栈识别和后续安全评估，不代表已确认存在可利用漏洞。
  metadata:
    max-request: 1
    shodan-query: http.component:"winstone servlet container"
  tags: tech,winstone,discovery
http:
  - method: GET
    path:
      - "{{BaseURL}}"

    matchers-condition: or
    matchers:
      - type: regex
        part: header
        regex:
          - '(?i)Server:\s*Winstone Servlet Engine\s*v?[0-9.]+'
          - '(?i)Winstone/[0-9.]+'

      - type: regex
        part: header
        regex:
          - '(?i)X-Powered-By:\s*Servlet/[0-9.]+\s*\(Winstone/[0-9.]+\)'

    extractors:
      - type: regex
        name: winstone_version
        part: header
        group: 0
        regex:
          - '(?i)Winstone(?: Servlet Engine)?\s*v?[0-9.]+'
          - '(?i)Winstone/[0-9.]+'
