id: microsoft-iis-version

info:
  name: Microsoft IIS 指纹识别（指纹识别）
  author: Wlayzz
  severity: info
  description: >-
    Microsoft IIS 是 Windows 平台 Web 服务器，用于承载企业网站、API、ASP.NET 应用和反向代理场景。该模板通过请求目标服务并检查预设路径或首页响应、HTTP
    响应头、页面正文关键字等指纹特征，判断目标是否使用或暴露了 Microsoft IIS 相关组件；命中结果仅表示指纹特征匹配，可用于资产盘点、技术栈识别和后续安全评估，不代表已确认存在可利用漏洞。
  metadata:
    max-request: 1
  tags: tech,microsoft,iis,discovery
http:
  - method: GET
    path:
      - "{{BaseURL}}"

    host-redirects: true
    max-redirects: 4
    matchers-condition: and
    matchers:
      - type: word
        part: header
        words:
          - "IIS"

    extractors:
      - type: kval
        part: header
        kval:
          - Server
