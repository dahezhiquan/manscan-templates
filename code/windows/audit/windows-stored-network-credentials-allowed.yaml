id: windows-stored-network-credentials-allowed

info:
  name: 允许存储网络认证凭据（本地基线扫描）
  author: princechaddha
  severity: medium
  description: |
    该模板检查系统是否允许保存网络认证凭据。保存的凭据可能被本地攻击者提取。
  impact: |
    攻击者可复用已保存凭据访问远程共享、服务或域资源。
  remediation: |
    禁用不必要的网络凭据保存，并清理已存储凭据。
  tags: windows,credentials,code,windows-audit

self-contained: true

code:
  - pre-condition: |
      IsWindows();
    engine:
      - powershell
      - powershell.exe
    args:
      - -ExecutionPolicy
      - Bypass
    pattern: "*.ps1"
    source: |
      (Get-ItemProperty -Path 'HKLM:\SYSTEM\CurrentControlSet\Control\Lsa').DisableDomainCreds

    matchers:
      - type: word
        words:
          - "0"
