id: teleport-login-panel

info:
  name: Teleport 登录面板识别（暴露面识别）
  author: pdteam,mahmoud0x00
  severity: info
  description: |
    该模板通过识别 Teleport 登录入口的页面标题、特征文本或重定向行为，判断目标是否暴露了对应的认证界面。若命中，说明该登录面板对外可访问，可用于暴露面梳理与后续安全评估。
  reference:
    - https://github.com/gravitational/teleport
  metadata:
    verified: true
    max-request: 1
    shodan-query:
      - http.favicon.hash:544208100
      - http.favicon.hash:1854879765
      - http.favicon.hash:-1275955539
      - "Set-Cookie: __Host-grv_csrf"
    fofa-query:
      - icon_hash="544208100"
      - icon_hash="1854879765"
      - icon_hash="-1275955539"
      - "Set-Cookie: __Host-grv_csrf"
  tags: panel,teleport,login,oss,discovery

http:
  - method: GET
    path:
      - "{{BaseURL}}/webapi/ping"

    matchers:
      - type: regex
        part: body
        regex:
          - '"server_version"\s*:\s*"\d+\.\d+\.\d+"'
          - 'teleport'
        condition: and

    extractors:
      - type: json
        json:
          - '"Version: " +.server_version'
