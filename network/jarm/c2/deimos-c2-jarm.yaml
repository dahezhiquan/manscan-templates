id: deimos-c2-jarm

info:
  name: Deimos C2 JARM 识别（服务漏洞）
  author: pussycat0x
  severity: info
  description: |
    该模板通过 JARM TLS 指纹识别目标是否可能为 Deimos C2 相关命令控制基础设施。
  reference:
    - https://github.com/cedowens/C2-JARM
    - https://twitter.com/MichalKoczwara/status/1551632627387473920
  metadata:
    max-request: 1
  tags: jarm,c2,ir,osint,cti,deimos,network,tcp,vuln
tcp:
  - inputs:
      - data: 2E
        type: hex
    host:
      - "{{Hostname}}"
    matchers:
      - type: dsl
        dsl:
          - "jarm(Hostname) == '00000000000000000041d00000041d9535d5979f591ae8e547c5e5743e5b64'"
