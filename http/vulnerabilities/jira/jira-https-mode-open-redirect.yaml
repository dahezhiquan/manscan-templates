id: jira-https-mode-open-redirect

info:
  name: JIRA in HTTPS mode - 开放重定向漏洞
  author: 0x_Akoko
  severity: medium
  description: JIRA in HTTPS mode - 开放重定向 存在开放重定向漏洞。攻击者可构造恶意跳转链接诱导用户访问钓鱼站点，或配合其他业务流程绕过安全校验。
  reference:
    - https://jira.atlassian.com/browse/JRASERVER-38075
  classification:
    cvss-metrics: CVSS:2.0/AV:N/AC:M/Au:N/C:P/I:P/A:N
    cvss-score: 5.8
    cwe-id: CWE-601
  metadata:
    verified: true
    max-request: 1
  tags: confluence,atlassian,jira,redirect,atlassian,vuln

http:
  - method: GET
    path:
      - "{{BaseURL}}/ThisCanBeAnything?os_destination=%2F%2Foast.pro"

    matchers-condition: and
    matchers:
      - type: regex
        part: header
        regex:
          - '(?m)^(?:Location\s*?:\s*)(?:https?://|//|/\\\\)?[a-zA-Z0-9._@-]*oast\.pro.*$'

      - type: status
        status:
          - 302
