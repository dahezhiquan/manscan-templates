id: facebook-page

info:
  name: Facebook Page 页面名称信息枚举（OSINT）
  author: gpiechnik2
  severity: info
  description: |
    Facebook Page 页面名称信息枚举 是面向商业展示、职业资料、客户沟通或业务协作的在线平台，用户资料页通常会公开展示个人名片、作品、服务或组织相关信息。该模板用于在公开互联网侧枚举 Facebook Page 页面名称信息枚举 用户名，不需要认证；模板请求公开路径 https://facebook.com/用户名，并结合响应状态为 200、页面或响应内容命中 “Link: <https://www.facebook.com/用户...” 等资料页特征判断目标用户名是否存在。该检查属于 OSINT 用户枚举，结果仅表示公开资料页或公开搜索结果可被访问，不代表目标平台存在可直接修复的漏洞。
  classification:
    cvss-metrics: CVSS:3.1/AV:N/AC:L/PR:N/UI:N/S:U/C:N/I:N/A:N
    cvss-score: 0
    cwe-id: CWE-200
  metadata:
    verified: "true"
    max-request: 1
  tags: osint,osint-business,osint-social,discovery

self-contained: true

http:
  - raw:
      - |
        GET https://facebook.com/{{user}} HTTP/1.1
        Host: www.facebook.com
        User-Agent: Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/113.0.5672.127 Safari/537.36
        Sec-Fetch-Mode: navigate
        Accept-Language: en-US,en;q=0.9

    matchers-condition: and
    matchers:
      - type: status
        status:
          - 200

      - type: word
        part: header
        words:
          - "Link: <https://www.facebook.com/{{user}}>"
