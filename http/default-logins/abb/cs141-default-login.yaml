id: cs141-default-login

info:
  name: UPS Adapter CS141 SNMP Module 默认口令登录（弱口令）
  author: socketz
  severity: medium
  description: |
    该模板用于检测 UPS Adapter CS141 SNMP Module 是否仍可使用默认凭据或弱口令登录。模板主要向 `/api/login` 等认证入口发送请求，使用内置默认凭据组合进行认证尝试，并根据响应中的 `accessToken`、`application/json` 等登录成功特征判断登录是否成功；命中说明目标未及时修改出厂、示例或初始化账号口令。
  impact: |
    - 攻击者可接管 UPS Adapter CS141 SNMP Module 的 Web 管理界面，查看设备状态、网络配置、运行日志或敏感业务参数。
    - 被接管的网络、工控、打印、语音、存储或远程管理设备可能被用于中断业务、改变路由/访问策略、窃取流量或作为内网横向移动入口。
  remediation: |
    - 立即修改所有默认账号口令，禁用不再使用的出厂账号，并为管理账户设置高强度唯一密码。
    - 将设备管理入口限制在 VPN、堡垒机或可信管理网段内，避免直接暴露到公网。
    - 升级设备固件或管理组件，审计近期登录记录、配置变更和异常会话。
  reference:
    - https://www.generex.de/media/pages/packages/documents/manuals/f65348d5b6-1628841637/manual_CS141_en.pdf
  classification:
    cwe-id: CWE-798
    cpe: cpe:2.3:h:generex:cs141:*:*:*:*:*:*:*:*
  metadata:
    max-request: 3
    shodan-query: http.html:"CS141"
    product: cs141
    vendor: generex
  tags: hiawatha,iot,default-login,vuln

http:
  - raw:
      - |
        POST /api/login HTTP/1.1
        Host: {{Hostname}}
        Accept: application/json, text/plain, */*
        Content-Type: application/json

        {"userName":"{{user}}","password":"{{pass}}"}

    attack: pitchfork
    payloads:
      user:
        - admin
        - engineer
        - guest
      pass:
        - cs141-snmp
        - engineer
        - guest
    stop-at-first-match: true

    matchers-condition: and
    matchers:
      - type: word
        words:
          - 'accessToken'
          - 'application/json'
        condition: and
        part: header

      - type: word
        part: body
        words:
          - 'accessToken'
          - 'AdminFirstTime'
        condition: and

      - type: status
        status:
          - 200

    extractors:
      - type: kval
        kval:
          - accessToken
