id: moinmoin-detect

info:
  name: MoinMoin wiki 指纹识别（指纹识别）
  author: cyllective
  severity: info
  description: 用于识别目标是否部署 MoinMoin wiki 并提取相关版本或构建信息，模板会结合页面正文、状态码、特定路径或已知端点和版本或标识提取结果进行指纹匹配。
  reference:
    - https://github.com/moinwiki/moin-1.9
  metadata:
    max-request: 1
  tags: tech,moin,moinmoin,wiki,discovery

http:
  - method: GET
    path:
      - "{{BaseURL}}"

    matchers-condition: and
    matchers:
      - type: word
        part: body
        condition: or
        words:
          - '<a href="http://moinmo.in/" title="This site uses the MoinMoin Wiki software.">MoinMoin Powered</a>'
          - '<a href="http://moinmo.in/Python" title="MoinMoin is written in Python.">Python Powered</a>'

      - type: status
        status:
          - 200

    extractors:
      - type: regex
        part: body
        group: 1
        regex:
          - '\/moin_static(\w+)\/'
