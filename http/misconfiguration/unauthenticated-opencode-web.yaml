id: unauthenticated-opencode-web

info:
  name: OpenCode Web 未授权 访问
  author: Kazgangap
  severity: medium
  description: |
    检测到 OpenCode Web 未授权 访问。目标功能在未认证状态下可访问，可能暴露管理入口、业务数据、系统状态或可执行操作，需确认是否存在访问控制缺失。
  reference:
    - https://opencode.ai/docs/tr/web/
  metadata:
    verified: true
    max-request: 1
    vendor: opencode
    product: opencode
    shodan-query: http.html:"opencode"
    fofa-query: body="opencode"
  tags: config,unauth,opencode,misconfig,vuln

http:
  - method: GET
    path:
      - "{{BaseURL}}/Lw/session/"

    redirects: true
    max-redirects: 2

    matchers:
      - type: dsl
        dsl:
          - 'contains_all(body, "<title>OpenCode</title>", "opencode-theme-id")'
          - 'status_code == 200'
        condition: and
