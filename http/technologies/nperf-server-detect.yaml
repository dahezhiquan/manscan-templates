id: nperf-server-detect

info:
  name: nPerf Server 指纹识别（指纹识别）
  author: rxerium
  severity: info
  description: >-
    nPerf Server 是网络测速服务组件，用于提供带宽、延迟和连接质量测试能力。该模板通过请求目标服务并检查预设路径或首页响应、页面正文关键字、HTTP
    响应头等指纹特征，判断目标是否使用或暴露了 nPerf Server 相关组件；命中结果仅表示指纹特征匹配，可用于资产盘点、技术栈识别和后续安全评估，不代表已确认存在可利用漏洞。
  reference:
  - https://www.nperf.com
  metadata:
    verified: true
    max-request: 1
    shodan-query: product:"nPerf"
  tags: tech,nperf,detect,discovery
http:
  - method: GET
    path:
      - "{{BaseURL}}"

    matchers-condition: or
    matchers:
      - type: word
        part: body
        words:
          - "<title>nPerfServer</title>"

      - type: word
        part: header
        words:
          - "Nperfserver-Remote-Endpoint"
          - "nPerf/"
        condition: or

    extractors:
      - type: kval
        part: header
        kval:
          - Server
