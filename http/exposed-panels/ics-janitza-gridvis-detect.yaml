id: ics-janitza-gridvis-detect

info:
  name: Janitza GridVis Energy Management 识别（指纹识别）
  author: rxerium
  severity: info
  description: |-
    检测到目标站点存在 Janitza GridVis Energy Management 相关响应特征。Janitza GridVis Energy Management 是工业控制、能源、楼宇自动化或 HMI/SCADA 场景中的管理界面，用于监控设备状态、过程数据和现场控制相关配置。模板请求 `/landingpage`、`/landingpage/` 路径，并通过页面标题或正文关键字、状态码、favicon 哈希确认该系统指纹，用于资产识别、系统盘点和暴露面梳理。
  reference:
    - https://www.janitza.com/gridvis.html
  metadata:
    max-request: 1
    verified: true
    shodan-query: http.title:"GridVis"
    vendor: janitza
    product: gridvis
  tags: tech,panel,janitza,ics,energy,scada,detect
http:
  - method: GET
    path:
      - '{{BaseURL}}/landingpage'
      - '{{BaseURL}}/landingpage/'

    host-redirects: true
    max-redirects: 2

    matchers-condition: and
    matchers:
      - type: word
        part: body
        words:
          - '<title>GridVis</title>'
          - '/landingpage/img/favicon.ico'
          - 'gve-8janitza.energy.security'
        condition: or

      - type: status
        status:
          - 200
