id: cisco-ucm-selfcare-portal

info:
  name: Cisco Unified Communications Self-Service User Portal - 识别（指纹识别）
  author: Morgan Robertson
  severity: info
  description: |-
    检测到目标站点存在 Cisco Unified Communications Self-Service User Portal 相关响应特征。Cisco Unified Communications Self-Service User Portal 是自动化运维、持续集成或任务编排平台，用于管理作业、流水线、凭据、执行记录和部署流程。模板请求 `/ucmuser/`，并通过页面标题或正文关键字、状态码确认该系统指纹，用于资产识别、系统盘点和暴露面梳理。
  metadata:
    verified: true
    product: unified_communications_manager
    vendor: cisco
    shodan-query: http.title:"Unified Communications Self Care Portal"
    fofa-query: title="Unified Communications Self Care Portal"
  tags: detect,cisco,ucm,panel
http:
  - method: GET
    path:
      - "{{BaseURL}}/ucmuser/"

    matchers-condition: and
    matchers:
      - type: word
        part: body
        words:
          - 'webAppName: "ucmuser"'
          - 'webAppName="ucmuser"'
        condition: or

      - type: status
        status:
          - 200
