id: put-method-enabled

info:
  name: HTTP PUT 方法启用
  author: xElkomy
  severity: high
  description: |
    该模板用于核查 HTTP PUT 方法启用。该类问题通常源于高危管理接口未授权开放、危险方法启用或可写接口暴露，攻击者可借助接口能力写入文件或触发命令执行。模板会向目标发送探测请求，并依据匹配 `contains(body_2, "{{randstr}}")`等证据确认目标是否存在该配置问题。
  impact: |
    - 攻击者可能上传文件、执行命令、提交任务或控制目标服务。
    - 成功利用后可导致主机沦陷、数据泄露、横向移动和业务中断。
  remediation: |
    - 立即为相关接口启用认证授权并限制可信来源访问。
    - 关闭不必要的危险 HTTP 方法、远程执行能力和可写管理接口。
    - 检查系统进程、上传目录和访问日志，清理异常文件并轮换凭据。
  reference:
    - https://portswigger.net/kb/issues/00100900_http-put-method-is-enabled
  metadata:
    max-request: 2
  tags: injection,misconfig,intrusive,vuln

http:
  - raw:
      - |
        PUT /testing-put.txt HTTP/1.1
        Host: {{Hostname}}
        Content-Type: text/plain

        {{randstr}}
      - |
        GET /testing-put.txt HTTP/1.1
        Host: {{Hostname}}
        Content-Type: text/plain

    matchers:
      - type: dsl
        dsl:
          - 'contains(body_2, "{{randstr}}")'
