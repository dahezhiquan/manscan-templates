id: i-mscp-panel

info:
  name: Internet Multi Server Control 面板识别（指纹识别）
  author: JustaAcat
  severity: info
  description: 该模板通过识别 Internet Multi Server Control 面板、控制台或管理界面的页面特征，判断目标是否暴露了对应服务入口。若命中，说明该后台或运维界面对外可访问，可用于资产识别与暴露面排查。
  reference:
    - https://i-mscp.net/
  classification:
    cvss-metrics: CVSS:3.1/AV:N/AC:L/PR:N/UI:N/S:U/C:N/I:N/A:N
    cwe-id: CWE-200
  metadata:
    verified: true
    max-request: 1
    shodan-query: title:"i-MSCP - Multi Server Control Panel"
  tags: panel,i-mscp,detect,discovery

http:
  - method: GET
    path:
      - '{{BaseURL}}/index.php'

    matchers-condition: and
    matchers:
      - type: word
        words:
          - "<title>i-MSCP - Multi Server Control Panel"

      - type: status
        status:
          - 200
