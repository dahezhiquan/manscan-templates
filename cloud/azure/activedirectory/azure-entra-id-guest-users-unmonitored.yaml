id: azure-entra-id-guest-users-unmonitored
info:
  name: Azure Entra ID Guest Users Unmonitored（云安全）
  author: princechaddha
  severity: medium
  description: 该规则用于检查 Azure Entra ID 是否启用了日志记录、审计、监控或告警能力，以确保能够及时发现异常行为并满足审计与取证要求。
  impact: |
    - 缺少日志、审计或告警能力会削弱对异常活动的发现、响应与取证能力。
    - 安全事件可能因此长时间不被察觉，扩大影响范围并增加溯源难度。
  remediation: |
    - 启用必要的日志、审计、监控和告警能力，并确保日志输出到集中化、可审计的位置。
    - 为高风险事件设置实时通知与响应流程，避免关键安全事件长期无感知。
  reference:
    - https://docs.microsoft.com/en-us/azure/active-directory/external-identities/
  tags: cloud,devops,azure,microsoft,entra-id,azure-cloud-config

self-contained: true
code:
  - engine:
      - sh
      - bash
    source: |
      az ad user list --query "[?userType=='Guest']" --output json

    matchers:
      - type: word
        words:
          - '"userType": "Guest"'

    extractors:
      - type: dsl
        dsl:
          - '"Azure Account han an Entra ID guest user Microsoft Entra ID"'
