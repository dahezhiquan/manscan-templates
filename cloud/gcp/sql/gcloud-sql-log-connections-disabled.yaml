id: gcloud-sql-log-connections-disabled

info:
  name: PostgreSQL 数据库实例未启用 log_connections（云安全）
  author: princechaddha
  severity: medium
  description: PostgreSQL log_connections 可记录每次连接建立事件，是追踪异常来源、暴力尝试和访问基线的重要日志。本模板检查 Cloud SQL PostgreSQL 实例 databaseFlags 中 log_connections 的值，匹配 off 时报告连接日志未启用。
  impact: |
    - 未授权连接尝试、异常来源或连接突增缺少完整记录，影响安全检测和事件取证。
    - 数据库访问审计无法准确覆盖连接生命周期，降低账号滥用排查效率。
  remediation: |
    - 启用 log_connections，并与 log_disconnections 配合记录会话开始和结束。
    - 将连接日志接入集中日志平台，对异常来源、失败峰值和非常规时间访问建立告警。
  reference:
    - https://cloud.google.com/sql/docs/postgres/configure-database-flags
  metadata:
    vendor: google
    product: cloud-sql
  tags: cloud,devops,gcp,gcloud,google-cloud-sql,gcp-cloud-config

flow: |
  code(1)
  for(let projectId of iterate(template.projectIds)){
    set("projectId", projectId)
    code(2)
    for(let sqlInstance of iterate(template.sqlInstances)){
      set("sqlInstance", sqlInstance)
      code(3)
    }
  }

self-contained: true

code:
  - engine:
      - sh
      - bash
    source: |
      gcloud projects list --format="json(projectId)"

    extractors:
      - type: json
        name: projectIds
        internal: true
        json:
          - '.[].projectId'

  - engine:
      - sh
      - bash
    source: |
      gcloud sql instances list --project $projectId --filter='DATABASE_VERSION:POSTGRES*' --format="json(name)"

    extractors:
      - type: json
        name: sqlInstances
        internal: true
        json:
          - '.[].name'

  - engine:
      - sh
      - bash
    source: |
      gcloud sql instances describe $sqlInstance --format="json(settings.databaseFlags)" | jq '.[] | select(.name=="log_connections") | .value'

    matchers:
      - type: word
        words:
          - 'off'

    extractors:
      - type: dsl
        dsl:
          - '"Log Connections flag is disabled for PostgreSQL instance " + sqlInstance + " in project: " + projectId'
