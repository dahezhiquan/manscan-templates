id: wp-gtranslate-open-redirect

info:
  name: GTranslate < 2.8.11 - 开放重定向漏洞
  author: DhiyaneshDk,ritikchaddha
  severity: medium
  description: GTranslate < 2.8.11 - 开放重定向 存在开放重定向漏洞。攻击者可构造恶意跳转链接诱导用户访问钓鱼站点，或配合其他业务流程绕过安全校验。
  impact: |
    - 攻击者可构造可信外观的恶意链接，诱导用户跳转到钓鱼或恶意站点。
    - 还可能配合 OAuth、单点登录或邮件投递流程绕过部分校验逻辑。
  remediation: |
    - 按厂商公告升级到已修复版本；原始说明中提到的版本信息为：version 2.8.11。
    - 对跳转目标实施白名单校验，避免直接信任用户可控的 URL 参数。
    - 对登录、回调和重定向相关流程增加来源校验与业务约束。
  reference:
    - https://wpscan.com/vulnerability/d4da110e-4351-49b8-b7a1-8be24895d2fa/
  classification:
    cvss-metrics: CVSS:3.1/AV:N/AC:L/PR:N/UI:R/S:C/C:L/I:L/A:N
    cvss-score: 6.1
    cwe-id: CWE-601
    cpe: cpe:2.3:a:gtranslate:gtranslate:*:*:*:*:*:wordpress:*:*
  metadata:
    max-request: 1
    vendor: gtranslate
    product: gtranslate
    framework: wordpress
    fofa-query: body="/wp-content/plugins/gtranslate"
  tags: wordpress,wp,wp-plugin,gtranslate,redirect,vuln

http:
  - method: GET
    path:
      - "{{BaseURL}}/wp-content/plugins/gtranslate/url_addon/gtranslate.php?glang=en&gurl=/oast.me"

    matchers:
      - type: regex
        part: header
        regex:
          - '(?m)^(?:Location\s*?:\s*?)(?:https?:\/\/|\/\/|\/\\\\|\/\\)?(?:[a-zA-Z0-9\-_\.@]*)oast\.me\/?(\/|[^.].*)?$'
