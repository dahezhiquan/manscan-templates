id: jfrog-login

info:
  name: JFrog 登录面板识别（指纹识别）
  author: dhiyaneshDK
  severity: info
  description: |-
    检测到目标站点存在 JFrog 相关响应特征。JFrog 是研发运维或制品管理平台，用于管理构建、代码、制品、任务、插件、凭据和执行记录。模板请求 `/ui/login/`、`/ui/favicon.ico` 路径，并通过页面标题或正文关键字、状态码、favicon 哈希、DSL 条件确认该系统指纹，用于资产识别、系统盘点和暴露面梳理。
  reference:
    - https://www.exploit-db.com/ghdb/6797
  classification:
    cvss-metrics: CVSS:3.0/AV:N/AC:L/PR:N/UI:N/S:U/C:N/I:N/A:N
    cwe-id: CWE-200
    cpe: cpe:2.3:a:jfrog:artifactory:*:*:*:*:*:*:*:*
  metadata:
    verified: true
    max-request: 2
    shodan-query: "http.title:\"JFrog\""
    product: artifactory
    vendor: jfrog
  tags: panel,jfrog,edb,detect,login,discovery
http:
  - method: GET
    path:
      - '{{BaseURL}}/ui/login/'
      - '{{BaseURL}}/ui/favicon.ico'

    stop-at-first-match: true
    matchers:
      - type: dsl
        dsl:
          - 'status_code==200 && contains(body, "<title>JFrog")'
          - "status_code==200 && (\"-595620639\" == mmh3(base64_py(body)))"
        condition: or
