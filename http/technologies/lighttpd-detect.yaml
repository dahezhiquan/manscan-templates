id: lighttpd-detect

info:
  name: Lighttpd Web 服务器指纹识别（指纹识别）
  author: Shivam Kamboj
  severity: info
  description: >-
    lighttpd 是轻量级 Web 服务器，常用于资源受限设备、嵌入式环境和高性能静态服务。该模板通过请求目标服务并检查预设路径或首页响应、HTTP 响应头、正则特征、DSL
    条件等指纹特征，判断目标是否使用 lighttpd；命中结果仅表示指纹特征匹配，可用于资产盘点、技术栈识别和后续安全评估，不代表已确认存在可利用漏洞。
  reference:
  - https://www.lighttpd.net/
  metadata:
    verified: true
    max-request: 1
    shodan-query: http.component:"lighttpd"
  tags: tech,lighttpd,server,discovery
http:
  - method: GET
    path:
      - "{{BaseURL}}"

    matchers:
      - type: dsl
        dsl:
          - 'contains(header, "lighttpd")'

    extractors:
      - type: regex
        name: lighttpd_version
        part: header
        group: 1
        regex:
          - 'lighttpd/([0-9.]+)'
