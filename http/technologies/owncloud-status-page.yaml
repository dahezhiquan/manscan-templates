id: owncloud-status-page

info:
  name: ownCloud Status Page 指纹识别（指纹识别）
  author: myztique,invisiblethreat
  severity: info
  description: >-
    ownCloud 是企业文件同步与共享平台，状态页用于展示服务可用性、版本或实例状态。该模板通过请求目标服务并检查预设路径或首页响应、页面正文关键字等指纹特征，判断目标是否使用或暴露了
    ownCloud Status Page 相关组件；命中结果仅表示指纹特征匹配，可用于资产盘点、技术栈识别和后续安全评估，不代表已确认存在可利用漏洞。
  classification:
    cpe: cpe:2.3:a:owncloud:owncloud:*:*:*:*:*:*:*:*
  metadata:
    verified: true
    max-request: 1
    vendor: owncloud
    product: owncloud
    shodan-query: http.html:"owncloud"
  tags: tech,owncloud,status,discovery
http:
  - method: GET
    path:
      - "{{BaseURL}}/status.php"

    matchers:
      - type: word
        part: body
        words:
          - '"versionstring":'
          - '"installed":'
          - '"edition":'
        condition: and

    extractors:
      - type: json
        json:
          - .version
