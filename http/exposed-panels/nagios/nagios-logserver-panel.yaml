id: nagios-logserver-panel

info:
  name: Nagios Log Server 识别（指纹识别）
  author: ritikchaddha
  severity: info
  description: |-
    检测到目标站点存在 Nagios Log Server 相关响应特征。Nagios 是基础设施监控平台，用于监控主机、服务、网络设备、告警和可用性状态。模板请求 `/`，并通过页面标题或正文关键字确认该系统指纹，用于资产识别、系统盘点和暴露面梳理。
  metadata:
    verified: true
    max-request: 1
    fofa-query: icon_hash="1460499495"
    shodan-query: http.favicon.hash:1460499495
  tags: panel,nagios,nagios-logserver,login,detect,discovery
http:
  - method: GET
    path:
      - "{{BaseURL}}"

    matchers:
      - type: word
        part: response
        words:
          - "Nagios Log Server"
          - "/nagioslogserver/"
        condition: or
