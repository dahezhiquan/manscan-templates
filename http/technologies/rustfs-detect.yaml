id: rustfs-detect

info:
  name: Rustfs 指纹识别（指纹识别）
  author: icarot
  severity: info
  description: |
    用于识别目标是否运行 Rustfs，模板会结合页面标题、状态码和特定路径或已知端点进行服务指纹匹配。
  reference:
    - https://github.com/rustfs/rustfs
  classification:
    cpe: cpe:2.3:a:rustfs:rustfs:*:*:*:*:*:rust:*:*
  metadata:
    vendor: rustfs
    product: rustfs
    shodan-query: title:"RustFS"
  tags: tech,rustfs,rustfs,detect

http:
  - method: GET
    path:
      - "{{BaseURL}}/rustfs/console/auth/login"

    matchers-condition: and
    matchers:
      - type: word
        words:
          - '<title>RustFS</title>'
          - 'title":"RustFS'
          - '/rustfs/console/_nuxt'
        condition: or

      - type: status
        status:
          - 200
