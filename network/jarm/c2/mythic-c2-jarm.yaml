id: mythic-c2-jarm

info:
  name: Mythic C2 JARM 识别（C2 识别）
  author: pussycat0x
  severity: high
  description: |
    Mythic 是支持多 Agent、多操作员协作的 C2 平台，常用于红队作业和后渗透任务编排。该模板计算目标 TLS 服务的 JARM 指纹，并与已知 Mythic C2 指纹匹配，用于识别疑似 Mythic 控制基础设施。
  reference:
    - https://github.com/cedowens/C2-JARM
    - https://www.socinvestigation.com/shodan-filters-to-hunt-adversaries-infrastructure-and-c2/
  metadata:
    max-request: 1
  tags: jarm,network,c2,ir,osint,cti,mythic,tcp,vuln
tcp:
  - inputs:
      - data: 2E
        type: hex
    host:
      - "{{Hostname}}"
    matchers:
      - type: dsl
        dsl:
          - "jarm(Hostname) == '2ad2ad0002ad2ad00042d42d000000ad9bf51cc3f5a1e29eecb81d0c7b06eb'"
