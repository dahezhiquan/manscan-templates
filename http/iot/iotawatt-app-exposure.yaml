id: iotawatt-app-exposure

info:
  name: IoTaWatt 配置应用暴露（IOT）
  author: pussycat0x
  severity: high
  description: |
    检测到 IoTaWatt 能源监测器配置应用暴露。未授权访问该配置界面可能允许攻击者修改上传目标或连接第三方能源网站、数据库的参数。
  impact: |
    - 攻击者无需认证即可访问设备页面或功能，可能读取状态、配置和网络信息。
    - 若接口允许写操作，可能进一步导致设备配置被篡改或服务被滥用。
  remediation: |
    - 启用设备 Web 管理认证并修改默认口令，关闭匿名访问。
    - 升级固件并检查是否存在已知未授权访问漏洞。
    - 将管理页面限制在内网、管理 VLAN 或 VPN 内，并开启访问审计。
  reference:
    - https://docs.iotawatt.com/en/master/passConfig.html
  classification:
    cvss-metrics: CVSS:3.0/AV:N/AC:L/PR:N/UI:N/S:C/C:L/I:L/A:L
    cvss-score: 8.3
    cwe-id: CWE-522
  metadata:
    max-request: 1
    fofa-query: app="IoTaWatt-Configuration-app"
  tags: iot,exposure,vuln,discovery

http:
  - method: GET
    path:
      - "{{BaseURL}}"

    matchers-condition: and
    matchers:
      - type: word
        part: body
        words:
          - '<h3>Configure IoTaWatt Device</h3>'
          - '<title>IoTaWatt Configuration app</title>'
        condition: and

      - type: status
        status:
          - 200
