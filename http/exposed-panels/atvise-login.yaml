id: atvise-login

info:
  name: Atvise 登录面板（暴露面识别）
  author: idealphase
  severity: info
  description: 该模板通过识别 Atvise 登录入口的页面标题、特征文本或重定向行为，判断目标是否暴露了对应的认证界面。若命中，说明该登录面板对外可访问，可用于暴露面梳理与后续安全评估。
  reference:
    - https://www.exploit-db.com/ghdb/7837
    - https://www.atvise.com/en
  classification:
    cwe-id: CWE-200
    cpe: cpe:2.3:a:bachmann:atvise:*:*:*:*:*:*:*:*
  metadata:
    google-query: intitle:"atvise - next generation"
    max-request: 1
    product: atvise
    vendor: bachmann
  tags: panel,atvise,edb,discovery

http:
  - method: GET
    path:
      - '{{BaseURL}}'

    matchers-condition: and
    matchers:
      - type: word
        part: body
        words:
          - '<title>atvise - next generation</title>'

      - type: status
        status:
          - 200
