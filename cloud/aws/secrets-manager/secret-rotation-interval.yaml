id: secret-rotation-interval

info:
  name: Secret 轮换间隔不符合要求（云安全）
  author: DhiyaneshDK
  severity: medium
  description: Secrets Manager secret 的自动轮换间隔过长或未正确返回轮换天数时，会扩大凭据泄露后的可用窗口。该模板枚举 secrets，并检查 RotationRules.AutomaticallyAfterDays 的返回值是否匹配风险条件。
  impact: |
    - 被泄露的数据库口令、API key 或服务凭据可能在较长时间内保持有效。
    - 凭据轮换周期不受控会削弱访问撤销、人员变更和事件响应能力。
  remediation: |
    - 为 secret 设置符合组织策略的自动轮换间隔，并确保轮换 Lambda 或托管轮换配置可正常执行。
    - 定期检查 LastRotatedDate、NextRotationDate 和应用连接状态，避免轮换失败影响业务。
  reference:
    - https://www.trendmicro.com/cloudoneconformity-staging/knowledge-base/aws/SecretsManager/rotation-interval.html
    - https://docs.aws.amazon.com/cli/latest/reference/secretsmanager/rotate-secret.html
  metadata:
    vendor: amazon
    product: secrets-manager
  tags: cloud,devops,aws,amazon,secret-manager,aws-cloud-config

variables:
  region: "us-west-2"

flow: |
  code(1)
  for(let SecretListName of iterate(template.secrets)){
    set("secretlist", SecretListName)
    code(2)
  }

self-contained: true

code:
  - engine:
      - sh
      - bash
    source: |
      aws secretsmanager list-secrets --region $region --query 'SecretList[*].Name' --output json

    extractors:
      - type: json
        name: secrets
        internal: true
        json:
          - '.[]'

  - engine:
      - sh
      - bash
    source: |
        aws secretsmanager describe-secret --region $region --secret-id $secretlist --query 'RotationRules.AutomaticallyAfterDays'

    matchers:
      - type: word
        words:
          - "false"

    extractors:
      - type: dsl
        dsl:
          - '"Secret Rotation Interval  " + secretlist + " is not defined"'
