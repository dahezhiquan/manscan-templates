id: lucee-stack-trace

info:
  name: Lucee Stack Trace Error 泄露（暴露面识别）
  author: dhiyaneshDK
  severity: low
  description: 检测到可直接访问的 Lucee Stack Trace Error。日志、异常页面或调试输出通常会泄露堆栈信息、内部路径、查询语句、账号标识、令牌片段或业务数据，不应向未授权用户开放。
  metadata:
    max-request: 1
    shodan-query: http.title:"Lucee"
  tags: lucee,exposure,vuln

http:
  - method: GET
    path:
      - "{{BaseURL}}"

    matchers-condition: and
    matchers:
      - type: word
        words:
          - 'lucee.runtime'

      - type: status
        status:
          - 500
          - 200
        condition: or
