id: kodexplorer-detect

info:
  name: kodexplorer 指纹识别（指纹识别）
  author: ffffffff0x
  severity: info
  description: >-
    KodExplorer 是基于 Web 的文件管理和协作办公系统，用于在线管理文件、分享和编辑文档。该模板通过请求目标服务并检查预设路径或首页响应、页面正文关键字、正则特征等指纹特征，判断目标是否使用或暴露了
    kodexplorer 相关组件；命中结果仅表示指纹特征匹配，可用于资产盘点、技术栈识别和后续安全评估，不代表已确认存在可利用漏洞。
  classification:
    cpe: cpe:2.3:a:kodcloud:kodexplorer:*:*:*:*:*:*:*:*
  metadata:
    max-request: 1
    vendor: kodcloud
    product: kodexplorer
    fofa-query: app="Powered-by-KodExplorer"
  tags: kodexplorer,tech,discovery
http:
  - method: GET
    path:
      - "{{BaseURL}}"

    host-redirects: true
    max-redirects: 2
    matchers:
      - type: regex
        part: body
        regex:
          - '(?i)<title>.* - Powered by KodExplorer</title>'

    extractors:
      - type: regex
        part: body
        group: 1
        regex:
          - 'Powered by KodExplorer ([a-z0-9.]+) \|'
