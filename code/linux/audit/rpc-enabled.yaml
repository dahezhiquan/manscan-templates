id: rpc-enabled

info:
  name: 不必要的 RPC 服务 rstatd 已启用（本地基线扫描）
  author: songyaeji
  severity: high
  description: |
    rstatd 等旧式 RPC 服务会暴露主机运行状态和统计信息，且常通过 xinetd 或 systemd 以网络服务形式开放，现代基线通常要求禁用。模板检查 `/etc/xinetd.d/rstatd` 是否设置 `disable = no`，并检查 systemd 中 rstatd 是否活动，命中 `[VULNERABLE]` 表示服务仍启用。
  impact: |
    - 攻击者可获取系统运行状态信息，用于侦察、指纹识别或攻击准备。
    - 遗留 RPC 服务会扩大网络暴露面，并可能受旧漏洞或弱访问控制影响。
  remediation: |
    - 禁用 rstatd 及不必要的 RPC 服务，设置 xinetd `disable = yes` 并停止 systemd 服务。
    - 使用防火墙限制 RPC 相关端口，仅保留明确业务需要的服务。
  reference:
    - https://isms.kisa.or.kr
  tags: linux,local,audit,compliance,kisas

self-contained: true

code:
  - engine:
      - bash
    source: |
      if [ -f /etc/xinetd.d/rstatd ]; then
        if grep -qE 'disable\s*=\s*no' /etc/xinetd.d/rstatd; then
          echo "[VULNERABLE] rstatd RPC service is enabled in xinetd"
        else
          echo "[SAFE] rstatd RPC service is disabled in xinetd"
        fi
      elif systemctl is-active --quiet rstatd 2>/dev/null; then
        echo "[VULNERABLE] rstatd service is active under systemd"
      else
        echo "[SAFE] rstatd service not found"
      fi

    matchers:
      - type: word
        part: response
        words:
          - "[VULNERABLE]"
