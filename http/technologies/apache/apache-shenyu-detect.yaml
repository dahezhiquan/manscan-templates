id: apache-shenyu-detect

info:
  name: Apache Shenyu 网关 管理系统指纹识别（指纹识别）
  author: icarot
  severity: info
  description: |
    用于识别目标是否部署 Apache Shenyu 网关 管理系统 并提取相关版本或构建信息，模板会结合页面标题、页面正文、状态码、特定路径或已知端点和版本或标识提取结果进行指纹匹配。
  metadata:
    max-request: 1
    vendor: apache
    product: shenyu
    shodan-query: title:"shenyu"
  tags: tech,shenyu,apache,detect,discovery

http:
  - method: GET
    path:
      - "{{BaseURL}}"

    matchers-condition: and
    matchers:
      - type: word
        part: body
        words:
          - '<title>Apache ShenYu Gateway</title>'

      - type: status
        status:
          - 200
