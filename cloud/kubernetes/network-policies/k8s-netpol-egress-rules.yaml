id: k8s-netpol-egress-rules

info:
  name: Network policies define egress rules（云安全）
  author: princechaddha
  severity: medium
  description: 该规则用于检查 Kubernetes network-policies 相关资源是否存在公开暴露、未受限访问或匿名可访问等高风险配置，避免敏感数据、管理接口或网络服务直接暴露在公网。
  impact: |
    - 公开暴露的资源可能被未授权访问、枚举、下载或恶意利用。
    - 一旦涉及管理接口、对象存储或数据库服务，可能进一步导致数据泄露、权限滥用或业务中断。
  remediation: |
    - 收敛公网暴露面，仅允许受信任网络、IP 范围或必要身份访问相关资源。
    - 对对象存储、负载均衡、数据库或控制台接口启用更严格的访问控制与网络隔离策略。
  reference:
    - https://kubernetes.io/docs/concepts/services-networking/network-policies/
  tags: cloud,devops,kubernetes,devsecops,k8s,k8s-cluster-security

flow: |
  code(1);
  for (let policy of template.items) {
    set("policy", policy)
    javascript(1);
  }

self-contained: true
code:
  - engine:
      - sh
      - bash
    source: kubectl get networkpolicies --all-namespaces --output=json
    extractors:
      - type: json
        name: items
        internal: true
        json:
          - '.items[] | {policy: .metadata.name, egress: .spec.egress}'

javascript:
  - code: |
        let policyData = JSON.parse(template.policy);
        if (!policyData.egress || policyData.egress.length === 0) {
          let result = (`Network policy '${policyData.policy}' does not define egress rules.`);
          Export(result);
        }

    extractors:
      - type: dsl
        dsl:
          - response
