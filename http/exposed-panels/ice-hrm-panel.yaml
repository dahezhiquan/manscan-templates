id: ice-hrm-panel

info:
  name: ICE HRM 登录识别（指纹识别）
  author: Th3l0newolf
  severity: info
  description: |-
    检测到目标站点存在 ICE HRM 相关响应特征。IceHrm 是人力资源管理系统，用于管理员工资料、休假、考勤、招聘和绩效流程。模板请求 `/app/login.php`，并通过状态码、正则特征确认该系统指纹，用于资产识别、系统盘点和暴露面梳理。
  reference:
    - https://icehrm.com
  metadata:
    verified: true
    max-request: 1
    shodan-query: http.title:"Ice Hrm Login"
  tags: icehrm,login,hrm,panel,web,detect,discovery
http:
  - method: GET
    path:
      - "{{BaseURL}}/app/login.php"

    matchers-condition: and
    matchers:
      - type: regex
        part: body
        regex:
          - '(?i)<title>ice hrm login</title>'

      - type: status
        status:
          - 200
