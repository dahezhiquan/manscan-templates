id: i-librarian-panel

info:
  name: I-Librarian 面板识别（指纹识别）
  author: s4e-io
  severity: info
  description: |-
    检测到目标站点存在 I-Librarian 相关响应特征。I-Librarian 是监控、日志、分析或可观测性系统，用于展示运行指标、告警事件、日志数据和服务状态。模板请求 `/`，并通过页面标题或正文关键字、状态码、DSL 条件确认该系统指纹，用于资产识别、系统盘点和暴露面梳理。
  reference:
    - https://github.com/mkucej/i-librarian-free
    - https://github.com/mkucej/i-librarian
  metadata:
    verified: true
    max-request: 1
    fofa-query: "I, Librarian"
  tags: panel,login,i-librarian,detect,discovery
http:
  - method: GET
    path:
      - "{{BaseURL}}"

    host-redirects: true
    max-redirects: 2
    matchers:
      - type: dsl
        dsl:
          - 'contains_any(body, "<title>I, Librarian", "I, Librarian Free")'
          - 'status_code == 200'
        condition: and
