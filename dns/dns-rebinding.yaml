id: dns-rebinding
info:
  name: DNS Rebinding 攻击检测（dns）
  author: ricardomaia
  severity: medium
  description: |
    该模板通过检查 DNS 响应是否解析到私有 IPv4 或 IPv6 地址来识别 DNS Rebinding 风险。攻击者可借此让浏览器访问内网地址或本地服务。
  reference:
    - https://capec.mitre.org/data/definitions/275.html
    - https://payatu.com/blog/dns-rebinding/
    - https://heimdalsecurity.com/blog/dns-rebinding/
  metadata:
    max-request: 2
  tags: redirect,dns,network,discovery

dns:
  - name: "{{FQDN}}"
    type: A
    matchers:
      # IPv4
      - type: regex
        part: answer
        regex:
          - 'IN\s+A\s+(127\.0\.0\.1|10\.\d{1,3}\.\d{1,3}\.\d{1,3}|172\.(1[6-9]|2\d|3[0-1])\.\d{1,3}\.\d{1,3}|192\.168\.\d{1,3}\.\d{1,3})$'

    extractors:
      - type: regex
        part: answer
        name: IPv4
        group: 1
        regex:
          - 'IN\s+A\s+(127\.0\.0\.1|10\.\d{1,3}\.\d{1,3}\.\d{1,3}|172\.(1[6-9]|2\d|3[0-1])\.\d{1,3}\.\d{1,3}|192\.168\.\d{1,3}\.\d{1,3})'

  - name: "{{FQDN}}"
    type: AAAA
    matchers:
      # IPv6 Compressed and Full
      - type: regex
        part: answer
        regex:
          - "IN\\s+AAAA\\s+(fd[0-9a-fA-F]{2}(:[0-9a-fA-F]{0,4}){0,7})"

    extractors:
      - type: regex
        part: answer
        name: IPv6_ULA
        group: 1
        regex:
          - "IN\\s+AAAA\\s+(fd[0-9a-fA-F]{2}(:[0-9a-fA-F]{0,4}){0,7})"
