id: code-server-login

info:
  name: Code-Server 登录面板识别（指纹识别）
  author: tess
  severity: info
  description: |-
    检测到目标站点存在 Code-Server 相关响应特征。Code-Server 是监控、日志、分析或可观测性系统，用于展示运行指标、告警事件、日志数据和服务状态。模板请求 `/login`，并通过页面标题或正文关键字、状态码确认该系统指纹，用于资产识别、系统盘点和暴露面梳理。
  classification:
    cvss-metrics: CVSS:3.0/AV:N/AC:L/PR:N/UI:N/S:U/C:N/I:N/A:N
    cwe-id: CWE-200
    cpe: cpe:2.3:a:coder:code-server:*:*:*:*:*:*:*:*
  metadata:
    verified: true
    max-request: 1
    vendor: coder
    product: code-server
    shodan-query: http.title:"code-server login"
    fofa-query: title="code-server login"
    google-query: intitle:"code-server login"
  tags: panel,detect,misc,coder,discovery
http:
  - method: GET
    path:
      - "{{BaseURL}}/login"

    host-redirects: true
    max-redirects: 2

    matchers-condition: and
    matchers:
      - type: word
        part: body
        words:
          - "Welcome to code-server"
          - "Please log in below. Check the config file at ~/.config/code-server/config.yaml
            for the password."
        condition: and

      - type: status
        status:
          - 200
