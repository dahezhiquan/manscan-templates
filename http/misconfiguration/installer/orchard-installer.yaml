id: orchard-installer

info:
  name: Orchard 安装向导 暴露
  author: DhiyaneshDK
  severity: high
  description: |
    检测到 Orchard 安装向导 暴露。该页面属于安装、初始化或配置向导流程，若对外暴露，攻击者可能完成初始化、创建管理员账户或重新配置目标系统。
  classification:
    cpe: cpe:2.3:a:orchardproject:orchard:*:*:*:*:*:*:*:*
  metadata:
    verified: true
    max-request: 1
    vendor: orchardproject
    product: orchard
    shodan-query: html:"Orchard Setup - Get Started"
  tags: misconfig,exposure,install,orchard,vuln

http:
  - method: GET
    path:
      - "{{BaseURL}}"

    matchers-condition: and
    matchers:
      - type: word
        part: body
        words:
          - "Orchard Setup - Get Started"

      - type: status
        status:
          - 200
