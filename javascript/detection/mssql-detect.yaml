id: mssql-detect

info:
  name: Microsoft SQL Server 服务识别（指纹识别）
  author: Ice3man543,tarunKoyalwar
  severity: info
  description: |
    Microsoft SQL Server 是微软提供的关系型数据库管理系统，常用于企业业务系统、报表、数据仓库和 Windows 生态应用的数据存储。该模板使用 nuclei 的 MSSQL 客户端向 TCP 1433 端口发起协议握手，并在 `IsMssql` 判断和连接状态均成功时确认目标提供 SQL Server 服务；命中仅用于数据库资产指纹识别。
  metadata:
    max-request: 1
    shodan-query: port:1433
    vendor: microsoft
    product: sql_server
  tags: js,mssql,detect,network,discovery

javascript:
  - code: |
      var m = require("nuclei/mssql");
      var c = m.MSSQLClient();
      c.IsMssql(Host, Port);
    args:
      Host: "{{Host}}"
      Port: "1433"
    matchers:
      - type: dsl
        dsl:
          - "response == true"
          - "success == true"
        condition: and
