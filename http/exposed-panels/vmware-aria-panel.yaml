id: vmware-aria-panel

info:
  name: VMware Aria Operations 登录面板识别（指纹识别）
  author: rxerium
  severity: info
  description: |-
    VMware Aria Operations 是 VMware 运维监控平台，用于虚拟化环境容量、性能、告警和自动化分析。该模板请求 `/ui/login.action`，并依据 HTTP 200 状态码、页面标题、正文关键字或品牌资源特征识别目标是否部署了该系统或暴露了对应入口，适用于资产指纹确认；命中结果仅表示系统特征匹配，不代表已确认存在未授权访问或可利用漏洞。
  metadata:
    verified: true
    max-request: 1
    shodan-query: title:"VMware Aria Operations"
  tags: panel,aria,login,detect,discovery

http:
  - method: GET
    path:
      - "{{BaseURL}}/ui/login.action"

    matchers-condition: and
    matchers:
      - type: word
        part: body
        words:
          - "<title>VMware Aria Operations</title>"

      - type: status
        status:
          - 200
