id: boa-web-server

info:
  name: Boa Web 服务器 指纹识别（指纹识别）
  author: johnk3r
  severity: info
  description: |-
    Boa Web 服务器 是嵌入式轻量级 Web 服务器，常用于路由器、摄像头和 IoT 设备管理页面。该模板请求首页，并依据页面标题、正文关键字或品牌资源特征、响应头特征识别目标是否使用或暴露了 Boa Web 服务器 相关组件，适用于资产盘点、技术栈识别和后续安全评估；命中结果仅表示指纹特征匹配，不代表已确认存在可利用漏洞。
  reference:
  - https://www.microsoft.com/en-us/security/blog/2022/11/22/vulnerable-sdk-components-lead-to-supply-chain-risks-in-iot-and-ot-environments/
  - http://www.boa.org/
  classification:
    cvss-metrics: CVSS:3.0/AV:N/AC:L/PR:N/UI:N/S:U/C:N/I:N/A:N
    cwe-id: CWE-200
    cpe: cpe:2.3:a:boa:boa:*:*:*:*:*:*:*:*
  metadata:
    verified: true
    max-request: 1
    shodan-query: "Server: Boa/"
    product: boa
    vendor: boa
  tags: boa,tech,discovery

http:
  - method: GET
    path:
      - "{{BaseURL}}"

    matchers-condition: and
    matchers:
      - type: regex
        part: header
        regex:
          - "Server: Boa/"

    extractors:
      - type: kval
        part: header
        kval:
          - Server
