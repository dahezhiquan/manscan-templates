id: aurora-delete-protect
info:
  name: Aurora 集群删除保护未启用（云安全）
  author: princechaddha
  severity: medium
  description: Aurora 集群删除保护可阻止数据库被直接删除，降低误操作或被盗用权限造成的数据面中断风险。该模板枚举 Aurora 集群，并检查 DeletionProtection 是否为 false。
  impact: |
    - 管理员误操作、脚本错误或攻击者滥用权限可能删除集群，造成数据服务中断。
    - 在缺少可用备份或恢复演练的场景下，业务恢复时间和数据丢失风险会显著增加。
  remediation: |
    - 为生产和关键 Aurora 集群启用 DeletionProtection。
    - 配合最小权限、变更审批和备份恢复演练，降低数据库被意外删除后的影响。
  reference:
    - https://docs.aws.amazon.com/AmazonRDS/latest/AuroraUserGuide/DBInstanceDeletionProtection.html
  metadata:
    max-request: 2
    vendor: amazon
    product: rds
  tags: cloud,devops,aws,amazon,aurora,rds,aws-cloud-config
variables:
  region: "ap-northeast-1"

flow: |
  code(1)
  for(let clustername of iterate(template.clusters)){
    set("cluster", clustername)
    code(2)
  }

self-contained: true
code:
  - engine:
      - sh
      - bash
    source: |
      aws rds describe-db-clusters --region $region --output json --query 'DBClusters[?Engine==`aurora-mysql` || Engine==`aurora-postgresql`].DBClusterIdentifier | []'

    extractors:
      - type: json
        name: clusters
        internal: true
        json:
          - '.[]'

  - engine:
      - sh
      - bash
    source: |
         aws rds describe-db-clusters --region $region --db-cluster-identifier $cluster--query 'DBClusters[*].DeletionProtection'

    matchers:
      - type: word
        words:
          - 'false'

    extractors:
      - type: dsl
        dsl:
          - '"Deletion Protection safety feature is not enabled for " + cluster'
