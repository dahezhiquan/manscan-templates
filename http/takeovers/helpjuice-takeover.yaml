id: helpjuice-takeover

info:
  name: Helpjuice 知识库缺失接管检测（子域名接管）
  author: pdteam
  severity: high
  description: 检测 Helpjuice 返回无法找到目标内容的错误页面，表明该域名可能仍指向 Helpjuice 但未绑定有效知识库，存在被重新配置后接管的风险。
  reference:
    - https://github.com/EdOverflow/can-i-take-over-xyz
  metadata:
    max-request: 1
  tags: takeover,vuln

http:
  - method: GET
    path:
      - "{{BaseURL}}"

    matchers-condition: and
    matchers:
      - type: dsl
        dsl:
          - Host != ip

      - type: word
        words:
          - We could not find what you're looking for.

    extractors:
      - type: dsl
        dsl:
          - cname
