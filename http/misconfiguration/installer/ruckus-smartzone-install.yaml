id: ruckus-smartzone-install

info:
  name: Ruckus SmartZone 暴露 安装
  author: ritikchaddha
  severity: high
  description: |
    检测到 Ruckus SmartZone 暴露 安装。该页面属于安装、初始化或配置向导流程，若对外暴露，攻击者可能完成初始化、创建管理员账户或重新配置目标系统。
  metadata:
    verified: true
    max-request: 1
    shodan-query: html:"Welcome to the Ruckus"
  tags: misconfig,ruckus,smartzone,install,vuln

http:
  - method: GET
    path:
      - "{{BaseURL}}/adminweb/"

    matchers-condition: and
    matchers:
      - type: word
        words:
          - 'Welcome to the Ruckus'
          - 'Setup Wizard'
        condition: and

      - type: status
        status:
          - 200
