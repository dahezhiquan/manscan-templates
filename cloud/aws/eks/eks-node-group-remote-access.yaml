id: eks-node-group-remote-access

info:
  name: EKS 节点组启用远程访问配置（云安全）
  author: princechaddha
  severity: high
  description: EKS 节点组启用远程访问配置是一类工作节点管理面暴露风险，托管节点组可能配置了 SSH 远程访问入口。节点通常承载 Pod、凭据和集群网络权限，直接远程登录能力会扩大被爆破或凭据泄露后的影响。模板枚举 EKS 集群和节点组后读取 `nodegroup.remoteAccess`，当该配置不为 `null` 时判定节点组启用了远程访问。
  impact: |
    - 节点 SSH 入口可能被扫描、爆破或凭据滥用，导致工作节点被接管。
    - 攻击者控制节点后可能读取本地凭据、影响 Pod 或进一步攻击集群网络。
  remediation: |
    - 对托管节点组禁用不必要的远程访问配置，优先使用 SSM Session Manager 等受控运维方式。
    - 如确需 SSH，限制来源安全组和 CIDR，使用短期凭据并开启主机访问审计。
  reference:
    - https://www.trendmicro.com/cloudoneconformity/knowledge-base/aws/EKS/eks-node-group-remote-access.html
    - https://docs.aws.amazon.com/eks/latest/userguide/launch-templates.html
  metadata:
    vendor: amazon
    product: eks
  tags: cloud,devops,aws,amazon,eks,aws-cloud-config

variables:
  region: "us-east-1"

flow: |
  code(1)
  for(let clusterName of iterate(template.clusters)){
    set("cluster", clusterName)
    code(2)
    for(let nodegroupName of iterate(template.nodegroups)){
      set("nodegroup", nodegroupName)
      code(3)
    }
  }

self-contained: true

code:
  - engine:
      - sh
      - bash
    source: |
      aws eks list-clusters --region $region --query 'clusters[]' --output json

    extractors:
      - type: json
        name: clusters
        internal: true
        json:
          - '.[]'

  - engine:
      - sh
      - bash
    source: |
      aws eks list-nodegroups --cluster-name $cluster --region $region --query 'nodegroups[]' --output json

    extractors:
      - type: json
        name: nodegroups
        internal: true
        json:
          - '.[]'

  - engine:
      - sh
      - bash
    source: |
      aws eks describe-nodegroup --cluster-name $cluster --nodegroup-name $nodegroup --region $region --query 'nodegroup.remoteAccess' --output json

    matchers-condition: and
    matchers:
      - type: regex
        regex:
          - '.*'

      - type: word
        words:
          - "null"
        negative: true

    extractors:
      - type: dsl
        dsl:
          - '"EKS node group " + nodegroup + " in cluster " + cluster + " does not have remote access configured"'
