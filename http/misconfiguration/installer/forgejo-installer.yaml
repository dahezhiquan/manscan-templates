id: forgejo-installer

info:
  name: Forgejo 安装 Page 暴露
  author: DhiyaneshDk
  severity: high
  description: |
    检测到 Forgejo 安装 Page 暴露。该页面属于安装、初始化或配置向导流程，若对外暴露，攻击者可能完成初始化、创建管理员账户或重新配置目标系统。
  metadata:
    verified: true
    max-request: 1
    fofa-query: body="Installation - Forgejo:"
  tags: install,Forgejo,misconfig,vuln

http:
  - method: GET
    path:
      - "{{BaseURL}}"

    matchers-condition: and
    matchers:
      - type: word
        part: body
        words:
          - "<title>Installation - Forgejo: Beyond coding. We Forge.</title>"

      - type: status
        status:
          - 200
