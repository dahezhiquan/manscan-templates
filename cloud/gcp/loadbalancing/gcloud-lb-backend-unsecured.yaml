id: gcloud-lb-backend-unsecured

info:
  name: Unsecured Backend Services 中的Google Cloud Load Balancers（云安全）
  author: princechaddha
  severity: medium
  description: 负载均衡器 backend service 未绑定 Cloud Armor security policy 时，后端缺少集中化的边缘访问控制和 L7 防护。本模板从 URL map 获取默认 backend service，并检查 securityPolicy 字段，返回 null 时报告后端服务未受安全策略保护。
  impact: |
    - 后端服务更容易直接承受恶意请求、扫描、异常流量或常见 Web 攻击。
    - 缺少统一安全策略会让 IP/地理位置限制、速率控制和 WAF 规则分散在应用层，增加误配置概率。
  remediation: |
    - 为面向外部或高价值业务的 backend service 绑定合适的 Cloud Armor security policy。
    - 根据业务流量特征配置允许列表、速率限制、预配置 WAF 规则和监控告警，并定期复核策略命中情况。
  reference:
    - https://cloud.google.com/armor/docs/security-policy-overview
  metadata:
    vendor: google
    product: cloud-load-balancing
  tags: cloud,devops,gcp,gcloud,google-cloud-load-balancer,gcp-cloud-config

flow: |
  code(1)
  for(let projectId of iterate(template.projectIds)){
    set("projectId", projectId)
    code(2)
    for(let urlMapName of iterate(template.urlMaps)){
      set("urlMapName", urlMapName)
      code(3)
      for(let backendService of iterate(template.backendServices)){
        set("backendService", backendService)
        code(4)
      }
    }
  }

self-contained: true

code:
  - engine:
      - sh
      - bash
    source: |
      gcloud projects list --format="json(projectId)"

    extractors:
      - type: json
        name: projectIds
        internal: true
        json:
          - '.[].projectId'

  - engine:
      - sh
      - bash
    source: |
      gcloud compute url-maps list --project $projectId --format="json(name)"

    extractors:
      - type: json
        name: urlMaps
        internal: true
        json:
          - '.[].name'

  - engine:
      - sh
      - bash
    source: |
      gcloud compute url-maps describe $urlMapName --format="json(defaultService)"

    extractors:
      - type: json
        name: backendServices
        internal: true
        json:
          - '.defaultService'

  - engine:
      - sh
      - bash
    source: |
      gcloud compute backend-services describe $backendService --format="json(securityPolicy)"

    matchers:
      - type: word
        words:
          - 'null'

    extractors:
      - type: dsl
        dsl:
          - '"Unsecured Backend Service " + backendService + " for URL Map " + urlMapName + " in Project " + projectId'
