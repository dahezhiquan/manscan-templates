id: portainer-panel

info:
  name: Portainer 登录面板识别（指纹识别）
  author: ritikchaddha
  severity: info
  description: Portainer 是容器与 Kubernetes 管理平台，用于 Docker、Swarm 和集群资源的可视化运维。该模板请求首页、`/#!/auth` 路径，并依据 HTTP 200 状态码、页面标题、正文关键字或品牌资源特征识别目标是否部署了该系统或暴露了对应入口，适用于资产指纹确认；命中结果仅表示系统特征匹配，不代表已确认存在未授权访问或可利用漏洞。
  reference:
  - https://github.com/portainer/portainer
  classification:
    cpe: cpe:2.3:a:portainer:portainer:*:*:*:*:*:*:*:*
  metadata:
    verified: true
    max-request: 2
    vendor: portainer
    product: portainer
    shodan-query:
    - title:"Portainer"
    - http.title:"portainer"
    fofa-query: title="portainer"
    google-query: intitle:"portainer"
  tags: panel,portainer,detect,discovery

http:
  - method: GET
    path:
      - "{{BaseURL}}"
      - "{{BaseURL}}/#!/auth"

    stop-at-first-match: true
    host-redirects: true
    max-redirects: 2

    matchers-condition: and
    matchers:
      - type: word
        part: body
        words:
          - '<title>Portainer'
          - 'ng-app="portainer'
          - 'content="Portainer'
          - 'alt="Portainer'
          - 'portainer.auth'
        condition: or

      - type: status
        status:
          - 200
