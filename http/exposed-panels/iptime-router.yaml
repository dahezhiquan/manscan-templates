id: iptime-router

info:
  name: ipTIME Router 登录面板识别（暴露面识别）
  author: gy741
  severity: info
  description: 该模板通过识别 ipTIME Router 登录入口的页面标题、特征文本或重定向行为，判断目标是否暴露了对应的认证界面。若命中，说明该登录面板对外可访问，可用于暴露面梳理与后续安全评估。
  reference:
    - http://pierrekim.github.io/blog/2015-07-01-poc-with-RCE-against-127-iptime-router-models.html
  classification:
    cvss-metrics: CVSS:3.0/AV:N/AC:L/PR:N/UI:N/S:U/C:N/I:N/A:N
    cwe-id: CWE-200
  metadata:
    max-request: 1
  tags: panel,login,iptime,router,discovery

http:
  - method: GET
    path:
      - '{{BaseURL}}/sess-bin/login_session.cgi'

    matchers-condition: and
    matchers:
      - type: regex
        regex:
          - <TITLE>ipTIME ([A-Z0-9_-]+)<\/TITLE>

      - type: status
        status:
          - 200

    extractors:
      - type: regex
        part: body
        group: 1
        regex:
          - <TITLE>ipTIME ([A-Z0-9_-]+)<\/TITLE>
