id: polycom-admin-detect

info:
  name: Polycom Admin 面板识别（暴露面识别）
  author: e_schultze_
  severity: info
  description: 该模板通过识别 Polycom Admin 面板、控制台或管理界面的页面特征，判断目标是否暴露了对应服务入口。若命中，说明该后台或运维界面对外可访问，可用于资产识别与暴露面排查。
  classification:
    cvss-metrics: CVSS:3.0/AV:N/AC:L/PR:N/UI:N/S:U/C:N/I:N/A:N
    cwe-id: CWE-200
    cpe: cpe:2.3:h:polycom:vvx:*:*:*:*:*:*:*:*
  metadata:
    max-request: 1
    vendor: polycom
    product: vvx
  tags: panel,polycom,discovery

http:
  - method: GET
    path:
      - "{{BaseURL}}/systemstatus.xml"

    matchers-condition: and
    matchers:
      - type: status
        status:
          - 200

      - type: word
        words:
          - "SYSTEMSTATUS"
        part: body

      - type: word
        words:
          - "Server: lighttpd"
        part: header
