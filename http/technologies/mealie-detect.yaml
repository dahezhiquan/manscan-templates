id: mealie-detect

info:
  name: Mealie 指纹识别（指纹识别）
  author: ChrisJr404
  severity: info
  description: >-
    Mealie 是开源食谱管理和家庭餐饮规划系统，用于管理菜谱、购物清单和用餐计划。该模板通过请求目标服务并检查预设路径或首页响应、页面正文关键字、DSL 条件等指纹特征，判断目标是否使用或暴露了
    Mealie 相关组件；命中结果仅表示指纹特征匹配，可用于资产盘点、技术栈识别和后续安全评估，不代表已确认存在可利用漏洞。
  reference:
  - https://mealie.io/
  - https://github.com/mealie-recipes/mealie
  - https://docs.mealie.io/
  metadata:
    verified: true
    max-request: 1
    shodan-query: http.title:"Mealie"
  tags: tech,mealie,detect
http:
  - method: GET
    path:
      - "{{BaseURL}}/api/app/about"

    matchers:
      - type: dsl
        dsl:
          - 'status_code == 200'
          - 'contains(content_type, "json")'
          - 'contains_all(body, "\"allowPasswordLogin\"", "\"defaultHouseholdSlug\"", "\"allowedIframeHosts\"")'
        condition: and

    extractors:
      - type: json
        part: body
        json:
          - '.version'
