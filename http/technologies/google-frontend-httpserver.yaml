id: google-frontend-httpserver

info:
  name: Google Frontend HTTP Server 指纹识别（指纹识别）
  author: pikpikcu
  severity: info
  description: >-
    Google Frontend 是 Google 基础设施中的前端 HTTP 服务层，常出现在 Google 托管服务或代理后的响应中。该模板通过请求目标服务并检查预设路径或首页响应、页面正文关键字、HTTP
    响应头等指纹特征，判断目标是否使用或暴露了 Google Frontend HTTP Server 相关组件；命中结果仅表示指纹特征匹配，可用于资产盘点、技术栈识别和后续安全评估，不代表已确认存在可利用漏洞。
  metadata:
    verified: true
    max-request: 1
    fofa-query: "Server: Google Frontend"
  tags: tech,google,httpserver,discovery
http:
  - method: GET
    path:
      - "{{BaseURL}}"

    matchers:
      - type: word
        part: header
        words:
          - "Google Frontend"
