id: immich-panel

info:
  name: Immich 面板识别（指纹识别）
  author: rxerium
  severity: info
  description: |-
    检测到目标站点存在 Immich 相关响应特征。Immich 是自托管照片和视频备份管理平台，用于管理相册、用户、媒体库和移动端同步。模板请求 `/auth/login`，并通过页面标题或正文关键字、状态码确认该系统指纹，用于资产识别、系统盘点和暴露面梳理。
  reference:
    - https://immich.app/
    - https://github.com/immich-app/immich
  metadata:
    verified: true
    max-request: 1
    shodan-query: http.favicon.hash:-43504595
  tags: panel,immich,detect,discovery
http:
  - method: GET
    path:
      - "{{BaseURL}}/auth/login"

    matchers-condition: and
    matchers:
      - type: word
        words:
          - '<title>Login - Immich'
          - '"PUBLIC_IMMICH_'
          - 'alt="Immich Logo'
          - 'Welcome to Immich'
        condition: or

      - type: status
        status:
          - 200
