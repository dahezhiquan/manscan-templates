id: openlitespeed-default-login

info:
  name: OpenLiteSpeed WebAdmin 默认口令登录（弱口令）
  author: 0x_Akoko
  severity: high
  description: |
    该模板通过尝试 OpenLiteSpeed WebAdmin 的默认凭据，并依据认证成功后的响应特征判断目标是否仍在使用未修改的弱口令。若命中，攻击者可直接登录系统并访问相应管理功能或业务数据。
  reference:
    - https://www.digitalocean.com/community/tutorials/how-to-install-the-openlitespeed-web-server-on-ubuntu-18-04
  metadata:
    verified: true
    max-request: 1
    fofa-query: title="OpenLiteSpeed WebAdmin"
  tags: default-login,openlitespeed,litespeed,webadmin

variables:
  username: "admin"
  password: "123456"

http:
  - raw:
      - |
        POST /login.php HTTP/1.1
        Host: {{Hostname}}
        Content-Type: application/x-www-form-urlencoded

        userid={{username}}&pass={{password}}

    matchers:
      - type: dsl
        dsl:
          - 'status_code == 302'
          - 'contains_all(header, "LSID", "LSPA", "Location: /index.php")'
        condition: and
