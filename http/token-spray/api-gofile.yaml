id: api-gofile

info:
  name: GoFile API Token 可用性校验（token喷洒）
  author: daffainfo
  severity: info
  description: 该模板通过调用 GoFile API 的已知接口验证提供的 token 是否有效，命中后通常表示可访问文件存储与分发能力。
  reference:
    - https://gofile.io/api
    - https://github.com/daffainfo/all-about-apikey/tree/main/gofile
  metadata:
    max-request: 1
  tags: token-spray,gofile

self-contained: true

http:
  - method: GET
    path:
      - "https://api.gofile.io/getAccountDetails?token={{token}}&allDetails=true"

    matchers:
      - type: word
        part: body
        words:
          - '"token"'
          - '"email"'
          - '"rootFolder"'
        condition: and
