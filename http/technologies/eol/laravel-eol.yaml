id: laravel-eol

info:
  name: Laravel EOL 指纹识别（指纹识别）
  author: Shivam Kamboj
  severity: info
  description: >-
    Laravel 是 PHP Web 应用框架，EOL 版本表示目标应用使用的框架分支已不再接收官方修复。该模板通过请求目标服务并检查预设路径或首页响应、页面正文关键字、HTTP
    响应头、正则特征、DSL 条件等指纹特征，判断目标是否使用或暴露了 Laravel EOL 相关组件；命中结果仅表示指纹特征匹配，可用于资产盘点、技术栈识别和后续安全评估，不代表已确认存在可利用漏洞。
  reference:
  - https://endoflife.date/laravel
  - https://laravel.com/docs/releases
  metadata:
    verified: true
    max-requests: 4
    product: laravel
    vendor: laravel
    fofa-query: "x-laravel-version"
  tags: tech,laravel,eol,framework
http:
  - method: GET
    path:
      - "{{BaseURL}}"
      - "{{BaseURL}}/composer.json"
      - "{{BaseURL}}/composer.lock"

    redirects: true
    stop-at-first-match: true

    matchers-condition: and
    matchers:
      - type: dsl
        name: eol-version-detected
        dsl:
          - "compare_versions(version, '<= 11.51.0')"

      - type: dsl
        dsl:
          - 'contains(tolower(body), "laravel")'
          - 'contains_any(tolower(header), "x-powered-by", "x-laravel-version")'
        condition: or

    extractors:
      - type: regex
        name: version
        group: 1
        part: header
        regex:
          - '(?i)x-powered-by:\s*Laravel[/\s]+([0-9]+\.[0-9]+(?:\.[0-9]+)?)'
          - '(?i)x-laravel-version:\s*([0-9]+\.[0-9]+(?:\.[0-9]+)?)'

      - type: regex
        name: version
        group: 1
        part: body
        regex:
          - '"laravel/framework":\s*"\^([0-9]+\.[0-9]+)'
          - '&quot;laravelVersion&quot;:&quot;([0-9.]+)&quot;'
