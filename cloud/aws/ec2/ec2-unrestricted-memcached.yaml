id: ec2-unrestricted-memcached
info:
  name: EC2 安全组对公网开放 Memcached 端口（云安全）
  author: princechaddha
  severity: critical
  description: EC2 安全组对公网开放 Memcached 端口是一类缓存服务暴露风险，端口 11211 面向互联网可能导致缓存数据泄露、未授权操作或被用于反射放大攻击。Memcached 通常缺少面向公网的强认证边界，应仅在私有网络中被应用访问。模板通过 `describe-security-groups` 筛选 11211 端口且来源为 `0.0.0.0/0` 的入站规则，并输出命中的安全组 ID。
  impact: |
    - 缓存中的会话、令牌、配置或业务数据可能被未授权读取或篡改。
    - 暴露的 Memcached 服务可能被滥用于放大攻击，带来流量和声誉风险。
  remediation: |
    - 移除面向公网的 11211 端口入站规则，仅允许应用所在私有网段访问。
    - 对缓存服务启用访问控制、网络隔离和敏感数据最小化存储策略。
  reference:
    - https://docs.aws.amazon.com/AWSEC2/latest/UserGuide/ec2-security-groups.html
  metadata:
    vendor: amazon
    product: ec2
  tags: cloud,devops,aws,amazon,ec2,aws-cloud-config

variables:
  region: "us-east-1"

self-contained: true
code:
  - engine:
      - sh
      - bash
    source: |
      aws ec2 describe-security-groups --region $region --filters Name=ip-permission.from-port,Values=11211 Name=ip-permission.to-port,Values=11211 Name=ip-permission.cidr,Values='0.0.0.0/0' --output json --query 'SecurityGroups[*].GroupId'

    extractors:
      - type: json
        name: securitygroup
        internal: true
        json:
          - '.[]'

      - type: dsl
        dsl:
          - 'securitygroup + " security group(s) alows unrestricted access (0.0.0.0/0 or ::/0) on TCP port 11211"'
