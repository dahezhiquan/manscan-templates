id: k8s-apiserver-anonymous-access

info:
  name: Ensure kube-apiserver --anonymous-auth is explicitly disabled（云安全）
  author: songyaeji
  severity: high
  description: kube-apiserver 未显式设置 --anonymous-auth=false 时，匿名请求处理行为可能不符合安全基线，增加未认证访问面。本模板多种方式读取 kube-apiserver 启动命令，发现缺少 --anonymous-auth=false 时报告。
  impact: |
    - 匿名主体可能访问允许 system:anonymous 的 API 路径，造成信息泄露或被误授权利用。
    - 错误 RBAC 绑定与匿名访问叠加时，可能扩大未认证操作能力。
  remediation: |
    - 在 kube-apiserver 启动参数中显式设置 --anonymous-auth=false。
    - 审计 ClusterRoleBinding，避免向 system:anonymous 或 system:unauthenticated 授予不必要权限。
  reference:
    - https://kubernetes.io/docs/reference/command-line-tools-reference/kube-apiserver/
  metadata:
    vendor: kubernetes
    product: kubernetes
  tags: cloud,devops,kubernetes,security,devsecops,api-server,k8s-cluster-security
variables:
  argument: "--anonymous-auth=false"

self-contained: true
code:
  - engine:
      - sh
      - bash
    source: |
      kubectl get pods -n kube-system -l component=kube-apiserver -o jsonpath="{.items[*].spec.containers[*].command}" 2>/dev/null || \
      kubectl get pods -n kube-system -l k8s-app=kube-apiserver -o jsonpath="{.items[*].spec.containers[*].command}" 2>/dev/null || \
      kubectl get pods -n kube-system -o jsonpath="{.items[?(@.metadata.name.indexOf('kube-apiserver')>=0)].spec.containers[*].command}" 2>/dev/null || \
      echo ""
    matchers-condition: and
    matchers:
      - type: word
        words:
          - 'kube-apiserver'
      - type: word
        words:
          - "{{argument}}"
        negative: true

    extractors:
      - type: dsl
        dsl:
          - '"kube-apiserver configuration does not explicitly set " + argument + ". This may allow anonymous access."'
