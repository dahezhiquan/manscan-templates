id: defectdojo-panel

info:
  name: DefectDojo 登录面板识别（暴露面识别）
  author: Adam Crosser
  severity: info
  description: 该模板通过识别 DefectDojo 登录入口的页面标题、特征文本或重定向行为，判断目标是否暴露了对应的认证界面。若命中，说明该登录面板对外可访问，可用于暴露面梳理与后续安全评估。
  classification:
    cvss-metrics: CVSS:3.0/AV:N/AC:L/PR:N/UI:N/S:U/C:N/I:N/A:N
    cwe-id: CWE-200
    cpe: cpe:2.3:a:owasp:defectdojo:*:*:*:*:*:*:*:*
  metadata:
    max-request: 1
    shodan-query: html:"DefectDojo Logo"
    product: defectdojo
    vendor: owasp
  tags: panel,defectdojo,discovery

http:
  - method: GET
    path:
      - '{{BaseURL}}/login?next='

    matchers:
      - type: word
        words:
          - "<img src=\"/static/dojo/img/logo.png\" alt=\"DefectDojo Logo"
