id: atlassian-confluence-detect

info:
  name: Confluence 指纹识别（指纹识别）
  author: philippedelteil,AdamCrosser,6mile
  severity: info
  description: |-
    Confluence 是 Atlassian 企业知识库平台，用于文档协作、空间、页面和团队知识管理。该模板请求 `/dologin.action`、首页、`/pages` 等路径，并依据 DSL 条件识别目标是否使用或暴露了 Confluence 相关组件，适用于资产盘点、技术栈识别和后续安全评估；命中结果仅表示指纹特征匹配，不代表已确认存在可利用漏洞。
  classification:
    cpe: cpe:2.3:a:atlassian:confluence_server:*:*:*:*:*:*:*:*
  metadata:
    max-request: 5
    vendor: atlassian
    product: confluence_server
    shodan-query:
    - http.component:"Atlassian Confluence"
    - http.component:"atlassian confluence"
    category: productivity
  tags: tech,confluence,atlassian,detect,discovery

http:
  - method: GET
    path:
      - "{{BaseURL}}/dologin.action"
      - "{{BaseURL}}"
      - "{{BaseURL}}/pages"
      - "{{BaseURL}}/confluence"
      - "{{BaseURL}}/wiki"

    redirects: true
    stop-at-first-match: true
    matchers:
      - type: dsl
        dsl:
          - contains(to_lower(header), '-confluence-')
          - contains(to_lower(body), 'confluence-base-url')

    extractors:
      - type: regex
        name: version
        group: 1
        regex:
          - '<meta name="ajs-version-number" content="(.*)">'
          - 'Atlassian Confluence ([a-z0-9-._]+)'

      - type: regex
        name: hostname
        group: 1
        regex:
          - '<meta id="confluence-base-url" name="confluence-base-url" content="https://(.*)">'
          - '<meta name="ajs-base-url" content="https://(.*)">'
          - '<meta name="ajs-server-name" content="(.*)">'
