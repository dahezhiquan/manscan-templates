id: codesys-webvisu-panel

info:
  name: CODESYS WebVisu 面板（暴露面识别）
  author: rxerium
  severity: info
  description: |
    该模板用于识别 CODESYS WebVisu 是否存在对外暴露的管理、服务或状态界面。若命中，说明目标公开了相关功能入口，可作为资产盘点与攻击面收敛的依据。
  reference:
    - https://www.codesys.com/products/codesys-runtime/web-visualization.html
  metadata:
    max-request: 1
    verified: true
    vendor: CODESYS
    product: webvisu
    shodan-query: 'html:"WEBVISU LOGIN"'
  tags: panel,ics,scada,codesys,webvisu,discovery

http:
  - method: GET
    path:
      - "{{BaseURL}}"

    host-redirects: true
    max-redirects: 2

    matchers-condition: and
    matchers:
      - type: word
        part: body
        words:
          - 'WebVisu Authentication'
          - 'WEBVISU LOGIN'
          - '4Tredir'
        condition: or

      - type: status
        status:
          - 200
