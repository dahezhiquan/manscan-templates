id: azure-appservice-remote-debugging-enabled
info:
  name: Azure App Service 远程调试已启用（云安全）
  author: princechaddha
  severity: high
  description: Azure App Service 启用远程调试时，调试通道会扩大运行中应用的管理和代码诊断能力，不适合长期用于生产环境。该模板枚举 Web App，查询 remoteDebuggingEnabled，并在返回 true 时报告远程调试已启用。
  impact: |
    - 获得部署权限或调试通道访问权限的攻击者可能读取进程信息、配置和敏感数据，甚至影响应用执行。
    - 调试接口长期暴露会扩大管理面，并可能绕过正常发布审批和变更审计流程。
  remediation: |
    - 生产环境关闭 remoteDebuggingEnabled，仅在受控排障窗口临时启用并设置明确的回滚时间。
    - 限制部署和运维权限，审计调试连接、应用设置和文件变更，并在排障完成后轮换可能暴露的凭据。
  reference:
    - https://docs.microsoft.com/en-us/azure/app-service/troubleshoot-remote-debug
  metadata:
    vendor: microsoft
    product: azure-app-service
  tags: cloud,devops,azure,microsoft,appservice,azure-cloud-config

flow: |
  code(1);
  for (let WebAppData of iterate(template.webAppList)) {
    set("ids", WebAppData);
    code(2);
  }

self-contained: true
code:
  - engine:
      - sh
      - bash
    source: |
      az webapp list --query '[*].{id:id}' --output json

    extractors:
      - type: json
        name: webAppList
        internal: true
        json:
          - '.[].[]'

  - engine:
      - sh
      - bash
    source: |
      az webapp config show --ids $ids --query 'remoteDebuggingEnabled' --output json

    matchers:
      - type: word
        words:
          - "true"

    extractors:
      - type: dsl
        dsl:
          - 'id + " has remote debugging enabled."'
