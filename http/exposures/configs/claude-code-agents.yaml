id: claude-code-agents

info:
  name: Claude Code 子代理配置暴露（暴露面识别）
  author: shadowhunter-92
  severity: low
  description: |
    在 Web 服务器上检测到位于 `.claude/agents/` 下的 Claude Code 子代理配置文件。该目录中的每个 `.md` 文件都会定义一个专用 AI 子代理的名称、描述、工具白名单和系统提示词，供 Claude Code 委派任务使用。若这些文件被暴露，可能泄露自定义系统提示词、工具授权信息，以及项目内部自动化配置；其中往往还包含内部 API 端点、业务逻辑或提示词工程相关的敏感内容。若 `.claude/agents/` 目录本身可列目录，还会进一步暴露项目中定义的全部子代理清单。
  reference:
    - https://docs.claude.com/en/docs/claude-code/sub-agents
    - https://docs.claude.com/en/docs/claude-code/settings
  classification:
    cvss-metrics: CVSS:3.1/AV:N/AC:L/PR:N/UI:N/S:U/C:H/I:N/A:N
    cvss-score: 7.5
    cwe-id: CWE-200,CWE-538
  metadata:
    verified: true
    max-request: 4
    shodan-query: http.html:"claude"
  tags: config,exposure,claude,claude-code,anthropic,ai,subagent

http:
  - method: GET
    path:
      - "{{BaseURL}}/.claude/agents/"
      - "{{BaseURL}}/.claude/agents/index.md"
      - "{{BaseURL}}/.claude/agents/README.md"
      - "{{BaseURL}}/.claude/agents/code-reviewer.md"

    stop-at-first-match: false

    host-redirects: true
    max-redirects: 2

    matchers-condition: and
    matchers:
      - type: regex
        part: body
        condition: or
        regex:
          - '(?s)^---\s*\n.*?\bname:\s*[A-Za-z0-9_-]+.*?\bdescription:\s*.*?\n---'
          - '(?i)Index of /\.claude/agents'
          - '(?i)Directory listing for /\.claude/agents'
          - '>[a-zA-Z0-9_.-]+\.md<'

      - type: status
        status:
          - 200

    extractors:
      - type: regex
        name: agent_name
        part: body
        regex:
          - 'name:\s*["'']?([a-zA-Z0-9_-]+)'

      - type: regex
        name: allowed_tools
        part: body
        regex:
          - 'tools:\s*\[?([^\]\n]+)'

      - type: regex
        name: agent_files
        part: body
        regex:
          - '>([a-zA-Z0-9_.-]+\.md)<'
