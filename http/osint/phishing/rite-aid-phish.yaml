id: rite-aid-phish

info:
  name: Rite Aid 仿冒钓鱼网站（钓鱼网站识别）
  author: rxerium
  severity: info
  description: |
    检测到疑似仿冒 Rite Aid 的钓鱼网站。模板在目标页面返回 200、页面内容命中 Rite Aid 的品牌页面特征，且当前主机不属于 riteaid.com 官方域名时触发，用于识别借用 Rite Aid 品牌页面诱导用户信任的仿冒站点。
  reference:
    - https://riteaid.com
  metadata:
    max-request: 1
  tags: phishing,rite-aid,ecommerce,osint,discovery
http:
  - method: GET
    path:
      - "{{BaseURL}}"

    host-redirects: true
    max-redirects: 2

    matchers-condition: and
    matchers:
      - type: word
        words:
          - "Rite Aid pharmacy offers products and services to help you lead a healthy, happy life. Visit our online pharmacy, shop now, or find a store near you."

      - type: status
        status:
          - 200

      - type: dsl
        dsl:
          - '!contains(host,"riteaid.com")'
