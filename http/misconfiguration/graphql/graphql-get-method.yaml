id: graphql-get-method

info:
  name: GraphQL CSRF GET method 检测
  author: Dolev Farhi
  severity: info
  description: |
    检测到 GraphQL CSRF GET method 检测。目标响应或文件中可能暴露配置、凭据、密钥、令牌、环境变量或历史记录等敏感信息，可能被用于进一步入侵。
  reference:
    - https://graphql.org/learn/serving-over-http/#get-request
    - https://github.com/dolevf/Damn-Vulnerable-GraphQL-Application
    - https://cheatsheetseries.owasp.org/cheatsheets/GraphQL_Cheat_Sheet.html
    - https://graphql.security/
  metadata:
    max-request: 2
  tags: graphql,misconfig,vuln

http:
  - method: GET
    path:
      - "{{BaseURL}}/graphql?query={__typename}"
      - "{{BaseURL}}/api/graphql?query={__typename}"

    stop-at-first-match: true

    matchers-condition: and
    matchers:
      - type: word
        part: body
        words:
          - '"query"'
          - '"data"'
          - '"__typename"'
        case-insensitive: true
        condition: and

      - type: word
        part: header
        words:
          - "application/json"
