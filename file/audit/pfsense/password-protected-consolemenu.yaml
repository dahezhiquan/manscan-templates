id: password-protected-consolemenu

info:
  name: pfSense 控制台菜单未启用密码保护（本地文件安全扫描）
  author: pussycat0x
  severity: medium
  description: |
    pfSense Console Menu 提供本地控制台上的接口、恢复和配置操作。若未配置禁用或密码保护策略，能够接触设备控制台的人员可能直接进入管理菜单。本模板在 XML 中检查是否缺少 `disableconsolemenu` 或其值为 1，命中后应结合实际控制台访问策略和机房物理保护确认风险。
  impact: |
    - 物理接触或控制台重定向暴露时，未保护的菜单可能被用于修改网络接口、规则、账户和恢复设置。
    - 边界设备配置被本地篡改后，攻击者可能绕过远程管理审计并影响整个网络。
  reference:
    - https://docs.netgate.com/pfsense/en/latest/config/advanced-admin.html
  classification:
    cvss-metrics: CVSS:3.1/AV:N/AC:L/PR:N/UI:N/S:U/C:N/I:N/A:N
    cvss-score: 0
    cwe-id: CWE-200
  metadata:
    verified: true
  remediation: |
    - 对不需要本地菜单的设备设置 `disableconsolemenu=1`，或按 pfSense 版本启用明确的控制台密码保护。
    - 限制机房、串口、虚拟控制台和恢复介质的物理访问，并对本地维护操作进行双人审批和审计。
  tags: firewall,config,audit,pfsense,file

file:
  - extensions:
      - xml

    matchers-condition: and
    matchers:
      - type: word
        words:
          - "<disableconsolemenu>"
          - "<disableconsolemenu>1</disableconsolemenu>"
        condition: or
        negative: true

      - type: word
        words:
          - "<pfsense>"
          - "<webgui>"
          - "<system>"
        condition: and

