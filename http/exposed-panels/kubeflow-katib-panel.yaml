id: kubeflow-katib-panel

info:
  name: Kubeflow Katib 面板 - 检测（指纹识别）
  author: rxerium
  severity: info
  description: |-
    检测到 Kubeflow Katib，这是一个 Kubernetes 原生的自动化机器学习（AutoML）项目，用于执行超参数调优、早停和神经架构搜索。其 Web UI 通常通过 Kubeflow Central Dashboard 在 /katib/ 路径下提供，前端由 Istio/OIDC 认证代理保护，因此未认证暴露并不常见，但在该实例上被识别出存在此情况。
  reference:
    - https://github.com/kubeflow/katib
    - https://www.kubeflow.org/docs/components/katib/
  metadata:
    verified: true
    max-request: 1
    vendor: kubeflow
    product: katib
    shodan-query: 'html:"dashboard_lib.bundle.js"'
  tags: panel,kubeflow-katib,ml,ai,mlops,detect,discovery

http:
  - method: GET
    path:
      - "{{BaseURL}}/katib/"

    host-redirects: true
    max-redirects: 2

    matchers-condition: and
    matchers:
      - type: word
        part: body
        words:
          - 'base href="/katib/"'
          - "/katib/static/"
        condition: and

      - type: status
        status:
          - 200
