id: zentral-panel

info:
  name: Zentral 面板识别（暴露面识别）
  author: Adam Crosser
  severity: info
  description: 该模板通过识别 Zentral 面板、控制台或管理界面的页面特征，判断目标是否暴露了对应服务入口。若命中，说明该后台或运维界面对外可访问，可用于资产识别与暴露面排查。
  reference:
    - https://github.com/zentralopensource/zentral
    - https://zentral.io
  classification:
    cvss-metrics: CVSS:3.0/AV:N/AC:L/PR:N/UI:N/S:U/C:N/I:N/A:N
    cwe-id: CWE-200
  metadata:
    max-request: 1
  tags: panel,zentral,oss,discovery

http:
  - method: GET
    path:
      - '{{BaseURL}}'

    matchers:
      - type: word
        words:
          - '<title>Zentral</title>'
          - '<div class="panel-footer btn-group btn-group-justified"'
        condition: and
