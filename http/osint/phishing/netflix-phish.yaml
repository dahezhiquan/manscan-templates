id: netflix-phish

info:
  name: Netflix 仿冒钓鱼网站（钓鱼网站识别）
  author: rxerium
  severity: info
  description: |
    检测到疑似仿冒 Netflix 的钓鱼网站。模板在目标页面返回 200、页面内容命中 Netflix 的品牌页面特征，且当前主机不属于 netflix.com 官方域名时触发，用于识别借用 Netflix 品牌页面诱导用户信任的仿冒站点。
  reference:
    - https://netflix.com
  metadata:
    max-request: 1
  tags: phishing,netflix,osint,discovery
http:
  - method: GET
    path:
      - "{{BaseURL}}"

    host-redirects: true
    max-redirects: 2

    matchers-condition: and
    matchers:
      - type: word
        words:
          - 'Watch Netflix films &amp; TV programmes online or stream right to your smart TV, game console, PC, Mac, mobile, tablet and more.'

      - type: status
        status:
          - 200

      - type: dsl
        dsl:
          - '!contains(host,"netflix.com")'
