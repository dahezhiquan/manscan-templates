id: credit-agricole-phish

info:
  name: Crédit Agricole 仿冒钓鱼网站（钓鱼网站识别）
  author: rxerium
  severity: high
  description: |
    Crédit Agricole 是面向个人或企业客户的银行与金融服务品牌，通常提供账户登录、转账、信用卡、贷款或在线银行业务。该模板用于识别疑似仿冒 Crédit Agricole 的钓鱼网站；模板访问目标站点首页，在目标页面返回 200 状态码，且页面内容命中 Crédit Agricole 官方页面常见文案或标题特征（“Crédit Agricole”、“Crédit Agricole 1re banque de l&#039;habitat, de l&#039;ag...”），且当前主机不属于 credit-agricole.com 等官方域名时触发。该类仿冒页面通常用于收集账号密码、一次性验证码、银行卡或加密资产相关信息，可能直接引发资金盗刷和资产转移。
  impact: |-
    - 用户可能在仿冒页面提交网银、支付、银行卡、一次性验证码或加密资产账户信息，导致资金盗刷、资产转移和身份冒用。
    - 钓鱼站点可能被用于投递恶意链接、伪造登录流程或绕过用户对官方品牌的信任判断。
    - 品牌方或被仿冒组织可能面临客户投诉、欺诈交易、信誉受损以及后续应急处置成本。
  remediation: |-
    - 确认该站点是否为授权域名；若确认为仿冒站点，立即在网关、DNS、邮件安全和浏览器安全策略中阻断访问。
    - 向被仿冒品牌、托管商、注册商、CDN 和浏览器安全浏览服务提交滥用举报或下架请求。
    - 保留 URL、域名、解析记录、页面截图、证书和命中特征等证据，用于威胁情报关联和后续追踪。
    - 排查是否已有用户访问或提交信息；对疑似受影响账号执行密码重置、会话撤销、令牌轮换和多因素认证加固。
    - 对可能暴露的银行卡、支付账户或加密资产账户执行交易监控、冻结、限额或人工复核。
  reference:
    - https://credit-agricole.com
  metadata:
    max-request: 1
  tags: phishing,credit-agricole,bank,osint,discovery
http:
  - method: GET
    path:
      - "{{BaseURL}}"

    host-redirects: true
    max-redirects: 2

    matchers-condition: and
    matchers:
      - type: word
        words:
          - 'Crédit Agricole'
          - 'Crédit Agricole 1re banque de l&#039;habitat, de l&#039;agriculture, des entreprises, des pros, des collectivites territoriales'
        condition: and

      - type: status
        status:
          - 200

      - type: dsl
        dsl:
          - '!contains(host,"credit-agricole.com")'
