id: pyload-panel

info:
  name: PyLoad Login 面板（暴露面识别）
  author: DhiyaneshDk
  severity: info
  description: |
    该模板通过识别 PyLoad Login 登录入口的页面标题、特征文本或重定向行为，判断目标是否暴露了对应的认证界面。若命中，说明该登录面板对外可访问，可用于暴露面梳理与后续安全评估。
  reference:
    - https://github.com/pyload/pyload
  classification:
    cpe: cpe:2.3:a:pyload:pyload:*:*:*:*:*:*:*:*
  metadata:
    verified: true
    max-request: 2
    vendor: pyload
    product: pyload
    shodan-query:
      - title:"Login - pyLoad"
      - http.title:"login - pyload"
      - http.html:"pyload"
      - http.title:"pyload"
    fofa-query:
      - body="pyload"
      - title="login - pyload"
      - title="pyload"
    google-query:
      - intitle:"pyload"
      - intitle:"login - pyload"
    zoomeye-query: app="pyLoad"
  tags: panel,pyload,login,discovery

http:
  - method: GET
    path:
      - "{{BaseURL}}"
      - "{{BaseURL}}/login"

    stop-at-first-match: true
    host-redirects: true

    matchers-condition: and
    matchers:
      - type: word
        words:
          - 'Login - pyLoad'
          - 'alt="Pyload'
        condition: or
        case-insensitive: true

      - type: status
        status:
          - 200
