id: phpipam-installer

info:
  name: PHP IPAM 安装 Page 暴露
  author: DhiyaneshDK
  severity: high
  description: |
    检测到 PHP IPAM 安装 Page 暴露。该页面属于安装、初始化或配置向导流程，若对外暴露，攻击者可能完成初始化、创建管理员账户或重新配置目标系统。
  classification:
    cpe: cpe:2.3:a:phpipam:phpipam:*:*:*:*:*:*:*:*
  metadata:
    verified: true
    max-request: 1
    vendor: phpipam
    product: phpipam
    shodan-query: html:"phpipam installation wizard"
  tags: misconfig,exposure,install,phpipam,vuln

http:
  - method: GET
    path:
      - "{{BaseURL}}/index.php?page=install"

    matchers-condition: and
    matchers:
      - type: word
        part: body
        words:
          - "<title>phpipam installation</title>"

      - type: status
        status:
          - 200
