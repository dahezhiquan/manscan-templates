id: cloudfoundry-detect

info:
  name: Cloudfoundry 指纹识别（指纹识别）
  author: uomogrande
  severity: info
  description: Cloudfoundry 是云原生应用平台，用于部署、扩展和管理应用运行环境。该模板请求首页，并依据 DSL 条件识别目标是否使用或暴露了 Cloudfoundry 相关组件，适用于资产盘点、技术栈识别和后续安全评估；命中结果仅表示指纹特征匹配，不代表已确认存在可利用漏洞。
  reference:
  - https://docs.cloudfoundry.org/concepts/cf-routing-architecture.html
  metadata:
    max-request: 2
  tags: cloudfoundry,tech,discovery

http:
  - raw:
      - |
        GET / HTTP/1.1
        Host: {{Hostname}}
      # request unknown (random) route
      - |
        GET / HTTP/1.1
        Host: {{randstr}}.com

    stop-at-first-match: true
    matchers:
      - type: dsl
        dsl:
          - 'contains(header, "X-Vcap-Request-Id:") || contains(header, "X-Cf-Routererror:")'
