id: telnet-service-misconfig

info:
  name: Telnet 服务配置不当（本地基线扫描）
  author: princechaddha
  severity: high
  description: |
    Telnet 明文传输且不适合作为远程管理入口。对应基线项为“Telnet 服务是否存在不安全运行或配置”；模板查询 `Telnet` 服务状态，并结合输出匹配判断服务是否处于不安全状态。
  impact: |
    - 攻击者可窃听凭据或利用弱口令访问系统。
    - 远程入口暴露或协议保护不足会增加暴力破解、中间人攻击和远程控制风险。
  remediation: |
    - 禁用 Telnet 服务，改用 SSH 或受控远程管理通道。
    - 限制访问来源，优先使用加密和强认证，并关闭无业务需求的远程服务。
  tags: windows,telnet,service,misconfig,code,windows-audit

self-contained: true

code:
  - pre-condition: |
      IsWindows();
    engine:
      - powershell.exe
    args:
      - -ExecutionPolicy
      - Bypass
    pattern: "*.ps1"
    source: |
      $service = Get-Service Telnet -ErrorAction SilentlyContinue;
      if ($service -and $service.Status -ne 'Running') { Write-Output 'Misconfigured' }

    matchers:
      - type: word
        words:
          - "Misconfigured"
