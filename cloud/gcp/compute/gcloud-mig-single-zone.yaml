id: gcloud-mig-single-zone

info:
  name: Managed Instance Group 未Configured 的Multiple Zones（云安全）
  author: princechaddha
  severity: low
  description: 托管实例组仅部署在单一区域或未配置多区域分布时，无法抵御单可用区故障。本模板枚举 MIG，并检查 distributionPolicy.zones 是否为 null，命中时报告实例组未配置跨多个 zone 分布。
  impact: |
    - 单 zone 故障、维护或资源耗尽可能导致整个实例组容量不可用。
    - 高可用服务缺少区域级冗余，会增加业务中断和恢复时间。
  remediation: |
    - 对承载关键业务的 MIG 使用 regional managed instance group，并配置多个 zone 的分布策略。
    - 结合负载均衡、自动扩缩容和容量预留验证跨 zone 故障转移效果。
  reference:
    - https://www.trendmicro.com/cloudoneconformity/knowledge-base/gcp/ComputeEngine/mig-multiple-zones.html
    - https://cloud.google.com/compute/docs/instance-groups/distributing-instances-with-regional-instance-groups
  metadata:
    vendor: google
    product: compute-engine
  tags: cloud,devops,gcp,gcloud,compute,reliability,mig,zones,gcp-cloud-config

flow: |
  code(1)
  for(let projectId of iterate(template.projectIds)){
    set("projectId", projectId)
    code(2)
    for(let instanceGroup of iterate(template.instanceGroups)){
      set("instanceGroupName", instanceGroup.name)
      code(3)
    }
  }

self-contained: true

code:
  - engine:
      - sh
      - bash
    source: |
      gcloud projects list --format="json(projectId)"

    extractors:
      - type: json
        name: projectIds
        internal: true
        json:
          - '.[].projectId'

  - engine:
      - sh
      - bash
    source: |
      gcloud compute instance-groups list --project $projectId --only-managed --format="json(name)"

    extractors:
      - type: json
        name: instanceGroups
        internal: true
        json:
          - '.[]'

  - engine:
      - sh
      - bash
    source: |
      gcloud compute instance-groups managed describe $instanceGroupName --format="json(distributionPolicy.zones)"

    matchers:
      - type: word
        words:
          - "null"

    extractors:
      - type: dsl
        dsl:
          - '"Managed Instance Group " + instanceGroupName + " in project " + projectId + " is not configured to run instances across multiple zones"'
