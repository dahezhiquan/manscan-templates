id: echo-detect

info:
  name: Echo 协议识别（服务漏洞）
  author: pussycat0x
  severity: info
  description: |
    该模板通过发送回显数据并验证响应，识别目标是否开放 Echo 调试协议服务。
  reference:
    - https://en.wikipedia.org/wiki/Echo_Protocol
  metadata:
    verified: true
    max-request: 1
    shodan-query: "port:7"
  tags: echo,network,js,udp,discovery

javascript:
  - pre-condition: |
      isUDPPortOpen(Host,Port);
    code: |
      let packet = bytes.NewBuffer();
      const c = require("nuclei/net");
      const cmd = Payload
      packet.WriteString(cmd)
      let conn = c.Open('udp', `${Host}:${Port}`);
      conn.SendHex(packet.Hex());
      const result = conn.RecvString()
      result

    args:
      Host: "{{Host}}"
      Port: 7
      Payload: "{{randstr}}"

    matchers:
      - type: dsl
        dsl:
          - "success == true"
          - contains(response, "{{randstr}}")
        condition: and
