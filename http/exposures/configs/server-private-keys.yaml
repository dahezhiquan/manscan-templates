id: server-private-keys

info:
  name: SSL/SSH/TLS/JWT 密钥暴露（暴露面识别）
  author: geeknik,R12W4N,j4vaovo,VulnSCOUT
  severity: high
  description: |
    检测到目标站点可直接访问 SSL/SSH/TLS/JWT 密钥。私钥文件用于 SSH 登录、TLS 证书、JWT 签名或服务身份认证，一旦公开可能导致远程访问、通信加密或令牌签发能力被滥用。该模板请求 `/localhost.key`、`/host.key`、`/www.key` 等路径，并通过 HTTP 状态码、响应正文关键字、文件格式特征、正则匹配或响应头进行确认。配置文件公开后可能泄露部署细节、内部路径、依赖版本、环境变量、访问凭据或调试信息，增加被侦察和后续利用的风险。
  impact: |-
    - 泄露的密码、API Key、访问令牌、私钥或服务账号凭据可能被用于直接访问云资源、代码仓库、数据库、邮件服务或内部系统。
    - 攻击者可能借助有效凭据读取或篡改业务数据、发布恶意制品、创建持久化访问、冒用服务身份或产生额外资源费用。
    - 即使凭据权限有限，也会暴露账号命名、环境划分和内部系统关系，辅助后续横向移动。
  remediation: |-
    - 立即撤销并轮换暴露文件中可能出现的密码、API Key、访问令牌、SSH/SSL 私钥、数据库连接串和云访问密钥。
    - 将敏感配置迁移到密钥管理系统、环境变量注入或受控配置中心，避免随静态文件对外发布。
    - 限制相关账号权限并启用最小权限、MFA、访问审计和异常调用告警。
    - 排查近期登录、API 调用、代码仓库、云资源和制品库操作记录，确认是否存在未授权使用。
  classification:
    cvss-metrics: CVSS:3.1/AV:N/AC:L/PR:N/UI:N/S:U/C:H/I:N/A:N
    cvss-score: 7.5
    cwe-id: CWE-200
  metadata:
    max-request: 47
  tags: config,exposure,vuln

http:
  - method: GET
    path:
      - "{{BaseURL}}{{paths}}"
    payloads:
      paths:
        - "/localhost.key"
        - "/host.key"
        - "/www.key"
        - "/private-key"
        - "/privatekey.key"
        - "/server.key"
        - "/my.key"
        - "/key.pem"
        - "/ssl/localhost.key"
        - "/ssl/{{Hostname}}.key"
        - "/id_rsa"
        - "/id_dsa"
        - "/id_rsa_1024"
        - "/id_rsa_2048"
        - "/id_rsa_3072"
        - "/id_rsa_4096"
        - "/id_ed25519"
        - "/.ssh/id_rsa"
        - "/.ssh/id_dsa"
        - "/.ssh/id_rsa_1024"
        - "/.ssh/id_rsa_2048"
        - "/.ssh/id_rsa_3072"
        - "/.ssh/id_rsa_4096"
        - "/.ssh/id_ed25519"
        - "/{{Hostname}}.key"
        - "/{{Hostname}}.pem"
        - "/config/jwt/private.pem"
        - "/jwt/private.pem"
        - "/var/jwt/private.pem"
        - "/private.pem"
        - "/ssl.txt"
        - "/ssl_key.txt"
        - "/certificates/{{Host}}.pfx"
        - "/certificates/{{Host}}.p12"
        - "/ssl/{{Host}}.pem"
        - "/ssl/{{Host}}_key.txt"
        - "/cert/{{Host}}_key.txt"
        - "/cert/{{RDN}}_key.txt"
        - "/cert/{{Host}}.txt"
        - "/ssl/private/{{Host}}_key.pem"
        - "/certs/{{Host}}_private.key"
        - "/certs/{{Host}}.key"
        - "/certificates/{{Host}}_priv.pem"
        - "/certificates/{{Host}}_privkey.pem"
        - "/certs/{{Host}}.pem"
        - "/private/{{Host}}.key"
        - "/keys/{{Host}}.pem"

    stop-at-first-match: true

    matchers-condition: and
    matchers:
      - type: word
        words:
          - "BEGIN OPENSSH PRIVATE KEY"
          - "BEGIN PRIVATE KEY"
          - "BEGIN RSA PRIVATE KEY"
          - "BEGIN DSA PRIVATE KEY"
          - "BEGIN EC PRIVATE KEY"
          - "BEGIN PGP PRIVATE KEY BLOCK"
          - "BEGIN ENCRYPTED PRIVATE KEY"
        condition: or

      - type: status
        status:
          - 200

      - type: dsl
        dsl:
          - '!contains(body, "<html")'
          - '!contains(body, "<HTML")'
        condition: and
