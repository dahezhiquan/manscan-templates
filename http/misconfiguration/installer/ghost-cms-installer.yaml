id: ghost-cms-installer

info:
  name: Ghost CMS 安装配置暴露
  author: 0x_Akoko
  severity: high
  description: |
    该模板用于核查 Ghost CMS 安装配置暴露。该类问题通常源于安装、初始化、升级或配置向导在部署完成后仍可从公网访问。模板会向目标发送探测请求，并依据请求 `/ghost/api/admin/authentication/setup/`、`/ghost/api/v3/admin/authentication/setup/`、匹配 `status_code == 200`、匹配 `contains(content_type, "application/json")`、匹配 `contains_all(body, "\"setup\"", "\"status\"", "false")`等证据确认目标是否存在该配置问题。
  impact: |
    - 攻击者可能完成初始化流程、创建管理员账户、覆盖配置或触发升级逻辑。
    - 在部分系统中，暴露安装入口还可能导致数据库连接信息泄露、站点被重新配置或业务被接管。
  remediation: |
    - 完成部署后立即删除、禁用或限制安装与升级入口。
    - 对初始化流程增加来源限制和一次性安装校验，避免公网直接访问。
    - 检查系统是否已被异常初始化或创建未知管理员账户，并轮换相关凭据。
  reference:
    - https://ghost.org/docs/install/
    - https://ghost.org/docs/config/
    - https://github.com/TryGhost/Ghost
  metadata:
    max-request: 1
    verified: true
    fofa-query: app="Ghost-CMS"
    shodan-query: http.component:"Ghost"
  tags: ghost,cms,exposure,setup,takeover,unauth

http:
  - method: GET
    path:
      - "{{BaseURL}}/ghost/api/admin/authentication/setup/"
      - "{{BaseURL}}/ghost/api/v3/admin/authentication/setup/"

    stop-at-first-match: true
    host-redirects: true
    max-redirects: 2

    matchers:
      - type: dsl
        dsl:
          - 'status_code == 200'
          - 'contains(content_type, "application/json")'
          - 'contains_all(body, "\"setup\"", "\"status\"", "false")'
        condition: and
