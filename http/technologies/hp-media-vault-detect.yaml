id: hp-media-vault-detect

info:
  name: HP Media Vault 指纹识别（指纹识别）
  author: pussycat0x
  severity: info
  description: >-
    HP Media Vault 是面向家庭和小型办公环境的网络存储设备，用于文件共享、备份和媒体存储。该模板通过请求目标服务并检查预设路径或首页响应、页面正文关键字、状态码等指纹特征，判断目标是否使用或暴露了
    HP Media Vault 相关组件；命中结果仅表示指纹特征匹配，可用于资产盘点、技术栈识别和后续安全评估，不代表已确认存在可利用漏洞。
  metadata:
    max-request: 1
    fofa-query: 'app="HP-Media-Vault-Media-Server"'
  tags: tech,hp,discovery
http:
  - method: GET
    path:
      - "{{BaseURL}}"

    matchers-condition: and
    matchers:
      - type: word
        words:
          - "<title>HP Media Vault"
        part: body

      - type: status
        status:
          - 200
