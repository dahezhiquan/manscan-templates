id: ec2-unrestricted-opensearch
info:
  name: EC2 安全组对公网开放 OpenSearch 端口（云安全）
  author: princechaddha
  severity: critical
  description: EC2 安全组对公网开放 OpenSearch 端口是一类搜索与分析服务暴露风险，9200 端口面向任意来源可能导致索引数据被枚举、查询或篡改。OpenSearch/Elasticsearch 类服务通常应位于私有网络，并通过应用层或受控代理访问。模板通过 `describe-security-groups` 筛选 9200 端口且来源为公网网段的入站规则，并输出命中的安全组 ID。
  impact: |
    - 搜索索引中的日志、业务文档或个人数据可能被未授权查询和导出。
    - 攻击者可能利用暴露的 API 修改索引、删除数据或进一步攻击后端服务。
  remediation: |
    - 移除面向公网的 9200 端口入站规则，仅允许应用层或受控管理网段访问。
    - 为 OpenSearch 启用认证授权、TLS、审计日志和索引级访问控制。
  reference:
    - https://en.wikipedia.org/wiki/OpenSearch
  metadata:
    vendor: amazon
    product: ec2
  tags: cloud,devops,aws,amazon,opensearch,aws-cloud-config

variables:
  region: "us-east-1"

self-contained: true
code:
  - engine:
      - sh
      - bash
    source: |
      aws ec2 describe-security-groups --region $region --filters Name=ip-permission.from-port,Values=9200 Name=ip-permission.to-port,Values=9200 Name=ip-permission.cidr,Values='0.0.0.0/0 or ::/0' --query 'SecurityGroups[*].GroupId' --output json

    extractors:
      - type: json
        name: securitygroup
        internal: true
        json:
          - '.[]'

      - type: dsl
        dsl:
          - 'securitygroup + " security group(s) alows unrestricted access (0.0.0.0/0 or ::/0) on TCP port 9200"'
