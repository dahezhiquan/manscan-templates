id: gcloud-gke-workload-identity-disabled

info:
  name: GKE Clusters 未启用Workload Identity Federation（云安全）
  author: princechaddha
  severity: medium
  description: GKE Workload Identity Federation 可让 Kubernetes 工作负载使用短期身份访问 Google Cloud 资源，避免在集群中分发长期服务账号密钥。本模板枚举集群并检查 workloadIdentityConfig，返回 null 时报告该集群未启用 Workload Identity Federation。
  impact: |
    - 工作负载可能依赖长期服务账号密钥或默认节点身份，密钥泄露后更容易被用于持久访问云资源。
    - Pod 与 Google Cloud 权限之间缺少细粒度绑定，会扩大节点或命名空间被攻破后的权限影响面。
  remediation: |
    - 为集群启用 Workload Identity Federation，并按命名空间和 Kubernetes ServiceAccount 绑定最小化 IAM 权限。
    - 清理不再需要的用户管理服务账号密钥，避免工作负载继续依赖长期凭据访问 Google Cloud API。
  reference:
    - https://cloud.google.com/kubernetes-engine/docs/how-to/workload-identity
    - https://www.trendmicro.com/cloudoneconformity/knowledge-base/gcp/GKE/enable-workload-identity.html
  metadata:
    vendor: google
    product: google-kubernetes-engine
  tags: cloud,devops,gcp,gcloud,gke,kubernetes,security,iam,gcp-cloud-config

flow: |
  code(1)
  for(let projectId of iterate(template.projectIds)){
    set("projectId", projectId)
    code(2)
    for(let cluster of iterate(template.clusters)){
      cluster = JSON.parse(cluster)
      set("clusterName", cluster.name)
      set("location", cluster.location)
      code(3)
    }
  }

self-contained: true

code:
  - engine:
      - sh
      - bash
    source: |
      gcloud projects list --format="json(projectId)"

    extractors:
      - type: json
        name: projectIds
        internal: true
        json:
          - '.[].projectId'

  - engine:
      - sh
      - bash
    source: |
      gcloud container clusters list --project $projectId --format="json(name,location)"

    extractors:
      - type: json
        name: clusters
        internal: true
        json:
          - '.[]'

  - engine:
      - sh
      - bash
    source: |
      gcloud container clusters describe $clusterName --location $location --project $projectId --format="json(workloadIdentityConfig)"

    matchers:
      - type: word
        words:
          - "null"

    extractors:
      - type: dsl
        dsl:
          - '"GKE cluster " + clusterName + " in " + location + " of project " + projectId + " does not have Workload Identity Federation enabled"'
