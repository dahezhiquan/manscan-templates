id: us-bank-phish

info:
  name: US Bank 仿冒钓鱼网站（钓鱼网站识别）
  author: rxerium
  severity: info
  description: |
    检测到疑似仿冒 US Bank 的钓鱼网站。模板在目标页面返回 200、页面内容命中 US Bank 的金融或支付页面特征，且当前主机不属于 usbank.com 官方域名时触发，用于识别借用 US Bank 品牌页面诱导用户信任的仿冒站点。
  reference:
    - https://usbank.com
  metadata:
    max-request: 1
  tags: phishing,us-bank,bank,osint,discovery
http:
  - method: GET
    path:
      - "{{BaseURL}}"

    host-redirects: true
    max-redirects: 2

    matchers-condition: and
    matchers:
      - type: word
        words:
          - "Experience personalized banking services for your unique needs with U.S. Bank - Checking, credit cards, home loans & convenient online banking. Member FDIC."

      - type: status
        status:
          - 200

      - type: dsl
        dsl:
          - '!contains(host,"usbank.com")'
