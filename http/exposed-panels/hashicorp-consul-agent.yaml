id: hashicorp-consul-agent

info:
  name: Hashicorp Consul Agent 识别（指纹识别）
  author: c-sh0
  severity: info
  description: |-
    检测到目标站点存在 Hashicorp Consul Agent 相关响应特征。HashiCorp Consul 是服务发现与服务网格平台，Web UI 用于查看服务、节点、健康检查、KV 和访问策略。模板请求 `/v1/agent/self`，并通过页面标题或正文关键字确认该系统指纹，用于资产识别、系统盘点和暴露面梳理。
  classification:
    cvss-metrics: CVSS:3.1/AV:N/AC:L/PR:N/UI:N/S:U/C:N/I:N/A:N
    cwe-id: CWE-200
    cpe: cpe:2.3:a:hashicorp:consul:*:*:*:*:*:*:*:*
  metadata:
    max-request: 1
    vendor: hashicorp
    product: consul
    shodan-query:
      - http.title:"consul by hashicorp"
      - cpe:"cpe:2.3:a:hashicorp:consul"
    fofa-query: title="consul by hashicorp"
    google-query: intitle:"consul by hashicorp"
  tags: tech,consul,api,panel,hashicorp,discovery
http:
  - method: GET
    path:
      - "{{BaseURL}}/v1/agent/self"

    matchers:
      - type: word
        words:
          - '"Datacenter":'
          - '"Revision":'
          - '"PrimaryDatacenter"'
        condition: and

    extractors:
      - type: json
        json:
          - " .Config.Version"
