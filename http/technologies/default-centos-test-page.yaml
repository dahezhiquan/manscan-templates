id: default-centos-test-page

info:
  name: CentOS-WebPanel 测试页面 指纹识别（指纹识别）
  author: dhiyaneshDk
  severity: info
  description: CentOS-WebPanel 测试页面 是 Linux 主机控制面板，用于网站、服务、账号和服务器管理。该模板请求首页，并依据页面标题、正文关键字或品牌资源特征识别目标是否使用或暴露了 CentOS-WebPanel 测试页面 相关组件，适用于资产盘点、技术栈识别和后续安全评估；命中结果仅表示指纹特征匹配，不代表已确认存在可利用漏洞。
  metadata:
    max-request: 1
    shodan-query: http.title:"HTTP Server Test Page powered by CentOS-WebPanel.com"
  tags: tech,centos,discovery

http:
  - method: GET
    path:
      - '{{BaseURL}}'

    matchers:
      - type: word
        words:
          - "<title>HTTP Server Test Page powered by CentOS-WebPanel.com</title>"
        part: body
