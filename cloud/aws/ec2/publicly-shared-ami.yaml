id: publicly-shared-ami
info:
  name: Publicly Shared AMI（云安全）
  author: princechaddha
  severity: medium
  description: 该规则用于检查 AWS EC2 相关资源是否存在公开暴露、未受限访问或匿名可访问等高风险配置，避免敏感数据、管理接口或网络服务直接暴露在公网。
  impact: |
    - 公开暴露的资源可能被未授权访问、枚举、下载或恶意利用。
    - 一旦涉及管理接口、对象存储或数据库服务，可能进一步导致数据泄露、权限滥用或业务中断。
  remediation: |
    - 收敛公网暴露面，仅允许受信任网络、IP 范围或必要身份访问相关资源。
    - 对对象存储、负载均衡、数据库或控制台接口启用更严格的访问控制与网络隔离策略。
  reference:
    - https://docs.aws.amazon.com/AWSEC2/latest/UserGuide/sharingamis-explicit.html
  metadata:
    max-request: 2
  tags: cloud,devops,aws,amazon,ami,aws-cloud-config
variables:
  region: "us-east-1"

flow: |
  code(1)
  for(let AmiName of iterate(template.amis)){
    set("ami", AmiName)
    code(2)
  }

self-contained: true
code:
  - engine:
      - sh
      - bash
    source: |
      aws ec2 describe-images --region $region --owners self --output json --query 'Images[*].ImageId' --output json

    extractors:
      - type: json
        name: amis
        internal: true
        json:
          - '.[]'

  - engine:
      - sh
      - bash
    source: |
         aws ec2 describe-images --region $region --image-ids $ami --owners self --query 'Images[*].Public'

    matchers:
      - type: word
        words:
          - "true"

    extractors:
      - type: dsl
        dsl:
          - 'ami + " AMI is publically shared"'
