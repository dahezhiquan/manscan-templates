id: drupal-eol

info:
  name: Drupal 生命周期结束（EOL）- 识别（指纹识别）
  author: CyberTechSea
  severity: info
  description: |-
    检测到已到达生命周期结束（EOL）且不再接收安全更新的 Drupal 版本。Drupal 7、8 和 9 已完全不再支持。对于 Drupal 10 和 11，只有最近的次要分支获得安全覆盖，因此较旧的次要版本会被报告为 EOL。
  impact: |-
    不受支持的 Drupal 版本不再接收安全通告或补丁，因此新披露的漏洞将长期处于可被利用的状态。
  remediation: |-
    升级到仍受安全支持的 Drupal 版本，具体以 Drupal 核心发布周期策略公布的信息为准。
  reference:
    - https://endoflife.date/drupal
    - https://www.drupal.org/about/core/policies/core-release-cycles/schedule
    - https://www.drupal.org/about/drupal-7/d7eol
  metadata:
    verified: true
    max-request: 3
    product: drupal
    vendor: drupal
    shodan-query: http.component:"Drupal"
  tags: tech,drupal,eol

http:
  - method: GET
    path:
      - "{{BaseURL}}"
      - "{{BaseURL}}/core/CHANGELOG.txt"
      - "{{BaseURL}}/CHANGELOG.txt"

    host-redirects: true
    max-redirects: 2
    stop-at-first-match: true

    extractors:
      - type: regex
        part: all
        name: version
        group: 1
        regex:
          - '(?i)Drupal\s+([0-9]+\.[0-9]+(?:\.[0-9]+)?),\s+[0-9]{4}-'
          - '(?i)content=["\x27]?Drupal\s+([0-9]+(?:\.[0-9]+)*)'
          - '(?i)X-Generator:\s*Drupal\s+([0-9]+(?:\.[0-9]+)*)'

    matchers:
      - type: dsl
        dsl:
          - "compare_versions(version, '<10.0.0')"
