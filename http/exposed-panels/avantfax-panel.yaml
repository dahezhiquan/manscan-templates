id: avantfax-panel

info:
  name: AvantFAX 登录面板（暴露面识别）
  author: pikpikcu,daffainfo
  severity: info
  description: 该模板通过识别 AvantFAX 登录入口的页面标题、特征文本或重定向行为，判断目标是否暴露了对应的认证界面。若命中，说明该登录面板对外可访问，可用于暴露面梳理与后续安全评估。
  reference:
    - http://www.avantfax.com/
  classification:
    cvss-metrics: CVSS:3.0/AV:N/AC:L/PR:N/UI:N/S:U/C:N/I:N/A:N
    cwe-id: CWE-668
    cpe: cpe:2.3:a:avantfax:avantfax:*:*:*:*:*:*:*:*
  metadata:
    max-request: 1
    vendor: avantfax
    product: avantfax
    shodan-query:
      - http.title:"AvantFAX - Login"
      - http.title:"avantfax - login"
    fofa-query: title="avantfax - login"
    google-query: intitle:"avantfax - login"
  tags: panel,avantfax,login,discovery

http:
  - method: GET
    path:
      - "{{BaseURL}}"

    matchers-condition: and
    matchers:
      - type: word
        part: body
        words:
          - "<title>- AvantFAX - Login</title>"

      - type: status
        status:
          - 200

    extractors:
      - type: regex
        part: body
        group: 1
        regex:
          - '<p align="center">([0-9.]+)<\/p>'
