id: route53-dnssec-signing-disabled

info:
  name: Route 53 托管区域 DNSSEC 签名未启用（云安全）
  author: DhiyaneshDK
  severity: medium
  description: DNSSEC signing 可为托管区域 DNS 响应提供可验证的完整性和来源认证；未启用时，解析结果缺少 DNSSEC 保护。该模板枚举 hosted zone，并检查 get-dnssec 返回的 ServeSignature 是否为 NOT_SIGNING。
  impact: |
    - 支持 DNSSEC 验证的解析链路无法验证该区域记录的完整性，增加缓存投毒或解析篡改风险。
    - 对高价值域名而言，缺少 DNSSEC 会降低域名解析层面的信任保障。
  remediation: |
    - 在 Route 53 hosted zone 中启用 DNSSEC signing，并正确配置 KSK、ZSK 和父区 DS 记录。
    - 启用后监控 DNSSEC 状态和密钥轮换流程，避免签名故障影响域名解析。
  reference:
    - https://www.trendmicro.com/cloudoneconformity-staging/knowledge-base/aws/Route53/enable-query-logging.html
    - https://docs.aws.amazon.com/Route53/latest/DeveloperGuide/monitoring-overview.html
  metadata:
    vendor: amazon
    product: route53
  tags: cloud,devops,aws,amazon,route53,aws-cloud-config
variables:
  region: "us-west-2"

flow: |
  code(1)
  for(let HostedZones of iterate(template.hostedzones)){
    set("hostedzone", HostedZones)
    code(2)
  }

self-contained: true

code:
  - engine:
      - sh
      - bash
    source: |
      aws route53 list-hosted-zones --region $region --query "HostedZones[*].Id" --output json

    extractors:
      - type: json
        name: hostedzones
        internal: true
        json:
          - '.[]'

  - engine:
      - sh
      - bash

    source: |
        aws route53 get-dnssec --region $region --hosted-zone-id "$hostedzone" --query "Status.ServeSignature" --output json

    matchers:
      - type: word
        words:
          - 'NOT_SIGNING'

    extractors:
      - type: dsl
        dsl:
          - 'hostedzone + " DNSSEC Signing for Route 53 Hosted Zones is Disabled"'
