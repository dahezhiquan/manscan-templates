id: loqate-api-key

info:
  name: Loqate API 密钥泄露（暴露面识别）
  author: realexp3rt
  severity: low
  description: 检测到页面中疑似暴露了 Loqate API 密钥。如果相关密钥、令牌或凭据仍然有效，攻击者可能借此访问关联服务、调用接口、读取数据，或进一步对目标环境发起横向利用。
  reference:
    - https://www.loqate.com/en-gb/home/
  classification:
    cwe-id: CWE-522,CWE-540
  metadata:
    max-request: 1
  tags: exposure,token,loqate,vuln

http:
  - method: GET
    path:
      - "{{BaseURL}}"

    extractors:
      - type: regex
        part: body
        regex:
          - "[A-Z]{2}[0-9]{2}-[A-Z]{2}[0-9]{2}-[A-Z]{2}[0-9]{2}-[A-Z]{2}[0-9]{2}"
