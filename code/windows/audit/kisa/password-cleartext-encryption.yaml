id: password-cleartext-encryption

info:
  name: 允许可逆加密存储密码（本地基线扫描）
  author: nukunga[SungHyunJeon]
  severity: medium
  description: |
    该模板检查“使用可逆加密存储密码”策略是否启用。可逆加密接近明文存储，会显著降低口令保护强度。
  impact: |
    攻击者获取密码数据库后更容易还原用户口令。
  remediation: |
    禁用可逆加密存储密码，并要求用户在策略变更后更新密码。
  reference:
    - https://isms.kisa.or.kr/main/csap/notice/?boardId=bbs_0000000000000004&mode=view&cntId=85
  tags: code,windows-audit,kisa,account-management,password-policy

self-contained: true

code:
  - pre-condition: |
      IsWindows();
    engine:
      - powershell
      - powershell.exe
    args:
      - -ExecutionPolicy
      - Bypass
    pattern: "*.ps1"
    source: |
      # Export security settings to a configuration file
      secedit /export /cfg C:\cfg.txt | Out-Null
      $cfg = Get-Content C:\cfg.txt | Out-String
      if ($cfg -match "ClearTextPassword\s*=\s*(\d)") {
          $value = $Matches[1]
          if ($value -eq "1") {
              "CLEAR_TEXT_PASSWORD_ENABLED"
          } else {
              "CLEAR_TEXT_PASSWORD_DISABLED"
          }
      } else {
          "CLEAR_TEXT_PASSWORD_NOT_FOUND"
      }

    matchers:
      - type: word
        words:
          - "CLEAR_TEXT_PASSWORD_ENABLED"
