id: jboss-juddi-panel

info:
  name: JBoss WS JUDDI Console 面板识别（暴露面识别）
  author: DhiyaneshDk
  severity: info
  description: |
    该模板通过识别 JBoss WS JUDDI Console 面板、控制台或管理界面的页面特征，判断目标是否暴露了对应服务入口。若命中，说明该后台或运维界面对外可访问，可用于资产识别与暴露面排查。
  remediation: 如无业务需要，应限制该服务的访问范围，避免服务注册表控制台直接暴露在外网。
  reference:
    - https://github.com/ilmila/J2EEScan/blob/master/src/main/java/burp/j2ee/issues/impl/JBossJuddi.java
  classification:
    cvss-metrics: CVSS:3.0/AV:N/AC:L/PR:N/UI:N/S:U/C:N/I:N/A:N
    cwe-id: CWE-200
    cpe: cpe:2.3:a:redhat:jboss_enterprise_web_platform:*:*:*:*:*:*:*:*
  metadata:
    verified: true
    max-request: 2
    vendor: redhat
    product: jboss_enterprise_web_platform
    shodan-query:
      - html:"JBoss WS"
      - http.html:"jboss ws"
    fofa-query: body="jboss ws"
  tags: panel,jboss,juddi,redhat,discovery

http:
  - method: GET
    path:
      - "{{BaseURL}}"
      - "{{BaseURL}}/juddi/"

    stop-at-first-match: true

    matchers-condition: and
    matchers:
      - type: word
        part: body
        words:
          - "JBoss JUDDI"

      - type: word
        part: header
        words:
          - "text/html"

      - type: status
        status:
          - 200
