id: pupyc2

info:
  name: PupyC2 识别（暴露面识别）
  author: pussycat0x
  severity: high
  description: |-
    检测到目标站点暴露 PupyC2 相关 Web 面板或登录入口。PupyC2 是与 C2、远控、窃密或钓鱼基础设施相关的 Web 管理入口，通常用于会话管理、任务下发、受害主机或钓鱼流程的集中控制。模板请求 `/`，并通过响应头关键字、状态码确认入口可访问；该结果可作为威胁情报排查、攻击基础设施清理和暴露面收敛依据。
  impact: |-
    - 可帮助攻击者或防守方确认目标存在 PupyC2 相关 C2、远控、窃密或钓鱼基础设施，暴露组织资产、红队演练环境或恶意运营节点。
    - 若该面板未限制来源或存在弱口令、默认凭据、已知漏洞，攻击者可能接管控制端、获取会话数据、篡改任务配置或扩大攻击链影响。
    - 对外暴露的恶意基础设施面板还可能导致溯源线索、受害数据或行动配置被第三方发现和滥用。
  remediation: |-
    - 核实 PupyC2 面板是否属于授权资产、演练环境或应急分析环境；若为未知或恶意基础设施，应立即隔离主机并保全日志证据。
    - 对确需保留的控制台限制访问来源，仅允许 VPN、堡垒机或可信管理网段访问，并启用强认证、最小权限和完整审计。
    - 轮换相关凭据、令牌和证书，检查是否存在异常任务、回连会话或数据外传痕迹，并持续监控同类指纹再次暴露。
  reference:
    - https://twitter.com/TLP_R3D/status/1654038602282565632
    - https://github.com/n1nj4sec/pupy
  metadata:
    verified: true
    max-request: 1
    shodan-query: aa3939fc357723135870d5036b12a67097b03309
  tags: c2,ir,osint,pupyc2,panel,vuln
http:
  - method: GET
    path:
      - '{{BaseURL}}'

    matchers-condition: and
    matchers:
      - type: word
        part: header
        words:
          - 'Etag: "aa3939fc357723135870d5036b12a67097b03309"'

      - type: status
        status:
          - 200
