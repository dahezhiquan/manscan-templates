id: konga-panel

info:
  name: Konga 面板识别（指纹识别）
  author: princechaddha
  severity: info
  description: |-
    检测到目标站点存在 Konga 相关响应特征。Konga 是云原生、中间件或集群管理平台，用于管理服务、工作负载、消息流、API 网关、配置和运行状态。模板请求 `/`，并通过页面标题或正文关键字、状态码确认该系统指纹，用于资产识别、系统盘点和暴露面梳理。
  reference:
    - https://github.com/pantsel/konga
  classification:
    cvss-metrics: CVSS:3.1/AV:N/AC:L/PR:N/UI:N/S:U/C:N/I:N/A:N
    cwe-id: CWE-200
    cpe: cpe:2.3:a:pantsel:konga:*:*:*:*:*:*:*:*
  metadata:
    max-request: 1
    vendor: pantsel
    product: konga
  tags: tech,konga,oss,panel,pantsel,discovery
http:
  - method: GET
    path:
      - "{{BaseURL}}"

    matchers-condition: and
    matchers:
      - type: word
        part: body
        words:
          - "<title>Konga</title>"

      - type: status
        status:
          - 200

    extractors:
      - type: regex
        part: body
        group: 1
        regex:
          - 'konga_version = "(.*)";'
