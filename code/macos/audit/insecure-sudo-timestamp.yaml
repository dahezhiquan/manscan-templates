id: insecure-sudo-timestamp

info:
  name: macOS sudo 时间戳超时过长（本地基线扫描）
  author: geeknik
  severity: medium
  description: |
    sudo 时间戳超时过长会延长用户输入密码后的免密 sudo 窗口，终端被接触或会话被劫持时更容易被滥用。模板检查 `/etc/sudoers` 中 `timestamp_timeout`，当配置为三位数及以上时表示免密窗口明显过长。
  impact: |
    - 攻击者获取已解锁会话后，可在较长时间内直接执行 sudo 操作。
    - 过长的提权缓存会削弱特权操作的即时身份验证和审计边界。
  remediation: |
    - 将 `timestamp_timeout` 调整为组织基线允许的较短时间，或在高敏环境设置为 0。
    - 使用 `visudo` 修改 sudoers，并结合屏幕锁定和终端会话超时策略。
  tags: macos,audit,local,security,sudo

self-contained: true

code:
  - engine:
      - sh
      - bash
    source: |
      grep -E "^Defaults.*timestamp_timeout=" /etc/sudoers
    matchers:
      - type: regex
        regex:
          - "timestamp_timeout=([1-9][0-9]{2,})"
