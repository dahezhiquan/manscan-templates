id: homebridge-panel

info:
  name: Homebridge 面板识别（指纹识别）
  author: rxerium
  severity: info
  description: |-
    检测到目标站点存在 Homebridge 相关响应特征。Homebridge 是 Apple HomeKit 兼容桥接平台，Web UI 用于管理插件、设备、配置和服务状态。模板请求 `/login`，并通过页面标题或正文关键字、状态码确认该系统指纹，用于资产识别、系统盘点和暴露面梳理。
  reference:
    - https://homebridge.io/
    - https://github.com/homebridge
  metadata:
    verified: true
    max-request: 1
    shodan-query: title:"Homebridge"
  tags: panel,homebridge,detect,discovery
http:
  - method: GET
    path:
      - "{{BaseURL}}/login"

    matchers-condition: and
    matchers:
      - type: word
        part: body
        words:
          - '<title>Homebridge</title>'

      - type: status
        status:
          - 200
