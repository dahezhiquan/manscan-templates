id: huawei-home-gateway

info:
  name: HUAWEI HG658d 家庭网关面板（IOT）
  author: dhiyaneshDK
  severity: info
  description: |
    检测到 HUAWEI Home Gateway HG658d 管理面板。该入口暴露可能泄露家庭网关或小型网络路由设备的远程管理界面。
  metadata:
    max-request: 1
    shodan-query: http.title:"HUAWEI Home Gateway HG658d"
  tags: iot,huawei,discovery

http:
  - method: GET
    path:
      - "{{BaseURL}}"

    matchers-condition: and
    matchers:
      - type: word
        words:
          - '<title>HUAWEI Home Gateway HG658d</title>'

      - type: status
        status:
          - 200
