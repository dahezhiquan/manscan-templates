id: temenos-t24-login

info:
  name: Temenos Transact 登录面板识别（暴露面识别）
  author: korteke
  severity: info
  description: 该模板通过识别 Temenos Transact 登录入口的页面标题、特征文本或重定向行为，判断目标是否暴露了对应的认证界面。若命中，说明该登录面板对外可访问，可用于暴露面梳理与后续安全评估。
  reference:
    - https://www.temenos.com/products/transact/
  classification:
    cvss-metrics: CVSS:3.0/AV:N/AC:L/PR:N/UI:N/S:U/C:N/I:N/A:N
    cwe-id: CWE-200
    cpe: cpe:2.3:a:temenos:t24:*:*:*:*:*:*:*:*
  metadata:
    max-request: 1
    shodan-query: http.title:"t24 sign in"
    verified: true
    product: t24
    vendor: temenos
  tags: panel,exposure,temenos,discovery

http:
  - method: GET
    path:
      - "{{BaseURL}}/servlet/BrowserServlet"

    matchers-condition: and
    matchers:
      - type: word
        part: body
        words:
          - '<title>T24 Sign in</title>'
          - 'value="CREATE.SESSION"'
        condition: and

      - type: status
        status:
          - 200
