id: hpe-officeconnect-panel

info:
  name: HPE OfficeConnect Switch 面板识别（暴露面识别）
  author: pussycat0x
  severity: info
  description: |
    该模板通过识别 HPE OfficeConnect Switch 面板、控制台或管理界面的页面特征，判断目标是否暴露了对应服务入口。若命中，说明该后台或运维界面对外可访问，可用于资产识别与暴露面排查。
  metadata:
    verified: true
    max-request: 1
    shodan-query: html:"HPE OfficeConnect"
  tags: panel,hp,hpe,officeconnect,login,discovery

http:
  - method: GET
    path:
      - "{{BaseURL}}/"
    host-redirects: true
    max-redirects: 2

    matchers:
      - type: dsl
        dsl:
          - "status_code == 200"
          - "contains(body, '<title>HPE OfficeConnect Switch')"
        condition: and

    extractors:
      - type: regex
        name: version
        part: body
        regex:
          - 'HPE OfficeConnect Switch ([0-9A-Z a-z+()]+)'
