id: camaleon-panel

info:
  name: Camaleon CMS Login 面板（暴露面识别）
  author: DhiyaneshDK
  severity: info
  description: |
    该模板通过识别 Camaleon CMS Login 登录入口的页面标题、特征文本或重定向行为，判断目标是否暴露了对应的认证界面。若命中，说明该登录面板对外可访问，可用于暴露面梳理与后续安全评估。
  metadata:
    vendor: tuzitio
    product: camaleon_cms
    shodan-query: html:"camaleon_cms"
  tags: camaleon,panel,login,discovery

http:
  - method: GET
    path:
      - "{{BaseURL}}/admin/login"

    host-redirects: true
    max-redirects: 2

    matchers-condition: and
    matchers:
      - type: word
        part: body
        words:
          - 'camaleon_cms'
          - 'Forgot your password'
        condition: and

      - type: status
        status:
          - 200
