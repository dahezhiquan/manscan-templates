id: file-disable-directory-listing

info:
  name: Apache2 目录列表未禁用（本地文件安全扫描）
  author: pussycat0x
  severity: medium
  description: |
    该模板检查 Apache 是否禁用目录列表。若目录列表开启，未授权用户可浏览服务器目录结构和文件名。
  remediation: |
    在 Apache 配置或 .htaccess 中设置 Options -Indexes，并重载或重启服务。
  reference:
    - https://httpd.apache.org/docs/2.4/mod/core.html#options
  metadata:
    verified: true
  tags: audit,config,file,apache,hardening

file:
  - extensions:
      - conf

    matchers-condition: and
    matchers:
      - type: word
        words:
          - "<Directory"
          - "<FilesMatch"
        condition: and

      - type: word
        words:
          - "Options Indexes"
        negative: true
