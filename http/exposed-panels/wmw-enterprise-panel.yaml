id: wmw-enterprise-panel

info:
  name: WMW Enterprise 登录面板识别（指纹识别）
  author: Matt Galligan
  severity: info
  description: |-
    WMW Enterprise 是 Web 业务系统入口，用于用户登录、配置和后台业务操作。该模板请求 `/en/login`，并依据 HTTP 200 状态码、页面标题、正文关键字或品牌资源特征识别目标是否部署了该系统或暴露了对应入口，适用于资产指纹确认；命中结果仅表示系统特征匹配，不代表已确认存在未授权访问或可利用漏洞。
  reference:
  - https://www.wmw-hub.com/
  classification:
    cvss-metrics: CVSS:3.1/AV:N/AC:L/PR:N/UI:N/S:U/C:N/I:N/A:N
    cwe-id: CWE-200
  metadata:
    verified: true
    max-request: 1
  tags: panel,wmw,detect,discovery

http:
  - method: GET
    path:
      - "{{BaseURL}}/en/login"

    matchers-condition: and
    matchers:
      - type: word
        words:
          - "WMW Enterprise login"
          - "Welcome to the WMW dashboard"
        condition: or

      - type: status
        status:
          - 200
