id: dotnet-fanruanoa-detect

info:
  name: fanruanoa 指纹识别（指纹识别）
  author: YanYun
  severity: info
  description: fanruanoa 是泛微/帆软相关 OA 系统入口，用于企业办公、流程和报表业务访问。该模板请求 `/WebReport/ReportServer`、`/ReportServer`，并依据 HTTP 200 状态码、页面标题、正文关键字或品牌资源特征识别目标是否使用或暴露了 fanruanoa 相关组件，适用于资产盘点、技术栈识别和后续安全评估；命中结果仅表示指纹特征匹配，不代表已确认存在可利用漏洞。
  metadata:
    max-request: 2
  tags: oa,tech,dotnet,fanruan,discovery

http:
  - method: GET
    path:
      - "{{BaseURL}}/WebReport/ReportServer"
      - "{{BaseURL}}/ReportServer"

    stop-at-first-match: true

    matchers-condition: and
    matchers:
      - type: status
        status:
          - 200

      - type: word
        words:
          - 'DeploySuccess._init'
