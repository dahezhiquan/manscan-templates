id: upnp-device-detect

info:
  name: 基础 UPnP 设备识别（IOT）
  author: geeknik
  severity: low
  description: |
    检测到基础 UPnP 设备。该模板根据 UPnP 设备描述信息识别可发现的物联网或网络设备，暴露后可能泄露设备能力、服务和网络信息。
  impact: |
    - 暴露的设备面板会泄露资产类型、产品型号、部署位置或管理入口，为后续弱口令和漏洞利用提供线索。
    - 若设备本身存在默认凭据或旧固件问题，攻击者可能进一步访问或控制设备。
  remediation: |
    - 确认该面板是否需要对当前网络开放；如无必要，应限制到内网、管理 VLAN 或 VPN。
    - 启用强认证，修改默认口令，并保持设备固件为受支持版本。
    - 对管理入口访问、登录失败和配置变更启用审计。
  reference:
    - https://www.upnp.org/specs/basic/UPnP-basic-Basic-v1-Device.pdf
  metadata:
    max-request: 1
  tags: upnp,iot,discovery

http:
  - method: GET
    path:
      - "{{BaseURL}}"

    matchers-condition: and
    matchers:
      - type: status
        status:
          - 200

      - type: word
        words:
          - "urn:schemas-upnp-org:device-1-0"
          - "<deviceType>"
          - "<modelName>"
        part: body
        condition: and

    extractors:
      - type: regex
        name: model
        regex:
          - <modelName>.*</modelName>
          - <modelNumber>.*</modelNumber>
