id: k8s-privileged-containers

info:
  name: Privileged Containers Found 中的Deployments（云安全）
  author: princechaddha
  severity: critical
  description: Deployment 中运行 privileged 容器会授予容器接近宿主机 root 的能力，显著削弱容器隔离边界。本模板枚举 Deployment 的容器安全上下文，发现 securityContext.privileged 为 true 时报告。
  impact: |
    - 容器逃逸、访问宿主机设备或修改内核相关配置的风险显著上升。
    - 一旦应用被攻陷，攻击者可能进一步控制节点并影响同节点其他工作负载。
  remediation: |
    - 移除 privileged 配置，按最小权限拆分所需能力、设备和挂载。
    - 使用 Pod Security Admission、OPA/Gatekeeper 或 Kyverno 阻止非例外工作负载使用 privileged。
  reference:
    - https://kubernetes.io/docs/concepts/policy/pod-security-policy/#privileged
  metadata:
    vendor: kubernetes
    product: kubernetes
  tags: cloud,devops,kubernetes,devsecops,deployments,k8s-cluster-security
flow: |
  code(1);
  for (let deployment of template.items) {
    set("deployment", deployment)
    javascript(1);
  }

self-contained: true
code:
  - engine:
      - sh
      - bash
    source: kubectl get deployments --all-namespaces --output=json
    extractors:
      - type: json
        name: items
        internal: true
        json:
          - '.items[]'

javascript:
  - code: |
        deployment = JSON.parse(template.deployment);
        for (let container of deployment.spec.template.spec.containers) {
          let sc = container.securityContext || {};
          if (sc.privileged || sc.runAsUser < 1000 || sc.allowPrivilegeEscalation) {
            let result = (`Deployment '${deployment.metadata.name}' in namespace '${deployment.metadata.namespace}' is running container '${container.name}' with insecure settings: Privileged=${sc.privileged}, runAsUser=${sc.runAsUser}, allowPrivilegeEscalation=${sc.allowPrivilegeEscalation}.`);
            Export(result);
            break;
          }
        }

    extractors:
      - type: dsl
        dsl:
          - response
