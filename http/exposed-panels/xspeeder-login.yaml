id: xspeeder-login

info:
  name: XSpeeder 登录识别（暴露面识别）
  author: rxerium
  severity: info
  description: |
    该模板通过识别 XSpeeder 登录入口的页面标题、特征文本或重定向行为，判断目标是否暴露了对应的认证界面。若命中，说明该登录面板对外可访问，可用于暴露面梳理与后续安全评估。
  reference:
    - https://www.xspeeder.com/
  metadata:
    verified: true
    max-request: 1
    vendor: Changsha Tongxun Computer Technology Co., Ltd
    product: xspeeder_router
    shodan-query: http.title:"神行者路由"
    fofa-query: title="神行者路由"
  tags: panel,xspeeder,router,login,detect

http:
  - method: GET
    path:
      - "{{BaseURL}}/login/?nLang=1"

    matchers-condition: and
    matchers:
      - type: word
        part: body
        words:
          - "<title>神行者路由"

      - type: status
        status:
          - 200
