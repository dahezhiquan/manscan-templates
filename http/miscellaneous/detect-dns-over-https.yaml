id: detect-dns-over-https

info:
  name: DNS over HTTPS 服务检测
  author: geeknik
  severity: info
  description: |
    检测目标是否支持 DNS over HTTPS (DoH)。DoH 会通过 HTTP 或 HTTP/2 加密传输 DNS 查询与响应，通常使用 HTTPS 443 端口，从而将 DNS 流量隐藏在普通 HTTPS 流量中。
  reference:
    - https://developers.google.com/speed/public-dns/docs/doh/
    - https://developers.cloudflare.com/1.1.1.1/dns-over-https/wireformat
  metadata:
    max-request: 1
  tags: miscellaneous,dns,doh,misc,vuln

http:
  - method: GET
    path:
      - "{{BaseURL}}/dns-query?dns=q80BAAABAAAAAAAAA3d3dwdleGFtcGxlA2NvbQAAAQAB"

    headers:
      Accept: application/dns-message

    matchers-condition: and
    matchers:
      - type: status
        status:
          - 200

      - type: word
        part: header
        words:
          - "application/dns-message"

      - type: regex
        part: header
        regex:
          - "(C|c)ontent-(L|l)ength: 49"
