id: kanboard-default-login

info:
  name: Kanboard 默认口令登录（弱口令）
  author: shelled
  severity: high
  description: |
    该模板用于检测 Kanboard 是否仍可使用默认凭据或弱口令登录。模板主要向 `/?controller=AuthController&action=login`、`/?controller=AuthController&action=check` 等认证入口发送请求，使用内置默认凭据组合进行认证尝试，并根据状态码、认证 Cookie、跳转位置或登录后的页面关键字判断登录是否成功；命中说明目标未及时修改出厂、示例或初始化账号口令。
  impact: |
    - 攻击者可登录 Kanboard 后台，管理内容、用户、插件、主题、文件、表单或业务流程配置。
    - 后台权限被滥用后，可能导致页面篡改、恶意文件上传、敏感资料泄露，或进一步取得服务器执行能力。
  remediation: |
    - 立即修改默认管理员凭据，删除安装向导、演示账号和不必要的后台用户。
    - 限制后台登录入口访问来源，启用多因素认证、登录失败锁定和验证码等防护。
    - 检查近期内容、插件、主题、文件上传和管理员操作记录，确认没有持久化后门。
  reference:
    - https://twitter.com/0x_rood/status/1607068644634157059
    - https://github.com/kanboard/kanboard
    - https://docs.kanboard.org/v1/admin/installation/
  classification:
    cvss-metrics: CVSS:3.0/AV:N/AC:L/PR:N/UI:N/S:C/C:L/I:L/A:L
    cvss-score: 8.3
    cwe-id: CWE-522
    cpe: cpe:2.3:a:kanboard:kanboard:*:*:*:*:*:*:*:*
  metadata:
    verified: true
    max-request: 2
    fofa-query: app="Kanboard"
    product: kanboard
    vendor: kanboard
  tags: default-login,kanboard,vuln

http:
  - raw:
      - |
        GET /?controller=AuthController&action=login HTTP/1.1
        Host: {{Hostname}}
      - |
        POST /?controller=AuthController&action=check HTTP/1.1
        Host: {{Hostname}}
        Content-Type: application/x-www-form-urlencoded

        username={{user}}&password={{pass}}&csrf_token={{csrf_token}}

    attack: pitchfork
    payloads:
      user:
        - admin
      pass:
        - admin

    extractors:
      - type: regex
        name: csrf_token
        part: body
        group: 1
        regex:
          - "hidden\" name=\"csrf_token\" value=\"([0-9a-z]+)\""
        internal: true
    matchers:
      - type: dsl
        dsl:
          - contains(location, 'controller=DashboardController&action=show')
          - status_code == 302
        condition: and
