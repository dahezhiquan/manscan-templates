id: mitric-checker-panel

info:
  name: Mitric Checker 登录面板识别（指纹识别）
  author: righettod
  severity: info
  description: |
    该模板通过识别 Mitric Checker 登录入口的页面标题、特征文本或重定向行为，判断目标是否暴露了对应的认证界面。若命中，说明该登录面板对外可访问，可用于暴露面梳理与后续安全评估。
  reference:
    - https://www.mitric.com/en/audit-with-checker/
  metadata:
    verified: true
    max-request: 2
  tags: panel,mitric,login,detect,discovery

http:
  - method: GET
    path:
      - "{{BaseURL}}/QSA/Login.aspx"
      - "{{BaseURL}}/API/External/GetPrivacy"

    stop-at-first-match: true

    matchers:
      - type: dsl
        dsl:
          - 'status_code == 200'
          - 'contains_any(to_lower(body), "/checker/", "bg-blue-checker", "checker platform")'
        condition: and
