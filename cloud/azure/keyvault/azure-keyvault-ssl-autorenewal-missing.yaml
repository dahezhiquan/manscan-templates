id: azure-keyvault-ssl-autorenewal-missing
info:
  name: Azure Key Vault 证书未配置自动续期（云安全）
  author: princechaddha
  severity: high
  description: Azure Key Vault 证书生命周期动作支持在到期前自动续期，也可仅发送 EmailContacts 通知。本模板读取 policy.lifetimeActions[*].action.actionType，在匹配到 EmailContacts 时按当前检测逻辑报告未配置自动续期，表示证书至少存在邮件通知动作，但未按该规则确认 AutoRenew 动作。
  impact: |
    - 证书到期前若没有可靠的自动续期和部署流程，可能造成 TLS 服务、双向认证或下游 API 调用中断。
    - 仅依赖邮件通知还要求人工及时处理，容易因告警遗漏、权限问题或发布延迟导致证书过期。
  remediation: |
    - 在证书 lifetimeActions 中配置 actionType 为 AutoRenew 的动作，并设置足够的 daysBeforeExpiry 提前期。
    - 保留 EmailContacts 作为辅助告警，定期验证签发机构、Key Vault 权限、部署流水线和续期结果。
  reference:
    - https://docs.microsoft.com/en-us/azure/key-vault/certificates/how-to-renew-certificate
  metadata:
    vendor: microsoft
    product: azure-key-vault
  tags: cloud,devops,azure,microsoft,keyvault,azure-cloud-config

flow: |
  code(1);
  for (let KeyVaultName of iterate(template.keyVaultNames)) {
    set("vaultName", KeyVaultName)
    code(2);
    for (let CertificateId of iterate(template.certificateIds)) {
      set("certificateId", CertificateId)
      code(3)
    }
  }

self-contained: true
code:
  - engine:
      - sh
      - bash
    source: |
      az keyvault list --query '[*].name' --output json

    extractors:
      - type: json
        name: keyVaultNames
        internal: true
        json:
          - '.[]'

  - engine:
      - sh
      - bash
    source: |
      az keyvault certificate list --vault-name $vaultName --query '[?(attributes.enabled==`true`)].id' --output json

    extractors:
      - type: json
        name: certificateIds
        internal: true
        json:
          - '.[]'

  - engine:
      - sh
      - bash
    source: |
      az keyvault certificate show --id $certificateId --query 'policy.lifetimeActions[*].action.actionType' --output json

    matchers:
      - type: word
        words:
          - '"EmailContacts"'

    extractors:
      - type: dsl
        dsl:
          - 'vaultName + " SSL certificate " + certificateId + " does not have auto-renewal enabled"'
