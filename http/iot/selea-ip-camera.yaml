id: selea-ip-camera

info:
  name: Selea Targa IP OCR-ANPR 摄像机流泄露（IOT）
  author: geeknik
  severity: info
  description: |
    检测到 Selea Targa IP OCR-ANPR 摄像机相关页面。多个版本存在未授权 RTP、RTSP 或 M-JPEG 视频流泄露风险，可能导致车牌识别摄像画面被外部访问。
  reference:
    - https://www.zeroscience.mk/en/vulnerabilities/ZSL-2021-5619.php
  metadata:
    max-request: 1
  tags: iot,selea,targa,discovery

http:
  - method: GET
    path:
      - "{{BaseURL}}"

    matchers-condition: and
    matchers:
      - type: word
        part: header
        words:
          - "SeleaCPSHttpServer"
          - "selea_httpd"
          - "HttpServer/0.1"
        condition: or

      - type: word
        part: body
        words:
          - "Selea CarPlateServer"

      - type: status
        status:
          - 200
