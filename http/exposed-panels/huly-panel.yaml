id: huly-panel

info:
  name: Huly 登录面板识别（暴露面识别）
  author: righettod
  severity: info
  description: |
    该模板通过识别 Huly 登录入口的页面标题、特征文本或重定向行为，判断目标是否暴露了对应的认证界面。若命中，说明该登录面板对外可访问，可用于暴露面梳理与后续安全评估。
  reference:
    - https://huly.io/
  metadata:
    max-request: 1
    verified: true
    shodan-query: http.html:"Huly"
  tags: panel,huly,login,discovery

http:
  - method: GET
    path:
      - "{{BaseURL}}/login%3Acomponent%3ALoginApp"

    matchers:
      - type: dsl
        dsl:
          - 'status_code == 200'
          - 'contains(to_lower(body), "<title>huly</title>")'
        condition: and
