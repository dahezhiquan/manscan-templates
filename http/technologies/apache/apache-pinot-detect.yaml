id: apache-pinot-detect

info:
  name: Apache Pinot 指纹识别（指纹识别）
  author: icarot
  severity: info
  description: |-
    Apache Pinot 是实时分布式 OLAP 数据库，用于低延迟分析查询和指标报表。该模板请求首页，并依据 HTTP 200 状态码、页面标题、正文关键字或品牌资源特征识别目标是否使用或暴露了 Apache Pinot 相关组件，适用于资产盘点、技术栈识别和后续安全评估；命中结果仅表示指纹特征匹配，不代表已确认存在可利用漏洞。
  classification:
    cpe: cpe:2.3:a:apache:pinot:*:*:*:*:*:*:*:*
  metadata:
    max-request: 1
    verified: true
    vendor: apache
    product: pinot
    shodan-query: title:"Apache Pinot"
  tags: tech,pinot,apache,detect,discovery

http:
  - method: GET
    path:
      - "{{BaseURL}}/"

    matchers-condition: and
    matchers:
      - type: word
        words:
          - '<title>Apache Pinot</title>'

      - type: status
        status:
          - 200
