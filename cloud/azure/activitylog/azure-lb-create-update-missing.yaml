id: azure-lb-create-update-missing
info:
  name: Azure Load Balancer Create or Update Alert 未Configured（云安全）
  author: princechaddha
  severity: high
  description: 该规则用于检查 Azure 活动日志 相关安全控制、保护能力或合规配置是否处于未启用、缺失或未正确配置状态，以降低持续暴露风险并提升整体云安全基线。
  impact: |
    - 关键安全控制缺失会降低防护深度，使风险长期处于不可见或不可控状态。
    - 这类配置问题通常不会立即触发故障，但会显著增加后续入侵、横向移动或合规违规的概率。
  remediation: |
    - 按厂商最佳实践启用缺失的安全控制、保护功能或基线配置。
    - 将该类配置纳入持续巡检与自动化合规检查，避免后续资源再次以不安全默认值部署。
  reference:
    - https://docs.microsoft.com/en-us/azure/azure-monitor/platform/alerts-activity-log
  tags: cloud,devops,azure,microsoft,loadbalancer,azure-cloud-config

flow: |
  code(1);
  for (let AlertData of iterate(template.alertIds)) {
    set("ids", AlertData);
    code(2);
  }

self-contained: true
code:
  - engine:
      - sh
      - bash
    source: |
      az monitor activity-log alert list --output json --query '[?(enabled==`true`)].id'

    extractors:
      - type: json
        name: alertIds
        internal: true
        json:
          - '.[]'

  - engine:
      - sh
      - bash
    source: |
      az monitor activity-log alert show --ids $ids --query 'condition'

    matchers-condition: and
    matchers:
      - type: word
        words:
          - "allOf"

      - type: word
        words:
          - "Microsoft.Network/loadBalancers/write"
        negative: true

    extractors:
      - type: dsl
        dsl:
          - 'ids + " does not have correct Create or Update Load Balancer alert configured"'
