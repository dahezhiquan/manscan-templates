id: 9router-default-login

info:
  name: 9Router 默认登录（弱口令）
  author: 0x_Akoko
  severity: high
  description: |
    该模板用于检测 9Router 是否仍可使用默认凭据或弱口令登录。模板主要向 `/login`、`/api/auth/login` 等认证入口发送请求，使用内置默认凭据组合进行认证尝试，并根据响应中的 `9Router`、`status_code == 200` 等登录成功特征判断登录是否成功；命中说明目标未及时修改出厂、示例或初始化账号口令。
  impact: |
    - 攻击者可使用默认凭据登录 9Router，获得与该账号对应的管理或业务权限。
    - 成功登录后可能进一步查看敏感信息、修改配置、创建账号、调用管理接口，或以该系统为入口访问内网其他资源。
  remediation: |
    - 立即修改或禁用默认账号，要求所有账户使用高强度唯一密码。
    - 将登录入口限制在可信网络范围内，并启用多因素认证、登录失败限制和异常登录告警。
    - 审计近期登录、配置变更和账号新增记录，必要时轮换相关密钥、令牌和业务凭据。
  reference:
    - https://github.com/decolua/9router
    - https://deepwiki.com/decolua/9router/13.1-authentication-and-token-issues
  metadata:
    verified: true
    max-request: 2
    vendor: decolua
    product: 9router
    shodan-query: http.html:"9Router"
    fofa-query: body="9Router"
  tags: default-login,9router,ai

variables:
  password: "123456"

flow: http(1) && http(2)

http:
  - raw:
      - |
        GET /login HTTP/1.1
        Host: {{Hostname}}

    matchers:
      - type: word
        words:
          - '9Router'
        internal: true

  - raw:
      - |
        POST /api/auth/login HTTP/1.1
        Host: {{Hostname}}
        Content-Type: application/json

        {"password":"{{password}}"}

    matchers:
      - type: dsl
        dsl:
          - 'status_code == 200'
          - 'contains(body, "\"success\":true")'
          - 'contains(header, "auth_token=eyJ")'
        condition: and
