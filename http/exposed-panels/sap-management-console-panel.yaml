id: sap-management-console-panel

info:
  name: SAP Management Console 面板（暴露面识别）
  author: LRVT,l4rm4nd
  severity: info
  description: |
    该模板通过识别 SAP Management Console 面板、控制台或管理界面的页面特征，判断目标是否暴露了对应服务入口。若命中，说明该后台或运维界面对外可访问，可用于资产识别与暴露面排查。
  metadata:
    verified: true
    max-request: 1
    shodan-query: title:"SAP Management Console"
  tags: panel,sap,sapmc,ui,discovery,login

http:
  - method: GET
    path:
      - "{{BaseURL}}/sapmc/sapmc.html"

    matchers-condition: and
    matchers:
      - type: word
        part: body
        words:
          - "<title>SAP Management Console</title>"

      - type: status
        status:
          - 200
