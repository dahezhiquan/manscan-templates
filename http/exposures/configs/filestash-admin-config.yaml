id: filestash-admin-config

info:
  name: Filestash Admin 密码 配置 泄露（暴露面识别）
  author: DhiyaneshDK
  severity: high
  description: |
    检测到对外可访问的 Filestash Admin 密码 配置。这类配置资源可能包含部署细节、访问凭据、内部地址、组件版本或调试开关，公开暴露后会显著增加被侦察和后续利用的风险。
  classification:
    cpe: cpe:2.3:a:filestash:filestash:*:*:*:*:*:*:*:*
  metadata:
    verified: true
    max-request: 1
    vendor: filestash
    product: filestash
    shodan-query: html:"<title>Admin Console</title>"
  tags: exposure,filestash,config,vuln

http:
  - method: GET
    path:
      - "{{BaseURL}}/admin/setup"

    matchers-condition: and
    matchers:
      - type: word
        part: body
        words:
          - '<title>Admin Console</title>'
          - 'component-loader'
        condition: and

      - type: status
        status:
          - 200
