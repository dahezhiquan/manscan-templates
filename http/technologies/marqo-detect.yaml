id: marqo-detect

info:
  name: Marqo Vector Search Engine 指纹识别（指纹识别）
  author: rxerium
  severity: info
  description: >-
    Marqo 是向量搜索引擎，用于构建语义搜索、推荐和 AI 检索应用。该模板通过请求目标服务并检查预设路径或首页响应、页面正文关键字、正则特征、状态码等指纹特征，判断目标是否使用或暴露了
    Marqo Vector Search Engine 相关组件；命中结果仅表示指纹特征匹配，可用于资产盘点、技术栈识别和后续安全评估，不代表已确认存在可利用漏洞。
  reference:
  - https://github.com/marqo-ai/marqo
  - https://www.marqo.ai/
  metadata:
    verified: true
    max-request: 1
    vendor: marqo-ai
    product: marqo
    shodan-query: 'http.html:"Welcome to Marqo"'
  tags: tech,marqo,vector-db,search,ai,detect,discovery
http:
  - method: GET
    path:
      - "{{BaseURL}}"

    matchers-condition: and
    matchers:
      - type: word
        part: body
        words:
          - "Welcome to Marqo"

      - type: status
        status:
          - 200

    extractors:
      - type: regex
        name: version
        part: body
        group: 1
        regex:
          - '"version":"([^"]+)"'
