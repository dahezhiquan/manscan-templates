id: materialize-css-detect

info:
  name: Materialize CSS 指纹识别（指纹识别）
  author: Shivam Kamboj
  severity: info
  description: |
    用于识别目标前端或应用中是否使用 Materialize CSS，模板会结合页面正文和特定路径或已知端点进行技术栈指纹匹配。
  reference:
    - https://materializecss.com/
  metadata:
    verified: true
    max-request: 1
    shodan-query: html:"materialize.min.css"
  tags: tech,materialize,discovery

http:
  - method: GET
    path:
      - "{{BaseURL}}"

    host-redirects: true
    max-redirects: 2

    matchers:
      - type: regex
        part: body
        regex:
          - '(?i)href=["''][^"'']*materialize(?:[\.-]min)?\.css'
          - '(?i)src=["''][^"'']*materialize(?:[\.-]min)?\.js'
          - '(?i)class=["''][^"'']*waves-effect'
          - '(?i)class=["''][^"'']*materialize-textarea'
        condition: or
