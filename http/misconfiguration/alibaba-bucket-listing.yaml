id: alibaba-bucket-listing

info:
  name: Alibaba Cloud OSS Bucket Public Listing 启用
  author: 0x_Akoko
  severity: high
  description: |
    该模板用于核查 Alibaba Cloud OSS Bucket Public Listing启用状态。该类问题通常源于云对象存储桶或兼容对象存储服务开启了公开读取、公开列表或错误的访问策略。模板会向目标发送探测请求，并依据响应状态、关键字、响应头或 DSL 条件等证据确认目标是否存在该配置问题。
  impact: |
    - 攻击者可枚举对象列表并下载公开文件，造成业务资料、备份、日志或静态资源泄露。
    - 若桶内资源被业务系统引用，攻击者还可能利用公开内容辅助供应链攻击或品牌仿冒。
  remediation: |
    - 关闭对象存储桶公共访问和列表权限，按业务需要配置最小化 Bucket Policy。
    - 启用云厂商的公共访问阻断、访问日志和异常访问告警。
    - 检查桶内历史文件，移除敏感对象并轮换已暴露的密钥、令牌或下载链接。
  reference:
    - https://www.alibabacloud.com/help/en/oss/user-guide/block-public-access
    - https://www.trendmicro.com/cloudoneconformity/knowledge-base/alibaba-cloud/AlibabaCloud-OSS/publicly-accessible-oss-bucket.html
  metadata:
    verified: true
    max-request: 1
    google-query: site:aliyuncs.com "ListBucketResult" "<Contents>"
  tags: alibaba,cloud,bucket,misconfig,exposure,devops,cicd

http:
  - method: GET
    path:
      - "{{BaseURL}}"

    matchers:
      - type: dsl
        dsl:
          - 'status_code == 200'
          - 'contains(content_type, "application/xml")'
          - 'contains(header, "AliyunOSS")'
          - 'contains_all(body, "<ListBucketResult", "<Name>", "<Contents>", "<Key>")'
        condition: and

    extractors:
      - type: regex
        part: body
        group: 1
        regex:
          - '<Name>([^<]+)</Name>'
