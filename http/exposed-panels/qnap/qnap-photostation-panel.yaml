id: qnap-photostation-panel

info:
  name: QNAP Photo Station 面板识别（暴露面识别）
  author: idealphase
  severity: info
  description: |
    该模板通过识别 QNAP Photo Station 面板、控制台或管理界面的页面特征，判断目标是否暴露了对应服务入口。若命中，说明该后台或运维界面对外可访问，可用于资产识别与暴露面排查。
  reference:
    - https://www.qnap.com/th-th/software/photo-station
  classification:
    cvss-metrics: CVSS:3.0/AV:N/AC:L/PR:N/UI:N/S:U/C:N/I:N/A:N
    cwe-id: CWE-200
    cpe: cpe:2.3:a:qnap:photo_station:*:*:*:*:*:*:*:*
  metadata:
    verified: true
    max-request: 1
    vendor: qnap
    product: photo_station
    shodan-query:
      - http.title:"Photo Station"
      - http.title:"photo station"
      - http.title:"qnap"
      - 'content-length: 580 "http server 1.0"'
    fofa-query:
      - title="photo station"
      - title="qnap"
    google-query:
      - intitle:"qnap"
      - intitle:"photo station"
  tags: panel,photostation,qnap,discovery

http:
  - method: GET
    path:
      - "{{BaseURL}}/photo/"

    matchers-condition: and
    matchers:
      - type: regex
        part: body
        regex:
          - '(?m)<title>(.*)Photo Station(.*)<\/title>'

      - type: status
        status:
          - 200
