id: apple-cups-exposure

info:
  name: Apple CUPS Sources 暴露
  author: DhiyaneshDK
  severity: low
  description: |
    检测到 Apple CUPS Sources 暴露。目标响应或文件中可能暴露配置、凭据、密钥、令牌、环境变量或历史记录等敏感信息，可能被用于进一步入侵。
  reference:
    - https://github.com/apple/cups
  classification:
    cpe: cpe:2.3:a:apple:cups:*:*:*:*:*:*:*:*
  metadata:
    verified: true
    max-request: 1
    vendor: apple
    product: cups
    shodan-query: html:"Home - CUPS"
  tags: apple,cups,exposure,misconfig,vuln

http:
  - method: GET
    path:
      - "{{BaseURL}}"

    matchers-condition: and
    matchers:
      - type: regex
        part: body
        regex:
          - "<title>Home \\- CUPS ([0-9.]+)<\\/title>"

      - type: status
        status:
          - 200
