id: meddream-dicom-viewer-panel

info:
  name: MedDream DICOM Viewer 面板（指纹识别）
  author: darses
  severity: info
  description: |-
    检测到目标站点存在 MedDream DICOM Viewer 相关响应特征。MedDream DICOM Viewer 是医学影像 Web 查看器，用于查看 DICOM 影像、检查记录和诊断相关图像数据。模板请求 `/`，并通过页面标题或正文关键字、响应头关键字、状态码确认该系统指纹，用于资产识别、系统盘点和暴露面梳理。
  reference:
    - https://meddream.com/products/meddream-dicom-viewer/
  classification:
    cvss-metrics: CVSS:3.0/AV:N/AC:L/PR:N/UI:N/S:U/C:N/I:N/A:N
    cwe-id: CWE-200
  metadata:
    verified: true
    max-request: 1
    vendor: meddream
    product: dicom-viewer
    shodan-query: "Set-Cookie: MEDDREAMSESSID"
    fofa-query: "Set-Cookie: MEDDREAMSESSID"
    zoomeye-query: app:"MedDream"
  tags: panel,meddream,detect,discovery
http:
  - method: GET
    path:
      - "{{BaseURL}}"

    matchers-condition: and
    matchers:
      - type: word
        words:
          - 'src="js/md.main.min.'
          - "unsupported-browser-msg"
        condition: and

      - type: word
        part: header
        words:
          - "MEDDREAMSESSID"

      - type: status
        status:
          - 200
