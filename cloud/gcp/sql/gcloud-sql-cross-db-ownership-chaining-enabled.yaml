id: gcloud-sql-cross-db-ownership-chaining-enabled

info:
  name: SQL Server 数据库实例启用了跨数据库所有权链接（云安全）
  author: princechaddha
  severity: medium
  description: SQL Server cross db ownership chaining 会允许跨数据库对象所有权链影响权限检查，启用后可能扩大数据库间权限边界。本模板检查 Cloud SQL SQL Server 实例 databaseFlags 中 cross db ownership chaining 的值，匹配 on 时报告该功能已启用。
  impact: |
    - 一个数据库中的高权限对象或被攻破账号可能借所有权链影响其他数据库资源。
    - 数据库间权限边界变得不清晰，增加越权访问和审计误判风险。
  remediation: |
    - 关闭 cross db ownership chaining，并按最小权限显式授予跨数据库访问所需权限。
    - 对依赖跨库访问的应用进行权限梳理，使用受控账号和审计规则替代隐式所有权链。
  reference:
    - https://cloud.google.com/sql/docs/sqlserver/flags
  metadata:
    vendor: google
    product: cloud-sql
  tags: cloud,devops,gcp,gcloud,google-cloud-sql,mssql,gcp-cloud-config

flow: |
  code(1)
  for(let projectId of iterate(template.projectIds)){
    set("projectId", projectId)
    code(2)
    for(let sqlInstance of iterate(template.sqlInstances)){
      set("sqlInstance", sqlInstance)
      code(3)
    }
  }

self-contained: true

code:
  - engine:
      - sh
      - bash
    source: |
      gcloud projects list --format="json(projectId)"

    extractors:
      - type: json
        name: projectIds
        internal: true
        json:
          - '.[].projectId'

  - engine:
      - sh
      - bash
    source: |
      gcloud sql instances list --project $projectId --filter=DATABASE_VERSION:SQLSERVER* --format="json(name)"

    extractors:
      - type: json
        name: sqlInstances
        internal: true
        json:
          - '.[].name'

  - engine:
      - sh
      - bash
    source: |
      gcloud sql instances describe $sqlInstance --project $projectId --format=json | jq -r '.settings.databaseFlags[]? | select(.name=="cross db ownership chaining") | .value // "null"'

    matchers:
      - type: word
        words:
          - 'on'

    extractors:
      - type: dsl
        dsl:
          - '"The cross db ownership chaining flag is enabled for SQL Server instance " + sqlInstance + " in project " + projectId'
