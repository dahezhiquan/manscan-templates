id: api-mac-address-lookup

info:
  name: MAC Address Lookup API Token 可用性校验（token喷洒）
  author: daffainfo
  severity: info
  description: 该模板通过调用 MAC Address Lookup API 的已知接口验证提供的 token 是否有效，命中后通常表示可访问IP、网络或归属信息查询能力。
  reference:
    - https://macaddress.io/api
    - https://github.com/daffainfo/all-about-apikey/tree/main/mac-address-lookup
  metadata:
    max-request: 1
  tags: token-spray,macaddresslookup

self-contained: true

http:
  - method: GET
    path:
      - "https://api.macaddress.io/v1?apiKey={{token}}&output=json&search=44:38:39:ff:ef:57"

    matchers:
      - type: word
        part: body
        words:
          - '"vendorDetails"'
          - '"companyName"'
          - '"companyAddress"'
        condition: and
