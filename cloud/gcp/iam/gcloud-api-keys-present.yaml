id: gcloud-api-keys-present

info:
  name: Delete Google Cloud API Keys（云安全）
  author: princechaddha
  severity: low
  description: Google Cloud API Key 是长期凭据，适合有限的公开客户端场景；项目中残留不必要的 API Key 会增加泄露和滥用面。本模板枚举项目 API Key，只要存在 keyId 就报告需要复核或删除。
  impact: |
    - 泄露的 API Key 可被用于调用允许的 Google Cloud API，造成配额消耗、费用增加或数据访问风险。
    - 未盘点的长期密钥难以及时轮换和限制，容易在代码仓库、客户端包或日志中长期暴露。
  remediation: |
    - 删除不再需要的 API Key；确需保留时配置应用限制和 API restrictions。
    - 为不同应用和环境拆分密钥，轮换已暴露或用途不明的密钥，并持续审计项目中的 API Key 清单。
  reference:
    - https://cloud.google.com/docs/authentication/api-keys
  metadata:
    vendor: google
    product: api-keys
  tags: cloud,devops,gcp,gcloud,google-cloud-api,gcp-cloud-config

flow: |
  code(1)
  for(let projectId of iterate(template.projectIds)){
    set("projectId", projectId)
    code(2)
    for(let apiKey of iterate(template.apiKeys)){
      javascript(1)
    }
  }

self-contained: true

code:
  - engine:
      - sh
      - bash
    source: |
      gcloud projects list --format="json(projectId)"
    extractors:
      - type: json
        name: projectIds
        internal: true
        json:
          - '.[].projectId'

  - engine:
      - sh
      - bash
    source: |
      gcloud alpha services api-keys list --project=$projectId --format="json(keyId)"
    extractors:
      - type: json
        name: apiKeys
        internal: true
        json:
          - '.[].keyId'

javascript:
  - code: |
      let apiKey = template.apiKey;
      let projectId = template.projectId;
      if (apiKey) {
        Export("API key " + apiKey + " found in Project " + projectId);
      }

    extractors:
      - type: dsl
        dsl:
          - response
