id: gcloud-func-missing-labels

info:
  name: 缺失 User-Defined Labels 中的Google Cloud Functions（云安全）
  author: princechaddha
  severity: low
  description: 该规则用于检查 GCP function 相关安全控制、保护能力或合规配置是否处于未启用、缺失或未正确配置状态，以降低持续暴露风险并提升整体云安全基线。
  impact: |
    - 关键安全控制缺失会降低防护深度，使风险长期处于不可见或不可控状态。
    - 这类配置问题通常不会立即触发故障，但会显著增加后续入侵、横向移动或合规违规的概率。
  remediation: |
    - 按厂商最佳实践启用缺失的安全控制、保护功能或基线配置。
    - 将该类配置纳入持续巡检与自动化合规检查，避免后续资源再次以不安全默认值部署。
  reference:
    - https://cloud.google.com/resource-manager/docs/creating-managing-labels
  tags: cloud,devops,gcp,gcloud,google-cloud-functions,gcp-cloud-config

flow: |
  code(1)
  for(let projectId of iterate(template.projectIds)){
    set("projectId", projectId)
    code(2)
    for(let functionDetail of iterate(template.functions)){
      set("functionName", functionDetail)
      code(3)
    }
  }

self-contained: true

code:
  - engine:
      - sh
      - bash
    source: |
      gcloud projects list --format="json(projectId)"

    extractors:
      - type: json
        name: projectIds
        internal: true
        json:
          - '.[].projectId'

  - engine:
      - sh
      - bash
    source: |
      gcloud functions list --project $projectId --format="json(name)"

    extractors:
      - type: json
        name: functions
        internal: true
        json:
          - '.[].name'

  - engine:
      - sh
      - bash
    source: |
      gcloud functions describe $functionName --format="json(labels)"

    matchers:
      - type: word
        words:
          - 'null'

    extractors:
      - type: dsl
        dsl:
          - '"Missing labels for function: " + functionName + " in " + projectId + " project"'
