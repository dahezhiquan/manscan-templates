id: jeedom-default-login

info:
  name: Jeedom 默认口令登录（弱口令）
  author: ritikchaddha
  severity: high
  description: |
    该模板用于检测 Jeedom 是否仍可使用默认凭据或弱口令登录。模板主要向 `/core/ajax/user.ajax.php`、`/index.php?v=d&p=dashboard` 等认证入口发送请求，使用内置默认凭据组合进行认证尝试，并根据响应中的 `state":"ok`、`result":` 等登录成功特征判断登录是否成功；命中说明目标未及时修改出厂、示例或初始化账号口令。
  impact: |
    - 攻击者可登录 Jeedom 后台，管理内容、用户、插件、主题、文件、表单或业务流程配置。
    - 后台权限被滥用后，可能导致页面篡改、恶意文件上传、敏感资料泄露，或进一步取得服务器执行能力。
  remediation: |
    - 立即修改默认管理员凭据，删除安装向导、演示账号和不必要的后台用户。
    - 限制后台登录入口访问来源，启用多因素认证、登录失败锁定和验证码等防护。
    - 检查近期内容、插件、主题、文件上传和管理员操作记录，确认没有持久化后门。
  classification:
    cpe: cpe:2.3:a:jeedom:jeedom:*:*:*:*:*:*:*:*
  metadata:
    verified: true
    max-request: 2
    vendor: jeedom
    product: jeedom
    shodan-query: title:"Jeedom"
  tags: jeedom,default-login,misconfig,vuln
variables:
  username: admin
  password: admin

http:
  - raw:
      - |
        POST /core/ajax/user.ajax.php HTTP/1.1
        Host: {{Hostname}}
        Content-Type: application/x-www-form-urlencoded; charset=UTF-8

        action=login&username={{username}}&password={{password}}&twoFactorCode=&storeConnection=0
      - |
        GET /index.php?v=d&p=dashboard HTTP/1.1
        Host: {{Hostname}}

    matchers-condition: and
    matchers:
      - type: word
        part: body_1
        words:
          - 'state":"ok'
          - 'result":'
        condition: and

      - type: word
        part: body_2
        words:
          - "logout=1"
          - "Plugins</span>"
        condition: and
