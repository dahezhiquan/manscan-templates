id: mysql-empty-password

info:
  name: MySQL 空密码检测（服务漏洞）
  author: DhiyaneshDk
  severity: high
  description: |
    目标 MySQL 服务允许 root 或匿名用户使用空密码登录，攻击者可能无需有效凭据访问数据库。模板针对内置用户名发起空密码认证，并以 MySQL 连接成功作为命中依据。
  impact: |
    - 空密码 MySQL 账号可被远程攻击者直接使用，导致数据库未授权访问。
    - 若 root 或高权限账号允许空密码，攻击者可能读取、修改、删除数据或进一步影响数据库主机。
  remediation: |
    - 为 root 和匿名 MySQL 账号设置强口令，删除不必要的空密码账户。
    - 收紧 MySQL 远程访问来源，审计账号权限并启用登录失败监控。
  classification:
    cwe-id: CWE-521
  metadata:
    max-request: 3
    shodan-query: "port:3306"
    vendor: oracle
    product: mysql
  tags: js,mysql,network,vuln

javascript:
  - pre-condition: |
      isPortOpen(Host,Port);
    code: |
      var m = require("nuclei/mysql");
      var c = m.MySQLClient();
      c.Connect(Host,Port,User,Pass)

    args:
      Host: "{{Host}}"
      Port: "3306"
      User: "{{username}}"
      Pass: " "

    payloads:
      username:
        - root
        - anonymous

    stop-at-first-match: true
    matchers:
      - type: dsl
        dsl:
          - "response == true"
          - "success == true"
        condition: and
