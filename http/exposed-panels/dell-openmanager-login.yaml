id: dell-openmanager-login

info:
  name: Dell OpenManage Switch Administrator 登录面板识别（暴露面识别）
  author: dhiyaneshDK
  severity: medium
  description: |-
    检测到目标站点暴露 Dell OpenManage Switch Administrator 相关 Web 面板或登录入口。Dell OpenManage Switch Administrator 是与 C2、远控、窃密或钓鱼基础设施相关的 Web 管理入口，通常用于会话管理、任务下发、受害主机或钓鱼流程的集中控制。模板请求 `/`、`/config/authentication_page.htm` 路径，并通过页面标题或正文关键字确认入口可访问；该结果可作为威胁情报排查、攻击基础设施清理和暴露面收敛依据。
  impact: |-
    - 可帮助攻击者或防守方确认目标存在 Dell OpenManage Switch Administrator 相关 C2、远控、窃密或钓鱼基础设施，暴露组织资产、红队演练环境或恶意运营节点。
    - 若该面板未限制来源或存在弱口令、默认凭据、已知漏洞，攻击者可能接管控制端、获取会话数据、篡改任务配置或扩大攻击链影响。
    - 对外暴露的恶意基础设施面板还可能导致溯源线索、受害数据或行动配置被第三方发现和滥用。
  remediation: |-
    - 核实 Dell OpenManage Switch Administrator 面板是否属于授权资产、演练环境或应急分析环境；若为未知或恶意基础设施，应立即隔离主机并保全日志证据。
    - 对确需保留的控制台限制访问来源，仅允许 VPN、堡垒机或可信管理网段访问，并启用强认证、最小权限和完整审计。
    - 轮换相关凭据、令牌和证书，检查是否存在异常任务、回连会话或数据外传痕迹，并持续监控同类指纹再次暴露。
  classification:
    cvss-metrics: CVSS:3.0/AV:N/AC:L/PR:N/UI:N/S:U/C:N/I:N/A:N
    cwe-id: CWE-200
    cpe: cpe:2.3:a:dell:openmanage:*:*:*:*:*:*:*:*
  metadata:
    max-request: 2
    shodan-query: html:"Dell OpenManage Switch Administrator"
    product: openmanage
    vendor: dell
  tags: panel,dell,discovery
http:
  - method: GET
    path:
      - '{{BaseURL}}'
      - '{{BaseURL}}/config/authentication_page.htm'

    matchers-condition: or
    matchers:
      - type: word
        words:
          - '<title>Dell OpenManage Switch Administrator</title>'

      - type: word
        words:
          - '<TITLE>Log In</TITLE>'
          - 'device/logOff_up_menu1.htm'
        condition: and
