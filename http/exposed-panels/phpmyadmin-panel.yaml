id: phpmyadmin-panel

info:
  name: phpMyAdmin 面板识别（指纹识别）
  author: pdteam,righettod
  severity: info
  description: phpMyAdmin 是 MySQL/MariaDB 的 Web 管理工具，用于数据库、表、账号和 SQL 查询管理。该模板请求 `{{paths}}` 路径，并依据页面标题、正文关键字或品牌资源特征识别目标是否部署了该系统或暴露了对应入口，适用于资产指纹确认；命中结果仅表示系统特征匹配，不代表已确认存在未授权访问或可利用漏洞。
  classification:
    cvss-metrics: CVSS:3.0/AV:N/AC:L/PR:N/UI:N/S:U/C:N/I:N/A:N
    cwe-id: CWE-200
    cpe: cpe:2.3:a:phpmyadmin:phpmyadmin:*:*:*:*:*:*:*:*
  metadata:
    max-request: 14
    vendor: phpmyadmin
    product: phpmyadmin
    shodan-query:
    - "http.title:phpMyAdmin"
    - http.title:"phpmyadmin"
    - http.component:"phpmyadmin"
    - cpe:"cpe:2.3:a:phpmyadmin:phpmyadmin"
    fofa-query:
    - body="pma_servername" && body="4.8.4"
    - title="phpmyadmin"
    google-query: intitle:"phpmyadmin"
    hunter-query: app.name="phpmyadmin"&&web.body="pma_servername"&&web.body="4.8.4"
  tags: panel,phpmyadmin,detect,discovery

http:
  - method: GET
    path:
      - "{{BaseURL}}{{paths}}"
    payloads:
      paths:
        - ""
        - "/phpmyadmin/"
        - "/admin/phpmyadmin/"
        - "/_phpmyadmin/"
        - "/administrator/components/com_joommyadmin/phpmyadmin/"
        - "/apache-default/phpmyadmin/"
        - "/blog/phpmyadmin/"
        - "/forum/phpmyadmin/"
        - "/php/phpmyadmin/"
        - "/typo3/phpmyadmin/"
        - "/web/phpmyadmin/"
        - "/xampp/phpmyadmin/"
        - "/phpMyAdmin/"
        - "/phpma/"
        - "/phpMyAdmin/index.php"

    stop-at-first-match: true
    matchers:
      - type: word
        words:
          - 'alt="phpMyAdmin'
          - 'name="pma_username'
          - '/pmahomme/'
        condition: or

    extractors:
      - type: regex
        part: body
        group: 1
        regex:
          - 'v=([a-z0-9-._]+)'
