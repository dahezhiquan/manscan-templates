id: automation-activepieces-panel

info:
  name: Activepieces 面板识别（指纹识别）
  author: rxerium
  severity: info
  description: |-
    检测到目标站点存在 Activepieces 相关响应特征。Activepieces 是 AI、LLM 或机器学习相关平台，用于管理模型、数据集、工作区、代理任务或可观测性信息。模板请求 `/`，并通过页面标题或正文关键字、状态码确认该系统指纹，用于资产识别、系统盘点和暴露面梳理。
  reference:
    - https://github.com/activepieces/activepieces
    - https://www.activepieces.com/
  metadata:
    verified: true
    max-request: 1
    vendor: Activepieces
    product: activepieces
    shodan-query: 'http.title:"Activepieces"'
  tags: panel,activepieces,automation,ai,detect,discovery
http:
  - method: GET
    path:
      - "{{BaseURL}}"

    host-redirects: true
    max-redirects: 2

    matchers-condition: and
    matchers:
      - type: word
        part: body
        words:
          - "<title>Activepieces</title>"

      - type: status
        status:
          - 200
