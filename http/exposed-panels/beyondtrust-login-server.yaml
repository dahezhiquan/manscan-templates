id: beyondtrust-login-server

info:
  name: BeyondTrust Privileged Access Management 登录识别（暴露面识别）
  author: r3dg33k,nuk3s3c
  severity: info
  description: 该模板通过识别 BeyondTrust Privileged Access Management 登录入口的页面标题、特征文本或重定向行为，判断目标是否暴露了对应的认证界面。若命中，说明该登录面板对外可访问，可用于暴露面梳理与后续安全评估。
  reference:
    - https://www.beyondtrust.com/brand
  classification:
    cvss-metrics: CVSS:3.0/AV:N/AC:L/PR:N/UI:N/S:U/C:N/I:N/A:N
    cwe-id: CWE-200
  metadata:
    max-request: 1
  tags: beyondtrust,pam,panel,discovery

http:
  - method: GET
    path:
      - '{{BaseURL}}/WebConsole/api/security/auth/loginServers'

    matchers-condition: and
    matchers:
      - type: status
        status:
          - 200

      - type: regex
        regex:
          - '"DomainName":"(.*)"'
          - '"domains":'
        condition: and

    extractors:
      - type: json
        part: body
        json:
          - ".domains[] | .DomainName"
          - ".domains[] | .ldapservers"
