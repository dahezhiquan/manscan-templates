id: suspicious-sql-error-messages

info:
  name: 可疑 SQL 错误信息检测（本地文件安全扫描）
  author: geeknik
  severity: critical
  description: |
    数据库错误信息若包含引号未闭合、SQL 语法错误或 UNION 列数不一致等内容，通常说明应用把数据库解析错误暴露给了调用方或日志，常见于 SQL 注入探测和不安全的动态查询。该模板扫描任意扩展名文件，分别匹配 Oracle、MySQL、SQL Server 和 SQLite 的典型错误文本；命中应结合请求参数和响应链路确认是否存在可利用注入。
  impact: |
    - 错误信息可能泄露数据库类型、表结构、语句片段和查询上下文，帮助攻击者构造更精准的注入语句。
    - 若输入确实能够改变 SQL 语义，攻击者可能读取、修改或删除数据，进一步影响账户、业务和数据库可用性。
  remediation: |
    - 所有外部输入均使用参数化查询或安全 ORM 接口，禁止通过字符串拼接构造 SQL，并为数据库账号配置最小权限。
    - 生产环境统一返回通用错误，避免向客户端和不受控日志写入 SQL、堆栈及数据库细节。
    - 回溯命中日志对应的请求和数据库审计记录，修复注入点并轮换可能已暴露的数据库凭据。
  classification:
    cvss-metrics: CVSS:3.1/AV:N/AC:L/PR:N/UI:N/S:U/C:H/I:H/A:H
    cvss-score: 9.8
    cwe-id: CWE-89
  tags: file,logs,sql,error
file:
  - extensions:
      - all

    extractors:
      - type: regex
        name: oracle
        part: body
        regex:
          - 'quoted string not properly terminated'

      - type: regex
        name: mysql
        part: body
        regex:
          - 'You have an error in your SQL syntax'

      - type: regex
        name: sql_server
        part: body
        regex:
          - 'Unclosed quotation mark'

      - type: regex
        name: sqlite
        part: body
        regex:
          - 'near \"\*\"\: syntax error'
          - 'SELECTs to the left and right of UNION do not have the same number of result columns'
