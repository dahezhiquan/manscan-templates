id: storage-nextcloud-install

info:
  name: Nextcloud 安装向导暴露
  author: skeltavik
  severity: high
  description: |-
    该模板用于核查 Nextcloud 安装向导暴露。安装、初始化、注册或 Onboarding 流程对外暴露时，攻击者可能完成系统初始化、创建账户或修改关键配置。模板访问 目标入口，并根据向导页面、注册表单、接口返回或状态码确认入口是否可用。
  reference:
    - https://docs.nextcloud.com/server/latest/admin_manual/installation/installation_wizard.html
  metadata:
    max-request: 1
  tags: nextcloud,storage,misconfig,vuln
  impact: |-
    - 攻击者可能创建管理员账户、重置配置、接管尚未初始化的服务或绕过既有部署边界。
    - 初始化接口暴露还可能泄露系统状态、安装路径、数据库配置需求和版本信息。
  remediation: |-
    - 完成安装后删除或禁用初始化入口，禁止公网访问安装、注册和 Onboarding 接口。
    - 对首次部署流程增加一次性令牌、来源限制和强认证。
    - 排查是否已被异常初始化或创建未知账户，必要时重新部署并轮换凭据。
http:
  - method: GET
    path:
      - '{{BaseURL}}'

    host-redirects: true
    max-redirects: 2

    matchers-condition: and
    matchers:
      - type: word
        part: body
        words:
          - '<fieldset id="adminaccount"><legend>Create an <strong>admin account</strong></legend>'
          - '<legend><a id="showAdvanced" tabindex="0" href="#">Storage &amp; database'
        condition: and

      - type: status
        status:
          - 200
